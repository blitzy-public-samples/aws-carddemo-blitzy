# COACTUPC Open Date century edge: 1900, the first year of the lowest century
# EDIT-YEAR-CCYY accepts. Of the four year boundaries of the Open Date edit
# (1899, 1900, 2099, 2100), 1900 is accepted; 1899, whose century 18 is
# refused with 'Open Date : Century is not valid.', is the boundary on the
# other side. An accepted value shows as the next prompt, not as the field's
# message.
#
# Steps 1-3 fetch account 00000000001 and customer 000000001 as
# ACT-COACTUPC-alternate-04 does: sign-on through CC00, main-menu option 2,
# then the account id on the COACTUP search screen. 2000-DECIDE-ACTION reads
# CXACAIX, ACCTDAT and CUSTDAT, and 3202/3250 show the details with 'Update
# account details presented above.' and every editable field unprotected with
# MDT on, so all of them come back on the next AID
# [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,2955-3000,3500-3561,3608-3884].
# Step 4 types 1900 over the fetched open-date year 2014 and presses ENTER;
# OPNMON and OPNDAY come back as fetched, 11 and 20. 1100-RECEIVE-MAP moves
# OPNYEARI to ACUP-NEW-OPEN-YEAR [app/cbl/COACTUPC.cbl:1144-1149],
# 1205-COMPARE-OLD-NEW finds the open date changed, and 1200-EDIT-MAP-INPUTS
# moves 'Open Date' to WS-EDIT-VARIABLE-NAME and performs EDIT-DATE-CCYYMMDD
# through its exit [app/cbl/COACTUPC.cbl:1460-1482,1684-1704]:
# - EDIT-YEAR-CCYY: 1900 is supplied and numeric, and WS-EDIT-DATE-CC-N is 19,
#   LAST-CENTURY, so the century test continues and FLG-YEAR-ISVALID is set
#   [app/cpy/CSUTLDPY.cpy:25-87] [app/cpy/CSUTLDWY.cpy:5-10].
# - EDIT-MONTH: 11 is supplied, within 1-12 and TEST-NUMVAL 0
#   [app/cpy/CSUTLDPY.cpy:91-144].
# - EDIT-DAY: 20 is supplied, numeric and within 1-31
#   [app/cpy/CSUTLDPY.cpy:150-204].
# - EDIT-DAY-MONTH-YEAR: November is a 30-day month but the day is not 31,
#   and it is not February. The year, month and day flags are all LOW-VALUES,
#   so WS-EDIT-DATE-IS-VALID holds and control falls through to EDIT-DATE-LE
#   [app/cpy/CSUTLDPY.cpy:209-279].
# - EDIT-DATE-LE: CALL 'CSUTLDTC' with WS-EDIT-DATE-CCYYMMDD 19001120 and the
#   mask YYYYMMDD. 1900-11-20 lies inside the Lilian range CEEDAYS supports
#   (from 1582-10-15), so the expected severity is 0, the day flag is set valid
#   and WS-EDIT-DATE-IS-VALID is set [app/cpy/CSUTLDPY.cpy:284-328]
#   [app/cbl/CSUTLDTC.cbl:103-151]. That acceptance is known only through the
#   stub (GAP-INF-001), which is why the CSUTLDTC date-acceptance item is
#   listed.
# Every other field comes back with the fetched values, which pass every edit
# (ACT-COACTUPC-alternate-04), so INPUT-ERROR stays off and
# ACUP-CHANGES-OK-NOT-CONFIRMED is set [app/cbl/COACTUPC.cbl:1484-1675].
# Without PF5, 2000-DECIDE-ACTION does not run 9600-WRITE-PROCESSING, the sole
# READ UPDATE and REWRITE path [app/cbl/COACTUPC.cbl:2585-2621].
# 3203-SHOW-UPDATED-VALUES shows the received values with the year 1900,
# 3250-SETUP-INFOMSG moves PROMPT-FOR-CONFIRMATION to INFOMSG and the blank
# WS-RETURN-MSG to ERRMSG, 3300 leaves every field protected, and 3390 makes
# F5=Save and F12=Cancel visible [app/cbl/COACTUPC.cbl:472-473,2870-2951,
# 2955-2983,3001-3003,3566-3581].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   INFOMSG is the 34-character prompt in the 40-byte WS-INFO-MSG, moved to the
#   45-byte INFOMSGO. ERRMSG is the 75-byte WS-RETURN-MSG, blank, in the 78-byte
#   ERRMSGO, so it holds no Open Date message.
# - The tpe adapter enters a field with EraseEOF before typing, so OPNYEAR
#   holds exactly 1900.
# - FKEY05 and FKEY12 keep their INITIAL text. On screen 3 they are dark
#   (ASKIP,DRK), and the s3270 capture renders a zero-intensity field as blanks.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by the invented data of the other COACTUPC
# update scenarios, which passes every edit. The repository record has FICO
# 274 and zip 12546, and either would be refused first
# [app/cbl/COACTUPC.cbl:2514-2558]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-boundary-02
level: e2e
type: boundary
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update) and fetches
  account 00000000001 (opened 2014-11-20) with customer 000000001. The Open
  Date year is changed to 1900, the lowest year of century 19, and ENTER is
  pressed. The century is accepted and the date 1900-11-20 passes the CSUTLDTC
  (CEEDAYS) check with the mask YYYYMMDD, so no Open Date message appears:
  every edit passes, and COACTUPC shows the new open date, protected, with
  'Changes validated.Press F5 to save', a blank message line and the F5=Save
  and F12=Cancel keys. Nothing is saved before PF5.
# Primary item first, then the CSUTLDTC date acceptance the call reaches, the
# program, the maps asserted, the transaction of steps 3 and 4, the CSD files
# COACTUPC reads, and the online-only copybooks it copies. INV-ACT-031
# ('Changes validated.Press F5 to save') is verified by
# ACT-COACTUPC-alternate-04 and INV-ACT-082 (the CSUTLDTC severity predicate)
# by ACT-COACTUPC-negative-024. Sign-on (CC00, COSGN00, USRSEC) and the menu
# transaction are verified by the SEC and MNU scenarios, and the batch record
# copybooks and data files at the lowest level that executes them.
inventory_ids:
- INV-ACT-072  # COACTUPC Open Date: century 19 or 20 (EDIT-YEAR-CCYY, rule)
- INV-UTL-003  # CSUTLDTC date acceptance for masks YYYY-MM-DD and YYYYMMDD, reached through EDIT-DATE-LE
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and confirmation screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the validation
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read, never rewritten here
- INV-CFG-005  # CUSTDAT CSD file: customer master read, never rewritten here
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the per-field error attributes, none set here
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-YEAR-CCYY and EDIT-DATE-LE
- INV-LAY-014  # CSUTLDWY: WS-EDIT-DATE-CC-N with THIS-CENTURY and LAST-CENTURY
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-INF-001  # which dates CEEDAYS accepts is known only through the stub
- GAP-MIS-010  # whether UniKix supplies CEEDAYS
# The UniKix copy of CSUTLDPY drops TRIM from the composed date-edit messages
# and replaces TEST-NUMVAL in the month and day checks; it lists INV-ACT-072.
- GAP-DOC-024
# The UniKix copy of CSUTLDTC trims the Vstring lengths it passes to CEEDAYS,
# so the date and mask CEEDAYS receives differ on UniKix; it lists INV-UTL-003.
- GAP-DOC-021
# The UniKix COACTUPC comments out the TEST-NUMVAL-C amount checks this path
# runs, so the amounts re-edited on screen 4 may differ on UniKix.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # update scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
        CUST-ADDR-ZIP: '27601'
        CUST-PHONE-NUM-1: (919)555-0101
        CUST-PHONE-NUM-2: (919)555-0102
        CUST-SSN: '123456789'
        CUST-GOVT-ISSUED-ID: TESTGOVT0001
        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: Y
        CUST-FICO-CREDIT-SCORE: '700'
    # The 10 repository users, for the USER0001 sign-on.
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
# PASSWORD is the documented demo password of README.md, not a secret.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  # The lowest year of century 19; OPNMON and OPNDAY are left as fetched (11
  # and 20).
  - aid: ENTER
    '@map': COACTUP
    fields:
      OPNYEAR: '1900'
