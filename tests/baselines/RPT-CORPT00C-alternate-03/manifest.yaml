# Manifest of the derived baseline of RPT-CORPT00C-alternate-03: CR00 entered
# directly, without a COMMAREA. Only unikix can run the scenario, so
# expected.yaml was authored from the source (derived_from: source), not
# captured (inferred-not-observed, GAP-INF-009, GAP-INF-012). It names no
# execution_id or execution_fingerprint and holds no datasets/ until an
# eligible UniKix run is imported (report.py --import-unikix), the only way it
# is promoted.
#
# source_identity.units are the app/ units the step executes: CORPT00C, which
# finds EIBCALEN = 0 and XCTLs to COSGN00C with a COMMAREA before sending any
# map of its own [app/cbl/CORPT00C.cbl:172-174,540-551], and COSGN00C, which
# takes the ENTER as an empty sign-on attempt and sends the sign-on map
# COSGN00 whose fields and message expected.yaml asserts
# [app/cbl/COSGN00C.cbl:80-88,108-122]. Each program brings its COPY closure
# (inventory_tools.copy_closure), so CORPT00.CPY and CVTRA05Y, and COSGN00C's
# COSGN00.CPY and CSUSR01Y, are listed; COSGN00.bms is the one map sent.
# CSUTLDTC is absent although harness.results follows CORPT00C's CALLs to it:
# CORPT00C calls it only from its date edits [app/cbl/CORPT00C.cbl:392,412],
# which this path never reaches. CORPT00.bms is never sent, so it is absent.
# DFHAID and DFHBMSCA are CICS-supplied and not in the repository.
# source_commit is HEAD at authoring; app/ is byte-identical to the suite's
# starting commit.
