# Lower edge of the SSN first-part edit: 665 is the value just below the
# forbidden 666, so COACTUPC accepts it and the change goes on to the save
# prompt. 1265-EDIT-US-SSN refuses a first part that satisfies
# INVALID-SSN-PART1 (VALUES 0, 666, 900 THRU 999) [app/cbl/COACTUPC.cbl:
# 117-123,2431-2464]; boundary-25 to -28 enter 665, 666, 899 and 900, and only
# 666 and 900 are refused.
#
# Steps 1-3 reach the fetched account as ACT-COACTUPC-negative-064 does:
# USER0001 signs on through CC00, chooses option 2 (Account Update) on COMEN01,
# and enters account 00000000001. 9000-READ-ACCT reads CXACAIX by account id
# (card 9680294154603697, customer 000000001), ACCTDAT and CUSTDAT, keeps the
# records as the old values in the COMMAREA and sets ACUP-SHOW-DETAILS; the
# screen shows them with 'Update account details presented above.'
# [app/cbl/COACTUPC.cbl:2787-2865,2955-3000,3608-3884].
# Step 4 types 665 over the first SSN part (ACTSSN1, shown as '123') and
# presses ENTER.
# - 1205-COMPARE-OLD-NEW finds ACUP-NEW-CUST-SSN-X ('665456789') unequal to the
#   old SSN (123456789), so 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and
#   runs every field edit [app/cbl/COACTUPC.cbl:1460-1470,1681-1754].
# - The account fields pass on the repository account; 1265-EDIT-US-SSN finds
#   '665' supplied, numeric and not zero through 1245-EDIT-NUM-REQD, and its
#   numeric redefinition 665 is none of 0, 666 or 900-999, so INPUT-ERROR stays
#   off and no message is composed; SSN parts 2 ('45') and 3 ('6789') and every
#   later edit pass on the invented customer below [app/cbl/COACTUPC.cbl:
#   1472-1676,2109-2175,2439-2487].
# - With no input error 1200 sets ACUP-CHANGES-OK-NOT-CONFIRMED; ENTER is not
#   PF5, so 2000-DECIDE-ACTION continues without 9600-WRITE-PROCESSING, the
#   only READ UPDATE and REWRITE path [app/cbl/COACTUPC.cbl:1670-1675,
#   2602-2621].
# - 3203-SHOW-UPDATED-VALUES shows the received values (ACUP-CHANGES-MADE),
#   the amounts re-edited through +ZZZ,ZZZ,ZZZ.99; 3250 sets
#   PROMPT-FOR-CONFIRMATION, moves 'Changes validated.Press F5 to save' to
#   INFOMSG and the still blank WS-RETURN-MSG to ERRMSG; 3300 leaves every field
#   protected; 3390 makes F5=Save and F12=Cancel bright [app/cbl/COACTUPC.cbl:
#   472-480,2698-2726,2870-2983,3001-3003,3566-3581].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte field and ERRMSG the
#   blank 75-byte WS-RETURN-MSG in the 78-byte field. Fields are compared at
#   their full BMS length, trailing spaces kept.
# - FKEY05 and FKEY12 keep their INITIAL text; a dark (ASKIP,DRK) field is
#   captured as blanks. Colour, protection and cursor position are not in the
#   s3270 text capture and are not asserted.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, so the first SSN part is the only field changed: the repository record
# has FICO 274, below 300, and zip 12546, which is not a North Carolina zip
# [app/cbl/COACTUPC.cbl:2514-2558]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-boundary-25
level: e2e
type: boundary
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001, whose customer's SSN is 123-45-6789, types 665 over the
  first SSN part and presses ENTER. 665 is the value just below the forbidden
  666, so COACTUPC accepts it: no SSN message appears, every other field passes,
  and the screen shows the received values with the save prompt 'Changes
  validated.Press F5 to save' and F5=Save and F12=Cancel made visible. Nothing
  is saved without PF5: ACCTDATA and CUSTDATA still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. The save-prompt message item is verified by its own scenario; sign-on
# (CC00, COSGN00, USRSEC) and the menu transaction by the SEC and MNU
# scenarios; the batch record copybooks and the data files at the lowest level
# that executes them.
inventory_ids:
- INV-ACT-122  # COACTUPC SSN: First 3 chars: not 000, 666 or 900-999 (1265-EDIT-US-SSN)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and save-prompt screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the field attribute setting of 3300
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the date edits the account dates pass
- INV-LAY-014  # CSUTLDWY: the date-edit working storage
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix COACTUPC changes the edits and the change detection this
# acceptance passes through, so a UniKix run never verifies the item.
- GAP-DOC-022
# Not in the planned gap list; cited as the other COACTUPC update scenarios
# cite it: the UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME
# stands.
- GAP-DOC-025
# Not in the planned gap list; cited as ACT-COACTUPC-normal-02 cites them for
# the same save prompt: 'Changes validated' needs all four date edits to pass,
# which rests on CEEDAYS accepting the dates (never observed, 001) and on the
# CSUTLDTC (021) and CSUTLDPY (024) code the UniKix copy changes.
- GAP-INF-001
- GAP-DOC-021
- GAP-DOC-024
