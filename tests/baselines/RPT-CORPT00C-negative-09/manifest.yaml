# Manifest of the derived baseline of RPT-CORPT00C-negative-09: USER0001 takes
# main-menu option 9 to CORPT00C, marks Custom and enters the start day 50,
# which CORPT00C refuses with 'Start Date - Not a valid Day...'
# [app/cbl/CORPT00C.cbl:338-345]. Only unikix can run the scenario, so
# expected.yaml is authored from the source and is inferred-not-observed
# (GAP-INF-009, GAP-INF-012). It names no execution_id or execution_fingerprint
# and holds no datasets/ until report.py --import-unikix promotes an eligible
# UniKix run.
#
# source_identity.units are the app/ sources the three steps execute:
# harness.results.source_identity gives a steps scenario no units, so each
# program the steps pass through is listed with its COPY closure
# (inventory_tools.copy_closure), plus the BMS sources of their maps COSGN00,
# COMEN01 and CORPT00. COSGN00C signs USER0001 on and XCTLs to COMEN01C
# [app/cbl/COSGN00C.cbl:230-240]; COMEN01C XCTLs option 9 to CORPT00C
# [app/cbl/COMEN01C.cbl:146-156] [app/cpy/COMEN02Y.cpy:74-78]. The sign-on
# and menu programs are listed, not only CORPT00C, because expected.yaml also
# asserts the COMEN01 screen COMEN01C sends. CSUTLDTC, which CORPT00C CALLs to
# validate the dates [app/cbl/CORPT00C.cbl:392,412], is left out: the
# invalid-day branch sends CORPT00 and ends with GO TO RETURN-TO-CICS
# [app/cbl/CORPT00C.cbl:556-591] before any CALL, so it does not run. DFHAID
# and DFHBMSCA are CICS-supplied, not app/ sources. source_commit is HEAD at
# authoring; app/ is byte-identical to the suite's starting commit
# 93ebec71ff7b59a68cedd7c501afe496a8eaa68d.
