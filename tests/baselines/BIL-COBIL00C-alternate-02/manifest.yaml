# Manifest of the derived baseline of BIL-COBIL00C-alternate-02: USER0001 signs
# on, takes main-menu option 10 'Bill Payment', enters account 00000000001 on
# COBIL00 with CONFIRM blank and is asked to confirm; PF4 then clears the
# screen without paying, and PF3 XCTLs to CDEMO-FROM-PROGRAM COMEN01C, which
# sends the main menu [app/cbl/COBIL00C.cbl:123-137,273-285]. Only unikix can
# run the scenario, so expected.yaml is authored from the source and is
# inferred-not-observed (GAP-INF-008, GAP-INF-012). It names no execution_id
# or execution_fingerprint and holds no datasets/ until report.py
# --import-unikix promotes an eligible UniKix run (MINOR when the decoded
# outcome is equal, MAJOR when it differs).
#
# source_identity.units are the app/ sources the five steps execute, each
# program's COPY closure as harness.results computes it (symbolic maps in
# app/cpy-bms included): COSGN00C, which signs USER0001 on; COMEN01C, the menu
# of steps 1 and 5; and COBIL00C, which CALLs no app/cbl unit. The BMS sources
# of the three screens COSGN00, COMEN01 and COBIL00 complete them. DFHAID and
# DFHBMSCA are CICS-supplied, not app/ sources. derived_from is omitted: the
# expectation comes from the source, not the tech spec. source_commit is HEAD
# at authoring; app/ is byte-identical to the suite's starting commit
# 93ebec71ff7b59a68cedd7c501afe496a8eaa68d.
