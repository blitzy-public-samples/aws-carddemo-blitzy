# COACTUPC refuses an account update whose Current Cycle Debit Limit is not a
# valid signed amount: 1250-EDIT-SIGNED-9V2 finds the field supplied but
# FUNCTION TEST-NUMVAL-C not 0, and composes 'Current Cycle Debit Limit is not
# valid' [app/cbl/COACTUPC.cbl:2180-2221].
#
# Steps 1-3 reach the fetched account as ACT-COACTUPC-alternate-04 does:
# USER0001 signs on through CC00, chooses option 2 (Account Update) on COMEN01,
# and enters account 00000000001. 9000-READ-ACCT reads CXACAIX by account id
# (card 9680294154603697, customer 000000001, line 49 of
# app/data/ASCII/cardxref.txt), ACCTDAT and CUSTDAT, keeps the records as the
# old values in the COMMAREA and sets ACUP-SHOW-DETAILS; the screen shows them
# with 'Update account details presented above.', every editable field
# unprotected with its MDT on [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,
# 2955-3000,3441-3561,3608-3884].
# Step 4 types 9.9.9 over the current cycle debit (ACRCYDB, shown as
# '+           .00') and presses ENTER.
# - 1100-RECEIVE-MAP moves the received '9.9.9' and its 10 blanks to the
#   15-byte ACUP-NEW-CURR-CYC-DEBIT-X; TEST-NUMVAL-C is not 0, so the NUMVAL-C
#   COMPUTE is skipped and ACUP-NEW-CURR-CYC-DEBIT keeps the spaces INITIALIZE
#   gave it [app/cbl/COACTUPC.cbl:410-416,793-795,1047,1128-1139].
#   1205-COMPARE-OLD-NEW finds those spaces unequal to the old cycle debit
#   (0.00), so a change has occurred, and 1200-EDIT-MAP-INPUTS sets
#   ACUP-CHANGES-NOT-OK and runs the field edits in screen order
#   [app/cbl/COACTUPC.cbl:1460-1470,1681-1705].
# - Account Status, Open Date, Credit Limit, Expiry Date, Cash Credit Limit,
#   Reissue Date, Current Balance and Current Cycle Credit Limit pass on the
#   repository account. 'Current Cycle Debit Limit' is moved to
#   WS-EDIT-VARIABLE-NAME and the received text to
#   WS-EDIT-SIGNED-NUMBER-9V2-X [app/cbl/COACTUPC.cbl:1472-1527].
#   1250-EDIT-SIGNED-9V2 finds the field neither LOW-VALUES nor SPACES;
#   TEST-NUMVAL-C('9.9.9') is not 0 (the second decimal point is invalid), so
#   it sets INPUT-ERROR and FLG-SIGNED-NUMBER-NOT-OK and, WS-RETURN-MSG being
#   still blank [app/cbl/COACTUPC.cbl:876], STRINGs the trimmed field name and
#   ' is not valid' into WS-RETURN-MSG [app/cbl/COACTUPC.cbl:2201-2215].
#   WS-EDIT-CURR-CYC-DEBIT becomes FLG-CURR-CYC-DEBIT-NOT-OK.
# - Every later edit passes on the invented customer below; they only set
#   their flags, since WS-RETURN-MSG is no longer blank
#   [app/cbl/COACTUPC.cbl:1529-1676]. INPUT-ERROR keeps ACUP-CHANGES-NOT-OK,
#   and 2000-DECIDE-ACTION continues on it, so 9600-WRITE-PROCESSING, the only
#   READ UPDATE and REWRITE path, does not run [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values, the valid amounts
#   re-edited through +ZZZ,ZZZ,ZZZ.99 and the cycle debit as received, since
#   FLG-CURR-CYC-DEBIT-ISVALID is not set; 3250 sets PROMPT-FOR-CHANGES and
#   moves the message to ERRMSG; 3300 keeps the fields editable, puts the
#   cursor on ACRCYDB and marks it red through CSSETATY without the '*' of a
#   blank field; 3390 makes F12=Cancel bright because changes were made, while
#   F5=Save stays dark [app/cbl/COACTUPC.cbl:2870-2951,2955-2983,3074-3076,
#   3291-3295,3566-3581] [app/cpy/CSSETATY.cpy:18-27].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - The message is TRIM('Current Cycle Debit Limit') followed by ' is not
#   valid', 38 characters of the 75-byte WS-RETURN-MSG, shown in the 78-byte
#   ERRMSG with trailing spaces. INFOMSG is the 40-byte WS-INFO-MSG in the
#   45-byte field. Fields are compared at their full BMS length, trailing
#   spaces kept.
# - The tpe adapter enters a field with EraseEOF before typing, and ACRCYDB has
#   the default JUSTIFY=(LEFT,BLANK), so BMS returns '9.9.9' padded with 10
#   blanks to its 15 bytes, and the screen shows it so.
# - FKEY05 and FKEY12 keep their INITIAL text; a dark (ASKIP,DRK) field is
#   captured as blanks. Colour and cursor position are not in the s3270 text
#   capture and are not asserted.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, so the cycle debit is the only field refused: the repository record
# has FICO 274, below 300, and zip 12546, which is not a North Carolina zip
# [app/cbl/COACTUPC.cbl:2514-2558]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-060
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001, whose current cycle debit is 0.00, types 9.9.9 over the
  Current Cycle Debit Limit and presses ENTER. The text is not a valid signed
  amount, so COACTUPC refuses the change: it shows the received values again,
  editable, with 'Current Cycle Debit Limit is not valid' in the message line,
  the cycle debit as typed, the change prompt 'Update account details
  presented above.' and F12=Cancel made visible. Nothing is saved: ACCTDATA
  and CUSTDATA still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-118  # COACTUPC Current Cycle Debit Limit: valid signed amount (1250-EDIT-SIGNED-9V2)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute set on ACRCYDB
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the date edits the earlier dates pass
- INV-LAY-014  # CSUTLDWY: the date-edit working storage
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix COACTUPC comments out the TEST-NUMVAL-C amount checks and the
# ' is not valid' edit of 1250-EDIT-SIGNED-9V2, so on UniKix 9.9.9 is not
# refused this way; the app/ behaviour is pinned.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
