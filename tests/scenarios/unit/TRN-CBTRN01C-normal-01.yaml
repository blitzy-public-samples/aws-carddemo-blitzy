id: TRN-CBTRN01C-normal-01
level: unit
type: normal
description: >-
  CBTRN01C verifies the 300 repository daily transactions against the
  cross-reference and account files and ends with return code 0. The baseline
  pins the 1,807 DISPLAY lines as observed: the start line; for each DALYTRAN
  record in file order, the whole 350-byte DALYTRAN-RECORD as stored (overpunch
  amount and trailing spaces included), 'SUCCESSFUL READ OF XREF', 'CARD NUMBER:
  <card>', 'ACCOUNT ID : <account>', 'CUSTOMER ID: <customer>' and 'SUCCESSFUL
  READ OF ACCOUNT FILE'; then the five lookup lines once more for the last card,
  3260763612337560, without a record line, because the loop body still runs
  after the read that sets end of file; then the end line
  [app/cbl/CBTRN01C.cbl:155-197,202-250]. Every repository card is in CARDXREF
  and every cross-referenced account in ACCTDATA, so no 'COULD NOT BE VERIFIED',
  'NOT FOUND' or 'INVALID' line appears.
# The repeated end-of-file lookup is the GAP-DEF-006 behaviour. It is pinned here
# as observed; TRN-CBTRN01C-boundary-01 is the scenario that tags it.
inventory_ids:
- INV-TRN-069  # CBTRN01C per-record XREF and account verification display (report)
- INV-TRN-007  # CBTRN01C program
- INV-LAY-026  # CVTRA06Y copybook, the displayed DALYTRAN-RECORD
- INV-LAY-018  # CVACT03Y copybook, the cross-reference record whose ids are displayed
- INV-DTA-005  # dailytran.txt, the DALYTRAN fixture source
- INV-DTA-015  # EBCDIC daily transaction file, its cross-check counterpart
- INV-DTA-003  # cardxref.txt, the CARDXREF fixture source
- INV-DTA-013  # EBCDIC card cross-reference file, its cross-check counterpart
- INV-DTA-001  # acctdata.txt, the ACCTDATA fixture source
- INV-DTA-011  # EBCDIC account data file, its cross-check counterpart
- INV-DTA-004  # custdata.txt, the CUSTDATA fixture source
- INV-DTA-014  # EBCDIC customer data file, its cross-check counterpart
- INV-DTA-002  # carddata.txt, the CARDDATA fixture source
- INV-DTA-012  # EBCDIC card data file, its cross-check counterpart
tags: []
gap_ids:
- GAP-UNC-003  # no job or proc step runs CBTRN01C
- GAP-STB-010  # Berkeley DB indexed files in place of the VSAM KSDS
- GAP-STB-011  # GnuCOBOL compile and runtime options in place of Enterprise COBOL and LE
preconditions:
  datasets:
    DALYTRAN: {base: DALYTRAN}
    CARDXREF: {base: CARDXREF}
    ACCTDATA: {base: ACCTDATA}
    CUSTDATA: {base: CUSTDATA}
    CARDDATA: {base: CARDDATA}
    # CBTRN01C opens TRANFILE INPUT and never reads it, so TRANSACT is an empty
    # KSDS that exists. Leaving it out is the open failure of
    # TRN-CBTRN01C-recovery-01; TRANSACT-INIT belongs to the integration load jobs.
    TRANSACT: {records: []}
  parameters:
    clock: '2022-07-06 10:00:00.00'
    clock_mode: fixed
  faults: []
inputs:
  program: CBTRN01C
expected:
  return_code: 0
  messages: baseline
