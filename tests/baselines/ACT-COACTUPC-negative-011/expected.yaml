# Derived baseline of scenario ACT-COACTUPC-negative-011: USER0001 fetches
# account 00000000001 on COACTUP and types X over the account status.
# Authored from the source, never captured: app/cbl/COMEN01C.cbl:236-275 (the
# menu option text), app/cbl/COACTUPC.cbl:878-886,964-973 (the fresh entry
# from the menu), 2562-2580,2787-2865 (the fetch and the fetched values),
# 1460-1476,1856-1891 (1220-EDIT-YESNO refuses X with the trimmed field name
# and ' must be Y or N.'), 1671-1675,2596-2597 (no READ UPDATE or REWRITE),
# 2870-2872,2955-2981 (the X kept, the change prompt and the message),
# 3566-3576 (F12=Cancel bright once changes are made), app/bms/COACTUP.bms,
# app/cpy/COTTL01Y.cpy, and the fixtures app/data/ASCII/acctdata.txt and
# custdata.txt with the scenario's invented customer 000000001. It pins the
# app/ COACTUPC; the UniKix copy composes the message without TRIM
# (GAP-DOC-022). Open until a UniKix run is imported: GAP-INF-005 and
# GAP-INF-012.
# One screen per step, each the screen shown after the step's AID; values are
# full BMS field width with trailing spaces kept. CURDATE and CURTIME come
# from the region clock, hence the matchers. ERRMSG is the 30-character
# message padded to the 78 bytes of ERRMSGO, INFOMSG the 40-byte WS-INFO-MSG
# in the 45-byte field. The refused change writes nothing, so file_state
# lists every record of ACCTDATA and CUSTDATA as materialized, in key order,
# decoded field by field with CVACT01Y and CVCUS01Y, FILLER included, so every
# byte of each record is asserted unchanged.
