  # apache/kafka:4.2.1 - seven Alpine packages in the pinned broker image.
  - id: CVE-2026-2100
    purls:
      - pkg:apk/alpine/p11-kit@0.25.5-r2
    statement: >-
      apache/kafka:4.2.1 | owner: project owner | Alpine package inside the pinned broker image. Reachability is NOT claimed: the broker terminates Transport Layer Security in the cluster path, so the cryptographic packages here are on a live path. What is accepted is the exposure of a demonstration whose broker is reachable only from inside one Compose network or one cluster namespace, for as long as the date below allows.
    expired_at: 2026-11-30
