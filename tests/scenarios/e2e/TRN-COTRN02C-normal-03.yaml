# COTRN02C computes the id of the transaction it adds as the highest TRAN-ID
# on TRANSACT plus 1, not the record count plus 1 [app/cbl/COTRN02C.cbl:442-451].
# TRANSACT holds three invented records whose keys, 7, 19 and 41, are not
# contiguous, so the next id is 42 where a count would give 4.
#
# Steps 1-2 reach the empty Add Transaction screen as MNU-COMEN01C-alternate-08
# does: USER0001 (type U) is routed to COMEN01C, and option 8 transfers control
# to COTRN02C with the program context reset, so COTRN02C sets the re-enter
# flag, finds no transaction selected and sends COTRN02 with a blank ERRMSG
# [app/cbl/COSGN00C.cbl:230-237] [app/cbl/COMEN01C.cbl:115-156,236-264]
# [app/cbl/COTRN02C.cbl:119-130,516-528].
# Step 3 enters the valid field set of the TRN-COTRN02C scenarios, card number
# only, with CONFIRM Y, under the CT02 that step 2 returned with
# [app/cbl/COTRN02C.cbl:131-135,530-534]:
# - ACTIDIN is blank, so the card path reads CCXREF by card number; card
#   0500024453765740 is record 1 of the CARDXREF fixture, for account
#   00000000050 [app/cbl/COTRN02C.cbl:210-223,609-623].
# - Every data field is supplied; type and category are numeric, the amount
#   has the sign, eight digits, point and two decimals, both dates have the
#   YYYY-MM-DD shape and CSUTLDTC accepts them with that mask, and the
#   merchant id is nine digits [app/cbl/COTRN02C.cbl:251-437].
# - CONFIRM Y performs ADD-TRANSACTION: STARTBR at HIGH-VALUES positions past
#   the last key, READPREV reads 0000000000000041 into TRAN-RECORD, and the key
#   moved to WS-TRAN-ID-N PIC 9(16) plus 1 gives 0000000000000042
#   [app/cbl/COTRN02C.cbl:57,444-449,642-697].
# - INITIALIZE TRAN-RECORD, then the input fields move into the record: the
#   category text 0001 into the PIC 9(04) TRAN-CAT-CD, the amount through
#   NUMVAL-C into TRAN-AMT, the 10-character dates into the 26-byte
#   timestamps, padded with spaces; no clock is involved
#   [app/cbl/COTRN02C.cbl:383-386,450-465].
# - The WRITE is NORMAL, so INITIALIZE-ALL-FIELDS blanks every input field and
#   STRING composes 'Transaction added successfully. ' + ' Your Tran ID is ' +
#   TRAN-ID + '.' in ERRMSG [app/cbl/COTRN02C.cbl:711-734,762-779].
# TRANSACT then holds the three records unchanged plus 0000000000000042, in key
# order. The 20-byte FILLER is not asserted: INITIALIZE leaves FILLER items
# alone, so the new record carries over the FILLER bytes READPREV read.
# BMS pads each received field with blanks to its length, and expected text
# values are full field width with their trailing spaces. CURDATE and CURTIME
# come from the region clock, so they are matchers and the clock is relative.
id: TRN-COTRN02C-normal-03
level: e2e
type: normal
description: >-
  USER0001 signs on, chooses main-menu option 8 (Transaction Add) and adds a
  12.34 purchase for card 0500024453765740 with CONFIRM Y while TRANSACT holds
  only the transactions 0000000000000007, 0000000000000019 and
  0000000000000041. COTRN02C takes the highest key plus 1, writes transaction
  0000000000000042, clears the input fields and shows 'Transaction added
  successfully.  Your Tran ID is 0000000000000042.'
# Primary item first, then the program, the maps asserted, the transaction step
# 3 runs under, the CSD files COTRN02C reads and writes, and the online-only
# copybooks it copies. Sign-on and the menu (CC00, CM00, COSGN00, USRSEC, the
# option-8 navigation) are verified by the SEC and MNU scenarios, the success
# message and the TRANSACT WRITE by their own TRN-COTRN02C scenarios, and the
# batch record copybooks and data files at the lowest level that executes them.
inventory_ids:
- INV-TRN-067  # COTRN02C next TRAN-ID (calculation)
- INV-TRN-003  # COTRN02C program
- INV-MNU-003  # COMEN01 map, where option 8 is entered
- INV-TRN-006  # COTRN02 map, the add screen of steps 2 and 3
- INV-CFG-022  # CT02 transaction, under which COTRN02C receives the add
- INV-CFG-004  # CCXREF CSD file, read by card number
- INV-CFG-007  # TRANSACT CSD file, browsed backwards and written
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA carrying the program context
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the screen date and time
- INV-LAY-008  # CSMSG01Y copybook, copied by COTRN02C
