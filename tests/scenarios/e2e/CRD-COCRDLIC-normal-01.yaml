# First page of the COCRDLIC card list, reached from the main menu.
#
# USER0001 (type U) signs on; COSGN00C transfers control to COMEN01C, which
# sends the main menu COMEN01 [app/cbl/COSGN00C.cbl:209-240]
# [app/cbl/COMEN01C.cbl:82-90]. Option 3, right-justified into WS-OPTION as 03,
# selects COMEN02Y's 'Credit Card List', program COCRDLIC, and COMEN01C transfers
# control there with CDEMO-FROM-PROGRAM COMEN01C and the program context reset to
# 0 [app/cbl/COMEN01C.cbl:115-157] [app/cpy/COMEN02Y.cpy:37-41].
#
# In that task COCRDLIC [app/cbl/COCRDLIC.cbl:300-343,357-362,572-582]:
# - copies the COMMAREA, then, entered from another program with the context 0,
#   re-initializes its own paging area (which also discards the bytes it copied
#   from past the end of the menu's shorter COMMAREA) and sets page 1;
# - receives no map, because the previous program is not COCRDLIC, so the
#   account and card filters stay blank and the select flags keep the spaces
#   INITIALIZE gave them; the task's ENTER key reaches WHEN OTHER;
# - browses CARDDAT GTEQ from a blank card number, so from the first key, and
#   fills the 7 rows (WS-MAX-SCREEN-LINES) with account, card number and active
#   status in key order; the look-ahead READNEXT finds the 8th card, so
#   CA-NEXT-PAGE-EXISTS holds and no error message is set
#   [app/cbl/COCRDLIC.cbl:177-178,1123-1260].
# 1000-SEND-MAP then builds the screen [app/cbl/COCRDLIC.cbl:642-743,837-946]:
# the titles, CCLI, COCRDLIC, the run date and time; the page number 1, a
# PIC 9(1) moved to the 3-byte PAGENO and so left-justified as '1  '; the 7
# rows; the filters left at LOW-VALUES, because the previous program is the
# menu; and 'TYPE S FOR DETAIL, U TO UPDATE ANY RECORD' in INFOMSG, set because
# WS-NO-INFO-MESSAGE (set by 1100-SCREEN-INIT) and CA-NEXT-PAGE-EXISTS share one
# WHEN branch [app/cbl/COCRDLIC.cbl:669,917-919,926-930]. It is sent once, with
# ERASE, and the task returns with TRANSID CCLI.
#
# Expected values are derived from the source (no TPE region runs in CI) and are
# whole fields at their BMS length, trailing spaces kept: comparison never trims.
# Fields left at LOW-VALUES (ACCTSID, CARDSID) show as spaces. The rows are the
# first seven records of the CARDDATA fixture, whose 50 cards are in key order
# and all have CARD-ACTIVE-STATUS 'Y'; the 8th is 1561409106491600
# [app/data/ASCII/carddata.txt:1-8]. The dark, unset CRDSTP2-CRDSTP7 fields are
# not asserted. The main menu is asserted only by its identification fields: its
# content is covered by the COMEN01C (MNU) scenarios. CURDATE and CURTIME come
# from the run clock, so they are matchers and the clock is relative.
id: CRD-COCRDLIC-normal-01
level: e2e
type: normal
description: >-
  USER0001 signs on and enters option 3 (Credit Card List) on the main menu.
  COCRDLIC, entered from the menu, browses CARDDAT from the first key and shows
  page 1 of the card list: the first 7 cards of the fixture in card-number order
  with their accounts and active status 'Y', blank filters, a blank ERRMSG and
  'TYPE S FOR DETAIL, U TO UPDATE ANY RECORD' in INFOMSG, since an 8th card
  exists.
# Primary item first, then the program, the maps asserted, the transaction the
# list screen names and returns with, the CSD file browsed, and the online-only
# copybooks COCRDLIC copies.
inventory_ids:
- INV-CRD-025  # COCRDLIC card list content (report): 7 rows per page
- INV-CRD-001  # COCRDLIC program
- INV-MNU-003  # COMEN01 map, where option 3 is entered
- INV-CRD-004  # COCRDLI map, the list screen asserted
- INV-CFG-014  # CCLI transaction, TRNNAME and the RETURN TRANSID of the list
- INV-CFG-003  # CARDDAT CSD file, browsed by card number
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA passed by the menu
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the screen date and time
- INV-LAY-008  # CSMSG01Y copybook, copied by COCRDLIC
- INV-LAY-011  # CSSTRPFY copybook, mapping the ENTER key
- INV-LAY-019  # CVCRD01Y copybook, the AID, filter and message work area
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-006  # derived CRD end-to-end baselines, never observed on a TPE region
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
