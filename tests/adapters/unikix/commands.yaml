# UniKix command registry of the `unikix` adapter.
#
# Every UniKix command the adapter issues is an entry of this file: the adapter issues nothing outside it.
# tests/adapters/unikix/env.py (CommandSet) is the only reader and the only executor; deploy.py, bpe.py and
# adapter.py call entries by id. Every entry stays unconfirmed (`status: unconfirmed`) until an operator
# has validated it against the installed UniKix release (see Operators below). The commands come from the
# zip's bin/ scripts, the AWS CardDemo-on-UniKix tutorial
# (https://docs.aws.amazon.com/m2/latest/userguide/tutorial-unikix-runtime.html) and the legacy Sun MTP guide
# (https://docs.oracle.com/cd/E19065-01/servers.12k/816-5328-11/cfgstartstop.html).
#
# How an entry runs
# - env.py runs `bash --noprofile --norc -c <command>` with the environment it derived: the test-owned
#   deployment variables BASE_DIR, PROJECT_ROOT, PR, KIXSYS, KIXDATA, EBMHOME, EBMSYS, JOBLIB, MBM_LOCK_DIR,
#   PARMFILES, SEQFILES, MIGAPP_DIR and COBCPY, the installation variables UNIKIX, INSTEBM, VCOBOL, KIXLICDIR
#   and JAVA_HOME, and MBMSUB once batchenv has been sourced. It runs in the entry's `cwd` or, when absent,
#   in the default directory: $PROJECT_ROOT once it exists, else the deployment root.
# - Every command and probe starts with TMPDIR, TMP and TEMP set to <deployment root>/tmp, _JAVA_OPTIONS set
#   to exactly -Djava.io.tmpdir=<deployment root>/tmp -XX:+PerfDisableSharedMem, and JAVA_TOOL_OPTIONS (and
#   JDK_JAVA_OPTIONS when set) ending in those options, because a JVM ignores TMPDIR and HotSpot writes
#   /tmp/hsperfdata_<user> otherwise. HotSpot reads _JAVA_OPTIONS after the command line, so it wins over a
#   -Djava.io.tmpdir a vendor script passes; every JVM therefore prints "Picked up JAVA_TOOL_OPTIONS" and
#   "Picked up _JAVA_OPTIONS" on stderr. Before any output is logged or recorded, env.py shows every JVM
#   option there, and every option the JVM option variables hold, as <redacted>, except the owned temporary
#   settings. Every command's shell holds TMPDIR, TMP, TEMP and _JAVA_OPTIONS read-only, as do the shells
#   that source the environment file, userenv and batchenv: a command, or a script it sources, that
#   assigns, exports or unsets one gets bash's "readonly variable" error (a failed plain assignment also
#   skips the rest of its line) and the owned value stays. A userenv or batchenv whose JAVA_TOOL_OPTIONS or
#   JDK_JAVA_OPTIONS name another java.io.tmpdir, or hold an unmatched quote, is refused under GAP-MIS-003
#   or GAP-MIS-006.
# - Placeholders in {braces} (member, map, job, file, operation, queue, dsn, clock, job_number) are filled by
#   the caller.
#   In `command` each value is shell-quoted and $VAR is expanded by bash; `cwd` is filled and expanded by
#   env.py instead (below). Neither holds other braces: write $VAR, never ${VAR}.
# - Shell quoting keeps a value one word of data only where its placeholder stands unquoted, as a whole word
#   or part of one (kixfile close {file}, kixclt {member}.cl2), in the command itself or inside $( ) or ( ).
#   A placeholder therefore never names the command and never stands inside '...', "...", $'...', $"...",
#   backquotes, ${...}, $(( )), (( )), $[ ], [[ ]], a brace expansion, [...] or a # comment; never after a
#   here-document operator << or <<- (its delimiter, its body or anything later; a <<< here-string is fine);
#   never right after $, $VAR, \ or a word-initial ~; never as digits right before < or >; and it carries no
#   conversion or format spec ({file!r}, {file:>8}). env.py refuses all of these when it loads this file and
#   again before each run. It cannot follow a case statement inside $( ) or ( ), or a single quote inside
#   ${...} or arithmetic, so it refuses every placeholder after one.
# - The value is data only to the command it reaches: never pass a placeholder to one that re-parses its
#   arguments as shell code or arithmetic (eval, sh -c, let, declare, local, read, printf -v).
# - No shell parses `cwd`: env.py fills each {placeholder} with the caller's value as given, not shell-quoted,
#   and that value must be one plain path component (non-empty, not . or .., no / and no $), otherwise
#   HarnessError. env.py then replaces each $VAR from the derived environment; an unset or empty variable,
#   or a directory that does not exist, makes the entry unavailable under its `gap`. A relative result is
#   taken below the default directory. Nothing else is interpreted: quotes, backslashes, ~, globs and $( )
#   stay literal.
# - `probe` exits 0 when the command is available. It runs as written, with the same bash flags and
#   environment, but always in the default directory, bounded by the smaller of `timeout_s` and 30 s and,
#   when a run triggers it, by the scenario deadline. env.py probes an entry before its first run unless
#   probe_all or probe already did, and caches the answer per environment generation: load starts
#   generation 0 and each source_runtime_scripts call, made once the deployment exists, starts the next, so
#   probes of the deployed tree ($MBMSUB, $EBMHOME/batchenv, sysoutdir, unikixrc.cfg) run again against it.
#   A failed probe refuses every run of the entry until the next generation; probe_all(refresh=True) and
#   probe(refresh=True) probe again.
# - `command: null` means no public source names a command, so the entry ships the probe "false". A scenario
#   that needs the entry is blocked under the entry's `gap` unless the adapter has an available fallback for
#   it (the entries' notes and tests/README.md, UniKix operator procedure step 4): a region stop and restart
#   (region_stop, region_start) for region_file_close, region_file_open, region_file_enable, tdq_empty,
#   tdq_enable and region_quiesce_query; a BPE restart (bpe_stop, which ships null as well, then bpe_start)
#   for bpe_active_jobs; a generated IDCAMS job submitted through bpe_submit for catalog_reset; and
#   region_file_close for region_file_disable. An online `unavailable` fault that no available entry can
#   place leaves its scenario implemented-unexecuted under GAP-MIS-011, not blocked.
# - `timeout_s` bounds the control action itself; the caller caps it at the time left before the scenario
#   deadline. Waiting for application work (a job to complete, a screen to unlock) is not bounded here.
# - `gap` is the open missing-input entry of tests/inventory/gaps.yaml that the entry settles once confirmed.
#
# Operators
# - Correct an entry for the installed release, then set `status: confirmed` only after it has worked, and
#   commit this file with the run evidence. Every entry ships `unconfirmed`.
# - clock_set is the only entry whose use additionally requires `status: confirmed`: a fixed-clock scenario
#   runs on unikix only with a confirmed clock_set.
#
# parse
# - Named Python regexes (re.search, applied to the command's stdout or to the file the notes name), plus
#   the globs and path templates the notes describe. They hold no literal braces other than the placeholders
#   their notes name, so a caller may str.format them; write [0-9][0-9], never \d{2}.
#
# template
# - JCL that bpe.py renders with str.format and writes as a member under $PR/jcl/jmvs only, each line padded
#   to 80 columns; no line exceeds 80 columns with 8-character job names and 44-character DSNs.
# - `job` is the member. Every other key is a fragment that bpe.py renders once per item and joins, final
#   newlines removed, into the slot named in the entry's notes. A slot stands alone on its line, and empty
#   lines are dropped after rendering, so a slot filled with '' leaves nothing behind.
# - Generated jobs are submitted like any member: bpe_translate, then the entry's own command (the
#   bpe_submit command), then bpe_sysout polling.
#
# Nothing here targets app/, samples/, diagrams/ or the extracted zip, and no command reaches the network.
schema_version: 1
entries:

  # ---------------------------------------------------------------------------------------------------------
  # Build (zip bin/compile, bin/compbms). MIGAPP_DIR is the writable staging copy
  # <deployment root>/staging/migrated_app, never the read-only zip extraction. COBCPY is
  # $COBCPY:$MIGAPP_DIR/cpy:$MIGAPP_DIR/cpy-bms:$UNIKIX/copy (bin/compile:19), set by env.py.
  # VCOBOL_FLAGS, which bin/compile sets differently for online and batch, is set by build_kixclt's own
  # command for kixclt alone, not by env.py.
  # ---------------------------------------------------------------------------------------------------------
  build_kixclt:
    action: translate a CICS program
    command: 'VCOBOL_FLAGS="-align=8 -dz -ef -cv -dv=0 -dcii -pt2 -ld -aa -ce=cpy:CPY -sp=$COBCPY" kixclt {member}.cl2'
    cwd: $MIGAPP_DIR/cbl
    probe: 'command -v kixclt'
    timeout_s: 300
    gap: GAP-MIS-008
    status: unconfirmed
    source: zip bin/compile:19-21,25-31 (KIX_VCOBOL_ONLINE_FLAGS)
    notes: >-
      Translates the online program {member}.cl2 into {member}.cbl in the staging copy, which build_vcc_online
      then compiles; deploy.py deletes the translated {member}.cbl afterwards, as bin/compile:63-65 does. The
      command exports VCOBOL_FLAGS=$KIX_VCOBOL_ONLINE_FLAGS to kixclt, as bin/compile:26 does: the online
      flags of bin/compile:21, the same list build_vcc_online passes to vcc, with -sp=$COBCPY. The app/
      sources themselves are not built on UniKix; the UniKix copy is (GAP-MIS-008).

  build_vcc_online:
    action: compile a translated online program
    command: 'vcc -align=8 -dz -ef -cv -dv=0 -dcii -pt2 -ld -aa -ce=cpy:CPY -sp="$COBCPY" {member}.cbl'
    cwd: $MIGAPP_DIR/cbl
    probe: 'command -v vcc'
    timeout_s: 600
    gap: GAP-MIS-008
    status: unconfirmed
    source: zip bin/compile:19-21,26,46 (KIX_VCOBOL_ONLINE_FLAGS)
    notes: >-
      Produces {member}.class and {member}.list, which deploy.py moves to $PR/loadlib after deleting
      {member}.err (bin/compile:52-56). The app/ sources themselves are not built on UniKix (GAP-MIS-008).

  build_vcc_batch:
    action: compile a batch program
    command: 'vcc -align=8 -dz -cax -cv -dcii -dv=0 -ef -pt2 -ld -aa -ce=cpy:CPY -sp="$COBCPY" {member}.cbl'
    cwd: $MIGAPP_DIR/cbl
    probe: 'command -v vcc'
    timeout_s: 600
    gap: GAP-MIS-008
    status: unconfirmed
    source: zip bin/compile:19-20,33,46 (BTCH_COBOL_COMPILE_FLAGS)
    notes: >-
      Compiles the 10 CB* programs, CSUTLDTC and SDSF of the copy; outputs are moved as for
      build_vcc_online. The app/ sources themselves are not built on UniKix (GAP-MIS-008).

  build_kixbms:
    action: compile a BMS map
    command: 'kixbms {map}.bms'
    cwd: $MIGAPP_DIR/bms
    probe: 'command -v kixbms'
    timeout_s: 300
    gap: GAP-MIS-008
    status: unconfirmed
    source: zip bin/compbms:28-47
    notes: >-
      Produces {map}.map, which deploy.py moves to $PR/maps (bin/compbms:38-44). The copy's maps differ from
      app/bms for COACTUP and COACTVW (GAP-DOC-025).

  # ---------------------------------------------------------------------------------------------------------
  # TPE region and 3270 listener of the test-owned deployment ($KIXSYS = $PROJECT_ROOT/kixsys).
  # ---------------------------------------------------------------------------------------------------------
  region_create:
    action: create the TPE region
    command: 'kixregion createRegion "$KIXSYS" "$JAVA_HOME" "$KIXLICDIR"'
    probe: 'command -v kixregion'
    timeout_s: 600
    gap: GAP-MIS-003
    status: unconfirmed
    source: https://docs.aws.amazon.com/m2/latest/userguide/tutorial-unikix-runtime.html
    notes: >-
      Creates the region directory $KIXSYS inside the deployment root. The zip holds no region-creation
      command; argument order as given by the AWS tutorial.

  region_create_script:
    action: create the region's environment scripts
    command: 'kixregion createScript "$KIXSYS"'
    probe: 'command -v kixregion'
    timeout_s: 120
    gap: GAP-MIS-003
    status: unconfirmed
    source: https://docs.aws.amazon.com/m2/latest/userguide/tutorial-unikix-runtime.html
    notes: >-
      Expected to create $KIXSYS/bin/userenv, which region_install sources and env.py merges into the
      captured environment. env.py sources it right after this entry, before region_install runs, and refuses
      one that moves a deployment path (KIXSYS, KIXDATA, EBMHOME among them) or the JVM's temporary files out
      of the deployment root; TMPDIR, TMP, TEMP and _JAVA_OPTIONS are read-only there and in region_install.

  region_install:
    action: install the region resource lists
    command: '. "$KIXSYS/bin/userenv" && kixinstall2'
    probe: 'command -v kixinstall2 || test -x "$UNIKIX/bin/kixinstall2"'
    timeout_s: 600
    gap: GAP-MIS-003
    status: unconfirmed
    source: https://docs.aws.amazon.com/m2/latest/userguide/tutorial-unikix-runtime.html
    notes: >-
      Installs the catlg/tpe resource lists that deploy.py copied into $KIXSYS (pct, fct, ppt, dct, sit, vct,
      mct, CATALOG). The region's CSD resources come from these lists, never from CBADMCDJ, whose DFHCSDUP
      step targets z/OS datasets (GAP-MIS-016).

  region_start:
    action: start the TPE region
    command: 'kixregion start "$KIXSYS"'
    probe: 'command -v kixregion'
    timeout_s: 300
    gap: GAP-MIS-004
    status: unconfirmed
    source: https://docs.aws.amazon.com/m2/latest/userguide/tutorial-unikix-runtime.html
    notes: >-
      Starts the region of this deployment only. The legacy Sun MTP equivalent is kixstart. Also the
      fallback that reopens every region file when region file control is unavailable (GAP-MIS-011).

  region_stop:
    action: stop the TPE region
    command: 'kixstop'
    probe: 'command -v kixstop'
    timeout_s: 300
    gap: GAP-MIS-004
    status: unconfirmed
    source: https://docs.oracle.com/cd/E19065-01/servers.12k/816-5328-11/cfgstartstop.html
    notes: >-
      Legacy Sun MTP command; the current release's equivalent is unknown. It must stop the region named by
      $KIXSYS and nothing else. Used when quiescence or the reset cannot be confirmed, and as the fallback
      that closes every region file when region file control is unavailable.

  region_quiesce_query:
    action: confirm that the region has no active task
    command: null
    probe: 'false'
    timeout_s: 60
    gap: GAP-MIS-004
    status: unconfirmed
    source: none; neither the zip, the AWS tutorial nor the Sun MTP guide names a task query
    parse:
      active: '(?im)^[ \t]*(?P<task>[A-Z0-9@#$]+)[ \t].*\bACTIVE\b'
    notes: >-
      Must print nothing and exit 0 when the region has no active task; every stdout line that parse.active
      matches is an active task. Every non-blank line must be one active task as parse.active reads
      it: any other line makes the output unreadable, so quiescence is not confirmed (GAP-MIS-004).
      While it is unavailable the adapter stops and restarts the region before a scenario instead.

  listener_start:
    action: start the TN3270 listener
    command: 'unikixtnemux'
    probe: 'command -v unikixtnemux'
    timeout_s: 60
    gap: GAP-MIS-005
    status: unconfirmed
    source: https://docs.aws.amazon.com/m2/latest/userguide/tutorial-unikix-runtime.html
    notes: >-
      The TN3270 listener of the region; legacy default port 2001, the AWS examples use 15440 and 4444.
      Whether region_start already starts it, and whether it detaches, are unconfirmed; the command must
      return once the listener accepts connections on loopback.

  listener_port:
    action: read the listener port from the region configuration
    command: 'grep -E ''^[[:space:]]*TNServer[^=[:space:]]*ListenPort'' "$KIXSYS/unikixrc.cfg"'
    probe: 'test -r "$KIXSYS/unikixrc.cfg"'
    timeout_s: 10
    gap: GAP-MIS-005
    status: unconfirmed
    source: https://docs.aws.amazon.com/m2/latest/userguide/tutorial-unikix-runtime.html
    parse:
      port: 'ListenPort\s*[=:]?\s*(?P<port>[0-9]+)'
    notes: >-
      The port must equal the port of CARDDEMO_TN3270_ADDR, which is loopback only; otherwise the online
      scenarios are blocked under GAP-MIS-005.

  # ---------------------------------------------------------------------------------------------------------
  # BPE node, subsystem sys1 and job submission ($EBMHOME = <deployment root>/bpenode).
  # ---------------------------------------------------------------------------------------------------------
  bpe_node_create:
    action: create the BPE node
    command: null
    probe: 'false'
    timeout_s: 300
    gap: GAP-MIS-006
    status: unconfirmed
    source: none; the zip's bin/create_project only creates the empty bpenode directory
    notes: >-
      Must create the BPE node at $EBMHOME, the deployment root's bpenode, with subsystem $EBMSYS (sys1), and
      yield $EBMHOME/batchenv. No public source names the command, so deployment stops here as blocked
      until an operator supplies it.

  bpe_catalog_import:
    action: import the BPE catalog
    command: null
    probe: 'false'
    timeout_s: 300
    gap: GAP-MIS-007
    status: unconfirmed
    source: none; the zip ships catlg/bpe/BPECAT.*.csv without an import command
    notes: >-
      Must import $MIGAPP_DIR/catlg/bpe/BPECAT.cluster.csv, BPECAT.gdg_base.csv and BPECAT.nonvsam.csv from
      the staging copy into the node's catalog, so the copy's DSNs, clusters and GDG bases resolve.

  bpe_start:
    action: start BPE
    command: 'bam start'
    probe: 'command -v bam'
    timeout_s: 300
    gap: GAP-MIS-004
    status: unconfirmed
    source: https://docs.aws.amazon.com/m2/latest/userguide/tutorial-unikix-runtime.html
    notes: >-
      Starts the batch manager of the node at $EBMHOME. Unconfirmed whether it needs batchenv sourced first;
      env.py sources it through bpe_env once the node exists.

  bpe_stop:
    action: stop BPE
    command: null
    probe: 'false'
    timeout_s: 300
    gap: GAP-MIS-004
    status: unconfirmed
    source: none; no public source names the stop command
    notes: >-
      Must stop the batch manager of this node only. Called best effort when the session closes.

  bpe_env:
    action: source the BPE batch environment
    command: '. "$EBMHOME/batchenv" sys1'
    probe: 'test -r "$EBMHOME/batchenv"'
    timeout_s: 30
    gap: GAP-MIS-006
    status: unconfirmed
    source: zip bin/carddemo.env:42-48; https://docs.aws.amazon.com/m2/latest/userguide/tutorial-unikix-runtime.html
    notes: >-
      env.py sources batchenv after deployment (source_runtime_scripts) by running this command in the
      environment userenv left, with set -a, and keeps what it exports, MBMSUB included. The probe gates it
      (command null or a failed probe leaves batchenv unavailable, so every entry that needs $MBMSUB is
      refused), timeout_s bounds it, and an override changes what is sourced. Takes no placeholders; the
      command's output is logged, the environment never.

  bpe_system:
    action: start the BPE subsystem
    command: 'ebmsys -t'
    probe: 'command -v ebmsys'
    timeout_s: 120
    gap: GAP-MIS-006
    status: unconfirmed
    source: https://docs.aws.amazon.com/m2/latest/userguide/tutorial-unikix-runtime.html
    notes: >-
      Run after bpe_start for subsystem $EBMSYS, as the AWS tutorial does; what -t selects is unconfirmed.

  bpe_translate:
    action: translate a JCL member for BPE
    command: 'mvstrans {job}'
    cwd: $PR/jcl/jmvs
    probe: 'command -v mvstrans'
    timeout_s: 300
    gap: GAP-MIS-006
    status: unconfirmed
    source: https://docs.aws.amazon.com/m2/latest/userguide/tutorial-unikix-runtime.html
    notes: >-
      {job} is the member name under $PR/jcl/jmvs (a copy member, or one bpe.py generated). The tutorial runs
      mvstrans before BPESUB; its argument form is unconfirmed.

  bpe_submit:
    action: submit a job to BPE
    command: &bpe_submit_command 'cd "$MBMSUB" && BPESUB {job}'
    probe: &bpe_submit_probe 'test -n "$MBMSUB" && command -v BPESUB'
    timeout_s: 120
    gap: GAP-MIS-006
    status: unconfirmed
    source: https://docs.aws.amazon.com/m2/latest/userguide/tutorial-unikix-runtime.html
    parse:
      job_number: &bpe_job_number_regex '(?i)\bjob\s*(?:number|no\.?|id)?\s*[:=]?\s*(?P<job_number>[0-9]+)'
    notes: >-
      Submits the translated member {job} and returns once BPE has accepted it; parse.job_number reads the
      BPE job number from stdout. Legacy Sun MTP alternative: subjob $JOB -t j. The dataset and catalog
      entries submit their generated jobs with this same command and parse. env.py refuses this command,
      and every entry that reuses it, unless $MBMSUB, as the deployment's batchenv exported it, resolves
      (symlinks followed) to the deployment root or below: an unset, relative or outside value makes the
      entry unavailable under its own gap, checked on every run, and an MBMSUB that the operator's
      environment file exported is never used.

  bpe_sysout:
    action: list job output
    command: 'ls -1 "$PROJECT_ROOT/sysoutdir"'
    probe: 'test -d "$PROJECT_ROOT/sysoutdir"'
    timeout_s: 30
    gap: GAP-MIS-006
    status: unconfirmed
    source: https://docs.aws.amazon.com/m2/latest/userguide/tutorial-unikix-runtime.html
    parse:
      job_dir: '(?m)^(?P<entry>(?:[^\n]*[^0-9\n])?0*{job_number}(?:[^0-9\n][^\n]*)?)$'
      job_log: '(?i)(?:^|/)[^/]*(?:JESMSGLG|JESYSMSG|\.hst\b)[^/]*$'
      completed: '(?im)(?<![A-Z0-9@#$])(?P<job_name>[A-Z@#$][A-Z0-9@#$]*)[ \t]*[(.:#-]?[ \t]*(?:JOB)?0*(?P<job_number>[0-9]+)[)]?[ \t]+(?:job[ \t]+(?:ended|completed|terminated)|end[ \t]+of[ \t]+job)\b'
      step_rc: '(?im)\bstep\s*(?:name)?\s*[:=]?\s*(?<![A-Z0-9@#$])(?P<step>[A-Z@#$][A-Z0-9@#$]*(?:\.[A-Z@#$][A-Z0-9@#$]*)*)(?![A-Z0-9@#$]|\.[A-Z@#$]).*?\b(?:rc|cond(?:ition)?\s*code|return\s*code)\s*[:=]?\s*(?P<rc>[0-9]+)\b'
      step_abend: '(?im)\bstep\s*(?:name)?\s*[:=]?\s*(?<![A-Z0-9@#$])(?P<step>[A-Z@#$][A-Z0-9@#$]*(?:\.[A-Z@#$][A-Z0-9@#$]*)*)(?![A-Z0-9@#$]|\.[A-Z@#$]).*?\babend(?:ed)?\b\s*(?:code)?\s*[:=]?\s*(?P<code>[SU]?[0-9A-F]+)\b'
      step_skipped: '(?im)\bstep\s*(?:name)?\s*[:=]?\s*(?<![A-Z0-9@#$])(?P<step>[A-Z@#$][A-Z0-9@#$]*(?:\.[A-Z@#$][A-Z0-9@#$]*)*)(?![A-Z0-9@#$]|\.[A-Z@#$]).*?\b(?:not\s+(?:executed|run)|flushed|bypassed|skipped)\b'
      display_files: '*SYSOUT*'
      start_date: '(?i)\bstart(?:ed)?\b.*?(?P<date>[0-9][0-9][0-9][0-9][-/.][0-9][0-9][-/.][0-9][0-9])'
    notes: >-
      Completion, job number and step return codes are read from $PROJECT_ROOT/sysoutdir. job_dir matches the
      stdout line naming the directory or file of job {job_number}. bpe.py keeps a matched entry only when a
      digit run of its name, outside the names of the suite's jobs (resources.yaml JOB card and member names,
      generated members such as CDTL0042), equals {job_number} as a number: CDTL0042.00007 is job 7's, never
      job 42's. Digits of any other name count, so X42Y.00007 goes to jobs 42 and 7, and a format whose entry
      names hold other numbers needs a narrower job_dir. completed, step_rc, step_abend,
      step_skipped and start_date are searched in that job's sysout files other than the display_files, the
      glob of the program SYSOUT DD files whose lines are the DISPLAY output: program output is application
      data, never scheduler status. job_log, searched in each sysout file's path relative to sysoutdir,
      selects the scheduler's job log, the job-control stream: JES-style JESMSGLG and JESYSMSG, and the job
      history file <jobname>-<jobnumber>.hst.<ddmonthyyyy>.<hh:mm> of Sun Mainframe Batch Manager 10.1, which
      BPE descends from (MBMSUB, MBM_LOCK_DIR); completed and start_date are searched only in the job_log
      files that are not display_files. completed is BPE's terminal event of the job and captures its
      identity in the named groups job_name (the JOB card name, compared without regard to case) and
      job_number (digits, compared as a number); a match completes the job only when at least one of them
      took part and each that did equals the job's, so neither another job's event nor text a program writes
      completes a job that is still running. step_skipped is BPE's record of a step it did not run (COND,
      flush); a listed step needs an outcome or this record unless an earlier step abended. start_date
      gives the BPE job start date recorded as the run date. The `step`
      group of step_rc, step_abend and step_skipped is the complete step identity with every dotted
      qualifier, as in STEP10.STEP01R.PRC001 (job step STEP10, procedure step STEP01R of TRANREPT, procedure
      step PRC001 of REPROC), never part of a longer name; bpe.py writes it unchanged into the
      `STEP <step> RC <nnnn>` and `STEP <step> ABEND` lines of messages, which use the step names of
      tests/adapters/gnucobol_batch/jobs.yaml and tests/adapters/unikix/resources.yaml. The sysout format is
      unconfirmed, so every regex is operator-adjustable.

  bpe_cancel:
    action: cancel an unfinished job
    command: null
    probe: 'false'
    timeout_s: 120
    gap: GAP-MIS-006
    status: unconfirmed
    source: none; no public source names a cancel command
    notes: >-
      Must cancel BPE job {job_number} of this node. Used after a timeout or failure, before quiescence is
      confirmed again, for every job not seen completed, including a submitted job whose number bpe.py
      found only through bpe_active_jobs.

  bpe_active_jobs:
    action: list unfinished jobs
    command: null
    probe: 'false'
    timeout_s: 60
    gap: GAP-MIS-004
    status: unconfirmed
    source: none; no public source names a job query
    parse:
      job: '(?im)^[ \t]*(?P<job_number>[0-9]+)[ \t]+(?P<name>[A-Z@#$][A-Z0-9@#$]*)'
    notes: >-
      Must list the unfinished BPE jobs of this node, one per line as parse.job reads them; empty or
      all-blank output means none, which is half of the quiescence check. Every non-blank line must be one
      job as parse.job reads it: any other line makes the whole listing unreadable, so quiescence is not
      confirmed and a submission whose job number could not be read stays unresolved. bpe.py also finds
      such a submission by the `name` group (its JOB card name or member) among the jobs listed with a
      higher number than the last one it identified, and cancels it with bpe_cancel; a job listed without
      a name leaves that identity unknown.

  # ---------------------------------------------------------------------------------------------------------
  # Datasets and catalog. Each entry submits a job that bpe.py generates from its template, through
  # bpe_translate and this entry's command (the bpe_submit command), and polls it through bpe_sysout. Every
  # job runs only while the region files are closed. Test datasets are CDTEST.STAGE.{qualifier} and
  # CDTEST.UNLOAD.{qualifier}, the qualifier coming from resources.yaml.
  # ---------------------------------------------------------------------------------------------------------
  dataset_define_staging:
    action: catalogue the test staging and unload datasets
    command: *bpe_submit_command
    probe: *bpe_submit_probe
    timeout_s: 120
    gap: GAP-MIS-007
    status: unconfirmed
    source: zip migrated_app/jcl/MFCATLG1 STEP01
    parse:
      job_number: *bpe_job_number_regex
      path: '$SEQFILES/{dsn}'
    template:
      job: |
        //{job} JOB 'CARDDEMO TEST DEFINE',CLASS=A,MSGCLASS=0
        //*-------------------------------------------------------------------*
        //* GENERATED BY THE UNIKIX ADAPTER: CATALOGUE THE TEST DATASETS
        //*-------------------------------------------------------------------*
        //STEP01   EXEC PGM=IEFBR14
        //SYSOUT   DD  SYSOUT=*
        {dd_statements}
      dd: |
        //{ddname} DD  DSN={dsn},
        //             DISP=(NEW,CATLG,DELETE),
        //             DCB=(RECFM=FB,LRECL={lrecl},DSORG=PS)
    notes: >-
      Run once after deployment. {dd_statements} receives one dd fragment per dataset ({ddname} unique within
      the step, {lrecl} the record length): every CDTEST.STAGE.* and CDTEST.UNLOAD.* dataset, and
      AWS.M2.CARDDEMO.DATEPARM with LRECL 80, which no job or data file creates (GAP-MIS-001). parse.path is
      the path template (bash variables, then str.format) of the file where a catalogued dataset {dsn} lands,
      as BPECAT.nonvsam.csv records for the copy's own datasets.

  dataset_load:
    action: delete, define and load a cluster
    command: *bpe_submit_command
    probe: *bpe_submit_probe
    timeout_s: 120
    gap: GAP-MIS-007
    status: unconfirmed
    source: zip migrated_app/jcl/ACCTFILE STEP05-STEP15; migrated_app/jcl/CARDFILE STEP05, STEP40-STEP60
    parse:
      job_number: *bpe_job_number_regex
    template:
      job: |
        //{job} JOB 'CARDDEMO TEST LOAD',CLASS=A,MSGCLASS=0
        //* *******************************************************************
        //* GENERATED BY THE UNIKIX ADAPTER: DELETE, DEFINE AND LOAD A CLUSTER
        //* *******************************************************************
        //STEP05 EXEC PGM=IDCAMS
        //SYSPRINT DD   SYSOUT=*
        //SYSIN    DD   *
           DELETE {cluster_dsn} -
                  CLUSTER
           IF MAXCC LE 08 THEN SET MAXCC = 0
        {aix_delete_statements}
        /*
        //STEP10 EXEC PGM=IDCAMS
        //SYSPRINT DD   SYSOUT=*
        //SYSIN    DD   *
        {define_statements}
        /*
        //STEP15 EXEC PGM=IDCAMS
        //SYSPRINT DD   SYSOUT=*
        //FILEIN   DD DISP=SHR,
        //         DSN=CDTEST.STAGE.{qualifier}
        //FILEOUT  DD DISP=SHR,
        //         DSN={cluster_dsn}
        //SYSIN    DD   *
           REPRO INFILE(FILEIN) OUTFILE(FILEOUT)
        /*
        {aix_step}
      aix_delete: &aix_delete_fragment |2
           DELETE {aix_dsn} -
                  ALTERNATEINDEX
           IF MAXCC LE 08 THEN SET MAXCC = 0
      aix_step: &aix_step_fragment |
        //STEP20 EXEC PGM=IDCAMS
        //SYSPRINT DD   SYSOUT=*
        //SYSIN    DD   *
        {aix_statements}
        /*
    notes: >-
      Slots: {cluster_dsn} and {qualifier} of the cluster; {define_statements}, the DEFINE CLUSTER statements
      copied verbatim from the cluster's load model member in resources.yaml; {aix_delete_statements}, one
      aix_delete fragment per alternate index ({aix_dsn}); {aix_step}, the aix_step fragment for a cluster
      with alternate indexes, whose {aix_statements} are the member's DEFINE ALTERNATEINDEX, DEFINE PATH and
      BLDINDEX statements, and '' otherwise. The copy's SDSF steps are never included. Step return codes
      above 4 after the MAXCC reset mean the load failed.

  dataset_empty:
    action: delete and define an empty cluster
    command: *bpe_submit_command
    probe: *bpe_submit_probe
    timeout_s: 120
    gap: GAP-MIS-007
    status: unconfirmed
    source: zip migrated_app/jcl/ACCTFILE STEP05-STEP10; migrated_app/jcl/CARDFILE STEP05, STEP40-STEP50
    parse:
      job_number: *bpe_job_number_regex
    template:
      job: |
        //{job} JOB 'CARDDEMO TEST EMPTY',CLASS=A,MSGCLASS=0
        //* *******************************************************************
        //* GENERATED BY THE UNIKIX ADAPTER: DELETE AND DEFINE AN EMPTY CLUSTER
        //* *******************************************************************
        //STEP05 EXEC PGM=IDCAMS
        //SYSPRINT DD   SYSOUT=*
        //SYSIN    DD   *
           DELETE {cluster_dsn} -
                  CLUSTER
           IF MAXCC LE 08 THEN SET MAXCC = 0
        {aix_delete_statements}
        /*
        //STEP10 EXEC PGM=IDCAMS
        //SYSPRINT DD   SYSOUT=*
        //SYSIN    DD   *
        {define_statements}
        /*
        {aix_step}
      aix_delete: *aix_delete_fragment
      aix_step: *aix_step_fragment
    notes: >-
      The dataset_load job without its REPRO step. Slots as for dataset_load, except that {aix_statements}
      holds only the DEFINE ALTERNATEINDEX and DEFINE PATH statements: no BLDINDEX runs over an empty base.
      Used for every cluster a scenario's preconditions do not name.

  dataset_delete:
    action: delete datasets
    command: *bpe_submit_command
    probe: *bpe_submit_probe
    timeout_s: 120
    gap: GAP-MIS-007
    status: unconfirmed
    source: zip migrated_app/jcl/ACCTFILE STEP05; migrated_app/jcl/TRANBKP STEP05
    parse:
      job_number: *bpe_job_number_regex
    template:
      job: |
        //{job} JOB 'CARDDEMO TEST DELETE',CLASS=A,MSGCLASS=0
        //* *******************************************************************
        //* GENERATED BY THE UNIKIX ADAPTER: DELETE DATASETS
        //* *******************************************************************
        //STEP05 EXEC PGM=IDCAMS
        //SYSPRINT DD   SYSOUT=*
        //SYSIN    DD   *
        {delete_statements}
        /*
      delete: &delete_fragment |2
           DELETE {dsn} -
                  {entry_type}
           IF MAXCC LE 08 THEN SET MAXCC = 0
    notes: >-
      Leaves a dataset out for a batch open fault with condition unavailable. {delete_statements} receives one
      delete fragment per catalog entry, {entry_type} being CLUSTER, ALTERNATEINDEX, PATH, NONVSAM or
      GENERATIONDATAGROUP; a cluster with alternate indexes is deleted with its ALTERNATEINDEX entries, as
      the copy's TRANBKP does.

  dataset_unload:
    action: unload a dataset to its unload file
    command: *bpe_submit_command
    probe: *bpe_submit_probe
    timeout_s: 120
    gap: GAP-MIS-007
    status: unconfirmed
    source: zip migrated_app/proc/REPROC, migrated_app/ctl/REPROCT, migrated_app/jcl/TRANBKP STEP05R
    parse:
      job_number: *bpe_job_number_regex
      path: '$SEQFILES/{dsn}'
    template:
      job: |
        //{job} JOB 'CARDDEMO TEST UNLOAD',CLASS=A,MSGCLASS=0
        //* *******************************************************************
        //* GENERATED BY THE UNIKIX ADAPTER: UNLOAD A DATASET THROUGH REPROC
        //* *******************************************************************
        //JOBLIB JCLLIB ORDER=('AWS.M2.CARDDEMO.PROC')
        //STEP01 EXEC PROC=REPROC,
        //            CNTLLIB='AWS.M2.CARDDEMO.CNTL'
        //PRC001.FILEIN  DD DISP=SHR,
        //        DSN={source_dsn}
        //PRC001.FILEOUT DD DISP=OLD,
        //        DSN=CDTEST.UNLOAD.{qualifier}
    notes: >-
      {source_dsn} is the cluster DSN (records in primary-key order), a non-VSAM DSN, {base}(0) for the newest
      generation of a GDG, or an AIX PATH DSN, which gives alternate-key order. The unload lands in the file
      parse.path gives for {dsn} = CDTEST.UNLOAD.{qualifier}.

  # The generation job is a template of its own so that every JCL the adapter submits is kept in this file;
  # bpe.py creates GDG preconditions (for example TRANSACT-BKUP and SYSTRAN for COMBTRAN) through it.
  dataset_create_generation:
    action: create a new generation of a GDG from staged records
    command: *bpe_submit_command
    probe: *bpe_submit_probe
    timeout_s: 120
    gap: GAP-MIS-007
    status: unconfirmed
    source: zip migrated_app/jcl/TRANBKP STEP05R, migrated_app/proc/REPROC, migrated_app/ctl/REPROCT
    parse:
      job_number: *bpe_job_number_regex
    template:
      job: |
        //{job} JOB 'CARDDEMO TEST GENERATION',CLASS=A,MSGCLASS=0
        //* *******************************************************************
        //* GENERATED BY THE UNIKIX ADAPTER: NEW GDG GENERATION THROUGH REPROC
        //* *******************************************************************
        //JOBLIB JCLLIB ORDER=('AWS.M2.CARDDEMO.PROC')
        //STEP01 EXEC PROC=REPROC,
        //            CNTLLIB='AWS.M2.CARDDEMO.CNTL'
        //PRC001.FILEIN  DD DISP=SHR,
        //        DSN=CDTEST.STAGE.{qualifier}
        //PRC001.FILEOUT DD DISP=(NEW,CATLG,DELETE),
        //        DCB=(LRECL={lrecl},RECFM=FB),
        //        DSN={base}(+1)
    notes: >-
      {base} is the GDG base DSN, {lrecl} its record length and {qualifier} the staging qualifier of the
      records bpe.py wrote. A precondition GDG dataset is created as a new generation (+1), so the job under
      test reads it as (0).

  catalog_list:
    action: list the CardDemo catalog
    command: *bpe_submit_command
    probe: *bpe_submit_probe
    timeout_s: 120
    gap: GAP-MIS-007
    status: unconfirmed
    source: app/catlg/LISTCAT.txt:1-5 (the LISTCAT command and its output format)
    parse:
      job_number: *bpe_job_number_regex
      listing_files: '*SYSPRINT*'
      entry: '(?m)^[ 01-]?(?P<type>CLUSTER|DATA|INDEX|AIX|PATH|GDG|NONVSAM)(?: BASE)? -+ (?P<name>[A-Z0-9@#$][A-Z0-9@#$.-]*)'
      generation: '\.(?P<generation>G[0-9][0-9][0-9][0-9]V[0-9][0-9])$'
    template:
      job: |
        //{job} JOB 'CARDDEMO TEST LISTCAT',CLASS=A,MSGCLASS=0
        //* *******************************************************************
        //* GENERATED BY THE UNIKIX ADAPTER: LIST THE CARDDEMO CATALOG
        //* *******************************************************************
        //STEP01 EXEC PGM=IDCAMS
        //SYSPRINT DD   SYSOUT=*
        //SYSIN    DD   *
            LISTCAT LEVEL(AWS)  -
                    ALL
        /*
    notes: >-
      listing_files is the glob of the job's SYSPRINT files in its sysout directory. parse.entry reads one
      top-level catalog entry per line (a GDG BASE entry reports type GDG; the indented associations are not
      matched), and parse.generation finds the generation number in an entry name. Produces @CATALOG and the
      post-deployment snapshot. The level is AWS rather than the AWS.M2.CARDDEMO of app/catlg/LISTCAT.txt
      because DEFCUST deletes AWS.CCDA.CUSTDATA.CLUSTER and defines AWS.CUSTDATA.CLUSTER (GAP-DEF-009), which
      @CATALOG must show and the reset must remove; the test-owned node catalogues no other AWS names, and
      bpe.py leaves the CDTEST test datasets out.

  catalog_reset:
    action: restore the catalog to the post-deployment snapshot
    command: null
    probe: 'false'
    timeout_s: 600
    gap: GAP-MIS-007
    status: unconfirmed
    source: none; no public source names a catalog restore. Fallback modeled on the copy's jcl/DEFGDGB
    template:
      job: |
        //{job} JOB 'CARDDEMO TEST RESET',CLASS=A,MSGCLASS=0
        //* *******************************************************************
        //* GENERATED BY THE UNIKIX ADAPTER: RESTORE THE CATALOG SNAPSHOT
        //* *******************************************************************
        //STEP05 EXEC PGM=IDCAMS
        //SYSPRINT DD   SYSOUT=*
        //SYSIN    DD   *
        {delete_statements}
        {define_gdg_statements}
        /*
      delete: *delete_fragment
      define_gdg: |2
           DEFINE GENERATIONDATAGROUP -
           (NAME({base}) -
            LIMIT({limit}) -
            SCRATCH -
           )
           IF LASTCC=12 THEN SET MAXCC=0
    notes: >-
      Must restore the catalog and the GDG generations to the snapshot taken after deployment. While the
      command is unavailable, bpe.py submits the template instead, through bpe_submit: one delete fragment for
      every catalog_list entry the snapshot lacks (GDG generations first) and one define_gdg fragment for
      every snapshot GDG base that is missing ({limit} 5, as in BPECAT.gdg_base.csv), then lists the catalog
      again; any remaining difference means the reset is not confirmed.

  # ---------------------------------------------------------------------------------------------------------
  # Region files, TDQ JOBS, JOBS capture and clock. SDSF.cbl in the copy only displays
  # 'DUMMY PROGRAM FOR SDSF' (GAP-DOC-031), so CLOSEFIL, OPENFIL and the SDSF steps of CARDFILE, CUSTFILE and
  # TRANFILE are never used for region control; these entries are the CEMT equivalents the adapter needs.
  # ---------------------------------------------------------------------------------------------------------
  region_file_close:
    action: close a region file
    command: null
    probe: 'false'
    timeout_s: 60
    gap: GAP-MIS-011
    status: unconfirmed
    source: none; no public source names a CEMT SET FILE equivalent
    notes: >-
      Must close region file {file} (an fct.lst name), as CEMT SET FIL({file}) CLO does. Fallback while
      unavailable: region_stop.

  region_file_open:
    action: open a region file
    command: null
    probe: 'false'
    timeout_s: 60
    gap: GAP-MIS-011
    status: unconfirmed
    source: none; no public source names a CEMT SET FILE equivalent
    notes: >-
      Must open region file {file}, as CEMT SET FIL({file}) OPE does. Fallback while unavailable:
      region_start.

  region_file_disable:
    action: disable a region file
    command: null
    probe: 'false'
    timeout_s: 60
    gap: GAP-MIS-011
    status: unconfirmed
    source: none; no public source names a CEMT SET FILE equivalent
    notes: >-
      Must disable region file {file}, as CEMT SET FIL({file}) DIS does. Applied between steps for the online
      cases with condition unavailable. While it is unavailable, region_file_close stands in, so the file is
      closed (NOTOPEN) rather than disabled; only when neither entry is available do those cases stay
      implemented-unexecuted under GAP-MIS-011.

  region_file_enable:
    action: enable a region file
    command: null
    probe: 'false'
    timeout_s: 60
    gap: GAP-MIS-011
    status: unconfirmed
    source: none; no public source names a CEMT SET FILE equivalent
    notes: >-
      Must enable region file {file}, as CEMT SET FIL({file}) ENA does. Part of the reset before every
      scenario.

  region_file_inquire:
    action: inquire the region files
    command: null
    probe: 'false'
    timeout_s: 60
    gap: GAP-MIS-011
    status: unconfirmed
    source: none; no public source names a CEMT INQUIRE FILE equivalent
    parse:
      file: '(?im)\bFil\(\s*(?P<name>[A-Z0-9@#$]+)\s*\).*?\b(?P<open>Ope|Clo)[a-z]*\b.*?\b(?P<enabled>Ena|Dis|Une)[a-z]*\b'
    notes: >-
      Must print one line per region file, which parse.file reads, as CEMT INQUIRE FILE shows it
      (Fil(ACCTDAT ) Vsa Ope Ena ...). Values compare case-insensitively: open Ope means open and Clo closed;
      enabled Ena means enabled, Dis or Une disabled. Produces @REGION-FILES for the 14 fct.lst files.

  region_file_requests:
    action: count the requests a region file has served
    command: null
    probe: 'false'
    timeout_s: 60
    gap: GAP-MIS-011
    status: unconfirmed
    source: none; no public source names a CICS file statistics equivalent
    parse:
      count: '(?im)^[ \t]*requests[ \t]+(?P<count>[0-9]+)[ \t]*$'
    notes: >-
      Must print the number of {operation} requests region file {file} has served, on one line that parse.count
      reads (requests <n>): a count that only grows while the region runs, since the adapter uses differences.
      read counts READ (with or without UPDATE), STARTBR, READNEXT and READPREV; write counts WRITE; rewrite
      counts REWRITE; ENDBR, RESETBR and UNLOCK are not counted. Used to place an online `unavailable` fault
      whose `after` is 1 or more: the adapter reads the count before each step until the fault is applied, and
      applies it before the first step at whose start {file} has served `after` such requests since the first
      step began. Output in which parse.count does not find exactly one count, or a count lower than before the
      first step, blocks GAP-MIS-011. Without it such a case stays implemented-unexecuted.

  tdq_empty:
    action: empty a transient data queue
    command: null
    probe: 'false'
    timeout_s: 60
    gap: GAP-MIS-011
    status: unconfirmed
    source: none; no public source names a TDQ control command
    notes: >-
      Must remove every record of queue {queue}, which is JOBS (dct.lst: ED,JOBS,,,,JOB           ,80,Y,O).
      Part of the reset before every scenario; fallback while unavailable: a region restart.

  tdq_enable:
    action: enable a transient data queue
    command: null
    probe: 'false'
    timeout_s: 60
    gap: GAP-MIS-011
    status: unconfirmed
    source: none; no public source names a TDQ control command
    notes: >-
      Must enable queue {queue} (JOBS), as CEMT SET TDQ({queue}) ENA does. Part of the reset before every
      scenario.

  tdq_disable:
    action: disable a transient data queue
    command: null
    probe: 'false'
    timeout_s: 60
    gap: GAP-MIS-011
    status: unconfirmed
    source: none; no public source names a TDQ control command
    notes: >-
      Must disable queue {queue} (JOBS), as CEMT SET TDQ({queue}) DIS does, for the online case 'Unable to
      Write TDQ (JOBS)...'; without it that case stays implemented-unexecuted.

  jobs_capture:
    action: capture the jobs the region submitted through JOBS
    command: null
    probe: 'false'
    timeout_s: 60
    gap: GAP-MIS-017
    status: unconfirmed
    source: none; no public source names a way to read the jobs a region submits
    parse:
      job: '(?im)^[ \t]*(?P<job_number>[0-9]+)[ \t]+(?P<name>[A-Z@#$][A-Z0-9@#$]*)[ \t]+(?P<submitted>[0-9]+[-/.][0-9]+[-/.][0-9]+[ T][0-9:.]+)'
    notes: >-
      Given an empty {job_number}, must list the jobs BPE received, among them those the region submitted
      through JOBS; given a job number, must print that job's JCL as submitted. Every nonblank line of the
      listing is one job, read by parse.job from the line's start (job number, job name, submission time;
      further columns may follow). Any other nonblank line, or a job number listed twice, blocks GAP-MIS-017;
      blank output lists no job. The submission time is when the region submitted the job, in this host's
      local time, cut (not rounded) to the precision shown: seconds at least, preferably a fraction, so that a
      job can be placed within the steps. A job whose listed time unit reaches across the instant the first
      step began or the last step ended blocks GAP-MIS-017. The adapter lists the jobs just before the first
      step and attributes only TRNRPT00 jobs absent from that listing whose listed time unit lies wholly
      within the steps; their 80-byte records are @TDQ:JOBS.

  clock_set:
    action: set the UniKix clock
    command: null
    probe: 'false'
    timeout_s: 60
    gap: GAP-MIS-015
    status: unconfirmed
    source: none; no public source names a way to set the UniKix clock
    notes: >-
      Would set the date and time seen by the region and BPE jobs to {clock}. Used only when confirmed;
      until then every scenario with clock_mode fixed (BAT-CHAIN-normal-01 among them) is blocked on unikix.

  # ---------------------------------------------------------------------------------------------------------
  # Version probes. environment.yaml records what each reports as bounded diagnostic text, not verbatim
  # output: stdout and stderr combined, a non-zero exit prefixed "exit status <rc>", JVM options other than
  # the owned temporary settings shown as <redacted>, cut at 64 KiB. Installation paths as in zip
  # bin/carddemo.env.
  # The flag forms are unconfirmed; a failing probe or command is recorded as text, never raised, and a
  # command that exits 0 and prints nothing as "no output: <id> exited 0 and printed nothing", which names
  # no version. report.py --import-unikix closes GAP-MIS-009 only once each of these entries is
  # status: confirmed.
  # ---------------------------------------------------------------------------------------------------------
  version_tpe:
    action: record the TPE installation
    command: 'ls -1 "$UNIKIX" && (kixregion -version 2>&1 || true)'
    probe: 'test -d "$UNIKIX"'
    timeout_s: 30
    gap: GAP-MIS-009
    status: unconfirmed
    source: zip bin/carddemo.env:14 (UNIKIX=/opt/software/TPE)
    notes: >-
      Lists the TPE installation directory and asks kixregion for its version; the flag form is
      unconfirmed. What it prints is recorded as bounded diagnostic text (stdout and stderr combined, a
      non-zero exit prefixed "exit status <rc>", no output as the no-output text, JVM options other than the
      owned temporary settings redacted, cut at 64 KiB).

  version_bpe:
    action: record the BPE installation
    command: 'ls -1 "$INSTEBM"'
    probe: 'test -d "$INSTEBM"'
    timeout_s: 30
    gap: GAP-MIS-009
    status: unconfirmed
    source: zip bin/carddemo.env:20 (INSTEBM=/opt/software/BPE/INSTEBM)
    notes: >-
      No version command is known; the directory listing is recorded as bounded diagnostic text (stdout
      and stderr combined, a non-zero exit prefixed "exit status <rc>", an empty listing as the no-output
      text, JVM options other than the owned temporary settings redacted, cut at 64 KiB).

  version_vcobol:
    action: record the Visual COBOL installation
    command: '(cob -V 2>&1 || vcc -V 2>&1 || ls -1 "$VCOBOL")'
    probe: 'test -d "$VCOBOL"'
    timeout_s: 30
    gap: GAP-MIS-009
    status: unconfirmed
    source: zip bin/carddemo.env:27 (VCOBOL=/opt/software/COBOL)
    notes: >-
      Tries the compiler version flags, then falls back to the directory listing; the flag forms are
      unconfirmed. What it prints is recorded as bounded diagnostic text (stdout and stderr combined, a
      non-zero exit prefixed "exit status <rc>", no output as the no-output text, JVM options other than the
      owned temporary settings redacted, cut at 64 KiB).

  version_java:
    action: record the Java runtime
    command: '"$JAVA_HOME/bin/java" -version 2>&1'
    probe: 'test -x "$JAVA_HOME/bin/java"'
    timeout_s: 30
    gap: GAP-MIS-009
    status: unconfirmed
    source: zip bin/carddemo.env:32 (JAVA_HOME from /etc/alternatives/java)
    notes: >-
      What it prints is recorded as bounded diagnostic text (stdout and stderr combined, a non-zero exit
      prefixed "exit status <rc>", no output as the no-output text, JVM options other than the owned
      temporary settings redacted, so the JVM's own "Picked up" lines show only those, cut at 64 KiB).

  version_licence:
    action: record the UniKix licence directory
    command: 'ls -l "$KIXLICDIR"'
    probe: 'test -d "$KIXLICDIR"'
    timeout_s: 30
    gap: GAP-MIS-009
    status: unconfirmed
    source: zip bin/carddemo.env:11 (KIXLICDIR=/opt/unikix)
    notes: >-
