# ADMIN001 signs on and COSGN00C routes the administrator to the admin menu.
# Transaction CC00 entered on a cleared screen starts COSGN00C with no
# COMMAREA, so it sends the COSGN00 sign-on map [app/cbl/COSGN00C.cbl:80-83];
# the step's fields are entered there and ENTER is pressed. COSGN00C reads
# USRSEC by the upper-cased user id, finds ADMIN001 with password PASSWORD and
# user type A (the first in-stream user of DUSRSECJ [app/jcl/DUSRSECJ.jcl:35]),
# and, because CDEMO-USRTYP-ADMIN holds, transfers control to COADM01C with
# CDEMO-PGM-CONTEXT 0 [app/cbl/COSGN00C.cbl:209-234] [app/cpy/COCOM01Y.cpy:26-31].
# On that first entry COADM01C clears its output map and sends COADM01 with
# ERASE [app/cbl/COADM01C.cbl:82-90,172-184]:
# - TRNNAME and PGMNAME are its own CA00 and COADM01C, TITLE01 and TITLE02 the
#   COTTL01Y titles, CURDATE mm/dd/yy and CURTIME hh:mm:ss from the run clock
#   through CSDAT01Y [app/cbl/COADM01C.cbl:202-221] [app/cpy/COTTL01Y.cpy:17-22];
# - OPTN001-OPTN004 are '<nn>. <35-character option name>' strung into the
#   40-byte WS-ADMIN-OPT-TXT from the four COADM02Y entries, and OPTN005-OPTN012
#   stay blank because CDEMO-ADMIN-OPT-COUNT is 4 [app/cbl/COADM01C.cbl:226-263]
#   [app/cpy/COADM02Y.cpy:20-42];
# - ERRMSG is blank, since WS-MESSAGE stays spaces, and the OPTION entry field
#   is empty [app/cbl/COADM01C.cbl:79-80,177].
# Expected text values are full field width with their trailing spaces. The
# clock-derived CURDATE and CURTIME are matchers, so the clock is relative.
id: SEC-COSGN00C-normal-01
level: e2e
type: normal
description: >-
  ADMIN001 signs on with password PASSWORD through CC00; COSGN00C reads the
  type-A user from USRSEC and transfers to COADM01C, which shows the admin menu
  COADM01 (transaction CA00) with its four user-security options and no message.
inventory_ids:
- INV-SEC-010  # COSGN00C sign-on routing to COADM01C (rule)
- INV-SEC-001  # COSGN00C program
- INV-SEC-002  # COSGN00 map, the input map of the sign-on step
- INV-MNU-004  # COADM01 map, the screen the routing lands on
- INV-CFG-016  # CC00 transaction, the one the step enters
- INV-CFG-008  # USRSEC CSD file, read by user id
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA carrying the user type
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the screen date and time
- INV-LAY-008  # CSMSG01Y copybook, copied by COSGN00C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-002  # derived SEC end-to-end baselines, never observed on a TPE region
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    USRSEC:
      base: USRSEC
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    '@map': COSGN00
    fields:
      USERID: ADMIN001
      PASSWD: PASSWORD
    aid: ENTER
expected:
  screens:
  - '@map': COADM01
    TRNNAME: 'CA00'
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: 'COADM01C'
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    OPTN001: '01. User List (Security)                '
    OPTN002: '02. User Add (Security)                 '
    OPTN003: '03. User Update (Security)              '
    OPTN004: '04. User Delete (Security)              '
    OPTN005: '                                        '
    OPTN006: '                                        '
    OPTN007: '                                        '
    OPTN008: '                                        '
    OPTN009: '                                        '
    OPTN010: '                                        '
    OPTN011: '                                        '
    OPTN012: '                                        '
    OPTION: '  '
    ERRMSG: '                                                                              '
  messages:
  - '                                                                              '
