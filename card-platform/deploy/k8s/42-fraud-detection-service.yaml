# Deployment and Service for the fraud detection service. The service reads
# transaction.authorized under the consumer group fraud-detection and writes
# fraud.assessed. The authorization path never calls this service.
#
# The listener, the risk rules and the outbox relay this manifest configures
# are planned and unauthored, so the container starts and answers /actuator
# only.
#
# Rationale for every choice in this folder: card-platform/docs/decision-log.md (planned)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection-service
  namespace: carddemo
  labels:
    app.kubernetes.io/name: fraud-detection-service
    app.kubernetes.io/component: fraud-detection
    app.kubernetes.io/part-of: card-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-detection-service
      app.kubernetes.io/part-of: card-platform
  template:
    metadata:
      labels:
        # The name below is what the network policies in 10-kafka.yaml and
        # 20-postgres.yaml admit. Both name the six services one by one and do
        # not match the part-of label. A Pod that merely belongs to this
        # platform reaches neither the broker nor the database.
        app.kubernetes.io/name: fraud-detection-service
        app.kubernetes.io/component: fraud-detection
        app.kubernetes.io/part-of: card-platform
    spec:
      automountServiceAccountToken: false
      # Account 10001 owns /app in the image. 00-namespace.yaml refuses root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # The mounted keystore, truststore and certificate authority arrive
        # owned by root. fsGroup gives group 10001 read access to them, which
        # is how the runtime opens a file it may not write.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fraud-detection-service
          # Built from card-platform/services/fraud-detection-service/Dockerfile, and named
          # by an explicit tag, as all six platform images in this folder are.
          # 40-authorization-service.yaml states the whole policy once, including why the
          # two upstream images are digest-pinned and these six are not.
          #
          # card-platform/docker-compose.yml builds the same image from the same module
          # directory and names no image, because compose builds and a cluster does not.
          # Build and load it before applying this file:
          #
          #   mvn -f card-platform/pom.xml -pl services/fraud-detection-service -am package
          #   docker build -f card-platform/services/fraud-detection-service/Dockerfile \
          #     -t carddemo/fraud-detection-service:1.0.0 \
          #     card-platform/services/fraud-detection-service
          image: carddemo/fraud-detection-service:1.0.0
          # The kubelet pulls only when no image of this tag is on the node.
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # The image writes nothing under / after start: /app holds the
            # extracted application layers and nothing else, and the Dockerfile
            # pins TMPDIR and java.io.tmpdir to /tmp. The one writable path is
            # the volume below.
            readOnlyRootFilesystem: true
          ports:
            # 8080 carries the Representational State Transfer (REST) surface,
            # and the Service below targets it. 9080 carries /actuator and
            # matches MANAGEMENT_PORT in 30-configmap.yaml. No Service exposes
            # 9080, so a container port here is reach for the kubelet and for a
            # monitoring collector, not for the cluster. Both ports are
            # encrypted, because 30-configmap.yaml sets SERVER_SSL_ENABLED and
            # MANAGEMENT_SSL_ENABLED.
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9080
          envFrom:
            # Broker address, topic names, consumer group names, service
            # addresses, log levels, the three request-identity usernames and
            # the transport settings. No credential appears there.
            - configMapRef:
                name: carddemo-config
            # This service's own two credentials: the password of its database
            # login and the password of its broker identity. Two keys, and no
            # other service reads this Secret. The login owns carddemo_fraud
            # and can connect to no other database.
            - secretRef:
                name: carddemo-fraud-secret
            # The three request-identity password hashes, shared by all six
            # services. app/csd/CARDDEMO.CSD defines one USRSEC dataset that the
            # whole region reads.
            - secretRef:
                name: carddemo-identity-secret
          env:
            # The schema and the login this service owns. 30-configmap.yaml
            # holds one schema key and one login key per service. envFrom above
            # pulls the whole ConfigMap, so each Deployment names the two keys
            # it owns and reads no other service's schema.
            - name: SPRING_FLYWAY_SCHEMAS
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: FRAUD_DB_SCHEMA
            - name: SPRING_FLYWAY_DEFAULT_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: FRAUD_DB_SCHEMA
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: FRAUD_DB_SCHEMA
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: FRAUD_DB_USER
            # The datasource address this service owns, assembled here and not
            # shared. The five values below are declared in this env list and
            # not merely pulled in by envFrom, because $(VAR) expansion reads
            # this list alone. 30-configmap.yaml carries a
            # SPRING_DATASOURCE_OPTIONS suffix and no database name, so each
            # Deployment names the one database it owns.
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: POSTGRES_PORT
            - name: FRAUD_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: FRAUD_DB_NAME
            - name: FRAUD_DB_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: FRAUD_DB_SCHEMA
            - name: SPRING_DATASOURCE_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: SPRING_DATASOURCE_OPTIONS
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/$(FRAUD_DB_NAME)?currentSchema=$(FRAUD_DB_SCHEMA)&$(SPRING_DATASOURCE_OPTIONS)"
            # The consumer group this service reads under. GROUP_LEDGER_POSTING
            # in 30-configmap.yaml names a different group, and two groups
            # reading one topic each receive every event. One shared group
            # would split the partitions, and part of the traffic would never
            # be scored.
            - name: SPRING_KAFKA_CONSUMER_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: GROUP_FRAUD_DETECTION
            # This service's own broker identity. The entries the broker
            # installs for it cover reading transaction.authorized under the
            # group above and writing fraud.assessed. An entry naming another
            # service's topic or group is absent.
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: FRAUD_KAFKA_USER
            # The two passwords that open the mounted transport material. Both
            # live in carddemo-tls-secret beside the files themselves. Both are
            # named here and not pulled with envFrom, because that Secret also
            # carries keys whose names are file names. A file name is not a
            # valid environment variable name.
            - name: SERVER_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carddemo-tls-secret
                  key: SERVER_SSL_KEYSTORE_PASSWORD
            - name: SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carddemo-tls-secret
                  key: KAFKA_SSL_TRUSTSTORE_PASSWORD
          # Both probes read /actuator/health on the management port over
          # HTTPS, because 30-configmap.yaml encrypts that port too. Port 8080
          # answers no management request. Readiness allows time for the Flyway
          # migration this service runs at startup.
          #
          # The kubelet does not verify the certificate a probe receives. No
          # truststore can be given to the kubelet.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness asks only whether the Java virtual machine is still
          # working. The liveness group reports process state and excludes
          # every external dependency. A database outage therefore withdraws
          # this Pod from its Service and leaves a working process alone.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
              scheme: HTTPS
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          # The image caps the heap at 75 percent of the limit below.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            # The one writable path, capped so a runaway write fills 64
            # mebibytes of memory and not a node's disk.
            # card-platform/docker-compose.yml mounts a tmpfs of the same size
            # at the same place.
            - name: tmp
              mountPath: /tmp
            # Keystore, truststore and certificate authority, read-only. The
            # keystore is what this service presents on both ports. The
            # truststore is what it verifies the broker against. The database
            # driver verifies the server against the authority under
            # sslmode=verify-full.
            - name: transport-security
              mountPath: /etc/carddemo/tls
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: transport-security
          secret:
            secretName: carddemo-tls-secret
            defaultMode: 0640
            items:
              - key: keystore.p12
                path: keystore.p12
              - key: truststore.p12
                path: truststore.p12
              - key: ca.crt
                path: ca.crt
---
# Pods reach this service at fraud-detection-service:8080, a short name the
# Domain Name System (DNS) resolves. The port carries the read-only assessment
# history, which no other service on this platform reads.
#
# The management port is absent here: a Service address is what every pod in
# the cluster resolves, and /actuator answers on 9080. A monitoring collector
# reaches 9080 by pod address.
apiVersion: v1
kind: Service
metadata:
  name: fraud-detection-service
  namespace: carddemo
  labels:
    app.kubernetes.io/name: fraud-detection-service
    app.kubernetes.io/component: fraud-detection
    app.kubernetes.io/part-of: card-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fraud-detection-service
    app.kubernetes.io/part-of: card-platform
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
# Who may reach the fraud detection pod, at the network layer.
#
# This service must never sit in the authorization response path, and this policy is
# where that is expressed at the network layer: nothing calls it to score a
# transaction. It reads transaction.authorized and publishes fraud.assessed, so the
# only inbound traffic it expects is the read-only assessment lookup on 8080 and a
# metrics scrape on 9080.
#
# The request layer already answers both: config/SecurityConfig authenticates every
# call to the lookup surface, and it leaves /actuator/health open for probes while
# requiring ROLE_MONITORING for metrics and the Prometheus scrape, so an anonymous
# caller receives 401 and an identity holding a business role receives 403. This
# policy closes the same two gaps a second time, at the network rather than the
# request layer. 40-authorization-service.yaml carries the same shape and the note on
# kubelet probes, which originate from the node and match neither selector below.
#
# A cluster whose Container Network Interface plug-in does not implement
# NetworkPolicy ignores this object. Confirm support before treating the service as
# isolated.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fraud-detection-service-ingress
  namespace: carddemo
  labels:
    app.kubernetes.io/name: fraud-detection-service
    app.kubernetes.io/component: fraud-detection
    app.kubernetes.io/part-of: card-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fraud-detection-service
      app.kubernetes.io/part-of: card-platform
  policyTypes:
    - Ingress
  ingress:
    # The assessment lookup surface. Any pod of this platform may call it, and Spring
    # Security authenticates every request that arrives.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: card-platform
      ports:
        - port: 8080
          protocol: TCP
    # The management surface. A monitoring collector carries the label below and
    # nothing else in this namespace does, so no business pod reaches this port.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: monitoring
      ports:
        - port: 9080
          protocol: TCP
