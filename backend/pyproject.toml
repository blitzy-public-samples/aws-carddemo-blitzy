# CardDemo Backend — project metadata and tooling configuration.
# Dependency pins mirror requirements.txt (AAP §0.6.1). Install/runtime uses requirements.txt.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carddemo-backend"
version = "0.1.0"
description = "CardDemo modernized backend — FastAPI REST API migrated from COBOL/CICS/VSAM."
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "email-validator==2.2.0",
    "sqlalchemy[asyncio]==2.0.36",
    "greenlet==3.5.3",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "PyJWT==2.10.1",
    "python-multipart==0.0.20",
    "typer==0.15.1",
    "reportlab==4.2.5",
    "Jinja2==3.1.6",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
