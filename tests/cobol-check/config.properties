#
# cobol-check 0.2.16 runtime configuration for CardDemo.
#
# This file tells cobol-check where to find production COBOL source,
# copybooks (production + test fixtures + stubs), testsuite .cut files,
# the GnuCOBOL compiler command, and the output directory for the
# merged binaries.
#
# The program-under-test is selected per invocation via the -p CLI
# argument (e.g., `java -jar cobol-check.jar -p CSUTLDTC`).  This file
# never names a single program; it stays generic so `make test` can
# iterate over every program in app/cbl/.
#
# All paths are relative to the repository root (the directory where
# the Makefile lives).  cobol-check resolves them after `cd`-ing to
# the path supplied via the -s/--source-context CLI flag, which the
# Makefile sets to $(REPO_ROOT).

# =====================================================================
# AAP / Blitzy schema-documented intent (Section 0.5.4).
# ---------------------------------------------------------------------
# The six keys in this section are the schema-required member names
# documented in tests/cobol-check/config.properties' file schema.  They
# capture the testing harness's intent in the prefixed namespace
# `cobolcheck.*`.  cobol-check 0.2.16 itself reads its configuration
# from the un-prefixed keys later in this file (`application.source.
# directory`, `gnucobol.compile.options`, etc.).  The two key sets
# carry the same values where they overlap so that either reader sees
# a consistent view.
# =====================================================================

#
# Where to find the production COBOL programs under test.
# All 28 *.cbl / *.CBL files in app/cbl/ are reachable from here.
# cobol-check resolves the program-under-test (named via -p) by
# searching this directory.
#
cobolcheck.application.source.directory = app/cbl

#
# Colon-separated copybook search path used when expanding COPY
# directives inside the merged testsuite + production source.
#
# Order:
#   1. app/cpy            -- production data-record / utility copybooks
#                            (CV*Y, CO*Y, CS*Y, CUSTREC, CSUTLDPY, ...)
#   2. app/cpy-bms        -- BMS map copybooks for CICS programs
#   3. tests/fixtures/cobol-snippets -- byte-exact fixture snippets
#                            (regenerated by `make fixtures` from
#                            app/data/ASCII/*.txt via
#                            tests/fixtures/load_fixture.py)
#   4. tests/stubs        -- test-helper copybooks
#                            (STUB-ABEND-FLAG.cpy, STUB-CEEDAYS-RC.cpy)
#
cobolcheck.application.copybook.directory = app/cpy:app/cpy-bms:tests/fixtures/cobol-snippets:tests/stubs

#
# Where the *.cut testsuite files live.  Per AAP Sections 0.5.1,
# 0.9.1, and 0.10.2 the canonical layout is FLAT:
#     tests/cobol-check/<PROGRAM-ID>.cut
# (one .cut file per program-under-test, drop the .cbl/.CBL suffix).
# README.md, CONTRIBUTING.md, and tests/README.md document the same
# convention; `make test` discovers programs by globbing
# tests/cobol-check/*.cut and using the basename as the program-id.
#
# cobol-check 0.2.16 itself, however, walks the configured suite
# directory looking for a per-program *sub-directory* and emits WRN001
# (silently running zero test cases) when no such sub-directory
# exists.  To bridge the AAP-mandated flat layout to cobol-check's
# directory expectation, the Makefile stages each flat .cut into an
# ephemeral nested-layout shadow tree at
#     target/cobol-check/suites/<PROGRAM>/<PROGRAM>.cut
# and writes a per-run copy of this config under
# target/cobol-check/config.properties whose test.suite.directory key
# points at that shadow tree.  Both target/ paths are .gitignore-
# excluded; the canonical config.properties (this file) keeps the
# AAP-documented value below for reference and for direct invocations
# of `java -jar cobol-check.jar` that bypass the Makefile and supply
# their own pre-staged nested layout under tests/cobol-check/.
#
cobolcheck.test.suite.directory = tests/cobol-check

#
# GnuCOBOL command used to compile the merged source.
#
# Flags:
#   -x                       -- produce an executable (cobol-check
#                               batch path; subprograms with USING
#                               clauses fall back to `cobc -m` per
#                               linux_gnucobol_run_tests).
#   -fixed                   -- fixed-format COBOL.  CardDemo's
#                               production .cbl files are fixed-format
#                               (Areas A and B at columns 8 and 12);
#                               cobol-check preserves that format when
#                               merging the testsuite into the source.
#   -fno-diagnostics-color   -- plain output for CI log parsing.
#   -I <dir>                 -- copybook search paths mirroring
#                               application.copybook.directory above.
#                               Both cobol-check's internal preprocessor
#                               and the spawned cobc compiler need these.
#
# NOTE: cobol-check 0.2.16 reads the actual compile options from the
# `gnucobol.compile.options` key further down (comma-separated form).
# This `cobolcheck.compiler.command` entry is the AAP-documented
# intent in shell-command form for human readers.
#
cobolcheck.compiler.command = cobc -x -fixed -fno-diagnostics-color -I app/cpy -I app/cpy-bms -I tests/fixtures/cobol-snippets -I tests/stubs

#
# Coverage instrumentation flag, appended to the compile command when
# `make coverage` is invoked.
#
# NOTE: cobol-check 0.2.16 has no built-in coverage key.  The Makefile
# `coverage` target instead exports COBC_OPTS=`$(COVERAGE_OPTS)` --
# which expands to `-O0 -A "-fprofile-arcs" -A "-ftest-coverage" -Q
# "-lgcov"` -- before invoking the runner.  This entry is the AAP-
# documented intent so reviewers know which flag class is in use.
#
cobolcheck.compiler.options.coverage = --coverage

#
# Where cobol-check writes the merged source artifacts and compiled
# binaries.  Mirrors the un-prefixed `cobolcheck.test.program.path`
# below, which is the key cobol-check 0.2.16 actually reads.
# `target/` is git-ignored (see .gitignore).
#
cobolcheck.output.directory = target/cobol-check

# =====================================================================
# cobol-check 0.2.16 active configuration (un-prefixed keys).
# ---------------------------------------------------------------------
# Everything below this banner is the configuration the cobol-check
# 0.2.16 JAR actually parses at run time.  Key names match the
# Constants.java table inside cobol-check-0.2.16.jar.  Do NOT rename
# these keys -- the JAR will silently fall back to its hard-coded
# defaults (which point at src/main/cobol/) and the harness will
# break.  Verified against the JAR's
# org.openmainframeproject.cobolcheck.services.Config class.
# =====================================================================

#
# Identifier for this configuration; echoed at run time for traceability.
# (Maps to cobol-check's "config.loaded" log line: INF006.)
#
config.loaded = aws-carddemo

#
# Prefix used for cobol-check's injected field- and paragraph-names.
# The CardDemo production code does not use the "UT-" prefix, so the
# framework default is safe.
#
cobolcheck.prefix = UT-

#
# Tags surrounding cobol-check's injected blocks.  Disabled (null) for
# clean merged source listings under target/cobol-check/.
#
cobolcheck.injectedCodeTag.start = null
cobolcheck.injectedCodeTag.end = null

#
# Tag prepended to default-stubbed entities.  null = no tag.
#
cobolcheck.stub.comment.tag = null

#
# CardDemo uses period-as-decimal-point throughout (US conventions);
# leave the framework default in place.
#
cobolcheck.decimalPointIsComma = false

#
# No PROCESS / CBL header-line manipulation is needed for the
# off-platform GnuCOBOL build.
#
cobolcheck.append.rules = null

#
# Where cobol-check writes the merged Cobol test program and the
# corresponding executable.  All build artifacts are isolated under
# target/cobol-check/ so that `make clean` removes them in one shot.
# This is the key cobol-check 0.2.16 actually reads (its prefixed
# alias `cobolcheck.output.directory` above is for schema documentation).
#
cobolcheck.test.program.path = target/cobol-check/

#
# Filename pattern for the MERGED test program produced by cobol-check.
# The `CC##99` placeholder is rewritten by cobol-check on every
# program-under-test invocation.  This key is NOT the program-under-
# test name (that comes from the -p CLI argument); it is the scratch
# filename pattern for the cobol-check output and is REQUIRED for the
# framework to construct a valid output path.
#
cobolcheck.test.program.name = CC##99.CBL

#
# Report unmocked CALLs so reviewers immediately see when a test fails
# to stub an external dependency (e.g., CALL "CEEDAYS" without
# MOCK CALL "CEEDAYS").
#
cobolcheck.test.unmockcall.display = true

#
# Parser error log location for testsuite syntax errors (caught while
# cobol-check parses .cut files).
#
testsuite.parser.error.log.path = target/cobol-check/
testsuite.parser.error.log.name = ParserErrorLog.txt

#
# Default file-encoding (matches the host JDK's default).
#
cobolcheck.file.encoding.linux = default
cobolcheck.file.encoding.macosx = default
cobolcheck.file.encoding.windows = default
cobolcheck.file.encoding.zos = default
cobolcheck.file.encoding.unix = default

#
# Permissions applied to all files generated by cobol-check.
#
generated.files.permission.all = rwx

#
# Always run the merged tests as part of `make test` (vs. only
# producing the merged source).
#
cobolcheck.test.run = true

#
# Application source / copybook locations for CardDemo.  These are the
# un-prefixed keys cobol-check 0.2.16 actually reads.  They mirror the
# values of cobolcheck.application.source.directory and
# cobolcheck.application.copybook.directory above.
#
application.source.directory = app/cbl
application.copybook.directory = app/cpy:app/cpy-bms:tests/fixtures/cobol-snippets:tests/stubs

#
# Test-suite (.cut) location.  Mirrors cobolcheck.test.suite.directory
# above; this is the key cobol-check 0.2.16 actually reads.  The
# Makefile overrides this value at run time in the synthesised
# target/cobol-check/config.properties so cobol-check walks the
# nested-layout shadow tree under target/cobol-check/suites/ instead
# of the flat layout in tests/cobol-check/ (see
# cobolcheck.test.suite.directory above for the full rationale).
#
test.suite.directory = tests/cobol-check

#
# Test result file (extension is appended automatically based on
# format).
#
test.results.file = target/cobol-check/testResults

#
# Use plain text for direct console output -- works with any terminal
# and is friendly for CI log parsing.
#
test.results.format = txt
test.results.format.style = directOutput

#
# Source / copybook filename suffix lists.  CardDemo files use either
# `.cbl` (lowercase) or `.CBL` (uppercase) for programs and
# `.cpy`/`.CPY` for copybooks.  Both cases must be discoverable.
#
application.source.filename.suffix = CBL,cbl
application.copybook.filename.suffix = CBL,cbl,CPY,cpy

#
# Concatenated test-suite file location.  When cobol-check is asked to
# run multiple programs in one invocation it concatenates their
# testsuites here for inspection.
#
concatenated.test.suites = target/cobol-check/ALLTESTS

#
# GnuCOBOL compile options used when cobol-check builds the merged
# program.  Comma-separated form (cobol-check splits on commas before
# spawning cobc).  -fixed forces fixed-format COBOL (CardDemo is
# fixed-format).  -I resolves COPY directives to the configured
# copybook directories.  Coverage instrumentation is added by the
# Makefile via the COBC_OPTS environment variable when `make coverage`
# is invoked, not via this file.  This is the un-prefixed key
# cobol-check 0.2.16 actually reads (see cobolcheck.compiler.command
# above for the schema-documented intent in shell form).
#
gnucobol.compile.options = -fixed,-I,app/cpy,-I,app/cpy-bms,-I,tests/fixtures/cobol-snippets,-I,tests/stubs

#
# Per-platform shell entry points for cobol-check's compile-and-run
# cycle.  The CardDemo project uses the Linux script for all *nix
# platforms; the Windows script is a stub kept for completeness.
#
cobolcheck.script.directory = tests/cobol-check/scripts
linux.process   = linux_gnucobol_run_tests
osx.process     = linux_gnucobol_run_tests
freebsd.process = linux_gnucobol_run_tests
windows.process = windows_gnucobol_run_tests.cmd
zos.process     =
unix.process    = linux_gnucobol_run_tests

#
# End of cobol-check configuration.
#
