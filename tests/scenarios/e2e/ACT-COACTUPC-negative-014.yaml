# COACTUPC refuses an Open Date whose century is neither 19 nor 20.
#
# Steps 1-3 reach the account details exactly as ACT-COACTUPC-normal-02 does:
# USER0001 signs on, main menu option '2' XCTLs to COACTUPC, which sends the
# search screen, and ENTER with account 00000000001 reads CXACAIX (card
# 9680294154603697, customer 000000001), ACCTDAT and CUSTDAT and shows the
# details with 'Update account details presented above.'
# [app/cbl/COMEN01C.cbl:115-156] [app/cbl/COACTUPC.cbl:964-973,2568-2580,
# 2787-2865,3608-3884].
# Step 4: ENTER with OPNYEAR '1814' typed over 2014. 1205-COMPARE-OLD-NEW finds
# the open date changed, so 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and
# runs every edit in field order [app/cbl/COACTUPC.cbl:1429-1676]:
# - Account Status 'Y' passes 1220-EDIT-YESNO, so WS-RETURN-MSG is still off.
# - Open Date goes through EDIT-DATE-CCYYMMDD. EDIT-YEAR-CCYY finds the year
#   supplied and numeric; WS-EDIT-DATE-CC-N is 18, neither THIS-CENTURY (20) nor
#   LAST-CENTURY (19), so INPUT-ERROR and FLG-YEAR-NOT-OK are set and
#   'Open Date : Century is not valid.' is STRINGed into WS-RETURN-MSG
#   [app/cpy/CSUTLDPY.cpy:18-90] [app/cpy/CSUTLDWY.cpy:5-10]. The GO TO falls
#   through to EDIT-MONTH and EDIT-DAY, which accept 11 and 20; the year flag
#   leaves WS-EDIT-DATE-IS-VALID false, so EDIT-DAY-MONTH-YEAR exits before
#   EDIT-DATE-LE and CSUTLDTC is not called for this date
#   [app/cpy/CSUTLDPY.cpy:91-280,329].
# - Every later edit passes for the customer below, and a later failure could
#   not replace the message anyway: each edit writes only while
#   WS-RETURN-MSG-OFF holds.
# 2000-DECIDE-ACTION continues on ACUP-CHANGES-NOT-OK, so nothing is written
# [app/cbl/COACTUPC.cbl:2596-2597]. 3200 performs 3203-SHOW-UPDATED-VALUES,
# which echoes the received values; 3250 sets PROMPT-FOR-CHANGES and moves
# WS-RETURN-MSG to ERRMSG; 3390 brightens F12=Cancel because a change is
# pending and leaves F5=Save dark [app/cbl/COACTUPC.cbl:2718-2720,2870-2949,
# 2955-2983,3566-3584]. The cursor and the red attribute on OPNYEAR are not
# observable in the captured text.
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Text values are whole fields at their BMS length, trailing spaces kept.
#   ERRMSG is the 33-character message in the 78-byte field; INFOMSG is the
#   40-byte WS-INFO-MSG in the 45-byte field [app/cbl/COACTUPC.cbl:462-480].
# - The amounts are echoed through WS-EDIT-CURRENCY-9-2-F because their edits
#   pass; the other fields are echoed as received.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
# 1899 and 2100, the edges of the accepted centuries, are the Open Date
# boundary scenarios; this case uses a century well outside them.
id: ACT-COACTUPC-negative-014
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main menu option 2 'Account Update', fetches
  account 00000000001 and changes the Open Date year from 2014 to 1814.
  COACTUPC refuses the century 18 with 'Open Date : Century is not valid.' in
  the message line, keeps the entered values on the screen with the prompt
  'Update account details presented above.', offers F12=Cancel and rewrites
  neither the account nor the customer record.
# Primary item first, then the program, the maps asserted, the transaction the
# fetch and the edit run under, the CSD files the fetch reads, and the
# online-only copybooks COACTUPC copies. Sign-on and the menu (CC00, CM00,
# COSGN00, USRSEC) are verified by the SEC and MNU scenarios; batch record
# copybooks and data files at the lowest level that executes them.
inventory_ids:
- INV-ACT-072  # COACTUPC Open Date: century 19 or 20 (EDIT-YEAR-CCYY)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the detail and edit-error screen
- INV-CFG-009  # CAUP transaction, under which the fetch and the edit run
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: the account master read, never rewritten here
- INV-CFG-005  # CUSTDAT CSD file: the customer master read, never rewritten here
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area code, state and state/zip tables of the edits
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the attribute settings of 3300-SETUP-SCREEN-ATTRS
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-YEAR-CCYY, which composes the message
- INV-LAY-014  # CSUTLDWY: WS-EDIT-DATE-CC-N with THIS-CENTURY and LAST-CENTURY
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix copy drops FUNCTION TRIM from the field name in CSUTLDPY's
# messages (024), changes COACTUPC's amount conversions that the echoed
# amounts pass through (022) and lacks COACTUP's unnamed field at row 1,
# columns 1-9 (025), so a unikix run observes the copy's behaviour there.
- GAP-DOC-024
- GAP-DOC-022
- GAP-DOC-025
preconditions:
  datasets:
    # The 10 repository users, for the USER0001 sign-on.
    USRSEC: {base: USRSEC}
    # Account 00000000001 and its cross-reference record as in the repository.
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented values that pass every edit of
    # 1200-EDIT-MAP-INPUTS, so the Open Date edit is the only one that fails.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '1'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
        CUST-ADDR-ZIP: '27601'
        CUST-PHONE-NUM-1: (919)555-0101
        CUST-PHONE-NUM-2: (919)555-0102
        CUST-SSN: '123456789'
        CUST-GOVT-ISSUED-ID: TESTGOVT0001
        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: 'Y'
        CUST-FICO-CREDIT-SCORE: '700'
  parameters:
    clock_mode: relative
  faults: []
# PASSWORD is the documented demo password of README.md, not a secret.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: USER0001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '2'}
    '@map': COMEN01
  - aid: ENTER
    fields: {ACCTSID: '00000000001'}
    '@map': COACTUP
  - aid: ENTER
    fields: {OPNYEAR: '1814'}
    '@map': COACTUP
