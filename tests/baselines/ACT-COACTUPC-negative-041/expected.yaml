# Derived baseline of scenario ACT-COACTUPC-negative-041 (capture_platform:
# derived), authored from the app/ source at commit
# 93ebec71ff7b59a68cedd7c501afe496a8eaa68d and never observed: no TPE region
# runs in CI. The scenario is tagged inferred-not-observed; open until a UniKix
# run of the app/ build is imported: GAP-INF-005 (derived ACT end-to-end
# baselines) and GAP-INF-012 (online-only copybooks such as CSSETATY).
# Steps 1-3: USER0001 signs on, option 2 XCTLs to COACTUPC, and ENTER with
# account 00000000001 shows the fetched account and customer with the change
# prompt [app/cbl/COACTUPC.cbl:2787-2865,2955-2981].
# Step 4: 5O0.00 (letter O) over ACSHLIM is a change, so 1200-EDIT-MAP-INPUTS
# sets ACUP-CHANGES-NOT-OK and edits the fields in screen order; Account
# Status, Open Date, Credit Limit and Expiry Date hold the fetched values and
# pass, then 1250-EDIT-SIGNED-9V2 finds TEST-NUMVAL-C not 0 and, the message
# being still off, composes TRIM('Cash Credit Limit') ' is not valid'
# (30 characters) into WS-RETURN-MSG; no later edit can replace it
# [app/cbl/COACTUPC.cbl:1086-1098,1460-1501,2180-2221].
# 2000-DECIDE-ACTION continues, so nothing is rewritten; 3203 shows ACSHLIM as
# typed from ACUP-NEW-CASH-CREDIT-LIMIT-X (the tpe adapter erases the field
# before typing, so 5O0.00 and 9 blanks), 3250 sets PROMPT-FOR-CHANGES and
# moves the message to ERRMSG, and 3390 brightens FKEY12 because a change was
# made [app/cbl/COACTUPC.cbl:2596-2597,2881-2887,2955-2981,3573-3576].
# Not asserted, since a text capture cannot show them: the red colour of
# ACSHLIM (DFHRED through CSSETATY) and the cursor on it (ACSHLIML -1)
# [app/cbl/COACTUPC.cbl:3049-3051,3255-3258].
# This pins the app/ behavior: the UniKix COACTUPC comments out this
# TEST-NUMVAL-C check (migrated_app/cbl/COACTUPC.cl2:2205-2219), so its copy
# would accept 5O0.00 and never show this message (GAP-DOC-022). A UniKix
# record of this scenario is therefore UniKix-copy behavior: it never verifies
# the item or promotes this file, which stays derived until an app/ build is
# observed (GAP-MIS-008).
# Screen values are full BMS width with trailing spaces kept (ERRMSG 78,
# INFOMSG 45, ACSHLIM 15), because screens compare exactly. CURDATE and
# CURTIME come from the region clock, so they are matchers. file_state holds
# the records as the preconditions materialize them, decoded through CVACT01Y
# and CVCUS01Y.
