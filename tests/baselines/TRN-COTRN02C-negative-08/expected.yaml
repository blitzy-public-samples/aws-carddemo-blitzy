# Derived baseline of TRN-COTRN02C-negative-08: the add screen submitted with
# the category code left blank. Not observed; authored from
# app/cbl/COTRN02C.cbl:36-38 (CT02, COTRN02C, WS-MESSAGE X(80)), 119-130
# (first entry: COTRN2AO cleared, blank ERRMSG), 164-167 (ENTER performs
# PROCESS-ENTER-KEY), 210-223 and 609-637 (card branch: READ CCXREF NORMAL,
# XREF-ACCT-ID 00000000050 of record 1 of app/data/ASCII/cardxref.txt into
# ACTIDINI), 250-262 (Type CD supplied, so the blank Category CD sets
# 'Category CD can NOT be empty...' and sends the screen), 516-534
# (SEND-TRNADD-SCREEN with ERASE, then RETURN TRANSID CT02: no later check, no
# CONFIRM evaluation, no TRANSACT access) and 552-571 (header), with
# app/cbl/COMEN01C.cbl:241-252 and app/cpy/COMEN02Y.cpy:67-70 (OPTN008),
# app/cpy/COTTL01Y.cpy (titles), app/bms/COTRN02.bms and app/cpy-bms/COTRN02.CPY
# (COTRN2AO redefines COTRN2AI, so the received values are sent back).
# Screens are whole fields at their BMS length, trailing spaces kept; ERRMSG
# is WS-MESSAGE cut to the 78-byte ERRMSGO. CURDATE and CURTIME come from the
# region clock and are matchers. TRANSACT keeps its 300 fixture records.
# Only report.py --import-unikix replaces it with an observed outcome:
# GAP-INF-007 (derived TRN end-to-end baselines) and GAP-INF-012 (online-only
# copybooks). Canonical harness.dump_yaml layout.
file_state:
  TRANSACT:
    count: 300
screens:
- '@map': COMEN01
  ERRMSG: '                                                                              '
  OPTN008: '08. Transaction Add                     '
  PGMNAME: COMEN01C
  TRNNAME: CM00
- '@map': COTRN02
