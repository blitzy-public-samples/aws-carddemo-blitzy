# The negative extreme of the Add Transaction amount format: '-99999999.99',
# the very value the refusal message names, passes the format check, so
# COTRN02C goes on to ask for confirmation. The three amount boundaries are
# boundary-01 '+00000000.00' (accepted), boundary-02 '-99999999.99' (accepted)
# and boundary-03 '00000001.00' without a sign (refused).
#
# Steps 1-2 reach the empty Add Transaction screen as TRN-COTRN02C-normal-01
# does: USER0001 (type U) is routed to COMEN01C, and option 8 transfers control
# to COTRN02C with the program context reset, so COTRN02C sets the re-enter
# flag, finds no transaction selected and sends COTRN02 with a blank ERRMSG
# [app/cbl/COSGN00C.cbl:230-237] [app/cbl/COMEN01C.cbl:115-156]
# [app/cbl/COTRN02C.cbl:119-130,516-528].
# Step 3 enters the valid field set of the TRN-COTRN02C scenarios, card number
# only, with Amount '-99999999.99' and CONFIRM empty ('' erases the field and
# types nothing; the field has FSET and no INITIAL, so it is received as
# SPACES or LOW-VALUES) [app/bms/COTRN02.bms:281-285]. COTRN02C receives it
# under the CT02 that step 2 returned with and performs PROCESS-ENTER-KEY
# [app/cbl/COTRN02C.cbl:131-135,164-188]:
# - ACTIDIN holds only its INITIAL blank, so the card branch runs: the card is
#   numeric, moves back through WS-CARD-NUM-N unchanged, READ CCXREF by card is
#   NORMAL, and XREF-ACCT-ID 00000000050 (record 1 of the CARDXREF fixture) is
#   moved into ACTIDIN [app/cbl/COTRN02C.cbl:195-223,609-623].
# - Every data field is supplied and the type and category codes are numeric
#   [app/cbl/COTRN02C.cbl:235-337].
# - The amount format check refuses the amount when position 1 is neither '-'
#   nor '+', positions 2-9 are not numeric, position 10 is not '.', or
#   positions 11-12 are not numeric [app/cbl/COTRN02C.cbl:339-351].
#   '-99999999.99' holds '-', '99999999', '.' and '99', so no WHEN is true and
#   'Amount should be in format -99999999.99' is not set.
# - Both dates are well formed and CSUTLDTC accepts them with mask YYYY-MM-DD;
#   the merchant id is numeric [app/cbl/COTRN02C.cbl:353-381,389-436].
# - NUMVAL-C turns '-99999999.99' into -99999999.99, which WS-TRAN-AMT-N
#   (PIC S9(9)V99) holds without truncation, and WS-TRAN-AMT-E
#   (PIC +99999999.99) edits it back into TRNAMT as '-99999999.99', the value
#   entered [app/cbl/COTRN02C.cbl:58-59,383-386].
# - CONFIRM is SPACES or LOW-VALUES, so the flag is set, 'Confirm to add this
#   transaction...' goes to WS-MESSAGE, the cursor goes to CONFIRM, and
#   SEND-TRNADD-SCREEN sends COTRN02 FROM the map area RECEIVE filled, with
#   ERASE, then RETURN TRANSID CT02 ends the task
#   [app/cbl/COTRN02C.cbl:173-181,516-534]. ADD-TRANSACTION is never
#   performed, so TRANSACT is neither browsed nor written
#   [app/cbl/COTRN02C.cbl:442-466].
# The confirmation request, rather than the amount-format message, shows that
# the amount was accepted. The screen shows the entered values again, with
# ACTIDIN filled in from the cross-reference. BMS pads each received field
# with blanks to its length, so expected text values are full field width with
# their trailing spaces; CONFIRM shows blank. CURDATE and CURTIME come from the
# region clock, so they are matchers and the clock is relative.
id: TRN-COTRN02C-boundary-02
level: e2e
type: boundary
description: >-
  USER0001 signs on, chooses main-menu option 8 (Transaction Add) and enters a
  valid transaction for repository card 0500024453765740 on COTRN02 with the
  amount at the negative extreme of its format, -99999999.99, and CONFIRM left
  blank. COTRN02C accepts the amount instead of answering 'Amount should be in
  format -99999999.99': it fills in account 00000000050 from the card
  cross-reference, shows the amount again as -99999999.99, keeps the other
  entered values, asks 'Confirm to add this transaction...' and writes nothing
  to TRANSACT.
# Primary item first, then the program, the maps asserted, the transaction
# step 3 runs under, the CSD file COTRN02C reads (TRANSACT is not accessed on
# this path), and the online-only copybooks it copies. The confirmation message
# is the primary item of TRN-COTRN02C-alternate-01; here it only shows that the
# amount edit let the entry through. Sign-on and the menu option (CC00, CM00,
# COSGN00, USRSEC) are verified by the SEC and MNU scenarios; the batch record
# copybooks and data files at the lowest level that executes them.
inventory_ids:
- INV-TRN-049  # COTRN02C message 'Amount should be in format -99999999.99' (rule), not raised at the negative extreme
- INV-TRN-003  # COTRN02C program
- INV-MNU-003  # COMEN01 map, where option 8 is entered
- INV-TRN-006  # COTRN02 map, the add screen of steps 2 and 3
- INV-CFG-022  # CT02 transaction, under which COTRN02C receives step 3
- INV-CFG-004  # CCXREF CSD file, read by card number to fill in the account
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA carrying the program context
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the screen date and time
- INV-LAY-008  # CSMSG01Y copybook, copied by COTRN02C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-007  # TRN end-to-end baselines derived, never observed on a TPE region
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    USRSEC: {base: USRSEC}
    CARDXREF: {base: CARDXREF}
    # TRANSACT is a built dataset with no repository data of its own, so the
    # harness refuses it as a base; it is loaded from the repository's 300
    # daily transactions, which have TRAN-RECORD's 350-byte shape. The load
    # gives the file_state assertion a known starting content.
    TRANSACT: {base: DALYTRAN}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '8'
  # ACTIDIN is left as sent, so the card number selects the cross-reference.
  - aid: ENTER
    '@map': COTRN02
    fields:
      CARDNIN: '0500024453765740'
      TTYPCD: '01'
      TCATCD: '0001'
      TRNSRC: 'POS TERM'
      TDESC: 'Test purchase'
      TRNAMT: '-99999999.99'
      TORIGDT: '2022-07-01'
      TPROCDT: '2022-07-01'
      MID: '800000001'
      MNAME: 'Test Merchant'
      MCITY: 'Testville'
      MZIP: '27601'
      CONFIRM: ''
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: 'CM00'
    PGMNAME: 'COMEN01C'
    OPTN008: '08. Transaction Add                     '
    ERRMSG: '                                                                              '
  - '@map': COTRN02
    TRNNAME: 'CT02'
    PGMNAME: 'COTRN02C'
    ERRMSG: '                                                                              '
  - '@map': COTRN02
    TRNNAME: 'CT02'
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: 'COTRN02C'
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ACTIDIN: '00000000050'
    CARDNIN: '0500024453765740'
    TTYPCD: '01'
    TCATCD: '0001'
    TRNSRC: 'POS TERM  '
    TDESC: 'Test purchase                                               '
    TRNAMT: '-99999999.99'
    TORIGDT: '2022-07-01'
    TPROCDT: '2022-07-01'
    MID: '800000001'
    MNAME: 'Test Merchant                 '
    MCITY: 'Testville                '
    MZIP: '27601     '
    CONFIRM: ' '
    ERRMSG: 'Confirm to add this transaction...                                            '
  # The ERRMSG of each step: the menu and the empty add screen carry none.
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'Confirm to add this transaction...                                            '
  file_state:
    # Nothing is written: TRANSACT still holds the 300 fixture records, and the
    # highest of them, the key an add would follow, is unchanged.
    TRANSACT:
      count: 300
      contains:
      - TRAN-ID: '0000000996722787'
        TRAN-TYPE-CD: '01'
        TRAN-CAT-CD: '1'
        TRAN-SOURCE: 'POS TERM  '
        TRAN-DESC: 'Purchase at Kilback LLC                                                                             '
        TRAN-AMT: '603.22'
        TRAN-MERCHANT-ID: '800000000'
        TRAN-MERCHANT-NAME: 'Kilback LLC                                       '
        TRAN-MERCHANT-CITY: 'Cummeratamouth                                    '
        TRAN-MERCHANT-ZIP: '53200-7529'
        TRAN-CARD-NUM: '3260763612337560'
        TRAN-ORIG-TS: '2022-06-10 19:27:53.000000'
        TRAN-PROC-TS: '                          '
