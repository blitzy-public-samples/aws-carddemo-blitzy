# CORPT00C submits the monthly transaction report: the date window of the
# TRNRPT00 job it writes to the TDQ JOBS runs from the first to the last day of
# the run month (tech-spec seed "Scenario 4: Report Generation and Statement
# Creation").
#
# Step 1 signs on as USER0001 on COSGN00 (transaction CC00); the type-U user is
# routed to COMEN01C, which sends the main menu COMEN01 headed CM00/COMEN01C
# [app/cbl/COSGN00C.cbl:230-237] [app/cbl/COMEN01C.cbl:36-37,82-90].
# Step 2 enters option 9 on COMEN01: 'Transaction Reports', user type U,
# program CORPT00C [app/cpy/COMEN02Y.cpy:74-78]. COMEN01C zeroes the program
# context and transfers control to CORPT00C [app/cbl/COMEN01C.cbl:115-156],
# whose first entry sets the re-enter flag, moves LOW-VALUES to CORPT0AO and
# sends CORPT00 with CR00, CORPT00C, the COTTL01Y titles, the run date and
# time through CSDAT01Y and a blank ERRMSG [app/cbl/CORPT00C.cbl:163-181,
# 556-580,609-628]. The input fields show their BMS initial blanks.
# Step 3 marks Monthly with CONFIRM Y and presses ENTER under CR00
# [app/cbl/CORPT00C.cbl:183-186]:
# - MONTHLY is the first WHEN of PROCESS-ENTER-KEY, so the monthly branch runs
#   whatever YEARLY and CUSTOM hold [app/cbl/CORPT00C.cbl:212-214].
# - FUNCTION CURRENT-DATE gives the run date. WS-START-DATE is its year, its
#   month and '01'. The day is then set to 1 and the month raised by one (to
#   January of the next year after December); DATE-OF-INTEGER of
#   INTEGER-OF-DATE minus one is the last day of the run month, which becomes
#   WS-END-DATE. Both go into PARM-START-DATE-1/-2 and PARM-END-DATE-1/-2
#   [app/cbl/CORPT00C.cbl:215-236] [app/cpy/CSDAT01Y.cpy:17-29]. No CSUTLDTC
#   call is made on this branch.
# - SUBMIT-JOB-TO-INTRDR finds CONFIRM 'Y', so the loop writes JOB-LINES 1 to
#   17 to JOBS, one WRITEQ TD of 80 bytes each: it marks the end on the
#   '/*EOF' record and still writes it, so '/*EOF' is the 17th record
#   [app/cbl/CORPT00C.cbl:81-127,462-523].
# - Every write is NORMAL, so INITIALIZE-ALL-FIELDS moves spaces to every input
#   field, CONFIRM and WS-MESSAGE, STRING composes 'Monthly' (delimited by
#   space) and ' report submitted for printing ...', ERRMSG is set green and
#   CORPT00 is sent again with ERASE before RETURN TRANSID CR00
#   [app/cbl/CORPT00C.cbl:445-456,556-591,633-646].
#
# The dates come from the region clock, which no confirmed command sets
# (GAP-MIS-015), so the clock is relative. Records 11, 12 and 15 are
# whole-line matchers whose literal text is the record and whose directives
# render the first (run-month-start) or last (run-month-end) day of the run
# month. Record 15 is 'start end' in one line: under run-month-end its '%Y-%m'
# parts are the run year and month, so '%Y-%m-01' is the first day of that
# same month. The screen CURDATE and CURTIME are matchers for the same reason.
# Text values are whole fields at their BMS or record length, trailing spaces
# included.
id: RPT-CORPT00C-normal-01
level: e2e
type: normal
description: >-
  USER0001 signs on, chooses main-menu option 9 (Transaction Reports) and, on
  CORPT00, requests the Monthly report with CONFIRM Y. CORPT00C derives the
  date window from the run date, the first to the last day of the run month,
  writes the 17 records of job TRNRPT00 to the TDQ JOBS with that window in
  PARM-START-DATE, PARM-END-DATE and the DATEPARM record, clears the input
  fields and shows 'Monthly report submitted for printing ...'.
# Primary item first, then the program, the maps asserted, the transaction
# step 3 runs under, the TDQ the job is written to, and the online-only
# copybooks CORPT00C copies. The 'report submitted' message (normal-04) and
# the JOBS write (normal-05) are the primary items of their own scenarios;
# sign-on and the menu option (CC00, CM00, COSGN00, USRSEC) are verified by the
# SEC and MNU scenarios; the batch record copybook CVTRA05Y, which CORPT00C
# copies but never uses, is verified at the lowest level that executes it.
inventory_ids:
- INV-RPT-033  # CORPT00C monthly date range (calculation): first to last day of the run month
- INV-RPT-001  # CORPT00C program
- INV-MNU-003  # COMEN01 map, where option 9 is entered
- INV-RPT-002  # CORPT00 map, the report screen of steps 2 and 3
- INV-CFG-019  # CR00 transaction, under which CORPT00C receives the request
- INV-CFG-029  # JOBS CSD TDQ: the queue the 17 job records are written to
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the program context
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE, CURTIME and the run date the window is derived from
- INV-LAY-008  # CSMSG01Y, copied by CORPT00C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-009  # RPT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-MIS-017  # no confirmed capture of the records the region writes to JOBS
# CORPT00C reads no file; USRSEC holds the demo users for the sign-on.
preconditions:
  datasets:
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '9'
  # YEARLY, CUSTOM and the date fields are left at their initial blank.
  - aid: ENTER
    '@map': CORPT00
    fields:
      MONTHLY: 'X'
      CONFIRM: 'Y'
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: 'CM00'
    PGMNAME: 'COMEN01C'
  - '@map': CORPT00
    TRNNAME: 'CR00'
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: 'CORPT00C'
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ERRMSG: '                                                                              '
  - '@map': CORPT00
    TRNNAME: 'CR00'
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: 'CORPT00C'
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    MONTHLY: ' '
    YEARLY: ' '
    CUSTOM: ' '
    SDTMM: '  '
    SDTDD: '  '
    SDTYYYY: '    '
    EDTMM: '  '
    EDTDD: '  '
    EDTYYYY: '    '
    CONFIRM: ' '
    ERRMSG: 'Monthly report submitted for printing ...                                     '
  # The ERRMSG of each step: the menu and the first report screen carry none.
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'Monthly report submitted for printing ...                                     '
  file_state:
    # The JOB-LINES CORPT00C writes, in write order, each 80 bytes with its
    # trailing spaces [app/cbl/CORPT00C.cbl:81-127]: records 11 and 12 carry
    # the window in the SORT symbols of STEP05R, record 15 is the DATEPARM
    # record of STEP10R (start date, a space, end date), and record 17 is the
    # '/*EOF' end marker, written before the loop stops.
    '@TDQ:JOBS':
      records:
      - '//TRNRPT00 JOB ''TRAN REPORT'',CLASS=A,MSGCLASS=0,                                '
      - '// NOTIFY=&SYSUID                                                               '
      - '//*                                                                             '
      - '//JOBLIB JCLLIB ORDER=(''AWS.M2.CARDDEMO.PROC'')                                  '
      - '//*                                                                             '
      - '//STEP10 EXEC PROC=TRANREPT                                                     '
      - '//*                                                                             '
      - '//STEP05R.SYMNAMES DD *                                                         '
      - 'TRAN-CARD-NUM,263,16,ZD                                                         '
      - 'TRAN-PROC-DT,305,10,CH                                                          '
      - {match: run-month-start, format: 'PARM-START-DATE,C''%Y-%m-%d''                                                   '}
      - {match: run-month-end, format: 'PARM-END-DATE,C''%Y-%m-%d''                                                     '}
      - '/*                                                                              '
      - '//STEP10R.DATEPARM DD *                                                         '
      - {match: run-month-end, format: '%Y-%m-01 %Y-%m-%d                                                           '}
      - '/*                                                                              '
      - '/*EOF                                                                           '
