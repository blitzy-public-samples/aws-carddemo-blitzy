# Derived baseline of scenario ACT-COACTUPC-boundary-21 (capture_platform
# derived, tag inferred-not-observed): the accepted upper edge of the Open
# Date century check. USER0001 signs on, takes main-menu option 2, fetches
# account 00000000001 on COACTUP, changes the open year from 2014 to 2099 and
# presses ENTER. Century 20 is accepted, every edit passes, so COACTUPC asks
# for confirmation and writes nothing. Authored from the app/ source, never
# captured:
# - app/cbl/COMEN01C.cbl:241-252 with app/cpy/COMEN02Y.cpy:30-33 (OPTN002);
# - app/cbl/COACTUPC.cbl:880-886,964-973 (first entry), 2668-2692 (header),
#   2958-2959 (PROMPT-FOR-SEARCH-KEYS); step 3: 2568-2580, 3608-3884 (reads),
#   2787-2865 (3202-SHOW-ORIGINAL-VALUES), 2962-2963 (PROMPT-FOR-CHANGES),
#   3500-3561 (F5 and F12 stay dark: ACUP-SHOW-DETAILS is not
#   ACUP-CHANGES-MADE at 654-666);
# - step 4: 1460-1471 and 1681-1704 (the open date differs, so the edits
#   run), 1478-1482 ('Open Date' through EDIT-DATE-CCYYMMDD); in
#   app/cpy/CSUTLDPY.cpy:25-90 the year 2099 is supplied and numeric and
#   WS-EDIT-DATE-CC-N 20 is THIS-CENTURY (app/cpy/CSUTLDWY.cpy:9-10), so no
#   ' : Century is not valid.' is composed; month 11 and day 20 pass
#   (91-279), and EDIT-DATE-LE calls CSUTLDTC with mask YYYYMMDD, taken as
#   severity 0 (284-328); 1670-1675 (no INPUT-ERROR:
#   ACUP-CHANGES-OK-NOT-CONFIRMED), 2620-2621 (no PF5: no READ UPDATE, no
#   REWRITE), 2870-2951 (3203-SHOW-UPDATED-VALUES, OPNYEAR 2099), 2966-2967
#   (PROMPT-FOR-CONFIRMATION, the X(40) WS-INFO-MSG in the 45-byte INFOMSGO),
#   2979-2981 (the blank X(75) WS-RETURN-MSG in the 78-byte ERRMSGO),
#   3566-3581 (F5=Save and F12=Cancel made bright);
# - app/bms/COACTUP.bms for field lengths and the INITIAL texts of FKEYS,
#   FKEY05 and FKEY12; a dark field is captured as blanks.
# Values are whole BMS fields with their trailing spaces. file_state: nothing
# is rewritten before PF5, so both files keep their 50 records, account
# 00000000001 its open date 2014-11-20 and customer 000000001 the scenario's
# invented values, over the fields the scenario names.
# Open under GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012
# (online-only copybooks). The CEEDAYS acceptance behind severity 0 is
# inferred (GAP-INF-001) and its presence on UniKix unconfirmed
# (GAP-MIS-010). The UniKix CSUTLDPY (GAP-DOC-024), CSUTLDTC (GAP-DOC-021),
# COACTUPC amount edits (GAP-DOC-022) and COACTUP.bms row 1 (GAP-DOC-025)
# differ, so a UniKix record never verifies this app/ behaviour. Only
# `report.py --import-unikix` promotes this baseline; it is never edited by
# hand to match a run.
