# COACTUPC refuses an account update whose Phone Number 1 area code is not a
# North America general-purpose code: the fourth predicate of EDIT-AREA-CODE in
# 1260-EDIT-US-PHONE-NUM, run for the Phone Number 1 field of
# 1200-EDIT-MAP-INPUTS, which looks the code up in the 88-level
# VALID-GENERAL-PURP-CODE of CSLKPCDY [app/cbl/COACTUPC.cbl:1632-1638,2296-2312]
# [app/cpy/CSLKPCDY.cpy:521-930].
#
# Steps 1-3 sign on as USER0001, choose main-menu option 2 and fetch account
# 00000000001, as ACT-COACTUPC-alternate-03 does: CXACAIX gives customer
# 000000001, ACCTDAT and CUSTDAT are read without UPDATE, and the details of the
# account and of the invented customer below are shown with
# 'Update account details presented above.'; 3320-UNPROTECT-FEW-ATTRS gives
# every editable field MDT on, so all of them come back on the next AID
# [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3500-3561].
# Step 4 types 123 over the Phone Number 1 area code (ACSPH1A, shown as '919')
# and presses ENTER:
# - 1100-RECEIVE-MAP moves the received '123', neither '*' nor spaces, to
#   ACUP-NEW-CUST-PHONE-NUM-1A [app/cbl/COACTUPC.cbl:1357-1362].
# - 1205-COMPARE-OLD-NEW finds ACUP-NEW-CUST-PHONE-NUM-1A unequal to the fetched
#   '919', so 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs the field
#   edits in screen order [app/cbl/COACTUPC.cbl:1460-1470,1748]. Account
#   Status, the four dates, the five amounts, the SSN, the FICO score, the
#   names, the address, state, zip, city and country all pass on the repository
#   account and the invented customer [app/cbl/COACTUPC.cbl:1472-1630].
# - Phone Number 1 moves its name to WS-EDIT-VARIABLE-NAME and the 15-byte
#   ACUP-NEW-CUST-PHONE-NUM-1 to WS-EDIT-US-PHONE-NUM. 1260-EDIT-US-PHONE-NUM
#   finds the number not wholly blank; EDIT-AREA-CODE finds '123' supplied,
#   NUMERIC and not zero, moves it to WS-US-PHONE-AREA-CODE-TO-EDIT and, 123
#   not being one of the general-purpose codes, sets INPUT-ERROR and
#   FLG-EDIT-US-PHONEA-NOT-OK and, WS-RETURN-MSG being still blank, STRINGs
#   TRIM(WS-EDIT-VARIABLE-NAME) and
#   ': Not valid North America general purpose area code' into WS-RETURN-MSG
#   [app/cbl/COACTUPC.cbl:2225-2312]. The prefix 555 and the line number 0101
#   pass [app/cbl/COACTUPC.cbl:2316-2422].
# - Phone Number 2, EFT Account Id, Primary Card Holder and the NC/27601
#   state-and-zip cross edit pass; an edit writes its message only while
#   WS-RETURN-MSG-OFF holds, so this message stays
#   [app/cbl/COACTUPC.cbl:1640-1669].
# - 2000-DECIDE-ACTION continues on ACUP-CHANGES-NOT-OK, so 9600-WRITE-PROCESSING
#   (PF5 only) does not run and nothing is written
#   [app/cbl/COACTUPC.cbl:2562-2621].
# - 3203-SHOW-UPDATED-VALUES shows the received values, ACSPH1A as received and
#   the valid amounts re-edited through WS-EDIT-CURRENCY-9-2-F; 3250 sets
#   PROMPT-FOR-CHANGES and moves WS-RETURN-MSG to ERRMSG; 3300 puts the cursor on
#   ACSPH1A, and CSSETATY colours it red without the '*' of a blank field; 3390
#   makes F12=Cancel bright because changes were made, and leaves F5=Save dark
#   [app/cbl/COACTUPC.cbl:2870-2953,2955-2985,3138-3140,3395-3400,3566-3581]
#   [app/cpy/CSSETATY.cpy].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   ERRMSG is 'Phone Number 1: Not valid North America general purpose area
#   code' (65 characters) in the 75-byte WS-RETURN-MSG, moved to the 78-byte
#   ERRMSGO: 13 trailing spaces. ACSPH1A is '123' in its 3-byte field. INFOMSG
#   is the 40-byte WS-INFO-MSG in the 45-byte INFOMSGO.
# - AADDGRP is sent as LOW-VALUES on screen 4 (the blank group id comes back as
#   spaces, which 1100 turns into LOW-VALUES); s3270 shows nulls as spaces.
# - A dark (DRK) field is captured as blanks; colour and cursor position are
#   not in the s3270 text capture and are not asserted. No upper-case
#   translation of input is assumed (CARDDEMO.CSD gives CAUP the profile
#   DFHCICST).
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative. No other outcome depends on the run date.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit (the repository record has FICO 274, phone-2 area code 373 and zip
# 12546 for NC, which the FICO, phone and state/zip edits refuse), so the
# refused area code is the only refused field. Area code 919 is a
# general-purpose code and NC27 a valid state and zip pair
# [app/cpy/CSLKPCDY.cpy:895,1186]. Account 00000000001 and its cross-reference
# stay as in the repository.
id: ACT-COACTUPC-negative-108
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update) and fetches
  account 00000000001, then types 123 over the Phone Number 1 area code and
  presses ENTER. COACTUPC refuses the change: the message line shows 'Phone
  Number 1: Not valid North America general purpose area code', the area code
  shows 123 as typed, the other received values are shown again with the
  change prompt and F12=Cancel, and neither ACCTDATA nor CUSTDATA is
  rewritten.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. The change prompt 'Update account details presented above.'
# (INV-ACT-030) is asserted but verified by its own scenario. Sign-on (CC00,
# COSGN00, USRSEC) and the menu transaction are verified by the SEC and MNU
# scenarios; the batch record copybooks and the data files are verified at the
# lowest level that executes them.
inventory_ids:
- INV-ACT-166  # COACTUPC Phone Number 1: area code a North America general-purpose code (EDIT-AREA-CODE)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: VALID-GENERAL-PURP-CODE, which refuses 123
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute set on ACSPH1A
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the four date edits, all passed
- INV-LAY-014  # CSUTLDWY: the date-edit working storage
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix COACTUPC strings the untrimmed 25-byte WS-EDIT-VARIABLE-NAME in
# EDIT-AREA-CODE (COACTUPC.cl2:2302-2317), so its 75-byte message would read
# 'Phone Number 1           : Not valid North America general purpose area cod';
# a UniKix run never verifies the item, and the app/ text is pinned.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
        CUST-ADDR-ZIP: '27601'
        CUST-PHONE-NUM-1: (919)555-0101
        CUST-PHONE-NUM-2: (919)555-0102
        CUST-SSN: '123456789'
        CUST-GOVT-ISSUED-ID: TESTGOVT0001
        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: Y
        CUST-FICO-CREDIT-SCORE: '700'
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
# PASSWORD is the documented demo password of README.md, not a secret.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  # 123 is numeric and not zero, so only the general-purpose lookup refuses it.
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACSPH1A: '123'
