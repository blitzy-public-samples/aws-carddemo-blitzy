# COACTUPC refuses a date of birth on the 31st of a 30-day month: the
# 31-day-month predicate of EDIT-DAY-MONTH-YEAR in the procedure copybook
# CSUTLDPY, performed for the Date of Birth field through
# EDIT-DATE-CCYYMMDD [app/cbl/COACTUPC.cbl:1533-1543] [app/cpy/CSUTLDPY.cpy:209-226].
#
# Steps 1-3 sign on as USER0001, choose main-menu option 2 and fetch account
# 00000000001, as ACT-COACTUPC-alternate-04 does: CXACAIX gives customer
# 000000001 (card 9680294154603697, line 49 of app/data/ASCII/cardxref.txt),
# ACCTDAT and CUSTDAT are read without UPDATE, and 3202-SHOW-ORIGINAL-VALUES
# shows the records with 'Update account details presented above.'; every
# editable field is DFHBMFSE (unprotected, MDT on), so all of them come back
# on the next AID [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3500-3561,3608-3884].
# Step 4 types 1961, 04 and 31 over the date-of-birth year, month and day
# (fetched as 1961-06-08) and presses ENTER.
# - 1100-RECEIVE-MAP moves them to ACUP-NEW-CUST-DOB-YEAR, -MON and -DAY, the
#   parts of the 8-byte ACUP-NEW-CUST-DOB-YYYY-MM-DD
#   [app/cbl/COACTUPC.cbl:837-842,1253-1275].
# - 1205-COMPARE-OLD-NEW sets CHANGE-HAS-OCCURRED at the account test, which
#   is false because its group-id term compares the LOW-VALUES of the blank
#   Account Group with the fetched spaces (TRIM removes spaces only,
#   GAP-DEF-019), and exits before the customer fields are compared: the date
#   of birth 19610431 would differ from the fetched 19610608 as well, but that
#   comparison is not reached. So 1200-EDIT-MAP-INPUTS sets
#   ACUP-CHANGES-NOT-OK and runs the field edits in screen order
#   [app/cbl/COACTUPC.cbl:1213-1218,1460-1470,1697-1704,3847].
# - Account Status (Y), Open Date (2014-11-20), Credit Limit, Expiry Date
#   (2025-05-20), Cash Credit Limit, Reissue Date (2025-05-20), Current
#   Balance, the two cycle amounts and the SSN (123-45-6789) pass; the three
#   dates pass every CSUTLDPY predicate and EDIT-DATE-LE's CSUTLDTC call with
#   mask YYYYMMDD, so WS-RETURN-MSG is still off
#   [app/cbl/COACTUPC.cbl:1472-1531,2431-2489] [app/cpy/CSUTLDPY.cpy:284-310].
# - For the Date of Birth, EDIT-YEAR-CCYY accepts 1961 (century 19),
#   EDIT-MONTH accepts 04 and EDIT-DAY accepts 31. EDIT-DAY-MONTH-YEAR then
#   finds month 4 outside WS-31-DAY-MONTH (1, 3, 5, 7, 8, 10, 12) with
#   WS-DAY-31 set, sets INPUT-ERROR, FLG-DAY-NOT-OK and FLG-MONTH-NOT-OK,
#   STRINGs the trimmed field name and ':Cannot have 31 days in this month.'
#   into WS-RETURN-MSG, and goes to EDIT-DATE-CCYYMMDD-EXIT, so CSUTLDTC is not
#   called for this date [app/cpy/CSUTLDPY.cpy:18-226,329]
#   [app/cpy/CSUTLDWY.cpy:16-31].
# - The flags copied to WS-EDIT-DT-OF-BIRTH-FLGS are not all LOW-VALUES, so
#   WS-EDIT-DT-OF-BIRTH-ISVALID is false and EDIT-DATE-OF-BIRTH, the only
#   date-of-birth check that reads the clock, is not performed
#   [app/cbl/COACTUPC.cbl:216-230,1538-1543] [app/cpy/CSUTLDPY.cpy:341-368].
#   Every later edit passes on the invented customer below, and an edit writes
#   its message only while WS-RETURN-MSG-OFF holds, so this message stays.
# - INPUT-ERROR leaves ACUP-CHANGES-NOT-OK, which 2000-DECIDE-ACTION only
#   continues on: no READ UPDATE or REWRITE runs [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values, the date of birth
#   1961-04-31 included, with the valid amounts re-edited through
#   +ZZZ,ZZZ,ZZZ.99; 3250-SETUP-INFOMSG sets PROMPT-FOR-CHANGES and moves
#   WS-RETURN-MSG to ERRMSG; 3300 keeps the fields editable, CSSETATY turns
#   DOBMON and DOBDAY red (no '*', neither field is blank) while DOBYEAR keeps
#   its colour, and the cursor goes to DOBMON: 3000-SEND-MAP runs 3250 before
#   3300, so PROMPT-FOR-CHANGES has replaced the FOUND-ACCOUNT-DATA that
#   1200-EDIT-MAP-INPUTS set in WS-INFO-MSG, and the error's FLG-MONTH-NOT-OK
#   and FLG-DAY-NOT-OK, kept as WS-EDIT-DT-OF-BIRTH-FLGS, make
#   FLG-DT-OF-BIRTH-MONTH-NOT-OK the first WHEN of the cursor EVALUATE that
#   holds, ahead of the day WHEN, selecting DOBMONL (the cursor is not
#   asserted); 3390 makes F12=Cancel bright, while F5=Save stays dark without a
#   confirmation prompt
#   [app/cbl/COACTUPC.cbl:2654-2657,2870-2951,2964-2981,2986-3100,3315-3331,
#   3566-3581] [app/cpy/CSSETATY.cpy].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - ERRMSG is 'Date of Birth' (the trimmed X(25) WS-EDIT-VARIABLE-NAME) and
#   ':Cannot have 31 days in this month.', 48 characters, in the 75-byte
#   WS-RETURN-MSG and the 78-byte ERRMSGO.
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   FKEY05 is dark (ASKIP,DRK) and the s3270 capture renders it as blanks.
# - The tpe adapter enters a field with EraseEOF before typing. No upper-case
#   translation of input is assumed: CARDDEMO.CSD defines none for CAUP.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every other
# COACTUPC edit: the repository record has FICO 274, below 300, and zip 12546,
# which is not a North Carolina zip [app/cbl/COACTUPC.cbl:2514-2558]. Area code
# 919 is a general-purpose code and NC27 a valid state and zip pair
# [app/cpy/CSLKPCDY.cpy:521,895,1186]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-080
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001 with its customer 000000001, changes the date of birth
  from 1961-06-08 to 1961-04-31 and presses ENTER. COACTUPC refuses the date:
  the message line shows 'Date of Birth:Cannot have 31 days in this month.',
  the screen keeps the entered values, 1961-04-31 included, editable under
  'Update account details presented above.', and F12=Cancel is shown while
  F5=Save is not. Nothing is saved: ACCTDATA and CUSTDATA still hold the
  fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-138  # COACTUPC Date of Birth: no 31st in a 30-day month (EDIT-DAY-MONTH-YEAR field edit)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute set on DOBMON and DOBDAY
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the date edits, the refusing 31-day-month check included
- INV-LAY-014  # CSUTLDWY: the date-edit work areas and the 31-day-month condition
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY drops FUNCTION TRIM from the field name of every composed
# date-edit message, so the ERRMSG of screen 4 differs on UniKix.
- GAP-DOC-024
# The Open, Expiry and Reissue Date edits before the Date of Birth pass only if
# CEEDAYS, called through CSUTLDTC, accepts 20141120 and 20250520, which no run
# has observed; otherwise an earlier date message would stand.
- GAP-INF-001
# The UniKix COACTUPC comments out the TEST-NUMVAL-C amount checks that set the
# numeric amounts 3203-SHOW-UPDATED-VALUES re-edits, and drops TRIM from its
# change detection, so the amounts on screen 4 may differ on UniKix.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
