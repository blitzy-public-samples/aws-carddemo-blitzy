# Derived baseline of scenario ACT-COACTUPC-recovery-02: USER0001 signs on,
# takes main-menu option 2, fetches account 00000000001 on COACTUP, changes the
# FICO score from 700 to 720, has the change validated and presses PF5 while
# another task holds the account record under READ UPDATE. Authored from the
# source, never captured: app/cbl/COACTUPC.cbl:859-1019,1429-1467,2562-2615,
# 2649-2982,3566-3600,3888-3915 with app/bms/COACTUP.bms and app/cpy/COTTL01Y.cpy;
# app/cbl/COSGN00C.cbl:221-237 (type U routed to COMEN01C).
# Open until a UniKix run is imported: GAP-INF-005 (derived ACT end-to-end
# baselines) and GAP-INF-012 (online-only copybooks). No adapter can hold an
# online record lock (GAP-MIS-014), so the scenario stays implemented-unexecuted.
# One screen per step, each the one shown after the step's AID:
# 1. the main menu COMEN01;
# 2. COACTUP on first entry: a cleared map with PROMPT-FOR-SEARCH-KEYS;
# 3. the fetch: 3202-SHOW-ORIGINAL-VALUES with PROMPT-FOR-CHANGES;
# 4. the validated change: 3203-SHOW-UPDATED-VALUES with PROMPT-FOR-CONFIRMATION,
#    F5=Save and F12=Cancel brightened;
# 5. the failed save: READ UPDATE on ACCTDAT answers other than NORMAL, so
#    COULD-NOT-LOCK-ACCT-FOR-UPDATE goes to ERRMSG, state 'L' shows
#    INFORM-FAILURE in INFOMSG, the received values are echoed, only F12=Cancel
#    is bright, and neither record is rewritten.
# Values are whole BMS fields with their trailing spaces: WS-INFO-MSG X(40) pads
# to INFOMSG 45, WS-RETURN-MSG X(75) to ERRMSG 78, amounts go through
# +ZZZ,ZZZ,ZZZ.99. LOW-VALUES and DRK fields show as blanks in the capture.
# CURDATE and CURTIME come from the run clock, which UniKix cannot fix, hence
# the matchers. messages holds the ERRMSG of each step.
file_state:
  ACCTDATA:
    contains:
    - ACCT-ACTIVE-STATUS: Y
      ACCT-ADDR-ZIP: A000000000
      ACCT-CASH-CREDIT-LIMIT: '1020.00'
      ACCT-CREDIT-LIMIT: '2020.00'
      ACCT-CURR-BAL: '194.00'
      ACCT-CURR-CYC-CREDIT: '0.00'
      ACCT-CURR-CYC-DEBIT: '0.00'
      ACCT-EXPIRAION-DATE: '2025-05-20'
