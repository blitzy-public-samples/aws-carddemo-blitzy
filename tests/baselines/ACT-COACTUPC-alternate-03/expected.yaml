# Derived baseline of scenario ACT-COACTUPC-alternate-03: USER0001 signs on,
# takes main menu option 2 and fetches account 00000000001 on COACTUP, which
# shows the account and customer details with the information prompt
# 'Update account details presented above.' (WS-INFO-MSG condition
# PROMPT-FOR-CHANGES [app/cbl/COACTUPC.cbl:463-471]). Authored from the
# source, never captured; open until a UniKix run is imported: GAP-INF-005
# (derived ACT end-to-end baselines) and GAP-INF-012 (online-only copybooks).
# Derived, so no datasets/.
# One screen per step, each the one shown after the step's AID:
# 1. the main menu COMEN01, asserted by its header only
#    [app/cbl/COSGN00C.cbl:232-237];
# 2. COACTUP on fresh entry from the menu, asserted by its header only
#    [app/cbl/COACTUPC.cbl:964-973,2668-2676];
# 3. the fetch: the COMMAREA returns with CDEMO-PGM-REENTER and
#    ACUP-DETAILS-NOT-FETCHED, so 1210-EDIT-ACCOUNT accepts the id and
#    2000-DECIDE-ACTION runs 9000-READ-ACCT (CXACAIX, ACCTDAT, CUSTDAT) and
#    sets ACUP-SHOW-DETAILS; 3202-SHOW-ORIGINAL-VALUES moves the stored values
#    and 3250-SETUP-INFOMSG sets PROMPT-FOR-CHANGES and moves the 40-byte
#    WS-INFO-MSG to the 45-byte INFOMSG and the blank 75-byte WS-RETURN-MSG to
#    the 78-byte ERRMSG [app/cbl/COACTUPC.cbl:880-893,1429-1446,2568-2580,
#    2787-2865,2955-2982,3608-3884]. 3390 shows INFOMSG bright, since
#    WS-INFO-MSG is not blank [app/cbl/COACTUPC.cbl:3566-3570].
# Values are whole BMS fields with their trailing spaces. Amounts are
# WS-EDIT-CURRENCY-9-2-F, PIC +ZZZ,ZZZ,ZZZ.99 [app/cbl/COACTUPC.cbl:371], of
# acctdata.txt record 00000000001, whose blank ACCT-GROUP-ID leaves AADDGRP
# blank; the customer is the scenario's invented record 000000001. CURDATE and
# CURTIME come from the run clock, which UniKix cannot fix, hence the matchers.
