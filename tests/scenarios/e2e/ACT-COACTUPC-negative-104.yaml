# COACTUPC refuses an account update whose Country holds a character that is
# neither a letter nor a space: the Country edit of 1200-EDIT-MAP-INPUTS runs
# 1225-EDIT-ALPHA-REQD, whose 'alphabets only' predicate composes 'Country can
# have alphabets only.' [app/cbl/COACTUPC.cbl:1623-1630,1898-1951].
#
# Where the invalid value comes from (a decision against the plan's typed
# input): the plan types U5A over Country in step 4, but no terminal can.
# 3320-UNPROTECT-FEW-ATTRS gives ACSCTRY DFHBMPRF, protected with its MDT on
# ('Since most of the edits are USA specific protected country')
# [app/cbl/COACTUPC.cbl:3546-3547], so the tpe adapter's EraseEOF on it would
# be refused as an operator error and the scenario could never reach the edit.
# The MDT makes the terminal send the field's content back on every AID, and
# 1100-RECEIVE-MAP moves it to ACUP-NEW-CUST-ADDR-COUNTRY-CD
# [app/cbl/COACTUPC.cbl:1343-1348], so the edit does run on what the customer
# record holds. The invented customer 000000001 therefore carries country U5A,
# and step 4 types only a new Address Line 2, which has no edit of its own
# [app/cbl/COACTUPC.cbl:1613,3124], so that a change is detected and the field
# edits run. The UniKix copy protects Country the same way
# (COACTUPC.cl2:3554-3555).
#
# Steps 1-3 sign on, choose main-menu option 2 and fetch account 00000000001
# as ACT-COACTUPC-alternate-03 does. 9000-READ-ACCT reads CXACAIX by account
# id (customer 000000001), ACCTDAT and CUSTDAT, keeps the records as the old
# values in the COMMAREA and sets ACUP-SHOW-DETAILS; the screen shows them
# with 'Update account details presented above.', ACSCTRY showing U5A
# [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,2955-3000,3500-3561].
# Step 4 types 'Suite 2' over Address Line 2 (ACSADL2, shown as 'Suite 1') and
# presses ENTER:
# - 1100-RECEIVE-MAP moves the received 'Suite 2' to ACUP-NEW-CUST-ADDR-LINE-2
#   and the retransmitted 'U5A' to ACUP-NEW-CUST-ADDR-COUNTRY-CD
#   [app/cbl/COACTUPC.cbl:1322-1327,1343-1348].
# - 1205-COMPARE-OLD-NEW finds a change, so 1200-EDIT-MAP-INPUTS sets
#   ACUP-CHANGES-NOT-OK and runs the field edits in screen order
#   [app/cbl/COACTUPC.cbl:1460-1470,1681-1766]. Account Status, the three
#   dates, the five amounts, SSN, Date of Birth, FICO, the three names,
#   Address Line 1, State, Zip and City pass on the repository account and
#   the invented customer, so WS-RETURN-MSG is still blank.
# - 'Country' is moved to WS-EDIT-VARIABLE-NAME and the 3-byte 'U5A' to
#   WS-EDIT-ALPHANUM-ONLY. 1225-EDIT-ALPHA-REQD finds it supplied; INSPECT
#   CONVERTING turns its letters into spaces, leaving ' 5 ', whose trimmed
#   length is 1, so it sets INPUT-ERROR and FLG-ALPHA-NOT-OK and STRINGs
#   TRIM(WS-EDIT-VARIABLE-NAME) and ' can have alphabets only.' into
#   WS-RETURN-MSG; WS-EDIT-COUNTRY-FLGS becomes FLG-COUNTRY-NOT-OK
#   [app/cbl/COACTUPC.cbl:1898-1951]. The INSPECT converts the working copy
#   only, so ACUP-NEW-CUST-ADDR-COUNTRY-CD keeps U5A.
# - The phone, EFT, primary card holder and state/zip edits pass and could not
#   overwrite the message anyway, since every STRING is guarded by
#   WS-RETURN-MSG-OFF [app/cbl/COACTUPC.cbl:1632-1668,2536-2558].
# - 2000-DECIDE-ACTION continues on ACUP-CHANGES-NOT-OK, so
#   9600-WRITE-PROCESSING (PF5 only) does not run and nothing is written
#   [app/cbl/COACTUPC.cbl:2596-2605].
# - 3203-SHOW-UPDATED-VALUES shows the received values, Address Line 2 and
#   Country as received and the amounts re-edited through
#   WS-EDIT-CURRENCY-9-2-F; 3250 sets PROMPT-FOR-CHANGES and moves the message
#   to ERRMSG; 3300 puts the cursor on ACSCTRY, and CSSETATY colours it red
#   without the '*' of a blank field; 3390 makes F12=Cancel bright because
#   changes were made, and leaves F5=Save dark [app/cbl/COACTUPC.cbl:2870-2951,
#   2955-2983,3132-3136,3387-3391,3566-3581] [app/cpy/CSSETATY.cpy:17-27].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   ERRMSG is 'Country can have alphabets only.' (32 characters) in the
#   75-byte WS-RETURN-MSG, moved to the 78-byte ERRMSGO: 46 trailing spaces.
#   ACSADL2 is 'Suite 2' in its 50-byte field. INFOMSG is the 40-byte
#   WS-INFO-MSG in the 45-byte INFOMSGO.
# - AADDGRP is sent as LOW-VALUES on screen 4 (the blank group id comes back as
#   spaces, which 1100 turns into LOW-VALUES); s3270 shows nulls as spaces.
# - A dark (DRK) field is captured as blanks; colour and cursor position are
#   not in the s3270 text capture and are not asserted. No upper-case
#   translation of input is assumed (CARDDEMO.CSD gives CAUP the profile
#   DFHCICST).
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit except Country (the repository record has FICO 274, phone-2 area code
# 373 and zip 12546 for NC, which the FICO, phone and state/zip edits refuse)
# [app/cbl/COACTUPC.cbl:2225-2558].
id: ACT-COACTUPC-negative-104
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update) and fetches
  account 00000000001, whose customer record holds the country code U5A in
  the protected Country field. USER0001 types a new Address Line 2 and
  presses ENTER, so the field edits run and COACTUPC refuses the change: the
  message line shows 'Country can have alphabets only.', Country still shows
  U5A and Address Line 2 the typed value, the other received values are shown
  again with the change prompt and F12=Cancel, and neither ACCTDATA nor
  CUSTDATA is rewritten.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. The change prompt 'Update account details presented above.'
# (INV-ACT-030) is asserted but verified by its own scenario. Sign-on (CC00,
# COSGN00, USRSEC) and the menu transaction are verified by the SEC and MNU
# scenarios; the batch record copybooks and the data files are verified at the
# lowest level that executes them.
inventory_ids:
- INV-ACT-162  # COACTUPC Country: alphabets only (1225-EDIT-ALPHA-REQD)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the state and area-code lookups the earlier edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute set on ACSCTRY
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the four date edits, all passed
- INV-LAY-014  # CSUTLDWY: the date-edit working storage
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix COACTUPC strings the untrimmed 25-byte WS-EDIT-VARIABLE-NAME in
# 1225-EDIT-ALPHA-REQD (COACTUPC.cl2:1939-1944), so its message would read
# 'Country' plus 18 spaces before ' can have alphabets only.'; a UniKix run
# never verifies the item, and the app/ text is pinned.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
# The four date edits before Country call CSUTLDTC; the expected message rests
# on CEEDAYS accepting the repository dates and the invented date of birth.
- GAP-INF-001
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios, except that its country code U5A holds a digit: the protected
    # Country field can only be given an invalid value through the record.
    # The 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: U5A
        CUST-ADDR-ZIP: '27601'
        CUST-PHONE-NUM-1: (919)555-0101
        CUST-PHONE-NUM-2: (919)555-0102
        CUST-SSN: '123456789'
        CUST-GOVT-ISSUED-ID: TESTGOVT0001
        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: Y
        CUST-FICO-CREDIT-SCORE: '700'
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
# PASSWORD is the documented demo password of README.md, not a secret.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  # Address Line 2, which has no edit, is the field changed: ACSCTRY is
  # protected and cannot be typed over (see the header).
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACSADL2: Suite 2
