# Derived baseline of ACT-COACTUPC-negative-032 (capture_platform: derived),
# authored from app/ and never captured. USER0001 signs on, takes main-menu
# option 2, fetches account 00000000001 on COACTUP (CAUP), types 1A over the
# Expiry Date month 05 and presses ENTER; COACTUPC refuses the change.
# - Steps 1-3 end on the main menu, the COACTUP search screen ('Enter or update
#   id of account to update') and the fetched details ('Update account details
#   presented above.') [app/cbl/COACTUPC.cbl:964-973,2568-2580,2787-2865,
#   2955-2981].
# - Step 4: 1205-COMPARE-OLD-NEW sees the changed expiry month,
#   1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK, and Account Status, Open Date
#   and Credit Limit pass with the fetched values [app/cbl/COACTUPC.cbl:
#   1460-1494]. For 'Expiry Date', EDIT-YEAR-CCYY accepts 2025 and EDIT-MONTH
#   of CSUTLDPY refuses month 1A through FUNCTION TEST-NUMVAL (or, on a
#   platform whose compare fails WS-VALID-MONTH first, through the range check,
#   which composes the same text) [app/cpy/CSUTLDPY.cpy:91-147]
#   [app/cpy/CSUTLDWY.cpy:16-20]. TRIM gives 'Expiry Date', so ERRMSG is the
#   53-character message padded to 78; later edits keep it because
#   WS-RETURN-MSG is no longer off, and CSUTLDTC is not called for this date.
#   2000-DECIDE-ACTION continues, so nothing is rewritten and both files keep
#   their fixture records [app/cbl/COACTUPC.cbl:2596-2597].
# - The screen shows the received values (3203, the month as typed, amounts
#   re-edited because their edits passed), the change prompt, and F12=Cancel
#   bright while F5=Save stays dark and is captured as blanks
#   [app/cbl/COACTUPC.cbl:2870-2947,3566-3581].
# The month is 1A, as the scenario types it to isolate the numeric check
# (INV-ACT-090); the plan's month 14 exercises the range check, which is
# ACT-COACTUPC-negative-031's item (INV-ACT-089).
# Fields are full BMS width with trailing spaces kept; CURDATE and CURTIME are
# run-clock matchers. Open under GAP-INF-005 and GAP-INF-012; the UniKix
# CSUTLDPY composes a different text (GAP-DOC-024). Only
# `report.py --import-unikix` promotes it from imported UniKix evidence.
