# Derived baseline of scenario CRD-COCRDLIC-normal-01, authored from the
# COCRDLIC source, the COCRDLI map and the CARDDATA fixture, never captured.
# An imported UniKix run replaces it.
# One screen per step, the one shown after the step's AID:
# 1. COMEN01 after sign-on, identified only; the menu's content belongs to
#    the COMEN01C scenarios.
# 2. Card list page 1 after option 3. Entered from the menu, COCRDLIC starts
#    afresh, browses CARDDAT GTEQ from a blank key with no filter and fills
#    its 7 rows in card-number order. The look-ahead READNEXT finds the 8th
#    card, so a next page exists, ERRMSG stays blank and INFOMSG shows the
#    record-actions prompt. The filters stay at LOW-VALUES.
# 3. ENTER with card filter 4011500891777367 and no account filter. Only that
#    card passes 9500-FILTER-RECORDS; the browse then reaches the end of the
#    file, so ERRMSG holds 'NO MORE RECORDS TO SHOW', CARDSID echoes the
#    filter, rows 2-7 stay at LOW-VALUES and the page number stays 1.
# Assumption (step 3): with no row selected, VIEW-REQUESTED-ON and
# UPDATE-REQUESTED-ON are tested with subscript 0. The byte read there, the
# sign byte x'0C' of the packed WS-EDIT-SELECT-COUNTER, is taken as neither
# 'S' nor 'U', and the region as raising no subscript-range abend. Step 2
# rests on the same assumption: on the first display after the menu
# I-SELECTED is still at its VALUE 0. The assumption is the suspected defect
# GAP-DEF-024.
# Values are whole BMS fields with their trailing spaces, and LOW-VALUES
# show as spaces. CURDATE and CURTIME are run-clock matchers.
