# The customer master load job CUSTFILE run end to end: close the CUSTDAT
# region file (CLCIFIL), DELETE the customer KSDS with IF MAXCC LE 08 THEN SET
# MAXCC = 0 (STEP05), DEFINE it again with KEYS(9 0) and RECORDSIZE(500 500)
# (STEP10), REPRO the sequential CUSTDATA.PS into it (STEP15), and reopen the
# region file (OPCIFIL) [app/jcl/CUSTFILE.jcl:22-27,32-38,43-60,64-72,76-81].
#
# The KSDS already exists and holds one stale customer, CUST-ID 999999999, so
# the scenario shows the job replaces the file rather than adding to it: the
# DELETE finds the cluster (RC 0 before the MAXCC reset), and after the REPRO
# the KSDS holds exactly the 50 repository customers in CUST-ID order, without
# the stale record. The stale customer is invented data that matches no real
# person. The two CEMT steps act on the CICS region: gnucobol-batch replaces
# them with a no-op of RC 0 (GAP-STB-008), and on UniKix they run the copy's
# no-op SDSF.cbl (GAP-DOC-031), so neither adapter changes region state
# through them and this scenario asserts none.
#
# The inline values are those observed on gnucobol-batch; the observed
# baseline holds the decoded records in full and their raw bytes. Text keeps
# its full field width, because decoded comparison is exact. Only the job item
# is listed: CVCUS01Y and the customer data files are verified by the unit
# scenarios that execute them (DAT-CBCUS01C-*). The job writes no date, so its
# outcome holds at any run date: the scenario declares clock_mode relative,
# which lets unikix run it without the clock control it lacks (GAP-MIS-015).
id: DAT-CUSTFILE-normal-01
level: integration
type: normal
description: >-
  CUSTFILE deletes the existing customer KSDS (which holds one stale record),
  defines it again, loads the 50 repository customers from the sequential
  customer file and ends with every step at return code 0; the KSDS then holds
  the 50 customers in CUST-ID order and no longer holds the stale record.
inventory_ids:
- INV-DAT-008  # CUSTFILE job
tags: []
gap_ids:
- GAP-STB-005  # IDCAMS DELETE, DEFINE CLUSTER and REPRO replacement
- GAP-STB-008  # SDSF CEMT steps CLCIFIL and OPCIFIL replaced by a no-op with RC 0
- GAP-STB-009  # per-scenario catalog in place of the z/OS catalog
- GAP-STB-010  # Berkeley DB indexed file in place of the VSAM KSDS
- GAP-DOC-031  # on UniKix the CEMT steps run the copy's no-op SDSF.cbl
preconditions:
  datasets:
    CUSTDATA-PS: {base: CUSTDATA-PS}
    CUSTDATA:
      records:
      - CUST-ID: '999999999'
        CUST-FIRST-NAME: Synthetic
        CUST-LAST-NAME: Stale
        CUST-ADDR-LINE-1: 9 Invented Way
        CUST-ADDR-LINE-3: Testville
  parameters:
    clock_mode: relative
  faults: []
inputs:
  job: CUSTFILE
expected:
  return_code: 0
  messages:
  - STEP CLCIFIL RC 0000
  - STEP STEP05 RC 0000
  - STEP STEP10 RC 0000
  - STEP STEP15 RC 0000
  - STEP OPCIFIL RC 0000
  datasets:
    # The 50 customers of the sequential file, in CUST-ID order; the stale
    # record 999999999 is gone.
    CUSTDATA:
      records:
