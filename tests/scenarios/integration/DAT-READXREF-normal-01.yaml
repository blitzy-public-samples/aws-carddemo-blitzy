# The READXREF job: its one step, STEP05, runs CBACT03C against the card
# cross-reference KSDS [app/jcl/READXREF.jcl:22-28]. CARDXREF is built from
# app/data/ASCII/cardxref.txt, whose 36-character lines are padded with spaces
# to the 50-byte record (GAP-DOC-010), the same 50 records the unit scenario
# DAT-CBACT03C-normal-01 lists.
#
# Only the job item is listed: the program, the CVACT03Y layout and the data
# files are verified at the lowest level that executes them, the unit scenario.
# The job adds what the program alone cannot show: the step runs CBACT03C on the
# dataset the job allocates, and the job ends with that step's return code.
#
# The job only lists the file, which the tech spec describes as populating it
# (GAP-DOC-004). Every record is displayed twice, pinned as observed: READ ...
# INTO CARD-XREF-RECORD displays it when the status is 00, and the main loop
# displays it again while END-OF-FILE is still 'N' [app/cbl/CBACT03C.cbl:71-87,92-116].
# Each record line is the 50-byte CVACT03Y image, its 14-byte FILLER displayed as
# spaces, so the quoted lines keep their trailing spaces; records follow
# card-number (primary key) order. The first message is the step line both
# adapters write ahead of the step's DISPLAY lines.
#
# Nothing here depends on the run date, so the scenario declares clock_mode
# relative and runs unchanged on unikix, whose clock cannot be fixed (GAP-MIS-015).
id: DAT-READXREF-normal-01
level: integration
type: normal
description: >-
  The READXREF job runs CBACT03C in its single step STEP05, which lists the 50
  repository card cross-reference records in card-number order, each displayed
  twice between the start and end of execution lines; the step and the job end
  with return code 0.
