# Derived baseline of scenario USR-COUSR01C-negative-03: ADMIN001 adds a user
# on COUSR01 with the last name left empty. Authored from the source, never
# captured: app/cbl/COSGN00C.cbl:230-237 and app/cbl/COADM01C.cbl:136-145 (the
# type-A route and option 2), app/cbl/COUSR01C.cbl:73-129,153-160,184-233 (the
# first-entry send, the FNAME-then-LNAME checks, the skipped WRITE and the
# header), app/bms/COUSR01.bms, app/cpy/COTTL01Y.cpy, and the USRSEC fixture
# app/data/EBCDIC/AWS.M2.CARDDEMO.USRSEC.PS. Open until a UniKix run is
# imported: GAP-INF-004 and GAP-INF-012.
# One screen per step, each the screen shown after the step's AID; values are
# full BMS field width with trailing spaces kept, and PASSWD (DRK) is not
# asserted. ERRMSG is the 29-character message padded to the 78 bytes of
# ERRMSGO. No record is written, so file_state lists the 10 fixture users in
# key order. Its records name the user id, names and type; SEC-USR-PWD is left
# out so that no credential value is written into a baseline, and
# SEC-USR-FILLER carries no business data.
file_state:
  USRSEC:
  - SEC-USR-FNAME: 'MARGARET            '
    SEC-USR-ID: ADMIN001
    SEC-USR-LNAME: 'GOLD                '
    SEC-USR-TYPE: A
  - SEC-USR-FNAME: 'RUSSELL             '
    SEC-USR-ID: ADMIN002
