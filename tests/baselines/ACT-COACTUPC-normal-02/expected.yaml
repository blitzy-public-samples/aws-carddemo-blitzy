# Derived baseline of scenario ACT-COACTUPC-normal-02: USER0001 signs on,
# takes main menu option 2 'Account Update', fetches account 00000000001 on
# COACTUP (transaction CAUP), changes the FICO score of customer 000000001 from
# 700 to 720, gets 'Changes validated.Press F5 to save' and saves with PF5:
# 'Changes committed to database'. Customer 000000001 is the scenario's
# invented record, which passes every edit of 1200-EDIT-MAP-INPUTS.
# Authored from the source, never captured:
# - app/cbl/COSGN00C.cbl:230-238 (type U -> COMEN01C) and app/cbl/COMEN01C.cbl
#   with app/cpy/COMEN02Y.cpy (option 2 -> COACTUPC, fresh entry);
# - app/cbl/COACTUPC.cbl: 880-886,964-973 (fresh entry, search-key prompt);
#   2568-2580,3608-3884 and 2787-2866 (fetch, fetched values shown,
#   'Update account details presented above.'); 1039-1425 (received values:
#   blank or '*' become LOW-VALUES, shown as spaces); 1429-1676 and 2870-2950
#   (every edit passes, received values echoed, amounts through
#   PIC +ZZZ,ZZZ,ZZZ.99); 2955-2982 (INFOMSG); 3566-3583 (F5=Save and
#   F12=Cancel bright only while PROMPT-FOR-CONFIRMATION); 3888-4192 (READ
#   UPDATE, no change since the fetch, REWRITE of ACCTDAT and CUSTDAT);
# - header from app/cpy/COTTL01Y.cpy and app/cpy/CSDAT01Y.cpy, run-clock fields
#   as matchers; field widths from app/bms/COACTUP.bms.
# After PF5 the fields show the values received with the PF5 (FICO 720), not
# the fetched ones: ACUP-CHANGES-MADE includes 'C' (ACUP-CHANGES-OKAYED-AND-
# DONE) [app/cbl/COACTUPC.cbl:660-662], so 3200-SETUP-SCREEN-VARS performs
# 3203-SHOW-UPDATED-VALUES ahead of its WHEN OTHER [app/cbl/COACTUPC.cbl:
# 2710-2724].
# file_state asserts what the scenario asserts: 50 records each, and of the
# rewritten records only the fields COACTUPC fills from the screen. Left out
# on purpose: the customer FILLER and the account's ACCT-ADDR-ZIP,
# ACCT-GROUP-ID and FILLER, which ACCT-UPDATE-RECORD and CUST-UPDATE-RECORD
# fill from never-initialized working storage (INITIALIZE skips FILLER) and
# from ACUP-NEW-GROUP-ID landing on the zip [app/cbl/COACTUPC.cbl:418-456],
# values no source fixes.
# Open under GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012
# (online-only copybooks). Only `report.py --import-unikix` promotes it, from
# imported UniKix evidence; it is never edited by hand to match a run.
