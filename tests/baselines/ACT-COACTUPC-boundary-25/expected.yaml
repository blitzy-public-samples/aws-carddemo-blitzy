# Derived baseline of scenario ACT-COACTUPC-boundary-25 (capture_platform:
# derived), authored from the app/ source and never observed: no TPE region
# runs in CI. Open until a UniKix run of the app/ build is imported:
# GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012 (online-only
# copybooks such as CSUTLDPY and CSLKPCDY).
# Steps 1-3: USER0001 signs on, option 2 XCTLs to COACTUPC, and ENTER with
# account 00000000001 shows the fetched account and customer with the change
# prompt [app/cbl/COACTUPC.cbl:2787-2865,2955-2981].
# Step 4: 665 over ACTSSN1 is a change, so 1200-EDIT-MAP-INPUTS sets
# ACUP-CHANGES-NOT-OK and edits every field; 1265-EDIT-US-SSN finds '665'
# supplied, numeric and not zero, and it is none of INVALID-SSN-PART1 (VALUES
# 0, 666, 900 THRU 999), so no SSN message is composed; every other field
# passes on the invented customer, so ACUP-CHANGES-OK-NOT-CONFIRMED is set
# [app/cbl/COACTUPC.cbl:117-123,1460-1676,2431-2489].
# ENTER is not PF5, so 2000-DECIDE-ACTION continues without 9600-WRITE-
# PROCESSING and nothing is rewritten; 3203 shows the received values, 3250
# moves 'Changes validated.Press F5 to save' to INFOMSG and the blank
# WS-RETURN-MSG to ERRMSG, and 3390 brightens F5=Save and F12=Cancel, which
# are dark, and so captured as blanks, on the fetched screen
# [app/cbl/COACTUPC.cbl:2602-2621,2870-2945,2955-2983,3566-3584].
# This pins app/ behaviour: the UniKix COACTUPC changes the edits and the
# change detection on this path (GAP-DOC-022), and its CSUTLDTC and CSUTLDPY
# the date edits it passes (GAP-DOC-021, GAP-DOC-024); such a record is
# UniKix-copy behaviour and never replaces this file.
# Screen values are full BMS width with trailing spaces kept (ERRMSG 78,
# INFOMSG 45), because screens compare exactly. CURDATE and CURTIME come from
# the region clock, so they are matchers. file_state holds the records as the
# preconditions materialize them, decoded through CVACT01Y and CVCUS01Y.
file_state:
  ACCTDATA:
