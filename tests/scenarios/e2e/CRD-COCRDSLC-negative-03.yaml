# The card view refuses a search with the account given and the card number
# left blank. USER0001 signs on through CC00 and reaches the main menu, whose
# option 4 'Credit Card View' makes COMEN01C XCTL to COCRDSLC with the program
# context reset to enter [app/cbl/COMEN01C.cbl:117-155] [app/cpy/COMEN02Y.cpy:43-47].
# Entered from the menu without the reenter flag, COCRDSLC initializes the
# COMMAREA, takes the CDEMO-PGM-ENTER path and sends COCRDSL with both filters
# blank (CDEMO-ACCT-ID and CDEMO-CARD-NUM are zero), the INFOMSG prompt and no
# error; 1400-SEND-SCREEN then sets CDEMO-PGM-REENTER and the task returns
# TRANSID CCDL [app/cbl/COCRDSLC.cbl:264-279,349-356,394-406,457-497,563-576].
#
# Step 3 types account 00000000050 and erases the card number before ENTER.
# CARDSID comes back empty, so RECEIVE MAP leaves CARDSIDI as LOW-VALUES and
# 2200-EDIT-MAP-INPUTS moves them to CC-CARD-NUM [app/cbl/COCRDSLC.cbl:357-359,
# 596-627]. 2210-EDIT-ACCOUNT accepts the 11-digit account and stores it in
# CDEMO-ACCT-ID [app/cbl/COCRDSLC.cbl:647-679]. 2220-EDIT-CARD finds the card
# blank, sets INPUT-ERROR and FLG-CARDFILTER-BLANK and, since WS-RETURN-MSG is
# still off from the start of the task, sets WS-PROMPT-FOR-CARD 'Card number
# not provided' [app/cbl/COCRDSLC.cbl:140-141,264,685-701]. The cross-field edit
# needs both filters blank, so it leaves the message in place
# [app/cbl/COCRDSLC.cbl:637-640].
#
# INPUT-ERROR skips 9000-READ-DATA, so no CARDDAT read is issued although the
# fixture holds the repository cards, and COCRDSL is sent again
# [app/cbl/COCRDSLC.cbl:360-363]. 1200-SETUP-SCREEN-VARS shows the account from
# CC-ACCT-ID, leaves the card number and the card details as LOW-VALUES and,
# because WS-INFO-MSG starts blank on every task, puts the prompt back in
# INFOMSG [app/cbl/COCRDSLC.cbl:254-256,457-496]. 1300-SETUP-SCREEN-ATTRS marks
# the blank card filter of a re-entry with '*' in CARDSID
# [app/cbl/COCRDSLC.cbl:547-551].
#
# Screen fields are compared at their full BMS length, trailing spaces
# included; positions the program leaves as LOW-VALUES read back as spaces.
# ERRMSG is the 75-byte WS-RETURN-MSG in the 80-byte field that starts at row
# 23, column 2, so its last position is the FKEYS attribute byte at row 24,
# column 1 and reads as a space. INFOMSG is the 40-byte WS-INFO-MSG, CARDSID the
# '*' padded to 16. CURDATE and CURTIME come from the region clock, so they are
# matchers. The baseline is derived from the source: no TPE region runs in CI.
id: CRD-COCRDSLC-negative-03
level: e2e
type: negative
description: >-
  USER0001 signs on, selects option 4 'Credit Card View' on the main menu and,
  on the COCRDSLC card view screen (CCDL), presses ENTER with account
  00000000050 and the card number left blank. COCRDSLC reads no file and
  sends the card view again with 'Card number not provided' in the message
  line, the account kept, '*' in the card number field, the prompt 'Please
  enter Account and Card Number' in INFOMSG and no card details.
inventory_ids:
- INV-CRD-030  # COCRDSLC message 'Card number not provided' (rule)
- INV-CRD-002  # COCRDSLC program
- INV-MNU-003  # COMEN01 map, the main menu option 4 is entered on
- INV-CRD-005  # COCRDSL map, sent on entry and again with the refusal
- INV-CFG-013  # CCDL transaction, the TRANSID COCRDSLC returns with and the ENTER runs under
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA whose reenter flag routes the ENTER to the edits
- INV-LAY-005  # COTTL01Y copybook, TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y copybook, CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y copybook, copied by COCRDSLC
- INV-LAY-009  # CSMSG02Y copybook, the abend data COCRDSLC copies
- INV-LAY-011  # CSSTRPFY copybook, YYYY-STORE-PFKEY mapping ENTER to CCARD-AID-ENTER
- INV-LAY-019  # CVCRD01Y copybook, CCARD-AID and the CC-ACCT-ID and CC-CARD-NUM filters
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-006  # CRD end-to-end baselines derived from the source, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    USRSEC: {base: USRSEC}
    CARDDATA: {base: CARDDATA}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - {transid: CC00, aid: ENTER, fields: {USERID: USER0001, PASSWD: PASSWORD}, '@map': COSGN00}
  - {aid: ENTER, fields: {OPTION: '4'}, '@map': COMEN01}
  - {aid: ENTER, fields: {ACCTSID: '00000000050', CARDSID: ''}, '@map': COCRDSL}
expected:
  screens:
  # One entry per step, each the screen the step ends on.
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    ERRMSG: '                                                                              '
  - '@map': COCRDSL
    TRNNAME: CCDL
    PGMNAME: COCRDSLC
    ACCTSID: '           '
    CARDSID: '                '
    INFOMSG: 'Please enter Account and Card Number    '
    ERRMSG: '                                                                                '
  - '@map': COCRDSL
    TRNNAME: CCDL
    PGMNAME: COCRDSLC
    TITLE01: '      AWS Mainframe Modernization       '
    TITLE02: '              CardDemo                  '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time, format: '%H:%M:%S'}
    ACCTSID: '00000000050'
    CARDSID: '*               '
    CRDNAME: '                                                  '
    CRDSTCD: ' '
    EXPMON: '  '
    EXPYEAR: '    '
    INFOMSG: 'Please enter Account and Card Number    '
    ERRMSG: 'Card number not provided                                                        '
  # One ERRMSG value per step: blank on the menu and on the first card view,
  # then the refusal of the blank card number.
  messages:
  - '                                                                              '
  - '                                                                                '
  - 'Card number not provided                                                        '
