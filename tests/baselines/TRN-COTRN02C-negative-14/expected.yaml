# Derived baseline of scenario TRN-COTRN02C-negative-14 (capture_platform
# derived, tag inferred-not-observed): USER0001 signs on, takes main-menu
# option 8 (Transaction Add) and enters a transaction on COTRN02 by card
# number 0500024453765740 with every field supplied except Merchant ID.
# COTRN02C refuses it with 'Merchant ID can NOT be empty...' and writes
# nothing. Authored from the source, never captured; no TPE region runs in CI:
# - step 1: COSGN00C XCTLs the type-U user to COMEN01C, which sends COMEN01
#   headed CM00/COMEN01C [app/cbl/COSGN00C.cbl:230-237]
#   [app/cbl/COMEN01C.cbl:36-37];
# - step 2: option 8 is COTRN02C [app/cpy/COMEN02Y.cpy:66-71]; its first entry
#   moves LOW-VALUES to COTRN2AO and sends the empty add screen headed
#   CT02/COTRN02C with a blank ERRMSG [app/cbl/COTRN02C.cbl:112-130,516-534];
# - step 3: ACTIDIN is blank, so VALIDATE-INPUT-KEY-FIELDS takes the card
#   branch: the card goes back to CARDNINI through the PIC 9(16)
#   WS-CARD-NUM-N, READ CCXREF is NORMAL, and XREF-ACCT-ID 00000000050
#   (record 1 of app/data/ASCII/cardxref.txt) replaces ACTIDINI
#   [app/cbl/COTRN02C.cbl:210-223,609-637]. VALIDATE-INPUT-DATA-FIELDS starts
#   with ERR-FLG off, so no field is cleared; Type CD through Proc Date are
#   supplied and MIDI = SPACES OR LOW-VALUES moves 'Merchant ID can NOT be
#   empty...' to WS-MESSAGE, then SEND-TRNADD-SCREEN sends COTRN02 with ERASE
#   and RETURNs TRANSID CT02 [app/cbl/COTRN02C.cbl:235-299,516-534]. The task
#   ends there: no later empty check, no amount or date edit, no CSUTLDTC
#   call, no CONFIRM evaluation, no TRANSACT browse or write.
# Values are whole BMS fields of app/bms/COTRN02.bms with trailing spaces
# kept: COTRN2AO redefines COTRN2AI [app/cpy-bms/COTRN02.CPY:145], so the
# entered fields come back as received, and MID and CONFIRM, sent no data,
# come back blank; ERRMSG is the X(80) WS-MESSAGE in the 78-byte ERRMSGO.
# CURDATE (mm/dd/yy) and CURTIME come from the region clock, which cannot be
# fixed (GAP-MIS-015), so they are matchers. messages holds each step's
# ERRMSG in step order.
# file_state: TRANSACT keeps the 300 records materialized from DALYTRAN; its
# highest TRAN-ID, which an add would have numbered after, is unchanged.
# Open under GAP-INF-007 (derived TRN end-to-end baselines) and GAP-INF-012
# (online-only copybooks). Only `report.py --import-unikix` promotes this
# baseline; it is never edited by hand to match a run.
file_state:
  TRANSACT:
    contains:
    - TRAN-AMT: '603.22'
      TRAN-CARD-NUM: '3260763612337560'
      TRAN-CAT-CD: '1'
      TRAN-DESC: 'Purchase at Kilback LLC                                                                             '
      TRAN-ID: 0000000996722787
      TRAN-MERCHANT-CITY: 'Cummeratamouth                                    '
      TRAN-MERCHANT-ID: '800000000'
      TRAN-MERCHANT-NAME: 'Kilback LLC                                       '
      TRAN-MERCHANT-ZIP: 53200-7529
      TRAN-ORIG-TS: '2022-06-10 19:27:53.000000'
      TRAN-PROC-TS: '                          '
      TRAN-SOURCE: 'POS TERM  '
      TRAN-TYPE-CD: '01'
    count: 300
messages:
- '                                                                              '
- '                                                                              '
