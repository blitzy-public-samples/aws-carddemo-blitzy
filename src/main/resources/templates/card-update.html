  ~
  ~ Card Update screen - CICS transaction CCUP, program COCRDUPC. Web equivalent
  ~ of the legacy CICS/BMS map COCRDUP / CCRDUPA ("Update Credit Card Details").
  ~ The 24x80 field contract is mirrored from legacy/app/bms/COCRDUP.bms and the
  ~ shared terminal chrome (head/CSS, header band, message line, PF-key footer)
  ~ is reused from fragments/layout.html. Plain Thymeleaf only - no component
  ~ library and no external CSS/JS (AAP 0.3.4, 0.6.6; 100% UI parity).
-->
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">

<!-- Shared <head> + terminal CSS pulled from the layout fragment; the browser
     tab title is the screen heading. The static children below are prototype
     content only (discarded when Thymeleaf resolves th:replace). -->
<head th:replace="~{fragments/layout :: head('Update Credit Card Details')}">
    <meta charset="UTF-8" />
    <title>Update Credit Card Details</title>
</head>

<body>

<!--
  Screen-scoped layout helpers ONLY (classes, never inline styles). The shared
  colour vocabulary and 24x80 monospace grid live once in fragments/layout.html;
  the rules below only center the BMS line-4 heading and right-align the
  JUS=RIGHT expiry month/year fields, mirroring the class-based pattern used by
  the sibling screen templates (e.g. transaction-add/transaction-view).
-->
<style>
    /* BMS line 4 heading ("Update Credit Card Details", NEUTRAL bright): centered. */
    .card-update-heading { text-align: center; }
    /* EXPMON / EXPYEAR are JUS=RIGHT on the 3270 map: right-aligned numeric entry. */
    .card-update-num { text-align: right; }
</style>

<main class="bms-screen">

    <!-- BMS lines 1-2: header band. Tran=CCUP, Prog=COCRDUPC, centered title
         (TITLE01); date/time + secondary title (TITLE02) are supplied by the
         controller as curDate/curTime/title2 model attributes (the fragment
         falls back to the current date/time when they are absent). -->
    <div th:replace="~{fragments/layout :: header('AWS Mainframe Modernization', 'CCUP', 'COCRDUPC')}"></div>

    <!-- BMS line 4: screen heading (NEUTRAL, centered). -->
    <h1 class="bms-heading card-update-heading">Update Credit Card Details</h1>

    <!--
      Card-update form. Submits back to the Card Update controller (txn CCUP).
      th:object binds the editable form-backing bean `cardUpdateForm`.

      Protected key fields (ACCTSID / CARDSID, PROT on the 3270) are presented
      read-only and carried as hidden inputs so the post preserves the record
      identity for the optimistic update performed by the service. The DRK/PROT
      expiry-day (EXPDAY) is likewise carried as a hidden input to preserve the
      RECEIVE/SEND round-trip without being shown (AAP 0.6.6 REDEFINES note).
    -->
    <form th:object="${cardUpdateForm}" method="post" th:action="@{/card-update}">

        <!-- EXPDAY (DRK/PROT in BMS): hidden, preserved for round-trip. -->
        <input type="hidden" th:field="*{expDay}" />

        <!-- ACCTSID (PROT/ASKIP): account number - read-only key (blue) + round-trip. -->
        <div class="bms-field-row">
            <span class="bms-prompt">Account Number:</span>
            <span class="bms-label" th:text="*{acctSid}">00000000000</span>
            <input type="hidden" th:field="*{acctSid}" />
        </div>

        <!-- CARDSID: card number - read-only key (blue) + round-trip. -->
        <div class="bms-field-row">
            <span class="bms-prompt">Card Number:</span>
            <span class="bms-label" th:text="*{cardSid}">0000000000000000</span>
            <input type="hidden" th:field="*{cardSid}" />
        </div>

        <!-- CRDNAME (UNPROT, green): name on card - editable, 50 chars. -->
        <div class="bms-field-row">
            <label class="bms-prompt" for="crdName">Name on Card:</label>
            <input type="text" id="crdName" class="bms-input"
                   th:field="*{crdName}" maxlength="50" size="50" autocomplete="off" />
        </div>

        <!-- CRDSTCD (UNPROT, green): card active status Y/N - editable, 1 char. -->
        <div class="bms-field-row">
            <label class="bms-prompt" for="crdStcd">Card Active Y/N:</label>
            <input type="text" id="crdStcd" class="bms-input"
                   th:field="*{crdStcd}" maxlength="1" size="1" autocomplete="off" />
        </div>

        <!-- EXPMON / EXPYEAR (UNPROT, green, JUS=RIGHT): expiry month / year -
             editable, right-aligned numeric. BMS renders a single "Expiry Date"
             prompt with the month and year inline, separated by '/'. -->
        <div class="bms-field-row">
            <span class="bms-prompt">Expiry Date:</span>
            <input type="text" id="expMon" class="bms-input card-update-num"
                   th:field="*{expMon}" maxlength="2" size="2"
                   inputmode="numeric" aria-label="Expiry month (MM)"
                   autocomplete="off" />
            <span class="bms-sep">/</span>
            <input type="text" id="expYear" class="bms-input card-update-num"
                   th:field="*{expYear}" maxlength="4" size="4"
                   inputmode="numeric" aria-label="Expiry year (YYYY)"
                   autocomplete="off" />
        </div>

        <!-- BMS INFOMSG (row 20, neutral) + ERRMSG (row 23, red) via the shared
             message fragment. Both are optional controller model attributes. -->
        <div th:replace="~{fragments/layout :: messages(${errMsg}, ${infoMsg})}"></div>

        <!-- BMS line 24 PF keys (FKEYS + FKEYSC) as real submit buttons. The
             controller dispatches on the pfKey parameter: ENTER=process,
             F3=exit, F5=save, F12=cancel. Rendered to look like the terminal
             legend by the layout .bms-pfkey CSS. -->
        <div class="bms-footer bms-pfkey">
            <button type="submit" name="pfKey" value="ENTER">ENTER=Process</button>
            <button type="submit" name="pfKey" value="PF3">F3=Exit</button>
            <button type="submit" name="pfKey" value="PF5">F5=Save</button>
            <button type="submit" name="pfKey" value="PF12">F12=Cancel</button>
        </div>

    </form>
</main>
</body>
</html>
