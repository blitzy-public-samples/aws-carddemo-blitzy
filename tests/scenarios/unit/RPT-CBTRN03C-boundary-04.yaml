# The page-size boundary of CBTRN03C met by a card change. WS-LINE-COUNTER
# counts every line written: the four header lines take it to 4 and the first
# card's 15 detail lines to 19. The 16th record changes the card, so
# 1120-WRITE-ACCOUNT-TOTALS writes the account total and a separator and takes
# the counter to 21 before the MOD(WS-LINE-COUNTER, 20) = 0 test runs for the
# next detail line [app/cbl/CBTRN03C.cbl:181-188,274-290,306-316]. The test
# never sees 20, so no page total and no header lines are written: the
# second card's three detail lines follow the separator on the same page. At
# end of file READ ... INTO leaves the last record in TRAN-RECORD, its 2.00 is
# added a second time, and the page total (15.00 + 6.00 + 2.00 = 23.00), a
# separator and the grand total (23.00) close the report with no final
# account total [app/cbl/CBTRN03C.cbl:197-203,293-304,318-322]. The skipped
# break and the end-of-file totals are pinned as observed, never fixed
# (GAP-DEF-012).
#
# The 18 TRANSACT-DALY records are invented, already sorted by card as the
# TRANREPT SORT step would leave them: transaction ids 9900000000000551 to
# 9900000000000568 match no repository transaction. The cards are the
# repository's [app/data/ASCII/cardxref.txt:3,49], so the detail lines carry
# accounts 00000000002 and 00000000001, type 01 'Purchase' and category 0001
# 'Regular Sales Draft' [app/data/ASCII/trantype.txt:1]
# [app/data/ASCII/trancatg.txt:1]. Every processing date, 2022-07-05, lies
# inside the DATEPARM window. Report lines are the whole 133-byte records,
# trailing spaces included; the record lines of expected.messages are the
# whole 350-byte TRAN-RECORD as DISPLAY writes it, TRAN-AMT overpunch-signed.
# The two end-of-file DISPLAY lines show TRAN-AMT 2.00 and WS-PAGE-TOTAL 21.00,
# taken before the second addition, as the GnuCOBOL runtime displays signed
# numerics: the digits followed by the sign (GAP-STB-011).
#
# The copybook items listed are the CBTRN03C layouts these assertions decode
# through: the TRAN-RECORD the records are encoded with and DISPLAY shows,
# the CVTRA07Y line shapes, and the cross-reference, type and category
# records whose fields fill the detail lines.
id: RPT-CBTRN03C-boundary-04
level: unit
type: boundary
description: >-
  CBTRN03C reports 15 transactions of one card and then 3 of another. The card
  change at line counter 19 writes the account total and a separator, which
  take the counter to 21, so the page break the 20-line page size calls for
  never happens: the second card's detail lines follow on the same page, and
  the report ends with the end-of-file page total 23.00, which counts the last
  amount twice, a separator and the grand total 23.00, with no final account
  total. Return code 0.
