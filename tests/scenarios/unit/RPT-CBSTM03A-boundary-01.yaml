# The in-bounds edge of the CBSTM03A transaction table. CBSTM03A first reads the
# whole TRNXFILE into WS-CARD-TBL OCCURS 51, each card holding WS-TRAN-TBL OCCURS
# 10, storing every record at (CR-CNT, TR-CNT) with no bound check: a record of the
# same card adds 1 to TR-CNT, a new card closes the previous count into WS-TRCT and
# starts the next table row [app/cbl/CBSTM03A.CBL:225-233,818-853]. Ten transactions
# on one card fill row 1 exactly: TR-CNT reaches 10 and WS-TRCT(1) is 10. For the
# card's cross-reference record, 4000-TRNXFILE-GET then writes all ten table entries
# in TRNXFILE key order and adds each TRNX-AMT to WS-TOTAL-AMT, so the statement ends
# with 'Total EXP:' $55.00, the sum of 1.00 to 10.00 [app/cbl/CBSTM03A.CBL:416-456,
# 675-723]. RPT-CBSTM03A-boundary-02 covers the eleventh transaction, past the bound
# (GAP-DEF-007).
#
# CARDXREF holds one record, equal to cardxref.txt record 49 (card
# 9680294154603697, customer 000000001, account 00000000001), so exactly one
# statement is written; the customer and account come from the repository CUSTDATA
# and ACCTDATA. Every TRXFL record is invented, with ids, descriptions and
# merchants that match no repository transaction. All values come from a GnuCOBOL
# 3.2 run of the app/ source under the suite's compile options, with the page-zero
# shim supplying job CREASTMT, step STEP040 and the STEP040 DD names of
# programs.yaml (GAP-STB-003); where page zero cannot be mapped the scenario is
# blocked (GAP-MIS-002). Statement lines are the whole 80-byte and 100-byte records
# with their trailing spaces. ST-CURR-BAL edits 194.00 as 000000194.00 with a blank
# trailing sign, and the HTML name and address lines end with two spaces before
# </p> because each STRING stops at the first double space and then appends two
# [app/cbl/CBSTM03A.CBL:113,558-592].
id: RPT-CBSTM03A-boundary-01
level: unit
type: boundary
description: >-
  CBSTM03A builds one statement for card 9680294154603697 from exactly ten
  transactions, the most WS-TRAN-TBL holds for one card: the text statement lists
  all ten transaction lines, 9900000000000711 to 9900000000000720, in id order with
  amounts 1.00 to 10.00 and ends with 'Total EXP:' $55.00; the HTML statement
  carries the same ten rows; the TIOT display names job CREASTMT, step STEP040 and
  its nine DD names; return code 0.
inventory_ids:
- INV-RPT-050  # CBSTM03A 51-card x 10-transaction table limit (rule), the boundary under test
- INV-RPT-004  # CBSTM03A program
- INV-RPT-005  # CBSTM03B program, the file service that reads every input
- INV-RPT-045  # CBSTM03A text statement (report)
- INV-RPT-048  # CBSTM03A per-statement transaction total (calculation)
- INV-LAY-004  # COSTM01 copybook, the TRXFL record layout
- INV-DTA-001  # acctdata.txt, the ACCTDATA fixture source
- INV-DTA-011  # EBCDIC account data file, its cross-check counterpart
- INV-DTA-004  # custdata.txt, the CUSTDATA fixture source
- INV-DTA-014  # EBCDIC customer data file, its cross-check counterpart
tags: []
gap_ids:
- GAP-STB-003  # the page-zero PSA/TCB/TIOT shim stands in for the z/OS control blocks
- GAP-MIS-002  # whether page zero can be mapped decides whether the scenario runs
- GAP-STB-010  # Berkeley DB indexed files in place of the VSAM KSDS
- GAP-STB-011  # GnuCOBOL compile and runtime options in place of Enterprise COBOL and LE
