# Derived baseline of scenario ACT-COACTUPC-boundary-24 (capture_platform:
# derived), authored from the app/ source and never observed: no TPE region
# runs in CI. Open until a UniKix run of the app/ build is imported:
# GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012 (online-only
# copybooks CSUTLDPY and CSUTLDWY); CEEDAYS acceptance of the dates is
# inferred (GAP-INF-001).
# Date of Birth upper edge: the run date itself, refused (the day before,
# accepted, is boundary-23; the day after is negative-084).
# Steps 1-3: USER0001 signs on, main menu option 2 XCTLs to COACTUPC, and
# ENTER with account 00000000001 shows the fetched account and the invented
# customer 000000001 with 'Update account details presented above.'
# [app/cbl/COACTUPC.cbl:964-973,2787-2865,2955-2981].
# Step 4: the run date typed over the birth date 1961-06-08 is a change, so
# 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs the edits in screen
# order; every field before Date of Birth passes as fetched. The run date is a
# valid date, so EDIT-DATE-CCYYMMDD accepts it, and EDIT-DATE-OF-BIRTH then
# requires the current date to be strictly greater: equal dates fail the
# test, so it sets INPUT-ERROR and, the message being still off, STRINGs the
# trimmed 'Date of Birth' and ':cannot be in the future ' (38 characters)
# into WS-RETURN-MSG; no later edit can replace it
# [app/cbl/COACTUPC.cbl:1460-1468,1533-1543] [app/cpy/CSUTLDPY.cpy:341-365].
# Nothing is rewritten; 3203 echoes the received values, the typed run date
# included, 3250 sets PROMPT-FOR-CHANGES and moves the message to ERRMSG, and
# 3390 brightens F12=Cancel because a change is pending while F5=Save stays
# dark [app/cbl/COACTUPC.cbl:2596-2597,2955-2981,3566-3584].
# This pins the app/ text; a UniKix record of the copy's CSUTLDPY (GAP-DOC-024)
# never replaces this file.
# Screen values are full BMS width with trailing spaces kept (ERRMSG 78,
# INFOMSG 45), because screens compare exactly. CURDATE, CURTIME and the
# echoed DOBYEAR, DOBMON and DOBDAY come from the region clock, so they are
# matchers; the birth-date matchers carry no offset (the run date itself).
# file_state holds the records as the preconditions materialize them, decoded
# through CVACT01Y and CVCUS01Y, unchanged because no REWRITE runs.
