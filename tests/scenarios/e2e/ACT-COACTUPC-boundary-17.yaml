# COACTUPC Open Date leap-year boundary, accepted side: 29 February of the leap
# year 2024 passes the 'no 29th of February outside a leap year' check, so the
# next prompt, 'Changes validated.Press F5 to save', appears instead of the
# field's message. The February edges of the shared date edit are
# ACT-COACTUPC-boundary-15 (2023-02-28), -16 (2023-02-29), this scenario
# (2024-02-29) and -18 (2023-02-30); ACT-COACTUPC-negative-023 is the item's
# own refused case (2021-02-29).
#
# Steps 1-3 reach the fetched account as ACT-COACTUPC-alternate-04 does:
# USER0001 signs on through CC00 and COSGN00C routes the type 'U' user to
# COMEN01; option '2' makes COMEN01C XCTL to COACTUPC, which sends COACTUP with
# the search-key prompt; ENTER with account 00000000001 reads CXACAIX (card
# 9680294154603697, customer 000000001, line 49 of
# app/data/ASCII/cardxref.txt), ACCTDAT and CUSTDAT, shows them with 'Update
# account details presented above.' and turns every editable field's MDT on,
# so all of them come back on the next AID [app/cbl/COSGN00C.cbl:221-237]
# [app/cbl/COMEN01C.cbl:115-156] [app/cbl/COACTUPC.cbl:964-973,2568-2580,
# 2787-2865,2955-3000,3441-3562,3608-3884].
# Step 4 types 2024, 02 and 29 over the open date 2014-11-20 and presses ENTER.
# - 1100-RECEIVE-MAP moves them to ACUP-NEW-OPEN-DATE, 1205-COMPARE-OLD-NEW
#   finds the change, and 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs
#   the field edits in screen order [app/cbl/COACTUPC.cbl:1142-1163,1460-1470,
#   1681-1704]. Account Status 'Y' passes 1220-EDIT-YESNO; 'Open Date' is moved
#   as '20240229' and EDIT-DATE-CCYYMMDD runs through its exit
#   [app/cbl/COACTUPC.cbl:1472-1482].
# - EDIT-YEAR-CCYY: 2024 is supplied, numeric and of century 20; EDIT-MONTH: 02
#   is supplied, 1-12 and TEST-NUMVAL 0; EDIT-DAY: 29 is supplied, numeric and
#   1-31 [app/cpy/CSUTLDPY.cpy:25-207] [app/cpy/CSUTLDWY.cpy:4-34].
# - EDIT-DAY-MONTH-YEAR: February is not a 31-day month and the day is not 30.
#   With February and day 29, WS-EDIT-DATE-YY-N is 24, not 00, so the divisor
#   is 4; 2024 / 4 leaves remainder 0, so the leap-year refusal is skipped. All
#   three date flags are valid, so control falls through to EDIT-DATE-LE
#   [app/cpy/CSUTLDPY.cpy:209-279].
# - EDIT-DATE-LE calls CSUTLDTC with mask YYYYMMDD; severity 0, as expected for
#   a real leap day, composes no ' validation error Sev code' message and sets
#   WS-EDIT-DATE-IS-VALID [app/cpy/CSUTLDPY.cpy:284-330]
#   [app/cbl/CSUTLDTC.cbl:83-117].
# - Every later edit passes on the invented customer below (as in
#   ACT-COACTUPC-alternate-04), so INPUT-ERROR stays off and
#   ACUP-CHANGES-OK-NOT-CONFIRMED is set [app/cbl/COACTUPC.cbl:1484-1676].
#   Without PF5, 2000-DECIDE-ACTION does not run 9600-WRITE-PROCESSING, the only
#   READ UPDATE and REWRITE path [app/cbl/COACTUPC.cbl:2602-2621].
# - 3203-SHOW-UPDATED-VALUES shows the received values, the open date as typed
#   and the amounts re-edited through +ZZZ,ZZZ,ZZZ.99; 3250-SETUP-INFOMSG sets
#   PROMPT-FOR-CONFIRMATION in INFOMSG and the blank WS-RETURN-MSG in ERRMSG;
#   3300 leaves every field protected; 3390 makes F5=Save and F12=Cancel bright
#   [app/cbl/COACTUPC.cbl:472-473,2870-2951,2955-2983,3001-3003,3566-3584]
#   [app/bms/COACTUP.bms:498-507].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte field; ERRMSG is the blank
#   75-byte WS-RETURN-MSG in the 78-byte field, so neither the leap-year message
#   nor the CSUTLDTC severity message appears. Fields are compared at their full
#   BMS length, trailing spaces kept.
# - FKEY05 and FKEY12 keep their INITIAL text; a dark (ASKIP,DRK) field is
#   captured as blanks, as on screen 3.
# - The tpe adapter enters a field with EraseEOF before typing; the open-date
#   fields are 4, 2 and 2 bytes, so the values fill them.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
# - The acceptance rests on CSUTLDTC returning severity 0, which is known only
#   through the CEEDAYS stub (GAP-INF-001); whether UniKix supplies CEEDAYS is
#   open (GAP-MIS-010). A unikix run executes the UniKix copy, whose CSUTLDTC
#   and CSUTLDPY differ (GAP-DOC-021, GAP-DOC-024), so its record is kept as
#   UniKix-copy behaviour and does not verify the app/ items.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, so the open date is the only field the scenario exercises: the
# repository record has FICO 274, below 300, and zip 12546, which is not a
# North Carolina zip [app/cbl/COACTUPC.cbl:2514-2558]. Account 00000000001 and
# its cross-reference stay as in the repository.
id: ACT-COACTUPC-boundary-17
level: e2e
type: boundary
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001, whose open date is 2014-11-20, changes it to the leap
  day 2024-02-29 and presses ENTER. 2024 is a leap year, so the 29th of
  February passes the leap-year check, and CSUTLDTC, called with mask
  YYYYMMDD, is expected to return severity 0. COACTUPC shows the changed
  values, protected, with 'Changes validated.Press F5 to save', no date
  message, and the F5=Save and F12=Cancel keys made visible. Nothing is saved
  before PF5: ACCTDATA and CUSTDATA still hold the fetched records.
# Primary item first, then the CSUTLDTC date acceptance this outcome rests on,
# the program, the maps asserted, the transaction of steps 3 and 4, the CSD
# files COACTUPC reads, and the online-only copybooks it copies. Sign-on (CC00,
# COSGN00, USRSEC) and the menu transaction are verified by the SEC and MNU
# scenarios; the batch record copybooks and the data files are verified at the
# lowest level that executes them.
inventory_ids:
- INV-ACT-081  # COACTUPC Open Date: no 29th of February outside a leap year (rule)
- INV-UTL-003  # CSUTLDTC date acceptance for masks YYYY-MM-DD and YYYYMMDD
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and confirmation screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read and left unchanged
- INV-CFG-005  # CUSTDAT CSD file: customer master read and left unchanged
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the per-field error attributes, none set here
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-DATE-CCYYMMDD, its leap-year check and the CSUTLDTC call
- INV-LAY-014  # CSUTLDWY: WS-EDIT-DATE-CCYYMMDD, its 88-levels and the CSUTLDTC result
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived from the source, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# Which dates CEEDAYS accepts is known only through the stub, and whether
# UniKix supplies CEEDAYS at all is unknown.
- GAP-INF-001
- GAP-MIS-010
# The UniKix CSUTLDPY changes the date edits this scenario runs, so a unikix run
# observes the copy's behaviour of them.
- GAP-DOC-024
# The UniKix copy also changes code this scenario passes through: CSUTLDTC's
# Vstring lengths (021), COACTUPC's amount edits and change detection (022) and
# COACTUP's row 1, where TRNNAME stands (025).
- GAP-DOC-021
- GAP-DOC-022
- GAP-DOC-025
preconditions:
  datasets:
    # COSGN00C reads the sign-on user USER0001.
    USRSEC: {base: USRSEC}
    # Account 00000000001 as in the repository: open date 2014-11-20.
    ACCTDATA: {base: ACCTDATA}
    # Record 49 maps account 00000000001 to card 9680294154603697 and customer
    # 000000001; CXACAIX is its alternate-index path.
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
