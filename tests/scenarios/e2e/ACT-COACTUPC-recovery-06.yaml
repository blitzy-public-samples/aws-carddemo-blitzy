# COACTUPC account update: the account card cross-reference path CXACAIX is out
# of service when the account is looked up, so 9200-GETCARDXREF-BYACCT takes
# its WHEN OTHER branch and shows the composed WS-FILE-ERROR-MESSAGE
# [app/cbl/COACTUPC.cbl:3650-3697].
#
# Step 1: USER0001 (type U in the USRSEC fixture) signs on through CC00 and
# COSGN00C XCTLs to COMEN01C, which sends the main menu and returns TRANSID
# CM00.
# Step 2: option '2' makes COMEN01C XCTL to COACTUPC with CDEMO-PGM-CONTEXT 0
# [app/cbl/COMEN01C.cbl:145-156]. Entered from the menu and not re-entered,
# COACTUPC sends COACTUP with the search-key prompt and no message, and returns
# TRANSID CAUP with its COMMAREA [app/cbl/COACTUPC.cbl:964-973,1007-1019]. No
# file is read, so CXACAIX is first reached in step 3.
# Step 3: ENTER under CAUP with ACCTSID 00000000001. WHEN OTHER of 0000-MAIN
# runs 1000-PROCESS-INPUTS: the id is numeric and non-zero, so 1210-EDIT-ACCOUNT
# sets FLG-ACCTFILTER-ISVALID [app/cbl/COACTUPC.cbl:996-1003,1783-1818].
# 2000-DECIDE-ACTION (ACUP-DETAILS-NOT-FETCHED) clears WS-RETURN-MSG and
# performs 9000-READ-ACCT [app/cbl/COACTUPC.cbl:2568-2580], whose READ of
# CXACAIX by account id answers neither NORMAL nor NOTFND. The WHEN OTHER
# branch sets INPUT-ERROR and FLG-ACCTFILTER-NOT-OK, moves 'READ' to
# ERROR-OPNAME, LIT-CARDXREFNAME-ACCT-PATH 'CXACAIX ' to ERROR-FILE, RESP and
# RESP2 to ERROR-RESP and ERROR-RESP2, and the whole WS-FILE-ERROR-MESSAGE to
# WS-RETURN-MSG [app/cbl/COACTUPC.cbl:3686-3693]. 9000-READ-ACCT then ends
# before ACCTDAT or CUSTDAT is read [app/cbl/COACTUPC.cbl:3608-3622], so their
# CSD file items are not listed. The repository fixtures hold account
# 00000000001 in CARDXREF, ACCTDATA and CUSTDATA, so the fault is the only
# reason no account is shown.
#
# The composed message, derived from the source (no TPE region runs in CI):
# - WS-FILE-ERROR-MESSAGE is 80 bytes [app/cbl/COACTUPC.cbl:389-408]:
#   'File Error: ' (12), ERROR-OPNAME X(8), ' on ' (4), ERROR-FILE X(9),
#   ' returned RESP ' (15), ERROR-RESP X(10), ',RESP2 ' (7), ERROR-RESP2 X(10)
#   and 5 spaces. The 8-byte 'CXACAIX ' fills the 9-byte ERROR-FILE with one
#   more space.
# - MOVE of the S9(09) COMP RESP fields [app/cbl/COACTUPC.cbl:40-43] to X(10)
#   gives their 9 unsigned digits and a trailing space.
# - WS-RETURN-MSG is X(75) [app/cbl/COACTUPC.cbl:479], which cuts the 5
#   trailing spaces; 3250-SETUP-INFOMSG moves it to the 78-byte ERRMSG, which
#   pads it with 3 spaces [app/cbl/COACTUPC.cbl:2981] [app/bms/COACTUP.bms:491].
#
# Assumed RESP: the unikix adapter makes a region file unavailable with
# region_file_disable (tests/adapters/unikix/commands.yaml), the CEMT SET
# FIL(CXACAIX) DIS equivalent, and CICS answers a READ on a disabled file with
# DISABLED, RESP 84 and RESP2 50 (000000084 and 000000050), as
# ACT-COACTVWC-recovery-01 assumes for the same path. Closing the file instead
# would answer NOTOPEN, RESP 19 and RESP2 60 (000000019 and 000000060). The
# expectation is derived, never observed (GAP-INF-005); an imported UniKix run
# confirms or replaces it.
#
# Screen 3 keeps the entered id, because 3200-SETUP-SCREEN-VARS moves CC-ACCT-ID
# to ACCTSID once the program is re-entered; the details are still not
# fetched, so 3201-SHOW-INITIAL-VALUES leaves the detail fields at LOW-VALUES
# and 3250-SETUP-INFOMSG shows the search-key prompt in INFOMSG
# [app/cbl/COACTUPC.cbl:2698-2726,2731-2783,2955-2981]. The detail fields are
# not asserted: LOW-VALUES leave each field's BMS INITIAL text (the SSN parts
# show '999', '99' and '9999'), which is the map's, not this branch's.
#
# Screen fields are compared at their full BMS length, trailing spaces kept:
# ERRMSG 78, INFOMSG 45, TITLE01, TITLE02 and OPTN002 40 [app/bms/COACTUP.bms]
# [app/bms/COMEN01.bms]. CURDATE (mm/dd/yy) and CURTIME come from the region
# clock through CSDAT01Y, hence the matchers and clock_mode relative. ACCTSID on
# the first COACTUP screen is LOW-VALUES and is not asserted. The UniKix copy of
# 9200-GETCARDXREF-BYACCT is the same as app/'s; its COACTUP.bms lacks the
# unnamed field at row 1, columns 1-9 (GAP-DOC-025).
id: ACT-COACTUPC-recovery-06
level: e2e
type: recovery
description: >-
  USER0001 signs on, selects main-menu option 2 (Account Update) and enters
  account 00000000001 on the COACTUPC screen (CAUP) while the region file
  CXACAIX is unavailable. The READ of the account card cross-reference path
  fails with a response other than NORMAL or NOTFND, so COACTUP is sent again
  with the entered id, the search-key prompt 'Enter or update id of account to
  update' and the composed message 'File Error: READ on CXACAIX returned RESP
  <resp>,RESP2 <resp2>', and neither the account nor the customer master is
  read.
# Primary item first, then the program, the maps the steps enter on, the
# transaction step 3 runs under, the CSD file the READ fails on, and the
# online-only copybooks COACTUPC copies. Sign-on and the menu (CC00, CM00,
# COSGN00, USRSEC) are verified by the SEC and MNU scenarios; ACCTDAT and
# CUSTDAT are not read on this path; the batch record copybooks and the data
# files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-060  # COACTUPC message 'File Error: READ on CXACAIX' (9200-GETCARDXREF-BYACCT, recovery)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the prompt and the file-error screen
- INV-CFG-009  # CAUP transaction, which runs the failing account lookup
- INV-CFG-006  # CXACAIX CSD file, the alternate-index path the READ fails on
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and the account id
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY, copied by COACTUPC
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the attribute settings of 3300-SETUP-SCREEN-ATTRS
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY, copied by COACTUPC
- INV-LAY-014  # CSUTLDWY, copied by COACTUPC
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-MIS-011  # no confirmed region file control to make CXACAIX unavailable
- GAP-DOC-025  # the UniKix COACTUP.bms differs from app/ at row 1, columns 1-9
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CUSTDATA: {base: CUSTDATA}
    CARDXREF: {base: CARDXREF}
    # COSGN00C reads the sign-on user USER0001 from USRSEC.
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  # Applied after the sign-on step and before the failing one, as every online
  # unavailable fault is; no step reaches CXACAIX before the account lookup of
  # step 3. An adapter without region file control raises MissingPrerequisite
  # under GAP-MIS-011.
  faults:
  - target: CXACAIX
    operation: read
    condition: unavailable
# PASSWORD is the README's documented demo password, not a secret: the scenario
# schema accepts no other sign-on password.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    OPTN002: '02. Account Update                      '
    ERRMSG: '                                                                              '
  - '@map': COACTUP
    TRNNAME: CAUP
    PGMNAME: COACTUPC
    INFOMSG: 'Enter or update id of account to update      '
    ERRMSG: '                                                                              '
  - '@map': COACTUP
    TRNNAME: CAUP
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COACTUPC
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ACCTSID: '00000000001'
    INFOMSG: 'Enter or update id of account to update      '
    ERRMSG: 'File Error: READ     on CXACAIX   returned RESP 000000084 ,RESP2 000000050    '
  # The ERRMSG value of each step: blank until the failed lookup.
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'File Error: READ     on CXACAIX   returned RESP 000000084 ,RESP2 000000050    '
