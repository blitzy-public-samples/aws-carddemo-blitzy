# Derived baseline (capture_platform: derived in manifest.yaml) for
# CRD-COCRDLIC-alternate-04, authored from the source because only unikix can
# run the scenario. It is tagged inferred-not-observed (GAP-INF-006,
# GAP-INF-012), and `report.py --import-unikix <execution_id>` replaces it on
# eligible evidence. No GAP-DOC-020..032 difference touches the UniKix copy's
# COCRDLIC or COCRDLI map, so a UniKix record can verify the app/ items.
#
# One screen per step, the screen the step's AID produces. USER0001's sign-on
# lands on COMEN01, and option 3 XCTLs to COCRDLIC with program context 0
# [app/cbl/COMEN01C.cbl:146-156] [app/cpy/COMEN02Y.cpy:37-41]. COCRDLIC starts
# afresh at page 1 with the last-page flag not shown, and reads forward from
# blank keys [app/cbl/COCRDLIC.cbl:334-342,572-582]. With no filter, every
# CARDDAT record is listed in card-number order, 7 per page
# [app/cbl/COCRDLIC.cbl:177-178,1382-1407]. The look-ahead READNEXT keeps the
# 8th card as the next page's GTEQ start [app/cbl/COCRDLIC.cbl:486-497,
# 1191-1214]. Page k therefore starts at card 7k-6 of
# app/data/ASCII/carddata.txt sorted by columns 1-16, and page 8 holds only
# card 50, 9805583408996588 of account 00000000040.
#
# Step 9 reaches page 8. The READNEXT after card 50 returns ENDFILE, giving
# 'NO MORE RECORDS TO SHOW' [app/cbl/COCRDLIC.cbl:1233-1240], and 1400 shows
# the record-actions prompt and marks the last page shown
# [app/cbl/COCRDLIC.cbl:910-916]. Step 10's PF8 keeps that flag
# [app/cbl/COCRDLIC.cbl:410-414] and re-reads page 8 unchanged
# [app/cbl/COCRDLIC.cbl:572-582]. 1400 then sets 'NO MORE PAGES TO DISPLAY'
# and leaves INFOMSG at the spaces 1100 moved there
# [app/cbl/COCRDLIC.cbl:669-670,905-909,924-929].
#
# Values fill their whole BMS field, with trailing spaces kept
# [app/bms/COCRDLI.bms]. PAGENO is the PIC 9(1) page number moved into X(3).
# ERRMSG is the 75-byte WS-ERROR-MSG padded to 78. Rows 2-7 of page 8 and the
# filters are LOW-VALUES sent with ERASE, so they show blank
# [app/cbl/COCRDLIC.cbl:643,678-743,837-869]. CURDATE and CURTIME come from
# the region clock, which the adapter cannot fix, so they are matchers. The
# keys are exactly those the scenario's expected names. The body below the
# comment is canonical harness.dump_yaml output, as baselines.write emits it.
