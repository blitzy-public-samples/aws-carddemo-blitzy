            example: '00000001'
          transactions:
            type: array
            maxItems: 10
            readOnly: true
            description: Transaction rows for the current page (fixed BMS page size 10).
            items:
              $ref: '#/components/schemas/TransactionListRow'
    TransactionDetail:
      type: object
      description: Transaction detail. Output-only projection derived from mapset COTRN01 (the same field
        set is echoed by Transaction Add / COTRN02).
      properties:
        transactionId:
          allOf:
          - $ref: '#/components/schemas/TransactionId'
          readOnly: true
          description: Transaction identifier (server-generated on add). Maps BMS field TRNID (PIC X(16))
            of mapset COTRN01.
        cardNumber:
          allOf:
          - $ref: '#/components/schemas/CardNumber'
          readOnly: true
          description: Card number. Maps BMS field CARDNUM (PIC X(16)) of mapset COTRN01.
        typeCode:
          type: string
          maxLength: 2
          readOnly: true
          description: Transaction type code. Maps BMS field TTYPCD (PIC X(2)) of mapset COTRN01.
        categoryCode:
          type: string
          maxLength: 4
          readOnly: true
          description: Transaction category code. Maps BMS field TCATCD (PIC X(4)) of mapset COTRN01.
        source:
          type: string
          maxLength: 10
          readOnly: true
          description: Transaction source. Maps BMS field TRNSRC (PIC X(10)) of mapset COTRN01.
        description:
          type: string
          maxLength: 60
          readOnly: true
          description: Transaction description. Maps BMS field TDESC (PIC X(60)) of mapset COTRN01.
        amount:
          allOf:
          - $ref: '#/components/schemas/MoneyAmount'
          readOnly: true
          description: Transaction amount. Maps BMS field TRNAMT (PIC X(12)) of mapset COTRN01. Monetary
            amount, BigDecimal scale 2; never floating point.
        originationDate:
          type: string
          format: date
          readOnly: true
          description: Transaction origination date. Maps BMS field TORIGDT (PIC X(10)) of mapset COTRN01.
        processingDate:
          type: string
          format: date
          readOnly: true
          description: Transaction processing date. Maps BMS field TPROCDT (PIC X(10)) of mapset COTRN01.
        merchantId:
          type: string
          maxLength: 9
          pattern: ^[0-9]{1,9}$
          readOnly: true
          description: Merchant identifier. Maps BMS field MID (PIC X(9)) of mapset COTRN01.
        merchantName:
          type: string
          maxLength: 30
          readOnly: true
          description: Merchant name. Maps BMS field MNAME (PIC X(30)) of mapset COTRN01.
        merchantCity:
          type: string
          maxLength: 25
          readOnly: true
          description: Merchant city. Maps BMS field MCITY (PIC X(25)) of mapset COTRN01.
        merchantZip:
          type: string
          maxLength: 10
          readOnly: true
          description: Merchant ZIP code. Maps BMS field MZIP (PIC X(10)) of mapset COTRN01.
    TransactionViewResponse:
      description: Transaction detail inquiry result. CT01 / COTRN01C.
      allOf:
      - $ref: '#/components/schemas/ScreenMetadata'
      - $ref: '#/components/schemas/MessageArea'
      - $ref: '#/components/schemas/TransactionDetail'
    TransactionAddRequest:
      type: object
      description: Add-transaction request. CT02 / COTRN02C. The transaction id is server-generated (increment-from-max)
        and is NOT accepted here.
      properties:
        accountId:
          allOf:
          - $ref: '#/components/schemas/AccountId'
          description: Account identifier. Maps BMS field ACTIDIN (PIC X(11)) of mapset COTRN02.
        cardNumber:
          allOf:
          - $ref: '#/components/schemas/CardNumber'
          description: Card number. Maps BMS field CARDNIN (PIC X(16)) of mapset COTRN02.
        typeCode:
          type: string
          maxLength: 2
          description: Transaction type code. Maps BMS field TTYPCD (PIC X(2)) of mapset COTRN02.
        categoryCode:
          type: string
          maxLength: 4
          description: Transaction category code. Maps BMS field TCATCD (PIC X(4)) of mapset COTRN02.
        source:
          type: string
          maxLength: 10
          description: Transaction source. Maps BMS field TRNSRC (PIC X(10)) of mapset COTRN02.
        description:
          type: string
          maxLength: 60
          description: Transaction description. Maps BMS field TDESC (PIC X(60)) of mapset COTRN02.
        amount:
          allOf:
          - $ref: '#/components/schemas/MoneyAmount'
          description: Transaction amount (BMS hint -99999999.99). Maps BMS field TRNAMT (PIC X(12)) of
            mapset COTRN02. Monetary amount, BigDecimal scale 2; never floating point.
          example: '-100.00'
        originationDate:
          type: string
          format: date
          description: Transaction origination date (BMS hint YYYY-MM-DD). Maps BMS field TORIGDT (PIC
            X(10)) of mapset COTRN02.
        processingDate:
          type: string
          format: date
          description: Transaction processing date. Maps BMS field TPROCDT (PIC X(10)) of mapset COTRN02.
        merchantId:
          type: string
          maxLength: 9
          pattern: ^[0-9]{1,9}$
          description: Merchant identifier. Maps BMS field MID (PIC X(9)) of mapset COTRN02.
        merchantName:
          type: string
          maxLength: 30
          description: Merchant name. Maps BMS field MNAME (PIC X(30)) of mapset COTRN02.
        merchantCity:
          type: string
          maxLength: 25
          description: Merchant city. Maps BMS field MCITY (PIC X(25)) of mapset COTRN02.
        merchantZip:
          type: string
          maxLength: 10
          description: Merchant ZIP code. Maps BMS field MZIP (PIC X(10)) of mapset COTRN02.
        confirm:
          allOf:
          - $ref: '#/components/schemas/ConfirmFlag'
          description: Confirmation flag. Maps BMS field CONFIRM (PIC X(1)) of mapset COTRN02.
        pfKey:
          allOf:
          - $ref: '#/components/schemas/PfKeyAction'
          description: 'Terminal PF-key action submitted with this request (re-expresses 3270 PF-key semantics;
            not a rendered terminal). Supported on this screen: ENTER=Continue, PF4=Clear, PF5=Copy Last,
            PF3=Back.'
          example: ENTER
    TransactionAddResponse:
      description: Add-transaction result echoing the created transaction, including the server-generated
        transaction id. CT02 / COTRN02C.
      allOf:
      - $ref: '#/components/schemas/ScreenMetadata'
      - $ref: '#/components/schemas/MessageArea'
      - $ref: '#/components/schemas/TransactionDetail'
    TransactionReportRequest:
      type: object
      description: Transaction report request. CR00 / CORPT00C. The report itself is produced by the batch
        layer; this endpoint requests it (no feature expansion).
      properties:
        reportType:
          type: string
          enum:
          - MONTHLY
          - YEARLY
          - CUSTOM
          description: Report type derived from the three mutually-exclusive BMS radio flags MONTHLY (X(1)),
            YEARLY (X(1)) and CUSTOM (X(1)) of mapset CORPT00.
          example: MONTHLY
        startMonth:
          type: string
          maxLength: 2
          pattern: ^[0-9]{1,2}$
          description: Custom range start month. Maps BMS field SDTMM (PIC X(2)) of mapset CORPT00.
        startDay:
          type: string
          maxLength: 2
          pattern: ^[0-9]{1,2}$
          description: Custom range start day. Maps BMS field SDTDD (PIC X(2)) of mapset CORPT00.
        startYear:
          type: string
          maxLength: 4
          pattern: ^[0-9]{1,4}$
          description: Custom range start year. Maps BMS field SDTYYYY (PIC X(4)) of mapset CORPT00.
        endMonth:
          type: string
          maxLength: 2
          pattern: ^[0-9]{1,2}$
          description: Custom range end month. Maps BMS field EDTMM (PIC X(2)) of mapset CORPT00.
        endDay:
          type: string
          maxLength: 2
          pattern: ^[0-9]{1,2}$
          description: Custom range end day. Maps BMS field EDTDD (PIC X(2)) of mapset CORPT00.
        endYear:
          type: string
          maxLength: 4
          pattern: ^[0-9]{1,4}$
          description: Custom range end year. Maps BMS field EDTYYYY (PIC X(4)) of mapset CORPT00.
        confirm:
          allOf:
          - $ref: '#/components/schemas/ConfirmFlag'
          description: Confirmation flag. Maps BMS field CONFIRM (PIC X(1)) of mapset CORPT00.
        pfKey:
          allOf:
          - $ref: '#/components/schemas/PfKeyAction'
          description: 'Terminal PF-key action submitted with this request (re-expresses 3270 PF-key semantics;
            not a rendered terminal). Supported on this screen: ENTER=Continue, PF3=Back.'
          example: ENTER
    TransactionReportResponse:
      description: Transaction report submission status. CR00 / CORPT00C.
      allOf:
      - $ref: '#/components/schemas/ScreenMetadata'
      - $ref: '#/components/schemas/MessageArea'
    BillPaymentRequest:
      type: object
      description: Bill payment request. CB00 / COBIL00C.
      properties:
        confirm:
          allOf:
          - $ref: '#/components/schemas/ConfirmFlag'
          description: Confirmation flag. Maps BMS field CONFIRM (PIC X(1)) of mapset COBIL00.
        pfKey:
          allOf:
          - $ref: '#/components/schemas/PfKeyAction'
          description: 'Terminal PF-key action submitted with this request (re-expresses 3270 PF-key semantics;
            not a rendered terminal). Supported on this screen: ENTER=Continue, PF4=Clear, PF3=Back.'
          example: ENTER
    BillPaymentResponse:
      description: Bill payment result. CB00 / COBIL00C.
      allOf:
      - $ref: '#/components/schemas/ScreenMetadata'
      - $ref: '#/components/schemas/MessageArea'
      - type: object
        properties:
          currentBalance:
            allOf:
            - $ref: '#/components/schemas/MoneyAmount'
            readOnly: true
            description: Current account balance after payment. Maps BMS field CURBAL (PIC X(14)) of mapset
              COBIL00. Monetary amount, BigDecimal scale 2; never floating point.
    UserDetail:
      type: object
      description: User detail (never includes the password). Output-only projection.
      properties:
        userId:
          allOf:
          - $ref: '#/components/schemas/UserId'
          readOnly: true
          description: User identifier. Maps BMS field USRID (PIC X(8)) of mapset COUSR02.
        firstName:
          type: string
          maxLength: 20
          readOnly: true
          description: User first name. Maps BMS field FNAME (PIC X(20)) of mapset COUSR02.
        lastName:
          type: string
          maxLength: 20
          readOnly: true
          description: User last name. Maps BMS field LNAME (PIC X(20)) of mapset COUSR02.
        userType:
          allOf:
          - $ref: '#/components/schemas/UserType'
          readOnly: true
          description: User role. Maps BMS field USRTYPE (PIC X(1)) of mapset COUSR02.
    UserResponse:
      description: User detail for prefill/display (no password). CU02 / COUSR02C.
      allOf:
      - $ref: '#/components/schemas/ScreenMetadata'
      - $ref: '#/components/schemas/MessageArea'
      - $ref: '#/components/schemas/UserDetail'
    UserListRow:
      type: object
      description: A single user row in the paged user list. Derived from mapset COUSR00.
      properties:
        selected:
          type: string
          maxLength: 1
          readOnly: true
          description: Row selection flag. Maps BMS field SEL (PIC X(1)) of mapset COUSR00.
        userId:
          allOf:
          - $ref: '#/components/schemas/UserId'
          readOnly: true
          description: User identifier. Maps BMS field USRID (PIC X(8)) of mapset COUSR00.
        firstName:
          type: string
          maxLength: 20
          readOnly: true
          description: User first name. Maps BMS field FNAME (PIC X(20)) of mapset COUSR00.
        lastName:
          type: string
          maxLength: 20
          readOnly: true
          description: User last name. Maps BMS field LNAME (PIC X(20)) of mapset COUSR00.
        userType:
          allOf:
          - $ref: '#/components/schemas/UserType'
          readOnly: true
          description: User role. Maps BMS field UTYPE (PIC X(1)) of mapset COUSR00.
    UserListResponse:
      description: Paged user list. CU00 / COUSR00C. Requires role A (Admin). The 10-row page size is
        the preserved BMS browse page size.
      allOf:
      - $ref: '#/components/schemas/ScreenMetadata'
      - $ref: '#/components/schemas/MessageArea'
      - type: object
        properties:
          pageNumber:
            type: string
            maxLength: 8
            pattern: ^[0-9]{1,8}$
            readOnly: true
            description: Current page number. Maps BMS field PAGENUM (PIC X(8)) of mapset COUSR00.
            example: '00000001'
          users:
            type: array
            maxItems: 10
            readOnly: true
            description: User rows for the current page (fixed BMS page size 10).
            items:
              $ref: '#/components/schemas/UserListRow'
    UserAddRequest:
      type: object
      description: Add-user request. CU01 / COUSR01C. Requires role A (Admin).
      properties:
        firstName:
          type: string
          maxLength: 20
          description: User first name. Maps BMS field FNAME (PIC X(20)) of mapset COUSR01.
        lastName:
          type: string
          maxLength: 20
          description: User last name. Maps BMS field LNAME (PIC X(20)) of mapset COUSR01.
        userId:
          allOf:
          - $ref: '#/components/schemas/UserId'
          description: User identifier. Maps BMS field USERID (PIC X(8)) of mapset COUSR01.
          example: USER0001
        password:
          type: string
          maxLength: 8
          writeOnly: true
          description: User password; accepted on create only, never returned. Maps BMS field PASSWD (PIC
            X(8)) of mapset COUSR01.
          example: '********'
        userType:
          allOf:
          - $ref: '#/components/schemas/UserType'
          description: User role. Maps BMS field USRTYPE (PIC X(1)) of mapset COUSR01.
        pfKey:
          allOf:
          - $ref: '#/components/schemas/PfKeyAction'
          description: 'Terminal PF-key action submitted with this request (re-expresses 3270 PF-key semantics;
            not a rendered terminal). Supported on this screen: ENTER=Add, PF4=Clear, PF3=Back.'
          example: ENTER
      required:
      - firstName
      - lastName
      - userId
      - password
      - userType
    UserAddResponse:
      description: Add-user result echoing the created user (without password). CU01 / COUSR01C.
      allOf:
      - $ref: '#/components/schemas/ScreenMetadata'
      - $ref: '#/components/schemas/MessageArea'
      - $ref: '#/components/schemas/UserDetail'
    UserUpdateRequest:
      type: object
      description: Update-user request. CU02 / COUSR02C. Requires role A (Admin). Password is optional
        and supplied only when changing it.
      properties:
        firstName:
          type: string
          maxLength: 20
          description: User first name. Maps BMS field FNAME (PIC X(20)) of mapset COUSR02.
        lastName:
          type: string
          maxLength: 20
          description: User last name. Maps BMS field LNAME (PIC X(20)) of mapset COUSR02.
        password:
          type: string
          maxLength: 8
          writeOnly: true
          description: New password; accepted only when changing, never returned. Maps BMS field PASSWD
            (PIC X(8)) of mapset COUSR02.
          example: '********'
        userType:
          allOf:
          - $ref: '#/components/schemas/UserType'
          description: User role. Maps BMS field USRTYPE (PIC X(1)) of mapset COUSR02.
        pfKey:
          allOf:
          - $ref: '#/components/schemas/PfKeyAction'
          description: 'Terminal PF-key action submitted with this request (re-expresses 3270 PF-key semantics;
            not a rendered terminal). Supported on this screen: ENTER=Fetch, PF5=Save, PF4=Clear, PF12=Cancel,
            PF3=Back.'
          example: ENTER
    UserUpdateResponse:
      description: Update-user result echoing the updated user (without password). CU02 / COUSR02C.
      allOf:
      - $ref: '#/components/schemas/ScreenMetadata'
      - $ref: '#/components/schemas/MessageArea'
      - $ref: '#/components/schemas/UserDetail'
    UserDeleteRequest:
      type: object
      description: Delete-user request. CU03 / COUSR03C. Requires role A (Admin). Carries the operator-keyed
        user id and the terminal PF-key action of the two-step fetch-then-delete screen flow (ENTER fetches
        the matching USRSEC record for confirmation; PF5 deletes it). Mirrors the bound Java record
        UserDeleteRequest field-for-field so generated clients bind reliably.
      properties:
        userId:
          allOf:
          - $ref: '#/components/schemas/UserId'
          description: Identifier of the user to look up and delete; the sole terminal-enterable field of
            the Delete User map. Maps BMS field USRIDIN (PIC X(8)) of mapset COUSR03. This operator-keyed
            value equals the {userId} path segment used to address the resource.
          example: USER0001
        action:
          allOf:
          - $ref: '#/components/schemas/PfKeyAction'
          description: 'Terminal PF-key action submitted with this request (re-expresses 3270 PF-key
            semantics per legacy/cpy/CSSTRPFY.cpy; not a rendered terminal). Supported on this screen:
            ENTER=Fetch (for confirmation), PF5=Delete, PF4=Clear, PF3=Back.'
          example: PF5
      required:
      - userId
    UserDeleteResponse:
      description: Delete-user result showing the deleted user's display fields. CU03 / COUSR03C.
      allOf:
      - $ref: '#/components/schemas/ScreenMetadata'
      - $ref: '#/components/schemas/MessageArea'
      - type: object
        properties:
          firstName:
            type: string
            maxLength: 20
            readOnly: true
            description: User first name. Maps BMS field FNAME (PIC X(20)) of mapset COUSR03.
          lastName:
            type: string
            maxLength: 20
            readOnly: true
            description: User last name. Maps BMS field LNAME (PIC X(20)) of mapset COUSR03.
          userType:
            allOf:
            - $ref: '#/components/schemas/UserType'
            readOnly: true
            description: User role. Maps BMS field USRTYPE (PIC X(1)) of mapset COUSR03.
  responses:
    BadRequest:
      description: Validation failed (mapped from COBOL edit rules).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required or credentials invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested record was not found (FILE STATUS '23').
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Duplicate key or optimistic-lock conflict (FILE STATUS '22' / concurrent REWRITE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
