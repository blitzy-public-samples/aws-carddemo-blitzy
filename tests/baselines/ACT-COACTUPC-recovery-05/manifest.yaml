# Derived baseline of ACT-COACTUPC-recovery-05. Only unikix can run the
# scenario, and no adapter can force the abend it needs in the TPE region
# (GAP-MIS-014), so expected.yaml is authored from the source and is
# inferred-not-observed (GAP-INF-005, GAP-INF-012). It names no execution_id or
# execution_fingerprint and holds no datasets/ until an eligible UniKix run is
# imported (report.py --import-unikix).
#
# source_identity.units are the app/ sources the three steps execute: the COPY
# closure (inventory_tools.copy_closure) of COSGN00C, which signs USER0001 on
# and XCTLs to COMEN01C [app/cbl/COSGN00C.cbl:230-240]; of COMEN01C, whose
# option 2 XCTLs to COACTUPC [app/cbl/COMEN01C.cbl:146-156]
# [app/cpy/COMEN02Y.cpy:31-35]; and of COACTUPC, whose WHEN OTHER of
# 2000-DECIDE-ACTION names LIT-THISPGM as the culprit with code 0001 and
# 'UNEXPECTED DATA SCENARIO' and whose ABEND-ROUTINE sends ABEND-DATA with
# SEND FROM ... ERASE and abends with 9999
# [app/cbl/COACTUPC.cbl:533-534,2633-2640,4203-4228], ABEND-DATA being the
# CSMSG02Y layout that fixes the text screen [app/cpy/CSMSG02Y.cpy:21-29];
# plus the BMS sources of their maps COSGN00, COMEN01 and COACTUP. The sign-on
# and menu programs are listed, not only COACTUPC, because a source identity
# names every program that ran and expected.yaml asserts the COMEN01 screen
# COMEN01C sends. CSUTLDTC, which COACTUPC CALLs through the EDIT-DATE-LE
# paragraph of CSUTLDPY [app/cpy/CSUTLDPY.cpy:284-296], is left out: WHEN
# OTHER is reached only when 1205-COMPARE-OLD-NEW finds no change, and then
# 1200-EDIT-MAP-INPUTS leaves before any date edit
# [app/cbl/COACTUPC.cbl:1460-1467]. A detected change sets the state to 'E'
# or 'N' [app/cbl/COACTUPC.cbl:1470,1671-1675], which earlier cases of
# 2000-DECIDE-ACTION take [app/cbl/COACTUPC.cbl:2596,2620], so CSUTLDTC does
# not run on this path. DFHAID and DFHBMSCA are CICS-supplied, not app/
# sources. source_commit is HEAD at authoring; app/ there is byte-identical
# to the suite's starting commit 93ebec71ff7b59a68cedd7c501afe496a8eaa68d.
