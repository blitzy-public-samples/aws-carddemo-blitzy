# ==============================================================================
# CardDemo Application - Development Profile Configuration
# ==============================================================================
# This configuration file provides development-specific settings for local
# testing and debugging of the CardDemo Spring Boot application.
# 
# Activate this profile by setting: spring.profiles.active=dev
# or using command line: --spring.profiles.active=dev
#
# Migration Note: Replaces mainframe development environment with lightweight
# local configuration optimized for rapid COBOL-to-Java transformation testing.
# ==============================================================================

# ==============================================================================
# H2 In-Memory Database Configuration
# ==============================================================================
# H2 provides rapid development without requiring PostgreSQL installation.
# Data is recreated on each application restart for clean testing environment.
# Alternative: Use docker-compose PostgreSQL for data persistence (see below).

# H2 Database Connection
spring.datasource.url=jdbc:h2:mem:carddemo
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console for Web-Based Database Access
# Access at: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ==============================================================================
# Alternative: Docker Compose PostgreSQL Configuration
# ==============================================================================
# Uncomment these settings and comment out H2 settings above to use PostgreSQL
# with docker-compose for data persistence across restarts.
#
# spring.datasource.url=jdbc:postgresql://localhost:5432/carddemo_dev
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.username=carddemo_dev
# spring.datasource.password=dev_password_123
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================================
# JPA/Hibernate Configuration for Development
# ==============================================================================
# Automatic schema recreation on startup for rapid testing.
# WARNING: All data is lost on restart with create-drop mode.

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Generate DDL scripts for reference
spring.jpa.properties.javax.persistence.schema-generation.scripts.action=create
spring.jpa.properties.javax.persistence.schema-generation.scripts.create-target=target/generated-schema.sql

# ==============================================================================
# HikariCP Connection Pool - Development Settings
# ==============================================================================
# Smaller pool size suitable for single-developer local workload.
# Reduced from production settings for lower resource consumption.

spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=CardDemoDevHikariCP

# ==============================================================================
# Flyway Database Migration - Development Settings
# ==============================================================================
# Disabled by default for H2 with create-drop mode.
# Enable when using PostgreSQL with docker-compose for proper migration testing.

spring.flyway.enabled=false
# Uncomment when using PostgreSQL:
# spring.flyway.enabled=true
# spring.flyway.baseline-on-migrate=true
# spring.flyway.locations=classpath:db/migration
# spring.flyway.clean-disabled=false

# ==============================================================================
# Debug Logging Configuration
# ==============================================================================
# Comprehensive logging for troubleshooting COBOL-to-Java transformation.

# Application Package Logging - Traces service method execution and business logic
logging.level.com.carddemo=DEBUG

# Spring Framework Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.data=DEBUG

# Hibernate SQL Logging - Shows generated SQL statements
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicExtractor=TRACE
logging.level.org.hibernate.engine.transaction.internal=DEBUG

# Spring Batch Logging - Traces batch job execution
logging.level.org.springframework.batch=DEBUG

# HikariCP Connection Pool Logging
logging.level.com.zaxxer.hikari=DEBUG

# Logging Pattern for Development
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Log File Configuration
logging.file.name=logs/carddemo-dev.log
logging.file.max-size=10MB
logging.file.max-history=7

# ==============================================================================
# Spring Boot DevTools Configuration
# ==============================================================================
# Automatic application restart on code changes for rapid feedback loop.

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/java,src/main/resources
spring.devtools.restart.exclude=static/**,public/**,templates/**

# ==============================================================================
# Server Configuration - Development Settings
# ==============================================================================

server.port=8080
server.servlet.context-path=/carddemo
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-exception=true
server.error.include-binding-errors=always

# ==============================================================================
# Redis Session Management - Development Settings
# ==============================================================================
# Replaces CICS COMMAREA state management with Redis-backed sessions.

spring.session.store-type=redis
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.timeout=60000
spring.redis.jedis.pool.max-active=8
spring.redis.jedis.pool.max-idle=4
spring.redis.jedis.pool.min-idle=2

# Session timeout (30 minutes for development)
spring.session.timeout=1800

# ==============================================================================
# JWT Security Configuration - Development Settings
# ==============================================================================
# Shorter token expiration (1 hour) for security testing.
# Use a simple secret for development (MUST be changed for production).

jwt.secret=dev-secret-key-for-local-testing-only-change-in-production
jwt.expiration=3600000
jwt.issuer=carddemo-dev
jwt.refresh-expiration=7200000

# ==============================================================================
# CORS Configuration - Relaxed for Development
# ==============================================================================
# Allows frontend development server to access backend API.

cors.allowed-origins=http://localhost:3000,http://localhost:5173
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# ==============================================================================
# Spring Batch Configuration - Development Settings
# ==============================================================================
# Batch jobs disabled by default for manual testing control.
# Enable specific jobs via JobLauncher in integration tests.

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.batch.jdbc.table-prefix=BATCH_

# ==============================================================================
# Actuator Configuration - Development Endpoints
# ==============================================================================
# All actuator endpoints enabled for monitoring and debugging.

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=always

# ==============================================================================
# API Documentation - Swagger/OpenAPI Configuration
# ==============================================================================

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ==============================================================================
# Application-Specific Configuration
# ==============================================================================

# Pagination Settings (matching COBOL screen limits)
carddemo.pagination.cards-per-page=7
carddemo.pagination.transactions-per-page=10
carddemo.pagination.users-per-page=20

# Transaction Processing Settings
carddemo.transaction.max-amount=999999.99
carddemo.transaction.min-amount=0.01
carddemo.transaction.authorization-timeout=5000

# Account Settings
carddemo.account.max-credit-limit=999999999.99
carddemo.account.min-credit-limit=1000.00
carddemo.account.default-cash-credit-percentage=0.25

# Batch Processing Settings (relaxed for development)
carddemo.batch.chunk-size=100
carddemo.batch.thread-pool-size=2
carddemo.batch.skip-limit=10

# Interest Calculation Settings (matching CBACT04C COBOL logic)
carddemo.interest.annual-percentage-rate=0.1999
carddemo.interest.daily-rate-divisor=365
carddemo.interest.rounding-mode=HALF_UP
carddemo.interest.calculation-scale=6

# Date Format Settings (Lillian date conversion)
carddemo.date.lillian-epoch=1582-10-15
carddemo.date.input-format=yyyy-MM-dd
carddemo.date.output-format=yyyy-MM-dd
carddemo.date.display-format=MM/dd/yyyy

# Validation Settings
carddemo.validation.strict-mode=true
carddemo.validation.allow-past-dates=false
carddemo.validation.card-expiration-min-months=1

# ==============================================================================
# Development Testing Flags
# ==============================================================================
# Flags to enable/disable features for isolated testing.

carddemo.feature.enable-audit-logging=true
carddemo.feature.enable-email-notifications=false
carddemo.feature.enable-sms-notifications=false
carddemo.feature.enable-external-payment-gateway=false

# ==============================================================================
# Mock External Services
# ==============================================================================
# Use mock implementations for external integrations during development.

carddemo.external.payment-gateway.mock=true
carddemo.external.credit-bureau.mock=true
carddemo.external.fraud-detection.mock=true

# ==============================================================================
# Performance Monitoring - Development
# ==============================================================================

carddemo.monitoring.slow-query-threshold-ms=1000
carddemo.monitoring.long-transaction-threshold-ms=5000
carddemo.monitoring.log-slow-operations=true

# ==============================================================================
# Security - Relaxed for Development Testing
# ==============================================================================
# WARNING: These settings are NOT suitable for production!

carddemo.security.password-encoding=bcrypt
carddemo.security.password-min-length=6
carddemo.security.password-require-special-char=false
carddemo.security.password-require-number=false
carddemo.security.password-require-uppercase=false
carddemo.security.max-failed-login-attempts=10
carddemo.security.account-lockout-duration-minutes=5

# ==============================================================================
# Test Data Initialization
# ==============================================================================
# Automatically load test data on startup for development convenience.

carddemo.data.load-test-data=true
carddemo.data.test-data-location=classpath:db/seed/
carddemo.data.create-demo-users=true
carddemo.data.create-demo-accounts=true

# ==============================================================================
# End of Development Profile Configuration
# ==============================================================================
