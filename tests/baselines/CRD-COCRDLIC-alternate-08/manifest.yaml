# Manifest of the derived baseline of CRD-COCRDLIC-alternate-08: only unikix
# can run the scenario, so expected.yaml was authored from the source, not
# captured. It names no execution_id or execution_fingerprint and holds no
# datasets/ until an eligible UniKix run is imported with report.py
# --import-unikix (GAP-INF-006, GAP-INF-012).
#
# source_identity.units are the app/ units the steps execute: COSGN00C signs
# USER0001 on, COMEN01C takes option 3, COCRDLIC lists the cards and takes the
# U selection on row 2, and COCRDUPC, reached by XCTL, fetches the card
# [app/cbl/COCRDLIC.cbl:545-570] [app/cbl/COCRDUPC.cbl:482-497]. Each program
# brings its COPY closure, as harness.results computes it for a program, and
# the four maps the steps send are COSGN00, COMEN01, COCRDLI and COCRDUP.
# DFHAID and DFHBMSCA are CICS-supplied and not in the repository. source_commit
# is HEAD at authoring; app/ is byte-identical to the suite's starting commit.
