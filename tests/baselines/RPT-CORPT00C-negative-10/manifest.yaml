# Manifest of the derived baseline of RPT-CORPT00C-negative-10: USER0001 signs
# on, takes main menu option 9 'Transaction Reports' and asks CORPT00 for a
# Custom report from 01/01 to 07/06/2022 with the start year '1-2-', CONFIRM
# left blank. The probe of 'Start Date - Not a valid Year...'
# [app/cbl/CORPT00C.cbl:347-353] does not show that message: NUMVAL-C's result
# is moved through the unsigned PIC 9999 WS-NUM-9999, so SDTYYYYI always holds
# four digits ('0012' as pinned), and CORPT00C ignores the message 2513 that
# CSUTLDTC returns for a year before 1582 [app/cbl/CORPT00C.cbl:75,313-315,
# 381-426]. CORPT00C therefore resends CORPT00 with 'Please confirm to print
# the Custom report...' and writes nothing to JOBS
# [app/cbl/CORPT00C.cbl:429-474,556-580]. Only unikix can run the scenario, so
# expected.yaml was authored from the source, not captured, and is
# inferred-not-observed (GAP-INF-009, GAP-INF-012), the doubtful outcome pinned
# as observed (observed-only, GAP-UNC-014). It names no execution_id or
# execution_fingerprint and holds no datasets/ until report.py --import-unikix
# promotes an eligible UniKix run.
#
# source_identity.units are every app/ source the three steps execute, not only
# CORPT00C's own COPY closure, since harness.results gives an e2e run none: the
# COPY closure (inventory_tools.copy_closure, symbolic maps in app/cpy-bms
# included) of COSGN00C, which signs USER0001 on and XCTLs to COMEN01C
# [app/cbl/COSGN00C.cbl:230-237]; of COMEN01C, whose option 9 XCTLs to
# CORPT00C [app/cpy/COMEN02Y.cpy:74-78]; of CORPT00C; and of CSUTLDTC, which
# CORPT00C CALLs for the start and the end date on this path
# [app/cbl/CORPT00C.cbl:392,412]; plus the BMS sources of the maps COSGN00,
# COMEN01 and CORPT00. DFHAID and DFHBMSCA are CICS-supplied, not app/
# sources. source_commit is HEAD at authoring; app/ is byte-identical to the
# suite's starting commit 93ebec71ff7b59a68cedd7c501afe496a8eaa68d.
