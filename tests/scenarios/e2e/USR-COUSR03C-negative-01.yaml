# An AID key other than ENTER, PF3, PF4, PF5 and PF12 on the Delete User screen.
# ADMIN001 signs on through CC00 and reaches the admin menu COADM01; option '4'
# is 'User Delete (Security)', so COADM01C sets CDEMO-PGM-CONTEXT to 0 and
# transfers control with XCTL to CDEMO-ADMIN-OPT-PGMNAME(4) = 'COUSR03C'
# [app/cbl/COADM01C.cbl:127-145] [app/cpy/COADM02Y.cpy:39-42]. COADM01C passes
# only the COCOM01Y COMMAREA, so the group MOVE into COUSR03C's longer
# CARDDEMO-COMMAREA pads CDEMO-CU03-USR-SELECTED with spaces and no user is
# fetched. On that first entry COUSR03C sets CDEMO-PGM-REENTER, clears COUSR3AO
# to LOW-VALUES, sends COUSR03 with its own header and a blank message line,
# and returns with TRANSID(CU03) and the COMMAREA [app/cbl/COUSR03C.cbl:49-58,
# 90-106,134-137]. PF7 then starts CU03 again with that COMMAREA: COUSR03C
# receives the map, EVALUATE EIBAID handles only ENTER, PF3, PF4, PF5 and PF12,
# and WHEN OTHER sets WS-ERR-FLG and moves CCDA-MSG-INVALID-KEY of CSMSG01Y to
# WS-MESSAGE; SEND-USRDEL-SCREEN rebuilds the header from COTTL01Y and CSDAT01Y
# and moves the message to ERRMSG [app/cbl/COUSR03C.cbl:107-131,213-262]
# [app/cpy/CSMSG01Y.cpy:20-21]. No user is read or deleted: USRSEC is touched
# only by PROCESS-ENTER-KEY and DELETE-USER-INFO, so no file_state is asserted.
# USRIDIN, FNAME, LNAME and USRTYPE are not asserted: on this path they are
# whatever the received map held, sent back unchanged because COUSR3AO
# redefines COUSR3AI, and carry no business outcome.
# Text fields are compared at their full BMS length with trailing spaces:
# ERRMSG is 78 bytes, the 40-character message followed by spaces from the
# 80-byte WS-MESSAGE. CURTIME is 8 bytes on COUSR03 and COADM01, so the
# hh:mm:ss matcher needs no padding. The baseline is derived from the source:
# no TPE region runs in CI.
id: USR-COUSR03C-negative-01
level: e2e
type: negative
description: >-
  ADMIN001 signs on, selects option 4 'User Delete (Security)' on the admin menu
  and presses PF7 on the empty Delete User screen COUSR03. COUSR03C accepts only
  ENTER, PF3, PF4, PF5 and PF12, so it sends COUSR03 again with its header
  (CU03, COUSR03C, the titles, the run date and time) and 'Invalid key pressed.
  Please see below...' in the message line; no user is deleted.
inventory_ids:
- INV-USR-049  # COUSR03C message 'Invalid key pressed. Please see below...' (rule)
- INV-USR-004  # COUSR03C program
- INV-MNU-004  # COADM01 map, the admin menu option 4 is entered on
- INV-USR-008  # COUSR03 map, the screen PF7 is pressed on and sent again
- INV-CFG-026  # CU03 transaction, under which PF7 is processed
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA that makes the PF7 entry a reentry
- INV-LAY-005  # COTTL01Y copybook, TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y copybook, CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y copybook, CCDA-MSG-INVALID-KEY
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-004  # USR end-to-end baselines derived from the source, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    # COSGN00C reads the sign-on user ADMIN001; this path reads nothing else.
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: ADMIN001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '4'}
    '@map': COADM01
  - aid: PF7
    fields: {}
    '@map': COUSR03
expected:
  screens:
  - '@map': COADM01
    TRNNAME: CA00
    PGMNAME: COADM01C
    ERRMSG: '                                                                              '
  - '@map': COUSR03
    TRNNAME: CU03
    PGMNAME: COUSR03C
    ERRMSG: '                                                                              '
  - '@map': COUSR03
    TRNNAME: CU03
    PGMNAME: COUSR03C
    TITLE01: '      AWS Mainframe Modernization       '
    TITLE02: '              CardDemo                  '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    ERRMSG: 'Invalid key pressed. Please see below...                                      '
  # One ERRMSG value per step: blank on the admin menu and on the first Delete
  # User screen, the invalid-key message after PF7.
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'Invalid key pressed. Please see below...                                      '
