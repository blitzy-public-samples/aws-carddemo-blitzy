        CUST-PRI-CARD-HOLDER-IND: Y
        CUST-FICO-CREDIT-SCORE: '700'
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  # 1A, not A1: A1 can fail the month 1-12 check first (see the header).
  - aid: ENTER
    '@map': COACTUP
    fields:
      OPNMON: '1A'
