# card-platform notification-service — the Representational State Transfer (REST)
# interface this module serves.
#
# The document describes one read-only endpoint, the alert history for one account.
# It is hand-written and checked in. api/NotificationHistoryController serves the
# path below, and no documentation generator joins the classpath, so the tests
# under src/test/java are what keep this file and that controller in step.
#
# Two properties of that endpoint are security decisions rather than style, and both are
# stated in the operation below.
#
# The path key is a CARD TOKEN and never a card number of either form. A path reaches an
# access log, a reverse proxy log, a trace, a browser history and the instance member of
# a default error document, so a full Primary Account Number (PAN) belongs in none of
# them. A masked card number is no substitute for a key: twelve of its sixteen characters
# are mask characters, so two cards sharing their last four digits mask to one value, and
# a route keyed on that value would answer with their merged history. The token that
# PanMasker.cardToken derives names one card, and it is the key
# src/main/resources/db/migration/V1__schema.sql stores, so the route key and the row key
# are the same value. The derivation is one-way and keyed under a deployment-supplied key,
# so the token discloses no card number and a reader holding one cannot recompute it over
# the sixteen-digit card-number space.
#
# Authentication is required and the response is scoped to the cards the caller owns. The
# ownership rule in config/SecurityConfig compares the token in the path against the
# SCOPE_CARD_ authorities the identity carries, and it refuses with 403 rather than
# revealing whether the other card exists.
#
# The masked card number is still returned, as display data on the response envelope. It
# keys nothing, no ownership rule reads it, and no request carries it.
#
# The traceability matrix and the decision log this platform still owes are to carry the
# field-by-field source mapping, every omitted field, and why the route key is a token.
---
openapi: 3.1.0

info:
  title: CardDemo Notification Service
  description: >-
    Returns the alert history for one card. Each entry describes one transaction
    the read model holds for that card, and the response carries the card token,
    the masked card number, the entry count and the total of the entries it
    returns. Field names and widths follow TRNX-RECORD at
    app/cpy/COSTM01.CPY:L20-L36.


    Every request carries an identity. The scheme is the basicIdentity below,
    the chain in config/SecurityConfig denies by default, and the route admits
    only a caller holding the ownership authority for the account it names. The demo
    stack binds the published port to the loopback address and seeds only
    synthetic fixture data, so nothing real is exposed either way.
  version: 1.0.0

servers:
  - url: http://localhost:8084
    description: >-
      Local demo stack. The container listens on port 8080, and
      card-platform/docker-compose.yml publishes NOTIFICATION_PORT on the
      loopback address, defaulting to 8084.

tags:
  - name: notification-history
    description: Read access to the account-keyed alert history.

security:
  - basicIdentity: []

paths:

  /notifications/{cardToken}:

    get:
      tags:
        - notification-history
      operationId: getNotificationHistory
      summary: Return one bounded page of the alert history for one account.
      description: >-
        Returns one entry per transaction the read model holds for the card, in
        transaction identifier order, up to the ceiling the renderer declares. A
        card with no entries returns 200 with an empty array, an entry count of 0
        and a total of "0.00".


        The response is bounded by a row ceiling rather than paged. An offset
        would let an insert concurrent with a read shift a page the caller has
        already seen, and the ceiling bounds the body without that hazard:
        NotificationRenderer.MAXIMUM_STATEMENT_ROWS fixes it, and
        StatementRowCapTest holds the two to the same number.


        The path carries a card token and never a card number. A full Primary
        Account Number in a route would reach every access log and proxy that
        sees the request, and a masked one names no single card: two cards
        sharing their last four digits mask to one value, so the route would
        answer with their merged history and the ownership rule would admit a
        caller to a card it does not hold. A caller obtains the token from the
        cardToken property of any response that names the card.
      parameters:

        - name: cardToken
          in: path
          required: true
          description: >-
            The card token: 64 lower-case hexadecimal characters, the rendering
            of a SHA-256 digest over a labelled card number that
            PanMasker.cardToken in card-platform/libs/cobol-compat derives. It
            stands in for TRNX-CARD-NUM PIC X(16) at app/cpy/COSTM01.CPY:L22,
            whose value was a full card number. Column card_token CHAR(64) in
            src/main/resources/db/migration/V1__schema.sql holds the same value.
            The derivation is one-way and keyed under a deployment-supplied
            key, so this value discloses no card number and a reader holding one
            cannot recompute it over the card-number space.
          schema:
            type: string
            minLength: 64
            maxLength: 64
            pattern: '^[0-9a-f]{64}$'
          examples:
            token:
              value: '3c9c1b1f4e8a2d7b6f0e5a4c3d2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a09'

        - name: pageSize
          in: query
          required: false
          description: >-
            Entries this response carries at most. Absent, the response carries
            carddemo.history.default-page-size entries. Above
            carddemo.history.maximum-page-size, the maximum applies. Below one,
            the request is refused with 400. The bound reaches the database as a
            LIMIT, and the maximum equals
            NotificationRenderer.MAXIMUM_STATEMENT_ROWS, so a caller cannot ask
            for more rows than a rendered alert would carry.
          schema:
            type: integer
            minimum: 1
            maximum: 200
          examples:
            page:
              value: 25

      responses:

        '200':
          description: >-
            One bounded page of the alert history for the account. Cache-Control
            is no-store: the body carries what a cardholder bought, where and for
            how much.
          headers:
            Cache-Control:
              description: Always no-store for this response.
              schema:
                type: string
                enum: ['no-store']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationHistory'

        '400':
          description: >-
            A request value this route cannot use. Three refusals answer here, and
            each carries its own text so a caller reads which value was wrong.

            The path value did not match a card token of 64 lower-case
            hexadecimal characters:
            "Card token must be sixty-four lower-case hexadecimal characters".

            pageSize named a value below one:
            "Page size must be at least one". Above the maximum nothing is
            refused, because the maximum applies instead.

            pageSize named a value that is no whole number, whether text such as
            abc, a fractional value, or a value wider than the type it converts
            to: "Page size must be a whole number". This one reaches no
            constraint, because a query string is text and pageSize is the one
            value of this route that is not, so it converts first. card-service
            answers the same text for the same failure on GET /cards.

            No text names a value the caller submitted, so nothing a caller sends
            is copied back into a response body or into a log line built from one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                cardToken:
                  summary: The path value is no card token.
                  value:
                    status: 400
                    message: 'Card token must be sixty-four lower-case hexadecimal characters'
                    route: '/notifications/{cardToken}'
                pageSizeBelowFloor:
                  summary: pageSize named zero or a negative value.
                  value:
                    status: 400
                    message: 'Page size must be at least one'
                    route: '/notifications/{cardToken}'
                pageSizeNotANumber:
                  summary: pageSize named a value that is no whole number.
                  value:
                    status: 400
                    message: 'Page size must be a whole number'
                    route: '/notifications/{cardToken}'

        '401':
          description: >-
            The request carried no usable credential. config/SecurityConfig
            refuses it before the handler runs, and the body names neither the
            account nor the route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

        '403':
          description: >-
            The identity does not hold this card. config/SecurityConfig grants
            the route only to an identity carrying the SCOPE_CARD_ authority for
            the card token in the path, or to an administrator. No 404
            distinguishes a card that exists from one that does not: either
            answer would disclose a card the caller may not have.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:

  securitySchemes:

    basicIdentity:
      type: http
      scheme: basic
      description: >-
        An identity configured under carddemo.security.users, carrying one of the
        roles ADMIN or USER and, for USER, one SCOPE_ACCOUNT_ authority per
        account it holds. The password is stored already encoded, so no plaintext password
        is compared: config/SecurityConfig declines to reproduce the plaintext
        comparison at app/cbl/COSGN00C.cbl:L223. Basic sends a credential as
        base-64 text, which is encoding and not encryption, so this scheme
        requires an encrypted transport.

  schemas:

    ApiError:
      type: object
      description: >-
        A failing response. Three properties, the same three the card service
        returns. The route property holds the route template with each path
        variable left as its brace-delimited name, so no value read from the
        request appears in the body.
      additionalProperties: false
      required:
        - status
        - message
        - route
      properties:

        status:
          type: integer
          minimum: 400
          maximum: 599
          description: The status code of the failing response.
          examples:
            - 400

        message:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            One text describing the failure. It names no value read from the
            request.
          examples:
            - 'Card token must be 64 lower-case hexadecimal characters.'

        route:
          type: string
          minLength: 1
          maxLength: 200
          description: The route template of the failing endpoint.
          examples:
            - '/notifications/{cardToken}'

    NotificationHistory:
      type: object
      description: >-
        The alert history for one card, bounded by the row ceiling the renderer
        declares. cardToken identifies the card and cardNumber displays it, and
        the total covers every entry the response carries and no entry it does
        not.
      additionalProperties: false
      required:
        - cardToken
        - transactionCount
        - totalAmount
        - transactions
      properties:

        cardToken:
          type: string
          minLength: 64
          maxLength: 64
          pattern: '^[0-9a-f]{64}$'
          description: >-
            The card token, and the card identity this response is keyed on. It
            is the value the path carried, the key column card_token CHAR(64)
            holds, and the value to use as the path of the next request. It
            stands in for TRNX-CARD-NUM PIC X(16) at app/cpy/COSTM01.CPY:L22 and
            discloses no card number.
          examples:
            - '3c9c1b1f4e8a2d7b6f0e5a4c3d2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a09'

        cardNumber:
          type: string
          nullable: true
          minLength: 16
          maxLength: 16
          pattern: '^\*{12}[0-9]{4}$'
          description: >-
            Masked card number. Twelve asterisks then the last four digits.
            Width from TRNX-CARD-NUM PIC X(16) at app/cpy/COSTM01.CPY:L22.
            Display data alone: it identifies no single card, so no key, index or
            ownership rule reads it. Absent when the read model holds no entry
            for the card, because the masked form is read from the entries and
            none is invented.
          examples:
            - '************7065'

        transactionCount:
          type: integer
          minimum: 0
          maximum: 200
          description: >-
            Entries this response carries, never more than the maxItems of
            transactions. NotificationRenderer.MAXIMUM_STATEMENT_ROWS fixes the
            ceiling and StatementRowCapTest holds the two to the same number.
          examples:
            - 3

        totalAmount:
          type: string
          pattern: '^-?\d{1,9}\.\d{2}$'
          description: >-
            Sum of the amounts of every entry, as a decimal string at the two
            fractional digits TRAN-AMT PIC S9(09)V99 declares. A string keeps the
            scale a JSON number would lose to binary floating point.
          examples:
            - '1250.75'

        transactions:
          type: array
          maxItems: 200
          description: >-
            One entry per transaction, in transaction identifier order, at most
            maxItems of them. The read names that limit and the database applies
            it, so a card holding more entries costs one page rather than a whole
            history. NotificationRenderer.MAXIMUM_STATEMENT_ROWS fixes the number
            and StatementRowCapTest holds the two together.
          items:
            $ref: '#/components/schemas/StatementTransaction'

    StatementTransaction:
      type: object
      description: >-
        One transaction from the token-keyed read model. Every field comes from
        TRNX-RECORD at app/cpy/COSTM01.CPY:L20-L36. The card token sits on the
        response envelope; the masked display value appears on the envelope and
        on each item. The trailing FILLER PIC X(20) at
        app/cpy/COSTM01.CPY:L36 carries no field.


        One event fills a row. TransactionPosted at schema version 2 carries the
        whole posted transaction record: TransactionPosted.forAuthorized copies
        the card token, transactionId, typeCode, categoryCode, source,
        description, amount, merchantId, merchantName, merchantCity, merchantZip
        and originTimestamp from the authorization event, and the posting itself
        supplies processingTimestamp. Every field below therefore carries the
        value the transaction was authorized with, from the first delivery
        onward. No field reads as an empty string or as zeros waiting for a
        second event, and no consumer of this service calls another service to
        fill one.
      additionalProperties: false
      required:
        - transactionId
        - maskedCardNumber
        - typeCode
        - categoryCode
        - source
        - description
        - amount
        - merchantId
        - merchantName
        - merchantCity
        - merchantZip
        - originTimestamp
        - processingTimestamp
      properties:

        transactionId:
          type: string
          minLength: 16
          maxLength: 16
          description: >-
            Identifies one transaction within the card, always exactly sixteen
            characters. From TRNX-ID PIC X(16) at app/cpy/COSTM01.CPY:L23. Every
            record in app/data/ASCII/dailytran.txt holds sixteen digits, padded
            on the left with zeros. The key column transaction_id CHAR(16) and
            StatementTransactionId both refuse any other width, so the lower
            bound states what the implementation already guarantees rather than
            leaving a shorter value describable. No pattern is declared: a
            sixteen-digit shape in this document would read as a card number, and
            the entity constrains width alone.

        maskedCardNumber:
          type: string
          minLength: 16
          maxLength: 16
          pattern: '^\*{12}[0-9]{4}$'
          description: >-
            The card this transaction was made on, masked: twelve asterisks then
            the last four digits. Width from TRNX-CARD-NUM PIC X(16) at
            app/cpy/COSTM01.CPY:L22. Display only. It identifies no card, because
            every card ending in the same four digits masks to this same value,
            so nothing keys or authorizes on it.
          examples:
            - '************7065'

        typeCode:
          type: string
          maxLength: 2
          description: >-
            Names the transaction type. From TRNX-TYPE-CD PIC X(02) at
            app/cpy/COSTM01.CPY:L25.
          examples:
            - '01'

        categoryCode:
          type: string
          pattern: '^[0-9]{4}$'
          description: >-
            Names the transaction category, four digits. From TRNX-CAT-CD
            PIC 9(04) at app/cpy/COSTM01.CPY:L26. The value keeps its leading
            zeros.
          examples:
            - '0001'

        source:
          type: string
          maxLength: 10
          description: >-
            Names where the transaction entered the platform. From TRNX-SOURCE
            PIC X(10) at app/cpy/COSTM01.CPY:L27.
          examples:
            - 'POS TERM'

        description:
          type: string
          maxLength: 100
          description: >-
            Describes the transaction in free text. From TRNX-DESC PIC X(100) at
            app/cpy/COSTM01.CPY:L28.
          examples:
            - 'Purchase at Abshire-Lowe'

        amount:
          type: string
          pattern: '^-?\d{1,9}\.\d{2}$'
          description: >-
            The transaction amount, as a decimal string with two fractional
            digits. From TRNX-AMT PIC S9(09)V99 at app/cpy/COSTM01.CPY:L29, so
            nine digits sit before the point. A leading minus is valid: a refund
            carries a negative amount.
          examples:
            - '504.77'

        merchantId:
          type: string
          pattern: '^[0-9]{9}$'
          description: >-
            Identifies the merchant, nine digits. From TRNX-MERCHANT-ID
            PIC 9(09) at app/cpy/COSTM01.CPY:L30.
          examples:
            - '800000000'

        merchantName:
          type: string
          maxLength: 50
          description: >-
            Names the merchant. From TRNX-MERCHANT-NAME PIC X(50) at
            app/cpy/COSTM01.CPY:L31.
          examples:
            - 'Abshire-Lowe'

        merchantCity:
          type: string
          maxLength: 50
          description: >-
            Names the merchant city. From TRNX-MERCHANT-CITY PIC X(50) at
            app/cpy/COSTM01.CPY:L32.
          examples:
            - 'North Enoshaven'

        merchantZip:
          type: string
          maxLength: 10
          description: >-
            Holds the merchant mail code. From TRNX-MERCHANT-ZIP PIC X(10) at
            app/cpy/COSTM01.CPY:L33.
          examples:
            - '72112'

        originTimestamp:
          type: string
          minLength: 26
          maxLength: 26
          pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{6}$'
          description: >-
            When the transaction originated, twenty-six characters shaped
            YYYY-MM-DD HH:MM:SS.ffffff with a space between the day and the
            hour. From TRNX-ORIG-TS PIC X(26) at app/cpy/COSTM01.CPY:L34. All
            300 records in app/data/ASCII/dailytran.txt match the pattern.
          examples:
            - '2022-06-10 19:27:53.000000'

        processingTimestamp:
          type: string
          minLength: 26
          maxLength: 26
          pattern: '^\d{4}-\d{2}-\d{2}-\d{2}\.\d{2}\.\d{2}\.\d{2}0{4}$'
          description: >-
            When the platform recorded the transaction, twenty-six characters
            shaped YYYY-MM-DD-HH.MM.SS.ff0000 with a dash between the day and
            the hour. From TRNX-PROC-TS PIC X(26) at app/cpy/COSTM01.CPY:L35.
            Precision is hundredths of a second, and app/cbl/CBTRN02C.cbl:L701
            fills the last four characters with zeros.
          examples:
            - '2022-07-19-23.16.01.470000'
