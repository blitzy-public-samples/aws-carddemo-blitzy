  file_state:
    # CUST-UPDATE-RECORD has the CVCUS01Y layout; 9600-WRITE-PROCESSING moves
    # every received value into it, rebuilds the phone numbers and the date of
    # birth with STRING, and REWRITEs it [app/cbl/COACTUPC.cbl:434-456,4007-4091].
    # Only CUST-FICO-CREDIT-SCORE differs from the record loaded. Its 168-byte
    # FILLER is not asserted: INITIALIZE skips FILLER, so the REWRITE writes
    # whatever that never-initialized working storage holds.
