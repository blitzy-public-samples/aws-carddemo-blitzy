# PRTCATBL on the repository category balance file [app/jcl/PRTCATBL.jcl:21-63]:
# - DELDEF (IEFBR14) deletes any previous TCATBALF.REPT with DISP=(MOD,DELETE);
#   none exists, so the step only ends RC 0.
# - STEP05R runs REPROC step PRC001 [app/proc/REPROC.prc:21-28], IDCAMS with the
#   REPROCT card 'REPRO INFILE(FILEIN) OUTFILE(FILEOUT)' [app/ctl/REPROCT.ctl:15],
#   unloading the TCATBALF KSDS in key order into a new TCATBALF.BKUP generation.
# - STEP10R sorts that generation on account, type and category (SYMNAMES ZD, CH,
#   ZD) and reformats each record with OUTREC: account, a blank, type, a blank,
#   category, a blank, TRAN-CAT-BAL under EDIT=(TTTTTTTTT.TT), then 9X. The
#   OUTREC builds 41 bytes for SORTOUT LRECL=40, and the last of the nine blanks
#   is cut, as observed (GAP-STB-006).
# The 50 repository records are accounts 00000000001-00000000050, type 01,
# category 0001, balance 0.00, so the backup equals tcatbal.txt and every report
# line shows the T mask without zero suppression and without a sign. No outcome
# depends on the run date: clock_mode relative lets unikix run it unchanged.
# @CATALOG names DSNs because its lines are catalog entries as the platform
# reports them; contains asserts the two entries the job catalogues, since the
# rest of the catalog differs by adapter.
id: RPT-PRTCATBL-normal-01
level: integration
type: normal
description: >-
  PRTCATBL backs up the 50 repository category balance records, in key order,
  to a new TCATBALF.BKUP generation through REPROC and REPROCT, then lists them
  sorted by account, type and category as 40-byte lines with the balance edited
  as 000000000.00; all three steps end RC 0.
inventory_ids:
- INV-RPT-008  # PRTCATBL job
- INV-DAT-026  # REPROC proc, run as STEP05R
- INV-DAT-027  # REPROCT control card, the SYSIN of REPROC
tags: []
gap_ids:
- GAP-STB-005  # IDCAMS REPRO replacement
- GAP-STB-006  # SORT replacement: ZD keys, the EDIT mask, the 41-to-40-byte truncation
- GAP-STB-007  # IEFBR14 and DISP=(MOD,DELETE) replacement
- GAP-STB-009  # catalog and GDG emulation of the TCATBALF.BKUP generation
- GAP-STB-010  # Berkeley DB indexed file in place of the TCATBALF KSDS
preconditions:
  datasets:
    TCATBALF: {base: TCATBALF}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  job: PRTCATBL
expected:
  return_code: 0
  messages:
  - STEP DELDEF RC 0000
  - STEP STEP05R.PRC001 RC 0000
  - STEP STEP10R RC 0000
  datasets:
    TCATBALF-BKUP:
      records:
