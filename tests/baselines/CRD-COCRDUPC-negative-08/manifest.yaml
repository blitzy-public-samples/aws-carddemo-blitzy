# Manifest of the derived baseline of CRD-COCRDUPC-negative-08: on the card
# update screen of card 0500024453765740, the expiry month overtyped with 15 is
# refused by 1250-EDIT-EXPIRY-MON, because 15 is supplied but not VALID-MONTH
# (1 THRU 12), with 'Card expiry month must be between 1 and 12', and
# CCUP-CHANGES-NOT-OK resends COCRDUP with the entered values and
# 'Update card details presented above.', issuing no READ UPDATE or REWRITE
# [app/cbl/COCRDUPC.cbl:92-95,197-198,877-911,982-983]. Only unikix can run the
# scenario, so expected.yaml was authored from the source, not captured, and is
# inferred-not-observed (GAP-INF-006, GAP-INF-012). It names no execution_id or
# execution_fingerprint and holds no datasets/ until report.py --import-unikix
# promotes an eligible UniKix run. derived_from is left out: the expectation
# comes from the source, not the tech spec, which is how the importer reads its
# absence.
#
# source_identity.units are the app/ sources the four steps execute: the COPY
# closure (inventory_tools.copy_closure) of COSGN00C, which signs USER0001 on
# and XCTLs to COMEN01C [app/cbl/COSGN00C.cbl:221-240]; of COMEN01C, whose
# option 5 XCTLs to COCRDUPC [app/cpy/COMEN02Y.cpy:49-53]
# [app/cbl/COMEN01C.cbl:145-155]; and of COCRDUPC, which fetches the card and
# edits the change, including the procedure-division copybook CSSTRPFY; plus
# the BMS sources of their maps COSGN00, COMEN01 and COCRDUP. None of the three
# CALLs another app/cbl unit. DFHAID and DFHBMSCA are CICS-supplied, not app/
# sources, so they are absent. app/ is byte-identical to the suite's starting
# commit 93ebec71ff7b59a68cedd7c501afe496a8eaa68d.
