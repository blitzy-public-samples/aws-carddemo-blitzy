# COACTUPC accepts a FICO Score at the upper edge of its range: 850 lies
# within FICO-RANGE-IS-VALID, VALUES 300 THROUGH 850, so 1275-EDIT-FICO-SCORE
# continues without a message and the change is validated
# [app/cbl/COACTUPC.cbl:845-849,2514-2531]. The FICO Score boundary scenarios
# are 299 (refused), 300 (accepted), 850 (this one, accepted) and 851
# (refused); an accepted value shows as the next prompt rather than the
# field's message.
#
# Steps 1-3 reach the fetched account as ACT-COACTUPC-alternate-04 does:
# USER0001 signs on through CC00, chooses option 2 (Account Update) on COMEN01,
# and enters account 00000000001. 9000-READ-ACCT reads CXACAIX by account id
# (card 9680294154603697, customer 000000001, line 49 of
# app/data/ASCII/cardxref.txt), ACCTDAT and CUSTDAT, keeps the records as the
# old values in the COMMAREA and sets ACUP-SHOW-DETAILS; the screen shows them
# with 'Update account details presented above.', every editable field
# unprotected with its MDT on [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,
# 2955-3000,3441-3561,3608-3884].
# Step 4 types 850 over the FICO Score (ACSTFCO, shown as 700) and presses
# ENTER.
# - 1100-RECEIVE-MAP moves the received '850' to the 3-byte
#   ACUP-NEW-CUST-FICO-SCORE-X, which ACUP-NEW-CUST-FICO-SCORE redefines as
#   PIC 9(03) [app/cbl/COACTUPC.cbl:845-849,1279-1284]. 1205-COMPARE-OLD-NEW
#   finds it unequal to the old score 700, so a change has occurred, and
#   1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs the field edits in
#   screen order [app/cbl/COACTUPC.cbl:1460-1470,1764-1768].
# - Account Status, Open Date, Credit Limit, Expiry Date, Cash Credit Limit,
#   Reissue Date, the current balance and cycle amounts, SSN and Date of Birth
#   pass on the repository account and the invented customer. 'FICO Score' is
#   moved to WS-EDIT-VARIABLE-NAME and the score to WS-EDIT-ALPHANUM-ONLY with
#   length 3; 1245-EDIT-NUM-REQD finds it supplied, all numeric and not zero,
#   so 1275-EDIT-FICO-SCORE runs [app/cbl/COACTUPC.cbl:1472-1556,2109-2176].
#   850 is within 300 THROUGH 850, so it only CONTINUEs: no INPUT-ERROR, no
#   FLG-FICO-SCORE-NOT-OK and no message [app/cbl/COACTUPC.cbl:2514-2531].
# - The name, address, zip, phone, EFT and primary-holder edits and the
#   state/zip cross edit pass on the invented customer, so with no INPUT-ERROR
#   1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-OK-NOT-CONFIRMED
#   [app/cbl/COACTUPC.cbl:1557-1677]. 2000-DECIDE-ACTION only continues on
#   that state (no PF5), so 9600-WRITE-PROCESSING, the sole READ UPDATE and
#   REWRITE path, does not run [app/cbl/COACTUPC.cbl:2602-2621].
# - 3203-SHOW-UPDATED-VALUES shows the received values, the amounts re-edited
#   through +ZZZ,ZZZ,ZZZ.99 and the FICO Score as received; 3250 sets
#   PROMPT-FOR-CONFIRMATION and moves the still blank WS-RETURN-MSG to ERRMSG;
#   3300 leaves every field protected; 3390 makes F5=Save and F12=Cancel
#   bright (DFHBMASB), which the map defines dark [app/cbl/COACTUPC.cbl:
#   472-473,2870-2951,2955-2983,3001-3003,3566-3581]
#   [app/bms/COACTUP.bms:498-507].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte INFOMSGO; ERRMSG is the
#   75-byte WS-RETURN-MSG, blank, in the 78-byte ERRMSGO.
# - The tpe adapter enters a field with EraseEOF before typing; '850' fills
#   the 3-byte ACSTFCO, and the screen shows it as received.
# - FKEY05 and FKEY12 keep their INITIAL text; on screen 3 they are dark
#   (ASKIP,DRK) and the s3270 capture renders a zero-intensity field as blanks.
#   Colour and cursor position are not in the s3270 text capture and are not
#   asserted.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every other
# COACTUPC edit, so the FICO Score is the only field whose edit decides the
# outcome: the repository record has FICO 274, itself below 300, and zip
# 12546, which is not a North Carolina zip [app/cbl/COACTUPC.cbl:2514-2558].
# Area code 919 is a general-purpose code and NC27 a valid state and zip pair
# [app/cpy/CSLKPCDY.cpy:521,895,1186]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-boundary-03
level: e2e
type: boundary
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001, whose customer has FICO Score 700, types 850, the
  upper edge of the 300 to 850 range, over the FICO Score and presses ENTER.
  The score is in range, so no FICO Score message appears: every edit passes
  and COACTUPC shows the changed values, protected, with 'Changes
  validated.Press F5 to save' and the F5=Save and F12=Cancel keys made
  visible. Nothing is saved before PF5: ACCTDATA and CUSTDATA still hold the
  fetched records, FICO Score 700 included.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-146  # COACTUPC FICO Score: 300 to 850 (1275-EDIT-FICO-SCORE)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and confirmation screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the per-field error attributes, none set here
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the date edits the dates and Date of Birth pass
- INV-LAY-014  # CSUTLDWY: the date-edit working storage
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix COACTUPC comments out the TEST-NUMVAL-C amount checks this path
# runs and drops TRIM from its field-edit messages and change detection, so
# the outcome of the FICO Score edit path may differ on UniKix; the app/
# behaviour is pinned.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
