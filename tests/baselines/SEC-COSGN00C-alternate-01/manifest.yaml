# Derived baseline of SEC-COSGN00C-alternate-01. Only unikix can run the
# scenario, so expected.yaml is authored from the source and is
# inferred-not-observed (GAP-INF-002, GAP-INF-012). It names no execution_id or
# execution_fingerprint and holds no datasets/ until an eligible UniKix run is
# imported (report.py --import-unikix).
#
# source_identity.units are the COPY closure, as harness.results computes it
# for a program (the symbolic map COSGN00.CPY included), of COSGN00C, the one
# program the steps run, plus the BMS source of its map COSGN00, the sign-on
# screen PF3 is pressed on. The plain-text farewell (@map TEXT) has no map
# source. The expected screen is derived from the PF3 path's SEND TEXT ...
# ERASE in COSGN00C [app/cbl/COSGN00C.cbl:85-90,160-172] and the
# CCDA-MSG-THANK-YOU text it sends [app/cpy/CSMSG01Y.cpy:18-19]. DFHAID and
# DFHBMSCA are CICS-supplied and not in the repository.
