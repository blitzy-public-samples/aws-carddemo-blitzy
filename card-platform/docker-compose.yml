      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${ACCOUNT_DB_NAME:-carddemo_account}?currentSchema=${ACCOUNT_DB_SCHEMA:-account_service}&sslmode=require
      # This service's own login. It owns carddemo_account and can connect to no other database:
      # the provisioning program revokes CONNECT from PUBLIC on every one of the six.
      SPRING_DATASOURCE_USERNAME: ${ACCOUNT_DB_USER:-carddemo_account_svc}
      SPRING_DATASOURCE_PASSWORD: ${ACCOUNT_DB_PASSWORD:?ACCOUNT_DB_PASSWORD must be set; copy .env.example to .env and give this service its own password}
      SPRING_FLYWAY_SCHEMAS: ${ACCOUNT_DB_SCHEMA:-account_service}
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${ACCOUNT_DB_SCHEMA:-account_service}
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ${ACCOUNT_DB_SCHEMA:-account_service}
      # Two Flyway locations, for the same reason the authorization service names two.
      # db/migration reproduces app/data/ASCII/acctdata.txt value for value, and all 50 of
      # its expiries fall in 2025. db/demo extends them to 2099-12-31 and touches nothing
      # else. The two copies of this record carry one overlay or neither: this service
      # publishes its expiry on every state change and the authorization replica applies it,
      # so extending the replica alone would have the first posted transaction write a past
      # expiry back over the extension. Drop the second location here and in the
      # authorization service together for a run compared against the fixture.
      SPRING_FLYWAY_LOCATIONS: ${ACCOUNT_FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/demo}
      # This service's own broker identity. The entries the broker installs for it
      # cover exactly what its configuration needs: it publishes
      # account.state-changed and customer.context-changed when a state change occurs,
      # and reads transaction.posted under its own group. An entry naming another
      # service's topic or group is absent, so a compromise here reaches neither. A
      # username is not a credential and carries a fallback; the password carries
      # none.
      KAFKA_SASL_USERNAME: ${ACCOUNT_KAFKA_USER:-carddemo-account}
      KAFKA_SASL_PASSWORD: ${ACCOUNT_KAFKA_PASSWORD:?ACCOUNT_KAFKA_PASSWORD must be set; copy .env.example to .env and give this service its own broker password}
      # The first topic this service publishes, on a mutation only. Its payload
      # matches schemas/account-state-changed-v1.json in event-contracts.
      TOPIC_ACCOUNT_STATE_CHANGED: ${TOPIC_ACCOUNT_STATE_CHANGED:-account.state-changed}
      # The second topic this service publishes, on a cardholder-field change. The
      # broker grants this identity producer access to it in create_acls above, and
      # the notification service consumes it under GROUP_NOTIFICATION_CUSTOMER.
      # Naming it here matches deploy/k8s/30-configmap.yaml, which supplies it to
      # every service. Without the line the image falls back to the name compiled
      # into it, so a deployment that renames the topic through the environment
      # would create and consume the new name while this producer kept writing the
      # old one.
      TOPIC_CUSTOMER_CONTEXT_CHANGED: ${TOPIC_CUSTOMER_CONTEXT_CHANGED:-customer.context-changed}
      # The one topic this service reads. messaging/TransactionPostedConsumer adds each
      # posted amount to the account record, reproducing app/cbl/CBTRN02C.cbl:L545-L560,
      # and the state change it queues carries the two billing-cycle accumulators to the
      # authorization replica the credit-limit rule reads.
      TOPIC_TRANSACTION_POSTED: ${TOPIC_TRANSACTION_POSTED:-transaction.posted}
      # The group that listener joins, named twice on purpose: Spring reads the first key
      # and config/StreamNameReport reports the second, so a deployment that renames the
      # group is visible in the start-up log rather than only in the broker.
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${GROUP_ACCOUNT_POSTED:-account-posted}
      GROUP_ACCOUNT_POSTED: ${GROUP_ACCOUNT_POSTED:-account-posted}
      CONSUMER_MAX_RETRY_ATTEMPTS: ${CONSUMER_MAX_RETRY_ATTEMPTS:-3}
      CONSUMER_RETRY_BACKOFF_MS: ${CONSUMER_RETRY_BACKOFF_MS:-1000}
      # The producer contract also validates the shared source-less fallback envelope, and
      # the listener's own dead-letter route sends a governed envelope to the same topic.
      TOPIC_DEAD_LETTER: ${TOPIC_DEAD_LETTER:-carddemo.dead-letter}
      OUTBOX_RELAY_INTERVAL_MS: ${OUTBOX_RELAY_INTERVAL_MS:-500}
      OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-100}
      OUTBOX_RELAY_CLAIM_TIMEOUT: ${OUTBOX_RELAY_CLAIM_TIMEOUT:-PT2M}
      # Longest one send waits for the broker before messaging/KafkaEventPublisher fails the
      # stage it returned. The row then stays unpublished and the next sweep claims it again, so
      # a slow broker delays an event and never loses one. Wider than the producer window of one
      # send and narrower than the sweep deadline below.
      OUTBOX_RELAY_PUBLISH_TIMEOUT: ${OUTBOX_RELAY_PUBLISH_TIMEOUT:-PT10S}
      # Milliseconds one relay pass may spend waiting for broker acknowledgements. Read once
      # per pass as a monotonic deadline, so a slow broker costs one pass and not an unbounded
      # one. It stays above the producer window of one send, MAX_BLOCK_MS + DELIVERY_TIMEOUT_MS.
      OUTBOX_RELAY_MAX_DURATION_MS: ${OUTBOX_RELAY_MAX_DURATION_MS:-5000}
      OUTBOX_PUBLISHED_RETENTION_HOURS: ${OUTBOX_PUBLISHED_RETENTION_HOURS:-168}
      RETENTION_SWEEP_INTERVAL_MS: ${RETENTION_SWEEP_INTERVAL_MS:-3600000}
      # Bound on how long a locked read of one update waits for a row another writer holds.
      WRITE_LOCK_WAIT_MS: ${WRITE_LOCK_WAIT_MS:-3000}
      # Bytes the largest legitimate request body occupies. config/RequestBodyCeilingFilter
      # refuses a request declaring more, and config/JsonReadCeilingConfig bounds the parser for
      # one declaring no length at all. Only the three services that accept a request body
      # install that filter, so this is a per-service key and not part of the shared block.
      API_MAX_REQUEST_BODY_BYTES: ${API_MAX_REQUEST_BODY_BYTES:-65536}
    ports:
      # Both mappings bind the loopback address. The service port carries the
      # Representational State Transfer (REST) surface; the management port
      # carries /actuator and reaches no further than this machine.
      - "127.0.0.1:${ACCOUNT_PORT:-8085}:8080"
      - "127.0.0.1:${ACCOUNT_MANAGEMENT_PORT:-9085}:${MANAGEMENT_PORT:-9080}"
    # Read-only root filesystem, with the same size-limited in-memory /tmp the
    # authorization service above documents.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    # Readiness checks the broker used by this service's outbox relay.
    depends_on: *database-and-broker
    healthcheck: *actuator-healthcheck
    networks:
      - carddemo
    restart: unless-stopped

  # Card service container. Configured with the card database, its schema and
  # the outbox relay settings. It subscribes to no topic. CardController serves the
  # card list, the card detail and the card update over CardQueryService and
  # CardUpdateService, and OutboxWriter and OutboxRelay carry card.updated.
  card-service:
    # The tag this image carries once built. One tag serves the three places that name
    # it: .github/workflows/ci.yml builds it, this file runs it, and deploy/k8s names it
    # with imagePullPolicy Never. The version is the Maven project version, so an image
    # built from another version is never mistaken for this one. Compose builds the image
    # from the context below when the tag is absent locally, and no registry holds it.
    image: carddemo/card-service:1.0.0-SNAPSHOT
    build:
      # This directory, because the builder stage of the Dockerfile compiles the module
      # from source and needs the aggregator descriptor and both shared libraries in
      # reach. services/card-service/Dockerfile.dockerignore reduces what is sent
      # to exactly that, and no host archive is used or required.
      context: .
      dockerfile: services/card-service/Dockerfile
    container_name: card-platform${CLONE_INDEX:-}-card-service
    environment:
      <<: *service-environment
      # sslmode=require encrypts this connection. The compose server presents a
      # certificate it generated for itself, so there is no authority to verify it
      # against and verify-full would refuse it. deploy/k8s/30-configmap.yaml uses
      # verify-full, because a cluster has a certificate authority and a network path
      # worth protecting; here the whole path is one Docker bridge on one machine.
      # The card-token key, delivered to this service and to card-service alone. A card
      # token is an HmacSHA256 code over the card number under this key, and the key is
      # what stops a holder of one token recomputing tokens across the sixteen-digit
      # card-number space. There is no default and no fallback: com.carddemo.cobol.PanMasker
      # refuses to derive without a key, and this service refuses to start without one.
      # Generate a value into .env before the first run; .env.example carries the command.
      CARD_TOKEN_SECRET: ${CARD_TOKEN_SECRET:?CARD_TOKEN_SECRET must be set; copy .env.example to .env and generate a card-token key of at least 32 characters}
      # Not key material. The version is part of the message the code covers, so raising it
      # rolls every token over under the same key.
      CARD_TOKEN_VERSION: ${CARD_TOKEN_VERSION:-1}
      # The three rotation settings, delivered to this service alone because it is the only one
      # that rewrites a stored token. All three are unset or false in ordinary operation.
      #
      # CARD_TOKEN_PREVIOUS_SECRET carries the key the stored tokens were taken under, which is
      # what makes the previous token of a card derivable beside the current one. Without it a
      # rotation cannot write the mapping the notification read model, the authorization decision
      # diagnostics and every granted SCOPE_CARD authority are re-keyed from, so it refuses.
      CARD_TOKEN_PREVIOUS_SECRET: ${CARD_TOKEN_PREVIOUS_SECRET:-}
      # The version those stored tokens were taken under. Absent, it falls back to the current
      # version, so turning the key over without raising the version needs one setting.
      CARD_TOKEN_PREVIOUS_VERSION: ${CARD_TOKEN_PREVIOUS_VERSION:-}
      # The operator's statement that a rotation is intended. Left false, domain/CardTokenReconciler
      # refuses to start rather than rewriting an identity three other stores already name, which is
      # the silent rewrite a security review found. services/card-service/README.md is the procedure.
      CARD_TOKEN_ROTATION_ENABLED: ${CARD_TOKEN_ROTATION_ENABLED:-false}
      CARD_DB_NAME: ${CARD_DB_NAME:-carddemo_card}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${CARD_DB_NAME:-carddemo_card}?currentSchema=${CARD_DB_SCHEMA:-card_service}&sslmode=require
      # This service's own login. It owns carddemo_card and can connect to no other database:
      # the provisioning program revokes CONNECT from PUBLIC on every one of the six.
      SPRING_DATASOURCE_USERNAME: ${CARD_DB_USER:-carddemo_card_svc}
      SPRING_DATASOURCE_PASSWORD: ${CARD_DB_PASSWORD:?CARD_DB_PASSWORD must be set; copy .env.example to .env and give this service its own password}
      SPRING_FLYWAY_SCHEMAS: ${CARD_DB_SCHEMA:-card_service}
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${CARD_DB_SCHEMA:-card_service}
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ${CARD_DB_SCHEMA:-card_service}
      # This service's own broker identity. The entries the broker installs for it
      # cover exactly what its configuration needs: it publishes card.updated
      # when a state change occurs, and it names a row its outbox relay gave up on
      # on the shared dead-letter topic. An entry naming another service's topic or
      # group is absent, so a compromise here reaches neither. A username is not a
      # credential and carries a fallback; the password carries none.
      KAFKA_SASL_USERNAME: ${CARD_KAFKA_USER:-carddemo-card}
      KAFKA_SASL_PASSWORD: ${CARD_KAFKA_PASSWORD:?CARD_KAFKA_PASSWORD must be set; copy .env.example to .env and give this service its own broker password}
      # The one business topic this service is to publish, on a mutation only. Its
      # payload matches schemas/card-updated-v1.json in event-contracts, the one
      # governed CardUpdated document.
      TOPIC_CARD_UPDATED: ${TOPIC_CARD_UPDATED:-card.updated}
      # The shared dead-letter topic. This service registers no listener, so nothing
      # of its own is dead-lettered on consumption. outbox/OutboxRelay publishes one
      # governed DeadLetterEnvelope here for a row it abandoned after ten attempts,
      # which is the one record of a card update no consumer will ever see. The send
      # is awaited, so a broker that refuses it rolls the sweep back and the row is
      # offered again rather than left terminal with no diagnostic anywhere.
      TOPIC_DEAD_LETTER: ${TOPIC_DEAD_LETTER:-carddemo.dead-letter}
      # Producer reliability, the same set the other two publishers carry.
      # messaging/KafkaEventPublisher.java reads these back from the producer
      # factory at construction and refuses to start unless every one holds.
      # acks all waits for every in-sync replica. Idempotent production plus an
      # in-flight ceiling of five keeps one account's events in publish order
      # through a retry.
      SPRING_KAFKA_PRODUCER_ACKS: all
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_PROPERTIES_ENABLE_IDEMPOTENCE: "true"
      SPRING_KAFKA_PRODUCER_PROPERTIES_MAX_IN_FLIGHT_REQUESTS_PER_CONNECTION: "5"
      # The three send timeouts are deliberately NOT set here, and a review found
      # why it matters. This block used to carry DELIVERY_TIMEOUT_MS 120000,
      # REQUEST_TIMEOUT_MS 30000 and MAX_BLOCK_MS 5000, which made the window of one
      # send MAX_BLOCK_MS + DELIVERY_TIMEOUT_MS = 125 seconds while
      # OUTBOX_RELAY_MAX_DURATION_MS below bounds the whole sweep at 5 seconds. Every
      # send then outlived the deadline that was meant to bound it: the relay gave up
      # waiting while the producer kept trying, so a row could be published by an
      # abandoned send and republished by the next sweep. No other service block
      # overrode them. src/main/resources/application.yml pins 2000 / 2000 / 2000, a
      # 4-second window that fits inside the 5-second sweep, and leaving these unset is
      # what lets that hold.
      OUTBOX_RELAY_INTERVAL_MS: ${OUTBOX_RELAY_INTERVAL_MS:-500}
      OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-100}
      OUTBOX_RELAY_CLAIM_TIMEOUT: ${OUTBOX_RELAY_CLAIM_TIMEOUT:-PT2M}
      # Longest one send waits for the broker before messaging/KafkaEventPublisher fails the
      # stage it returned. The row then stays unpublished and the next sweep claims it again, so
      # a slow broker delays an event and never loses one. Wider than the producer window of one
      # send and narrower than the sweep deadline below.
      OUTBOX_RELAY_PUBLISH_TIMEOUT: ${OUTBOX_RELAY_PUBLISH_TIMEOUT:-PT10S}
      # Milliseconds one relay sweep may spend waiting for broker acknowledgements. Read once
      # per sweep as a monotonic deadline, so a slow broker costs one sweep and not an unbounded
      # one. It stays above the producer window of one send, MAX_BLOCK_MS + DELIVERY_TIMEOUT_MS.
      OUTBOX_RELAY_MAX_DURATION_MS: ${OUTBOX_RELAY_MAX_DURATION_MS:-5000}
      OUTBOX_PUBLISHED_RETENTION_HOURS: ${OUTBOX_PUBLISHED_RETENTION_HOURS:-168}
      RETENTION_SWEEP_INTERVAL_MS: ${RETENTION_SWEEP_INTERVAL_MS:-3600000}
      # Bound on how long a locked read of one update waits for a row another writer holds.
      WRITE_LOCK_WAIT_MS: ${WRITE_LOCK_WAIT_MS:-3000}
      # Bytes the largest legitimate request body occupies. config/RequestBodyCeilingFilter
      # refuses a request declaring more, and config/JsonReadCeilingConfig bounds the parser for
      # one declaring no length at all. Only the three services that accept a request body
      # install that filter, so this is a per-service key and not part of the shared block.
      API_MAX_REQUEST_BODY_BYTES: ${API_MAX_REQUEST_BODY_BYTES:-65536}
    ports:
      # Both mappings bind the loopback address. The service port carries the
      # Representational State Transfer (REST) surface; the management port
      # carries /actuator and reaches no further than this machine.
      - "127.0.0.1:${CARD_PORT:-8086}:8080"
      - "127.0.0.1:${CARD_MANAGEMENT_PORT:-9086}:${MANAGEMENT_PORT:-9080}"
    # Read-only root filesystem, with the same size-limited in-memory /tmp the
    # authorization service above documents.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    # Readiness checks the broker used by this service's outbox relay.
    depends_on: *database-and-broker
    healthcheck: *actuator-healthcheck
    networks:
      - carddemo
    restart: unless-stopped

configs:

  # One database per service. The postgres command runs this program on every
  # start, so a name corrected after a refusal repairs the stack.
  #
  # It reads the six names from SERVICE_DATABASE_NAMES at run time rather than
  # taking them into the file as text, and checks each one against a strict
  # identifier pattern. It then hands each statement to psql on standard input,
  # where psql interpolates :"database_name" as one quoted identifier. A name
  # carrying a semicolon, a quotation mark or a space is refused by the pattern
  # before any statement runs. Identifier quoting means that even a name that
  # passed the pattern could not add a statement.
  #
  # It creates a database only when that name is absent, so a second start adds
  # nothing. Its last statement writes the file the postgres healthcheck reads, so
  # a refused name keeps that container out of healthy.
  service_databases:
    content: |
      #!/bin/sh
      set -eu

      : "$${SERVICE_DATABASE_NAMES:?SERVICE_DATABASE_NAMES must name the six service databases}"

      # The entry point initialises a new data directory behind a socket the
      # network cannot reach, so an answer on the loopback address means the
      # server is serving. Four minutes is far longer than any first start takes.
      attempt=0
      until pg_isready --host 127.0.0.1 --username "$$POSTGRES_USER" \
              --dbname "$$POSTGRES_DB" >/dev/null 2>&1; do
        attempt=$$((attempt + 1))
        if [ "$$attempt" -gt 120 ]; then
          echo "the database did not answer on 127.0.0.1 within four minutes" >&2
          exit 1
        fi
        sleep 2
      done

      # A value carrying the REPLACE marker is the placeholder .env.example publishes
      # rather than a password. The entry point has already created the superuser with it
      # by the time this script runs, so the refusal below stops the stack instead. The
      # marker file stays unwritten, this container never reports healthy, and depends_on
      # holds all six services back. .env.example carries the command that generates
      # every credential this stack needs.
      case "$${POSTGRES_PASSWORD:-}" in
        *REPLACE*)
          echo "refusing to provision: POSTGRES_PASSWORD still holds the placeholder" \
               ".env.example publishes. Generate a password and recreate the volume." >&2
          exit 1
          ;;
      esac

      PGHOST=127.0.0.1
      PGUSER="$$POSTGRES_USER"
      PGPASSWORD="$$POSTGRES_PASSWORD"
      PGDATABASE="$$POSTGRES_DB"
      export PGHOST PGUSER PGPASSWORD PGDATABASE

      # The three lists are paired by position, so their lengths have to agree. A
      # mismatch would hand one service another service's login, which is exactly the
      # sharing these roles exist to end.
      name_count=$$(printf %s "$$SERVICE_DATABASE_NAMES" | wc -w)
      owner_count=$$(printf %s "$$SERVICE_DATABASE_OWNERS" | wc -w)
      var_count=$$(printf %s "$$SERVICE_DATABASE_PASSWORD_VARS" | wc -w)
      if [ "$$name_count" -ne "$$owner_count" ] || [ "$$name_count" -ne "$$var_count" ]; then
        echo "refusing to provision: $$name_count databases, $$owner_count logins and" \
             "$$var_count password variables. The three lists are paired by position." >&2
        exit 1
      fi

      set -- $$SERVICE_DATABASE_OWNERS
      owners="$$*"
      set -- $$SERVICE_DATABASE_PASSWORD_VARS
      password_vars="$$*"

      position=0
      for database_name in $$SERVICE_DATABASE_NAMES; do
        position=$$((position + 1))
        owner_name=$$(printf %s "$$owners" | cut -d' ' -f "$$position")
        password_var=$$(printf %s "$$password_vars" | cut -d' ' -f "$$position")
        owner_password=$$(eval printf %s "\"\$$$$password_var\"")

        for identifier in "$$database_name" "$$owner_name"; do
          case "$$identifier" in
            *[!abcdefghijklmnopqrstuvwxyz0123456789_]* \
              | [!abcdefghijklmnopqrstuvwxyz_]* | "")
              echo "refusing identifier '$$identifier': a name holds lower-case letters," \
                   "digits and underscores, and does not open with a digit" >&2
              exit 1
              ;;
          esac
          if [ "$${#identifier}" -gt 63 ]; then
            echo "refusing identifier: a name holds at most 63 characters" >&2
            exit 1
          fi
        done

        if [ -z "$$owner_password" ]; then
          echo "refusing to provision '$$database_name': $$password_var is empty" >&2
          exit 1
        fi

        # Creating a login with the published placeholder would produce a working stack
        # holding a credential everyone who can read this repository already knows.
        case "$$owner_password" in
          *REPLACE*)
            echo "refusing to provision '$$database_name': $$password_var still holds the" \
                 "placeholder .env.example publishes. Generate a password; .env.example" \
                 "carries the command." >&2
            exit 1
            ;;
        esac

        # One login per service. psql interpolates :"owner_name" as a quoted identifier
        # and :'owner_password' as a quoted literal, so neither can add a statement. An
        # existing role has its password reset rather than being left as it was, so a
        # rotated password in .env takes effect on the next start.
        role_present=$$(printf %s "SELECT 1 FROM pg_roles WHERE rolname = :'owner_name';" \
          | psql --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 \
              --set owner_name="$$owner_name")
        if [ "$$role_present" = 1 ]; then
          printf %s 'ALTER ROLE :"owner_name" WITH LOGIN PASSWORD :'"'"'owner_password'"'"';' \
            | psql --no-psqlrc --set ON_ERROR_STOP=1 \
                --set owner_name="$$owner_name" --set owner_password="$$owner_password"
          echo "login '$$owner_name' is already present; its password was set"
        else
          printf %s 'CREATE ROLE :"owner_name" WITH LOGIN PASSWORD :'"'"'owner_password'"'"';' \
            | psql --no-psqlrc --set ON_ERROR_STOP=1 \
                --set owner_name="$$owner_name" --set owner_password="$$owner_password"
          echo "created login '$$owner_name'"
        fi

        present=$$(printf %s "SELECT 1 FROM pg_database WHERE datname = :'database_name';" \
          | psql --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 \
              --set database_name="$$database_name")

        if [ "$$present" = 1 ]; then
          printf %s 'ALTER DATABASE :"database_name" OWNER TO :"owner_name";' \
            | psql --no-psqlrc --set ON_ERROR_STOP=1 \
                --set database_name="$$database_name" --set owner_name="$$owner_name"
          echo "database '$$database_name' is already present; its owner was set"
        else
          printf %s 'CREATE DATABASE :"database_name" OWNER :"owner_name";' \
            | psql --no-psqlrc --set ON_ERROR_STOP=1 \
                --set database_name="$$database_name" --set owner_name="$$owner_name"
          echo "created database '$$database_name' owned by '$$owner_name'"
        fi

        # This is the part that turns six names into a boundary. A distinct owner alone
        # is not one. PostgreSQL grants CONNECT on a new database to PUBLIC, so every
        # login could otherwise reach every database. Revoking CONNECT from PUBLIC and
        # granting it to the owner alone leaves the password as the only way in.
        printf %s '
            REVOKE CONNECT ON DATABASE :"database_name" FROM PUBLIC;
            GRANT CONNECT ON DATABASE :"database_name" TO :"owner_name";
          ' | psql --no-psqlrc --set ON_ERROR_STOP=1 \
                --set database_name="$$database_name" --set owner_name="$$owner_name"

        # Inside the database, the schema the service migrates has to belong to it, and
        # PUBLIC keeps nothing. PostgreSQL 15 and later already withhold CREATE on the
        # public schema from PUBLIC; stating both here means the posture does not depend
        # on which server version runs.
        printf %s '
            ALTER SCHEMA public OWNER TO :"owner_name";
            REVOKE ALL ON SCHEMA public FROM PUBLIC;
            GRANT ALL ON SCHEMA public TO :"owner_name";
          ' | psql --no-psqlrc --set ON_ERROR_STOP=1 --dbname "$$database_name" \
                --set owner_name="$$owner_name"

        echo "'$$owner_name' owns '$$database_name'; PUBLIC holds no CONNECT on it"
      done

      # The superuser's own database is reachable by every login until PUBLIC loses
      # CONNECT on it too. It holds no service data. A role that can connect there can
      # still read pg_database and pg_roles, and so enumerate every database and login
      # on the server.
      printf %s '
          REVOKE CONNECT ON DATABASE :"maintenance_database" FROM PUBLIC;
        ' | psql --no-psqlrc --set ON_ERROR_STOP=1 \
              --set maintenance_database="$$POSTGRES_DB"
      echo "PUBLIC holds no CONNECT on '$$POSTGRES_DB' either"

      : > /tmp/service-databases-ready

volumes:

  # Database files and broker log segments survive `docker compose down`.
  # `docker compose down -v` discards both.
  #
  # NEITHER VOLUME IS ENCRYPTED BY ANYTHING IN THIS FILE, AND NEITHER MAY HOLD REAL DATA.
  # Both are local named volumes under this machine's Docker data root. postgres-data holds all six
  # schemas and kafka-data holds every published event, so a copy of either is a copy of everything
  # this stack knows, past every control above it: the request identities, the six database logins,
  # the seven broker identities and the loopback-only bindings.
  #
  # This stack is a single-operator demonstration holding the synthetic fixtures under app/data
  # ALONE. Fifty card numbers, fifty verification values and fifty customer records, all of them
  # test data checked into this repository. The control that applies here is whole-disk encryption on
  # the machine running Docker, which is the operator's to switch on and not something a compose file
  # can declare. Destruction is one command: `docker compose down -v`.
  #
  # A deployment holding anything other than those fixtures uses the Kubernetes path instead, where
  # the requirement is declared on both claims and one overlay binds an encrypted storage class:
  # card-platform/deploy/k8s/README.md, under "Encryption at rest".
  postgres-data:
  kafka-data:

networks:

  # One bridge network. Inside it a container reaches another by service name.
  carddemo:
    driver: bridge
