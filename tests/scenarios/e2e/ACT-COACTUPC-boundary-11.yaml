  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  # Open day 31, the upper bound of 1-31, in a 31-day month, so only the
  # CSUTLDTC call is left to decide.
  - aid: ENTER
    '@map': COACTUP
    fields:
      OPNYEAR: '2014'
      OPNMON: '12'
      OPNDAY: '31'
