#
# Migration Details:
# ------------------
# Source JCL: app/jcl/READACCT.jcl
# Source COBOL: app/cbl/CBACT01C.cbl
# Target: Kubernetes CronJob triggering Spring Batch AccountDataLoadJob
#
# Business Function:
# ------------------
# Executes Spring Batch AccountDataLoadJob to read account data from
# external sources and load into PostgreSQL account table, replacing
# VSAM ACCTDATA file operations from COBOL program CBACT01C.
#
# Original COBOL Logic:
# - Opens VSAM ACCTFILE (KSDS) in sequential access mode
# - Reads all account records sequentially until EOF
# - Validates and displays account data fields
# - Handles file status codes and errors
# - Proper error handling with abend on critical failures
#
# Spring Batch Equivalent:
# - ItemReader: Reads account data from external file/API
# - ItemProcessor: Validates account record structure
# - ItemWriter: Inserts/updates PostgreSQL account table
# - Chunk-oriented processing with configurable chunk size
# - Error handling with skip/retry logic and reject records
# ******************************************************************

apiVersion: batch/v1
kind: CronJob
metadata:
  name: account-data-load-cronjob
  namespace: default
  labels:
    app: carddemo
    component: batch
    job: account-data-load
    migrated-from: CBACT01C
    source-jcl: READACCT
  annotations:
    description: "Daily account data load batch job"
    original-cobol-program: "CBACT01C.cbl"
    original-jcl-script: "READACCT.jcl"
    migration-date: "2024"
    schedule-rationale: "Load account data before other batch processes"
spec:
  # Schedule: Daily at 1:00 AM UTC
  # Rationale: Execute before dependent batch jobs (xref build, balance calc)
  schedule: "0 1 * * *"
  
  # Timezone for schedule (optional, defaults to UTC)
  # timeZone: "America/New_York"
  
  # Concurrency Policy: Forbid
  # Prevents overlapping job executions to ensure data consistency
  # If previous job is still running, skip the new scheduled execution
  concurrencyPolicy: Forbid
  
  # Starting Deadline: 300 seconds (5 minutes)
  # Maximum time window to start the job if it misses scheduled time
  startingDeadlineSeconds: 300
  
  # Job History Limits
  # Keep last 3 successful jobs for audit and troubleshooting
  successfulJobsHistoryLimit: 3
  # Keep only last failed job to conserve resources
  failedJobsHistoryLimit: 1
  
  # Suspend flag: set to true to temporarily disable the CronJob
  suspend: false
  
  # Job Template
  jobTemplate:
    metadata:
      labels:
        app: carddemo
        component: batch
        job: account-data-load
      annotations:
        batch-job-type: "data-load"
        data-source: "external-account-file"
        target-table: "account"
    spec:
      # Backoff Limit: 2 retries on failure
      # Allows up to 2 retry attempts if job fails
      backoffLimit: 2
      
      # Active Deadline: 7200 seconds (2 hours)
      # Maximum runtime before Kubernetes terminates the job
      # Ensures job doesn't run indefinitely if issues occur
      activeDeadlineSeconds: 7200
      
      # TTL After Finished: 86400 seconds (24 hours)
      # Automatically clean up completed job resources after 24 hours
      ttlSecondsAfterFinished: 86400
      
      # Parallelism: 1 (single pod execution)
      parallelism: 1
      
      # Completions: 1 (job succeeds after 1 successful pod)
      completions: 1
      
      # Pod Template
      template:
        metadata:
          labels:
            app: carddemo
            component: batch
            job: account-data-load
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "8080"
            prometheus.io/path: "/actuator/prometheus"
        spec:
          # Restart Policy: Never
          # Don't restart pod on failure - let backoffLimit handle retries
          restartPolicy: Never
          
          # Service Account for database access
          serviceAccountName: carddemo-batch-sa
          
          # Security Context for pod
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          
          # Init Containers (optional)
          # Uncomment if database readiness check is needed
          # initContainers:
          # - name: wait-for-db
          #   image: busybox:1.36
          #   command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo waiting for postgres; sleep 2; done;']
          
          # Main Container
          containers:
          - name: account-data-load-job
            image: carddemo-backend:latest
            imagePullPolicy: IfNotPresent
            
            # Command: Execute Spring Boot application with specific batch job
            command:
              - java
            
            # Arguments: Spring Boot configuration and batch job specification
            args:
              - -jar
              - /app/carddemo-backend.jar
              - --spring.batch.job.names=AccountDataLoadJob
              - --spring.profiles.active=batch
              - --logging.level.com.carddemo.batch=DEBUG
            
            # Environment Variables
            env:
            # Spring Boot configuration
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: database.url
            
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: carddemo-secrets
                  key: database.username
            
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carddemo-secrets
                  key: database.password
            
            # Spring Batch configuration
            - name: SPRING_BATCH_JOB_ENABLED
              value: "true"
            
            - name: SPRING_BATCH_JDBC_INITIALIZE_SCHEMA
              value: "never"
            
            # Chunk size for batch processing
            - name: BATCH_CHUNK_SIZE
              value: "1000"
            
            # Skip limit for error tolerance
            - name: BATCH_SKIP_LIMIT
              value: "100"
            
            # Job execution timeout
            - name: BATCH_JOB_TIMEOUT
              value: "7000"
            
            # Logging configuration
            - name: LOGGING_LEVEL_ROOT
              value: "INFO"
            
            - name: LOGGING_LEVEL_BATCH
              value: "DEBUG"
            
            # Java options for heap size and GC
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx768m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
            
            # Application name
            - name: SPRING_APPLICATION_NAME
              value: "carddemo-batch-account-load"
            
            # Resource Requests and Limits
            resources:
              requests:
                # Minimum guaranteed resources
                memory: "512Mi"
                cpu: "250m"
                ephemeral-storage: "1Gi"
              limits:
                # Maximum allowed resources
                memory: "1Gi"
                cpu: "1000m"
                ephemeral-storage: "2Gi"
            
            # Security Context for container
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsNonRoot: true
              runAsUser: 1000
              capabilities:
                drop:
                  - ALL
            
            # Volume Mounts
            volumeMounts:
            - name: batch-data
              mountPath: /app/data
              readOnly: false
            
            - name: batch-logs
              mountPath: /app/logs
              readOnly: false
            
            - name: application-config
              mountPath: /app/config
              readOnly: true
            
            # Liveness Probe (disabled for batch jobs)
            # Batch jobs have defined lifecycle and don't need liveness checks
            
            # Readiness Probe (disabled for batch jobs)
            # Not applicable for batch job execution
            
            # Startup Probe (optional)
            # Uncomment if application requires extended startup time
            # startupProbe:
            #   httpGet:
            #     path: /actuator/health
            #     port: 8080
            #   initialDelaySeconds: 30
            #   periodSeconds: 10
            #   timeoutSeconds: 5
            #   failureThreshold: 12
          
          # Volumes
          volumes:
          - name: batch-data
            persistentVolumeClaim:
              claimName: carddemo-batch-data-pvc
          
          - name: batch-logs
            emptyDir:
              sizeLimit: 500Mi
          
          - name: application-config
            configMap:
              name: carddemo-batch-config
              items:
              - key: application-batch.yml
                path: application-batch.yml
          
          # Image Pull Secrets (if using private registry)
          # imagePullSecrets:
          # - name: carddemo-registry-secret
          
          # DNS Policy
          dnsPolicy: ClusterFirst
          
          # Termination Grace Period: 30 seconds
          # Time allowed for graceful shutdown before forceful termination
          terminationGracePeriodSeconds: 30
          
          # Node Selector (optional)
          # Uncomment to schedule on specific nodes
          # nodeSelector:
          #   workload-type: batch
          
          # Affinity Rules (optional)
          # Uncomment for advanced pod scheduling
          # affinity:
          #   nodeAffinity:
          #     preferredDuringSchedulingIgnoredDuringExecution:
          #     - weight: 100
          #       preference:
          #         matchExpressions:
          #         - key: batch-optimized
          #           operator: In
          #           values:
          #           - "true"
          
          # Tolerations (optional)
          # Uncomment if nodes have taints
          # tolerations:
          # - key: "batch-workload"
          #   operator: "Equal"
          #   value: "true"
          #   effect: "NoSchedule"

# ******************************************************************
# Additional Configuration Notes:
# ******************************************************************
#
# Prerequisites:
# --------------
# 1. ConfigMap 'carddemo-config' must exist with database.url
# 2. Secret 'carddemo-secrets' must exist with database credentials
# 3. ServiceAccount 'carddemo-batch-sa' with database access
# 4. PersistentVolumeClaim 'carddemo-batch-data-pvc' for input data
# 5. ConfigMap 'carddemo-batch-config' with application-batch.yml
#
# Monitoring:
# -----------
# - Job execution metrics exposed via Spring Boot Actuator
# - Prometheus scraping enabled on port 8080
# - Logs written to /app/logs volume
# - Job completion status tracked by Kubernetes Job controller
#
# Error Handling:
# ---------------
# - BackoffLimit: 2 retries with exponential backoff
# - Skip Limit: 100 errors before job failure
# - Reject records logged to database audit table
# - Job failure triggers alert via monitoring system
#
# Data Flow:
# ----------
# 1. Read account data from external source (file/API)
# 2. Validate account record structure and business rules
# 3. Transform data to PostgreSQL account table format
# 4. Insert/update records in batch chunks (1000 records)
# 5. Handle duplicates and data conflicts
# 6. Generate processing summary report
#
# Maintenance:
# ------------
# - Suspend: Set suspend=true to disable scheduled execution
# - Manual Trigger: kubectl create job --from=cronjob/account-data-load-cronjob manual-run
# - View Logs: kubectl logs job/account-data-load-cronjob-<timestamp>
# - Delete History: kubectl delete jobs --field-selector status.successful=1
#
# ******************************************************************
