  description: 'In STEP05 the IDCAMS DELETE of the cluster is followed by ''IF MAXCC LE 08 THEN SET MAXCC = 0'': a DELETE ending with condition code 8 or less (8 when the cluster does not exist) leaves the step with return code 0, while a higher code is kept as the step''s return code. The DEFINE (STEP10) and REPRO (STEP15) steps have no COND and run whatever STEP05 returned; their own return codes decide the job''s outcome, so a final return code 0 is not guaranteed. The same conditional statement is in CARDFILE, CUSTFILE, TRANBKP, TRANFILE, XREFFILE; an unconditional ''SET MAXCC = 0'' is in CREASTMT, DISCGRP, DUSRSECJ, TCATBALF, TRANCATG, TRANTYPE, and ''IF LASTCC=12 THEN SET MAXCC=0'' is in DEFGDGB.'
  gap_ids: []
  id: INV-DAT-040
  kind: recovery
  level: integration
  name: ACCTFILE JCL MAXCC reset after DELETE
  scenario_ids: []
  source: app/jcl/ACCTFILE.jcl:27
  status: not-covered
- activation: always
  description: An output generation allocated with DISP=(NEW,CATLG,DELETE), such as DALYREJS(+1), is catalogued when the step ends normally and deleted when it abends, so an abended POSTTRAN leaves no new DALYREJS generation.
  gap_ids: []
  id: INV-DAT-041
  kind: recovery
  level: integration
  name: POSTTRAN JCL DISP=(NEW,CATLG,DELETE) on step failure
  scenario_ids: []
  source: app/jcl/POSTTRAN.jcl:34-38
  status: not-covered
- activation: always
  description: 'The TRANSACT DEFINE (STEP10) is bypassed when an earlier step ended with a return code greater than 4. STEP05 deletes the cluster and then its alternate index, each DELETE followed by ''IF MAXCC LE 08 THEN SET MAXCC = 0'', so a DELETE of a missing cluster or alternate index (code 8 or less) becomes 0 and does not bypass the DEFINE. STEP05 has no COND, so it runs even after the REPROC backup (STEP05R) ended with a return code above 4; the DEFINE is then bypassed, and a successful DELETE leaves the cluster undefined. A DELETE ending above 8 keeps its code and bypasses the DEFINE: after a failed cluster DELETE the old cluster can remain in place, after a failed alternate-index DELETE the deleted cluster stays undefined. Whether the cluster exists after the job therefore depends on the DELETE''s outcome.'
  gap_ids: []
  id: INV-DAT-042
  kind: recovery
  level: integration
  name: TRANBKP JCL COND=(4,LT) on the DEFINE step
  scenario_ids: []
  source: app/jcl/TRANBKP.jcl:51
  status: not-covered
- activation: always
  description: Each (+1) reference (COMBTRAN, INTCALC, POSTTRAN, PRTCATBL, TRANBKP, TRANREPT) creates a new generation of a GDG base defined here, and each (0) reference (COMBTRAN) reads the newest one; generations beyond the LIMIT roll off.
