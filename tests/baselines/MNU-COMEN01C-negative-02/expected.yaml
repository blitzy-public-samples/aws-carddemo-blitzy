# Derived baseline, not observed: authored from app/cbl/COMEN01C.cbl:115-165,
# with the first menu sent at 82-110 and 182-194, because no UniKix run of this
# scenario has been imported. The scenario is tagged inferred-not-observed
# (GAP-INF-003, GAP-INF-012) and suspected-defect (GAP-DEF-010).
#
# GAP-DEF-010 is pinned, not compensated for: after sending the message,
# COMEN01C still subscripts CDEMO-MENU-OPT-USRTYPE with the invalid option
# [app/cbl/COMEN01C.cbl:136-137]. None of the bytes it reads is taken as 'A',
# so the message stands and, with the error flag on, no XCTL follows.
#
# Uncertain until an imported UniKix run settles them (report.py
# --import-unikix: MAJOR bump if the outcome differs, MINOR if it agrees):
# - 'X': how the runtime moves '0X' into WS-OPTION PIC 9(02). A zone fix-up of
#   the last byte would give 07 and an XCTL to COTRN01C.
# - the out-of-range subscripts of steps 2-4 could abend under a
#   bounds-checking runtime.
# - the emulator's handling of the numeric OPTION field could refuse 'X'.
#
# messages is the complete captured list: the ERRMSG of every step, so the
# blank message of the first menu precedes the three refusals.
