                  description: Export file format
                includeMetadata:
                  type: boolean
                  default: true
                  description: Include processing metadata
      responses:
        '201':
          description: Export job created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
