# COACTUPC refuses an account update whose Current Balance is not a valid
# signed amount: 1250-EDIT-SIGNED-9V2 finds the field supplied, FUNCTION
# TEST-NUMVAL-C returns a non-zero position, and the routine composes
# 'Current Balance is not valid' [app/cbl/COACTUPC.cbl:2180-2221].
#
# Steps 1-3 reach the fetched account as ACT-COACTUPC-alternate-04 does:
# USER0001 signs on through CC00, chooses option 2 (Account Update) on COMEN01,
# and enters account 00000000001. 9000-READ-ACCT reads CXACAIX by account id
# (card 9680294154603697, customer 000000001, line 49 of
# app/data/ASCII/cardxref.txt), ACCTDAT and CUSTDAT, keeps the records as the
# old values in the COMMAREA and sets ACUP-SHOW-DETAILS; the screen shows them
# with 'Update account details presented above.', every editable field
# unprotected with its MDT on [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,
# 2955-3000,3441-3561,3608-3884].
# Step 4 types 1,2X4.00 over the current balance (ACURBAL) and presses ENTER.
# - 1100-RECEIVE-MAP moves the 15-byte ACURBALI to ACUP-NEW-CURR-BAL-X; its
#   TEST-NUMVAL-C is not 0, so NUMVAL-C is not computed and ACUP-NEW-CURR-BAL
#   keeps the spaces INITIALIZE gave it [app/cbl/COACTUPC.cbl:1047,1100-1112].
#   1205-COMPARE-OLD-NEW therefore finds it unequal to ACUP-OLD-CURR-BAL, so
#   1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs the field edits in
#   screen order [app/cbl/COACTUPC.cbl:1460-1470,1681-1694].
# - Account Status 'Y', Open Date 2014-11-20, Credit Limit '+      2,020.00',
#   Expiry Date 2025-05-20, Cash Credit Limit '+      1,020.00' and Reissue
#   Date 2025-05-20 pass their edits, the amounts because NUMVAL-C allows a
#   leading sign, spaces and comma grouping [app/cbl/COACTUPC.cbl:1472-1506].
# - 'Current Balance' is moved to WS-EDIT-VARIABLE-NAME and '1,2X4.00' with 7
#   trailing spaces to WS-EDIT-SIGNED-NUMBER-9V2-X [app/cbl/COACTUPC.cbl:
#   1508-1513]. The value is not blank; TEST-NUMVAL-C stops at the letter X,
#   whatever grouping it allows for the commas, so the routine sets INPUT-ERROR
#   and FLG-SIGNED-NUMBER-NOT-OK and, WS-RETURN-MSG being still blank
#   [app/cbl/COACTUPC.cbl:876], STRINGs the trimmed field name and ' is not
#   valid' into WS-RETURN-MSG [app/cbl/COACTUPC.cbl:2201-2211]. The flag moves
#   to WS-EDIT-CURR-BAL as FLG-CURR-BAL-NOT-OK.
# - Every later edit passes on the invented customer below and the repository
#   account; they only set their flags, since WS-RETURN-MSG is no longer blank
#   [app/cbl/COACTUPC.cbl:1515-1676]. INPUT-ERROR keeps ACUP-CHANGES-NOT-OK,
#   and 2000-DECIDE-ACTION continues on it, so 9600-WRITE-PROCESSING, the only
#   READ UPDATE and REWRITE path, does not run [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values: the valid amounts
#   re-edited through +ZZZ,ZZZ,ZZZ.99, and the refused balance as typed from
#   ACUP-NEW-CURR-BAL-X; 3250 sets PROMPT-FOR-CHANGES and moves the message to
#   ERRMSG; 3300 keeps the fields editable, marks ACURBAL red through CSSETATY
#   and puts the cursor on it; 3390 makes F12=Cancel bright because changes
#   were made, while F5=Save stays dark [app/cbl/COACTUPC.cbl:2870-2951,
#   2955-2983,3064-3067,3279-3283,3566-3581].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - The message is TRIM('Current Balance') followed by ' is not valid', 28
#   characters of the 75-byte WS-RETURN-MSG, shown in the 78-byte ERRMSG with
#   trailing spaces. INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte field.
#   Fields are compared at their full BMS length, trailing spaces kept.
# - ACURBAL shows the 8 typed characters followed by 7 blanks, whether BMS
#   pads the received field with blanks or the trailing nulls display as such.
# - FKEY05 and FKEY12 keep their INITIAL text; a dark (ASKIP,DRK) field is
#   captured as blanks.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, so the current balance is the only field refused: the repository record
# has FICO 274, below 300, and zip 12546, which is not a North Carolina zip
# [app/cbl/COACTUPC.cbl:2514-2558]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-056
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001, whose current balance is 194.00, types 1,2X4.00 over
  the current balance and presses ENTER. The letter makes the value an invalid
  signed amount, so COACTUPC refuses the change: it shows the received values
  again, editable, with the balance as typed, 'Current Balance is not valid'
  in the message line, the change prompt 'Update account details presented
  above.' and F12=Cancel made visible. Nothing is saved: ACCTDATA and CUSTDATA
  still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-114  # COACTUPC Current Balance: valid signed amount (1250-EDIT-SIGNED-9V2)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute set on ACURBAL
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the date edits the three account dates and the birth date pass
- INV-LAY-014  # CSUTLDWY: the date-edit work areas of those edits
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix COACTUPC comments out the TEST-NUMVAL-C checks of the amounts and
# the ' is not valid' edit of 1250-EDIT-SIGNED-9V2, so this refusal cannot
# occur there; the scenario pins the app/ behavior.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
