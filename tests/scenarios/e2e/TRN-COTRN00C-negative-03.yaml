# A non-numeric search key on the transaction list. USER0001 (user type U)
# signs on through CC00, and COSGN00C transfers control to the main menu
# COMEN01C [app/cbl/COSGN00C.cbl:230-237]. Option 6 'Transaction List' of
# COMEN02Y, program COTRN00C, sends COMEN01C into COTRN00C by XCTL with the
# program context reset [app/cpy/COMEN02Y.cpy:55-59] [app/cbl/COMEN01C.cbl:115-156].
# Entered for the first time, COTRN00C clears its output map, browses TRANSACT
# from LOW-VALUES and fills rows 1 to 10 with the ten lowest keys; the 11th
# record exists, so page 1 ends with no message and the search field blank
# [app/cbl/COTRN00C.cbl:111-116,206-229,279-328,381-445].
#
# Step 3 types ABC into TRNIDIN and presses ENTER. RECEIVE MAP returns every
# field, because COTRN00 defines each header, PAGENUM, SEL, row and ERRMSG
# field with FSET [app/bms/COTRN00.bms:34-89,153-442,450-453]. No SEL field
# holds a value, so no row is selected [app/cbl/COTRN00C.cbl:148-204]. TRNIDIN
# is neither blank nor numeric, so PROCESS-ENTER-KEY sets ERR-FLG, moves
# 'Tran ID must be Numeric ...' to WS-MESSAGE and sends the map with ERASE
# [app/cbl/COTRN00C.cbl:206-218,527-540]. That send rebuilds only the header
# (titles, CT00, COTRN00C, run date and time) and the message line; every other
# field shows what the terminal returned, so the ten rows and page number of
# screen 2 are echoed and TRNIDIN keeps ABC [app/cbl/COTRN00C.cbl:529-531,567-586].
# PROCESS-PAGE-FORWARD still issues STARTBR, keyed on TRAN-ID, which this task
# never set: its working-storage content collates below every numeric
# transaction id, whether the runtime fills it with LOW-VALUES or spaces, so
# the browse starts at the first record and sends nothing. ERR-FLG then skips
# the reads, the ENDBR, the second send and the clearing of TRNIDIN, and the
# task returns with TRANSID CT00 [app/cbl/COTRN00C.cbl:138-141,221-229,281-328,591-619].
# The error send is therefore the last send of the task and the screen asserted.
id: TRN-COTRN00C-negative-03
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses option 6 (Transaction List) on the main menu and,
  on the first page of the transaction list, enters ABC as the search
  transaction id. COTRN00C refuses the non-numeric key with 'Tran ID must be
  Numeric ...' in the message line, keeps ABC in the search field and leaves
  the ten listed transactions and page number 00000001 on the screen unchanged.
# Primary item first, then the program, the maps asserted (COMEN01, where the
# option is entered, and COTRN00), the transaction step 3 enters (CT00, the
# TRANSID COTRN00C returns with), the CSD file browsed, and the online-only
# copybooks COTRN00C copies. The sign-on step's own items (COSGN00, CC00,
# USRSEC) belong to the SEC scenarios, the menu step's (CM00) to the MNU
# scenarios, and the list content to TRN-COTRN00C-normal-01.
inventory_ids:
- INV-TRN-012  # COTRN00C message 'Tran ID must be Numeric ...' (rule)
- INV-TRN-001  # COTRN00C program
- INV-MNU-003  # COMEN01 map, the menu option 6 is entered on
- INV-TRN-004  # COTRN00 map
- INV-CFG-020  # CT00 transaction, which runs the search step
- INV-CFG-007  # TRANSACT CSD file, browsed on entry and by the STARTBR of the search step
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA that makes the search step a reentry
- INV-LAY-005  # COTTL01Y copybook, TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y copybook, CURDATE, CURTIME and the mm/dd/yy row dates
- INV-LAY-008  # CSMSG01Y copybook, copied by COTRN00C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-007  # TRN end-to-end baselines derived from the source, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# TRANSACT is built from the repository's 300 daily transactions, keyed on
# TRAN-ID, so the first page holds ten rows and a next page exists.
preconditions:
  datasets:
    USRSEC: {base: USRSEC}
    TRANSACT: {base: DALYTRAN}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - {transid: CC00, aid: ENTER, fields: {USERID: USER0001, PASSWD: PASSWORD}, '@map': COSGN00}
  - {aid: ENTER, fields: {OPTION: '6'}, '@map': COMEN01}
  - {aid: ENTER, fields: {TRNIDIN: ABC}, '@map': COTRN00}
# One entry per step, each the screen the step ends on. Text fields are
# compared at their full BMS length with trailing spaces: ERRMSG is 78 bytes,
# TRNIDIN 16, TDESCnn the first 26 characters of TRAN-DESC. TAMTnnn is
# TRAN-AMT edited as +99999999.99 and TDATEnn the mm/dd/yy of TRAN-ORIG-TS
# 2022-06-10 [app/cbl/COTRN00C.cbl:56-57,383-388]. The adapter clears the field
# before typing, so TRNIDIN arrives as ABC and BMS pads it with blanks.
