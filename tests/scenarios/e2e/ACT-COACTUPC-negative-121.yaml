# COACTUPC refuses an account update whose Phone Number 2 prefix is zero: the
# field edit EDIT-US-PHONE-PREFIX 'not zero' of 1260-EDIT-US-PHONE-NUM, which
# 1200-EDIT-MAP-INPUTS performs for 'Phone Number 2' on the 15-byte
# ACUP-NEW-CUST-PHONE-NUM-2 [app/cbl/COACTUPC.cbl:1640-1646,2225-2429].
#
# Steps 1-3 sign on, choose main-menu option 2 and fetch account 00000000001
# as ACT-COACTUPC-alternate-03 does: the details of the account and of the
# invented customer 000000001 are shown with ACUP-SHOW-DETAILS in the returned
# COMMAREA, and 3320-UNPROTECT-FEW-ATTRS gives every editable field MDT on, so
# all of them come back on the next AID [app/cbl/COACTUPC.cbl:2568-2580,
# 2787-2865,3500-3561].
# Step 4 types 000 over the Phone 2 prefix (ACSPH2B, shown as '555') and
# presses ENTER.
# - 1100-RECEIVE-MAP moves the received '000', neither '*' nor spaces, to the
#   3-byte ACUP-NEW-CUST-PHONE-NUM-2B [app/cbl/COACTUPC.cbl:1385-1390].
#   1205-COMPARE-OLD-NEW finds it unequal to the fetched '555', so a change has
#   occurred, and 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs the
#   field edits in screen order [app/cbl/COACTUPC.cbl:1460-1470,1751-1770].
# - Account Status, the three account dates, the five amounts, the SSN, the
#   Date of Birth, the FICO Score, the names, the address, State, Zip, City,
#   Country and Phone Number 1 pass with these fixtures and leave the message
#   line off [app/cbl/COACTUPC.cbl:876,1472-1638]. 'Phone Number 2' is moved
#   to WS-EDIT-VARIABLE-NAME and ACUP-NEW-CUST-PHONE-NUM-2 to
#   WS-EDIT-US-PHONE-NUM, whose redefinition reads the area code '919', the
#   prefix '000' and the line number '0102' at bytes 2-4, 6-8 and 10-13
#   [app/cbl/COACTUPC.cbl:82-100,820-830].
# - The number is not wholly blank. EDIT-AREA-CODE accepts '919': supplied,
#   NUMERIC, not zero and a VALID-GENERAL-PURP-CODE [app/cpy/CSLKPCDY.cpy:895].
#   EDIT-US-PHONE-PREFIX finds '000' supplied and NUMERIC, but
#   WS-EDIT-US-PHONE-NUMB-N = 0, so it sets INPUT-ERROR and
#   FLG-EDIT-US-PHONEB-NOT-OK and, WS-RETURN-MSG being off, STRINGs
#   TRIM(WS-EDIT-VARIABLE-NAME) and ': Prefix code cannot be zero' into
#   WS-RETURN-MSG, then goes to EDIT-US-PHONE-LINENUM, which accepts '0102'
#   [app/cbl/COACTUPC.cbl:2316-2422].
# - The flags move to WS-EDIT-PHONE-NUM-2-FLGS with FLG-PHONE-NUM-2B-NOT-OK
#   set. The EFT Account Id, Primary Card Holder and the state/zip cross edit
#   pass and only set their flags, since WS-RETURN-MSG is no longer blank
#   [app/cbl/COACTUPC.cbl:1648-1676,2536-2558]. INPUT-ERROR keeps
#   ACUP-CHANGES-NOT-OK, and 2000-DECIDE-ACTION continues on it, so
#   9600-WRITE-PROCESSING, the only READ UPDATE and REWRITE path, does not run
#   [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values, the valid amounts
#   re-edited through +ZZZ,ZZZ,ZZZ.99 and the phone parts as received; 3250
#   sets PROMPT-FOR-CHANGES and moves the message to ERRMSG; 3300 keeps the
#   fields editable, puts the cursor on ACSPH2B and marks it red through
#   CSSETATY without the '*' of a blank field; 3390 makes F12=Cancel bright
#   because changes were made, while F5=Save stays dark [app/cbl/COACTUPC.cbl:
#   2870-2951,2955-2983,3151-3153,3416-3420,3566-3581]
#   [app/cpy/CSSETATY.cpy:18-27].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - The message is TRIM('Phone Number 2') followed by ': Prefix code cannot be
#   zero', 42 characters of the 75-byte WS-RETURN-MSG, shown in the 78-byte
#   ERRMSG with trailing spaces. INFOMSG is the 40-byte WS-INFO-MSG in the
#   45-byte field. Fields are compared at their full BMS length, trailing
#   spaces kept.
# - ACSPH2B is 3 bytes [app/bms/COACTUP.bms:448-452], so the typed '000' fills
#   it and is shown back unchanged.
# - FKEY05 and FKEY12 keep their INITIAL text; a dark (ASKIP,DRK) field is
#   captured as blanks. Colour and cursor position are not in the s3270 text
#   capture and are not asserted.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, so the Phone Number 2 prefix is the only field refused: the
# repository record has FICO 274, below 300, and zip 12546, which is not a
# North Carolina zip [app/cbl/COACTUPC.cbl:2514-2558]. Account 00000000001 and
# its cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-121
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001, whose customer has Phone Number 2 (919)555-0102, types
  000 over the Phone 2 prefix and presses ENTER. The prefix is a 3-digit
  number but zero, so COACTUPC refuses the change: it shows the received
  values again, editable, with 'Phone Number 2: Prefix code cannot be zero' in
  the message line, the prefix as typed, the change prompt 'Update account
  details presented above.' and F12=Cancel made visible. Nothing is saved:
  ACCTDATA and CUSTDATA still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-179  # COACTUPC Phone Number 2: prefix not zero (EDIT-US-PHONE-PREFIX)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups, which pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute set on ACSPH2B
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the date edits the earlier dates pass
- INV-LAY-014  # CSUTLDWY: the date-edit working storage
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix COACTUPC drops FUNCTION TRIM from the field name of every
# composed edit message, so on UniKix the message carries the 25-byte
# WS-EDIT-VARIABLE-NAME untrimmed; the app/ behaviour is pinned.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
