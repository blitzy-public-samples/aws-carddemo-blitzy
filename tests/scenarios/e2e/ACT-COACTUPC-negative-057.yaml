# COACTUPC refuses an account update whose Current Cycle Credit Limit is left
# blank: the 'supplied' predicate of 1250-EDIT-SIGNED-9V2 for that field
# [app/cbl/COACTUPC.cbl:1515-1520,2180-2196].
#
# Steps 1-3 sign on, choose main-menu option 2 and fetch account 00000000001
# as ACT-COACTUPC-alternate-03 does: the details of the account and of the
# invented customer 000000001 are shown with ACUP-SHOW-DETAILS in the returned
# COMMAREA, and 3320-UNPROTECT-FEW-ATTRS gives every editable field MDT on, so
# all of them come back on the next AID [app/cbl/COACTUPC.cbl:2568-2580,
# 2787-2865,3500-3561].
# Step 4 erases ACRCYCR (EraseEOF, nothing typed) and presses ENTER:
# - 1100-RECEIVE-MAP leaves LOW-VALUES in ACUP-NEW-CURR-CYC-CREDIT-X whether the
#   erased field arrives as spaces (the blank branch) or as nulls (which fail
#   TEST-NUMVAL-C), and computes no ACUP-NEW-CURR-CYC-CREDIT-N, so
#   ACUP-NEW-CURR-CYC-CREDIT keeps the spaces of INITIALIZE
#   [app/cbl/COACTUPC.cbl:1047,1114-1126].
# - 1205-COMPARE-OLD-NEW finds it unequal to the fetched 0.00, so
#   1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs the field edits in
#   screen order. Account Status, Open Date, Credit Limit, Expiry Date, Cash
#   Credit Limit, Reissue Date and Current Balance pass; then
#   1250-EDIT-SIGNED-9V2 finds LOW-VALUES, sets INPUT-ERROR and
#   FLG-SIGNED-NUMBER-BLANK ('B', moved on to FLG-CURR-CYC-CREDIT-BLANK) and,
#   the message line being off since the task started, STRINGs
#   TRIM(WS-EDIT-VARIABLE-NAME) and ' must be supplied.' into WS-RETURN-MSG
#   [app/cbl/COACTUPC.cbl:876,1470-1520,1695,2184-2196]. Every later edit passes
#   with these fixtures and none could overwrite the message.
# - 2000-DECIDE-ACTION continues on ACUP-CHANGES-NOT-OK, so nothing is read for
#   update or rewritten [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values, the valid amounts
#   re-edited through +ZZZ,ZZZ,ZZZ.99 and ACRCYCR as ACUP-NEW-CURR-CYC-CREDIT-X;
#   3250-SETUP-INFOMSG sets PROMPT-FOR-CHANGES and moves the message to ERRMSG;
#   CSSETATY for CURR-CYC-CREDIT, with FLG-CURR-CYC-CREDIT-BLANK on a reentry,
#   colours ACRCYCR red and moves '*' to it (the field refused); 3320 unprotects
#   the fields again; 3390 makes F12=Cancel bright because ACUP-CHANGES-MADE,
#   and leaves F5=Save dark [app/cbl/COACTUPC.cbl:2870-2902,2955-2981,
#   3285-3289,3566-3581] [app/cpy/CSSETATY.cpy:17-26].
#
# The message names the field 'Current Cycle Credit Limi': the 26-character
# literal 'Current Cycle Credit Limit' is moved into the 25-byte
# WS-EDIT-VARIABLE-NAME, which keeps its first 25 characters
# [app/cbl/COACTUPC.cbl:53,1515]. The truncated text is pinned as the source
# produces it, tagged suspected-defect under GAP-DEF-018, and never corrected.
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   ERRMSG is 'Current Cycle Credit Limi must be supplied.' (43 characters) in
#   the 75-byte WS-RETURN-MSG, moved to the 78-byte ERRMSGO: 35 trailing
#   spaces. ACRCYCR is '*' in its 15-byte field. INFOMSG is the 40-byte
#   WS-INFO-MSG in the 45-byte INFOMSGO.
# - AADDGRP is sent as LOW-VALUES on screen 4 (the blank group id comes back as
#   spaces, which 1100 turns into LOW-VALUES); s3270 shows nulls as spaces.
# - A dark (DRK) field is captured as blanks; no upper-case translation of
#   input is assumed (CARDDEMO.CSD gives CAUP the profile DFHCICST).
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit (the repository record fails the phone-2 and state/zip edits), so the
# blank cycle credit limit is the only refused field
# [app/cbl/COACTUPC.cbl:2225-2558].
id: ACT-COACTUPC-negative-057
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update) and fetches
  account 00000000001, then erases the Current Cycle Credit Limit and presses
  ENTER. COACTUPC refuses the change: the message line shows 'Current Cycle
  Credit Limi must be supplied.' (the field name cut to 25 characters), the
  Current Cycle Credit Limit field shows '*', the other received values are
  shown again with the change prompt and F12=Cancel, and neither ACCTDATA nor
  CUSTDATA is rewritten.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. The change prompt 'Update account details presented above.'
# (INV-ACT-030) is asserted but verified by its own scenario. Sign-on (CC00,
# COSGN00, USRSEC) and the menu transaction are verified by the SEC and MNU
# scenarios; the batch record copybooks and the data files are verified at the
# lowest level that executes them.
inventory_ids:
- INV-ACT-115  # COACTUPC Current Cycle Credit Limit: supplied (1250-EDIT-SIGNED-9V2)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refusal screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the '*' and red attribute of the refused field
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the four date edits
- INV-LAY-014  # CSUTLDWY: the date-edit work areas
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
- suspected-defect
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-DEF-018  # the field name cut to 25 characters in the composed message
# The UniKix COACTUPC keeps the 25-byte name (so the same truncated text) but
# computes NUMVAL-C on any non-blank cycle credit input without TEST-NUMVAL-C
# (COACTUPC.cl2:1114-1126), so an erased field that arrives as nulls may not
# count as a change there; a UniKix run never verifies the item.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
        CUST-ADDR-ZIP: '27601'
        CUST-PHONE-NUM-1: (919)555-0101
        CUST-PHONE-NUM-2: (919)555-0102
        CUST-SSN: '123456789'
        CUST-GOVT-ISSUED-ID: TESTGOVT0001
        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: Y
        CUST-FICO-CREDIT-SCORE: '700'
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
# PASSWORD is the documented demo password of README.md, not a secret.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACRCYCR: ''
