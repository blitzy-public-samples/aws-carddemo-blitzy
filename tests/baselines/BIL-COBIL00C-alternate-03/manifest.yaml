# directly, with no COMMAREA. COBIL00C XCTLs to COSGN00C without sending its
# bill payment screen [app/cbl/COBIL00C.cbl:107-109,273-284], and COSGN00C
# sends the sign-on screen with 'Please enter User ID ...'
# [app/cbl/COSGN00C.cbl:80-88,108-157]. Only unikix can run the scenario, so
# expected.yaml is authored from the source and is inferred-not-observed
# (GAP-INF-008, GAP-INF-012). It names no execution_id or
# execution_fingerprint and holds no datasets/ until an eligible UniKix run is
# imported with report.py --import-unikix.
#
# source_identity.units are the app/ units this path executes, each as
# harness.results computes it for a program: the COPY closure of COBIL00C
# [app/cbl/COBIL00C.cbl:63-82] and of COSGN00C [app/cbl/COSGN00C.cbl:48-55],
# plus the BMS source of COSGN00, the map the expected screen asserts.
# app/bms/COBIL00.bms is absent because this path never sends that map;
# DFHAID and DFHBMSCA are CICS-supplied, not app/ sources. derived_from is
# omitted: the expectation comes from the source, not the tech spec.
# source_commit is HEAD at authoring; app/ is byte-identical to the suite's
# starting commit.
