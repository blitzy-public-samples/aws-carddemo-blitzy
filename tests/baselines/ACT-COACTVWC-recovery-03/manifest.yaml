# Manifest of the derived baseline of ACT-COACTVWC-recovery-03: only unikix
# can run the scenario, and it needs region file control to take ACCTDAT out
# of service (GAP-MIS-011), so expected.yaml is authored from the WHEN OTHER
# branch of 9300-GETACCTDATA-BYACCT [app/cbl/COACTVWC.cbl:774-823], not
# captured (GAP-INF-005, GAP-INF-012). It names no execution_id or
# execution_fingerprint and holds no datasets/ until an eligible UniKix run is
# imported (report.py --import-unikix).
#
# source_identity.units are the app/ sources the three steps execute, not only
# COACTVWC's: the COPY closure (inventory_tools.copy_closure, as
# harness.results computes it for a program) of COSGN00C, which signs USER0001
# on and XCTLs to COMEN01C; of COMEN01C, whose screen is asserted and whose
# option 1 XCTLs to COACTVWC; and of COACTVWC, which composes the file error
# after the failed ACCTDAT READ; plus the BMS sources of the maps COSGN00,
# COMEN01 and COACTVW. COACTVWC CALLs no program. DFHAID and DFHBMSCA are
# CICS-supplied, not app/ sources. source_commit is HEAD at authoring; app/ is
# byte-identical to the suite's starting commit
# 93ebec71ff7b59a68cedd7c501afe496a8eaa68d.
