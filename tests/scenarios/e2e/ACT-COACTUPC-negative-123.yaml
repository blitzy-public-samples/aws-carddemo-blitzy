# COACTUPC refuses an account update whose Phone Number 2 line number is not a
# 4-digit number: 1260-EDIT-US-PHONE-NUM, which 1200-EDIT-MAP-INPUTS performs
# for 'Phone Number 2', finds the line number supplied but not NUMERIC and
# composes 'Phone Number 2: Line number code must be A 4 digit number.'
# [app/cbl/COACTUPC.cbl:1640-1646,2225-2427].
#
# Steps 1-3 sign on, choose main-menu option 2 and fetch account 00000000001
# as ACT-COACTUPC-alternate-03 does: the details of the account and of the
# invented customer 000000001 are shown with ACUP-SHOW-DETAILS in the returned
# COMMAREA, and 3320-UNPROTECT-FEW-ATTRS gives every editable field MDT on, so
# all of them come back on the next AID [app/cbl/COACTUPC.cbl:2568-2580,
# 2787-2865,3500-3561].
# Step 4 types 1O2Z (one, the letter O, two, the letter Z) over the Phone
# Number 2 line number (ACSPH2C, shown as '0102') and presses ENTER:
# - 1100-RECEIVE-MAP moves the received '1O2Z', neither '*' nor spaces, to
#   ACUP-NEW-CUST-PHONE-NUM-2C; area code '919' and prefix '555' come back
#   unchanged [app/cbl/COACTUPC.cbl:1378-1397].
# - 1205-COMPARE-OLD-NEW finds the line number unequal to the fetched '0102',
#   so a change has occurred, and 1200-EDIT-MAP-INPUTS sets
#   ACUP-CHANGES-NOT-OK and runs the field edits in screen order
#   [app/cbl/COACTUPC.cbl:1460-1470,1748-1775]. Account Status, the three
#   account dates and the five amounts pass on the repository account; SSN,
#   Date of Birth, FICO Score, the names, Address Line 1, State, Zip, City,
#   Country and Phone Number 1 pass on the invented customer, so the message
#   line stays off [app/cbl/COACTUPC.cbl:480,1472-1638].
# - 'Phone Number 2' is moved to WS-EDIT-VARIABLE-NAME and the 15-byte
#   ACUP-NEW-CUST-PHONE-NUM-2 to WS-EDIT-US-PHONE-NUM
#   [app/cbl/COACTUPC.cbl:1640-1642]. 1260-EDIT-US-PHONE-NUM finds the number
#   not wholly blank, so it edits it [app/cbl/COACTUPC.cbl:2232-2245].
#   EDIT-AREA-CODE passes '919', which is a North America general-purpose
#   code [app/cpy/CSLKPCDY.cpy:521,895], and EDIT-US-PHONE-PREFIX passes '555'
#   [app/cbl/COACTUPC.cbl:2246-2368].
# - EDIT-US-PHONE-LINENUM finds '1O2Z' neither SPACES nor LOW-VALUES, but not
#   NUMERIC, so it sets INPUT-ERROR and FLG-EDIT-US-PHONEC-NOT-OK and, the
#   message line being still off, STRINGs TRIM(WS-EDIT-VARIABLE-NAME) and
#   ': Line number code must be A 4 digit number.' into WS-RETURN-MSG, then
#   goes to EDIT-US-PHONE-EXIT, so the not-zero test on the numeric
#   redefinition is never made [app/cbl/COACTUPC.cbl:2370-2427].
# - EFT Account Id, Primary Card Holder and the NC/27 state-zip check
#   [app/cpy/CSLKPCDY.cpy:1186] pass and only set their flags, since
#   WS-RETURN-MSG is no longer blank [app/cbl/COACTUPC.cbl:1648-1676].
#   INPUT-ERROR keeps ACUP-CHANGES-NOT-OK, and 2000-DECIDE-ACTION continues on
#   it, so 9600-WRITE-PROCESSING (PF5 only), the only READ UPDATE and REWRITE
#   path, does not run [app/cbl/COACTUPC.cbl:2562-2621].
# - 3203-SHOW-UPDATED-VALUES shows the received values, ACSPH2C as received
#   and the valid amounts re-edited through WS-EDIT-CURRENCY-9-2-F; 3250 sets
#   PROMPT-FOR-CHANGES and moves the message to ERRMSG; 3300 puts the cursor
#   on ACSPH2C, and CSSETATY colours it red without the '*' of a blank field;
#   3390 makes F12=Cancel bright because changes were made, while F5=Save
#   stays dark [app/cbl/COACTUPC.cbl:2870-2951,2955-2983,3154-3156,
#   3421-3425,3566-3581] [app/cpy/CSSETATY.cpy:18-27].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   ERRMSG is 'Phone Number 2: Line number code must be A 4 digit number.'
#   (58 characters) in the 75-byte WS-RETURN-MSG, moved to the 78-byte
#   ERRMSGO: 20 trailing spaces. ACSPH2C is an unprotected 4-byte field
#   without the NUM attribute [app/bms/COACTUP.bms:453-457], so the terminal
#   accepts the letters and the typed '1O2Z' fills it and is shown back
#   unchanged. INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte INFOMSGO.
# - AADDGRP is sent as LOW-VALUES on screen 4 (the blank group id comes back as
#   spaces, which 1100 turns into LOW-VALUES); s3270 shows nulls as spaces.
# - A dark (DRK) field is captured as blanks; colour and cursor position are
#   not in the s3270 text capture and are not asserted. The input is already
#   upper case, so the outcome does not depend on input translation
#   (CARDDEMO.CSD gives CAUP the profile DFHCICST).
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit (the repository record has FICO 274, phone-2 area code 373 and zip
# 12546 for NC, which the FICO, phone and state/zip edits refuse), so the
# Phone Number 2 line number is the only refused field
# [app/cbl/COACTUPC.cbl:2225-2558].
id: ACT-COACTUPC-negative-123
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update) and fetches
  account 00000000001, whose customer has Phone Number 2 (919)555-0102, then
  types 1O2Z over the Phone Number 2 line number and presses ENTER. The line
  number is supplied but not numeric, so COACTUPC refuses the change: the
  message line shows 'Phone Number 2: Line number code must be A 4 digit
  number.', the line number shows 1O2Z as typed, the other received values
  are shown again with the change prompt and F12=Cancel, and neither ACCTDATA
  nor CUSTDATA is rewritten.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. The change prompt 'Update account details presented above.'
# (INV-ACT-030) is asserted but verified by its own scenario. Sign-on (CC00,
# COSGN00, USRSEC) and the menu transaction are verified by the SEC and MNU
# scenarios; the batch record copybooks and the data files are verified at the
# lowest level that executes them.
inventory_ids:
- INV-ACT-181  # COACTUPC Phone Number 2: line number a 4-digit number (1260-EDIT-US-PHONE-NUM)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code lookups Phone Number 1 and 2 pass, and the state/zip lookup
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute set on ACSPH2C
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the four date edits, all passed
- INV-LAY-014  # CSUTLDWY: the date-edit working storage
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix COACTUPC strings the untrimmed 25-byte WS-EDIT-VARIABLE-NAME in
# EDIT-US-PHONE-LINENUM (COACTUPC.cl2:2402-2404), so its message would read
# 'Phone Number 2           : Line number code must be A 4 digit number.'; a
# UniKix run never verifies the item, and the app/ text is pinned.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
