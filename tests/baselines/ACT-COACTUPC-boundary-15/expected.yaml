# Derived baseline of scenario ACT-COACTUPC-boundary-15 (capture_platform:
# derived), authored from the app/ source and never observed: no TPE region
# runs in CI. Open until a UniKix run of the app/ build is imported:
# GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012 (online-only
# copybooks such as CSUTLDPY and CSUTLDWY).
# Steps 1-3: USER0001 signs on, option 2 XCTLs to COACTUPC, and ENTER with
# account 00000000001 shows the fetched account and customer with the change
# prompt [app/cbl/COACTUPC.cbl:2787-2865,2955-2981].
# Step 4, the Open Date boundary 2023-02-30: the date is a change, so
# 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and edits the fields in order;
# Account Status Y passes, and the year (2023, century 20), month (02) and day
# (30) edits pass. EDIT-DAY-MONTH-YEAR then finds WS-FEBRUARY AND WS-DAY-30
# before any leap-year test, so 2023 not being a leap year plays no part, and,
# the message being still off, composes TRIM('Open Date') ':Cannot have 30
# days in this month.' (44 characters) into WS-RETURN-MSG. The GO TO skips
# EDIT-DATE-LE, so CSUTLDTC is not called, and no later edit can replace the
# message [app/cbl/COACTUPC.cbl:1460-1482] [app/cpy/CSUTLDPY.cpy:209-241]
# [app/cpy/CSUTLDWY.cpy:16-31].
# 2000-DECIDE-ACTION continues, so nothing is rewritten; 3203 shows the date as
# typed, CSSETATY only colours OPNMON and OPNDAY red (neither is blank, so no
# '*' is moved in), 3250 sets PROMPT-FOR-CHANGES and moves the message to
# ERRMSG, and 3390 brightens FKEY12 because a change was made while FKEY05
# stays dark [app/cbl/COACTUPC.cbl:2596-2597,2870-2952,2955-2981,3566-3581]
# [app/cpy/CSSETATY.cpy:17-27].
# This pins the app/ text: the UniKix CSUTLDPY drops TRIM, so its copy would
# show 'Open Date' padded to 25 bytes before the suffix (GAP-DOC-024); such a
# record is UniKix-copy behavior and never replaces this file.
# Screen values are full BMS width with trailing spaces kept (ERRMSG 78,
# INFOMSG 45), because screens compare exactly; messages holds the ERRMSG of
# every step. CURDATE and CURTIME come from the region clock, so they are
# matchers. file_state holds the records as the preconditions materialize them,
# decoded through CVACT01Y and CVCUS01Y: both files keep their 50 records.
