type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "REPLACE-WITH-A-GENERATED-PASSWORD-FOR-CARD"
  KAFKA_SASL_PASSWORD: "REPLACE-WITH-A-GENERATED-BROKER-PASSWORD-FOR-CARD"
