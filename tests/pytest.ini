[pytest]
minversion = 8.4
pythonpath = .
python_files = test_*.py
addopts = --strict-markers -p no:cacheprovider
markers =
    unit: unit-level scenario (one batch program run standalone on fixtures) or harness self-test
    integration: integration-level scenario (job, proc, control card or job chain)
    e2e: end-to-end online scenario driven through the TPE 3270 listener
    chain: multi-job chain scenario (BAT-POSTINT-normal-01, BAT-CHAIN-normal-01), reported separately
    gnucobol_batch: scenario the gnucobol-batch adapter can run
    unikix: scenario the unikix adapter can run
