# ADMIN001 selects the seventh listed user with 'D' and COUSR00C transfers to
# the delete screen COUSR03C, which fetches that user and asks for PF5.
# - Sign-on routes the type-A user to COADM01C, and option 1 ('User List
#   (Security)', COUSR00C) transfers there with CDEMO-PGM-CONTEXT 0
#   [app/cbl/COADM01C.cbl:115-145] [app/cpy/COADM02Y.cpy:24-27].
# - On that first entry COUSR00C browses USRSEC from LOW-VALUES and fills rows
#   1-10 in key order [app/cbl/COUSR00C.cbl:110-119,282-331,384-441]. The
#   fixture holds ADMIN001-ADMIN005 then USER0001-USER0005, so row 7 shows
#   USER0002 (AJITH KUMAR, type U).
# - ENTER with SEL0007 'D': the USRID fields are FSET, so USRID07I is received
#   as USER0002 and becomes CDEMO-CU00-USR-SELECTED; flag 'D' sets
#   CDEMO-PGM-CONTEXT 0 and transfers (XCTL) to COUSR03C with the COMMAREA
#   [app/cbl/COUSR00C.cbl:149-209].
# - COUSR03C reads CDEMO-CU03-USR-SELECTED, which sits at the same COMMAREA
#   offset, into USRIDINI. It reads USRSEC for that key with UPDATE, sets
#   'Press PF5 key to delete this user ...', moves the names and type in and
#   sends COUSR03 with ERASE [app/cbl/COUSR03C.cbl:49-58,94-105,142-169,267-286].
#   The task then ends with RETURN TRANSID CU03, which releases the lock, and
#   only PF5 deletes, so USRSEC keeps all 10 users.
# Values are full BMS field width, trailing spaces kept. ERRMSG is the X(80)
# WS-MESSAGE cut to the 78-byte field. The clock-derived CURDATE and CURTIME are
# matchers, so the clock is relative. The list content and the landing
# program's own items belong to the other COUSR00C and COUSR03C scenarios.
id: USR-COUSR00C-alternate-08
level: e2e
type: alternate
description: >-
  ADMIN001 signs on, opens the user list through admin option 1, and enters D
  beside row 7 (USER0002). COUSR00C transfers control to COUSR03C, which shows
  map COUSR03 (transaction CU03) with user USER0002, first name AJITH, last name
  KUMAR, type U and 'Press PF5 key to delete this user ...'. USRSEC is left
  unchanged.
inventory_ids:
- INV-USR-019  # COUSR00C list selection D to COUSR03C (rule)
- INV-USR-001  # COUSR00C program
- INV-USR-005  # COUSR00 map, the list the selection is entered on
- INV-USR-008  # COUSR03 map, the screen the transfer lands on
- INV-CFG-023  # CU00 transaction, under which COUSR00C receives the selection
- INV-CFG-008  # USRSEC CSD file, browsed by COUSR00C and read by COUSR03C
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA carrying the selected user id
- INV-LAY-005  # COTTL01Y copybook, the TITLE01 and TITLE02 texts
- INV-LAY-006  # CSDAT01Y copybook, the CURDATE and CURTIME formats
- INV-LAY-008  # CSMSG01Y copybook, copied by COUSR00C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-004  # the USR end-to-end baselines are derived, never observed
- GAP-INF-012  # the online-only copybooks are covered only through derived e2e baselines
preconditions:
  datasets:
    USRSEC:
      base: USRSEC
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields:
      USERID: ADMIN001
      PASSWD: PASSWORD
    '@map': COSGN00
  - aid: ENTER
    fields:
      OPTION: '1'
    '@map': COADM01
  - aid: ENTER
    fields:
      SEL0007: 'D'
    '@map': COUSR00
expected:
  screens:
  - '@map': COADM01
    TRNNAME: 'CA00'
    PGMNAME: 'COADM01C'
  # Row 7 before the selection, so the transfer is tied to the user it lists.
  - '@map': COUSR00
    TRNNAME: 'CU00'
    PGMNAME: 'COUSR00C'
    USRID07: 'USER0002'
    FNAME07: 'AJITH               '
    LNAME07: 'KUMAR               '
    UTYPE07: 'U'
  - '@map': COUSR03
    TRNNAME: 'CU03'
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: 'COUSR03C'
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    USRIDIN: 'USER0002'
    FNAME: 'AJITH               '
    LNAME: 'KUMAR               '
    USRTYPE: 'U'
    ERRMSG: 'Press PF5 key to delete this user ...                                         '
  # The fetch deletes nothing: all 10 users remain, USER0002 among them.
  file_state:
    USRSEC:
      count: 10
      contains:
      - SEC-USR-ID: 'USER0002'
        SEC-USR-FNAME: 'AJITH               '
        SEC-USR-LNAME: 'KUMAR               '
        SEC-USR-TYPE: 'U'
