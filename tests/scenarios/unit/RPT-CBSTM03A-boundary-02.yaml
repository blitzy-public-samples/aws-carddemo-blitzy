# The 10-transaction row limit of the CBSTM03A statement table, one past it.
# WS-CARD-TBL OCCURS 51 holds a 16-byte card number and WS-TRAN-TBL OCCURS 10 of
# 334 bytes, so each card row is 3,356 bytes, and 8500-READTRNX-READ stores every
# transaction of a card at WS-TRAN-TBL (CR-CNT, TR-CNT) with no check on TR-CNT
# [app/cbl/CBSTM03A.CBL:225-233,818-830]. The 11th transaction of card 1 lands at
# offset 16 + 10 x 334 = 3,356, the first byte of WS-CARD-TBL (2): it overwrites
# WS-CARD-NUM (2) and the start of WS-TRAN-TBL (2, 1), the slots a second card
# would use. The subscript is checked neither by the GnuCOBOL build (no -debug or
# -fec) nor by Enterprise COBOL under the BUILDBAT options, which leave the default
# NOSSRANGE [samples/proc/BUILDBAT.prc:36]. With a single card CR-CNT stays 1, row 2
# is never examined as a card, and 4000-TRNXFILE-GET reads (1, 11) back from the
# same bytes [app/cbl/CBSTM03A.CBL:416-432], so the statement lists all 11
# transactions and totals 11.00, with return code 0 and no error message. This
# scenario pins that observed outcome and the input that produces it; the missing
# bound check is GAP-DEF-007, never fixed here.
id: RPT-CBSTM03A-boundary-02
level: unit
type: boundary
description: >-
  CBSTM03A builds one statement for card 9680294154603697 (customer 000000001,
  account 00000000001) from 11 invented transactions of 1.00, one more than
  WS-TRAN-TBL OCCURS 10 holds. The 11th is stored past the end of the card's
  table row, over the bytes of the next row, without any check or message, and
  is read back from there: STMTFILE lists all 11 transaction lines and
  Total EXP: 11.00, HTMLFILE holds 11 transaction rows, and the run ends with
  return code 0 [app/cbl/CBSTM03A.CBL:225-233,416-456,818-853].
inventory_ids:
- INV-RPT-050  # CBSTM03A 51-card x 10-transaction table limit (rule), the boundary under test
- INV-RPT-004  # CBSTM03A program
- INV-RPT-005  # CBSTM03B program, the file service that reads TRXFL, CARDXREF, ACCTDATA, CUSTDATA
- INV-LAY-004  # COSTM01 copybook: the TRXFL records are TRNX-RECORD
# The CVACT01Y and CVACT03Y layouts and the account, cross-reference and
# customer data files (ASCII and EBCDIC) are not listed: the DAT-CBACT01C,
# DAT-CBACT03C, DAT-CBCUS01C, TRN-CBTRN01C, TRN-CBTRN02C, FIN-CBACT04C and
# RPT-CBTRN03C unit scenarios verify them and never depend on page zero, so
# when the page-zero probe fails these scenarios block only the CBSTM03A and
# CBSTM03B items, COSTM01 and CUSTREC.
tags:
- suspected-defect
gap_ids:
- GAP-DEF-007  # no bound check on WS-CARD-TBL (51) or WS-TRAN-TBL (10)
- GAP-STB-003  # the page-zero PSA/TCB/TIOT shim behind the control-block walk
- GAP-MIS-002  # whether page zero can be mapped; without it the run is blocked
- GAP-STB-010  # Berkeley DB indexed files in place of the VSAM KSDS
- GAP-STB-011  # GnuCOBOL compile and runtime options in place of Enterprise COBOL and LE
