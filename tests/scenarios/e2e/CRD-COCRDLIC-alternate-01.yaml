# The card list prompt 'TYPE S FOR DETAIL, U TO UPDATE ANY RECORD' on a page
# that still has a page after it: on page 1, entered from the menu, and on page
# 2, reached with PF8. PF7 then returns to page 1, whose seven rows the backward
# browse rebuilds, with the first-page message in place of the prompt.
#
# USER0001 signs on (CC00) and COSGN00C routes the type-U user to COMEN01C,
# whose COMEN01 menu is the first screen. Option 3 is the COMEN02Y entry
# 'Credit Card List', program COCRDLIC, user type U, so COMEN01C sets the
# program context to 0, records itself as CDEMO-FROM-PROGRAM and transfers
# control to COCRDLIC [app/cbl/COMEN01C.cbl:115-155] [app/cpy/COMEN02Y.cpy:37-41].
#
# Page 1: entered from another program with the context at ENTER, COCRDLIC
# clears its own COMMAREA and sets page 1 [app/cbl/COCRDLIC.cbl:336-343]. No
# map is received, no filter is set and the key is ENTER, so the EVALUATE falls
# to WHEN OTHER: the browse of CARDDAT starts GTEQ at the blank first-card key
# and READNEXTs the first 7 cards in key order (WS-MAX-SCREEN-LINES)
# [app/cbl/COCRDLIC.cbl:177-178,572-582,1123-1192]. Its read-ahead finds an
# eighth card, so CA-NEXT-PAGE-EXISTS stays set and the eighth key becomes
# WS-CA-LAST-CARD-NUM [app/cbl/COCRDLIC.cbl:1194-1214].
#
# The message: 1100-SCREEN-INIT sets WS-NO-INFO-MESSAGE, so in
# 1400-SETUP-MESSAGE, with no filter error and neither PF7 nor PF8 at a page
# edge, the WHEN WS-NO-INFO-MESSAGE / WHEN CA-NEXT-PAGE-EXISTS branch sets
# WS-INFORM-REC-ACTIONS, and the 45-byte WS-INFO-MSG is moved to the 45-byte
# INFOMSG: the 41-character text plus four spaces [app/cbl/COCRDLIC.cbl:112-116,
# 669-671,895-930] [app/cpy-bms/COCRDLI.CPY:554]. WS-ERROR-MSG stays blank, so
# the 78-byte ERRMSG is spaces [app/cbl/COCRDLIC.cbl:311,924].
#
# Page 2: PF8 comes back to COCRDLIC itself (CDEMO-FROM-PROGRAM COCRDLIC, set at
# COMMON-RETURN), the received filters and selections are blank, and PF8 with
# CA-NEXT-PAGE-EXISTS restarts the browse GTEQ at the saved eighth key and adds
# 1 to the page number [app/cbl/COCRDLIC.cbl:357-362,486-497,604-612]. Page 2
# holds cards 8-14, and the fifteenth card makes a next page exist again, so
# 1400-SETUP-MESSAGE sets the same prompt through the same branch, not the
# PF8 last-page branches [app/cbl/COCRDLIC.cbl:905-919].
#
# Page 1 again: PF7 also comes back to COCRDLIC itself, so the map is received
# with the filters and selections blank and no input error is raised. With the
# page number at 2, the WHEN CCARD-AID-PFK07 AND NOT CA-FIRST-PAGE branch moves
# WS-CA-FIRST-CARD-NUM, page 2's first card 1561409106491600, to the RID,
# subtracts 1 from WS-CA-SCREEN-NUM (2 to 1) and performs 9100-READ-BACKWARDS.
# Its STARTBR GTEQ positions on that card and WS-SCRN-COUNTER starts at 8; the
# READPREV right after STARTBR returns the start card itself and only counts
# down to 7, then the loop READPREVs cards 7 to 1 into rows 7 to 1. At 0 the
# loop ends, 0500024453765740 becomes WS-CA-FIRST-CARD-NUM and ENDBR follows
# [app/cbl/COCRDLIC.cbl:501-513,1271-1378] [app/data/ASCII/carddata.txt:1-8].
# 1100-SCREEN-INIT sets WS-NO-INFO-MESSAGE and moves the blank WS-INFO-MSG to
# INFOMSG. The page number is already 1 when 1400-SETUP-MESSAGE runs, so its
# WHEN CCARD-AID-PFK07 AND CA-FIRST-PAGE branch moves 'NO PREVIOUS PAGES TO
# DISPLAY' to WS-ERROR-MSG and sets no information message: INFOMSG stays
# blank and ERRMSG holds the 28-character text plus 50 spaces
# [app/cbl/COCRDLIC.cbl:642-671,895-930]. The message is pinned as current
# behaviour: the first-page branch overwrites WS-ERROR-MSG after a successful
# backward page as well, so reaching page 1 with PF7 never shows the prompt.
# Each row's selection field holds the blank received from page 2.
#
# Field values: PAGENO is the PIC 9(1) WS-CA-SCREEN-NUM moved to the 3-byte
# PAGENOO, left-justified as '1  ' and '2  ' [app/cbl/COCRDLIC.cbl:237,667]
# [app/cpy-bms/COCRDLI.CPY:332]. ACCTSID and CARDSID are left at LOW-VALUES on
# every list screen, so they show as spaces: entered from the menu
# 1300-SETUP-SCREEN-ATTRS skips them, and after PF8 and PF7 CDEMO-ACCT-ID and
# CDEMO-CARD-NUM are zero [app/cbl/COCRDLIC.cbl:837-867,1003-1012,1036-1048].
# Each row's selection field holds the space INITIALIZE puts in
# WS-EDIT-SELECT-FLAGS on page 1, and the received blank after PF8 and PF7;
# the account number, card number and active status come from CARDDATA
# [app/cbl/COCRDLIC.cbl:300-302,678-742,1165-1171,1338-1344]. Card keys hold
# digits only, so the key order is the same in ASCII and cp037: page 1 is the
# first seven repository cards by number and page 2 starts at 1561409106491600
# (account 00000000035). Values are whole fields with their trailing spaces;
# the clock-derived CURDATE and CURTIME are matchers, so the clock is relative.
id: CRD-COCRDLIC-alternate-01
level: e2e
type: alternate
description: >-
  USER0001 opens the credit card list from the main menu (option 3): page 1
  lists the first seven cards of CARDDATA with the prompt 'TYPE S FOR DETAIL,
  U TO UPDATE ANY RECORD' in INFOMSG and no error, and PF8 shows page 2,
  cards 8-14 starting at 1561409106491600, with the same prompt because a
  further page still exists. PF7 then returns to page 1: the backward browse
  rebuilds the same seven cards in key order, with page number 1, a blank
  INFOMSG and 'NO PREVIOUS PAGES TO DISPLAY' in ERRMSG, because the page
  counter is already 1 when 1400-SETUP-MESSAGE runs.
inventory_ids:
- INV-CRD-007  # COCRDLIC message 'TYPE S FOR DETAIL, U TO UPDATE ANY RECORD'
- INV-CRD-025  # COCRDLIC card list content (report): the PF7 page's rows
- INV-CRD-001  # COCRDLIC program
- INV-MNU-003  # COMEN01 map, the screen sign-on lands on
- INV-CRD-004  # COCRDLI map, the three list screens (page 1, page 2, page 1 again)
- INV-CFG-014  # CCLI transaction, the pseudo-conversation PF8 and PF7 run
- INV-CFG-003  # CARDDAT CSD file, browsed by card number
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA carrying the paging keys
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the screen date and time
- INV-LAY-008  # CSMSG01Y copybook, copied by COCRDLIC
- INV-LAY-011  # CSSTRPFY copybook, mapping PF8/PF7 to CCARD-AID-PFK08/-PFK07
- INV-LAY-019  # CVCRD01Y copybook, the AID and filter work area
