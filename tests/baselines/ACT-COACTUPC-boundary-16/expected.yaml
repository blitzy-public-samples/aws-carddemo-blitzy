# Derived baseline of scenario ACT-COACTUPC-boundary-16 (capture_platform:
# derived, tag inferred-not-observed), authored from the app/ source and never
# observed: no TPE region runs in CI. The Open Date February boundary at the
# leap-year check: 2023-02-28, the last day of February in a year that is not
# a leap year, is accepted.
# Steps 1-3: USER0001 signs on, main-menu option 2 XCTLs to COACTUPC, and ENTER
# with account 00000000001 shows the fetched account and customer with
# 'Update account details presented above.' [app/cbl/COMEN01C.cbl:241-252]
# [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,2955-2981,3608-3884].
# Step 4: 2023 / 02 / 28 over the open date 2014-11-20 is a change, so
# 1200-EDIT-MAP-INPUTS moves 'Open Date' to WS-EDIT-VARIABLE-NAME and performs
# EDIT-DATE-CCYYMMDD [app/cbl/COACTUPC.cbl:1478-1482]. Year 2023 is supplied,
# numeric and of century 20; month 02 is supplied, within 1-12 and TEST-NUMVAL
# 0; day 28 is supplied, TEST-NUMVAL 0 and within 1-31. In
# EDIT-DAY-MONTH-YEAR day 28 is neither 31, nor February's 30, nor February's
# 29, so the leap-year division never runs, the year, month and day flags stay
# LOW-VALUES and WS-EDIT-DATE-IS-VALID holds [app/cpy/CSUTLDPY.cpy:18-279]
# [app/cpy/CSUTLDWY.cpy:4-57]. EDIT-DATE-LE calls CSUTLDTC with '20230228'
# and mask 'YYYYMMDD'; a real CEEDAYS is expected to accept the date, so
# WS-SEVERITY-N is 0 and no ' validation error Sev code: ' message is composed
# [app/cpy/CSUTLDPY.cpy:284-328] [app/cbl/CSUTLDTC.cbl:90-151]. That
# acceptance is inferred (GAP-INF-001), and whether UniKix supplies CEEDAYS is
# unconfirmed (GAP-MIS-010).
# Every other field returns its fetched value and passes its edit, so
# INPUT-ERROR stays off and ACUP-CHANGES-OK-NOT-CONFIRMED is set
# [app/cbl/COACTUPC.cbl:1471-1675]. ENTER without PF5 never reaches the READ
# UPDATE and REWRITE of 9600-WRITE-PROCESSING [app/cbl/COACTUPC.cbl:2586-2621].
# 3203-SHOW-UPDATED-VALUES shows the new open date
# [app/cbl/COACTUPC.cbl:2911-2913]. 3250-SETUP-INFOMSG moves
# PROMPT-FOR-CONFIRMATION (the X(40) WS-INFO-MSG) to the 45-byte INFOMSGO and
# the blank X(75) WS-RETURN-MSG to the 78-byte ERRMSGO
# [app/cbl/COACTUPC.cbl:472-473,2955-2983], and 3390 makes F5=Save and
# F12=Cancel bright [app/cbl/COACTUPC.cbl:3566-3581].
# Screen values are whole BMS fields with their trailing spaces
# (app/bms/COACTUP.bms, app/bms/COMEN01.bms); a dark field is captured as
# blanks. CURDATE and CURTIME come from the region clock, hence the matchers.
# messages holds the ERRMSG of every step, all blank. file_state holds the
# records as the preconditions materialize them, decoded through CVACT01Y and
# CVCUS01Y: nothing is rewritten before PF5, so both files keep their 50
# records and account 00000000001 its open date 2014-11-20.
# Open under GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012
# (online-only copybooks such as CSUTLDPY and CSUTLDWY). The UniKix copies of
# CSUTLDPY (GAP-DOC-024), CSUTLDTC (GAP-DOC-021), the COACTUPC amount edits
# (GAP-DOC-022) and COACTUP.bms row 1 (GAP-DOC-025) differ, so a UniKix record
# of this scenario is UniKix-copy behavior and never replaces this file. Only
# `report.py --import-unikix` promotes this baseline; it is never edited by
# hand to match a run.
