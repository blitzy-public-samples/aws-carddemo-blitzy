# Expiry Date with a year that is not a 4-digit number: COACTUPC refuses the
# change with 'Expiry Date must be 4 digit number.' and rewrites nothing.
#
# Step 1: USER0001 signs on through CC00; COSGN00C routes the type 'U' user to
# the main menu COMEN01 [app/cbl/COSGN00C.cbl:221-237].
# Step 2: option '2' is 'Account Update' of COMEN02Y, so COMEN01C XCTLs to
# COACTUPC [app/cbl/COMEN01C.cbl:115-156] [app/cpy/COMEN02Y.cpy:31-35], which
# sends COACTUP with the search-key prompt [app/cbl/COACTUPC.cbl:964-973].
# Step 3: ENTER with ACCTSID 00000000001 reads CXACAIX (card 9680294154603697,
# customer 000000001), ACCTDAT and CUSTDAT, keeps the values in the COMMAREA,
# sets ACUP-SHOW-DETAILS and sends them with every field's MDT on
# [app/cbl/COACTUPC.cbl:1433-1446,2568-2580,2786-2865,3441-3561,3608-3884].
# Step 4: ENTER with EXPYEAR overtyped as '20A5'; every other field comes back
# as sent. 1100-RECEIVE-MAP moves '20A5' to ACUP-NEW-EXP-YEAR
# [app/cbl/COACTUPC.cbl:1167-1172]; 1205-COMPARE-OLD-NEW finds the expiry date
# changed [app/cbl/COACTUPC.cbl:1681-1704]. 1200-EDIT-MAP-INPUTS sets
# ACUP-CHANGES-NOT-OK and edits the fields in screen order: Account Status 'Y',
# Open Date 2014-11-20 and Credit Limit '+      2,020.00' pass, then
# 'Expiry Date' goes to WS-EDIT-VARIABLE-NAME and EDIT-DATE-CCYYMMDD runs
# [app/cbl/COACTUPC.cbl:1470-1494]. EDIT-YEAR-CCYY finds '20A5' supplied but
# NOT NUMERIC and, with WS-RETURN-MSG still SPACES, STRINGs the trimmed field
# name and ' must be 4 digit number.' into it [app/cpy/CSUTLDPY.cpy:25-60]. The
# month and day edits that follow accept 05 and 20, and the year flag '0'
# sends EDIT-DAY-MONTH-YEAR to the exit before EDIT-DATE-LE, so CSUTLDTC is not
# called [app/cpy/CSUTLDPY.cpy:89-278,329]. The later field edits pass and, the
# message being set, could not replace it. 2000-DECIDE-ACTION continues on
# ACUP-CHANGES-NOT-OK [app/cbl/COACTUPC.cbl:2596-2597]; 3203-SHOW-UPDATED-VALUES
# sends the received values, the valid amounts edited again as
# +ZZZ,ZZZ,ZZZ.99 [app/cbl/COACTUPC.cbl:371,2870-2950], 3250-SETUP-INFOMSG
# prompts for changes and moves the message to ERRMSG
# [app/cbl/COACTUPC.cbl:2955-2982], and CSSETATY colours EXPYEAR red
# [app/cbl/COACTUPC.cbl:3237-3241]. No READ UPDATE or REWRITE runs.
#
# Expected values are derived from the source; no TPE region runs in CI.
# - The message is 'Expiry Date' (TRIM of the X(25) name) followed by ' must be
#   4 digit number.', 35 characters in the 75-byte WS-RETURN-MSG, padded to the
#   78-byte ERRMSG. INFOMSG is the 40-byte WS-INFO-MSG padded to 45.
# - The header is 3100-SCREEN-INIT's: the COTTL01Y titles, CAUP, COACTUPC, and
#   CURDATE mm/dd/yy and CURTIME hh:mm:ss of the run clock through CSDAT01Y,
#   hence the matchers and clock_mode relative [app/cbl/COACTUPC.cbl:2669-2691].
# - ACCT-GROUP-ID is blank in the repository account (GAP-DEF-005). The blank
#   AADDGRP comes back as SPACES, 1100-RECEIVE-MAP keeps LOW-VALUES and the
#   field is sent empty, which the capture shows as spaces
#   [app/cbl/COACTUPC.cbl:1213-1218,2921].
# - The CUSTDATA record of customer 000000001 is replaced by invented values
#   that pass every field edit and fill every screen field, so no field is sent
#   back blank and marked '*' by CSSETATY.
id: ACT-COACTUPC-negative-028
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main menu option 2 'Account Update', fetches
  account 00000000001 and changes the expiry year to '20A5'. COACTUPC refuses
  the change because the year is not a 4-digit number: it sends the update
  screen again with the entered values, 'Update account details presented
  above.' and 'Expiry Date must be 4 digit number.'; ACCTDAT and CUSTDAT are
  not updated.
# Primary item first, then the program, the maps asserted, the transaction, the
# CSD files COACTUPC reads and the online-only copybooks it copies. Sign-on and
# the menu program are verified by the SEC and MNU scenarios; the batch record
# copybooks and the data files are verified at the lowest level that executes
# them.
inventory_ids:
- INV-ACT-086  # COACTUPC Expiry Date: year a 4-digit number (rule)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, the main menu option 2 is entered on
- INV-ACT-004  # COACTUP map, the update screen of steps 2-4
- INV-CFG-009  # CAUP transaction, under which the fetch and the refused change run
- INV-CFG-006  # CXACAIX CSD file, the account-to-card path the fetch reads
- INV-CFG-001  # ACCTDAT CSD file, read by the fetch and left unchanged
- INV-CFG-005  # CUSTDAT CSD file, read by the fetch and left unchanged
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA carrying the fetched values between steps
- INV-LAY-005  # COTTL01Y copybook, TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y copybook, CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y copybook, copied by COACTUPC
- INV-LAY-007  # CSLKPCDY copybook, the lookups of the later field edits
- INV-LAY-009  # CSMSG02Y copybook, the abend variables
- INV-LAY-010  # CSSETATY copybook, the red attribute of the refused EXPYEAR
- INV-LAY-011  # CSSTRPFY copybook, the AID mapping that turns ENTER into CCARD-AID-ENTER
- INV-LAY-013  # CSUTLDPY copybook, EDIT-YEAR-CCYY that composes the message
- INV-LAY-014  # CSUTLDWY copybook, WS-EDIT-DATE-CCYY and the date edit flags
- INV-LAY-019  # CVCRD01Y copybook, the AID flags and CC-ACCT-ID
tags:
- inferred-not-observed
# GAP-DOC-024: the UniKix copy of CSUTLDPY drops FUNCTION TRIM from the field
#   name of this message, so a UniKix run never verifies this item while that
#   entry is open.
# GAP-DOC-022 and GAP-DOC-025 are not in the planned gap list; they are cited
#   because this scenario asserts what they change, as ACT-COACTUPC-negative-013
#   does for the Open Date year. The UniKix COACTUPC comments out the
#   TEST-NUMVAL-C amount checks behind the re-edited amounts of screen 4, and
#   the UniKix COACTUP.bms drops the unnamed field at row 1, columns 1-9, where
#   TRNNAME is asserted.
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived from the source, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-DOC-024
- GAP-DOC-022
- GAP-DOC-025
preconditions:
  datasets:
    # COSGN00C reads the sign-on user USER0001.
    USRSEC: {base: USRSEC}
    # Maps account 00000000001 to card 9680294154603697 and customer
    # 000000001; CXACAIX is its alternate-index path.
    CARDXREF: {base: CARDXREF}
    # Account 00000000001 as in the repository: status Y, open 2014-11-20,
    # credit limit 2020.00, all edited before Expiry Date and all accepted.
    ACCTDATA: {base: ACCTDATA}
    # Customer 000000001 with invented values that pass every COACTUPC edit and
    # fill every screen field.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
        CUST-ADDR-ZIP: '27601'
        CUST-PHONE-NUM-1: '(919)555-0101'
        CUST-PHONE-NUM-2: '(919)555-0102'
        CUST-SSN: '123456789'
        CUST-GOVT-ISSUED-ID: TESTGOVT0001
        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: 'Y'
        CUST-FICO-CREDIT-SCORE: '700'
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: USER0001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '2'}
    '@map': COMEN01
  - aid: ENTER
    fields: {ACCTSID: '00000000001'}
    '@map': COACTUP
  # Only the expiry year is overtyped; the other fetched values go back as sent.
  - aid: ENTER
    fields: {EXPYEAR: '20A5'}
    '@map': COACTUP
