# USER0001 changes the embossed name of card 0500024453765740 through COCRDUPC,
# confirms with PF5 and receives 'Changes committed to database', with the
# CARDDAT record rewritten.
#
# Step 1: USER0001 signs on through CC00; COSGN00C routes the type U user to the
# main menu COMEN01 (asserted by its header and option 5 only; its content
# belongs to SEC-COSGN00C-normal-02).
# Step 2: option '5' makes COMEN01C XCTL to COCRDUPC with itself as the calling
# program and CDEMO-PGM-CONTEXT 0 [app/cpy/COMEN02Y.cpy:49-53]
# [app/cbl/COMEN01C.cbl:115-156]. COCRDUPC takes the fresh-entry branch: it
# sends the search screen with INFOMSG 'Please enter Account and Card Number',
# then sets CDEMO-PGM-REENTER and CCUP-DETAILS-NOT-FETCHED
# [app/cbl/COCRDUPC.cbl:502-511,1138-1142]. (0000-MAIN tests
# CDEMO-FROM-PROGRAM before it copies the COMMAREA in [app/cbl/COCRDUPC.cbl:
# 388-399]; on either branch of that IF the fresh-entry WHEN is the one taken.)
# Step 3: ENTER with account 00000000050 and card 0500024453765740 runs under
# CCUP and takes WHEN OTHER [app/cbl/COCRDUPC.cbl:535-543]. 1210 and 1220 accept
# both filters, 2000-DECIDE-ACTION's WHEN CCUP-DETAILS-NOT-FETCHED shares the
# PF12 branch, and 9000-READ-DATA reads CARDDAT by card number (line 1 of
# app/data/ASCII/carddata.txt: account 00000000050, CVV 747, 'Aniya Von',
# expiry 2023-03-09, status Y), keeps the CVV in CCUP-OLD-CVV-CD and converts
# the name to upper case before storing it; CCUP-SHOW-DETAILS shows the stored
# values with 'Details of selected card shown above' [app/cbl/COCRDUPC.cbl:
# 641-665,721-804,948-967,1082-1112,1145-1146,1343-1415].
# Step 4: ENTER with the name 'TEST HOLDER'. The new card data differs from the
# old, so 1230 to 1260 run: the name holds letters and a space only, Y is a
# valid status, 03 a valid month and 2023 a year in 1950-2099, so
# CCUP-CHANGES-OK-NOT-CONFIRMED is set; 3200 WHEN CCUP-CHANGES-MADE echoes the
# received values (EXPDAY from the old values), INFOMSG is 'Changes
# validated.Press F5 to save', FKEYSC turns bright and every input field
# becomes DFHBMPRF (protected, MDT on) [app/cbl/COCRDUPC.cbl:666-716,806-945,
# 1113-1123,1149-1150,1191-1199,1315-1317].
# Step 5: PF5 is valid only in that state [app/cbl/COCRDUPC.cbl:413-425].
# 1200 leaves the state unchanged and 2000 performs 9200-WRITE-PROCESSING: READ
# UPDATE of CARDDAT is NORMAL, 9300-CHECK-CHANGE-IN-REC finds the record as
# fetched, and the REWRITE of CARD-UPDATE-RECORD is NORMAL, so
# CCUP-CHANGES-OKAYED-AND-DONE is set [app/cbl/COCRDUPC.cbl:988-1001,
# 1420-1521]. 3200 WHEN CCUP-CHANGES-MADE (which includes 'C') again shows the
# values received with the PF5, and 3250 moves CONFIRM-UPDATE-SUCCESS 'Changes
# committed to database' to INFOMSG [app/cbl/COCRDUPC.cbl:168-169,1151-1152].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Text values are whole fields at their BMS length, trailing spaces kept.
#   INFOMSG holds the 40-byte WS-INFO-MSG; ERRMSG holds the blank 75-byte
#   WS-RETURN-MSG in its 80 bytes [app/cbl/COCRDUPC.cbl:157,173,1161-1163].
# - The screen capture shows nulls and zero-intensity fields as blanks: EXPDAY
#   is ATTRB=(DRK,FSET,PROT) and FKEYSC ATTRB=(ASKIP,DRK) unless 3300 makes it
#   bright [app/bms/COCRDUP.bms:142-146,163-167]. EXPDAY is FSET, so the hidden day '09'
#   comes back with every AID and ends up in the rewritten expiry date.
# - The name is typed after EraseEOF, so the field returns 'TEST HOLDER' alone;
#   BMS input mapping left-justifies it and pads it with blanks, the DFHMDF
#   default JUSTIFY=(LEFT,BLANK).
# - The header is the COTTL01Y titles, CCUP, COCRDUPC and CURDATE mm/dd/yy and
#   CURTIME hh:mm:ss of the region clock through CSDAT01Y, hence the matchers
#   and clock_mode relative [app/cbl/COCRDUPC.cbl:1052-1077].
id: CRD-COCRDUPC-normal-02
level: e2e
type: normal
description: >-
  USER0001 signs on, chooses main menu option 5 'Credit Card Update', fetches
  account 00000000050 and card 0500024453765740 on the COCRDUP screen, which
  shows 'ANIYA VON', status Y and expiry 03/2023 with 'Details of selected card
  shown above', types the name 'TEST HOLDER' and presses ENTER. COCRDUPC
  validates the name, status, month and year and asks 'Changes validated.Press
  F5 to save'; PF5 reads the card for update, finds it unchanged, rewrites it
  and shows 'Changes committed to database' with the new values. The rewritten
  CARDDAT record carries the new name, account 00000000050, expiry 2023-03-09
  and status Y; the other 49 cards are as loaded. Finding: the rewrite does not
  keep the card's CVV. 9200-WRITE-PROCESSING moves CCUP-NEW-CVV-CD to the record
  through CARD-CVV-CD-X and CARD-CVV-CD-N [app/cbl/COCRDUPC.cbl:1464-1465], but
  no input or fetched value sets CCUP-NEW-CVV-CD: 1100-RECEIVE-MAP INITIALIZEs
  CCUP-NEW-DETAILS, leaving it spaces, and only CCUP-OLD-CVV-CD receives the
  fetched CVV [app/cbl/COCRDUPC.cbl:586,1354]. The PIC 9(03) to PIC 9(03) MOVE
  of those spaces is pinned as a byte copy, so CARD-CVV-CD is three spaces
  (raw 202020) where the fixture had 747; GnuCOBOL 3.2 under the suite's IBM
  flags stores those bytes, while Enterprise COBOL's NUMPROC(NOPFD) sign fix-up
  would leave x'4040F0'. The record's 59-byte FILLER is not asserted: INITIALIZE
  CARD-UPDATE-RECORD skips FILLER, so the REWRITE writes whatever the COMMAREA
  carried there [app/cbl/COCRDUPC.cbl:314-321,1461].
# Primary item first, then the program, the maps asserted, the transaction steps
# 3-5 run under, the CSD file COCRDUPC reads, reads for update and rewrites, and
# the online-only copybooks it copies. Sign-on and the menu (CC00, CM00,
# COSGN00, USRSEC) are verified by the SEC and MNU scenarios, the other
# COCRDUPC messages and the card REWRITE item by their own CRD scenarios, and
# the batch record copybooks and the data files at the lowest level that
# executes them.
inventory_ids:
- INV-CRD-051  # COCRDUPC message 'Changes committed to database' (rule)
- INV-CRD-003  # COCRDUPC program
- INV-MNU-003  # COMEN01 map, where option 5 is entered
- INV-CRD-006  # COCRDUP map, the search, detail, confirmation and done screens
- INV-CFG-015  # CCUP transaction, under which the fetch, edit and save run
- INV-CFG-003  # CARDDAT CSD file: read, read for update and rewritten
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and calling program
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y, copied by COCRDUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COCRDUPC
- INV-LAY-011  # CSSTRPFY: the AID mapping that accepts PF5
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID, CC-CARD-NUM and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-006  # CRD end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix copy rewrites the alphabets-only test of 1230-EDIT-NAME that step 4
# passes through; 'TEST HOLDER' is accepted by both forms, and a unikix run
# observes the copy's form.
- GAP-DOC-023
