# ===========================================================================
# k8s/secret.yaml — TEMPLATE ONLY (placeholder credentials).
# ---------------------------------------------------------------------------
# This manifest is committed with NON-SECRET placeholder values so the CardDemo
# stack can be brought up in a throwaway local/demo cluster. For ANY shared,
# staging, or production environment you MUST inject real credentials at deploy
# time and NEVER commit them — use one of:
#   * `kubectl create secret generic ... --from-literal=...`
#   * Sealed Secrets (bitnami-labs/sealed-secrets)
#   * the External Secrets Operator (backed by Vault/AWS/GCP secret managers)
#   * the Secrets Store CSI driver
# Replace every value below and rotate regularly.
# ---------------------------------------------------------------------------
# SECURITY MODEL (QA CR-11 / CR-17):
#   * NO shared "owner" credential is handed to every service. Each backend
#     service authenticates to PostgreSQL with its OWN least-privilege role
#     (carddemo-<service>-db), scoped to just the tables that service owns.
#   * The api-gateway owns NO database and is therefore issued NO database
#     Secret — only the shared Redis AUTH secret (for Spring Session).
#   * Redis AUTH is an ACTIVE, required key (carddemo-redis-secret): services
#     fail closed if it is absent (no silent unauthenticated fallback).
#   * postgres is bootstrapped with an owner role (carddemo-postgres-bootstrap)
#     that a DB-init step uses to CREATE ROLE / GRANT the per-service roles
#     enumerated below. See docs/decision-log.md for the role-provisioning
#     contract (the init migration is delivered with the bootable services).
# ---------------------------------------------------------------------------
# Kubernetes base64-encodes `stringData` on apply, so values stay human
# readable in this template. Keys map 1:1 to the Spring Boot environment
# variables each service consumes via `envFrom`.
# ===========================================================================

# --- Shared Redis AUTH (all 9 services, including the gateway) --------------
---
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-redis-secret
  labels:
    app.kubernetes.io/part-of: carddemo
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # Consumed as spring.data.redis.password by every service; MUST match the
  # `--requirepass` value the redis Deployment starts with.
  SPRING_DATA_REDIS_PASSWORD: "replace-with-strong-redis-password"

# --- Shared PII field-encryption key (the 8 JPA services, not the gateway) --
---
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-pii-key
  labels:
    app.kubernetes.io/part-of: carddemo
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # AES-256-GCM key used by carddemo-common's CryptoConverter to encrypt and
  # decrypt the sensitive customer/card attributes at rest (SSN, government id,
  # EFT account id, CVV). The converter resolves CARDDEMO_PII_KEY (or the
  # carddemo.pii.key system property) and raises IllegalStateException when it is
  # absent, so every service that reads or writes those fields REQUIRES this key.
  # Must be a Base64-encoded 256-bit (32-byte) value: `openssl rand -base64 32`.
  # The key is SHARED because the same ciphertext must round-trip across services;
  # rotating it requires re-encrypting the affected columns.
  # The api-gateway maps no entities and is therefore issued NO PII key.
  CARDDEMO_PII_KEY: "replace-with-base64-encoded-32-byte-aes-key"

# --- PostgreSQL bootstrap owner (consumed ONLY by the postgres Deployment) --
---
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-postgres-bootstrap
  labels:
    app.kubernetes.io/part-of: carddemo
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # The role PostgreSQL initializes with on first boot. A DB-init step uses it
  # to create the per-service roles below; application services never use it.
  POSTGRES_USER: "carddemo_owner"
  POSTGRES_PASSWORD: "replace-with-strong-postgres-owner-password"

# --- Per-service least-privilege database roles (CR-11) ---------------------
# One Secret per DB-owning service. Each carries the SPRING_DATASOURCE_* keys
# that service consumes via `envFrom`. The api-gateway is intentionally absent.
---
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-auth-service-db
  labels:
    app.kubernetes.io/part-of: carddemo
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "carddemo_auth"
  SPRING_DATASOURCE_PASSWORD: "replace-with-strong-auth-db-password"
---
