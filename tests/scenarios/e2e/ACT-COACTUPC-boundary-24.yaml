# COACTUPC Date of Birth upper edge: the run date itself. EDIT-DATE-OF-BIRTH
# accepts a birth date only when the current date is strictly greater, so a
# date of birth equal to the run date is refused as being in the future
# [app/cpy/CSUTLDPY.cpy:341-365]. Of the two Date of Birth boundaries,
# boundary-23 types the day before the run date, which is accepted, and this
# scenario types the run date, which is refused; a later date is the item's
# own negative case.
#
# The typed date is a run-date input ({run-date: {part, offset_days: 0}},
# harness/scenarios.py RUN_DATE_INPUT), not fixed text: the outcome hinges on
# equality with the region's date, which unikix cannot fix (GAP-MIS-015), and a
# fixed date would pin a different case on every later day. The tpe adapter
# types the year, month and day of the CURDATE shown on screen 3, the date of
# the task that sent the screen; a run that crosses midnight between that send
# and the step-4 ENTER would type the day before instead.
#
# Steps 1-3 sign on as USER0001, choose main-menu option 2 and fetch account
# 00000000001, as ACT-COACTUPC-alternate-04 does: CXACAIX gives customer
# 000000001, ACCTDAT and CUSTDAT are read without UPDATE, and
# 3202-SHOW-ORIGINAL-VALUES shows the records with 'Update account details
# presented above.'; every editable field is DFHBMFSE (unprotected, MDT on), so
# all of them come back on the next AID [app/cbl/COACTUPC.cbl:2568-2580,
# 2787-2865,3500-3561,3608-3884]. Step 4 types the run date over the birth
# date (1961-06-08) and presses ENTER.
# - 1100-RECEIVE-MAP moves DOBYEAR, DOBMON and DOBDAY, being neither '*' nor
#   spaces, to ACUP-NEW-CUST-DOB-YEAR, -MON and -DAY
#   [app/cbl/COACTUPC.cbl:1254-1276].
# - 1205-COMPARE-OLD-NEW finds the new birth date different from the fetched
#   19610608, so 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs the
#   field edits in screen order [app/cbl/COACTUPC.cbl:1460-1468,1681-1775].
# - Account Status (Y), Open Date (2014-11-20), Credit Limit, Expiry Date
#   (2025-05-20), Cash Credit Limit, Reissue Date (2025-05-20), the balance and
#   cycle amounts and SSN 123-45-6789 are as fetched and pass. Each of the
#   three account dates is sent to CSUTLDTC with mask YYYYMMDD by EDIT-DATE-LE;
#   CEEDAYS is taken to accept them (severity 0), which no run has observed
#   (GAP-INF-001) [app/cbl/COACTUPC.cbl:1470-1531]
#   [app/cpy/CSUTLDPY.cpy:284-311].
# - Date of Birth is next: 'Date of Birth' goes to WS-EDIT-VARIABLE-NAME and
#   the run date as CCYYMMDD to WS-EDIT-DATE-CCYYMMDD, and EDIT-DATE-CCYYMMDD
#   runs through CSUTLDPY [app/cbl/COACTUPC.cbl:1533-1537]. The run date is a
#   real date of century 20, so EDIT-YEAR-CCYY, EDIT-MONTH, EDIT-DAY and
#   EDIT-DAY-MONTH-YEAR pass, and EDIT-DATE-LE sends it to CSUTLDTC with mask
#   YYYYMMDD; CEEDAYS is taken to accept it (severity 0, GAP-INF-001), so
#   WS-EDIT-DATE-IS-VALID is set and the CSUTLDTC date-acceptance item is
#   listed [app/cpy/CSUTLDPY.cpy:18-328] [app/cbl/CSUTLDTC.cbl:103-151].
# - WS-EDIT-DT-OF-BIRTH-ISVALID holds, so EDIT-DATE-OF-BIRTH runs. It moves
#   FUNCTION CURRENT-DATE (its first 8 bytes, YYYYMMDD) to
#   WS-CURRENT-DATE-YYYYMMDD and compares INTEGER-OF-DATE of both dates. They
#   are equal, so WS-CURRENT-DATE-BINARY > WS-EDIT-DATE-BINARY is false: it
#   sets INPUT-ERROR and the year, month and day flags not OK and, the message
#   being still off, STRINGs the trimmed field name and ':cannot be in the
#   future ' into WS-RETURN-MSG [app/cpy/CSUTLDPY.cpy:341-365]
#   [app/cbl/COACTUPC.cbl:1538-1543].
# - Every later edit passes on the invented customer below, and an edit writes
#   its message only while WS-RETURN-MSG-OFF holds, so this message stays.
# - INPUT-ERROR leaves ACUP-CHANGES-NOT-OK, which 2000-DECIDE-ACTION only
#   continues on: 9600-WRITE-PROCESSING, the only READ UPDATE and REWRITE
#   path, does not run [app/cbl/COACTUPC.cbl:2596-2597,3888].
# - 3203-SHOW-UPDATED-VALUES shows the received values, the typed birth date
#   included, with the amounts re-edited through +ZZZ,ZZZ,ZZZ.99;
#   3250-SETUP-INFOMSG sets PROMPT-FOR-CHANGES and moves WS-RETURN-MSG to
#   ERRMSG; 3300 keeps the fields editable, puts the cursor on DOBYEAR and
#   CSSETATY turns the birth date red; 3390 makes F12=Cancel bright, while
#   F5=Save stays dark without a confirmation prompt
#   [app/cbl/COACTUPC.cbl:2870-2951,2955-2983,2986-3006,3088-3100,3566-3581]
#   [app/cpy/CSSETATY.cpy:17-26].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - ERRMSG is 'Date of Birth' (the trimmed X(25) WS-EDIT-VARIABLE-NAME) and
#   ':cannot be in the future ', 38 characters with the literal's trailing
#   space, in the 75-byte WS-RETURN-MSG and the 78-byte ERRMSGO.
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   FKEY05 is dark (ASKIP,DRK) and the s3270 capture renders it as blanks.
# - The tpe adapter enters a field with EraseEOF before typing; the run date's
#   4-digit year and 2-digit month and day fill DOBYEAR, DOBMON and DOBDAY
#   [app/bms/COACTUP.bms:291-311].
# - CURDATE, CURTIME and the echoed birth date come from the region clock,
#   hence the matchers and clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every other
# COACTUPC edit: the repository record has FICO 274, below 300, and zip 12546,
# which is not a North Carolina zip [app/cbl/COACTUPC.cbl:2514-2558]. Area code
# 919 is a general-purpose code and NC27 a valid state and zip pair
# [app/cpy/CSLKPCDY.cpy:521,895,1186]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-boundary-24
level: e2e
type: boundary
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001 with its customer 000000001, types the run date itself
  over the date of birth (1961-06-08) and presses ENTER. The date is a valid
  date, but EDIT-DATE-OF-BIRTH accepts only a birth date strictly earlier than
  the run date, so COACTUPC refuses it: the message line shows 'Date of
  Birth:cannot be in the future ', the screen keeps the entered values, the
  run date included, editable under 'Update account details presented above.',
  and F12=Cancel is shown while F5=Save is not. Nothing is saved: ACCTDATA and
  CUSTDATA still hold the fetched records.
# Primary item first, then the CSUTLDTC date acceptance the birth date passes
# before the run-date comparison, the program, the maps asserted, the
# transaction of steps 3 and 4, the CSD files COACTUPC reads, and the
# online-only copybooks it copies. Sign-on (CC00, COSGN00, USRSEC) and the
# menu transaction are verified by the SEC and MNU scenarios; the batch record
# copybooks and the data files are verified at the lowest level that executes
# them.
inventory_ids:
- INV-ACT-142  # COACTUPC Date of Birth: earlier than the run date (EDIT-DATE-OF-BIRTH field edit)
- INV-UTL-003  # CSUTLDTC date acceptance for masks YYYY-MM-DD and YYYYMMDD, reached through EDIT-DATE-LE
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read, never rewritten here
- INV-CFG-005  # CUSTDAT CSD file: customer master read, never rewritten here
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attributes set on the birth date
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-DATE-CCYYMMDD, EDIT-DATE-LE and EDIT-DATE-OF-BIRTH
- INV-LAY-014  # CSUTLDWY: WS-EDIT-DATE-CCYYMMDD and WS-CURRENT-DATE
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY drops FUNCTION TRIM from the field name of every composed
# date-edit message, this one included, so the ERRMSG of screen 4 differs on
# UniKix; it lists INV-ACT-142.
- GAP-DOC-024
- GAP-INF-001  # which dates CEEDAYS accepts is known only through the stub
- GAP-MIS-010  # whether UniKix supplies CEEDAYS
# The UniKix CSUTLDTC passes CEEDAYS trimmed Vstring lengths, so the account
# dates and the birth date reach CEEDAYS differently; it lists INV-UTL-003.
- GAP-DOC-021
# The UniKix COACTUPC comments out the TEST-NUMVAL-C checks of the amounts that
# 1100-RECEIVE-MAP converts and the ' is not valid' amount edit, and drops TRIM
# from the change detection, all on this path, so the amounts on screen 4 may
# differ on UniKix [app/cbl/COACTUPC.cbl:1072-1110,1681-1775,2180-2221].
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands;
# the COACTUP map is asserted on screens 2 to 4.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
        CUST-ADDR-ZIP: '27601'
        CUST-PHONE-NUM-1: (919)555-0101
        CUST-PHONE-NUM-2: (919)555-0102
        CUST-SSN: '123456789'
        CUST-GOVT-ISSUED-ID: TESTGOVT0001
        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: 'Y'
        CUST-FICO-CREDIT-SCORE: '700'
    # The 10 repository users, for the USER0001 sign-on.
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
# PASSWORD is the documented demo password of README.md, not a secret.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  # The run date itself (offset 0), typed from the CURDATE of screen 3.
  - aid: ENTER
    '@map': COACTUP
    fields:
      DOBYEAR: {run-date: {part: year, offset_days: 0}}
      DOBMON: {run-date: {part: month, offset_days: 0}}
      DOBDAY: {run-date: {part: day, offset_days: 0}}
