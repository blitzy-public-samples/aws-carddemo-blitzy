# A custom-range report request with the end day left empty.
# Steps 1-2 reach the empty CORPT00 screen as MNU-COMEN01C-alternate-09 does:
# USER0001 signs on, COSGN00C routes the type-U user to COMEN01C, and option 9
# 'Transaction Reports' [app/cpy/COMEN02Y.cpy:74-78] transfers control to
# CORPT00C with CDEMO-PGM-CONTEXT zero, so CORPT00C takes its first-entry path,
# sets CDEMO-PGM-REENTER and sends CORPT0AO at LOW-VALUES with a blank ERRMSG
# [app/cbl/CORPT00C.cbl:172-181,556-580].
#
# Step 3 runs under CR00, the TRANSID CORPT00C returned with. ENTER on the
# re-entry receives the map into CORPT0AI and performs PROCESS-ENTER-KEY
# [app/cbl/CORPT00C.cbl:183-186,596-604]. MONTHLY and YEARLY keep their blank
# INITIAL and CUSTOM holds 'X', so the custom branch runs its empty-field
# checks in the order start month, day, year, end month, day, year
# [app/cbl/CORPT00C.cbl:208-300]. The whole start date and the end month are
# filled, so the first WHEN that holds is EDTDDI = SPACES OR LOW-VALUES (the
# field keeps its INITIAL of two spaces): CORPT00C moves 'End Date - Day can
# NOT be empty...' to WS-MESSAGE, sets WS-ERR-FLG, puts the cursor on EDTDD and
# performs SEND-TRNRPT-SCREEN [app/cbl/CORPT00C.cbl:287-293]. That paragraph
# rebuilds the header from COTTL01Y and CSDAT01Y, moves the message to ERRMSG,
# sends CORPT00 with ERASE and goes to RETURN-TO-CICS, which ends the task
# [app/cbl/CORPT00C.cbl:556-591,609-628]. The end-year check, the NUMVAL-C
# normalization, the field checks, the CSUTLDTC date validation and
# SUBMIT-JOB-TO-INTRDR are never reached, so no confirmation is asked and
# nothing is written to the JOBS queue.
#
# Priority decision: that nothing is submitted is pinned by the screen staying
# on CORPT00 with the end-day message, not through @TDQ:JOBS. The JOBS capture
# (GAP-MIS-017) belongs to RPT-CORPT00C-normal-01..03, and asserting it here
# would hold this validation case behind that gap as well.
#
# Expected values are derived from the source; no TPE region runs in CI.
id: RPT-CORPT00C-negative-06
level: e2e
type: negative
description: >-
  USER0001 signs on, selects main-menu option 9 (Transaction Reports) and, on
  the CORPT00 screen (CR00), asks for a custom report from 01/01/2022 to
  07/06/2022 with the end day left empty. CORPT00C refuses the request with
  'End Date - Day can NOT be empty...', redisplays the entered values with the
  end day still blank, and submits no report job.
# Primary item first, then the program, the maps asserted, the transaction
# step 3 runs under, and the online-only copybooks CORPT00C copies. Sign-on
# and the menu (CC00, CM00, COSGN00, USRSEC, option 9) are verified by the SEC
# and MNU scenarios.
inventory_ids:
- INV-RPT-015  # CORPT00C message 'End Date - Day can NOT be empty...' (rule)
- INV-RPT-001  # CORPT00C program
- INV-MNU-003  # COMEN01 map, where option 9 is entered
- INV-RPT-002  # CORPT00 map, the empty screen and the refused request
- INV-CFG-019  # CR00 transaction, under which the request is processed
- INV-LAY-002  # COCOM01Y: the COMMAREA that makes step 3 a re-entry
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y, copied by CORPT00C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-009  # RPT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    # COSGN00C reads the sign-on user USER0001; CORPT00C reads no file.
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '9'
  # The valid custom range 01/01/2022 to 07/06/2022 with EDTDD left as sent.
  - aid: ENTER
    '@map': CORPT00
    fields:
      CUSTOM: 'X'
      SDTMM: '01'
      SDTDD: '01'
      SDTYYYY: '2022'
      EDTMM: '07'
      EDTYYYY: '2022'
# Screen values are whole fields at their BMS length, trailing spaces kept:
# comparison never trims. CORPT0AO redefines CORPT0AI [app/cpy-bms/CORPT00.CPY:121]
# and nothing on this path touches the input fields between RECEIVE and SEND,
# so the entered values come back as received; the fields left alone show their
# blank INITIAL, and CONFIRM, which has none, shows as a space
# [app/bms/CORPT00.bms:80-210]. ERRMSG is 78 bytes [app/bms/CORPT00.bms:218-221]:
# the 34-character message followed by spaces from the 80-byte WS-MESSAGE
# [app/cbl/CORPT00C.cbl:39]. CURDATE and CURTIME come from the region clock, in
# the MM/DD/YY and HH:MM:SS forms POPULATE-HEADER-INFO builds
# [app/cbl/CORPT00C.cbl:609-628].
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    ERRMSG: '                                                                              '
  - '@map': CORPT00
    TRNNAME: CR00
    PGMNAME: CORPT00C
    ERRMSG: '                                                                              '
  - '@map': CORPT00
    TRNNAME: CR00
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: CORPT00C
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    MONTHLY: ' '
    YEARLY: ' '
    CUSTOM: 'X'
    SDTMM: '01'
    SDTDD: '01'
    SDTYYYY: '2022'
    EDTMM: '07'
    EDTDD: '  '
    EDTYYYY: '2022'
    CONFIRM: ' '
    ERRMSG: 'End Date - Day can NOT be empty...                                            '
  # One ERRMSG value per step: blank on the main menu and on the first
  # CORPT00 screen, the end-day message after ENTER.
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'End Date - Day can NOT be empty...                                            '
