---
# =============================================================================
# k8s/deployment-reporting-service.yaml
# -----------------------------------------------------------------------------
# Kubernetes Deployment for the CardDemo reporting-service Spring Boot service
# (AAP 0.3.1, 0.4.2, 0.4.4). It re-platforms the legacy COBOL report-request
# program CORPT00C (CICS transaction CR00) together with the batch statement
# generation programs CBSTM03A / CBSTM03B (text + HTML output). The service
# exposes REST POST /reports, which launches the statement job asynchronously
# via a Spring Batch JobLauncher, and reads transaction/account data from the
# shared PostgreSQL 'carddemo' database.
#
# :purpose: Schedule the reporting-service pod, inject the shared datasource,
#           Redis and observability configuration, and wire Actuator-backed
#           startup, liveness and readiness probes.
# :output:  A Deployment named ``reporting-service`` running one pod that
#           serves HTTP on container port 8080 (named ``http``).
# :notes:   replicas is fixed at 1 on purpose. The asynchronous JobLauncher
#           statement/report jobs must run on exactly one instance so a single
#           POST /reports never fans out into duplicate concurrent job launches
#           across replicas. Scale batch fan-out at the Spring Batch layer, not
#           by adding pods here.
#
#           The image ``carddemo/reporting-service:1.0.0`` is built by
#           ``reporting-service/Dockerfile`` (runtime stage FROM
#           eclipse-temurin:21-jre, AAP 0.5.1). ``imagePullPolicy``
#           ``IfNotPresent`` keeps the locally built image without
#           contacting a registry.
#
#           Non-secret runtime configuration is projected from the
#           ``carddemo-config`` ConfigMap (k8s/configmap.yaml) and database
#           credentials from the ``carddemo-reporting-service-db`` Secret (k8s/secret.yaml)
#           via ``envFrom``. The companion service-reporting-service.yaml
#           selects these pods through the ``app: reporting-service`` label.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
  labels:
    app: reporting-service
    app.kubernetes.io/name: reporting-service
    app.kubernetes.io/part-of: carddemo
    app.kubernetes.io/component: backend
spec:
  # Single replica: the async statement/report JobLauncher must run on one
  # instance so a POST /reports never triggers duplicate concurrent jobs.
  replicas: 1
  selector:
    matchLabels:
      app: reporting-service
  template:
    metadata:
      labels:
        app: reporting-service
        app.kubernetes.io/name: reporting-service
        app.kubernetes.io/part-of: carddemo
        app.kubernetes.io/component: backend
    spec:
      # Pod-level runtime hardening (MJ-10): run as a non-root user with a
      # default seccomp profile and no auto-mounted ServiceAccount token
      # (these services never call the Kubernetes API).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      # Startup ordering gate: the shared CardDemo schema is provisioned by the
      # SINGLE Flyway migration owner, batch-service (see its application.yml and
      # docs/decision-log.md). This service runs with spring.flyway.enabled=false
      # and Hibernate ddl-auto=validate, so it can only start once that schema
      # exists; without the gate the pod crash-loops on
      # "Schema validation: missing table". The init container blocks until the
      # owner reports READY through its Actuator readiness group, using the same
      # bash /dev/tcp probe idiom as the Compose healthcheck (the eclipse-temurin
      # base image ships neither curl nor wget).
      initContainers:
        - name: await-schema
          image: eclipse-temurin:21-jre
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - bash
            - -c
            - >-
              until exec 3<>/dev/tcp/batch-service/8080 2>/dev/null
              && printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: batch-service\r\nConnection: close\r\n\r\n' >&3
              && grep -q '"status":"UP"' <&3;
              do echo 'waiting for the schema owner (batch-service) to become ready'; sleep 5; done;
              echo 'schema owner ready'
      containers:
        - name: reporting-service
          # Built by reporting-service/Dockerfile (runtime stage FROM
          # eclipse-temurin:21-jre). Locally built tag, so never pull if
          # the image is already present on the node.
          # Produced by `docker compose build reporting-service` from reporting-service/Dockerfile (root build context)
          # (docker-compose.yml carries a matching `image:` key with these exact
          # registry/name/tag defaults), so this reference resolves to an artifact the
          # repository builds - no undocumented tag-and-push step (QA Issue 17).
          # Override the registry or tag for a private registry with
          # CARDDEMO_IMAGE_REGISTRY / CARDDEMO_IMAGE_TAG at build time.
          image: carddemo/reporting-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Shared non-secret config (datasource URL, Redis host/port,
          # Actuator exposure) plus DB credentials, projected as environment
          # variables that resolve the application.yml property references.
          # Container-level runtime hardening (MJ-10): drop every Linux
          # capability, forbid privilege escalation, and run on a read-only
          # root filesystem (writable scratch is the mounted tmp emptyDir).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Writable batch working directory (QA Issue 21). The read-only root
            # filesystem leaves nowhere for a job to write, so the statement and
            # report writers failed with "No such file or directory" while the
            # caller had already been told the report was submitted. An emptyDir
            # is created by the kubelet with the pod's fsGroup, so the non-root
            # container owns it; carddemo-common's BatchOutputPathResolver proves
            # it writable while the context refreshes.
            - name: batch-work
              mountPath: /var/carddemo/batch
          env:
            # Batch file roots consumed by carddemo-common's
            # BatchOutputPathResolver, pointing at the writable emptyDir above.
            # Substituting a PersistentVolumeClaim for the emptyDir needs no image
            # or code change because the path is externalized here.
            - name: CARDDEMO_BATCH_OUTPUT_DIR
              value: /var/carddemo/batch/output
            - name: CARDDEMO_BATCH_INPUT_DIR
              value: /var/carddemo/batch/input
          envFrom:
            - configMapRef:
                name: carddemo-config
            # Per-service least-privilege database role (CR-11): each service
            # authenticates with its own DB principal, not a shared owner.
            - secretRef:
                name: carddemo-reporting-service-db
            # Shared Redis AUTH secret for externalized Spring Session (CR-17).
            - secretRef:
                name: carddemo-redis-secret
            # Shared AES-256-GCM key for at-rest PII field encryption
            # (carddemo-common CryptoConverter: SSN, government id, EFT account
            # id, CVV). Services fail closed if it is absent.
            - secretRef:
                name: carddemo-pii-key
            # Shared credential of the least-privilege `monitoring` principal
            # guarding /actuator/prometheus and /actuator/metrics (MJ-17). Must
            # match the password Prometheus presents, or every scrape gets 401.
            - secretRef:
                name: carddemo-monitoring-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # Quoted so the value is parsed as the string "1" core, not an
              # integer, matching Kubernetes CPU-quantity conventions.
              cpu: "1"
              memory: 1Gi
          # Observability (AAP 0.7.5): Actuator health endpoints. startupProbe
          # shields the slower JVM/Spring Batch boot; once it passes, liveness
          # and readiness use the dedicated probe groups exposed by
          # management.endpoint.health.probes.enabled=true.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            # Explicit timeout (QA Issue 3). The default timeoutSeconds is 1, so during any
            # datastore blip the aggregate health check — which must wait for the bounded
            # 3s HikariCP / 2s Lettuce dependency timeouts — fails on every attempt and the
            # pod is killed after failureThreshold x periodSeconds. 4s bounds each attempt
            # just above the slowest dependency timeout.
            timeoutSeconds: 4
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      # Writable scratch for the read-only root filesystem (MJ-10). A Spring
      # Boot fat-jar only needs a writable /tmp (Tomcat work dir, JVM temp).
      volumes:
        - name: tmp
          emptyDir: {}
        - name: batch-work
          # Writable batch working directory for the read-only root filesystem
          # (QA Issue 21). Deliberately an emptyDir in the reference manifests:
          # batch output is operational evidence rather than durable data, and an
          # emptyDir carries no ReadWriteOnce single-writer constraint, so the
          # Deployment stays scalable. A durable deployment substitutes a
          # PersistentVolumeClaim here and leaves everything else unchanged.
          emptyDir: {}
