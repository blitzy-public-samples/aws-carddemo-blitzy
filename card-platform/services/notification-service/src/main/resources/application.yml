# card-platform notification-service — the runtime contract for one container.
#
# Values that change between environments read a variable and fall back to a
# working demo default, so the service starts with no .env file present.
# docker-compose.yml overrides the values it injects, and
# card-platform/.env.example names every variable a developer can set.

spring:

  application:
    name: notification-service

  # PostgreSQL. One private database holds one schema, and no other service
  # reads either. The password default is a demo credential for a disposable
  # local container.
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:postgres}:\
      ${POSTGRES_PORT:5432}/${NOTIFICATION_DB_NAME:carddemo_notification}\
      ?currentSchema=${NOTIFICATION_DB_SCHEMA:notification_service}}"
    username: "${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:carddemo}}"
    # No fallback. An unset password stops start-up rather than signing on under a
    # password this repository publishes. docker-compose.yml sets
    # SPRING_DATASOURCE_PASSWORD; a direct run sets POSTGRES_PASSWORD.
    password: "${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}"
    driver-class-name: org.postgresql.Driver

  # Flyway creates the schema on first start, owns every table in it, and
  # applies the migrations under db/migration. docker-compose.yml creates the
  # database and defines no schema object.
  flyway:
    enabled: true
    create-schemas: true
    schemas: "${SPRING_FLYWAY_SCHEMAS:${NOTIFICATION_DB_SCHEMA:notification_service}}"
    default-schema: "${SPRING_FLYWAY_DEFAULT_SCHEMA:${NOTIFICATION_DB_SCHEMA:notification_service}}"
    baseline-on-migrate: false
    validate-on-migrate: true

  # Jakarta Persistence. Hibernate checks its mapping against the migrated
  # schema and creates nothing. A column name or type that disagrees with the
  # migrated schema stops startup.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: "${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:${NOTIFICATION_DB_SCHEMA:notification_service}}"
        auto_quote_keyword: true

  # Kafka. A service container reaches the broker on kafka:29092 inside the
  # compose network. Host tooling uses the published port named in
  # .env.example.
  kafka:
    bootstrap-servers: "${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}}"

    # This module registers no producer, so it carries no spring.kafka.producer
    # block. It consumes three topics and publishes nothing.

    # Three listeners read three topics under three group identifiers, named
    # further down under carddemo. The value below is the default the listener
    # container factory applies.
    consumer:
      group-id: "${SPRING_KAFKA_CONSUMER_GROUP_ID:${GROUP_NOTIFICATION_POSTED:notification-posted}}"
      enable-auto-commit: false
      auto-offset-reset: "${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}"
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Schema validation runs inside poll, and the wrapper below turns a
      # failure there into a record the listener error handler routes to the
      # dead-letter topic.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: com.carddemo.events.serde.JsonSchemaValidatingDeserializer

    # A listener acknowledges a message once its own writes commit.
    # manual_immediate commits the offset at that acknowledgement. Plain manual
    # queues it until the whole poll batch finishes, so a crash mid-batch
    # redelivers work this service already committed.
    listener:
      ack-mode: manual_immediate

# Platform properties the three listeners and the dead-letter route read
carddemo:
  kafka:

    # One group per listener. Two listeners sharing one group would split the
    # messages between them. The transaction-authorized group makes this service
    # the third reader of transaction.authorized, beside ledger posting and
    # fraud detection, and it reaches no other service to do so.
    groups:
      transaction-authorized: "${GROUP_NOTIFICATION_AUTHORIZED:notification-authorized}"
      transaction-posted: "${GROUP_NOTIFICATION_POSTED:notification-posted}"
      fraud-assessed: "${GROUP_NOTIFICATION_FRAUD:notification-fraud}"

    # Three consumed topics. transaction.authorized carries the authorization
    # event this service alerts a cardholder about. transaction.posted carries
    # the new balance. FraudFlagged and FraudCleared both travel on
    # fraud.assessed, and that listener routes on the envelope eventType field.
    # docker-compose.yml creates one dead-letter topic per consumed topic by
    # appending the suffix below.
    topics:
      transaction-authorized: "${TOPIC_TRANSACTION_AUTHORIZED:transaction.authorized}"
      transaction-posted: "${TOPIC_TRANSACTION_POSTED:transaction.posted}"
      fraud-assessed: "${TOPIC_FRAUD_ASSESSED:fraud.assessed}"
      dead-letter-suffix: "${TOPIC_DEAD_LETTER_SUFFIX:.DLT}"

  consumer:

    # Delivery attempts a listener makes before the record routes to the
    # dead-letter topic, and the wait between two attempts in milliseconds.
    retry:
      max-attempts: "${CONSUMER_MAX_RETRY_ATTEMPTS:3}"
      backoff-ms: "${CONSUMER_RETRY_BACKOFF_MS:1000}"

# Actuator. The container health check reads /actuator/health on the port
# below, and the exposure list adds the info, metrics and Prometheus
# endpoints.
management:
  # /actuator answers on this port and never on the service port above, so a
  # client of the Representational State Transfer (REST) surface reaches no
  # runtime, database or broker internals. docker-compose.yml publishes this port
  # on the loopback address alone.
  server:
    port: ${MANAGEMENT_PORT:9080}
  endpoints:
    web:
      exposure:
        include: "${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:${MANAGEMENT_ENDPOINTS:health,metrics,prometheus}}"
  prometheus:
    metrics:
      export:
        enabled: true

# Container port. docker-compose.yml publishes host port 8084 onto it and
# probes /actuator/health on the container port from inside the container.
server:
  port: 8080

# The console format key below turns every log line into JSON, which is the
# whole of the structured logging setup. This module carries no logging
# configuration file.
logging:
  structured:
    format:
      console: logstash
  level:
    root: "${LOGGING_LEVEL_ROOT:${LOG_LEVEL:INFO}}"
    # INFO by default. A DEBUG default retains identifiers in centralized logs.
    com.carddemo: "${LOGGING_LEVEL_COM_CARDDEMO:${LOG_LEVEL_CARDDEMO:INFO}}"
