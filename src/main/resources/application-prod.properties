# ============================================
# CardDemo Spring Boot Application
# Production Profile Configuration
# ============================================
# This configuration file extends application.properties with production-specific settings
# optimized for cloud deployment and enterprise-scale operations.
#
# Target Performance Requirements:
# - 150+ concurrent users
# - 10,000 TPS transaction volume
# - Sub-200ms response time at 95th percentile
# - 4-hour batch processing window
#
# Security: All sensitive values are externalized via Kubernetes ConfigMap and Secret resources
# ============================================

# ============================================
# Server Configuration
# ============================================
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Enable compression for responses
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css

# HTTP/2 support
server.http2.enabled=true

# Connection timeout settings
server.tomcat.connection-timeout=20000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=25
server.tomcat.accept-count=100
server.tomcat.max-connections=10000

# ============================================
# Database Configuration - PostgreSQL
# ============================================
# Connection URL with externalized parameters
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carddemo}?ssl=true&sslmode=require&ApplicationName=CardDemo-Production
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
# Optimized for high concurrency and mainframe-equivalent performance
spring.datasource.hikari.pool-name=CardDemoHikariPool
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# Connection pool validation
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=30000

# ============================================
# JPA/Hibernate Configuration
# ============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# PostgreSQL-specific dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Performance optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# Query performance
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128

# Statistics for monitoring (exposed via JMX)
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.session.events.log=false

# ============================================
# Redis Session Configuration
# ============================================
# Redis connection for distributed session management
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

# Redis connection pool (Lettuce)
spring.data.redis.lettuce.pool.max-active=50
spring.data.redis.lettuce.pool.max-idle=25
spring.data.redis.lettuce.pool.min-idle=10
spring.data.redis.lettuce.pool.max-wait=2000ms

# Session configuration
spring.session.store-type=redis
spring.session.redis.namespace=carddemo:session
spring.session.timeout=1800s
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=CARDDEMO_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# ============================================
# Security Configuration
# ============================================
# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.issuer=carddemo-production
jwt.audience=carddemo-users

# Security headers
server.servlet.session.tracking-modes=cookie
spring.security.filter.order=5

# CORS Configuration (restrict to trusted origins in production)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://carddemo.example.com}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type,Accept,X-Requested-With
cors.exposed-headers=X-Total-Count,X-Page-Number,X-Page-Size
cors.allow-credentials=true
cors.max-age=3600

# ============================================
# Logging Configuration
# ============================================
# Root logging level
logging.level.root=INFO
logging.level.com.carddemo=INFO

# Framework logging levels
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data=WARN
logging.level.org.springframework.batch=INFO
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Connection pool logging
logging.level.com.zaxxer.hikari=INFO
logging.level.com.zaxxer.hikari.HikariConfig=INFO

# Structured logging pattern for log aggregation (ELK, CloudWatch, etc.)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Log file configuration with rotation
logging.file.name=/var/log/carddemo/application.log
logging.file.path=/var/log/carddemo
logging.file.max-size=100MB
logging.file.max-history=30
logging.file.total-size-cap=5GB

# Logback configuration for JSON structured logging (for log aggregation platforms)
logging.config=classpath:logback-spring.xml

# ============================================
# Spring Boot Actuator Configuration
# ============================================
# Expose health, info, and metrics endpoints for monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# Health check configuration for Kubernetes
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Metrics configuration
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=carddemo
management.metrics.tags.environment=production

# Info endpoint configuration
management.info.env.enabled=true
management.info.git.enabled=true
management.info.git.mode=full
management.info.build.enabled=true

# Security for actuator endpoints (restrict to internal network)
management.server.port=8081
management.server.address=127.0.0.1

# ============================================
# Spring Batch Configuration
# ============================================
# Enable batch job execution in production
spring.batch.job.enabled=true
spring.batch.jdbc.initialize-schema=never
spring.batch.jdbc.isolation-level-for-create=serializable

# Batch processing optimization for 4-hour window completion
spring.batch.chunk-size=1000
spring.batch.throttle-limit=10

# Thread pool for parallel batch processing
spring.task.execution.pool.core-size=8
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=batch-exec-

# Scheduling for batch jobs (if using @Scheduled)
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=batch-sched-

# ============================================
# Flyway Database Migration
# ============================================
# Flyway configuration for production zero-downtime deployments
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.table=flyway_schema_history

# Flyway connection settings (use same connection pool)
spring.flyway.connect-retries=3
spring.flyway.connect-retries-interval=10s

# ============================================
# Jackson JSON Configuration
# ============================================
# JSON serialization settings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# BigDecimal serialization (critical for financial data)
spring.jackson.generator.write-bigdecimal-as-plain=true

# ============================================
# Validation Configuration
# ============================================
spring.validation.enabled=true

# ============================================
# Application-Specific Configuration
# ============================================
# Pagination defaults (matching mainframe CICS screen limits)
app.pagination.card-list.page-size=7
app.pagination.transaction-list.page-size=10
app.pagination.default.page-size=20
app.pagination.max.page-size=100

# Transaction processing limits
app.transaction.max-amount=999999.99
app.transaction.min-amount=0.01
app.transaction.authorization-timeout=5000

# Account limits (matching COBOL COMP-3 precision)
app.account.max-credit-limit=999999999.99
app.account.min-credit-limit=1000.00

# Performance monitoring thresholds
app.performance.response-time-threshold-ms=200
app.performance.slow-query-threshold-ms=100

# Batch job execution window (4 hours in milliseconds)
app.batch.execution-window-ms=14400000
app.batch.job-timeout-ms=14400000

# ============================================
# Cache Configuration (for reference data)
# ============================================
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false
spring.cache.cache-names=transactionTypes,transactionCategories,disclosureGroups

# ============================================
# Resilience and Retry Configuration
# ============================================
# Database connection retry
spring.datasource.hikari.connection-init-sql=SELECT 1

# Request timeout
spring.mvc.async.request-timeout=30000

# ============================================
# API Documentation (Swagger/OpenAPI)
# ============================================
# Disable Swagger UI in production (use API gateway documentation instead)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs

# ============================================
# Production Optimizations
# ============================================
# Disable unnecessary features in production
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Enable response caching
spring.web.resources.cache.cachecontrol.max-age=31536000
spring.web.resources.cache.cachecontrol.cache-public=true

# Enable GZip compression
server.compression.min-response-size=1024

# ============================================
# Cloud Platform Configuration (Kubernetes)
# ============================================
# Application metadata for service discovery
spring.application.name=carddemo
spring.application.version=@project.version@

# Kubernetes health probes
management.endpoint.health.group.liveness.include=livenessState,diskSpace
management.endpoint.health.group.readiness.include=readinessState,db,redis

# Graceful shutdown for zero-downtime deployments
server.tomcat.connection-timeout=20000
spring.lifecycle.timeout-per-shutdown-phase=30s

# ============================================
# Environment-Specific Overrides
# ============================================
# Production-specific settings that override base configuration
# All sensitive values (passwords, secrets, keys) are externalized to Kubernetes Secrets
# Non-sensitive configuration is in Kubernetes ConfigMaps
# This ensures 12-factor app compliance and secure secret management

# ============================================
# Monitoring and Observability
# ============================================
# Enable detailed metrics for production monitoring
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.tomcat=true
management.metrics.enable.hikaricp=true
management.metrics.enable.jdbc=true
management.metrics.enable.http=true

# Distributed tracing (if using Zipkin/Jaeger)
management.tracing.enabled=${TRACING_ENABLED:false}
management.tracing.sampling.probability=${TRACING_SAMPLING_RATE:0.1}

# ============================================
# End of Production Configuration
# ============================================
