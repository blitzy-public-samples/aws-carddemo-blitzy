id: DAT-CARDFILE-normal-01
level: integration
type: normal
description: >-
  The CARDFILE job reloads the card master from its sequential copy and rebuilds the
  account-id alternate index [app/jcl/CARDFILE.jcl:22-124]. CLCIFIL and OPCIFIL close and
  reopen the region files CARDDAT and CARDAIX through SDSF CEMT commands; they are not
  exercised here (a no-op RC 0 on gnucobol-batch, GAP-STB-008; the no-op SDSF.cbl on the
  UniKix copy, GAP-DOC-031), so only their step lines are asserted. STEP05 deletes the
  existing cluster and alternate index, each DELETE followed by IF MAXCC LE 08 THEN SET
  MAXCC = 0; STEP10 defines the KSDS with KEYS(16 0) and RECORDSIZE(150 150); STEP15 REPROs
  the 50 carddata.txt records into it; STEP40 defines the alternate index KEYS(11 16)
  NONUNIQUEKEY UPGRADE, STEP50 the path over it and STEP60 builds it with BLDINDEX. The card
  master exists before the run holding one invented card that the input lacks, so the
  delete and define are observable: afterwards the cluster holds exactly the 50 input
  records in CARD-NUM order (CVACT02Y) and the invented card is gone. Read through the
  path, the same 50 records come back in CARD-ACCT-ID order, ties in CARD-NUM order;
  carddata.txt gives every card its own account, accounts 1 to 50. Every step ends RC 0.
  The baseline holds every record of both observations; the inline values pin the step
  lines, the record counts and the first and last record of each order.
inventory_ids:
- INV-DAT-006
tags: []
gap_ids:
- GAP-STB-005
- GAP-STB-008
- GAP-STB-009
- GAP-STB-010
- GAP-DOC-031
preconditions:
  datasets:
    CARDDATA-PS:
      base: CARDDATA-PS
    # The card master as a previous load left it, holding one invented card (no
    # real person, account or card) that carddata.txt lacks: only a DELETE and
    # DEFINE before the REPRO removes it.
    CARDDATA:
      records:
      - CARD-NUM: '9999999999999901'
        CARD-ACCT-ID: '99999999901'
        CARD-CVV-CD: '999'
        CARD-EMBOSSED-NAME: 'Stale Synthetic Card'
        CARD-EXPIRAION-DATE: '2099-12-31'
        CARD-ACTIVE-STATUS: 'N'
  parameters:
    clock_mode: relative
  faults: []
inputs:
  job: CARDFILE
expected:
  return_code: 0
  messages:
  - STEP CLCIFIL RC 0000
  - STEP STEP05 RC 0000
  - STEP STEP10 RC 0000
  - STEP STEP15 RC 0000
  - STEP STEP40 RC 0000
  - STEP STEP50 RC 0000
  - STEP STEP60 RC 0000
  - STEP OPCIFIL RC 0000
  datasets:
    # The 50 input records in CARD-NUM order, the invented card absent: the first
    # and last of them inline, every one in the baseline.
    CARDDATA:
      count: 50
      contains:
      - CARD-NUM: '0500024453765740'
        CARD-ACCT-ID: '50'
        CARD-CVV-CD: '747'
        CARD-EMBOSSED-NAME: 'Aniya Von                                         '
        CARD-EXPIRAION-DATE: '2023-03-09'
        CARD-ACTIVE-STATUS: 'Y'
      - CARD-NUM: '9805583408996588'
        CARD-ACCT-ID: '40'
        CARD-CVV-CD: '908'
        CARD-EMBOSSED-NAME: 'Davon Emmerich                                    '
        CARD-EXPIRAION-DATE: '2023-10-27'
        CARD-ACTIVE-STATUS: 'Y'
  file_state:
    # The same 50 records read through the path, in CARD-ACCT-ID order (accounts
    # 1 to 50, each with one card): the first and last of them inline.
    '@AIX:CARDAIX':
      count: 50
      contains:
      - CARD-NUM: '9680294154603697'
        CARD-ACCT-ID: '1'
        CARD-CVV-CD: '45'
        CARD-EMBOSSED-NAME: 'Immanuel Kessler                                  '
        CARD-EXPIRAION-DATE: '2025-05-20'
        CARD-ACTIVE-STATUS: 'Y'
      - CARD-NUM: '0500024453765740'
        CARD-ACCT-ID: '50'
        CARD-CVV-CD: '747'
        CARD-EMBOSSED-NAME: 'Aniya Von                                         '
        CARD-EXPIRAION-DATE: '2023-03-09'
        CARD-ACTIVE-STATUS: 'Y'
