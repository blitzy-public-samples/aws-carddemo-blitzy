# Time-bounded exceptions for the two infrastructure images this platform deploys.
#
# What this file is. The image scan of .github/workflows/ci.yml fails on a high or critical
# vulnerability that has a fix available. apache/kafka:4.2.1 carries thirteen and postgres:18.4
# carries fifteen, and every one of them is a package inside an image this project consumes rather
# than one it builds. Section 0.5.1 of the plan pins both versions and states why each newer image
# is deliberately not used, so raising a version is not a change this engagement may make. An
# exception is what the delivered gate accepts in its place, and each entry below carries the four
# things an exception needs: what is excused, who owns it, why it is accepted, and when it stops
# being accepted.
#
# What an expiry does. Trivy reads expired_at and stops honouring the entry the day after. The
# finding then returns and fails the image stage, which is what makes the date a decision rather
# than a comment. Every entry expires on the same day, so one review answers all of them.
#
# Owner. The project owner of this repository. This platform is a demonstration and has no
# operations team, so the owner is the person who accepts the demonstration posture the statements
# below rely on.
#
# What would close each group, in order of preference: an upstream image whose tag carries the
# fixed package; a rebuilt image this project publishes; or a documented decision to keep the
# finding with a fresh expiry. card-platform/docs/suggested-next-tasks.md carries the task.
#
# Scope. Nothing here excuses a finding in an image this project builds. The six service images are
# scanned in the same stage with no exception file at all, and their gate is zero fixable findings.
#
# Design decisions: card-platform/docs/decision-log.md, under "Two pinned infrastructure images
# carry a dated exception rather than an unpinned upgrade".

vulnerabilities:
  # postgres:18.4 - fifteen Go standard-library findings in one helper binary.
  - id: CVE-2025-61726
    paths:
      - usr/local/bin/gosu
    statement: >-
      postgres:18.4 | owner: project owner | Go standard-library finding compiled into usr/local/bin/gosu, the privilege-dropping helper the postgres entrypoint runs once to step down from root before exec'ing the server. The binary parses no network input, opens no socket and terminates by replacing itself with postgres, so the standard-library code these findings sit in is never reached. The path scope below is what keeps this entry from excusing the same identifier anywhere else in the image.
    expired_at: 2026-11-30
