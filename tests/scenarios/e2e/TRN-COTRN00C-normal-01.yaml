# First page of the COTRN00C transaction list, reached from the main menu.
#
# USER0001 (type U) signs on; COSGN00C transfers control to COMEN01C, which
# sends the main menu COMEN01. Option 6, right-justified to 06, selects
# COMEN02Y's 'Transaction List', program COTRN00C, and COMEN01C transfers control
# there with the program context reset to 0 [app/cbl/COMEN01C.cbl:115-157]
# [app/cpy/COMEN02Y.cpy:55-59].
#
# In that task COTRN00C [app/cbl/COTRN00C.cbl:107-116,146-229,279-328]:
# - copies the COMMAREA and, not yet re-entered, clears its output map to
#   LOW-VALUES and runs PROCESS-ENTER-KEY: no row is selected and the search
#   field is LOW-VALUES, so TRAN-ID is LOW-VALUES and the page number restarts
#   from 0;
# - STARTBRs TRANSACT at LOW-VALUES (GTEQ is the STARTBR default), so from the
#   lowest key; the task's AID is the ENTER that chose the menu option, so no
#   record is skipped; rows 1-10 are blanked and then filled from ten READNEXTs
#   in key order;
# - the look-ahead READNEXT finds an 11th record (0000000025430891), so the page
#   number becomes 1, NEXT-PAGE-YES is set and WS-MESSAGE stays blank;
# - sends COTRN00 with ERASE from PROCESS-PAGE-FORWARD and again from MAIN-PARA,
#   with the same content, and returns with TRANSID CT00. The last send is the
#   screen asserted.
# POPULATE-TRAN-DATA fills each row [app/cbl/COTRN00C.cbl:381-445]: TRAN-ID; the
# date MM/DD/YY taken from TRAN-ORIG-TS through WS-TIMESTAMP and
# WS-CURDATE-MM-DD-YY [app/cpy/CSDAT01Y.cpy:30-55]; the first 26 bytes of the
# 100-byte TRAN-DESC; and TRAN-AMT edited by WS-TRAN-AMT PIC +99999999.99
# [app/cbl/COTRN00C.cbl:56], a leading sign, 8 integer digits, the point and 2
# decimals. PAGENUM is the PIC 9(08) page number moved to the 8-byte PAGENUMI,
# hence '00000001' [app/cbl/COTRN00C.cbl:65,324] [app/cpy-bms/COTRN00.CPY:60].
# POPULATE-HEADER-INFO writes the titles, CT00, COTRN00C and the run date and
# time [app/cbl/COTRN00C.cbl:567-586] [app/cpy/COTTL01Y.cpy:18-22].
#
# Data: datasets.yaml defines TRANSACT as a built KSDS with no repository data,
# so `TRANSACT: {base: TRANSACT}` is refused; the derivation it offers is the
# repository's daily transactions as base. TRANSACT is therefore built from
# DALYTRAN, whose 350-byte records have the TRAN-RECORD byte layout
# [app/cpy/CVTRA06Y.cpy] [app/cpy/CVTRA05Y.cpy], loaded and ordered by TRAN-ID.
# The rows are the first ten keys of app/data/ASCII/dailytran.txt in key order;
# every one has TRAN-ORIG-TS 2022-06-10 19:27:53.000000, and the amounts are the
# overpunch-signed TRAN-AMT values (0000005047G = +504.77, 0000009190} = -919.00).
#
# Expected values are derived from the source (no TPE region runs in CI) and are
# whole fields at their BMS length, trailing spaces kept: comparison never trims.
# Fields left at LOW-VALUES show their BMS INITIAL (' ' for SEL0001-SEL0010).
# The main menu is asserted only by its identification fields: its content is
# covered by the COMEN01C (MNU) scenarios. CURDATE and CURTIME come from the run
# clock, so they are matchers and the clock is relative.
id: TRN-COTRN00C-normal-01
level: e2e
type: normal
description: >-
  USER0001 signs on and enters option 6 (Transaction List) on the main menu.
  COTRN00C, entered from the menu, browses TRANSACT from the lowest key and
  shows page 1 of the transaction list: the first 10 transactions in TRAN-ID
  order, each with its id, its origination date as MM/DD/YY, the first 26
  characters of its description and its amount edited as +99999999.99, a blank
  search field and a blank ERRMSG, since an 11th transaction exists. TRANSACT
  is built from the repository's DALYTRAN records (base DALYTRAN), because
  tests/fixtures/datasets.yaml gives TRANSACT no repository data of its own.
# Primary item first, then the program, the maps asserted, the transaction the
# list screen names and returns with, the CSD file browsed, and the online-only
# copybooks COTRN00C copies. The sign-on step's own items (COSGN00, CC00,
# USRSEC) belong to the SEC scenarios, and the menu option to
# MNU-COMEN01C-alternate-06.
inventory_ids:
- INV-TRN-022  # COTRN00C transaction list content (report): 10 rows per page
- INV-TRN-001  # COTRN00C program
- INV-MNU-003  # COMEN01 map, where option 6 is entered
- INV-TRN-004  # COTRN00 map, the list screen asserted
- INV-CFG-020  # CT00 transaction, TRNNAME and the RETURN TRANSID of the list
- INV-CFG-007  # TRANSACT CSD file, browsed by transaction id
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA carrying the paging keys
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the row dates and the screen date and time
- INV-LAY-008  # CSMSG01Y copybook, copied by COTRN00C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-007  # derived TRN end-to-end baselines, never observed on a TPE region
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    USRSEC: {base: USRSEC}
    TRANSACT: {base: DALYTRAN}
  parameters:
    clock_mode: relative
  faults: []
inputs:
