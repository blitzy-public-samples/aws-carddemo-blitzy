# An AID key other than ENTER, PF3 and PF4 on the User Add screen. ADMIN001
# signs on through CC00 and reaches the admin menu COADM01; option '2' makes
# COADM01C set CDEMO-PGM-CONTEXT to 0 and transfer control with XCTL to
# CDEMO-ADMIN-OPT-PGMNAME(2) = 'COUSR01C' [app/cbl/COADM01C.cbl:115-145]
# [app/cpy/COADM02Y.cpy:28-32]. On that first entry COUSR01C sets
# CDEMO-PGM-REENTER, clears COUSR1AO to LOW-VALUES, puts the cursor on FNAME,
# sends COUSR01 with its own header and a blank message line, and returns with
# TRANSID(CU01) and the COCOM01Y COMMAREA [app/cbl/COUSR01C.cbl:71-90,107-110,
# 184-197]. PF5 then starts CU01 again with that COMMAREA: COUSR01C receives
# the map, EVALUATE EIBAID handles only ENTER, PF3 and PF4, and WHEN OTHER sets
# WS-ERR-FLG, puts the cursor on FNAME and moves CCDA-MSG-INVALID-KEY of
# CSMSG01Y to WS-MESSAGE; SEND-USRADD-SCREEN rebuilds the header from COTTL01Y
# and CSDAT01Y and moves the message to ERRMSG [app/cbl/COUSR01C.cbl:91-103,
# 184-197,214-233] [app/cpy/CSMSG01Y.cpy:20-21]. No user is written: USRSEC is
# touched only by PROCESS-ENTER-KEY, so no file_state is asserted.
# FNAME, LNAME, USERID, PASSWD and USRTYPE are not asserted: on this path they
# are whatever the received map held, sent back unchanged, and carry no
# business outcome.
# Text fields are compared at their full BMS length with trailing spaces:
# ERRMSG is 78 bytes, the 40-character message followed by spaces from the
# 80-byte WS-MESSAGE. CURTIME is 8 bytes on COUSR01 and COADM01, so the
# hh:mm:ss matcher needs no padding. The baseline is derived from the source:
# no TPE region runs in CI.
id: USR-COUSR01C-negative-01
level: e2e
type: negative
description: >-
  ADMIN001 signs on, selects option 2 'User Add (Security)' on the admin menu
  and presses PF5 on the empty User Add screen COUSR01. COUSR01C accepts only
  ENTER, PF3 and PF4, so it sends COUSR01 again with its header (CU01,
  COUSR01C, the titles, the run date and time) and 'Invalid key pressed.
  Please see below...' in the message line; no user is added.
inventory_ids:
- INV-USR-022  # COUSR01C message 'Invalid key pressed. Please see below...' (rule)
- INV-USR-002  # COUSR01C program
- INV-MNU-004  # COADM01 map, the admin menu option 2 is entered on
- INV-USR-006  # COUSR01 map, the screen PF5 is pressed on and sent again
- INV-CFG-024  # CU01 transaction, under which PF5 is processed
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA that makes the PF5 entry a reentry
- INV-LAY-005  # COTTL01Y copybook, TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y copybook, CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y copybook, CCDA-MSG-INVALID-KEY
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-004  # USR end-to-end baselines derived from the source, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    # COSGN00C reads the sign-on user ADMIN001; this path writes nothing.
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: ADMIN001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '2'}
    '@map': COADM01
  - aid: PF5
    fields: {}
    '@map': COUSR01
expected:
  screens:
  - '@map': COADM01
    TRNNAME: CA00
    PGMNAME: COADM01C
    ERRMSG: '                                                                              '
  - '@map': COUSR01
    TRNNAME: CU01
    PGMNAME: COUSR01C
    ERRMSG: '                                                                              '
  - '@map': COUSR01
    TRNNAME: CU01
    PGMNAME: COUSR01C
    TITLE01: '      AWS Mainframe Modernization       '
    TITLE02: '              CardDemo                  '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    ERRMSG: 'Invalid key pressed. Please see below...                                      '
  # One ERRMSG value per step: blank on the admin menu and on the first User
  # Add screen, the invalid-key message after PF5.
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'Invalid key pressed. Please see below...                                      '
