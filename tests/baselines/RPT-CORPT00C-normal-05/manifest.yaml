# Manifest of the derived baseline of RPT-CORPT00C-normal-05: USER0001 signs
# on, takes main menu option 9 'Transaction Reports', marks CUSTOM with X,
# enters 01/01/2022 to 07/06/2022 and CONFIRM Y, so CORPT00C writes the 17
# records of job TRNRPT00, '/*EOF' last, to the TDQ JOBS with the window
# 2022-01-01 to 2022-07-06 and shows 'Custom report submitted for printing
# ...'. Only unikix can run the scenario, so expected.yaml was authored from
# [app/cbl/CORPT00C.cbl:81-127,163-186,212-456,462-523,556-646] and
# [app/cbl/COMEN01C.cbl:115-156], not captured, and is inferred-not-observed
# (GAP-INF-009, GAP-INF-012, GAP-INF-001; the JOBS capture needs GAP-MIS-017).
# It names no execution_id or execution_fingerprint and holds no datasets/
# until report.py --import-unikix promotes an eligible UniKix run.
#
# source_identity.units are the app/ sources the three steps execute, since
# harness.results gives an e2e run none: the COPY closure
# (inventory_tools.copy_closure) of COSGN00C, which signs USER0001 on and
# XCTLs to COMEN01C; of COMEN01C, whose option 9 XCTLs to CORPT00C
# [app/cpy/COMEN02Y.cpy:74-78]; and of CORPT00C; plus CSUTLDTC, which the
# custom-date edits CALL for the start and the end date
# [app/cbl/CORPT00C.cbl:392,412]; plus the BMS sources of the maps COSGN00,
# COMEN01 and CORPT00. app/proc/TRANREPT.prc is only named in the JOBS
# records, never executed here. DFHAID and DFHBMSCA are CICS-supplied, not
# app/ sources, so they are absent.
