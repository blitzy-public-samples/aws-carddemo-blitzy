# Derived baseline of scenario ACT-COACTUPC-negative-067, authored from the
# app/ source and never observed. Step 4 types 00 over ACTSSN2: 1265-EDIT-US-SSN
# edits part 2 through 1245-EDIT-NUM-REQD, which finds it supplied and numeric
# with NUMVAL 0 and STRINGs TRIM('SSN 4th & 5th chars') ' must not be zero.'
# into the 75-byte WS-RETURN-MSG; 3250 moves it to ERRMSG, PROMPT-FOR-CHANGES
# fills INFOMSG, 3203 shows ACTSSN2 as received, 3390 brightens FKEY12, and
# nothing is rewritten [app/cbl/COACTUPC.cbl:1240-1245,2109-2176,2467-2475,
# 2596-2597,2920-2928,2955-2983,3566-3581]. Screen values keep their full BMS
# width. The UniKix copy drops TRIM from this STRING; its outcome is UniKix-copy
# behavior and never replaces this file.
