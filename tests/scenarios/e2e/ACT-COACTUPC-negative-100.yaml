# COACTUPC refuses an account update whose Zip is 00000: the eighteenth field
# edit of 1200-EDIT-MAP-INPUTS runs 1245-EDIT-NUM-REQD on the first 5 bytes of
# the received zip, whose 'not zero' predicate composes 'Zip must not be
# zero.' [app/cbl/COACTUPC.cbl:1605-1611,2109-2172].
#
# Steps 1-3 sign on, choose main-menu option 2 and fetch account 00000000001
# as ACT-COACTUPC-alternate-03 does: the details of the account and of the
# invented customer 000000001 are shown with ACUP-SHOW-DETAILS in the returned
# COMMAREA, and 3320-UNPROTECT-FEW-ATTRS gives every editable field MDT on, so
# all of them come back on the next AID [app/cbl/COACTUPC.cbl:2568-2580,
# 2787-2865,3500-3561].
# Step 4 types 00000 over the Zip (ACSZIPC, shown as '27601') and presses
# ENTER:
# - 1100-RECEIVE-MAP moves the received '00000', neither '*' nor spaces, to
#   the 10-byte ACUP-NEW-CUST-ADDR-ZIP ('00000     ')
#   [app/cbl/COACTUPC.cbl:1350-1355].
# - 1205-COMPARE-OLD-NEW finds the trimmed new zip '00000' unequal to the
#   fetched '27601', so 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs
#   the field edits in screen order [app/cbl/COACTUPC.cbl:1460-1470,
#   1744-1747]. Account Status, the three dates and the five amounts pass on
#   the repository account; SSN, Date of Birth, FICO Score, the names,
#   Address Line 1 and State pass on the invented customer below.
# - The Zip edit moves 'Zip' to WS-EDIT-VARIABLE-NAME, the zip to
#   WS-EDIT-ALPHANUM-ONLY and 5 to WS-EDIT-ALPHANUM-LENGTH. 1245-EDIT-NUM-REQD
#   finds '00000' supplied and NUMERIC, but FUNCTION NUMVAL('00000') = 0, so
#   it sets INPUT-ERROR and FLG-ALPHNANUM-NOT-OK and, WS-RETURN-MSG being
#   still blank, STRINGs TRIM(WS-EDIT-VARIABLE-NAME) and ' must not be zero.'
#   into WS-RETURN-MSG [app/cbl/COACTUPC.cbl:2109-2172]. The flag moves on to
#   WS-EDIT-ZIPCODE-FLGS as FLG-ZIPCODE-NOT-OK [app/cbl/COACTUPC.cbl:
#   1610-1611,307-310].
# - City, Country, both phone numbers, EFT Account Id and Primary Card Holder
#   pass on the invented customer. The state/zip cross edit
#   1280-EDIT-US-STATE-ZIP-CD runs only when FLG-ZIPCODE-ISVALID, so it is
#   skipped and 'Invalid zip code for state' is never composed; it could not
#   overwrite the message anyway, as it STRINGs only while WS-RETURN-MSG-OFF
#   [app/cbl/COACTUPC.cbl:1664-1669,2536-2558].
# - 2000-DECIDE-ACTION continues on ACUP-CHANGES-NOT-OK, so 9600-WRITE-PROCESSING
#   (PF5 only) does not run and nothing is written [app/cbl/COACTUPC.cbl:
#   2562-2621].
# - 3203-SHOW-UPDATED-VALUES shows the received values, ACSZIPC as received
#   and the valid amounts re-edited through WS-EDIT-CURRENCY-9-2-F; 3250 sets
#   PROMPT-FOR-CHANGES; 3300 puts the cursor on ACSZIPC, and CSSETATY colours
#   it red without the '*' of a blank field; 3390 makes F12=Cancel bright
#   because changes were made, and leaves F5=Save dark [app/cbl/COACTUPC.cbl:
#   2870-2951,2955-2981,3126-3128,3376-3379,3566-3581]
#   [app/cpy/CSSETATY.cpy:17-26].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   ERRMSG is 'Zip must not be zero.' (21 characters) in the 75-byte
#   WS-RETURN-MSG, moved to the 78-byte ERRMSGO: 57 trailing spaces. ACSZIPC
#   is '00000', the first 5 bytes of ACUP-NEW-CUST-ADDR-ZIP, in its 5-byte
#   field. INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte INFOMSGO.
# - AADDGRP is sent as LOW-VALUES on screen 4 (the blank group id comes back as
#   spaces, which 1100 turns into LOW-VALUES); s3270 shows nulls as spaces.
# - A dark (DRK) field is captured as blanks; colour and cursor position are
#   not in the s3270 text capture and are not asserted. No upper-case
#   translation of input is assumed (CARDDEMO.CSD gives CAUP the profile
#   DFHCICST).
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit (the repository record has FICO 274, phone-2 area code 373 and zip
# 12546 for NC, which the FICO, phone and state/zip edits refuse), so the zero
# Zip is the only refused field [app/cbl/COACTUPC.cbl:2225-2558].
id: ACT-COACTUPC-negative-100
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update) and fetches
  account 00000000001, then types 00000 over the Zip and presses ENTER.
  COACTUPC refuses the change: the message line shows 'Zip must not be
  zero.', the Zip shows 00000 as typed, the other received values are shown
  again with the change prompt and F12=Cancel, and neither ACCTDATA nor
  CUSTDATA is rewritten.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. The change prompt 'Update account details presented above.'
# (INV-ACT-030) is asserted but verified by its own scenario. Sign-on (CC00,
# COSGN00, USRSEC) and the menu transaction are verified by the SEC and MNU
# scenarios; the batch record copybooks and the data files are verified at the
# lowest level that executes them.
inventory_ids:
- INV-ACT-158  # COACTUPC Zip: not zero (1245-EDIT-NUM-REQD)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the state-code and area-code lookups the other edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute set on ACSZIPC
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the four date edits, all passed
- INV-LAY-014  # CSUTLDWY: the date-edit working storage
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix COACTUPC strings the untrimmed 25-byte WS-EDIT-VARIABLE-NAME in
# 1245-EDIT-NUM-REQD (COACTUPC.cl2:2164-2170), so its message would read
# 'Zip                       must not be zero.'; a UniKix run never verifies
# the item, and the app/ text is pinned.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
