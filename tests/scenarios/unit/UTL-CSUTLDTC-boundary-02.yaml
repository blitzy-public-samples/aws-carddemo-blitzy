  - 'DTCDRV DATE=2023-02-29 MASK=YYYY-MM-DD RC=0003 RESULT=0003Mesg Code: 2508 Datevalue error TstDate: ..2023-02- Mask used:YYYY-MM-DD     HEX=303030334D65736720436F64653A2032353038204461746576616C7565206572726F7220547374446174653A20000A323032332D30322D204D61736B20757365643A595959592D4D4D2D444420202020'
