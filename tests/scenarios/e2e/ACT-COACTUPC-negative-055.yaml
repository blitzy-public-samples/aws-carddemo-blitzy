# COACTUPC refuses an account update whose Current Balance is erased: the
# supplied predicate of 1250-EDIT-SIGNED-9V2 for the Current Balance field
# [app/cbl/COACTUPC.cbl:2180-2221].
#
# Steps 1-3 reach the fetched account as ACT-COACTUPC-alternate-04 does:
# USER0001 signs on, chooses main-menu option 2 and asks for account
# 00000000001, whose cross-reference (card 9680294154603697, customer
# 000000001, line 49 of app/data/ASCII/cardxref.txt), account and customer are
# read and shown, every editable field unprotected with MDT on
# [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3500-3561,3608-3884].
# Step 4 erases the Current Balance (+        194.00) and presses ENTER; every
# other field keeps its fetched value. The tpe adapter clears a field with
# EraseEOF and types nothing for an empty value, so ACURBALI arrives as nulls
# (or spaces), and 1100-RECEIVE-MAP leaves ACUP-NEW-CURR-BAL-X at LOW-VALUES
# without computing ACUP-NEW-CURR-BAL-N [app/cbl/COACTUPC.cbl:1100-1112].
# - The task starts with WS-RETURN-MSG cleared [app/cbl/COACTUPC.cbl:876].
#   INITIALIZE ACUP-NEW-DETAILS left ACUP-NEW-CURR-BAL at SPACES
#   [app/cbl/COACTUPC.cbl:1047], so 1205-COMPARE-OLD-NEW finds it unequal to
#   the fetched balance and sets CHANGE-HAS-OCCURRED, and 1200-EDIT-MAP-INPUTS
#   sets ACUP-CHANGES-NOT-OK [app/cbl/COACTUPC.cbl:1460-1470,1681-1704].
# - The edits run in screen order [app/cbl/COACTUPC.cbl:1472-1513]: Account
#   Status Y, Open Date 2014-11-20, Credit Limit +      2,020.00, Expiry Date
#   2025-05-20, Cash Credit Limit +      1,020.00 and Reissue Date 2025-05-20
#   all pass, the amounts through TEST-NUMVAL-C and the dates through
#   CSUTLDPY and CSUTLDTC.
# - Current Balance: 1250-EDIT-SIGNED-9V2 finds WS-EDIT-SIGNED-NUMBER-9V2-X
#   LOW-VALUES, sets INPUT-ERROR and FLG-SIGNED-NUMBER-BLANK and, WS-RETURN-MSG
#   being SPACES, composes FUNCTION TRIM('Current Balance') followed by
#   ' must be supplied.' into WS-RETURN-MSG; 1200-EDIT-MAP-INPUTS moves the
#   blank flag to WS-EDIT-CURR-BAL [app/cbl/COACTUPC.cbl:1509-1513,2184-2197].
# - Every later edit passes on the invented customer below, and each composed
#   message is guarded by WS-RETURN-MSG-OFF, so the Current Balance message is
#   the one shown [app/cbl/COACTUPC.cbl:1515-1677].
# - 2000-DECIDE-ACTION only continues on ACUP-CHANGES-NOT-OK, so nothing is
#   read for update or rewritten [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES re-edits the valid amounts through
#   +ZZZ,ZZZ,ZZZ.99 and moves the LOW-VALUES ACUP-NEW-CURR-BAL-X to ACURBALO,
#   the balance flag not being valid; 3250-SETUP-INFOMSG shows
#   PROMPT-FOR-CHANGES and the message; 3320-UNPROTECT-FEW-ATTRS keeps the
#   fields editable; CSSETATY for CURR-BAL turns ACURBAL red and moves '*' into
#   it, because the balance flag is blank on a re-entry; 3390-SETUP-INFOMSG-
#   ATTRS makes F12=Cancel bright on a change and leaves F5=Save dark
#   [app/cbl/COACTUPC.cbl:2873-2895,2955-2981,2997-3000,3280-3284,3500-3561,
#   3566-3581] [app/cpy/CSSETATY.cpy:17-26].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   ERRMSG is the 33-character message in the 75-byte WS-RETURN-MSG, moved to
#   the 78-byte ERRMSGO; INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte
#   INFOMSGO; ACURBAL is '*' in the 15-byte field.
# - Colour and cursor position are not screen-field values, so the red ACURBAL
#   and the cursor set by 3300-SETUP-SCREEN-ATTRS are not asserted.
# - FKEY05 keeps its INITIAL text, dark (ASKIP,DRK), which the s3270 capture
#   renders as blanks.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
# - The UniKix copy of 1250-EDIT-SIGNED-9V2 strings WS-EDIT-VARIABLE-NAME
#   without FUNCTION TRIM, so on UniKix the message carries 'Current Balance'
#   padded to 25 characters before ' must be supplied.' (GAP-DOC-022); this
#   scenario pins the app/ text.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, as in the other COACTUPC update scenarios: the repository record has
# FICO 274 and zip 12546, which a later edit would also refuse
# [app/cbl/COACTUPC.cbl:2514-2558]. Account 00000000001 and its cross-reference
# stay as in the repository.
id: ACT-COACTUPC-negative-055
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001 (current balance 194.00), erases the Current Balance and
  presses ENTER. COACTUPC refuses the change with 'Current Balance must be
  supplied.' in the message line, keeps the screen editable with 'Update
  account details presented above.', marks the blank balance with '*', and
  offers F12=Cancel. Nothing is written: ACCTDATA and CUSTDATA still hold the
  fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-113  # COACTUPC Current Balance: supplied (1250-EDIT-SIGNED-9V2, rule)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the red attribute and '*' of the blank balance
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the date edits the account dates pass first
- INV-LAY-014  # CSUTLDWY: the date-edit work areas and flags
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-DOC-022  # the UniKix 1250-EDIT-SIGNED-9V2 drops TRIM from the field name
# Not in the planned gap list; cited as the other COACTUPC update scenarios
# cite it: the UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME
# stands.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
