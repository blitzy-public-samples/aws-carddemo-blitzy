# Derived baseline of scenario ACT-COACTUPC-negative-056 (capture_platform:
# derived), authored from the app/ source and never observed: no TPE region
# runs in CI. Open until a UniKix run of the app/ build is imported:
# GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012 (online-only
# copybooks).
# Steps 1-3: USER0001 signs on, option 2 XCTLs to COACTUPC, and ENTER with
# account 00000000001 shows the fetched account and customer with the change
# prompt [app/cbl/COACTUPC.cbl:2787-2865,2955-2981].
# Step 4: 1,2X4.00 over ACURBAL. 1100-RECEIVE-MAP keeps it as
# ACUP-NEW-CURR-BAL-X, since TEST-NUMVAL-C is not 0, so the balance differs
# from the old one and 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK. Account
# Status, the three account dates and both credit limits pass; then
# 1250-EDIT-SIGNED-9V2 finds the value supplied but TEST-NUMVAL-C non-zero at
# the letter X and, the message being still off, composes TRIM('Current
# Balance') ' is not valid' (28 characters) into WS-RETURN-MSG; no later edit
# can replace it [app/cbl/COACTUPC.cbl:1100-1112,1460-1513,2180-2221].
# 2000-DECIDE-ACTION continues, so nothing is rewritten; 3203 shows the
# balance as typed from ACUP-NEW-CURR-BAL-X, 3250 sets PROMPT-FOR-CHANGES and
# moves the message to ERRMSG, and 3390 brightens FKEY12 because a change was
# made; the red ACURBAL and the cursor on it are attributes, not captured field
# values [app/cbl/COACTUPC.cbl:2596-2597,2890-2894,2955-2983,3566-3581].
# ACURBAL holds the 8 typed characters and 7 blanks: tpe.py erases to the end
# of the field before typing.
# This pins the app/ text: the UniKix COACTUPC comments out these amount
# checks, so its copy would accept the value (GAP-DOC-022); such a record is
# UniKix-copy behavior and never replaces this file.
# Screen values are full BMS width with trailing spaces kept (ERRMSG 78,
# INFOMSG 45, ACURBAL 15), because screens compare exactly. CURDATE and
# CURTIME come from the region clock, which no confirmed command sets
# (GAP-MIS-015), so they keep the scenario's matchers. file_state holds the
# records as the preconditions materialize them, decoded through CVACT01Y and
# CVCUS01Y.
