# Derived baseline of scenario ACT-COACTUPC-negative-058 (capture_platform:
# derived), authored from the app/ source and never observed: no TPE region
# runs in CI. Open until a UniKix run of the app/ build is imported:
# GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012 (online-only
# copybooks such as CSSETATY).
# Steps 1-3: USER0001 signs on, option 2 XCTLs to COACTUPC, and ENTER with
# account 00000000001 shows the fetched account and customer with the change
# prompt [app/cbl/COACTUPC.cbl:2787-2865,2955-2981].
# Step 4: ACRCYCR is erased and ABC typed, so ACUP-NEW-CURR-CYC-CREDIT-X holds
# ABC padded to 15; TEST-NUMVAL-C refuses it, so NUMVAL-C is not applied and
# the value differs from the fetched 0.00. 1200-EDIT-MAP-INPUTS sets
# ACUP-CHANGES-NOT-OK and edits the fields in order. Every edit before it
# passes on these fixtures; then 1250-EDIT-SIGNED-9V2 finds the field supplied
# but TEST-NUMVAL-C non-zero and, the message being still off, STRINGs
# TRIM(WS-EDIT-VARIABLE-NAME) and ' is not valid' into WS-RETURN-MSG; no later
# edit can replace it [app/cbl/COACTUPC.cbl:1114-1126,1460-1520,2180-2213].
# ERRMSG pins the X(25) truncation of the field name: the 26-character literal
# 'Current Cycle Credit Limit' moved into WS-EDIT-VARIABLE-NAME keeps
# 'Current Cycle Credit Limi', so the line reads 'Current Cycle Credit Limi is
# not valid' (38 characters). The item is worded with the full name; the
# source text is pinned as produced (GAP-DEF-018) and never corrected
# [app/cbl/COACTUPC.cbl:53,1515].
# 2000-DECIDE-ACTION continues, so nothing is rewritten; 3203 moves the refused
# ACUP-NEW-CURR-CYC-CREDIT-X to ACRCYCRO as typed, 3250 sets
# PROMPT-FOR-CHANGES and moves the message to ERRMSG, CSSETATY colours the
# field red without the '*' of a blank one, and 3390 brightens FKEY12 because
# a change was made; the colour and the cursor on ACRCYCR are attributes, not
# captured field values [app/cbl/COACTUPC.cbl:2596-2597,2896-2902,2955-2981,
# 3069-3072,3285-3289,3566-3581] [app/cpy/CSSETATY.cpy:17-26].
# This pins the app/ behavior: the UniKix COACTUPC comments out the
# TEST-NUMVAL-C checks of this edit, so ABC is not refused there
# (GAP-DOC-022); such a record is UniKix-copy behavior and never replaces this
# file.
# Screen values are full BMS width with trailing spaces kept (ERRMSG 78,
# INFOMSG 45, ACRCYCR 15), because screens compare exactly; tpe.py erases a
# field before typing, so ACRCYCR is ABC followed by 12 spaces. CURDATE and
# CURTIME come from the region clock, which no confirmed command sets
# (GAP-MIS-015), so they keep the scenario's matchers. file_state holds the
# records as the preconditions materialize them, decoded through CVACT01Y and
# CVCUS01Y: the refusal rewrites neither file.
