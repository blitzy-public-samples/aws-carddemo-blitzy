# COACTUPC refuses a non-numeric reissue day: the numeric predicate of
# EDIT-DAY in the procedure copybook CSUTLDPY, which COACTUPC performs for the
# Reissue Date field [app/cpy/CSUTLDPY.cpy:150-207] [app/cbl/COACTUPC.cbl:1503-1507].
#
# Steps 1-3 sign on as USER0001, choose main-menu option 2 and fetch account
# 00000000001, as ACT-COACTUPC-alternate-04 does: CXACAIX gives customer
# 000000001 (card 9680294154603697, line 49 of app/data/ASCII/cardxref.txt),
# ACCTDAT and CUSTDAT are read without UPDATE, and 3202-SHOW-ORIGINAL-VALUES
# shows the records with 'Update account details presented above.'; every
# editable field is DFHBMFSE (unprotected, MDT on), so all of them come back
# on the next AID [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3500-3561,3608-3884].
# Step 4 types Z9 over the reissue day 20 and presses ENTER. RISDAY is UNPROT
# without NUM, so the terminal accepts the letter [app/bms/COACTUP.bms:196-200].
# - 1100-RECEIVE-MAP moves Z9 to ACUP-NEW-REISSUE-DAY
#   [app/cbl/COACTUPC.cbl:1204-1209].
# - 1205-COMPARE-OLD-NEW finds ACUP-NEW-REISSUE-DATE (202505Z9) unequal to the
#   fetched 20250520, so 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and
#   runs the field edits in screen order [app/cbl/COACTUPC.cbl:1460-1476,
#   1681-1705].
# - Account Status, Open Date, Credit Limit, Expiry Date and Cash Credit Limit
#   pass on the fetched values [app/cbl/COACTUPC.cbl:1472-1501].
# - Reissue Date: WS-EDIT-VARIABLE-NAME becomes 'Reissue Date' and
#   EDIT-DATE-CCYYMMDD runs through to its exit [app/cbl/COACTUPC.cbl:1503-1507].
#   EDIT-YEAR-CCYY accepts 2025 and EDIT-MONTH accepts 05. EDIT-DAY finds Z9
#   neither LOW-VALUES nor spaces, and FUNCTION TEST-NUMVAL('Z9') is not 0
#   (Z is no numeric character), so it sets INPUT-ERROR and FLG-DAY-NOT-OK
#   and, the message being still off, STRINGs the trimmed field name and
#   ':day must be a number between 1 and 31.' into WS-RETURN-MSG, then goes to
#   EDIT-DAY-EXIT [app/cpy/CSUTLDPY.cpy:170-185]. EDIT-DAY-MONTH-YEAR finds May
#   a 31-day month and not February, and the date flags no longer all valid,
#   so it goes to EDIT-DATE-CCYYMMDD-EXIT: CSUTLDTC is not called
#   [app/cpy/CSUTLDPY.cpy:209-282] [app/cpy/CSUTLDWY.cpy:43-57].
# - Every later edit passes on the invented customer below, and an edit writes
#   its message only while WS-RETURN-MSG-OFF holds, so this message stays.
# - INPUT-ERROR leaves ACUP-CHANGES-NOT-OK, which 2000-DECIDE-ACTION only
#   continues on: no READ UPDATE or REWRITE runs [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values, Z9 included, with the
#   valid amounts re-edited through +ZZZ,ZZZ,ZZZ.99; 3250-SETUP-INFOMSG sets
#   PROMPT-FOR-CHANGES and moves WS-RETURN-MSG to ERRMSG; 3300 keeps the
#   fields editable, CSSETATY turns RISDAY red (no '*', the field is not
#   blank) while RISYEAR and RISMON stay valid, and the cursor goes to RISDAY;
#   3390 makes F12=Cancel bright, while F5=Save stays dark without a
#   confirmation prompt [app/cbl/COACTUPC.cbl:2718-2720,2870-2951,2964-2981,
#   2986-3019,3061-3063,3274-3278,3566-3581] [app/cpy/CSSETATY.cpy].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - ERRMSG is 'Reissue Date' (the trimmed X(25) WS-EDIT-VARIABLE-NAME) and
#   ':day must be a number between 1 and 31.', 51 characters, in the 75-byte
#   WS-RETURN-MSG and the 78-byte ERRMSGO. The day-range predicate (INV-ACT-108)
#   composes the same text, but it is never reached: the numeric check exits
#   EDIT-DAY first.
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   FKEY05 is dark (ASKIP,DRK) and the s3270 capture renders it as blanks.
# - The tpe adapter enters a field with EraseEOF before typing. No upper-case
#   translation of input is assumed: CARDDEMO.CSD defines none for CAUP.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every other
# COACTUPC edit: the repository record has FICO 274, below 300, and zip 12546,
# which is not a North Carolina zip [app/cbl/COACTUPC.cbl:2514-2558]. Area code
# 919 is a general-purpose code and NC27 a valid state and zip pair
# [app/cpy/CSLKPCDY.cpy:521,895,1186]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-049
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001 with its customer 000000001, changes the reissue day
  from 20 to Z9 and presses ENTER. COACTUPC refuses the value: the message
  line shows 'Reissue Date:day must be a number between 1 and 31.', the screen
  keeps the entered values, Z9 included, editable under 'Update account
  details presented above.', and F12=Cancel is shown while F5=Save is not.
  Nothing is saved: ACCTDATA and CUSTDATA still hold the fetched records, the
  reissue date still 2025-05-20.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-107  # COACTUPC Reissue Date: day numeric (EDIT-DAY field edit)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute set on RISDAY
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-DAY, which refuses Z9, and the other date edits
- INV-LAY-014  # CSUTLDWY: the date-edit work areas and flags
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY tests the day with IS NUMERIC instead of TEST-NUMVAL and
# drops FUNCTION TRIM from the field name, so the ERRMSG of screen 4 differs
# on UniKix.
- GAP-DOC-024
# The UniKix COACTUPC comments out the amount checks of 1250-EDIT-SIGNED-9V2,
# whose flags decide how screen 4 shows the amounts.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
