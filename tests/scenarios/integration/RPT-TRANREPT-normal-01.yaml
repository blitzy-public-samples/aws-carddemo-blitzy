  datasets:
    # The REPROC unload: every TRANSACT record, in primary-key (TRAN-ID) order.
    TRANSACT-BKUP:
      records:
      - {TRAN-ID: '9100000000000001', TRAN-CARD-NUM: '9680294154603697', TRAN-AMT: '45.67', TRAN-PROC-TS: '2022-03-15-10.00.00.000000'}
      - {TRAN-ID: '9100000000000002', TRAN-CARD-NUM: '0500024453765740', TRAN-AMT: '120.00', TRAN-PROC-TS: '2021-12-31-23.59.59.999999'}
      - {TRAN-ID: '9100000000000003', TRAN-CARD-NUM: '0683586198171516', TRAN-AMT: '-75.25', TRAN-PROC-TS: '2022-01-01-00.00.00.000000'}
