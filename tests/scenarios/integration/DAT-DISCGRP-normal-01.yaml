      - {DIS-ACCT-GROUP-ID: 'A000000000', DIS-TRAN-TYPE-CD: '01', DIS-TRAN-CAT-CD: '1', DIS-INT-RATE: '15.00', DIS-GROUP-RECORD.FILLER#1: '0000000000000000000000000000'}
