# Derived from source (capture_platform: derived), never observed; tagged
# inferred-not-observed under GAP-INF-007 and GAP-INF-012.
# Step 2: first entry from the main menu lists page 1 of TRANSACT with a blank
# search field and no message [app/cbl/COTRN00C.cbl:111-116,206-229,279-328].
# Step 3: TRNIDIN 'ABC' is not numeric, so the map is re-sent with
# 'Tran ID must be Numeric ...'; the header is rebuilt, every other field echoes
# what the terminal returned (all FSET), and ERR-FLG keeps TRNIDIN and skips the
# second send [app/cbl/COTRN00C.cbl:206-229,281-328,527-586].
# This holds only while STARTBR finds a record: an empty or unavailable TRANSACT
# would overwrite the message with 'You are at the top of the page...' or
# 'Unable to lookup transaction...' [app/cbl/COTRN00C.cbl:591-619].
# Text fields are at full BMS width with trailing spaces kept; CURDATE and
# CURTIME come from the region clock, so they are matchers.
