# COACTUPC refuses an account update whose Date of Birth is the 30th of
# February: EDIT-DAY-MONTH-YEAR of the shared date edit CSUTLDPY tests
# WS-FEBRUARY with WS-DAY-30 and composes 'Date of Birth:Cannot have 30 days
# in this month.' [app/cpy/CSUTLDPY.cpy:228-241] [app/cpy/CSUTLDWY.cpy:16-31].
# The year is 1960, a leap year: the 30th-of-February check precedes the
# leap-year test of the 29th [app/cpy/CSUTLDPY.cpy:243-272], so the 30-day
# check alone refuses the date.
#
# Steps 1-3 reach the fetched account as ACT-COACTUPC-alternate-04 does:
# USER0001 signs on through CC00, chooses option 2 (Account Update) on COMEN01,
# and enters account 00000000001. 9000-READ-ACCT reads CXACAIX by account id
# (card 9680294154603697, customer 000000001, line 49 of
# app/data/ASCII/cardxref.txt), ACCTDAT and CUSTDAT, keeps the records as the
# old values in the COMMAREA and sets ACUP-SHOW-DETAILS; the screen shows them
# with 'Update account details presented above.', every editable field
# unprotected with its MDT on [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,
# 2955-3000,3441-3561,3608-3884].
# Step 4 types 1960, 02 and 30 over the date-of-birth year, month and day
# (DOBYEAR, DOBMON, DOBDAY) and presses ENTER.
# - 1100-RECEIVE-MAP moves them to ACUP-NEW-CUST-DOB-YEAR, -MON and -DAY and
#   every other returned field to ACUP-NEW-DETAILS [app/cbl/COACTUPC.cbl:
#   1039-1230,1256-1274]. 1205-COMPARE-OLD-NEW finds the change from
#   1961-06-08 [app/cbl/COACTUPC.cbl:1759-1760], so 1200-EDIT-MAP-INPUTS sets
#   ACUP-CHANGES-NOT-OK and runs the field edits in screen order
#   [app/cbl/COACTUPC.cbl:1460-1470].
# - Account Status 'Y', Open Date 2014-11-20, Credit Limit, Expiry Date
#   2025-05-20, Cash Credit Limit, Reissue Date 2025-05-20, Current Balance,
#   the cycle credit and debit, and SSN 123-45-6789 pass their edits
#   [app/cbl/COACTUPC.cbl:1472-1531,2431-2489]. Date of Birth is moved as
#   '19600230' to WS-EDIT-DATE-CCYYMMDD under the name 'Date of Birth'
#   [app/cbl/COACTUPC.cbl:1533-1538]. EDIT-YEAR-CCYY accepts 1960 (century
#   19), EDIT-MONTH accepts 02 and EDIT-DAY accepts 30 as a number between 1
#   and 31 [app/cpy/CSUTLDPY.cpy:25-207]. EDIT-DAY-MONTH-YEAR skips the 31st
#   check, then finds WS-FEBRUARY and WS-DAY-30: it sets INPUT-ERROR,
#   FLG-DAY-NOT-OK and FLG-MONTH-NOT-OK and, WS-RETURN-MSG being still blank
#   [app/cbl/COACTUPC.cbl:876], STRINGs the trimmed field name and the
#   template into WS-RETURN-MSG, then leaves through EDIT-DATE-CCYYMMDD-EXIT,
#   so CSUTLDTC is not called for this date [app/cpy/CSUTLDPY.cpy:209-241].
#   The flags leave WS-EDIT-DT-OF-BIRTH-ISVALID false, so EDIT-DATE-OF-BIRTH
#   (the not-in-the-future test) does not run [app/cbl/COACTUPC.cbl:216-230,
#   1538-1543].
# - Every later edit passes on the invented customer below; they only set
#   their flags, since WS-RETURN-MSG is no longer blank [app/cbl/COACTUPC.cbl:
#   1545-1676]. INPUT-ERROR keeps ACUP-CHANGES-NOT-OK, and 2000-DECIDE-ACTION
#   continues on it, so 9600-WRITE-PROCESSING, the only READ UPDATE and
#   REWRITE path, does not run [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values, the valid amounts
#   re-edited through +ZZZ,ZZZ,ZZZ.99 and the date of birth as typed
#   [app/cbl/COACTUPC.cbl:2870-2951]; 3250 sets PROMPT-FOR-CHANGES and moves
#   the message to ERRMSG; 3300 keeps the fields editable, marks DOBMON and
#   DOBDAY red through CSSETATY and puts the cursor on DOBMON, the first field
#   whose flag is not OK (the year flag stays valid); 3390 makes F12=Cancel
#   bright because changes were made, while F5=Save stays dark
#   [app/cbl/COACTUPC.cbl:2955-2983,3007-3100,3316-3331,3566-3581].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - The message is TRIM('Date of Birth') followed by ':Cannot have 30 days in
#   this month.', 48 characters of the 75-byte WS-RETURN-MSG, shown in the
#   78-byte ERRMSG with trailing spaces. INFOMSG is the 40-byte WS-INFO-MSG in
#   the 45-byte field. Fields are compared at their full BMS length, trailing
#   spaces kept.
# - FKEY05 and FKEY12 keep their INITIAL text; a dark (ASKIP,DRK) field is
#   captured as blanks.
# - The tpe adapter enters a field with EraseEOF before typing; DOBYEAR is four
#   bytes and DOBMON and DOBDAY two, so the values fill them.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, so the date of birth is the only field refused: the repository record
# has FICO 274, below 300, and zip 12546, which is not a North Carolina zip
# [app/cbl/COACTUPC.cbl:2514-2558]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-081
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001, whose customer's date of birth is 1961-06-08, changes
  the date of birth to 1960-02-30 and presses ENTER. February cannot have a
  30th day, leap year or not, so COACTUPC refuses the change: it shows the
  received values again, editable, with 'Date of Birth:Cannot have 30 days in
  this month.' in the message line, the change prompt 'Update account details
  presented above.' and F12=Cancel made visible. Nothing is saved: ACCTDATA
  and CUSTDATA still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-139  # COACTUPC Date of Birth: no 30th of February (EDIT-DAY-MONTH-YEAR)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute set on DOBMON and DOBDAY
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-DAY-MONTH-YEAR, which refuses the date
- INV-LAY-014  # CSUTLDWY: the WS-FEBRUARY and WS-DAY-30 88-levels
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY drops TRIM from the field name, so on UniKix the message
# carries the 25-byte name 'Date of Birth' padded with spaces before
# ':Cannot ...'.
- GAP-DOC-024
# The UniKix COACTUPC comments out the TEST-NUMVAL-C amount checks this path
# runs and drops TRIM from the change detection of the date of birth, so the
# amounts on screen 4 may differ on UniKix.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
