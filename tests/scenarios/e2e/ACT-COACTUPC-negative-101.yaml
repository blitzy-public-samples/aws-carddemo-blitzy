    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
# PASSWORD is the documented demo password of README.md, not a secret.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACSCITY: ''
