openapi: 3.0.3
info:
  title: OCR Processing Application API
  version: v1.0.0
  description: |
    Comprehensive REST API for the OCR Processing Application that provides document OCR processing, 
    intelligent data extraction, template management, batch processing, and third-party integrations.
    
    ## Features
    - Document upload and OCR processing with confidence scoring
    - Custom extraction templates with visual zone selection
    - Batch processing for high-volume document handling
    - Full-text search across all processed documents
    - Data export in multiple formats (JSON, CSV, XML, Excel)
    - Native integrations with QuickBooks, Salesforce, and NetSuite
    - Real-time webhook notifications
    - Comprehensive analytics and reporting
    
    ## Authentication
    This API supports three authentication methods:
    1. **JWT Bearer Tokens** - For web application users
    2. **API Keys** - For programmatic access and integrations
    3. **OAuth 2.0** - For third-party applications (Google, Microsoft)
    
    ## Rate Limiting
    API requests are rate-limited to 1000 requests per hour per account. 
    Rate limit information is included in response headers:
    - `X-RateLimit-Limit`: Maximum requests per hour
    - `X-RateLimit-Remaining`: Remaining requests in current window
    - `X-RateLimit-Reset`: Unix timestamp when limit resets
    
    ## Versioning
    This API uses URL versioning (e.g., /api/v1/). Multiple versions are supported 
    simultaneously for backward compatibility.
  contact:
    name: OCR Application API Support
    email: api-support@ocr-app.com
    url: https://docs.ocr-app.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://ocr-app.com/terms

servers:
  - url: http://localhost:3000/api/v1
    description: Local development server
  - url: https://staging-api.ocr-app.com/api/v1
    description: Staging environment for testing
  - url: https://api.ocr-app.com/api/v1
    description: Production environment

tags:
  - name: Authentication
    description: User authentication and authorization endpoints
  - name: Users
    description: User management and profile operations
  - name: Documents
    description: Document upload, retrieval, and management
  - name: Processing
    description: OCR processing jobs and batch operations
  - name: Templates
    description: Custom extraction template management
  - name: Search
    description: Full-text search and advanced filtering
  - name: Export
    description: Data export in various formats
  - name: Integrations
    description: Third-party system integrations and webhooks
  - name: API Keys
    description: API key generation and management
  - name: Analytics
    description: Usage analytics and reporting
  - name: Audit
    description: Audit log access and compliance

security:
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  # ============================================================================
  # AUTHENTICATION ENDPOINTS
  # ============================================================================
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user account
      description: Creates a new user account with email and password authentication
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - firstName
                - lastName
                - accountName
              properties:
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: Must contain uppercase, lowercase, number, and special character
                  example: SecureP@ss123
                firstName:
                  type: string
                  minLength: 1
                  maxLength: 50
                  example: John
                lastName:
                  type: string
                  minLength: 1
                  maxLength: 50
                  example: Doe
                accountName:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Name for the new organization account
                  example: Acme Corporation
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      accessToken:
                        type: string
                        description: JWT access token (expires in 15 minutes)
                      refreshToken:
                        type: string
                        description: JWT refresh token (expires in 7 days)
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login with email and password
      description: Authenticates user and returns JWT tokens
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                password:
                  type: string
                  format: password
                  example: SecureP@ss123
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Generates a new access token using a valid refresh token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: Valid refresh token
      responses:
        '200':
          description: New tokens generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout current user
      description: Invalidates the current refresh token
      operationId: logoutUser
      responses:
        '204':
          description: Successfully logged out
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/google:
    get:
      tags:
        - Authentication
      summary: Initiate Google OAuth flow
      description: Redirects to Google consent screen for OAuth authentication
      operationId: googleOAuthInit
      security: []
      responses:
        '302':
          description: Redirect to Google OAuth consent screen

  /auth/google/callback:
    get:
      tags:
        - Authentication
      summary: Google OAuth callback
      description: Handles OAuth callback from Google and returns JWT tokens
      operationId: googleOAuthCallback
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Authorization code from Google
        - name: state
          in: query
          schema:
            type: string
          description: State parameter for CSRF protection
      responses:
        '302':
          description: Redirect to application with tokens in URL
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/microsoft:
    get:
      tags:
        - Authentication
      summary: Initiate Microsoft OAuth flow
      description: Redirects to Microsoft consent screen for OAuth authentication
      operationId: microsoftOAuthInit
      security: []
      responses:
        '302':
          description: Redirect to Microsoft OAuth consent screen

  /auth/microsoft/callback:
    get:
      tags:
        - Authentication
      summary: Microsoft OAuth callback
      description: Handles OAuth callback from Microsoft and returns JWT tokens
      operationId: microsoftOAuthCallback
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Authorization code from Microsoft
        - name: state
          in: query
          schema:
            type: string
          description: State parameter for CSRF protection
      responses:
        '302':
          description: Redirect to application with tokens in URL
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: Sends password reset email to user
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
      responses:
        '200':
          description: Password reset email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Password reset instructions sent to email
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password
      description: Resets user password using reset token from email
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                  description: Password reset token from email
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  example: NewSecureP@ss123
      responses:
        '200':
          description: Password successfully reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Password successfully reset
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ============================================================================
  # USER MANAGEMENT ENDPOINTS
  # ============================================================================
  /users:
    get:
      tags:
        - Users
      summary: List users
      description: Retrieves paginated list of users in the account
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, user]
          description: Filter by user role
        - name: search
          in: query
          schema:
            type: string
          description: Search by name or email
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieves detailed information about a specific user
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Users
      summary: Update user
      description: Updates user information (partial update)
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  minLength: 1
                  maxLength: 50
                lastName:
                  type: string
                  minLength: 1
                  maxLength: 50
                role:
                  type: string
                  enum: [admin, user]
                  description: Requires admin privileges to change
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Users
      summary: Delete user
      description: Deletes a user account (requires admin role)
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted successfully
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # DOCUMENT ENDPOINTS
  # ============================================================================
  /documents/upload:
    post:
      tags:
        - Documents
      summary: Upload document for OCR processing
      description: |
        Uploads a document file for OCR processing. Supported formats: PDF, JPG, PNG, TIFF.
        Maximum file size: 50MB. File is virus scanned before processing.
      operationId: uploadDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Document file to process
                templateId:
                  type: string
                  format: uuid
                  description: Optional template ID for structured extraction
                metadata:
                  type: string
                  description: JSON string with additional metadata
                  example: '{"invoice_number": "INV-001", "vendor": "Acme Corp"}'
      responses:
        '201':
          description: Document uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Document'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  /documents:
    get:
      tags:
        - Documents
      summary: List documents
      description: Retrieves paginated list of documents with optional filtering
      operationId: listDocuments
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, processing, completed, failed, approved]
          description: Filter by document status
        - name: type
          in: query
          schema:
            type: string
          description: Filter by document type
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
          description: Filter documents uploaded from this date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
          description: Filter documents uploaded until this date
        - name: search
          in: query
          schema:
            type: string
          description: Search in document filename and extracted content
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Document'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /documents/{id}:
    get:
      tags:
        - Documents
      summary: Get document by ID
      description: Retrieves detailed document information including extracted data
      operationId: getDocumentById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Document'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Documents
      summary: Update document
      description: Updates document metadata, status, or extracted data
      operationId: updateDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
                extractedData:
                  type: object
                  description: Updated extracted data fields
                notes:
                  type: string
                  description: User notes or comments
      responses:
        '200':
          description: Document updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Document'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Documents
      summary: Delete document
      description: Permanently deletes document and all associated data
      operationId: deleteDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Document deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'

  /documents/{id}/fields/{fieldId}:
    patch:
      tags:
        - Documents
      summary: Update document field
      description: |
        Updates a specific extracted field value. Corrections are logged for ML training.
      operationId: updateDocumentField
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: fieldId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
              properties:
                value:
                  type: string
                  description: Corrected field value
                confidenceScore:
                  type: number
                  minimum: 0
                  maximum: 100
                  description: Optional manual confidence score
      responses:
        '200':
          description: Field updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ExtractedField'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /documents/{id}/approve:
    post:
      tags:
        - Documents
      summary: Approve document
      description: Marks document as approved and triggers configured webhooks
      operationId: approveDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document approved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Document'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          $ref: '#/components/responses/NotFound'

  /documents/{id}/history:
    get:
      tags:
        - Documents
      summary: Get document history
      description: Retrieves version history and changes for a document
      operationId: getDocumentHistory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentVersion'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # PROCESSING ENDPOINTS
  # ============================================================================
  /processing/batch:
    post:
      tags:
        - Processing
      summary: Create batch processing job
      description: |
        Uploads multiple documents for batch processing. Maximum 100 documents per batch.
      operationId: createBatchJob
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
              properties:
                files:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                    format: binary
                  description: Array of document files
                templateId:
                  type: string
                  format: uuid
                  description: Optional template for all documents
                priority:
                  type: string
                  enum: [normal, high]
                  default: normal
                  description: Processing priority
      responses:
        '201':
          description: Batch job created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProcessingJob'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /processing/jobs/{jobId}:
    get:
      tags:
        - Processing
      summary: Get processing job status
      description: Retrieves detailed status and progress of a processing job
      operationId: getProcessingJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProcessingJob'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          $ref: '#/components/responses/NotFound'

  /processing/jobs/{jobId}/cancel:
    post:
      tags:
        - Processing
      summary: Cancel processing job
      description: Cancels unprocessed documents in a batch job
      operationId: cancelProcessingJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Processing job cancelled
                      cancelledCount:
                        type: integer
                        description: Number of documents cancelled
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # TEMPLATE ENDPOINTS
  # ============================================================================
  /templates:
    get:
      tags:
        - Templates
      summary: List templates
      description: Retrieves paginated list of extraction templates
      operationId: listTemplates
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: documentType
          in: query
          schema:
            type: string
          description: Filter by document type
        - name: search
          in: query
          schema:
            type: string
          description: Search in template name
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Template'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

    post:
      tags:
        - Templates
      summary: Create template
      description: Creates a new extraction template with zones and field definitions
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateInput'
      responses:
        '201':
          description: Template created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
