# COACTUPC refuses a Phone Number 1 whose prefix is blank while its area code
# and line number are entered: the prefix-supplied predicate of
# EDIT-US-PHONE-PREFIX in 1260-EDIT-US-PHONE-NUM, for the Phone Number 1 field
# [app/cbl/COACTUPC.cbl:1632-1638,2316-2333].
#
# Steps 1-3 sign on as USER0001, choose main-menu option 2 and fetch account
# 00000000001, as ACT-COACTUPC-alternate-04 does: CXACAIX gives customer
# 000000001 (card 9680294154603697, line 49 of app/data/ASCII/cardxref.txt),
# ACCTDAT and CUSTDAT are read without UPDATE, and 3202-SHOW-ORIGINAL-VALUES
# shows the records with 'Update account details presented above.', the
# phone number split over ACSPH1A, ACSPH1B and ACSPH1C; every editable field
# is DFHBMFSE (unprotected, MDT on), so all of them come back on the next AID
# [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3500-3561,3608-3884].
# Step 4 erases the prefix (555) of Phone Number 1 and presses ENTER.
# - 1100-RECEIVE-MAP leaves ACUP-NEW-CUST-PHONE-NUM-1B at LOW-VALUES whether
#   the erased field arrives as spaces (moved as LOW-VALUES) or as nulls (moved
#   as received); the area code 919 and line number 0101 are received as shown
#   [app/cbl/COACTUPC.cbl:1357-1376].
# - 1205-COMPARE-OLD-NEW finds the prefix different from the fetched 555, so
#   1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs the field edits in
#   screen order [app/cbl/COACTUPC.cbl:1460-1470,1681-1777]. Account Status,
#   the three account dates, the five amounts, the SSN, the Date of Birth, the
#   FICO Score, the names, Address Line 1, State, Zip, City and Country pass
#   on the fetched values [app/cbl/COACTUPC.cbl:1472-1630].
# - Phone Number 1 moves the field name and ACUP-NEW-CUST-PHONE-NUM-1 to
#   WS-EDIT-US-PHONE-NUM and performs 1260-EDIT-US-PHONE-NUM through its exit
#   [app/cbl/COACTUPC.cbl:1632-1636]. The area code is not blank, so the
#   wholly-blank acceptance does not apply [app/cbl/COACTUPC.cbl:2232-2244].
#   EDIT-AREA-CODE passes 919: supplied, numeric, not zero and a North America
#   general-purpose code [app/cbl/COACTUPC.cbl:2246-2315]
#   [app/cpy/CSLKPCDY.cpy:521,895].
# - EDIT-US-PHONE-PREFIX finds WS-EDIT-US-PHONE-NUMB equal to LOW-VALUES, sets
#   INPUT-ERROR and FLG-EDIT-US-PHONEB-BLANK and, the message being still off,
#   STRINGs the trimmed field name and ': Prefix code must be supplied.' into
#   WS-RETURN-MSG; its GO TO goes to EDIT-US-PHONE-LINENUM, which passes 0101
#   [app/cbl/COACTUPC.cbl:2316-2333,2370-2422].
# - The flags reach WS-EDIT-PHONE-NUM-1-FLGS with FLG-PHONE-NUM-1B-BLANK
#   [app/cbl/COACTUPC.cbl:315-329,1637-1638]. Phone Number 2, EFT Account Id,
#   Primary Card Holder and the state/zip cross-check pass on the invented
#   customer below, and an edit writes its message only while
#   WS-RETURN-MSG-OFF holds, so this message stays
#   [app/cbl/COACTUPC.cbl:1640-1675].
# - INPUT-ERROR leaves ACUP-CHANGES-NOT-OK, which 2000-DECIDE-ACTION only
#   continues on: no READ UPDATE or REWRITE runs [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values, the LOW-VALUES prefix
#   included, with the valid amounts re-edited through +ZZZ,ZZZ,ZZZ.99;
#   3250-SETUP-INFOMSG sets PROMPT-FOR-CHANGES and moves WS-RETURN-MSG to
#   ERRMSG; 3300 keeps the fields editable, CSSETATY for PHONE-NUM-1B turns
#   ACSPH1B red and, the prefix being blank, moves '*' to ACSPH1BO, and the
#   cursor goes to ACSPH1B; 3390 makes F12=Cancel bright, while F5=Save stays
#   dark without a confirmation prompt
#   [app/cbl/COACTUPC.cbl:2870-2951,2955-2983,3141-3143,3400-3404,3566-3581]
#   [app/cpy/CSSETATY.cpy:17-27].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - ERRMSG is 'Phone Number 1' (the trimmed X(25) WS-EDIT-VARIABLE-NAME) and
#   ': Prefix code must be supplied.', 45 characters, in the 75-byte
#   WS-RETURN-MSG and the 78-byte ERRMSGO.
# - ACSPH1B shows '*' and two spaces: the one-character literal moved to the
#   three-byte ACSPH1BO [app/bms/COACTUP.bms:417-421].
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   AADDGRP is sent as LOW-VALUES on screen 4 (the blank group id comes back as
#   spaces, which 1100 turns into LOW-VALUES) and s3270 shows nulls as spaces.
#   FKEY05 is dark (ASKIP,DRK) and the s3270 capture renders it as blanks.
#   Colour and cursor position are not in the s3270 text capture and are not
#   asserted.
# - The tpe adapter enters a field with EraseEOF before typing, and types
#   nothing for the empty value, so ACSPH1B is sent erased with its MDT on.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every other
# COACTUPC edit: the repository record has FICO 274, below 300, and zip 12546,
# which is not a North Carolina zip [app/cbl/COACTUPC.cbl:2514-2558]. Area code
# 919 is a general-purpose code and NC27 a valid state and zip pair
# [app/cpy/CSLKPCDY.cpy:521,895,1186]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-109
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001 with its customer 000000001, whose Phone Number 1 is
  (919)555-0101, erases the prefix 555, keeping the area code 919 and the line
  number 0101, and presses ENTER. COACTUPC refuses the phone number: the
  message line shows 'Phone Number 1: Prefix code must be supplied.', the
  prefix shows '*', the screen keeps the other values editable under 'Update
  account details presented above.', and F12=Cancel is shown while F5=Save is
  not. Nothing is saved: ACCTDATA and CUSTDATA still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-167  # COACTUPC Phone Number 1: prefix supplied (EDIT-US-PHONE-PREFIX field edit)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code lookup 919 passes and the state/zip pair
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute and '*' set on ACSPH1B
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the four date edits, all passed
- INV-LAY-014  # CSUTLDWY: the date-edit work areas
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix COACTUPC STRINGs the untrimmed WS-EDIT-VARIABLE-NAME into this
# message (COACTUPC.cl2:2331-2333), so the deployed copy shows 'Phone Number 1'
# padded to 25 bytes before ': Prefix code must be supplied.' and a UniKix run
# never verifies the item. It also comments out the TEST-NUMVAL-C amount checks
# behind the re-edited amounts of screen 4.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
        CUST-ADDR-ZIP: '27601'
        CUST-PHONE-NUM-1: (919)555-0101
        CUST-PHONE-NUM-2: (919)555-0102
        CUST-SSN: '123456789'
        CUST-GOVT-ISSUED-ID: TESTGOVT0001
        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: Y
        CUST-FICO-CREDIT-SCORE: '700'
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
# PASSWORD is the documented demo password of README.md, not a secret.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  # The prefix erased; area code 919 and line number 0101 stay as fetched.
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACSPH1B: ''
