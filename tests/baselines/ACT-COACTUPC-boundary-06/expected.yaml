# Derived baseline of scenario ACT-COACTUPC-boundary-06 (capture_platform
# derived, tag inferred-not-observed): USER0001 signs on, takes main-menu
# option 2, fetches account 00000000001 on COACTUP, changes the open date from
# 2014-11-20 to 2014-01-20, putting the month at 01, the lower edge of the
# Open Date month range, and presses ENTER. The month is accepted, so it shows
# as the next prompt rather than as a month message: every edit passes,
# COACTUPC asks for confirmation and writes nothing. Authored from the source,
# never captured:
# - app/cbl/COMEN01C.cbl:241-252 with app/cpy/COMEN02Y.cpy:30-33 (OPTN002) and
#   148-153 (context 0, XCTL to COACTUPC);
# - app/cbl/COACTUPC.cbl:880-886,964-973 (first entry), 2668-2692 (header:
#   CAUP, COACTUPC, app/cpy/COTTL01Y.cpy titles, app/cpy/CSDAT01Y.cpy clock),
#   2958-2959 (PROMPT-FOR-SEARCH-KEYS);
# - step 3: 996-1003, 1429-1448, 2568-2580 and 3608-3884 (CXACAIX, ACCTDAT and
#   CUSTDAT read without UPDATE), 2698-2716 (ACCTSID), 2787-2865
#   (3202-SHOW-ORIGINAL-VALUES, open date 2014-11-20 at 2813-2815, amounts
#   through WS-EDIT-CURRENCY-9-2-F PIC +ZZZ,ZZZ,ZZZ.99 at 371), 2962-2963
#   (ACUP-SHOW-DETAILS gives PROMPT-FOR-CHANGES), 3500-3561 (fields
#   unprotected with MDT on; F5 and F12 stay dark);
# - step 4: 1151-1156 (OPNMONI to ACUP-NEW-OPEN-MON), 1681-1777 (change
#   found), 1478-1482 ('Open Date' to WS-EDIT-VARIABLE-NAME, then
#   EDIT-DATE-CCYYMMDD of app/cpy/CSUTLDPY.cpy:18-329: year 2014 of century
#   20 at 25-90; month 01 not blank and inside WS-VALID-MONTH 1 THROUGH 12 of
#   app/cpy/CSUTLDWY.cpy:17-20, TEST-NUMVAL 0, so FLG-MONTH-ISVALID and no
#   'Open Date: Month must be a number between 1 and 12.' at 91-147; day 20
#   at 150-207; no 31st, 30th or 29th conflict at 209-282; CALL 'CSUTLDTC'
#   with '20140120' and mask YYYYMMDD, severity 0, at 284-325), the other
#   field edits at 1429-1676 on the fetched values, 1671-1675
#   (ACUP-CHANGES-OK-NOT-CONFIRMED), 2620-2621 (ENTER without PF5 only
#   continues: no READ UPDATE, no REWRITE), 2870-2949
#   (3203-SHOW-UPDATED-VALUES, OPNMONO from ACUP-NEW-OPEN-MON at 2911-2913),
#   2955-2983 (PROMPT-FOR-CONFIRMATION at 472-473, the X(40) WS-INFO-MSG in
#   the 45-byte INFOMSGO; the blank X(75) WS-RETURN-MSG in the 78-byte
#   ERRMSGO), 3001-3003 (all fields protected), 3566-3584 (F5=Save and
#   F12=Cancel made bright), 3594-3601 (SEND MAP ERASE);
# - app/bms/COACTUP.bms for field lengths and the INITIAL texts of FKEYS,
#   FKEY05 and FKEY12; a dark field is captured as blanks.
# Values are whole BMS fields with their trailing spaces; CURDATE and CURTIME
# are matchers only, as the UniKix clock cannot be set (GAP-MIS-015). TRNNAME
# is pinned as the CAUP COACTUPC moves, although app/bms/COACTUP.bms:487-488
# also defines an unnamed 9-byte field at row 1, column 1 (GAP-DOC-025).
# file_state: nothing is rewritten before PF5, so both files keep their 50
# records and the key records are the materialized fixtures, decoded whole
# (FILLER included): ACCTDATA from app/data/ASCII/acctdata.txt, still with
# open date 2014-11-20, and CUSTDATA with the scenario's invented customer
# 000000001.
# Open under GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012
# (online-only copybooks). The CEEDAYS severity 0 for 20140120 is inferred
# (GAP-INF-001) and CEEDAYS on UniKix is unconfirmed (GAP-MIS-010). This pins
# app/ behavior: the UniKix copy's CSUTLDPY month check uses IS NUMERIC in
# place of TEST-NUMVAL (GAP-DOC-024), its CSUTLDTC trims the CEEDAYS lengths
# (GAP-DOC-021) and its COACTUPC amount edits differ (GAP-DOC-022), so an
# imported UniKix record of this scenario is reported as UniKix-copy behavior
# and never replaces this baseline. It is never edited by hand to match a run.
