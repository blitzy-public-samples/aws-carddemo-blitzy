# CardDemo REST API - OpenAPI 3.0.3 contract
# Hand-authored static artifact (see info.description).
# Faithful re-expression of the 17 legacy CICS/BMS online screens; no feature expansion.
openapi: 3.0.3
info:
  title: CardDemo REST API
  version: 1.0.0
  description: |-
    REST re-expression of the 17 legacy AWS CardDemo BMS/CICS 3270 online screens (credit-card account management). This is a faithful, no-feature-expansion migration of the COBOL/CICS online programs to JSON request/response contracts: it is NOT a web UI, NOT a terminal emulator, and NOT a 3270 renderer.

    Key conventions:
    - Monetary values are decimal strings (BigDecimal scale 2), never floating point, mirroring COBOL COMP-3 / PIC S9(n)V99.
    - Fixed-width numeric identifiers (account, card, user, transaction) are strings to preserve width and leading zeros.
    - Terminal PF-key semantics are modeled as an explicit PfKeyAction enum.
    - Every schema property documents its source BMS field and PIC clause; every operation cites its CICS transaction id and program for bidirectional traceability.

    This static, checked-in contract complements the live springdoc-generated specification at /v3/api-docs (Swagger UI at /swagger-ui.html).

    Derived from AWS CardDemo (Copyright Amazon.com, Inc. or its affiliates).
  contact:
    name: CardDemo Migration Team
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://localhost:8080
  description: Local development server
- url: /
  description: Relative to the serving host
tags:
- name: Signon
  description: User signon. CC00 / COSGN00C.
- name: Main Menu
  description: Main menu routing. CM00 / COMEN01C.
- name: Admin Menu
  description: Admin menu routing (role A). CA00 / COADM01C.
- name: Account View
  description: Account inquiry. CAVW / COACTVWC.
- name: Account Update
  description: Account update. CAUP / COACTUPC.
- name: Card List
  description: Card list browse. CCLI / COCRDLIC.
- name: Card View
  description: Card detail inquiry. CCDL / COCRDSLC.
- name: Card Update
  description: Card update. CCUP / COCRDUPC.
- name: Transaction List
  description: Transaction list browse. CT00 / COTRN00C.
- name: Transaction View
  description: Transaction detail inquiry. CT01 / COTRN01C.
- name: Transaction Add
  description: Add transaction. CT02 / COTRN02C.
- name: Transaction Report
  description: Request transaction report. CR00 / CORPT00C.
- name: Bill Payment
  description: Bill payment. CB00 / COBIL00C.
- name: User List
  description: User list browse (role A). CU00 / COUSR00C.
- name: User Add
  description: Add user (role A). CU01 / COUSR01C.
- name: User Update
  description: Update user (role A). CU02 / COUSR02C.
- name: User Delete
  description: Delete user (role A). CU03 / COUSR03C.
security:
- basicAuth: []
paths:
  /api/v1/signon:
    post:
      tags:
      - Signon
      operationId: signon
      summary: Authenticate a user (signon)
      description: 'Authenticates a user and returns the routing target menu. CC00 / COSGN00C. Public
        endpoint: establishes the authenticated session against the user_security table.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignonRequest'
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignonResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/menu/main:
    get:
      tags:
      - Main Menu
      operationId: getMainMenu
      summary: Retrieve the main menu
      description: Returns the main menu options. CM00 / COMEN01C.
      responses:
        '200':
          description: Main menu returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainMenuResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Main Menu
      operationId: submitMainMenu
      summary: Submit a main menu selection
      description: Submits a main menu option and returns the routing target. CM00 / COMEN01C.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MainMenuRequest'
      responses:
        '200':
          description: Menu selection processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MainMenuResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/menu/admin:
    get:
      tags:
      - Admin Menu
      operationId: getAdminMenu
      summary: Retrieve the admin menu
      description: Returns the admin menu options. CA00 / COADM01C. Requires role A (Admin).
      responses:
        '200':
          description: Admin menu returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMenuResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Admin Menu
      operationId: submitAdminMenu
      summary: Submit an admin menu selection
      description: Submits an admin menu option and returns the routing target. CA00 / COADM01C. Requires
        role A (Admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminMenuRequest'
      responses:
        '200':
          description: Menu selection processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMenuResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/accounts/{accountId}:
    get:
      tags:
      - Account View
      operationId: getAccount
      summary: View account details
      description: Returns account and associated customer detail. CAVW / COACTVWC.
      parameters:
      - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          description: Account found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountViewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Account Update
      operationId: updateAccount
      summary: Update account details
      description: Validates and updates account/customer detail. CAUP / COACTUPC.
      parameters:
      - $ref: '#/components/parameters/AccountIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
      responses:
        '200':
          description: Account updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/cards:
    get:
      tags:
      - Card List
      operationId: listCards
      summary: List cards (paged)
      description: Returns a paged list of cards, optionally filtered by account or card number. CCLI
        / COCRDLIC.
      parameters:
      - name: accountId
        in: query
        required: false
        description: Optional account-id filter (BMS ACCTSID).
        schema:
          $ref: '#/components/schemas/AccountId'
      - name: cardNumber
        in: query
        required: false
        description: Optional card-number filter (BMS CARDSID).
        schema:
          $ref: '#/components/schemas/CardNumber'
      - name: page
        in: query
        required: false
        description: Requested page number (BMS PAGENO, PIC X(3)).
        schema:
          type: string
          maxLength: 3
          pattern: ^[0-9]{1,3}$
      responses:
        '200':
          description: Card page returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/cards/{cardNumber}:
    get:
      tags:
      - Card View
      operationId: getCard
      summary: View card details
      description: Returns card detail. CCDL / COCRDSLC.
      parameters:
      - $ref: '#/components/parameters/CardNumberPath'
      - name: accountId
        in: query
        required: false
        description: Optional account-id context (BMS ACCTSID).
        schema:
          $ref: '#/components/schemas/AccountId'
      responses:
        '200':
          description: Card found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardViewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Card Update
      operationId: updateCard
      summary: Update card details
      description: Validates and updates card detail. CCUP / COCRDUPC.
      parameters:
      - $ref: '#/components/parameters/CardNumberPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardUpdateRequest'
      responses:
        '200':
          description: Card updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/transactions:
    get:
      tags:
      - Transaction List
      operationId: listTransactions
      summary: List transactions (paged)
      description: Returns a paged list of transactions, optionally starting from a given transaction
        id. CT00 / COTRN00C.
      parameters:
      - name: transactionId
        in: query
        required: false
        description: Optional start-from transaction id (BMS TRNIDIN).
        schema:
          $ref: '#/components/schemas/TransactionId'
      - name: page
        in: query
        required: false
        description: Requested page number (BMS PAGENUM, PIC X(8)).
        schema:
          type: string
          maxLength: 8
          pattern: ^[0-9]{1,8}$
      responses:
        '200':
          description: Transaction page returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Transaction Add
      operationId: addTransaction
      summary: Add a transaction
      description: Adds a transaction. The transaction id is server-generated (increment-from-max). CT02
        / COTRN02C.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionAddRequest'
      responses:
        '201':
          description: Transaction created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionAddResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/transactions/{transactionId}:
    get:
      tags:
      - Transaction View
      operationId: getTransaction
      summary: View transaction details
      description: Returns transaction detail. CT01 / COTRN01C.
      parameters:
      - $ref: '#/components/parameters/TransactionIdPath'
      responses:
        '200':
          description: Transaction found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionViewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/reports/transactions:
    post:
      tags:
      - Transaction Report
      operationId: requestTransactionReport
      summary: Request a transaction report
      description: Requests generation of a transaction report (monthly, yearly, or a custom date range).
        The report is produced by the batch layer. CR00 / CORPT00C.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionReportRequest'
      responses:
        '200':
          description: Report request accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/accounts/{accountId}/bill-payment:
    post:
      tags:
      - Bill Payment
      operationId: payBill
      summary: Pay the full account balance
      description: Submits a full-balance bill payment for the account. CB00 / COBIL00C.
      parameters:
      - $ref: '#/components/parameters/AccountIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillPaymentRequest'
      responses:
        '200':
          description: Bill payment processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillPaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/users:
    get:
      tags:
      - User List
      operationId: listUsers
      summary: List users (paged)
      description: Returns a paged list of users, optionally starting from a given user id. CU00 / COUSR00C.
        Requires role A (Admin).
      parameters:
      - name: userId
        in: query
        required: false
        description: Optional start-from user id (BMS USRIDIN).
        schema:
          $ref: '#/components/schemas/UserId'
      - name: page
        in: query
        required: false
        description: Requested page number (BMS PAGENUM, PIC X(8)).
        schema:
          type: string
          maxLength: 8
          pattern: ^[0-9]{1,8}$
      responses:
        '200':
          description: User page returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - User Add
      operationId: addUser
      summary: Add a user
      description: Creates a new user. CU01 / COUSR01C. Requires role A (Admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAddRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/users/{userId}:
    get:
      tags:
      - User Update
      operationId: getUser
      summary: Fetch a user for update
      description: Returns a user's detail (without password) to prefill the update form. CU02 / COUSR02C.
        Requires role A (Admin).
      parameters:
      - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: User found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - User Update
      operationId: updateUser
      summary: Update a user
      description: Updates a user. CU02 / COUSR02C. Requires role A (Admin).
      parameters:
      - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - User Delete
      operationId: deleteUser
      summary: Delete a user
      description: Deletes a user and returns the deleted user's display fields. CU03 / COUSR03C. Requires
        role A (Admin). The request body carries the operator-keyed user id and the terminal PF-key action
        of the two-step fetch-then-delete screen flow (ENTER fetches the record for confirmation; PF5 deletes
        it), preserving the BMS COUSR03 field-level contract.
      parameters:
      - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDeleteRequest'
      responses:
        '200':
          description: User deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDeleteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication handled by Spring Security against the user_security table
        (role A=Admin, U=User).
  parameters:
    AccountIdPath:
      name: accountId
      in: path
      required: true
      description: 11-digit account identifier (BMS ACCTSID/ACTIDIN).
      schema:
        $ref: '#/components/schemas/AccountId'
    CardNumberPath:
      name: cardNumber
      in: path
      required: true
      description: 16-digit card number (BMS CARDSID/CRDNUM).
      schema:
        $ref: '#/components/schemas/CardNumber'
    TransactionIdPath:
      name: transactionId
      in: path
      required: true
      description: 16-character transaction identifier (BMS TRNID).
      schema:
        $ref: '#/components/schemas/TransactionId'
    UserIdPath:
      name: userId
      in: path
      required: true
      description: 8-character user identifier (BMS USERID/USRIDIN).
      schema:
        $ref: '#/components/schemas/UserId'
  schemas:
    ScreenMetadata:
      type: object
      description: Common BMS screen header/chrome fields (display metadata) present on every CardDemo
        3270 screen. All fields are output-only.
      properties:
        transactionName:
          type: string
          maxLength: 4
          readOnly: true
          description: CICS transaction identifier shown in the screen header. Maps BMS field TRNNAME
            (PIC X(4)) of mapset common.
          example: CC00
        title01:
          type: string
          maxLength: 40
          readOnly: true
          description: First screen title line. Maps BMS field TITLE01 (PIC X(40)) of mapset common.
        title02:
          type: string
          maxLength: 40
          readOnly: true
          description: Second screen title line. Maps BMS field TITLE02 (PIC X(40)) of mapset common.
        currentDate:
          type: string
          maxLength: 8
          readOnly: true
          description: Current date as displayed by the screen (MM/DD/YY). Maps BMS field CURDATE (PIC
            X(8)) of mapset common.
        currentTime:
          type: string
          maxLength: 9
          readOnly: true
          description: Current time as displayed by the screen (HH:MM:SS). Maps BMS field CURTIME (PIC
            X(9)) of mapset common.
        programName:
          type: string
          maxLength: 8
          readOnly: true
          description: Name of the COBOL program servicing the screen. Maps BMS field PGMNAME (PIC X(8))
            of mapset common.
          example: COSGN00C
    MessageArea:
      type: object
      description: Message area carrying mapped FILE STATUS / CICS RESP / validation messages surfaced
        by GlobalExceptionHandler. Output-only.
      properties:
        errorMessage:
          type: string
          maxLength: 80
          readOnly: true
          description: Error message text (X(78) on most screens, X(80) on card screens; widest length
            used). Maps BMS field ERRMSG (PIC X(80)) of mapset common.
        infoMessage:
          type: string
          maxLength: 45
          readOnly: true
          description: Informational message text (X(45)/X(40) depending on screen; widest length used).
            Maps BMS field INFOMSG (PIC X(45)) of mapset common.
    PfKeyAction:
      type: string
      enum:
      - ENTER
      - PF3
      - PF4
      - PF5
      - PF7
      - PF8
      - PF12
      description: Explicit re-expression of 3270 PF-key semantics (per legacy/cpy/CSSTRPFY.cpy). ENTER=submit/primary
        action; PF3=back/exit; PF4=clear; PF5=save/confirm; PF7=page backward; PF8=page forward; PF12=cancel.
      example: ENTER
    UserType:
      type: string
      enum:
      - A
      - U
      maxLength: 1
      description: User role. A=Admin, U=User (from COMMAREA condition names in copybook COCOM01Y).
      example: A
    ConfirmFlag:
      type: string
      enum:
      - Y
      - N
      maxLength: 1
      description: Confirmation flag. Y=yes/confirm, N=no.
      example: Y
    AccountId:
      type: string
      maxLength: 11
      pattern: ^[0-9]{1,11}$
      description: 11-digit account identifier. Modeled as a numeric string to preserve fixed width and
        leading zeros. Maps BMS fields ACCTSID/ACTIDIN (PIC 9(11)/X(11)).
      example: '00000000011'
    CardNumber:
      type: string
      maxLength: 16
      pattern: ^[0-9]{1,16}$
      description: 16-digit card number. Modeled as a numeric string to preserve fixed width and leading
        zeros. Maps BMS fields CARDSID/CRDNUM/CARDNIN (PIC X(16)).
      example: '4111111111111111'
    TransactionId:
      type: string
      maxLength: 16
      description: 16-character transaction identifier. Maps BMS fields TRNID/TRNIDIN (PIC X(16)).
      example: '0000000000000001'
    UserId:
      type: string
      maxLength: 8
      description: 8-character user identifier. Maps BMS fields USERID/USRIDIN/USRID (PIC X(8)).
      example: ADMIN001
    MoneyAmount:
      type: string
      pattern: ^-?[0-9]+\.[0-9]{2}$
      description: Monetary amount as a decimal string; BigDecimal scale 2; never floating point. Mirrors
        COBOL COMP-3 / PIC S9(n)V99.
      example: '-100.00'
    ErrorResponse:
      type: object
      description: Generic problem payload emitted by GlobalExceptionHandler for mapped FILE STATUS /
        CICS RESP / validation failures.
      properties:
        timestamp:
          type: string
          format: date-time
          readOnly: true
          description: Instant the error was produced.
        status:
          type: integer
          format: int32
          readOnly: true
          description: HTTP status code.
          example: 404
        error:
          type: string
          readOnly: true
          description: HTTP reason phrase.
          example: Not Found
        message:
          type: string
          readOnly: true
          description: Human-readable error detail.
        path:
          type: string
          readOnly: true
          description: Request path that produced the error.
    MenuOption:
      type: object
      description: A single selectable menu option line.
      properties:
        optionNumber:
          type: string
          maxLength: 2
          pattern: ^[0-9]{1,2}$
          readOnly: true
          description: Derived 1-based option number (position of the option on the menu; not a distinct
            BMS field).
          example: '01'
        optionText:
          type: string
          maxLength: 40
          readOnly: true
          description: Menu option display text. Maps BMS field OPTN00x (PIC X(40)) of mapset COMEN01/COADM01.
    SignonRequest:
      type: object
      description: Signon request. CC00 / COSGN00C.
      properties:
        userId:
          allOf:
          - $ref: '#/components/schemas/UserId'
          description: User identifier. Maps BMS field USERID (PIC X(8)) of mapset COSGN00.
          example: ADMIN001
        password:
          type: string
          maxLength: 8
          writeOnly: true
          description: User password; accepted on signon only, never returned. Maps BMS field PASSWD (PIC
            X(8)) of mapset COSGN00.
          example: '********'
      required:
      - userId
      - password
    SignonResponse:
      description: Signon result including the routing target menu. CC00 / COSGN00C.
      allOf:
      - $ref: '#/components/schemas/ScreenMetadata'
      - $ref: '#/components/schemas/MessageArea'
      - type: object
        properties:
          userType:
            allOf:
            - $ref: '#/components/schemas/UserType'
            readOnly: true
            description: Derived authenticated user role (from user_security lookup; not a direct BMS
              field).
          nextTransaction:
            type: string
            maxLength: 4
            readOnly: true
            description: Derived routing target transaction id set by COSGN00C (CM00 for standard users,
              CA00 for admins); not a direct BMS field.
            example: CM00
    MainMenuResponse:
