# COACTUPC cannot lock the customer record when it saves confirmed account
# changes, and reports the failure under the success prompt.
#
# Steps 1-2: USER0001 signs on through CC00, reaches the main menu and selects
# option 2 'Account Update' [app/cpy/COMEN02Y.cpy:31-35]; COMEN01C transfers
# control to COACTUPC, whose fresh-entry path sends COACTUP with the account
# number left blank and the search-key prompt, as MNU-COMEN01C-alternate-02
# pins [app/cbl/COACTUPC.cbl:964-973,2955-2983].
# Step 3 (CAUP): account 00000000001 passes 1210-EDIT-ACCOUNT, and
# 9000-READ-ACCT reads CXACAIX by account id (card 9680294154603697, customer
# 000000001, the account's only CARDXREF record), ACCTDAT and CUSTDAT; this
# plain READ is the first CUSTDAT read of the scenario. The details are shown
# for change under 'Update account details presented above.'
# [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3608-3644].
# Step 4: the first name is typed over as Testnewname. 1205-COMPARE-OLD-NEW
# finds the change, every field edit of 1200-EDIT-MAP-INPUTS passes, and the
# changes wait for confirmation under 'Changes validated.Press F5 to save'
# [app/cbl/COACTUPC.cbl:1429-1676,2620-2621,2966-2967].
# Step 5: PF5 is valid while the changes are unconfirmed [app/cbl/COACTUPC.cbl:
# 905-912]. 1200 leaves at once because the changes are already confirmed-
# pending, and 9600-WRITE-PROCESSING reads ACCTDAT for update (NORMAL), then
# reads CUSTDAT for update while another task holds customer 000000001. The
# READ UPDATE does not answer NORMAL, so the program sets the input-error flag
# and COULD-NOT-LOCK-CUST-FOR-UPDATE, and leaves before either REWRITE
# [app/cbl/COACTUPC.cbl:3888-3942].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - No record changes. Both REWRITEs follow both READ UPDATEs
#   [app/cbl/COACTUPC.cbl:4065-4103], so the failed customer lock comes before
#   anything is written and there is nothing to back out; the account lock
#   taken by the first READ UPDATE ends with the task.
# - 2000-DECIDE-ACTION tests the outcome of 9600 for COULD-NOT-LOCK-ACCT-FOR-
#   UPDATE, LOCKED-BUT-UPDATE-FAILED and DATA-WAS-CHANGED-BEFORE-UPDATE only,
#   so the customer-lock failure falls to WHEN OTHER and sets
#   ACUP-CHANGES-OKAYED-AND-DONE [app/cbl/COACTUPC.cbl:2602-2615]. 3250 then
#   shows the success prompt 'Changes committed to database' in INFOMSG beside
#   the failure in ERRMSG [app/cbl/COACTUPC.cbl:2968-2981], where the account-
#   lock failure gets 'Changes unsuccessful. Please try again'. That pairing is
#   pinned as derived and registered as GAP-DEF-015, never fixed.
# - With the action at C (ACUP-CHANGES-MADE), 3200 shows the values just
#   received through 3203-SHOW-UPDATED-VALUES [app/cbl/COACTUPC.cbl:2718-2720,
#   2870-2949], so the new first name stays on the screen. 3300 protects every
#   field with MDT on (DFHBMPRF), and the ERRMSG and INFOMSG texts are the
#   75-byte WS-RETURN-MSG and 40-byte WS-INFO-MSG padded to their 78- and
#   45-byte fields.
# - Every amount is the S9(10)V99 value through PIC +ZZZ,ZZZ,ZZZ.99. AADDGRP
#   shows the blank ACCT-GROUP-ID (GAP-DEF-005); from step 4 on it holds
#   LOW-VALUES, because 1100 turns a blank received field into LOW-VALUES
#   [app/cbl/COACTUPC.cbl:1213-1218], and reads as spaces. ACSZIPC is the first
#   5 bytes of the 10-byte zip, and the phone parts are the digits of
#   (999)999-9999 [app/cbl/COACTUPC.cbl:2843-2857].
#
# No mechanism to hold a region record lock is confirmed, so the scenario raises
# MissingPrerequisite under GAP-MIS-014 and stays implemented-unexecuted until
# one exists. Customer 000000001 is replaced by invented data that passes every
# COACTUPC edit (area code 919, state NC with zip 27601) so that step 4 reaches
# the confirmation; its CUST-FILLER keeps the repository bytes. Screen fields are
# compared at their full BMS length, trailing spaces kept. CURDATE and CURTIME
# come from the region clock, hence the matchers and clock_mode relative.
id: ACT-COACTUPC-recovery-03
level: e2e
type: recovery
description: >-
  USER0001 signs on, opens Account Update (CAUP), fetches account 00000000001,
  changes the customer's first name to Testnewname and has the change
  validated, then presses PF5 while another task holds customer 000000001 for
  update. COACTUPC locks the account record but not the customer record, so it
  shows 'Could not lock customer record for update' with the entered values,
  under the success prompt 'Changes committed to database', and neither the
  account nor the customer record changes.
# Primary item first, then the program, the maps the steps enter on and land
# on, the transaction of steps 3-5, the CSD files COACTUPC reads and locks,
# and the online-only copybooks COACTUPC copies. Sign-on and the menu (CC00,
# CM00, COSGN00, USRSEC) are verified by the SEC and MNU scenarios; the batch
# record copybooks and the data files are verified at the lowest level that
# executes them.
inventory_ids:
- INV-ACT-052  # COACTUPC message 'Could not lock customer record for update' (recovery)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the prompt, detail, confirmation and failure screens
- INV-CFG-009  # CAUP transaction, under which the fetch and the failed save run
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account read, then read for update
- INV-CFG-005  # CUSTDAT CSD file: customer read, then the failing read for update
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the account and customer ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code, state and state-zip tables the step 4 edits use
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the field attributes of the detail screens
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER and PF5 paths
- INV-LAY-013  # CSUTLDPY: the date edits of step 4
- INV-LAY-014  # CSUTLDWY: the date edit work areas
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
- suspected-defect
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-MIS-014  # no mechanism to hold a record lock in the TPE region
- GAP-DEF-015  # the customer-lock failure is shown under 'Changes committed to database'
- GAP-DOC-022  # the UniKix COACTUPC changes the field edits and change detection of step 4
- GAP-DOC-024  # the UniKix CSUTLDPY changes the date edits of step 4
- GAP-DOC-025  # the UniKix COACTUP.bms differs from app/ at row 1, columns 1-9
