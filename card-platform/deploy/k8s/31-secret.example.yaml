apiVersion: v1
kind: Secret
metadata:
  name: carddemo-account-secret
  namespace: carddemo
  labels:
    app.kubernetes.io/name: account-service
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: card-platform
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "REPLACE-WITH-A-GENERATED-PASSWORD-FOR-ACCOUNT"
  KAFKA_SASL_PASSWORD: "REPLACE-WITH-A-GENERATED-BROKER-PASSWORD-FOR-ACCOUNT"
