# Derived baseline of scenario ACT-COACTUPC-boundary-17 (capture_platform:
# derived), authored from the app/ source and never observed: no TPE region
# runs in CI. Open until a UniKix run of the app/ build is imported:
# GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012 (online-only
# copybooks such as CSUTLDPY and CSUTLDWY).
# Steps 1-3: USER0001 signs on, option 2 XCTLs to COACTUPC, and ENTER with
# account 00000000001 shows the fetched account and customer with the change
# prompt [app/cbl/COACTUPC.cbl:2787-2865,2955-2981].
# Step 4: 2024 / 02 / 29 over the Open Date 2014-11-20 is a change, so
# 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and edits the fields in order
# [app/cbl/COACTUPC.cbl:1460-1482]. The year, month and day edits pass; in
# EDIT-DAY-MONTH-YEAR, February 29 with WS-EDIT-DATE-YY-N 24 (not 00) divides
# 2024 by 4, the remainder is zero, and the leap-year refusal is skipped
# [app/cpy/CSUTLDPY.cpy:209-279] [app/cpy/CSUTLDWY.cpy:4-34]. EDIT-DATE-LE
# calls CSUTLDTC with 20240229 and mask YYYYMMDD; severity 0 is expected for
# a real leap day, so no ' validation error Sev code' message is composed
# [app/cpy/CSUTLDPY.cpy:284-330]. That acceptance is known only through the
# CEEDAYS stub (GAP-INF-001), and whether UniKix supplies CEEDAYS is open
# (GAP-MIS-010).
# Every later edit passes on the invented customer, so INPUT-ERROR stays off
# and ACUP-CHANGES-OK-NOT-CONFIRMED is set; 2000-DECIDE-ACTION only continues
# on ENTER, so nothing is read for update or rewritten
# [app/cbl/COACTUPC.cbl:1484-1676,2602-2621]. 3250 sets
# PROMPT-FOR-CONFIRMATION (the X(40) WS-INFO-MSG in the 45-byte INFOMSG) and
# moves the blank X(75) WS-RETURN-MSG to the 78-byte ERRMSG; 3390 makes
# F5=Save and F12=Cancel bright [app/cbl/COACTUPC.cbl:463-473,2955-2981,
# 3566-3581].
# This pins the app/ behaviour: the UniKix CSUTLDPY and CSUTLDTC differ
# (GAP-DOC-024, GAP-DOC-021), so a UniKix record is UniKix-copy behaviour and
# never replaces this file; only `report.py --import-unikix` promotes it.
# Screen values are full BMS width with trailing spaces kept, because screens
# compare exactly; messages holds the ERRMSG of every step. CURDATE and CURTIME
# come from the region clock, so they are matchers. file_state holds the
# records as the preconditions materialize them, decoded through CVACT01Y and
# CVCUS01Y: both files keep their 50 records.
