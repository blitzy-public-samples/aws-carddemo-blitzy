# Page-size boundary of the COTRN00C transaction list: 11 TRANSACT records give
# a second page, where 10 (TRN-COTRN00C-boundary-01) give one.
#
# USER0001 (type U) signs on (CC00) and COSGN00C routes the user to COMEN01C,
# whose main menu COMEN01 is the first screen. Option 6, right-justified to 06,
# is the COMEN02Y entry 'Transaction List', program COTRN00C, so COMEN01C sets
# the program context to 0 and transfers control to it
# [app/cbl/COMEN01C.cbl:115-157] [app/cpy/COMEN02Y.cpy:55-59].
#
# First entry, under the ENTER that chose the option: COTRN00C clears its
# output map to LOW-VALUES and runs PROCESS-ENTER-KEY, which selects no row and
# leaves TRAN-ID at LOW-VALUES. PROCESS-PAGE-FORWARD starts a browse of
# TRANSACT there (STARTBR defaults to GTEQ; the GTEQ option is commented out),
# skips no record because the task's AID is ENTER, blanks rows 1-10 and
# READNEXTs ids 01-10 into them in key order [app/cbl/COTRN00C.cbl:107-116,
# 146-229,279-303,591-600]. The look-ahead READNEXT finds id 11, so the page
# number becomes 1, NEXT-PAGE-YES is set and WS-MESSAGE stays blank
# [app/cbl/COTRN00C.cbl:305-313]. The map is sent with ERASE twice in this task
# (PROCESS-PAGE-FORWARD, then MAIN-PARA), both times with the same content.
# CDEMO-CT00-TRNID-LAST (id 10), the page number and the flag travel in the
# COMMAREA returned with TRANSID CT00, and the next task's SET NEXT-PAGE-NO
# precedes the COMMAREA move, so the returned flag decides PF8
# [app/cbl/COTRN00C.cbl:62-70,97-111,138-141,437-439].
#
# PF8 finds NEXT-PAGE-YES, restarts the browse at CDEMO-CT00-TRNID-LAST, skips
# that record with one READNEXT (the AID is not ENTER, PF7 or PF3), blanks rows
# 1-10 and puts id 11 alone in row 1 [app/cbl/COTRN00C.cbl:257-300,450-505].
# The next READNEXT returns ENDFILE: 'You have reached the bottom of the
# page...' goes to WS-MESSAGE and the map is sent once still showing the
# received PAGENUM '00000001', since every COTRN00 field is FSET
# [app/cbl/COTRN00C.cbl:636-645] [app/bms/COTRN00.bms:85-89]. Then NEXT-PAGE-NO
# is set, and with WS-IDX at 2 the page number becomes 2, the search field is
# blanked and the map is sent again with ERASE, keeping the message
# [app/cbl/COTRN00C.cbl:314-326]. The asserted third screen is that final send.
#
# Row content [app/cbl/COTRN00C.cbl:56,381-445] [app/cpy/CSDAT01Y.cpy:30-55]:
# TRAN-ID; the date MM/DD/YY taken from TRAN-ORIG-TS; the first 26 bytes of the
# 100-byte TRAN-DESC; TRAN-AMT edited by PIC +99999999.99, a leading sign,
# 8 integer digits, the point and 2 decimals. PAGENUM is the PIC 9(08) page
# number moved to the 8-byte PAGENUMI, hence '00000001' and '00000002'
# [app/cbl/COTRN00C.cbl:65,324] [app/cpy-bms/COTRN00.CPY:60].
#
# Field values are full field width with their trailing spaces: comparison
# never trims. Fields left at LOW-VALUES show their BMS INITIAL (' ' for
# SEL0001-SEL0010). The main menu is asserted only by its identification
# fields, because its content belongs to the MNU scenarios. CURDATE and CURTIME
# come from the region clock, so they are matchers and the clock is relative.
id: TRN-COTRN00C-boundary-02
level: e2e
type: boundary
description: >-
  With 11 invented transactions in TRANSACT, USER0001 opens the transaction
  list from the main menu: page 1 shows ids 0000000000000001 to
  0000000000000010 in key order with a blank ERRMSG, because a look-ahead read
  finds an eleventh record, and PF8 shows page 2 holding only
  0000000000000011, rows 2-10 blank, and 'You have reached the bottom of the
  page...'.
# Primary item first, then the program, the maps asserted, the transaction the
# list and PF8 run under, the CSD file browsed, and the online-only copybooks
# COTRN00C copies. Sign-on (COSGN00, CC00, USRSEC) and the menu option belong to
# the SEC and MNU scenarios, and 'You have reached the bottom of the page...' to
# its own TRN-COTRN00C scenario, so this scenario asserts but does not list
# them. CVTRA05Y, the TRANSACT record layout, is a batch copybook verified at the
# unit level.
inventory_ids:
- INV-TRN-022  # COTRN00C transaction list content (report), 10 rows per page
- INV-TRN-001  # COTRN00C program
- INV-MNU-003  # COMEN01 map, where option 6 is entered
- INV-TRN-004  # COTRN00 map, both list pages
- INV-CFG-020  # CT00 transaction, the list's pseudo-conversation
- INV-CFG-007  # TRANSACT CSD file, browsed by transaction id
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA carrying the paging keys
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the row dates and the screen date and time
- INV-LAY-008  # CSMSG01Y copybook, copied by COTRN00C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-007  # derived TRN end-to-end baselines, never observed on a TPE region
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
