# COACTUPC refuses an expiry month outside 1-12: month 14 gives 'Expiry Date:
# Month must be a number between 1 and 12.' and nothing is written.
#
# Steps 1-3 sign on, choose Account Update and fetch account 00000000001 as
# ACT-COACTUPC-alternate-04 does: CXACAIX gives card 9680294154603697 and
# customer 000000001 (line 49 of app/data/ASCII/cardxref.txt), ACCTDAT and
# CUSTDAT are read without UPDATE, and 3320-UNPROTECT-FEW-ATTRS gives every
# editable field DFHBMFSE, so all of them come back on the next AID
# [app/cbl/COACTUPC.cbl:2568-2580,3500-3561,3608-3884].
# Step 4 types 14 over the expiry month and presses ENTER. 1100-RECEIVE-MAP
# moves it to ACUP-NEW-EXP-MON, 1205-COMPARE-OLD-NEW finds the change, and
# 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs the edits in field
# order [app/cbl/COACTUPC.cbl:1174-1179,1429-1495,1683-1777]. Account Status,
# Open Date and Credit Limit pass with the fetched values. For 'Expiry Date'
# EDIT-DATE-CCYYMMDD accepts the year 2025; EDIT-MONTH finds the month
# supplied but WS-VALID-MONTH (VALUES 1 THROUGH 12 on WS-EDIT-DATE-MM-N) false,
# sets INPUT-ERROR and FLG-MONTH-NOT-OK and, with WS-RETURN-MSG still blank,
# STRINGs the trimmed field name and ': Month must be a number between 1 and
# 12.' into it [app/cpy/CSUTLDPY.cpy:91-124] [app/cpy/CSUTLDWY.cpy:17-20].
# EDIT-DAY accepts 20, and EDIT-DAY-MONTH-YEAR leaves for
# EDIT-DATE-CCYYMMDD-EXIT because the date flags are not all valid, so
# EDIT-DATE-LE never calls CSUTLDTC [app/cpy/CSUTLDPY.cpy:150-279,329].
# Every later edit passes with the invented customer below, and each composes
# a message only while WS-RETURN-MSG is blank, so this one stays.
# INPUT-ERROR keeps ACUP-CHANGES-NOT-OK, on which 2000-DECIDE-ACTION only
# continues: 9600-WRITE-PROCESSING, the sole READ UPDATE and REWRITE path, does
# not run [app/cbl/COACTUPC.cbl:1670-1674,2596-2597]. 3203-SHOW-UPDATED-VALUES
# shows the received values, the valid amounts re-edited through
# +ZZZ,ZZZ,ZZZ.99, and EXPMON as typed; 3250-SETUP-INFOMSG sets
# PROMPT-FOR-CHANGES; 3320 leaves the fields editable; CSSETATY only colours
# EXPMON red; 3390 makes F12=Cancel bright (ACUP-CHANGES-MADE) and leaves
# F5=Save dark, since no confirmation is prompted
# [app/cbl/COACTUPC.cbl:2718-2720,2870-2951,2955-2982,2992-3000,3566-3581].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - ERRMSG is the 53-character message in the 75-byte WS-RETURN-MSG, padded to
#   the 78-byte ERRMSGO; INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte
#   INFOMSGO. Fields are compared at their full BMS length, trailing spaces
#   kept.
# - FKEY05 is dark (ASKIP,DRK in the map) and the s3270 capture renders a
#   zero-intensity field as blanks; FKEY12 shows its INITIAL text.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, so the expiry month is the only field refused: the repository record
# has FICO 274 and zip 12546, which the FICO and state/zip edits would refuse
# [app/cbl/COACTUPC.cbl:2514-2558]. Area code 919 and the NC/27 pair are valid
# [app/cpy/CSLKPCDY.cpy:521,895,1186].
id: ACT-COACTUPC-negative-031
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001 with its customer 000000001, changes the expiry month
  from 05 to 14 and presses ENTER. COACTUPC refuses the month: the screen keeps
  the entered values, still editable, with 'Expiry Date: Month must be a
  number between 1 and 12.' in the message line, the prompt 'Update account
  details presented above.' and F12=Cancel shown. Nothing is saved: ACCTDATA
  and CUSTDATA still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. The prompt message (INV-ACT-030) is asserted but verified by its own
# scenario; sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-089  # COACTUPC Expiry Date: month 1-12 (field edit, rule)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-edit screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute of the refused month
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-MONTH, which refuses the month
- INV-LAY-014  # CSUTLDWY: WS-EDIT-DATE-MM-N and its WS-VALID-MONTH condition
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY drops FUNCTION TRIM from the field name of every composed
# date-edit message, so the ERRMSG of screen 4 differs on UniKix.
- GAP-DOC-024
# The UniKix COACTUPC comments out the amount checks this path runs and drops
# TRIM from its change detection, so the amounts on screen 4 may differ.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
