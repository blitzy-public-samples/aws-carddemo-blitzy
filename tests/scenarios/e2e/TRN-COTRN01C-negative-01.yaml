# An AID key other than ENTER, PF3, PF4 and PF5 on the Transaction View screen.
# USER0001 signs on through CC00 and reaches the main menu COMEN01; option '7'
# is 'Transaction View', so COMEN01C sets CDEMO-PGM-CONTEXT to 0 and transfers
# control with XCTL to CDEMO-MENU-OPT-PGMNAME(7) = 'COTRN01C'
# [app/cbl/COMEN01C.cbl:144-155] [app/cpy/COMEN02Y.cpy:61-65]. COMEN01C passes
# only the COCOM01Y COMMAREA, so the group MOVE into COTRN01C's longer
# CARDDEMO-COMMAREA pads CDEMO-CT01-TRN-SELECTED with spaces and no transaction
# is fetched. On that first entry COTRN01C sets CDEMO-PGM-REENTER, clears
# COTRN1AO to LOW-VALUES, sends COTRN01 with its own header and a blank message
# line, and returns with TRANSID(CT01) and the COMMAREA
# [app/cbl/COTRN01C.cbl:52-61,88-110,136-139]. PF7 then starts CT01 again with
# that COMMAREA: COTRN01C receives the map, EVALUATE EIBAID handles only ENTER,
# PF3, PF4 and PF5, and WHEN OTHER sets WS-ERR-FLG and moves
# CCDA-MSG-INVALID-KEY of CSMSG01Y to WS-MESSAGE; SEND-TRNVIEW-SCREEN rebuilds
# the header from COTTL01Y and CSDAT01Y and moves the message to ERRMSG
# [app/cbl/COTRN01C.cbl:111-131,213-225,243-262] [app/cpy/CSMSG01Y.cpy:20-21].
# TRANSACT is read only by PROCESS-ENTER-KEY, which this path never reaches, so
# the scenario loads no TRANSACT precondition and asserts no file_state; the
# fixture TRANSACT holds no repository data to use as a base.
# TRNIDIN and the detail fields are not asserted: on this path they are
# whatever the received map held, sent back unchanged because COTRN1AO
# redefines COTRN1AI, and carry no business outcome.
# Text fields are compared at their full BMS length with trailing spaces:
# ERRMSG is 78 bytes, the 40-character message followed by spaces from the
# 80-byte WS-MESSAGE. CURTIME is 8 bytes on COTRN01 and COMEN01, so the
# hh:mm:ss matcher needs no padding. The baseline is derived from the source:
# no TPE region runs in CI.
id: TRN-COTRN01C-negative-01
level: e2e
type: negative
description: >-
  USER0001 signs on, selects option 7 'Transaction View' on the main menu and
  presses PF7 on the empty Transaction View screen COTRN01. COTRN01C accepts
  only ENTER, PF3, PF4 and PF5, so it sends COTRN01 again with its header
  (CT01, COTRN01C, the titles, the run date and time) and 'Invalid key
  pressed. Please see below...' in the message line; no transaction is read.
inventory_ids:
- INV-TRN-023  # COTRN01C message 'Invalid key pressed. Please see below...' (rule)
- INV-TRN-002  # COTRN01C program
- INV-MNU-003  # COMEN01 map, the main menu option 7 is entered on
- INV-TRN-005  # COTRN01 map, the screen PF7 is pressed on and sent again
- INV-CFG-021  # CT01 transaction, under which PF7 is processed
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA that makes the PF7 entry a reentry
- INV-LAY-005  # COTTL01Y copybook, TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y copybook, CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y copybook, CCDA-MSG-INVALID-KEY
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-007  # TRN end-to-end baselines derived from the source, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    # COSGN00C reads the sign-on user USER0001; this path reads nothing else.
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: USER0001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '7'}
    '@map': COMEN01
  - aid: PF7
    fields: {}
    '@map': COTRN01
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    ERRMSG: '                                                                              '
  - '@map': COTRN01
    TRNNAME: CT01
    PGMNAME: COTRN01C
    ERRMSG: '                                                                              '
  - '@map': COTRN01
    TRNNAME: CT01
    PGMNAME: COTRN01C
    TITLE01: '      AWS Mainframe Modernization       '
    TITLE02: '              CardDemo                  '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    ERRMSG: 'Invalid key pressed. Please see below...                                      '
  # One ERRMSG value per step: blank on the main menu and on the first
  # Transaction View screen, the invalid-key message after PF7.
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'Invalid key pressed. Please see below...                                      '
