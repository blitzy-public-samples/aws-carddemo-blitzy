# An AID key other than ENTER and PF3 on the admin menu. ADMIN001 signs on
# through CC00, and COSGN00C transfers control to COADM01C with
# CDEMO-PGM-CONTEXT 0, so COADM01C clears its output map, sends COADM01 with an
# empty message line and returns with TRANSID(CA00) and the COMMAREA
# [app/cbl/COSGN00C.cbl:220-234] [app/cbl/COADM01C.cbl:82-90,107-110].
# PF5 then restarts COADM01C under CA00 as a reentry: it receives the map, and
# EVALUATE EIBAID reaches WHEN OTHER, which moves CCDA-MSG-INVALID-KEY of
# CSMSG01Y to WS-MESSAGE; SEND-MENU-SCREEN rebuilds the header from COTTL01Y
# and CSDAT01Y and the four COADM02Y options, moves the message to ERRMSG and
# sends COADM01 again with ERASE. No option is processed and no XCTL happens
# [app/cbl/COADM01C.cbl:91-103,172-263] [app/cpy/CSMSG01Y.cpy:20-21]
# [app/cpy/COADM02Y.cpy:20-42].
# OPTION is not asserted on the second screen: the output map is not cleared on
# this path, so the field shows what RECEIVE MAP placed in the overlaid input
# area for an empty FSET field with JUSTIFY=(RIGHT,ZERO), which the source does
# not determine.
# Numbering: the plan pairs MNU-COADM01C-negative-01 with 'Please enter a valid
# option number...' (INV-MNU-022), so this scenario carries the invalid-key
# message (INV-MNU-021) and each COADM01C negative item stays the primary item
# of exactly one scenario, departing from strict inventory-order numbering.
id: MNU-COADM01C-negative-02
level: e2e
type: negative
description: >-
  ADMIN001 signs on and reaches the admin menu, then presses PF5. COADM01C
  accepts only ENTER and PF3, so it sends the admin menu COADM01 again with
  its header (CA00, COADM01C, the titles, the run date and time) and its four
  user-security options, and shows 'Invalid key pressed. Please see below...'
  in the message line.
inventory_ids:
- INV-MNU-021  # COADM01C message 'Invalid key pressed. Please see below...' (rule)
- INV-MNU-002  # COADM01C program
- INV-MNU-004  # COADM01 map, the screen PF5 is pressed on and sent again
- INV-CFG-011  # CA00 transaction, the one the PF5 reentry runs under
- INV-LAY-001  # COADM02Y copybook, the option table rebuilt into OPTN001-OPTN004
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA that makes the PF5 entry a reentry
- INV-LAY-005  # COTTL01Y copybook, TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y copybook, CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y copybook, CCDA-MSG-INVALID-KEY
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-003  # MNU end-to-end baselines derived from the source, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: ADMIN001
      PASSWD: PASSWORD
  - aid: PF5
    '@map': COADM01
    fields: {}
# Text fields are compared at their full BMS length with trailing spaces:
# ERRMSG is 78 bytes, the 40-character message followed by spaces from the
# 80-byte WS-MESSAGE, and each OPTNnnn is the 40-byte '<nn>. <name>' text.
expected:
  screens:
  - '@map': COADM01
    TRNNAME: CA00
    PGMNAME: COADM01C
    ERRMSG: '                                                                              '
  - '@map': COADM01
    TRNNAME: CA00
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COADM01C
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    OPTN001: '01. User List (Security)                '
    OPTN002: '02. User Add (Security)                 '
    OPTN003: '03. User Update (Security)              '
    OPTN004: '04. User Delete (Security)              '
    OPTN005: '                                        '
    OPTN006: '                                        '
    OPTN007: '                                        '
    OPTN008: '                                        '
    OPTN009: '                                        '
    OPTN010: '                                        '
    OPTN011: '                                        '
    OPTN012: '                                        '
    ERRMSG: 'Invalid key pressed. Please see below...                                      '
  messages:
  - '                                                                              '
  - 'Invalid key pressed. Please see below...                                      '
