# COACTUPC refuses a blank reissue month: the month-supplied predicate of
# EDIT-MONTH, which the procedure copybook CSUTLDPY lends to COACTUPC's
# EDIT-DATE-CCYYMMDD, for the Reissue Date field
# [app/cbl/COACTUPC.cbl:1503-1507] [app/cpy/CSUTLDPY.cpy:91-105].
#
# Steps 1-3 sign on as USER0001, choose main-menu option 2 and fetch account
# 00000000001, as ACT-COACTUPC-alternate-04 does: CXACAIX gives customer
# 000000001 (card 9680294154603697, line 49 of app/data/ASCII/cardxref.txt),
# ACCTDAT and CUSTDAT are read without UPDATE, and 3202-SHOW-ORIGINAL-VALUES
# shows the records with 'Update account details presented above.'; every
# editable field is DFHBMFSE (unprotected, MDT on), so all of them come back
# on the next AID [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3500-3561,3608-3884].
# Step 4 erases the reissue month and presses ENTER.
# - The erased RISMON arrives as LOW-VALUES (as SPACES it would be turned into
#   LOW-VALUES), so ACUP-NEW-REISSUE-MON is LOW-VALUES
#   [app/cbl/COACTUPC.cbl:1197-1202].
# - 1205-COMPARE-OLD-NEW finds the reissue date changed from 20250520, so
#   1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs the field edits in
#   screen order [app/cbl/COACTUPC.cbl:1460-1470,1681-1705].
# - Account Status, Open Date, Credit Limit, Expiry Date and Cash Credit Limit
#   keep their fetched values and pass [app/cbl/COACTUPC.cbl:1472-1501].
# - Reissue Date is next. EDIT-DATE-CCYYMMDD runs THRU its exit: EDIT-YEAR-CCYY
#   accepts 2025; EDIT-MONTH finds the month LOW-VALUES, sets INPUT-ERROR and
#   FLG-MONTH-BLANK and, the message being still off, STRINGs the trimmed field
#   name and ' : Month must be supplied.' into WS-RETURN-MSG; EDIT-DAY accepts
#   20; EDIT-DAY-MONTH-YEAR finds the date flags not valid and leaves for the
#   exit, so EDIT-DATE-LE (CSUTLDTC) is not called for this date
#   [app/cpy/CSUTLDPY.cpy:18-105,150-207,209-279]. The flags are kept as
#   WS-EDIT-REISSUE-DATE-FLGS, so FLG-REISSUE-MONTH-BLANK holds
#   [app/cbl/COACTUPC.cbl:263-275,1507].
# - Every later edit passes on the invented customer below, and an edit writes
#   its message only while WS-RETURN-MSG-OFF holds, so this message stays.
# - INPUT-ERROR leaves ACUP-CHANGES-NOT-OK, which 2000-DECIDE-ACTION only
#   continues on: no READ UPDATE or REWRITE runs [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values, the blank month
#   included, with the amounts re-edited through +ZZZ,ZZZ,ZZZ.99;
#   3250-SETUP-INFOMSG sets PROMPT-FOR-CHANGES and moves WS-RETURN-MSG to
#   ERRMSG; 3300 keeps the fields editable, and CSSETATY, the month being
#   blank on re-entry, turns RISMON red and moves '*' into it; 3390 makes
#   F12=Cancel bright, while F5=Save stays dark without a confirmation prompt
#   [app/cbl/COACTUPC.cbl:2718-2720,2870-2951,2964-2981,2986-3019,3267-3271,
#   3566-3581] [app/cpy/CSSETATY.cpy].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - ERRMSG is 'Reissue Date' (the trimmed X(25) WS-EDIT-VARIABLE-NAME) and
#   ' : Month must be supplied.', 38 characters, in the 75-byte WS-RETURN-MSG
#   and the 78-byte ERRMSGO.
# - RISMON shows '*' and a space: the X(2) RISMONO receives the one-character
#   literal. The cursor goes to RISMON: 3000-SEND-MAP runs 3250 before 3300,
#   so PROMPT-FOR-CHANGES has replaced the FOUND-ACCOUNT-DATA that
#   1200-EDIT-MAP-INPUTS set in WS-INFO-MSG, and FLG-REISSUE-MONTH-BLANK is
#   the first WHEN of the cursor EVALUATE that holds, selecting RISMONL
#   [app/cbl/COACTUPC.cbl:463-471,1452,2654-2657,2964-2965,3009-3012,
#   3057-3059]; the cursor is not asserted.
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   FKEY05 is dark (ASKIP,DRK) and the s3270 capture renders it as blanks.
# - The tpe adapter enters a field with EraseEOF before typing, and an empty
#   value is the EraseEOF alone. No upper-case translation of input is
#   assumed: CARDDEMO.CSD defines none for CAUP.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every other
# COACTUPC edit: the repository record has FICO 274, below 300, and zip 12546,
# which is not a North Carolina zip [app/cbl/COACTUPC.cbl:2514-2558]. Area code
# 919 is a general-purpose code and NC27 a valid state and zip pair
# [app/cpy/CSLKPCDY.cpy:521,895,1186]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-045
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001 with its customer 000000001, erases the reissue month
  and presses ENTER. COACTUPC refuses the change: the message line shows
  'Reissue Date : Month must be supplied.', the reissue month shows '*', the
  screen keeps the other values editable under 'Update account details
  presented above.', and F12=Cancel is shown while F5=Save is not. Nothing is
  saved: ACCTDATA and CUSTDATA still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-103  # COACTUPC Reissue Date: month supplied (EDIT-MONTH field edit)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute and '*' set on RISMON
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-MONTH, which composes the message
- INV-LAY-014  # CSUTLDWY: the date-edit work areas and month flags
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY drops FUNCTION TRIM from the field name of every composed
# date-edit message, so the ERRMSG of screen 4 differs on UniKix.
- GAP-DOC-024
# Not in the planned gap list; cited because this scenario asserts what they
# change, as the other date-edit scenarios do. The UniKix COACTUPC comments out
# the TEST-NUMVAL-C amount checks whose flags decide how screen 4 re-edits the
# amounts, and the UniKix COACTUP.bms differs at row 1, columns 1-9, where
# TRNNAME stands.
- GAP-DOC-022
- GAP-DOC-025
