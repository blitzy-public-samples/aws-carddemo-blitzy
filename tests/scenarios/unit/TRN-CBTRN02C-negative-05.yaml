id: TRN-CBTRN02C-negative-05
level: unit
type: negative
description: >-
  One daily transaction fails both account checks: card 9680294154603697 belongs
  to account 00000000001, whose credit limit is 2020.00 with both cycle totals at
  0.00, so the amount 2020.01 is over the limit (reason 102), and its origination
  date 2025-05-21 is one day after the account's expiration date 2025-05-20
  (reason 103). 1500-B-LOOKUP-ACCT runs the limit check and then the expiry check
  on the same record, and the expiry check's MOVE 103 overwrites the 102 already
  set, so the record is rejected with 0103 'TRANSACTION RECEIVED AFTER ACCT
  EXPIRATION' alone [app/cbl/CBTRN02C.cbl:403-420]. Nothing is posted: TRANSACT,
  which CBTRN02C opens OUTPUT, stays empty, and the account and category-balance
  records are left as loaded. Whether 103 is meant to win is unknown, so the
  behaviour is pinned as observed (GAP-UNC-011).
inventory_ids:
- INV-TRN-078  # CBTRN02C reject 103 takes precedence over 102 (rule)
- INV-TRN-008  # CBTRN02C program
- INV-TRN-085  # CBTRN02C DALYREJS 430-byte reject record (interface)
- INV-TRN-080  # CBTRN02C return code 4 when any record is rejected (rule)
- INV-LAY-026  # CVTRA06Y copybook, the transaction data inside the reject record
- INV-LAY-016  # CVACT01Y copybook, the ACCTDATA layout
- INV-LAY-021  # CVTRA01Y copybook, the TCATBALF layout
- INV-DTA-003  # cardxref.txt, the CARDXREF fixture source
- INV-DTA-013  # EBCDIC card cross-reference file, its cross-check counterpart
- INV-DTA-001  # acctdata.txt, the ACCTDATA fixture source
- INV-DTA-011  # EBCDIC account data file, its cross-check counterpart
- INV-DTA-007  # tcatbal.txt, the TCATBALF fixture source
- INV-DTA-018  # EBCDIC category balance file, its cross-check counterpart
tags:
- observed-only
gap_ids:
- GAP-UNC-011  # whether 103 overwriting 102 is intended
- GAP-STB-010  # Berkeley DB indexed files in place of the VSAM KSDS
- GAP-STB-011  # GnuCOBOL compile and runtime options in place of Enterprise COBOL and LE
preconditions:
  datasets:
    # Invented transaction on a repository card; DALYTRAN-PROC-TS stays blank,
    # as in the repository's daily transactions.
    DALYTRAN:
      records:
      - DALYTRAN-ID: '9900000000000381'
        DALYTRAN-TYPE-CD: '01'
        DALYTRAN-CAT-CD: '0001'
        DALYTRAN-SOURCE: POS TERM
        DALYTRAN-DESC: Synthetic over limit and expired
        DALYTRAN-AMT: '2020.01'
        DALYTRAN-MERCHANT-ID: '999000381'
        DALYTRAN-MERCHANT-NAME: Synthetic Merchant 381
        DALYTRAN-MERCHANT-CITY: Testville
        DALYTRAN-MERCHANT-ZIP: '00000'
        DALYTRAN-CARD-NUM: '9680294154603697'
        DALYTRAN-ORIG-TS: '2025-05-21 09:15:00.000000'
    CARDXREF: {base: CARDXREF}
    ACCTDATA: {base: ACCTDATA}
    TCATBALF: {base: TCATBALF}
  parameters:
    clock: '2022-07-06 10:00:00.00'
    clock_mode: fixed
  faults: []
inputs:
  program: CBTRN02C
expected:
  return_code: 4
  # Exactly one reject, with reason 0103 and never 0102. These codes are the
  # WS-VALIDATION-FAIL-REASON of the DALYREJS records, in written order, as the
  # 4-digit text the reject record carries.
  reject_reason_codes:
  - '0103'
  messages:
  - START OF EXECUTION OF PROGRAM CBTRN02C
  - TRANSACTIONS PROCESSED :000000001
  - TRANSACTIONS REJECTED  :000000001
  - END OF EXECUTION OF PROGRAM CBTRN02C
  datasets:
    # The rejected transaction as read, followed by the 103 description padded
    # to its 76 bytes. WS-VALIDATION-FAIL-REASON is left to reject_reason_codes,
    # which asserts it as 0103; its decoded number would read 103.
    DALYREJS:
      records:
      - DALYTRAN-ID: '9900000000000381'
        DALYTRAN-AMT: '2020.01'
        DALYTRAN-CARD-NUM: '9680294154603697'
        DALYTRAN-ORIG-TS: '2025-05-21 09:15:00.000000'
        WS-VALIDATION-FAIL-REASON-DESC: 'TRANSACTION RECEIVED AFTER ACCT EXPIRATION                                  '
    TRANSACT:
      count: 0
  file_state:
    # A rejected record is never posted, so account 00000000001 and its
    # type 01 / category 0001 balance keep their loaded values; numeric fields
    # are written in decoded form (ACCT-ID 00000000001 decodes as 1).
    ACCTDATA:
      count: 50
      contains:
      - ACCT-ID: '1'
        ACCT-CURR-BAL: '194.00'
        ACCT-CREDIT-LIMIT: '2020.00'
        ACCT-EXPIRAION-DATE: '2025-05-20'
        ACCT-CURR-CYC-CREDIT: '0.00'
        ACCT-CURR-CYC-DEBIT: '0.00'
    TCATBALF:
      count: 50
      contains:
      - TRANCAT-ACCT-ID: '1'
        TRANCAT-TYPE-CD: '01'
        TRANCAT-CD: '1'
        TRAN-CAT-BAL: '0.00'
