# Update-user save (PF5) with the user type erased: COUSR02C refuses it with
# 'User Type can NOT be empty...' and leaves USRSEC unchanged.
#
# Step 1: ADMIN001 signs on through CC00 and COSGN00C routes the type 'A' user
# to the admin menu COADM01 [app/cbl/COSGN00C.cbl:221-237].
# Step 2: option '3' makes COADM01C transfer control with XCTL to COADM02Y
# entry 3, COUSR02C 'User Update (Security)', with CDEMO-PGM-CONTEXT 0
# [app/cbl/COADM01C.cbl:115-145] [app/cpy/COADM02Y.cpy:34-37]. COADM01C passes
# only the COCOM01Y COMMAREA, so CDEMO-CU02-USR-SELECTED is blank and no user is
# fetched: COUSR02C clears COUSR2AO to LOW-VALUES, sends COUSR02 with empty
# entry fields and a blank message, and returns with TRANSID CU02
# [app/cbl/COUSR02C.cbl:84-105,135-138,266-315].
# Step 3: ENTER with user id TESTU002. PROCESS-ENTER-KEY reads USRSEC by that
# key with UPDATE; on RESP NORMAL READ-USER-SEC-FILE sends 'Press PF5 key to
# save your updates ...', then the record's names, password and type are moved
# into the map and the screen is sent again under the same message
# [app/cbl/COUSR02C.cbl:143-172,320-339]. The task ends, releasing the lock.
# Step 4: PF5 with only the user type erased (the adapter's EraseEOF on USRTYPE
# with no text typed). Every COUSR02 entry field is FSET
# [app/bms/COUSR02.bms:85-149], so the user id, names and password come back as
# fetched and pass the first four WHEN clauses of UPDATE-USER-INFO; USRTYPEI is
# then SPACES or LOW-VALUES, so the error flag is set, 'User Type can NOT be
# empty...' goes to WS-MESSAGE, the cursor to USRTYPE, and the screen is sent.
# The error flag skips READ-USER-SEC-FILE and UPDATE-USER-SEC-FILE, so no
# REWRITE is issued [app/cbl/COUSR02C.cbl:122-123,177-215]. COUSR2AO redefines
# COUSR2AI, so the received values are echoed in their fields and the erased
# user type shows blank.
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Text values are whole fields at their BMS length with trailing spaces:
#   ERRMSG is the first 78 bytes of the 80-byte WS-MESSAGE; FNAME and LNAME are
#   the 20-byte SEC-USR-FNAME and SEC-USR-LNAME [app/cpy/CSUSR01Y.cpy:17-23].
#   The adapter copies each step's ERRMSG into the message list.
# - PASSWD is a dark field (ATTRB=(DRK,FSET,UNPROT)) [app/bms/COUSR02.bms:130-134]
#   whose text a screen read does not show, so it is asserted on the record only.
# - The header is POPULATE-HEADER-INFO's: the COTTL01Y titles, CU02, COUSR02C,
#   and CURDATE mm/dd/yy and CURTIME hh:mm:ss of the region clock through
#   CSDAT01Y, hence the matchers and clock_mode relative.
# TESTU002 and its names and password are invented data added to the USRSEC
# fixture; the user never signs on.
id: USR-COUSR02C-negative-06
level: e2e
type: negative
description: >-
  ADMIN001 signs on, selects admin option 3 'User Update (Security)', fetches
  the invented user TESTU002 on the COUSR02 update screen and presses PF5 with
  the user type erased. COUSR02C refuses the save with 'User Type can NOT be
  empty...' in ERRMSG, echoes the user id, first and last name under
  transaction CU02, and rewrites nothing: USRSEC keeps TESTU002 as loaded and
  the ten fixture users.
inventory_ids:
- INV-USR-039  # COUSR02C message 'User Type can NOT be empty...' (rule)
- INV-USR-003  # COUSR02C program
- INV-MNU-004  # COADM01 map, the admin menu option 3 is entered on
- INV-USR-007  # COUSR02 map, the update screen of steps 2-4
- INV-CFG-025  # CU02 transaction, under which the fetch and the refused save run
- INV-CFG-008  # USRSEC CSD file, read for update at the fetch and left unchanged
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA COADM01C passes with the XCTL
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the header date and time
- INV-LAY-008  # CSMSG01Y copybook, copied by COUSR02C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-004  # USR end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    # The ten fixture users, ADMIN001 among them for the sign-on, plus the
    # invented user TESTU002 whose save is refused.
    USRSEC:
      base: USRSEC
      records:
      - {SEC-USR-ID: TESTU002, SEC-USR-FNAME: TESTFIRST, SEC-USR-LNAME: TESTLAST,
         SEC-USR-PWD: TESTPWD2, SEC-USR-TYPE: U}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: ADMIN001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '3'}
    '@map': COADM01
  - aid: ENTER
    fields: {USRIDIN: TESTU002}
    '@map': COUSR02
  # The empty value erases the fetched user type, so COUSR02C receives none.
  - aid: PF5
    fields: {USRTYPE: ''}
    '@map': COUSR02
expected:
  screens:
  - '@map': COADM01
    TRNNAME: CA00
    PGMNAME: COADM01C
    ERRMSG: '                                                                              '
  - '@map': COUSR02
    TRNNAME: CU02
    PGMNAME: COUSR02C
    USRIDIN: '        '
    FNAME: '                    '
    LNAME: '                    '
    USRTYPE: ' '
    ERRMSG: '                                                                              '
  - '@map': COUSR02
    TRNNAME: CU02
    PGMNAME: COUSR02C
    USRIDIN: TESTU002
    FNAME: 'TESTFIRST           '
    LNAME: 'TESTLAST            '
    USRTYPE: U
    ERRMSG: 'Press PF5 key to save your updates ...                                        '
  - '@map': COUSR02
    TRNNAME: CU02
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COUSR02C
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    USRIDIN: TESTU002
    FNAME: 'TESTFIRST           '
    LNAME: 'TESTLAST            '
    USRTYPE: ' '
    ERRMSG: 'User Type can NOT be empty...                                                 '
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'Press PF5 key to save your updates ...                                        '
  - 'User Type can NOT be empty...                                                 '
  file_state:
    # The refused save rewrites nothing: USRSEC holds exactly the records
    # loaded, in key order, TESTU002 with its original names, password and type.
    USRSEC:
      count: 11
      records:
      - {SEC-USR-ID: ADMIN001, SEC-USR-FNAME: 'MARGARET            ', SEC-USR-LNAME: 'GOLD                ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: A, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: ADMIN002, SEC-USR-FNAME: 'RUSSELL             ', SEC-USR-LNAME: 'RUSSELL             ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: A, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: ADMIN003, SEC-USR-FNAME: 'RAYMOND             ', SEC-USR-LNAME: 'WHITMORE            ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: A, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: ADMIN004, SEC-USR-FNAME: 'EMMANUEL            ', SEC-USR-LNAME: 'CASGRAIN            ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: A, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: ADMIN005, SEC-USR-FNAME: 'GRANVILLE           ', SEC-USR-LNAME: 'LACHAPELLE          ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: A, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: TESTU002, SEC-USR-FNAME: 'TESTFIRST           ', SEC-USR-LNAME: 'TESTLAST            ', SEC-USR-PWD: TESTPWD2, SEC-USR-TYPE: U, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: USER0001, SEC-USR-FNAME: 'LAWRENCE            ', SEC-USR-LNAME: 'THOMAS              ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: U, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: USER0002, SEC-USR-FNAME: 'AJITH               ', SEC-USR-LNAME: 'KUMAR               ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: U, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: USER0003, SEC-USR-FNAME: 'LAURITZ             ', SEC-USR-LNAME: 'ALME                ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: U, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: USER0004, SEC-USR-FNAME: 'AVERARDO            ', SEC-USR-LNAME: 'MAZZI               ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: U, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: USER0005, SEC-USR-FNAME: 'LEE                 ', SEC-USR-LNAME: 'TING                ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: U, SEC-USR-FILLER: '                       '}
