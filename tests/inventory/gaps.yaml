schema_version: 1
selector_keys:
  activation: list of activation values; matches the item's activation
  area: list of area codes; matches an item whose id is INV-<AREA>-<nnn>
  kind: list of inventory kinds; matches the item's kind
  level: list of levels (unit, integration, e2e); matches the item's level
  owner: list of program, job or resource names; matches the first token of the item's name
  source_path: list of paths; an entry ending in '/' is a prefix, any other must equal the item's source with its trailing ':<lines>' removed
  unikix_dependent: true; matches items listed by at least one scenario that only the unikix adapter can run
  via_scenarios: true; matches items listed by any scenario whose gap_ids contain this entry's gap_id
