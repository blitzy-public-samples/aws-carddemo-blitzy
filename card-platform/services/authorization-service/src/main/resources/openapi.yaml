openapi: 3.1.0

# Written by hand. No documentation generator joins the classpath, so what this file states and what
# the code accepts are kept in step by the tests under src/test/java, not by an annotation processor.
#
# Every field width, every rejection text and every reject code below is read from the source. The
# locator beside each one names the file and the line it came from.

info:
  title: CardDemo authorization service
  version: 1.0.0
  description: >-
    The one synchronous surface of the modernized CardDemo platform. One call decides one
    transaction and produces exactly one event, which three services then consume independently.
    The decision rules come from paragraphs 1500-A-LOOKUP-XREF and 1500-B-LOOKUP-ACCT at
    app/cbl/CBTRN02C.cbl:L380-L420, the request contract from the online capture program
    app/cbl/COTRN02C.cbl, and the four reject codes and their texts from
    app/cbl/CBTRN02C.cbl:L385-L420. No program named COPAUA0C and no transaction named CP00 exists
    in the source repository, so this service is synthesised from those three programs.
  license:
    name: Apache-2.0

servers:
  - url: http://localhost:8081
    description: The port docker-compose.yml maps for this service.

tags:
  - name: authorization
    description: Deciding one transaction and producing one event for it.

paths:
  /authorizations:
    post:
      tags: [authorization]
      operationId: authorize
      summary: Authorize one transaction.
      description: >-
        Resolves the card to an account, applies four decline rules in the order
        app/cbl/CBTRN02C.cbl applies them, and writes the decision and its event in one local
        transaction. Publication happens afterwards from the outbox, so this call never waits for a
        broker.


        Both outcomes answer 200. An approval carries approved true; a decline carries approved
        false plus the reject code and its text. A decline is a decision the service took, and
        app/cbl/CBTRN02C.cbl:L229-L230 treats a rejection the same way, ending a batch run with
        return code 4 rather than failing it.


        A card number travels only in the request body. No path variable and no query parameter
        carries one, so a full Primary Account Number reaches no access log through a request line.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationRequest'
            examples:
              byCardNumber:
                summary: A purchase presenting a card number.
                value:
                  transactionTypeCode: '01'
                  transactionCategoryCode: '0001'
                  source: POS TERM
                  description: Purchase at Abshire-Lowe
                  amount: '+00000504.77'
                  merchantId: '800000000'
                  merchantName: Abshire-Lowe
                  merchantCity: North Enoshaven
                  merchantZip: '72112'
                  cardNumber: '4859452612877065'
                  originTimestamp: '2026-08-05 00:00:00.000000'
                  processingTimestamp: '2026-08-05-00.00.00.000000'
              byCardNumberShortForm:
                summary: >-
                  The same purchase presenting a shorter card number, which is widened with leading
                  zeros before the cross-reference read.
                value:
                  transactionTypeCode: '01'
                  transactionCategoryCode: '0001'
                  source: POS TERM
                  description: Purchase at Abshire-Lowe
                  amount: '+00000504.77'
                  merchantId: '800000000'
                  merchantName: Abshire-Lowe
                  merchantCity: North Enoshaven
                  merchantZip: '72112'
                  cardNumber: '859452612877065'
                  originTimestamp: '2026-08-05 00:00:00.000000'
                  processingTimestamp: '2026-08-05-00.00.00.000000'
      responses:
        '200':
          description: >-
            The decision. An approval and a decline share this status, and the approved component
            separates them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationResponse'
              examples:
                approved:
                  summary: Approved, naming the account it authorized against.
                  value:
                    transactionId: '0000001000000001'
                    accountId: '00000000077'
                    approved: true
                    declineReasonCode: null
                    declineReasonDescription: null
                overCreditLimit:
                  summary: Declined on the credit limit, from app/cbl/CBTRN02C.cbl:L403-L413.
                  value:
                    transactionId: '0000001000000002'
                    accountId: '00000000077'
                    approved: false
                    declineReasonCode: '0102'
                    declineReasonDescription: OVERLIMIT TRANSACTION
                unresolvedCard:
                  summary: >-
                    Declined because no cross-reference row carries the card number, from
                    app/cbl/CBTRN02C.cbl:L383-L387. This is the one outcome carrying no account
                    identifier, because none was resolved. The same local transaction records the
                    attempt and a schema-version-2 TransactionDeclined event keyed by transaction.
                  value:
                    transactionId: '0000001000000003'
                    accountId: null
                    approved: false
                    declineReasonCode: '0100'
                    declineReasonDescription: INVALID CARD NUMBER FOUND
        '400':
          description: The request body could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: 400
                error: Unprocessable request
                messages:
                  - Request body holds one authorization in JavaScript Object Notation...
                timestamp: '2022-06-10T19:27:53.412Z'
        '422':
          description: >-
            The body was read and its values are not ones the source accepts. Nothing was decided,
            so no reject code applies. Each message is the verbatim text app/cbl/COTRN02C.cbl moves
            into WS-MESSAGE for that field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: 422
                error: Validation failed
                messages:
                  - Category CD must be Numeric...
                  - Merchant Zip can NOT be empty...
                timestamp: '2022-06-10T19:27:53.412Z'
        '413':
          description: >-
            The request declares a body larger than this service reads.
            config/RequestBodyCeilingFilter refuses it before the parser is reached, and
            carddemo.api.max-request-body-bytes declares the bound. The body names no route and no
            value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: 413
                error: Payload too large
                messages:
                  - This request declares a body larger than this service reads.
        '500':
          description: A fault inside the service. The body carries no value read from the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: 500
                error: Internal failure
                messages:
                  - Unable to authorize this transaction...
                timestamp: '2022-06-10T19:27:53.412Z'
        '503':
          description: >-
            The service refused to decide, because the replica tables its decline rules
            read had not been observed within carddemo.replica.max-staleness. card_xref
            and account_credit_snapshot are copies kept current by account.state-changed
            and card.updated, and a copy whose events stopped arriving keeps answering
            with whatever it last knew. This is the one status a caller should retry:
            once the replica catches up the same request receives a real decision.
            It is deliberately not a decline. The four reject reasons come from
            app/cbl/CBTRN02C.cbl:L385-L420 and there is no fifth, and the card and the
            account were both valid here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                status: 503
                error: Internal failure
                messages:
                  - Unable to authorize this transaction...
                timestamp: '2022-06-10T19:27:53.412Z'

components:
  schemas:

    AuthorizationRequest:
      type: object
      description: >-
        Thirteen fields carry the daily transaction record at app/cpy/CVTRA06Y.cpy:L4-L17 and the
        fourteenth carries XREF-ACCT-ID PIC 9(11) at app/cpy/CVACT03Y.cpy:L7. The trailing FILLER
        PIC X(20) at app/cpy/CVTRA06Y.cpy:L18 has no field here.


        Eleven fields are required, matching the eleven app/cbl/COTRN02C.cbl:L251-L320 rejects when
        empty. A field of spaces counts as absent, because that paragraph tests for SPACES OR
        LOW-VALUES.


        cardNumber is required and accountId is not accepted in its place.
        app/cbl/COTRN02C.cbl:L206-L209 also takes an account identifier and resolves a card from the
        alternate index, and that branch is not reproduced: the card it returns is whichever one the
        index holds first rather than one the caller presented, so a caller naming an account would
        authorize a card the caller never held. A missing card number reports
        "Account or Card Number must be entered...", the WHEN OTHER text of
        app/cbl/COTRN02C.cbl:L226.


        transactionId is not accepted either. This service allocates every identifier from the
        transaction_id_seq sequence, because an identifier a caller chooses is one a caller can
        repeat, and a repeated identifier merges one payment with another downstream.
      required:
        - transactionTypeCode
        - transactionCategoryCode
        - source
        - description
        - amount
        - merchantId
        - merchantName
        - merchantCity
        - merchantZip
        - cardNumber
        - originTimestamp
        - processingTimestamp
      properties:
        transactionId:
          type: 'null'
          description: >-
            Identifier of the transaction, from DALYTRAN-ID PIC X(16) at app/cpy/CVTRA06Y.cpy:L5.
            Must be absent. app/cbl/COTRN02C.cbl:L444-L451 allocates one by browsing the transaction
            file backwards from high values and adding one, and this service allocates from the
            transaction_id_seq sequence instead. A supplied value is refused with 422 carrying
            "Transaction ID is allocated by this service and must not be supplied...".
        transactionTypeCode:
          type: string
          pattern: '^[0-9]{1,2}$'
          description: >-
            Type code, from DALYTRAN-TYPE-CD PIC X(02) at app/cpy/CVTRA06Y.cpy:L6. Digits only:
            app/cbl/COTRN02C.cbl:L324 applies the COBOL numeric class test to the same field.
          examples: ['01']
        transactionCategoryCode:
          type: string
          pattern: '^[0-9]{1,4}$'
          description: >-
            Category code, from DALYTRAN-CAT-CD PIC 9(04) at app/cpy/CVTRA06Y.cpy:L7. Digits only,
            from app/cbl/COTRN02C.cbl:L330.
          examples: ['0001']
        source:
          type: string
          maxLength: 10
          description: >-
            Capture channel, from DALYTRAN-SOURCE PIC X(10) at app/cpy/CVTRA06Y.cpy:L8.
          examples: ['POS TERM']
        description:
          type: string
          maxLength: 100
          description: >-
            Description, from DALYTRAN-DESC PIC X(100) at app/cpy/CVTRA06Y.cpy:L9.
          examples: ['Purchase at Abshire-Lowe']
        amount:
          type: string
          description: >-
            Amount, from DALYTRAN-AMT PIC S9(09)V99 at app/cpy/CVTRA06Y.cpy:L10. Travels as text and
            never as a JSON number, because a number deserializes into a double and reintroduces
            binary floating point into a fixed-point calculation.


            Read with the currency-tolerant grammar app/cbl/COTRN02C.cbl:L456-L457 applies, so
            "+00000504.77", "504.77", "$504.77" and "$1,234.56" are all accepted and carry the value
            their digits state. The magnitude fits nine digits before the decimal point, which is
            what the record field holds. Every arithmetic step truncates toward zero, because the
            ROUNDED phrase appears in none of the programs under app/cbl.
          examples: ['+00000504.77', '504.77', '$1,234.56']
        merchantId:
          type: string
          pattern: '^[0-9]{9}$'
          description: >-
            Merchant identifier, from DALYTRAN-MERCHANT-ID PIC 9(09) at app/cpy/CVTRA06Y.cpy:L11.
            Digits only, from app/cbl/COTRN02C.cbl:L430.
          examples: ['800000000']
        merchantName:
          type: string
          maxLength: 50
          description: >-
            Merchant name, from DALYTRAN-MERCHANT-NAME PIC X(50) at app/cpy/CVTRA06Y.cpy:L12.
          examples: ['Abshire-Lowe']
        merchantCity:
          type: string
          maxLength: 50
          description: >-
            Merchant city, from DALYTRAN-MERCHANT-CITY PIC X(50) at app/cpy/CVTRA06Y.cpy:L13.
          examples: ['North Enoshaven']
        merchantZip:
          type: string
          maxLength: 10
          description: >-
            Merchant postal code, from DALYTRAN-MERCHANT-ZIP PIC X(10) at
            app/cpy/CVTRA06Y.cpy:L14.
          examples: ['72112']
        cardNumber:
          type: string
          pattern: '^[0-9]{1,16}$'
          description: >-
            Card number, from DALYTRAN-CARD-NUM PIC X(16) at app/cpy/CVTRA06Y.cpy:L15. Required, and
            the only way a request names its subject. A shorter value is widened with leading zeros
            to sixteen digits, which app/cbl/COTRN02C.cbl:L218-L221 does with one MOVE into a
            PIC 9(16) field.


            The cross-reference lookup runs on all sixteen characters. Only the published event
            carries a masked form, and no response body carries the number in any form.
          examples: ['4859452612877065']
        originTimestamp:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{6}$'
          description: >-
            Capture moment, from DALYTRAN-ORIG-TS PIC X(26) at app/cpy/CVTRA06Y.cpy:L16. Its first
            ten characters are compared against the account expiry date as text, character by
            character, at app/cbl/CBTRN02C.cbl:L414. The value is Coordinated Universal Time and,
            by default, must be no more than 1,440 minutes old or five minutes ahead of the service
            clock. Replace the example with the current capture moment when exercising the API.
          examples: ['2026-08-05 00:00:00.000000']
        processingTimestamp:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}-\d{2}\.\d{2}\.\d{2}\.\d{2}0000$'
          description: >-
            Posting moment, from DALYTRAN-PROC-TS PIC X(26) at app/cpy/CVTRA06Y.cpy:L17. Two
            significant fractional digits then four zeros: the redefinition at
            app/cbl/CBTRN02C.cbl:L160-L174 declares DB2-MIL PIC 9(002) and DB2-REST PIC X(04), and
            app/cbl/CBTRN02C.cbl:L701 fills that remainder with zero characters.
          examples: ['2026-08-05-00.00.00.000000']
        accountId:
          type: [string, 'null']
          pattern: '^[0-9]{1,11}$'
          description: >-
            Optional account cross-check, from XREF-ACCT-ID PIC 9(11) at
            app/cpy/CVACT03Y.cpy:L7. Never a substitute for cardNumber. When supplied beside the
            card number, it is widened to eleven digits and must equal the account the
            cross-reference resolves; a mismatch is refused.
          examples: ['00000000077', '7']

    AuthorizationResponse:
      type: object
      description: >-
        The decision. Two source fields shape it: WS-VALIDATION-FAIL-REASON PIC 9(04) at
        app/cbl/CBTRN02C.cbl:L181 and WS-VALIDATION-FAIL-REASON-DESC PIC X(76) at
        app/cbl/CBTRN02C.cbl:L182, which together fill the eighty-byte trailer of the reject record.


        accountId is absent on exactly one outcome, a decline carrying 0100, because the
        cross-reference read found no row and no account exists to name. Every other outcome names
        the account it read. The unresolved-card outcome records both the durable attempt row and
        a schema-version-2 TransactionDeclined event keyed by the allocated transaction identifier.


        No component carries a card number, masked or unmasked, and none carries the card
        verification value.
      required: [transactionId, approved]
      properties:
        transactionId:
          type: string
          maxLength: 16
          description: >-
            Identifier this decision applies to, from TRAN-ID PIC X(16) at app/cpy/CVTRA05Y.cpy:L5.
          examples: ['0000001000000001']
        accountId:
          type: [string, 'null']
          pattern: '^[0-9]{11}$'
          description: >-
            Account the card resolved to, read from the cross-reference row at
            app/cbl/CBTRN02C.cbl:L394. Null only when declineReasonCode reads 0100.
          examples: ['00000000077']
        approved:
          type: boolean
          description: >-
            True when the platform authorized the transaction. No source field carries it;
            app/cbl/CBTRN02C.cbl:L211 states the same outcome as a reject-code field holding zero.
          examples: [true]
        declineReasonCode:
          type: [string, 'null']
          enum: ['0100', '0101', '0102', '0103', null]
          description: >-
            The one reject code, four zero-padded characters. 0100 INVALID CARD NUMBER FOUND at
            app/cbl/CBTRN02C.cbl:L385, 0101 ACCOUNT RECORD NOT FOUND at L397, 0102 OVERLIMIT
            TRANSACTION at L410, 0103 TRANSACTION RECEIVED AFTER ACCT EXPIRATION at L417. Absent on
            an approval. The property name matches the TransactionDeclined event, so a client
            reading both reads one name.
          examples: ['0102']
        declineReasonDescription:
          type: [string, 'null']
          maxLength: 76
          enum:
            - INVALID CARD NUMBER FOUND
            - ACCOUNT RECORD NOT FOUND
            - OVERLIMIT TRANSACTION
            - TRANSACTION RECEIVED AFTER ACCT EXPIRATION
            - null
          description: >-
            Text of that reject code, reproduced character for character from the MOVE that writes
            it. Absent on an approval.
          examples: ['OVERLIMIT TRANSACTION']

    ApiErrorResponse:
      type: object
      description: >-
        Error body of every failed call. No COBOL ancestor: the source moves one text into WS-MESSAGE and
        redisplays the screen, as app/cbl/COTRN02C.cbl:L254-L320 does eleven times over.


        Four fields and nothing else. No field echoes the request path, the query string or a
        header, so a card number sent in the wrong position is never reflected back. error carries
        one of three fixed phrases and never caller-supplied text.
      required: [status, error, messages, timestamp]
      properties:
        status:
          type: integer
          description: The status code of the response.
          examples: [422]
        error:
          type: string
          enum: [Validation failed, Unprocessable request, Internal failure]
          description: A fixed phrase naming the class of failure.
          examples: ['Validation failed']
        messages:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
          description: >-
            One text per failing field, each reproduced from the source paragraph that emits it,
            sorted so one request reads the same body twice.
          examples:
            - ['Category CD must be Numeric...', 'Merchant Zip can NOT be empty...']
        timestamp:
          type: string
          format: date-time
          description: The moment the response was built, in Coordinated Universal Time.
          examples: ['2022-06-10T19:27:53.412Z']
