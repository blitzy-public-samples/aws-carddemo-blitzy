# COACTUPC refuses an account update whose State is left blank: the State
# field edit of 1200-EDIT-MAP-INPUTS, 1225-EDIT-ALPHA-REQD 'supplied'
# [app/cbl/COACTUPC.cbl:1592-1602,1898-1922].
#
# Steps 1-3 sign on, choose main-menu option 2 and fetch account 00000000001
# as ACT-COACTUPC-alternate-03 does: the details of the account and of the
# invented customer 000000001 are shown with ACUP-SHOW-DETAILS in the returned
# COMMAREA, and 3320-UNPROTECT-FEW-ATTRS gives every editable field MDT on, so
# all of them come back on the next AID [app/cbl/COACTUPC.cbl:2568-2580,
# 2787-2865,3500-3561].
# Step 4 erases ACSSTTE (EraseEOF, nothing typed) and presses ENTER:
# - 1100-RECEIVE-MAP leaves ACUP-NEW-CUST-ADDR-STATE-CD at LOW-VALUES whether
#   the erased field arrives as spaces (moved as LOW-VALUES) or as nulls (moved
#   as received) [app/cbl/COACTUPC.cbl:1336-1341].
# - 1205-COMPARE-OLD-NEW sets CHANGE-HAS-OCCURRED at its account test, which is
#   false because its group-id term compares the LOW-VALUES of the blank
#   Account Group with the fetched spaces (TRIM removes spaces only,
#   GAP-DEF-019), and exits before the customer fields are compared; the
#   LOW-VALUES state would differ from the fetched 'NC' as well, but that
#   comparison is not reached. So 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK
#   and runs the field edits in screen order [app/cbl/COACTUPC.cbl:1213-1218,
#   1460-1470,1697-1704,3847].
#   Every edit before State passes with these fixtures. 1225-EDIT-ALPHA-REQD,
#   with WS-EDIT-ALPHANUM-LENGTH 2, finds WS-EDIT-ALPHANUM-ONLY(1:2) equal to
#   LOW-VALUES, sets INPUT-ERROR and FLG-ALPHA-BLANK ('B', moved on to
#   FLG-STATE-BLANK) and, the message line being off since the task started,
#   STRINGs TRIM(WS-EDIT-VARIABLE-NAME) and ' must be supplied.' into
#   WS-RETURN-MSG [app/cbl/COACTUPC.cbl:1898-1922]. 1270-EDIT-US-STATE-CD runs
#   only when the alphabetic edit passed, so the state-code check is skipped,
#   and the state/zip cross-check 1280 is skipped because FLG-STATE-ISVALID is
#   not set [app/cbl/COACTUPC.cbl:1599-1602,1665-1669]. Zip and every later
#   edit pass and none could overwrite the message.
# - 2000-DECIDE-ACTION continues on ACUP-CHANGES-NOT-OK, so 9600-WRITE-PROCESSING
#   (PF5 only) does not run and nothing is written [app/cbl/COACTUPC.cbl:
#   2562-2621].
# - 3203-SHOW-UPDATED-VALUES moves the LOW-VALUES state to ACSSTTEO and
#   re-edits the valid amounts through WS-EDIT-CURRENCY-9-2-F; 3250-SETUP-INFOMSG
#   sets PROMPT-FOR-CHANGES; CSSETATY for STATE, with FLG-STATE-BLANK on a
#   reentry, colours ACSSTTE red and moves '*' to it (the field refused); the
#   cursor goes to ACSSTTE; 3320 unprotects the fields again; 3390 makes
#   F12=Cancel bright because ACUP-CHANGES-MADE, and leaves F5=Save dark
#   [app/cbl/COACTUPC.cbl:2870-2951,2955-2981,3120-3123,3291-3295,3364-3367,
#   3566-3581] [app/cpy/CSSETATY.cpy:17-26].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   ERRMSG is 'State must be supplied.' (23 characters) in the 75-byte
#   WS-RETURN-MSG, moved to the 78-byte ERRMSGO: 55 trailing spaces. ACSSTTE is
#   '*' in the 2-byte field. INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte
#   INFOMSGO.
# - AADDGRP is sent as LOW-VALUES on screen 4 (the blank group id comes back as
#   spaces, which 1100 turns into LOW-VALUES); s3270 shows nulls as spaces.
# - A dark (DRK) field is captured as blanks; no upper-case translation of
#   input is assumed (CARDDEMO.CSD gives CAUP the profile DFHCICST). Colour and
#   cursor position are not in the s3270 text capture and are not asserted.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit (the repository record fails the phone-2 and state/zip edits), so the
# blank state is the only refused field [app/cbl/COACTUPC.cbl:2225-2558].
id: ACT-COACTUPC-negative-095
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update) and fetches
  account 00000000001, then erases the State and presses ENTER. COACTUPC
  refuses the change: the message line shows 'State must be supplied.', the
  state field shows '*', the other received values are shown again with the
  change prompt and F12=Cancel, and neither ACCTDATA nor CUSTDATA is
  rewritten.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. The change prompt 'Update account details presented above.'
# (INV-ACT-030) is asserted but verified by its own scenario. Sign-on (CC00,
# COSGN00, USRSEC) and the menu transaction are verified by the SEC and MNU
# scenarios; the batch record copybooks and the data files are verified at the
# lowest level that executes them.
inventory_ids:
- INV-ACT-153  # COACTUPC State: supplied (1225-EDIT-ALPHA-REQD)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refusal screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code lookup the phone edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the '*' and red attribute of the refused field
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the four date edits, all passed
- INV-LAY-014  # CSUTLDWY: the date-edit work areas
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix COACTUPC drops the TRIM-length blank check of 1225-EDIT-ALPHA-REQD
# and TRIM from the field name in its messages, so a UniKix run would show
# 'State' padded to the 25-byte WS-EDIT-VARIABLE-NAME and never verifies the
# item; the app/ behaviour is pinned.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
