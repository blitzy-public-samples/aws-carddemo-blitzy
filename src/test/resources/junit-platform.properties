# =============================================================================
# JUnit Platform configuration for the CardDemo automated test suite.
# =============================================================================
# Enable Spring's constructor injection of test collaborators for EVERY
# SpringExtension-managed test class (for example the @DataJpaTest repository
# integration tests). With this mode set to "all", test classes may declare
# their Spring-managed dependencies (repositories, TestEntityManager, etc.) as
# final fields initialized through the test class constructor, instead of using
# field-level @Autowired -- matching the constructor-injection convention used
# throughout the production code (AAP 0.4.2 / 0.6.4).
#
# Spring Framework reads this value as a JUnit Platform configuration parameter
# (see org.springframework.test.context.TestConstructor). It has NO effect on
# plain (non-Spring) unit tests, which are never processed by SpringExtension.
spring.test.constructor.autowire.mode=all
