# Runtime configuration for the authorization service.

server:
  # The container listens on 8080. docker-compose.yml publishes a host port.
  port: 8080

spring:
  application:
    name: authorization-service

  # One private database per service. The demo credentials below match
  # card-platform/.env.example.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${AUTHORIZATION_DB_NAME:carddemo_authorization}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:carddemo}}
    # No fallback. An unset password stops start-up rather than signing on under a
    # password this repository publishes. docker-compose.yml sets
    # SPRING_DATASOURCE_PASSWORD; a direct run sets POSTGRES_PASSWORD.
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    schemas: ${SPRING_FLYWAY_SCHEMAS:${AUTHORIZATION_DB_SCHEMA:authorization_service}}
    # Flyway creates the schema named above, then applies db/migration.
    create-schemas: true
    baseline-on-migrate: false
    validate-on-migrate: true

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # Flyway owns creation. Hibernate validates the model against it.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:${AUTHORIZATION_DB_SCHEMA:authorization_service}}
        # Quotes identifiers that PostgreSQL reserves, a schema name included.
        auto_quote_keyword: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}}
    # The key serializer below takes the account identifier as text, so
    # XREF-ACCT-ID PIC 9(11) at app/cpy/CVACT03Y.cpy:L7 keeps its leading zero.
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: com.carddemo.events.serde.JsonSchemaValidatingSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        max.block.ms: 5000
    # This service registers no listener, so it carries no spring.kafka.consumer
    # and no spring.kafka.listener block. It publishes two topics and consumes
    # none.

carddemo:
  kafka:
    topics:
      transaction-authorized: ${TOPIC_TRANSACTION_AUTHORIZED:transaction.authorized}
      transaction-declined: ${TOPIC_TRANSACTION_DECLINED:transaction.declined}
  outbox:
    relay:
      fixed-delay-ms: ${OUTBOX_RELAY_INTERVAL_MS:500}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:100}

  # The two supporting services this service reads to resolve a card to an
  # account and to read the credit limit, the two cycle accumulators and the
  # expiry date the decline rules test. Both reads are synchronous and neither
  # writes. Inside the compose network a service answers on its own name and
  # port 8080; docker-compose.yml and card-platform/.env.example carry the
  # values, and a deployment outside compose overrides them.
  services:
    account:
      base-url: ${ACCOUNT_SERVICE_BASE_URL:http://account-service:8080}
    card:
      base-url: ${CARD_SERVICE_BASE_URL:http://card-service:8080}

management:
  # /actuator answers on this port and never on the service port above, so a
  # client of the Representational State Transfer (REST) surface reaches no
  # runtime, database or broker internals. docker-compose.yml publishes this port
  # on the loopback address alone.
  server:
    port: ${MANAGEMENT_PORT:9080}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,metrics,prometheus}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  # Structured JavaScript Object Notation (JSON) records on the console.
  structured:
    format:
      console: logstash
  level:
    root: ${LOG_LEVEL:INFO}
    # INFO by default. A DEBUG default retains identifiers in centralized logs.
    com.carddemo: ${LOG_LEVEL_CARDDEMO:INFO}
