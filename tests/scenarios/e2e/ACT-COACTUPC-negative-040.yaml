# COACTUPC refuses a blank cash credit limit: the first predicate of
# 1250-EDIT-SIGNED-9V2 for the Cash Credit Limit field
# [app/cbl/COACTUPC.cbl:1496-1501,2180-2196].
#
# Steps 1-3 sign on as USER0001, choose main-menu option 2 and fetch account
# 00000000001, as ACT-COACTUPC-alternate-04 does: CXACAIX gives customer
# 000000001 (card 9680294154603697, line 49 of app/data/ASCII/cardxref.txt),
# ACCTDAT and CUSTDAT are read without UPDATE, and 3202-SHOW-ORIGINAL-VALUES
# shows the records with 'Update account details presented above.'; every
# editable field is DFHBMFSE (unprotected, MDT on), so all of them come back
# on the next AID [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3500-3561,3608-3884].
# Step 4 erases the cash credit limit and presses ENTER.
# - The erased field arrives as nulls, neither '*' nor SPACES, so
#   1100-RECEIVE-MAP moves it to ACUP-NEW-CASH-CREDIT-LIMIT-X, where
#   TEST-NUMVAL-C fails and ACUP-NEW-CASH-CREDIT-LIMIT-N is not computed; the
#   X field holds LOW-VALUES either way [app/cbl/COACTUPC.cbl:1086-1098].
# - 1205-COMPARE-OLD-NEW finds a change: the COMMAREA cash limit keeps the
#   SPACES of INITIALIZE ACUP-NEW-DETAILS against the fetched 1020.00, and the
#   blank group id comes back as LOW-VALUES [app/cbl/COACTUPC.cbl:1047,
#   1211-1218,1681-1705]. 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and
#   runs the field edits in screen order [app/cbl/COACTUPC.cbl:1460-1501].
# - Account Status, Open Date, Credit Limit and Expiry Date pass on the fetched
#   values. Cash Credit Limit is next: 1250-EDIT-SIGNED-9V2 finds
#   WS-EDIT-SIGNED-NUMBER-9V2-X equal to LOW-VALUES, sets INPUT-ERROR and
#   FLG-SIGNED-NUMBER-BLANK and, the message being still off, STRINGs the
#   trimmed field name and ' must be supplied.' into WS-RETURN-MSG
#   [app/cbl/COACTUPC.cbl:2180-2196]. Every later edit passes on the invented
#   customer below, and an edit writes its message only while
#   WS-RETURN-MSG-OFF holds, so this message stays.
# - INPUT-ERROR leaves ACUP-CHANGES-NOT-OK, which 2000-DECIDE-ACTION only
#   continues on: no READ UPDATE or REWRITE runs [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES moves the LOW-VALUES of the refused field to
#   ACSHLIMO and re-edits the valid amounts through +ZZZ,ZZZ,ZZZ.99;
#   3250-SETUP-INFOMSG sets PROMPT-FOR-CHANGES and moves WS-RETURN-MSG to
#   ERRMSG; 3300 keeps the fields editable and puts the cursor on ACSHLIM, and
#   CSSETATY, the field being blank on a reentry, turns it red and moves '*'
#   into it; 3390 makes F12=Cancel bright, while F5=Save stays dark without a
#   confirmation prompt [app/cbl/COACTUPC.cbl:2718-2720,2881-2888,2964-2981,
#   2986-3051,3255-3259,3566-3581] [app/cpy/CSSETATY.cpy].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - ERRMSG is 'Cash Credit Limit' (the trimmed X(25) WS-EDIT-VARIABLE-NAME)
#   and ' must be supplied.', 35 characters, in the 75-byte WS-RETURN-MSG and
#   the 78-byte ERRMSGO. The unused 88-level texts of WS-RETURN-MSG (such as
#   CRED-LIMIT-IS-BLANK) are never set and do not appear.
# - ACSHLIM is the '*' that CSSETATY moves into the 15-byte field, padded with
#   spaces.
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   FKEY05 is dark (ASKIP,DRK) and the s3270 capture renders it as blanks.
# - The tpe adapter enters a field with EraseEOF before typing, so the empty
#   value leaves ACSHLIM erased. No upper-case translation of input is
#   assumed: CARDDEMO.CSD defines none for CAUP.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every other
# COACTUPC edit: the repository record has FICO 274, below 300, and zip 12546,
# which is not a North Carolina zip [app/cbl/COACTUPC.cbl:2514-2558]. Area code
# 919 is a general-purpose code and NC27 a valid state and zip pair
# [app/cpy/CSLKPCDY.cpy:521,895,1186]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-040
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001 with its customer 000000001, erases the cash credit
  limit and presses ENTER. COACTUPC refuses the blank value: the message line
  shows 'Cash Credit Limit must be supplied.', the cash credit limit field
  shows '*', the other entered values stay editable under 'Update account
  details presented above.', and F12=Cancel is shown while F5=Save is not.
  Nothing is saved: ACCTDATA and CUSTDATA still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-098  # COACTUPC Cash Credit Limit: supplied (1250-EDIT-SIGNED-9V2 field edit)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute and '*' set on ACSHLIM
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the date edits of the fields before and after
- INV-LAY-014  # CSUTLDWY: the date-edit work areas
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix COACTUPC comments out the TEST-NUMVAL-C amount checks of
# 1100-RECEIVE-MAP and drops FUNCTION TRIM from the field name of every
# composed edit message, so the ERRMSG of screen 4 differs on UniKix ('Cash
# Credit Limit' padded to 25 before ' must be supplied.').
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
