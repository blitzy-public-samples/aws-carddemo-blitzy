        CUST-PRI-CARD-HOLDER-IND: Y
        CUST-FICO-CREDIT-SCORE: '700'
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
# Sign-on uses the demo user and the documented demo password, which is not a
# secret.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  # The 30th of a 30-day month: the accepted edge of the 31-day rule.
  - aid: ENTER
    '@map': COACTUP
    fields:
      OPNYEAR: '2014'
      OPNMON: '04'
      OPNDAY: '30'
