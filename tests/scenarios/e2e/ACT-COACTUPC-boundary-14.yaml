    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
# Sign-on uses the demo user and the documented demo password, which is not a
# secret.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  - aid: ENTER
    '@map': COACTUP
    fields:
      OPNYEAR: '2014'
      OPNMON: '04'
      OPNDAY: '31'
