# Derived baseline of scenario ACT-COACTUPC-boundary-13 (capture_platform:
# derived), authored from the app/ source and never observed: no TPE region
# runs in CI. Open until a UniKix run of the app/ build is imported:
# GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012 (online-only
# copybooks such as CSUTLDPY and CSUTLDWY).
# Steps 1-3: USER0001 signs on, option 2 XCTLs to COACTUPC, and ENTER with
# account 00000000001 shows the fetched account and customer with the change
# prompt [app/cbl/COACTUPC.cbl:2787-2865,2955-2981].
# Step 4: 04 over OPNMON and 30 over OPNDAY make ACUP-NEW-OPEN-DATE 20140430,
# a change from 20141120, so 1200-EDIT-MAP-INPUTS edits every field in order
# [app/cbl/COACTUPC.cbl:1460-1482,1681-1696]. EDIT-DATE-CCYYMMDD accepts year
# 2014 (century 20), month 04 and day 30; EDIT-DAY-MONTH-YEAR refuses day 31
# only outside WS-31-DAY-MONTH and the 29th and 30th only in February, so
# April 30 composes no message [app/cpy/CSUTLDPY.cpy:25-279]
# [app/cpy/CSUTLDWY.cpy:21-32]. EDIT-DATE-LE calls CSUTLDTC with mask
# YYYYMMDD, and a real CEEDAYS is inferred to give severity 0 for this
# calendar date, so no 'Open Date validation error Sev code: ...' appears
# [app/cpy/CSUTLDPY.cpy:284-328]; that acceptance is known only through the
# stub (GAP-INF-001), and whether UniKix supplies CEEDAYS is unconfirmed
# (GAP-MIS-010).
# Every other field keeps its fetched, valid value, so INPUT-ERROR stays off
# and ACUP-CHANGES-OK-NOT-CONFIRMED is set [app/cbl/COACTUPC.cbl:1671-1675].
# Without PF5, 2000-DECIDE-ACTION only continues, so nothing is read for
# update or rewritten [app/cbl/COACTUPC.cbl:2590-2621]. 3203 shows the
# received values, 3250 moves PROMPT-FOR-CONFIRMATION (the X(40) WS-INFO-MSG)
# to the 45-byte INFOMSG and the blank X(75) WS-RETURN-MSG to the 78-byte
# ERRMSG, and 3390 makes F5=Save and F12=Cancel bright
# [app/cbl/COACTUPC.cbl:472-473,2870-2951,2955-2983,3566-3581].
# This pins the app/ behavior: the UniKix CSUTLDPY and CSUTLDTC differ
# (GAP-DOC-024, GAP-DOC-021), as do its COACTUPC amount edits and COACTUP.bms
# row 1 (GAP-DOC-022, GAP-DOC-025); such a record is UniKix-copy behavior and
# never replaces this file.
# Screen values are full BMS width with trailing spaces kept, because screens
# compare exactly; a dark field is captured as blanks. CURDATE and CURTIME
# come from the region clock, which no confirmed command sets (GAP-MIS-015),
# so they keep the scenario's matchers. file_state holds the records as the
# preconditions materialize them, decoded through CVACT01Y and CVCUS01Y:
# account 00000000001 keeps its open date 2014-11-20. Only
# `report.py --import-unikix` promotes this baseline; it is never edited by
# hand to match a run.
