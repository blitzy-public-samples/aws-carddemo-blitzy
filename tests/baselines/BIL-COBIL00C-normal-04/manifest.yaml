# Manifest of the derived baseline of BIL-COBIL00C-normal-04: USER0001 signs
# on, takes main-menu option 10 'Bill Payment' and pays the whole 147.00
# balance of repository account 00000000003, confirming with a lower-case y,
# so COBIL00C writes payment transaction 0000000996722788 and rewrites the
# account at 0.00 [app/cbl/COBIL00C.cbl:154-244]. Only unikix can run the
# scenario, so expected.yaml was authored from the source, not captured, and
# is inferred-not-observed (GAP-INF-008, GAP-INF-012). It names no
# execution_id or execution_fingerprint and holds no datasets/ until
# report.py --import-unikix promotes an eligible UniKix run.
#
# source_identity.units are the app/ sources the four steps execute, since
# harness.results gives a steps scenario none: the COPY closure
# (inventory_tools.copy_closure) of COSGN00C, which signs USER0001 on and
# XCTLs to COMEN01C [app/cbl/COSGN00C.cbl:230-237]; of COMEN01C, whose option
# 10 XCTLs to COBIL00C [app/cpy/COMEN02Y.cpy:80-84]; and of COBIL00C, with
# CVACT01Y, CVACT03Y and CVTRA05Y the layouts of the ACCTDAT, CXACAIX and
# TRANSACT records it reads, writes and rewrites; plus the BMS sources of the
# maps COSGN00, COMEN01 and COBIL00. COBIL00C CALLs no other app/ unit, and
# DFHAID and DFHBMSCA are CICS-supplied, not app/ sources. derived_from is
# omitted: the expectation comes from the source, not the tech spec.
