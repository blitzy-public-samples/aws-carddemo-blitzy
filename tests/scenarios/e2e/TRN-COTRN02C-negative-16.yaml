# COTRN02C refuses a transaction whose Merchant City is empty with 'Merchant
# City can NOT be empty...' and writes nothing [app/cbl/COTRN02C.cbl:306-311].
# It is the tenth check of the empty-field series that VALIDATE-INPUT-DATA-
# FIELDS evaluates in screen order, so every field before it is supplied here.
#
# Steps 1-2 reach the empty Add Transaction screen as TRN-COTRN02C-normal-01
# does: USER0001 (type U) is routed to COMEN01C, and option 8 transfers control
# to COTRN02C with the program context reset, so COTRN02C sets the re-enter
# flag, finds no transaction selected and sends COTRN02 with a blank ERRMSG
# [app/cbl/COSGN00C.cbl:230-237] [app/cbl/COMEN01C.cbl:115-156]
# [app/cbl/COTRN02C.cbl:119-130,516-528].
# Step 3 enters the valid field set of the TRN-COTRN02C scenarios, card number
# only, with Merchant City erased and CONFIRM left blank, under the CT02 that
# step 2 returned with [app/cbl/COTRN02C.cbl:131-135,530-534]:
# - ACTIDIN is blank, so the card path reads CCXREF by card number; card
#   0500024453765740 is record 1 of the CARDXREF fixture, and the READ is
#   NORMAL. The card number goes back to CARDNIN through WS-CARD-NUM-N
#   unchanged, and the cross-reference's account id, 00000000050, is moved to
#   ACTIDIN [app/cbl/COTRN02C.cbl:210-223,609-623].
# - ERR-FLG is still off, so the data fields are not cleared, and the first
#   EVALUATE finds Type CD to Merchant Name supplied and Merchant City spaces or
#   low-values. It moves the message to WS-MESSAGE and performs
#   SEND-TRNADD-SCREEN, which sends COTRN02 with ERASE and ends the task with
#   RETURN TRANSID CT02 [app/cbl/COTRN02C.cbl:235-311,516-534]. The numeric,
#   amount, date and merchant-id checks, the CONFIRM evaluation and
#   ADD-TRANSACTION are never reached, so TRANSACT is neither browsed nor
#   written [app/cbl/COTRN02C.cbl:169-188,322-466].
# COTRN2AO redefines COTRN2AI, so the screen sent back shows the fields as BMS
# received them, padded with blanks to their length, plus the two key fields
# the cross-reference read set. Merchant City and CONFIRM come back empty.
# CURDATE and CURTIME come from the region clock, so they are matchers and the
# clock is relative.
id: TRN-COTRN02C-negative-16
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 8 (Transaction Add) and enters a
  transaction for repository card 0500024453765740 with every field supplied
  except Merchant City. COTRN02C fills in account 00000000050 from the card
  cross-reference, keeps the entered values on COTRN02, shows 'Merchant City
  can NOT be empty...' and adds no record to TRANSACT.
# Primary item first, then the program, the maps asserted, the transaction step
# 3 runs under, the CSD file COTRN02C reads, and the online-only copybooks it
# copies. Sign-on and the menu (CC00, CM00, COSGN00, USRSEC, the option-8
# navigation) are verified by the SEC and MNU scenarios; TRANSACT is only
# observed here, never accessed, and the batch record copybooks and data files
# are verified at the lowest level that executes them.
inventory_ids:
- INV-TRN-045  # COTRN02C message 'Merchant City can NOT be empty...'
- INV-TRN-003  # COTRN02C program
- INV-MNU-003  # COMEN01 map, where option 8 is entered
- INV-TRN-006  # COTRN02 map, the add screen of steps 2 and 3
- INV-CFG-022  # CT02 transaction, under which COTRN02C receives the entry
- INV-CFG-004  # CCXREF CSD file, read by card number
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA carrying the program context
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the screen date and time
- INV-LAY-008  # CSMSG01Y copybook, copied by COTRN02C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-007  # TRN end-to-end baselines derived, never observed on a TPE region
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    USRSEC: {base: USRSEC}
    CARDXREF: {base: CARDXREF}
    # TRANSACT has no repository data of its own (datasets.yaml source
    # 'built'), so it is built from the 300 repository daily transactions,
    # which share its 350-byte record shape.
    TRANSACT: {base: DALYTRAN}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '8'
  # ACTIDIN is left blank, so the card number selects the cross-reference;
  # MCITY is erased.
  - aid: ENTER
    '@map': COTRN02
    fields:
      CARDNIN: '0500024453765740'
      TTYPCD: '01'
      TCATCD: '0001'
      TRNSRC: 'POS TERM'
      TDESC: 'Test purchase'
      TRNAMT: '+00000012.34'
      TORIGDT: '2022-07-01'
      TPROCDT: '2022-07-01'
      MID: '800000001'
      MNAME: 'Test Merchant'
      MCITY: ''
      MZIP: '27601'
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: 'CM00'
    PGMNAME: 'COMEN01C'
    ERRMSG: '                                                                              '
  - '@map': COTRN02
    TRNNAME: 'CT02'
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: 'COTRN02C'
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ERRMSG: '                                                                              '
  - '@map': COTRN02
    TRNNAME: 'CT02'
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: 'COTRN02C'
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ACTIDIN: '00000000050'
    CARDNIN: '0500024453765740'
    TTYPCD: '01'
    TCATCD: '0001'
    TRNSRC: 'POS TERM  '
    TDESC: 'Test purchase                                               '
    TRNAMT: '+00000012.34'
    TORIGDT: '2022-07-01'
    TPROCDT: '2022-07-01'
    MID: '800000001'
    MNAME: 'Test Merchant                 '
    MCITY: '                         '
    MZIP: '27601     '
    CONFIRM: ' '
    ERRMSG: 'Merchant City can NOT be empty...                                             '
  # The ERRMSG of each step: the menu and the empty add screen carry none.
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'Merchant City can NOT be empty...                                             '
  file_state:
    # Nothing is written: the 300 fixture records remain, and the highest one,
    # which an add would have read to compute the next id, is unchanged.
    TRANSACT:
      count: 300
      contains:
      - TRAN-ID: '0000000996722787'
        TRAN-TYPE-CD: '01'
        TRAN-CAT-CD: '1'
        TRAN-SOURCE: 'POS TERM  '
        TRAN-DESC: 'Purchase at Kilback LLC                                                                             '
        TRAN-AMT: '603.22'
        TRAN-MERCHANT-ID: '800000000'
        TRAN-MERCHANT-NAME: 'Kilback LLC                                       '
        TRAN-MERCHANT-CITY: 'Cummeratamouth                                    '
        TRAN-MERCHANT-ZIP: '53200-7529'
        TRAN-CARD-NUM: '3260763612337560'
        TRAN-ORIG-TS: '2022-06-10 19:27:53.000000'
        TRAN-PROC-TS: '                          '
