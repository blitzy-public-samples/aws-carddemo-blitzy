# An AID key other than ENTER and PF3 on the Transaction Reports screen.
# USER0001 signs on through CC00 and reaches the main menu COMEN01; option '9'
# is 'Transaction Reports', so COMEN01C zeroes CDEMO-PGM-CONTEXT and transfers
# control with XCTL to CORPT00C [app/cbl/COMEN01C.cbl:115-156]
# [app/cpy/COMEN02Y.cpy:74-78]. On that first entry CORPT00C sets
# CDEMO-PGM-REENTER, clears CORPT0AO to LOW-VALUES, puts the cursor on MONTHLY,
# sends CORPT00 with its own header and the blank WS-MESSAGE in ERRMSG, and
# returns with TRANSID(CR00) and the COMMAREA [app/cbl/CORPT00C.cbl:163-181,
# 199-202,556-591]. PF5 then starts CR00 again with that COMMAREA: CORPT00C
# receives the map, EVALUATE EIBAID handles only ENTER and PF3, and WHEN OTHER
# sets WS-ERR-FLG, puts the cursor on MONTHLY again and moves
# CCDA-MSG-INVALID-KEY of CSMSG01Y to WS-MESSAGE; SEND-TRNRPT-SCREEN rebuilds
# the header from COTTL01Y and CSDAT01Y and moves the message to ERRMSG
# [app/cbl/CORPT00C.cbl:183-194,556-580,609-628] [app/cpy/CSMSG01Y.cpy:20-21].
# Neither entry reaches PROCESS-ENTER-KEY, so no date is validated, CSUTLDTC
# is never called and nothing is written to the JOBS queue: the scenario loads
# only the sign-on user and asserts no file_state.
# MONTHLY, YEARLY, CUSTOM, the date fields and CONFIRM are not asserted: on
# this path they are whatever the received map held, sent back unchanged
# because CORPT0AO redefines CORPT0AI, and carry no business outcome.
# Text fields are compared at their full BMS length with trailing spaces:
# ERRMSG is 78 bytes [app/bms/CORPT00.bms:218-221], the 40-character message
# followed by spaces from the 80-byte WS-MESSAGE [app/cbl/CORPT00C.cbl:39].
# CURDATE and CURTIME come from the region clock, hence the matchers and
# clock_mode relative. The baseline is derived from the source: no TPE region
# runs in CI.
id: RPT-CORPT00C-negative-01
level: e2e
type: negative
description: >-
  USER0001 signs on, selects option 9 'Transaction Reports' on the main menu
  and presses PF5 on the report-selection screen CORPT00. CORPT00C accepts
  only ENTER and PF3, so it sends CORPT00 again with its header (CR00,
  CORPT00C, the titles, the run date and time) and 'Invalid key pressed.
  Please see below...' in the message line; no report is validated or
  submitted.
# The sign-on step's own items (COSGN00, CC00, USRSEC) and the option-9
# navigation belong to the SEC and MNU scenarios.
inventory_ids:
- INV-RPT-010  # CORPT00C message 'Invalid key pressed. Please see below...' (rule)
- INV-RPT-001  # CORPT00C program
- INV-MNU-003  # COMEN01 map, the main menu option 9 is entered on
- INV-RPT-002  # CORPT00 map, the screen PF5 is pressed on and sent again
- INV-CFG-019  # CR00 transaction, under which PF5 is processed
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA that makes the PF5 entry a reentry
- INV-LAY-005  # COTTL01Y copybook, TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y copybook, CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y copybook, CCDA-MSG-INVALID-KEY
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-009  # RPT end-to-end baselines derived from the source, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    # COSGN00C reads the sign-on user USER0001; this path reads nothing else.
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: USER0001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '9'}
    '@map': COMEN01
  - aid: PF5
    fields: {}
    '@map': CORPT00
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    ERRMSG: '                                                                              '
  - '@map': CORPT00
    TRNNAME: CR00
    PGMNAME: CORPT00C
    ERRMSG: '                                                                              '
  - '@map': CORPT00
    TRNNAME: CR00
    PGMNAME: CORPT00C
    TITLE01: '      AWS Mainframe Modernization       '
    TITLE02: '              CardDemo                  '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    ERRMSG: 'Invalid key pressed. Please see below...                                      '
  # One ERRMSG value per step: blank on the main menu and on the first
  # Transaction Reports screen, the invalid-key message after PF5.
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'Invalid key pressed. Please see below...                                      '
