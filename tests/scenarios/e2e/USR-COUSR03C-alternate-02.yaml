# PF3 on the COUSR03C 'Delete User' screen returns to the program that called
# it, here the admin menu.
#
# Step 1: ADMIN001 signs on through CC00 and COSGN00C routes the type 'A' user
# to COADM01C [app/cbl/COSGN00C.cbl:221-240].
# Step 2: option '4' of the admin menu is 'User Delete (Security)', so COADM01C
# moves CA00 to CDEMO-FROM-TRANID, 'COADM01C' to CDEMO-FROM-PROGRAM and 0 to
# CDEMO-PGM-CONTEXT and XCTLs to COUSR03C [app/cbl/COADM01C.cbl:115-145]
# [app/cpy/COADM02Y.cpy:39-42]. COADM01C passes only the COCOM01Y COMMAREA, so
# the group MOVE into COUSR03C's longer CARDDEMO-COMMAREA pads
# CDEMO-CU03-USR-SELECTED with spaces and no user is fetched. COUSR03C, not
# re-entered, clears COUSR3AO to LOW-VALUES and sends COUSR03 with its own
# header (TRNNAME 'CU03', PGMNAME 'COUSR03C'), empty user fields and a blank
# ERRMSG, then returns with TRANSID CU03 and the COMMAREA marked re-entered
# [app/cbl/COUSR03C.cbl:36-37,87-105,134-137,213-261].
# Step 3: PF3 runs CU03 again. COUSR03C receives the map and, for DFHPF3, finds
# CDEMO-FROM-PROGRAM set to 'COADM01C' and moves it to CDEMO-TO-PROGRAM (only a
# blank CDEMO-FROM-PROGRAM would fall back to the literal 'COADM01C');
# RETURN-TO-PREV-SCREEN sets CDEMO-FROM-TRANID CU03, CDEMO-FROM-PROGRAM
# COUSR03C and CDEMO-PGM-CONTEXT 0, then XCTLs to COADM01C with the COMMAREA
# [app/cbl/COUSR03C.cbl:107-118,197-208] [app/cpy/COCOM01Y.cpy:19-31]. No USRSEC
# read or delete is reached on this path.
# COADM01C, entered with a COMMAREA whose context is 0, takes its first-entry
# path again: it clears COADM1AO and sends the admin menu with ERASE, its own
# CA00 and COADM01C header, the COTTL01Y titles, the run clock's date and time,
# the four COADM02Y options strung into 40-byte texts, OPTN005-OPTN012 blank
# (CDEMO-ADMIN-OPT-COUNT is 4) and a blank ERRMSG, since WS-MESSAGE stays
# spaces [app/cbl/COADM01C.cbl:82-90,172-263] [app/cpy/COTTL01Y.cpy:17-22].
#
# Expected text values are whole fields at their BMS length with trailing
# spaces, because comparison never trims; ERRMSG is the first 78 bytes of the
# 80-byte WS-MESSAGE. CURDATE and CURTIME come from the region clock through
# CSDAT01Y (mm/dd/yy and hh:mm:ss), so they are matchers and the clock is
# relative. The baseline is derived from the source: no TPE region runs in CI.
id: USR-COUSR03C-alternate-02
level: e2e
type: alternate
description: >-
  ADMIN001 signs on, selects admin menu option 4 'User Delete (Security)' and
  reaches the COUSR03C Delete User screen COUSR03 (transaction CU03) with no
  user fetched. PF3 there transfers control back to the calling program
  COADM01C, which shows the admin menu COADM01 afresh with transaction CA00,
  program COADM01C, its four user-security options and no message.
inventory_ids:
- INV-USR-056  # COUSR03C PF3 return to COADM01C or the calling program (navigation rule)
- INV-USR-004  # COUSR03C program
- INV-USR-008  # COUSR03 map, the screen PF3 is pressed on
- INV-MNU-004  # COADM01 map, the screen the XCTL lands on
- INV-CFG-026  # CU03 transaction, under which PF3 is processed
- INV-LAY-002  # COCOM01Y copybook, CDEMO-FROM-PROGRAM and the COMMAREA passed with the XCTL
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the header date and time
- INV-LAY-008  # CSMSG01Y copybook, copied by COUSR03C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-004  # user administration (USR) end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    # COSGN00C reads the sign-on user ADMIN001 from USRSEC; this path of
    # COUSR03C never reads or deletes a record, so no file_state is asserted.
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: ADMIN001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '4'}
    '@map': COADM01
  - aid: PF3
    fields: {}
    '@map': COUSR03
expected:
  screens:
  - '@map': COADM01
    TRNNAME: CA00
    PGMNAME: COADM01C
  - '@map': COUSR03
    TRNNAME: CU03
    PGMNAME: COUSR03C
    TITLE01: '      AWS Mainframe Modernization       '
    TITLE02: '              CardDemo                  '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    USRIDIN: '        '
    FNAME: '                    '
    LNAME: '                    '
    USRTYPE: ' '
    ERRMSG: '                                                                              '
  - '@map': COADM01
    TRNNAME: CA00
    PGMNAME: COADM01C
    TITLE01: '      AWS Mainframe Modernization       '
    TITLE02: '              CardDemo                  '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    OPTN001: '01. User List (Security)                '
    OPTN002: '02. User Add (Security)                 '
    OPTN003: '03. User Update (Security)              '
    OPTN004: '04. User Delete (Security)              '
    OPTN005: '                                        '
    OPTN006: '                                        '
    OPTN007: '                                        '
    OPTN008: '                                        '
    OPTN009: '                                        '
    OPTN010: '                                        '
    OPTN011: '                                        '
    OPTN012: '                                        '
    OPTION: '  '
    ERRMSG: '                                                                              '
