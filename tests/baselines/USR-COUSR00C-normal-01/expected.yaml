# Derived baseline of USR-COUSR00C-normal-01: ADMIN001 signs on, takes admin
# option 1 and gets the first page of the user list. Not observed; authored
# from app/cbl/COSGN00C.cbl:211-237 (type-A XCTL to COADM01C),
# app/cbl/COADM01C.cbl:75-145,168-260 with app/bms/COADM01.bms and
# app/cpy/COADM02Y.cpy (first-entry menu, option 1 -> COUSR00C),
# app/cbl/COUSR00C.cbl:110-119,149-232,282-331,384-441,522-640 with
# app/bms/COUSR00.bms, app/cpy/COTTL01Y.cpy, app/cpy/CSDAT01Y.cpy and the
# USRSEC fixture (app/data/EBCDIC/AWS.M2.CARDDEMO.USRSEC.PS decoded as cp037:
# the 10 DUSRSECJ users in key order). The tenth READNEXT fills row 10, the page number becomes 1 and
# the look-ahead READNEXT meets end of file, leaving the bottom-of-page message
# in ERRMSG for every later send of the task. Only report.py --import-unikix
# replaces it with an observed outcome: GAP-INF-004 (derived USR end-to-end
# baselines) and GAP-INF-012 (online-only copybooks). One screen per step;
# values are whole fields at their BMS length, trailing spaces kept; CURDATE
# and CURTIME come from the region clock and are matchers. Canonical
# harness.dump_yaml layout.
