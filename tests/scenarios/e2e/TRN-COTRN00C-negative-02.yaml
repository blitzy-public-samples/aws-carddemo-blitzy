  - transid: CC00
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
    aid: ENTER
  - '@map': COMEN01
    fields:
      OPTION: '6'
    aid: ENTER
  - '@map': COTRN00
    fields:
      SEL0001: X
    aid: ENTER
