# Derived baseline of CRD-COCRDLIC-recovery-03, authored from the source, never
# observed (GAP-INF-006, GAP-INF-012); it runs only on unikix with a confirmed
# region file control to take CARDDAT out of service (GAP-MIS-011).
# PF7 is pressed on page 2. The READPREV at line 1294 has no browse to read and
# answers INVREQ (RESP 16, RESP2 41, as CICS documents it), so its WHEN OTHER
# composes 'File Error: READ on CARDDAT returned RESP 000000016 ,RESP2 000000041'
# [app/cbl/COCRDLIC.cbl:1294-1317]. That message is not asserted: the RESP-less
# ENDBR at 9100-READ-BACKWARDS-EXIT matches no browse and, with no HANDLE in
# COCRDLIC, abends the task (AEIP) before 1000-SEND-MAP, so the last step is the
# region's unformatted abend notice [app/cbl/COCRDLIC.cbl:509-512,1374-1377]
# (GAP-DEF-022). A sent map would hold page 1 and 'NO PREVIOUS PAGES TO DISPLAY'
# [app/cbl/COCRDLIC.cbl:901-904]. A differing UniKix outcome replaces this file
# only through report.py --import-unikix (MAJOR bump), never by changing app/.
