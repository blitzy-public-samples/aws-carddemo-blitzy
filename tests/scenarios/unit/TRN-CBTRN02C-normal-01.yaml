# The daily posting happy path of CBTRN02C: a credit and a debit for one account
# whose transaction category balance record already exists. Card
# 9680294154603697 cross-references account 00000000001, which starts with
# ACCT-CURR-BAL 194.00, ACCT-CREDIT-LIMIT 2020.00, zero cycle credit and debit
# and ACCT-EXPIRAION-DATE 2025-05-20; its TCATBALF record 00000000001/01/0001
# starts at 0.00. Both records pass validation (cycle credit - cycle debit +
# amount is 100.00, then 75.00, against the 2020.00 limit; origination date
# before expiry) and are posted [app/cbl/CBTRN02C.cbl:193-235,370-422]:
# - the amount is added to ACCT-CURR-BAL, and to ACCT-CURR-CYC-CREDIT when it is
#   zero or more, otherwise to ACCT-CURR-CYC-DEBIT, so the -25.00 return makes
#   the debit field negative [app/cbl/CBTRN02C.cbl:545-560];
# - the existing category balance is read and rewritten with the amount added,
#   so no 'Creating' line is displayed [app/cbl/CBTRN02C.cbl:467-501,526-542];
# - the TRANSACT record copies the daily transaction and takes TRAN-PROC-TS from
#   FUNCTION CURRENT-DATE in DB2 form, exact here because the clock is fixed
#   [app/cbl/CBTRN02C.cbl:424-444,562-579,692-705].
# TRANSACT is opened OUTPUT, which recreates it on GnuCOBOL (GAP-STB-010), so it
# holds only the records this run writes. Expected text values are full field
# width: decoded text keeps its trailing spaces and compares exactly. The
# DALYTRAN records are invented; the other datasets are the repository fixtures.
id: TRN-CBTRN02C-normal-01
level: unit
type: normal
description: >-
  CBTRN02C posts a 100.00 purchase and a -25.00 return for account 00000000001:
  the account balance becomes 269.00 with cycle credit 100.00 and cycle debit
  -25.00, the existing category balance becomes 75.00, both transactions are
  written to TRANSACT with the run timestamp, nothing is rejected, and the
  return code is 0.
