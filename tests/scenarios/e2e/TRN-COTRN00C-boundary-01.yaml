# Boundary of the COTRN00C transaction list's 10-row page: TRANSACT holds exactly
# 10 invented transactions, which fill page 1 and leave nothing for a second page
# (TRN-COTRN00C-boundary-02 adds an 11th, which does get one).
#
# USER0001 signs on; COSGN00C transfers the type-U user to COMEN01C with
# CDEMO-PGM-CONTEXT 0 [app/cbl/COSGN00C.cbl:222-240], which sends the main menu
# COMEN01 with a blank ERRMSG [app/cbl/COMEN01C.cbl:75-90]. Option 6, received
# as 06, selects COMEN02Y's 'Transaction List', program COTRN00C, and COMEN01C
# transfers control there with the context reset to 0
# [app/cbl/COMEN01C.cbl:115-156] [app/cpy/COMEN02Y.cpy:55-59].
#
# On that first entry COTRN00C [app/cbl/COTRN00C.cbl:107-116,206-229,279-328]:
# - starts a TRANSACT browse at LOW-VALUES (STARTBR without EQUAL positions at
#   or after the key, so at the first record) and, the task's AID being ENTER,
#   issues no extra READNEXT before filling rows 1-10 with ten READNEXTs in key
#   order, 0000000000000001 to 0000000000000010; row 10 keeps the last id as
#   CDEMO-CT00-TRNID-LAST [app/cbl/COTRN00C.cbl:381-445];
# - counts page 1 and reads one record ahead; with exactly 10 records that
#   READNEXT returns ENDFILE, which moves 'You have reached the bottom of the
#   page...' to WS-MESSAGE, and NEXT-PAGE-NO is set
#   [app/cbl/COTRN00C.cbl:305-313,636-645];
# - moves the page number, PIC 9(8), to the 8-byte PAGENUM as 00000001, and
#   clears the search field TRNIDIN [app/cbl/COTRN00C.cbl:62-70,324-325].
# Each row shows TRAN-ID, the MM/DD/YY of TRAN-ORIG-TS through CSDAT01Y's
# WS-TIMESTAMP, the first 26 bytes of TRAN-DESC, and TRAN-AMT edited by
# PIC +99999999.99 [app/cbl/COTRN00C.cbl:56-57,383-396] [app/cpy/CSDAT01Y.cpy:30-55].
# The task sends COTRN00 with ERASE three times (from the ENDFILE branch, after
# ENDBR, and from MAIN-PARA), the message unchanged in WS-MESSAGE throughout; the
# expected screen is the last send (only the first still has PAGENUM blank).
#
# PF8 then finds NEXT-PAGE-NO and 0000000000000010 in the COMMAREA the task
# returned with TRANSID CT00 [app/cbl/COTRN00C.cbl:61-70,111,138-141] and,
# without browsing, moves 'You are already at the bottom of the page...' to
# WS-MESSAGE and sends the map without ERASE
# [app/cbl/COTRN00C.cbl:118-128,257-274,527-549]. Every named COTRN00 field is
# FSET, PAGENUM to ERRMSG among them [app/bms/COTRN00.bms:34-453], so RECEIVE MAP
# returns the rows, page number and search field as displayed into COTRN0AI,
# which COTRN0AO redefines, and the same send writes them back unchanged: the
# screen stays on page 1 with the same ten rows. POPULATE-HEADER-INFO rewrites
# the titles, transaction, program, date and time on every send
# [app/cbl/COTRN00C.cbl:567-586].
#
# Expected values are derived from the source (no TPE region runs in CI) and are
# full field width with their trailing spaces: ERRMSG is the 78-byte ERRMSGO fed
# from the 80-byte WS-MESSAGE, and SEL0001-SEL0010 show their INITIAL blank
# because no selection is ever moved to them. messages holds the ERRMSG of each
# step. The main menu is asserted only by its identification fields and message:
# its content is the SEC-COSGN00C-normal-02 item. CURDATE and CURTIME come from
# the run clock, so they are matchers and the clock is relative.
id: TRN-COTRN00C-boundary-01
level: e2e
type: boundary
description: >-
  With exactly 10 invented transactions in TRANSACT, USER0001 opens the
  transaction list (main menu option 6, transaction CT00): COTRN00C fills all ten
  rows, 0000000000000001 to 0000000000000010, on page 1 and its look-ahead read
  reaches end of file, so ERRMSG reads 'You have reached the bottom of the
  page...'. PF8 shows no second page: the same page and rows stay, with 'You are
  already at the bottom of the page...'.
inventory_ids:
- INV-TRN-022  # COTRN00C transaction list content (report): the 10-row page size
- INV-TRN-001  # COTRN00C program
- INV-TRN-004  # COTRN00 map, the list screen asserted after both list steps
- INV-MNU-003  # COMEN01 map, where option 6 is entered
- INV-CFG-020  # CT00 transaction, the list's TRNNAME and its RETURN TRANSID
- INV-CFG-007  # TRANSACT CSD file, browsed by transaction id
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA carrying the CT00 paging state
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the screen date and time and the row dates
- INV-LAY-008  # CSMSG01Y copybook, copied by COTRN00C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-007  # derived TRN end-to-end baselines, never observed on a TPE region
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
