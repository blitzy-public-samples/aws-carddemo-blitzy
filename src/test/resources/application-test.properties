# ================================================================
# CardDemo Application - Test Profile Configuration
# ================================================================
# Spring Boot test configuration for CardDemo mainframe-to-cloud migration
# This configuration supports testing the transformation from:
#   - COBOL programs (28 files) -> Java Spring Boot services
#   - VSAM KSDS files -> PostgreSQL database with JPA entities
#   - CICS transactions -> REST API endpoints
#   - BMS 3270 screens -> React components
#   - JCL batch jobs -> Spring Batch jobs
#
# Purpose: Provide isolated test environment with H2 in-memory database
#          enabling all 50+ original COBOL test scenarios to execute
#          without external dependencies or side effects on dev/prod databases
# ================================================================

# ================================================================
# H2 In-Memory Database Configuration
# ================================================================
# Replaces PostgreSQL with H2 in-memory database for fast, isolated test execution
# MODE=PostgreSQL ensures JPA entity annotations work identically in test and production
# This validates VSAM-to-PostgreSQL transformation without requiring actual PostgreSQL instance

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 console for test data inspection during debugging
# Access at: http://localhost:<random-port>/h2-console
# Useful for verifying COBOL COMP-3 BigDecimal precision in monetary fields
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ================================================================
# JPA and Hibernate Configuration for Tests
# ================================================================
# Auto-create schema from JPA entity classes (@Entity annotations)
# This validates that COBOL copybook structures (CVCUS01Y, CVACT01Y, etc.)
# correctly transformed to JPA entities with proper field types and constraints

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Disable batch fetching for predictable test behavior
spring.jpa.properties.hibernate.jdbc.batch_size=0
spring.jpa.properties.hibernate.order_inserts=false
spring.jpa.properties.hibernate.order_updates=false

# Connection handling for test isolation
spring.jpa.properties.hibernate.connection.autocommit=false
spring.jpa.properties.hibernate.current_session_context_class=thread

# ================================================================
# Debug Logging Configuration
# ================================================================
# Comprehensive logging for troubleshooting COBOL-to-Java transformation issues
# Validates that business logic from COBOL PROCEDURE DIVISION correctly
# transformed to Java service methods with identical behavior

logging.level.root=INFO
logging.level.com.carddemo=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.springframework.batch=DEBUG

# SQL logging to trace VSAM operations transformation to JPA queries
# Critical for validating VSAM READ/WRITE/REWRITE/DELETE -> repository methods
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicExtractor=TRACE

# Connection pool logging for resource management validation
logging.level.com.zaxxer.hikari=DEBUG

# ================================================================
# Spring Security Configuration for Tests
# ================================================================
# Disable Spring Security to simplify unit testing without authentication overhead
# This allows direct service method invocation without JWT token setup
# Validates COBOL business logic independent of RACF security transformation

spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

# ================================================================
# Lightweight Resource Configuration
# ================================================================
# Minimal connection pool for single-threaded test execution
# Sufficient for unit tests validating COBOL program transformations

spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000

# ================================================================
# Session Management for Tests
# ================================================================
# Disable Redis session storage for stateless test execution
# Tests don't require COMMAREA state persistence from CICS pseudo-conversational processing

spring.session.store-type=none
spring.redis.enabled=false

# ================================================================
# Caching Configuration for Tests
# ================================================================
# Disable caching to ensure test data changes are immediately visible
# Prevents stale data issues in transaction validation tests

spring.cache.type=none

# Disable Hibernate second-level cache for tests
# Overrides main application.properties cache configuration
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# ================================================================
# Spring Batch Configuration for Tests
# ================================================================
# Manual batch job execution control for testing COBOL batch programs:
#   CBACT01C-04C (account/card/customer data load, interest calculation)
#   CBTRN01C-03C (cross-reference, transaction processing, combine)
#   CBSTM03A/B (statement generation)
# Spring Batch tables are created via schema.sql, not auto-initialization

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never
spring.batch.jdbc.table-prefix=BATCH_

# Batch job execution settings for test performance
spring.batch.job.names=
spring.batch.jdbc.isolation-level-for-create=SERIALIZABLE

# ================================================================
# Flyway Migration Configuration
# ================================================================
# Disable Flyway since schema is auto-generated from JPA entities in test mode
# This avoids dependency on V1-V8 migration scripts during unit tests
# Entity-driven schema ensures @DataJpaTest tests work with latest entity definitions

spring.flyway.enabled=false

# ================================================================
# Data Initialization Configuration
# ================================================================
# Enable SQL initialization to load schema.sql for test database setup
# Required because Hibernate ddl-auto=create-drop does not work reliably with H2 in test context
# Schema file location: src/test/resources/sql/schema.sql

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/schema.sql
spring.jpa.defer-datasource-initialization=true

# ================================================================
# Jackson JSON Configuration for Tests
# ================================================================
# Readable JSON output for test assertions
# Validates COMMAREA structure transformation to JSON DTOs

spring.jackson.serialization.indent-output=true
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Date/time formatting for CEEDAYS Lillian date conversion validation
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC

# ================================================================
# Server Configuration for Tests
# ================================================================
# Random available port assignment for parallel test execution
# Prevents port conflicts when running multiple test suites simultaneously

server.port=0
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# ================================================================
# Actuator Configuration for Tests
# ================================================================
# Minimal actuator endpoints for health check tests only
# Reduces test startup time and resource consumption

management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoint.health.show-details=always

# ================================================================
# Transaction Management for Tests
# ================================================================
# Proper transaction handling for @Transactional test rollback behavior
# Validates CICS SYNCPOINT/ROLLBACK transformation to Spring transactions

spring.jpa.properties.hibernate.connection.autocommit=false
spring.transaction.default-timeout=30
spring.transaction.rollback-on-commit-failure=true

# ================================================================
# Validation Configuration
# ================================================================
# Enable Bean Validation for testing COBOL field validation transformation
# 88-level conditions and PIC clause constraints -> @NotNull, @Size, @Pattern annotations

spring.jpa.properties.javax.persistence.validation.mode=auto
spring.validation.enabled=true

# ================================================================
# Test-Specific Application Properties
# ================================================================
# Application settings for test environment

# JWT configuration (even though security is disabled, needed for JWT utility tests)
jwt.secret=testSecretKeyForJwtTokenGenerationInTestEnvironmentOnly1234567890
jwt.expiration=86400000

# Pagination settings for testing list operations
# Validates BMS screen pagination: 7 cards per page, 10 transactions per page
app.pagination.cards-per-page=7
app.pagination.transactions-per-page=10
app.pagination.max-page-size=100

# Interest calculation test settings
# Validates CBACT04C.cbl interest calculation with BigDecimal precision
app.interest.annual-rate=0.1999
app.interest.calculation-mode=DAILY
app.interest.rounding-mode=HALF_UP

# Transaction validation test settings
# Validates COTRN02C.cbl transaction authorization logic
app.transaction.max-amount=999999.99
app.transaction.min-amount=0.01
app.transaction.authorization-timeout=200

# ================================================================
# Batch Job Test Configuration
# ================================================================
# Settings for testing Spring Batch jobs transformed from JCL

# Chunk size for batch processing tests
app.batch.chunk-size=10
app.batch.skip-limit=5
app.batch.retry-limit=3

# Test data file paths (referenced in batch job tests)
app.batch.test-data.customer-file=classpath:test-data/custdata.txt
app.batch.test-data.account-file=classpath:test-data/acctdata.txt
app.batch.test-data.card-file=classpath:test-data/carddata.txt
app.batch.test-data.transaction-file=classpath:test-data/dailytran.txt

# ================================================================
# Test Profile Indicator
# ================================================================
# Explicit marker that this is test configuration
# Used by conditional beans and test-specific logic

spring.config.activate.on-profile=test

# ================================================================
# Additional Test Settings
# ================================================================

# Disable context caching for isolated test execution
spring.test.context.cache.maxSize=0

# Enable test database initialization
spring.test.database.replace=any

# Disable banner for cleaner test output
spring.main.banner-mode=off

# Allow bean definition overriding for test mocks
spring.main.allow-bean-definition-overriding=true

# Disable circular reference checks for test configurations
spring.main.allow-circular-references=true

# ================================================================
# COBOL-to-Java Transformation Validation Notes
# ================================================================
# This configuration enables validation of:
#
# 1. Data Precision: BigDecimal for COBOL COMP-3 packed decimal fields
#    - All monetary calculations produce identical results to 2 decimal places
#    - RoundingMode.HALF_UP matches COBOL rounding behavior
#
# 2. Transaction Boundaries: @Transactional methods match CICS commit/rollback
#    - Multi-file updates maintain ACID properties
#    - Rollback on exception matches CICS behavior
#
# 3. Data Access Patterns: JPA repositories match VSAM operations
#    - findById() matches VSAM READ with KEY
#    - save() matches VSAM WRITE/REWRITE
#    - deleteById() matches VSAM DELETE
#
# 4. Business Logic Preservation: Service methods match COBOL PROCEDURE DIVISION
#    - PERFORM paragraphs -> Java methods
#    - EVALUATE statements -> switch expressions
#    - 88-level conditions -> enum checks
#
# 5. Screen Field Validation: Bean Validation matches BMS field attributes
#    - PIC clauses -> @Size, @Pattern, @Digits
#    - COBOL validation rules -> custom validators
#
# 6. Batch Processing: Spring Batch jobs match JCL batch processing
#    - Chunk-oriented processing replaces sequential file processing
#    - JobRepository maintains checkpoint/restart capability
#    - Transaction management per chunk matches COMMIT frequency
#
# 7. Date Handling: LocalDate/LocalDateTime match CEEDAYS Lillian format
#    - Conversion utilities preserve date arithmetic
#    - ISO-8601 format for JSON serialization
#
# 8. Error Handling: Java exceptions match COBOL RESP/RESP2 codes
#    - ResourceNotFoundException matches record-not-found
#    - ValidationException matches field validation failures
#    - BusinessLogicException matches business rule violations
#
# All 50+ original COBOL test scenarios must pass with identical outcomes
# using this test configuration to validate functional equivalence.
# ================================================================
