  schedule: "0 3 * * *"
  
  # Concurrency policy: Forbid prevents overlapping job executions
  # Critical to avoid duplicate transaction posting
  concurrencyPolicy: Forbid
  
  # Keep history of last 3 successful and failed jobs for audit trail
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  
  # Start job within 5 minutes of scheduled time or consider it failed
