# Derived baseline of scenario ACT-COACTUPC-negative-083 (capture_platform
# derived, tag inferred-not-observed), authored from the app/ source and never
# captured: no TPE region runs in CI. It pins the accepting outcome of the
# Date of Birth EDIT-DATE-LE predicate (observed-only, GAP-UNC-017): no date is
# known that passes the COBOL date edits yet draws a nonzero CEEDAYS severity,
# so the composed refusal of EDIT-DATE-LE is not asserted
# [app/cpy/CSUTLDPY.cpy:284-321].
# - Steps 1-3: USER0001 signs on, takes main-menu option 2 (OPTN002), and
#   ENTER with account 00000000001 shows the account and the invented customer
#   000000001 with 'Update account details presented above.'; F5 and F12 stay
#   dark and are captured as blanks [app/cbl/COACTUPC.cbl:2787-2865,
#   2955-2981,3566-3584].
# - Step 4: 1964/02/29 over the date of birth (1961-06-08) is received into
#   ACUP-NEW-CUST-DOB-YYYY-MM-DD [app/cbl/COACTUPC.cbl:1254-1275].
#   1200-EDIT-MAP-INPUTS passes every earlier field, then edits 'Date of Birth'
#   as 19640229 [app/cbl/COACTUPC.cbl:1429-1538]: year 1964 (century 19),
#   month 02 and day 29 pass, and in EDIT-DAY-MONTH-YEAR the February 29th
#   divides 1964 by 4 (WS-EDIT-DATE-YY-N 64 is not 0) with remainder 0
#   [app/cpy/CSUTLDPY.cpy:18-282]. EDIT-DATE-LE calls CSUTLDTC with mask
#   YYYYMMDD; severity 0 sets no error [app/cpy/CSUTLDPY.cpy:284-330].
#   EDIT-DATE-OF-BIRTH then finds the run date's day number greater than that
#   of 1964-02-29 [app/cbl/COACTUPC.cbl:1539-1543]
#   [app/cpy/CSUTLDPY.cpy:341-370].
#   Every later edit passes on the invented customer, so
#   ACUP-CHANGES-OK-NOT-CONFIRMED stands and ENTER without PF5 rewrites nothing
#   [app/cbl/COACTUPC.cbl:1545-1676,2602-2621].
# - 3203-SHOW-UPDATED-VALUES shows the date of birth as typed in DOBYEAR,
#   DOBMON and DOBDAY and the amounts re-edited through +ZZZ,ZZZ,ZZZ.99; 3250
#   moves the X(40) 'Changes validated.Press F5 to save' to the 45-byte INFOMSG
#   and the blank X(75) WS-RETURN-MSG to the 78-byte ERRMSG; 3390 makes F5=Save
#   and F12=Cancel bright [app/cbl/COACTUPC.cbl:2870-2951,2955-2983,3566-3584].
# What CEEDAYS returns for this date is inferred, not observed (GAP-INF-001,
# GAP-MIS-010). The UniKix copy changes CSUTLDTC (GAP-DOC-021), COACTUPC
# (GAP-DOC-022), CSUTLDPY (GAP-DOC-024) and COACTUP row 1 (GAP-DOC-025), so a
# unikix record is UniKix-copy behaviour: it never verifies the app/ items and
# `report.py --import-unikix` must not promote this file.
# Values are whole BMS fields with trailing spaces kept; CURDATE and CURTIME
# come from the region clock, hence matchers (clock_mode relative). file_state
# holds the materialized fixtures decoded through CVACT01Y and CVCUS01Y,
# unchanged because nothing is saved before PF5. Every value equals the
# scenario's inline expected, field for field; only the fields a record names
# are compared, so the FILLER fields are not listed. Open under GAP-INF-005 and
# GAP-INF-012.
