# The daily batch cycle on the repository data, run as one chain against one
# catalog: POSTTRAN, INTCALC, TRANBKP, COMBTRAN, CREASTMT, TRANREPT. It is the
# second scenario of the job-chain proof (python tests/harness/report.py
# --check-proof), after BAT-POSTINT-normal-01, and gnucobol-batch's observed
# baseline is the authoritative one.
#
# TRANBKP runs between INTCALC and COMBTRAN, where the README runs it
# [README.md:177-181]: COMBTRAN reads the current TRANSACT-BKUP generation,
# which only TRANBKP has written at that point [app/jcl/COMBTRAN.jcl:23-26],
# while the request's chain leaves it out (GAP-DOC-015).
#
# The preconditions are the repository files, each a bare base, with
# TRANSACT-INIT, one 350-byte record of x'00', as TRANSACT. The clock is the
# default, 2022-07-06 10:00:00.00, and clock_mode is fixed: the TRANREPT
# INCLUDE window, 2022-01-01 to 2022-07-06 [app/jcl/TRANREPT.jcl:43-48],
# filters the processing timestamps POSTTRAN and INTCALC have just written, so
# the report depends on the absolute date. unikix has no confirmed clock
# command, so there the chain is blocked under GAP-MIS-015. No job or data
# file creates the DATEPARM dataset that CBTRN03C reads, so the scenario
# supplies the same window as its DATEPARM parameter (GAP-MIS-001).
#
# What each job does here, observed on gnucobol-batch:
# - POSTTRAN (CBTRN02C) reads the 300 daily transactions, 6 for each of the 50
#   cards, rejects 38 as 0102 'OVERLIMIT TRANSACTION' and posts 262, RC 4.
#   OPEN OUTPUT recreates TRANSACT, so TRANSACT-INIT's record does not survive
#   (GAP-STB-010) [app/cbl/CBTRN02C.cbl:256]. Each account's posted purchases
#   are added to its existing 01/0001 category balance and its returns create
#   a 03/0001 balance, 50 new TCATBALF records. The over-limit test uses cycle
#   totals that accumulate through the run (GAP-UNC-011).
# - INTCALC (CBACT04C, PARM 2022071800 through PARMDRV, GAP-STB-004) reads
#   the 100 category balances. No account's ACCT-GROUP-ID is set, so each
#   lookup shows 'DISCLOSURE GROUP RECORD MISSING' and 'TRY WITH DEFAULT
#   GROUP CODE' and takes the DEFAULT rate (GAP-DEF-005): 15.00 for 01/0001,
#   0.00 for 03/0001, which writes no interest record. That gives 50 interest
#   transactions, 2022071800000001 to 2022071800000050, type 01, category
#   0005, source 'System', each TRAN-CAT-BAL * 15.00 / 1200 truncated.
#   Accounts 1 to 49 get their interest added to ACCT-CURR-BAL and their cycle
#   totals zeroed. Account 50 is never rewritten (GAP-DEF-003): it keeps
#   POSTTRAN's cycle totals, and its 18.77 interest reaches SYSTRAN but not its
#   balance [app/cbl/CBACT04C.cbl:188-222,350-356].
# - TRANBKP copies the 262 records to a new TRANSACT-BKUP generation through
#   REPROC and REPROCT, then deletes and redefines TRANSACT empty. Its
#   COND=(4,LT) is a JCL-semantics item the job driver records and never
#   evaluates.
# - COMBTRAN sorts that backup and the interest records by TRAN-ID into
#   TRANSACT-COMBINED, 312 records, and loads them into TRANSACT; the UniKix
#   copy gives the combined file other attributes (GAP-DOC-029).
# - CREASTMT restructures TRANSACT into TRXFL, keyed by card and transaction
#   id, the 328 bytes of its OUTREC padded with spaces to 350 (GAP-STB-006,
#   GAP-DOC-026), then runs CBSTM03A, which displays the job and step the
#   page-zero shim supplies (GAP-STB-003, GAP-DOC-020) and writes one text and
#   one HTML statement per card: 19 text lines plus one per transaction, 1,262
#   records, and 64 HTML lines plus 11 per transaction, 6,632 records. Each
#   statement lists the card's posted transactions and its interest record,
#   whose description ends in the x'00' fill that GnuCOBOL's defaultbyte 0
#   gives CBACT04C's never-initialized description (GAP-STB-011).
# - TRANREPT backs the 312 records up to a second TRANSACT-BKUP generation,
#   which is the current one at the end, sorts them by card into TRANSACT-DALY,
#   all 312 inside the window, and CBTRN03C writes the 519-line report:
#   18 pages, 49 account totals and one grand total. The last card gets no
#   account total, and its last amount, 20.43, is added to the page total a
#   second time, so the grand total of 79,254.29 exceeds the 312 amounts'
#   sum of 79,233.86 by it; account-total lines count toward the 20-line page,
#   so some page breaks are skipped (GAP-DEF-012). The REPROC and SORT steps,
#   both named STEP05R in the JCL, report as STEP05R.PRC001 and STEP05R
#   (GAP-DEF-009).
# The IDCAMS, SORT and IEFBR14 steps run through the job driver's
# replacements, and the GDG generations through its catalog emulation
# (GAP-STB-005, GAP-STB-006, GAP-STB-007, GAP-STB-009).
#
# CREASTMT's CBSTM03A step needs page zero mapped. Where the page-zero probe
# fails, gnucobol-batch raises AdapterUnavailable under GAP-MIS-002, the whole
# scenario is blocked and the proof is reported unmet with that reason; the
# chain is never split to avoid it.
#
# inventory_ids lists only the daily-cycle item: the job, program, layout and
# data-file items this chain passes through are verified by their own unit and
# integration scenarios, and listing them here would let a failed page-zero
# probe block them.
#
# The expectations below state the business outcomes. The observed baseline
# pins the rest: the complete message list (CBTRN02C's 50 TCATBAL creation
# lines, CBACT04C's display of each category balance, CBSTM03A's DD list,
# CBTRN03C's display of each record and of its end-of-file amounts), every
# record of every dataset and the complete catalog. Text keeps its trailing
# spaces and compares exactly; "\0" is the x'00' byte.
id: BAT-CHAIN-normal-01
level: integration
type: normal
description: >-
  The daily batch cycle POSTTRAN, INTCALC, TRANBKP, COMBTRAN, CREASTMT and
  TRANREPT on the repository data against one catalog: 300 daily transactions,
  38 rejected over limit and 262 posted; 50 interest transactions; the posted
  and interest records combined into a TRANSACT of 312; a text and an HTML
  statement for each of the 50 cards; and a transaction report listing all
  312. Accounts 1 to 49 carry their postings and interest with zero cycle
  totals, account 50 its postings only, and the highest return code is
  POSTTRAN's 4.
inventory_ids:
- INV-BAT-001  # BAT daily batch cycle POSTTRAN to TRANREPT (job)
tags:
- suspected-defect
- observed-only
gap_ids:
- GAP-DOC-015  # the request's chain leaves TRANBKP out; the README runs it after INTCALC
- GAP-MIS-001  # no job or data file creates the DATEPARM dataset CBTRN03C reads
- GAP-MIS-002  # page zero must be mappable for CBSTM03A, or the chain is blocked
- GAP-MIS-015  # unikix cannot fix the clock this fixed-clock chain needs
- GAP-DEF-003  # INTCALC never rewrites the last account
- GAP-DEF-005  # every account's group id sits in ACCT-ADDR-ZIP; ACCT-GROUP-ID is blank
- GAP-DEF-009  # TRANREPT names both its REPROC and SORT steps STEP05R
- GAP-DEF-012  # CBTRN03C report control: last amount added twice, no last account total
- GAP-UNC-011  # the over-limit test accumulates the cycle totals through the run
- GAP-STB-003  # the page-zero PSA/TCB/TIOT shim of CBSTM03A
- GAP-STB-004  # PARMDRV in place of INTCALC's EXEC PARM linkage
- GAP-STB-005  # IDCAMS replacement: REPRO with REPROCT, DELETE, DEFINE, IF MAXCC
- GAP-STB-006  # SORT replacement (COMBTRAN, CREASTMT OUTREC padding, TRANREPT INCLUDE)
- GAP-STB-007  # IEFBR14 and DISP replacement (CREASTMT STEP030)
- GAP-STB-009  # catalog and GDG generation emulation
- GAP-STB-010  # Berkeley DB indexed files; OPEN OUTPUT recreates TRANSACT
- GAP-STB-011  # GnuCOBOL compile and runtime options; the x'00' description fill
- GAP-DOC-020  # the UniKix CBSTM03A shows no job, step or DD list
- GAP-DOC-026  # the UniKix CREASTMT sort pads TRXFL differently
- GAP-DOC-027  # the UniKix TRANREPT job sorts and supplies DATEPARM differently
- GAP-DOC-029  # the UniKix COMBTRAN gives TRANSACT-COMBINED other attributes
preconditions:
  datasets:
    DALYTRAN: {base: DALYTRAN}
    CARDXREF: {base: CARDXREF}
    ACCTDATA: {base: ACCTDATA}
    TCATBALF: {base: TCATBALF}
    DISCGRP: {base: DISCGRP}
    CUSTDATA: {base: CUSTDATA}
    TRANTYPE: {base: TRANTYPE}
    TRANCATG: {base: TRANCATG}
    TRANSACT: {base: TRANSACT-INIT}
  parameters:
    clock_mode: fixed
    DATEPARM: '2022-01-01 2022-07-06'
  faults: []
inputs:
  job: [POSTTRAN, INTCALC, TRANBKP, COMBTRAN, CREASTMT, TRANREPT]
expected:
  # The highest step return code of the chain: POSTTRAN's 4, every other step 0.
  return_code: 4
  # An ordered subsequence of the step lines (STEP <name> RC <nnnn>, each
  # job's steps in JCL order) and of the program DISPLAY lines that state the
  # outcome: CBTRN02C's counts, CBACT04C's 100 missing-group fallbacks, one
  # per category balance, CBSTM03A's job and step, CBTRN03C's report window.
  # Job runs write no line of their own on either adapter, so each job's
  # return code is the highest of its step lines. CBSTM03A's DD-name list and
  # the lines whose numbers GnuCOBOL's DISPLAY formats are left to the
  # observed baseline, so these lines name no ddname and hold no
