# COACTUPC refuses a Date of Birth year that is not a 4-digit number: the
# second predicate of EDIT-YEAR-CCYY, which the procedure copybook CSUTLDPY
# brings into COACTUPC, for the Date of Birth field
# [app/cpy/CSUTLDPY.cpy:47-61] [app/cbl/COACTUPC.cbl:1533-1543].
#
# Steps 1-3 sign on as USER0001, choose main-menu option 2 and fetch account
# 00000000001, as ACT-COACTUPC-alternate-04 does: CXACAIX gives customer
# 000000001 (card 9680294154603697, line 49 of app/data/ASCII/cardxref.txt),
# ACCTDAT and CUSTDAT are read without UPDATE, and 3202-SHOW-ORIGINAL-VALUES
# shows the records with 'Update account details presented above.'; every
# editable field is DFHBMFSE (unprotected, MDT on), so all of them come back
# on the next AID [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3500-3561,3608-3884].
# Step 4 types 19B1, with the letter B in place of the digit 6, over the birth
# year 1961 and presses ENTER.
# - 1100-RECEIVE-MAP moves 19B1, neither blank nor '*', to
#   ACUP-NEW-CUST-DOB-YEAR [app/cbl/COACTUPC.cbl:1256-1261].
# - 1205-COMPARE-OLD-NEW sets CHANGE-HAS-OCCURRED at its account test: the
#   group-id term compares the LOW-VALUES that 1100-RECEIVE-MAP moves for the
#   blank Account Group with the fetched spaces, which TRIM does not make
#   equal (it removes spaces only, GAP-DEF-019), so the test is false whatever
#   its other terms give and the paragraph exits before the customer fields
#   are compared. ACUP-NEW-CUST-DOB-YYYY-MM-DD would differ from the fetched
#   19610608 as well, but that comparison is not reached. So
#   1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs the field edits in
#   screen order [app/cbl/COACTUPC.cbl:1213-1218,1460-1470,1697-1704,3847].
# - Account Status, the Open, Expiry and Reissue Dates, the five amounts and
#   the SSN pass on the fetched values [app/cbl/COACTUPC.cbl:1472-1531].
# - Date of Birth moves the field name and 19B10608 to WS-EDIT-DATE-CCYYMMDD
#   and performs EDIT-DATE-CCYYMMDD through its exit
#   [app/cbl/COACTUPC.cbl:1533-1537]. EDIT-YEAR-CCYY finds WS-EDIT-DATE-CCYY
#   not blank but NOT NUMERIC, sets INPUT-ERROR and FLG-YEAR-NOT-OK and, the
#   message being still off, STRINGs the trimmed field name and
#   ' must be 4 digit number.' into WS-RETURN-MSG
#   [app/cpy/CSUTLDPY.cpy:25-61] [app/cpy/CSUTLDWY.cpy:5-15].
# - GO TO EDIT-YEAR-CCYY-EXIT falls through into EDIT-MONTH and EDIT-DAY, which
#   accept 06 and 08; EDIT-DAY-MONTH-YEAR finds the date flags not all valid and
#   goes to EDIT-DATE-CCYYMMDD-EXIT, so CSUTLDTC is not called
#   [app/cpy/CSUTLDPY.cpy:88-331]. The flags reach WS-EDIT-DT-OF-BIRTH-FLGS with
#   FLG-DT-OF-BIRTH-YEAR-NOT-OK, so WS-EDIT-DT-OF-BIRTH-ISVALID is false and
#   EDIT-DATE-OF-BIRTH (the future-date check) is not performed
#   [app/cbl/COACTUPC.cbl:216-230,1538-1543].
# - FICO Score and every later edit pass on the invented customer below, and an
#   edit writes its message only while WS-RETURN-MSG-OFF holds, so this message
#   stays [app/cbl/COACTUPC.cbl:1545-1675].
# - INPUT-ERROR leaves ACUP-CHANGES-NOT-OK, which 2000-DECIDE-ACTION only
#   continues on: no READ UPDATE or REWRITE runs [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values, 19B1 included, with the
#   valid amounts re-edited through +ZZZ,ZZZ,ZZZ.99; 3250-SETUP-INFOMSG sets
#   PROMPT-FOR-CHANGES and moves WS-RETURN-MSG to ERRMSG; 3300 keeps the
#   fields editable, CSSETATY turns DOBYEAR red (no '*', the field is not
#   blank) and the cursor goes to it; 3390 makes F12=Cancel bright, while
#   F5=Save stays dark without a confirmation prompt
#   [app/cbl/COACTUPC.cbl:2870-2953,2955-2985,3089-3092,3315-3319,3566-3581]
#   [app/cpy/CSSETATY.cpy].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - ERRMSG is 'Date of Birth' (the trimmed X(25) WS-EDIT-VARIABLE-NAME) and
#   ' must be 4 digit number.', 37 characters, in the 75-byte WS-RETURN-MSG and
#   the 78-byte ERRMSGO. Unlike the other year messages, this template has no
#   ' : ' before its text.
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   DOBYEAR is JUSTIFY=(RIGHT), which leaves a full 4-character entry as typed
#   [app/bms/COACTUP.bms:291-295]. FKEY05 is dark (ASKIP,DRK) and the s3270
#   capture renders it as blanks.
# - The tpe adapter enters a field with EraseEOF before typing. No upper-case
#   translation of input is assumed: CARDDEMO.CSD defines none for CAUP.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative. The refused year stops the edit before the run date is
#   read, so no outcome depends on it.
#
# Customer 000000001 is replaced by invented data that passes every other
# COACTUPC edit: the repository record has FICO 274, below 300, and zip 12546,
# which is not a North Carolina zip [app/cbl/COACTUPC.cbl:2514-2558]. Area code
# 919 is a general-purpose code and NC27 a valid state and zip pair
# [app/cpy/CSLKPCDY.cpy:521,895,1186]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-072
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001 with its customer 000000001, changes the birth year from
  1961 to 19B1 (letter B for the digit 6) and presses ENTER. COACTUPC refuses
  the value: the message line shows 'Date of Birth must be 4 digit number.',
  the screen keeps the entered values, 19B1 included, editable under 'Update
  account details presented above.', and F12=Cancel is shown while F5=Save is
  not. Nothing is saved: ACCTDATA and CUSTDATA still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-130  # COACTUPC Date of Birth: year a 4-digit number (EDIT-YEAR-CCYY field edit)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute set on DOBYEAR
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-YEAR-CCYY, which composes the message
- INV-LAY-014  # CSUTLDWY: WS-EDIT-DATE-CCYY and the date-edit flags
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY drops FUNCTION TRIM from the field name of every composed
# date-edit message, so the deployed copy would show 'Date of Birth' padded to
# the 25-byte WS-EDIT-VARIABLE-NAME before ' must be 4 digit number.'.
- GAP-DOC-024
# The UniKix COACTUPC comments out the TEST-NUMVAL-C amount checks behind the
# re-edited amounts of screen 4.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
        CUST-ADDR-ZIP: '27601'
        CUST-PHONE-NUM-1: (919)555-0101
        CUST-PHONE-NUM-2: (919)555-0102
        CUST-SSN: '123456789'
        CUST-GOVT-ISSUED-ID: TESTGOVT0001
        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: Y
        CUST-FICO-CREDIT-SCORE: '700'
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
# PASSWORD is the documented demo password of README.md, not a secret.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  # The letter B, not the digit 6, in the third position of the year.
  - aid: ENTER
    '@map': COACTUP
    fields:
      DOBYEAR: '19B1'
