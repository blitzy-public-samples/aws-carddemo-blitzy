# The report structure of CBTRN03C on six in-window transactions of two
# accounts and three cards, supplied in card order as the TRANREPT sort leaves
# them [app/jcl/TRANREPT.jcl:37-55]. The first record writes the four header
# lines, and every detail line carries the account from CARDXREF and the type
# and category descriptions from TRANTYPE and TRANCATG [app/cbl/CBTRN03C.cbl:
# 181-196,274-290,324-341,361-374].
#
# The account totals follow the card number, not the account: a card change
# writes the previous card's total and a separator, so the cards
# 9680294154603697 and 9999000033330001 of account 00000000001 are totalled
# apart [app/cbl/CBTRN03C.cbl:181-185,306-316]. At end of file the last amount,
# 12.34, is added to the page total a second time, so the page and grand totals
# read 179.68 where the six amounts sum to 167.34, and the last card's account
# total is never written [app/cbl/CBTRN03C.cbl:197-203,293-304,318-322]. Both
# are pinned as observed, never fixed (GAP-DEF-012). The line counter reaches 14,
# so no page break occurs; RPT-CBTRN03C-boundary-03 and -04 cover the break.
#
# The second card of account 00000000001 is invented and added to the
# repository CARDXREF; every TRANSACT-DALY record is invented, with ids,
# descriptions and merchants that match no repository transaction. DATEPARM is
# built from the parameter, because no job or data file creates it
# (GAP-MIS-001). All values come from a GnuCOBOL 3.2 run of the app/ source under
# the suite's compile options. Report lines are the whole 133-byte records with
# their trailing spaces; DISPLAY TRAN-RECORD shows the whole 350-byte record.
# The two end-of-file DISPLAYs of elementary signed items show the digits with a
# separate trailing sign, as libcob displays them (GAP-STB-011).
id: RPT-CBTRN03C-normal-01
level: unit
type: normal
description: >-
  CBTRN03C reports six in-window transactions of two accounts and three cards:
  the 'Daily Transaction Report' header with 'Date Range: 2022-07-01 to
  2022-07-31', one detail line per transaction with its account, type and
  category descriptions, an account total and separator at each card change
  (+30.00 and +25.00), then, at end of file, a page total and a grand total of
  +179.68 that count the last amount twice and no account total for the third
  card, with return code 0.
inventory_ids:
- INV-RPT-040  # CBTRN03C account totals (report)
- INV-RPT-003  # CBTRN03C program
- INV-RPT-036  # CBTRN03C DATEPARM window (rule): every record lies inside it
- INV-RPT-037  # CBTRN03C report header (report)
- INV-RPT-038  # CBTRN03C detail line (report)
- INV-RPT-041  # CBTRN03C end-of-file totals (report)
- INV-LAY-025  # CVTRA05Y copybook, the TRANSACT-DALY record and the displayed TRAN-RECORD
- INV-LAY-027  # CVTRA07Y copybook, the report line layouts
- INV-LAY-023  # CVTRA03Y copybook, the TRANTYPE record giving the type description
- INV-LAY-024  # CVTRA04Y copybook, the TRANCATG record giving the category description
- INV-LAY-018  # CVACT03Y copybook, the CARDXREF record giving the account id
- INV-DTA-003  # cardxref.txt, the CARDXREF fixture source
- INV-DTA-013  # EBCDIC card cross-reference file, its cross-check counterpart
- INV-DTA-009  # trantype.txt, the TRANTYPE fixture source
- INV-DTA-020  # EBCDIC transaction type file, its cross-check counterpart
- INV-DTA-008  # trancatg.txt, the TRANCATG fixture source
- INV-DTA-019  # EBCDIC transaction category file, its cross-check counterpart
tags:
- suspected-defect
gap_ids:
- GAP-DEF-012  # the doubled last amount and the missing last account total
- GAP-MIS-001  # no job or data file creates the DATEPARM dataset
- GAP-STB-010  # Berkeley DB indexed files in place of the VSAM KSDS
- GAP-STB-011  # GnuCOBOL compile and runtime options in place of Enterprise COBOL and LE
