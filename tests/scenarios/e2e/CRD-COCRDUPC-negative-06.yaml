# ENTER on the card update screen with every fetched value left as it was:
# COCRDUPC finds the returned card data equal to what it fetched and shows 'No
# change detected with respect to values fetched.' instead of asking for
# confirmation.
#
# Step 1: USER0001 (type U) signs on through CC00; COSGN00C routes it to the
# main menu COMEN01 [app/cbl/COSGN00C.cbl:221-237].
# Step 2: option '5' is the COMEN02Y entry 'Credit Card Update', program
# COCRDUPC, so COMEN01C sets itself as the calling program, zeroes
# CDEMO-PGM-CONTEXT and XCTLs to it [app/cpy/COMEN02Y.cpy:49-53]
# [app/cbl/COMEN01C.cbl:115-156]. COCRDUPC tests CDEMO-FROM-PROGRAM before it
# has copied DFHCOMMAREA, so it copies the COMMAREA in; CDEMO-FROM-PROGRAM is
# then COMEN01C without CDEMO-PGM-REENTER, so the fresh-entry branch clears
# WS-THIS-PROGCOMMAREA and sends COCRDUP from a cleared output map: blank
# search keys, 'Please enter Account and Card Number' in INFOMSG and the
# cleared WS-RETURN-MSG in ERRMSG. It sets CDEMO-PGM-REENTER and returns with
# TRANSID CCUP [app/cbl/COCRDUPC.cbl:384-401,502-511,546-558,1052-1163].
# Step 3: ENTER with account 00000000050 and card 0500024453765740 runs
# 1000-PROCESS-INPUTS: both filters are supplied and numeric
# [app/cbl/COCRDUPC.cbl:578-605,641-661,721-800]. With CCUP-DETAILS-NOT-FETCHED,
# 2000-DECIDE-ACTION falls into the fetch: 9100-GETCARD-BYACCTCARD reads CARDDAT
# by the card number, the READ is NORMAL, and 9000-READ-DATA keeps the
# upper-cased embossed name, the expiry year, month and day and the status in
# CCUP-OLD-DETAILS of the COMMAREA; CCUP-SHOW-DETAILS is set
# [app/cbl/COCRDUPC.cbl:954-966,1343-1413]. 3200 sends those values, and 3300
# gives CRDNAME, CRDSTCD, EXPMON and EXPYEAR DFHBMFSE (unprotected, MDT on) and
# ACCTSID and CARDSID DFHBMPRF (protected, MDT on)
# [app/cbl/COCRDUPC.cbl:1107-1112,1181-1190]. EXPDAYA is left at LOW-VALUES, so
# the map's own ATTRB=(DRK,FSET,PROT) applies and the dark expiry day is sent
# with its MDT on too [app/bms/COCRDUP.bms:142-146].
# Step 4: ENTER with no field typed. Every field the update compares carries
# its MDT, so the terminal returns the name, status, month, year and day as
# sent, and 1100-RECEIVE-MAP rebuilds CCUP-NEW-CARDDATA from them
# [app/cbl/COCRDUPC.cbl:586-635]. None is blank or '*', and the name keeps its
# 50 bytes, so UPPER-CASE of the new data equals UPPER-CASE of the old:
# NO-CHANGES-DETECTED is set in WS-RETURN-MSG and the name, status and expiry
# edits are skipped [app/cbl/COCRDUPC.cbl:667-693]. 2000-DECIDE-ACTION keeps
# CCUP-SHOW-DETAILS [app/cbl/COCRDUPC.cbl:971-977], so COCRDUP is sent again
# with the fetched values, 'Details of selected card shown above' in INFOMSG
# and the message in ERRMSG [app/cbl/COCRDUPC.cbl:1107-1112,1145-1146,1161-1163].
# No READ UPDATE or REWRITE runs, so CARDDATA keeps its 50 records and the card
# its original-case name.
#
# Expected values are derived from the source; no TPE region runs in CI.
# - Text values are whole fields at their BMS length with trailing spaces:
#   CRDNAME 50, INFOMSG 40 (WS-INFO-MSG), ERRMSG 80 on COCRDUP (the 75-byte
#   WS-RETURN-MSG padded; its last position, row 24 column 1, is the attribute
#   byte of FKEYS and shows as a space) and 78 on COMEN01.
# - EXPDAY is dark, so it is not part of the displayed screen and is not
#   asserted.
# - CURDATE and CURTIME come from the region clock, so they are matchers and
#   the clock is relative.
id: CRD-COCRDUPC-negative-06
level: e2e
type: negative
description: >-
  USER0001 signs on, selects main menu option 5 'Credit Card Update', fetches
  card 0500024453765740 of account 00000000050 on the COCRDUP screen (CCUP) and
  presses ENTER without changing any field. COCRDUPC compares the returned
  name, status and expiry with the values it fetched, finds no change, skips
  the field edits and sends the screen again with name ANIYA VON, status Y,
  expiry 03/2023 and 'No change detected with respect to values fetched.';
  CARDDATA is not updated.
# The message condition is the primary item. After it come the program, the
# maps asserted (COMEN01 on step 1, COCRDUP on steps 2 to 4), the transaction
# the fetch and the unchanged ENTER run under, the CSD file the fetch reads,
# and the online-only copybooks COCRDUPC copies. Sign-on (CC00, COSGN00,
# USRSEC), the menu option and the information messages are verified by their
# own scenarios; the batch copybooks and the data files are left out, because
# their lowest executing level is unit or integration.
inventory_ids:
- INV-CRD-059  # COCRDUPC message 'No change detected with respect to values fetched.' (rule)
- INV-CRD-003  # COCRDUPC program
- INV-MNU-003  # COMEN01 map, the main menu option 5 is entered on
- INV-CRD-006  # COCRDUP map, the update screen of steps 2-4
- INV-CFG-015  # CCUP transaction, under which the fetch and the unchanged ENTER run
- INV-CFG-003  # CARDDAT CSD file, read by the fetch and left unchanged
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA carrying the context between steps
- INV-LAY-005  # COTTL01Y copybook, TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y copybook, CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y copybook, copied by COCRDUPC
- INV-LAY-009  # CSMSG02Y copybook, the abend variables
- INV-LAY-011  # CSSTRPFY copybook, the AID mapping that turns ENTER into CCARD-AID-ENTER
- INV-LAY-019  # CVCRD01Y copybook, the AID flags and the CC-ACCT-ID and CC-CARD-NUM filters
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-006  # CRD end-to-end baselines derived from the source, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    # COSGN00C reads the sign-on user USER0001.
    USRSEC: {base: USRSEC}
    # Record 1 is card 0500024453765740 of account 00000000050: 'Aniya Von',
    # expiry 2023-03-09, status Y.
    CARDDATA: {base: CARDDATA}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - {transid: CC00, aid: ENTER, fields: {USERID: USER0001, PASSWD: PASSWORD}, '@map': COSGN00}
  - {aid: ENTER, fields: {OPTION: '5'}, '@map': COMEN01}
  - {aid: ENTER, fields: {ACCTSID: '00000000050', CARDSID: '0500024453765740'}, '@map': COCRDUP}
  # No field typed: the fetched values go back as sent.
  - {aid: ENTER, fields: {}, '@map': COCRDUP}
expected:
  screens:
  # One entry per step, each the screen the step ends on.
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    OPTN005: '05. Credit Card Update                  '
    ERRMSG: '                                                                              '
  - '@map': COCRDUP
    TRNNAME: CCUP
    PGMNAME: COCRDUPC
    ACCTSID: '           '
    CARDSID: '                '
    INFOMSG: 'Please enter Account and Card Number    '
    ERRMSG: '                                                                                '
  - '@map': COCRDUP
    TRNNAME: CCUP
    PGMNAME: COCRDUPC
    ACCTSID: '00000000050'
    CARDSID: '0500024453765740'
    CRDNAME: 'ANIYA VON                                         '
    CRDSTCD: 'Y'
    EXPMON: '03'
    EXPYEAR: '2023'
    INFOMSG: 'Details of selected card shown above    '
    ERRMSG: '                                                                                '
  # The values fetched at step 3, sent again unchanged, with the message.
  - '@map': COCRDUP
    TRNNAME: CCUP
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COCRDUPC
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ACCTSID: '00000000050'
    CARDSID: '0500024453765740'
    CRDNAME: 'ANIYA VON                                         '
    CRDSTCD: 'Y'
    EXPMON: '03'
    EXPYEAR: '2023'
    INFOMSG: 'Details of selected card shown above    '
    ERRMSG: 'No change detected with respect to values fetched.                              '
  # One ERRMSG value per step: blank on the menu, the fresh and the fetched
  # update screens, the no-change message after the unchanged ENTER.
  messages:
  - '                                                                              '
  - '                                                                                '
  - '                                                                                '
  - 'No change detected with respect to values fetched.                              '
  file_state:
    # Nothing is rewritten: the card keeps the values loaded, its name in its
    # original case, and CARDDATA keeps its 50 records.
    CARDDATA:
      count: 50
      contains:
      - CARD-NUM: '0500024453765740'
        CARD-ACCT-ID: '50'
        CARD-CVV-CD: '747'
        CARD-EMBOSSED-NAME: 'Aniya Von                                         '
        CARD-EXPIRAION-DATE: '2023-03-09'
        CARD-ACTIVE-STATUS: 'Y'
