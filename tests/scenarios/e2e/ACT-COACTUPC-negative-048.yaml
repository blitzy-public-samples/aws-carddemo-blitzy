# COACTUPC refuses a Reissue Date whose day is blank: the day-supplied
# predicate of EDIT-DAY, which the procedure copybook CSUTLDPY contributes to
# COACTUPC's EDIT-DATE-CCYYMMDD, for the Reissue Date field
# [app/cpy/CSUTLDPY.cpy:150-165] [app/cbl/COACTUPC.cbl:1500-1507].
#
# Steps 1-3 sign on as USER0001, choose main-menu option 2 and fetch account
# 00000000001, as ACT-COACTUPC-alternate-04 does: CXACAIX gives customer
# 000000001 (card 9680294154603697, line 49 of app/data/ASCII/cardxref.txt),
# ACCTDAT and CUSTDAT are read without UPDATE, and 3202-SHOW-ORIGINAL-VALUES
# shows the records with 'Update account details presented above.'; every
# editable field is DFHBMFSE (unprotected, MDT on), so all of them come back
# on the next AID [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3500-3561,3608-3884].
# Step 4 erases the reissue day (20) and presses ENTER.
# - 1100-RECEIVE-MAP moves LOW-VALUES to ACUP-NEW-REISSUE-DAY for a blank,
#   null or '*' RISDAY [app/cbl/COACTUPC.cbl:1204-1209].
# - 1205-COMPARE-OLD-NEW finds the reissue date changed, so
#   1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs the field edits in
#   screen order [app/cbl/COACTUPC.cbl:1460-1476,1681-1705]. Account Status,
#   Open Date, Credit Limit, Expiry Date and Cash Credit Limit pass on the
#   fetched values.
# - Reissue Date is the sixth edit. EDIT-DATE-CCYYMMDD is performed THRU its
#   exit, so it runs EDIT-YEAR-CCYY (2025: supplied, numeric, century 20) and
#   EDIT-MONTH (05: supplied, 1-12, numeric), then EDIT-DAY finds the day
#   LOW-VALUES, sets INPUT-ERROR and FLG-DAY-BLANK and, the message being still
#   off, STRINGs the trimmed field name and ' : Day must be supplied.' into
#   WS-RETURN-MSG [app/cpy/CSUTLDPY.cpy:18-147,150-165]. Its GO TO falls into
#   EDIT-DAY-MONTH-YEAR: May is a 31-day month and not February, and the date
#   flags (x'00', x'00', 'B') are not WS-EDIT-DATE-IS-VALID, so control goes to
#   EDIT-DATE-CCYYMMDD-EXIT and CSUTLDTC is not called
#   [app/cpy/CSUTLDPY.cpy:209-277,329] [app/cpy/CSUTLDWY.cpy:43-57].
# - The flags move to WS-EDIT-REISSUE-DATE-FLGS, giving FLG-REISSUE-DAY-BLANK
#   [app/cbl/COACTUPC.cbl:263-276,1507]. Every later edit passes on the
#   invented customer below, and an edit writes its message only while
#   WS-RETURN-MSG-OFF holds, so this message stays.
# - INPUT-ERROR leaves ACUP-CHANGES-NOT-OK, which 2000-DECIDE-ACTION only
#   continues on: no READ UPDATE or REWRITE runs [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values, with the valid amounts
#   re-edited through +ZZZ,ZZZ,ZZZ.99; 3250-SETUP-INFOMSG sets
#   PROMPT-FOR-CHANGES and moves WS-RETURN-MSG to ERRMSG; 3300 keeps the
#   fields editable, CSSETATY turns RISDAY red and, the day being blank, moves
#   '*' to RISDAYO, and the cursor goes to RISDAY; 3390 makes F12=Cancel
#   bright, while F5=Save stays dark without a confirmation prompt
#   [app/cbl/COACTUPC.cbl:2918-2920,2964-2981,2986-3019,3061-3063,3273-3277,
#   3566-3581] [app/cpy/CSSETATY.cpy].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - ERRMSG is 'Reissue Date' (the trimmed X(25) WS-EDIT-VARIABLE-NAME) and
#   ' : Day must be supplied.', 36 characters, in the 75-byte WS-RETURN-MSG and
#   the 78-byte ERRMSGO.
# - RISDAY shows '*' and a space: the one-character literal moved to the
#   two-byte RISDAYO.
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   FKEY05 is dark (ASKIP,DRK) and the s3270 capture renders it as blanks.
# - The tpe adapter enters a field with EraseEOF before typing, and types
#   nothing for the empty value, so RISDAY is sent erased with its MDT on.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every other
# COACTUPC edit: the repository record has FICO 274, below 300, and zip 12546,
# which is not a North Carolina zip [app/cbl/COACTUPC.cbl:2514-2558]. Area code
# 919 is a general-purpose code and NC27 a valid state and zip pair
# [app/cpy/CSLKPCDY.cpy:521,895,1186]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-048
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001 with its customer 000000001, erases the day of the
  reissue date (2025-05-20) and presses ENTER. COACTUPC refuses the date: the
  message line shows 'Reissue Date : Day must be supplied.', the reissue day
  shows '*', the screen keeps the other values editable under 'Update account
  details presented above.', and F12=Cancel is shown while F5=Save is not.
  Nothing is saved: ACCTDATA and CUSTDATA still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-106  # COACTUPC Reissue Date: day supplied (EDIT-DAY of CSUTLDPY)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute and '*' set on RISDAY
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-DAY, which refuses the blank day
- INV-LAY-014  # CSUTLDWY: the date-edit work areas and flags
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY drops FUNCTION TRIM from the field name of every composed
# date-edit message, so the ERRMSG of screen 4 differs on UniKix.
- GAP-DOC-024
# The UniKix COACTUPC comments out the TEST-NUMVAL-C amount checks that set the
# numeric amounts 3203-SHOW-UPDATED-VALUES re-edits, so the amounts on screen 4
# may differ on UniKix.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
