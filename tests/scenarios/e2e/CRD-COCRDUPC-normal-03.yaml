# COCRDUPC card REWRITE: USER0001 makes card 0500024453765740 (account
# 00000000050) inactive with expiry month 12 and year 2026 on the Credit Card
# Update screen and saves it with PF5.
#
# Step 1 signs on through CC00; COSGN00C routes the type-U user to the main menu
# COMEN01, asserted by its header and option 5 only (sign-on belongs to SEC-COSGN00C).
# Step 2 enters option 5: COMEN01C moves CM00 and COMEN01C to CDEMO-FROM-TRANID and
# CDEMO-FROM-PROGRAM, resets the context to enter and transfers control to COCRDUPC
# with its 160-byte COMMAREA [app/cpy/COMEN02Y.cpy:49-53] [app/cbl/COMEN01C.cbl:145-155].
# COCRDUPC takes WHEN CDEMO-FROM-PROGRAM = LIT-MENUPGM AND NOT CDEMO-PGM-REENTER: it
# initializes its own COMMAREA area and sends COCRDUP with only the search keys
# unprotected, no card data, and 'Please enter Account and Card Number'
# [app/cbl/COCRDUPC.cbl:502-511,1084-1085,1141-1142,1173-1180].
# Step 3 runs under CCUP with CDEMO-PGM-REENTER, so WHEN OTHER receives the map. Both
# keys are numeric and non-zero, and 2000-DECIDE-ACTION performs 9000-READ-DATA, which
# reads CARDDAT by card number, keeps the CVV, upper-cases the embossed name and keeps
# name, expiry parts and status as CCUP-OLD-DETAILS. The screen shows them with
# 'Details of selected card shown above' and unprotects name, status, month and year
# with FSET [app/cbl/COCRDUPC.cbl:535-542,578-661,721-799,948-966,1107-1112,1145-1146,
# 1181-1190,1343-1413].
# Step 4 types N, 12 and 2026; the adapter erases each field before typing.
# 1100-RECEIVE-MAP initializes CCUP-NEW-DETAILS and moves the received fields into it:
# the name comes back as displayed, 'ANIYA VON', and the dark EXPDAY field, defined
# DRK,FSET,PROT, comes back as '09' [app/bms/COCRDUP.bms:142-146]
# [app/cbl/COCRDUPC.cbl:578-636]. The new data differs from the old, the name holds only
# letters and a space, N is Y or N, 12 lies in 1-12 and 2026 in 1950-2099, so the action
# becomes 'N'. The screen shows the received values, protected, with 'Changes
# validated.Press F5 to save', and makes 'F5=Save F12=Cancel' bright
# [app/cbl/COCRDUPC.cbl:668-714,806-944,1006-1007,1113-1123,1149-1150,1191-1199,1315-1317].
# That name test is the one the UniKix copy rewrites (GAP-DOC-023); both forms accept a
# name of letters and spaces.
# Step 5 presses PF5, valid only while the action is 'N' [app/cbl/COCRDUPC.cbl:413-420].
# 1200-EDIT-MAP-INPUTS skips the edits for 'N'. 9200-WRITE-PROCESSING reads CARDDAT for
# update, finds the card unchanged since the fetch (9300-CHECK-CHANGE-IN-REC), builds
# CARD-UPDATE-RECORD and REWRITEs it. The action becomes 'C' and the screen shows
# 'Changes committed to database' with the save keys dark again
# [app/cbl/COCRDUPC.cbl:685-692,988-1000,1113-1123,1151-1152,1191-1199,1420-1523].
#
# The rewritten card, derived from 9200 and the CARD-UPDATE-RECORD layout
# [app/cbl/COCRDUPC.cbl:314-321,1461-1475]:
# - CARD-NUM is CCUP-NEW-CARDID and CARD-ACCT-ID is CC-ACCT-ID-N, the received keys.
# - CARD-EMBOSSED-NAME is CCUP-NEW-CRDNAME, the screen value, so the stored 'Aniya Von'
#   becomes 'ANIYA VON' although the user never edited the name.
# - CARD-EXPIRAION-DATE is STRING year '-' month '-' day: 2026-12-09.
# - CARD-ACTIVE-STATUS is N.
# - CARD-CVV-CD: the map has no CVV field, so CCUP-NEW-CVV-CD keeps the spaces
#   INITIALIZE gave it. 9200 moves them to CARD-CVV-CD-X and moves its numeric
#   redefinition CARD-CVV-CD-N, PIC 9(03), to CARD-UPDATE-CVV-CD
#   [app/cbl/COCRDUPC.cbl:107-109,586,1464-1465], so the stored CVV 747 is lost. A MOVE
#   of invalid numeric data has no defined result. On the source's compiler (Enterprise
#   COBOL with the default NUMPROC(NOPFD)) a move between unsigned zoned fields of one
#   size copies the bytes and forces the zone of the last byte to F, which gives '  0',
#   pinned below as {raw: '202030'}. A runtime that copies the bytes unchanged gives
#   '202020', one that converts digit by digit '000'; the observed value replaces this
#   derived one when UniKix evidence is imported.
# - The FILLER (columns 92-150) is not asserted. INITIALIZE skips it, so it holds what the
#   COMMAREA area held, which step 2 copied from beyond the 160 bytes COMEN01C passed
#   [app/cbl/COCRDUPC.cbl:396-400,506]: storage the platform decides.
# The other 49 cards are unchanged; their FILLER, spaces in the fixture, is left out as
# in the account rewrite of ACT-COACTUPC-normal-03.
#
# Screen values are whole fields at their BMS length, trailing spaces kept. Fields left
# at LOW-VALUES and dark (DRK) fields, EXPDAY and FKEYSC unless brightened, read as
# blanks in the s3270 capture. CURDATE and CURTIME come from the run clock through
# CSDAT01Y [app/cbl/COCRDUPC.cbl:1052-1074], hence the matchers and clock_mode relative.
id: CRD-COCRDUPC-normal-03
level: e2e
type: normal
description: >-
  USER0001 signs on, chooses main menu option 5 'Credit Card Update', fetches card
  0500024453765740 of account 00000000050, sets its status to N and its expiry to
  12/2026 (ENTER gives 'Changes validated.Press F5 to save') and saves with PF5,
  which gives 'Changes committed to database'. COCRDUPC rewrites the CARDDAT record
  with status N and expiry 2026-12-09, the day kept from the dark EXPDAY field. Two
  findings are pinned as derived: the embossed name is written back as the
  upper-cased screen value 'ANIYA VON' in place of the stored 'Aniya Von', although
  the name was not edited; and CARD-CVV-CD is rewritten from CCUP-NEW-CVV-CD, which
  no input sets, so the stored CVV 747 becomes the invalid numeric bytes '  0'. The
  other 49 cards are unchanged.
# Primary item first, then the program, the maps asserted, the transaction the
# update runs under, the CSD file it reads and rewrites, and the online-only
# copybooks COCRDUPC copies. Sign-on and the menu option (CC00, CM00, COSGN00,
# USRSEC) are verified by the SEC and MNU scenarios, the information messages by
# their own CRD scenarios, and the batch record copybooks and the data files at the
# lowest level that executes them.
inventory_ids:
- INV-CRD-079  # COCRDUPC card REWRITE (interface)
- INV-CRD-003  # COCRDUPC program
- INV-MNU-003  # COMEN01 map, where option 5 is entered
- INV-CRD-006  # COCRDUP map, steps 2-5
- INV-CFG-015  # CCUP transaction, which runs the fetch, the edits and the save
- INV-CFG-003  # CARDDAT CSD file: card master read, read for update and rewritten
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and the keys
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y, copied by COCRDUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COCRDUPC
- INV-LAY-011  # CSSTRPFY: the AID mapping that recognizes PF5
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID, CC-CARD-NUM and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-006  # CRD end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-DOC-023  # the UniKix copy rewrites the name test the save passes through
