# card-platform fraud-detection-service — runtime contract for one container.
#
# Every value that changes between environments reads an environment variable
# and falls back to the default card-platform/.env.example documents, so this
# service starts with no .env file present. docker-compose.yml overrides what
# it injects.
#
# This service is net new: no COBOL program in app/cbl/ is an ancestor.

server:
  # The container listens on 8080, and docker-compose.yml publishes a host port
  # onto it.
  port: 8080

  # Transport Layer Security for the Representational State Transfer surface, off in the
  # shipped file and on in the cluster. The compose stack runs every service on one
  # Docker bridge on one machine and publishes each port on the loopback address alone,
  # so there is no network path there for a third party to read. A cluster pod network is
  # a shared path, so deploy/k8s/30-configmap.yaml sets SERVER_SSL_ENABLED to true and
  # names the keystore deploy/k8s/31-secret.example.yaml templates.
  #
  # Every value below carries a default, and the default of the keystore password is
  # empty rather than absent: a shipped file that stopped start-up over a keystore
  # nothing has asked for would be a file nobody could run. Enabling the first key
  # without the other three is what fails, loudly, at start-up.
  ssl:
    enabled: "${SERVER_SSL_ENABLED:false}"
    key-store: "${SERVER_SSL_KEYSTORE:}"
    key-store-type: "${SERVER_SSL_KEYSTORE_TYPE:PKCS12}"
    key-store-password: "${SERVER_SSL_KEYSTORE_PASSWORD:}"

spring:

  application:
    name: fraud-detection-service

  datasource:
    # sslmode=require encrypts this connection and stops the driver from falling back to
    # cleartext. It does not verify the certificate, because a direct run has no
    # certificate authority to verify against; the compose stack overrides this whole URL
    # with the same mode against a server that presents a certificate it generated for
    # itself, and deploy/k8s/30-configmap.yaml overrides it with verify-full, because a
    # cluster has an authority and a network path worth protecting.
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${FRAUD_DB_NAME:carddemo_fraud}?currentSchema=${FRAUD_DB_SCHEMA:fraud_service}&sslmode=require}"
    # This service's own login, which owns one database on the compose path and one schema on
    # the cluster path. The superuser is deliberately not the default here: a shared login
    # would mean the private schema this service claims to own was a convention rather than a
    # control, and a compromise of any service could read and alter every other service's
    # card, customer, balance, fraud and event data. A login name is not a credential and
    # carries a default; the password below carries none.
    username: "${SPRING_DATASOURCE_USERNAME:${FRAUD_DB_USER:carddemo_fraud_svc}}"
    # No fallback. An unset password stops start-up. docker-compose.yml sets
    # SPRING_DATASOURCE_PASSWORD; a direct run sets POSTGRES_PASSWORD.
    password: "${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}"
    driver-class-name: org.postgresql.Driver

  # Flyway creates the schema named below, then applies the Data Definition
  # Language (DDL) migrations under db/migration.
  flyway:
    enabled: true
    create-schemas: true
    schemas: "${SPRING_FLYWAY_SCHEMAS:${FRAUD_DB_SCHEMA:fraud_service}}"
    default-schema: "${SPRING_FLYWAY_DEFAULT_SCHEMA:${FRAUD_DB_SCHEMA:fraud_service}}"
    baseline-on-migrate: false
    validate-on-migrate: true

  # Jakarta Persistence. Hibernate checks its mapping against the migrated
  # schema at start-up and writes no schema object.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: "${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:${FRAUD_DB_SCHEMA:fraud_service}}"

  kafka:
    bootstrap-servers: "${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}}"

    # Broker authentication. The broker requires a Simple Authentication and Security
    # Layer (SASL) identity on every client listener, and its authorizer refuses any
    # operation no access control entry allows, so this service reaches exactly the
    # topics and the consumer group its own configuration names and nothing else.
    # docker-compose.yml installs that matrix at broker start and
    # deploy/k8s/10-kafka.yaml installs the same one.
    #
    # SASL_PLAINTEXT authenticates without encrypting, which is the shipped default and
    # what the compose stack runs: the broker publishes on the loopback address alone and
    # every service reaches it across one Docker bridge on one machine.
    # deploy/k8s/30-configmap.yaml sets SASL_SSL instead, because a cluster pod network
    # is a shared path, and supplies the truststore by environment as
    # SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION and _PASSWORD. Those two keys are
    # deliberately absent here: an empty truststore path in a shipped file reads like a
    # setting that has been dealt with.
    security:
      protocol: "${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}"
    properties:
      sasl.mechanism: "${KAFKA_SASL_MECHANISM:PLAIN}"
      # A username is not a credential and carries a default. The password carries none,
      # so an unset variable stops start-up rather than presenting a password this
      # repository publishes. card-platform/.env.example documents both.
      sasl.jaas.config: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_SASL_USERNAME:carddemo-fraud}"
        password="${KAFKA_SASL_PASSWORD}";

    # Idempotent production, acknowledged by every in-sync replica. The key
    # serializer takes the account identifier as text, and XREF-ACCT-ID
    # PIC 9(11) at app/cpy/CVACT03Y.cpy:L7 carries eleven digits with leading
    # zeros.
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: com.carddemo.events.serde.JsonSchemaValidatingSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        max.block.ms: 5000

    # One listener is to read one topic, under a consumer group of this
    # service's own, with automatic commit off. No listener is registered yet.
    consumer:
      group-id: "${SPRING_KAFKA_CONSUMER_GROUP_ID:${GROUP_FRAUD_DETECTION:fraud-detection}}"
      enable-auto-commit: false
      auto-offset-reset: "${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}"
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # The delegate below is the deserializer com.carddemo:event-contracts
      # ships, so a payload is validated on consume against the same document it
      # was validated against on publish. Nothing loads this setting yet, because
      # this module registers no listener.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: com.carddemo.events.serde.JsonSchemaValidatingDeserializer
        max.poll.interval.ms: 300000

    # The listener acknowledges once its own writes commit, and manual_immediate
    # commits the offset at that acknowledgement.
    listener:
      ack-mode: manual_immediate
      concurrency: 1

carddemo:

  kafka:
    # transaction.authorized is the one topic this service reads. FraudFlagged
    # and FraudCleared both travel on fraud.assessed, and a reader routes on
    # the envelope eventType field. One shared dead-letter topic carries every
    # record no listener could consume.
    topics:
      transaction-authorized: "${TOPIC_TRANSACTION_AUTHORIZED:transaction.authorized}"
      fraud-assessed: "${TOPIC_FRAUD_ASSESSED:fraud.assessed}"
      dead-letter: "${TOPIC_DEAD_LETTER:carddemo.dead-letter}"

  consumer:
    retry:
      max-attempts: "${CONSUMER_MAX_RETRY_ATTEMPTS:3}"
      backoff-ms: "${CONSUMER_RETRY_BACKOFF_MS:1000}"

  outbox:
    relay:
      fixed-delay-ms: "${OUTBOX_RELAY_INTERVAL_MS:500}"
      batch-size: "${OUTBOX_RELAY_BATCH_SIZE:100}"
    # Retention. A published row has done its work and stays only for diagnosis, and a
    # processed-event marker matters only while a redelivery of its event is still
    # possible. The purge methods on the two repositories delete rows past these
    # horizons, and ix_outbox_event_published_at and ix_processed_event_processed_at
    # serve those deletes. Both tables grow without bound if nothing calls them.
    published-retention-hours: "${OUTBOX_PUBLISHED_RETENTION_HOURS:168}"
  processed-event:
    marker-retention-hours: "${PROCESSED_EVENT_RETENTION_HOURS:168}"

  fraud:
    # Demonstration values. No measurement stands behind any of the four. A risk
    # score runs from 0 to 100 and carries no decimal place. The amount is money
    # and carries two.
    risk:
      flag-threshold: 50
      velocity-window-minutes: 60
      velocity-count-threshold: 5
      amount-anomaly-threshold: "500.00"

  # Request identities. config/SecurityConfig maps each entry onto one Spring Security
  # user, and start-up fails when this list is empty: a service that runs with no
  # identity would either refuse every request or invite a default one.
  #
  # password holds an ALREADY-ENCODED value carrying its algorithm prefix, for example
  # {bcrypt}$2a$10$... A plaintext value authenticates nothing, which is how this
  # platform declines to reproduce the plaintext comparison at
  # app/cbl/COSGN00C.cbl:L223. card-platform/.env.example documents the three variables
  # and how to generate a hash, and none of them holds a usable default: an unset
  # variable stops start-up rather than admitting a password this repository publishes.
  #
  # role is ADMIN, USER or MONITORING. ADMIN and USER are the two outcomes of the
  # SEC-USR-TYPE fork at app/cbl/COSGN00C.cbl:L232-L236. MONITORING is additive: it
  # reaches the metrics and Prometheus endpoints on the management port and no business
  # route at all.
  #
  # scopes carries what an ordinary identity owns, one authority per entitlement:
  # SCOPE_ACCOUNT_<eleven digits>, SCOPE_CUSTOMER_<nine digits> or
  # SCOPE_CARD_<masked card number>. Each identifier is written exactly as its column
  # holds it, leading zeros and mask characters included. An ADMIN entry needs none: it
  # passes every ownership check by role.
  security:
    users:
      - username: ${ADMIN_USERNAME:admin001}
        password: ${ADMIN_PASSWORD_HASH}
        role: ADMIN
      - username: ${USER_USERNAME:user0001}
        password: ${USER_PASSWORD_HASH}
        role: USER
        scopes: ${USER_SCOPES:}
      - username: ${MONITORING_USERNAME:monitor01}
        password: ${MONITORING_PASSWORD_HASH}
        role: MONITORING
management:
  # /actuator answers on this port and never on the service port above. The
  # container health check reads /actuator/health here.
  server:
    port: ${MANAGEMENT_PORT:9080}
    # The management port carries the same posture as the service port above, declared
    # rather than inherited: a monitoring credential travelling to a collector deserves
    # the same protection as a cardholder identifier travelling to a client. A Kubernetes
    # probe against an encrypted management port needs scheme HTTPS, which
    # deploy/k8s/40-authorization-service.yaml sets.
    ssl:
      enabled: "${MANAGEMENT_SSL_ENABLED:${SERVER_SSL_ENABLED:false}}"
      key-store: "${SERVER_SSL_KEYSTORE:}"
      key-store-type: "${SERVER_SSL_KEYSTORE_TYPE:PKCS12}"
      key-store-password: "${SERVER_SSL_KEYSTORE_PASSWORD:}"
  # config/SecurityConfig secures this surface: /actuator/health answers without a
  # credential because a container health check and a Kubernetes probe carry none, and
  # every other endpoint below requires ROLE_MONITORING. An anonymous caller receives
  # 401 and an identity holding a business role receives 403, so exposing metrics and
  # the Prometheus scrape here discloses nothing to a pod that merely reaches the port.
  endpoints:
    web:
      exposure:
        include: "${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:${MANAGEMENT_ENDPOINTS:health,metrics,prometheus}}"
  prometheus:
    metrics:
      export:
        enabled: true

# The console format key below turns every log line into JavaScript Object
# Notation (JSON), and this module carries no logging configuration file. The
# shipped level for com.carddemo is DEBUG.
logging:
  structured:
    format:
      console: logstash
  level:
    root: "${LOGGING_LEVEL_ROOT:${LOG_LEVEL:INFO}}"
    com.carddemo: "${LOGGING_LEVEL_COM_CARDDEMO:${LOG_LEVEL_CARDDEMO:DEBUG}}"
