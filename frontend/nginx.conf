# =============================================================================
# frontend/nginx.conf
#
# Full nginx MAIN configuration that serves the production build of the CardDemo
# React 19 single-page application (Vite output) and provides SPA history
# fallback so client-side (react-router) routes resolve on a hard reload or
# deep link. The SPA replaces the 17 legacy BMS 3270 mapsets.
#
# Placement contract (frontend/Dockerfile):
#   This file is a complete main configuration (it declares the `events` and
#   `http` contexts and top-level directives) and MUST be copied to
#   /etc/nginx/nginx.conf. It MUST NOT be copied into /etc/nginx/conf.d/ (e.g.
#   default.conf): main-context directives inside the stock http{} block make
#   nginx fail to start. Validate with `nginx -t -c /etc/nginx/nginx.conf`.
#
# Runtime contract (root docker-compose.yml / k8s):
#   - nginx listens on container port 8080 as a NON-ROOT user; Compose maps
#     host 3000 -> container 8080.
#   - The Vite build output (dist/) is copied to /usr/share/nginx/html.
#   - frontend/Dockerfile pre-compresses every emitted .js and .css into a .br and a
#     .gz sibling. The two `~* ^/assets/.+\.(js|css)$` locations below serve the .br
#     to a client that accepts Brotli and let gzip_static serve the .gz otherwise, so
#     this stock nginx (which has no ngx_brotli module) still answers a modern browser
#     with Brotli. Those siblings are part of the image contract: without them the
#     locations fall back to the plain file, which still works but is larger.
#   - robots.txt, llms.txt, sitemap.xml and favicon.svg come from frontend/public and
#     are bound to their own locations so they answer with their own content and their
#     own freshness policy instead of falling through to the SPA history fallback.
#
# API contract (same-origin):
#   The SPA reaches the api-gateway same-origin through `location /api/`, which
#   reverse-proxies to the gateway. The browser build therefore uses a relative
#   base URL (import.meta.env.VITE_API_BASE_URL = "/api"); no absolute gateway
#   URL is baked into the static bundle and no cross-origin CORS is required.
#   The upstream host `api-gateway` must be resolvable on the container network
#   (Compose service name / k8s Service in the same namespace). It is resolved on
#   EVERY request through the runtime resolver generated by
#   /docker-entrypoint.d/15-carddemo-resolver.sh, not once at start-up, so a
#   recreated gateway with a new address is picked up within ten seconds and this
#   container does NOT need recreating when a backend is. Rationale:
#   docs/decision-log.md.
#
# Security:
#   - Response security headers (CSP, X-Frame-Options, X-Content-Type-Options,
#     Referrer-Policy, Permissions-Policy) are declared in the three locations that
#     serve STATIC content -- "/", "= /index.html" and "/assets/" -- and are
#     re-declared in each because nginx `add_header` does not merge across levels.
#     They are deliberately absent from the server block and from "/api/": the
#     api-gateway sets its own, stricter set on every API response, so inheriting or
#     repeating them here sent the browser two of each. That is not additive -- a
#     duplicated X-Frame-Options can be treated as conflicting and ignored, and two
#     Permissions-Policy headers merge into one ambiguous list. The Permissions-Policy
#     value is kept identical to carddemo-common's SecurityHardening.PERMISSIONS_POLICY,
#     so the origin presents ONE consistent policy across documents and API responses.
#   - Exactly ONE copy of each header reaches the client, and one Cache-Control with
#     it: a static location states its freshness in a single `add_header` rather than
#     in an `expires` directive alongside one, because those two each emit a
#     Cache-Control of their own and the client received both.
#   - The access log records the request method and the ORIGINAL request path with
#     the query string stripped ($carddemo_log_path), so any value accidentally
#     placed in a query string is not written to the log while a deep link is still
#     logged as the route the client asked for rather than as the SPA fallback
#     target. Request bodies, Authorization, and Cookie headers are never logged.
#   - HSTS is asserted on the static locations, but ONLY for a request the
#     TLS-terminating edge in front of this listener reports as https
#     (`$http_x_forwarded_proto`, mapped to $carddemo_hsts below). A genuinely
#     plain-HTTP request receives no Strict-Transport-Security at all, because this
#     plain-HTTP listener cannot honestly assert a TLS policy on its own behalf and a
#     browser ignores one served over cleartext. The `location /api/` block sets no
#     header of its own: those responses come from the api-gateway, which asserts
#     the same policy from `SecurityHardening` under the same condition.
# =============================================================================

# No `user` directive: the master process itself runs as the unprivileged
# nginx user (frontend/Dockerfile `USER`), so there is no privileged master to
# drop from and nginx warns about the directive when it cannot honour it.
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
# The pid file must be writable by the unprivileged runtime user. /var/run is a
# tmpfs in both topologies but is mounted root-owned on a container RESTART, so
# the pid is kept under /tmp, which is pinned mode 1777 in docker-compose.yml and
# is an emptyDir in k8s/deployment-frontend.yaml.
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;

    # Scratch directories nginx creates at start-up. The stock paths are under
    # /var/cache/nginx, which the read-only root filesystem forbids and which a
    # restarted container remounts root-owned; pointing them at /tmp keeps them
    # writable for the unprivileged runtime user in every topology.
    client_body_temp_path  /tmp/carddemo-nginx/client_body;
    proxy_temp_path        /tmp/carddemo-nginx/proxy;
    fastcgi_temp_path      /tmp/carddemo-nginx/fastcgi;
    uwsgi_temp_path        /tmp/carddemo-nginx/uwsgi;
    scgi_temp_path         /tmp/carddemo-nginx/scgi;

    default_type  application/octet-stream;

    # Runtime DNS resolver for the /api/ upstream, which is what allows the gateway
    # hostname to be re-resolved per request; see the `location /api/` block. The file is
    # written on every container start by /docker-entrypoint.d/15-carddemo-resolver.sh,
    # from NGINX_LOCAL_RESOLVERS when the base image exports it and otherwise from the
    # container's own /etc/resolv.conf, so the same image works with Docker's embedded DNS
    # (127.0.0.11) and with the Kubernetes cluster DNS without hard-coding either address.
    # It lives under /tmp because this container runs with a read-only root filesystem and
    # /tmp is the only writable path granted by BOTH docker-compose.yml (tmpfs) and
    # k8s/deployment-frontend.yaml (emptyDir). The include is a WILDCARD on purpose: nginx
    # treats a wildcard that matches nothing as empty rather than as an error, so the
    # configuration still loads if the file is absent.
    include  /tmp/carddemo-nginx/*.conf;

    # Access-log path: the ORIGINAL request path with the query string removed, so
    # a secret accidentally placed in a query string is never persisted while a
    # deep link is still logged as the route the client requested. $uri would be
    # rewritten to /index.html by the SPA history fallback and would make
    # route-level analysis of these logs impossible.
    map $request_uri $carddemo_log_path {
        default                    $request_uri;
        "~^(?<path_only>[^?]*)\?"  $path_only;
    }

    log_format  redacted  '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $carddemo_log_path $server_protocol" '
                          '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  redacted;

    # Connection and transfer tuning (stock nginx defaults).
    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    # Do not advertise the nginx version on responses or error pages.
    server_tokens  off;

    # Map the Upgrade request header to the Connection value so the /api/ proxy
    # transparently supports WebSocket/SSE upgrades and plain REST alike.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Strict-Transport-Security, asserted only when the request actually reached the
    # client over TLS. This listener terminates plain HTTP on :8080, so the scheme the
    # CLIENT used is knowable only from the terminating edge in front of it
    # (the k8s Ingress in k8s/ingress.yaml, or a cloud load balancer), which reports it
    # as X-Forwarded-Proto. An empty value makes nginx emit NO header at all, so a
    # genuinely plain-HTTP request still asserts nothing -- a policy a browser would
    # ignore over cleartext anyway, and one that would be dishonest for this listener
    # to state on its own behalf. Deployments that terminate TLS at this container
    # instead would add `listen 443 ssl` here and the header becomes unconditional.
    # max-age is one year, the HSTS preload requirement.
    map $http_x_forwarded_proto $carddemo_hsts {
        default  "";
        https    "max-age=31536000; includeSubDomains";
    }

    # The scheme to report to the api-gateway on a proxied /api/ call. It must be the
    # scheme the CLIENT used, not the one this listener received: with a TLS-terminating
    # edge in front, forwarding a bare $scheme OVERWRITES the edge's `https` with `http`,
    # and the whole chain behind this hop then believes the request arrived in cleartext -
    # which is why no service asserted HSTS. Preserve the incoming value when the edge set
    # one and fall back to this listener's own scheme when it did not (a direct client, as
    # in the local compose topology).
    map $http_x_forwarded_proto $carddemo_forwarded_proto {
        default  $scheme;
        https    https;
        http     http;
    }


    # ------------------------------------------------------------------
    # Brotli, selected from files compressed at IMAGE BUILD TIME.
    #
    # This runtime is stock nginx:alpine, which carries no ngx_brotli module, so no
    # response can be Brotli-compressed here on the fly: an asset was served gzip
    # however good a Brotli the client advertised, and the bundle crossed the wire
    # larger than it needed to. Compiling a custom nginx to obtain the module would add
    # a build stage and a third-party source to the runtime image for a payload that is
    # entirely static and known at build time, so the assets are compressed ONCE by the
    # build stage (see frontend/Dockerfile, which emits a .br and a .gz sibling for every
    # .js and .css) and this suffix selects the .br sibling for a client that accepts it.
    # That is the shape of nginx's own gzip_static, extended to an encoding this binary
    # does not implement.
    #
    # The regex requires br as a WHOLE TOKEN -- bounded by the start of the value, a
    # comma or a space on the left and by a comma, a space, a semicolon (the q-value
    # separator) or the end on the right. A header naming "brotli" or "x-br" therefore
    # does not select the variant. Character classes are used instead of \s and \b so the
    # pattern needs no backslash inside a quoted nginx string.
    map $http_accept_encoding $carddemo_br_suffix {
        default                   "";
        "~*(^|[ ,])br([ ,;]|$)"   ".br";
    }

    # The Content-Encoding to declare for the variant actually chosen. It is keyed on
    # $carddemo_variant (set per request in the asset locations, and empty when the .br
    # sibling is absent) rather than on the Accept-Encoding suffix above, so a response
    # can never claim an encoding it is not carrying. An empty value makes nginx emit no
    # Content-Encoding header at all, which is exactly right for the plain file.
    map $carddemo_variant $carddemo_variant_encoding {
        default  "";
        ".br"    "br";
    }

    # gzip compression for text-based assets. Pre-compressed binary formats
    # (e.g. woff2) are intentionally not listed.
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_comp_level    6;
    gzip_proxied       any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        # Unprivileged port: binding 80 requires CAP_NET_BIND_SERVICE, and this
        # container runs as a non-root user with every capability dropped.
        # docker-compose.yml maps host 3000 -> 8080 and
        # k8s/deployment-frontend.yaml declares the same containerPort.
        listen       8080;
        server_name  _;

        # Vite build output (dist/) is copied here by frontend/Dockerfile.
        root   /usr/share/nginx/html;
        index  index.html;

        # No security headers are declared at this level, and that is deliberate.
        # nginx's `add_header` is inherited by a location ONLY when that location
        # declares no `add_header` of its own — so a server-level set is not a default
        # that locations extend, it is a set that any location silently opts out of by
        # adding one header. Every location below that serves a response FROM THIS
        # CONTAINER therefore declares the full set itself, and `location /api/`, whose
        # responses are produced and hardened by the api-gateway, declares none and
        # inherits none.

        # Same-origin API reverse proxy. The `rewrite ... break` strips the "/api/"
        # prefix, so "/api/accounts/1" reaches the gateway as "/accounts/1" and "/api/"
        # reaches it as "/" -- exactly what a trailing slash on a literal proxy_pass used
        # to do -- and the query string is carried over automatically. `rewrite ... break`
        # is required rather than that trailing slash because nginx does not apply the
        # proxy_pass URI replacement when the target contains a variable.
        #
        # This location deliberately declares NO security headers. The api-gateway sets
        # X-Content-Type-Options, X-Frame-Options, Referrer-Policy, Permissions-Policy and
        # its own strict Content-Security-Policy on every response it produces
        # (`SecurityHardening`), and nginx's `add_header` does not replace an upstream
        # header -- it appends. Re-declaring them here therefore sent each one TWICE, and
        # the two Permissions-Policy values did not even agree: the gateway's names eight
        # features, this file's named four, so the weaker list arrived appended to the
        # stricter one. The response that carries a policy is the response that must
        # declare it, and for anything under /api/ that response is the gateway's.
        #
        # The upstream host is held in a VARIABLE, and a resolver is configured (see the
        # include above), so nginx re-resolves it per request instead of caching a single
        # address for the life of the worker. That matters because a recreated gateway gets
        # a new container IP and its old address is reused by whatever container starts
        # next: with a literal hostname here, /api/** kept reaching that stale address, so
        # the SPA talked to an unrelated service that answered 401 to everything and issued
        # no CSRF cookie -- indistinguishable from a rejected password.
        #
        # For the record, the set the gateway emits on a proxied response is
        # carddemo-common's SecurityHardening -- Content-Security-Policy
        # "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'",
        # Referrer-Policy no-referrer and Permissions-Policy, plus Spring Security's
        # X-Content-Type-Options: nosniff and X-Frame-Options: DENY -- scoped to a JSON API
        # rather than to a document, which is why it is not simply repeated here.
        location /api/ {
            set                $api_upstream api-gateway;
            rewrite            ^/api/(.*)$ /$1 break;
            proxy_pass         http://$api_upstream:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $carddemo_forwarded_proto;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_read_timeout 60s;
        }

        # index.html must never be stored so a new deploy, which references freshly
        # content-hashed asset filenames, is picked up immediately by returning
        # clients — and so a screen drawn under a session that has since been revoked
        # cannot be reinstated from a cache or from the back-forward cache. The
        # document carries account numbers, card numbers and customer details once the
        # SPA has drawn them, so `no-store` (not `no-cache`, which still permits
        # storage) is the directive this response needs.
        location = /index.html {
            add_header Cache-Control "no-store" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
            add_header Strict-Transport-Security $carddemo_hsts always;
        }

        # The remaining content-hashed assets under /assets/ -- images, fonts, and any
        # other type Vite emits. Scripts and stylesheets are handled by the two regex
        # locations above, which nginx matches FIRST because a regex location wins over
        # a prefix location; everything else lands here. These formats are already
        # compressed in their container (woff2, png, webp), so there is no
        # pre-compressed sibling to select and nothing for this location to negotiate.
        #
        # Filenames change with content, so they cache immutably. A missing asset
        # returns 404 (no index.html fallback).
        # The freshness lifetime is carried by ONE Cache-Control header rather than
        # by `expires 1y` alongside an `add_header Cache-Control`: those two both
        # emit a Cache-Control, so a client received two of them (`max-age=31536000`
        # and `public, immutable`) and had to reconcile them itself.
        # The content-hashed script bundles, with their pre-compressed siblings.
        #
        # A regex location per type, because `try_files` serves the sibling UNDER THE SAME
        # location and nginx types a response from the extension of the file it opened:
        # `index-abc.js.br` is unknown to mime.types, so the client received a
        # script as application/octet-stream and (for script, under nosniff) refused to
        # execute it. `default_type` states the type the compressed variant must carry;
        # the uncompressed file still takes its own from mime.types.
        #
        # $carddemo_variant is the suffix actually served: the client's Brotli preference,
        # downgraded to none when the .br sibling is missing from the image, so a
        # half-built image degrades to the plain file rather than 404ing the bundle.
        #
        # Dynamic gzip is OFF and gzip_static is ON. Dynamic gzip would re-compress the
        # Brotli bytes: `add_header Content-Encoding` records the header on the response
        # but does NOT set the internal content_encoding field the gzip filter tests, so
        # that filter cannot see the body is already encoded and would append a second
        # Content-Encoding of its own. gzip_static then covers the client that does not
        # accept Brotli by serving the .gz sibling, which the same build produced -- so
        # turning dynamic compression off costs nothing and both paths are pre-compressed
        # at maximum effort instead of at level 6 per request.
        #
        # gzip_vary is off here for the same reason: nginx sets Vary itself only once it
        # has decided gzip is acceptable, so a Brotli-only client would have received no
        # Vary at all. This location states it unconditionally instead, which is what a
        # shared cache needs when the response body depends on Accept-Encoding.
        location ~* ^/assets/.+\.js$ {
            default_type application/javascript;
            gzip         off;
            gzip_static  on;
            gzip_vary    off;

            set $carddemo_variant $carddemo_br_suffix;
            if (!-f "$request_filename$carddemo_br_suffix") {
                set $carddemo_variant "";
            }

            add_header Content-Encoding $carddemo_variant_encoding;
            add_header Vary "Accept-Encoding";
            # ONE Cache-Control, stating the max-age itself, exactly as the /assets/
            # prefix location below does; declared without `always` so a 404 for a
            # missing bundle is not cached as permanent content.
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
            add_header Strict-Transport-Security $carddemo_hsts always;
            try_files $uri$carddemo_variant $uri =404;
        }

        # The content-hashed stylesheet bundles, with their pre-compressed siblings.
        #
        # A regex location per type, because `try_files` serves the sibling UNDER THE SAME
        # location and nginx types a response from the extension of the file it opened:
        # `index-abc.css.br` is unknown to mime.types, so the client received a
        # stylesheet as application/octet-stream and (for script, under nosniff) refused to
        # execute it. `default_type` states the type the compressed variant must carry;
        # the uncompressed file still takes its own from mime.types.
        #
        # $carddemo_variant is the suffix actually served: the client's Brotli preference,
        # downgraded to none when the .br sibling is missing from the image, so a
        # half-built image degrades to the plain file rather than 404ing the bundle.
        #
        # Dynamic gzip is OFF and gzip_static is ON. Dynamic gzip would re-compress the
        # Brotli bytes: `add_header Content-Encoding` records the header on the response
        # but does NOT set the internal content_encoding field the gzip filter tests, so
        # that filter cannot see the body is already encoded and would append a second
        # Content-Encoding of its own. gzip_static then covers the client that does not
        # accept Brotli by serving the .gz sibling, which the same build produced -- so
        # turning dynamic compression off costs nothing and both paths are pre-compressed
        # at maximum effort instead of at level 6 per request.
        #
        # gzip_vary is off here for the same reason: nginx sets Vary itself only once it
        # has decided gzip is acceptable, so a Brotli-only client would have received no
        # Vary at all. This location states it unconditionally instead, which is what a
        # shared cache needs when the response body depends on Accept-Encoding.
        location ~* ^/assets/.+\.css$ {
            default_type text/css;
            gzip         off;
            gzip_static  on;
            gzip_vary    off;

            set $carddemo_variant $carddemo_br_suffix;
            if (!-f "$request_filename$carddemo_br_suffix") {
                set $carddemo_variant "";
            }

            add_header Content-Encoding $carddemo_variant_encoding;
            add_header Vary "Accept-Encoding";
            # ONE Cache-Control, stating the max-age itself, exactly as the /assets/
            # prefix location below does; declared without `always` so a 404 for a
            # missing bundle is not cached as permanent content.
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
            add_header Strict-Transport-Security $carddemo_hsts always;
            try_files $uri$carddemo_variant $uri =404;
        }

        # The public metadata resources, each a REAL FILE copied from frontend/public.
        #
        # None of them matched a location before this one, so all three fell through to
        # the SPA history fallback at the bottom and answered with the application's HTML
        # document under HTTP 200. A crawler reading that as /robots.txt saw no rules at
        # all -- the opposite of the file's content, which disallows every path -- and a
        # sitemap consumer saw markup where XML was promised. `try_files $uri =404` binds
        # each path to its own file and returns 404 when it is absent, rather than
        # answering with something else entirely.
        #
        # They are cached for an hour, not the assets' immutable year: their names carry
        # no content hash, so a corrected robots.txt has to be able to reach a client that
        # already holds the old one.
        location ~* ^/(robots\.txt|llms\.txt|sitemap\.xml)$ {
            add_header Cache-Control "public, max-age=3600" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
            add_header Strict-Transport-Security $carddemo_hsts always;
            try_files $uri =404;
        }

        # The favicon, referenced by <link rel="icon"> in index.html. It matched only the
        # history-fallback location, which declares no freshness policy, so every
        # navigation re-fetched it. Its name carries no content hash either, so it takes
        # the same one-hour policy as the metadata above rather than an immutable year.
        location = /favicon.svg {
            add_header Cache-Control "public, max-age=3600" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
            add_header Strict-Transport-Security $carddemo_hsts always;
            try_files $uri =404;
        }

        location /assets/ {
            # ONE Cache-Control, and it states the max-age itself because `expires`
            # is not used here. Declared WITHOUT `always` so the immutable one-year
            # policy is sent only with the success statuses a cacheable response can
            # carry; a missing asset returns 404 and must not be cached as if it were
            # permanent content.
            add_header Cache-Control "public, max-age=31536000, immutable";
            # The whole static set is re-declared here, CSP included: add_header in a
            # location REPLACES the inherited set, so omitting one header drops it
            # from every asset response.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
            add_header Strict-Transport-Security $carddemo_hsts always;
            try_files  $uri =404;
        }

        # SPA history fallback: serve index.html for any path that is not a real
        # file or directory so react-router resolves deep links and hard
        # reloads (e.g. /accounts/123, /cards) on the client. Declares the static
        # security header set, which is no longer inherited from the server block.
        #
        # The guard comes first because nginx normalises a request URI BEFORE it
        # matches a location: an encoded separator in "%2F.." is decoded and the
        # resulting ".." segments are collapsed, which can lift a request out of
        # the "/api/" prefix and land it here, where the fallback answers it with
        # the SPA document and HTTP 200. A client waiting for JSON then renders
        # nothing at all. No CardDemo URL contains a traversal segment or an
        # encoded separator -- every identifier on the wire is digits -- so such a
        # request is refused outright rather than silently rewritten.
        location / {
            if ($request_uri ~* "(%2f|%5c|\.\./|\.\.%2f)") {
                return 400;
            }

            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
            add_header Strict-Transport-Security $carddemo_hsts always;

            try_files $uri $uri/ /index.html;
        }
    }
}
