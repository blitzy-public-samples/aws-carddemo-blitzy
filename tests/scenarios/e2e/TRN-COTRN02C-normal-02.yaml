    PGMNAME: COTRN02C
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ACTIDIN: '           '
    CARDNIN: '                '
    TTYPCD: '  '
    TCATCD: '    '
    TRNSRC: '          '
    TDESC: '                                                            '
    TRNAMT: '            '
    TORIGDT: '          '
    TPROCDT: '          '
    MID: '         '
    MNAME: '                              '
    MCITY: '                         '
    MZIP: '          '
    CONFIRM: ' '
    ERRMSG: '                                                                              '
  - '@map': COTRN02
    TRNNAME: CT02
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COTRN02C
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ACTIDIN: '           '
    CARDNIN: '                '
    TTYPCD: '  '
    TCATCD: '    '
    TRNSRC: '          '
    TDESC: '                                                            '
    TRNAMT: '            '
    TORIGDT: '          '
    TPROCDT: '          '
    MID: '         '
    MNAME: '                              '
    MCITY: '                         '
    MZIP: '          '
    CONFIRM: ' '
    ERRMSG: 'Transaction added successfully.  Your Tran ID is 0000000996722788.            '
  # The ERRMSG of each step: the menu and the empty add screen carry none.
