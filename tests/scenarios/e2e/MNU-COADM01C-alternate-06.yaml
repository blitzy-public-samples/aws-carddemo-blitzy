id: MNU-COADM01C-alternate-06
level: e2e
type: alternate
description: >-
  ADMIN001, an administrator (SEC-USR-TYPE 'A' in USRSEC), signs on through
  transaction CC00 with password PASSWORD, and COSGN00C transfers control to
  COADM01C with the COMMAREA [app/cbl/COSGN00C.cbl:209-234]. COADM01C, entered
  with CDEMO-PGM-CONTEXT zero, sends the admin menu COADM01 from a cleared
  output map: its own transaction and program name, the COTTL01Y titles, the
  run date and time, and the four options of the COADM02Y table, each built as
  '<nn>. <name>' in a 40-character field; options 5 to 12, the option field
  and the message line stay blank [app/cbl/COADM01C.cbl:82-90,172-263]
  [app/cpy/COADM02Y.cpy:20-42]. PF3 on the admin menu, received under CA00,
  moves 'COSGN00C' to CDEMO-TO-PROGRAM and transfers control to it without a
  COMMAREA [app/cbl/COADM01C.cbl:96-98,160-167]. COSGN00C, entered with
  EIBCALEN zero, sends a fresh sign-on screen from a cleared output map with
  the cursor on the user id: transaction CC00, program COSGN00C, the titles,
  the run date and time, and a blank user id and message
  [app/cbl/COSGN00C.cbl:75-83,145-204].
# Primary item first, then the program, the maps the steps land on, the
# transaction COADM01C runs under, and the online-only copybooks COADM01C
# copies. COSGN00C, CC00 and the USRSEC file are verified by the SEC scenarios
# that own them; this scenario only signs on to reach the admin menu.
inventory_ids:
- INV-MNU-028
- INV-MNU-002
- INV-MNU-004
- INV-SEC-002
- INV-CFG-011
- INV-LAY-001
- INV-LAY-002
- INV-LAY-005
- INV-LAY-006
- INV-LAY-008
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-003
- GAP-INF-012
preconditions:
  datasets:
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: ADMIN001
      PASSWD: PASSWORD
  - aid: PF3
    '@map': COADM01
    fields: {}
# Screen values are whole fields at their BMS length, trailing spaces kept:
# comparison never trims. Fields a program leaves at LOW-VALUES show as spaces.
expected:
  screens:
  - '@map': COADM01
    TRNNAME: CA00
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COADM01C
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    OPTN001: '01. User List (Security)                '
    OPTN002: '02. User Add (Security)                 '
    OPTN003: '03. User Update (Security)              '
    OPTN004: '04. User Delete (Security)              '
    OPTN005: '                                        '
    OPTN006: '                                        '
    OPTN007: '                                        '
    OPTN008: '                                        '
    OPTN009: '                                        '
    OPTN010: '                                        '
    OPTN011: '                                        '
    OPTN012: '                                        '
    OPTION: '  '
    ERRMSG: '                                                                              '
  # APPLID and SYSID are not asserted: COSGN00C fills them from EXEC CICS
  # ASSIGN, so they name the region that runs the scenario, not application
  # behaviour. PASSWD is not asserted either: it is a dark (DRK) field holding
  # its BMS INITIAL '________', as in the other sign-on screen scenarios.
  # CURTIME is 9 bytes on COSGN00 and receives the 8-byte hh:mm:ss, so its
  # last byte is a space.
  - '@map': COSGN00
    TRNNAME: CC00
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COSGN00C
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time, format: '%H:%M:%S '}
    USERID: '        '
    ERRMSG: '                                                                              '
