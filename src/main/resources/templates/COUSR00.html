<!DOCTYPE html>
<!--
  COUSR00.html - List Users screen (admin).

  Origin (read-only): legacy/bms/COUSR00.bms (BMS mapset COUSR00, map COUSR0A)
                      + legacy/cpy-bms/COUSR00.CPY (symbolic input map COUSR0AI).
  Rendered by:        com.aws.carddemo.web.controller.UserAdminController
                      (CICS transaction CU00 -> program COUSR00C; page size 10; admin-only).
  View name:          COUSR00
  Routes:             GET /admin/users (display), POST /admin/users (submit / page / row-select).
                      PF3 on this list returns to /admin/menu (the admin menu), decided by the
                      controller from the submitted "pfkey" request parameter.
  Backing bean:       com.aws.carddemo.dto.screen.COUSR00Form (model attribute "form").

  This is a one-for-one, server-rendered reproduction of the 24x80 3270 screen. Field
  positions (--r row, --c column, both zero-based) and widths (--w, in monospace character
  cells) are transcribed directly from the BMS POS(row,col)/LENGTH clauses. Colors are the
  legacy 3270 palette mapped to hex. No i18n (literal English labels), no JavaScript
  libraries, and no REST/JSON: navigation is performed by standard form submit buttons.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/bms-palette :: palette}"></th:block>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CardDemo - List Users</title>
  <style>
    /* 24x80 fixed monospaced terminal grid. One "cell" == one character column;
       one row == var(--rh) tall. All screen fields are absolutely positioned inside
       the .screen container using per-field custom properties (--r, --c, --w). */
    :root { --rh: 1.2rem; }

    * { box-sizing: border-box; }

    html { font-size: 16px; }

    body {
      margin: 0;
      background: #000000;
      color: var(--bms-neutral);
      font-family: "Courier New", Consolas, "DejaVu Sans Mono", monospace;
      font-size: 1rem;
      line-height: var(--rh);
    }

    /* Invisible-accessibility: keyboard skip link (off-screen until focused). */
    a.skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      padding: 0.25rem 0.5rem;
      background: #000000;
      color: var(--bms-neutral);
      z-index: 10;
    }
    a.skip-link:focus { left: 0; }

    /* Finding #54: horizontal scroll + non-shrinking artboard keep the 80ch
       grid's left origin reachable at 375x667; `safe center` falls back to
       start-alignment (left edge at scrollLeft 0) when the artboard overflows. */
    main { display: flex; justify-content: safe center; padding: 0.5rem; overflow-x: auto; }
    main > * { flex-shrink: 0; }

    .screen {
      position: relative;
      width: 80ch;
      height: calc(24 * var(--rh));
      /* Finding #54: no auto margins — auto margins steal flex free space and
         nullify `main`'s `justify-content: safe center`, re-introducing the
         unreachable-left overflow. Centering is handled by the flex parent. */
      margin: 0;
      background: #000000;
      border: none;
      padding: 0;
      overflow: hidden;
    }

    /* A positioned character-grid field. */
    .cell {
      position: absolute;
      top: calc(var(--r) * var(--rh));
      left: calc(var(--c) * 1ch);
      width: calc(var(--w) * 1ch);
      height: var(--rh);
      line-height: var(--rh);
      white-space: pre;
      overflow: hidden;
      margin: 0;
    }

    /* BMS BRT (high intensity) rendered as bold. */
    .brt { font-weight: 700; }

    /* Enterable fields (BMS UNPROT). */
    input.cell {
      background: #000000;
      border: none;
      color: inherit;
      font-family: inherit;
      font-size: inherit;
      padding: 0;
      outline-offset: -1px;
    }
    /* BMS HILIGHT=UNDERLINE. */
    input.hi { border-bottom: 1px solid currentColor; }
    input.cell:focus-visible { outline: 2px solid #00CDCD; }

    /* PF-key legend rendered as real submit buttons (no JavaScript). */
    button.key {
      background: transparent;
      border: none;
      color: inherit;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      line-height: var(--rh);
      padding: 0;
      margin: 0;
      cursor: pointer;
      white-space: pre;
    }
    button.key:focus-visible { outline: 2px solid #00CDCD; }
      button.key:active { text-decoration: underline; filter: brightness(1.3); }
    @media (hover: hover) {
      button.key:hover { text-decoration: underline; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#screen">Skip to user list</a>

  <!--
    BLITZY [A11Y / review finding #53]: the 3270/BMS COUSR00 colour palette is centralized in
    templates/fragments/bms-palette.html (single source of truth) and referenced via var(--bms-*).
    The two BMS foreground colours that failed WCAG 2.1 AA contrast on the black background (BLUE,
    RED) are replaced with accessible equivalents brightened along the same hue axis (>= 4.5:1);
    the remaining colours keep their legacy values (all pass AA). Contrast is asserted by
    BmsPaletteContrastTest; rationale in docs/decision-log.md.
  -->
  <main>
    <!-- Off-grid semantic heading for assistive tech (review finding #56); the visible
         title cell is unchanged. -->
    <h1 class="visually-hidden">List Users</h1>
    <form id="screen" class="screen" th:object="${form}" th:action="@{/admin/users}"
          method="post" aria-label="List Users screen">

      <!-- ===================== Header row 1 (BMS row 1) ===================== -->
      <span class="cell" style="--r:0;--c:0;--w:5;color:var(--bms-blue)">Tran:</span>
      <span class="cell" style="--r:0;--c:6;--w:4;color:var(--bms-blue)" th:text="*{trnname}"></span>
      <span class="cell" style="--r:0;--c:20;--w:40;color:var(--bms-yellow)" th:text="*{title01}"></span>
      <span class="cell" style="--r:0;--c:64;--w:5;color:var(--bms-blue)">Date:</span>
      <span class="cell" style="--r:0;--c:70;--w:8;color:var(--bms-blue)"
            th:text="${#strings.isEmpty(form.curdate) ? 'mm/dd/yy' : form.curdate}">mm/dd/yy</span>

      <!-- ===================== Header row 2 (BMS row 2) ===================== -->
      <span class="cell" style="--r:1;--c:0;--w:5;color:var(--bms-blue)">Prog:</span>
      <span class="cell" style="--r:1;--c:6;--w:8;color:var(--bms-blue)" th:text="*{pgmname}"></span>
      <span class="cell" style="--r:1;--c:20;--w:40;color:var(--bms-yellow)" th:text="*{title02}"></span>
      <span class="cell" style="--r:1;--c:64;--w:5;color:var(--bms-blue)">Time:</span>
      <span class="cell" style="--r:1;--c:70;--w:8;color:var(--bms-blue)"
            th:text="${#strings.isEmpty(form.curtime) ? 'hh:mm:ss' : form.curtime}">hh:mm:ss</span>

      <!-- ===================== Title row 4 (BMS row 4) ====================== -->
      <span class="cell brt" style="--r:3;--c:34;--w:10;color:var(--bms-neutral)">List Users</span>
      <span class="cell brt" style="--r:3;--c:64;--w:5;color:var(--bms-turquoise)">Page:</span>
      <span class="cell" style="--r:3;--c:70;--w:8;color:var(--bms-blue)" th:text="*{pagenum}"></span>

      <!-- ===================== Filter row 6 (BMS row 6) ===================== -->
      <label class="cell" for="usridin"
             style="--r:5;--c:4;--w:15;color:var(--bms-turquoise)">Search User ID:</label>
      <input type="text" id="usridin" class="cell hi"
             style="--r:5;--c:20;--w:8;color:var(--bms-green)"
             name="usridin" th:value="*{usridin}" maxlength="8" autofocus
             autocomplete="off" aria-label="Search User ID">

      <!-- ================= Column headers row 8 (BMS row 8) ================= -->
      <span class="cell" style="--r:7;--c:4;--w:3;color:var(--bms-neutral)">Sel</span>
      <span class="cell" style="--r:7;--c:11;--w:8;color:var(--bms-neutral)">User ID </span>
      <span class="cell" style="--r:7;--c:23;--w:20;color:var(--bms-neutral)">     First Name     </span>
      <span class="cell" style="--r:7;--c:47;--w:20;color:var(--bms-neutral)">     Last Name      </span>
      <span class="cell" style="--r:7;--c:71;--w:4;color:var(--bms-neutral)">Type</span>

      <!-- ================ Dash separators row 9 (BMS row 9) ================= -->
      <span class="cell" style="--r:8;--c:4;--w:3;color:var(--bms-neutral)">---</span>
      <span class="cell" style="--r:8;--c:11;--w:8;color:var(--bms-neutral)">--------</span>
      <span class="cell" style="--r:8;--c:23;--w:20;color:var(--bms-neutral)">--------------------</span>
      <span class="cell" style="--r:8;--c:47;--w:20;color:var(--bms-neutral)">--------------------</span>
      <span class="cell" style="--r:8;--c:71;--w:4;color:var(--bms-neutral)">----</span>

      <!-- ============ Data rows 10-19 (up to 10 users per page) ============ -->
      <!-- Row 1 (BMS row 10) -->
      <input type="text" class="cell hi" style="--r:9;--c:5;--w:1;color:var(--bms-green)"
             name="sel0001" th:value="*{sel0001}" maxlength="1" autocomplete="off"
             aria-label="Action for user row 1 (U=Update, D=Delete)">
      <span class="cell" style="--r:9;--c:11;--w:8;color:var(--bms-blue)" th:text="*{usrid01}"></span>
      <span class="cell" style="--r:9;--c:23;--w:20;color:var(--bms-blue)" th:text="*{fname01}"></span>
      <span class="cell" style="--r:9;--c:47;--w:20;color:var(--bms-blue)" th:text="*{lname01}"></span>
      <span class="cell" style="--r:9;--c:72;--w:1;color:var(--bms-blue)" th:text="*{utype01}"></span>

      <!-- Row 2 (BMS row 11) -->
      <input type="text" class="cell hi" style="--r:10;--c:5;--w:1;color:var(--bms-green)"
             name="sel0002" th:value="*{sel0002}" maxlength="1" autocomplete="off"
             aria-label="Action for user row 2 (U=Update, D=Delete)">
      <span class="cell" style="--r:10;--c:11;--w:8;color:var(--bms-blue)" th:text="*{usrid02}"></span>
      <span class="cell" style="--r:10;--c:23;--w:20;color:var(--bms-blue)" th:text="*{fname02}"></span>
      <span class="cell" style="--r:10;--c:47;--w:20;color:var(--bms-blue)" th:text="*{lname02}"></span>
      <span class="cell" style="--r:10;--c:72;--w:1;color:var(--bms-blue)" th:text="*{utype02}"></span>

      <!-- Row 3 (BMS row 12) -->
      <input type="text" class="cell hi" style="--r:11;--c:5;--w:1;color:var(--bms-green)"
             name="sel0003" th:value="*{sel0003}" maxlength="1" autocomplete="off"
             aria-label="Action for user row 3 (U=Update, D=Delete)">
      <span class="cell" style="--r:11;--c:11;--w:8;color:var(--bms-blue)" th:text="*{usrid03}"></span>
      <span class="cell" style="--r:11;--c:23;--w:20;color:var(--bms-blue)" th:text="*{fname03}"></span>
      <span class="cell" style="--r:11;--c:47;--w:20;color:var(--bms-blue)" th:text="*{lname03}"></span>
      <span class="cell" style="--r:11;--c:72;--w:1;color:var(--bms-blue)" th:text="*{utype03}"></span>

      <!-- Row 4 (BMS row 13) -->
      <input type="text" class="cell hi" style="--r:12;--c:5;--w:1;color:var(--bms-green)"
             name="sel0004" th:value="*{sel0004}" maxlength="1" autocomplete="off"
             aria-label="Action for user row 4 (U=Update, D=Delete)">
      <span class="cell" style="--r:12;--c:11;--w:8;color:var(--bms-blue)" th:text="*{usrid04}"></span>
      <span class="cell" style="--r:12;--c:23;--w:20;color:var(--bms-blue)" th:text="*{fname04}"></span>
      <span class="cell" style="--r:12;--c:47;--w:20;color:var(--bms-blue)" th:text="*{lname04}"></span>
      <span class="cell" style="--r:12;--c:72;--w:1;color:var(--bms-blue)" th:text="*{utype04}"></span>

      <!-- Row 5 (BMS row 14) -->
      <input type="text" class="cell hi" style="--r:13;--c:5;--w:1;color:var(--bms-green)"
             name="sel0005" th:value="*{sel0005}" maxlength="1" autocomplete="off"
             aria-label="Action for user row 5 (U=Update, D=Delete)">
      <span class="cell" style="--r:13;--c:11;--w:8;color:var(--bms-blue)" th:text="*{usrid05}"></span>
      <span class="cell" style="--r:13;--c:23;--w:20;color:var(--bms-blue)" th:text="*{fname05}"></span>
      <span class="cell" style="--r:13;--c:47;--w:20;color:var(--bms-blue)" th:text="*{lname05}"></span>
      <span class="cell" style="--r:13;--c:72;--w:1;color:var(--bms-blue)" th:text="*{utype05}"></span>

      <!-- Row 6 (BMS row 15) -->
      <input type="text" class="cell hi" style="--r:14;--c:5;--w:1;color:var(--bms-green)"
             name="sel0006" th:value="*{sel0006}" maxlength="1" autocomplete="off"
             aria-label="Action for user row 6 (U=Update, D=Delete)">
      <span class="cell" style="--r:14;--c:11;--w:8;color:var(--bms-blue)" th:text="*{usrid06}"></span>
      <span class="cell" style="--r:14;--c:23;--w:20;color:var(--bms-blue)" th:text="*{fname06}"></span>
      <span class="cell" style="--r:14;--c:47;--w:20;color:var(--bms-blue)" th:text="*{lname06}"></span>
      <span class="cell" style="--r:14;--c:72;--w:1;color:var(--bms-blue)" th:text="*{utype06}"></span>

      <!-- Row 7 (BMS row 16) -->
      <input type="text" class="cell hi" style="--r:15;--c:5;--w:1;color:var(--bms-green)"
             name="sel0007" th:value="*{sel0007}" maxlength="1" autocomplete="off"
             aria-label="Action for user row 7 (U=Update, D=Delete)">
      <span class="cell" style="--r:15;--c:11;--w:8;color:var(--bms-blue)" th:text="*{usrid07}"></span>
      <span class="cell" style="--r:15;--c:23;--w:20;color:var(--bms-blue)" th:text="*{fname07}"></span>
      <span class="cell" style="--r:15;--c:47;--w:20;color:var(--bms-blue)" th:text="*{lname07}"></span>
      <span class="cell" style="--r:15;--c:72;--w:1;color:var(--bms-blue)" th:text="*{utype07}"></span>

      <!-- Row 8 (BMS row 17) -->
      <input type="text" class="cell hi" style="--r:16;--c:5;--w:1;color:var(--bms-green)"
             name="sel0008" th:value="*{sel0008}" maxlength="1" autocomplete="off"
             aria-label="Action for user row 8 (U=Update, D=Delete)">
      <span class="cell" style="--r:16;--c:11;--w:8;color:var(--bms-blue)" th:text="*{usrid08}"></span>
      <span class="cell" style="--r:16;--c:23;--w:20;color:var(--bms-blue)" th:text="*{fname08}"></span>
      <span class="cell" style="--r:16;--c:47;--w:20;color:var(--bms-blue)" th:text="*{lname08}"></span>
      <span class="cell" style="--r:16;--c:72;--w:1;color:var(--bms-blue)" th:text="*{utype08}"></span>

      <!-- Row 9 (BMS row 18) -->
      <input type="text" class="cell hi" style="--r:17;--c:5;--w:1;color:var(--bms-green)"
             name="sel0009" th:value="*{sel0009}" maxlength="1" autocomplete="off"
             aria-label="Action for user row 9 (U=Update, D=Delete)">
      <span class="cell" style="--r:17;--c:11;--w:8;color:var(--bms-blue)" th:text="*{usrid09}"></span>
      <span class="cell" style="--r:17;--c:23;--w:20;color:var(--bms-blue)" th:text="*{fname09}"></span>
      <span class="cell" style="--r:17;--c:47;--w:20;color:var(--bms-blue)" th:text="*{lname09}"></span>
      <span class="cell" style="--r:17;--c:72;--w:1;color:var(--bms-blue)" th:text="*{utype09}"></span>

      <!-- Row 10 (BMS row 19) -->
      <input type="text" class="cell hi" style="--r:18;--c:5;--w:1;color:var(--bms-green)"
             name="sel0010" th:value="*{sel0010}" maxlength="1" autocomplete="off"
             aria-label="Action for user row 10 (U=Update, D=Delete)">
      <span class="cell" style="--r:18;--c:11;--w:8;color:var(--bms-blue)" th:text="*{usrid10}"></span>
      <span class="cell" style="--r:18;--c:23;--w:20;color:var(--bms-blue)" th:text="*{fname10}"></span>
      <span class="cell" style="--r:18;--c:47;--w:20;color:var(--bms-blue)" th:text="*{lname10}"></span>
      <span class="cell" style="--r:18;--c:72;--w:1;color:var(--bms-blue)" th:text="*{utype10}"></span>

      <!-- ==================== Info line (BMS row 21) ======================= -->
      <span class="cell brt" style="--r:20;--c:11;--w:56;color:var(--bms-neutral);overflow:visible">Type 'U' to Update or 'D' to Delete a User from the list</span>

      <!-- ================= Error message line (BMS row 23) ================= -->
      <span class="cell brt" style="--r:22;--c:0;--w:78;color:var(--bms-red);overflow:visible"
            role="alert" th:text="*{errmsg}"></span>

      <!-- ============ PF-key legend / actions (BMS row 24) ================= -->
      <span class="cell" style="--r:23;--c:0;--w:48;color:var(--bms-yellow);overflow:visible"
            role="group" aria-label="Function keys"><button type="submit" class="key" name="pfkey" value="ENTER">ENTER=Continue</button>  <button type="submit" class="key" name="pfkey" value="PF3">F3=Back</button>  <button type="submit" class="key" name="pfkey" value="PF7">F7=Backward</button>  <button type="submit" class="key" name="pfkey" value="PF8">F8=Forward</button></span>
    </form>
  </main>
</body>
</html>
