# Derived baseline of scenario ACT-COACTUPC-negative-065 (capture_platform:
# derived), authored from the app/ source and never observed: no TPE region
# runs in CI. Open until a UniKix run of the app/ build is imported:
# GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012 (online-only
# copybooks such as CSSETATY).
# Steps 1-3: USER0001 signs on, option 2 XCTLs to COACTUPC, and ENTER with
# account 00000000001 shows the fetched account and the scenario's invented
# customer 000000001 (SSN 123456789) with the change prompt
# [app/cbl/COACTUPC.cbl:2787-2865,2955-2981].
# Step 4: the erased ACTSSN2 reaches 1100-RECEIVE-MAP as nulls or spaces and
# becomes LOW-VALUES, a change, so 1200-EDIT-MAP-INPUTS sets
# ACUP-CHANGES-NOT-OK and edits the fields in order; every edit before the
# SSN passes, SSN part 1 '123' passes, then 1265-EDIT-US-SSN edits part 2 as
# 'SSN 4th & 5th chars' with length 2 and 1245-EDIT-NUM-REQD finds it blank
# and, the message being still off, composes TRIM('SSN 4th & 5th chars')
# ' must be supplied.' (37 characters) into WS-RETURN-MSG; part 3 passes and
# no later edit can replace the message
# [app/cbl/COACTUPC.cbl:1240-1245,1460-1470,2109-2133,2466-2475].
# 2000-DECIDE-ACTION continues, so nothing is read for update or rewritten;
# 3203 moves the LOW-VALUES part back to ACTSSN2, CSSETATY moves '*' into it
# ('* ' at its 2-byte width), 3250 sets PROMPT-FOR-CHANGES and moves the
# message to ERRMSG, and 3390 brightens FKEY12 because a change was made
# [app/cbl/COACTUPC.cbl:2596-2597,2924,2955-2981,3303-3307,3566-3581]
# [app/cpy/CSSETATY.cpy:18-27].
# This pins the app/ text: the UniKix COACTUPC strings the untrimmed 25-byte
# name into the message (GAP-DOC-022), so a UniKix run never verifies it.
# One screen per step, each the screen shown after the step's AID; fields are
# full BMS width with trailing spaces kept; CURDATE and CURTIME come from the
# region clock and carry matchers. file_state: both files keep their 50
# records, account 00000000001 and customer 000000001 as fetched.
