# The statement of one card with two transactions. CARDXREF holds only the
# repository cross-reference of card 9680294154603697 (customer 000000001,
# account 00000000001), given inline so that the run writes a single statement;
# CBSTM03B reads the repository ACCTDATA and CUSTDATA by key for it. TRXFL holds
# two invented transactions of that card, with ids, descriptions and merchants
# that match no repository transaction.
#
# 5000-CREATE-STATEMENT writes the name and address block, the account id, the
# balance 194.00 in the 9(9).99- edit and the FICO score 274, then the
# transaction headings [app/cbl/CBSTM03A.CBL:458-504]. 4000-TRNXFILE-GET writes
# one line per transaction of the card, adds each TRNX-AMT to WS-TOTAL-AMT and
# shows the sum 25.00 + 74.50 as 'Total EXP:' 99.50
# [app/cbl/CBSTM03A.CBL:416-437,675-679]. The text statement is 16 heading
# lines, one line per transaction and 3 closing lines: 21 in all. TRNX-DESC is
# cut to the 49 bytes of ST-TRANDT. The HTML statement writes a table row per
# transaction and no total
# line: the closing rows of 4000-TRNXFILE-GET carry only 'End of Statement'
# [app/cbl/CBSTM03A.CBL:439-454,681-721]. Its STRINGs DELIMITED BY '  ' keep two
# spaces before '</p>', and the amount keeps the leading blanks of its Z(9).99-
# edit [app/cbl/CBSTM03A.CBL:558-592,708-716].
#
# The messages are the control-block walk over the TIOT that the page-zero shim
# builds from the CREASTMT STEP040 DD names of programs.yaml; the shim reports
# every UCB valid, and the last DD is shown by the DISPLAY after the loop
# [app/cbl/CBSTM03A.CBL:266-291] (GAP-STB-003). The run needs page zero mapped,
# so the scenario is blocked where the probe fails (GAP-MIS-002).
#
# All values come from a GnuCOBOL 3.2 run of the app/ source under the suite's
# compile options with the shim preloaded. Statement lines are the whole 80- and
# 100-byte records with their trailing spaces.
id: RPT-CBSTM03A-normal-02
level: unit
type: normal
description: >-
  CBSTM03A writes one statement for card 9680294154603697 of account
  00000000001 with its two transactions: in STMTFILE the name, address, account
  id, current balance 000000194.00, FICO score 274, one line per transaction
  ($25.00 and $74.50) and 'Total EXP:' $99.50, 21 lines in all; in HTMLFILE the
  same statement as 86 HTML lines with a table row per transaction and no total;
  the TIOT display of job CREASTMT step STEP040 and its DD names; return code 0.
inventory_ids:
- INV-RPT-048  # CBSTM03A per-statement transaction total (calculation)
- INV-RPT-004  # CBSTM03A program
- INV-RPT-005  # CBSTM03B program, the file service CBSTM03A calls
- INV-RPT-045  # CBSTM03A text statement (report)
- INV-RPT-046  # CBSTM03A HTML statement (report)
- INV-RPT-049  # CBSTM03B file service operations O/C/R/K (interface)
- INV-LAY-004  # COSTM01 copybook, the TRXFL record
- INV-LAY-015  # CUSTREC copybook, the customer record the statement reads
# The CVACT01Y and CVACT03Y layouts and the account, cross-reference and
# customer data files (ASCII and EBCDIC) are not listed: the DAT-CBACT01C,
# DAT-CBACT03C, DAT-CBCUS01C, TRN-CBTRN01C, TRN-CBTRN02C, FIN-CBACT04C and
# RPT-CBTRN03C unit scenarios verify them and never depend on page zero, so
# when the page-zero probe fails these scenarios block only the CBSTM03A and
# CBSTM03B items, COSTM01 and CUSTREC.
tags: []
gap_ids:
- GAP-STB-003  # the page-zero PSA/TCB/TIOT shim in place of the z/OS control blocks
- GAP-MIS-002  # whether the runner lets the shim map page zero
- GAP-STB-010  # Berkeley DB indexed files in place of the VSAM KSDS
- GAP-STB-011  # GnuCOBOL compile and runtime options in place of Enterprise COBOL and LE
