# =====================================================================
# Kubernetes Secret Resource for CardDemo Application
# =====================================================================
# 
# Purpose: Store sensitive credentials and keys for the CardDemo 
#          modernized application, replacing RACF security system
#          with Spring Security and cloud-native secret management.
#
# Original System: RACF (Resource Access Control Facility) on z/OS
# Target System:   Kubernetes Secrets + Spring Security
#
# Contents:
#   - PostgreSQL database credentials (username, password, database)
#   - Database connection URL
#   - JWT secret key for authentication token generation (256-bit)
#   - Application encryption keys for secure data handling
#
# Security Notes:
#   - All values MUST be base64-encoded before applying to cluster
#   - This file contains EXAMPLE/PLACEHOLDER values only
#   - NEVER commit actual production secrets to version control
#   - Use external secret management systems in production:
#     * HashiCorp Vault
#     * AWS Secrets Manager
#     * Azure Key Vault
#     * Google Cloud Secret Manager
#     * Sealed Secrets (for GitOps workflows)
#
# Migration Context:
#   Agent Action Plan Section 0.1.1: Replace RACF with Spring Security
#   Agent Action Plan Section 0.3.1: Kubernetes infrastructure setup
#
# =====================================================================

apiVersion: v1
kind: Secret
metadata:
  name: carddemo-secrets
  namespace: carddemo
  labels:
    app: carddemo
    component: secrets
    environment: production
  annotations:
    description: "Sensitive credentials for CardDemo application"
    migration.source: "RACF security system"
    migration.target: "Spring Security + Kubernetes Secrets"

# Secret type: Opaque for generic secret data
type: Opaque

# =====================================================================
# SECRET DATA - Base64 Encoded Values
# =====================================================================
#
# IMPORTANT: All values below are PLACEHOLDER EXAMPLES only.
# Before deploying to any environment, replace with actual values.
#
# How to generate and encode secrets:
#
# 1. PostgreSQL Username:
#    echo -n 'carddemo_user' | base64
#
# 2. PostgreSQL Password (generate strong password):
#    openssl rand -base64 32 | base64
#
# 3. PostgreSQL Database Name:
#    echo -n 'carddemo_db' | base64
#
# 4. Database URL:
#    echo -n 'postgresql://postgres-service:5432/carddemo_db?sslmode=require' | base64
#
# 5. JWT Secret Key (generate 256-bit random key):
#    openssl rand -base64 32 | base64
#    # Note: This generates a 256-bit (32-byte) key
#
# 6. Encryption Key (generate 256-bit random key):
#    openssl rand -base64 32 | base64
#
# To decode a base64 value for verification:
#    echo 'base64string' | base64 --decode
#
# =====================================================================

data:
  # ---------------------------------------------------------------------
  # PostgreSQL Database Credentials
  # ---------------------------------------------------------------------
  # These credentials replace VSAM file access authentication
  # Original: RACF security profiles for VSAM datasets
  # Target: PostgreSQL role-based authentication
  
  # Database username for application connection
  # Example value: 'carddemo_user' (base64 encoded)
  # Production: Create dedicated PostgreSQL role with minimal privileges
  POSTGRES_USER: Y2FyZGRlbW9fdXNlcg==
  
  # Database password for application connection
  # Example value: randomly generated 32-character password (base64 encoded)
  # Production: Use strong password (minimum 32 characters, alphanumeric + symbols)
  # Recommendation: Rotate every 90 days
  POSTGRES_PASSWORD: Q0hBTkdFX1RISVNfUEFTU1dPUkRfSU5fUFJPRFVDVElPTg==
  
  # Database name
  # Example value: 'carddemo_db' (base64 encoded)
  # This is the PostgreSQL database name created by Flyway migrations
  POSTGRES_DB: Y2FyZGRlbW9fZGI=
  
  # Complete database connection URL
  # Format: postgresql://<host>:<port>/<database>?<parameters>
  # Example: postgresql://postgres-service:5432/carddemo_db?sslmode=require
  # Production: Enable SSL/TLS (sslmode=require or sslmode=verify-full)
  DATABASE_URL: cG9zdGdyZXNxbDovL3Bvc3RncmVzLXNlcnZpY2U6NTQzMi9jYXJkZGVtb19kYj9zc2xtb2RlPXJlcXVpcmU=
  
  # ---------------------------------------------------------------------
  # JWT Authentication Secret Key
  # ---------------------------------------------------------------------
  # Used by Spring Security for signing JWT tokens
  # Original: RACF security tokens and session management
  # Target: JWT-based stateless authentication
  
  # JWT signing key (MUST be 256-bit minimum for HS256 algorithm)
  # Example: 32-byte random key base64 encoded
  # Production: Generate using cryptographically secure random generator
  # CRITICAL: This key signs all authentication tokens - protect carefully
  # If compromised, all issued tokens become vulnerable
  JWT_SECRET_KEY: Q0hBTkdFX1RISVNfSldUX1NFQ1JFVF9LRVlfVE9fQV8yNTZfQklUX1JBTkRPTV9TVFJJTkc=
  
  # JWT token expiration time (in seconds)
  # Example value: '3600' = 1 hour (base64 encoded)
  # Balances security (shorter = more secure) vs. user experience
  JWT_EXPIRATION: MzYwMA==
  
  # JWT refresh token expiration time (in seconds)
  # Example value: '604800' = 7 days (base64 encoded)
  # Used for token refresh without re-authentication
  JWT_REFRESH_EXPIRATION: NjA0ODAw
  
  # ---------------------------------------------------------------------
  # Application Encryption Keys
  # ---------------------------------------------------------------------
  # Used for encrypting sensitive data at rest
  # Original: RACF encryption services and z/OS cryptographic services
  # Target: Application-level encryption with Spring Boot
  
  # Master encryption key for sensitive field encryption
  # Example: 32-byte AES-256 key base64 encoded
  # Used for encrypting PII data (SSN, account numbers, etc.)
  # Production: Store in HSM (Hardware Security Module) or KMS
  ENCRYPTION_KEY: Q0hBTkdFX1RISVNfRU5DUllQVElPTl9LRVlfVE9fQV8yNTZfQklUX1JBTkRPTV9TVFJJTkc=
  
  # Initialization Vector (IV) for AES encryption
  # Example: 16-byte random IV base64 encoded
  # Should be unique per encryption operation in production
  ENCRYPTION_IV: Q0hBTkdFX1RISVNfSVY=
  
  # ---------------------------------------------------------------------
  # Spring Security Configuration Secrets
  # ---------------------------------------------------------------------
  # Additional security configuration values
  
  # BCrypt password encoding strength (work factor)
  # Example value: '12' (base64 encoded)
  # Range: 4-31 (higher = more secure but slower)
  # Recommendation: 12-14 for production
  BCRYPT_STRENGTH: MTI=
  
  # Session encryption key (for server-side session storage if used)
  # Example: 32-byte random key base64 encoded
  # Note: Primary design uses stateless JWT, but included for flexibility
  SESSION_ENCRYPTION_KEY: Q0hBTkdFX1RISVNfU0VTU0lPTl9FTkNSWVBUSU9OX0tFWQ==

# =====================================================================
# USAGE IN DEPLOYMENTS
# =====================================================================
#
# Backend Deployment - Environment Variables:
# 
# env:
#   - name: SPRING_DATASOURCE_USERNAME
#     valueFrom:
#       secretKeyRef:
#         name: carddemo-secrets
#         key: POSTGRES_USER
#   - name: SPRING_DATASOURCE_PASSWORD
#     valueFrom:
#       secretKeyRef:
#         name: carddemo-secrets
#         key: POSTGRES_PASSWORD
#   - name: SPRING_DATASOURCE_URL
#     valueFrom:
#       secretKeyRef:
#         name: carddemo-secrets
#         key: DATABASE_URL
#   - name: JWT_SECRET
#     valueFrom:
#       secretKeyRef:
#         name: carddemo-secrets
#         key: JWT_SECRET_KEY
#   - name: ENCRYPTION_KEY
#     valueFrom:
#       secretKeyRef:
#         name: carddemo-secrets
#         key: ENCRYPTION_KEY
#
# Alternative - Volume Mount:
#
# volumes:
#   - name: secrets-volume
#     secret:
#       secretName: carddemo-secrets
# volumeMounts:
#   - name: secrets-volume
#     mountPath: /etc/secrets
#     readOnly: true
#
# =====================================================================
# PRODUCTION DEPLOYMENT CHECKLIST
# =====================================================================
#
# Before deploying this Secret to production:
#
# [ ] Generate strong, unique passwords for PostgreSQL (minimum 32 chars)
# [ ] Generate cryptographically secure JWT secret key (256-bit)
# [ ] Generate cryptographically secure encryption keys (256-bit)
# [ ] Verify all values are properly base64 encoded
# [ ] Remove this file from version control (add to .gitignore)
# [ ] Use external secret management system (Vault, AWS Secrets Manager)
# [ ] Enable Kubernetes Secret encryption at rest
# [ ] Implement RBAC to restrict Secret access
# [ ] Configure secret rotation policy (90-day recommendation)
# [ ] Enable audit logging for Secret access
# [ ] Document secret recovery procedures
# [ ] Test secret rotation without downtime
# [ ] Implement backup and disaster recovery for secrets
#
# =====================================================================
# RACF TO SPRING SECURITY MAPPING
# =====================================================================
#
# Original RACF Security Model → Kubernetes Secret + Spring Security
#
# RACF User Profiles          → PostgreSQL user_security table
# RACF Password Management    → BCrypt hashed passwords + JWT tokens
# RACF Resource Profiles      → Spring Security @PreAuthorize annotations
# RACF Access Rules           → Role-based access control (RBAC)
# RACF Security Tokens        → JWT authentication tokens
# RACF Encryption Services    → Application-level AES-256 encryption
# RACF Audit Logging          → Spring Security audit events
# RACF Password Policies      → Spring Security password validators
#
# Security Equivalence Validation:
# - User authentication: RACF → Spring Security + JWT
# - Authorization: RACF profiles → Spring Security roles
# - Encryption: RACF → AES-256 application encryption
# - Audit: RACF audit → Spring Security audit logging
#
# =====================================================================
# SECRET ROTATION PROCEDURE
# =====================================================================
#
# To rotate secrets without downtime:
#
# 1. Generate new secret values using commands above
# 2. Create new Secret resource with different name:
#    kubectl create secret generic carddemo-secrets-v2 --from-literal=...
# 3. Update deployment to use new secret (rolling update):
#    kubectl set env deployment/carddemo-backend --from=secret/carddemo-secrets-v2
# 4. Verify all pods are healthy with new secrets
# 5. Delete old secret after grace period:
#    kubectl delete secret carddemo-secrets
# 6. Rename new secret to standard name:
#    kubectl get secret carddemo-secrets-v2 -o yaml | \
#      sed 's/carddemo-secrets-v2/carddemo-secrets/' | \
#      kubectl apply -f -
#
# For JWT_SECRET_KEY rotation:
# - Dual-key approach: Accept tokens signed with both old and new keys
# - Gradual migration: Issue new tokens with new key
# - Deprecate old key after token expiration period (e.g., 7 days)
#
# =====================================================================
# TROUBLESHOOTING
# =====================================================================
#
# View secret keys (without values):
#   kubectl get secret carddemo-secrets -n carddemo -o yaml
#
# Decode a specific secret value:
#   kubectl get secret carddemo-secrets -n carddemo -o jsonpath='{.data.POSTGRES_USER}' | base64 --decode
#
# Verify secret is mounted in pod:
#   kubectl exec -it <pod-name> -n carddemo -- env | grep POSTGRES
#
# Check if secret exists:
#   kubectl get secret carddemo-secrets -n carddemo
#
# Describe secret (shows keys but not values):
#   kubectl describe secret carddemo-secrets -n carddemo
#
# Common issues:
# - "secret not found": Ensure namespace matches (carddemo)
# - "invalid base64": Re-encode values using correct base64 encoding
# - "authentication failed": Verify PostgreSQL credentials match
# - "JWT validation failed": Verify JWT_SECRET_KEY matches across all pods
#
# =====================================================================
# END OF SECRETS MANIFEST
# =====================================================================
