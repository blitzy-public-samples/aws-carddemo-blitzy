# card-platform — the local demo environment.
# Starts one Kafka broker, one PostgreSQL instance and the six services.
# From this directory, run: cp .env.example .env && docker compose up -d
# Walkthrough: card-platform/docs/onboarding.md
# Rationale for every choice below: card-platform/docs/decision-log.md
---
# CLONE_INDEX suffixes the project name. A second checkout runs its own stack.
name: card-platform${CLONE_INDEX:-}

# --------------------------------------------------------------------------- #
# Shared blocks. Each service below points at these with a YAML alias.
# --------------------------------------------------------------------------- #

# Startup order. A service waits for the broker and the database, and for
# nothing else. No service waits for another service.
x-backing-services: &backing-services
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy

# Readiness probe. It reads /actuator/health on port 8080 with curl, wget or
# bash, whichever the runtime image carries. /bin/sh cannot open /dev/tcp, so
# the bash form names bash.
x-actuator-healthcheck: &actuator-healthcheck
  test:
    - CMD-SHELL
    - >-
      curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null 2>&1
      || wget -q -O /dev/null http://127.0.0.1:8080/actuator/health 2>/dev/null
      || bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080
      && printf "GET /actuator/health HTTP/1.0\r\n\r\n" >&3
      && head -1 <&3 | grep -q 200'
  interval: 10s
  timeout: 10s
  retries: 24
  start_period: 60s

# Settings every service reads. Inside this network the database always answers
# on 5432 and the broker on kafka:29092, whatever the host ports are.
x-service-environment: &service-environment
  SERVER_PORT: 8080
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-carddemo}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-carddemo}
  SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
  LOGGING_LEVEL_ROOT: ${LOG_LEVEL:-INFO}
  LOGGING_LEVEL_COM_CARDDEMO: ${LOG_LEVEL_CARDDEMO:-DEBUG}
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS:-health,info,metrics,prometheus}

services:

  # ------------------------------------------------------------------------- #
  # PostgreSQL. One instance, six private databases, one per service.
  # ------------------------------------------------------------------------- #
  postgres:
    image: postgres:18.4
    container_name: card-platform${CLONE_INDEX:-}-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carddemo}
      POSTGRES_USER: ${POSTGRES_USER:-carddemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carddemo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # The six databases, created on first start only. Flyway then creates and
    # migrates one schema inside each. No schema object is defined here.
    configs:
      - source: service_databases
        target: /docker-entrypoint-initdb.d/10-service-databases.sql
    # A PostgreSQL 18 image keeps its data under /var/lib/postgresql/18, so the
    # volume mounts one level above that. A volume at
    # /var/lib/postgresql/data makes the container exit 1 on start.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carddemo} -d ${POSTGRES_DB:-carddemo}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - carddemo
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # Apache Kafka. One node runs as broker and controller in Kafka Raft (KRaft)
  # mode. Three listeners: services reach kafka:29092, host tooling reaches
  # localhost:${KAFKA_PORT:-9092}, and KRaft talks to itself on 9093.
  # ------------------------------------------------------------------------- #
  kafka:
    image: apache/kafka:4.2.1
    container_name: card-platform${CLONE_INDEX:-}-kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-cardDemoPlatformKRaft1}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      # One node holds one copy of every partition.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    # This container also creates topics. It waits for the broker, then creates
    # the four event topics and one dead-letter topic per consumed topic.
    command:
      - /bin/bash
      - -c
      - |
        (
          until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
            sleep 2
          done
          for topic in ${TOPIC_TRANSACTION_AUTHORIZED:-transaction.authorized} \
                       ${TOPIC_TRANSACTION_DECLINED:-transaction.declined} \
                       ${TOPIC_TRANSACTION_POSTED:-transaction.posted} \
                       ${TOPIC_FRAUD_ASSESSED:-fraud.assessed} \
                       ${TOPIC_TRANSACTION_AUTHORIZED:-transaction.authorized}${TOPIC_DEAD_LETTER_SUFFIX:-.DLT} \
                       ${TOPIC_TRANSACTION_POSTED:-transaction.posted}${TOPIC_DEAD_LETTER_SUFFIX:-.DLT} \
                       ${TOPIC_FRAUD_ASSESSED:-fraud.assessed}${TOPIC_DEAD_LETTER_SUFFIX:-.DLT}; do
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
              --create --if-not-exists --topic "$$topic" \
              --partitions ${KAFKA_TOPIC_PARTITIONS:-3} \
              --replication-factor ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
          done
        ) &
        exec /etc/kafka/docker/run
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 45s
    networks:
      - carddemo
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # Authorization service. Answers POST /authorizations, applies the four
  # decline rules, and writes one event per call to its outbox. It is the only
  # service a client calls, and the only writer of the authorization decision.
  # ------------------------------------------------------------------------- #
  authorization-service:
    build:
      context: ./services/authorization-service
      dockerfile: Dockerfile
    container_name: card-platform${CLONE_INDEX:-}-authorization-service
    env_file:
      - path: .env
        required: false
    environment:
      <<: *service-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${AUTHORIZATION_DB_NAME:-carddemo_authorization}?currentSchema=${AUTHORIZATION_DB_SCHEMA:-authorization_service}
      SPRING_FLYWAY_SCHEMAS: ${AUTHORIZATION_DB_SCHEMA:-authorization_service}
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${AUTHORIZATION_DB_SCHEMA:-authorization_service}
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ${AUTHORIZATION_DB_SCHEMA:-authorization_service}
      TOPIC_TRANSACTION_AUTHORIZED: ${TOPIC_TRANSACTION_AUTHORIZED:-transaction.authorized}
      TOPIC_TRANSACTION_DECLINED: ${TOPIC_TRANSACTION_DECLINED:-transaction.declined}
      OUTBOX_RELAY_INTERVAL_MS: ${OUTBOX_RELAY_INTERVAL_MS:-500}
      OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-100}
    ports:
      - "${AUTHORIZATION_PORT:-8081}:8080"
    depends_on: *backing-services
    healthcheck: *actuator-healthcheck
    networks:
      - carddemo
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # Ledger posting service. Reads transaction.authorized, adds the amount to
  # the balance and to one cycle counter, and publishes transaction.posted.
  # ------------------------------------------------------------------------- #
  ledger-posting-service:
    build:
      context: ./services/ledger-posting-service
      dockerfile: Dockerfile
    container_name: card-platform${CLONE_INDEX:-}-ledger-posting-service
    env_file:
      - path: .env
        required: false
    environment:
      <<: *service-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${LEDGER_DB_NAME:-carddemo_ledger}?currentSchema=${LEDGER_DB_SCHEMA:-ledger_service}
      SPRING_FLYWAY_SCHEMAS: ${LEDGER_DB_SCHEMA:-ledger_service}
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${LEDGER_DB_SCHEMA:-ledger_service}
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ${LEDGER_DB_SCHEMA:-ledger_service}
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${GROUP_LEDGER_POSTING:-ledger-posting}
      GROUP_LEDGER_POSTING: ${GROUP_LEDGER_POSTING:-ledger-posting}
      TOPIC_TRANSACTION_AUTHORIZED: ${TOPIC_TRANSACTION_AUTHORIZED:-transaction.authorized}
      TOPIC_TRANSACTION_POSTED: ${TOPIC_TRANSACTION_POSTED:-transaction.posted}
      TOPIC_DEAD_LETTER_SUFFIX: ${TOPIC_DEAD_LETTER_SUFFIX:-.DLT}
      CONSUMER_MAX_RETRY_ATTEMPTS: ${CONSUMER_MAX_RETRY_ATTEMPTS:-3}
      CONSUMER_RETRY_BACKOFF_MS: ${CONSUMER_RETRY_BACKOFF_MS:-1000}
      OUTBOX_RELAY_INTERVAL_MS: ${OUTBOX_RELAY_INTERVAL_MS:-500}
      OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-100}
    ports:
      - "${LEDGER_PORT:-8082}:8080"
    depends_on: *backing-services
    healthcheck: *actuator-healthcheck
    networks:
      - carddemo
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # Fraud detection service. Reads transaction.authorized, scores the risk, and
  # publishes fraud.assessed. It never sits in the authorization response path.
  # ------------------------------------------------------------------------- #
  fraud-detection-service:
    build:
      context: ./services/fraud-detection-service
      dockerfile: Dockerfile
    container_name: card-platform${CLONE_INDEX:-}-fraud-detection-service
    env_file:
      - path: .env
        required: false
    environment:
      <<: *service-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${FRAUD_DB_NAME:-carddemo_fraud}?currentSchema=${FRAUD_DB_SCHEMA:-fraud_service}
      SPRING_FLYWAY_SCHEMAS: ${FRAUD_DB_SCHEMA:-fraud_service}
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${FRAUD_DB_SCHEMA:-fraud_service}
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ${FRAUD_DB_SCHEMA:-fraud_service}
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${GROUP_FRAUD_DETECTION:-fraud-detection}
      GROUP_FRAUD_DETECTION: ${GROUP_FRAUD_DETECTION:-fraud-detection}
      TOPIC_TRANSACTION_AUTHORIZED: ${TOPIC_TRANSACTION_AUTHORIZED:-transaction.authorized}
      TOPIC_FRAUD_ASSESSED: ${TOPIC_FRAUD_ASSESSED:-fraud.assessed}
      TOPIC_DEAD_LETTER_SUFFIX: ${TOPIC_DEAD_LETTER_SUFFIX:-.DLT}
      CONSUMER_MAX_RETRY_ATTEMPTS: ${CONSUMER_MAX_RETRY_ATTEMPTS:-3}
      CONSUMER_RETRY_BACKOFF_MS: ${CONSUMER_RETRY_BACKOFF_MS:-1000}
      OUTBOX_RELAY_INTERVAL_MS: ${OUTBOX_RELAY_INTERVAL_MS:-500}
      OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-100}
    ports:
      - "${FRAUD_PORT:-8083}:8080"
    depends_on: *backing-services
    healthcheck: *actuator-healthcheck
    networks:
      - carddemo
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # Notification service. Reads transaction.posted and fraud.assessed on two
  # consumer groups, keeps a card-keyed read model, and renders the alert.
  # ------------------------------------------------------------------------- #
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: card-platform${CLONE_INDEX:-}-notification-service
    env_file:
      - path: .env
        required: false
    environment:
      <<: *service-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${NOTIFICATION_DB_NAME:-carddemo_notification}?currentSchema=${NOTIFICATION_DB_SCHEMA:-notification_service}
      SPRING_FLYWAY_SCHEMAS: ${NOTIFICATION_DB_SCHEMA:-notification_service}
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${NOTIFICATION_DB_SCHEMA:-notification_service}
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ${NOTIFICATION_DB_SCHEMA:-notification_service}
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${GROUP_NOTIFICATION_POSTED:-notification-posted}
      GROUP_NOTIFICATION_POSTED: ${GROUP_NOTIFICATION_POSTED:-notification-posted}
      GROUP_NOTIFICATION_FRAUD: ${GROUP_NOTIFICATION_FRAUD:-notification-fraud}
      TOPIC_TRANSACTION_POSTED: ${TOPIC_TRANSACTION_POSTED:-transaction.posted}
      TOPIC_FRAUD_ASSESSED: ${TOPIC_FRAUD_ASSESSED:-fraud.assessed}
      TOPIC_DEAD_LETTER_SUFFIX: ${TOPIC_DEAD_LETTER_SUFFIX:-.DLT}
      CONSUMER_MAX_RETRY_ATTEMPTS: ${CONSUMER_MAX_RETRY_ATTEMPTS:-3}
      CONSUMER_RETRY_BACKOFF_MS: ${CONSUMER_RETRY_BACKOFF_MS:-1000}
    ports:
      - "${NOTIFICATION_PORT:-8084}:8080"
    depends_on: *backing-services
    healthcheck: *actuator-healthcheck
    networks:
      - carddemo
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # Account service. Serves account and customer reads and updates, and closes
  # the billing cycle, which zeroes the two cycle counters.
  # ------------------------------------------------------------------------- #
  account-service:
    build:
      context: ./services/account-service
      dockerfile: Dockerfile
    container_name: card-platform${CLONE_INDEX:-}-account-service
    env_file:
      - path: .env
        required: false
    environment:
      <<: *service-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${ACCOUNT_DB_NAME:-carddemo_account}?currentSchema=${ACCOUNT_DB_SCHEMA:-account_service}
      SPRING_FLYWAY_SCHEMAS: ${ACCOUNT_DB_SCHEMA:-account_service}
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${ACCOUNT_DB_SCHEMA:-account_service}
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ${ACCOUNT_DB_SCHEMA:-account_service}
      OUTBOX_RELAY_INTERVAL_MS: ${OUTBOX_RELAY_INTERVAL_MS:-500}
      OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-100}
    ports:
      - "${ACCOUNT_PORT:-8085}:8080"
    depends_on: *backing-services
    healthcheck: *actuator-healthcheck
    networks:
      - carddemo
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # Card service. Serves the card list, the card detail and the card update.
  # The card list returns seven rows a page.
  # ------------------------------------------------------------------------- #
  card-service:
    build:
      context: ./services/card-service
      dockerfile: Dockerfile
    container_name: card-platform${CLONE_INDEX:-}-card-service
    env_file:
      - path: .env
        required: false
    environment:
      <<: *service-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${CARD_DB_NAME:-carddemo_card}?currentSchema=${CARD_DB_SCHEMA:-card_service}
      SPRING_FLYWAY_SCHEMAS: ${CARD_DB_SCHEMA:-card_service}
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${CARD_DB_SCHEMA:-card_service}
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ${CARD_DB_SCHEMA:-card_service}
      OUTBOX_RELAY_INTERVAL_MS: ${OUTBOX_RELAY_INTERVAL_MS:-500}
      OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-100}
    ports:
      - "${CARD_PORT:-8086}:8080"
    depends_on: *backing-services
    healthcheck: *actuator-healthcheck
    networks:
      - carddemo
    restart: unless-stopped

configs:

  # One database per service. The statements run once, on an empty data
  # directory, as the user the database container creates.
  service_databases:
    content: |
      CREATE DATABASE ${AUTHORIZATION_DB_NAME:-carddemo_authorization};
      CREATE DATABASE ${LEDGER_DB_NAME:-carddemo_ledger};
      CREATE DATABASE ${FRAUD_DB_NAME:-carddemo_fraud};
      CREATE DATABASE ${NOTIFICATION_DB_NAME:-carddemo_notification};
      CREATE DATABASE ${ACCOUNT_DB_NAME:-carddemo_account};
      CREATE DATABASE ${CARD_DB_NAME:-carddemo_card};

volumes:

  # Database files and broker log segments survive `docker compose down`.
  # `docker compose down -v` discards both.
  postgres-data:
  kafka-data:

networks:

  # One bridge network. Inside it a container reaches another by service name.
  carddemo:
    driver: bridge
