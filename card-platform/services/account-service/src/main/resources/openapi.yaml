openapi: 3.1.0

# Written by hand. No documentation generator joins the classpath, so what this file states and what
# the code accepts are kept in step by the tests under src/test/java, not by an annotation
# processor.
#
# Every field width, every rejection text and every status code below is read from the source. The
# locator beside each one names the file and the line it came from.

info:
  title: CardDemo account service
  version: 1.0.0
  description: >-
    The account and customer surface of the modernized CardDemo platform, plus the one operational
    endpoint that closes a billing cycle. The read path comes from app/cbl/COACTVWC.cbl, transaction
    CAVW, and the update path from app/cbl/COACTUPC.cbl, transaction CAUP. That program carries
    twenty-four field edits at app/cbl/COACTUPC.cbl:L1470-L1676 and a field-by-field concurrency
    check at app/cbl/COACTUPC.cbl:L4109-L4193. The cycle-close endpoint reproduces two statements
    and
    no more, app/cbl/CBACT04C.cbl:L353-L354. The credit-limit rule of the authorization service
    reads
    the two accumulators those statements return to zero.


    This service is queried and it does not query. It calls no other service. It publishes one
    AccountStateChanged event per mutation, which keeps the authorization service's copy of the
    credit
    limit, both cycle accumulators and the expiry date current.
  license:
    name: Apache-2.0

servers:
  - url: http://localhost:8085
    description: >-
      The address to call from the host. The container listens on 8080, which
      src/main/resources/application.yml sets, and card-platform/docker-compose.yml publishes that
      port on 8085 through ACCOUNT_PORT. A caller inside the compose network uses 8080.

tags:
  - name: account
    description: Reading and updating one account.
  - name: customer
    description: Reading one customer.
  - name: billing-cycle
    description: Returning both cycle accumulators to zero.

# Every route below requires a credential. config/SecurityConfig installs HTTP Basic authentication
# and refuses any route it does not name, so an endpoint added without a rule is denied and not
# opened. The two read routes are ownership-scoped on their path variable; the two write routes
# require the administrator role.
security:
  - basicAuth: []

paths:
  /accounts/{accountId}:
    get:
      tags: [account]
      operationId: readAccount
      summary: Read one account.
      description: >-
        Reproduces the keyed read at app/cbl/COACTVWC.cbl:L790-L800.


        The response carries the account and no customer. ACCOUNT-RECORD at
        app/cpy/CVACT01Y.cpy:L4-L17 declares no customer identifier, so the source reaches a
        customer
        only through the cross-reference record at app/cbl/COACTVWC.cbl:L828-L829. The card service
        owns that record, so a caller that wants the customer reads GET /customers/{customerId} with
        an identifier it already holds.


        An ordinary identity reads the accounts its authorities name and receives 403 for any other.
        An administrator reads any account.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: >-
            The account. The example is the row db/migration/V2__seed.sql loads for this identifier
            from app/data/ASCII/acctdata.txt, so a call against the demo stack answers these values.
            groupId is empty in all fifty seeded rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
              example:
                accountId: '00000000050'
                activeStatus: 'Y'
                currentBalance: '492.00'
                creditLimit: '6169.00'
                cashCreditLimit: '4587.00'
                currentCycleCredit: '0.00'
                currentCycleDebit: '0.00'
                openDate: '2011-04-22'
                expirationDate: '2023-03-09'
                reissueDate: '2023-03-09'
                groupId: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            This service holds no such account row. The detail reproduces the text
            9300-GETACCTDATA-BYACCT builds at app/cbl/COACTVWC.cbl:L796-L806, which concatenates
            four
            literals around the account identifier, a response code and a reason code. The
            identifier
            is the one the caller put in the path, and the two codes are the status of this response
            and its reason phrase. The source carries no space after 'file.' and none after either
            colon, and the detail keeps that spacing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
              example:
                type: about:blank
                title: Not found
                status: 404
                detail: 'Account:00000000050 not found in Acct Master file.Resp:404 Reas:Not Found'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalFailure'

    put:
      tags: [account]
      operationId: updateAccount
      summary: Update one account and its customer.
      description: >-
        Reproduces app/cbl/COACTUPC.cbl. The submitted pair is edited field by field and the stored
        pair is re-read under a write lock. The two are compared field by field at
        app/cbl/COACTUPC.cbl:L4109-L4193. Both rows plus one event row are written in one local
        transaction at app/cbl/COACTUPC.cbl:L4066 and :L4086.


        A block that is present has to be complete. Ten components of customerData and nine of
        accountData carry a mandatory-field edit, each reproducing one edit of
        app/cbl/COACTUPC.cbl:L1470-L1676. Those edits refuse an absent value exactly as they refuse
        a
        blank one. That is the 3270 screen's own contract: the screen was filled from the fetched
        record and submitted every field, so a field the operator did not touch still arrived.


        A component the required list of its block names is refused when it is absent and refused
        when
        it is blank, and the two answer the same text. Omitting creditLimit is refused with
        'Credit Limit must be supplied.' exactly as sending '' for it is. No omitted component is
        filled
        from the stored row, so a caller that drops a field is told which field it dropped.


        What a caller may omit is a whole block. A body carrying customerData alone leaves every
        account column as stored, and one carrying both replaces both records. Within a block, a
        component the required list does not name may be omitted and keeps its stored value. Those
        are
        the middle name, the second address line, both telephone numbers, the government-issued
        identifier, the date of birth and the disclosure group.


        The three Social Security parts are one column. They are recombined only when all three
        arrive, which the cross-field check on the block also requires.


        customerData is required and carries a required customerId. An account record names no
        customer and this service owns no cross-reference table. The account identifier comes from
        the
        path alone, and the body carries none.


        A seeded customer cannot be resubmitted unchanged. Every one of the fifty rows
        db/migration/V2__seed.sql loads fails at least one edit of app/cbl/COACTUPC.cbl:L1470-L1676.
        That reproduces the source: those edits ran on 3270 screen input and never on stored
        records.
        The example below names the two values it had to change and why each one failed.


        A write produces one event per record it changed, and no event for a record it left as it
        stood.
        A changed account row produces one AccountStateChanged carrying changeKind ACCOUNT_UPDATED,
        against the contract in src/main/resources/schemas/account-state-changed-v1.json. A changed
        customer row produces one CustomerContextChanged, against
        src/main/resources/schemas/customer-context-changed-v1.json. Raising creditLimit while
        resubmitting the customer values the caller was shown produces the account event alone, and
        changing an address while omitting accountData produces the customer event alone. Changing
        both
        produces both. The comparison is the one app/cbl/COACTUPC.cbl:L1684-L1768 draws, applied per
        record, and a body that changes nothing answers 200 with the no-change text and produces
        none.


        Request handling publishes nothing. outbox/OutboxWriter writes each outbox_event row in the
        same transaction as the two record writes, and outbox/OutboxRelay publishes them afterwards
        on
        a fixed delay. card-platform/docs/event-flow.md carries the path an event takes from here.


        Restricted to the administrator role. One call writes two records and produces one event
        that
        changes what the authorization service authorizes against.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
            examples:
              customerOnly:
                summary: >-
                  Update the customer alone, leaving every account column as stored. The account
                  block
                  is omitted; the customer block carries all fourteen of its required components, as
                  a
                  present block has to. Both telephone numbers are supplied even though neither is
                  required, because omitting one hands the stored value to the edit and the stored
                  phoneNumber2 for this customer carries area code 493, which the general-purpose
                  band
                  does not hold. That is the seeded-row point the description above makes, and it
                  reaches an omitted component as readily as a submitted one.
                value:
                  customerData:
                    customerId: '000000050'
                    firstName: Aniya
                    lastName: Von
                    addressLine1: 1588 Nienow Cape
                    addressCity: New Aricchester
                    addressStateCode: 'OR'
                    addressCountryCode: 'USA'
                    addressZip: '97201'
                    phoneNumber1: '(325)301-0827'
                    phoneNumber2: '(503)985-9283'
                    socialSecurityPart1: '111'
                    socialSecurityPart2: '11'
                    socialSecurityPart3: '1111'
                    eftAccountId: '0074883577'
                    primaryCardHolderIndicator: 'Y'
                    ficoCreditScore: '623'
              wholeScreenSubmit:
                summary: >-
                  The whole pair, as the 3270 screen submitted it. Every value is the seeded row for
                  account 00000000050 and customer 000000050, with the dates in the eight-character
                  request form. Two values changed. addressZip 04257 becomes 97201, since OR97 is
                  the
                  only Oregon prefix among the 240 combinations app/cpy/CSLKPCDY.cpy lists.
                  phoneNumber2 area code 493 becomes 503, which the general-purpose band holds.


                  expirationDate is the fixture value. A deployment that applies the
                  classpath:db/demo overlay reads 2099-12-31 for this account instead, and submitting
                  20230309 there replaces that extension with a past date, publishes it, and declines
                  every later authorization on this account with reason code 103. Send back the value
                  the read returned. card-platform/docs/onboarding.md carries the pitfall and a body
                  that keeps both copies of the expiry in step.
                value:
                  accountData:
                    activeStatus: 'Y'
                    currentBalance: '492.00'
                    creditLimit: '6169.00'
                    cashCreditLimit: '4587.00'
                    openDate: '20110422'
                    expirationDate: '20230309'
                    reissueDate: '20230309'
                    currentCycleCredit: '0.00'
                    currentCycleDebit: '0.00'
                    groupId: ''
                  customerData:
                    customerId: '000000050'
                    firstName: Aniya
                    middleName: Alba
                    lastName: Von
                    addressLine1: 1588 Nienow Cape
                    addressLine2: Suite 187
                    addressCity: New Aricchester
                    addressStateCode: 'OR'
                    addressCountryCode: 'USA'
                    addressZip: '97201'
                    phoneNumber1: '(325)301-0827'
                    phoneNumber2: '(503)985-9283'
                    socialSecurityPart1: '111'
                    socialSecurityPart2: '11'
                    socialSecurityPart3: '1111'
                    governmentIssuedId: 'SPECIMEN-0000000001'
                    dateOfBirth: '19601201'
                    eftAccountId: '0074883577'
                    primaryCardHolderIndicator: 'Y'
                    ficoCreditScore: '623'
      responses:
        '200':
          description: >-
            The pair was written, or nothing changed. The message component separates the two, and
            the account component carries the stored row as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountUpdateResponse'
              examples:
                applied:
                  summary: >-
                    Both rows and one event row were written. The account carries the stored row as
                    it
                    now stands, so a raised credit limit shows here.
                  value:
                    message: Changes committed to database
                    account:
                      accountId: '00000000050'
                      activeStatus: 'Y'
                      currentBalance: '492.00'
                      creditLimit: '7000.00'
                      cashCreditLimit: '4587.00'
                      currentCycleCredit: '0.00'
                      currentCycleDebit: '0.00'
                      openDate: '2011-04-22'
                      expirationDate: '2023-03-09'
                      reissueDate: '2023-03-09'
                      groupId: ''
                noChange:
                  summary: >-
                    The submitted pair equalled the fetched pair, from
                    app/cbl/COACTUPC.cbl:L1463-L1467. Nothing was written and no event was produced.
                  value:
                    message: No change detected with respect to values fetched.
                    account:
                      accountId: '00000000050'
                      activeStatus: 'Y'
                      currentBalance: '492.00'
                      creditLimit: '6169.00'
                      cashCreditLimit: '4587.00'
                      currentCycleCredit: '0.00'
                      currentCycleDebit: '0.00'
                      openDate: '2011-04-22'
                      expirationDate: '2023-03-09'
                      reissueDate: '2023-03-09'
                      groupId: ''
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Another writer changed a row first, from app/cbl/COACTUPC.cbl:L3947-L3952, or a row
            could
            not be locked, from :L3907-L3915 and :L3934-L3942. Nothing was written. A caller retries
            this request unchanged after reading the row again.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: Record changed by some one else. Please review
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalFailure'

  /accounts/{accountId}/cycle-close:
    post:
      tags: [billing-cycle]
      operationId: closeBillingCycle
      summary: Return both cycle accumulators to zero.
      description: >-
        Reproduces app/cbl/CBACT04C.cbl:L353-L354 and nothing else. No interest is computed, no
        disclosure group is read, and no transaction is written.


        The credit-limit rule at app/cbl/CBTRN02C.cbl:L403-L413 authorizes against cycle credit
        minus
        cycle debit. The only code in the repository that returns those two accumulators to zero
        lives
        inside the interest program, which stays batch. Without a substitute, every posted
        transaction
        raises the tested balance and nothing lowers it, so available credit shrinks until every
        transaction declines with reject code 0102.


        The effect on the two accumulators is idempotent: they are zero after one call and after
        ten.
        The events are not, since each call produces one AccountStateChanged event carrying
        changeKind
        BILLING_CYCLE_CLOSED. A caller that means to close a cycle once calls this once. The event
        leaves through the same outbox row and relay the update uses.


        Restricted to the administrator role. Clearing the accumulators is a decision about the
        whole
        account, not about one cardholder's own data.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: >-
            The cycle was closed. Both accumulators are carried back, so a caller can see that they
            are zero without reading the account again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCloseResponse'
              example:
                accountId: '00000000050'
                currentCycleCredit: '0.00'
                currentCycleDebit: '0.00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalFailure'

  /customers/{customerId}:
    get:
      tags: [customer]
      operationId: readCustomer
      summary: Read one customer.
      description: >-
        Reproduces the keyed read 9400-GETCUSTDATA-BYCUST issues at
        app/cbl/COACTVWC.cbl:L826-L834, and answers the customer values
        app/cbl/COACTVWC.cbl:L494-L522 moves to the screen.


        The path names the customer. ACCOUNT-RECORD at app/cpy/CVACT01Y.cpy:L4-L17 declares twelve
        fields and a filler, and none of them is a customer identifier. The source reads the
        identifier from the cross-reference record at app/cbl/COACTVWC.cbl:L739 and keys the
        customer file with it at app/cbl/COACTVWC.cbl:L708. Deviation D5 in
        card-platform/docs/decision-log.md records the resolution.


        The view carries sixteen of the eighteen fields CUSTOMER-RECORD declares at
        app/cpy/CVCUS01Y.cpy:L5-L22. The two it omits are CUST-SSN at app/cpy/CVCUS01Y.cpy:L17 and
        CUST-GOVT-ISSUED-ID at app/cpy/CVCUS01Y.cpy:L18, which the source displays at
        app/cbl/COACTVWC.cbl:L496-L504 and app/cbl/COACTVWC.cbl:L519. Deviation D10 records that
        divergence.


        An ordinary identity reads the customers its authorities name and receives 403 for any
        other.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: >-
            The customer. The example is the row db/migration/V2__seed.sql loads for this identifier
            from app/data/ASCII/custdata.txt. A read applies no edit, so the values arrive as
            stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerView'
              example:
                customerId: '000000050'
                ficoCreditScore: 623
                dateOfBirth: '1960-12-01'
                firstName: Aniya
                middleName: Alba
                lastName: Von
                addressLine1: 1588 Nienow Cape
                addressLine2: Suite 187
                addressCity: New Aricchester
                addressStateCode: 'OR'
                addressZip: '04257'
                addressCountryCode: 'USA'
                phoneNumber1: '(325)301-0827'
                phoneNumber2: '(493)985-9283'
                eftAccountId: '0074883577'
                primaryCardHolderIndicator: 'Y'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            This service holds no such customer row. The detail reproduces the text
            9400-GETCUSTDATA-BYCUST builds at app/cbl/COACTVWC.cbl:L846-L856, which concatenates
            four literals around the customer identifier, a response code and a reason code. The
            identifier is the one the caller put in the path, and the two codes are the status of
            this response and its reason phrase. Two spellings of the source are kept: L850 carries
            one space after 'Resp:' and L852 carries 'REAS:' in upper case, where the account text
            at L802 carries 'Reas:'.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
              example:
                type: about:blank
                title: Not found
                status: 404
                detail: 'CustId:000000001 not found in customer master.Resp: 404 REAS:Not Found'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalFailure'

components:

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >-
        HTTP Basic authentication over the identities carddemo.security.users configures.
        app/csd/CARDDEMO.CSD defines one USRSEC dataset the whole Customer Information Control
        System
        (CICS) region reads, so a platform-wide identity store is the faithful shape.
        app/cbl/COSGN00C.cbl:L223 compares a
        stored password against a supplied one in the clear. This service stores an encoded
        password,
        and the register entry for that source comparison records the difference.

  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      description: >-
        ACCT-ID PIC 9(11) at app/cpy/CVACT01Y.cpy:L5. Eleven decimal digits, zero padded on the
        left.
        The source compares the identifier as text, so the leading zeros belong to the value and
        account fifty is 00000000050.
      schema:
        type: string
        pattern: '^[0-9]{11}$'
      example: '00000000050'

    CustomerId:
      name: customerId
      in: path
      required: true
      description: >-
        CUST-ID PIC 9(09) at app/cpy/CVCUS01Y.cpy:L5. Nine decimal digits, zero padded on the left.
      schema:
        type: string
        pattern: '^[0-9]{9}$'
      example: '000000050'

  responses:
    MalformedRequest:
      description: The request body could not be read.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            type: about:blank
            title: Malformed request
            status: 400
            detail: >-
              The request body holds one account update in JavaScript Object Notation (JSON) and
              could not be read as one.

    Unauthorized:
      description: >-
        The request carried no usable credential. The WWW-Authenticate header names the realm.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: This request carried no usable credential.

    Forbidden:
      description: >-
        The caller is authenticated and does not own the identifier the path carries. The detail
        names
        neither the operation nor the identifier, so a caller probing for another subject's rows
        learns only that it may not have them.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: This identity may not use this operation.

    NotFound:
      description: >-
        This service holds no record for that request. The detail this response carries names no
        identifier, for the reason the 403 detail names none.


        The two read routes do not use this response. Each declares its own 404 and each reproduces
        the
        miss text its source paragraph composes, which opens with the identifier the caller named:
        app/cbl/COACTVWC.cbl:L796-L806 for the account read and :L846-L856 for the customer read.
        Those
        texts are the contract of those two routes, and this description does not govern them. A
        caller
        probing for another subject's rows learns nothing from either one that the path it sent did
        not
        already tell it, since the identifier in the text is the identifier in the path.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            type: about:blank
            title: Not found
            status: 404
            detail: This service holds no record for that request.

    ValidationFailed:
      description: >-
        A submitted field failed an edit, from app/cbl/COACTUPC.cbl:L1470-L1676, or a path variable
        carried the wrong width. An edit of the submitted pair produces one text, which travels in
        the
        detail. WS-RETURN-MSG PIC X(75) at app/cbl/COACTUPC.cbl:L479 holds one text under the guard
        at
        app/cbl/COACTUPC.cbl:L480. A request refused before it reaches the pair can fail more than
        one
        parameter. The messages member then carries one verbatim text per failing parameter.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            type: about:blank
            title: Validation failed
            status: 422
            detail: >-
              One or more submitted fields failed an edit. The messages member carries one text per
              failing field.
            messages:
              - 'FICO Score: should be between 300 and 850'
              - Address Line 1 must be supplied.

    InternalFailure:
      description: >-
        A fault inside this service. Nothing was changed. This replaces the abend path at
        app/cbl/CBTRN02C.cbl:L707-L711, which displayed a message, moved 999 into an abend code and
        performed no cleanup.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            type: about:blank
            title: Internal failure
            status: 500
            detail: This request could not be completed. Nothing was changed.

  schemas:

    AccountView:
      type: object
      additionalProperties: false
      description: >-
        Eleven of the twelve modelled fields of ACCOUNT-RECORD at app/cpy/CVACT01Y.cpy:L4-L17. The
        one it omits is the address postcode, which the customer record also carries and which the
        customer view returns. The 178 trailing filler bytes at app/cpy/CVACT01Y.cpy:L17 are
        modelled
        by nothing, and card-platform/docs/traceability-matrix.md records the omission.


        Every amount is a string carrying two fractional digits, never a JSON number. Most parsers
        read a JSON number into a binary floating-point value, which is the one thing a platform
        whose correctness rests on fixed-point arithmetic cannot allow.
      required:
        - accountId
        - activeStatus
        - currentBalance
        - creditLimit
        - cashCreditLimit
        - currentCycleCredit
        - currentCycleDebit
        - openDate
        - expirationDate
        - reissueDate
        - groupId
      properties:
        accountId:
          type: string
          pattern: '^[0-9]{11}$'
          description: ACCT-ID PIC 9(11) at app/cpy/CVACT01Y.cpy:L5.
        activeStatus:
          type: string
          maxLength: 1
          description: >-
            ACCT-ACTIVE-STATUS PIC X(01) at app/cpy/CVACT01Y.cpy:L6. No program in app/cbl/ tests
            this field before posting, so a closed account still posts.
            card-platform/docs/business-rule-flags.md records that.
        currentBalance:
          type: string
          pattern: '^-?[0-9]{1,10}\.[0-9]{2}$'
          description: ACCT-CURR-BAL PIC S9(10)V99 at app/cpy/CVACT01Y.cpy:L7.
        creditLimit:
          type: string
          pattern: '^-?[0-9]{1,10}\.[0-9]{2}$'
          description: >-
            ACCT-CREDIT-LIMIT PIC S9(10)V99 at app/cpy/CVACT01Y.cpy:L8. The credit-limit rule of the
            authorization service compares against this value.
        cashCreditLimit:
          type: string
          pattern: '^-?[0-9]{1,10}\.[0-9]{2}$'
          description: ACCT-CASH-CREDIT-LIMIT PIC S9(10)V99 at app/cpy/CVACT01Y.cpy:L9.
        currentCycleCredit:
          type: string
          pattern: '^-?[0-9]{1,10}\.[0-9]{2}$'
          description: >-
            ACCT-CURR-CYC-CREDIT PIC S9(10)V99 at app/cpy/CVACT01Y.cpy:L13. POST
            /accounts/{accountId}/cycle-close returns this to zero.
        currentCycleDebit:
          type: string
          pattern: '^-?[0-9]{1,10}\.[0-9]{2}$'
          description: ACCT-CURR-CYC-DEBIT PIC S9(10)V99 at app/cpy/CVACT01Y.cpy:L14.
        openDate:
          type: string
          maxLength: 10
          description: ACCT-OPEN-DATE PIC X(10) at app/cpy/CVACT01Y.cpy:L10.
        expirationDate:
          type: string
          maxLength: 10
          description: >-
            ACCT-EXPIRAION-DATE PIC X(10) at app/cpy/CVACT01Y.cpy:L11, whose source name transposes
            two letters. The name is corrected here and the rename is recorded in
            the mapping document this schema names. No behaviour depends on the identifier text.
            The value is ten characters of text and carries no date format:
            app/cbl/CBTRN02C.cbl:L414-L420 compares it as text against the first ten characters of a
            twenty-six character timestamp.
        reissueDate:
          type: string
          maxLength: 10
          description: ACCT-REISSUE-DATE PIC X(10) at app/cpy/CVACT01Y.cpy:L12.
        groupId:
          type: string
          maxLength: 10
          description: >-
            ACCT-GROUP-ID PIC X(10) at app/cpy/CVACT01Y.cpy:L16, which names the disclosure group
            the
            interest program reads.

    CustomerView:
      type: object
      additionalProperties: false
      description: >-
        Sixteen of the eighteen modelled fields of CUSTOMER-RECORD at app/cpy/CVCUS01Y.cpy:L5-L22.
        The two it omits are CUST-SSN at app/cpy/CVCUS01Y.cpy:L17 and CUST-GOVT-ISSUED-ID at
        app/cpy/CVCUS01Y.cpy:L18. The 168 trailing filler bytes at app/cpy/CVCUS01Y.cpy:L23 are
        modelled by nothing.


        app/cpy/CUSTREC.cpy declares a second, divergent copy of this record, differing in one date
        field name and stamped one second apart. CVCUS01Y is the adopted layout, bound by six
        programs, and the register entry for that fork records it.
      required:
        - customerId
        - ficoCreditScore
        - dateOfBirth
        - firstName
        - lastName
        - addressLine1
        - addressCity
        - addressStateCode
        - addressZip
        - addressCountryCode
        - phoneNumber1
        - primaryCardHolderIndicator
      properties:
        customerId:
          type: string
          pattern: '^[0-9]{9}$'
          description: CUST-ID PIC 9(09) at app/cpy/CVCUS01Y.cpy:L5.
        ficoCreditScore:
          type: integer
          minimum: 300
          maximum: 850
          description: >-
            CUST-FICO-CREDIT-SCORE PIC 9(03) at app/cpy/CVCUS01Y.cpy:L22, and column
            fico_credit_score is NUMERIC(3,0). A whole number of three digits with no fraction. The
            inclusive bounds are the values of 88 FICO-RANGE-IS-VALID VALUES 300 THROUGH 850 at
            app/cbl/COACTUPC.cbl:L848-L849. Twenty-one of the fifty seeded rows hold a score outside
            those bounds, which a read returns as stored.
        dateOfBirth:
          type: string
          maxLength: 10
          description: CUST-DOB-YYYY-MM-DD PIC X(10) at app/cpy/CVCUS01Y.cpy:L19.
        firstName:
          type: string
          maxLength: 25
          description: CUST-FIRST-NAME PIC X(25) at app/cpy/CVCUS01Y.cpy:L6.
        middleName:
          type: string
          maxLength: 25
          description: >-
            CUST-MIDDLE-NAME PIC X(25) at app/cpy/CVCUS01Y.cpy:L7. Optional in the source edit.
        lastName:
          type: string
          maxLength: 25
          description: CUST-LAST-NAME PIC X(25) at app/cpy/CVCUS01Y.cpy:L8.
        addressLine1:
          type: string
          maxLength: 50
          description: CUST-ADDR-LINE-1 PIC X(50) at app/cpy/CVCUS01Y.cpy:L9.
        addressLine2:
          type: string
          maxLength: 50
          description: CUST-ADDR-LINE-2 PIC X(50) at app/cpy/CVCUS01Y.cpy:L10. Optional.
        addressCity:
          type: string
          maxLength: 50
          description: CUST-ADDR-LINE-3 PIC X(50) at app/cpy/CVCUS01Y.cpy:L11.
        addressStateCode:
          type: string
          maxLength: 2
          description: >-
            CUST-ADDR-STATE-CD PIC X(02) at app/cpy/CVCUS01Y.cpy:L12, checked against the 56 state
            codes app/cpy/CSLKPCDY.cpy:L1012 lists.
        addressZip:
          type: string
          maxLength: 10
          description: >-
            CUST-ADDR-ZIP PIC X(10) at app/cpy/CVCUS01Y.cpy:L14, and column address_zip is
            VARCHAR(10). The edit on the update path inspects the first five characters only, so a
            stored value can be wider than a submitted one.
        addressCountryCode:
          type: string
          maxLength: 3
          description: CUST-ADDR-COUNTRY-CD PIC X(03) at app/cpy/CVCUS01Y.cpy:L13.
        phoneNumber1:
          type: string
          maxLength: 15
          description: >-
            CUST-PHONE-NUM-1 PIC X(15) at app/cpy/CVCUS01Y.cpy:L15. On the update path its area code
            is checked against the 410-code general-purpose band at app/cpy/CSLKPCDY.cpy:L521
            onward,
            the one band app/cbl/COACTUPC.cbl:L2298 consults.
        phoneNumber2:
          type: string
          maxLength: 15
          description: CUST-PHONE-NUM-2 PIC X(15) at app/cpy/CVCUS01Y.cpy:L16. Optional.
        eftAccountId:
          type: string
          maxLength: 10
          description: CUST-EFT-ACCOUNT-ID PIC X(10) at app/cpy/CVCUS01Y.cpy:L20.
        primaryCardHolderIndicator:
          type: string
          maxLength: 1
          description: CUST-PRI-CARD-HOLDER-IND PIC X(01) at app/cpy/CVCUS01Y.cpy:L22.

    AccountUpdateRequest:
      type: object
      additionalProperties: false
      description: >-
        The submitted pair, which app/cbl/COACTUPC.cbl calls ACUP-NEW-ACCT-DATA and
        ACUP-NEW-CUST-DATA. Every value is a string. The source reads its screen fields as text and
        its numeric edits accept the tolerant grammar of FUNCTION NUMVAL-C, gated at
        app/cbl/COACTUPC.cbl:L2201, which admits a currency symbol and thousands separators. A
        credit
        limit of $12,000.00 is accepted and so is 12000.00.


        The account identifier is not a member of this body. It comes from the path.
      required: [customerData]
      properties:
        accountData:
          $ref: '#/components/schemas/AccountDataRequest'
        customerData:
          $ref: '#/components/schemas/CustomerDataRequest'

    AccountDataRequest:
      type: object
      additionalProperties: false
      description: >-
        The submitted account values. The block itself is optional and, when present, has to be
        complete: nine of its ten components carry a mandatory-field edit that refuses an absent
        value
        with the same text it refuses a blank one. groupId is the one component that may be omitted,
        and
        it then keeps its stored value, because no edit of app/cbl/COACTUPC.cbl reads it.


        Omitting the whole block is how a caller updates the customer alone.
      required:
        - activeStatus
        - currentBalance
        - creditLimit
        - cashCreditLimit
        - openDate
        - expirationDate
        - reissueDate
        - currentCycleCredit
        - currentCycleDebit
      properties:
        activeStatus:
          type: string
          maxLength: 1
          description: >-
            Edit 1 at app/cbl/COACTUPC.cbl:L1472. Y or N, and the rejection reads
            'Account Status must be Y or N.'
        currentBalance:
          type: string
          maxLength: 15
          description: >-
            A signed decimal under the tolerant grammar. The rejection reads 'Current Balance is not
            valid'.
        creditLimit:
          type: string
          maxLength: 15
          description: >-
            A signed decimal under the tolerant grammar. The rejection reads 'Credit Limit is not
            valid'.
        cashCreditLimit:
          type: string
          maxLength: 15
          description: A signed decimal under the tolerant grammar.
        openDate:
          type: string
          maxLength: 8
          description: A calendar date, edited by the routine app/cbl/CSUTLDTC.cbl implements.
        expirationDate:
          type: string
          maxLength: 8
          description: A calendar date.
        reissueDate:
          type: string
          maxLength: 8
          description: A calendar date.
        currentCycleCredit:
          type: string
          maxLength: 15
          description: A signed decimal under the tolerant grammar.
        currentCycleDebit:
          type: string
          maxLength: 15
          description: A signed decimal under the tolerant grammar.
        groupId:
          type: string
          maxLength: 10
          description: Printable characters only.

    CustomerDataRequest:
      type: object
      additionalProperties: false
      description: >-
        The submitted customer values. The block is required: an account record names no customer
        and
        this service owns no cross-reference table to resolve one from. A present block has to be
        complete: every component the required list names carries a mandatory-field edit that
        refuses an
        absent value with the same text it refuses a blank one, and no absent component is filled
        from
        the stored row.


        The three Social Security parts are one column, and a cross-field check on this block
        requires
        all three together. A body carrying one part alone leaves the column absent and is refused,
        not
        merged. Each part is numeric and non-zero; app/cbl/COACTUPC.cbl:L121-L123 also excludes 000,
        666
        and 900 through 999 from the first part.


        Six components may be omitted, keeping their stored value. Those are the middle name, the
        second
        address line, both telephone numbers, the government-issued identifier and the date of birth.
        Five of them carry no mandatory edit: the middle name reaches an optional alphabetic edit,
        both
        telephone numbers reach the edit at app/cbl/COACTUPC.cbl:L2225-L2244 whose own comment reads
        'Not mandatory to enter a phone number', and the second address line and the
        government-issued
        identifier reach no edit at all. The date of birth does carry a calendar edit that refuses a
        blank value, and omitting it hands the stored date to that edit rather than a blank.


        customerId carries no edit either. app/cbl/COACTUPC.cbl:L1222 calls it 'actually not
        editable'.
        An absent one is refused with 'Customer Id must be supplied. An account record carries none',
        and one that names a customer other than the row this account resolves to is refused as well.
      required:
        - customerId
        - firstName
        - lastName
        - addressLine1
        - addressCity
        - addressStateCode
        - addressCountryCode
        - addressZip
        - socialSecurityPart1
        - socialSecurityPart2
        - socialSecurityPart3
        - eftAccountId
        - primaryCardHolderIndicator
        - ficoCreditScore
      properties:
        customerId:
          type: string
          pattern: '^[0-9]{9}$'
          description: CUST-ID PIC 9(09). Names the customer row this call updates.
        firstName:
          type: string
          maxLength: 25
          description: Alphabetic and required by edit, from app/cbl/COACTUPC.cbl.
        middleName:
          type: string
          maxLength: 25
          description: Alphabetic and optional by edit.
        lastName:
          type: string
          maxLength: 25
          description: Alphabetic and required by edit.
        addressLine1:
          type: string
          maxLength: 50
          description: Mandatory. The rejection reads 'Address Line 1 must be supplied.'
        addressLine2:
          type: string
          maxLength: 50
          description: Optional. Printable characters only.
        addressCity:
          type: string
          maxLength: 50
          description: Alphabetic and required by edit.
        addressStateCode:
          type: string
          maxLength: 2
          description: Checked against the 56 state codes app/cpy/CSLKPCDY.cpy lists.
        addressCountryCode:
          type: string
          maxLength: 3
          description: Alphabetic and required by edit.
        addressZip:
          type: string
          maxLength: 5
          description: >-
            Checked with the state code against the 240 combinations app/cpy/CSLKPCDY.cpy lists.
        phoneNumber1:
          type: string
          maxLength: 15
          description: >-
            (NNN)NNN-NNNN, left-justified in fifteen characters, as the ruler at
            app/cbl/COACTUPC.cbl:L2227-L2228 draws it. The area code is checked against the 410-code
            general-purpose band at app/cpy/CSLKPCDY.cpy:L521 onward, the one band
            app/cbl/COACTUPC.cbl:L2298 consults. The prefix and the line number are each numeric and
            non-zero. A value shorter than thirteen characters is refused.
        phoneNumber2:
          type: string
          maxLength: 15
          description: Optional, edited the same way when supplied.
        socialSecurityPart1:
          type: string
          maxLength: 3
          description: The area part. Supplied with the other two parts or not at all.
        socialSecurityPart2:
          type: string
          maxLength: 2
          description: The group part.
        socialSecurityPart3:
          type: string
          maxLength: 4
          description: The serial part.
        governmentIssuedId:
          type: string
          maxLength: 20
          description: CUST-GOVT-ISSUED-ID PIC X(20) at app/cpy/CVCUS01Y.cpy:L18.
        dateOfBirth:
          type: string
          maxLength: 8
          description: A calendar date, edited as a date of birth.
        eftAccountId:
          type: string
          maxLength: 10
          description: CUST-EFT-ACCOUNT-ID PIC X(10).
        primaryCardHolderIndicator:
          type: string
          maxLength: 1
          description: CUST-PRI-CARD-HOLDER-IND PIC X(01).
        ficoCreditScore:
          type: string
          maxLength: 3
          description: >-
            Three digits between 300 and 850. The rejection reads
            'FICO Score: should be between 300 and 850', character for character.

    AccountUpdateResponse:
      type: object
      additionalProperties: false
      description: >-
        What an update answered. Two outcomes share status 200 and the message separates them: the
        pair was written, or the submitted pair equalled the fetched pair and nothing changed.


        One message travels, never a list. Every edit of app/cbl/COACTUPC.cbl writes its text only
        while the slot at app/cbl/COACTUPC.cbl:L480 holds spaces and then leaves for its own exit,
        so
        one text survives a pass. A failed edit answers 422 with a problem document instead.
      required: [message]
      properties:
        message:
          type: string
          description: >-
            'Changes committed to database' when both rows were written, or
            'No change detected with respect to values fetched.' from
            app/cbl/COACTUPC.cbl:L1463-L1467 when nothing was.
        account:
          $ref: '#/components/schemas/AccountView'

    CycleCloseResponse:
      type: object
      additionalProperties: false
      description: Both accumulators after the close, which are zero.
      required: [accountId, currentCycleCredit, currentCycleDebit]
      properties:
        accountId:
          type: string
          pattern: '^[0-9]{11}$'
          description: ACCT-ID PIC 9(11), eleven digits, zero padded on the left.
        currentCycleCredit:
          type: string
          pattern: '^-?[0-9]{1,10}\.[0-9]{2}$'
          description: Zero at the two fractional digits PIC S9(10)V99 holds.
        currentCycleDebit:
          type: string
          pattern: '^-?[0-9]{1,10}\.[0-9]{2}$'
          description: Zero at the two fractional digits PIC S9(10)V99 holds.

    ApiProblem:
      type: object
      additionalProperties: false
      description: >-
        The error body of every failed call, as RFC 9457 describes it. One shape covers every
        failure
        of this service, including the 401 and 403 that config/SecurityConfig writes, so a client
        parses one document and not two.


        No member echoes a request value. Nothing carries the rejected value, the path, the query
        string or a header. A Social Security Number sent in the wrong position therefore reaches
        neither the caller nor an access log through this body.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          const: about:blank
          description: >-
            Always about:blank, which RFC 9457 names the default and which means the status code
            carries the semantics.
        title:
          type: string
          enum:
            - Validation failed
            - Not found
            - Conflict
            - Malformed request
            - Internal failure
            - Unauthorized
            - Forbidden
          description: >-
            A short, fixed phrase. Every value comes from a constant of the code and never from
            caller-supplied text.
        status:
          type: integer
          description: The status code of the response.
        detail:
          type: string
          description: Fixed text, naming no identifier and no route.
        messages:
          type: array
          minItems: 1
          items:
            type: string
          description: >-
            One text per failing field, each reproduced character for character from the source
            paragraph that emits it. Omitted when a failure produced no field text, never sent as an
            empty array.
