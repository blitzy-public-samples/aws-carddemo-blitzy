# Manifest of the derived baseline of CRD-COCRDSLC-alternate-03: CCDL entered
# directly, with no COMMAREA and no sign-on, starts COCRDSLC on its own COCRDSL
# screen (GAP-UNC-010). Only unikix can run the scenario, so expected.yaml is
# authored from the source (derived_from: source) and is inferred-not-observed
# (GAP-INF-006, GAP-INF-012). It names no execution_id or execution_fingerprint
# and holds no datasets/*.bin until an eligible UniKix run is imported with
# report.py --import-unikix <execution_id>, which sets capture_platform: unikix,
# the execution_id and the UniKix source_identity, and bumps MINOR for an equal
# decoded outcome or MAJOR for a different one.
#
# source_identity.units are COCRDSLC's COPY closure, as
# harness.inventory_tools.copy_closure resolves it (it brings
# app/cpy-bms/COCRDSL.CPY), plus the BMS source of its map COCRDSL, whose
# INITIAL text FKEYS shows. COCRDSLC CALLs no app/cbl unit, and no sign-on
# program runs. CVACT01Y and CVACT03Y are commented out in COCRDSLC, and DFHAID
# and DFHBMSCA are CICS-supplied and not in the repository.
