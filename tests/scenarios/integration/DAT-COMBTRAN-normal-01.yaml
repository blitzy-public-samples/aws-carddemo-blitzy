# COMBTRAN merges the TRANSACT backup with the system-generated interest
# transactions and reloads the transaction master [app/jcl/COMBTRAN.jcl:19-48]:
# - STEP05R sorts the concatenation of the current TRANSACT-BKUP generation and
#   the current SYSTRAN generation on TRAN-ID (SYMNAMES TRAN-ID,1,16,CH; SORT
#   FIELDS=(TRAN-ID,A)) into a new TRANSACT-COMBINED generation
#   [app/jcl/COMBTRAN.jcl:22-37];
# - STEP10 REPROs that generation into the TRANSACT KSDS [app/jcl/COMBTRAN.jcl:41-48].
# Each input holds three invented transactions whose ids alternate between the
# two inputs, so the output order can only come from the sort, not from the
# concatenation. The SYSTRAN records have the shape CBACT04C gives its interest
# transactions (type 01, category 0005, source System, no merchant)
# [app/cbl/CBACT04C.cbl:473-498]; every card is a repository card of
# app/data/ASCII/cardxref.txt. TRANSACT starts defined and empty, as TRANBKP
# leaves it in the README order [README.md:177-180] (GAP-DOC-015), because a
# REPRO into the loaded KSDS would meet duplicate keys. A precondition of a GDG
# dataset is its current generation, which the job reads as (0), and the sort
# output is the next generation of its base. Neither step changes a byte of a
# record, so TRANSACT-COMBINED and TRANSACT hold the same six records. Expected
# text values are full field width: decoded text keeps its trailing spaces and
# compares exactly. The job uses no clock, so the scenario runs unchanged on
# unikix, whose copy writes the sort output with DCB=(LRECL=350,RECFM=FB) in
# place of DCB=(*.SORTIN) (GAP-DOC-029).
id: DAT-COMBTRAN-normal-01
level: integration
type: normal
description: >-
  COMBTRAN sorts three backed-up transactions and three interest transactions
  by TRAN-ID into a new combined generation of six records and loads them, in
  the same order, into the emptied TRANSACT KSDS; both steps end with RC 0.
inventory_ids:
- INV-DAT-007  # COMBTRAN job
tags: []
gap_ids:
- GAP-STB-005  # IDCAMS REPRO emulated on gnucobol-batch
- GAP-STB-006  # SORT emulated on gnucobol-batch (DFSORT subset, ASCII collating sequence)
- GAP-STB-007  # normal-end CATLG of the new TRANSACT-COMBINED generation applied; its abnormal-termination DELETE recorded, not evaluated
- GAP-STB-009  # GDG generations and cataloguing emulated on gnucobol-batch
- GAP-STB-010  # Berkeley DB indexed files in place of the VSAM KSDS
- GAP-DOC-029  # the UniKix copy's sort output DCB differs from DCB=(*.SORTIN)
preconditions:
  datasets:
    # The backup is the unload of the TRANSACT KSDS, so its records are in key order.
    TRANSACT-BKUP:
      records:
      - TRAN-ID: '9000000000000001'
