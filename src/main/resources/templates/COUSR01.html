<!DOCTYPE html>
<!--
  ~ AWS CardDemo - "Add User" screen (server-rendered Thymeleaf).
  ~
  ~ Origin (read-only, for traceability):
  ~   legacy/bms/COUSR01.bms       (BMS mapset COUSR01, map COUSR1A, 24x80)
  ~   legacy/cpy-bms/COUSR01.CPY   (symbolic map COUSR1AI / COUSR1AO)
  ~
  ~ Rendered by com.aws.carddemo.web.controller.UserAdminController (add path;
  ~ CICS transaction CU01 -> program COUSR01C). View name "COUSR01".
  ~ Backing bean: com.aws.carddemo.dto.screen.COUSR01Form (model attribute "form").
  ~ Routes: GET /admin/users/add (display), POST /admin/users/add (submit).
  ~
  ~ This template reproduces the legacy 3270/BMS field/label/color/PF-key contract
  ~ one-for-one on a fixed 24-row x 80-column monospace grid. No i18n (literal
  ~ English labels, matching the BMS INITIAL text verbatim), no JavaScript, no
  ~ external assets - all styling is self-contained in the <style> block below plus
  ~ per-element absolute-position inline styles.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/bms-palette :: palette}"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add User</title>
    <style>
        /* ---- Base reset -------------------------------------------------- */
        *, *::before, *::after { box-sizing: border-box; }

        html { background: #000000; }

        body {
            margin: 0;
            background: #000000;
            color: #ffffff;
            font-family: "Courier New", Consolas, "Liberation Mono", monospace;
        }

        /* Terminal frame: sized to content, centered; provides the black
           3270-style bezel around the 80-column screen. */
        .terminal {
            width: -moz-fit-content;
            width: fit-content;
            margin: 1.5rem auto;
            padding: 1rem 1.25rem;
            background: #000000;
            border: 1px solid #333333;
        }

        /* The screen is the coordinate origin: a fixed 80ch x 24-line grid.
           Every child is absolutely positioned at left=(col-1)ch and
           top=(row-1)*1.25em so that 1 character == 1 grid cell. */
        .screen {
            position: relative;
            width: 80ch;
            height: 30em;              /* 24 rows * 1.25em */
            font-size: 1rem;
            line-height: 1.25;
            font-family: inherit;
        }

        /* Positioned text cell. white-space:pre preserves the fixed-width
           spacing of every BMS literal and bound value. */
        .f {
            position: absolute;
            margin: 0;
            padding: 0;
            white-space: pre;
        }

        /* ---- BMS color map (COLOR=... -> hex) ---------------------------- */
        .blue      { color: var(--bms-blue); }   /* BLUE      */
        .yellow    { color: var(--bms-yellow); }   /* YELLOW    */
        .turquoise { color: var(--bms-turquoise); }   /* TURQUOISE */
        .green     { color: var(--bms-green); }   /* GREEN     */
        .red       { color: var(--bms-red); }   /* RED       */
        .neutral   { color: var(--bms-neutral); }   /* NEUTRAL   */
        .bright    { font-weight: bold; } /* ATTRB=BRT */

        /* ---- Unprotected entry fields (BMS UNPROT + HILIGHT=UNDERLINE) --- */
        .inp {
            position: absolute;
            margin: 0;
            padding: 0;
            font-family: inherit;
            font-size: 1em;
            line-height: 1.25;
            height: 1.25em;
            color: var(--bms-green);                 /* GREEN input text */
            background: transparent;
            border: 0;
            border-bottom: 1px solid #00CD00; /* UNDERLINE hilight */
            caret-color: var(--bms-green);
            white-space: pre;
        }
        .inp:focus-visible {
            outline: 1px dotted #00CD00;
            outline-offset: 1px;
        }

        /* ---- PF-key legend rendered as clickable submit buttons ---------- */
        .legend {
            white-space: nowrap;
            color: var(--bms-yellow);                 /* YELLOW legend */
        }
        .legend button {
            font-family: inherit;
            font-size: 1em;
            line-height: 1.25;
            color: inherit;                 /* inherit YELLOW */
            background: transparent;
            border: 0;
            padding: 0;
            margin: 0;
            cursor: pointer;
        }
        .legend button:focus-visible { outline: 1px dotted #CCCC00; }
        .legend button:active { text-decoration: underline; filter: brightness(1.3); }
        @media (hover: hover) {
            .legend button:hover { text-decoration: underline; }
        }

        /* ---- Screen-reader-only landmark heading (zero visual impact) ---- */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
<main class="terminal">
    <!-- Screen-reader landmark; sighted users see the BMS 'Add User' title span (row 4). -->
    <h1 class="visually-hidden">Add User</h1>

    <!--
      CSRF-protected form. th:action triggers Spring Security's
      CsrfRequestDataValueProcessor, which injects the hidden _csrf token; a plain
      action= would NOT. The controller reads the pressed PF key from the "pfkey"
      request parameter emitted by the submit buttons in the legend (row 24).
    -->
    <form class="screen" th:object="${form}" th:action="@{/admin/users/add}" method="post">

        <!-- ======================= Header line 1 (row 1) ======================= -->
        <span class="f blue"   style="top:0em;    left:0ch;">Tran:</span>
        <span class="f blue"   style="top:0em;    left:6ch;"  th:text="*{trnname}">CU01</span>
        <span class="f yellow" style="top:0em;    left:20ch;" th:text="*{title01}">AWS Mainframe Modernization</span>
        <span class="f blue"   style="top:0em;    left:64ch;">Date:</span>
        <span class="f blue"   style="top:0em;    left:70ch;" th:text="*{curdate}">mm/dd/yy</span>

        <!-- ======================= Header line 2 (row 2) ======================= -->
        <span class="f blue"   style="top:1.25em; left:0ch;">Prog:</span>
        <span class="f blue"   style="top:1.25em; left:6ch;"  th:text="*{pgmname}">COUSR01C</span>
        <span class="f yellow" style="top:1.25em; left:20ch;" th:text="*{title02}">CardDemo</span>
        <span class="f blue"   style="top:1.25em; left:64ch;">Time:</span>
        <span class="f blue"   style="top:1.25em; left:70ch;" th:text="*{curtime}">hh:mm:ss</span>

        <!-- ========================= Screen title (row 4) ====================== -->
        <span class="f neutral bright" style="top:3.75em; left:34ch;">Add User</span>

        <!-- ============================ Body (row 8) =========================== -->
        <label class="f turquoise" style="top:8.75em; left:5ch;"  for="fname">First Name:</label>
        <input class="inp green" style="top:8.75em; left:17ch; width:20ch;"
               type="text" id="fname" th:field="*{fname}" maxlength="20"
               autofocus autocomplete="off" autocapitalize="off" spellcheck="false">

        <label class="f turquoise" style="top:8.75em; left:44ch;" for="lname">Last Name:</label>
        <input class="inp green" style="top:8.75em; left:55ch; width:20ch;"
               type="text" id="lname" th:field="*{lname}" maxlength="20"
               autocomplete="off" autocapitalize="off" spellcheck="false">

        <!-- ============================ Body (row 11) ========================== -->
        <label class="f turquoise" style="top:12.5em; left:5ch;"  for="userid">User ID:</label>
        <input class="inp green" style="top:12.5em; left:14ch; width:8ch;"
               type="text" id="userid" th:field="*{userid}" maxlength="8"
               aria-describedby="userid-hint"
               autocomplete="off" autocapitalize="off" spellcheck="false">
        <span class="f blue" id="userid-hint" style="top:12.5em; left:23ch;">(8 Char)</span>

        <label class="f turquoise" style="top:12.5em; left:44ch;" for="passwd">Password:</label>
        <!-- BMS PASSWD is ATTRB=(DRK,...) (non-display) -> HTML type="password" mask. -->
        <input class="inp green" style="top:12.5em; left:54ch; width:8ch;"
               type="password" id="passwd" th:field="*{passwd}" maxlength="8"
               aria-describedby="passwd-hint"
               autocomplete="new-password" autocapitalize="off" spellcheck="false">
        <span class="f blue" id="passwd-hint" style="top:12.5em; left:63ch;">(8 Char)</span>

        <!-- ============================ Body (row 14) ========================== -->
        <label class="f turquoise" style="top:16.25em; left:5ch;" for="usrtype">User Type: </label>
        <input class="inp green" style="top:16.25em; left:16ch; width:1ch;"
               type="text" id="usrtype" th:field="*{usrtype}" maxlength="1"
               aria-describedby="usrtype-hint"
               autocomplete="off" autocapitalize="characters" spellcheck="false">
        <span class="f blue" id="usrtype-hint" style="top:16.25em; left:18ch;">(A=Admin, U=User)</span>

        <!-- ===================== Error message line (row 23) =================== -->
        <div class="f red bright" style="top:27.5em; left:0ch; width:78ch;"
             role="alert"
             th:if="${!#strings.isEmpty(form.errmsg)}"
             th:text="*{errmsg}">Error message goes here</div>

        <!-- ======================= PF-key legend (row 24) ====================== -->
        <!--
          Verbatim BMS legend "ENTER=Add User  F3=Back  F4=Clear  F12=Exit" (43 chars,
          two spaces between items) rendered as clickable submit buttons. The ENTER
          button is first in document order, so pressing Enter in any field submits
          with pfkey=ENTER (browser implicit submission). Two &#160; between buttons
          reproduce the two-space BMS separators on the monospace grid.
        -->
        <div class="f legend" style="top:28.75em; left:0ch;"><button type="submit" name="pfkey" value="ENTER">ENTER=Add User</button>&#160;&#160;<button type="submit" name="pfkey" value="PF3">F3=Back</button>&#160;&#160;<button type="submit" name="pfkey" value="PF4">F4=Clear</button>&#160;&#160;<button type="submit" name="pfkey" value="PF12">F12=Exit</button></div>

    </form>
</main>
</body>
</html>
