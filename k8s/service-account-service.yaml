---
# =============================================================================
# k8s/service-account-service.yaml
# -----------------------------------------------------------------------------
# :purpose: Publish the CardDemo **account-service** Deployment
#           (deployment-account-service.yaml) behind a stable cluster-internal
#           virtual IP and the DNS name ``account-service`` so peer services and
#           the API gateway reach the account REST endpoints
#           (``GET /accounts/{id}`` = CICS ``CAVW``; ``PUT /accounts/{id}`` =
#           CICS ``CAUP``) via
#           ``ACCOUNT_SERVICE_URI=http://account-service:8080`` supplied by the
#           ``carddemo-config`` ConfigMap (AAP 0.3.1, 0.4.2).
# :output:  A ClusterIP Service named ``account-service`` reachable in-cluster at
#           ``account-service:8080`` that load-balances TCP traffic on port 8080
#           to every Ready pod carrying the ``app: account-service`` label.
# :notes:   Type ClusterIP keeps the service internal only — account data is
#           reached exclusively through the api-gateway, and the cluster
#           NetworkPolicy admits gateway-to-backend traffic on port 8080. The
#           ``app: account-service`` selector is a subset of the Deployment
#           pod-template labels, so it resolves exactly the account-service pods;
#           ``targetPort: 8080`` matches the container's named ``http`` port.
#           Endpoints populate only after a pod passes its Actuator
#           ``/actuator/health/readiness`` probe. The name/port pair is a frozen
#           contract shared with ``ACCOUNT_SERVICE_URI`` and the api-gateway
#           route (AAP 0.7.2 spec-literal fidelity).
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: account-service
  labels:
    app: account-service
    app.kubernetes.io/name: account-service
    app.kubernetes.io/part-of: carddemo
    app.kubernetes.io/component: backend
spec:
  # ClusterIP keeps account-service reachable only from inside the cluster;
  # external callers must route through the api-gateway, never this Service.
  type: ClusterIP
  # Selects the account-service Deployment pods (their pod template carries
  # app: account-service, matching deployment-account-service.yaml).
  selector:
    app: account-service
  ports:
    # Named port 'http' permits by-name references; service port 8080 forwards
    # to targetPort 8080, the container's 'http' port
    # (deployment-account-service.yaml).
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
