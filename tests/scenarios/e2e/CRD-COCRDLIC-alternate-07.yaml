# COCRDLIC list selection S: ENTER with 'S' on a card row transfers control
# (XCTL) to the card detail program COCRDSLC with that row's account and card
# [app/cbl/COCRDLIC.cbl:515-541].
#
# Steps 1-2 reach the card list as MNU-COMEN01C-alternate-03 does. Entered from
# the menu, COCRDLIC starts afresh and reads forward on CARDDAT from the lowest
# key [app/cbl/COCRDLIC.cbl:336-342,572-582,1123-1260]. 9500-FILTER-RECORDS
# filters only on the account and card filters of the screen, both blank here,
# so every card is listed whatever the user type [app/cbl/COCRDLIC.cbl:1382-1407].
# CARDDAT is keyed by card number (digits only, so the order is the same in
# ASCII and EBCDIC): row 1 is record 1 of app/data/ASCII/carddata.txt, card
# 0500024453765740 of account 00000000050, status Y. The fixture holds 50 cards,
# so the eighth READNEXT finds a next page and 1400-SETUP-MESSAGE shows
# 'TYPE S FOR DETAIL, U TO UPDATE ANY RECORD' with a blank error line
# [app/cbl/COCRDLIC.cbl:895-930].
#
# Step 3 runs under CCLI, the TRANSID COCRDLIC returned with; COMMON-RETURN set
# CDEMO-FROM-PROGRAM to COCRDLIC and saved WS-THIS-PROGCOMMAREA, whose
# WS-SCREEN-DATA holds the rows shown [app/cbl/COCRDLIC.cbl:229-261,604-620].
# The COMMAREA comes back from COCRDLIC itself, so the rows are restored, the
# map is received and 2250-EDIT-ARRAY counts one 'S' and sets I-SELECTED to 1
# [app/cbl/COCRDLIC.cbl:326-331,357-362,962-979,1073-1120]. ENTER with
# VIEW-REQUESTED-ON(1) moves WS-ROW-ACCTNO(1) to CDEMO-ACCT-ID and
# WS-ROW-CARD-NUM(1) to CDEMO-CARD-NUM, and XCTLs to COCRDSLC with
# CDEMO-PGM-ENTER set [app/cbl/COCRDLIC.cbl:515-541].
#
# COCRDSLC takes the list-screen path (CDEMO-PGM-ENTER and CDEMO-FROM-PROGRAM =
# COCRDLIC): it reads CARDDAT by the card number, finds it, and sets
# FOUND-CARDS-FOR-ACCOUNT [app/cbl/COCRDSLC.cbl:268-278,339-348,736-773]. It reads
# no other file. 1200-SETUP-SCREEN-VARS shows the passed account and card, the
# embossed name (X(50)), the month and year of CARD-EXPIRAION-DATE 2023-03-09, the
# active status, the info message '   Displaying requested details' (X(40)) and
# a blank WS-RETURN-MSG in the 80-character ERRMSG [app/cbl/COCRDSLC.cbl:129-130,
# 427-497]. Screen fields are compared at their full BMS length, trailing spaces
# included; CURDATE and CURTIME come from the region clock, so they are matchers.
id: CRD-COCRDLIC-alternate-07
level: e2e
type: alternate
description: >-
  USER0001 signs on, selects main-menu option 3 (Credit Card List) and, on the
  COCRDLIC list (CCLI), enters S beside row 1, card 0500024453765740 of account
  00000000050. COCRDLIC transfers control to COCRDSLC with that account and
  card, and the card detail screen COCRDSL (TRNNAME CCDL) shows them with the
  embossed name Aniya Von, active status Y, expiry 03/2023, the 'Displaying
  requested details' information message and no error.
# Primary item first, then the program, the maps asserted, the transaction step
# 3 enters, the CSD file read, and the online-only copybooks COCRDLIC copies.
# Sign-on and the menu (CC00, CM00, COSGN00, USRSEC) are verified by the SEC and
# MNU scenarios; the batch record copybooks and the data files are verified at
# the lowest level that executes them. CCDL is only the TRANSID COCRDSLC returns
# with; no step starts it.
inventory_ids:
- INV-CRD-022  # COCRDLIC list selection S (navigation to COCRDSLC)
- INV-CRD-001  # COCRDLIC program
- INV-MNU-003  # COMEN01 map, where option 3 is entered
- INV-CRD-004  # COCRDLI map, the card list where S is entered
- INV-CRD-005  # COCRDSL map, the card detail screen reached by the XCTL
- INV-CFG-014  # CCLI transaction, which runs the selection
- INV-CFG-003  # CARDDAT CSD file: browsed by COCRDLIC, read by COCRDSLC
- INV-LAY-002  # COCOM01Y: CDEMO-ACCT-ID and CDEMO-CARD-NUM passed on the XCTL
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y, copied by COCRDLIC
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-019  # CVCRD01Y: CCARD-AID, CCARD-NEXT-PROG and CC-ACCT-ID/CC-CARD-NUM
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-006  # CRD end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    CARDDATA: {base: CARDDATA}
    CARDXREF: {base: CARDXREF}
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '3'
  - aid: ENTER
    '@map': COCRDLI
    fields:
      CRDSEL1: S
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
  - '@map': COCRDLI
    TRNNAME: CCLI
    PGMNAME: COCRDLIC
    ACCTNO1: '00000000050'
    CRDNUM1: '0500024453765740'
    CRDSTS1: 'Y'
    INFOMSG: 'TYPE S FOR DETAIL, U TO UPDATE ANY RECORD    '
    ERRMSG: '                                                                              '
  - '@map': COCRDSL
    TRNNAME: CCDL
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COCRDSLC
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ACCTSID: '00000000050'
    CARDSID: '0500024453765740'
    CRDNAME: 'Aniya Von                                         '
    CRDSTCD: 'Y'
    EXPMON: '03'
    EXPYEAR: '2023'
    INFOMSG: '   Displaying requested details         '
    ERRMSG: '                                                                                '
