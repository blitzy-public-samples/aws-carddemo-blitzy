  layout: CVTRA05Y/TRAN-RECORD
  cross_check: none
  registered_mismatches: []
  data_items:
  - app/data/EBCDIC/AWS.M2.CARDDEMO.DALYTRAN.PS.INIT
  region_files: []
  gap_ids: [GAP-DOC-018]

