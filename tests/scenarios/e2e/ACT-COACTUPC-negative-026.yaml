    OPNDAY: '20'
    ACRDLIM: '12AB.00        '
    EXPYEAR: '2025'
    EXPMON: '05'
    EXPDAY: '20'
    ACSHLIM: '+      1,020.00'
    RISYEAR: '2025'
    RISMON: '05'
    RISDAY: '20'
    ACURBAL: '+        194.00'
    ACRCYCR: '+           .00'
    AADDGRP: '          '
    ACRCYDB: '+           .00'
    ACSTNUM: '000000001'
    ACTSSN1: '123'
