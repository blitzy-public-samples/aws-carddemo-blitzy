# Deployment and Service for the ledger posting service, one of the platform's
# three independent event consumers. The service consumes transaction.authorized
# in consumer group ledger-posting, applies the posting arithmetic of
# app/cbl/CBTRN02C.cbl, and publishes transaction.posted. It calls no other
# service.
#
# The listener, the posting arithmetic and the outbox relay this manifest
# configures are planned and unauthored, so the container starts and answers
# /actuator alone.
#
# Rationale for every choice in this folder: card-platform/docs/decision-log.md (planned)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-posting-service
  namespace: carddemo
  labels:
    app.kubernetes.io/name: ledger-posting-service
    app.kubernetes.io/component: ledger-posting
    app.kubernetes.io/part-of: card-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-posting-service
      app.kubernetes.io/part-of: card-platform
  template:
    metadata:
      labels:
        # The name below is what the network policies in 10-kafka.yaml and
        # 20-postgres.yaml admit. Both name the six services individually rather
        # than matching the part-of label, so a Pod that merely belongs to this
        # platform reaches neither the broker nor the database.
        app.kubernetes.io/name: ledger-posting-service
        app.kubernetes.io/component: ledger-posting
        app.kubernetes.io/part-of: card-platform
    spec:
      automountServiceAccountToken: false
      # Account 10001 owns /app in the image. 00-namespace.yaml refuses root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # The mounted keystore, truststore and certificate authority arrive owned
        # by root. fsGroup gives group 10001 read access to those three files.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ledger-posting-service
          # Built from card-platform/services/ledger-posting-service/Dockerfile,
          # and pinned by digest as every other image in this folder is.
          #
          # The digest below is a placeholder, so an unedited apply leaves the Pod in
          # InvalidImageName. A local build carries no digest until it is pushed.
          # Build the image, push it, then substitute the digest the registry reports.
          image: carddemo/ledger-posting-service:1.0.0@sha256:REPLACE-WITH-THE-64-HEX-CHARACTER-DIGEST-OF-THE-IMAGE-YOU-PUSHED
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # The image writes nothing under / after start, and the Dockerfile pins
            # TMPDIR and java.io.tmpdir to /tmp. The tmp volume below is the one
            # writable path.
            readOnlyRootFilesystem: true
          ports:
            # 8080 carries the Representational State Transfer (REST) surface, and
            # the Service below targets it. 9080 carries /actuator and matches
            # MANAGEMENT_PORT in 30-configmap.yaml. No Service exposes 9080.
            # 30-configmap.yaml encrypts both ports through SERVER_SSL_ENABLED and
            # MANAGEMENT_SSL_ENABLED.
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9080
          envFrom:
            # Broker address, topic names, consumer groups, log levels, the three
            # request-identity usernames, and the transport settings. No credential
            # appears in that ConfigMap.
            - configMapRef:
                name: carddemo-config
            # This service's own two credentials: the password of its database login
            # and the password of its broker identity. Two keys, and no other service
            # reads that Secret.
            - secretRef:
                name: carddemo-ledger-secret
            # The three request-identity password hashes, shared by all six services.
            - secretRef:
                name: carddemo-identity-secret
          env:
            # The schema and the login this service owns. envFrom above pulls the
            # whole ConfigMap, so the six services hold distinct key names and each
            # Deployment binds the five keys it owns.
            - name: SPRING_FLYWAY_SCHEMAS
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: LEDGER_DB_SCHEMA
            - name: SPRING_FLYWAY_DEFAULT_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: LEDGER_DB_SCHEMA
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: LEDGER_DB_SCHEMA
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: LEDGER_DB_USER
            # The datasource address this service owns, assembled here rather than
            # shared. $(VAR) expansion reads this env list alone, so the five values
            # below are declared here as well as pulled by envFrom. 30-configmap.yaml
            # carries a SPRING_DATASOURCE_OPTIONS suffix and no database name, so each
            # Deployment names the one database it owns.
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: POSTGRES_PORT
            - name: LEDGER_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: LEDGER_DB_NAME
            - name: LEDGER_DB_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: LEDGER_DB_SCHEMA
            - name: SPRING_DATASOURCE_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: SPRING_DATASOURCE_OPTIONS
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/$(LEDGER_DB_NAME)?currentSchema=$(LEDGER_DB_SCHEMA)&$(SPRING_DATASOURCE_OPTIONS)"
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: LEDGER_KAFKA_USER
            # Consumes transaction.authorized in consumer group ledger-posting. Each
            # consumer group holds its own read position, so the four groups
            # 30-configmap.yaml declares advance independently. 10-kafka.yaml grants
            # this broker identity that one group and no other.
            - name: SPRING_KAFKA_CONSUMER_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: GROUP_LEDGER_POSTING
            # The two passwords that open the mounted transport material, both keys of
            # carddemo-tls-secret. That Secret also carries keys whose names are file
            # names, and a file name is not a valid environment variable name, so
            # envFrom cannot pull it.
            - name: SERVER_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carddemo-tls-secret
                  key: SERVER_SSL_KEYSTORE_PASSWORD
            - name: SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carddemo-tls-secret
                  key: KAFKA_SSL_TRUSTSTORE_PASSWORD
          # Both probes read /actuator/health on the management port over HTTPS, which
          # 30-configmap.yaml encrypts. Port 8080 answers no management request.
          # Readiness allows time for the Flyway migration this service runs at startup,
          # and that migration creates eight tables. The kubelet does not verify the
          # certificate a probe is presented.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # The liveness group reports process state and excludes every external
          # dependency. A database or broker outage withdraws this Pod from its
          # Service and restarts no healthy process.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
              scheme: HTTPS
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          # The image caps the heap at 75 percent of the limit below.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            # The one writable path, an in-memory volume capped at 64 mebibytes.
            # card-platform/docker-compose.yml mounts a tmpfs of the same size at the
            # same place.
            - name: tmp
              mountPath: /tmp
            # Keystore, truststore and certificate authority, read-only. The keystore
            # is what this service presents on both ports. The truststore verifies the
            # broker, and the authority verifies the database server under
            # sslmode=verify-full.
            - name: transport-security
              mountPath: /etc/carddemo/tls
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: transport-security
          secret:
            secretName: carddemo-tls-secret
            defaultMode: 0640
            items:
              - key: keystore.p12
                path: keystore.p12
              - key: truststore.p12
                path: truststore.p12
              - key: ca.crt
                path: ca.crt
---
# Pods reach the service at ledger-posting-service:8080, a short name the Domain
# Name System (DNS) resolves. Nothing outside the cluster reaches it.
apiVersion: v1
kind: Service
metadata:
  name: ledger-posting-service
  namespace: carddemo
  labels:
    app.kubernetes.io/name: ledger-posting-service
    app.kubernetes.io/component: ledger-posting
    app.kubernetes.io/part-of: card-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ledger-posting-service
    app.kubernetes.io/part-of: card-platform
  ports:
    # 8080 alone. A monitoring collector reaches 9080 by Pod address.
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
