# Manifest of the derived baseline of TRN-COTRN00C-alternate-03: the
# transaction-list search from 9999999999999999 makes STARTBR return NOTFND, and
# COTRN00C sends 'You are at the top of the page...'. Only unikix can run the
# scenario, so expected.yaml was authored from app/cbl/COTRN00C.cbl, not
# captured, and is inferred-not-observed (GAP-INF-007, GAP-INF-012). It names
# no execution_id or execution_fingerprint and holds no datasets/ until an
# eligible UniKix run is imported with report.py --import-unikix.
#
# source_identity.units are COTRN00C's COPY closure, as
# harness.inventory_tools.copy_closure resolves it (the symbolic map COTRN00
# included), plus the BMS source of its map COTRN00. The sign-on and main-menu
# steps only reach the list screen, whose content their own scenarios pin, so
# COSGN00C and COMEN01C are not listed. DFHAID and DFHBMSCA are CICS-supplied
# and not in the repository. source_commit is HEAD at authoring; app/ is
# byte-identical to the suite's starting commit.
