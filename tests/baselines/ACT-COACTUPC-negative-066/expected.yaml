# Derived baseline of scenario ACT-COACTUPC-negative-066 (capture_platform:
# derived): authored from the app/ source, never observed, since no TPE region
# runs in CI. Open until a UniKix run of the app/ build is imported
# (GAP-INF-005, GAP-INF-012).
# Steps 1-3: USER0001 signs on, option 2 XCTLs to COACTUPC, and ENTER with
# account 00000000001 shows the fetched account and customer with the change
# prompt [app/cbl/COACTUPC.cbl:2787-2865,2955-2981].
# Step 4: 4X over ACTSSN2 is a change, so 1200-EDIT-MAP-INPUTS sets
# ACUP-CHANGES-NOT-OK and edits the fields in order; the account fields and
# SSN part 1 (123) pass, then 1265-EDIT-US-SSN edits part 2 through
# 1245-EDIT-NUM-REQD, which finds 4X supplied but not NUMERIC and, the message
# being still off, composes TRIM('SSN 4th & 5th chars') ' must be all
# numeric.' (40 characters) into WS-RETURN-MSG; no later edit can replace it
# [app/cbl/COACTUPC.cbl:1460-1531,2109-2152,2439-2475].
# 2000-DECIDE-ACTION continues, so nothing is read for update or rewritten;
# 3203 re-shows the received values with ACTSSN2 as typed, 3250 sets
# PROMPT-FOR-CHANGES and moves the message to ERRMSG, and 3390 brightens FKEY12
# while FKEY05 stays dark [app/cbl/COACTUPC.cbl:2596-2597,2870-2982,3566-3581].
# This pins the app/ text: the UniKix COACTUPC drops the TRIM, so its copy
# would show the field name padded to 25 bytes before the suffix
# (GAP-DOC-022); such a record is UniKix-copy behavior and never replaces this
# file.
# Screen values are full BMS width with trailing spaces kept (ERRMSG 78,
# INFOMSG 45), because screens compare exactly. CURDATE and CURTIME come from
# the region clock, so they are matchers. file_state holds the records as the
# preconditions materialize them, decoded through CVACT01Y and CVCUS01Y.
file_state:
  ACCTDATA:
    contains:
    - ACCT-ACTIVE-STATUS: Y
      ACCT-CASH-CREDIT-LIMIT: '1020.00'
      ACCT-CREDIT-LIMIT: '2020.00'
      ACCT-CURR-BAL: '194.00'
      ACCT-CURR-CYC-CREDIT: '0.00'
      ACCT-CURR-CYC-DEBIT: '0.00'
      ACCT-EXPIRAION-DATE: '2025-05-20'
      ACCT-GROUP-ID: '          '
      ACCT-ID: '1'
      ACCT-OPEN-DATE: '2014-11-20'
      ACCT-REISSUE-DATE: '2025-05-20'
    count: 50
  CUSTDATA:
    contains:
    - CUST-ADDR-COUNTRY-CD: USA
      CUST-ADDR-LINE-1: '100 Test Street                                   '
      CUST-ADDR-LINE-2: 'Suite 1                                           '
      CUST-ADDR-LINE-3: 'Raleigh                                           '
      CUST-ADDR-STATE-CD: NC
      CUST-ADDR-ZIP: '27601     '
      CUST-DOB-YYYY-MM-DD: '1961-06-08'
      CUST-EFT-ACCOUNT-ID: 0053581756
      CUST-FICO-CREDIT-SCORE: '700'
      CUST-FIRST-NAME: 'Testfirst                '
      CUST-GOVT-ISSUED-ID: 'TESTGOVT0001        '
      CUST-ID: '1'
      CUST-LAST-NAME: 'Testlast                 '
      CUST-MIDDLE-NAME: 'Testmiddle               '
      CUST-PHONE-NUM-1: '(919)555-0101  '
      CUST-PHONE-NUM-2: '(919)555-0102  '
      CUST-PRI-CARD-HOLDER-IND: Y
      CUST-SSN: '123456789'
    count: 50
