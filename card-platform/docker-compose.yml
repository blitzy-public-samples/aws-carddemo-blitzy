# =============================================================================
# card-platform — local demo environment
# =============================================================================
# Provisioned during environment setup as the INFRASTRUCTURE BASELINE for the
# modernized CardDemo platform (AAP 0.3.1 / 0.4.1).
#
# Contents today:  Kafka 4.2.1 (KRaft, single node) + PostgreSQL 18.4 with one
#                  private database per service.
# Still to be added by the service implementation work: one container block per
#                  service (authorization, ledger-posting, fraud-detection,
#                  notification, account, card), each built from
#                  services/<name>/Dockerfile and wired to the two backing
#                  services below via the `card-platform` network.
#
# Image tags are pinned deliberately:
#   * apache/kafka:4.2.1 matches org.apache.kafka:kafka-clients:4.2.1 exactly,
#     which removes a whole class of client/broker mismatch failure (AAP 0.5.1).
#   * postgres:18.4 is the pinned database image (no pre-release tags).
#
# ---------------------------------------------------------------------------
# Parallel / multi-clone use
# ---------------------------------------------------------------------------
# Every host port and the compose project name are parameterized by CLONE_INDEX
# so several checkouts can run their own isolated stack side by side:
#
#   CLONE_INDEX=1 POSTGRES_PORT=55433 KAFKA_PORT=59093 docker compose up -d
#
# With CLONE_INDEX unset the stack uses the default project name and ports.
# =============================================================================

name: card-platform${CLONE_INDEX:-}

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 18.4 — one private database per service (AAP 0.3.1 "Per-Service
  # Data Ownership"). No table is shared; each service reaches only its own
  # database. Flyway (12.4.0) owns every schema object, so no DDL lives here
  # beyond the empty databases themselves.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18.4
    container_name: card-platform${CLONE_INDEX:-}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carddemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carddemo}
      POSTGRES_DB: ${POSTGRES_DB:-carddemo}
      # Demo-only: keeps psql/JDBC connections simple. Do not reuse in production.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    configs:
      - source: init_databases
        target: /docker-entrypoint-initdb.d/00-create-service-databases.sql
    volumes:
      # PostgreSQL 18+ images store data under a major-version subdirectory, so
      # the volume MUST be mounted at /var/lib/postgresql, not at
      # /var/lib/postgresql/data. Mounting the old 17-and-earlier path makes the
      # container exit 1 on start with "in 18+, these Docker images are
      # configured to store database data in a format which is compatible with
      # pg_ctlcluster".
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carddemo} -d ${POSTGRES_DB:-carddemo}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - card-platform
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Apache Kafka 4.2.1 in KRaft mode (no ZooKeeper). Single broker is sufficient
  # for the demo; replication factors are therefore 1.
  #
  # Two client listeners on purpose:
  #   INTERNAL  kafka:29092   — used by service containers on this network
  #   EXTERNAL  localhost:9092 — used by host tooling (console consumer, tests,
  #                              services started outside Docker)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.2.1
    container_name: card-platform${CLONE_INDEX:-}-kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-cardDemoPlatformKRaft1}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks:
      - card-platform
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # One-shot topic creation. Runs after the broker reports healthy, creates the
  # event topics plus their dead-letter counterparts, then exits.
  # Partition count is 3 and the message key is always the account id, so all
  # events for one account stay on one partition and stay ordered (AAP 0.3.1).
  # ---------------------------------------------------------------------------
  kafka-topics-init:
    image: apache/kafka:4.2.1
    container_name: card-platform${CLONE_INDEX:-}-kafka-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        B=kafka:29092
        for t in transaction.authorized transaction.declined transaction.posted \
                 fraud.assessed transaction.authorized.DLT transaction.posted.DLT \
                 fraud.assessed.DLT; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$B" --create --if-not-exists \
            --topic "$$t" --partitions 3 --replication-factor 1
        done
        echo "--- topics ---"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$B" --list
    networks:
      - card-platform
    restart: "no"

configs:

  # Six private databases, one per service. Kept inline so the whole demo
  # environment is a single file with no local file dependencies.
  init_databases:
    content: |
      CREATE DATABASE carddemo_authorization;
      CREATE DATABASE carddemo_ledger;
      CREATE DATABASE carddemo_fraud;
      CREATE DATABASE carddemo_notification;
      CREATE DATABASE carddemo_account;
      CREATE DATABASE carddemo_card;

volumes:
  postgres-data:
  kafka-data:

networks:
  card-platform:
    driver: bridge
