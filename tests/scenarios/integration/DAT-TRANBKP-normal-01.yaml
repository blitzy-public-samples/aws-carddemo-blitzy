# TRANBKP backs the posted-transaction master up and resets it, in three steps
# run against one catalog [app/jcl/TRANBKP.jcl:23-68]:
# - STEP05R runs procedure REPROC, whose only step PRC001 is IDCAMS reading the
#   control card REPROCT, one REPRO from the step's input DD to its output DD;
#   the job points the input at the TRANSACT cluster and the output at a new
#   TRANSACT-BKUP generation [app/proc/REPROC.prc:21-28] [app/ctl/REPROCT.ctl:15],
#   so every record is copied to the backup in key order;
# - STEP05 deletes the cluster and then its alternate index, each DELETE
#   followed by 'IF MAXCC LE 08 THEN SET MAXCC = 0' [app/jcl/TRANBKP.jcl:37-46];
# - STEP10 defines the cluster again, empty, with KEYS(16 0) and
#   RECORDSIZE(350 350) [app/jcl/TRANBKP.jcl:51-68].
# TRANSACT starts as the 300 repository daily transactions loaded by TRAN-ID:
# the DALYTRAN-RECORD and TRAN-RECORD images are both 350 bytes with the id in
# bytes 1-16 [app/cpy/CVTRA06Y.cpy:2-5] [app/cpy/CVTRA05Y.cpy:2-5], and
# dailytran.txt is already in TRAN-ID order.
# The gnucobol-batch starting catalog defines no alternate index for TRANSACT,
# so the second DELETE ends with condition code 8 and the MAXCC reset leaves
# STEP05 at RC 0; a unikix catalog that lists more entries diverges from the
# @CATALOG pinned here, and that divergence is registered, never adjusted. The
# COND=(4,LT) of STEP10 is a JCL-semantics item verified only on unikix
# (DAT-TRANBKP-recovery-01), so it is not listed here. Values are those
# observed on gnucobol-batch.
id: DAT-TRANBKP-normal-01
level: integration
type: normal
description: >-
  TRANBKP copies the 300 transactions of the TRANSACT cluster, in TRAN-ID order and
  byte for byte, to a new TRANSACT-BKUP generation through REPROC and its REPRO
  control card REPROCT, then deletes the cluster and defines it again empty; every
  step and the job end with return code 0, and the catalog holds the backup
  generation and the redefined cluster, with no alternate index.
inventory_ids:
- INV-DAT-020  # TRANBKP job
- INV-DAT-026  # REPROC proc, run by STEP05R
- INV-DAT-027  # REPROCT control card, the SYSIN of REPROC step PRC001
tags: []
gap_ids:
- GAP-STB-005  # IDCAMS replacement for REPRO, DELETE, DEFINE CLUSTER and the MAXCC reset
- GAP-STB-007  # DISP of the backup generation recorded, not evaluated
- GAP-STB-009  # catalog and GDG emulation of the backup generation
- GAP-STB-010  # Berkeley DB indexed file in place of the VSAM KSDS
preconditions:
  datasets:
    TRANSACT: {base: DALYTRAN}
  parameters:
    # unikix runs the job too and cannot fix its clock (GAP-MIS-015); no
    # expected value depends on the run date.
    clock_mode: relative
  faults: []
inputs:
  job: TRANBKP
expected:
  return_code: 0
  # One line per step, as both adapters write them; neither writes a line per
  # job, so the job's own return code is return_code alone.
  messages:
  - STEP STEP05R.PRC001 RC 0000
  - STEP STEP05 RC 0000
  - STEP STEP10 RC 0000
  datasets:
    # The 300 backed-up records in TRAN-ID order; the baseline holds every
    # CVTRA05Y field and the raw bytes, which equal the dailytran.txt records.
    TRANSACT-BKUP:
      records:
