# ===========================================================================
# TEMPLATE ONLY — placeholder credentials for local/demo use.
# Replace before any non-local deployment;
# do not store production secrets in git.
# ---------------------------------------------------------------------------
# This manifest is intentionally committed with NON-SECRET placeholder values
# so the CardDemo stack runs out-of-the-box in a local/demo cluster. For any
# shared, staging, or production environment, inject real credentials at
# deploy time instead (kubectl create secret, Sealed Secrets, the External
# Secrets Operator, or CI/CD variable substitution) and never commit real
# secrets to version control.
# ---------------------------------------------------------------------------
# Consumed by:
#   - Backend service Deployments via envFrom.secretRef.name: carddemo-secret
#   - postgres Deployment via secretKeyRef:
#       POSTGRES_USER     <- SPRING_DATASOURCE_USERNAME
#       POSTGRES_PASSWORD <- SPRING_DATASOURCE_PASSWORD
# The username/password below MUST match the values the postgres pod is
# initialized with, or the services cannot authenticate against the database.
# ===========================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-secret
  labels:
    app.kubernetes.io/part-of: carddemo
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # Kubernetes base64-encodes stringData on apply, so the values below stay
  # human-readable in this template. Keys map 1:1 to Spring Boot datasource
  # environment variables and to the postgres container POSTGRES_* variables.
  SPRING_DATASOURCE_USERNAME: "carddemo"
  SPRING_DATASOURCE_PASSWORD: "carddemo"  # placeholder — replace at deploy time
  # Redis password placeholder (kept commented out — NOT an active key).
  # Uncomment & set ONLY if Redis AUTH is enabled (redis:8 default = no auth).
  # Injecting an empty value can break the connection.
  # SPRING_DATA_REDIS_PASSWORD: ""
