<!--
  CardDemo - Account Icon
  
  Custom SVG icon representing account management features and customer account operations.
  Replaces character-based account representations from BMS 3270 terminal screens
  (COACTUP.bms - Account Update, COACTVW.bms - Account View).
  
  Design: User profile silhouette with document/folder element to convey account management.
  
  Specifications:
  - ViewBox: 24x24 for optimal scalability
  - Fill: currentColor for dynamic theming (light/dark mode support)
  - Works at multiple sizes: 16px, 24px, 32px, 48px
  - Simple, clean lines suitable for modern web interface
  
  Copyright Amazon.com, Inc. or its affiliates.
  Licensed under the Apache License, Version 2.0
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
  <title>Account</title>
  
  <!-- User profile circle (head) -->
  <circle cx="9" cy="7" r="3" />
  
  <!-- User profile body (shoulders/torso) -->
  <path d="M9 11c-3.5 0-6 2-6 4.5V17c0 0.5 0.5 1 1 1h10c0.5 0 1-0.5 1-1v-1.5c0-2.5-2.5-4.5-6-4.5z" />
  
  <!-- Document/folder element (representing account records) -->
  <path d="M16 4h-2v2h2v11h5V7l-3-3h-2z" />
  <path d="M18 4v3h3" stroke="none" fill="currentColor" />
  
  <!-- Account detail lines (representing account data/information) -->
  <line x1="17" y1="10" x2="20" y2="10" stroke="currentColor" stroke-width="0.5" />
  <line x1="17" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="0.5" />
  <line x1="17" y1="14" x2="19" y2="14" stroke="currentColor" stroke-width="0.5" />
</svg>
