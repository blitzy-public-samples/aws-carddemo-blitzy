# COACTUPC refuses an account update whose Open Date month is blank: EDIT-MONTH
# of CSUTLDPY composes 'Open Date : Month must be supplied.'
# [app/cpy/CSUTLDPY.cpy:91-147].
#
# Steps 1-2 reach the COACTUP search screen as MNU-COMEN01C-alternate-02 does:
# entered from COMEN01C without CDEMO-PGM-REENTER, COACTUPC sends the cleared
# map with the search-key prompt, sets CDEMO-PGM-REENTER and returns TRANSID
# CAUP [app/cbl/COACTUPC.cbl:964-972].
# Step 3: ENTER with account 00000000001. 9000-READ-ACCT reads CXACAIX (card
# 9680294154603697, customer 000000001, line 49 of app/data/ASCII/cardxref.txt),
# ACCTDAT and CUSTDAT, keeps the records as the old values and sets
# ACUP-SHOW-DETAILS; 3202-SHOW-ORIGINAL-VALUES fills the map with 'Update
# account details presented above.', and 3320-UNPROTECT-FEW-ATTRS gives every
# field MDT on, so all of them come back on the next AID
# [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3500-3562,3608-3884].
# Step 4: the adapter erases OPNMON (EraseEOF, nothing typed) and presses ENTER.
# The emptied field arrives as nulls or spaces, so 1100-RECEIVE-MAP moves
# LOW-VALUES to ACUP-NEW-OPEN-MON [app/cbl/COACTUPC.cbl:1151-1156];
# 1205-COMPARE-OLD-NEW finds the Open Date changed, and 1200-EDIT-MAP-INPUTS
# sets ACUP-CHANGES-NOT-OK and runs the edits in field order
# [app/cbl/COACTUPC.cbl:1460-1482,1681-1777]:
# - Account Status 'Y' passes 1220-EDIT-YESNO.
# - Open Date runs EDIT-DATE-CCYYMMDD on '2014', LOW-VALUES, '20'. The year
#   passes EDIT-YEAR-CCYY; EDIT-MONTH finds the month LOW-VALUES, sets
#   INPUT-ERROR and FLG-MONTH-BLANK, and, WS-RETURN-MSG being still blank,
#   STRINGs the trimmed field name and ' : Month must be supplied.' into it;
#   EDIT-DAY accepts 20 [app/cpy/CSUTLDPY.cpy:18-207]. EDIT-DAY-MONTH-YEAR
#   finds no 29th, 30th or 31st and, the flags (X'00', 'B', X'00') not being
#   WS-EDIT-DATE-IS-VALID, goes to the exit, so CSUTLDTC is never called for
#   this date [app/cpy/CSUTLDPY.cpy:209-282,329].
# - Every later edit passes for this account and the invented customer below,
#   and each composes its message only while WS-RETURN-MSG-OFF, so the Open
#   Date message stands [app/cbl/COACTUPC.cbl:479-480,1484-1676].
# 2000-DECIDE-ACTION continues on ACUP-CHANGES-NOT-OK, so nothing is read for
# update or rewritten [app/cbl/COACTUPC.cbl:2596-2597]. 3203-SHOW-UPDATED-VALUES
# echoes the received values (ACUP-CHANGES-MADE covers 'E'); 3250 sets
# PROMPT-FOR-CHANGES and moves WS-RETURN-MSG to ERRMSG; 3300's CSSETATY copy for
# OPEN-MONTH, with FLG-OPEN-MONTH-BLANK and CDEMO-PGM-REENTER, turns OPNMON red
# and moves '*' into it; 3390 brightens F12=Cancel but not F5=Save
# [app/cbl/COACTUPC.cbl:660-663,2716-2720,2870-2951,2955-2983,3220-3224,3566-3584]
# [app/cpy/CSSETATY.cpy:18-27].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - ERRMSG: 'Open Date' trimmed (9) plus ' : Month must be supplied.' (26) is
#   35 characters in the 75-byte WS-RETURN-MSG, sent in the 78-byte ERRMSG with
#   the rest spaces. INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte field
#   [app/cbl/COACTUPC.cbl:462-479].
# - OPNMON is '*' padded to its 2 bytes; the other fields echo what step 4
#   sent back, the amounts re-edited through +ZZZ,ZZZ,ZZZ.99 because their
#   edits pass [app/cbl/COACTUPC.cbl:370-371,2872-2909].
# - AADDGRP shows the blank ACCT-GROUP-ID of every repository account
#   (GAP-DEF-005), received as LOW-VALUES and sent as nulls.
# - FKEY05 and FKEY12 are ATTRB=(ASKIP,DRK) in the map
#   [app/bms/COACTUP.bms:498-507]; the screen capture renders a dark field as
#   blanks, so FKEY05 is blank and FKEY12 shows its INITIAL text.
# - The header shows the COTTL01Y titles, CAUP, COACTUPC and the region's date
#   and time through CSDAT01Y, hence the matchers and clock_mode relative.
# - The derivation assumes the 88-level tests of EDIT-DAY-MONTH-YEAR on the
#   LOW-VALUES month raise no data exception on the region.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, as in the other COACTUPC update scenarios: the repository record fails
# the Phone Number 2 area code, the state/zip pair and the FICO range, which
# would not change the message (Open Date is edited first) but would mark
# other fields. Account 00000000001 and its cross-reference stay as in the
# repository.
id: ACT-COACTUPC-negative-015
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update) and fetches
  account 00000000001, which COACTUPC shows with customer 000000001 and
  'Update account details presented above.'. The user then clears the month
  of the Open Date (2014-11-20) and presses ENTER. COACTUPC refuses the change
  with 'Open Date : Month must be supplied.', marks the month with '*', keeps
  the change prompt and the received values on the editable screen, and saves
  nothing: ACCTDATA and CUSTDATA still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are verified
# by the SEC and MNU scenarios; the batch record copybooks and the data files
# are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-073  # COACTUPC Open Date: month supplied (EDIT-MONTH)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying CDEMO-PGM-REENTER and the ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits run
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the red attribute and '*' of the blank month
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-MONTH and the other date edits
- INV-LAY-014  # CSUTLDWY: WS-EDIT-DATE-MM and the date-edit flags
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY drops FUNCTION TRIM from the field name of every
# composed date-edit message, so a unikix run shows the untrimmed name.
- GAP-DOC-024
# The UniKix COACTUPC comments out the TEST-NUMVAL-C amount checks this path
# runs, so the amounts echoed on screen 4 may differ on UniKix.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
preconditions:
  datasets:
    # Account 00000000001 and its cross-reference record as in the repository.
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data that passes every edit of
    # 1200-EDIT-MAP-INPUTS; the 168-byte FILLER keeps the base record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
        CUST-ADDR-ZIP: '27601'
        CUST-PHONE-NUM-1: (919)555-0101
        CUST-PHONE-NUM-2: (919)555-0102
        CUST-SSN: '123456789'
        CUST-GOVT-ISSUED-ID: TESTGOVT0001
        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: Y
        CUST-FICO-CREDIT-SCORE: '700'
    # The 10 repository users, for the USER0001 sign-on.
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  # The empty value erases the month the fetch showed (11); the year 2014 and
  # the day 20 come back as fetched.
  - aid: ENTER
    '@map': COACTUP
    fields:
      OPNMON: ''
