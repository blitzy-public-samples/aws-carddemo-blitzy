# Derived baseline, inferred-not-observed (GAP-INF-009, GAP-INF-012): authored
# from the source, never captured; only `python tests/harness/report.py
# --import-unikix <execution_id>` promotes it. USER0001 reaches COMEN01, option 9
# transfers to CORPT00C, whose first entry sends CORPT00 with a blank message
# line. The Custom ENTER passes the empty-part checks, NUMVAL-C keeps the parts
# '12', '01', '2022', '12', '31', '2022', and the text comparison '12' > '12' is
# false, so start month 12 is accepted and the day, year and end-date checks
# pass too. CSUTLDTC is taken to accept 2022-12-01 and 2022-12-31 with mask
# YYYY-MM-DD (inferred, GAP-INF-001, GAP-MIS-010). WS-REPORT-NAME is 'Custom'
# and CONFIRM is empty, so SUBMIT-JOB-TO-INTRDR STRINGs 'Please confirm to print
# the Custom report...' into WS-MESSAGE and SEND-TRNRPT-SCREEN ends the task
# before any WRITEQ TD to JOBS
# [app/cbl/CORPT00C.cbl:165-181,256-436,462-474,556-591,609-628]. CORPT0AO
# redefines CORPT0AI, so the entered values are sent back
# [app/cpy-bms/CORPT00.CPY:121]; ERRMSG is the full 78-byte field
# [app/bms/CORPT00.bms:218-221], blank or the 44-character prompt and 34
# trailing spaces, as Result.messages carries it for each step; TITLE01 and
# TITLE02 are the 40-byte COTTL01Y titles [app/cpy/COTTL01Y.cpy:17-22].
# CURDATE and CURTIME are the region clock, so they are matchers.
messages:
- '                                                                              '
- '                                                                              '
- 'Please confirm to print the Custom report...                                  '
screens:
- '@map': COMEN01
  ERRMSG: '                                                                              '
  PGMNAME: COMEN01C
  TRNNAME: CM00
- '@map': CORPT00
  ERRMSG: '                                                                              '
  PGMNAME: CORPT00C
  TRNNAME: CR00
- '@map': CORPT00
  CONFIRM: ' '
  CURDATE:
    format: '%m/%d/%y'
    match: run-date
  CURTIME:
    match: run-time
  CUSTOM: X
  EDTDD: '31'
  EDTMM: '12'
  EDTYYYY: '2022'
  ERRMSG: 'Please confirm to print the Custom report...                                  '
  MONTHLY: ' '
  PGMNAME: CORPT00C
  SDTDD: '01'
  SDTMM: '12'
  SDTYYYY: '2022'
  TITLE01: '      AWS Mainframe Modernization       '
  TITLE02: '              CardDemo                  '
  TRNNAME: CR00
  YEARLY: ' '
