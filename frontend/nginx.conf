# =============================================================================
# frontend/nginx.conf
#
# Full nginx MAIN configuration that serves the production build of the CardDemo
# React 19 single-page application (Vite output) and provides SPA history
# fallback so client-side (react-router-dom) routes resolve on a hard reload or
# deep link. The SPA replaces the 17 legacy BMS 3270 mapsets.
#
# Placement contract (frontend/Dockerfile):
#   This file is a complete main configuration (it declares the `events` and
#   `http` contexts and top-level directives) and MUST be copied to
#   /etc/nginx/nginx.conf. It MUST NOT be copied into /etc/nginx/conf.d/ (e.g.
#   default.conf): main-context directives inside the stock http{} block make
#   nginx fail to start. Validate with `nginx -t -c /etc/nginx/nginx.conf`.
#
# Runtime contract (root docker-compose.yml / k8s):
#   - nginx listens on container port 80; Compose maps host 3000 -> container 80.
#   - The Vite build output (dist/) is copied to /usr/share/nginx/html.
#
# API contract (same-origin):
#   The SPA reaches the api-gateway same-origin through `location /api/`, which
#   reverse-proxies to the gateway. The browser build therefore uses a relative
#   base URL (import.meta.env.VITE_API_BASE_URL = "/api"); no absolute gateway
#   URL is baked into the static bundle and no cross-origin CORS is required.
#   The upstream host `api-gateway` must be resolvable on the container network
#   (Compose service name / k8s Service in the same namespace).
#
# Security:
#   - Response security headers (CSP, X-Frame-Options, X-Content-Type-Options,
#     Referrer-Policy, Permissions-Policy) are sent on every response. Because
#     nginx `add_header` does not merge across levels, the set is re-declared in
#     each location that adds its own header.
#   - The access log uses a format that logs only the request method and the
#     normalized path ($uri) and omits the query string ($args/$request_uri), so
#     any value accidentally placed in a query string is not written to the log.
#     Request bodies, Authorization, and Cookie headers are never logged.
#   - HSTS is intentionally not set here; it is applied by the TLS-terminating
#     edge (ingress / load balancer), never on this plain-HTTP :80 listener.
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Access-log format that omits the query string so secrets accidentally
    # placed in a URL are never persisted. $uri is the decoded path without args.
    log_format  redacted  '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  redacted;

    # Connection and transfer tuning (stock nginx defaults).
    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    # Do not advertise the nginx version on responses or error pages.
    server_tokens  off;

    # Map the Upgrade request header to the Connection value so the /api/ proxy
    # transparently supports WebSocket/SSE upgrades and plain REST alike.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # gzip compression for text-based assets. Pre-compressed binary formats
    # (e.g. woff2) are intentionally not listed.
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_comp_level    6;
    gzip_proxied       any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen       80;
        server_name  _;

        # Vite build output (dist/) is copied here by frontend/Dockerfile.
        root   /usr/share/nginx/html;
        index  index.html;

        # Response security headers (sent on every response served directly by
        # this server block, e.g. the SPA history fallback location "/").
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

        # Same-origin API reverse proxy. The trailing slash on proxy_pass strips
        # the "/api/" prefix, so "/api/accounts/1" reaches the gateway as
        # "/accounts/1". Security headers are re-declared because add_header in a
        # location replaces (does not merge with) the server-level set.
        location /api/ {
            proxy_pass         http://api-gateway:8080/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_read_timeout 60s;

            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Frame-Options "DENY" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        }

        # index.html must never be cached aggressively so a new deploy, which
        # references freshly content-hashed asset filenames, is picked up
        # immediately by returning clients.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        }

        # Content-hashed bundle files (JS, CSS, images, fonts) are emitted under
        # /assets/ by Vite. Filenames change with content, so they cache
        # immutably. A missing asset returns 404 (no index.html fallback).
        location /assets/ {
            expires    1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
            try_files  $uri =404;
        }

        # SPA history fallback: serve index.html for any path that is not a real
        # file or directory so react-router-dom resolves deep links and hard
        # reloads (e.g. /accounts/123, /cards) on the client. Inherits the
        # server-level security headers above.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
