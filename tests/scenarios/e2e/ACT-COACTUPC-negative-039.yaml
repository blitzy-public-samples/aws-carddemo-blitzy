# The negative case of the Expiry Date CSUTLDTC-severity predicate: a valid
# expiry date passes every COBOL date check and reaches the CEEDAYS check of
# EDIT-DATE-LE, which accepts it, so no 'Expiry Date validation error Sev
# code: ... Message code: ...' appears and the update goes on to confirmation.
#
# Steps 1-3 sign on, choose option 2 and fetch account 00000000001 as
# ACT-COACTUPC-alternate-04 does: the details of the account and of customer
# 000000001 are shown with 'Update account details presented above.', every
# editable field unprotected with MDT on, so all of them come back on the next
# AID [app/cbl/COACTUPC.cbl:2787-2865,2955-3000,3500-3561].
# Step 4 types 2027-12-31 over the expiry date (2025-05-20) and presses ENTER.
# 1100-RECEIVE-MAP stores '20271231' in ACUP-NEW-EXPIRAION-DATE
# [app/cbl/COACTUPC.cbl:1165-1186], 1205-COMPARE-OLD-NEW finds the change, and
# 1200-EDIT-MAP-INPUTS edits 'Expiry Date' through EDIT-DATE-CCYYMMDD
# [app/cbl/COACTUPC.cbl:1490-1494,1681-1704]: the year is a 4-digit number of
# century 20, month 12 lies in 1-12, day 31 in 1-31, December is a 31-day month
# and no February rule applies [app/cpy/CSUTLDPY.cpy:25-279]
# [app/cpy/CSUTLDWY.cpy:5-31]. With every flag valid, EDIT-DATE-LE calls
# CSUTLDTC with mask YYYYMMDD and finds severity 0, so the field is accepted
# [app/cpy/CSUTLDPY.cpy:284-327]. Every other field keeps its fetched value and
# passes, so INPUT-ERROR stays off, ACUP-CHANGES-OK-NOT-CONFIRMED is set, and
# without PF5 2000-DECIDE-ACTION writes nothing [app/cbl/COACTUPC.cbl:1671-1675,
# 2602-2621]. 3203-SHOW-UPDATED-VALUES shows the received values protected,
# 3250-SETUP-INFOMSG moves PROMPT-FOR-CONFIRMATION to INFOMSG and the blank
# WS-RETURN-MSG to ERRMSG, and 3390 makes F5=Save and F12=Cancel bright
# [app/cbl/COACTUPC.cbl:472-473,2870-2951,2955-2981,3566-3581].
#
# Why observed-only: the CSUTLDTC check runs only after the COBOL checks have
# passed, and every date they pass (1900-01-01 to 2099-12-31) is a real date
# that CEEDAYS is expected to accept, so the severity branch has no known
# trigger; GAP-UNC-013 asks what code that never executes is for. The
# accepting outcome is pinned as derived. It is inferred, not observed
# (GAP-INF-001): CSUTLDTC declares LS-DATE and LS-DATE-FORMAT as X(10)
# [app/cbl/CSUTLDTC.cbl:84-113], so CEEDAYS receives the 8-byte date followed
# by the first 2 bytes of WS-EDIT-DATE-BINARY (zero after INITIALIZE
# WS-MISC-STORAGE [app/cbl/COACTUPC.cbl:166,866]) and the 8-byte mask followed
# by 2 bytes of the initialized WS-SEVERITY (spaces). That real CEEDAYS accepts
# those strings is assumed, not seen; the UniKix copy passes trimmed lengths
# instead (GAP-DOC-021).
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte INFOMSGO; ERRMSG is the
#   75-byte WS-RETURN-MSG, blank, in the 78-byte ERRMSGO.
# - FKEY05 and FKEY12 keep their INITIAL text; on screen 3 they are dark
#   (ASKIP,DRK) and the s3270 capture renders a zero-intensity field as blanks.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, as in the other COACTUPC update scenarios: the repository record has
# FICO 274 and zip 12546, which would be refused first
# [app/cbl/COACTUPC.cbl:2514-2558] [app/cpy/CSLKPCDY.cpy:521,895,1186].
id: ACT-COACTUPC-negative-039
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001 and changes its expiry date from 2025-05-20 to
  2027-12-31. The date passes the year, month and day checks and the CSUTLDTC
  (CEEDAYS) check with mask YYYYMMDD returns severity 0, so no 'Expiry Date
  validation error Sev code' message appears: COACTUPC shows the changed
  values, protected, with 'Changes validated.Press F5 to save' and the F5=Save
  and F12=Cancel keys. Nothing is saved before PF5.
# Primary item first, then the CSUTLDTC date acceptance this mask reaches, the
# program, the maps asserted, the transaction of steps 3 and 4, the CSD files
# COACTUPC reads, and the online-only copybooks it copies. The confirmation
# message (INV-ACT-031) is asserted but verified by its own scenario; sign-on
# and the menu transaction by the SEC and MNU scenarios; the batch record
# copybooks and the data files at the lowest level that executes them.
inventory_ids:
- INV-ACT-097  # COACTUPC Expiry Date: CSUTLDTC severity 0 for mask YYYYMMDD (rule)
- INV-UTL-003  # CSUTLDTC date acceptance for masks YYYY-MM-DD and YYYYMMDD (rule)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and confirmation screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the validation
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the per-field error attributes
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-DATE-CCYYMMDD and EDIT-DATE-LE
- INV-LAY-014  # CSUTLDWY: the date-edit work areas and the CSUTLDTC result
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
- observed-only
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-DOC-024  # the UniKix CSUTLDPY date edits differ from app/
- GAP-INF-001  # which dates CEEDAYS accepts is known only through the stub
- GAP-MIS-010  # whether UniKix supplies CEEDAYS
- GAP-UNC-013  # purpose of code that never executes: the severity branch has no known trigger
# Not in the planned gap list. Scenarios cite each place where the deployed
