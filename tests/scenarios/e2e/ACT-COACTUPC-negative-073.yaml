# COACTUPC refuses a date of birth whose century is neither 19 nor 20: the
# century predicate of EDIT-YEAR-CCYY, which EDIT-DATE-CCYYMMDD runs for the
# Date of Birth field [app/cpy/CSUTLDPY.cpy:63-84] [app/cpy/CSUTLDWY.cpy:9-10].
#
# Steps 1-3 sign on as USER0001, choose main-menu option 2 and fetch account
# 00000000001, as ACT-COACTUPC-alternate-04 does: CXACAIX gives customer
# 000000001 (card 9680294154603697, line 49 of app/data/ASCII/cardxref.txt),
# ACCTDAT and CUSTDAT are read without UPDATE, and 3202-SHOW-ORIGINAL-VALUES
# shows the records with 'Update account details presented above.'; every
# editable field is DFHBMFSE (unprotected, MDT on), so all of them come back
# on the next AID [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3500-3561,3608-3884].
# Step 4 types 1861 over the birth year 1961 and presses ENTER.
# - 1100-RECEIVE-MAP moves 1861 to ACUP-NEW-CUST-DOB-YEAR; the month 06 and
#   day 08 come back unchanged [app/cbl/COACTUPC.cbl:1256-1275].
# - 1205-COMPARE-OLD-NEW sets CHANGE-HAS-OCCURRED at the account test, which
#   is false because its group-id term compares the LOW-VALUES of the blank
#   Account Group with the fetched spaces (TRIM removes spaces only,
#   GAP-DEF-019), and exits before the customer fields are compared: the
#   edited ACUP-NEW-CUST-DOB-YYYY-MM-DD 18610608 would differ from the fetched
#   19610608 as well, but that comparison is not reached. So
#   1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs the field edits in
#   screen order [app/cbl/COACTUPC.cbl:1213-1218,1460-1470,1697-1704,3847].
# - Account Status Y, Open Date 2014-11-20, Credit Limit, Expiry Date
#   2025-05-20, Cash Credit Limit, Reissue Date 2025-05-20, Current Balance,
#   both cycle limits and the SSN 123-45-6789 pass first, the three dates
#   through CSUTLDTC with severity 0 [app/cbl/COACTUPC.cbl:1472-1531,2431-2489]
#   [app/cpy/CSUTLDPY.cpy:284-321].
# - Date of Birth is next [app/cbl/COACTUPC.cbl:1533-1538]. EDIT-YEAR-CCYY
#   finds 1861 supplied and numeric, but WS-EDIT-DATE-CC-N 18 is neither
#   THIS-CENTURY (20) nor LAST-CENTURY (19): it sets INPUT-ERROR and
#   FLG-YEAR-NOT-OK and, WS-RETURN-MSG being still blank
#   [app/cbl/COACTUPC.cbl:479-480,876], STRINGs the trimmed field name and
#   ' : Century is not valid.' into WS-RETURN-MSG, then leaves the year edit
#   [app/cpy/CSUTLDPY.cpy:25-90]. EDIT-MONTH and EDIT-DAY pass 06 and 08;
#   EDIT-DAY-MONTH-YEAR finds no invalid combination and, the year flag being
#   '0', WS-EDIT-DATE-IS-VALID false, so it exits before EDIT-DATE-LE:
#   CSUTLDTC is not called for this date [app/cpy/CSUTLDPY.cpy:91-282].
# - The flags '0', LOW-VALUES, LOW-VALUES go to WS-EDIT-DT-OF-BIRTH-FLGS
#   (FLG-DT-OF-BIRTH-YEAR-NOT-OK), so WS-EDIT-DT-OF-BIRTH-ISVALID is false and
#   EDIT-DATE-OF-BIRTH, the future-date check, does not run
#   [app/cbl/COACTUPC.cbl:216-227,1538-1543].
# - FICO Score and every later edit pass on the invented customer below, and
#   an edit writes its message only while WS-RETURN-MSG-OFF holds, so this
#   message stays [app/cbl/COACTUPC.cbl:1545-1676].
# - INPUT-ERROR leaves ACUP-CHANGES-NOT-OK, which 2000-DECIDE-ACTION only
#   continues on: no READ UPDATE or REWRITE runs [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values, 1861 included, with
#   the valid amounts re-edited through +ZZZ,ZZZ,ZZZ.99; 3250-SETUP-INFOMSG
#   sets PROMPT-FOR-CHANGES and moves WS-RETURN-MSG to ERRMSG; 3300 keeps the
#   fields editable, CSSETATY turns DOBYEAR red (no '*', the field is not
#   blank), and the cursor goes to DOBYEAR: 3000-SEND-MAP runs 3250 before
#   3300, so PROMPT-FOR-CHANGES has replaced the FOUND-ACCOUNT-DATA that
#   1200-EDIT-MAP-INPUTS set in WS-INFO-MSG, and FLG-DT-OF-BIRTH-YEAR-NOT-OK
#   is the first WHEN of the cursor EVALUATE that holds, selecting DOBYEARL
#   (the cursor is not asserted); 3390 makes F12=Cancel bright, while
#   F5=Save stays dark without a confirmation prompt
#   [app/cbl/COACTUPC.cbl:1452,2654-2657,2870-2951,2955-2983,2986-3012,
#   3089-3092,3315-3319,3566-3584] [app/cpy/CSSETATY.cpy].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - ERRMSG is 'Date of Birth' (the trimmed X(25) WS-EDIT-VARIABLE-NAME) and
#   ' : Century is not valid.', 37 characters, in the 75-byte WS-RETURN-MSG
#   and the 78-byte ERRMSGO.
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   FKEY05 is dark (ASKIP,DRK) and the s3270 capture renders it as blanks.
#   Colour and cursor position are not in the s3270 text capture and are not
#   asserted.
# - The tpe adapter enters a field with EraseEOF before typing; DOBYEAR is
#   4 bytes [app/bms/COACTUP.bms:291-295], so 1861 fills it.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative. The refused year never reaches the run-date
#   comparison of EDIT-DATE-OF-BIRTH, so the outcome holds on any run date.
#
# Customer 000000001 is replaced by invented data that passes every other
# COACTUPC edit: the repository record has FICO 274, below 300, and zip 12546,
# which is not a North Carolina zip [app/cbl/COACTUPC.cbl:2514-2558]. Area code
# 919 is a general-purpose code and NC27 a valid state and zip pair
# [app/cpy/CSLKPCDY.cpy:521,895,1186]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-073
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001 with its customer 000000001, changes the birth year
  from 1961 to 1861 and presses ENTER. COACTUPC refuses the value because only
  the centuries 19 and 20 are valid: the message line shows 'Date of Birth :
  Century is not valid.', the screen keeps the entered values, 1861 included,
  editable under 'Update account details presented above.', and F12=Cancel is
  shown while F5=Save is not. Nothing is saved: ACCTDATA and CUSTDATA still
  hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-131  # COACTUPC Date of Birth: century 19 or 20 (EDIT-YEAR-CCYY field edit)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute set on DOBYEAR
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-YEAR-CCYY, whose century check refuses 1861
- INV-LAY-014  # CSUTLDWY: WS-EDIT-DATE-CC-N with THIS-CENTURY and LAST-CENTURY
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY drops FUNCTION TRIM from the field name of every composed
# date-edit message, so the ERRMSG of screen 4 differs on UniKix.
- GAP-DOC-024
# The UniKix COACTUPC comments out the TEST-NUMVAL-C amount checks this path
# runs, so the re-edited amounts on screen 4 may differ on UniKix.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
