# ------------------------------------------------------------------------------
# CardDemo — Prometheus scrape configuration
#
# Rule-mandated observability infrastructure (Observability rule; no legacy
# analogue). Mounted read-only into the prom/prometheus container by the
# repository-root docker-compose.yml at /etc/prometheus/prometheus.yml.
#
# All application services expose Micrometer metrics through Spring Boot
# Actuator at HTTP path /actuator/prometheus on container port 8080. Prometheus
# runs on the shared docker network (carddemo-net) and reaches each service by
# its docker-compose service name (DNS), so targets use the INTERNAL port 8080
# (never the host-published ports).
#
# HOW THE MONITORING PATH IS PROTECTED — TWO INDEPENDENT CONTROLS.
#   1. AUTHENTICATION. Every service installs a dedicated management filter chain
#      (carddemo-common ManagementSecurityConfig) that requires HTTP basic
#      authentication as the least-privilege `monitoring` principal for
#      /actuator/prometheus and /actuator/metrics/**. The principal is seeded from
#      MONITORING_PASSWORD, the SAME secret this file reads through password_file,
#      so the scrape authenticates and an unauthenticated caller receives 401. The
#      credential is never committed: docker-compose.yml projects it as a file and
#      k8s/secret.yaml supplies it from carddemo-monitoring-secret.
#   2. NETWORK ISOLATION (defence in depth). No service publishes its management
#      port. In Docker Compose only the api-gateway binds a host port and it does
#      not proxy /actuator; in Kubernetes the namespace-wide default-deny of
#      k8s/networkpolicy.yaml admits the service port from the api-gateway pod
#      ALONE, and no monitoring backend is deployed in-cluster, so this scrape
#      config is a Compose-only artefact and an in-cluster scrape would require
#      an explicit allow rule to be added there first. Scrape traffic therefore
#      never leaves the private network.
#
# Confidentiality of the sensitive part of the health payload is preserved
# independently by management.endpoint.health.show-details=when-authorized, which
# keeps component-level detail invisible to anonymous callers. The liveness and
# readiness probe paths stay anonymous so the Compose healthcheck and the
# Kubernetes probes, which carry no principal, can reach them.
#
# Rationale: docs/decision-log.md.
# ------------------------------------------------------------------------------

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    application: carddemo
    environment: local

# Alerting rules — the paging counterpart to the Grafana dashboard. The file is
# mounted read-only next to this one by docker-compose.yml, and every threshold in
# it is a number the project already commits to (the 200 ms p95 target and the
# 4-hour batch window of AAP 0.7.1). Prometheus evaluates them at the global
# evaluation_interval and exposes them through /api/v1/rules and /api/v1/alerts; no
# Alertmanager is configured in the local stack, so nothing is dispatched.
rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # --- Prometheus self-monitoring -------------------------------------------
  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  # --- CardDemo microservices (Spring Boot Actuator + Micrometer) -----------
  # metrics_path is the Actuator Prometheus exposition endpoint; targets use
  # docker-compose service DNS names on the shared network, internal port 8080.
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    basic_auth: &carddemo_scrape_auth
      username: monitoring
      password_file: /etc/prometheus/secrets/monitoring-password
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    basic_auth: *carddemo_scrape_auth
    static_configs:
      - targets: ["auth-service:8080"]

  - job_name: user-service
    metrics_path: /actuator/prometheus
    basic_auth: *carddemo_scrape_auth
    static_configs:
      - targets: ["user-service:8080"]

  - job_name: account-service
    metrics_path: /actuator/prometheus
    basic_auth: *carddemo_scrape_auth
    static_configs:
      - targets: ["account-service:8080"]

  - job_name: card-service
    metrics_path: /actuator/prometheus
    basic_auth: *carddemo_scrape_auth
    static_configs:
      - targets: ["card-service:8080"]

  - job_name: transaction-service
    metrics_path: /actuator/prometheus
    basic_auth: *carddemo_scrape_auth
    static_configs:
      - targets: ["transaction-service:8080"]

  - job_name: billpay-service
    metrics_path: /actuator/prometheus
    basic_auth: *carddemo_scrape_auth
    static_configs:
      - targets: ["billpay-service:8080"]

  - job_name: reporting-service
    metrics_path: /actuator/prometheus
    basic_auth: *carddemo_scrape_auth
    static_configs:
      - targets: ["reporting-service:8080"]

  - job_name: batch-service
    metrics_path: /actuator/prometheus
    basic_auth: *carddemo_scrape_auth
    static_configs:
      - targets: ["batch-service:8080"]

  # --- Tracing backend (Jaeger v2 internal telemetry) -----------------------
  # The collector publishes its OWN telemetry — spans accepted, spans exported,
  # spans refused or dropped, process uptime and resident memory — on port 8888.
  # Unscraped, a tracing backend that is discarding spans, or restarting and
  # taking its whole in-memory store with it, is indistinguishable from a healthy
  # one: that is precisely how ten restarts under load went unnoticed. Scraping it
  # also extends the generic `up == 0` availability rule to cover the collector,
  # and feeds the carddemo-tracing rules in alert-rules.yml.
  #
  # No basic_auth: this is the OpenTelemetry Collector's telemetry endpoint, which
  # supports no authentication and carries no business data — only counters about
  # its own pipeline. Network isolation is the control, exactly as for the
  # datastores: port 8888 is neither published to the host nor named in
  # k8s/service-jaeger.yaml, so the scrape stays on the private carddemo-net
  # bridge.
  - job_name: jaeger
    metrics_path: /metrics
    static_configs:
      - targets: ["jaeger:8888"]
        labels:
          service: jaeger
