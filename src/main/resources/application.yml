# ============================================================================
# CardDemo Spring Boot 3.2 — BASE Configuration
# ----------------------------------------------------------------------------
# This file is the FOUNDATIONAL configuration loaded by Spring Boot on every
# startup. Profile-specific overrides (application-dev.yml, application-prod.yml,
# application-test.yml) are layered on top via Spring Boot's PropertySourceLoader.
#
# Profiles can be activated via:
#   - JVM arg:          -Dspring.profiles.active=dev|prod
#   - Env var:          SPRING_PROFILES_ACTIVE=dev|prod
#   - Maven plugin:     mvn spring-boot:run -Dspring-boot.run.profiles=dev
#   - Command-line arg: java -jar app.jar --spring.profiles.active=prod
#
# Default profile (when none active): NONE — the application starts with ONLY
# the base config below. The dev or prod profile is REQUIRED for a working
# database connection: this base file intentionally declares NO datasource.
#
# Sources of truth:
#   - AAP §0.4.1.8 (base config properties enumeration)
#   - AAP §0.5.1 (Spring Boot 3.2.12 BOM-managed dependencies)
#   - AAP §0.6.4 (BigDecimal precision rules — PR-16)
#   - AAP §0.7.1 PR-22, PR-24, PR-25, PR-26, PR-28, PR-30
# ============================================================================

spring:
  # --------------------------------------------------------------------------
  # APPLICATION IDENTITY
  # --------------------------------------------------------------------------
  application:
    name: carddemo
  main:
    banner-mode: console
    lazy-initialization: false

  # --------------------------------------------------------------------------
  # JPA / HIBERNATE — Base configuration; profiles override show-sql / format_sql
  # --------------------------------------------------------------------------
  # ddl-auto: validate — Flyway is the SOLE schema owner. Hibernate verifies the
  # entity mappings match the actual database schema but NEVER modifies it. Any
  # mismatch causes startup to fail fast with a clear error. NEVER use update,
  # create, or create-drop here (PR-30: Flyway owns schema).
  #
  # open-in-view: false — Disables the Spring Boot default that keeps the JPA
  # session open until view rendering completes. Required by PR-24 to enforce
  # clean transaction boundaries matching the CICS SYNCPOINT semantics; the
  # session (and transaction) ends at the service-layer boundary.
  # --------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
          batch_size: 50
          # Required for OptimisticLockException to be wrapped properly when
          # @Version columns conflict (PR-22).
          lob:
            non_contextual_creation: true
        # Group batched INSERT / UPDATE statements by entity for JDBC batching.
        order_inserts: true
        order_updates: true
        # Use the modern (sequence-style) identifier generators on PostgreSQL.
        id:
          new_generator_mappings: true

  # --------------------------------------------------------------------------
  # FLYWAY — Schema migration framework
  # --------------------------------------------------------------------------
  # locations: classpath:db/migration scans src/main/resources/db/migration/
  # for V*.sql scripts and applies them in version order.
  #
  # Applied scripts:
  #   V1__schema.sql              — 12 base tables + sequences
  #   V2__indexes.sql             — Secondary indexes replacing the VSAM AIX
  #   V3__seed_reference_data.sql — 7 types + 18 categories + 51 disclosure groups
  #   V4__seed_users.sql          — 10 default users with BCrypt-hashed passwords
  #   V5__seed_master_data.sql    — 50 customers + 50 accounts + 50 cards + xrefs + TCATBAL
  #
  # Flyway tracks applied scripts in the flyway_schema_history table.
  # --------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    table: flyway_schema_history
    # Read V*.sql scripts as UTF-8 on every platform (avoids CP1252 on Windows).
    encoding: UTF-8

  # --------------------------------------------------------------------------
  # SPRING BATCH — Replaces the JCL batch job scheduler
  # --------------------------------------------------------------------------
  # job.enabled: false — Jobs are NOT auto-executed on startup. They are invoked
  # on demand via BatchAdminController (POST /api/admin/jobs/{name}/launch) or via
  # JobLauncher in services. Without this, Spring Boot would run EVERY Job bean
  # (~17 of them) on every restart — corrupting data. AAP §0.4.1.8 confirms this.
  #
  # jdbc.initialize-schema: always — Spring Boot auto-creates the BATCH_* metadata
  # tables (BATCH_JOB_INSTANCE, BATCH_JOB_EXECUTION, BATCH_STEP_EXECUTION, ...) on
  # first startup. Idempotent: skips creation when the tables already exist.
  # --------------------------------------------------------------------------
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
      # Spring Batch default prefix; keeps the canonical BATCH_* table naming.
      table-prefix: BATCH_

  # --------------------------------------------------------------------------
  # JACKSON — JSON serialization for the REST controllers
  # --------------------------------------------------------------------------
  # CRITICAL (PR-16): write-bigdecimal-as-plain: true ensures BigDecimal values
  # serialize as plain decimal strings (e.g., 1234.50) rather than scientific
  # notation (e.g., 1.2345E3). This preserves the original COBOL PIC S9(10)V99
  # COMP-3 scale (2 decimal places) exactly across the JSON boundary — a parity
  # requirement for every monetary field.
  #
  # write-dates-as-timestamps: false emits ISO-8601 date/time strings instead of
  # Unix-epoch numbers, aligning with the DB2 timestamp preservation rule (PR-11).
  # --------------------------------------------------------------------------
  jackson:
    generator:
      write-bigdecimal-as-plain: true
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
      accept-empty-string-as-null-object: true
    default-property-inclusion: non_null
    time-zone: UTC
    date-format: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX"

# ============================================================================
# SERVER — Embedded Tomcat (from spring-boot-starter-web)
# ============================================================================
server:
  port: 8080
  # Drain in-flight requests on SIGTERM before terminating (default 30s window).
  shutdown: graceful
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # Tomcat tuning (BOM-managed Tomcat 10.1.x).
  tomcat:
    threads:
      max: 200
      min-spare: 10
    max-connections: 8192
    accept-count: 100
    connection-timeout: 20000

# ============================================================================
# LOGGING — Logback (transitively pulled in by spring-boot-starter)
# ============================================================================
# Base log levels. Profiles override these for dev (DEBUG) vs. prod (INFO/JSON).
# ============================================================================
logging:
  level:
    root: INFO
    com.carddemo: INFO
    org.springframework: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.batch: INFO
    org.hibernate: WARN
    org.flywaydb: INFO
  pattern:
    # Human-readable default; the prod profile OVERRIDES with a JSON-structured pattern.
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n'

# ============================================================================
# ACTUATOR — Operational endpoints (spring-boot-starter-actuator)
# ============================================================================
# Per AAP §0.4.1.8 base config: expose health, info, metrics, env, loggers.
# The prod profile RESTRICTS this further to avoid leaking sensitive config.
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, env, loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    info:
      enabled: true
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false
    java:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true

# ============================================================================
# SPRINGDOC OPENAPI — OpenAPI 3 docs + Swagger UI (springdoc-openapi 2.3.0)
# ============================================================================
# Provides:
#   - GET /v3/api-docs        -> OpenAPI 3 JSON
#   - GET /swagger-ui.html    -> Interactive Swagger UI
# The prod profile DISABLES both to avoid leaking the API structure.
# (Keys are kebab-case — Spring relaxed binding maps to canonical springdoc names.)
# ============================================================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    persist-authorization: true
  show-actuator: false
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

# ============================================================================
# CARDDEMO — Application-specific configuration
# ============================================================================
# batch.output.base-dir — Single approved filesystem subtree that batch jobs
# (StatementGenerationTasklet, CategoryBalanceReportJobConfig) may write to.
# The caller-supplied `outputDir` JobParameter is treated strictly as a RELATIVE
# sub-path beneath this base; BatchOutputPathResolver rejects absolute paths and
# `..` traversal and confines every resolved path under this directory. This
# closes the CP4 path-traversal finding where outputDir was passed directly to
# Paths.get(...). Override per environment as needed.
# ============================================================================
carddemo:
  batch:
    output:
      base-dir: ./output
