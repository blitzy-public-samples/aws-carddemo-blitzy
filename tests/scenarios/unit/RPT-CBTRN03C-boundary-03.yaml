# The page-size boundary of the CBTRN03C report. WS-LINE-COUNTER counts the four
# header lines as well as the detail lines, and a page break is taken before a
# detail line only when the counter is a multiple of WS-PAGE-SIZE (20)
# [app/cbl/CBTRN03C.cbl:127-132,274-290,324-341]. After the first headers the
# counter is 4, so before detail k it stands at k + 3: at 19 before detail 16,
# which is written with no break, and at 20 before detail 17, which is preceded
# by a page total, a separator and the four header lines. One run of 17 records
# for one card therefore shows both sides of the boundary: the 16th detail
# without a break and the 17th with one. The first page holds 16 details rather
# than 20; this scenario pins that page control as observed (GAP-DEF-012).
id: RPT-CBTRN03C-boundary-03
level: unit
type: boundary
description: >-
  CBTRN03C reports 17 in-window transactions of 1.00 for card 9680294154603697
  (account 00000000001) and ends with return code 0. The report holds the four
  header lines, details 1 to 16, then, before detail 17, the page total
  +16.00, a separator and the four header lines again, then detail 17. At end
  of file the last amount is added to the page total a second time, so the
  final page total is +2.00, followed by a separator and the grand total
  +18.00; with a single card no account-total line is written
  [app/cbl/CBTRN03C.cbl:170-206,274-322].
