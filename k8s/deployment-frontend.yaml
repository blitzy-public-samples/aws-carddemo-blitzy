---
# =============================================================================
# k8s/deployment-frontend.yaml
# -----------------------------------------------------------------------------
# Kubernetes Deployment for the CardDemo React 19 single-page application (SPA),
# which re-platforms the 17 legacy BMS 3270 mapsets (AAP 0.3.5) into React pages
# served as a static production bundle.
#
# Image `carddemo/frontend:1.0.0` is built by `frontend/Dockerfile`: a
# multi-stage build that compiles the Vite bundle on the `node:24` base image
# and serves the static assets with nginx on port 80. nginx also reverse-
# proxies the same-origin `/api` path to the api-gateway (CR-10), so the browser
# never needs an absolute gateway URL.
#
# This is NOT a Spring Boot service (AAP 0.3.1):
#   * NO Actuator -> health probes use a plain HTTP GET on "/" (nginx returns
#     index.html), never an "/actuator/*" path.
#   * NO database/Redis credentials -> this Deployment attaches NO `envFrom`
#     and never references any Secret / the carddemo-config ConfigMap.
#
# The companion `service-frontend.yaml` (type LoadBalancer) selects these pods
# via `app: frontend` and forwards port 80 -> targetPort 80.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: carddemo
    app.kubernetes.io/component: frontend
spec:
  # Stateless static-asset server; one replica suffices for the reference
  # deployment and can be scaled horizontally without shared state.
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: carddemo
        app.kubernetes.io/component: frontend
    spec:
      # Pod-level runtime hardening (MJ-10). nginx in the image runs as uid 101.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: frontend
          # Built by frontend/Dockerfile (build stage FROM node:24; runtime
          # stage serving /usr/share/nginx/html on port 80).
          # Produced by `docker compose build frontend` from frontend/Dockerfile
          # (docker-compose.yml carries a matching `image:` key with these exact
          # registry/name/tag defaults), so this reference resolves to an artifact the
          # repository builds - no undocumented tag-and-push step (QA Issue 17).
          # Override the registry or tag for a private registry with
          # CARDDEMO_IMAGE_REGISTRY / CARDDEMO_IMAGE_TAG at build time.
          image: carddemo/frontend:1.0.0
          imagePullPolicy: IfNotPresent
          # Container-level runtime hardening (MJ-10): drop all capabilities but
          # add back only NET_BIND_SERVICE so the non-root nginx can bind :80;
          # read-only root filesystem with writable emptyDir scratch below.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          ports:
            - name: http
              containerPort: 80
          # Same-origin API base (CR-10): the bundle issues requests to "/api",
          # which nginx reverse-proxies to the api-gateway on the private
          # network. VITE_* is baked at BUILD time (frontend/Dockerfile arg);
          # this runtime value documents the contract. Provided WITHOUT
          # `envFrom` so the frontend never receives DB/Redis secrets.
          env:
            - name: VITE_API_BASE_URL
              value: "/api"
            # Sign-on header AppID: field (legacy EXEC CICS ASSIGN APPLID); also baked
            # at BUILD time by frontend/Dockerfile.
            - name: VITE_APP_ID
              value: "CARDDEMO"
          # Writable scratch required by nginx under the read-only root fs.
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          # nginx static serving is lightweight on CPU and memory.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          # Plain HTTP GET on "/" (nginx serves index.html). No Actuator here.
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
