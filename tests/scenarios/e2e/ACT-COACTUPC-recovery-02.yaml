# COACTUPC cannot save validated account changes when the READ UPDATE of the
# account record does not answer NORMAL.
#
# Step 1: USER0001 signs on through CC00 and COSGN00C routes the type 'U' user
# to the main menu COMEN01 [app/cbl/COSGN00C.cbl:221-237].
# Step 2: option '2' makes COMEN01C transfer control (XCTL) to COACTUPC, the
# 'Account Update' entry of COMEN02Y [app/cpy/COMEN02Y.cpy:31-35]. Entered from
# COMEN01C without CDEMO-PGM-REENTER, COACTUPC sends COACTUP from a cleared map
# with the search-key prompt and returns with TRANSID CAUP
# [app/cbl/COACTUPC.cbl:880-886,964-973,2955-2961].
# Step 3: ENTER with account 00000000001 passes 1210-EDIT-ACCOUNT, then
# 9000-READ-ACCT reads CXACAIX (customer 000000001), ACCTDAT and CUSTDAT, all
# NORMAL, and stores the record as the old values; the details are shown by
# 3202-SHOW-ORIGINAL-VALUES with every editable field unprotected and FSET
# [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3500-3561,3608-3884].
# Step 4: ENTER with the FICO score typed over as 720. Every field comes back,
# 1205-COMPARE-OLD-NEW finds the change and every edit of 1200-EDIT-MAP-INPUTS
# passes, so the state becomes ACUP-CHANGES-OK-NOT-CONFIRMED and the received
# values are shown by 3203-SHOW-UPDATED-VALUES under 'Changes validated.Press F5
# to save', every field protected with MDT on
# [app/cbl/COACTUPC.cbl:1429-1676,2620-2621,2870-2949,2966-2967,3441-3495].
# Step 5: PF5 is valid in that state; 1200 returns before any edit, and
# 9600-WRITE-PROCESSING issues READ UPDATE on ACCTDAT. Any response other than
# NORMAL sets INPUT-ERROR and COULD-NOT-LOCK-ACCT-FOR-UPDATE and skips the
# customer read and both REWRITEs; 2000-DECIDE-ACTION then sets
# ACUP-CHANGES-OKAYED-LOCK-ERROR, so 3250 shows INFORM-FAILURE in INFOMSG and
# the lock message in ERRMSG, 3203 echoes the received values again and 3300
# makes only the account number editable
# [app/cbl/COACTUPC.cbl:905-912,1463-1467,2602-2615,2971-2981,3004-3005,3888-3915].
#
# The fault: another task holds the account record under READ UPDATE while
# this task issues its own. Because the program tests only for NORMAL, the
# screen is the same whatever non-NORMAL response the region gives; a region
# that suspends the task until the holder releases the lock never reaches this
# branch. No adapter can hold an online record lock, so the scenario raises
# MissingPrerequisite under GAP-MIS-014 and stays implemented-unexecuted until
# a mechanism exists.
#
# Expected values are derived from the source (no TPE region runs in CI). The
# account is fixture record 1 of ACCTDATA. Its customer 000000001 is replaced
# by an invented record whose every field passes the COACTUPC edits: the
# repository record's FICO score 274 and its NC zip 12546 would be refused
# [app/cbl/COACTUPC.cbl:2514-2558]. Amounts are S9(10)V99 shown through
# +ZZZ,ZZZ,ZZZ.99, and screen values keep their full BMS width with trailing
# spaces. FKEY05 'F5=Save' and FKEY12 'F12=Cancel' keep their DRK map
# attribute unless 3390-SETUP-INFOMSG-ATTRS brightens them: both for the
# confirmation prompt, only FKEY12 once the save has failed
# [app/cbl/COACTUPC.cbl:3566-3583]; the s3270 screen capture shows a
# zero-intensity field as blanks. CURDATE and CURTIME come from the run clock,
# hence the matchers and clock_mode relative. The UniKix copy of COACTUP.bms
# differs at row 1, columns 1-9 (GAP-DOC-025).
id: ACT-COACTUPC-recovery-02
level: e2e
type: recovery
description: >-
  USER0001 signs on, selects main-menu option 2 (Account Update), fetches
  account 00000000001, changes the FICO score from 700 to 720, has the changes
  validated, and presses PF5 while another task holds the account record for
  update. COACTUPC cannot lock the account record: it shows 'Could not lock
  account record for update' with 'Changes unsuccessful. Please try again',
  keeps the entered values on the screen, and rewrites neither the account nor
  the customer record.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3-5, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on and the menu (CC00, CM00, COSGN00, USRSEC) are verified by
# the SEC and MNU scenarios; INFORM-FAILURE by ACT-COACTUPC-recovery-01; the
# batch record copybooks and the data files at the lowest level that executes
# them.
inventory_ids:
- INV-ACT-051  # COACTUPC message 'Could not lock account record for update' (recovery)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the prompt, detail, confirmation and failure screens
- INV-CFG-009  # CAUP transaction, under which the fetch, the edits and the failing save run
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account read, then the READ UPDATE that fails
- INV-CFG-005  # CUSTDAT CSD file: customer read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code, state and state/zip tables of the step 4 edits
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the field attributes of every send
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER and PF5 paths
- INV-LAY-013  # CSUTLDPY: the date edits of step 4
- INV-LAY-014  # CSUTLDWY: the date edit work areas
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-MIS-014  # no mechanism to hold a record lock in the TPE region
- GAP-DOC-025  # the UniKix COACTUP.bms differs from app/ at row 1, columns 1-9
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    USRSEC: {base: USRSEC}
    # The repository customers, with customer 000000001 replaced by invented
    # data that matches no real person.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
        CUST-ADDR-ZIP: '27601'
        CUST-PHONE-NUM-1: (919)555-0101
        CUST-PHONE-NUM-2: (919)555-0102
        CUST-SSN: '123456789'
        CUST-GOVT-ISSUED-ID: TESTGOVT0001
        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: 'Y'
        CUST-FICO-CREDIT-SCORE: '700'
  parameters:
    clock_mode: relative
  # after 1: the plain READ of ACCTDAT in step 3 succeeds; the lock meets the
  # second ACCTDAT read, the READ UPDATE of step 5.
  faults:
  - target: ACCTDAT
    operation: read
    condition: locked
    after: 1
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACSTFCO: '720'
  - aid: PF5
    '@map': COACTUP
    fields: {}
