<!--
  CardDemo Application Favicon
  
  Credit card icon optimized for favicon sizes (16x16, 32x32, 48x48)
  Features: simplified credit card with chip, compatible with light/dark themes
  Converted from: mainframe 3270 terminal app ID concept
  
  Design specifications:
  - Square viewBox (64x64) for 1:1 aspect ratio
  - Minimal elements for clarity at small sizes
  - Blue color scheme for financial services branding
  - Works on both light and dark browser themes
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle for better visibility on various backgrounds -->
  <circle cx="32" cy="32" r="30" fill="#1976d2" opacity="0.95"/>
  
  <!-- Credit card body with rounded corners -->
  <rect x="14" y="22" width="36" height="24" rx="3" ry="3" fill="#ffffff" opacity="0.98"/>
  
  <!-- Magnetic stripe -->
  <rect x="14" y="28" width="36" height="4" fill="#333333" opacity="0.85"/>
  
  <!-- EMV chip -->
  <rect x="18" y="36" width="8" height="6" rx="1" ry="1" fill="#ffd700" opacity="0.9"/>
  
  <!-- Chip contact lines (simplified) -->
  <line x1="20" y1="37.5" x2="24" y2="37.5" stroke="#333333" stroke-width="0.5" opacity="0.6"/>
  <line x1="20" y1="39" x2="24" y2="39" stroke="#333333" stroke-width="0.5" opacity="0.6"/>
  <line x1="20" y1="40.5" x2="24" y2="40.5" stroke="#333333" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Card number dots (simplified representation) -->
  <circle cx="30" cy="40" r="0.8" fill="#666666" opacity="0.7"/>
  <circle cx="33" cy="40" r="0.8" fill="#666666" opacity="0.7"/>
  <circle cx="36" cy="40" r="0.8" fill="#666666" opacity="0.7"/>
  <circle cx="39" cy="40" r="0.8" fill="#666666" opacity="0.7"/>
  
  <!-- Optional: subtle shadow effect for depth -->
  <ellipse cx="32" cy="46.5" rx="18" ry="1.5" fill="#000000" opacity="0.15"/>
</svg>
