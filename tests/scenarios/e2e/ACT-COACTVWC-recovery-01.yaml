# The account card cross-reference path CXACAIX is out of service when an
# account is looked up. USER0001 (type U) signs on through CC00 and reaches the
# COMEN01C main menu; option 1 transfers control to COACTVWC with
# CDEMO-PGM-CONTEXT 0, whose first entry sends COACTVW with the account-id
# prompt and reads no file [app/cbl/COMEN01C.cbl:117-155]
# [app/cbl/COACTVWC.cbl:282-286,353-360,431-535,577-591].
#
# Account 00000000001 is then entered. CAVW re-enters COACTVWC, the id passes
# the 11-digit non-zero edit, and 9000-READ-ACCT reads CXACAIX by account id
# [app/cbl/COACTVWC.cbl:361-374,596-685,687-699,723-737]. The response
# is neither NORMAL nor NOTFND, so the WHEN OTHER branch sets the error flags,
# moves 'READ' to ERROR-OPNAME and 'CXACAIX ' to ERROR-FILE, the RESP and RESP2
# to ERROR-RESP and ERROR-RESP2, and the composed WS-FILE-ERROR-MESSAGE to
# WS-RETURN-MSG [app/cbl/COACTVWC.cbl:759-766]. No ACCTDAT or CUSTDAT read
# follows [app/cbl/COACTVWC.cbl:697-699]. The repository fixtures hold account
# 00000000001 in CARDXREF, ACCTDATA and CUSTDATA, so the fault is the only
# reason no account is shown.
#
# The composed message is 80 bytes [app/cbl/COACTVWC.cbl:86-105]: 'File Error: ',
# ERROR-OPNAME X(8), ' on ', ERROR-FILE X(9), ' returned RESP ', ERROR-RESP
# X(10), ',RESP2 ', ERROR-RESP2 X(10) and 5 spaces. WS-RETURN-MSG is X(75)
# [app/cbl/COACTVWC.cbl:117], so the trailing 5 spaces are cut, and ERRMSGO
# X(78) pads it with 3 spaces [app/cbl/COACTVWC.cbl:532]. Moving the
# S9(09) COMP RESP fields to X(10) yields their 9 unsigned digits and a space.
#
# Assumption behind the numeric parts: the unikix adapter makes a region file
# unavailable with region_file_disable (tests/adapters/unikix/commands.yaml),
# the CEMT SET FIL(CXACAIX) DIS equivalent, and CICS answers a READ on a
# disabled file with DISABLED, RESP 84 and RESP2 50. Closing the file instead
# would answer NOTOPEN, RESP 19 and RESP2 60 (000000019 and 000000060). The
# expectation is derived from the source and the CICS response codes, never
# observed (GAP-INF-005); an imported UniKix run confirms or replaces it.
#
# The screen after the failed read carries the COACTVWC header, the entered id
# echoed from CC-ACCT-ID [app/cbl/COACTVWC.cbl:468], the account-id prompt
# that 1200-SETUP-SCREEN-VARS restores after 9000-READ-ACCT cleared the info
# message [app/cbl/COACTVWC.cbl:689,528-530], and the error message. No
# account or customer master record was found, so every data field is still
# the LOW-VALUES of 1100-SCREEN-INIT; the map is sent with ERASE and those
# fields have no INITIAL value, so they are captured as spaces at their full
# BMS length [app/cbl/COACTVWC.cbl:432,471-525]. The UniKix copy of COACTVW.bms
# lacks the unnamed field at row 1, columns 1-9 (GAP-DOC-025).
id: ACT-COACTVWC-recovery-01
level: e2e
type: recovery
description: >-
  USER0001 signs on, selects option 1 'Account View' on the main menu and
  enters account 00000000001 while the region file CXACAIX is unavailable.
  COACTVWC's READ of the account card cross-reference path fails with a
  response other than NORMAL or NOTFND, so COACTVW is sent again with the
  entered id, no account or customer data, the prompt 'Enter or update id of
  account to display' and the composed message 'File Error: READ on CXACAIX
  returned RESP <resp>,RESP2 <resp2>'.
# The recovery message is the primary item, then the program, the map the
# option is entered on, the map asserted, the transaction that runs the failing
# step, the CSD file the READ fails on, and the online-only copybooks COACTVWC
# copies. CSUSR01Y, CVACT01Y, CVACT02Y, CVACT03Y, CVCUS01Y and the data files
# are left out: their lowest executing level is a batch scenario.
inventory_ids:
- INV-ACT-019  # COACTVWC message 'File Error: READ on CXACAIX' (recovery)
- INV-ACT-001  # COACTVWC program
- INV-MNU-003  # COMEN01 map, the main menu option 1 is entered on
- INV-ACT-003  # COACTVW map, the screen the failed read is sent on
- INV-CFG-010  # CAVW transaction, which re-enters COACTVWC for the account id
- INV-CFG-006  # CXACAIX CSD file, the alternate-index path the READ fails on
- INV-LAY-002  # COCOM01Y: the COMMAREA whose context selects first entry, then re-entry
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y, copied by COACTVWC
- INV-LAY-009  # CSMSG02Y: the abend data COACTVWC copies
- INV-LAY-011  # CSSTRPFY: the AID mapping that turns ENTER into CCARD-AID-ENTER
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID, echoed into ACCTSID
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived from the source, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-MIS-011  # no confirmed region file control to make CXACAIX unavailable
- GAP-DOC-025  # the UniKix COACTVW.bms differs from app/ at row 1, columns 1-9
preconditions:
  datasets:
    USRSEC: {base: USRSEC}
    ACCTDATA: {base: ACCTDATA}
    CUSTDATA: {base: CUSTDATA}
    CARDXREF: {base: CARDXREF}
  parameters:
    clock_mode: relative
  # Applied after the sign-on step and before the failing one, as every online
  # unavailable fault is; no step reaches CXACAIX before the account lookup of
  # step 3. An adapter without region file control raises MissingPrerequisite
  # under GAP-MIS-011.
  faults:
  - target: CXACAIX
    operation: read
    condition: unavailable
# PASSWORD is the README's documented demo password, not a secret: the scenario
# schema accepts no other sign-on password.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields: {USERID: USER0001, PASSWD: PASSWORD}
  - aid: ENTER
    '@map': COMEN01
    fields: {OPTION: '1'}
  - aid: ENTER
    '@map': COACTVW
    fields: {ACCTSID: '00000000001'}
expected:
  # Text fields keep their full BMS length with trailing spaces: ERRMSG is 78
  # characters, INFOMSG 45, the titles 40.
  screens:
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    OPTN001: '01. Account View                        '
    ERRMSG: '                                                                              '
  - '@map': COACTVW
    TRNNAME: CAVW
    PGMNAME: COACTVWC
    ACCTSID: '           '
    INFOMSG: 'Enter or update id of account to display     '
    ERRMSG: '                                                                              '
  - '@map': COACTVW
    TRNNAME: CAVW
    PGMNAME: COACTVWC
    TITLE01: '      AWS Mainframe Modernization       '
    TITLE02: '              CardDemo                  '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    ACCTSID: '00000000001'
    ACSTTUS: ' '
    ADTOPEN: '          '
    ACRDLIM: '               '
    AEXPDT: '          '
    ACSHLIM: '               '
    AREISDT: '          '
    ACURBAL: '               '
    ACRCYCR: '               '
    AADDGRP: '          '
    ACRCYDB: '               '
    ACSTNUM: '         '
    ACSTSSN: '            '
    ACSTDOB: '          '
    ACSTFCO: '   '
    ACSFNAM: '                         '
    ACSMNAM: '                         '
    ACSLNAM: '                         '
    ACSADL1: '                                                  '
    ACSSTTE: '  '
    ACSADL2: '                                                  '
    ACSZIPC: '     '
    ACSCITY: '                                                  '
    ACSCTRY: '   '
    ACSPHN1: '             '
    ACSGOVT: '                    '
    ACSPHN2: '             '
    ACSEFTC: '          '
    ACSPFLG: ' '
    INFOMSG: 'Enter or update id of account to display     '
    ERRMSG: 'File Error: READ     on CXACAIX   returned RESP 000000084 ,RESP2 000000050    '
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'File Error: READ     on CXACAIX   returned RESP 000000084 ,RESP2 000000050    '
