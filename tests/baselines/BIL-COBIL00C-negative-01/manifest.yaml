# Manifest of the derived baseline of BIL-COBIL00C-negative-01: PF5 on the
# Bill Payment screen COBIL00. Only unikix can run the scenario, so
# expected.yaml was authored from the WHEN OTHER branch of COBIL00C's EVALUATE
# EIBAID, which moves CCDA-MSG-INVALID-KEY of CSMSG01Y to WS-MESSAGE and sends
# COBIL00 again [app/cbl/COBIL00C.cbl:125-142] [app/cpy/CSMSG01Y.cpy:20-21],
# not captured, and is inferred-not-observed (GAP-INF-008, GAP-INF-012). It
# names no execution_id or execution_fingerprint and holds no datasets/ until
# report.py --import-unikix promotes an eligible UniKix run.
#
# source_identity.units are the app/ sources the three steps execute, not only
# COBIL00C, COBIL00.bms and CSMSG01Y: the COPY closure
# (inventory_tools.copy_closure) of COSGN00C, which signs USER0001 on and
# XCTLs to COMEN01C [app/cbl/COSGN00C.cbl:230-240]; of COMEN01C, whose option
# 10 XCTLs to COBIL00C [app/cpy/COMEN02Y.cpy:80-84]
# [app/cbl/COMEN01C.cbl:145-155]; and of COBIL00C; plus the BMS sources of
# the maps COSGN00, COMEN01 and COBIL00. A source identity names every program
# that ran, and expected.yaml asserts the COMEN01 screen COMEN01C sends and the
# COTTL01Y and CSDAT01Y header fields. COBIL00C CALLs no other app/ unit.
# DFHAID and DFHBMSCA are CICS-supplied, not app/ sources.
