# Ledger posting service configuration, in one document.
# Every value reads an environment variable and falls back to the default that
# card-platform/.env.example documents.
# Source: app/cbl/CBTRN02C.cbl, invoked at app/jcl/POSTTRAN.jcl:L23.
# Rationale for the settings below: card-platform/docs/decision-log.md

spring:
  application:
    name: ledger-posting-service

  # This service's own database, carddemo_ledger, holding the one schema named
  # below. It reaches no other database and reads no other schema.
  datasource:
    # sslmode=require encrypts this connection and stops the driver from falling back to
    # cleartext. It does not verify the certificate, since a direct run has no
    # certificate authority to verify against. The compose stack overrides this whole URL
    # with the same mode, against a server presenting a certificate it generated for
    # itself. deploy/k8s/30-configmap.yaml overrides it with verify-full, because a
    # cluster has an authority.
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${LEDGER_DB_NAME:carddemo_ledger}?currentSchema=${LEDGER_DB_SCHEMA:ledger_service}&sslmode=require}"
    # This service's own login, which owns one database on the compose path and one schema on
    # the cluster path. The superuser is not the default here. A login name is not a
    # credential and carries a default; the password below carries none.
    username: "${SPRING_DATASOURCE_USERNAME:${LEDGER_DB_USER:carddemo_ledger_svc}}"
    # No fallback. An unset password stops start-up rather than signing on under a
    # password this repository publishes. docker-compose.yml sets
    # SPRING_DATASOURCE_PASSWORD; a direct run sets POSTGRES_PASSWORD.
    password: "${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}"
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: "${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:3000}"
      validation-timeout: "${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:2000}"

  # Jakarta Persistence API (JPA) settings. Hibernate validates its mapping
  # against the migrated schema at startup and writes no schema object.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: "${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:${LEDGER_DB_SCHEMA:ledger_service}}"
        auto_quote_keyword: true

  # Schema migration. Flyway creates the schema when absent, then applies the
  # Data Definition Language (DDL) migrations under db/migration.
  flyway:
    enabled: true
    schemas: "${SPRING_FLYWAY_SCHEMAS:${LEDGER_DB_SCHEMA:ledger_service}}"
    default-schema: "${SPRING_FLYWAY_DEFAULT_SCHEMA:${LEDGER_DB_SCHEMA:ledger_service}}"
    create-schemas: true
    baseline-on-migrate: false
    validate-on-migrate: true

  kafka:
    # kafka:29092 is the internal listener docker-compose.yml publishes, which is the one
    # context a shipped default can be correct in. deploy/k8s/30-configmap.yaml overrides it
    # to kafka:9092, and a run straight on the host sets KAFKA_BOOTSTRAP_SERVERS to
    # localhost:9092. The other five services carry the same default.
    bootstrap-servers: "${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}}"
    admin:
      operation-timeout: "${SPRING_KAFKA_ADMIN_OPERATION_TIMEOUT:3s}"

    # Broker authentication. The broker requires a Simple Authentication and Security
    # Layer (SASL) identity on every client listener, and its authorizer refuses any
    # operation no access control entry allows. This service therefore reaches exactly
    # the topics and the consumer group its own configuration names.
    # docker-compose.yml installs that matrix at broker start and
    # deploy/k8s/10-kafka.yaml installs the same one.
    #
    # SASL_PLAINTEXT authenticates without encrypting, and is the shipped default the
    # compose stack runs. The broker publishes on the loopback address alone, and every
    # service reaches it across one Docker bridge on one machine.
    # deploy/k8s/30-configmap.yaml sets SASL_SSL instead, because a cluster pod network
    # is a shared path, and supplies the truststore by environment as
    # SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION and _PASSWORD. Those two keys are
    # absent here.
    security:
      protocol: "${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}"
    properties:
      sasl.mechanism: "${KAFKA_SASL_MECHANISM:PLAIN}"
      # A username is not a credential and carries a default. The password carries none,
      # so an unset variable stops start-up rather than presenting a password this
      # repository publishes. card-platform/.env.example documents both.
      sasl.jaas.config: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_SASL_USERNAME:carddemo-ledger}"
        password="${KAFKA_SASL_PASSWORD}";

    # Idempotent production with acknowledgement from every in-sync replica.
    #
    # Both serializers take text. outbox/OutboxWriter.java writes the event as JSON and
    # the payload column of outbox_event stores that text, so a relay publishing a row
    # hands the template a String. Do NOT name
    # com.carddemo.events.serde.JsonSchemaValidatingSerializer here. It accepts one of
    # the registered event records and refuses every other value, including this text.
    # The schema gate runs at write time, inside OutboxWriter, where a rejected event
    # still rolls back its own transaction.
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        max.block.ms: 5000

    # Manual acknowledgement, with automatic commit disabled, under a group of
    # this service's own. messaging/TransactionAuthorizedConsumer reads
    # carddemo.kafka.topics.transaction-authorized under this group.
    consumer:
      group-id: "${SPRING_KAFKA_CONSUMER_GROUP_ID:${GROUP_LEDGER_POSTING:ledger-posting}}"
      enable-auto-commit: false
      auto-offset-reset: "${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}"
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer wraps the delegate named below. A failure raised
      # inside poll then arrives as a record the error handler routes.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: com.carddemo.events.serde.JsonSchemaValidatingDeserializer

    # manual_immediate commits the offset the moment the listener acknowledges, which
    # is after its own writes and its processed-event marker commit.
    listener:
      ack-mode: manual_immediate

# Properties this module owns.
carddemo:
  kafka:
    topics:
      transaction-authorized: "${TOPIC_TRANSACTION_AUTHORIZED:transaction.authorized}"
      transaction-posted: "${TOPIC_TRANSACTION_POSTED:transaction.posted}"
      transaction-declined: "${TOPIC_TRANSACTION_DECLINED:transaction.declined}"
      # The shared name is a fallback. Normal failures route to <source-topic><suffix>, which keeps
      # event formats separate and lets each recovery consumer bind one schema.
      dead-letter: "${TOPIC_DEAD_LETTER:carddemo.dead-letter}"
      dead-letter-suffix: "${TOPIC_DEAD_LETTER_SUFFIX:.DLT}"

  # Delivery attempts a consumer makes, and the wait between two attempts.
  consumer:
    retry:
      max-attempts: "${CONSUMER_MAX_RETRY_ATTEMPTS:3}"
      backoff-ms: "${CONSUMER_RETRY_BACKOFF_MS:1000}"

  # Sweep interval and claim size for unpublished outbox rows.
  outbox:
    relay:
      fixed-delay-ms: "${OUTBOX_RELAY_INTERVAL_MS:500}"
      batch-size: "${OUTBOX_RELAY_BATCH_SIZE:100}"
      instance-id: "${OUTBOX_RELAY_INSTANCE_ID:${HOSTNAME:ledger-relay}}"
      claim-timeout: "${OUTBOX_RELAY_CLAIM_TIMEOUT:PT2M}"
    # Retention. A published row has done its work and stays only for diagnosis, and a
    # processed-event marker matters only while a redelivery of its event is still
    # possible. domain/RetentionSweep calls the two repository purge methods on the
    # configured interval, and ix_outbox_event_published_at plus
    # ix_processed_event_processed_at serve those deletes.
    published-retention-hours: "${OUTBOX_PUBLISHED_RETENTION_HOURS:168}"
  processed-event:
    marker-retention-hours: "${PROCESSED_EVENT_RETENTION_HOURS:168}"
  retention:
    sweep-interval-ms: "${RETENTION_SWEEP_INTERVAL_MS:3600000}"

# The container listens on 8080. docker-compose.yml publishes host port 8082.

  # Request identities. config/SecurityConfig maps each entry onto one Spring Security
  # user. Start-up fails when this list is empty, rather than running with no identity
  # at all.
  #
  # password holds an ALREADY-ENCODED value carrying its algorithm prefix, for example
  # {bcrypt}$2a$10$... A plaintext value authenticates nothing, so this platform does
  # not reproduce the plaintext comparison at app/cbl/COSGN00C.cbl:L223.
  # card-platform/.env.example documents the three variables and how to generate a
  # hash. None of them holds a usable default, so an unset variable stops start-up.
  #
  # role is ADMIN, USER or MONITORING. ADMIN and USER are the two outcomes of the
  # SEC-USR-TYPE fork at app/cbl/COSGN00C.cbl:L232-L236. MONITORING is additive: it
  # reaches the metrics and Prometheus endpoints on the management port and no business
  # route at all.
  #
  # scopes carries what an ordinary identity owns, one authority per entitlement:
  # SCOPE_ACCOUNT_<eleven digits>, SCOPE_CUSTOMER_<nine digits> or
  # SCOPE_CARD_<card token>. Each identifier is written exactly as its column holds
  # it, leading zeros included, and a card token is the 64 lower-case hexadecimal
  # characters PanMasker.tokenOf produces for that card number. An ADMIN entry needs none: it
  # passes every ownership check by role.
  security:
    users:
      - username: ${ADMIN_USERNAME:admin001}
        password: ${ADMIN_PASSWORD_HASH}
        role: ADMIN
      - username: ${USER_USERNAME:user0001}
        password: ${USER_PASSWORD_HASH}
        role: USER
        scopes: ${USER_SCOPES:}
      - username: ${MONITORING_USERNAME:monitor01}
        password: ${MONITORING_PASSWORD_HASH}
        role: MONITORING

server:
  port: 8080

  # Transport Layer Security for the Representational State Transfer surface, off in the
  # shipped file and on in the cluster. The compose stack runs every service on one
  # Docker bridge on one machine and publishes each port on the loopback address alone.
  # A cluster pod network is a shared path, so deploy/k8s/30-configmap.yaml sets
  # SERVER_SSL_ENABLED to true and names the keystore deploy/k8s/31-secret.example.yaml
  # templates.
  #
  # Every value below carries a default, and the keystore password defaults to empty
  # rather than absent. Enabling the first key without the other three is what fails,
  # loudly, at start-up.
  ssl:
    enabled: "${SERVER_SSL_ENABLED:false}"
    key-store: "${SERVER_SSL_KEYSTORE:}"
    key-store-type: "${SERVER_SSL_KEYSTORE_TYPE:PKCS12}"
    key-store-password: "${SERVER_SSL_KEYSTORE_PASSWORD:}"

management:
  # /actuator answers on this port and never on the service port above, so a
  # client of the Representational State Transfer (REST) surface reaches no
  # runtime, database or broker internals. docker-compose.yml publishes this port
  # on the loopback address alone.
  server:
    port: ${MANAGEMENT_PORT:9080}
    # The management port carries the same posture as the service port above, declared
    # rather than inherited. A monitoring credential travelling to a collector deserves
    # the protection a cardholder identifier gets. A Kubernetes
    # probe against an encrypted management port needs scheme HTTPS, which
    # deploy/k8s/40-authorization-service.yaml sets.
    ssl:
      enabled: "${MANAGEMENT_SSL_ENABLED:${SERVER_SSL_ENABLED:false}}"
      key-store: "${SERVER_SSL_KEYSTORE:}"
      key-store-type: "${SERVER_SSL_KEYSTORE_TYPE:PKCS12}"
      key-store-password: "${SERVER_SSL_KEYSTORE_PASSWORD:}"
  # config/SecurityConfig secures this surface. /actuator/health answers without a
  # credential, because a container health check and a Kubernetes probe carry none.
  # Every other endpoint below requires ROLE_MONITORING. An anonymous caller receives
  # 401, and an identity holding a business role receives 403.
  endpoints:
    web:
      exposure:
        include: "${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:${MANAGEMENT_ENDPOINTS:health,metrics,prometheus}}"
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,kafka,listeners,outbox
  prometheus:
    metrics:
      export:
        enabled: true

# Structured console output. This module carries no logging configuration file.
logging:
  structured:
    format:
      console: logstash
  level:
    root: "${LOGGING_LEVEL_ROOT:${LOG_LEVEL:INFO}}"
    com.carddemo: "${LOGGING_LEVEL_COM_CARDDEMO:${LOG_LEVEL_CARDDEMO:DEBUG}}"
