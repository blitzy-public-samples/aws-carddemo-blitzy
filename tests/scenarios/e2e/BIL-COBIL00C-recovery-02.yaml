# COBIL00C cannot record the paid-off balance of a confirmed bill payment when
# the REWRITE of the account to ACCTDAT fails with an I/O error, yet the
# payment transaction it has just written to TRANSACT stays.
#
# Step 1: USER0001 signs on through CC00; COSGN00C routes the type 'U' user to
# COMEN01C, which sends the main menu COMEN01 headed CM00/COMEN01C
# [app/cbl/COSGN00C.cbl:221-239] [app/cbl/COMEN01C.cbl:82-90].
# Step 2: option '10' is 'Bill Payment', user type U, program COBIL00C, within
# the 10 options of COMEN02Y [app/cpy/COMEN02Y.cpy:21,80-84]. COMEN01C resets
# the program context and transfers control (XCTL) to COBIL00C
# [app/cbl/COMEN01C.cbl:115-156]. Entered without CDEMO-PGM-REENTER and with no
# transaction selected (the COMMAREA COMEN01C passes ends before
# CDEMO-CB00-INFO, so the move pads it with spaces), COBIL00C sets the re-enter
# flag, moves LOW-VALUES to COBIL0AO and sends COBIL00 with its header and a
# blank message [app/cbl/COBIL00C.cbl:107-122,289-338].
# Step 3: ENTER with Acct ID 00000000001 and CONFIRM Y, under CB00:
# - READ ACCTDAT with UPDATE is NORMAL, and the balance 194.00 is edited
#   through WS-CURR-BAL (PIC +9999999999.99) into CURBAL
#   [app/cbl/COBIL00C.cbl:170-194,343-372]. The balance is above zero, so the
#   payment proceeds [app/cbl/COBIL00C.cbl:197-206].
# - READ CXACAIX by account is NORMAL (card 9680294154603697); STARTBR
#   TRANSACT at HIGH-VALUES and READPREV return the highest key,
#   0000000996722787, and the payment record is built with TRAN-ID
#   0000000996722788, type '02', category 2, source 'POS TERM', TRAN-AMT
#   194.00 and both timestamps from ASKTIME/FORMATTIME
#   [app/cbl/COBIL00C.cbl:210-232,249-267,408-505].
# - The WRITE is NORMAL: INITIALIZE-ALL-FIELDS moves SPACES to the account id,
#   CURBAL, CONFIRM and WS-MESSAGE, and COBIL00 is sent with 'Payment
#   successful.  Your Transaction ID is 0000000996722788.'
#   [app/cbl/COBIL00C.cbl:522-532,560-566].
# - No RETURN follows that SEND: COMPUTE ACCT-CURR-BAL = ACCT-CURR-BAL -
#   TRAN-AMT leaves 0.00 in working storage, and UPDATE-ACCTDAT-FILE REWRITEs
#   the record the READ UPDATE holds [app/cbl/COBIL00C.cbl:233-235,377-385].
#   The REWRITE answers IOERR, neither NORMAL nor NOTFND, so WHEN OTHER
#   DISPLAYs RESP and RESP2 to the region log (not asserted), sets the error
#   flag, moves 'Unable to Update Account...' to WS-MESSAGE, the primary item,
#   puts the cursor on ACTIDIN and sends COBIL00 again
#   [app/cbl/COBIL00C.cbl:396-402].
# - SEND-BILLPAY-SCREEN runs once more with WS-MESSAGE unchanged, and the task
#   ends with RETURN TRANSID CB00 [app/cbl/COBIL00C.cbl:242,146-149]. Each SEND
#   is issued with ERASE, so the terminal holds the last one: the success
#   message never stays on the screen.
# The REWRITE is coded with RESP, so its IOERR is handled by that WHEN OTHER
# branch instead of abending the task. ENDBR, ASKTIME, FORMATTIME, the SENDs
# and the RETURN are coded without RESP, and the scenario assumes they complete
# normally [app/cbl/COBIL00C.cbl:146-149,251-261,295-301,503-505]. COBIL00C
# issues no SYNCPOINT ROLLBACK. ACCTDAT and TRANSACT are defined RECOVERY(NONE)
# [app/csd/CARDDEMO.CSD:1-12,76-87], so nothing would be backed out in any
# case: the normal end of task keeps the WRITE, and the failed REWRITE changed
# nothing, so account 00000000001 keeps its balance of 194.00. The READ UPDATE
# lock is released at task end.
#
# Finding: TRANSACT holds a 194.00 bill-payment transaction while the account
# still owes 194.00, and the screen reports the update as failed without
# saying that the payment transaction was recorded. It is pinned as derived.
# No GAP-DEF entry of the register covers it, so the scenario carries no
# suspected-defect tag, which needs one; the finding lives in this description
# only.
#
# No adapter can return an I/O error from a region file operation, so the
# scenario raises MissingPrerequisite under GAP-MIS-014 and stays
# implemented-unexecuted until a mechanism exists.
#
# Expected values are derived from the source (no TPE region runs in CI); the
# UniKix copy's COBIL00C.cl2 equals app/'s. Text values keep their full BMS
# field width with trailing spaces: ERRMSG is the first 78 bytes of the 80-byte
# WS-MESSAGE. CURDATE, CURTIME and the payment timestamps come from the run
# clock, hence the matchers and clock_mode relative.
id: BIL-COBIL00C-recovery-02
level: e2e
type: recovery
description: >-
  USER0001 signs on, chooses main-menu option 10 (Bill Payment) and confirms
  the payment of account 00000000001's balance of 194.00 with CONFIRM Y while
  the REWRITE of the account to ACCTDAT fails with an I/O error. COBIL00C has
  already written payment transaction 0000000996722788 for 194.00 to TRANSACT
  and sent 'Payment successful', then shows 'Unable to Update Account...' on
  COBIL00 with the account id, balance and CONFIRM cleared. The account keeps
  its balance of 194.00, and TRANSACT keeps the new record, since the program
  issues no rollback and the files are not recoverable. Finding: a payment
  transaction is recorded for a balance that is never paid off, while the
  screen reports only the failed update.
# Primary item first, then the program, the maps asserted, the transaction
# step 3 runs under, the CSD files COBIL00C reads, browses, writes and
# rewrites, and the online-only copybooks it copies. Sign-on and the menu
# option (CC00, CM00, COSGN00, USRSEC) are verified by the SEC and MNU
# scenarios; the batch record copybooks (CVACT01Y, CVACT03Y, CVTRA05Y) and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-BIL-010  # COBIL00C message 'Unable to Update Account...' (recovery)
- INV-BIL-001  # COBIL00C program
- INV-MNU-003  # COMEN01 map, where option 10 is entered
- INV-BIL-002  # COBIL00 map, the bill payment screen of steps 2 and 3
- INV-CFG-012  # CB00 transaction, under which COBIL00C receives the payment
- INV-CFG-001  # ACCTDAT CSD file: read for update, the target of the failing REWRITE
- INV-CFG-006  # CXACAIX CSD file: cross-reference read by account id
- INV-CFG-007  # TRANSACT CSD file: browsed backwards and written
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the program context
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE, CURTIME and the WS-TIMESTAMP of the payment record
- INV-LAY-008  # CSMSG01Y, copied by COBIL00C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-008  # bill payment (BIL) end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-MIS-014  # no mechanism to return an I/O error from a region file operation
# TRANSACT is a built dataset with no repository data of its own, so the
# schema refuses it as a base: it is loaded from the repository's 300 daily
# transactions (the same 350-byte shape as TRAN-RECORD), keyed by TRAN-ID, so
# the backward browse finds 0000000996722787 as the highest key. CARDXREF is
# the region's CCXREF file and the CXACAIX path; USRSEC holds the demo users.
preconditions:
  datasets:
    USRSEC: {base: USRSEC}
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    TRANSACT: {base: DALYTRAN}
  parameters:
    clock_mode: relative
  # No `after`: the REWRITE of step 3 is the only ACCTDAT rewrite of the
  # scenario, and the READ UPDATE before it succeeds.
  faults:
  - target: ACCTDAT
    operation: rewrite
    condition: io-error
# PASSWORD is the README's documented demo password, not a secret: the
# scenario schema accepts no other sign-on password.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: USER0001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '10'}
    '@map': COMEN01
  - aid: ENTER
    fields: {ACTIDIN: '00000000001', CONFIRM: 'Y'}
    '@map': COBIL00
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    OPTN010: '10. Bill Payment                        '
    ERRMSG: '                                                                              '
  - '@map': COBIL00
    TRNNAME: CB00
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COBIL00C
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ACTIDIN: '           '
    CURBAL: '              '
    CONFIRM: ' '
    ERRMSG: '                                                                              '
  # The last of the three sends of step 3: INITIALIZE-ALL-FIELDS after the
  # successful WRITE left the account id, CURBAL and CONFIRM as spaces, and the
  # failure message replaced the success message.
  - '@map': COBIL00
    TRNNAME: CB00
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COBIL00C
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ACTIDIN: '           '
    CURBAL: '              '
    CONFIRM: ' '
    ERRMSG: 'Unable to Update Account...                                                   '
  # The ERRMSG value of each step: blank on the menu and on the first COBIL00
  # send, then the failure message.
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'Unable to Update Account...                                                   '
  file_state:
    # The WRITE stands: the 300 fixture records plus the payment record, which
    # takes the highest key and so comes last in key order. Both timestamps are
    # WS-TIMESTAMP: the run date, a blank, the time with ':' separators and
    # '.000000' [app/cpy/CSDAT01Y.cpy:43-57] [app/cbl/COBIL00C.cbl:263-266].
    TRANSACT:
      count: 301
      contains:
      - TRAN-ID: '0000000996722788'
        TRAN-TYPE-CD: '02'
        TRAN-CAT-CD: '2'
        TRAN-SOURCE: 'POS TERM  '
        TRAN-DESC: 'BILL PAYMENT - ONLINE                                                                               '
        TRAN-AMT: '194.00'
        TRAN-MERCHANT-ID: '999999999'
        TRAN-MERCHANT-NAME: 'BILL PAYMENT                                      '
        TRAN-MERCHANT-CITY: 'N/A                                               '
        TRAN-MERCHANT-ZIP: 'N/A       '
        TRAN-CARD-NUM: '9680294154603697'
        TRAN-ORIG-TS: {match: run-timestamp, format: '%Y-%m-%d %H:%M:%S.000000'}
        TRAN-PROC-TS: {match: run-timestamp, format: '%Y-%m-%d %H:%M:%S.000000'}
    # The failed REWRITE changes nothing: account 00000000001 keeps every
    # loaded value, its balance of 194.00 included, and the other 49 accounts
    # are untouched.
    ACCTDATA:
      count: 50
      contains:
      - ACCT-ID: '1'
        ACCT-ACTIVE-STATUS: 'Y'
        ACCT-CURR-BAL: '194.00'
        ACCT-CREDIT-LIMIT: '2020.00'
        ACCT-CASH-CREDIT-LIMIT: '1020.00'
        ACCT-OPEN-DATE: '2014-11-20'
        ACCT-EXPIRAION-DATE: '2025-05-20'
        ACCT-REISSUE-DATE: '2025-05-20'
        ACCT-CURR-CYC-CREDIT: '0.00'
        ACCT-CURR-CYC-DEBIT: '0.00'
        ACCT-ADDR-ZIP: 'A000000000'
        ACCT-GROUP-ID: '          '
