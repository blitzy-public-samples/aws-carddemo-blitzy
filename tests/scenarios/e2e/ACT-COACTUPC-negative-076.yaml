# COACTUPC refuses a Date of Birth month that is not a number: the TEST-NUMVAL
# predicate of EDIT-MONTH, which COACTUPC copies from CSUTLDPY, for the Date of
# Birth field [app/cpy/CSUTLDPY.cpy:91-147] [app/cbl/COACTUPC.cbl:1533-1543].
#
# This id carries the month-numeric item INV-ACT-134, not the month 1-12 item
# INV-ACT-133 its plan named: per-type numbers follow inventory order, as for
# the other date fields (negative-016/017, -031/032, -046/047), so the month
# 1-12 case of Date of Birth is ACT-COACTUPC-negative-075 and this one follows.
#
# Steps 1-3 sign on as USER0001, choose main-menu option 2 and fetch account
# 00000000001, as ACT-COACTUPC-alternate-04 does: CXACAIX gives customer
# 000000001 (card 9680294154603697, line 49 of app/data/ASCII/cardxref.txt),
# ACCTDAT and CUSTDAT are read without UPDATE, and 3202-SHOW-ORIGINAL-VALUES
# shows the records with 'Update account details presented above.', the birth
# month as 06; every editable field is DFHBMFSE (unprotected, MDT on), so all
# of them come back on the next AID [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,
# 3500-3561,3608-3884]. Step 4 types 1A over the birth month and presses ENTER.
# - 1100-RECEIVE-MAP moves the 1A, being neither '*' nor spaces, to
#   ACUP-NEW-CUST-DOB-MON. DOBMON fills its two positions, so JUSTIFY=(RIGHT)
#   pads nothing [app/cbl/COACTUPC.cbl:1263-1268] [app/bms/COACTUP.bms:299-303].
# - 1205-COMPARE-OLD-NEW finds the birth date 19611A08 different from the
#   fetched 19610608, so 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs
#   the field edits in screen order [app/cbl/COACTUPC.cbl:1460-1470,1681-1770].
# - Account Status, Open Date (2014-11-20), Credit Limit, Expiry Date
#   (2025-05-20), Cash Credit Limit, Reissue Date (2025-05-20), the three
#   amounts and the SSN (123, 45, 6789) pass on the fetched values. Each of the
#   three dates passes every CSUTLDPY check and reaches EDIT-DATE-LE, so
#   CSUTLDTC is called for it with mask YYYYMMDD and must return severity 0
#   [app/cbl/COACTUPC.cbl:1472-1531,2431-2489] [app/cpy/CSUTLDPY.cpy:284-313].
# - Date of Birth is next: 'Date of Birth' goes to WS-EDIT-VARIABLE-NAME and
#   19611A08 to WS-EDIT-DATE-CCYYMMDD, and EDIT-DATE-CCYYMMDD runs through its
#   exit: EDIT-YEAR-CCYY accepts 1961 (century 19) [app/cpy/CSUTLDPY.cpy:18-90].
# - EDIT-MONTH: 1A is not blank. WS-VALID-MONTH (VALUES 1 THROUGH 12) tests
#   the PIC 9(2) WS-EDIT-DATE-MM-N that redefines the month, and 1A (x'F1C1')
#   reads as 11, whether packed (digits 1 and 1, sign C) or compared as
#   characters (between '01' and '12'), so that test passes
#   [app/cpy/CSUTLDWY.cpy:16-20]. FUNCTION TEST-NUMVAL(1A) is not 0, so the
#   ELSE sets INPUT-ERROR and FLG-MONTH-NOT-OK and, the message being still
#   off, STRINGs the trimmed field name and ': Month must be a number between
#   1 and 12.' into WS-RETURN-MSG [app/cpy/CSUTLDPY.cpy:110-138]. The GnuCOBOL
#   probe recorded in ACT-COACTUPC-negative-017 found the same for this code.
# - EDIT-DAY passes 08; EDIT-DAY-MONTH-YEAR finds no 31st, 30th or 29th, and
#   with the month flag set the date is not valid, so the birth date is not
#   passed to CSUTLDTC, and WS-EDIT-DT-OF-BIRTH-ISVALID being false,
#   EDIT-DATE-OF-BIRTH does not run either [app/cpy/CSUTLDPY.cpy:150-282]
#   [app/cbl/COACTUPC.cbl:1539-1543]. Every later edit passes on the invented
#   customer below, and an edit writes its message only while
#   WS-RETURN-MSG-OFF holds, so this message stays.
# - INPUT-ERROR leaves ACUP-CHANGES-NOT-OK, which 2000-DECIDE-ACTION only
#   continues on: no READ UPDATE or REWRITE runs [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values, 1A included, with the
#   valid amounts re-edited through +ZZZ,ZZZ,ZZZ.99; 3250-SETUP-INFOMSG sets
#   PROMPT-FOR-CHANGES and moves WS-RETURN-MSG to ERRMSG; 3300 keeps the
#   fields editable, CSSETATY turns DOBMON red and the cursor goes to it; 3390
#   makes F12=Cancel bright, while F5=Save stays dark without a confirmation
#   prompt [app/cbl/COACTUPC.cbl:2870-2951,2927-2929,3094-3096,3322-3326,
#   3566-3581].
#
# The input is 1A, not the 17 of the plan: 17 fails WS-VALID-MONTH and is
# refused by the month 1-12 predicate (INV-ACT-133, CSUTLDPY lines 117-121)
# without reaching the numeric predicate this scenario verifies. Both
# predicates compose the same text, so only the input decides which predicate
# is exercised. A host that compared the zoned month as ASCII characters would
# refuse 1A (x'3141' sorts above '12') at the range check instead; whether an
# app/ build on the UniKix host does so stays open with that build
# (GAP-MIS-008, which lists this item).
#
# Expected values are derived from the source (no TPE region runs in CI):
# - ERRMSG is 'Date of Birth' (the trimmed X(25) WS-EDIT-VARIABLE-NAME) and
#   ': Month must be a number between 1 and 12.', 55 characters, in the
#   75-byte WS-RETURN-MSG and the 78-byte ERRMSGO.
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   FKEY05 is dark (ASKIP,DRK) and the s3270 capture renders it as blanks.
# - The tpe adapter enters a field with EraseEOF before typing. No upper-case
#   translation of input is assumed: CARDDEMO.CSD defines none for CAUP.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every other
# COACTUPC edit: the repository record has FICO 274, below 300, and zip 12546,
# which is not a North Carolina zip [app/cbl/COACTUPC.cbl:2514-2558]. Area code
# 919 is a general-purpose code and NC27 a valid state and zip pair
# [app/cpy/CSLKPCDY.cpy:521,895,1186]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-076
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001 with its customer 000000001, changes the birth month
  from 06 to 1A and presses ENTER. COACTUPC refuses the value: the message
  line shows 'Date of Birth: Month must be a number between 1 and 12.', the
  screen keeps the entered values, 1A included, editable under 'Update
  account details presented above.', and F12=Cancel is shown while F5=Save is
  not. Nothing is saved: ACCTDATA and CUSTDATA still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-134  # COACTUPC Date of Birth: month numeric (EDIT-MONTH TEST-NUMVAL edit)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute set on DOBMON
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-MONTH, the refusing edit
- INV-LAY-014  # CSUTLDWY: WS-EDIT-DATE-MM and its WS-VALID-MONTH redefinition
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY tests the month with IS NUMERIC instead of TEST-NUMVAL
# and drops FUNCTION TRIM from the field name, so the ERRMSG of screen 4
# differs on UniKix.
- GAP-DOC-024
# Open, Expiry and Reissue Date are edited first and each is passed to
# CSUTLDTC, so the expected message rests on CEEDAYS accepting 20141120 and
# 20250520 (GAP-INF-001), and the UniKix CSUTLDTC changes the Vstring lengths
# of those calls (GAP-DOC-021).
- GAP-INF-001
- GAP-DOC-021
# The UniKix COACTUPC comments out the amount checks of 1250-EDIT-SIGNED-9V2,
# whose flags decide how screen 4 shows the amounts.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
        CUST-ADDR-ZIP: '27601'
        CUST-PHONE-NUM-1: (919)555-0101
        CUST-PHONE-NUM-2: (919)555-0102
        CUST-SSN: '123456789'
        CUST-GOVT-ISSUED-ID: TESTGOVT0001
        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: Y
        CUST-FICO-CREDIT-SCORE: '700'
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
# PASSWORD is the documented demo password of README.md, not a secret.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  # 1A, not 17: 17 fails the month 1-12 check first (see the header).
  - aid: ENTER
    '@map': COACTUP
    fields:
      DOBMON: '1A'
