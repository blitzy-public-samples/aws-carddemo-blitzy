# Derived baseline of scenario SEC-COSGN00C-normal-01: ADMIN001 signs on
# through CC00 and lands on the admin menu. Authored from the source, never
# captured: app/cbl/COSGN00C.cbl:73-260 with app/bms/COSGN00.bms (the sign-on
# read and the type-A XCTL), and app/cbl/COADM01C.cbl with app/bms/COADM01.bms
# (the first-entry send of COADM01). Open until a UniKix run is imported:
# GAP-INF-002 (derived SEC end-to-end baselines) and GAP-INF-012 (online-only
# copybooks).
# The scenario has one step, so there is one screen: the one shown after ENTER
# is pressed on the step's input map COSGN00. Values are full BMS field width
# with their trailing spaces; messages holds that screen's ERRMSG.
messages:
- '                                                                              '
screens:
- '@map': 'COADM01'
  CURDATE:
    format: '%m/%d/%y'
    match: 'run-date'
  CURTIME:
    match: 'run-time'
  ERRMSG: '                                                                              '
  OPTION: '  '
  OPTN001: '01. User List (Security)                '
  OPTN002: '02. User Add (Security)                 '
  OPTN003: '03. User Update (Security)              '
  OPTN004: '04. User Delete (Security)              '
  OPTN005: '                                        '
  OPTN006: '                                        '
  OPTN007: '                                        '
  OPTN008: '                                        '
  OPTN009: '                                        '
  OPTN010: '                                        '
  OPTN011: '                                        '
  OPTN012: '                                        '
  PGMNAME: 'COADM01C'
  TITLE01: '      AWS Mainframe Modernization       '
  TITLE02: '              CardDemo                  '
  TRNNAME: 'CA00'
