# COACTUPC refuses an account update whose Country is blank: the supplied
# predicate of 1225-EDIT-ALPHA-REQD, run for the Country field, composes
# 'Country must be supplied.' [app/cbl/COACTUPC.cbl:1622-1630,1898-1922].
#
# Country is protected on the update screen: 3320-UNPROTECT-FEW-ATTRS gives
# ACSCTRY DFHBMPRF (protected, MDT on; "Since most of the edits are USA
# specific protected country"), so an operator cannot erase it, and the value
# COACTUPC sent comes back on every AID [app/cbl/COACTUPC.cbl:3500-3547].
# Erasing ACSCTRY at the terminal would put the keyboard in operator-error
# state and never reach COACTUPC, so the blank Country comes from the data
# instead: the invented customer 000000001 has a blank CUST-ADDR-COUNTRY-CD,
# and step 4 presses ENTER without typing. That is the only input that reaches
# the predicate, so it is the one this scenario pins.
#
# Steps 1-3 reach the fetched account as ACT-COACTUPC-alternate-04 does:
# USER0001 signs on, chooses main-menu option 2 (Account Update) and enters
# account 00000000001. 9000-READ-ACCT reads CXACAIX by account id (card
# 9680294154603697, customer 000000001, line 49 of
# app/data/ASCII/cardxref.txt), ACCTDAT and CUSTDAT, keeps the records as the
# old values in the COMMAREA and sets ACUP-SHOW-DETAILS; 3202-SHOW-ORIGINAL-
# VALUES moves the blank country to ACSCTRYO, and every editable field is
# unprotected with MDT on [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,
# 3500-3561,3608-3884].
# Step 4 presses ENTER:
# - 1100-RECEIVE-MAP finds ACSCTRYI SPACES and moves LOW-VALUES to
#   ACUP-NEW-CUST-ADDR-COUNTRY-CD; a field that did not arrive would be nulls
#   and moved as they are, LOW-VALUES again [app/cbl/COACTUPC.cbl:1343-1348].
# - 1205-COMPARE-OLD-NEW finds a change: the blank ACCT-GROUP-ID comes back as
#   spaces, which 1100 turns into LOW-VALUES, and the country LOW-VALUES differ
#   from the fetched spaces. 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and
#   runs the field edits in screen order [app/cbl/COACTUPC.cbl:1213-1218,
#   1460-1470,1681-1743].
# - Account Status, the three dates and the five amounts pass on the repository
#   account; SSN, Date of Birth, FICO Score, First, Middle and Last Name,
#   Address Line 1, State, Zip and City pass on the invented customer
#   [app/cbl/COACTUPC.cbl:1472-1621].
# - 'Country' is moved to WS-EDIT-VARIABLE-NAME, the 3-byte LOW-VALUES to
#   WS-EDIT-ALPHANUM-ONLY and 3 to WS-EDIT-ALPHANUM-LENGTH. 1225-EDIT-ALPHA-REQD
#   finds WS-EDIT-ALPHANUM-ONLY(1:3) LOW-VALUES, sets INPUT-ERROR and
#   FLG-ALPHA-BLANK and, WS-RETURN-MSG being still blank
#   [app/cbl/COACTUPC.cbl:876], STRINGs FUNCTION TRIM('Country') and
#   ' must be supplied.' into WS-RETURN-MSG; WS-EDIT-COUNTRY-FLGS becomes
#   FLG-COUNTRY-BLANK [app/cbl/COACTUPC.cbl:311-314,1622-1630,1903-1922].
# - Phone Number 1 and 2, EFT Account Id, Primary Card Holder and the state/zip
#   cross edit pass; each composed message is guarded by WS-RETURN-MSG-OFF, so
#   none could replace the Country message [app/cbl/COACTUPC.cbl:1632-1677].
# - 2000-DECIDE-ACTION continues on ACUP-CHANGES-NOT-OK, so 9600-WRITE-
#   PROCESSING, the only READ UPDATE and REWRITE path, does not run
#   [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES moves the LOW-VALUES country to ACSCTRYO; 3250
#   sets PROMPT-FOR-CHANGES and moves the message to ERRMSG; 3300 puts the
#   cursor on ACSCTRY, and CSSETATY for COUNTRY turns it red and moves '*' into
#   it, the flag being blank on a re-entry; 3390 makes F12=Cancel bright
#   because changes were made, and leaves F5=Save dark
#   [app/cbl/COACTUPC.cbl:2870-2951,2955-2981,3134-3136,3386-3390,3566-3581]
#   [app/cpy/CSSETATY.cpy:17-26].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   ERRMSG is 'Country must be supplied.' (25 characters) in the 75-byte
#   WS-RETURN-MSG, moved to the 78-byte ERRMSGO. ACSCTRY is three spaces on
#   the fetched screen and '*' in its 3-byte field on the refused one. INFOMSG
#   is the 40-byte WS-INFO-MSG in the 45-byte INFOMSGO.
# - AADDGRP is sent as LOW-VALUES on screen 4 (the blank group id comes back as
#   spaces, which 1100 turns into LOW-VALUES); s3270 shows nulls as spaces.
# - A dark (DRK) field is captured as blanks; colour and cursor position are
#   not in the s3270 text capture and are not asserted.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every other
# COACTUPC edit (the repository record has FICO 274, phone-2 area code 373 and
# zip 12546 for NC, which the FICO, phone and state/zip edits refuse), so the
# blank Country is the only refused field [app/cbl/COACTUPC.cbl:2225-2558].
id: ACT-COACTUPC-negative-103
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update) and fetches
  account 00000000001, whose customer 000000001 has a blank country; the
  protected Country field shows blank. Pressing ENTER without typing makes
  COACTUPC refuse the update: the message line shows 'Country must be
  supplied.', the Country field shows '*', the other received values are shown
  again with the change prompt and F12=Cancel, and neither ACCTDATA nor
  CUSTDATA is rewritten.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. The change prompt 'Update account details presented above.'
# (INV-ACT-030) is asserted but verified by its own scenario. Sign-on (CC00,
# COSGN00, USRSEC) and the menu transaction are verified by the SEC and MNU
# scenarios; the batch record copybooks and the data files are verified at the
# lowest level that executes them.
inventory_ids:
- INV-ACT-161  # COACTUPC Country: supplied (1225-EDIT-ALPHA-REQD)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the red attribute and '*' of the blank Country
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the four date edits, all passed
- INV-LAY-014  # CSUTLDWY: the date-edit working storage
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix 1225-EDIT-ALPHA-REQD drops the TRIM-length blank check and strings
# the untrimmed 25-byte WS-EDIT-VARIABLE-NAME (COACTUPC.cl2:1903-1918), so its
# message would read 'Country                   must be supplied.'; a UniKix
# run never verifies the item, and the app/ text is pinned.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios, with a blank country: the protected Country field cannot be
    # erased at the terminal, so the record supplies the blank. The 168-byte
    # FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: '   '
        CUST-ADDR-ZIP: '27601'
        CUST-PHONE-NUM-1: (919)555-0101
        CUST-PHONE-NUM-2: (919)555-0102
        CUST-SSN: '123456789'
        CUST-GOVT-ISSUED-ID: TESTGOVT0001
        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: Y
        CUST-FICO-CREDIT-SCORE: '700'
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
# PASSWORD is the documented demo password of README.md, not a secret.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  # ENTER with nothing typed: ACSCTRY is protected, and every field returns
  # the value COACTUPC sent.
  - aid: ENTER
    '@map': COACTUP
    fields: {}
