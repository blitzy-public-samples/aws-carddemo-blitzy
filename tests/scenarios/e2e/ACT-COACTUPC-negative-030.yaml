# COACTUPC refuses an account update whose Expiry Date month is left empty:
# the 'month supplied' predicate of EDIT-MONTH in the procedure copybook
# CSUTLDPY, performed for the Expiry Date field [app/cpy/CSUTLDPY.cpy:91-106].
#
# Steps 1-3 sign on as USER0001, choose main-menu option 2 and fetch account
# 00000000001 as ACT-COACTUPC-alternate-04 does: CXACAIX gives card
# 9680294154603697 and customer 000000001, ACCTDAT and CUSTDAT are read
# without UPDATE, and 3202-SHOW-ORIGINAL-VALUES shows both records with
# 'Update account details presented above.'; 3320-UNPROTECT-FEW-ATTRS gives
# every editable field MDT on, so all of them come back on the next AID
# [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3500-3561,3608-3884].
# Step 4 erases the 2-byte EXPMON field and presses ENTER. The erased field
# arrives with no data, so EXPMONI holds LOW-VALUES; it is neither '*' nor
# SPACES, so 1100-RECEIVE-MAP moves it unchanged to ACUP-NEW-EXP-MON
# [app/cbl/COACTUPC.cbl:1174-1179]. 1205-COMPARE-OLD-NEW finds the expiry date
# changed, and 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and edits the
# fields in screen order [app/cbl/COACTUPC.cbl:1429-1494,1680-1700]:
# - Account Status 'Y', Open Date 2014-11-20 and Credit Limit 2,020.00 pass.
# - Expiry Date: EDIT-DATE-CCYYMMDD first marks the date invalid; the year
#   2025 passes; EDIT-MONTH finds WS-EDIT-DATE-MM equal to LOW-VALUES, sets
#   INPUT-ERROR and FLG-MONTH-BLANK and, WS-RETURN-MSG being SPACES, composes
#   the message of this scenario; the day 20 passes; EDIT-DAY-MONTH-YEAR sees
#   the date flags not all valid and leaves before EDIT-DATE-LE, so CSUTLDTC is
#   not called [app/cpy/CSUTLDPY.cpy:18-20,91-106,150-282].
# - Every later edit passes with the invented customer below, and each one
#   composes its message only while WS-RETURN-MSG is off, so the Expiry Date
#   message stands.
# 2000-DECIDE-ACTION continues on ACUP-CHANGES-NOT-OK, so 9600-WRITE-PROCESSING,
# the only READ UPDATE and REWRITE path, does not run [app/cbl/COACTUPC.cbl:
# 2596-2621]. 3200-SETUP-SCREEN-VARS takes 3203-SHOW-UPDATED-VALUES
# (ACUP-CHANGES-MADE holds 'E' and 'N'), which shows the received values, the
# amounts re-edited through +ZZZ,ZZZ,ZZZ.99 [app/cbl/COACTUPC.cbl:660-664,
# 2710-2725,2870-2951]. 3250-SETUP-INFOMSG sets PROMPT-FOR-CHANGES for
# ACUP-CHANGES-NOT-OK and moves WS-RETURN-MSG to ERRMSG [app/cbl/COACTUPC.cbl:
# 2955-2982]. In 3300-SETUP-SCREEN-ATTRS the CSSETATY block for EXPIRY-MONTH
# finds FLG-EXPIRY-MONTH-BLANK on a reentry, colours EXPMON red and moves '*'
# to EXPMONO [app/cbl/COACTUPC.cbl:255-258,3243-3247] [app/cpy/CSSETATY.cpy:
# 18-27]. 3390-SETUP-INFOMSG-ATTRS makes F12=Cancel bright, because changes
# were made and not saved, and leaves F5=Save dark, because no confirmation is
# asked [app/cbl/COACTUPC.cbl:3566-3584].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - The STRING joins FUNCTION TRIM('Expiry Date') and ' : Month must be
#   supplied.', 37 characters, into the 75-byte WS-RETURN-MSG; ERRMSGO is 78
#   bytes, so ERRMSG holds the text padded with 41 spaces.
# - INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte INFOMSGO.
# - EXPMON is '*' followed by a space: the one-character literal moved to the
#   2-byte output field.
# - FKEY05 keeps its INITIAL text but stays ASKIP,DRK, which the s3270 capture
#   renders as blanks.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
# - The erased field is assumed to reach the program as LOW-VALUES, which BMS
#   gives a modified field received without data; JUSTIFY=(RIGHT) on EXPMON
#   pads only received data [app/bms/COACTUP.bms:150-154]. Until a UniKix run
#   is imported this stays inferred (GAP-INF-005).
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit: the repository record has FICO 274, below 300, and zip 12546, which is
# not a North Carolina zip, so the FICO Score edit would set its message
# instead [app/cbl/COACTUPC.cbl:2514-2558]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-030
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update) and fetches
  account 00000000001 with customer 000000001, then erases the Expiry Date
  month and presses ENTER. COACTUPC refuses the change: the message line shows
  'Expiry Date : Month must be supplied.', the month field shows '*', the
  other fields keep the values entered with the prompt 'Update account details
  presented above.', and F12=Cancel is shown. Nothing is saved: ACCTDATA and
  CUSTDATA still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are verified
# by the SEC and MNU scenarios; the batch record copybooks and the data files
# are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-088  # COACTUPC Expiry Date: month supplied (rule)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the validation
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the red attribute and the '*' in EXPMON
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-MONTH, which composes the message
- INV-LAY-014  # CSUTLDWY: WS-EDIT-DATE-MM and the date-edit flags
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY drops FUNCTION TRIM from the field name in every composed
# date-edit message, so the ERRMSG text of this edit differs on UniKix.
- GAP-DOC-024
# The UniKix COACTUPC comments out the TEST-NUMVAL-C amount checks that set the
# numeric amounts 3203-SHOW-UPDATED-VALUES re-edits, so the amounts on screen 4
# may differ on UniKix.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
        CUST-ADDR-ZIP: '27601'
        CUST-PHONE-NUM-1: (919)555-0101
        CUST-PHONE-NUM-2: (919)555-0102
        CUST-SSN: '123456789'
        CUST-GOVT-ISSUED-ID: TESTGOVT0001
        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: Y
        CUST-FICO-CREDIT-SCORE: '700'
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  # The adapter erases EXPMON and types nothing, so the field goes back
  # modified and empty.
  - aid: ENTER
    '@map': COACTUP
    fields:
      EXPMON: ''
