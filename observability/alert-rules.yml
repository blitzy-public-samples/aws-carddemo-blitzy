# ------------------------------------------------------------------------------
# CardDemo — Prometheus alerting rules
#
# The paging counterpart to observability/grafana-dashboard.json: every rule here
# fires on a condition one of the dashboard's own panels visualises, so an operator
# is told about a condition they would otherwise have to be looking at a screen to
# notice. Loaded through the `rule_files` entry in observability/prometheus.yml and
# mounted read-only into the prom/prometheus container by the repository-root
# docker-compose.yml.
#
# Scope. AAP 0.7.5 mandates structured logging, distributed tracing, a metrics
# endpoint, health/readiness/liveness probes and a dashboard template; alert rules
# are NOT part of that mandate, so these are additive and no notification route is
# configured — Prometheus evaluates and exposes them through /api/v1/rules and
# /api/v1/alerts, and an Alertmanager can be attached without touching them.
#
# Every threshold below is the number the project already commits to elsewhere,
# never an invented one:
#   * 200 ms at the 95th percentile — AAP 0.7.1, and the red SLO line on the
#     dashboard's latency panels.
#   * the 4-hour batch window — AAP 0.7.1, and the dashboard's
#     "Batch Job Duration vs 4h Window" threshold (14400 s).
#   * `up`, `http_server_requests_seconds`, `hikaricp_connections_*` and
#     `spring_batch_job_seconds_*` are the metric families the scrape config
#     collects and the dashboard queries.
#
# `for:` durations are deliberately longer than one scrape interval (15 s) so a
# single missed scrape or one slow request cannot page anyone.
# ------------------------------------------------------------------------------

groups:
  # --- Availability ---------------------------------------------------------
  - name: carddemo-availability
    interval: 30s
    rules:
      - alert: CardDemoServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          application: carddemo
        annotations:
          summary: "Scrape target {{ $labels.job }} is down"
          description: >-
            Prometheus has not been able to scrape {{ $labels.instance }}
            (job {{ $labels.job }}) for more than a minute. The service is either
            stopped, crash-looping or unreachable on the container network. Check
            `docker compose ps` / `kubectl get pods` and the container log.

      - alert: CardDemoServiceUnhealthy
        # An Actuator readiness DOWN answers 503 on the probe path while the
        # process is still scrapeable, so a service failing closed on a datastore
        # outage shows up here rather than as a down target.
        expr: sum by (job) (rate(http_server_requests_seconds_count{uri=~"/actuator/health.*",status="503"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
          application: carddemo
        annotations:
          summary: "{{ $labels.job }} is reporting readiness DOWN"
          description: >-
            {{ $labels.job }} has been answering its health/readiness probe with
            503 for two minutes, which means one of its dependencies (PostgreSQL
            or Redis) is unavailable. Liveness is unaffected by design, so the
            container is not restarted.

  # --- Latency SLO (AAP 0.7.1: p95 < 200 ms) --------------------------------
  - name: carddemo-latency
    interval: 30s
    rules:
      - alert: CardDemoLatencySloBreached
        # The trailing traffic guard is not cosmetic. Measured on an idle stack
        # immediately after a cold start, a single sign-on (BCrypt on a cold JVM,
        # 0.57 s) was the ONLY sample in the window, so the percentile of one
        # request pushed this rule to pending at a request rate of 0.004/s. A p95
        # says nothing at that sample size, so the rule additionally requires at
        # least 0.2 requests/second (12 a minute) on the job before it can alert.
        expr: >-
          histogram_quantile(0.95,
            sum by (job, le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m]))
          ) > 0.2
          and
          sum by (job) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
          application: carddemo
          slo: "p95<200ms"
        annotations:
          summary: "{{ $labels.job }} p95 latency above the 200 ms target"
          description: >-
            The 95th-percentile response time of {{ $labels.job }} has been above
            the 200 ms target (AAP 0.7.1) for five minutes, measured over
            non-actuator endpoints. The dashboard's Latency row shows the same
            series against its red SLO line.

  # --- Errors ---------------------------------------------------------------
  - name: carddemo-errors
    interval: 30s
    rules:
      - alert: CardDemoServerErrorRatioHigh
        # Ratio rather than a raw count, so the threshold means the same thing at
        # any traffic level. 5% of served requests failing with a 5xx is a defect
        # or an outage, never normal operation. The same traffic guard as the
        # latency rule applies: on an idle service ONE 5xx is a ratio of 1.0, which
        # would page on a single fluke, so at least 0.2 requests/second must be
        # flowing before the ratio is treated as meaningful.
        expr: >-
          sum by (job) (rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*"}[5m]))
          /
          sum by (job) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m]))
          > 0.05
          and
          sum by (job) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])) > 0.2
        for: 5m
        labels:
          severity: critical
          application: carddemo
        annotations:
          summary: "{{ $labels.job }} is returning more than 5% 5xx responses"
          description: >-
            More than 5% of the requests {{ $labels.job }} served in the last five
            minutes failed with a 5xx status. Correlate with the service log using
            the correlationId/traceId on the failing requests.

  # --- Connection pool ------------------------------------------------------
  - name: carddemo-datastore
    interval: 30s
    rules:
      - alert: CardDemoConnectionPoolSaturated
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 5m
        labels:
          severity: warning
          application: carddemo
        annotations:
          summary: "HikariCP pool {{ $labels.pool }} on {{ $labels.job }} is over 90% in use"
          description: >-
            More than 90% of the connections in pool {{ $labels.pool }} have been
            checked out for five minutes. Requests will start queueing and then
            failing on the 3 s connection timeout each service configures.

      - alert: CardDemoConnectionsPending
        # A non-zero pending count means threads are already waiting for a
        # connection, so it is reported separately from mere high utilisation.
        expr: hikaricp_connections_pending > 0
        for: 2m
        labels:
          severity: warning
          application: carddemo
        annotations:
          summary: "Threads are waiting for a database connection on {{ $labels.job }}"
          description: >-
            {{ $labels.job }} has had threads waiting for a connection from pool
            {{ $labels.pool }} for two minutes. Either the pool is undersized for
            the load or a query is holding connections open.

  # --- Batch (AAP 0.7.1: completion inside the 4-hour window) ---------------
  - name: carddemo-batch
    interval: 1m
    rules:
      - alert: CardDemoBatchJobFailed
        # spring_batch_job_seconds_count carries the terminal status as a label, so
        # any increase on a non-COMPLETED status is a job that ended badly.
        expr: increase(spring_batch_job_seconds_count{spring_batch_job_status!="COMPLETED"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
          application: carddemo
        annotations:
          summary: "Batch job {{ $labels.spring_batch_job_name }} ended {{ $labels.spring_batch_job_status }}"
          description: >-
            {{ $labels.spring_batch_job_name }} finished with status
            {{ $labels.spring_batch_job_status }} on {{ $labels.job }}. Inspect the
            job execution through the service's batch endpoints before resubmitting;
            an interrupted instance must be abandoned or marked failed to be
            restartable.

      - alert: CardDemoBatchWindowExceeded
        # 14400 s is the 4-hour window AAP 0.7.1 states and the dashboard draws.
        expr: max by (job, spring_batch_job_name) (spring_batch_job_seconds_max) > 14400
        for: 0m
        labels:
          severity: critical
          application: carddemo
          slo: "batch<4h"
        annotations:
          summary: "Batch job {{ $labels.spring_batch_job_name }} exceeded the 4-hour window"
          description: >-
            {{ $labels.spring_batch_job_name }} ran longer than the 4-hour batch
            window the migration commits to (AAP 0.7.1). The dashboard's "Batch Job
            Duration vs 4h Window" panel plots the same series against the
            threshold.
