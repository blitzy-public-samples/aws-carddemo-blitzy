# COACTUPC Open Date, 30-day-month boundary: the 30th of a 30-day month is
# accepted. EDIT-DAY-MONTH-YEAR refuses only day 31 outside WS-31-DAY-MONTH
# ('<field name>:Cannot have 31 days in this month.'), so 2014-04-30 passes the
# rule that ACT-COACTUPC-boundary-14 (2014-04-31) and ACT-COACTUPC-negative-021
# (2014-06-31) refuse [app/cpy/CSUTLDPY.cpy:209-226] [app/cpy/CSUTLDWY.cpy:21-32].
# An accepted value shows as the next prompt, not as the field's message.
#
# Steps 1-3 sign on, choose main-menu option 2 and fetch account 00000000001,
# as ACT-COACTUPC-alternate-04 does: CXACAIX gives card 9680294154603697 and
# customer 000000001 (line 49 of app/data/ASCII/cardxref.txt), ACCTDAT and
# CUSTDAT are read, the records are kept as the old values in the COMMAREA,
# ACUP-SHOW-DETAILS is set and every editable field is sent unprotected with
# MDT on, so all of them come back on the next AID
# [app/cbl/COACTUPC.cbl:2568-2580,3500-3561,3608-3884].
# Step 4 types 04 over the open month and 30 over the open day (the year stays
# 2014) and presses ENTER:
# - 1100-RECEIVE-MAP builds ACUP-NEW-OPEN-DATE '20140430'
#   [app/cbl/COACTUPC.cbl:1144-1163]; 1205-COMPARE-OLD-NEW finds it differs
#   from '20141120', so 1200-EDIT-MAP-INPUTS runs the field edits in screen
#   order, moving 'Open Date' to WS-EDIT-VARIABLE-NAME before EDIT-DATE-CCYYMMDD
#   [app/cbl/COACTUPC.cbl:1460-1482,1681-1696].
# - EDIT-YEAR-CCYY: 2014 is supplied, numeric and of century 20; EDIT-MONTH: 04
#   is supplied, numeric and in WS-VALID-MONTH; EDIT-DAY: 30 is supplied,
#   numeric and in WS-VALID-DAY [app/cpy/CSUTLDPY.cpy:25-204].
# - EDIT-DAY-MONTH-YEAR: April is not a 31-day month, but the day is 30, not
#   31, so the 31-day test passes; April is not February, so the 30th- and
#   29th-of-February tests do not apply. The flags stay LOW-VALUES,
#   WS-EDIT-DATE-IS-VALID holds and control falls through to EDIT-DATE-LE
#   [app/cpy/CSUTLDPY.cpy:213-279].
# - EDIT-DATE-LE calls CSUTLDTC with the mask YYYYMMDD; a real date gives
#   severity 0, so no 'Open Date validation error Sev code: ...' is composed
#   [app/cpy/CSUTLDPY.cpy:284-328]. That severity is inferred: which dates
#   CEEDAYS accepts is known only through the stub (GAP-INF-001), and
#   ACT-COACTUPC-negative-024 records how the 8-byte date and mask reach the
#   10-byte CSUTLDTC parameters.
# Every other field comes back with the fetched values, which pass every edit
# (ACT-COACTUPC-alternate-04), so INPUT-ERROR stays off and
# ACUP-CHANGES-OK-NOT-CONFIRMED is set [app/cbl/COACTUPC.cbl:1671-1675].
# Without PF5, 2000-DECIDE-ACTION does not run 9600-WRITE-PROCESSING, the sole
# READ UPDATE and REWRITE path [app/cbl/COACTUPC.cbl:2590-2621].
# 3203-SHOW-UPDATED-VALUES shows the received values, the amounts re-edited
# through +ZZZ,ZZZ,ZZZ.99; 3250-SETUP-INFOMSG moves PROMPT-FOR-CONFIRMATION to
# INFOMSG and the blank WS-RETURN-MSG to ERRMSG; 3390 makes F5=Save and
# F12=Cancel visible [app/cbl/COACTUPC.cbl:472-473,2870-2951,2955-2983,
# 3566-3581].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte INFOMSGO. ERRMSG is the
#   75-byte WS-RETURN-MSG, blank, in the 78-byte ERRMSGO, so it holds no Open
#   Date message.
# - The tpe adapter enters a field with EraseEOF before typing, so OPNYEAR,
#   OPNMON and OPNDAY hold exactly 2014, 04 and 30.
# - FKEY05 and FKEY12 keep their INITIAL text. On screen 3 they are dark
#   (ASKIP,DRK), and the s3270 capture renders a zero-intensity field as blanks.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by the invented data of the other COACTUPC
# update scenarios, which passes every edit. The repository record has FICO
# 274 and zip 12546, and either would be refused first
# [app/cbl/COACTUPC.cbl:2514-2558]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-boundary-13
level: e2e
type: boundary
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update) and fetches
  account 00000000001 with customer 000000001. The open date is changed from
  2014-11-20 to 2014-04-30, the last day of a 30-day month, and ENTER is
  pressed. The Open Date edit accepts it: no 'Open Date:Cannot have 31 days in
  this month.' or other date message appears, every edit passes, and COACTUPC
  shows the new open date with 'Changes validated.Press F5 to save' and a
  blank message line. Nothing is saved before PF5: ACCTDATA and CUSTDATA keep
  the fetched records.
# Primary item first, then the CSUTLDTC date acceptance the accepted date
# reaches, the program, the maps asserted, the transaction of steps 3 and 4,
# the CSD files COACTUPC reads, and the online-only copybooks it copies.
# INV-ACT-031 ('Changes validated.Press F5 to save') is verified by
# ACT-COACTUPC-alternate-04, and INV-ACT-082 (the CSUTLDTC severity) by
# ACT-COACTUPC-negative-024. Sign-on (CC00, COSGN00, USRSEC) and the menu
# transaction are verified by the SEC and MNU scenarios, and the batch record
# copybooks and data files at the lowest level that executes them.
inventory_ids:
- INV-ACT-079  # COACTUPC Open Date: no 31st in a 30-day month (rule), its accepted edge
- INV-UTL-003  # CSUTLDTC date acceptance for masks YYYY-MM-DD and YYYYMMDD, reached through EDIT-DATE-LE
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and confirmation screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the validation
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits use
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the per-field error attributes
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-DAY-MONTH-YEAR and EDIT-DATE-LE
- INV-LAY-014  # CSUTLDWY: WS-31-DAY-MONTH, WS-DAY-31 and WS-DATE-VALIDATION-RESULT
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-INF-001  # which dates CEEDAYS accepts is known only through the stub
- GAP-MIS-010  # whether UniKix supplies CEEDAYS
# The UniKix copy of CSUTLDPY drops TRIM from the composed date-edit messages
# and replaces TEST-NUMVAL in the month and day checks; it lists INV-ACT-079.
- GAP-DOC-024
# The UniKix copy of CSUTLDTC trims the Vstring lengths it passes to CEEDAYS;
# it lists INV-UTL-003.
- GAP-DOC-021
# Cited beyond the date edit because screen 4 also asserts what they change:
# the UniKix COACTUPC comments out the TEST-NUMVAL-C amount checks behind the
# re-edited amounts, and the UniKix COACTUP.bms differs at row 1, columns 1-9,
# beside TRNNAME.
- GAP-DOC-022
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data that passes every edit; the
    # 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
