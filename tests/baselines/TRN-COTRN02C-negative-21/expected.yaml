# Derived baseline (capture_platform: derived) of scenario
# TRN-COTRN02C-negative-21, authored from the source because no TPE region runs
# in CI; only `report.py --import-unikix` replaces it, from imported UniKix
# evidence, and it is never edited by hand to match a run.
#
# USER0001 signs on and takes main-menu option 8 (Transaction Add) to COTRN02C
# [app/cbl/COSGN00C.cbl:230-237] [app/cbl/COMEN01C.cbl:86-90,115-156]
# [app/cpy/COMEN02Y.cpy:67-72]. On first entry COTRN02C sends COTRN02 from a
# cleared map with its CT02 header and a blank ERRMSG
# [app/cbl/COTRN02C.cbl:36-37,107-130,516-571].
# Step 3 enters a full transaction for card 0500024453765740 with Orig Date
# typed 2022/07/01:
# - the card branch reads CCXREF by card (NORMAL) and moves XREF-ACCT-ID
#   00000000050 to ACTIDIN [app/cbl/COTRN02C.cbl:193-230,609-637]
#   [app/data/ASCII/cardxref.txt:1];
# - every field is supplied, Type CD 01 and Category CD 0001 are numeric and
#   the amount +00000012.34 has the +99999999.99 form
#   [app/cbl/COTRN02C.cbl:251-351];
# - TORIGDTI(5:1) is '/', not '-', so 'Orig Date should be in format
#   YYYY-MM-DD' goes to WS-MESSAGE and SEND-TRNADD-SCREEN sends COTRN02 with
#   ERASE, then RETURNs with TRANSID CT02 [app/cbl/COTRN02C.cbl:353-366,516-534];
# - the task ends there: the Proc Date check, the NUMVAL-C re-edit of the
#   amount, the CSUTLDTC calls, the CONFIRM evaluation and ADD-TRANSACTION
#   never run, so TRANSACT keeps its 300 fixture records
#   [app/cbl/COTRN02C.cbl:164-188,368-437].
# Open under GAP-INF-007 (derived TRN end-to-end baselines) and GAP-INF-012
# (online-only copybooks).
#
# One screen per step, each the screen shown after the step's AID; messages
# holds each step's ERRMSG. COTRN2AO redefines the received COTRN2AI, so the
# typed fields come back padded with blanks to their BMS lengths
# [app/bms/COTRN02.bms]; ERRMSG is the 80-byte WS-MESSAGE in the 78-byte
# ERRMSGO, trailing spaces kept. CURDATE and CURTIME come from the region
# clock, which UniKix cannot fix, hence the matchers. TRANSACT asserts the
# record count the scenario asserts, as derived baselines do until an observed
# run supplies every record.
file_state:
  TRANSACT:
    count: 300
messages:
- '                                                                              '
- '                                                                              '
- 'Orig Date should be in format YYYY-MM-DD                                      '
screens:
- '@map': COMEN01
  ERRMSG: '                                                                              '
  PGMNAME: COMEN01C
  TRNNAME: CM00
- '@map': COTRN02
  CURDATE:
    format: '%m/%d/%y'
    match: run-date
  CURTIME:
    match: run-time
  ERRMSG: '                                                                              '
  PGMNAME: COTRN02C
  TITLE01: '      AWS Mainframe Modernization       '
  TITLE02: '              CardDemo                  '
  TRNNAME: CT02
- '@map': COTRN02
  ACTIDIN: '00000000050'
  CARDNIN: '0500024453765740'
  CURDATE:
    format: '%m/%d/%y'
    match: run-date
  CURTIME:
    match: run-time
  ERRMSG: 'Orig Date should be in format YYYY-MM-DD                                      '
  MCITY: 'Testville                '
  MID: '800000001'
  MNAME: 'Test Merchant                 '
  MZIP: '27601     '
  PGMNAME: COTRN02C
  TCATCD: '0001'
  TDESC: 'Test purchase                                               '
  TITLE01: '      AWS Mainframe Modernization       '
  TITLE02: '              CardDemo                  '
  TORIGDT: 2022/07/01
  TPROCDT: '2022-07-01'
  TRNAMT: '+00000012.34'
  TRNNAME: CT02
  TRNSRC: 'POS TERM  '
  TTYPCD: '01'
