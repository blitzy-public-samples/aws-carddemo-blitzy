    ACSPH1C: '0101'
    ACSGOVT: 'TESTGOVT0001        '
    ACSPH2A: '919'
    ACSPH2B: '555'
    ACSPH2C: '0102'
    ACSEFTC: '0053581756'
    ACSPFLG: 'Y'
    INFOMSG: 'Changes unsuccessful. Please try again       '
    ERRMSG: 'Update of record failed                                                       '
    # A failed change keeps F12 bright, while F5 returns to its dark map
    # attribute because no confirmation is pending [app/cbl/COACTUPC.cbl:3573-3581].
    FKEYS: 'ENTER=Process F3=Exit'
    FKEY05: '       '
    FKEY12: 'F12=Cancel'
  # The ERRMSG value of each step: blank until the failed save.
  messages:
  - '                                                                              '
  - '                                                                              '
  - '                                                                              '
  - '                                                                              '
  - 'Update of record failed                                                       '
  file_state:
    # The account REWRITE failed and the customer REWRITE was never issued:
    # account 00000000001 keeps every field, ACCT-ADDR-ZIP included, and the
    # 50 accounts stay 50.
    ACCTDATA:
      count: 50
      contains:
      - ACCT-ID: '1'
        ACCT-ACTIVE-STATUS: 'Y'
        ACCT-CURR-BAL: '194.00'
        ACCT-CREDIT-LIMIT: '2020.00'
        ACCT-CASH-CREDIT-LIMIT: '1020.00'
