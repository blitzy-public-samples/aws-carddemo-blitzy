# The TRANREPT job end to end on a posted TRANSACT of nine invented
# transactions for three repository cards [app/jcl/TRANREPT.jcl:19-80].
#
# STEP05R.PRC001 is step PRC001 of procedure REPROC: IDCAMS REPRO with the
# REPROCT control card unloads the TRANSACT KSDS, in TRAN-ID order, into the
# new TRANSACT.BKUP generation [app/jcl/TRANREPT.jcl:23-33]
# [app/proc/REPROC.prc:21-28] [app/ctl/REPROCT.ctl:15]. The SORT step that
# follows carries the same name, STEP05R [app/jcl/TRANREPT.jcl:37]; both STEP
# lines are pinned as the JCL writes them (GAP-DEF-009). It keeps the records
# whose TRAN-PROC-DT (columns 305-314) lies in the SYMNAMES window 2022-01-01 to
# 2022-07-06 and sorts them on TRAN-CARD-NUM into the new TRANSACT.DALY
# generation [app/jcl/TRANREPT.jcl:38-55]. STEP10R runs CBTRN03C on that file
# and writes the new TRANREPT generation [app/jcl/TRANREPT.jcl:59-80].
#
# The TRAN-IDs run across the cards, so the sort visibly reorders them, and the
# processing timestamps sit on both sides of each window edge: 2021-12-31 at
# 23.59.59.999999 and 2022-07-07 at 00.00.00.000000 are left out, 2022-01-01 at
# 00.00.00.000000 and 2022-07-06 at 23.59.59.999999 are kept, because INCLUDE
# compares only the 10-character date. Records of one card keep their
# TRAN-ID order, as the SORT replacement gives them (GAP-STB-006); the JCL codes
# no EQUALS. No job or data file creates the DATEPARM dataset STEP10R reads, so
# it is built from the parameter (GAP-MIS-001), set equal to the SORT window so
# that CBTRN03C's own window test never ends the report early.
#
# The report shows CBTRN03C's report control as observed (GAP-DEF-012): an
# account total and a separator at each card change, none for the last card,
# and at end of file the last amount, 9.99, added to the page total a second
# time, so the page and grand totals read -26.37 where the seven amounts sum
# to -36.36 [app/cbl/CBTRN03C.cbl:170-206,274-322]. The line counter never
# reaches 20 before a detail line, so no page break occurs.
#
# Every transaction id, description and merchant is invented and matches no
# repository record. Nothing here depends on the run clock, so the scenario
# declares clock_mode relative for unikix, which runs the UniKix copy's
# TRANREPT with its own sort statements and in-stream dates (GAP-DOC-027). All
# values come from a GnuCOBOL 3.2 run of the app/ sources through the job
# driver's TRANREPT step table. Report lines and DISPLAY lines are whole
# records with their trailing spaces; the two end-of-file DISPLAYs show signed
# items as digits and a trailing sign, as libcob displays them (GAP-STB-011).
id: RPT-TRANREPT-normal-01
level: integration
type: normal
description: >-
  TRANREPT backs up a posted TRANSACT of nine transactions in TRAN-ID order,
  keeps the seven processed from 2022-01-01 to 2022-07-06 and sorts them by
  card, and reports them with CBTRN03C under 'Date Range: 2022-01-01 to
  2022-07-06': account totals of -66.67 and -15.25 at the card changes, no
  account total for the last card, and page and grand totals of -26.37 that
  count the last amount twice. Every step ends with return code 0, and the
  catalog holds the first TRANSACT.BKUP, TRANSACT.DALY and TRANREPT
  generations.
inventory_ids:
- INV-RPT-006  # TRANREPT job: REPROC unload, window sort, CBTRN03C report
- INV-DAT-026  # REPROC proc, expanded as step STEP05R.PRC001
- INV-DAT-027  # REPROCT control card, the REPRO SYSIN of that step
tags:
- suspected-defect
gap_ids:
- GAP-DEF-009  # the REPROC step and the SORT step are both named STEP05R
- GAP-DEF-012  # CBTRN03C's doubled last amount and missing last account total
- GAP-MIS-001  # no job or data file creates DATEPARM, so it is a parameter here
- GAP-STB-005  # IDCAMS REPRO replacement for the REPROC step
- GAP-STB-006  # SORT replacement for the INCLUDE window and the card sort
- GAP-STB-007  # normal-end CATLG of TRANSACT.BKUP(+1), TRANSACT.DALY(+1) and TRANREPT(+1) applied; abnormal-termination DELETE recorded, not evaluated
- GAP-STB-009  # catalog and GDG emulation for the (+1) generations
- GAP-STB-010  # Berkeley DB indexed files in place of the VSAM KSDS
- GAP-STB-011  # GnuCOBOL compile and runtime options in place of Enterprise COBOL and LE
- GAP-DOC-027  # the UniKix copy's TRANREPT sorts and supplies DATEPARM differently
