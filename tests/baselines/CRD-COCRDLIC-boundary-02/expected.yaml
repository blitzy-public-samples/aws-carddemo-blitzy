# Derived baseline of scenario CRD-COCRDLIC-boundary-02: account 00000000050
# holds 8 cards, the repository card 0500024453765740 and the invented
# 9900000000005001 to 9900000000005007, one more than the 7 rows of a
# COCRDLIC page. USER0001 signs on, enters main-menu option 3, filters the
# card list on the account and pages forward once. Authored from the source,
# never captured: app/cbl/COMEN01C.cbl with app/cpy/COMEN02Y.cpy (option 3
# transfers to COCRDLIC), app/cbl/COCRDLIC.cbl:296-343,410-414,486-497,
# 572-582,642-743,837-930,962-1071,1120-1260,1382-1411 with
# app/bms/COCRDLI.bms and app/cpy/COTTL01Y.cpy (the browse, the account
# filter, the paging, the messages and the screen header). Open until a
# UniKix run is imported.
# One screen per step, the one shown after the step's AID: COMEN01 after
# sign-on, the unfiltered first list page after option 3 (identification
# only; its rows belong to CRD-COCRDLIC-normal-01), filtered page 1 after
# ENTER, filtered page 2 after PF8.
# Page 1: the browse starts at the file's lowest key, which the first page
# kept as WS-CA-FIRST-CARD-NUM, and 9500-FILTER-RECORDS keeps account 50's
# cards in key order. At the 7th row the look-ahead READNEXT finds 5007, so
# a next page exists and ERRMSG stays blank. Page 2: the browse starts at
# 5007, the next READNEXT ends the file, and 'NO MORE RECORDS TO SHOW' goes
# to ERRMSG while INFOMSG keeps the record-actions prompt. 1100-SCREEN-INIT
# clears the map to LOW-VALUES, so rows 2-7 show as spaces.
# Assumption: on ENTER with no row selected, VIEW-REQUESTED-ON(I-SELECTED)
# and UPDATE-REQUESTED-ON(I-SELECTED) are tested with subscript 0
# (COCRDLIC.cbl:518,546). The trace takes the byte before
# WS-EDIT-SELECT(1), the sign byte x'0C' of the packed
# WS-EDIT-SELECT-COUNTER, to be neither 'S' nor 'U', and the region to raise
# no subscript-range abend. An imported UniKix run replaces anything this
# assumption gets wrong.
# Values are full BMS field width with their trailing spaces; PAGENO is the
# PIC 9(1) page number left-justified in its 3 bytes; CURDATE and CURTIME
# are run-clock matchers.
screens:
- '@map': 'COMEN01'
  PGMNAME: 'COMEN01C'
  TRNNAME: 'CM00'
- '@map': 'COCRDLI'
  ERRMSG: '                                                                              '
