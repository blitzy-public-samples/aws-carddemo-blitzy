# Runtime configuration for account-service.

server:
  # Port inside the container. Dockerfile and docker-compose.yml probe
  # http://localhost:8080/actuator/health, and ACCOUNT_PORT publishes it on the host.
  port: 8080

spring:
  application:
    name: account-service

  # docker-compose.yml points this container at the carddemo_account database and the
  # account_service schema, one private pair per service.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${ACCOUNT_DB_NAME:carddemo_account}?currentSchema=${ACCOUNT_DB_SCHEMA:account_service}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:carddemo}}
    # No fallback. An unset password stops start-up rather than signing on under a
    # password this repository publishes. docker-compose.yml sets
    # SPRING_DATASOURCE_PASSWORD; a direct run sets POSTGRES_PASSWORD.
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
    driver-class-name: org.postgresql.Driver

  # Flyway creates the account_service schema, then applies the migrations under
  # db/migration.
  flyway:
    enabled: true
    schemas: ${SPRING_FLYWAY_SCHEMAS:${ACCOUNT_DB_SCHEMA:account_service}}
    default-schema: ${SPRING_FLYWAY_DEFAULT_SCHEMA:${ACCOUNT_DB_SCHEMA:account_service}}
    create-schemas: true
    baseline-on-migrate: false
    validate-on-migrate: true

  # Jakarta Persistence (JPA) checks the entity mapping against the migrated schema at
  # boot and writes no Data Definition Language (DDL).
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:${ACCOUNT_DB_SCHEMA:account_service}}
        auto_quote_keyword: true

  # messaging/EventPublisherPort.java passes a topic, a key and a payload, all strings.
  # The payload arrives serialized as JavaScript Object Notation (JSON) and matches
  # schemas/account-state-changed-v1.json, which com.carddemo:event-contracts ships.
  # An implementation validates the payload against that document and checks the
  # message key against the payload aggregateId and accountId before it sends. This
  # module
  # registers no listener, so it carries no spring.kafka.consumer and no
  # spring.kafka.listener block.
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        max.block.ms: 5000

# Properties this module owns. The outbox relay sweeps on the delay below, which
# @EnableScheduling on AccountApplication.java activates.
carddemo:
  kafka:
    topics:
      # The one topic this module publishes, created by docker-compose.yml. No
      # dead-letter topic accompanies it. Dead-letter routing carries a message a
      # listener could not consume, and this module registers no listener.
      account-state-changed: ${TOPIC_ACCOUNT_STATE_CHANGED:account.state-changed}
    # The versioned contract every account state-change event validates against.
    # The number matches the -v1 suffix of the schema document name and the
    # schemaVersion field the envelope carries.
    schema-version: 1
  outbox:
    relay:
      fixed-delay-ms: ${OUTBOX_RELAY_INTERVAL_MS:500}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:100}

# config/ObservabilityConfig.java names this endpoint list and registers six meters, which it
# publishes as the single AccountMeters bean every measured path records through.
management:
  # /actuator answers on this port and never on the service port above, so a
  # client of the Representational State Transfer (REST) surface reaches no
  # runtime, database or broker internals. docker-compose.yml publishes this port
  # on the loopback address alone.
  server:
    port: ${MANAGEMENT_PORT:9080}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,metrics,prometheus}
  prometheus:
    metrics:
      export:
        enabled: true

# Each log line leaves as JSON through logstash-logback-encoder, declared version-less in
# pom.xml and pinned by the aggregator. No logback-spring.xml sits beside this file.
logging:
  structured:
    format:
      console: logstash
  level:
    root: ${LOG_LEVEL:INFO}
    # INFO by default. A DEBUG default retains identifiers in centralized logs.
    com.carddemo: ${LOG_LEVEL_CARDDEMO:INFO}
