# Ledger posting service configuration, in one document.
# Every value reads an environment variable and falls back to the default that
# card-platform/.env.example documents.
# Source: app/cbl/CBTRN02C.cbl, invoked at app/jcl/POSTTRAN.jcl:L23.
# Source-to-target mapping: card-platform/docs/traceability-matrix.md
# Rationale for every setting: card-platform/docs/decision-log.md

spring:
  application:
    name: ledger-posting-service

  # Private database and schema. docker-compose.yml injects the connection
  # string, and no other service reads this database.
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${LEDGER_DB_NAME:carddemo_ledger}?currentSchema=${LEDGER_DB_SCHEMA:ledger_service}}"
    username: "${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:carddemo}}"
    password: "${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:carddemo}}"
    driver-class-name: org.postgresql.Driver

  # Jakarta Persistence API (JPA) settings. The entity mapping is validated
  # against the migrated schema at startup. Flyway owns every schema object.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: "${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:${LEDGER_DB_SCHEMA:ledger_service}}"
        auto_quote_keyword: true

  # Schema migration. Flyway creates the schema when absent, then applies the
  # Data Definition Language (DDL) migrations this module ships.
  flyway:
    enabled: true
    schemas: "${SPRING_FLYWAY_SCHEMAS:${LEDGER_DB_SCHEMA:ledger_service}}"
    default-schema: "${SPRING_FLYWAY_DEFAULT_SCHEMA:${LEDGER_DB_SCHEMA:ledger_service}}"
    create-schemas: true
    baseline-on-migrate: false
    validate-on-migrate: true

  kafka:
    bootstrap-servers: "${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}}"

    # Idempotent production with acknowledgement from every in-sync replica.
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: com.carddemo.events.serde.JsonSchemaValidatingSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

    # Manual acknowledgement, with automatic commit disabled. This service reads
    # under a group of its own.
    consumer:
      group-id: "${SPRING_KAFKA_CONSUMER_GROUP_ID:${GROUP_LEDGER_POSTING:ledger-posting}}"
      enable-auto-commit: false
      auto-offset-reset: "${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}"
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer wraps the schema-validating delegate below.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: com.carddemo.events.serde.JsonSchemaValidatingDeserializer

    listener:
      ack-mode: manual

# Settings the messaging, outbox and observability classes bind.
carddemo:
  kafka:
    topics:
      transaction-authorized: "${TOPIC_TRANSACTION_AUTHORIZED:transaction.authorized}"
      transaction-posted: "${TOPIC_TRANSACTION_POSTED:transaction.posted}"
      transaction-declined: "${TOPIC_TRANSACTION_DECLINED:transaction.declined}"
      # The dead-letter topic name is the consumed topic plus the suffix.
      dead-letter: "${TOPIC_TRANSACTION_AUTHORIZED:transaction.authorized}${TOPIC_DEAD_LETTER_SUFFIX:.DLT}"

  # Delivery attempts a consumer makes, and the wait between two attempts.
  consumer:
    retry:
      max-attempts: "${CONSUMER_MAX_RETRY_ATTEMPTS:3}"
      backoff-ms: "${CONSUMER_RETRY_BACKOFF_MS:1000}"

  # Sweep interval and claim size for unpublished outbox rows.
  outbox:
    relay:
      fixed-delay-ms: "${OUTBOX_RELAY_INTERVAL_MS:500}"
      batch-size: "${OUTBOX_RELAY_BATCH_SIZE:100}"

# The container listens on 8080. docker-compose.yml publishes host port 8082.
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:${MANAGEMENT_ENDPOINTS:health,info,metrics,prometheus}}"
  prometheus:
    metrics:
      export:
        enabled: true

# Structured console output. Metric names are constants in ObservabilityConfig.
logging:
  structured:
    format:
      console: logstash
  level:
    root: "${LOGGING_LEVEL_ROOT:${LOG_LEVEL:INFO}}"
    com.carddemo: "${LOGGING_LEVEL_COM_CARDDEMO:${LOG_LEVEL_CARDDEMO:DEBUG}}"
