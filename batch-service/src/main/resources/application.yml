# =====================================================================
# batch-service - Spring Boot application configuration.
#
# Batch-orchestration microservice: the Spring Batch re-platforming of
# the legacy COBOL batch programs (interest calculation CBACT04C /
# INTCALC.jcl, plus the data-management programs CBACT01C-CBACT03C,
# CBCUS01C, CBTRN01C, CBTRN03C) and the on-demand job-submission pattern
# of the REPROC / TRANREPT procs. The service stays resident to serve
# Actuator HTTP; jobs are triggered on demand via JobLauncher, never at
# startup. Every connection setting is environment-driven so the same
# artifact runs locally, under Docker Compose (SPRING_PROFILES_ACTIVE=
# docker) and on Kubernetes; the values below are developer-workstation
# defaults.
# =====================================================================
spring:
  application:
    name: batch-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carddemo}
    username: ${SPRING_DATASOURCE_USERNAME:carddemo}
    password: ${SPRING_DATASOURCE_PASSWORD:carddemo}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # This service owns no business tables; the owning services create
      # and migrate the shared schema. Hibernate neither creates nor
      # validates it here.
      ddl-auto: none

  # Flyway manages ONLY the Spring Batch metadata schema (BATCH_* tables
  # and sequences) via db/migration. A per-service history table isolates
  # this bookkeeping from the other services sharing the 'carddemo'
  # database. Reconciliation rationale: docs/decision-log.md.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history_batch

  # Batch jobs run ON-DEMAND via JobLauncher, never automatically at
  # startup. Flyway owns the metadata schema, so the JDBC initializer is
  # disabled.
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  # Pure batch service: no pseudo-conversational session store.
  session:
    store-type: none

server:
  port: 8080

# Observability (AAP 0.7.5): health/info/prometheus exposure plus
# liveness/readiness probes for Kubernetes. The common 'application'
# metrics tag is contributed by carddemo-common ObservabilityConfig -
# do not duplicate it here.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

# ---------------------------------------------------------------------
# Docker Compose profile (SPRING_PROFILES_ACTIVE=docker). Compose passes
# explicit env vars; these defaults resolve the compose service
# hostnames (postgres, redis) even if a var is unset.
# ---------------------------------------------------------------------
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/carddemo}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
