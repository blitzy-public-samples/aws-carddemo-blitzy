# INTCALC on the repository data, run through its job step table: STEP15
# executes CBACT04C with the step's own PARM '2022071800' [app/jcl/INTCALC.jcl:22],
# so the scenario sets no parm. The job also allocates the CARDXREF
# alternate-index path, which CBACT04C never opens: the program has no SELECT for
# it and reads each account's card through the alternate key of the CARDXREF
# cluster itself [app/cbl/CBACT04C.cbl:28-56]. The interest transactions go to the new SYSTRAN
# generation [app/jcl/INTCALC.jcl:37-41].
#
# The 50 repository TCATBALF records (accounts 1-50, type 01, category 0001,
# balance 0.00) are each displayed [app/cbl/CBACT04C.cbl:193]. Every account
# carries its disclosure group id in ACCT-ADDR-ZIP and leaves ACCT-GROUP-ID
# blank, so each DISCGRP lookup misses and displays 'DISCLOSURE GROUP RECORD
# MISSING' and 'TRY WITH DEFAULT GROUP CODE' before the DEFAULT 01/0001 rate of
# 15.00 is read [app/cbl/CBACT04C.cbl:414-460] (GAP-DEF-005). The pair appears 50
# times, once per TCATBALF record; the 100 of the job-chain proof come from
# POSTTRAN's 50 newly created TCATBAL records, which this run does not have.
#
# The rate is not zero, so each record writes one SYSTRAN record
# [app/cbl/CBACT04C.cbl:214-217,462-500]: TRAN-ID is the PARM followed by the
# 6-digit counter, type '01', category '05' (decoded from its PIC 9(04) as 5),
# source 'System', the card read by account, and the amount 0.00 * 15.00 / 1200,
# truncated without ROUNDED (GAP-UNC-008). No fee is ever added (GAP-UNC-007).
# TRAN-DESC is never initialized, so the 76 bytes after 'Int. for a/c <account>'
# hold x'00' on gnucobol-batch, written "\0" below (GAP-UNC-009, GAP-STB-011).
# unikix runs this job too and cannot fix its clock (GAP-MIS-015), so the
# timestamps are run-timestamp matchers; under the gnucobol-batch fixed clock
# they resolve to 2022-07-06-10.00.00.000000.
#
# Accounts 1-49 are rewritten when the next account's first TCATBALF record
# arrives; account 50 never is, because the end-of-file ELSE is unreachable
# [app/cbl/CBACT04C.cbl:188-222] (GAP-DEF-003). With zero interest and cycle
# fields already 0.00, the rewrites change no byte, so ACCTDATA ends equal to the
# fixture and the skipped last rewrite shows only in the unit scenarios with
# synthetic balances. TCATBALF is opened INPUT and stays as loaded, although the
# tech spec says the job updates the category balances (GAP-DOC-005).
#
# Only the job item is listed: the CBACT04C behaviour items are verified by the
# FIN-CBACT04C-* unit scenarios. The baseline, captured on gnucobol-batch, holds
# every field; the inline values pin the business outcomes. @CATALOG lines are
# catalog text and name DSNs by nature; contains is used because unikix lists its
# whole catalog, not only this job's datasets.
id: FIN-INTCALC-normal-01
level: integration
type: normal
description: >-
  INTCALC STEP15 runs CBACT04C with PARM 2022071800 on the repository TCATBALF,
  CARDXREF, ACCTDATA and DISCGRP. Every disclosure group lookup misses because
  ACCT-GROUP-ID is blank, so each of the 50 category balance records is followed
  by 'DISCLOSURE GROUP RECORD MISSING' and 'TRY WITH DEFAULT GROUP CODE' and takes
  the DEFAULT rate of 15.00. The step ends RC 0, the new SYSTRAN generation holds
  50 interest transactions of 0.00, 2022071800000001 to 2022071800000050, and the
  account and category balance files keep their content.
inventory_ids:
- INV-FIN-002  # INTCALC job
tags:
- suspected-defect
- observed-only
gap_ids:
- GAP-DEF-003  # the last account is never rewritten
- GAP-DEF-005  # the group id sits in ACCT-ADDR-ZIP; ACCT-GROUP-ID is blank
- GAP-UNC-007  # 1400-COMPUTE-FEES is empty, so no fee is charged
- GAP-UNC-008  # interest truncated, no ROUNDED
- GAP-UNC-009  # TRAN-DESC filled from uninitialized working storage
- GAP-STB-004  # PARMDRV in place of the z/OS EXEC PARM linkage
- GAP-STB-007  # DISP=(NEW,CATLG,DELETE) of the new SYSTRAN generation recorded, not evaluated
- GAP-STB-009  # catalog and GDG emulation: the new SYSTRAN generation
- GAP-STB-010  # Berkeley DB indexed files in place of the VSAM KSDS
- GAP-STB-011  # GnuCOBOL compile and runtime options; the x'00' description fill
- GAP-DOC-005  # the tech spec says CBACT04C updates the category balances
preconditions:
  datasets:
    TCATBALF: {base: TCATBALF}
    CARDXREF: {base: CARDXREF}
    ACCTDATA: {base: ACCTDATA}
    # The ASCII DISCGRP; its registered record-34 mismatch (GAP-DOC-013) is not a
    # key this run reads.
    DISCGRP: {base: DISCGRP}
  parameters:
    clock_mode: relative
  faults: []
