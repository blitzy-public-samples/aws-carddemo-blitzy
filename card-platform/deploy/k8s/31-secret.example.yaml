---
# One Secret per service, from here to the end of the file. Each carries exactly the two
# credentials that must not be shared: the password of its own database login and the
# password of its own broker identity. Two keys, one service, and the same key names in all
# six, so a Deployment reads its own Secret with envFrom and names nothing.
#
# Each value must equal what carddemo-postgres-secret and carddemo-kafka-secret set for
# that service, and must differ from every other service's.
#
# All six Deployments exist in this folder, in 40-45, and each one reads the Secret named
# after it through envFrom. A Secret missing here is a service that cannot start, because
# neither of its two keys carries a default.
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-authorization-secret
  namespace: carddemo
  labels:
    app.kubernetes.io/name: authorization-service
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: card-platform
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "REPLACE-WITH-A-GENERATED-PASSWORD-FOR-AUTHORIZATION"
  KAFKA_SASL_PASSWORD: "REPLACE-WITH-A-GENERATED-BROKER-PASSWORD-FOR-AUTHORIZATION"
