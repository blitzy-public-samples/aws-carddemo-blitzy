id: MNU-COMEN01C-alternate-05
level: e2e
type: alternate
description: >-
  USER0001 (user type U) signs on and reaches the main menu, which COMEN01C
  sends on its first entry with its own transaction and program in the header
  [app/cbl/COMEN01C.cbl:36-37,87-90,182-194,212-219]. Option 5 is a valid
  number within CDEMO-MENU-OPT-COUNT, its table entry 'Credit Card Update' is
  user type U and names COCRDUPC, so COMEN01C sets itself as the calling
  program, zeroes CDEMO-PGM-CONTEXT and transfers control to COCRDUPC
  [app/cpy/COMEN02Y.cpy:21,49-53] [app/cbl/COMEN01C.cbl:115-156]. COCRDUPC,
  entered from the menu program, treats this as a fresh entry and sends its
  card update screen with TRNNAME CCUP and PGMNAME COCRDUPC
  [app/cbl/COCRDUPC.cbl:219-226,235-236,387-394,502-512,1052-1060,1324-1336].
