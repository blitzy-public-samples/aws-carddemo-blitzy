    SEC-USR-LNAME: 'LACHAPELLE          '
    SEC-USR-TYPE: A
  - SEC-USR-FNAME: 'LAWRENCE            '
    SEC-USR-ID: USER0001
    SEC-USR-LNAME: 'THOMAS              '
    SEC-USR-TYPE: U
  - SEC-USR-FNAME: 'AJITH               '
