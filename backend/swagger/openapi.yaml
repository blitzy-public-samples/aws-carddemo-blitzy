  # ============================================================================
  # SEARCH ENDPOINTS
  # ============================================================================
  /search/documents:
    get:
      tags:
        - Search
      summary: Search documents
      description: Full-text search across all document content and metadata
      operationId: searchDocuments
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
          example: invoice apple
        - name: filters
          in: query
          schema:
            type: string
          description: JSON string with filter criteria
          example: '{"status":"completed","documentType":"invoice","dateRange":{"from":"2025-01-01","to":"2025-12-31"},"confidenceMin":85}'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [relevance, date, confidence]
            default: relevance
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      totalHits:
                        type: integer
                        example: 1247
                      maxScore:
                        type: number
                        example: 8.5
                      results:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/Document'
                            - type: object
                              properties:
                                _score:
                                  type: number
                                  description: Search relevance score
                                highlights:
                                  type: object
                                  description: Highlighted matching text
                      aggregations:
                        type: object
                        description: Faceted search aggregations
                        properties:
                          byDocumentType:
                            type: object
                            additionalProperties:
                              type: integer
                          byStatus:
                            type: object
                            additionalProperties:
                              type: integer
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'

  /search/advanced:
    post:
      tags:
        - Search
      summary: Advanced search
      description: Execute complex search queries using ElasticSearch query DSL
      operationId: advancedSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: ElasticSearch query DSL
              example:
                query:
                  bool:
                    must:
                      - match:
                          extractedData.invoiceNumber: INV-001
                    filter:
                      - range:
                          uploadedAt:
                            gte: "2025-01-01"
                            lte: "2025-12-31"
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: ElasticSearch response
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ============================================================================
