  # =========================================================================
  # Frontend (React 19 SPA served by nginx). The bundle talks to the backend
  # through a SAME-ORIGIN path (/api), which nginx reverse-proxies to the
  # api-gateway on the private network. No absolute gateway URL is
  # baked into the bundle, so no host port of the gateway is assumed.
  # =========================================================================

  # The service is guarded by a profile so that `docker compose up --build` (the
  # command README-target.md documents) covers the datastores, the nine backend
  # services and the observability stack, and the browser tier is opted into
  # explicitly with `docker compose --profile frontend up -d --build frontend`.
  # The bundle itself is complete — the Vite entry point (src/main.tsx), the route
  # table and the 17 page components are all on disk, and `npm run build` produces
  # the dist/ tree this image serves.
  frontend:
    # Bounded log retention (see x-logging).
    logging: *service-logging
    profiles:
      - frontend
    build:
      context: ./frontend
      args:
        # OCI provenance (org.opencontainers.image.revision / .created) is supplied at
        # BUILD time, so it must come from the build itself rather than from a flag a
        # caller has to remember: an image built without it carries "unspecified" and
        # cannot be traced back to a commit. Defaults keep an ad-hoc build working.
        CARDDEMO_IMAGE_VERSION: ${CARDDEMO_IMAGE_TAG:-1.0.0}
        CARDDEMO_IMAGE_REVISION: ${CARDDEMO_IMAGE_REVISION:-unspecified}
        CARDDEMO_IMAGE_CREATED: ${CARDDEMO_IMAGE_CREATED:-unspecified}
        VITE_API_BASE_URL: /api
        # Sign-on header AppID:/SysID: fields (legacy EXEC CICS ASSIGN APPLID / ASSIGN
        # SYSID, COSGN00C L198-L203 — the program fills both before its first SEND, so
        # neither caption is ever shown without a value). CARDDEMO is the application's
        # own name in app/csd/CARDDEMO.CSD and fits either 8-character field exactly.
        VITE_APP_ID: CARDDEMO
        VITE_SYS_ID: CARDDEMO
    # Tag the built image exactly as k8s/deployment-frontend.yaml references it, so
    # `docker compose build` produces the artifact the manifests apply against.
    # Registry and tag are overridable for a private registry or a
    # side-by-side build; the defaults ARE the manifest values.
    image: ${CARDDEMO_IMAGE_REGISTRY:-carddemo}/frontend:${CARDDEMO_IMAGE_TAG:-1.0.0}
    ports:
      # nginx runs unprivileged inside the container and therefore listens on
      # 8080, not 80 (see frontend/Dockerfile and frontend/nginx.conf). The host
      # port the README documents is unchanged.
      - "3000:8080"
    # Wait for the gateway to be HEALTHY, not merely started: nginx must have a
    # reachable upstream on its first proxied request. The upstream address itself
    # is re-resolved per request (frontend/nginx.conf resolver), so a gateway
    # recreated later is picked up without recreating this container.
    depends_on:
      api-gateway:
        condition: service_healthy
    # Mirrors resources in k8s/deployment-frontend.yaml.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
        reservations:
          cpus: "0.05"
          memory: 64m
    # Liveness of the browser tier. Without a healthcheck `docker ps` reported this
    # container as merely "Up" and an nginx that had stopped serving - a bad
    # configuration reload, an exhausted worker set - was indistinguishable from a
    # healthy one. The probe is the base image's own busybox wget against the SPA
    # entry document, so it needs no extra package and runs as the unprivileged user.
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    # nginx needs a few writable paths; everything else is read-only.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
    networks:
      - carddemo-net
    restart: unless-stopped

  # =========================================================================
  # Observability — Prometheus scrapes each service's authenticated
  # /actuator/prometheus endpoint; Jaeger receives the OTLP spans every service
  # exports; Grafana is auto-provisioned (datasources + dashboard) from inline
  # configs and the dashboard template under observability/. All three UIs bind to
  # the host loopback only, so they are never exposed on a routable
  # interface.
  # =========================================================================

  # Distributed-tracing backend (AAP 0.7.5). Jaeger v2 is a single-binary
  # collector + storage + query + UI: it accepts the services' OTLP spans on
  # 4318 (HTTP/protobuf) and 4317 (gRPC) and serves the trace-query API and UI on
  # 16686. Without a collector in the local environment the exported spans have
  # nowhere to go and "distributed tracing verified against the local Docker
  # Compose environment" cannot be satisfied. Storage is in-memory: traces are
  # development evidence, not durable data, so no volume is mounted and nothing
  # survives a restart by design. What MUST NOT happen is the restart itself —
  # see the retention and Go-runtime notes below, which together are what keeps
  # this container inside the limit it declares.
  jaeger:
    image: jaegertracing/jaeger:2.20.0@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8
    # Bounded log retention (see x-logging).
    logging: *service-logging
    # Explicit configuration document (observability/jaeger-config.yaml) instead
    # of the binary's embedded default, whose in-memory store is bounded at
    # max_traces 100000 — about 3.4 GB of live heap at this application's measured
    # ~34 KB per 21-span trace, i.e. 4.2x the memory limit declared below. That
    # default is why this container previously grew past its cgroup and was killed
    # and restarted under load, losing every span it held. There is no environment
    # variable for max_traces, so the bound requires owning the document; the
    # file reproduces the rest of the embedded default and explains each delta.
    command:
      - --config=file:/etc/jaeger/config.yaml
    volumes:
      - ./observability/jaeger-config.yaml:/etc/jaeger/config.yaml:ro
    # Go sizes its heap and its P count from the HOST unless told otherwise, so a
    # cgroup-limited collector will happily allocate past `limits.memory` and be
    # killed with no OOM attribution — the same defect, and the same fix, as the
    # GOMEMLIMIT already set on the Grafana service below. GOMEMLIMIT is a SOFT
    # limit at 67% of the 768 MiB below, leaving the balance for non-heap RSS; the
    # store's own max_traces bound keeps the live set (~204 MB) far enough under it
    # that the collection cycle is driven by GOGC and never by the soft limit.
    # GOMAXPROCS 1 is the value go1.26's cgroup-aware default computes for a 0.5
    # CPU quota, pinned here so the figure is auditable next to the quota it
    # derives from (measured effect: 8 OS threads down to 5).
    environment:
      GOMEMLIMIT: 512MiB
      GOGC: "80"
      GOMAXPROCS: "1"
      JAEGER_MAX_TRACES: ${JAEGER_MAX_TRACES:-6000}
    # Mirrors resources in k8s/deployment-jaeger.yaml.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768m
        reservations:
          cpus: "0.1"
          memory: 256m
    security_opt:
      - no-new-privileges:true
    # Span export is deliberately BEST-EFFORT — no service gates its startup or
    # readiness on the tracing backend — but "nothing depends on it" is not a
    # reason for its failures to be invisible: with no probe this container
    # reported a bare "Up" through ten restarts. healthcheckv2's /status returns
    # the aggregate component status as a document, so the probe asserts
    # {"healthy":true} rather than merely proving a socket is bound. wget is the
    # image's own busybox utility (the same one the frontend and Grafana probes
    # use); this image is Alpine-based and ships /bin/sh, wget and nc.
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:13133/status | grep -q '"healthy":true'
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Only the query UI/API is published, on loopback; the OTLP receivers stay on
    # the private carddemo-net bridge exactly like the datastores. Without this the
    # collector still receives and serves traces INSIDE the network - Grafana's
    # datasource reaches it as http://jaeger:16686 - but the UI a developer opens to
    # read a trace, and the query API this stack is verified through, are unreachable
    # from the host.
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - carddemo-net
    restart: unless-stopped

  prometheus:
    # Pinned to an explicit version. An untagged reference resolves
    # to :latest, so two `docker compose pull` runs weeks apart can start different
    # Prometheus majors against the same scrape config and dashboards; 3.13.2 is
    # the version this stack was verified against.
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    # Bounded log retention (see x-logging).
    logging: *service-logging
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Alerting rules referenced by the `rule_files` entry in prometheus.yml. The
      # container path is the one that file names, so a missing mount would fail the
      # configuration load loudly rather than leaving the rules silently unloaded.
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheusdata:/prometheus
    # The scrape authenticates as the least-privilege `monitoring` principal that
    # every service's ManagementSecurityConfig seeds from MONITORING_PASSWORD.
    # Prometheus reads the credential from this projected file (password_file in
    # observability/prometheus.yml) rather than from any committed value.
    #
    # uid/gid MUST be pinned to 65534 ("nobody"), the account the upstream
    # prom/prometheus image runs as. Projected config files default to root:root,
    # so with mode 0440 alone the Prometheus process cannot open the file and EVERY
    # scrape job fails with "unable to read basic auth password: permission denied"
    # while Prometheus itself still reports healthy. Pinning the owner keeps least
    # privilege (0440, not world-readable).
    configs:
      - source: monitoring_password
        target: /etc/prometheus/secrets/monitoring-password
        uid: "65534"
        gid: "65534"
        mode: 0440
    # Network isolation is the second control over the monitoring path: no service
    # publishes its management port and the scrape stays on the private carddemo-net
    # bridge, while the projected credential above authenticates every scrape.
    ports:
      - "127.0.0.1:9090:9090"
    # No Kubernetes manifest exists for the monitoring backends, so these bounds
    # are local-stack figures: enough for a 15s scrape of ten targets with the
    # default 15-day retention, and low enough that the TSDB cannot crowd out the
    # services it is measuring.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.1"
          memory: 128m
    security_opt:
      - no-new-privileges:true
    networks:
      - carddemo-net
    restart: unless-stopped

  grafana:
    # Built from observability/Dockerfile.grafana: the pinned upstream release
    # (13.1.3, digest-pinned there) with the two bundled datasource plugins this
    # stack never loads - zipkin and elasticsearch - deleted. Twelve of the
    # fourteen fixable HIGH findings a scan reports against the upstream image live
    # in those two binaries; the dashboards use the CORE Prometheus and Jaeger
    # datasources, so nothing this deployment relies on is removed with them.
    # The version stays pinned because the provisioned dashboard is validated
    # against it - notably its handling of the saved `refresh` interval and the
    # table legend - so a floating :latest could change rendering behaviour with no
    # repository change.
    build:
      context: ./observability
      dockerfile: Dockerfile.grafana
      # OCI provenance (org.opencontainers.image.revision / .created) is supplied at
      # BUILD time, so it must come from the build itself rather than from a flag a
      # caller has to remember: an image built without it carries "unspecified" and
      # cannot be traced back to a commit. Defaults keep an ad-hoc build working.
      args:
        CARDDEMO_IMAGE_VERSION: ${CARDDEMO_IMAGE_TAG:-1.0.0}
        CARDDEMO_IMAGE_REVISION: ${CARDDEMO_IMAGE_REVISION:-unspecified}
        CARDDEMO_IMAGE_CREATED: ${CARDDEMO_IMAGE_CREATED:-unspecified}
    image: ${CARDDEMO_IMAGE_REGISTRY:-carddemo}/grafana:${CARDDEMO_IMAGE_TAG:-1.0.0}
    # Bounded log retention (see x-logging).
    logging: *service-logging
    environment:
      # Admin credentials are externalized; no admin/admin default.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Make the Go runtime aware of the container's memory limit.
      #
      # This is the SAME class of defect the nine JVM services solved with
      # -XX:MaxRAMPercentage: a managed runtime that cannot see the cgroup cap
      # grows its heap until the cap terminates the process. Grafana is a Go
      # binary and Go's garbage collector is driven by GOGC relative to the live
      # heap, with NO knowledge of the cgroup limit unless GOMEMLIMIT is set.
      #
      # Measured: with this unset, holding the 26-panel dashboard open costs
      # ~+250 MiB immediately and then grows ~+62 MiB/min under the 30 s refresh
      # (958 /api/ds/query calls over one soak), reaching 99.8% of a 512 MiB cap
      # in about twelve minutes and exiting with code 0 — no OOM kill, because
      # the runtime gives up before the kernel intervenes. Raising the cap alone
      # only moves the deadline, which is why the limit AND this setting are set
      # together.
      #
      # 440MiB against the 512m limit leaves ~72 MiB for the non-Go footprint
      # (bleve index pages, thread stacks, the wget healthcheck). GOMEMLIMIT is a
      # SOFT limit: the collector works harder as it approaches, and is allowed
      # to exceed it rather than fail an allocation, so it degrades into more GC
      # rather than into a dead container.
      GOMEMLIMIT: 440MiB
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/carddemo.yml
    volumes:
      # The provider above loads every dashboard JSON from this directory.
      - ./observability/grafana-dashboard.json:/var/lib/grafana/dashboards/carddemo-dashboard.json:ro
      - grafanadata:/var/lib/grafana
    # Container port 3000; published on loopback 3001 (frontend uses 3000).
    ports:
      - "127.0.0.1:3001:3000"
    # Local-stack bounds (no Kubernetes manifest for the monitoring backends).
    #
    # 384m was the original figure, on the reasoning that "one provisioned
    # datasource and one dashboard need no more". Measurement falsified that:
    # under a real authenticated browser session rendering all 26 data panels the
    # dashboard then carried (9 series each) the container terminated and was
    # restarted by the policy
    # below NINE times in thirty minutes — exit code 0, not an OOM kill, so
    # nothing in `docker compose ps` or the logs announced it. Grafana 13 also
    # runs a bleve search backend that indexes on demand, which the original
    # figure did not account for.
    #
    # Raising the cap to 512m was NOT sufficient on its own and must not be
    # read as the fix: re-soaked at 512m the container still died, just later
    # (T+11m33s instead of ~3m), because memory was growing ~+62 MiB/min with
    # no upper bound. The actual fix is GOMEMLIMIT in the environment above,
    # which makes the Go collector reclaim before the cgroup cap is reached.
    # This limit and that setting only work as a pair - the limit gives the
    # runtime something to aim below, and GOMEMLIMIT makes it aim.
    #
    # Verified after both changes: a 32-minute authenticated browser soak over
    # all 26 panels held memory in a bounded 391-431 MiB sawtooth (peak 84% of
    # this cap, 8 MiB under GOMEMLIMIT) with a net trend of +0.002 MiB/min,
    # RestartCount unchanged at 0, and the live WebSocket never dropping.
    #
    # The "Tracing backend (Jaeger)" row added later brings the dashboard to 29
    # data panels; its three panels carry nine series between them against the
    # single `jaeger` scrape target, against the ~234 the soak above sustained.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.1"
          memory: 128m
    security_opt:
      - no-new-privileges:true
    # Grafana was the ONE container in this file with no health probe, which is
    # precisely why the restarts above went unnoticed: with no healthcheck the
    # service reports a bare "running" no matter what state it is in. Grafana's
    # own readiness endpoint reports database connectivity, and wget is present
    # in the image (BusyBox), unlike the JRE-based service images.
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - prometheus
    networks:
      - carddemo-net
    restart: unless-stopped

networks:
  carddemo-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  prometheusdata:
  grafanadata:
  # Durable batch output roots, one per writing service so a service's deliverables
  # cannot be truncated by another's generation naming. These hold files a downstream
  # consumer reads (DALYREJS reject generations, statement text/HTML, the report and
  # record-dump files), so they must outlive a container restart - which is exactly
  # what the tmpfs mounts they replaced did not do.
  transactionbatchoutput:
  reportingbatchoutput:
  batchoutput:

# ---------------------------------------------------------------------------
# Inline config content. The Grafana entries wire the Prometheus and Jaeger
# datasources and the dashboard provider on first boot. Keeping this inline avoids
# adding provisioning files to the repository. The one secret here,
# monitoring_password, carries no committed value: it is interpolated from the
# environment (.env) and projected read-only into the Prometheus container.
# ---------------------------------------------------------------------------
configs:
  # Credential of the least-privilege `monitoring` principal that every service's
  # ManagementSecurityConfig seeds and that Prometheus presents on each scrape.
  # Externalized, never committed: it is supplied from the environment (.env) and
  # projected read-only into the Prometheus container as a password_file.
  monitoring_password:
    content: "${MONITORING_PASSWORD:?set MONITORING_PASSWORD in .env}"
  grafana_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: true
        # Tracing datasource (AAP 0.7.5) so a trace can be explored from the same
        # pane of glass as the metrics. Jaeger's query API is reached over the
        # private network; nothing is published for it beyond the loopback UI.
        - name: Jaeger
          type: jaeger
          uid: carddemo-jaeger
          access: proxy
          url: http://jaeger:16686
          isDefault: false
          editable: true
  grafana_dashboard_provider:
    content: |
      apiVersion: 1
      providers:
        - name: CardDemo
          orgId: 1
          type: file
          disableDeletion: false
          allowUiUpdates: true
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards
            foldersFromFilesStructure: false
