# directly, with no COMMAREA and no sign-on, starts COCRDUPC on its own COCRDUP
# credit card update screen, and ENTER there with no search criteria resends it
# with 'No input received' [app/cbl/COCRDUPC.cbl:380-395,502-511]
# (GAP-UNC-010). Only unikix can run the scenario, so expected.yaml is authored
# from the source (derived_from: source) and is inferred-not-observed
# (GAP-INF-006, GAP-INF-012). It names no execution_id or execution_fingerprint
# and holds no datasets/ until report.py --import-unikix promotes an eligible
# UniKix run (MINOR if the decoded outcome is equal, MAJOR if it differs).
#
# source_identity.units are the app/ sources of the one program the step runs:
# COCRDUPC's COPY closure, as harness.inventory_tools.copy_closure resolves it
# (bringing app/cpy-bms/COCRDUP.CPY and the procedure-division copybook
# CSSTRPFY), plus the BMS source of its map, app/bms/COCRDUP.bms. COCRDUPC
# CALLs no app/cbl unit, and no sign-on program runs. CVACT01Y and CVACT03Y
# are commented-out COPYs [app/cbl/COCRDUPC.cbl:350,356]; DFHAID and DFHBMSCA
# are CICS-supplied and not in the repository; none of them is listed.
