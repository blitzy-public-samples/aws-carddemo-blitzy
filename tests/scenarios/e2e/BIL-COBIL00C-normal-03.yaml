  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '10'
  # Account id and confirmation in one ENTER, so the payment runs at once.
  - aid: ENTER
    '@map': COBIL00
    fields:
      ACTIDIN: '00000000001'
      CONFIRM: 'Y'
