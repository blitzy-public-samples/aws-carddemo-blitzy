  - id: CVE-2026-10050
    purls:
      - pkg:maven/org.eclipse.jetty/jetty-security@12.0.34
    statement: >-
      apache/kafka:4.2.1 | owner: project owner | Bundled library reached only by the broker's embedded HTTP surfaces, which this platform neither configures nor exposes: every client speaks the Kafka protocol over the one listener each deployment declares. The package scope below excuses this library alone.
    expired_at: 2026-11-30
