        SEC-USR-LNAME: 'CASGRAIN            '
        SEC-USR-PWD: PASSWORD
        SEC-USR-TYPE: A
        SEC-USR-FILLER: '                       '
      - SEC-USR-ID: ADMIN005
        SEC-USR-FNAME: 'GRANVILLE           '
        SEC-USR-LNAME: 'LACHAPELLE          '
        SEC-USR-PWD: PASSWORD
