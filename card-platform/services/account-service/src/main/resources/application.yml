# Runtime configuration for account-service. The service reads and updates accounts
# and customers, and closes the billing cycle for one account.
# Rationale for every value below: card-platform/docs/decision-log.md

server:
  # Port inside the container. Dockerfile and docker-compose.yml probe
  # http://localhost:8080/actuator/health, and ACCOUNT_PORT publishes it on the host.
  port: 8080

spring:
  application:
    name: account-service

  # docker-compose.yml points this container at the carddemo_account database and the
  # account_service schema, one private pair per service.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${ACCOUNT_DB_NAME:carddemo_account}?currentSchema=${ACCOUNT_DB_SCHEMA:account_service}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:carddemo}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:carddemo}}
    driver-class-name: org.postgresql.Driver

  # Flyway creates the account_service schema and its eight tables. The scripts under
  # db/migration issue no CREATE SCHEMA.
  flyway:
    enabled: true
    schemas: ${SPRING_FLYWAY_SCHEMAS:${ACCOUNT_DB_SCHEMA:account_service}}
    default-schema: ${SPRING_FLYWAY_DEFAULT_SCHEMA:${ACCOUNT_DB_SCHEMA:account_service}}
    create-schemas: true
    baseline-on-migrate: false
    validate-on-migrate: true

  # Jakarta Persistence (JPA) checks the entity mapping against the migrated schema at
  # boot and writes no Data Definition Language (DDL).
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:${ACCOUNT_DB_SCHEMA:account_service}}
        auto_quote_keyword: true

  # messaging/EventPublisherPort.java passes a topic, a key and a payload, all strings.
  # The payload arrives serialized as JavaScript Object Notation (JSON). This module
  # registers no listener, and docker-compose.yml sets no consumer group on it.
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        max.block.ms: 5000
    consumer:
      enable-auto-commit: false
    listener:
      ack-mode: manual

# Properties this module owns. The broker auto-creates the topic below on first
# publish. The suffix names the dead-letter topic account.state-changed.DLT, matching
# the names docker-compose.yml creates. outbox/OutboxRelay sweeps on the delay below,
# enabled by @EnableScheduling on AccountApplication.java.
carddemo:
  kafka:
    topics:
      account-state-changed: account.state-changed
      dead-letter-suffix: ${TOPIC_DEAD_LETTER_SUFFIX:.DLT}
  outbox:
    relay:
      fixed-delay-ms: ${OUTBOX_RELAY_INTERVAL_MS:500}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:100}
  consumer:
    retry:
      max-attempts: ${CONSUMER_MAX_RETRY_ATTEMPTS:3}
      backoff-ms: ${CONSUMER_RETRY_BACKOFF_MS:1000}

# config/ObservabilityConfig.java names this endpoint list and registers seven meters.
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,metrics,prometheus}
  prometheus:
    metrics:
      export:
        enabled: true

# Each log line leaves as JSON through logstash-logback-encoder 9.0, declared in
# pom.xml. No logback-spring.xml sits beside this file.
logging:
  structured:
    format:
      console: logstash
  level:
    root: ${LOG_LEVEL:INFO}
    com.carddemo: ${LOG_LEVEL_CARDDEMO:DEBUG}
