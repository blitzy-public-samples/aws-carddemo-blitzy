# Test profile for transaction-service: boots slice/context/integration tests without a live Redis,
# against a throwaway Testcontainers PostgreSQL. Activated via @ActiveProfiles("test").
spring:
  autoconfigure:
    # Neutralize Redis + Spring Session auto-config so the context loads without a running Redis.
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - org.springframework.boot.session.autoconfigure.SessionAutoConfiguration
      - org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration
  datasource:
    # Testcontainers JDBC-URL scheme: auto-provisions an ephemeral postgres:18 container.
    # Overridable by ITs via @ServiceConnection / @DynamicPropertySource.
    url: jdbc:tc:postgresql:18:///carddemo
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history_transaction
  # The transaction-posting batch job runs on demand via JobLauncher, never at startup.
  batch:
    job:
      enabled: false
logging:
  level:
    com.carddemo: INFO
    org.flywaydb: INFO
    org.testcontainers: WARN
    com.github.dockerjava: WARN
