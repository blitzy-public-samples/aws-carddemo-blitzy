# Add User with the last name left empty. ADMIN001 (type A) signs on through
# CC00 and COSGN00C transfers control to COADM01C [app/cbl/COSGN00C.cbl:221-237],
# which sends the admin menu COADM01 [app/cbl/COADM01C.cbl:85-90]. Option '2' is
# 'User Add (Security)', program COUSR01C [app/cpy/COADM02Y.cpy:29-32], and
# COADM01C XCTLs to it with CDEMO-PGM-CONTEXT 0 [app/cbl/COADM01C.cbl:136-145].
# COUSR01C, not re-entered, sends COUSR01 with empty fields and a blank message
# and returns TRANSID CU01 with CDEMO-PGM-REENTER set
# [app/cbl/COUSR01C.cbl:73-110,184-196].
#
# The third step fills every field except the last name and presses ENTER.
# PROCESS-ENTER-KEY tests the fields in screen order: the first name is supplied,
# so the second WHEN fires on LNAMEI = SPACES OR LOW-VALUES, moves 'Last Name
# can NOT be empty...' to WS-MESSAGE and sends COUSR01 again
# [app/cbl/COUSR01C.cbl:115-129]. ERR-FLG-ON skips WRITE-USER-SEC-FILE
# [app/cbl/COUSR01C.cbl:153-160], so USRSEC keeps exactly its 10 fixture users
# and TESTU001, which would sort between ADMIN005 and USER0001, is absent.
#
# Expected values are derived from the source (no TPE region runs in CI):
# - COUSR1AO redefines COUSR1AI [app/cpy-bms/COUSR01.CPY:91], so the fields come
#   back as received: FNAME is TESTFIRST padded with blanks to its 20 positions,
#   LNAME stays empty (20 blanks as captured), USERID and USRTYPE as entered.
#   PASSWD is a dark (DRK) field and is not asserted.
# - ERRMSG is the 78-byte ERRMSGO: the 29-character message and 49 spaces
#   (WS-MESSAGE X(80) moved to X(78)); comparisons never trim.
# - The header is POPULATE-HEADER-INFO's [app/cbl/COUSR01C.cbl:214-233]: the
#   COTTL01Y titles, CU01, COUSR01C, CURDATE as mm/dd/yy of the run date and
#   CURTIME as hh:mm:ss, both from the region clock, hence matchers.
# - TESTU001 and TESTPWD1 are the user record being added on COUSR01, never a
#   sign-on credential, and the record is never written.
id: USR-COUSR01C-negative-03
level: e2e
type: negative
description: >-
  ADMIN001 signs on, chooses admin option 2 'User Add (Security)' and submits
  the COUSR01 Add User screen with first name, user id, password and user type
  filled but the last name empty. COUSR01C sends COUSR01 again with 'Last Name
  can NOT be empty...' in ERRMSG and the entered values kept, and writes no
  USRSEC record.
inventory_ids:
- INV-USR-024  # COUSR01C message 'Last Name can NOT be empty...' (rule)
- INV-USR-002  # COUSR01C program
- INV-MNU-004  # COADM01 map, the admin menu option 2 is entered on
- INV-USR-006  # COUSR01 map, the Add User screen
- INV-CFG-024  # CU01 transaction, under which the add request is processed
- INV-CFG-008  # USRSEC CSD file, read at sign-on and asserted unchanged
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA carrying CDEMO-PGM-CONTEXT
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the header date and time
- INV-LAY-008  # CSMSG01Y copybook, copied by COUSR01C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-004  # user administration (USR) end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    # COSGN00C reads the sign-on user; COUSR01C would add the new user here.
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: ADMIN001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '2'}
    '@map': COADM01
  # The empty value leaves the last name field empty.
  - aid: ENTER
    fields: {FNAME: TESTFIRST, LNAME: '', USERID: TESTU001, PASSWD: TESTPWD1, USRTYPE: U}
    '@map': COUSR01
expected:
  screens:
  - '@map': COADM01
  - '@map': COUSR01
    TRNNAME: CU01
    PGMNAME: COUSR01C
    ERRMSG: '                                                                              '
  - '@map': COUSR01
    TRNNAME: CU01
    PGMNAME: COUSR01C
    TITLE01: '      AWS Mainframe Modernization       '
    TITLE02: '              CardDemo                  '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    FNAME: 'TESTFIRST           '
    LNAME: '                    '
    USERID: TESTU001
    USRTYPE: U
    ERRMSG: 'Last Name can NOT be empty...                                                 '
  file_state:
    # No record is written: the 10 fixture users remain, in key order.
    USRSEC:
      count: 10
      records:
      - SEC-USR-ID: ADMIN001
      - SEC-USR-ID: ADMIN002
      - SEC-USR-ID: ADMIN003
      - SEC-USR-ID: ADMIN004
      - SEC-USR-ID: ADMIN005
      - SEC-USR-ID: USER0001
      - SEC-USR-ID: USER0002
      - SEC-USR-ID: USER0003
      - SEC-USR-ID: USER0004
      - SEC-USR-ID: USER0005
