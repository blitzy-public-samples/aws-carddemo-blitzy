# The card view refuses a card id filter that is not a 16-digit number.
# USER0001 (type U in the USRSEC fixture) signs on through CC00 and COSGN00C
# routes it to the main menu COMEN01C [app/cbl/COSGN00C.cbl:221-240]. Option 4
# 'Credit Card View' makes COMEN01C XCTL to COCRDSLC with CDEMO-FROM-PROGRAM
# COMEN01C and CDEMO-PGM-CONTEXT 0 [app/cpy/COMEN02Y.cpy:43-47]
# [app/cbl/COMEN01C.cbl:117-155]. Called from the menu and not re-entered,
# COCRDSLC initializes the COMMAREA, takes the CDEMO-PGM-ENTER path and sends
# COCRDSL: both filters LOW-VALUES because CDEMO-ACCT-ID and CDEMO-CARD-NUM are
# zero, the INFOMSG prompt 'Please enter Account and Card Number' because
# WS-INFO-MSG starts blank, and no error. It sets CDEMO-PGM-REENTER and returns
# TRANSID CCDL [app/cbl/COCRDSLC.cbl:254-279,349-356,394-406,457-497,563-576].
#
# Step 3 enters repository account 00000000050 (cardxref.txt and carddata.txt
# record 1) with the letters ABCDEFGHIJKLMNOP as the card id. On re-entry
# 2000-PROCESS-INPUTS receives both FSET fields and 2200-EDIT-MAP-INPUTS moves
# them to CC-ACCT-ID and CC-CARD-NUM [app/cbl/COCRDSLC.cbl:357-358,582-627].
# 2210-EDIT-ACCOUNT finds the account supplied, non-zero and numeric, stores it
# in CDEMO-ACCT-ID and leaves WS-RETURN-MSG off [app/cbl/COCRDSLC.cbl:647-679].
# 2220-EDIT-CARD finds the card id neither blank nor zero (no letter has a zero
# digit in ASCII or EBCDIC), then NOT NUMERIC: it sets INPUT-ERROR and
# FLG-CARDFILTER-NOT-OK, moves 'CARD ID FILTER,IF SUPPLIED MUST BE A 16 DIGIT
# NUMBER' to WS-RETURN-MSG because no earlier edit set a message, and zeroes
# CDEMO-CARD-NUM [app/cbl/COCRDSLC.cbl:685-720]. Neither filter is blank, so the
# cross-field edit leaves the message alone [app/cbl/COCRDSLC.cbl:637-640].
#
# INPUT-ERROR skips 9000-READ-DATA, so no CARDDAT read is issued although the
# CARDDATA fixture holds the card master, and COCRDSL is sent again
# [app/cbl/COCRDSLC.cbl:360-363,726-750]. 1200-SETUP-SCREEN-VARS echoes the
# accepted account from CC-ACCT-ID but, with CDEMO-CARD-NUM zero, moves
# LOW-VALUES to CARDSIDO: the rejected card id is not shown back. The filter is
# refused rather than blank, so 1300-SETUP-SCREEN-ATTRS writes no '*' in
# CARDSID, only colours it red. FOUND-CARDS-FOR-ACCOUNT is not set, so the name,
# status and expiry fields stay LOW-VALUES, and INFOMSG shows the prompt again
# [app/cbl/COCRDSLC.cbl:457-497,533-551].
#
# Screen fields are compared at their full BMS length, trailing spaces
# included: ERRMSG is the 75-byte WS-RETURN-MSG padded to the 80-byte field,
# INFOMSG the 40-byte WS-INFO-MSG, and positions the program leaves LOW-VALUES
# read back as spaces [app/bms/COCRDSL.bms:84-147]. CURDATE and CURTIME come
# from the region clock, so they are matchers. The expected outcome is derived
# from the source: no TPE region runs in CI (GAP-INF-006). No step writes a
# file, so file_state is not asserted.
id: CRD-COCRDSLC-negative-08
level: e2e
type: negative
description: >-
  USER0001 signs on, selects option 4 'Credit Card View' on the main menu and,
  on the COCRDSLC card view screen (CCDL), enters account 00000000050 with the
  non-numeric card id ABCDEFGHIJKLMNOP. COCRDSLC reads no file and sends the
  card view again with 'CARD ID FILTER,IF SUPPLIED MUST BE A 16 DIGIT NUMBER'
  in the message line, the account kept, the card id cleared, the prompt
  'Please enter Account and Card Number' and no card details.
# The message is the primary item. After it come the program, the maps asserted
# (COMEN01 on step 1, COCRDSL on steps 2 and 3), the transaction that runs the
# edit, and the online-only copybooks COCRDSLC copies. No CSD file is read. The
# batch copybooks (CVACT02Y, CVCUS01Y, CSUSR01Y) and the data files are left
# out, because their lowest executing level is unit or integration.
inventory_ids:
- INV-CRD-040  # COCRDSLC message 'CARD ID FILTER,IF SUPPLIED MUST BE A 16 DIGIT NUMBER' (rule)
- INV-CRD-002  # COCRDSLC program
- INV-MNU-003  # COMEN01 map, the main menu option 4 is entered on
- INV-CRD-005  # COCRDSL map, sent on entry and again with the refusal
- INV-CFG-013  # CCDL transaction, the TRANSID COCRDSLC returns with and the ENTER runs under
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA whose reenter flag routes the ENTER to the edits
- INV-LAY-005  # COTTL01Y copybook, TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y copybook, CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y copybook, copied by COCRDSLC
- INV-LAY-009  # CSMSG02Y copybook, the abend data of COCRDSLC's HANDLE ABEND
- INV-LAY-011  # CSSTRPFY copybook, YYYY-STORE-PFKEY mapping ENTER to CCARD-AID-ENTER
- INV-LAY-019  # CVCRD01Y copybook, CCARD-AID and the CC-ACCT-ID and CC-CARD-NUM filters
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-006  # CRD end-to-end baselines derived from the source, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    # USRSEC holds the sign-on user. CARDDATA holds the repository cards,
    # including card 0500024453765740 of account 00000000050, so the refusal
    # cannot come from absent data; the edit stops before any read.
    USRSEC: {base: USRSEC}
    CARDDATA: {base: CARDDATA}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - {transid: CC00, aid: ENTER, fields: {USERID: USER0001, PASSWD: PASSWORD}, '@map': COSGN00}
  - {aid: ENTER, fields: {OPTION: '4'}, '@map': COMEN01}
  - {aid: ENTER, fields: {ACCTSID: '00000000050', CARDSID: 'ABCDEFGHIJKLMNOP'}, '@map': COCRDSL}
expected:
  screens:
  # One entry per step, each the screen the step ends on.
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    ERRMSG: '                                                                              '
  - '@map': COCRDSL
    TRNNAME: CCDL
    PGMNAME: COCRDSLC
    ACCTSID: '           '
    CARDSID: '                '
    INFOMSG: 'Please enter Account and Card Number    '
    ERRMSG: '                                                                                '
  - '@map': COCRDSL
    TRNNAME: CCDL
    PGMNAME: COCRDSLC
    TITLE01: '      AWS Mainframe Modernization       '
    TITLE02: '              CardDemo                  '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    ACCTSID: '00000000050'
    CARDSID: '                '
    CRDNAME: '                                                  '
    CRDSTCD: ' '
    EXPMON: '  '
    EXPYEAR: '    '
    INFOMSG: 'Please enter Account and Card Number    '
    ERRMSG: 'CARD ID FILTER,IF SUPPLIED MUST BE A 16 DIGIT NUMBER                            '
  # The ERRMSG of each step's screen, in step order.
  messages:
  - '                                                                              '
  - '                                                                                '
  - 'CARD ID FILTER,IF SUPPLIED MUST BE A 16 DIGIT NUMBER                            '
