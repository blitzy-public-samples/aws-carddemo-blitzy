# Manifest of the derived baseline of CRD-COCRDSLC-negative-01: S beside the
# first card of the card list makes COCRDLIC transfer to COCRDSLC, which reads
# card 0500024453765740 and shows it with '   Displaying requested details'
# [app/cbl/COCRDLIC.cbl:517-541] [app/cbl/COCRDSLC.cbl:339-348,736-754]. Only
# unikix can run the scenario, so expected.yaml is authored from the source and
# is inferred-not-observed (GAP-INF-006, GAP-INF-012). It names no execution_id
# or execution_fingerprint and holds no datasets/ until an eligible UniKix run
# is imported (report.py --import-unikix), which rewrites this file.
#
# source_identity.units are every app/ source the four programs the steps run
# contribute, not COCRDSLC's alone: the COPY closure (as harness.results
# computes it for a program, symbolic maps in app/cpy-bms included) of
# COSGN00C, which signs USER0001 on; of COMEN01C, whose option 3 transfers to
# COCRDLIC; of COCRDLIC, whose list row 1 is selected; and of COCRDSLC, which
# shows the card; plus the BMS sources of their maps COSGN00, COMEN01, COCRDLI
# and COCRDSL. DFHAID and DFHBMSCA are CICS-supplied and not in the repository.
# app/ is unchanged since the suite's starting commit.
