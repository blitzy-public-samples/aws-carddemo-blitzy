# Manifest of the derived baseline of RPT-CORPT00C-negative-12: USER0001 takes
# main-menu option 9 to CORPT00C and asks for a custom report ending 07/50/2022,
# refused with 'End Date - Not a valid Day...' [app/cbl/CORPT00C.cbl:364-371].
# Only unikix can run the scenario, so expected.yaml is authored from the
# source and is inferred-not-observed (GAP-INF-009, GAP-INF-012). It names no
# execution_id or execution_fingerprint and holds no datasets/ until report.py
# --import-unikix promotes an eligible UniKix run.
#
# source_identity.units are the app/ sources the three steps execute, not only
# CORPT00C's: a source identity names every program, copybook and map that ran,
# and expected.yaml asserts the COMEN01 screen as well as CORPT00. They are the
# COPY closure (inventory_tools.copy_closure) of COSGN00C, which signs USER0001
# on and XCTLs to COMEN01C [app/cbl/COSGN00C.cbl:230-240]; of COMEN01C, whose
# option 9 XCTLs to CORPT00C [app/cpy/COMEN02Y.cpy:74-78]; and of CORPT00C;
# plus the BMS sources of COSGN00, COMEN01 and CORPT00. CSUTLDTC, which
# CORPT00C CALLs to validate the dates [app/cbl/CORPT00C.cbl:392], is left out:
# the end-day refusal sends the map and returns to CICS before that CALL, so it
# does not run. DFHAID and DFHBMSCA are CICS-supplied, not app/ sources.
# source_commit is HEAD at authoring; app/ is byte-identical to the suite's
# starting commit 93ebec71ff7b59a68cedd7c501afe496a8eaa68d.
