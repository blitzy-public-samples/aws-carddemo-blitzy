# Derived baseline (capture_platform: derived) of CRD-COCRDUPC-negative-08,
# authored from app/cbl/COCRDUPC.cbl:92-99,160-198,877-945,1095-1165,1280-1317
# and app/bms/COCRDUP.bms at commit 93ebec71ff7b59a68cedd7c501afe496a8eaa68d,
# because no TPE region runs in CI; inferred-not-observed (GAP-INF-006,
# GAP-INF-012), replaced when report.py --import-unikix promotes an eligible
# UniKix run. It pins the source as it stands.
#
# One screen per step, each the screen the step's AID ends on. Step 1:
# USER0001 reaches the main menu (CM00), whose option 5 reads 'Credit Card
# Update' [app/cpy/COMEN02Y.cpy:49-53]. Step 2: option 5 XCTLs to COCRDUPC
# with CDEMO-PGM-CONTEXT 0, a fresh entry that sends the empty search map
# (ACCTSID and CARDSID left LOW-VALUES, captured as spaces) with
# PROMPT-FOR-SEARCH-KEYS [app/cbl/COCRDUPC.cbl:502-511,1141-1142]. Step 3:
# 9000-READ-DATA reads card 0500024453765740 (account 00000000050) and shows
# it with the name upper-cased under FOUND-CARDS-FOR-ACCOUNT
# [app/cbl/COCRDUPC.cbl:1107-1112,1145-1146,1343-1394]. Step 4: month 15
# makes the new data differ from the old, so 1200 sets CCUP-CHANGES-NOT-OK
# [app/cbl/COCRDUPC.cbl:679-696]; name ANIYA VON and status Y pass, and
# 1250-EDIT-EXPIRY-MON refuses 15, which is supplied but not VALID-MONTH
# (1 THRU 12), with CARD-EXPIRY-MONTH-NOT-VALID while WS-RETURN-MSG is off
# [app/cbl/COCRDUPC.cbl:92-95,197-198,877-908]; year 2023 passes. 2000
# continues without READ UPDATE or REWRITE [app/cbl/COCRDUPC.cbl:982-983];
# 3200 shows the entered values (CCUP-CHANGES-MADE), so EXPMON reads 15, and
# 3250 moves PROMPT-FOR-CHANGES to INFOMSG and WS-RETURN-MSG to ERRMSG
# [app/cbl/COCRDUPC.cbl:1113-1123,1147-1148,1161-1163]. FKEYSC stays dark,
# captured as blanks, because only PROMPT-FOR-CONFIRMATION brightens it
# [app/cbl/COCRDUPC.cbl:1315-1317].
#
# Text fields are at their full BMS length with trailing spaces: INFOMSG is
# the 40-byte WS-INFO-MSG, ERRMSG the 75-byte WS-RETURN-MSG padded to 80
# (78 on COMEN01). CURDATE and CURTIME come from the region clock, so they are
# matchers in the MM/DD/YY and HH:MM:SS forms of CSDAT01Y
# [app/cpy/CSDAT01Y.cpy:30-41]. CARDDATA keeps its 50 records, card
# 0500024453765740 as loaded (expiry 2023-03-09, name in its original case).
# The data below is canonical harness.dump_yaml.
file_state:
  CARDDATA:
    contains:
    - CARD-ACCT-ID: '50'
      CARD-ACTIVE-STATUS: Y
      CARD-CVV-CD: '747'
      CARD-EMBOSSED-NAME: 'Aniya Von                                         '
      CARD-EXPIRAION-DATE: '2023-03-09'
      CARD-NUM: '0500024453765740'
    count: 50
screens:
- '@map': COMEN01
  ERRMSG: '                                                                              '
  OPTN005: '05. Credit Card Update                  '
  PGMNAME: COMEN01C
  TRNNAME: CM00
- '@map': COCRDUP
  ACCTSID: '           '
  CARDSID: '                '
  ERRMSG: '                                                                                '
  INFOMSG: 'Please enter Account and Card Number    '
  PGMNAME: COCRDUPC
  TRNNAME: CCUP
- '@map': COCRDUP
  ACCTSID: '00000000050'
  CARDSID: '0500024453765740'
  CRDNAME: 'ANIYA VON                                         '
  CRDSTCD: Y
  ERRMSG: '                                                                                '
  EXPMON: '03'
  EXPYEAR: '2023'
  INFOMSG: 'Details of selected card shown above    '
  PGMNAME: COCRDUPC
  TRNNAME: CCUP
- '@map': COCRDUP
  ACCTSID: '00000000050'
  CARDSID: '0500024453765740'
  CRDNAME: 'ANIYA VON                                         '
  CRDSTCD: Y
  CURDATE:
    format: '%m/%d/%y'
    match: run-date
  CURTIME:
    match: run-time
  ERRMSG: 'Card expiry month must be between 1 and 12                                      '
  EXPMON: '15'
  EXPYEAR: '2023'
  FKEYS: ENTER=Process F3=Exit
  FKEYSC: '                  '
  INFOMSG: 'Update card details presented above.    '
  PGMNAME: COCRDUPC
  TITLE01: '      AWS Mainframe Modernization       '
  TITLE02: '              CardDemo                  '
  TRNNAME: CCUP
