# The boundary of the CBTRN02C over-limit rule. 1500-B-LOOKUP-ACCT computes
# WS-TEMP-BAL = ACCT-CURR-CYC-CREDIT - ACCT-CURR-CYC-DEBIT + DALYTRAN-AMT and
# rejects with 0102 only when ACCT-CREDIT-LIMIT is below it; the comparison is
# >=, so a projected cycle balance equal to the limit posts
# [app/cbl/CBTRN02C.cbl:403-413]. Repository account 00000000001 has
# ACCT-CREDIT-LIMIT 2020.00, ACCT-CURR-BAL 194.00 and both cycle fields 0.00
# [app/data/ASCII/acctdata.txt:1], and card 9680294154603697 cross-references it
# [app/data/ASCII/cardxref.txt:49], so the one synthetic transaction of 2020.00
# lands exactly on the limit. Its origination date is before ACCT-EXPIRAION-DATE
# 2025-05-20, so the expiry check passes too [app/cbl/CBTRN02C.cbl:414-420].
# TCATBALF already holds 00000000001/01/0001 at 0.00 [app/data/ASCII/tcatbal.txt:1],
# so the posting updates it rather than creating one.
#
# Decoded values follow harness/codec.py: unsigned numeric fields lose their
# leading zeros (ACCT-ID 00000000001 is '1'), amounts keep their scale, and text
# fields keep their trailing spaces. TRAN-PROC-TS is the fixed run clock.
id: TRN-CBTRN02C-boundary-01
level: unit
type: boundary
description: >-
  A daily transaction whose amount brings the account's cycle balance exactly to
  its credit limit (0.00 - 0.00 + 2020.00 = 2020.00) is posted, not rejected as
  0102 OVERLIMIT TRANSACTION: TRANSACT receives the transaction, account
  00000000001 moves from 194.00 to 2214.00 with ACCT-CURR-CYC-CREDIT 2020.00, its
  TCATBAL record for type 01 category 0001 moves from 0.00 to 2020.00, DALYREJS
  stays empty and the run ends with return code 0.
inventory_ids:
- INV-TRN-076  # CBTRN02C reject 102 overlimit (rule)
- INV-TRN-008  # CBTRN02C program
- INV-TRN-081  # CBTRN02C balance posting (calculation)
- INV-LAY-025  # CVTRA05Y copybook, the TRANSACT layout
- INV-LAY-016  # CVACT01Y copybook, the ACCTDATA layout
- INV-LAY-021  # CVTRA01Y copybook, the TCATBALF layout
- INV-DTA-003  # cardxref.txt, the CARDXREF fixture source
- INV-DTA-013  # EBCDIC card cross-reference file, its cross-check counterpart
- INV-DTA-001  # acctdata.txt, the ACCTDATA fixture source
- INV-DTA-011  # EBCDIC account data file, its cross-check counterpart
- INV-DTA-007  # tcatbal.txt, the TCATBALF fixture source
- INV-DTA-018  # EBCDIC category balance file, its cross-check counterpart
tags: []
gap_ids:
- GAP-STB-010  # Berkeley DB indexed files in place of the VSAM KSDS; TRANFILE is recreated by OPEN OUTPUT
- GAP-STB-011  # GnuCOBOL compile and runtime options in place of Enterprise COBOL and LE
