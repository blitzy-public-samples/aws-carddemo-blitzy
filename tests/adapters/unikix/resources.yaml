  CBADMCDJ:
    member: jcl/CBADMCDJ
    card_name: CBADMCDJ
    steps:
    - {name: STEP1, exec: PGM=DFHCSDUP, parm: 'CSD(READWRITE),PAGESIZE(60),NOCOMPAT'}
    programs: []
    procs: []
    ctl: []
    region_actions: []
    gap_ids: [GAP-MIS-016, GAP-DOC-017]
    notes: >-
      STEP1 runs the z/OS CICS utility DFHCSDUP from OEM.CICSTS.V05R06M0.CICS.SDFHLOAD against
      OEM.CICSTS.DFHCSD; no UniKix equivalent is known (GAP-MIS-016). The test-owned region takes its resources
      from the copy's catlg/tpe lists, installed at region creation, never from this job. The job defines
