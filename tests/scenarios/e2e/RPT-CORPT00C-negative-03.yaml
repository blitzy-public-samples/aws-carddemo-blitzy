# Custom report with the start day left empty. USER0001 signs on through CC00
# and COSGN00C routes the type-U user to COMEN01C, which sends the main menu
# COMEN01. Option '9' is 'Transaction Reports', program CORPT00C
# [app/cpy/COMEN02Y.cpy:74-78]. COMEN01C transfers control with XCTL and a zero
# CDEMO-PGM-CONTEXT, so CORPT00C takes its first-entry path: it sets
# CDEMO-PGM-REENTER, clears CORPT0AO, sends CORPT00 with a blank message line
# and returns with TRANSID(CR00) [app/cbl/CORPT00C.cbl:172-181,199-202,556-591].
#
# The third step selects Custom, fills every date part except the start day and
# presses ENTER under CR00. CORPT00C receives the map; MONTHLY and YEARLY are
# blank, so the CUSTOM branch runs its empty checks in the order start month,
# start day, start year, end month, end day, end year. The start month is
# supplied, so the second WHEN fires on SDTDDI = SPACES OR LOW-VALUES: it moves
# 'Start Date - Day can NOT be empty...' to WS-MESSAGE, sets WS-ERR-FLG, puts
# the cursor on SDTDD and performs SEND-TRNRPT-SCREEN
# [app/cbl/CORPT00C.cbl:256-272]. That paragraph ends with GO TO RETURN-TO-CICS,
# so the task ends there [app/cbl/CORPT00C.cbl:556-591]: the NUMVAL-C
# conversions, the CSUTLDTC date checks and SUBMIT-JOB-TO-INTRDR are never
# reached, no confirmation is asked and no JCL record is written to the JOBS
# queue [app/cbl/CORPT00C.cbl:305-436,462-535].
#
# That nothing is submitted shows in ERRMSG, which holds the empty-day message
# instead of 'Please confirm to print the Custom report...' or 'Custom report
# submitted for printing ...'. @TDQ:JOBS is deliberately not asserted: its
# capture (GAP-MIS-017) is scoped to RPT-CORPT00C-normal-01..03, and asserting
# it here would block this date-field rule on a capture the rule never reaches.
#
# Expected values are derived from the source (no TPE region runs in CI):
# - CORPT0AO redefines CORPT0AI [app/cpy-bms/CORPT00.CPY:121], so the received
#   values are sent back as entered: CUSTOM 'X', the start month and year and
#   the whole end date. SDTDD, never typed into, keeps its blank INITIAL '  '
#   and MONTHLY and YEARLY their blank INITIAL ' ' [app/bms/CORPT00.bms:80-143].
#   CONFIRM carries no business outcome on this path and is not asserted.
# - ERRMSG is the 78-byte ERRMSGO: the 36-character message followed by spaces
#   from the 80-byte WS-MESSAGE; comparisons never trim.
# - The header is POPULATE-HEADER-INFO's [app/cbl/CORPT00C.cbl:609-628]: the
#   COTTL01Y titles, CR00, CORPT00C, CURDATE as mm/dd/yy of the run date and
#   CURTIME as hh:mm:ss, both from the region clock, hence matchers.
id: RPT-CORPT00C-negative-03
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses option 9 'Transaction Reports' on the main menu
  and submits a Custom report on CORPT00 with every date part filled except the
  start day. CORPT00C sends CORPT00 again under CR00 with 'Start Date - Day can
  NOT be empty...' in ERRMSG and the entered values kept; it asks for no
  confirmation and submits no report job.
inventory_ids:
- INV-RPT-012  # CORPT00C message 'Start Date - Day can NOT be empty...' (rule)
- INV-RPT-001  # CORPT00C program
- INV-MNU-003  # COMEN01 map, the main menu option 9 is entered on
- INV-RPT-002  # CORPT00 map, the report screen the custom request is entered on and sent again
- INV-CFG-019  # CR00 transaction, under which the custom request is processed
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA that makes the third step a reentry
- INV-LAY-005  # COTTL01Y copybook, TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y copybook, CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y copybook, copied by CORPT00C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-009  # report submission (RPT) end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    # COSGN00C reads the sign-on user USER0001; CORPT00C reads no file.
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: USER0001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '9'}
    '@map': COMEN01
  # SDTDD is left out, so the start day keeps its blank initial value.
  - aid: ENTER
    fields: {CUSTOM: X, SDTMM: '01', SDTYYYY: '2022', EDTMM: '07', EDTDD: '06', EDTYYYY: '2022'}
    '@map': CORPT00
expected:
  screens:
  - '@map': COMEN01
  - '@map': CORPT00
    TRNNAME: CR00
    PGMNAME: CORPT00C
    ERRMSG: '                                                                              '
  - '@map': CORPT00
    TRNNAME: CR00
    PGMNAME: CORPT00C
    TITLE01: '      AWS Mainframe Modernization       '
    TITLE02: '              CardDemo                  '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    MONTHLY: ' '
    YEARLY: ' '
    CUSTOM: X
    SDTMM: '01'
    SDTDD: '  '
    SDTYYYY: '2022'
    EDTMM: '07'
    EDTDD: '06'
    EDTYYYY: '2022'
    ERRMSG: 'Start Date - Day can NOT be empty...                                          '
