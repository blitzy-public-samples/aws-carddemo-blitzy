# Manifest of the derived baseline of USR-COUSR03C-normal-01: ADMIN001 deletes
# the invented user TESTU002 through COUSR03C (transaction CU03), ENTER to fetch
# it and PF5 to delete it. Only unikix can run the scenario, so expected.yaml is
# authored from the source and is inferred-not-observed (GAP-INF-004,
# GAP-INF-012). It names no execution_id or execution_fingerprint and holds no
# datasets/ until report.py --import-unikix promotes an eligible UniKix run.
#
# source_identity.units are the app/ sources the four steps execute, not only
# COUSR03C's: the sign-on step runs COSGN00C, which XCTLs the type-A ADMIN001
# to COADM01C; the option step runs COADM01C, whose COADM01 screen is asserted,
# and whose option 4 XCTLs to COUSR03C; the fetch and delete steps run
# COUSR03C, which reads and deletes the CSUSR01Y record in USRSEC. Each program
# contributes its COPY closure (inventory_tools.copy_closure) and its BMS map.
# DFHAID and DFHBMSCA are CICS-supplied, not app/ sources, so they are absent.
