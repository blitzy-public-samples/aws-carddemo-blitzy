# Derived from source (capture_platform: derived), never observed; open under
# GAP-INF-003 and GAP-INF-012 until a UniKix run is imported. Step 1: ADMIN001
# signs on and COADM01C's first entry sends COADM01 with a blank message line
# [app/cbl/COSGN00C.cbl:223-236] [app/cbl/COADM01C.cbl:79-90]. Step 2: PF5
# reaches WHEN OTHER, which moves CCDA-MSG-INVALID-KEY to WS-MESSAGE and resends
# COADM01 with its header and the four COADM02Y options; no XCTL follows
# [app/cbl/COADM01C.cbl:92-110,172-263] [app/cpy/CSMSG01Y.cpy:20-21].
# OPTN005-OPTN012 show blanks: BUILD-MENU-OPTIONS fills only the four options,
# and those fields carry INITIAL=' ' [app/bms/COADM01.bms]. Values are full BMS
# width with trailing spaces kept; messages holds each step's ERRMSG.
messages:
- '                                                                              '
- 'Invalid key pressed. Please see below...                                      '
screens:
- '@map': COADM01
  ERRMSG: '                                                                              '
  PGMNAME: COADM01C
  TRNNAME: CA00
- '@map': COADM01
  CURDATE:
    format: '%m/%d/%y'
    match: run-date
  CURTIME:
    match: run-time
  ERRMSG: 'Invalid key pressed. Please see below...                                      '
  OPTN001: '01. User List (Security)                '
  OPTN002: '02. User Add (Security)                 '
  OPTN003: '03. User Update (Security)              '
  OPTN004: '04. User Delete (Security)              '
  OPTN005: '                                        '
  OPTN006: '                                        '
  OPTN007: '                                        '
  OPTN008: '                                        '
  OPTN009: '                                        '
  OPTN010: '                                        '
  OPTN011: '                                        '
  OPTN012: '                                        '
  PGMNAME: COADM01C
  TITLE01: '      AWS Mainframe Modernization       '
  TITLE02: '              CardDemo                  '
  TRNNAME: CA00
