---
# =============================================================================
# k8s/deployment-card-service.yaml
# -----------------------------------------------------------------------------
# :purpose: Kubernetes Deployment for the CardDemo **card-service** Spring Boot
#           microservice - the REST re-platforming of the legacy COBOL card
#           programs COCRDLIC (card list, 7 rows/page, CICS tran-id CCLI),
#           COCRDSLC (card detail, CICS tran-id CCDL) and COCRDUPC (card
#           update, CICS tran-id CCUP). It owns the PostgreSQL ``cards`` and
#           ``card_xref`` tables, the latter being the legacy CXACAIX /
#           CVACT03Y card <-> customer <-> account cross-reference. See
#           AAP 0.3.1 and 0.4.2.
# :output:  A Deployment named ``card-service`` scheduling one replica whose
#           pod serves HTTP on container port 8080 (named ``http``).
# :notes:   * Image ``carddemo/card-service:1.0.0`` is built by
#             ``card-service/Dockerfile`` (FROM eclipse-temurin:21-jre; see
#             AAP 0.5.1). ``imagePullPolicy: IfNotPresent`` keeps a locally
#             built/loaded image from being re-pulled in a demo cluster.
#           * Runtime configuration is injected entirely via ``envFrom`` from
#             the shared ConfigMap ``carddemo-config`` (k8s/configmap.yaml,
#             non-secret settings) and Secret ``carddemo-card-service-db``
#             (k8s/secret.yaml, datasource credentials); nothing is hard-coded
#             in this manifest. Keys bind 1:1 to Spring Boot relaxed-binding
#             environment variables (SPRING_DATASOURCE_*, SPRING_DATA_REDIS_*).
#           * Observability (AAP 0.7.5): the startup, liveness, and readiness
#             probes target the Spring Boot Actuator health endpoints on the
#             HTTP port (8080) - /actuator/health, /actuator/health/liveness
#             and /actuator/health/readiness - which are enabled in the
#             service's application.yml
#             (management.endpoint.health.probes.enabled=true).
#           * The companion ``service-card-service.yaml`` (ClusterIP) selects
#             these pods via ``app: card-service`` and forwards to targetPort
#             8080.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: card-service
  labels:
    app: card-service
    app.kubernetes.io/name: card-service
    app.kubernetes.io/part-of: carddemo
    app.kubernetes.io/component: backend
spec:
  # Single replica for the reference deployment. The service is stateless -
  # pseudo-conversational state (the legacy CICS COMMAREA) lives in
  # Redis-backed Spring Session - so it can be scaled horizontally without any
  # additional coordination.
  replicas: 1
  selector:
    matchLabels:
      app: card-service
  template:
    metadata:
      labels:
        app: card-service
        app.kubernetes.io/name: card-service
        app.kubernetes.io/part-of: carddemo
        app.kubernetes.io/component: backend
    spec:
      # Pod-level runtime hardening: run as a non-root user with a
      # default seccomp profile and no auto-mounted ServiceAccount token
      # (these services never call the Kubernetes API).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      # Startup ordering gate: the shared CardDemo schema is provisioned by the
      # SINGLE Flyway migration owner, batch-service (see its application.yml and
      # docs/decision-log.md). This service runs with spring.flyway.enabled=false
      # and Hibernate ddl-auto=validate, so it can only start once that schema
      # exists; without the gate the pod crash-loops on
      # "Schema validation: missing table". The init container blocks until the
      # owner reports READY through its Actuator readiness group, using the same
      # bash /dev/tcp probe idiom as the Compose healthcheck (the eclipse-temurin
      # base image ships neither curl nor wget).
      initContainers:
        - name: await-schema
          image: eclipse-temurin:21-jre
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Bounded like every other container in this repository, init containers
          # included: in a namespace with no LimitRange an unbounded container is
          # admitted with no QoS guarantee and can be scheduled anywhere. The figures
          # suit what this container does - one bash loop issuing a TCP readiness
          # probe every 5 s - and were verified by running the same image and command
          # under exactly these limits.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          command:
            - bash
            - -c
            - >-
              until exec 3<>/dev/tcp/batch-service/8080 2>/dev/null
              && printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: batch-service\r\nConnection: close\r\n\r\n' >&3
              && grep -q '"status":"UP"' <&3;
              do echo 'waiting for the schema owner (batch-service) to become ready'; sleep 5; done;
              echo 'schema owner ready'
      containers:
        - name: card-service
          # Built by card-service/Dockerfile (FROM eclipse-temurin:21-jre).
          # Produced by `docker compose build card-service` from card-service/Dockerfile
          # (docker-compose.yml carries a matching `image:` key with these exact
          # registry/name/tag defaults), so this reference resolves to an artifact the
          # repository builds - no undocumented tag-and-push step.
          # Override the registry or tag for a private registry with
          # CARDDEMO_IMAGE_REGISTRY / CARDDEMO_IMAGE_TAG at build time.
          image: carddemo/card-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          # Inject every runtime setting from the shared ConfigMap and Secret;
          # never hard-code datasource/Redis values in this manifest.
          # Container-level runtime hardening: drop every Linux
          # capability, forbid privilege escalation, and run on a read-only
          # root filesystem (writable scratch is the mounted tmp emptyDir).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: carddemo-config
            # Per-service least-privilege database role: each service
            # authenticates with its own DB principal, not a shared owner.
            - secretRef:
                name: carddemo-card-service-db
            # Shared Redis AUTH secret for externalized Spring Session.
            - secretRef:
                name: carddemo-redis-secret
            # Shared AES-256-GCM key for at-rest PII field encryption
            # (carddemo-common CryptoConverter: SSN, government id, EFT account
            # id, CVV). Services fail closed if it is absent.
            - secretRef:
                name: carddemo-pii-key
            # Shared credential of the least-privilege `monitoring` principal
            # guarding /actuator/prometheus and /actuator/metrics. Must
            # match the password Prometheus presents, or every scrape gets 401.
            - secretRef:
                name: carddemo-monitoring-secret
          # `limits.memory` is what the image's JAVA_OPTS percentages resolve
          # against, so this figure - not a JVM flag - is what bounds the heap.
          # Measured working set for the whole nine-service stack under the AAP
          # 150-user load: 462-618 MiB resident per service, so 1Gi is held with
          # headroom.
          # `limits.cpu` is sized from the CPU cost per request measured over that
          # same load: 9.2 ms for the tier as a whole, and 105.5 ms for a sign-on,
          # of which ~72.8 ms is the password encoder alone. Two cores keeps every
          # service at or below half utilisation at the measured request rate, and
          # keeps the JVM's own ergonomics multi-core in every runtime.
          # docker-compose.yml declares the same budget.
          # Measurements and rationale: docs/decision-log.md section 50.
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          # Startup probe gates the liveness/readiness probes until the JVM and
          # Spring context have finished initializing. failureThreshold 30 x
          # periodSeconds 5 allows roughly 150s for a cold start before the
          # kubelet gives up and restarts the container.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            # Explicit timeout. The default timeoutSeconds is 1, so during any
            # datastore blip the aggregate health check — which must wait for the bounded
            # 3s HikariCP / 2s Lettuce dependency timeouts — fails on every attempt and the
            # pod is killed after failureThreshold x periodSeconds. 4s bounds each attempt
            # just above the slowest dependency timeout.
            timeoutSeconds: 4
            failureThreshold: 30
          # Liveness: restart the container if the Actuator liveness group
          # reports DOWN (an unrecoverable internal state).
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: withdraw the pod from the Service endpoints whenever the
          # readiness group reports DOWN (e.g. a lost PostgreSQL or Redis
          # dependency) so no traffic is routed to an unready instance.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      # Writable scratch for the read-only root filesystem. A Spring
      # Boot fat-jar only needs a writable /tmp (Tomcat work dir, JVM temp).
      volumes:
        - name: tmp
          emptyDir: {}
