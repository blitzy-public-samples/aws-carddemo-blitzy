# =============================================================================
# GitHub Actions Workflow: Backend CI/CD Pipeline
# =============================================================================
# Purpose: Comprehensive CI/CD pipeline for Spring Boot backend application
# - Builds Java 21 application with Maven 3.9.6
# - Executes JUnit 5 test suites with coverage analysis
# - Builds and pushes Docker images with security scanning
# - Deploys to Kubernetes staging and production environments
#
# Migration Context: Part of COBOL-to-Java CardDemo modernization
# Section Reference: Agent Action Plan 0.6 - Configuration and Infrastructure Files
# =============================================================================

name: Backend CI/CD

# =============================================================================
# Workflow Triggers
# =============================================================================
on:
  # Trigger on push to main or develop branches affecting backend code
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  
  # Trigger on pull requests targeting main or develop
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
  
  # Allow manual workflow execution
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip test execution (not recommended)'
        required: false
        default: false
        type: boolean

# =============================================================================
# Environment Variables
# =============================================================================
env:
  # Java and Maven versions per Section 0.5 Technology Stack
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  MAVEN_VERSION: '3.9.6'
  
  # Docker configuration
  DOCKER_REGISTRY: 'ghcr.io'
  IMAGE_NAME: 'carddemo-backend'
  
  # Kubernetes configuration
  K8S_NAMESPACE: 'default'
  K8S_DEPLOYMENT_NAME: 'backend-deployment'
  
  # Application configuration
  APP_NAME: 'CardDemo Backend'
  WORKING_DIRECTORY: 'backend'

# =============================================================================
# Concurrency Control
# =============================================================================
# Prevent multiple pipeline runs for the same branch
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# Jobs
# =============================================================================
jobs:
  # ===========================================================================
  # Job 1: Build and Test
  # ===========================================================================
  # Compiles Java code, runs unit and integration tests, generates coverage
  # ===========================================================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    
    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout source code
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate versioning and analysis

      # -----------------------------------------------------------------------
      # Step 2: Set up JDK 21 (Eclipse Temurin)
      # -----------------------------------------------------------------------
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'  # Automatic Maven dependency caching

      # -----------------------------------------------------------------------
      # Step 3: Cache Maven dependencies for faster builds
      # -----------------------------------------------------------------------
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # -----------------------------------------------------------------------
      # Step 4: Verify Maven version
      # -----------------------------------------------------------------------
      - name: Verify Maven version
        run: |
          mvn --version
          echo "Maven version verification complete"

      # -----------------------------------------------------------------------
      # Step 5: Maven clean install (compile and package)
      # -----------------------------------------------------------------------
      - name: Maven clean install
        run: mvn clean install -DskipTests
        env:
          MAVEN_OPTS: '-Xmx1024m -XX:MaxPermSize=256m'

      # -----------------------------------------------------------------------
      # Step 6: Run unit tests
      # -----------------------------------------------------------------------
      - name: Run unit tests
        if: ${{ !inputs.skip_tests }}
        run: mvn test
        env:
          SPRING_PROFILES_ACTIVE: test

      # -----------------------------------------------------------------------
      # Step 7: Run integration tests with Testcontainers
      # -----------------------------------------------------------------------
      - name: Run integration tests
        if: ${{ !inputs.skip_tests }}
        run: mvn verify -P integration-tests
        env:
          SPRING_PROFILES_ACTIVE: test
          TESTCONTAINERS_RYUK_DISABLED: false

      # -----------------------------------------------------------------------
      # Step 8: Generate JaCoCo coverage report
      # -----------------------------------------------------------------------
      - name: Generate JaCoCo coverage report
        if: ${{ !inputs.skip_tests }}
        run: mvn jacoco:report

      # -----------------------------------------------------------------------
      # Step 9: Check code coverage thresholds (80% line, 70% branch)
      # -----------------------------------------------------------------------
      - name: Check code coverage
        if: ${{ !inputs.skip_tests }}
        run: |
          mvn jacoco:check
          echo "Code coverage check passed: 80% line coverage, 70% branch coverage"

      # -----------------------------------------------------------------------
      # Step 10: Upload test results as artifacts
      # -----------------------------------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            backend/target/surefire-reports/**
            backend/target/failsafe-reports/**
          retention-days: 30

      # -----------------------------------------------------------------------
      # Step 11: Upload coverage report as artifact
      # -----------------------------------------------------------------------
      - name: Upload coverage report
        if: ${{ !inputs.skip_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/target/site/jacoco/**
          retention-days: 30

      # -----------------------------------------------------------------------
      # Step 12: Publish test report summary
      # -----------------------------------------------------------------------
      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Backend Test Results
          path: 'backend/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: true

      # -----------------------------------------------------------------------
      # Step 13: Generate build summary
      # -----------------------------------------------------------------------
      - name: Generate build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Version**: ${{ env.JAVA_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Maven Version**: ${{ env.MAVEN_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job 2: Docker Build and Push
  # ===========================================================================
  # Builds Docker image, scans for vulnerabilities, pushes to registry
  # ===========================================================================
  docker-build-push:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
      security-events: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build-push.outputs.digest }}
    
    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout source code
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Step 2: Set up Docker Buildx for advanced builds
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest
          buildkitd-flags: --debug

      # -----------------------------------------------------------------------
      # Step 3: Log in to GitHub Container Registry
      # -----------------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Step 4: Extract Docker metadata (tags and labels)
      # -----------------------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ env.APP_NAME }}
            org.opencontainers.image.description=CardDemo Spring Boot Backend
            org.opencontainers.image.vendor=CardDemo Project

      # -----------------------------------------------------------------------
      # Step 5: Build and push Docker image
      # -----------------------------------------------------------------------
      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            JAVA_VERSION=${{ env.JAVA_VERSION }}
            MAVEN_VERSION=${{ env.MAVEN_VERSION }}

      # -----------------------------------------------------------------------
      # Step 6: Generate Software Bill of Materials (SBOM)
      # -----------------------------------------------------------------------
      - name: Generate SBOM
        run: |
          docker sbom ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest -o backend-sbom.json
          echo "SBOM generated successfully"

      # -----------------------------------------------------------------------
      # Step 7: Upload SBOM as artifact
      # -----------------------------------------------------------------------
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: backend-sbom.json
          retention-days: 90

      # -----------------------------------------------------------------------
      # Step 8: Scan Docker image for vulnerabilities with Trivy
      # -----------------------------------------------------------------------
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail build on vulnerabilities, just report

      # -----------------------------------------------------------------------
      # Step 9: Upload Trivy results to GitHub Security tab
      # -----------------------------------------------------------------------
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-security'

      # -----------------------------------------------------------------------
      # Step 10: Generate Docker build summary
      # -----------------------------------------------------------------------
      - name: Generate Docker build summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: ${{ env.DOCKER_REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ github.repository_owner }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags**: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: ${{ steps.build-push.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: linux/amd64" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job 3: Deploy to Kubernetes (Staging)
  # ===========================================================================
  # Automated deployment to staging environment for testing
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging.carddemo.example.com
    
    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout source code for Kubernetes manifests
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Step 2: Set up kubectl CLI
      # -----------------------------------------------------------------------
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      # -----------------------------------------------------------------------
      # Step 3: Configure Kubernetes context for staging
      # -----------------------------------------------------------------------
      - name: Configure Kubernetes context
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl config current-context
          echo "Kubernetes context configured for staging"

      # -----------------------------------------------------------------------
      # Step 4: Verify cluster connectivity
      # -----------------------------------------------------------------------
      - name: Verify cluster connectivity
        run: |
          kubectl cluster-info
          kubectl get nodes

      # -----------------------------------------------------------------------
      # Step 5: Update backend deployment with new image
      # -----------------------------------------------------------------------
      - name: Update backend deployment
        run: |
          kubectl set image deployment/${{ env.K8S_DEPLOYMENT_NAME }} \
            backend=${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}
          echo "Deployment image updated to commit SHA: ${{ github.sha }}"

      # -----------------------------------------------------------------------
      # Step 6: Wait for rollout to complete
      # -----------------------------------------------------------------------
      - name: Wait for rollout completion
        run: |
          kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT_NAME }} \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=5m
          echo "Rollout completed successfully"

      # -----------------------------------------------------------------------
      # Step 7: Verify deployment health
      # -----------------------------------------------------------------------
      - name: Verify deployment health
        run: |
          echo "Checking pod status..."
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=carddemo,component=backend
          
          echo "Checking service endpoints..."
          kubectl get svc -n ${{ env.K8S_NAMESPACE }} -l app=carddemo,component=backend
          
          echo "Fetching recent logs..."
          kubectl logs -n ${{ env.K8S_NAMESPACE }} deployment/${{ env.K8S_DEPLOYMENT_NAME }} --tail=50

      # -----------------------------------------------------------------------
      # Step 8: Run smoke tests against staging
      # -----------------------------------------------------------------------
      - name: Run smoke tests
        run: |
          echo "Running smoke tests against staging environment..."
          # Health check endpoint
          curl -f https://staging.carddemo.example.com/actuator/health || exit 1
          # Info endpoint
          curl -f https://staging.carddemo.example.com/actuator/info || exit 1
          echo "Smoke tests passed"

      # -----------------------------------------------------------------------
      # Step 9: Generate deployment summary
      # -----------------------------------------------------------------------
      - name: Generate deployment summary
        run: |
          echo "## Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Staging" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: ${{ env.K8S_NAMESPACE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment**: ${{ env.K8S_DEPLOYMENT_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Deployed and Healthy" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://staging.carddemo.example.com" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job 4: Deploy to Production (Manual Approval Required)
  # ===========================================================================
  # Production deployment with manual approval gate
  # ===========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    environment:
      name: production
      url: https://carddemo.example.com
    
    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout source code for Kubernetes manifests
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Step 2: Set up kubectl CLI
      # -----------------------------------------------------------------------
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      # -----------------------------------------------------------------------
      # Step 3: Configure Kubernetes context for production
      # -----------------------------------------------------------------------
      - name: Configure Kubernetes context
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          kubectl config current-context
          echo "Kubernetes context configured for production"

      # -----------------------------------------------------------------------
      # Step 4: Verify cluster connectivity
      # -----------------------------------------------------------------------
      - name: Verify cluster connectivity
        run: |
          kubectl cluster-info
          kubectl get nodes

      # -----------------------------------------------------------------------
      # Step 5: Pre-deployment health check
      # -----------------------------------------------------------------------
      - name: Pre-deployment health check
        run: |
          echo "Checking current production health..."
          kubectl get deployment/${{ env.K8S_DEPLOYMENT_NAME }} -n ${{ env.K8S_NAMESPACE }}
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=carddemo,component=backend

      # -----------------------------------------------------------------------
      # Step 6: Create backup of current deployment
      # -----------------------------------------------------------------------
      - name: Backup current deployment
        run: |
          kubectl get deployment/${{ env.K8S_DEPLOYMENT_NAME }} -n ${{ env.K8S_NAMESPACE }} -o yaml > backup-deployment-$(date +%Y%m%d-%H%M%S).yaml
          echo "Current deployment backed up"

      # -----------------------------------------------------------------------
      # Step 7: Update production deployment (rolling update)
      # -----------------------------------------------------------------------
      - name: Update production deployment
        run: |
          kubectl set image deployment/${{ env.K8S_DEPLOYMENT_NAME }} \
            backend=${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}
          echo "Production deployment image updated to commit SHA: ${{ github.sha }}"

      # -----------------------------------------------------------------------
      # Step 8: Wait for rollout to complete with extended timeout
      # -----------------------------------------------------------------------
      - name: Wait for rollout completion
        run: |
          kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT_NAME }} \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=10m
          echo "Production rollout completed successfully"

      # -----------------------------------------------------------------------
      # Step 9: Post-deployment health verification
      # -----------------------------------------------------------------------
      - name: Post-deployment health verification
        run: |
          echo "Verifying production health..."
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=carddemo,component=backend
          
          # Wait for pods to be ready
          kubectl wait --for=condition=ready pod -l app=carddemo,component=backend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=5m
          
          echo "All pods are ready"

      # -----------------------------------------------------------------------
      # Step 10: Run production smoke tests
      # -----------------------------------------------------------------------
      - name: Run production smoke tests
        run: |
          echo "Running smoke tests against production..."
          # Health check
          curl -f https://carddemo.example.com/actuator/health || exit 1
          # Info endpoint
          curl -f https://carddemo.example.com/actuator/info || exit 1
          # Metrics endpoint
          curl -f https://carddemo.example.com/actuator/metrics || exit 1
          echo "Production smoke tests passed"

      # -----------------------------------------------------------------------
      # Step 11: Monitor deployment for 2 minutes
      # -----------------------------------------------------------------------
      - name: Monitor deployment
        run: |
          echo "Monitoring deployment for 2 minutes..."
          for i in {1..12}; do
            echo "Check $i/12..."
            kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=carddemo,component=backend
            sleep 10
          done
          echo "Monitoring complete - deployment stable"

      # -----------------------------------------------------------------------
      # Step 12: Generate production deployment summary
      # -----------------------------------------------------------------------
      - name: Generate deployment summary
        run: |
          echo "## Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: ${{ env.K8S_NAMESPACE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment**: ${{ env.K8S_DEPLOYMENT_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Deployed and Verified" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://carddemo.example.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Time**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY

      # -----------------------------------------------------------------------
      # Step 13: Send deployment notification (optional)
      # -----------------------------------------------------------------------
      - name: Send deployment notification
        if: success()
        run: |
          echo "Deployment notification would be sent here"
          # Example: Slack webhook, email, or other notification service
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} -d '{"text":"Production deployment successful"}'

  # ===========================================================================
  # Job 5: Rollback (Manual Trigger Only)
  # ===========================================================================
  # Emergency rollback to previous version
  # ===========================================================================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.environment != ''
    environment:
      name: ${{ inputs.environment }}
    
    steps:
      # -----------------------------------------------------------------------
      # Step 1: Set up kubectl CLI
      # -----------------------------------------------------------------------
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      # -----------------------------------------------------------------------
      # Step 2: Configure Kubernetes context
      # -----------------------------------------------------------------------
      - name: Configure Kubernetes context
        run: |
          mkdir -p $HOME/.kube
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
          else
            echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          fi
          chmod 600 $HOME/.kube/config
          kubectl config current-context

      # -----------------------------------------------------------------------
      # Step 3: Perform rollback
      # -----------------------------------------------------------------------
      - name: Rollback deployment
        run: |
          echo "Rolling back deployment in ${{ inputs.environment }}..."
          kubectl rollout undo deployment/${{ env.K8S_DEPLOYMENT_NAME }} \
            -n ${{ env.K8S_NAMESPACE }}
          
          kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT_NAME }} \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=5m
          
          echo "Rollback completed successfully"

      # -----------------------------------------------------------------------
      # Step 4: Verify rollback health
      # -----------------------------------------------------------------------
      - name: Verify rollback health
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=carddemo,component=backend
          kubectl wait --for=condition=ready pod -l app=carddemo,component=backend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=5m

      # -----------------------------------------------------------------------
      # Step 5: Generate rollback summary
      # -----------------------------------------------------------------------
      - name: Generate rollback summary
        run: |
          echo "## Rollback Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment**: ${{ env.K8S_DEPLOYMENT_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Rolled back successfully" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
