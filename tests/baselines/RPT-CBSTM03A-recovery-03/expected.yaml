# Derived from app/cbl/CBSTM03A.CBL:266-339,416-723,856-870,921-923 and
# app/cbl/CBSTM03B.CBL:146-155; inferred-not-observed (GAP-INF-013) and
# implemented-unexecuted, since no adapter injects a close failure after a
# successful open (GAP-MIS-013); pinned, never corrected. capture.py replaces it
# with an observed baseline (MINOR, or MAJOR where an outcome differs) only once
# a fault seam exists.
# The control-block lines come from the page-zero shim's CREASTMT STEP040 TIOT
# (GAP-STB-003). The io-error close is taken as file status 30, which CBSTM03B
# returns unchanged, so 'RETURN CODE: 30' follows 'ERROR CLOSING TRNXFILE'. The
# CEE3ABD stub then ends the run (GAP-STB-001, GAP-DEF-001): return_code null,
# its marker last, and the XREFFILE, CUSTFILE, ACCTFILE and statement-file
# closes never reached.
# Every statement record is written before the failing close, and the stub's
# STOP RUN closes STMTFILE and HTMLFILE implicitly, so both hold the complete
# statement: the 21 text and 86 HTML records a no-fault gnucobol-batch run of
# the same inputs writes. A z/OS abend would leave them to their abnormal DISP
# instead (GAP-STB-001).
