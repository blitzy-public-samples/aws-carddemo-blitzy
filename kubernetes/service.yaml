#
# Kubernetes Service Definition for CardDemo Spring Boot Application
#
# This Service resource provides stable internal networking for the CardDemo
# application within the Kubernetes cluster, replacing the CICS VTAM terminal
# connection routing and transaction load distribution with cloud-native service
# discovery and load balancing.
#
# Purpose:
# - Exposes the CardDemo Spring Boot application on a stable ClusterIP
# - Provides internal DNS resolution (carddemo-service.carddemo.svc.cluster.local)
# - Load balances traffic across multiple application pod replicas
# - Maintains session affinity for stateful Redis-backed sessions
# - Routes HTTP traffic from port 80 to container port 8080
#
# Transformation Context:
# COBOL/CICS Pattern → Kubernetes Service Pattern
# - CICS VTAM terminal routing → Service ClusterIP with DNS
# - CICS transaction load balancing → Kubernetes service load balancing
# - Terminal connection management → Session affinity configuration
# - CICS region communication → Internal cluster networking
#
# Migration Notes:
# - Replaces mainframe terminal connection infrastructure
# - Provides stable endpoint for Ingress controller routing
# - Enables horizontal scaling with automatic load distribution
# - Supports zero-downtime deployments with rolling updates
#

apiVersion: v1
kind: Service
metadata:
  # Service name used for DNS resolution within cluster
  # Accessible as: carddemo-service.carddemo.svc.cluster.local
  name: carddemo-service
  
  # Namespace must match deployment namespace
  namespace: carddemo
  
  # Labels for service identification and monitoring
  labels:
    app: carddemo
    component: backend
    tier: application
    version: v1
    managed-by: kubernetes
    
  # Annotations for service mesh integration and monitoring
  annotations:
    # Service description for documentation
    description: "CardDemo Spring Boot application service - Mainframe CICS to Cloud migration"
    
    # Prometheus monitoring integration
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
    
    # Service mesh integration (if using Istio)
    # Uncomment if service mesh is deployed
    # sidecar.istio.io/inject: "true"
    
    # Migration context
    migration.source: "CICS Transaction Routing"
    migration.target: "Kubernetes Service"
    
spec:
  # ClusterIP type for internal cluster communication only
  # Not directly accessible from outside the cluster
  # External access is provided through Ingress resource
  type: ClusterIP
  
  # Selector to match pods managed by the deployment
  # Must match deployment spec.template.metadata.labels
  selector:
    app: carddemo
  
  # Session affinity configuration for stateful sessions
  # Maintains client routing to same pod for session continuity
  # Important for Redis-backed Spring Session management
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      # Session timeout: 3 hours (10800 seconds)
      # Aligns with typical user session duration
      # Matches CICS pseudo-conversational timeout patterns
      timeoutSeconds: 10800
  
  # Port configuration
  ports:
    # HTTP port for REST API traffic
    - name: http
      protocol: TCP
      
      # Port exposed by the service (internal cluster port)
      # Ingress controller will route traffic to this port
      port: 80
      
      # Target port on the container (Spring Boot embedded Tomcat)
      # Must match containerPort in deployment spec
      targetPort: 8080
      
      # Optional: nodePort for NodePort service type
      # Not used for ClusterIP, included for documentation
      # nodePort: 30080

---
#
# Optional: Headless Service for StatefulSet (if needed in future)
#
# This section is commented out but provided as reference for potential
# future use if StatefulSet deployment is required for specific scenarios
# like batch processing or database clustering.
#
# apiVersion: v1
# kind: Service
# metadata:
#   name: carddemo-service-headless
