# The skip rule of CBTRN01C for a card the cross-reference does not hold: the
# XREF READ takes INVALID KEY, so the program displays 'INVALID CARD NUMBER FOR
# XREF' and the skip line, and never reads the account
# [app/cbl/CBTRN01C.cbl:170-184,227-239]. The one daily record carries the
# invented card 9999000011110001, which matches no card of app/data. The second
# pair of lines comes from the lookup the loop repeats after the read that sets
# end of file, with the last record still in DALYTRAN-RECORD
# [app/cbl/CBTRN01C.cbl:164-186]; that duplicate belongs to the per-record
# display item and its GAP-DEF-006, which this scenario neither lists nor tags.
# The record line is the whole 350-byte DALYTRAN-RECORD that DISPLAY writes, its
# trailing spaces included.
id: TRN-CBTRN01C-negative-01
level: unit
type: negative
description: >-
  CBTRN01C reads one daily transaction whose card is absent from the card
  cross-reference: it displays the record, 'INVALID CARD NUMBER FOR XREF' and
  'CARD NUMBER ... COULD NOT BE VERIFIED. SKIPPING TRANSACTION ID-...', makes no
  account lookup, repeats the lookup lines once after end of file and ends with
  return code 0.
