# POSTTRAN on the repository data. The job's one step, STEP15, runs CBTRN02C
# [app/jcl/POSTTRAN.jcl:23-42] over the 300 records of dailytran.txt (6 for each
# of 50 cards) against the repository CARDXREF, ACCTDATA and TCATBALF, with
# TRANSACT as the TRANFILE job leaves it: holding only the DALYTRAN.PS.INIT seed
# record [app/jcl/TRANFILE.jcl:67-74]. DALYREJS is the job's new generation of
# the DALYREJS GDG [app/jcl/POSTTRAN.jcl:34-38].
#
# The expected values were observed on gnucobol-batch under the default clock
# 2022-07-06 10:00:00.00 and are pinned as observed, never corrected:
# - 38 records are rejected, every one with reason 0102 'OVERLIMIT TRANSACTION'.
#   All accounts start with zero cycle totals, and the over-limit test compares
#   ACCT-CREDIT-LIMIT with ACCT-CURR-CYC-CREDIT - ACCT-CURR-CYC-DEBIT +
#   DALYTRAN-AMT, using the totals the records posted earlier in the run have
#   accumulated [app/cbl/CBTRN02C.cbl:393-413,545-552]. 13 of the 38 amounts
#   exceed the limit on their own; the other 25 are refused only through those
#   totals. The test is doubtful and pinned as observed (observed-only,
#   GAP-UNC-011). Reasons 100, 101 and 103 do not occur with this data; the
#   unit scenarios TRN-CBTRN02C-negative-01, -02 and -04 produce them.
# - The return code is 4, the only one CBTRN02C sets, and the counts are shown
#   without a breakdown [app/cbl/CBTRN02C.cbl:227-231]; the tech spec's return
#   code 8 and reject breakdown never appear (GAP-DOC-006).
# - Each of the 262 accepted records is posted [app/cbl/CBTRN02C.cbl:424-444]:
#   its amount is added to ACCT-CURR-BAL and to the cycle credit when it is zero
#   or more, otherwise to the cycle debit [app/cbl/CBTRN02C.cbl:545-560]; its
#   account, type and category balance is rewritten, or created with one
#   'TCATBAL record not found for key : ... Creating.' line when absent
#   [app/cbl/CBTRN02C.cbl:467-542]. Of the 50 type 01 (Purchase) records of
#   tcatbal.txt, 49 are rewritten; no purchase of account 37 is posted, so its
#   record keeps 0.00. 50 type 03 (Credit) records are created.
# - TRANSACT gets one record per posted transaction, with TRAN-PROC-TS taken
#   from the run clock [app/cbl/CBTRN02C.cbl:562-579,692-705]. TRANFILE is opened
#   OUTPUT [app/cbl/CBTRN02C.cbl:256], which on GnuCOBOL recreates the loaded
#   file where VSAM would refuse the OPEN (GAP-STB-010), so the seed record is
#   gone and TRANSACT holds exactly the 262 posted records.
# The scenario declares clock_mode: relative so that unikix, which cannot fix
# its clock (GAP-MIS-015), runs it too: TRAN-PROC-TS is matched as a
# run-timestamp, which resolves to 2022-07-06-10.00.00.000000 on gnucobol-batch.
# The CBTRN02C behavior items are verified by the TRN-CBTRN02C unit scenarios;
# this scenario lists only the job and the seed data file it runs on. The
# baseline pins every record in full; the values below state the business
# outcome. Expected text values are full field width: decoded text keeps its
# trailing spaces and compares exactly.
id: TRN-POSTTRAN-normal-01
level: integration
type: normal
description: >-
  POSTTRAN runs CBTRN02C on the repository's 300 daily transactions. It ends
  with return code 4 after 'TRANSACTIONS PROCESSED :000000300' and
  'TRANSACTIONS REJECTED  :000000038', writes the 38 rejects to the new DALYREJS
  generation as 430-byte records with reason 0102 'OVERLIMIT TRANSACTION', posts
  the other 262 to TRANSACT with the run timestamp (the seed record is gone),
  updates the balances of all 50 accounts, and rewrites 49 and creates 50
  transaction category balances.
inventory_ids:
- INV-TRN-009  # POSTTRAN job
- INV-DTA-016  # AWS.M2.CARDDEMO.DALYTRAN.PS.INIT, the TRANSACT-INIT fixture source
tags:
- observed-only
gap_ids:
- GAP-UNC-011  # the over-limit test on cycle totals accumulated through the run
- GAP-STB-007  # normal-end CATLG of the new DALYREJS generation applied; its abnormal-termination DELETE recorded, not evaluated
- GAP-STB-009  # emulated catalog and GDG generations
- GAP-STB-010  # Berkeley DB indexed files in place of VSAM; OPEN OUTPUT recreates TRANSACT
- GAP-STB-011  # GnuCOBOL compile and runtime options in place of Enterprise COBOL and LE
- GAP-DOC-006  # the tech spec's return code 8 and reject breakdown
preconditions:
  datasets:
    DALYTRAN:
      base: DALYTRAN
    CARDXREF:
