# COACTUPC refuses a credit limit that is not a valid signed amount: the
# 'valid signed amount' predicate of 1250-EDIT-SIGNED-9V2 for the Credit Limit
# field [app/cbl/COACTUPC.cbl:2180-2221].
#
# Steps 1-3 sign USER0001 on through CC00, choose main-menu option 2 'Account
# Update' and fetch account 00000000001, as ACT-COACTUPC-alternate-04 does:
# 9000-READ-ACCT reads CXACAIX by account (card 9680294154603697, customer
# 000000001), ACCTDAT and CUSTDAT, keeps the values in the COMMAREA as
# ACUP-OLD-DETAILS and sets ACUP-SHOW-DETAILS; 3320-UNPROTECT-FEW-ATTRS gives
# every editable field DFHBMFSE, so all of them come back on the next AID
# [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3500-3561,3608-3884].
# Step 4 types 12AB.00 over the credit limit and presses ENTER:
# - 1100-RECEIVE-MAP initializes ACUP-NEW-DETAILS and moves the received
#   ACRDLIMI, '12AB.00' padded with blanks to 15, to ACUP-NEW-CREDIT-LIMIT-X.
#   TEST-NUMVAL-C finds 'A' at position 3, so NUMVAL-C is not applied and
#   ACUP-NEW-CREDIT-LIMIT keeps its initialized spaces
#   [app/cbl/COACTUPC.cbl:1039-1084].
# - 1205-COMPARE-OLD-NEW finds a change, so 1200-EDIT-MAP-INPUTS sets
#   ACUP-CHANGES-NOT-OK and runs the field edits in screen order
#   [app/cbl/COACTUPC.cbl:1452-1489,1681-1700]. Account Status Y and Open Date
#   2014-11-20 pass. 1250-EDIT-SIGNED-9V2 for 'Credit Limit' finds the field
#   supplied, TEST-NUMVAL-C non-zero, sets INPUT-ERROR and
#   FLG-SIGNED-NUMBER-NOT-OK, and with the message line still off STRINGs the
#   trimmed field name and ' is not valid' into WS-RETURN-MSG. Every later
#   edit composes its message only while WS-RETURN-MSG-OFF holds, so this
#   message stands; FOUND-ACCOUNT-DATA, set before the edits, belongs to
#   WS-INFO-MSG [app/cbl/COACTUPC.cbl:466-480,2180-2221].
# - 2000-DECIDE-ACTION continues on ACUP-CHANGES-NOT-OK, so neither READ UPDATE
#   nor REWRITE runs [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES sends the refused credit limit as received and
#   the valid amounts re-edited through +ZZZ,ZZZ,ZZZ.99; 3250 sets
#   PROMPT-FOR-CHANGES; CSSETATY colours ACRDLIM red; 3390 makes F12=Cancel
#   bright for a change in progress and leaves F5=Save dark
#   [app/cbl/COACTUPC.cbl:2870-2982,3230-3234,3566-3581] [app/cpy/CSSETATY.cpy:17-26].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Screen fields are compared at their full BMS length, trailing spaces kept:
#   ERRMSG is the 75-byte WS-RETURN-MSG in the 78-byte ERRMSGO, INFOMSG the
#   40-byte WS-INFO-MSG in the 45-byte INFOMSGO. Dark fields read as blanks.
# - The tpe adapter erases a field before typing, so ACRDLIM holds 12AB.00
#   followed by blanks.
# - CURDATE and CURTIME come from the region clock through CSDAT01Y, hence the
#   matchers and clock_mode relative.
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit (the repository record's FICO 274 is below 300), so the screen shows
# every customer field as fetched [app/cbl/COACTUPC.cbl:2514-2558].
id: ACT-COACTUPC-negative-026
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 'Account Update', fetches
  account 00000000001 and replaces its credit limit 2020.00 with '12AB.00'.
  ENTER makes COACTUPC refuse the value: the screen keeps '12AB.00' in the
  Credit Limit field, shows every other fetched value, the prompt 'Update
  account details presented above.' and 'Credit Limit is not valid' in the
  message line, with F12=Cancel shown and F5=Save hidden. ACCTDAT and CUSTDAT
  are not updated.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are verified
# by the SEC and MNU scenarios; the batch record copybooks and the data files
# are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-084  # COACTUPC Credit Limit: valid signed amount (1250-EDIT-SIGNED-9V2)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read, not rewritten
- INV-CFG-005  # CUSTDAT CSD file: customer master read, not rewritten
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and fetched values
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits use
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the red attribute of the refused field
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the Open Date edit that passes before the credit limit
- INV-LAY-014  # CSUTLDWY: the date-edit work areas
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix COACTUPC comments out the TEST-NUMVAL-C checks of the amounts and
# the ' is not valid' edit of 1250-EDIT-SIGNED-9V2, so on UniKix the value may be
# accepted; the app/ source behaviour is pinned here.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, beside TRNNAME.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios, so no customer edit fails.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
        CUST-ADDR-ZIP: '27601'
        CUST-PHONE-NUM-1: (919)555-0101
        CUST-PHONE-NUM-2: (919)555-0102
        CUST-SSN: '123456789'
        CUST-GOVT-ISSUED-ID: TESTGOVT0001
        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: 'Y'
        CUST-FICO-CREDIT-SCORE: '700'
    # The 10 repository users, for the USER0001 sign-on.
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  # Digits with letters: TEST-NUMVAL-C refuses it, unlike a sign, currency
  # symbol, grouping comma or blanks, which it accepts.
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACRDLIM: '12AB.00'
expected:
  screens:
  # One entry per step, each the screen the step ends on.
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    OPTN002: '02. Account Update                      '
    ERRMSG: '                                                                              '
  - '@map': COACTUP
    TRNNAME: CAUP
    PGMNAME: COACTUPC
    ACCTSID: '           '
    INFOMSG: 'Enter or update id of account to update      '
    ERRMSG: '                                                                              '
  # The fetched account and customer, editable, with the change prompt.
  - '@map': COACTUP
    TRNNAME: CAUP
    PGMNAME: COACTUPC
    ACCTSID: '00000000001'
    ACRDLIM: '+      2,020.00'
    ACSTNUM: '000000001'
    ACSFNAM: 'Testfirst                '
    INFOMSG: 'Update account details presented above.      '
    ERRMSG: '                                                                              '
    FKEY05: '       '
    FKEY12: '          '
  # The refused credit limit as typed, the other received values, the change
  # prompt and the edit message.
  - '@map': COACTUP
    TRNNAME: CAUP
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COACTUPC
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ACCTSID: '00000000001'
    ACSTTUS: 'Y'
