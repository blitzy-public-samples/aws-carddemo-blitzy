# Logical dataset definitions of the CardDemo characterization suite.
#
# Purpose
#   Every logical dataset name that scenarios use (preconditions.datasets,
#   expected.datasets, expected.file_state) is defined here, once. The adapter
#   mapping files map these names to their platform: gnucobol_batch/programs.yaml
#   and jobs.yaml (each dd entry's `logical`) and unikix/resources.yaml. The
#   harness (harness/fixtures.py) builds fixtures, runs the EBCDIC cross-check
#   and encodes synthetic records from these entries; the loader and unloader
#   generator of gnucobol_batch/build.py takes keys and alternate keys from here.
#   This file holds no data: fixtures are built at run time from app/data into
#   the scenario's working directory, and synthetic records live inline in the
#   scenarios. Nothing under app/ is copied or changed.
#
# Conventions
#   - Byte offsets (key, alternate_keys, fields) are 0-based.
#   - registered_mismatches.record and .columns are 1-based and inclusive;
#     columns are written "a-b".
#   - Names are logical: upper case, ^[A-Z][A-Z0-9-]*$. DSNs, ddnames and hosts
#     appear only inside description text.
#   - layout is a record key of tests/inventory/layouts.yaml (<COPYBOOK>/<01-NAME>,
#     CBTRN02C/REJECT-RECORD or TEXT/<n>) and is never null, because records are
#     encoded and decoded only through that file. fields, where present, names the
#     structure inside the layout for builders and readers (the composition of
#     DALYREJS, the fields of the TEXT/80 inputs DATEPARM and DTCIN) and agrees
#     with it byte for byte. text_lines marks report outputs compared as text
#     lines; line_layouts is informational.
#   - region_files are the CICS FILE names (app/csd/CARDDEMO.CSD and the UniKix
#     copy's fct.lst) that give primary-key access to the dataset; an alternate
#     index path's region file is the alternate key's `path`.
#   - data_items are the app/data files the records derive from, so a scenario can
#     list both the ASCII and the EBCDIC data-file item.
#
# Building rules (harness/fixtures.py)
#   - ascii source: strip the newline from each line and right-pad it with spaces
#     to record_length. A longer line is an error.
#   - cp037 source: split it at record_length, decode each record as cp037 and
#     materialize the result as ASCII bytes (x'00' stays x'00').
#   - Cross-check: split the counterpart at record_length (the instream form takes
#     the given JCL lines, each padded with spaces to record_length), decode it,
#     and compare record by record. A difference is registered when its record
#     number matches an entry and every differing column falls inside that entry's
#     columns. Any other difference fails the scenario with reason `error`, naming
#     the record and columns, and needs a new GAP-DOC entry before it can pass.
#   - Fixture bytes are the verified ASCII bytes, the encoding both GnuCOBOL and
#     the UniKix copy's seqfiles use. Sequential files are written fixed-length
#     with no separators. KSDS entries are loaded by key, creating the alternate
#     keys listed here; whether a program's SELECT declares them (and with or
#     without DUPLICATES) is the business of programs.yaml.
#   - Indexed outputs are compared in primary-key order, sequential outputs in
#     written order.
#
# -PS twins
#   A twin (derive_from: <parent>) is the sequential .PS dataset a load job reads
#   or writes. It holds the same records as its parent, in source order, and
#   repeats the parent's source, encoding, record_length, record_count, layout,
#   data_items and gap_ids. The cross-check runs once, for the owning entry, and
#   never again for a twin, so exactly two mismatches are found: ACCTDATA record
#   49 (GAP-DOC-012) and DISCGRP record 34 (GAP-DOC-013).

schema_version: 1

datasets:

# --------------------------------------------------------------------------
# Repository-derived datasets
# --------------------------------------------------------------------------

- name: ACCTDATA
  description: >-
    Account master KSDS loaded by the ACCTFILE job, KEYS(11 0) and RECORDSIZE(300 300)
    [app/jcl/ACCTFILE.jcl:36-41] [app/catlg/LISTCAT.txt:59-60]. Record 49 ACCT-ADDR-ZIP
    (columns 103-112) is A000000000 in ASCII and ZEROAPR in EBCDIC (GAP-DOC-012).
    Every record carries its disclosure group id in ACCT-ADDR-ZIP and leaves
    ACCT-GROUP-ID (columns 113-122) blank [app/cpy/CVACT01Y.cpy:15-16] (GAP-DEF-005).
  source: app/data/ASCII/acctdata.txt
  encoding: ascii
  record_length: 300
  record_count: 50
  organization: ksds
  key: {offset: 0, length: 11}
  alternate_keys: []
  layout: CVACT01Y/ACCOUNT-RECORD
  cross_check: {source: app/data/EBCDIC/AWS.M2.CARDDEMO.ACCTDATA.PS, encoding: cp037}
  registered_mismatches:
  - {record: 49, columns: "103-112", gap_id: GAP-DOC-012}
  data_items:
  - app/data/ASCII/acctdata.txt
  - app/data/EBCDIC/AWS.M2.CARDDEMO.ACCTDATA.PS
  region_files: [ACCTDAT]
  gap_ids: [GAP-DOC-012, GAP-DEF-005]

