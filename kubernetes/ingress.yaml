---
# Kubernetes Ingress Resource for CardDemo Application
# 
# Purpose: Provides external HTTPS access to the CardDemo Spring Boot application
# with TLS termination, path-based routing, and load balancing capabilities.
# 
# This Ingress replaces the mainframe CICS Web Support (CWS) and HTTP gateway,
# providing cloud-native external access with modern SSL/TLS security and
# intelligent routing to the carddemo-service backend.
#
# Key Features:
# - HTTPS-only access with automatic SSL redirect
# - TLS certificate management via cert-manager
# - Path-based routing for root (/) and API paths (/api/*)
# - NGINX ingress controller with optimized timeout and body size settings
# - Session affinity support for stateful applications
# - Load balancing across multiple backend pods
#
# Environment Configuration:
# - Development: Use self-signed certificates or cert-manager staging
# - Production: Use Let's Encrypt production or enterprise CA certificates
# - Host DNS must point to ingress controller external IP/load balancer

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: carddemo-ingress
  namespace: carddemo
  labels:
    app: carddemo
    component: ingress
    environment: production
    version: v1
  annotations:
    # Ingress class specification for NGINX controller
    kubernetes.io/ingress.class: nginx
    
    # Force HTTPS - redirect all HTTP requests to HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    
    # Proxy body size limit (10MB) for file uploads and large payloads
    # Accommodates transaction batch uploads and report generation
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    
    # Connection timeout settings (60 seconds)
    # Aligned with Spring Boot transaction processing requirements
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    
    # Certificate management via cert-manager
    # For production: use letsencrypt-prod cluster issuer
    # For development: use letsencrypt-staging or self-signed issuer
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # Additional NGINX optimizations for CardDemo application
    # Enable CORS for frontend-backend communication
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    
    # Session affinity to maintain consistent routing for stateful sessions
    # Important for Redis-backed HTTP sessions
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "carddemo-session"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "10800"
    
    # Rate limiting to protect against abuse (optional, adjust as needed)
    # nginx.ingress.kubernetes.io/limit-rps: "100"
    
    # Ingress metadata
    description: "CardDemo Application External Access Point"
    owner: "platform-team"
    maintained-by: "kubernetes-admin"

spec:
  # Specify NGINX ingress class explicitly
  ingressClassName: nginx
  
  # TLS configuration for HTTPS termination
  tls:
    - hosts:
        # Primary application host - update for your environment
        # Development: carddemo-dev.example.com
        # Staging: carddemo-staging.example.com
        # Production: carddemo.example.com or carddemo.yourdomain.com
        - carddemo.example.com
      # Secret containing TLS certificate and private key
      # Generated automatically by cert-manager or manually created
      # For manual creation: kubectl create secret tls carddemo-tls-cert \
      #   --cert=path/to/cert.pem --key=path/to/key.pem -n carddemo
      secretName: carddemo-tls-cert
  
  # Routing rules
  rules:
    # Rule for primary host
    - host: carddemo.example.com
      http:
        paths:
          # Root path - serves React frontend application
          # Matches: /, /login, /menu, /accounts, etc.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: carddemo-service
                port:
                  number: 80
          
          # API path - REST API endpoints
          # Matches: /api/auth/login, /api/accounts, /api/cards, etc.
          # Explicitly defined for clarity and potential future routing policies
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: carddemo-service
                port:
                  number: 80
          
          # Actuator endpoints for health checks and monitoring
          # Matches: /actuator/health, /actuator/info, /actuator/metrics
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: carddemo-service
                port:
                  number: 80

---
