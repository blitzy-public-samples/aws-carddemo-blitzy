        TRANCAT-TYPE-CD: '01'
        TRANCAT-CD: '0001'
        TRAN-CAT-BAL: '1200.00'
      - TRANCAT-ACCT-ID: '00000000901'
        TRANCAT-TYPE-CD: '01'
        TRANCAT-CD: '0002'
