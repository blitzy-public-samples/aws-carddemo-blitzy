openapi: 3.1.0
info:
  title: Auth Service stub contract
  version: 1.0.0
  description: >-
    Stub-phase contract for the gRPC service cardservicing.auth.v1.AuthService, described here as HTTP/JSON.
    The stub answers from the fixture identity file of the ten CardDemo users (Data Layouts · CSUSR01Y · SEC-USR-ID):
    USER0001 to USER0005 are regular users entitled to sample and synthetic accounts, and ADMIN001 to ADMIN005
    are valid identities entitled to no account, a fixture policy rather than an inherited CardDemo rule;
    one expired and one malformed fixture token exercise the 401 path.
    The Card Servicing service calls ValidateToken, then AuthorizeAccountAccess, before any account-data read,
    cache reads included, and fails closed when either call returns an error.
    The caller's bearer token is forwarded in the authorization header and the service credential travels in the
    x-api-key header; the stub ignores the key and does not re-authorize.
    Swapping the stub for the real Auth service changes only the target address and the credential source.
    Fixture tokens shown in the examples are illustrative values, not secrets.
  contact:
    name: Card Servicing workstream
  license:
    name: Apache 2.0
    identifier: Apache-2.0
servers:
  - url: /
    description: >-
      Descriptive only. No HTTP address serves these HTTP/JSON operations; the stub is reached
      over gRPC through the client generated from its proto. / is the OpenAPI default server.
tags:
  - name: Auth
    description: Bearer-token validation and per-account access decisions that the Card Servicing service makes before any account-data read.
security:
  - bearerAuth: []
    apiKey: []
paths:
  /v1/auth/token-validations:
    post:
      operationId: ValidateToken
      tags: [Auth]
      summary: Validate a bearer token
      description: >-
        HTTP/JSON form of the gRPC method cardservicing.auth.v1.AuthService/ValidateToken.
        Returns the subject and roles carried by a valid bearer token.
        A missing or empty token, or one longer than 8,192 characters, returns 400 before the token is validated;
        an invalid, expired or malformed token returns 401.
        The token travels in the request body so it never appears in a URL, and it is never logged.
      requestBody:
        required: true
        description: The bearer token to validate, carried in the body so it never appears in a URL.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateTokenRequest'
            examples:
              fixtureToken:
                value:
                  token: 'fixture-token-user0001'
      responses:
        '200':
          description: The token is valid; the body carries its subject and roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateTokenResponse'
              examples:
                regularUser:
                  value:
                    subject: 'USER0001'
                    roles:
                      - 'REGULAR'
        '400':
          description: The token is missing, empty or longer than 8,192 characters (INVALID_ARGUMENT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                missingToken:
                  value:
                    code: INVALID_ARGUMENT
                    message: Token is required
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details:
                      - field: token
                        description: must be present and non-empty
                tokenTooLong:
                  value:
                    code: INVALID_ARGUMENT
                    message: Token must be at most 8,192 characters
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details:
                      - field: token
                        description: must be at most 8,192 characters
        '401':
          description: The token is invalid, expired or malformed (UNAUTHENTICATED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                unauthenticated:
                  value:
                    code: UNAUTHENTICATED
                    message: Token missing, invalid or expired
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details: []
        '503':
          description: The Auth service is unavailable after retries (UNAVAILABLE); the Card Servicing service fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                unavailable:
                  value:
                    code: UNAVAILABLE
                    message: Upstream unavailable
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details: []
        '504':
          description: >-
            The call's deadline (the caller's per-attempt timeout, 300 ms by default, cut to the time
            left in the request budget when that is shorter) passed before the Auth service answered
            (DEADLINE_EXCEEDED); the Card Servicing service fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                deadlineExceeded:
                  value:
                    code: DEADLINE_EXCEEDED
                    message: Request deadline exceeded
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details: []
  /v1/auth/subjects/{subject}/accounts/{accountId}/access:
    get:
      operationId: AuthorizeAccountAccess
      tags: [Auth]
      summary: Decide whether a subject may read an account
      description: >-
        HTTP/JSON form of the gRPC method cardservicing.auth.v1.AuthService/AuthorizeAccountAccess.
        Decides whether the subject may read the account.
        An account outside the subject's entitlements returns 200 with allowed false, which the Card Servicing service
        maps to 403 before any account data is read.
        Admin fixture identities are valid but entitled to no account, so every request for them returns allowed false.
      parameters:
        - name: subject
          in: path
          required: true
          description: >-
            Subject returned by token validation, 1-64 characters; fixture subjects are the 8-character CardDemo
            user IDs (Data Layouts · CSUSR01Y · SEC-USR-ID).
          schema:
            type: string
            minLength: 1
            maxLength: 64
          examples:
            user0001:
              value: 'USER0001'
        - name: accountId
          in: path
          required: true
          description: >-
            11-digit account identifier (Data Layouts · CVACT01Y · ACCT-ID).
            The all-zero value 00000000000 returns 400 "Account number must be a non zero 11 digit number"
            (Use Cases · COACTVWC).
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          examples:
            fixtureAccount:
              value: '00000000001'
      responses:
        '200':
          description: >-
            The access decision for the subject and account; allowed false is still a 200, which the Card Servicing
            service maps to 403 before any account data is read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeAccountAccessResponse'
              examples:
                allowed:
                  value:
                    allowed: true
        '400':
          description: The subject is outside 1-64 characters, or the account number is malformed or all zeros (INVALID_ARGUMENT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                invalidAccountId:
                  value:
                    code: INVALID_ARGUMENT
                    message: Account number must be a non zero 11 digit number
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details:
                      - field: accountId
                        description: must be 11 digits and not all zeros
        '401':
          description: The forwarded bearer token is missing, invalid or expired (UNAUTHENTICATED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                unauthenticated:
                  value:
                    code: UNAUTHENTICATED
                    message: Token missing, invalid or expired
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details: []
        '503':
          description: The Auth service is unavailable after retries (UNAVAILABLE); the Card Servicing service fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                unavailable:
                  value:
                    code: UNAVAILABLE
                    message: Upstream unavailable
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details: []
        '504':
          description: >-
            The call's deadline (the caller's per-attempt timeout, 300 ms by default, cut to the time
            left in the request budget when that is shorter) passed before the Auth service answered
            (DEADLINE_EXCEEDED); the Card Servicing service fails closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                deadlineExceeded:
                  value:
                    code: DEADLINE_EXCEEDED
                    message: Request deadline exceeded
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The caller's bearer token, forwarded unchanged by the Card Servicing service; the stub does not re-authorize.
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: The Card Servicing service credential; the stub ignores its value.
  schemas:
    ValidateTokenRequest:
      type: object
      description: Request for ValidateToken, carrying the bearer token to validate.
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          description: Bearer token to validate, opaque, with no restriction on its characters; a missing or empty value, or one longer than 8,192 characters, returns 400; never logged or echoed in an error.
    ValidateTokenResponse:
      type: object
      description: Response for ValidateToken, carrying the subject and roles of a valid token.
      required: [subject, roles]
      additionalProperties: false
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 64
          description: Authenticated user identifier, 1-64 characters; fixture subjects are the 8-character CardDemo user IDs (Data Layouts · CSUSR01Y · SEC-USR-ID).
        roles:
          type: array
          description: Roles the subject holds.
          items:
            type: string
            enum: [REGULAR, ADMIN]
            description: A CardDemo user type - REGULAR for the Regular user type and ADMIN for the Admin user type (Data Layouts · CSUSR01Y · SEC-USR-TYPE, U maps to REGULAR and A to ADMIN).
    AuthorizeAccountAccessResponse:
      type: object
      description: Response for AuthorizeAccountAccess, carrying the access decision.
      required: [allowed]
      additionalProperties: false
      properties:
        allowed:
          type: boolean
          description: True when the account is within the subject's entitlements; false is still a 200 response.
    ErrorObject:
      type: object
      description: Standard error object returned with every non-2xx status; gRPC carries the same message in google.rpc.Status details.
      required: [code, message, traceId, details]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Canonical status name - INVALID_ARGUMENT (400), UNAUTHENTICATED (401), PERMISSION_DENIED (403), NOT_FOUND (404), UNAVAILABLE (503) or DEADLINE_EXCEEDED (504).
        message:
          type: string
          description: Human-readable explanation of the error.
        traceId:
          type: string
          description: Identifier of the request that produced the error, used to correlate log lines.
        details:
          type: array
          description: Field-level violations; empty when the error concerns no single field.
          items:
            type: object
            description: One field-level violation.
            required: [field, description]
            additionalProperties: false
            properties:
              field:
                type: string
                description: Name of the request field or parameter that failed, for example accountId or pageToken.
              description:
                type: string
                description: The rule the field must satisfy.
