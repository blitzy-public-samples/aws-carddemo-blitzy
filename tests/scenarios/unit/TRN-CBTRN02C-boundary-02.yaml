# The date boundary of the CBTRN02C expiration check. 1500-B-LOOKUP-ACCT keeps a
# transaction when IF ACCT-EXPIRAION-DATE >= DALYTRAN-ORIG-TS (1:10) holds
# [app/cbl/CBTRN02C.cbl:414-420], so an origination date equal to the account's
# expiration date posts and is not rejected with 0103. The over-limit check before
# it passes too: ACCT-CURR-CYC-CREDIT - ACCT-CURR-CYC-DEBIT + DALYTRAN-AMT is
# 0.00 - 0.00 + 10.00, well under ACCT-CREDIT-LIMIT 2020.00
# [app/cbl/CBTRN02C.cbl:403-413], so the expiry comparison alone decides.
#
# The record is invented: its DALYTRAN-ID, description and merchant match no
# repository transaction. DALYTRAN-CARD-NUM is the repository card of account
# 00000000001 [app/data/ASCII/cardxref.txt:49], whose ACCT-EXPIRAION-DATE is
# 2025-05-20, its current balance 194.00 and both cycle fields 0.00
# [app/data/ASCII/acctdata.txt:1]; its only category balance, key
# 00000000001/01/0001, holds 0.00 [app/data/ASCII/tcatbal.txt:1], so the posting
# rewrites that record and creates none. DALYTRAN is synthetic, so no dailytran.txt
# item is listed. TRANFILE is opened OUTPUT and DALYREJS is an output, so neither
# TRANSACT nor DALYREJS is a precondition.
#
# Expected values are in decoded form (the comparison boundary): unsigned zoned
# numbers carry no leading zeros (ACCT-ID '1' is account 00000000001, TRANCAT-CD
# '1' is category 0001), amounts keep their scale, and text keeps its trailing
# spaces. TRAN-PROC-TS is the fixed run clock in the DB2 format CBTRN02C builds
# [app/cbl/CBTRN02C.cbl:692-705].
id: TRN-CBTRN02C-boundary-02
level: unit
type: boundary
description: >-
  CBTRN02C posts a daily transaction whose origination date equals the account's
  expiration date (2025-05-20): no record is rejected, the transaction is written
  to TRANSACT with the run clock as its processing timestamp, account 00000000001
  goes from 194.00 to 204.00 with 10.00 of cycle credit, its category balance
  00000000001/01/0001 goes from 0.00 to 10.00, and the run ends with return code 0.
inventory_ids:
- INV-TRN-077  # CBTRN02C reject 103 expired account (rule): the expiration date itself posts
- INV-TRN-008  # CBTRN02C program
- INV-TRN-081  # CBTRN02C balance posting (calculation)
- INV-LAY-025  # CVTRA05Y copybook, the TRANSACT layout
- INV-LAY-016  # CVACT01Y copybook, the ACCTDATA layout
- INV-LAY-021  # CVTRA01Y copybook, the TCATBALF layout
- INV-DTA-003  # cardxref.txt, the CARDXREF fixture source
- INV-DTA-013  # EBCDIC card cross-reference file, its cross-check counterpart
- INV-DTA-001  # acctdata.txt, the ACCTDATA fixture source
- INV-DTA-011  # EBCDIC account data file, its cross-check counterpart
- INV-DTA-007  # tcatbal.txt, the TCATBALF fixture source
- INV-DTA-018  # EBCDIC category balance file, its cross-check counterpart
tags: []
gap_ids:
- GAP-STB-010  # Berkeley DB indexed files in place of the VSAM KSDS; OPEN OUTPUT recreates TRANSACT
- GAP-STB-011  # GnuCOBOL compile and runtime options in place of Enterprise COBOL and LE
preconditions:
  datasets:
    DALYTRAN:
      records:
      - DALYTRAN-ID: '9900000000000331'
        DALYTRAN-TYPE-CD: '01'
        DALYTRAN-CAT-CD: 1
        DALYTRAN-SOURCE: POS TERM
        DALYTRAN-DESC: Synthetic on expiry day
        DALYTRAN-AMT: '10.00'
        DALYTRAN-MERCHANT-ID: 900000331
        DALYTRAN-MERCHANT-NAME: Synthetic Test Merchant
        DALYTRAN-MERCHANT-CITY: Testville
        DALYTRAN-MERCHANT-ZIP: '00000'
        DALYTRAN-CARD-NUM: '9680294154603697'
        DALYTRAN-ORIG-TS: '2025-05-20 09:15:00.000000'
    CARDXREF:
      base: CARDXREF
    ACCTDATA:
      base: ACCTDATA
    TCATBALF:
      base: TCATBALF
  parameters:
    clock: '2022-07-06 10:00:00.00'
    clock_mode: fixed
  faults: []
inputs:
