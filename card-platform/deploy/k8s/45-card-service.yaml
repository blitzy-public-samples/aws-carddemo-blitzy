# Deployment and Service for the card service, which serves the card list, the
# card detail and the card update. The service publishes card.updated on a
# mutation only. No listener runs here, and no consumer group appears.
#
# Paged browse: app/cbl/COCRDLIC.cbl. Detail: app/cbl/COCRDSLC.cbl. Update
# validation: app/cbl/COCRDUPC.cbl.
#
# The card endpoints and the outbox relay configured below are planned and
# unauthored, so the container starts and answers /actuator only.
#
# Rationale for every choice in this folder: card-platform/docs/decision-log.md
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: card-service
  namespace: carddemo
  labels:
    app.kubernetes.io/name: card-service
    app.kubernetes.io/component: card
    app.kubernetes.io/part-of: card-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: card-service
      app.kubernetes.io/part-of: card-platform
  template:
    metadata:
      labels:
        # The network policies in 10-kafka.yaml and 20-postgres.yaml admit the
        # name below. Both name the six services one by one, so a Pod that
        # merely belongs to the platform reaches neither the broker nor the
        # database.
        app.kubernetes.io/name: card-service
        app.kubernetes.io/component: card
        app.kubernetes.io/part-of: card-platform
    spec:
      automountServiceAccountToken: false
      # Account 10001 owns /app in the image. 00-namespace.yaml refuses root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # The mounted keystore, truststore and certificate authority arrive
        # owned by root. fsGroup gives group 10001 read access to them.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: card-service
          # Built from card-platform/services/card-service/Dockerfile.
          image: carddemo/card-service:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # The image writes nothing under / after start. Its Dockerfile pins
            # TMPDIR and java.io.tmpdir to /tmp, which the volume below
            # supplies.
            readOnlyRootFilesystem: true
          ports:
            # 8080 carries the Representational State Transfer (REST) surface
            # that the Service below targets. 9080 carries /actuator and matches
            # MANAGEMENT_PORT in 30-configmap.yaml. No Service exposes 9080.
            # Both ports are encrypted, because 30-configmap.yaml turns on
            # SERVER_SSL_ENABLED and MANAGEMENT_SSL_ENABLED.
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9080
          envFrom:
            # Broker address, topic names, service addresses, log levels, the
            # three request-identity usernames and the transport settings. No
            # credential appears there.
            - configMapRef:
                name: carddemo-config
            # Two credentials this service alone holds: the password of its
            # database login and the password of its broker identity.
            - secretRef:
                name: carddemo-card-secret
            # Request-identity password hashes, shared by all six services.
            - secretRef:
                name: carddemo-identity-secret
          env:
            # The schema and the login this service owns. 30-configmap.yaml
            # holds both values, and envFrom above pulls every key of it, so
            # each Deployment binds the keys it owns by name.
            - name: SPRING_FLYWAY_SCHEMAS
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: CARD_DB_SCHEMA
            - name: SPRING_FLYWAY_DEFAULT_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: CARD_DB_SCHEMA
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: CARD_DB_SCHEMA
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: CARD_DB_USER
            # The datasource address this service owns, assembled here. The five
            # values below sit in this list rather than arrive through envFrom,
            # because $(VAR) expansion reads only this list. 30-configmap.yaml
            # carries an option suffix and no database name, so each Deployment
            # names the one database it owns.
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: POSTGRES_PORT
            - name: CARD_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: CARD_DB_NAME
            - name: CARD_DB_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: CARD_DB_SCHEMA
            - name: SPRING_DATASOURCE_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: SPRING_DATASOURCE_OPTIONS
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/$(CARD_DB_NAME)?currentSchema=$(CARD_DB_SCHEMA)&$(SPRING_DATASOURCE_OPTIONS)"
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: CARD_KAFKA_USER
            # The two passwords that open the mounted transport material. Each
            # is named here rather than pulled with envFrom, because
            # carddemo-tls-secret also holds keys whose names are file names.
            - name: SERVER_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carddemo-tls-secret
                  key: SERVER_SSL_KEYSTORE_PASSWORD
            - name: SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carddemo-tls-secret
                  key: KAFKA_SSL_TRUSTSTORE_PASSWORD
          # Both probes read /actuator/health on the management port over HTTPS,
          # because 30-configmap.yaml encrypts that port too. Port 8080 answers
          # no management request. Readiness allows time for the Flyway
          # migration the service runs at startup, which seeds 50 cards and 50
          # cross-references.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # The liveness health group reports process state and excludes every
          # external dependency, so a database outage withdraws the Pod from its
          # Service and restarts no working process.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
              scheme: HTTPS
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          # The image caps the heap at 75 percent of the limit below.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            # The one writable path, capped so a runaway write fills 64
            # mebibytes of memory rather than a node's disk.
            - name: tmp
              mountPath: /tmp
            # Keystore, truststore and certificate authority, read-only. The
            # service presents the keystore on both ports, verifies the broker
            # against the truststore, and verifies the database server against
            # the authority.
            - name: transport-security
              mountPath: /etc/carddemo/tls
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: transport-security
          secret:
            secretName: carddemo-tls-secret
            defaultMode: 0640
            items:
              - key: keystore.p12
                path: keystore.p12
              - key: truststore.p12
                path: truststore.p12
              - key: ca.crt
                path: ca.crt
---
# Pods reach the service at card-service:8080, a short name the Domain Name
# System (DNS) resolves. CARD_SERVICE_BASE_URL in 30-configmap.yaml carries that
# address, and the authorization service reads a card there while it applies the
# decline rules.
apiVersion: v1
kind: Service
metadata:
  name: card-service
  namespace: carddemo
  labels:
    app.kubernetes.io/name: card-service
    app.kubernetes.io/component: card
    app.kubernetes.io/part-of: card-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: card-service
    app.kubernetes.io/part-of: card-platform
  ports:
    # 8080 alone. A Service address is what every pod in the cluster resolves,
    # and /actuator answers on 9080, so the management port stays off this list.
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
