# ACCTFILE rebuilds the account master KSDS from its sequential twin, in three
# IDCAMS steps [app/jcl/ACCTFILE.jcl:19-62]:
# - STEP05 DELETEs the existing cluster, then IF MAXCC LE 08 THEN SET MAXCC = 0
#   zeroes the condition code whether or not the cluster existed
#   [app/jcl/ACCTFILE.jcl:22-27];
# - STEP10 DEFINEs it again, KEYS(11 0) RECORDSIZE(300 300) INDEXED
#   [app/jcl/ACCTFILE.jcl:33-50];
# - STEP15 REPROs the 50 records of ACCTDATA-PS into it [app/jcl/ACCTFILE.jcl:54-62].
# The cluster exists before the job, holding one invented account whose key the
# input lacks, so its absence afterwards shows that STEP05 deleted the old cluster
# and STEP10 defined an empty one before the load. The DELETE succeeds here, so
# the MAXCC reset changes nothing; the reset after a failing DELETE is the
# JCL-semantics item of DAT-ACCTFILE-recovery-01, which only unikix runs, so it is
# not listed here: listing it would take the scenario away from gnucobol-batch.
# The step lines are the job driver's and bpe.py's common form; neither adapter
# writes a line per job. ACCTDATA is compared in ACCT-ID order: the inline records
# pin the key set and record 49's ACCT-ADDR-ZIP, loaded at its ASCII value
# (GAP-DOC-012); the baseline, captured on gnucobol-batch, holds every field.
id: DAT-ACCTFILE-normal-01
level: integration
type: normal
description: >-
  ACCTFILE deletes the existing account master cluster (STEP05 IDCAMS DELETE,
  then IF MAXCC LE 08 THEN SET MAXCC = 0) [app/jcl/ACCTFILE.jcl:22-27], defines it
  again with KEYS(11 0) and RECORDSIZE(300 300) (STEP10) [app/jcl/ACCTFILE.jcl:33-41]
  and REPROs the 50 repository account records into it (STEP15)
  [app/jcl/ACCTFILE.jcl:54-61]. Every step ends with RC 0, the stale record of the
  pre-existing cluster is gone, and ACCTDATA holds exactly the 50 repository
  accounts in ACCT-ID order.
inventory_ids:
- INV-DAT-005  # ACCTFILE job
tags: []
gap_ids:
- GAP-STB-005  # IDCAMS DELETE, DEFINE CLUSTER, IF MAXCC and REPRO emulated on gnucobol-batch
- GAP-STB-009  # catalog emulation: the cluster's DSN deleted and defined again
- GAP-STB-010  # Berkeley DB indexed file in place of the VSAM KSDS
- GAP-DOC-012  # record 49 ACCT-ADDR-ZIP is A000000000 in ASCII and ZEROAPR in EBCDIC
preconditions:
  datasets:
    ACCTDATA-PS: {base: ACCTDATA-PS}
    # The cluster before the job: one invented account, absent from the input.
    ACCTDATA:
      records:
      - ACCT-ID: '99999999999'
        ACCT-ACTIVE-STATUS: 'N'
        ACCT-CURR-BAL: '1.00'
        ACCT-CREDIT-LIMIT: '1000.00'
        ACCT-CASH-CREDIT-LIMIT: '500.00'
        ACCT-OPEN-DATE: '2020-01-01'
        ACCT-EXPIRAION-DATE: '2029-12-31'
        ACCT-REISSUE-DATE: '2029-12-31'
        ACCT-CURR-CYC-CREDIT: '0.00'
        ACCT-CURR-CYC-DEBIT: '0.00'
        ACCT-ADDR-ZIP: '99999'
        ACCT-GROUP-ID: DEFAULT
  parameters:
    clock_mode: relative
  faults: []
inputs:
  job: ACCTFILE
expected:
  return_code: 0
  messages:
  - STEP STEP05 RC 0000
  - STEP STEP10 RC 0000
  - STEP STEP15 RC 0000
  file_state:
