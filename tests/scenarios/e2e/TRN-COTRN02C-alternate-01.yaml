# COTRN02C asks for confirmation instead of adding the transaction when every
# field is valid but CONFIRM is left blank.
#
# Steps 1-2 reach the empty Add Transaction screen as TRN-COTRN02C-normal-01
# does: USER0001 (type U) is routed to COMEN01C, and option 8 transfers control
# to COTRN02C with the program context reset, so COTRN02C sets the re-enter
# flag, finds no transaction selected and sends COTRN02 with a blank ERRMSG
# [app/cbl/COSGN00C.cbl:230-237] [app/cbl/COMEN01C.cbl:115-156]
# [app/cbl/COTRN02C.cbl:119-130,516-528].
# Step 3 enters the valid field set of the TRN-COTRN02C scenarios, card number
# only, and leaves CONFIRM empty ('' erases the field and types nothing; the
# field has FSET and no INITIAL, so it is received as SPACES or LOW-VALUES)
# [app/bms/COTRN02.bms:281-285]. COTRN02C receives it under the CT02 that
# step 2 returned with and performs PROCESS-ENTER-KEY
# [app/cbl/COTRN02C.cbl:131-135,164-188]:
# - ACTIDIN holds only its INITIAL blank, so the card branch runs: the card is
#   numeric, moves back through WS-CARD-NUM-N unchanged, READ CCXREF by card is
#   NORMAL, and XREF-ACCT-ID 00000000050 (record 1 of the CARDXREF fixture) is
#   moved into ACTIDIN [app/cbl/COTRN02C.cbl:195-223,609-623].
# - VALIDATE-INPUT-DATA-FIELDS finds every field supplied and well formed, and
#   CSUTLDTC accepts both dates with mask YYYY-MM-DD; NUMVAL-C turns
#   +00000012.34 into 12.34 and WS-TRAN-AMT-E (PIC +99999999.99) edits it back
#   into TRNAMT as +00000012.34 [app/cbl/COTRN02C.cbl:235-437].
# - CONFIRM is SPACES or LOW-VALUES, so the flag is set, 'Confirm to add this
#   transaction...' goes to WS-MESSAGE, the cursor goes to CONFIRM, and
#   SEND-TRNADD-SCREEN sends COTRN02 FROM the map area RECEIVE filled, with
#   ERASE, then RETURN TRANSID CT02 ends the task
#   [app/cbl/COTRN02C.cbl:173-181,516-534]. ADD-TRANSACTION is never
#   performed, so TRANSACT is neither browsed nor written
#   [app/cbl/COTRN02C.cbl:442-466].
# The screen therefore shows the entered values again, with ACTIDIN filled in
# from the cross-reference. BMS pads each received field with blanks to its
# length, so expected text values are full field width with their trailing
# spaces; CONFIRM shows blank. CURDATE and CURTIME come from the region clock,
# so they are matchers and the clock is relative.
id: TRN-COTRN02C-alternate-01
level: e2e
type: alternate
description: >-
  USER0001 signs on, chooses main-menu option 8 (Transaction Add) and enters a
  valid transaction for repository card 0500024453765740 on COTRN02 with
  CONFIRM left blank. COTRN02C fills in account 00000000050 from the card
  cross-reference, shows the amount as +00000012.34, keeps the other entered
  values, asks 'Confirm to add this transaction...' and writes nothing to
  TRANSACT.
# Primary item first, then the program, the maps asserted, the transaction
# step 3 runs under, the CSD file COTRN02C reads (TRANSACT is not accessed on
# this path), and the online-only copybooks it copies. Sign-on and the menu
# option (CC00, CM00, COSGN00, USRSEC) are verified by the SEC and MNU
# scenarios; the batch record copybooks and data files at the lowest level
# that executes them.
inventory_ids:
- INV-TRN-031  # COTRN02C message 'Confirm to add this transaction...'
- INV-TRN-003  # COTRN02C program
- INV-MNU-003  # COMEN01 map, where option 8 is entered
- INV-TRN-006  # COTRN02 map, the add screen of steps 2 and 3
- INV-CFG-022  # CT02 transaction, under which COTRN02C receives step 3
- INV-CFG-004  # CCXREF CSD file, read by card number to fill in the account
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA carrying the program context
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the screen date and time
- INV-LAY-008  # CSMSG01Y copybook, copied by COTRN02C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-007  # TRN end-to-end baselines derived, never observed on a TPE region
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# TRANSACT is loaded from the repository's 300 daily transactions (the same
# 350-byte shape as TRAN-RECORD): TRANSACT itself is built, with no repository
# data of its own, so it cannot be a base. The load gives the file_state
# assertion a known starting content.
preconditions:
  datasets:
    USRSEC: {base: USRSEC}
    CARDXREF: {base: CARDXREF}
    TRANSACT: {base: DALYTRAN}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '8'
  # ACTIDIN is left as sent, so the card number selects the cross-reference.
  - aid: ENTER
    '@map': COTRN02
    fields:
      CARDNIN: '0500024453765740'
      TTYPCD: '01'
      TCATCD: '0001'
      TRNSRC: 'POS TERM'
      TDESC: 'Test purchase'
      TRNAMT: '+00000012.34'
      TORIGDT: '2022-07-01'
      TPROCDT: '2022-07-01'
      MID: '800000001'
      MNAME: 'Test Merchant'
      MCITY: 'Testville'
      MZIP: '27601'
      CONFIRM: ''
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: 'CM00'
    PGMNAME: 'COMEN01C'
    OPTN008: '08. Transaction Add                     '
    ERRMSG: '                                                                              '
  - '@map': COTRN02
    TRNNAME: 'CT02'
    PGMNAME: 'COTRN02C'
    ERRMSG: '                                                                              '
  - '@map': COTRN02
    TRNNAME: 'CT02'
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: 'COTRN02C'
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ACTIDIN: '00000000050'
    CARDNIN: '0500024453765740'
    TTYPCD: '01'
    TCATCD: '0001'
    TRNSRC: 'POS TERM  '
    TDESC: 'Test purchase                                               '
    TRNAMT: '+00000012.34'
    TORIGDT: '2022-07-01'
    TPROCDT: '2022-07-01'
    MID: '800000001'
    MNAME: 'Test Merchant                 '
    MCITY: 'Testville                '
    MZIP: '27601     '
    CONFIRM: ' '
    ERRMSG: 'Confirm to add this transaction...                                            '
  # The ERRMSG of each step: the menu and the empty add screen carry none.
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'Confirm to add this transaction...                                            '
  file_state:
    # Nothing is written: TRANSACT still holds the 300 fixture records, and the
    # highest of them, the key an add would follow, is unchanged.
    TRANSACT:
      count: 300
      contains:
      - TRAN-ID: '0000000996722787'
        TRAN-TYPE-CD: '01'
        TRAN-CAT-CD: '1'
        TRAN-SOURCE: 'POS TERM  '
        TRAN-DESC: 'Purchase at Kilback LLC                                                                             '
        TRAN-AMT: '603.22'
        TRAN-MERCHANT-ID: '800000000'
        TRAN-MERCHANT-NAME: 'Kilback LLC                                       '
        TRAN-MERCHANT-CITY: 'Cummeratamouth                                    '
        TRAN-MERCHANT-ZIP: '53200-7529'
        TRAN-CARD-NUM: '3260763612337560'
        TRAN-ORIG-TS: '2022-06-10 19:27:53.000000'
        TRAN-PROC-TS: '                          '
