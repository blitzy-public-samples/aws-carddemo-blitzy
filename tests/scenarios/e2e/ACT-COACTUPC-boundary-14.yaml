# COACTUPC account update at the edge of the 30-day-month check: April 31.
# With boundary-13 (April 30, accepted) it brackets the predicate of
# EDIT-DAY-MONTH-YEAR that refuses day 31 in a month outside WS-31-DAY-MONTH
# (1, 3, 5, 7, 8, 10, 12) and composes '<field name>:Cannot have 31 days in
# this month.' [app/cpy/CSUTLDPY.cpy:209-226] [app/cpy/CSUTLDWY.cpy:21-30].
# Open Date carries the date-edit boundaries for all four date fields, which
# share EDIT-DATE-CCYYMMDD.
#
# Steps 1-3 sign on, choose main-menu option 2 and fetch account 00000000001:
# CXACAIX gives card 9680294154603697 and customer 000000001 (line 49 of
# app/data/ASCII/cardxref.txt), ACCTDAT and CUSTDAT are read, the records are
# kept as the old values in the COMMAREA, ACUP-SHOW-DETAILS is set and every
# editable field is sent unprotected with MDT on, so all of them come back on
# the next AID [app/cbl/COACTUPC.cbl:2568-2580,3500-3561,3608-3884].
# Step 4 types 04 over the open month and 31 over the open day (the year stays
# 2014) and presses ENTER:
# - 1100-RECEIVE-MAP builds ACUP-NEW-OPEN-DATE '20140431'
#   [app/cbl/COACTUPC.cbl:1144-1163]; 1205-COMPARE-OLD-NEW finds it differs
#   from '20141120', so 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs
#   the field edits in screen order [app/cbl/COACTUPC.cbl:1460-1482,1681-1696].
# - Account Status 'Y' passes 1220-EDIT-YESNO, so WS-RETURN-MSG is still off
#   when 'Open Date' is moved to WS-EDIT-VARIABLE-NAME and EDIT-DATE-CCYYMMDD
#   runs THRU its exit [app/cbl/COACTUPC.cbl:1472-1482].
# - Year 2014 is supplied, numeric and of century 20; month 04 is supplied, in
#   WS-VALID-MONTH and numeric; day 31 is supplied, numeric and in
#   WS-VALID-DAY, the upper edge of 1-31 [app/cpy/CSUTLDPY.cpy:25-204].
# - EDIT-DAY-MONTH-YEAR: 4 is not a 31-day month and the day is 31, so
#   INPUT-ERROR, FLG-DAY-NOT-OK and FLG-MONTH-NOT-OK are set, the message is
#   STRINGed into WS-RETURN-MSG and GO TO EDIT-DATE-CCYYMMDD-EXIT skips the
#   CSUTLDTC call of EDIT-DATE-LE [app/cpy/CSUTLDPY.cpy:213-226,284-331].
# - The later edits find the invented customer and the repository account
#   valid, and none overwrites the message, which each composes only while
#   WS-RETURN-MSG-OFF holds.
# INPUT-ERROR leaves ACUP-CHANGES-NOT-OK, which 2000-DECIDE-ACTION passes over
# [app/cbl/COACTUPC.cbl:1671-1675,2596-2597]. 3203-SHOW-UPDATED-VALUES sends
# the received values, the amounts re-edited through +ZZZ,ZZZ,ZZZ.99;
# 3250-SETUP-INFOMSG sets PROMPT-FOR-CHANGES and moves WS-RETURN-MSG to ERRMSG;
# 3300 unprotects the editable fields again and shows OPNMON and OPNDAY in red;
# 3390 brightens F12=Cancel because changes were made, while F5=Save stays
# dark [app/cbl/COACTUPC.cbl:2718-2720,2870-2951,2955-2983,2986-3031,
# 3214-3229,3566-3581]. Nothing is read for update or rewritten on this path.
#
# Expected values are derived from the source (no TPE region runs in CI):
# - ERRMSG is the 44-character message in the 75-byte WS-RETURN-MSG, padded to
#   the 78-byte field; INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte field.
#   Text values are whole fields at their BMS length, trailing spaces kept.
# - FKEY05 keeps its INITIAL text but is dark (ASKIP,DRK), which the s3270
#   capture renders as blanks.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, as in ACT-COACTUPC-alternate-04; account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-boundary-14
level: e2e
type: boundary
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001, changes its Open Date from 2014-11-20 to 2014-04-31 and
  presses ENTER. Day 31 is within 1-31, but April has 30 days, so COACTUPC
  refuses the date with 'Open Date:Cannot have 31 days in this month.' in the
  message line, shows the entered values again with the change prompt and
  leaves F5=Save hidden. Nothing is saved: ACCTDATA and CUSTDATA keep the
  fetched records. The accepted side of the edge, 2014-04-30, is boundary-13.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are verified
# by the SEC and MNU scenarios; the batch record copybooks and the data files
# are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-079  # COACTUPC Open Date: no 31st in a 30-day month (rule)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refusal screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits use
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the red attribute of the refused month and day
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-DAY-MONTH-YEAR, which refuses the date
- INV-LAY-014  # CSUTLDWY: WS-31-DAY-MONTH and WS-DAY-31
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY drops FUNCTION TRIM from the field name, so on UniKix the
# message carries 'Open Date' padded to 25 characters before the colon.
- GAP-DOC-024
# Cited beyond the date edit because screen 4 also asserts what they change:
# the UniKix COACTUPC comments out the TEST-NUMVAL-C amount checks behind the
# re-edited amounts, and the UniKix COACTUP.bms differs at row 1, columns 1-9,
# beside TRNNAME.
- GAP-DOC-022
- GAP-DOC-025
