# COACTUPC field edit 'Credit Limit: supplied': USER0001 fetches account
# 00000000001 on the Account Update screen and clears the credit limit, and
# 1250-EDIT-SIGNED-9V2 refuses the blank amount with 'Credit Limit must be
# supplied.'.
#
# Step 1 signs on through CC00; COSGN00C routes the type-U user to the main menu
# COMEN01, asserted by its header only (sign-on belongs to SEC-COSGN00C).
# Step 2 enters option 2: COMEN01C transfers control to COACTUPC, which takes its
# fresh-entry path and sends COACTUP with the search-key prompt
# [app/cbl/COMEN01C.cbl:115-156] [app/cbl/COACTUPC.cbl:964-973,2955-2983].
# Step 3 enters the account id. 9000-READ-ACCT reads CXACAIX by account (card
# 9680294154603697, customer 000000001), then ACCTDAT and CUSTDAT, keeps the
# values in the COMMAREA as ACUP-OLD-DETAILS and shows them with 'Update account
# details presented above.' [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3608-3884].
# Every field is sent with FSET, so the ENTER of step 4 returns every field
# [app/cbl/COACTUPC.cbl:3441-3561].
# Step 4 clears the credit limit: the adapter erases the field and types nothing.
# 1100-RECEIVE-MAP moves LOW-VALUES to ACUP-NEW-CREDIT-LIMIT-X for a blank (or
# '*') ACRDLIMI and leaves ACUP-NEW-CREDIT-LIMIT at the spaces of INITIALIZE
# [app/cbl/COACTUPC.cbl:1047,1073-1084], so 1205-COMPARE-OLD-NEW finds a change
# against the fetched 2020.00 [app/cbl/COACTUPC.cbl:1690]. 1200-EDIT-MAP-INPUTS
# sets ACUP-CHANGES-NOT-OK and edits the fields in screen order
# [app/cbl/COACTUPC.cbl:1470-1488]: Account Status 'Y' and Open Date 2014-11-20
# pass, then 'Credit Limit' goes to WS-EDIT-VARIABLE-NAME and the LOW-VALUES to
# WS-EDIT-SIGNED-NUMBER-9V2-X. 1250-EDIT-SIGNED-9V2 finds it not supplied, sets
# INPUT-ERROR and FLG-SIGNED-NUMBER-BLANK and, the message line being off, STRINGs
# the trimmed name and ' must be supplied.' into WS-RETURN-MSG, the primary item
# [app/cbl/COACTUPC.cbl:2180-2198]. Every later edit passes on the fetched account
# values and the invented customer below, and none of them overwrites a message
# already set. INPUT-ERROR keeps the action 'E', so 2000-DECIDE-ACTION continues
# without reading for update or rewriting anything [app/cbl/COACTUPC.cbl:2595-2599].
# 3203-SHOW-UPDATED-VALUES sends the received values, the valid amounts edited
# again through PIC +ZZZ,ZZZ,ZZZ.99 and the blank credit limit as LOW-VALUES
# [app/cbl/COACTUPC.cbl:371,2870-2949]. The CSSETATY copy for CRED-LIMIT colours
# the field red and, the flag being blank on a re-entry, moves '*' to ACRDLIMO
# [app/cbl/COACTUPC.cbl:3231-3235] [app/cpy/CSSETATY.cpy:17-26].
# 3250-SETUP-INFOMSG gives PROMPT-FOR-CHANGES for ACUP-CHANGES-NOT-OK and moves the
# message to ERRMSG [app/cbl/COACTUPC.cbl:2955-2982]; 3390-SETUP-INFOMSG-ATTRS
# shows F12=Cancel for a change action and keeps F5=Save dark
# [app/cbl/COACTUPC.cbl:3566-3583].
#
# Expected values are derived from the source; no TPE region runs in CI.
# - Text values are whole fields at their BMS length with trailing spaces: ERRMSG
#   is the 30-character message in the 75-byte WS-RETURN-MSG padded to 78, INFOMSG
#   the 40-byte WS-INFO-MSG padded to 45, ACRDLIM the '*' padded to 15.
# - The 88-level CRED-LIMIT-IS-BLANK ('Credit Limit must be supplied', no full
#   stop) is a different, unused item [app/cbl/COACTUPC.cbl:505-506]; the text
#   shown is the composed one.
# - The account values are repository record 00000000001 of acctdata.txt, whose
#   ACCT-GROUP-ID is blank (GAP-DEF-005), so AADDGRP shows 10 spaces.
# - The customer text fields are not asserted: they echo the received input, which
#   the region's uppercase translation of input may change. CURDATE and CURTIME
#   come from the run clock through CSDAT01Y, hence the matchers and clock_mode
#   relative.
id: ACT-COACTUPC-negative-025
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main menu option 2 'Account Update', fetches
  account 00000000001 on the COACTUP screen, clears the Credit Limit field and
  presses ENTER. COACTUPC refuses the blank amount in 1250-EDIT-SIGNED-9V2: the
  screen comes back with 'Credit Limit must be supplied.' in the message line,
  '*' in the Credit Limit field, the other received values and the prompt
  'Update account details presented above.'; ACCTDAT and CUSTDAT are not updated.
# Primary item first, then the program, the maps asserted, the transaction the
# fetch and the edit run under, the CSD files the fetch reads, and the
# online-only copybooks COACTUPC copies. The sign-on (CC00, COSGN00, COSGN00C,
# USRSEC) and the menu option are verified by the SEC and MNU scenarios; batch
# copybooks and data-file items are verified at the batch levels.
inventory_ids:
- INV-ACT-083  # COACTUPC Credit Limit: supplied (field edit, 1250-EDIT-SIGNED-9V2)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the update screen of steps 2-4
- INV-CFG-009  # CAUP transaction, under which the fetch and the edit run
- INV-CFG-006  # CXACAIX CSD file, the cross-reference read by account
- INV-CFG-001  # ACCTDAT CSD file, read by the fetch and left unchanged
- INV-CFG-005  # CUSTDAT CSD file, read by the fetch and left unchanged
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA carrying the fetched values
- INV-LAY-005  # COTTL01Y copybook, TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y copybook, CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y copybook, copied by COACTUPC
- INV-LAY-007  # CSLKPCDY copybook, the area code, state and zip lookups of the later edits
- INV-LAY-009  # CSMSG02Y copybook, the abend variables
- INV-LAY-010  # CSSETATY copybook, the red colour and '*' of the refused field
- INV-LAY-011  # CSSTRPFY copybook, the AID mapping that turns ENTER into CCARD-AID-ENTER
- INV-LAY-013  # CSUTLDPY copybook, the date edits that precede the credit limit
- INV-LAY-014  # CSUTLDWY copybook, the date edit work areas
- INV-LAY-019  # CVCRD01Y copybook, the AID flags and CC-ACCT-ID
tags:
- inferred-not-observed
# GAP-DOC-022: the UniKix copy of COACTUPC drops FUNCTION TRIM from the field
#   name of every composed edit message and the TEST-NUMVAL-C checks of the
#   amounts, so a UniKix run never verifies this item while that entry is open.
# GAP-DOC-025: the UniKix copy of COACTUP.bms drops the unnamed field at row 1,
#   columns 1-9, where TRNNAME is asserted.
gap_ids:
- GAP-INF-005  # account (ACT) end-to-end baselines derived from the source, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-DOC-022
- GAP-DOC-025
preconditions:
  datasets:
    # COSGN00C reads the sign-on user USER0001.
    USRSEC: {base: USRSEC}
    # Account 00000000001 as the repository holds it.
    ACCTDATA: {base: ACCTDATA}
    # Record 49 maps account 00000000001 to card 9680294154603697 and customer
    # 000000001; CXACAIX is its alternate-index path.
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 with invented values that pass every COACTUPC edit, so
    # the credit limit is the only field refused. The repository customer's FICO
    # score 274 would fail 1275-EDIT-FICO-SCORE. NC is a valid state, NC27 a valid
    # state and zip prefix and 919 a general-purpose area code
    # [app/cbl/COACTUPC.cbl:1472-1669,2431-2558] [app/cpy/CSLKPCDY.cpy:521,1013,1073].
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: '100 Test Street'
        CUST-ADDR-LINE-2: 'Suite 1'
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
        CUST-ADDR-ZIP: '27601'
        CUST-PHONE-NUM-1: '(919)555-0101'
        CUST-PHONE-NUM-2: '(919)555-0102'
        CUST-SSN: '123456789'
        CUST-GOVT-ISSUED-ID: TESTGOVT0001
        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: 'Y'
        CUST-FICO-CREDIT-SCORE: '700'
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: USER0001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '2'}
    '@map': COMEN01
  - aid: ENTER
    fields: {ACCTSID: '00000000001'}
    '@map': COACTUP
  # The credit limit erased and left empty; every other field goes back as sent.
  - aid: ENTER
    fields: {ACRDLIM: ''}
    '@map': COACTUP
