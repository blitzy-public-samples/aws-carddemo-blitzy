# Alembic migration configuration for the CardDemo modernized backend.
#
# Alembic manages the versioned schema migrations that replace the legacy VSAM
# datasets with PostgreSQL 17 tables (AAP 0.4.1, 0.5.4). This file tells Alembic
# where migration scripts live and how new revision files are named. It is kept
# intentionally engine-agnostic: the ASYNC SQLAlchemy engine is wired up in
# `alembic/env.py`, not here (AAP 0.4.2 "async template").
#
# SECURITY (Ochs Rule #3 - no hardcoded secrets): the database connection string
# is NEVER stored in this file. `alembic/env.py` injects it at runtime via
# `config.set_main_option("sqlalchemy.url", ...)`, reading the value from the
# environment (SYNC_DATABASE_URL for the sync migration engine, falling back to
# DATABASE_URL) through `app.core.config.Settings`. See `backend/.env.example`.
#
# Usage (run from the backend/ directory):
#   alembic upgrade head          # apply every migration up to the latest
#   alembic downgrade -1          # roll back the most recent migration
#   alembic revision -m "message" # author a new migration script

[alembic]
# Path to the migration environment (alembic/env.py + versions/), resolved
# relative to this file at the backend root: backend/alembic/.
script_location = alembic

# Prepend the backend root to sys.path so `alembic/env.py` can `import app...`;
# the `app` package lives next to this file at the backend root.
prepend_sys_path = .

# Template used to generate migration file names. The doubled percent signs are
# required so Python's ConfigParser passes a literal `%(rev)s_%(slug)s` through
# to Alembic. This yields ordered, human-readable names such as
# `0001_initial_schema.py` and `0002_seed_data.py`.
file_template = %%(rev)s_%%(slug)s

# Render migration create-dates in UTC so generated revisions are deterministic
# and reproducible across machines, supporting the project's golden-master
# parity goals. Consulted only by `alembic revision`, never by `alembic upgrade`.
timezone = UTC

# Maximum number of characters from the migration message used to build the
# `slug` portion of a revision file name.
truncate_slug_length = 40

# Separator used when splitting `version_locations`. "os" uses os.pathsep, which
# keeps behavior correct on every platform. The default version location is
# `<script_location>/versions` (backend/alembic/versions); uncomment and adjust
# the line below only if migrations are split across multiple directories:
# version_locations = %(here)s/alembic/versions
version_path_separator = os

# Database URL - intentionally left EMPTY.
# Do NOT hardcode a real connection string or any secret here (Ochs Rule #3).
# `alembic/env.py` overrides this at runtime from the environment
# (SYNC_DATABASE_URL, falling back to DATABASE_URL) via app.core.config.Settings.
sqlalchemy.url =


# ---------------------------------------------------------------------------
# Post-write hooks run against newly generated revision scripts. They are all
# intentionally DISABLED (commented out): the formatters shown below (black,
# ruff) are NOT declared in backend/requirements.txt, so enabling them would
# break `alembic revision`. To enable one, add the tool to the requirements
# manifest first, then uncomment the relevant block.
# ---------------------------------------------------------------------------
[post_write_hooks]
# Format generated revisions with "black" (console_scripts runner):
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100 REVISION_SCRIPT_FILENAME

# Lint and auto-fix generated revisions with "ruff" (exec runner):
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = --fix REVISION_SCRIPT_FILENAME


# ---------------------------------------------------------------------------
# Logging configuration (standard Alembic template) so migration runs are
# observable on stderr. The format strings below intentionally use single `%`
# placeholders: `logging.config.fileConfig` reads them raw and hands them to the
# stdlib logging formatter, so they must NOT be percent-doubled.
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
