# COACTUPC refuses an account update whose FICO Score is zero: the field edit
# 1245-EDIT-NUM-REQD 'not zero', which 1200-EDIT-MAP-INPUTS performs for the
# FICO Score with a length of 3 [app/cbl/COACTUPC.cbl:1545-1556,2109-2176].
#
# Steps 1-3 sign on, choose main-menu option 2 and fetch account 00000000001
# as ACT-COACTUPC-alternate-03 does: the details of the account and of the
# invented customer 000000001 are shown with ACUP-SHOW-DETAILS in the returned
# COMMAREA, and 3320-UNPROTECT-FEW-ATTRS gives every editable field MDT on, so
# all of them come back on the next AID [app/cbl/COACTUPC.cbl:2568-2580,
# 2787-2865,3500-3561].
# Step 4 types 000 over the FICO Score (ACSTFCO, shown as '700') and presses
# ENTER.
# - 1100-RECEIVE-MAP moves the received '000', neither '*' nor spaces, to the
#   3-byte ACUP-NEW-CUST-FICO-SCORE-X [app/cbl/COACTUPC.cbl:1277-1284].
#   1205-COMPARE-OLD-NEW finds it unequal to the fetched '700', so a change has
#   occurred, and 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs the
#   field edits in screen order [app/cbl/COACTUPC.cbl:1460-1470,1767-1770].
# - Account Status, the three account dates, the five amounts, the SSN and the
#   Date of Birth pass with these fixtures and leave the message line off
#   [app/cbl/COACTUPC.cbl:876,1472-1543]. 'FICO Score' is moved to
#   WS-EDIT-VARIABLE-NAME and the score to WS-EDIT-ALPHANUM-ONLY.
#   1245-EDIT-NUM-REQD finds the first 3 bytes supplied and NUMERIC, but
#   FUNCTION NUMVAL('000') = 0, so it sets INPUT-ERROR and FLG-ALPHNANUM-NOT-OK
#   and, WS-RETURN-MSG being off, STRINGs TRIM(WS-EDIT-VARIABLE-NAME) and
#   ' must not be zero.' into WS-RETURN-MSG [app/cbl/COACTUPC.cbl:2154-2168].
# - The flag '0' moved to WS-EDIT-FICO-SCORE-FLGS is FLG-FICO-SCORE-NOT-OK, not
#   FLG-FICO-SCORE-ISVALID, so 1275-EDIT-FICO-SCORE is not performed and the
#   range message ': should be between 300 and 850' never replaces this one
#   [app/cbl/COACTUPC.cbl:231-234,1551-1556,2514-2531].
# - Every later edit passes on the invented customer below; they only set
#   their flags, since WS-RETURN-MSG is no longer blank
#   [app/cbl/COACTUPC.cbl:1557-1676]. INPUT-ERROR keeps ACUP-CHANGES-NOT-OK,
#   and 2000-DECIDE-ACTION continues on it, so 9600-WRITE-PROCESSING, the only
#   READ UPDATE and REWRITE path, does not run [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values, the valid amounts
#   re-edited through +ZZZ,ZZZ,ZZZ.99 and the FICO Score as received; 3250 sets
#   PROMPT-FOR-CHANGES and moves the message to ERRMSG; 3300 keeps the fields
#   editable, puts the cursor on ACSTFCO and marks it red through CSSETATY
#   without the '*' of a blank field; 3390 makes F12=Cancel bright because
#   changes were made, while F5=Save stays dark [app/cbl/COACTUPC.cbl:
#   2870-2951,2955-2983,3101-3104,3333-3337,3566-3581]
#   [app/cpy/CSSETATY.cpy:18-27].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - The message is TRIM('FICO Score') followed by ' must not be zero.', 28
#   characters of the 75-byte WS-RETURN-MSG, shown in the 78-byte ERRMSG with
#   trailing spaces. INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte field.
#   Fields are compared at their full BMS length, trailing spaces kept.
# - ACSTFCO is 3 bytes [app/bms/COACTUP.bms:318-321], so the typed '000' fills
#   it and is shown back unchanged.
# - FKEY05 and FKEY12 keep their INITIAL text; a dark (ASKIP,DRK) field is
#   captured as blanks. Colour and cursor position are not in the s3270 text
#   capture and are not asserted.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, so the FICO Score is the only field refused: the repository record
# has FICO 274, below 300, and zip 12546, which is not a North Carolina zip
# [app/cbl/COACTUPC.cbl:2514-2558]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-087
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001, whose customer has FICO Score 700, types 000 over the
  FICO Score and presses ENTER. The score is numeric but zero, so COACTUPC
  refuses the change: it shows the received values again, editable, with
  'FICO Score must not be zero.' in the message line, the score as typed, the
  change prompt 'Update account details presented above.' and F12=Cancel made
  visible. The range check is not reached. Nothing is saved: ACCTDATA and
  CUSTDATA still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-145  # COACTUPC FICO Score: not zero (1245-EDIT-NUM-REQD)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute set on ACSTFCO
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the date edits the earlier dates pass
- INV-LAY-014  # CSUTLDWY: the date-edit working storage
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix COACTUPC drops FUNCTION TRIM from the field name of every
# composed edit message, so on UniKix the message carries the 25-byte
# WS-EDIT-VARIABLE-NAME untrimmed; the app/ behaviour is pinned.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
