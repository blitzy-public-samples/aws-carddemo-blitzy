<!--
  Custom SVG Icon: Credit Card
  
  Purpose: Represents credit card features and functionality in the CardDemo application
  Replaces: Character-based card representations from BMS 3270 terminal screens
  Source BMS: COCRDLI.bms (list), COCRDSL.bms (select), COCRDUP.bms (update)
  
  Design Features:
  - Credit card shape with rounded corners
  - EMV chip element (small rectangle)
  - Magnetic stripe (horizontal bar)
  - Card detail lines (representing card number/info)
  
  Usage: Supports card management operations including list, select, and update functions
  Sizing: Works at 16px, 24px, 32px, and 48px
  Theming: Uses currentColor for dynamic color changes via CSS
  
  Copyright: Part of CardDemo Mainframe to Cloud Migration Project
  Licensed under Apache License 2.0
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
  <!-- Card outline with rounded corners -->
  <rect x="2" y="5" width="20" height="14" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
  
  <!-- Magnetic stripe -->
  <rect x="2" y="7.5" width="20" height="2.5" fill="currentColor" opacity="0.3"/>
  
  <!-- EMV chip -->
  <rect x="4" y="11" width="4" height="3" rx="0.5" ry="0.5" fill="currentColor" opacity="0.6"/>
  
  <!-- Card number representation (4 groups of lines) -->
  <line x1="10" y1="12" x2="12" y2="12" stroke="currentColor" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
  <line x1="13" y1="12" x2="15" y2="12" stroke="currentColor" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
  <line x1="16" y1="12" x2="18" y2="12" stroke="currentColor" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
  
  <!-- Cardholder name line -->
  <line x1="4" y1="16" x2="12" y2="16" stroke="currentColor" stroke-width="1" opacity="0.4" stroke-linecap="round"/>
</svg>
