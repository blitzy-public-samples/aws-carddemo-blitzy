        SYSPRINT: {sysout: '*'}
      params:
        sysin:
        - "  DEFINE PATH                                           -"
        - "   (NAME(AWS.M2.CARDDEMO.TRANSACT.VSAM.AIX.PATH)        -"
        - "    PATHENTRY(AWS.M2.CARDDEMO.TRANSACT.VSAM.AIX))"
    # [app/jcl/TRANFILE.jcl:106-112]
    - step: STEP30
      kind: idcams
      dd:
        SYSPRINT: {sysout: '*'}
      params:
        sysin:
        - "   BLDINDEX                                                      -"
        - "   INDATASET(AWS.M2.CARDDEMO.TRANSACT.VSAM.KSDS)                 -"
        - "   OUTDATASET(AWS.M2.CARDDEMO.TRANSACT.VSAM.AIX)"
    # [app/jcl/TRANFILE.jcl:116-122]
    # SDSF CEMT commands are a no-op RC 0 here (GAP-STB-008).
    - step: OPCIFIL
      kind: sdsf
      dd:
        ISFOUT: {sysout: '*'}
        CMDOUT: {sysout: '*'}
      params:
        isfin:
        - " /F CICSAWSA,'CEMT SET FIL(TRANSACT ) OPE'"
        - " /F CICSAWSA,'CEMT SET FIL(CXACAIX ) OPE'"

