# Manifest of the derived baseline of USR-COUSR02C-alternate-02: only unikix
# can run the scenario, so expected.yaml was authored from the source, not
# captured. It names no execution_id or execution_fingerprint and holds no
# datasets/ until an eligible UniKix run is imported (GAP-INF-004, GAP-INF-012).
#
# source_identity.units are the app/ units the three steps execute: COSGN00C,
# which signs ADMIN001 on and XCTLs the type-A user to COADM01C
# [app/cbl/COSGN00C.cbl:225-240]; COADM01C, whose option 3 is COUSR02C
# [app/cpy/COADM02Y.cpy:34-37]; and COUSR02C, which reads USRSEC for update
# and sends COUSR02 [app/cbl/COUSR02C.cbl:143-172,320-339]. Each program brings
# its COPY closure, as inventory_tools.copy_closure computes it, and each of
# the maps sent, COSGN00, COADM01 and COUSR02, its BMS source. DFHAID and
# DFHBMSCA are CICS-supplied and not in the repository. source_commit is HEAD
# at authoring; app/ is byte-identical to the suite's starting commit.
