# Manifest of the derived baseline of CRD-COCRDLIC-alternate-04: a second PF8
# on the last page of the card list answered with 'NO MORE PAGES TO DISPLAY'
# [app/cbl/COCRDLIC.cbl:905-909]. Only unikix can run the scenario, so
# expected.yaml is authored from the source and is inferred-not-observed
# (GAP-INF-006, GAP-INF-012). It names no execution_id or
# execution_fingerprint and holds no datasets/ until report.py --import-unikix
# promotes an eligible UniKix run.
#
# source_identity.units are the app/ sources the steps execute: the COPY
# closure (inventory_tools.copy_closure) of COSGN00C, which signs USER0001 on
# and XCTLs to COMEN01C [app/cbl/COSGN00C.cbl:230-240]; of COMEN01C, whose
# option 3 XCTLs to COCRDLIC [app/cpy/COMEN02Y.cpy:37-41]
# [app/cbl/COMEN01C.cbl:145-155]; and of COCRDLIC, which pages the list and
# sets the message [app/cbl/COCRDLIC.cbl:896-931,1123-1240]; plus the BMS
# sources of their maps COSGN00, COMEN01 and COCRDLI. The sign-on and menu
# programs are listed, not only COCRDLIC, because a source identity names
# every program that ran and expected.yaml asserts the COMEN01 screen
# COMEN01C sends. DFHAID and DFHBMSCA are CICS-supplied, not app/ sources.
