# The account update finds the account but not its customer, and the message
# condition DID-NOT-FIND-CUST-IN-CUSTDAT ('Did not find associated customer in
# master file') still does not appear.
# USER0001 signs on through CC00 and chooses option 2 (Account Update) on the
# main menu. COACTUPC, entered from COMEN01C without CDEMO-PGM-REENTER, takes its
# fresh-entry path and sends COACTUP with the search-key prompt
# [app/cbl/COMEN01C.cbl:146-156] [app/cbl/COACTUPC.cbl:964-973]. ENTER with
# account 00000000001 re-enters it through WHEN OTHER: 1100-RECEIVE-MAP stores
# the id in CC-ACCT-ID and stops there because no details are fetched yet, and
# 1210-EDIT-ACCOUNT accepts the 11 digits [app/cbl/COACTUPC.cbl:996-1004,
# 1039-1062,1429-1446,1783-1818]. 2000-DECIDE-ACTION clears WS-RETURN-MSG and
# performs 9000-READ-ACCT [app/cbl/COACTUPC.cbl:2562-2580]. CXACAIX, read by
# account, returns card 9680294154603697 and customer 000000001 (record 49 of
# app/data/ASCII/cardxref.txt), and ACCTDAT finds the account
# [app/cbl/COACTUPC.cbl:3608-3750]. CUSTDAT returns NOTFND because the fixture
# omits customer 000000001.
# The program's only SET of DID-NOT-FIND-CUST-IN-CUSTDAT is commented out
# [app/cbl/COACTUPC.cbl:3769], and the condition is only tested
# [app/cbl/COACTUPC.cbl:3636], so its text cannot reach the screen. That is the
# observed-only behaviour pinned here; GAP-UNC-013 asks what this never-executed
# message code is for. Because the test fails, 9000-READ-ACCT also falls through
# to 9500-STORE-FETCHED-DATA and copies the CUSTOMER-RECORD the failed READ left
# untouched into the COMMAREA [app/cbl/COACTUPC.cbl:3636-3646,3801-3884]; none
# of it is displayed, so this scenario cannot and does not assert it.
# The NOTFND branch composes 'CustId:... not found in customer master.Resp:
# <RESP> REAS:<RESP2>' with STRING into the 75-byte WS-RETURN-MSG
# [app/cbl/COACTUPC.cbl:3752-3784]. ERROR-RESP and ERROR-RESP2 are X(10), and a
# MOVE from the S9(9) COMP RESP fields gives the nine-digit value plus one
# space [app/cbl/COACTUPC.cbl:40-43,401-406]. RESP is 13 (NOTFND), so
# ERROR-RESP is '000000013 '. The composed text is 78 characters and STRING
# stops at the 75th, so only '0000000' of RESP2 is shown; that holds for any
# RESP2 from 0 to 99 (CICS gives 80 for a READ NOTFND). ERRMSG shows the 75
# bytes plus 3 spaces [app/cbl/COACTUPC.cbl:2978-2980].
# FOUND-CUST-IN-MASTER stays unset, so ACUP-DETAILS-NOT-FETCHED holds:
# 3200-SETUP-SCREEN-VARS echoes the account id and 3201-SHOW-INITIAL-VALUES
# leaves every account and customer field at LOW-VALUES, and 3250-SETUP-INFOMSG
# shows the search-key prompt again [app/cbl/COACTUPC.cbl:2577-2579,2698-2783,
# 2955-2980]. The map is sent with ERASE [app/cbl/COACTUPC.cbl:3589-3602], so a
# LOW-VALUES field shows its physical-map INITIAL text where it has one (the
# SSN parts and the key legend) and spaces otherwise [app/bms/COACTUP.bms].
# Fields are compared at their full BMS length, trailing spaces included.
id: ACT-COACTUPC-negative-005
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses Account Update and asks for account 00000000001,
  whose cross-reference and account records exist but whose customer
  000000001 is missing from the customer master. COACTUPC keeps the search
  screen: the account id echoed, every account and customer field blank, the
  prompt 'Enter or update id of account to update' and the composed message
  'CustId:000000001 not found in customer master.Resp: 000000013
  REAS:0000000'. The message 'Did not find associated customer in master file'
  never appears, because the SET of its condition is commented out.
# Primary item first, then the program, the maps the steps enter on and land
# on, the transaction the step-3 ENTER starts, the CSD files the three reads
# use, and the online-only copybooks COACTUPC copies. The composed customer
# not-found message (INV-ACT-063) is asserted but verified by its own scenario,
# and the sign-on items by the SEC-COSGN00C scenarios, so they are not listed.
inventory_ids:
- INV-ACT-043  # COACTUPC message 'Did not find associated customer in master file' (recovery)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, the screen option 2 is entered on
- INV-ACT-004  # COACTUP map
- INV-CFG-009  # CAUP transaction, started by the step-3 ENTER after RETURN TRANSID(CAUP)
- INV-CFG-006  # CXACAIX CSD file, the cross-reference read by account
- INV-CFG-001  # ACCTDAT CSD file, the account read
- INV-CFG-005  # CUSTDAT CSD file, the customer read that returns NOTFND
- INV-LAY-002  # COCOM01Y: the COMMAREA that makes step 3 a reentry
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY, copied by COACTUPC
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y, copied by COACTUPC
- INV-LAY-010  # CSSETATY, copied by COACTUPC
- INV-LAY-011  # CSSTRPFY: maps the ENTER AID to CCARD-AID-ENTER
- INV-LAY-013  # CSUTLDPY, copied by COACTUPC
- INV-LAY-014  # CSUTLDWY, copied by COACTUPC
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID, echoed in ACCTSID
tags:
- inferred-not-observed
- observed-only
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived from the source, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-UNC-013  # purpose of message code that never executes (the commented-out SET)
# Not in the planned gap list. The UniKix COACTUP.bms lacks the unnamed field
# at row 1, columns 1-9, of the map this scenario asserts, and scenarios cite
# each place where the deployed UniKix copy differs from app/.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # notfnd is produced by leaving the record out, so no fault is declared.
    CUSTDATA: {base: CUSTDATA, omit_keys: ['000000001']}
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
# PASSWORD is the documented demo password of README.md, not a secret.
inputs:
  steps:
  - {transid: CC00, aid: ENTER, fields: {USERID: USER0001, PASSWD: PASSWORD}, '@map': COSGN00}
  - {aid: ENTER, fields: {OPTION: '2'}, '@map': COMEN01}
  - {aid: ENTER, fields: {ACCTSID: '00000000001'}, '@map': COACTUP}
