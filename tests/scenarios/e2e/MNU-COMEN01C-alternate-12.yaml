id: MNU-COMEN01C-alternate-12
level: e2e
type: alternate
description: >-
  Transaction CM00 is entered from a cleared screen, so COMEN01C starts with
  no COMMAREA (EIBCALEN = 0). It never shows its menu: CDEMO-TO-PROGRAM is
  blank, so RETURN-TO-SIGNON-SCREEN transfers control (XCTL, no COMMAREA) to
  COSGN00C [app/cbl/COMEN01C.cbl:82-84,170-177], which sends the sign-on map
  COSGN00 and returns with transaction CC00 [app/cbl/COSGN00C.cbl:80-83,98-102].
  The step's ENTER, pressed on that sign-on screen with nothing typed (the user
  id empty), is therefore handled by COSGN00C, which sends COSGN00 again with 'Please enter
  User ID ...' [app/cbl/COSGN00C.cbl:118-122,145-157]. No sign-on precedes the
  step: entry without a COMMAREA is one of the cases that test entry itself.
  The baseline is derived from the source.
# The listing rule keeps COSGN00C's own items out: 'Please enter User ID ...'
# (INV-SEC-005) is verified by SEC-COSGN00C-negative-01, and transaction CC00
# by the scenarios that enter it. The COMEN01 map is not listed because this
# path never sends it.
inventory_ids:
- INV-MNU-020
- INV-MNU-001
- INV-SEC-002
- INV-CFG-018
- INV-LAY-002
- INV-LAY-003
- INV-LAY-005
- INV-LAY-006
- INV-LAY-008
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-003
- GAP-INF-012
preconditions:
  datasets:
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  # '@map' names the step's input screen: the map shown once CM00 has run and
  # before the AID is pressed. Declaring COSGN00 makes the adapter stop at
  # that screen if CM00 shows anything else (the COMEN01 menu included), so
  # the comparison fails on '@map' rather than after a further AID.
  - transid: CM00
    '@map': COSGN00
    fields: {}
    aid: ENTER
expected:
  screens:
  # Field values are full BMS width with their trailing spaces: TRNNAME 4,
  # PGMNAME 8, ERRMSG 78 [app/bms/COSGN00.bms].
  - '@map': COSGN00
    TRNNAME: CC00
    PGMNAME: COSGN00C
    ERRMSG: 'Please enter User ID ...                                                      '
