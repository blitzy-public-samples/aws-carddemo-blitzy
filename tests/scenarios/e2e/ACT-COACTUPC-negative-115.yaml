# COACTUPC refuses an account update whose second phone number has its area
# code left blank while its prefix and line number stay: the first predicate of
# EDIT-AREA-CODE in 1260-EDIT-US-PHONE-NUM, 'supplied', for Phone Number 2
# [app/cbl/COACTUPC.cbl:1640-1646,2225-2259].
#
# Steps 1-3 reach the fetched account as ACT-COACTUPC-alternate-04 does:
# USER0001 signs on through CC00, chooses option 2 (Account Update) on COMEN01,
# and enters account 00000000001. 9000-READ-ACCT reads CXACAIX by account id
# (card 9680294154603697, customer 000000001, line 49 of
# app/data/ASCII/cardxref.txt), ACCTDAT and CUSTDAT, keeps the records as the
# old values in the COMMAREA and sets ACUP-SHOW-DETAILS; the screen shows them
# with 'Update account details presented above.', the second phone number
# (919)555-0102 split as 919, 555 and 0102, and 3320-UNPROTECT-FEW-ATTRS gives
# every editable field MDT on, so all of them come back on the next AID
# [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,2955-3000,3441-3561,3608-3884].
# Step 4 erases ACSPH2A (EraseEOF, nothing typed) and presses ENTER:
# - 1100-RECEIVE-MAP leaves ACUP-NEW-CUST-PHONE-NUM-2A at LOW-VALUES whether
#   the erased field arrives as spaces (moved as LOW-VALUES) or as nulls (moved
#   as received); the prefix and line number keep 555 and 0102
#   [app/cbl/COACTUPC.cbl:1047,1378-1397].
# - 1205-COMPARE-OLD-NEW finds the account fields unchanged and
#   ACUP-NEW-CUST-PHONE-NUM-2A unequal to the fetched 919, so a change has
#   occurred, and 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs the
#   field edits in screen order [app/cbl/COACTUPC.cbl:1460-1470,1681-1774].
# - Account Status, the three account dates, the five amounts, the SSN, the
#   date of birth, the FICO score, the names, the address, state, zip, city,
#   country and Phone Number 1 pass on the repository account and the invented
#   customer below; area code 919 is a North America general-purpose code
#   [app/cbl/COACTUPC.cbl:1472-1638] [app/cpy/CSLKPCDY.cpy:404,521].
# - For Phone Number 2, 1200-EDIT-MAP-INPUTS moves 'Phone Number 2' to
#   WS-EDIT-VARIABLE-NAME and the 15-byte number to WS-EDIT-US-PHONE-NUM. The
#   wholly-blank test is false because the prefix holds 555, so the edits run.
#   EDIT-AREA-CODE finds the area code LOW-VALUES, sets INPUT-ERROR and
#   FLG-EDIT-US-PHONEA-BLANK ('B', moved on to WS-EDIT-PHONE-NUM-2-FLGS) and,
#   the message line being off since the task started
#   [app/cbl/COACTUPC.cbl:876], STRINGs TRIM(WS-EDIT-VARIABLE-NAME) and
#   ': Area code must be supplied.' into WS-RETURN-MSG, then skips the area
#   code's numeric, zero and lookup checks; prefix 555 and line number 0102
#   pass [app/cbl/COACTUPC.cbl:2232-2259,2316-2422]. The later EFT Account Id,
#   Primary Card Holder and state/zip edits pass and could not overwrite the
#   message [app/cbl/COACTUPC.cbl:1648-1676].
# - 2000-DECIDE-ACTION continues on ACUP-CHANGES-NOT-OK, so 9600-WRITE-
#   PROCESSING (PF5 only), the only READ UPDATE and REWRITE path, does not run
#   and nothing is written [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values, the valid amounts
#   re-edited through +ZZZ,ZZZ,ZZZ.99 and the area code as its LOW-VALUES;
#   3250 sets PROMPT-FOR-CHANGES and moves the message to ERRMSG; 3300 puts the
#   cursor on ACSPH2A and, through CSSETATY for PHONE-NUM-2A with
#   FLG-PHONE-NUM-2A-BLANK on a reentry, colours it red and moves '*' to it
#   (the field refused); 3320 keeps the fields editable; 3390 makes F12=Cancel
#   bright because changes were made, while F5=Save stays dark
#   [app/cbl/COACTUPC.cbl:2870-2951,2955-2983,3148-3150,3410-3414,3500-3584]
#   [app/cpy/CSSETATY.cpy:18-27].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - The message is TRIM('Phone Number 2') followed by ': Area code must be
#   supplied.', 43 characters of the 75-byte WS-RETURN-MSG, shown in the
#   78-byte ERRMSG with 35 trailing spaces. ACSPH2A is '*' in the 3-byte field,
#   which has no INITIAL text. INFOMSG is the 40-byte WS-INFO-MSG in the
#   45-byte field. Fields are compared at their full BMS length, trailing
#   spaces kept.
# - FKEY05 and FKEY12 keep their INITIAL text; a dark (ASKIP,DRK) field is
#   captured as blanks. Colour and cursor position are not in the s3270 text
#   capture and are not asserted. AADDGRP is sent as LOW-VALUES (the blank
#   group id), which s3270 shows as spaces.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, so the second phone number's area code is the only field refused: the
# repository record has FICO 274, below 300, and zip 12546, which is not a
# North Carolina zip [app/cbl/COACTUPC.cbl:2514-2558]. The 555 phone numbers
# and the SSN 123-45-6789 are invented and match no person. Account
# 00000000001 and its cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-115
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001, whose customer's second phone number shows as
  (919)555-0102, erases its area code, leaving prefix 555 and line number 0102,
  and presses ENTER. COACTUPC refuses the change: the message line shows
  'Phone Number 2: Area code must be supplied.', the area code field shows
  '*', the other received values are shown again, editable, with the change
  prompt 'Update account details presented above.' and F12=Cancel made
  visible, and neither ACCTDATA nor CUSTDATA is rewritten.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. The change prompt 'Update account details presented above.' is
# asserted but verified by its own scenario. Sign-on (CC00, COSGN00, USRSEC)
# and the menu transaction are verified by the SEC and MNU scenarios; the batch
# record copybooks and the data files are verified at the lowest level that
# executes them.
inventory_ids:
- INV-ACT-173  # COACTUPC Phone Number 2: area code supplied (EDIT-AREA-CODE in 1260-EDIT-US-PHONE-NUM)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state lookups the other edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the '*' and red attribute of the refused field
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the date edits the account dates and birth date pass
- INV-LAY-014  # CSUTLDWY: the date-edit working storage
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix COACTUPC drops TRIM from this message and STRINGs the 25-byte
# WS-EDIT-VARIABLE-NAME twice before ': Area code must be supplied.'
# (COACTUPC.cl2:2255-2263), so on UniKix the message differs; the app/ text is
# pinned and a UniKix run never verifies the item.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
