# COACTUPC refuses a Date of Birth that is not earlier than the run date: the
# reasonableness check EDIT-DATE-OF-BIRTH of CSUTLDPY, which 1200-EDIT-MAP-INPUTS
# performs only after the date has passed EDIT-DATE-CCYYMMDD, including its
# CSUTLDTC call [app/cbl/COACTUPC.cbl:1533-1543] [app/cpy/CSUTLDPY.cpy:341-370].
#
# The date entered is fixed rather than a run-date input (the
# {run-date: {part, offset_days}} step value of harness/scenarios.py, which
# ACT-COACTUPC-boundary-24 uses for the run date itself): 2099-12-31, the last
# valid date of century 20. It lies after every run date before 2099-12-31,
# and EDIT-DATE-OF-BIRTH refuses the run date itself and every later date
# alike, so the outcome is the same as for the run date plus one day and does
# not depend on the absolute date.
#
# Steps 1-3 reach the fetched account as ACT-COACTUPC-negative-083 and -085 do:
# USER0001 signs on through CC00, chooses option 2 (Account Update) on COMEN01,
# and enters account 00000000001. 9000-READ-ACCT reads CXACAIX by account id
# (card 9680294154603697, customer 000000001), ACCTDAT and CUSTDAT, and the
# screen shows them with 'Update account details presented above.', every
# editable field unprotected with its MDT on [app/cbl/COACTUPC.cbl:2568-2580,
# 2787-2865,2955-3000,3441-3561,3608-3884].
# Step 4 types 2099, 12 and 31 over the date-of-birth year, month and day
# (1961-06-08) and presses ENTER.
# - 1100-RECEIVE-MAP moves them to ACUP-NEW-CUST-DOB-YYYY-MM-DD
#   [app/cbl/COACTUPC.cbl:1256-1275]; 1205-COMPARE-OLD-NEW finds the change at
#   the date-of-birth comparison, so 1200-EDIT-MAP-INPUTS sets
#   ACUP-CHANGES-NOT-OK and runs every field edit [app/cbl/COACTUPC.cbl:
#   1460-1470,1681-1777].
# - Account Status, the three account dates, the amounts and the SSN pass on
#   the repository account and the invented customer, as ACT-COACTUPC-negative-083
#   pins, so the message line is still off. 'Date of Birth' is moved to
#   WS-EDIT-VARIABLE-NAME and '20991231' to WS-EDIT-DATE-CCYYMMDD
#   [app/cbl/COACTUPC.cbl:1533-1536].
# - EDIT-DATE-CCYYMMDD accepts it: EDIT-YEAR-CCYY finds 2099 numeric with
#   century 20 (THIS-CENTURY), EDIT-MONTH 12, EDIT-DAY 31; in
#   EDIT-DAY-MONTH-YEAR December is a 31-day month and the date is not
#   February, so all three flags are valid and EDIT-DATE-LE calls CSUTLDTC with
#   mask YYYYMMDD [app/cpy/CSUTLDPY.cpy:18-296] [app/cpy/CSUTLDWY.cpy:9-23].
#   Severity 0 is expected, since 2099-12-31 is a real calendar date within the
#   Lilian range, so no error is set and WS-EDIT-DATE-IS-VALID holds
#   [app/cpy/CSUTLDPY.cpy:298-331]. What CEEDAYS returns is unobserved
#   (GAP-INF-001, GAP-MIS-010): CSUTLDTC hands CEEDAYS its full 10-byte LS-DATE
#   and LS-DATE-FORMAT, so CEEDAYS also reads the 2 bytes after COACTUPC's
#   8-byte date and mask, as in ACT-COACTUPC-negative-083
#   [app/cbl/CSUTLDTC.cbl:84-117].
# - WS-EDIT-DT-OF-BIRTH-ISVALID holds, so EDIT-DATE-OF-BIRTH runs. The current
#   date's INTEGER-OF-DATE is not greater than that of 20991231, so it sets
#   INPUT-ERROR and the year, month and day flags NOT-OK ('0', not blank) and,
#   the message line being off, STRINGs TRIM('Date of Birth') and
#   ':cannot be in the future ' into WS-RETURN-MSG; the flags are moved to
#   WS-EDIT-DT-OF-BIRTH-FLGS [app/cbl/COACTUPC.cbl:216-230,1539-1543]
#   [app/cpy/CSUTLDPY.cpy:341-370].
# - Every later edit passes on the invented customer below, and none could
#   overwrite the message. INPUT-ERROR keeps ACUP-CHANGES-NOT-OK, so
#   2000-DECIDE-ACTION does not reach 9600-WRITE-PROCESSING (PF5 only) and
#   nothing is written [app/cbl/COACTUPC.cbl:1545-1676,2562-2621].
# - 3203-SHOW-UPDATED-VALUES shows the received values, the date of birth as
#   typed and the amounts re-edited through +ZZZ,ZZZ,ZZZ.99; 3250 sets
#   PROMPT-FOR-CHANGES; 3300 unprotects the editable fields again, puts the
#   cursor on DOBYEAR and, through CSSETATY on this reentry, colours DOBYEAR,
#   DOBMON and DOBDAY red without the '*' of a blank field; 3390 makes
#   F12=Cancel bright because ACUP-CHANGES-MADE, and leaves F5=Save dark
#   [app/cbl/COACTUPC.cbl:2649-2660,2870-2951,2955-3003,3092-3100,3315-3331,
#   3566-3584] [app/cpy/CSSETATY.cpy:17-27].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   ERRMSG is 'Date of Birth:cannot be in the future ' (38 characters, the
#   trailing space of the literal included) in the 75-byte WS-RETURN-MSG,
#   moved to the 78-byte ERRMSGO: 40 trailing spaces. INFOMSG is the 40-byte
#   WS-INFO-MSG in the 45-byte INFOMSGO [app/cbl/COACTUPC.cbl:462-479,
#   2979-2981].
# - The date-of-birth fields are 4, 2 and 2 bytes, so the typed values fill
#   them; field colours are not captured.
# - AADDGRP is sent as LOW-VALUES (the blank group id comes back as spaces,
#   which 1100 turns into LOW-VALUES); s3270 shows nulls as spaces. A dark
#   (DRK) field is captured as blanks; no upper-case translation of input is
#   assumed (CARDDEMO.CSD gives CAUP the profile DFHCICST).
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# On UniKix the copy's CSUTLDPY drops TRIM from the field name (GAP-DOC-024),
# so there the message reads the 25-byte padded 'Date of Birth' before
# ':cannot be in the future ', and a UniKix run never verifies the item; the
# app/ behaviour is pinned.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit (the repository record has FICO 274, below 300, and zip 12546, which is
# not a North Carolina zip), so the date of birth is the only refused field
# [app/cbl/COACTUPC.cbl:2514-2558]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-084
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001, whose customer's date of birth is 1961-06-08, changes it
  to 2099-12-31 and presses ENTER. The date passes the COBOL date edits and,
  as expected, CSUTLDTC with mask YYYYMMDD, but it is not earlier than the run
  date, so COACTUPC refuses it: the message line shows 'Date of Birth:cannot
  be in the future ', the received values are shown again, still editable,
  with the change prompt and F12=Cancel, and neither ACCTDATA nor CUSTDATA is
  rewritten. The fixed far-future date 2099-12-31 stands for a date after the
  run date; the refusal holds for every date from the run date on, so the
  outcome does not depend on the absolute date.
# Primary item first, then the CSUTLDTC date acceptance the date passes before
# the check, the program, the maps asserted, the transaction of steps 3 and 4,
# the CSD files COACTUPC reads, and the online-only copybooks it copies. The
# change prompt 'Update account details presented above.' (INV-ACT-030) is
# asserted but verified by its own scenario. Sign-on (CC00, COSGN00, USRSEC)
# and the menu transaction are verified by the SEC and MNU scenarios; the batch
# record copybooks and the data files are verified at the lowest level that
# executes them.
inventory_ids:
- INV-ACT-142  # COACTUPC Date of Birth: earlier than the run date (EDIT-DATE-OF-BIRTH)
- INV-UTL-003  # CSUTLDTC date acceptance for masks YYYY-MM-DD and YYYYMMDD, reached through EDIT-DATE-LE
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refusal screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the red attribute of the refused date-of-birth fields
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the date edits, the EDIT-DATE-LE call and EDIT-DATE-OF-BIRTH
- INV-LAY-014  # CSUTLDWY: WS-EDIT-DATE-CCYYMMDD, the current date and the CSUTLDTC result
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# Which dates CEEDAYS accepts is known only through the stub, and whether
# UniKix supplies CEEDAYS at all is unknown; the refusal is reached only once
# CSUTLDTC accepts the date.
- GAP-INF-001
- GAP-MIS-010
# The UniKix copy changes code this scenario passes through: CSUTLDTC's
# Vstring lengths (021), COACTUPC's amount edits and change detection (022),
# CSUTLDPY's date edits and the untrimmed field name in this message (024)
# and COACTUP's row 1, where TRNNAME stands (025). A unikix run therefore
# observes the copy's behaviour of those parts.
- GAP-DOC-021
- GAP-DOC-022
- GAP-DOC-024
- GAP-DOC-025
