    The posted-transaction KSDS, KEYS(16 0) and RECORDSIZE(350 350), with the non-unique
    alternate index on TRAN-PROC-TS, KEYS(26 304) [app/jcl/TRANFILE.jcl:49-54,82-101]
    [app/jcl/TRANIDX.jcl:25-44] [app/catlg/LISTCAT.txt:3593-3594,3674-3676]. CBTRN02C opens
    it OUTPUT, which on GnuCOBOL recreates the file and drops what was loaded
    [app/cbl/CBTRN02C.cbl:34-38,256] (GAP-STB-010). The path's region file TRANSAIX exists
    only in the UniKix fct.lst
    [samples/m2/unikix/UniKix_CardDemo_runtime_v1.zip:migrated_app/catlg/tpe/fct.lst:11]
    (GAP-DOC-030).
  source: built
  encoding: ascii
  record_length: 350
  organization: ksds
  key: {offset: 0, length: 16}
  alternate_keys:
  - {name: TRAN-PROC-TS, offset: 304, length: 26, duplicates: true, path: TRANSAIX}
  layout: CVTRA05Y/TRAN-RECORD
  cross_check: none
  registered_mismatches: []
  data_items: []
  region_files: [TRANSACT]
  gap_ids: [GAP-STB-010]

