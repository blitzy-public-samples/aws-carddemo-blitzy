# Derived baseline of scenario MNU-COADM01C-negative-02: ADMIN001 signs on
# through CC00, then enters the admin menu options 0, 5 and X, and each is
# refused with 'Please enter a valid option number...' on COADM01 under CA00.
# Authored from the source, never captured: app/cbl/COSGN00C.cbl:221-234 (the
# type-A XCTL), app/cbl/COADM01C.cbl:77-263, app/cpy/COADM02Y.cpy,
# app/cpy/COTTL01Y.cpy and app/bms/COADM01.bms. Open until a UniKix run is
# imported: GAP-INF-003 and GAP-INF-012, cited by the scenario.
# The values equal the scenario's own expected, at full BMS field width with
# trailing spaces. OPTION is asserted where the source fixes it: blank on the
# first send (COADM1AO is LOW-VALUES), then '00' and '05', the WS-OPTION echo
# of the zero-filled, right-justified input. It is left out after X, because
# the MOVE of '0X' into PIC 9(02) is compiler-defined.
