# GitHub Actions Workflow for CardDemo Kubernetes Deployment
# This workflow orchestrates the deployment of the complete CardDemo application stack
# to Kubernetes clusters with comprehensive health checks and rollback capabilities
# 
# Deployment Architecture:
# 1. Pre-deployment validation (cluster health, manifest validation)
# 2. Infrastructure layer (PostgreSQL, Redis, ConfigMaps, Secrets)
# 3. Backend application (Spring Boot services)
# 4. Frontend application (React SPA with Nginx)
# 5. Ingress configuration (routing and load balancing)
# 6. Post-deployment health checks (end-to-end validation)
# 7. Optional rollback capability
# 8. Notification system (Slack, GitHub deployments)

name: Deploy to Kubernetes

# Workflow can be triggered manually with options or called by other workflows
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: 'staging'
      skip_tests:
        description: 'Skip post-deployment health checks'
        required: false
        type: boolean
        default: false
      rollback:
        description: 'Perform rollback instead of deployment'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        type: string
      skip_tests:
        description: 'Skip post-deployment health checks'
        required: false
        type: boolean
        default: false

# Environment variables used across all jobs
env:
  K8S_NAMESPACE: default
  DEPLOYMENT_TIMEOUT: 10m
  HEALTH_CHECK_RETRIES: 10
  HEALTH_CHECK_DELAY: 30

jobs:
  # ============================================================================
  # JOB 1: Pre-Deployment Validation
  # ============================================================================
  pre-deployment-validation:
    name: Pre-Deployment Validation
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure Kubernetes Context
        run: |
          mkdir -p $HOME/.kube
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            echo "Configuring production Kubernetes cluster"
            echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
          else
            echo "Configuring staging Kubernetes cluster"
            echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          fi
          chmod 600 $HOME/.kube/config

      - name: Validate Kubernetes Manifests
        run: |
          echo "Validating Kubernetes manifest syntax and schema..."
          kubectl apply --dry-run=client -f kubernetes/ -R
          echo "✓ All Kubernetes manifests are valid"

      - name: Check Cluster Health
        run: |
          echo "Checking Kubernetes cluster health..."
          kubectl get nodes
          kubectl cluster-info
          kubectl get namespaces
          echo "✓ Cluster is healthy and accessible"

      - name: Check Existing Deployments
        run: |
          echo "Checking existing deployments in namespace: ${{ env.K8S_NAMESPACE }}"
          kubectl get deployments -n ${{ env.K8S_NAMESPACE }} || echo "No existing deployments"
          kubectl get services -n ${{ env.K8S_NAMESPACE }} || echo "No existing services"
          kubectl get ingress -n ${{ env.K8S_NAMESPACE }} || echo "No existing ingress"

      - name: Verify Resource Quotas
        run: |
          echo "Checking resource quotas..."
          kubectl describe resourcequota -n ${{ env.K8S_NAMESPACE }} || echo "No resource quotas defined"

      - name: Check PersistentVolumeClaims
        run: |
          echo "Checking persistent volume claims..."
          kubectl get pvc -n ${{ env.K8S_NAMESPACE }} || echo "No PVCs found"

  # ============================================================================
  # JOB 2: Deploy Infrastructure (Database, Redis, Secrets)
  # ============================================================================
  deploy-infrastructure:
    name: Deploy Infrastructure Components
    needs: [pre-deployment-validation]
    runs-on: ubuntu-latest
    if: ${{ !github.event.inputs.rollback }}
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure Kubernetes Context
        run: |
          mkdir -p $HOME/.kube
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
          else
            echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          fi
          chmod 600 $HOME/.kube/config

      - name: Apply ConfigMap
        run: |
          echo "Applying ConfigMap for application configuration..."
          kubectl apply -f kubernetes/configmap.yaml -n ${{ env.K8S_NAMESPACE }}
          echo "✓ ConfigMap applied successfully"

      - name: Apply Secrets
        run: |
          echo "Checking if secrets already exist..."
          if kubectl get secret carddemo-secrets -n ${{ env.K8S_NAMESPACE }} 2>/dev/null; then
            echo "Secrets already exist, skipping creation"
          else
            echo "Creating secrets..."
            kubectl apply -f kubernetes/secrets.yaml -n ${{ env.K8S_NAMESPACE }}
            echo "✓ Secrets created successfully"
          fi
          echo "Note: For production, use external secret management (HashiCorp Vault, AWS Secrets Manager)"

      - name: Apply PostgreSQL PVC
        run: |
          echo "Creating persistent volume claim for PostgreSQL..."
          kubectl apply -f kubernetes/postgres-pvc.yaml -n ${{ env.K8S_NAMESPACE }}
          echo "✓ PostgreSQL PVC created"

      - name: Deploy PostgreSQL
        run: |
          echo "Deploying PostgreSQL database..."
          kubectl apply -f kubernetes/postgres-deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f kubernetes/postgres-service.yaml -n ${{ env.K8S_NAMESPACE }}
          echo "✓ PostgreSQL deployment and service created"

      - name: Wait for PostgreSQL Ready
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          kubectl wait --for=condition=ready pod -l service=postgres -n ${{ env.K8S_NAMESPACE }} --timeout=${{ env.DEPLOYMENT_TIMEOUT }}
          echo "✓ PostgreSQL is ready"

      - name: Verify PostgreSQL Health
        run: |
          echo "Verifying PostgreSQL health..."
          kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/postgres-deployment -- pg_isready -U carddemo
          echo "✓ PostgreSQL is healthy and accepting connections"

      - name: Deploy Redis
        run: |
          echo "Deploying Redis for session management..."
          kubectl apply -f kubernetes/redis-deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f kubernetes/redis-service.yaml -n ${{ env.K8S_NAMESPACE }}
          echo "✓ Redis deployment and service created"

      - name: Wait for Redis Ready
        run: |
          echo "Waiting for Redis to be ready..."
          kubectl wait --for=condition=ready pod -l service=redis -n ${{ env.K8S_NAMESPACE }} --timeout=${{ env.DEPLOYMENT_TIMEOUT }}
          echo "✓ Redis is ready"

      - name: Verify Redis Health
        run: |
          echo "Verifying Redis health..."
          kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/redis-deployment -- redis-cli ping
          echo "✓ Redis is healthy and responding to PING"

  # ============================================================================
  # JOB 3: Deploy Backend Application
  # ============================================================================
  deploy-backend:
    name: Deploy Backend Application
    needs: [deploy-infrastructure]
    runs-on: ubuntu-latest
    if: ${{ !github.event.inputs.rollback }}
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure Kubernetes Context
        run: |
          mkdir -p $HOME/.kube
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
          else
            echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          fi
          chmod 600 $HOME/.kube/config

      - name: Apply Backend Deployment
        run: |
          echo "Deploying backend Spring Boot application..."
          kubectl apply -f kubernetes/backend-deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          echo "✓ Backend deployment manifest applied"

      - name: Apply Backend Service
        run: |
          echo "Creating backend service..."
          kubectl apply -f kubernetes/backend-service.yaml -n ${{ env.K8S_NAMESPACE }}
          echo "✓ Backend service created"

      - name: Wait for Backend Rollout
        run: |
          echo "Waiting for backend deployment rollout to complete..."
          kubectl rollout status deployment/backend-deployment -n ${{ env.K8S_NAMESPACE }} --timeout=${{ env.DEPLOYMENT_TIMEOUT }}
          echo "✓ Backend deployment rolled out successfully"

      - name: Check Backend Pods
        run: |
          echo "Checking backend pod status..."
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l component=backend
          echo "✓ Backend pods are running"

      - name: Verify Backend Health
        run: |
          echo "Verifying backend application health..."
          kubectl wait --for=condition=ready pod -l component=backend -n ${{ env.K8S_NAMESPACE }} --timeout=5m
          echo "Checking Spring Boot Actuator health endpoint..."
          kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/backend-deployment -- wget -q -O- http://localhost:8080/actuator/health
          echo ""
          echo "✓ Backend application is healthy"

      - name: Check Backend Logs
        run: |
          echo "Displaying recent backend logs..."
          kubectl logs -n ${{ env.K8S_NAMESPACE }} deployment/backend-deployment --tail=50

      - name: Run Database Migration Check
        run: |
          echo "Verifying Flyway database migrations..."
          kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/backend-deployment -- sh -c "ls -la /app/logs/ || true"
          echo "✓ Database migration check complete"

  # ============================================================================
  # JOB 4: Deploy Frontend Application
  # ============================================================================
  deploy-frontend:
    name: Deploy Frontend Application
    needs: [deploy-backend]
    runs-on: ubuntu-latest
    if: ${{ !github.event.inputs.rollback }}
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure Kubernetes Context
        run: |
          mkdir -p $HOME/.kube
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
          else
            echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          fi
          chmod 600 $HOME/.kube/config

      - name: Apply Frontend Deployment
        run: |
          echo "Deploying frontend React application..."
          kubectl apply -f kubernetes/frontend-deployment.yaml -n ${{ env.K8S_NAMESPACE }}
          echo "✓ Frontend deployment manifest applied"

      - name: Apply Frontend Service
        run: |
          echo "Creating frontend service..."
          kubectl apply -f kubernetes/frontend-service.yaml -n ${{ env.K8S_NAMESPACE }}
          echo "✓ Frontend service created"

      - name: Wait for Frontend Rollout
        run: |
          echo "Waiting for frontend deployment rollout to complete..."
          kubectl rollout status deployment/frontend-deployment -n ${{ env.K8S_NAMESPACE }} --timeout=${{ env.DEPLOYMENT_TIMEOUT }}
          echo "✓ Frontend deployment rolled out successfully"

      - name: Check Frontend Pods
        run: |
          echo "Checking frontend pod status..."
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l component=frontend
          echo "✓ Frontend pods are running"

      - name: Verify Frontend Health
        run: |
          echo "Verifying frontend application health..."
          kubectl wait --for=condition=ready pod -l component=frontend -n ${{ env.K8S_NAMESPACE }} --timeout=5m
          echo "✓ Frontend application is ready"

  # ============================================================================
  # JOB 5: Configure Ingress and Networking
  # ============================================================================
  configure-ingress:
    name: Configure Ingress and Networking
    needs: [deploy-frontend]
    runs-on: ubuntu-latest
    if: ${{ !github.event.inputs.rollback }}
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure Kubernetes Context
        run: |
          mkdir -p $HOME/.kube
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
          else
            echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          fi
          chmod 600 $HOME/.kube/config

      - name: Apply Ingress
        run: |
          echo "Configuring ingress routing and load balancing..."
          kubectl apply -f kubernetes/ingress.yaml -n ${{ env.K8S_NAMESPACE }}
          echo "✓ Ingress configuration applied"

      - name: Wait for Ingress Ready
        run: |
          echo "Waiting for ingress controller to process configuration..."
          sleep 30
          kubectl get ingress carddemo-ingress -n ${{ env.K8S_NAMESPACE }}
          echo "✓ Ingress is configured"

      - name: Get Ingress Address
        run: |
          echo "Retrieving ingress external address..."
          INGRESS_IP=$(kubectl get ingress carddemo-ingress -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          if [ -z "$INGRESS_IP" ]; then
            INGRESS_HOST=$(kubectl get ingress carddemo-ingress -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            echo "Ingress Hostname: $INGRESS_HOST"
            echo "INGRESS_ADDRESS=$INGRESS_HOST" >> $GITHUB_ENV
          else
            echo "Ingress IP: $INGRESS_IP"
            echo "INGRESS_ADDRESS=$INGRESS_IP" >> $GITHUB_ENV
          fi
          echo "✓ Ingress address retrieved"

  # ============================================================================
  # JOB 6: Post-Deployment Health Checks
  # ============================================================================
  post-deployment-health-checks:
    name: Post-Deployment Health Checks
    needs: [deploy-infrastructure, deploy-backend, deploy-frontend, configure-ingress]
    runs-on: ubuntu-latest
    if: ${{ !github.event.inputs.rollback && !github.event.inputs.skip_tests }}
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure Kubernetes Context
        run: |
          mkdir -p $HOME/.kube
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
          else
            echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          fi
          chmod 600 $HOME/.kube/config

      - name: Wait for Stabilization
        run: |
          echo "Waiting for all services to fully initialize..."
          sleep 60
          echo "✓ Stabilization period complete"

      - name: Check All Deployments
        run: |
          echo "Checking status of all deployed components..."
          kubectl get deployments -n ${{ env.K8S_NAMESPACE }}
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          kubectl get services -n ${{ env.K8S_NAMESPACE }}
          echo "✓ All components are deployed"

      - name: Backend API Health Check
        run: |
          echo "Testing backend API health endpoint..."
          HEALTH_OUTPUT=$(kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/backend-deployment -- wget -q -O- http://localhost:8080/actuator/health)
          echo "$HEALTH_OUTPUT"
          if echo "$HEALTH_OUTPUT" | grep -q '"status":"UP"'; then
            echo "✓ Backend API is healthy"
          else
            echo "✗ Backend API health check failed"
            exit 1
          fi

      - name: Frontend Health Check
        run: |
          echo "Testing frontend application..."
          if kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/frontend-deployment -- wget -q -O- http://localhost:80/ | grep -q '<title>'; then
            echo "✓ Frontend application is serving content"
          else
            echo "✗ Frontend health check failed"
            exit 1
          fi

      - name: Database Connectivity Test
        run: |
          echo "Testing database connectivity..."
          kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/postgres-deployment -- psql -U carddemo -d carddemo -c 'SELECT version();'
          echo "✓ Database is accessible and responding"

      - name: Redis Connectivity Test
        run: |
          echo "Testing Redis connectivity..."
          REDIS_RESPONSE=$(kubectl exec -n ${{ env.K8S_NAMESPACE }} deployment/redis-deployment -- redis-cli ping)
          if [ "$REDIS_RESPONSE" == "PONG" ]; then
            echo "✓ Redis is accessible and responding"
          else
            echo "✗ Redis connectivity test failed"
            exit 1
          fi

      - name: End-to-End API Test
        run: |
          echo "Running end-to-end API test..."
          INGRESS_HOST=$(kubectl get ingress carddemo-ingress -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.spec.rules[0].host}')
          echo "Testing API endpoint at: $INGRESS_HOST"
          
          # Test login endpoint (expecting 401 or proper response structure)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://$INGRESS_HOST/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"userId":"testuser","password":"testpass"}' || echo "000")
          
          if [ "$HTTP_CODE" == "000" ]; then
            echo "Warning: API test could not connect (expected for demo without real ingress)"
          elif [ "$HTTP_CODE" == "401" ] || [ "$HTTP_CODE" == "200" ] || [ "$HTTP_CODE" == "400" ]; then
            echo "✓ API endpoint is responding (HTTP $HTTP_CODE)"
          else
            echo "Warning: Unexpected HTTP response code: $HTTP_CODE"
          fi

      - name: Check Pod Resource Usage
        run: |
          echo "Checking pod resource usage..."
          kubectl top pods -n ${{ env.K8S_NAMESPACE }} || echo "Metrics server not available (install metrics-server for resource monitoring)"

      - name: Generate Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Namespace:** ${{ env.K8S_NAMESPACE }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered By:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Components:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get deployments -n ${{ env.K8S_NAMESPACE }} -o wide >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Service Endpoints:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get services -n ${{ env.K8S_NAMESPACE }} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ All health checks passed successfully"

  # ============================================================================
  # JOB 7: Rollback (Conditional)
  # ============================================================================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.rollback }}
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure Kubernetes Context
        run: |
          mkdir -p $HOME/.kube
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            echo "Configuring production Kubernetes cluster for rollback"
            echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
          else
            echo "Configuring staging Kubernetes cluster for rollback"
            echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          fi
          chmod 600 $HOME/.kube/config

      - name: Rollback Backend
        run: |
          echo "Rolling back backend deployment to previous revision..."
          kubectl rollout undo deployment/backend-deployment -n ${{ env.K8S_NAMESPACE }}
          echo "Waiting for backend rollback to complete..."
          kubectl rollout status deployment/backend-deployment -n ${{ env.K8S_NAMESPACE }}
          echo "✓ Backend rollback completed"

      - name: Rollback Frontend
        run: |
          echo "Rolling back frontend deployment to previous revision..."
          kubectl rollout undo deployment/frontend-deployment -n ${{ env.K8S_NAMESPACE }}
          echo "Waiting for frontend rollback to complete..."
          kubectl rollout status deployment/frontend-deployment -n ${{ env.K8S_NAMESPACE }}
          echo "✓ Frontend rollback completed"

      - name: Check Rollback Status
        run: |
          echo "Checking deployment status after rollback..."
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          kubectl get deployments -n ${{ env.K8S_NAMESPACE }}
          echo "✓ Rollback status check complete"

      - name: Verify Health After Rollback
        run: |
          echo "Verifying application health after rollback..."
          kubectl wait --for=condition=ready pod -l app=carddemo -n ${{ env.K8S_NAMESPACE }} --timeout=5m
          echo "✓ Applications are healthy after rollback"

      - name: Generate Rollback Summary
        run: |
          echo "## Rollback Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Namespace:** ${{ env.K8S_NAMESPACE }}" >> $GITHUB_STEP_SUMMARY
          echo "**Rollback Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered By:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Current Deployment Status:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get deployments -n ${{ env.K8S_NAMESPACE }} -o wide >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ Rollback completed successfully"

  # ============================================================================
  # JOB 8: Notify (Success/Failure)
  # ============================================================================
  notify:
    name: Send Deployment Notifications
    needs: [post-deployment-health-checks]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Determine Deployment Status
        id: status
        run: |
          if [ "${{ needs.post-deployment-health-checks.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "status_emoji=✅" >> $GITHUB_OUTPUT
            echo "status_text=succeeded" >> $GITHUB_OUTPUT
          elif [ "${{ needs.post-deployment-health-checks.result }}" == "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "status_emoji=❌" >> $GITHUB_OUTPUT
            echo "status_text=failed" >> $GITHUB_OUTPUT
          else
            echo "status=cancelled" >> $GITHUB_OUTPUT
            echo "status_emoji=⚠️" >> $GITHUB_OUTPUT
            echo "status_text=was cancelled" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            {
              "text": "${{ steps.status.outputs.status_emoji }} CardDemo Deployment to ${{ github.event.inputs.environment }} ${{ steps.status.outputs.status_text }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.status.outputs.status_emoji }} CardDemo Deployment Notification"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Environment:* ${{ github.event.inputs.environment }}\n*Status:* ${{ steps.status.outputs.status_text }}\n*Triggered by:* ${{ github.actor }}\n*Workflow:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Branch:* ${{ github.ref_name }}\n*Repository:* ${{ github.repository }}"
                  }
                }
              ]
            }

      - name: Create GitHub Deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ github.token }}
          environment: ${{ github.event.inputs.environment || 'staging' }}
          state: ${{ steps.status.outputs.status }}
          ref: ${{ github.sha }}
          deployment-id: ${{ github.run_id }}

      - name: Comment on PR (if applicable)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.status.outputs.status }}';
            const environment = '${{ github.event.inputs.environment }}';
            const emoji = '${{ steps.status.outputs.status_emoji }}';
            
            const comment = `${emoji} **Deployment to ${environment} ${status}**
            
            - **Environment:** ${environment}
            - **Status:** ${status}
            - **Triggered by:** @${{ github.actor }}
            - **Workflow Run:** [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Generate Final Summary
        run: |
          echo "## Deployment Workflow Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.status.outputs.status_emoji }} **Status:** ${{ steps.status.outputs.status_text }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Namespace:** ${{ env.K8S_NAMESPACE }}" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.status.outputs.status }}" == "success" ]; then
            echo "### ✅ Deployment completed successfully!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The CardDemo application has been deployed to the ${{ github.event.inputs.environment }} environment." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Deployment encountered issues" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please review the workflow logs and consider rolling back if necessary." >> $GITHUB_STEP_SUMMARY
          fi

