# COACTUPC refuses an account update whose Middle Name holds a character that
# is neither a letter nor a space: 1235-EDIT-ALPHA-OPT finds the optional field
# supplied, converts every letter to a space, finds a character left over, and
# composes 'Middle Name can have alphabets only.'
# [app/cbl/COACTUPC.cbl:1568-1574,2012-2057].
#
# Steps 1-3 reach the fetched account as ACT-COACTUPC-alternate-04 does:
# USER0001 signs on through CC00, chooses option 2 (Account Update) on COMEN01,
# and enters account 00000000001. 9000-READ-ACCT reads CXACAIX by account id
# (card 9680294154603697, customer 000000001, line 49 of
# app/data/ASCII/cardxref.txt), ACCTDAT and CUSTDAT, keeps the records as the
# old values in the COMMAREA and sets ACUP-SHOW-DETAILS; the screen shows them
# with 'Update account details presented above.', every editable field
# unprotected with its MDT on [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,
# 2955-3000,3441-3561,3608-3884].
# Step 4 types M1ddle over the middle name (ACSMNAM, shown as Testmiddle) and
# presses ENTER.
# - 1100-RECEIVE-MAP moves the received 'M1ddle' and its 19 blanks, being
#   neither '*' nor spaces, to ACUP-NEW-CUST-MIDDLE-NAME
#   [app/cbl/COACTUPC.cbl:1295-1302]. 1205-COMPARE-OLD-NEW finds the account
#   part unchanged and the upper-cased, trimmed 'M1DDLE' unequal to the old
#   'TESTMIDDLE', so a change has occurred, and 1200-EDIT-MAP-INPUTS sets
#   ACUP-CHANGES-NOT-OK and runs the field edits in screen order
#   [app/cbl/COACTUPC.cbl:1460-1470,1681-1773].
# - Account Status, Open Date, the five amounts, Expiry and Reissue Date pass
#   on the repository account; SSN, Date of Birth, FICO Score and First Name
#   pass on the invented customer below [app/cbl/COACTUPC.cbl:1472-1566].
#   'Middle Name' is moved to WS-EDIT-VARIABLE-NAME, the received name to
#   WS-EDIT-ALPHANUM-ONLY and 25 to WS-EDIT-ALPHANUM-LENGTH
#   [app/cbl/COACTUPC.cbl:1568-1572].
#   1235-EDIT-ALPHA-OPT finds the field neither LOW-VALUES nor SPACES nor of
#   zero trimmed length, so it does not take the optional-blank exit. It
#   converts the 52 upper- and lower-case letters of LIT-ALL-ALPHA-FROM-X to
#   spaces, which leaves ' 1' and 23 blanks; the trimmed length is 1, not 0,
#   so it sets INPUT-ERROR and FLG-ALPHA-NOT-OK and, WS-RETURN-MSG being still
#   blank [app/cbl/COACTUPC.cbl:876], STRINGs the trimmed field name and
#   ' can have alphabets only.' into WS-RETURN-MSG
#   [app/cbl/COACTUPC.cbl:586-591,607-610,2012-2053].
#   WS-EDIT-MIDDLE-NAME-FLGS becomes FLG-MIDDLE-NAME-NOT-OK.
# - Every later edit passes on the invented customer; they only set their
#   flags, since WS-RETURN-MSG is no longer blank
#   [app/cbl/COACTUPC.cbl:1576-1676]. INPUT-ERROR keeps ACUP-CHANGES-NOT-OK,
#   and 2000-DECIDE-ACTION continues on it, so 9600-WRITE-PROCESSING, the only
#   READ UPDATE and REWRITE path, does not run [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values, the amounts, all
#   valid, re-edited through +ZZZ,ZZZ,ZZZ.99, and the middle name as received;
#   3250 sets PROMPT-FOR-CHANGES and moves the message to ERRMSG; 3300 keeps
#   the fields editable, puts the cursor on ACSMNAM and marks it red through
#   CSSETATY; 3390 makes F12=Cancel bright because changes were made, while
#   F5=Save stays dark [app/cbl/COACTUPC.cbl:2870-2951,2955-2983,3109-3111,
#   3345-3349,3566-3581] [app/cpy/CSSETATY.cpy:18-27].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - The message is TRIM('Middle Name') followed by ' can have alphabets
#   only.', 36 characters of the 75-byte WS-RETURN-MSG, shown in the 78-byte
#   ERRMSG with trailing spaces. INFOMSG is the 40-byte WS-INFO-MSG in the
#   45-byte field. Fields are compared at their full BMS length, trailing
#   spaces kept.
# - The tpe adapter enters a field with EraseEOF before typing, and ACSMNAM
#   has the default JUSTIFY=(LEFT,BLANK), so BMS returns 'M1ddle' padded with
#   19 blanks to its 25 bytes, and the screen shows it so.
# - FKEY05 and FKEY12 keep their INITIAL text; a dark (ASKIP,DRK) field is
#   captured as blanks. Colour and cursor position are not in the s3270 text
#   capture and are not asserted.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, so the middle name is the only field refused: the repository record
# has FICO 274, below 300, and zip 12546, which is not a North Carolina zip
# [app/cbl/COACTUPC.cbl:2514-2558]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-091
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001, whose customer 000000001 has the middle name
  Testmiddle, types M1ddle over the Middle Name and presses ENTER. The digit
  is neither a letter nor a space, so COACTUPC refuses the change: it shows
  the received values again, editable, with 'Middle Name can have alphabets
  only.' in the message line, the middle name as typed, the change prompt
  'Update account details presented above.' and F12=Cancel made visible.
  Nothing is saved: ACCTDATA and CUSTDATA still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-149  # COACTUPC Middle Name: alphabets only (1235-EDIT-ALPHA-OPT)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute set on ACSMNAM
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the date edits the earlier dates pass
- INV-LAY-014  # CSUTLDWY: the date-edit working storage
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix COACTUPC STRINGs the untrimmed 25-byte field name and tests the
# converted field = SPACES, so on UniKix the message reads 'Middle Name' padded
# to 25 bytes before ' can have alphabets only.'; the app/ behaviour is pinned.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
        CUST-ADDR-ZIP: '27601'
        CUST-PHONE-NUM-1: (919)555-0101
        CUST-PHONE-NUM-2: (919)555-0102
        CUST-SSN: '123456789'
        CUST-GOVT-ISSUED-ID: TESTGOVT0001
        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: Y
        CUST-FICO-CREDIT-SCORE: '700'
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
# PASSWORD is the documented demo password of README.md, not a secret.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACSMNAM: 'M1ddle'
