#   ports:
#     - name: http
#       protocol: TCP
#       port: 8080
#       targetPort: 8080

---
#
# Service Design Rationale:
#
# 1. ClusterIP Type:
#    - Internal-only access prevents direct external exposure
#    - Security best practice: expose only through Ingress
#    - Reduces attack surface area
#
# 2. Session Affinity (ClientIP):
#    - Ensures requests from same client route to same pod
#    - Critical for Redis session management consistency
#    - 3-hour timeout matches typical user session duration
#    - Prevents session loss during active user sessions
#
# 3. Port Configuration (80 -> 8080):
#    - Service port 80: Standard HTTP port for internal routing
#    - Target port 8080: Spring Boot default embedded Tomcat port
#    - Separation allows flexibility in container port changes
#
# 4. Selector Strategy:
#    - Simple selector (app: carddemo) matches deployment
#    - Enables automatic endpoint updates as pods scale
#    - Kubernetes automatically maintains endpoint list
#
# 5. DNS Resolution:
#    - Service creates DNS entry: carddemo-service.carddemo.svc.cluster.local
#    - Short form within namespace: carddemo-service
#    - Enables service discovery without hardcoded IPs
#
# 6. Load Balancing:
#    - Kubernetes provides round-robin load balancing by default
#    - With sessionAffinity: distributes new sessions, maintains existing
#    - Replaces CICS transaction routing and load distribution
#
# Performance Characteristics:
# - Sub-millisecond service routing latency
# - Automatic health checking via pod readiness probes
# - Zero-downtime updates with rolling deployment strategy
# - Horizontal scaling: automatic endpoint addition/removal
#
# High Availability:
# - Service maintains availability during pod restarts
# - Automatic failover to healthy pods
# - No single point of failure
# - Survives node failures with pod rescheduling
#
# Monitoring and Observability:
# - Prometheus annotations enable metrics collection
# - Service endpoints visible via kubectl get endpoints
# - Connection tracking through cluster networking layer
# - Integration with service mesh (if deployed)
#
# Security Considerations:
# - ClusterIP limits exposure to cluster internal
# - No external direct access (defense in depth)
# - Network policies can further restrict access
# - TLS termination handled at Ingress layer
#
# Migration Benefits vs. CICS:
# - CICS VTAM routing → Kubernetes service discovery
# - Manual load balancing → Automatic pod distribution
# - Static configuration → Dynamic endpoint management
# - Limited scalability → Elastic horizontal scaling
# - Complex failover → Automatic health-based routing
#
