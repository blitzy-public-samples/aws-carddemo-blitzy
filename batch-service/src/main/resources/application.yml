# =====================================================================
# batch-service - Spring Boot application configuration.
#
# Batch-orchestration microservice: the Spring Batch re-platforming of
# the legacy COBOL batch programs (interest calculation CBACT04C /
# INTCALC.jcl, plus the data-management programs CBACT01C-CBACT03C,
# CBCUS01C, CBTRN01C, CBTRN03C) and the on-demand job-submission pattern
# of the REPROC / TRANREPT procs. The service stays resident to serve
# Actuator HTTP; jobs are triggered on demand via JobOperator, never at
# startup. Every connection setting is environment-driven so the same
# artifact runs locally, under Docker Compose (SPRING_PROFILES_ACTIVE=
# docker) and on Kubernetes; the values below are developer-workstation
# defaults.
# =====================================================================
spring:
  application:
    name: batch-service

  # The Spring Boot ASCII banner is written straight to stdout by the banner printer,
  # not through the logging system, so its seven lines are the only records in the
  # stream that are not parseable JSON -- which breaks a collector that reads this
  # container's stdout line-by-line as JSON, contradicting the structured-logging
  # requirement of AAP 0.7.5. Turning the banner off is what makes EVERY line of
  # startup output a log record; the version and application name it carried are
  # already reported by /actuator/info and by the startup records themselves.
  main:
    # QUOTED deliberately: YAML 1.1 resolves a bare `off` to the boolean false, which
    # the relaxed binder then cannot convert to the Banner.Mode enum.
    banner-mode: "off"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carddemo}
    username: ${SPRING_DATASOURCE_USERNAME:carddemo}
    password: ${SPRING_DATASOURCE_PASSWORD:carddemo}
    driver-class-name: org.postgresql.Driver
    # Bounded connection acquisition. Without an explicit
    # connection-timeout HikariCP waits the 30s default for a connection, so the
    # aggregate /actuator/health blocks with no response at all while PostgreSQL is
    # unreachable and both the Compose healthcheck and the Kubernetes probes time out
    # instead of observing a DOWN. 3s is well inside the 5s Compose healthcheck timeout
    # and the Kubernetes probe timeoutSeconds, so an outage surfaces as HTTP 503
    # {"status":"DOWN"} rather than a hang.
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      # ------------------------------------------------------------------
      # Explicit connection budget.
      #
      # HikariCP defaults to maximumPoolSize 10 AND minimumIdle == maximumPoolSize,
      # so every one of the eight CardDemo JPA services held ten server connections
      # open while completely idle - 80 of PostgreSQL's default max_connections of
      # 100. Starting any two further containers then failed with
      # "FATAL: sorry, too many clients already".
      #
      # This service is sized for its chunk-oriented Spring Batch jobs rather than
      # for online traffic: a running job holds one connection for the current chunk
      # transaction plus one for the Spring Batch job-repository update, and the nine
      # jobs of JobSchedulingConfig are submitted through an asynchronous
      # SimpleAsyncTaskExecutor-backed JobOperator, so several may run at once. A
      # ceiling of twelve covers six genuinely concurrent jobs outright; the
      # pathological case of all nine at once queues briefly on connection-timeout
      # instead of failing. minimum-idle is 1 because the service is idle between
      # runs, so it contributes a single connection to the steady-state budget.
      #
      # Whole-deployment budget: ceiling 7 x 16 (online) + 12 = 124, steady state 15,
      # against the 200 max_connections configured for the PostgreSQL container
      # (docker-compose.yml / k8s/deployment-postgres.yaml). The online ceiling was
      # raised from 8 to 16 after a 150-user run recorded pool-acquisition timeouts;
      # this service keeps 12 because its demand is bounded by its job concurrency,
      # not by online traffic. Both values are environment-overridable so a larger
      # replica count can be re-budgeted without rebuilding the image.
      # ------------------------------------------------------------------
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:12}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
      # Return connections acquired for a job run to the server within five minutes
      # instead of holding them for HikariCP's ten-minute default.
      idle-timeout: 300000

  jpa:
    open-in-view: false
    hibernate:
      # The shared carddemo-common migration set owns DDL; Hibernate only
      # validates the entity mapping. 'validate' (not 'none') is deliberate:
      # every batch job in this service reads the shared business tables, so a
      # missing or drifted table MUST fail startup instead of letting the
      # service advertise readiness over a schema its jobs cannot use
      ddl-auto: validate

  # batch-service is the SINGLE Flyway migration owner. It applies the SHARED CardDemo
  # migration set that ships in carddemo-common (classpath:db/migration) against the ONE
  # shared history table (flyway_schema_history); every service resolves that identical
  # script set, so one owner provisions the complete business schema, the reference data
  # and the Spring Batch metadata for the whole estate. Its healthcheck reports UP only
  # after the migrations have been applied, which is precisely the signal every other
  # backend's startup gate waits on (docker-compose.yml `depends_on: batch-service
  # healthy`; the await-schema init container in Kubernetes). The deployed environments
  # set SPRING_FLYWAY_ENABLED=false for every service and override it back to true for
  # THIS one, so ownership is declared in exactly one place per environment.
  # baseline-on-migrate stays FALSE because the database is greenfield: V1 must run on an
  # empty schema rather than being skipped past a synthetic baseline.
  # Rationale: docs/decision-log.md.
  # The set every service resolves is the SQL migrations V1, V2, V3, V5, V6, V7 and V8 plus
  # the JAVA migration that supplies version 4 (SeededPiiEncryptionMigration, registered by
  # SchemaMigrationConfig; there is deliberately no V4__*.sql file).
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Batch jobs run ON-DEMAND through the asyncJobOperator (reachable over HTTP via
  # BatchController, the analogue of the legacy CORPT00C TDQ/JES submission), never
  # automatically at startup.
  #
  # There is deliberately no `jdbc.initialize-schema` key: Spring Boot 4.1 removed the
  # whole `spring.batch.jdbc.*` group (BatchProperties now carries only `job`), so the
  # setting was inert - an unknown property that Boot silently ignores. Nothing
  # initializes the metadata schema in any case: the shared carddemo-common migration
  # V5__batch_metadata.sql owns the BATCH_* tables, and carddemo-common's
  # JdbcBatchConfiguration (imported by BatchServiceApplication) supplies the
  # JDBC-backed JobRepository that reads and writes them.
  # Batch jobs run ON-DEMAND via JobOperator, never automatically at startup.
  # The JDBC job repository is declared by BatchJobRepositoryConfig
  # (@EnableBatchProcessing + @EnableJdbcJobRepository) and creates no schema of
  # its own; Flyway owns the BATCH_* metadata tables. Spring Boot 4 removed the
  # spring.batch.jdbc.* properties, so no initializer switch is set here.
  batch:
    job:
      enabled: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  # HTTP session for the /batch launch surface. batch-service now exposes launch
  # endpoints, so it participates in the same shared Redis session as the other
  # services: the gateway forwards the caller's SESSION cookie and the shared
  # session-context filter derives the authenticated principal from it. The
  # namespace and flush-mode keys live under spring.session.data.redis in Boot 4.
  session:
    timeout: ${SPRING_SESSION_TIMEOUT:30m}
    data:
      redis:
        namespace: ${SPRING_SESSION_REDIS_NAMESPACE:carddemo:session}
        flush-mode: on-save

server:
  # Workstation (default-profile) HTTP port. Every DEPLOYED topology overrides it
  # with SERVER_PORT=8080 - docker-compose.yml sets it in its shared backend
  # environment and k8s/configmap.yaml supplies it to every pod - because the
  # containers reach each other by DNS name on ONE internal port and publish none.
  # The value here is therefore only for a `mvn spring-boot:run` estate on a
  # developer workstation, where all eight services share one host and so cannot
  # share one port: it is the port the api-gateway's OWN default route table
  # already addresses (BATCH_SERVICE_URI -> http://localhost:8088), and it is documented in
  # README-target.md. Rationale: docs/decision-log.md.
  port: ${SERVER_PORT:8088}

# Observability (AAP 0.7.5): health/info/prometheus exposure plus
# liveness/readiness probes for Kubernetes. The common 'application'
# metrics tag is contributed by carddemo-common ObservabilityConfig -
# do not duplicate it here.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # The readiness group must reflect the datastore: a service whose database is
      # unreachable cannot serve a single business request, so it must report
      # not-ready and be pulled out of the load-balancer / Service endpoints instead
      # of continuing to receive traffic it can only answer with HTTP 500. Without
      # this the group contains readinessState alone and stays UP while the database
      # is down. Liveness deliberately stays state-only so a transient datastore
      # outage never triggers a container restart.
      # Health detail is disclosed only to authenticated principals so an
      # anonymous caller cannot enumerate datastore/dependency internals.
      # Liveness/readiness aggregate status stays public for probes.
      show-details: when-authorized
      # The datastore health contributors are CONDITIONAL: Redis health is switched off
      # in the slice/integration test contexts (spring.autoconfigure.exclude of the Redis
      # auto-configuration, or management.health.redis.enabled=false), and a deployment
      # may legitimately run a service without one of them. Boot's default strict group
      # membership validation aborts context startup when a listed contributor is absent,
      # so it is relaxed here; the groups themselves are asserted at runtime (readiness
      # turns 503 when PostgreSQL or Redis goes away).
      validate-group-membership: false
      # Explicit probe groups. Boot's default readiness group contains only
      # readinessState, so readiness reported UP while PostgreSQL and Redis were both
      # unavailable and Kubernetes kept routing traffic to a pod that could not serve a
      # single datastore-backed request. Readiness now includes this service's actual
      # datastore dependencies, while liveness deliberately stays limited to
      # livenessState: a datastore outage must remove the pod from the Service
      # endpoints, never restart a perfectly healthy container.
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  # Distributed tracing export (AAP 0.7.5). The OTLP span endpoint and the sampling
  # probability are environment-driven: 100% capture is unsafe for the p95/memory NFRs
  # under load, so the default is a 10% sample that each environment overrides (the
  # api-gateway raises it to 1.0 so every request entering the stack starts a sampled
  # trace).
  #
  # PROPERTY NAME: 'management.otlp.tracing.endpoint' was REMOVED in Spring Boot 4.0
  # (deprecation level "error", replacement below). Using the old key silently exported
  # nothing, which is one half of why tracing produced no spans at all. The
  # canonical Boot 4.1 key is used here, and the default now points at the OTLP HTTP
  # receiver of the 'jaeger' collector declared in docker-compose.yml / k8s rather than
  # at the container's own loopback.
  # Distributed tracing export. The OTLP endpoint and the sampling
  # probability are environment-driven: 100% capture is unsafe for
  # p95/memory NFRs in production, so the default is a 10% sample that each
  # environment overrides (e.g. 1.0 in dev, lower under load).
  # NOTE: Spring Boot 4 RELOCATED this key. The pre-4.0 form
  # management.otlp.tracing.endpoint was removed in 4.0.0 and is now silently
  # ignored, so the endpoint must be declared under
  # management.opentelemetry.tracing.export.otlp.* to take effect.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}

# Data-management batch file roots (CWE-22 containment). Every job-parameter
# file name is confined to these allowlisted roots by BatchOutputPathResolver:
# 'output-dir' bounds files the jobs write (record dumps, category-balance and
# transaction-detail reports, the combined transaction file); 'input-dir' bounds
# the daily-transaction feed the validation-read job reads. Absolute paths,
# '..' traversal, and symlink escapes outside these roots are rejected. When a
# value is blank a <java.io.tmpdir>/carddemo-batch/{output,input} default is used.
carddemo:
  batch:
    output-dir: ${CARDDEMO_BATCH_OUTPUT_DIR:}
    input-dir: ${CARDDEMO_BATCH_INPUT_DIR:}

# ---------------------------------------------------------------------
# Structured-logging members.
#
# The Logstash structured format emitted by logback-spring.xml carries the
# message, the level, the logger, the thread and every MDC entry
# (correlationId/traceId/spanId) but NO service identity, so a JSON record
# scraped out of an aggregated log stream could not be attributed to the
# service that produced it - the container name was the only clue, and it is
# absent once records are shipped. `logging.structured.json.add` adds the
# member to every record emitted by Spring Boot's StructuredLogEncoder,
# including the encoder declared explicitly in logback-spring.xml.
# ---------------------------------------------------------------------
logging:
  structured:
    json:
      add:
        service: ${spring.application.name}

# ---------------------------------------------------------------------
# Docker Compose profile (SPRING_PROFILES_ACTIVE=docker). Compose passes
# explicit env vars; these defaults resolve the compose service
# hostnames (postgres, redis) even if a var is unset.
# ---------------------------------------------------------------------
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    # NO in-file default: a deployed service must never fall back to a
    # packaged connection string. Without SPRING_DATASOURCE_URL this placeholder cannot be
    # resolved and startup fails immediately with a clear message, instead of silently
    # connecting to whatever host the default happens to name and reporting healthy.
    # carddemo-common's DeployedConfigurationValidator enforces the same rule for the k8s and
    # prod profiles, where no profile document exists.
    url: ${SPRING_DATASOURCE_URL}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}

---
# ---------------------------------------------------------------------------
# Metrics reach Prometheus by scrape (AAP 0.7.5), so the OTLP metrics registry the
# OpenTelemetry starter brings along is switched off; only spans are exported over
# OTLP (see management.opentelemetry.tracing.export.otlp above).
# ---------------------------------------------------------------------------
management:
  otlp:
    metrics:
      export:
        enabled: false

# ---------------------------------------------------------------------------
# batch-service is the single owner of the shared migration set. baseline-version 0
# makes Flyway ADOPT a pre-existing non-empty database WITHOUT skipping V1, which a
# default baseline (version 1) would do.
# ---------------------------------------------------------------------------
spring:
  flyway:
    baseline-version: 0
  # The batch job-launch surface reads the shared COMMAREA-equivalent session, so this
  # service must resolve the SAME Redis namespace as every other service.
  session:
    timeout: ${SPRING_SESSION_TIMEOUT:30m}
    data:
      redis:
        namespace: ${SPRING_SESSION_REDIS_NAMESPACE:carddemo:session}
        flush-mode: on-save
