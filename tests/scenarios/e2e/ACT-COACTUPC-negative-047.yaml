# COACTUPC refuses a reissue month outside 1-12: the "month 1-12" predicate of
# EDIT-MONTH, which the procedure copybook CSUTLDPY contributes, for the
# Reissue Date field [app/cpy/CSUTLDPY.cpy:91-147].
#
# Steps 1-3 sign on as USER0001, choose main-menu option 2 and fetch account
# 00000000001, as ACT-COACTUPC-alternate-04 does: CXACAIX gives customer
# 000000001, ACCTDAT and CUSTDAT are read without UPDATE, and
# 3202-SHOW-ORIGINAL-VALUES shows the records with 'Update account details
# presented above.'; every editable field is DFHBMFSE (unprotected, MDT on), so
# all of them come back on the next AID [app/cbl/COACTUPC.cbl:2568-2580,
# 2787-2865,3500-3561,3608-3884]. Step 4 types 16 over the reissue month (05)
# and presses ENTER.
# - 1100-RECEIVE-MAP moves 16, being neither '*' nor spaces, to
#   ACUP-NEW-REISSUE-MON [app/cbl/COACTUPC.cbl:1197-1202].
# - 1205-COMPARE-OLD-NEW finds the new reissue date 20251620 different from
#   the fetched 20250520, so 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and
#   runs the field edits in screen order [app/cbl/COACTUPC.cbl:1460-1507,
#   1681-1705].
# - Account Status (Y), Open Date (2014-11-20), Credit Limit, Expiry Date
#   (2025-05-20) and Cash Credit Limit are as fetched and pass.
# - Reissue Date is next: 'Reissue Date' goes to WS-EDIT-VARIABLE-NAME and
#   20251620 to WS-EDIT-DATE-CCYYMMDD, and EDIT-DATE-CCYYMMDD runs through
#   CSUTLDPY [app/cbl/COACTUPC.cbl:1503-1507]. EDIT-YEAR-CCYY accepts 2025
#   (century 20). EDIT-MONTH finds 16 supplied, but WS-EDIT-DATE-MM-N 16 is
#   outside WS-VALID-MONTH (1 through 12) [app/cpy/CSUTLDWY.cpy:16-20], so it
#   sets INPUT-ERROR and FLG-MONTH-NOT-OK and, the message being still off,
#   STRINGs the trimmed field name and ': Month must be a number between 1 and
#   12.' into WS-RETURN-MSG [app/cpy/CSUTLDPY.cpy:110-124]. The numeric
#   predicate after it is skipped by the GO TO; EDIT-DAY accepts 20, and
#   EDIT-DAY-MONTH-YEAR leaves for the exit because the date flags are not all
#   valid, so CSUTLDTC is not called [app/cpy/CSUTLDPY.cpy:150-282].
# - Every later edit passes on the invented customer below, and an edit writes
#   its message only while WS-RETURN-MSG-OFF holds, so this message stays.
# - INPUT-ERROR leaves ACUP-CHANGES-NOT-OK, which 2000-DECIDE-ACTION only
#   continues on: no READ UPDATE or REWRITE runs [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values, 16 included, with the
#   amounts re-edited through +ZZZ,ZZZ,ZZZ.99; 3250-SETUP-INFOMSG sets
#   PROMPT-FOR-CHANGES and moves WS-RETURN-MSG to ERRMSG; 3300 keeps the
#   fields editable and CSSETATY turns RISMON red (no '*', the field is not
#   blank); 3390 makes F12=Cancel bright, while F5=Save stays dark without a
#   confirmation prompt [app/cbl/COACTUPC.cbl:2870-2951,2964-2981,2986-3006,
#   3269-3270,3566-3581] [app/cpy/CSSETATY.cpy].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - ERRMSG is 'Reissue Date' (the trimmed X(25) WS-EDIT-VARIABLE-NAME) and
#   ': Month must be a number between 1 and 12.', 54 characters, in the
#   75-byte WS-RETURN-MSG and the 78-byte ERRMSGO.
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   FKEY05 is dark (ASKIP,DRK) and the s3270 capture renders it as blanks.
# - The tpe adapter enters a field with EraseEOF before typing; 16 fills the
#   2-byte RISMON.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every other
# COACTUPC edit: the repository record has FICO 274, below 300, and zip 12546,
# which is not a North Carolina zip [app/cbl/COACTUPC.cbl:2514-2558]. Area code
# 919 is a general-purpose code and NC27 a valid state and zip pair
# [app/cpy/CSLKPCDY.cpy:521,895,1186]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-047
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001 with its customer 000000001, changes the reissue month
  from 05 to 16 and presses ENTER. COACTUPC refuses the value: the message line
  shows 'Reissue Date: Month must be a number between 1 and 12.', the screen
  keeps the entered values, 16 included, editable under 'Update account
  details presented above.', and F12=Cancel is shown while F5=Save is not.
  Nothing is saved: ACCTDATA and CUSTDATA still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-104  # COACTUPC Reissue Date: month 1-12 (EDIT-MONTH field edit)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute set on RISMON
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-MONTH, which refuses the reissue month
- INV-LAY-014  # CSUTLDWY: WS-EDIT-DATE-MM-N and its WS-VALID-MONTH range
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY drops FUNCTION TRIM from the field name of every composed
# date-edit message, so the ERRMSG of screen 4 differs on UniKix.
- GAP-DOC-024
# The UniKix COACTUPC comments out the TEST-NUMVAL-C checks of the amounts that
# 1100-RECEIVE-MAP converts and the ' is not valid' amount edit, and drops TRIM
# from the change detection, all on this path, so the amounts on screen 4 may
# differ on UniKix [app/cbl/COACTUPC.cbl:1072-1110,1681-1705,2180-2221].
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands;
# the COACTUP map is asserted on screens 2 to 4.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
