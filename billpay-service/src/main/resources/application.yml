# =====================================================================
# billpay-service - Spring Boot application configuration.
#
# REST re-platforming of the legacy COBOL bill-payment program COBIL00C
# (online bill payment, CICS transaction CB00), formerly backed by the
# VSAM data sets TRANSACT / ACCTDAT / CXACAIX. Every connection setting
# is environment-driven so the same artifact runs locally, under Docker
# Compose (SPRING_PROFILES_ACTIVE=docker) and on Kubernetes; the values
# below are developer-workstation defaults.
# =====================================================================
spring:
  application:
    name: billpay-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carddemo}
    username: ${SPRING_DATASOURCE_USERNAME:carddemo}
    password: ${SPRING_DATASOURCE_PASSWORD:carddemo}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Flyway/other services own the schema; Hibernate only validates
      # that the shared carddemo-common entity mappings match the schema.
      ddl-auto: validate

  # billpay-service SHARES the 'carddemo' database and owns NO tables and
  # ships NO migrations - the schema is created by account-service /
  # transaction-service / card-service migrations. Flyway is therefore
  # disabled here so this service never touches the shared migration
  # history. Reconciliation rationale: docs/decision-log.md.
  flyway:
    enabled: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  # Externalized pseudo-conversational session (COMMAREA replacement).
  session:
    store-type: redis

server:
  port: 8080

# Observability (AAP 0.7.5): health/info/prometheus exposure plus
# liveness/readiness probes for Kubernetes. The common 'application'
# metrics tag is contributed by carddemo-common ObservabilityConfig -
# do not duplicate it here.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

# ---------------------------------------------------------------------
# Docker Compose profile (SPRING_PROFILES_ACTIVE=docker). Compose passes
# explicit env vars; these defaults resolve the compose service
# hostnames (postgres, redis) even if a var is unset.
# ---------------------------------------------------------------------
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/carddemo}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
