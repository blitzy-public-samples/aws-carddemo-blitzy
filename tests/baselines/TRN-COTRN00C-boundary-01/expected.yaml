# Derived baseline of scenario TRN-COTRN00C-boundary-01: with exactly 10
# transactions in TRANSACT, USER0001 signs on, opens the transaction list from
# the main menu (option 6) and presses PF8 on its only page. Authored from the
# source at commit 93ebec71ff7b59a68cedd7c501afe496a8eaa68d, never captured
# (capture_platform: derived): app/cbl/COTRN00C.cbl:95-141,206-229,257-328,
# 381-445,527-586,624-653 with app/bms/COTRN00.bms, app/cpy/COTTL01Y.cpy and
# app/cpy/CSDAT01Y.cpy (the browse, the paging, the row formatting and the
# screen header), app/cbl/COSGN00C.cbl and app/cbl/COMEN01C.cbl:75-156 with
# app/cpy/COMEN02Y.cpy (the type-U route and option 6). Open until a UniKix run
# is imported: GAP-INF-007 (derived TRN end-to-end baselines) and GAP-INF-012
# (online-only copybooks).
# One screen per step, the one shown after the step's AID: COMEN01 after
# sign-on, COTRN00 page 1 after option 6, COTRN00 after PF8.
# Page 1 fills all ten rows, ids 1 to 10 in key order; the look-ahead READNEXT
# then returns ENDFILE, which sets the bottom-of-page message and NEXT-PAGE-NO
# (COTRN00C.cbl:305-313,636-645). PF8 finds NEXT-PAGE-NO, browses nothing and
# resends the received FSET fields without ERASE (COTRN00C.cbl:257-274,
# 527-549), so the screen stays on page 1 with the same rows and only ERRMSG
# changes: the 10-row page boundary, where TRN-COTRN00C-boundary-02's eleventh
# transaction gets a second page.
# Values are full BMS field width with their trailing spaces; CURDATE and
# CURTIME are run-clock matchers, because the region clock cannot be fixed.
# messages holds each step's ERRMSG.
messages:
- '                                                                              '
- 'You have reached the bottom of the page...                                    '
- 'You are already at the bottom of the page...                                  '
