# FIN-CBACT04C-recovery-05: CBACT04C computes and writes the interest of every
# TCATBALF record, then its CLOSE of TCATBALF fails and the run abends through
# 9000-TCATBALF-CLOSE [app/cbl/CBACT04C.cbl:522-538], 9910-DISPLAY-IO-STATUS
# [app/cbl/CBACT04C.cbl:635-648] and 9999-ABEND-PROGRAM
# [app/cbl/CBACT04C.cbl:628-632].
#
# Derived, never observed. No adapter injects a close failure after a
# successful open (GAP-MIS-013), so gnucobol-batch raises MissingPrerequisite
# and the scenario stays implemented-unexecuted; its baseline is derived from
# the source (GAP-INF-013) and capture.py refuses to capture it.
#
# How the expected outcome was derived:
# - The datasets are the synthetic set of FIN-CBACT04C-normal-01, so everything
#   up to the close is that scenario's outcome: the start line and one DISPLAY
#   TRAN-CAT-BAL-RECORD per TCATBALF record (the whole 50-byte record: key,
#   TRAN-CAT-BAL as zoned digits with its overpunch sign, 22 blanks of FILLER),
#   and the three interest records written to SYSTRAN
#   [app/cbl/CBACT04C.cbl:181-222,462-515]. GnuCOBOL 3.2 shows exactly these
#   lines and records for the same data without a fault.
# - The read loop ends at end of file and the end-of-file ELSE that would
#   rewrite the last account is unreachable, so 9000-TCATBALF-CLOSE is the
#   first paragraph after the loop [app/cbl/CBACT04C.cbl:188-224] (GAP-DEF-003).
# - The fault condition io-error is taken as file status 30 (inferred). '30' is
#   numeric and does not start with '9', so 9910 shows it as NNNN0030.
# - The CEE3ABD stub ends the run (GAP-STB-001, GAP-DEF-001): the adapter
#   reports return_code null and appends the stub's marker. The closes of the
#   other four files and 'END OF EXECUTION OF PROGRAM CBACT04C' are never
#   reached.
id: FIN-CBACT04C-recovery-05
level: unit
type: recovery
description: >-
  Close failure after the interest run: CBACT04C, called with PARM 2022071800,
  writes the three interest transactions of the synthetic accounts 00000000901
  and 00000000902, then CLOSE TCATBALF returns a non-zero status, so it displays
  'ERROR CLOSING TRANSACTION BALANCE FILE', the status as 'FILE STATUS IS:
  NNNN0030' and 'ABENDING PROGRAM', and abends through CEE3ABD without the
  end-of-execution line.
# Only the read-or-close-failure item: this case never executes, so listing the
# program, its copybooks or the data files here would block items that the
# executed CBACT04C scenarios verify (a scenario lists an item only when the
# item's verification depends on it).
inventory_ids:
- INV-FIN-011
tags:
- inferred-not-observed
gap_ids:
- GAP-MIS-013
- GAP-INF-013
- GAP-STB-001
- GAP-DEF-001
- GAP-STB-004
# CBACT04C opens four Berkeley DB indexed files (TCATBAL-FILE, XREF-FILE with
# its alternate key, ACCOUNT-FILE and DISCGRP-FILE) and is compiled with the
# mapped options on gnucobol-batch, so the case cites those two stub
# limitations, as every scenario whose program uses a seam does.
- GAP-STB-010  # Berkeley DB indexed files in place of the VSAM KSDS
- GAP-STB-011  # GnuCOBOL compile and runtime options in place of Enterprise COBOL and LE
