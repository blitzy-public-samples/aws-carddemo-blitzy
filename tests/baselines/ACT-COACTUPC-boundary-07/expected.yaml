# Derived baseline of scenario ACT-COACTUPC-boundary-07 (capture_platform
# derived, tag inferred-not-observed): the Open Date month boundary 12, the
# last value inside 1-12, is accepted. USER0001 signs on, takes main-menu
# option 2, fetches account 00000000001 on COACTUP, types 2014, 12 and 20 over
# the fetched open date 2014-11-20 and presses ENTER. An accepted value shows
# as the next prompt, so COACTUPC asks for confirmation and writes nothing.
# Authored from the source, never captured:
# - steps 1-3 as ACT-COACTUPC-alternate-04: app/cbl/COMEN01C.cbl:241-252 with
#   app/cpy/COMEN02Y.cpy:30-33 (OPTN002); app/cbl/COACTUPC.cbl:2958-2959
#   (PROMPT-FOR-SEARCH-KEYS), 2568-2580 and 3608-3884 (CXACAIX, ACCTDAT and
#   CUSTDAT read without UPDATE), 2787-2865 (3202-SHOW-ORIGINAL-VALUES),
#   2962-2963 (PROMPT-FOR-CHANGES), 3500-3561 (F5 and F12 stay dark);
# - step 4: app/cbl/COACTUPC.cbl:1151-1156 (OPNMONI to ACUP-NEW-OPEN-MON),
#   1459-1482 (1205-COMPARE-OLD-NEW finds the change; 'Open Date' and
#   EDIT-DATE-CCYYMMDD); app/cpy/CSUTLDPY.cpy:91-144 (EDIT-MONTH: 12 is
#   supplied, WS-VALID-MONTH holds, TEST-NUMVAL gives 0, FLG-MONTH-ISVALID),
#   150-204 (day 20), 209-279 (December is a WS-31-DAY-MONTH,
#   app/cpy/CSUTLDWY.cpy:16-23), 284-328 (CSUTLDTC with '20141220' and mask
#   YYYYMMDD, severity 0 inferred, app/cbl/CSUTLDTC.cbl:103-151);
#   app/cbl/COACTUPC.cbl:1671-1675 (no INPUT-ERROR, so
#   ACUP-CHANGES-OK-NOT-CONFIRMED), 2620-2621 (ENTER without PF5: no READ
#   UPDATE, no REWRITE), 2870-2949 (3203-SHOW-UPDATED-VALUES, open month 12),
#   2966-2967 and 2979-2981 (PROMPT-FOR-CONFIRMATION, the X(40) WS-INFO-MSG in
#   the 45-byte INFOMSGO; the blank X(75) WS-RETURN-MSG in the 78-byte
#   ERRMSGO, so no Open Date message), 3566-3581 (F5=Save and F12=Cancel made
#   bright), 3594-3601 (SEND MAP ERASE);
# - app/bms/COACTUP.bms for field lengths and the INITIAL texts of FKEYS,
#   FKEY05 and FKEY12; a dark field is captured as blanks.
# Values are whole BMS fields with their trailing spaces. CURDATE and CURTIME
# come from the region clock, hence the matchers. TRNNAME is pinned as the
# CAUP COACTUPC moves, although app/bms/COACTUP.bms:487-488 also defines an
# unnamed 9-byte field at row 1, column 1 (GAP-DOC-025).
# file_state: nothing is rewritten before PF5, so both files keep their 50
# records and the key records are the materialized fixtures, decoded whole
# (FILLER included): ACCTDATA from app/data/ASCII/acctdata.txt, with open date
# 2014-11-20, and CUSTDATA with the scenario's invented customer 000000001.
# Open under GAP-INF-005 (derived ACT end-to-end baselines), GAP-INF-012
# (online-only copybooks) and GAP-INF-001 (which dates CEEDAYS accepts, known
# only through the stub), with GAP-MIS-010 (whether UniKix supplies CEEDAYS).
# The UniKix copy's CSUTLDPY month edit (GAP-DOC-024), CSUTLDTC (GAP-DOC-021),
# COACTUPC amount edits (GAP-DOC-022) and COACTUP.bms row 1 (GAP-DOC-025)
# differ, so a UniKix run pins the UniKix copy's outcome and does not verify
# app/'s. Only `report.py --import-unikix` promotes this baseline; it is never
# edited by hand to match a run.
