# COACTUPC refuses an expiry year outside the 1900s and 2000s: 2125 is a
# supplied 4-digit number, but its century 21 is neither THIS-CENTURY (20) nor
# LAST-CENTURY (19), so ENTER shows 'Expiry Date : Century is not valid.' and
# nothing is written.
#
# Steps 1-3 sign on as USER0001, choose main-menu option 2 and fetch account
# 00000000001 as ACT-COACTUPC-alternate-04 does: CXACAIX gives card
# 9680294154603697 and customer 000000001 (line 49 of
# app/data/ASCII/cardxref.txt), ACCTDAT and CUSTDAT are read without UPDATE,
# and 3202-SHOW-ORIGINAL-VALUES shows the details with every editable field
# unprotected and MDT on, so all of them come back on the next AID
# [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3500-3561,3608-3884].
# Step 4 types 2125 over the expiry year and presses ENTER.
# 1205-COMPARE-OLD-NEW finds a change, and 1200-EDIT-MAP-INPUTS sets
# ACUP-CHANGES-NOT-OK and edits the fields in screen order
# [app/cbl/COACTUPC.cbl:1460-1494]. Account Status 'Y', Open Date 2014-11-20
# and Credit Limit +2,020.00 pass, so WS-RETURN-MSG is still blank when the
# Expiry Date edit runs. EDIT-DATE-CCYYMMDD falls into EDIT-YEAR-CCYY: '2125'
# is neither blank nor non-numeric, WS-EDIT-DATE-CC-N is 21, and the century
# test sets INPUT-ERROR and FLG-YEAR-NOT-OK and STRINGs the trimmed field name
# with ' : Century is not valid.' [app/cpy/CSUTLDPY.cpy:18-90]
# [app/cpy/CSUTLDWY.cpy:5-10]. The month and day edits pass, and
# EDIT-DAY-MONTH-YEAR leaves at EDIT-DATE-CCYYMMDD-EXIT because the year flag
# is not valid, so CSUTLDTC is not called for this date
# [app/cpy/CSUTLDPY.cpy:91-282]. Every later edit passes on the fetched values,
# and none could replace the message, since each writes only while
# WS-RETURN-MSG-OFF holds [app/cbl/COACTUPC.cbl:1496-1677].
# 2000-DECIDE-ACTION continues on ACUP-CHANGES-NOT-OK, so 9600-WRITE-PROCESSING,
# the only READ UPDATE and REWRITE path, does not run
# [app/cbl/COACTUPC.cbl:2584-2597]. 3203-SHOW-UPDATED-VALUES shows the received
# values, the amounts re-edited through +ZZZ,ZZZ,ZZZ.99; 3250 sets
# PROMPT-FOR-CHANGES and moves the message to ERRMSG; 3320 keeps the fields
# unprotected; CSSETATY turns EXPYEAR red and the cursor goes to it; 3390 makes
# F12=Cancel bright because changes were made and leaves F5=Save dark
# [app/cbl/COACTUPC.cbl:2870-2951,2955-2983,2993-3039,3566-3581]
# [app/cpy/CSSETATY.cpy:17-26].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   ERRMSG is the 35-character message in the 75-byte WS-RETURN-MSG, padded to
#   the 78-byte ERRMSGO; INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte
#   INFOMSGO.
# - AADDGRP is blank: ACCT-GROUP-ID is blank in the repository account
#   (GAP-DEF-005), and the spaces that come back become LOW-VALUES
#   [app/cbl/COACTUPC.cbl:1213-1218].
# - FKEY05 is dark (ASKIP,DRK), which the s3270 capture renders as blanks.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit (the repository record has FICO 274 and a zip outside North Carolina),
# so only the expiry year is refused [app/cbl/COACTUPC.cbl:2514-2558].
id: ACT-COACTUPC-negative-029
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001 and changes its expiry year from 2025 to 2125. COACTUPC
  refuses the year because its century is neither 19 nor 20: the screen keeps
  the entered values, editable, with 'Expiry Date : Century is not valid.' in
  the message line and 'Update account details presented above.' as the
  prompt. Nothing is saved: ACCTDATA and CUSTDATA still hold the fetched
  records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-087  # COACTUPC Expiry Date: century 19 or 20 (rule)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and error screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the red attribute of the refused field
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-YEAR-CCYY and its century test
- INV-LAY-014  # CSUTLDWY: WS-EDIT-DATE-CC-N with THIS-CENTURY and LAST-CENTURY
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY drops FUNCTION TRIM from the field name of this message.
- GAP-DOC-024
# Beyond the planned gap list: the UniKix COACTUPC comments out the TEST-NUMVAL-C
# amount checks this path runs before the expiry edit, so the amounts on
# screen 4 may differ on UniKix.
- GAP-DOC-022
# Beyond the planned gap list: the UniKix COACTUP.bms differs at row 1,
# columns 1-9, where TRNNAME stands.
- GAP-DOC-025
