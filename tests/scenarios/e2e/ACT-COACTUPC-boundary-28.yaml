# COACTUPC refuses an SSN first part of 900, the lower edge of the 900 THRU 999
# range of INVALID-SSN-PART1 (VALUES 0, 666, 900 THRU 999
# [app/cbl/COACTUPC.cbl:117-123]): 1265-EDIT-US-SSN finds the part supplied,
# numeric and not zero, then finds INVALID-SSN-PART1 true and composes 'SSN:
# First 3 chars: should not be 000, 666, or between 900 and 999'
# [app/cbl/COACTUPC.cbl:2431-2464]. The SSN first-part boundary scenarios of
# this item are boundary-25 to -28, taking 665, 666, 899 and 900: 666 and 900
# are refused, 665 and 899 accepted. ACT-COACTUPC-negative-064 is the refusal
# well inside the range (950).
#
# Steps 1-3 reach the fetched account as ACT-COACTUPC-alternate-04 does:
# USER0001 signs on through CC00, chooses option 2 (Account Update) on COMEN01,
# and enters account 00000000001. 9000-READ-ACCT reads CXACAIX by account id
# (card 9680294154603697, customer 000000001, line 49 of
# app/data/ASCII/cardxref.txt), ACCTDAT and CUSTDAT, keeps the records as the
# old values in the COMMAREA and sets ACUP-SHOW-DETAILS; the screen shows them
# with 'Update account details presented above.', every editable field
# unprotected with its MDT on [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,
# 2955-3000,3441-3561,3608-3884].
# Step 4 types 900 over the first SSN part (ACTSSN1, shown as '123') and
# presses ENTER.
# - 1100-RECEIVE-MAP moves the received '900' to ACUP-NEW-CUST-SSN-1
#   [app/cbl/COACTUPC.cbl:1233-1238]. 1205-COMPARE-OLD-NEW finds
#   ACUP-NEW-CUST-SSN-X ('900456789') unequal to the old SSN (123456789), so a
#   change has occurred, and 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and
#   runs the field edits in screen order [app/cbl/COACTUPC.cbl:1460-1470,
#   1681-1705,1754].
# - Account Status, Open Date, Credit Limit, Expiry Date, Cash Credit Limit,
#   Reissue Date, Current Balance and the two cycle amounts pass on the
#   repository account [app/cbl/COACTUPC.cbl:1472-1527]. 1265-EDIT-US-SSN
#   moves 'SSN: First 3 chars' to WS-EDIT-VARIABLE-NAME and the part to
#   WS-EDIT-ALPHANUM-ONLY with length 3; 1245-EDIT-NUM-REQD finds '900'
#   supplied, numeric and not zero, so it sets FLG-ALPHNANUM-ISVALID, which
#   becomes FLG-EDIT-US-SSN-PART1-ISVALID [app/cbl/COACTUPC.cbl:1529-1531,
#   2109-2175,2439-2445].
#   The part is moved to WS-EDIT-US-SSN-PART1, whose PIC 9(3) redefinition
#   reads 900, the first value of 900 THRU 999, so INVALID-SSN-PART1 is true:
#   the routine sets INPUT-ERROR and FLG-EDIT-US-SSN-PART1-NOT-OK and,
#   WS-RETURN-MSG being still blank [app/cbl/COACTUPC.cbl:876], STRINGs the
#   trimmed field name and ': should not be 000, 666, or between 900 and 999'
#   into WS-RETURN-MSG [app/cbl/COACTUPC.cbl:2448-2464]. SSN parts 2 ('45')
#   and 3 ('6789') pass
#   [app/cbl/COACTUPC.cbl:2469-2487].
# - Every later edit passes on the invented customer below; they only set
#   their flags, since WS-RETURN-MSG is no longer blank
#   [app/cbl/COACTUPC.cbl:1533-1676]. INPUT-ERROR keeps ACUP-CHANGES-NOT-OK,
#   and 2000-DECIDE-ACTION continues on it, so 9600-WRITE-PROCESSING, the only
#   READ UPDATE and REWRITE path, does not run [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values, the valid amounts
#   re-edited through +ZZZ,ZZZ,ZZZ.99 and the SSN parts as received; 3250 sets
#   PROMPT-FOR-CHANGES and moves the message to ERRMSG; 3300 keeps the fields
#   editable, puts the cursor on ACTSSN1 and marks it red through CSSETATY
#   without the '*' of a blank field; 3390 makes F12=Cancel bright because
#   changes were made, while F5=Save stays dark [app/cbl/COACTUPC.cbl:
#   2870-2951,2955-2983,3077-3080,3297-3301,3566-3581]
#   [app/cpy/CSSETATY.cpy:18-27].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - The message is TRIM('SSN: First 3 chars') followed by ': should not be
#   000, 666, or between 900 and 999', 66 characters of the 75-byte
#   WS-RETURN-MSG, shown in the 78-byte ERRMSG with trailing spaces. INFOMSG is
#   the 40-byte WS-INFO-MSG in the 45-byte field. Fields are compared at their
#   full BMS length, trailing spaces kept.
# - The tpe adapter enters a field with EraseEOF before typing; '900' fills the
#   3-byte ACTSSN1, and the screen shows it so.
# - FKEY05 and FKEY12 keep their INITIAL text; a dark (ASKIP,DRK) field is
#   captured as blanks. Colour and cursor position are not in the s3270 text
#   capture and are not asserted.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, so the first SSN part is the only field refused: the repository record
# has FICO 274, below 300, and zip 12546, which is not a North Carolina zip
# [app/cbl/COACTUPC.cbl:2514-2558]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-boundary-28
level: e2e
type: boundary
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001, whose customer's SSN is 123-45-6789, types 900 over the
  first SSN part and presses ENTER. 900 is the lowest value of the 900-999
  range the program forbids, so COACTUPC refuses the change: it shows the
  received values again, editable, with 'SSN: First 3 chars: should not be
  000, 666, or between 900 and 999' in the message line, the first SSN part
  as typed, the change prompt 'Update account details presented above.' and
  F12=Cancel made visible. Nothing is saved: ACCTDATA and CUSTDATA still hold
  the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-122  # COACTUPC SSN: First 3 chars: not 000, 666 or 900-999 (1265-EDIT-US-SSN)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute set on ACTSSN1
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the date edits the account dates pass
- INV-LAY-014  # CSUTLDWY: the date-edit working storage
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix COACTUPC drops TRIM from the field name in this message
# (COACTUPC.cl2:2462-2468), so a UniKix run shows 'SSN: First 3 chars' padded
# to 25 bytes before the colon and never verifies the item.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands;
# the other COACTUPC update scenarios cite it too.
- GAP-DOC-025
