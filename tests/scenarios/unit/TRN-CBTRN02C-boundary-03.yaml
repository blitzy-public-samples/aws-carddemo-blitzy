# The count boundary of daily posting: DALYTRAN exists but holds no record.
# All six files open, the first READ of DALYTRAN returns status 10 and ends the
# loop before any record is counted, so both counts display as nine zeros and
# RETURN-CODE stays 0 because no record was rejected
# [app/cbl/CBTRN02C.cbl:193-234,345-369]. DALYTRAN is declared with an empty
# record list rather than left out: leaving it out is an open-failure case.
id: TRN-CBTRN02C-boundary-03
level: unit
type: boundary
description: >-
  CBTRN02C posts an empty daily transaction file against the repository
  cross-reference, account and category balance files. It displays the start
  line, 'TRANSACTIONS PROCESSED :000000000', 'TRANSACTIONS REJECTED  :000000000'
  and the end line, ends with return code 0, writes no TRANSACT and no DALYREJS
  record, and leaves ACCTDATA and TCATBALF as loaded.
inventory_ids:
- INV-TRN-086  # CBTRN02C processed and rejected counts (report)
- INV-TRN-008  # CBTRN02C program
- INV-DTA-003  # cardxref.txt, the CARDXREF fixture source
- INV-DTA-013  # EBCDIC card cross-reference file, its cross-check counterpart
- INV-DTA-001  # acctdata.txt, the ACCTDATA fixture source
- INV-DTA-011  # EBCDIC account data file, its cross-check counterpart
- INV-DTA-007  # tcatbal.txt, the TCATBALF fixture source
- INV-DTA-018  # EBCDIC category balance file, its cross-check counterpart
tags: []
gap_ids:
- GAP-STB-010  # Berkeley DB indexed files in place of the VSAM KSDS; TRANFILE is opened OUTPUT
- GAP-STB-011  # GnuCOBOL compile and runtime options in place of Enterprise COBOL and LE
preconditions:
  datasets:
    DALYTRAN:
      records: []
    CARDXREF:
      base: CARDXREF
    ACCTDATA:
      base: ACCTDATA
    TCATBALF:
      base: TCATBALF
  parameters:
    clock: '2022-07-06 10:00:00.00'
    clock_mode: fixed
  faults: []
inputs:
  program: CBTRN02C
expected:
  return_code: 0
  messages:
  - START OF EXECUTION OF PROGRAM CBTRN02C
  - 'TRANSACTIONS PROCESSED :000000000'
  - 'TRANSACTIONS REJECTED  :000000000'
  - END OF EXECUTION OF PROGRAM CBTRN02C
  datasets:
    TRANSACT:
      count: 0
    DALYREJS:
      count: 0
  # Opened I-O but never read or rewritten: the baseline pins all 50 records of
  # each file as loaded from the repository fixture.
  file_state:
    ACCTDATA: baseline
    TCATBALF: baseline
