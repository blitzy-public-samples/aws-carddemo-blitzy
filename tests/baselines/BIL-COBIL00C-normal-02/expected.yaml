# Derived baseline of scenario BIL-COBIL00C-normal-02; not observed.
# USER0001 signs on (CC00), takes main-menu option 10 'Bill Payment' and, on
# COBIL00 (transaction CB00), pays repository account 00000000002's balance of
# 158.00 by entering the account id with CONFIRM Y in one step.
# Authored from the source, never captured:
# - app/cbl/COMEN01C.cbl:236-250 and app/cpy/COMEN02Y.cpy:80-84 (the menu
#   option text, X(40), sent with a blank ERRMSG);
# - app/cbl/COBIL00C.cbl:107-122,289-338 (first entry: LOW-VALUES map, blank
#   ERRMSG, CB00 header);
# - app/cbl/COBIL00C.cbl:154-244 (READ ACCTDAT UPDATE finds ACCT-CURR-BAL
#   158.00; READ CXACAIX gives card 0923877193247330, the only cardxref.txt
#   entry of account 2; the browse from HIGH-VALUES reads the highest TRANSACT
#   key 0000000996722787 of the fixture built from app/data/ASCII/dailytran.txt,
#   so TRAN-ID is 0000000996722788; INITIALIZE TRAN-RECORD and the pay-block
#   moves fill the record; the REWRITE leaves account 2 at 0.00);
# - app/cbl/COBIL00C.cbl:249-267 with app/cpy/CSDAT01Y.cpy:42-55 (WS-TIMESTAMP
#   is 'YYYY-MM-DD hh:mm:ss.000000' from the region clock, hence the
#   run-timestamp matcher with that format on TRAN-ORIG-TS and TRAN-PROC-TS);
# - app/cbl/COBIL00C.cbl:505-532,560-566 (the WRITE answers NORMAL:
#   INITIALIZE-ALL-FIELDS blanks ACTIDIN, CURBAL and CONFIRM, and STRING builds
#   the 61-character success message, padded to the 78-byte ERRMSG); COBIL00 is
#   sent again unchanged after the REWRITE, and that second screen is captured.
# Open under GAP-INF-008 (derived BIL end-to-end baselines) and GAP-INF-012
# (online-only copybooks). Only `report.py --import-unikix` promotes it, from
# imported UniKix evidence; it is never edited by hand to match a run.
# The body is the scenario's expected in harness.dump_yaml form: one screen per
# step, messages holding each step's ERRMSG, text at full field width with its
# trailing spaces, numbers as decoded text with their scale. TRAN-RECORD's
# FILLER is not asserted, as in the scenario: INITIALIZE skips it, so it holds
# whatever the READPREV left.
