# The empty-description check of the Add Transaction screen: with every other
# field of the valid TRN-COTRN02C field set supplied, COTRN02C refuses a blank
# Description with 'Description can NOT be empty...' and writes nothing.
#
# Steps 1-2 reach the empty Add Transaction screen as TRN-COTRN02C-normal-03
# does: USER0001 (type U) is routed to COMEN01C, and option 8 transfers control
# to COTRN02C with the program context reset, so COTRN02C sets the re-enter
# flag, finds no transaction selected and sends COTRN02 with a blank ERRMSG
# [app/cbl/COSGN00C.cbl:230-237] [app/cbl/COMEN01C.cbl:115-156]
# [app/cbl/COTRN02C.cbl:119-130,516-534].
# Step 3 enters the valid field set, card number only, with TDESC left empty
# and CONFIRM Y, and presses ENTER under CT02:
# - ACTIDIN is not entered, so the card branch runs: the card is numeric, is
#   moved back through WS-CARD-NUM-N PIC 9(16) unchanged, READ CCXREF by card
#   is NORMAL, and XREF-ACCT-ID 00000000050 of cardxref record 1 replaces
#   ACTIDINI [app/cbl/COTRN02C.cbl:210-223,609-623].
# - ERR-FLG is off, so VALIDATE-INPUT-DATA-FIELDS keeps the received fields.
#   Its first EVALUATE finds Type CD, Category CD and Source supplied and the
#   Description equal to SPACES or LOW-VALUES: it sets WS-ERR-FLG, moves
#   'Description can NOT be empty...' to WS-MESSAGE, puts the cursor on TDESC
#   and performs SEND-TRNADD-SCREEN [app/cbl/COTRN02C.cbl:235-275].
# - SEND-TRNADD-SCREEN rebuilds the header, moves the message to ERRMSG, sends
#   COTRN02 with ERASE and ends the task with RETURN TRANSID CT02
#   [app/cbl/COTRN02C.cbl:516-571]. The later format checks, the amount
#   re-edit, the CONFIRM evaluation and ADD-TRANSACTION never run, so the
#   amount stays as typed and TRANSACT is not touched.
# COTRN2AO redefines COTRN2AI and each field's output data shares the input
# field's bytes, so the screen shows what was received: the entered fields
# padded with blanks by BMS to their length, the account id the lookup put in
# ACTIDINI, and an empty TDESC [app/cpy-bms/COTRN02.CPY:55-145].
#
# Expected values are derived from the source; no TPE region runs in CI. Text
# values are whole fields at their BMS length with trailing spaces. CURDATE and
# CURTIME come from the region clock, so they are matchers and the clock is
# relative.
id: TRN-COTRN02C-negative-10
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 8 (Transaction Add) and, on
  COTRN02, enters card 0500024453765740 with type 01, category 0001, source
  POS TERM, amount +00000012.34, dates 2022-07-01, merchant 800000001 'Test
  Merchant', Testville 27601 and CONFIRM Y, but no Description. COTRN02C sends
  COTRN02 again with the entered values, account 00000000050 from the card
  cross-reference and 'Description can NOT be empty...'; TRANSACT keeps its
  300 records.
# Primary item first, then the program, the maps asserted, the transaction step
# 3 runs under, the CSD file this path reads, and the online-only copybooks
# COTRN02C copies. CXACAIX and TRANSACT are not reached on this path. Sign-on
# and the menu (CC00, CM00, COSGN00, USRSEC, the option-8 navigation) are
# verified by the SEC and MNU scenarios, and the batch record copybooks and
# data files at the lowest level that executes them.
inventory_ids:
- INV-TRN-039  # COTRN02C message 'Description can NOT be empty...' (rule)
- INV-TRN-003  # COTRN02C program
- INV-MNU-003  # COMEN01 map, where option 8 is entered
- INV-TRN-006  # COTRN02 map, the add screen of steps 2 and 3
- INV-CFG-022  # CT02 transaction, under which COTRN02C receives the entry
- INV-CFG-004  # CCXREF CSD file, read by card number before the data checks
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA carrying the program context
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the screen date and time
- INV-LAY-008  # CSMSG01Y copybook, copied by COTRN02C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-007  # TRN end-to-end baselines derived, never observed on a TPE region
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    USRSEC: {base: USRSEC}
    CARDXREF: {base: CARDXREF}
    # TRANSACT has no repository data of its own (datasets.yaml source 'built'),
    # so the schema refuses it as a base; it is built from the 300 repository
    # daily transactions, which share its 350-byte record shape, as in the
    # other TRN-COTRN02C scenarios.
    TRANSACT: {base: DALYTRAN}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '8'
  # ACTIDIN is not entered, so the card number selects the cross-reference.
  # CONFIRM Y would add the transaction were every field valid, so the
  # unchanged TRANSACT shows that the empty Description alone stops the add.
  - aid: ENTER
    '@map': COTRN02
    fields:
      CARDNIN: '0500024453765740'
      TTYPCD: '01'
      TCATCD: '0001'
      TRNSRC: 'POS TERM'
      TDESC: ''
      TRNAMT: '+00000012.34'
      TORIGDT: '2022-07-01'
      TPROCDT: '2022-07-01'
      MID: '800000001'
      MNAME: 'Test Merchant'
      MCITY: 'Testville'
      MZIP: '27601'
      CONFIRM: 'Y'
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: 'CM00'
    PGMNAME: 'COMEN01C'
    ERRMSG: '                                                                              '
  - '@map': COTRN02
    TRNNAME: 'CT02'
    PGMNAME: 'COTRN02C'
    ERRMSG: '                                                                              '
  - '@map': COTRN02
    TRNNAME: 'CT02'
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: 'COTRN02C'
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ACTIDIN: '00000000050'
    CARDNIN: '0500024453765740'
    TTYPCD: '01'
    TCATCD: '0001'
    TRNSRC: 'POS TERM  '
    TDESC: '                                                            '
    TRNAMT: '+00000012.34'
    TORIGDT: '2022-07-01'
    TPROCDT: '2022-07-01'
    MID: '800000001'
    MNAME: 'Test Merchant                 '
    MCITY: 'Testville                '
    MZIP: '27601     '
    CONFIRM: 'Y'
    ERRMSG: 'Description can NOT be empty...                                               '
  # The ERRMSG of each step: the menu and the empty add screen carry none.
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'Description can NOT be empty...                                               '
  file_state:
    # No record is written: TRANSACT keeps the 300 fixture records, and the
    # highest of them, the one an add would follow, is unchanged.
    TRANSACT:
      count: 300
      contains:
      - TRAN-ID: '0000000996722787'
        TRAN-TYPE-CD: '01'
        TRAN-CAT-CD: '1'
        TRAN-SOURCE: 'POS TERM  '
        TRAN-DESC: 'Purchase at Kilback LLC                                                                             '
        TRAN-AMT: '603.22'
        TRAN-MERCHANT-ID: '800000000'
        TRAN-MERCHANT-NAME: 'Kilback LLC                                       '
        TRAN-MERCHANT-CITY: 'Cummeratamouth                                    '
        TRAN-MERCHANT-ZIP: '53200-7529'
        TRAN-CARD-NUM: '3260763612337560'
        TRAN-ORIG-TS: '2022-06-10 19:27:53.000000'
        TRAN-PROC-TS: '                          '
