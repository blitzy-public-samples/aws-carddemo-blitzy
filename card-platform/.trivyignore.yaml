  # apache/kafka:4.2.1 - six libraries bundled in the broker distribution.
  - id: CVE-2026-56740
    purls:
      - pkg:maven/org.jline/jline-remote-telnet@3.30.4
    statement: >-
      apache/kafka:4.2.1 | owner: project owner | Bundled library reached only by the broker's remote telnet console, which nothing in this platform enables: no service configures it, and neither deployment description exposes a port for it. The package scope below excuses this library alone.
    expired_at: 2026-11-30
  - id: CVE-2026-56741
    purls:
