# Update User with the last name erased before PF5. ADMIN001 (type A) signs on
# through CC00 and COSGN00C routes the user to the admin menu COADM01
# [app/cbl/COSGN00C.cbl:221-237]. Option '3' is 'User Update (Security)',
# program COUSR02C [app/cpy/COADM02Y.cpy:34-37], and COADM01C XCTLs to it with
# the COCOM01Y COMMAREA [app/cbl/COADM01C.cbl:115-145]. On that first entry
# CDEMO-CU02-USR-SELECTED is blank, so COUSR02C clears COUSR2AO and sends
# COUSR02 with empty entry fields and a blank ERRMSG, then returns TRANSID CU02
# [app/cbl/COUSR02C.cbl:90-105,135-138,266-278].
#
# Step 3: ENTER with TESTU002. PROCESS-ENTER-KEY reads USRSEC by that key with
# UPDATE; on NORMAL the record's names, password and type fill the map and the
# screen carries 'Press PF5 key to save your updates ...'
# [app/cbl/COUSR02C.cbl:143-172,320-339]. The task ends with RETURN, which
# releases the read-for-update.
# Step 4: PF5 with the last name erased (the adapter's EraseEOF with no text).
# Every COUSR02 entry field is FSET, so all come back. UPDATE-USER-INFO tests
# the fields in screen order: the user id and the first name are present, so
# the third WHEN fires on LNAMEI = SPACES OR LOW-VALUES, moves 'Last Name can
# NOT be empty...' to WS-MESSAGE, puts the cursor on LNAME and sends COUSR02
# [app/cbl/COUSR02C.cbl:122-123,177-213]. ERR-FLG-ON skips the second READ and
# the REWRITE [app/cbl/COUSR02C.cbl:215-245], so the USRSEC records stay as
# loaded.
#
# Expected values are derived from the source (no TPE region runs in CI):
# - COUSR2AO redefines COUSR2AI [app/cpy-bms/COUSR02.CPY:91], so step 4's
#   screen echoes the received fields: USRIDIN TESTU002, FNAME and USRTYPE as
#   fetched, LNAME empty (20 blanks as captured). Text values keep their full
#   BMS field width with trailing spaces; comparisons never trim.
# - PASSWD is a dark (DRK) field [app/bms/COUSR02.bms:130-134] whose text the
#   screen read never shows, so it is not asserted.
# - ERRMSG is the 78-byte ERRMSGO: the 29-character message and 49 spaces
#   (WS-MESSAGE X(80) moved to X(78)).
# - The header is POPULATE-HEADER-INFO's [app/cbl/COUSR02C.cbl:296-315]: the
#   COTTL01Y titles, CU02, COUSR02C, CURDATE as mm/dd/yy and CURTIME as
#   hh:mm:ss of the region clock through CSDAT01Y, hence the matchers and
#   clock_mode relative.
# TESTU002, its names and its password are invented data added to the USRSEC
# fixture; the user never signs on.
id: USR-COUSR02C-negative-04
level: e2e
type: negative
description: >-
  ADMIN001 signs on, chooses admin option 3 'User Update (Security)', fetches
  the invented user TESTU002 on the COUSR02 update screen, erases its last name
  and presses PF5. COUSR02C sends COUSR02 again with 'Last Name can NOT be
  empty...' in ERRMSG and the received values kept, and neither reads for
  update nor rewrites the USRSEC record, which stays as loaded.
inventory_ids:
- INV-USR-037  # COUSR02C message 'Last Name can NOT be empty...' (rule)
- INV-USR-003  # COUSR02C program
- INV-MNU-004  # COADM01 map, the admin menu option 3 is entered on
- INV-USR-007  # COUSR02 map, the update screen of steps 2-4
- INV-CFG-025  # CU02 transaction, under which the fetch and the refused save run
- INV-CFG-008  # USRSEC CSD file, read for update and asserted unchanged
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA COADM01C passes with the XCTL
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the header date and time
- INV-LAY-008  # CSMSG01Y copybook, copied by COUSR02C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-004  # user administration (USR) end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    # The 10 repository users, for the ADMIN001 sign-on, plus the user fetched.
    USRSEC:
      base: USRSEC
      records:
      - {SEC-USR-ID: TESTU002, SEC-USR-FNAME: TESTFIRST, SEC-USR-LNAME: TESTLAST, SEC-USR-PWD: TESTPWD2, SEC-USR-TYPE: U}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: ADMIN001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '3'}
    '@map': COADM01
  - aid: ENTER
    fields: {USRIDIN: TESTU002}
    '@map': COUSR02
  # The empty value erases the last name the fetch filled in.
  - aid: PF5
    fields: {LNAME: ''}
    '@map': COUSR02
expected:
  screens:
  - '@map': COADM01
    TRNNAME: CA00
    PGMNAME: COADM01C
    ERRMSG: '                                                                              '
  - '@map': COUSR02
    TRNNAME: CU02
    PGMNAME: COUSR02C
    USRIDIN: '        '
    FNAME: '                    '
    LNAME: '                    '
    USRTYPE: ' '
    ERRMSG: '                                                                              '
  - '@map': COUSR02
    TRNNAME: CU02
    PGMNAME: COUSR02C
    USRIDIN: TESTU002
    FNAME: 'TESTFIRST           '
    LNAME: 'TESTLAST            '
    USRTYPE: U
    ERRMSG: 'Press PF5 key to save your updates ...                                        '
  - '@map': COUSR02
    TRNNAME: CU02
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COUSR02C
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    USRIDIN: TESTU002
    FNAME: 'TESTFIRST           '
    LNAME: '                    '
    USRTYPE: U
    ERRMSG: 'Last Name can NOT be empty...                                                 '
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'Press PF5 key to save your updates ...                                        '
  - 'Last Name can NOT be empty...                                                 '
  file_state:
    # Every USRSEC record in key order, as loaded: TESTU002 keeps its last name,
    # and the ten fixture users are untouched.
    USRSEC:
      count: 11
      records:
      - {SEC-USR-ID: ADMIN001, SEC-USR-FNAME: 'MARGARET            ', SEC-USR-LNAME: 'GOLD                ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: A, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: ADMIN002, SEC-USR-FNAME: 'RUSSELL             ', SEC-USR-LNAME: 'RUSSELL             ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: A, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: ADMIN003, SEC-USR-FNAME: 'RAYMOND             ', SEC-USR-LNAME: 'WHITMORE            ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: A, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: ADMIN004, SEC-USR-FNAME: 'EMMANUEL            ', SEC-USR-LNAME: 'CASGRAIN            ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: A, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: ADMIN005, SEC-USR-FNAME: 'GRANVILLE           ', SEC-USR-LNAME: 'LACHAPELLE          ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: A, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: TESTU002, SEC-USR-FNAME: 'TESTFIRST           ', SEC-USR-LNAME: 'TESTLAST            ', SEC-USR-PWD: TESTPWD2, SEC-USR-TYPE: U, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: USER0001, SEC-USR-FNAME: 'LAWRENCE            ', SEC-USR-LNAME: 'THOMAS              ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: U, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: USER0002, SEC-USR-FNAME: 'AJITH               ', SEC-USR-LNAME: 'KUMAR               ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: U, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: USER0003, SEC-USR-FNAME: 'LAURITZ             ', SEC-USR-LNAME: 'ALME                ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: U, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: USER0004, SEC-USR-FNAME: 'AVERARDO            ', SEC-USR-LNAME: 'MAZZI               ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: U, SEC-USR-FILLER: '                       '}
