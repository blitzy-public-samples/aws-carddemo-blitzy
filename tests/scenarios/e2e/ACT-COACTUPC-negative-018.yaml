  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    OPTN002: '02. Account Update                      '
    ERRMSG: '                                                                              '
  - '@map': COACTUP
    TRNNAME: CAUP
    PGMNAME: COACTUPC
    ACCTSID: '           '
    INFOMSG: 'Enter or update id of account to update      '
    ERRMSG: '                                                                              '
  # The fetched account and customer, with the open date 2014-11-20.
  - '@map': COACTUP
    TRNNAME: CAUP
    PGMNAME: COACTUPC
    ACCTSID: '00000000001'
    OPNYEAR: '2014'
    OPNMON: '11'
    OPNDAY: '20'
