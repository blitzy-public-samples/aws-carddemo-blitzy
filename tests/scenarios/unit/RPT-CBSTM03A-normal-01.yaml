# CBSTM03A with its file service CBSTM03B on the repository data: one text and
# one HTML statement for each of the 50 cross-reference records.
#
# The run starts with the z/OS control-block walk from address 0
# [app/cbl/CBSTM03A.CBL:262-291]. On gnucobol-batch it reads the synthetic PSA,
# TCB and TIOT of tests/stubs/psa_tiot_shim.c, which the adapter preloads with
# the job, step and DD names of the CBSTM03A entry of programs.yaml: CREASTMT,
# STEP040 and its nine DDs in JCL order (GAP-STB-003). It runs only where the
# page-zero probe maps address 0, and is blocked elsewhere (GAP-MIS-002).
# TIOTJSTP is 8 bytes, so the step shows as 'STEP040 ' with its trailing space.
# The loop stops at the entry whose next 4 bytes are low-values, which is the
# last one, so HTMLFILE is shown by the DISPLAY after the loop; every UCB the
# shim supplies is valid.
#
# CBSTM03A then drives CBSTM03B through its O, R, K and C operations
# [app/cbl/CBSTM03A.CBL:296-342,726-919] [app/cbl/CBSTM03B.CBL:114-229]. It
# opens TRNXFILE and reads all 300 TRXFL records, in key order, into
# WS-TRNX-TABLE: 50 cards of 6 transactions, inside the 51 x 10 bounds. It opens
# XREFFILE, CUSTFILE and ACCTFILE, and for each cross-reference record, in card
# order, reads the customer and the account by key and writes the statement
# [app/cbl/CBSTM03A.CBL:316-339,345-723].
#
# Each text statement is 25 records of 80 bytes: the start banner; the name
# (CUST-FIRST-, -MIDDLE- and -LAST-NAME, each up to its first space, joined by
# single spaces); CUST-ADDR-LINE-1 and -2; line 3, state, country and zip
# joined the same way; the Basic Details block with ACCT-ID, ACCT-CURR-BAL
# edited 9(9).99- and the FICO score; the Transaction Summary heading; one line
# per transaction of the card (TRNX-ID, the first 49 bytes of TRNX-DESC, '$'
# and TRNX-AMT edited Z(9).99-); 'Total EXP:' with the sum of the card's
# amounts; the end banner. That is 25 x 50 = 1,250 records. Each HTML statement
# is a complete document of 130 records of 100 bytes, 130 x 50 = 6,500.
#
# TRXFL is the statement work file that CREASTMT builds from TRANSACT. Its
# datasets.yaml entry has no repository source, so its 300 records are written
# out here: the repository daily transactions restructured as the STEP010
# OUTREC FIELDS=(1:263,16,17:1,262,279:279,50) does, giving card number,
# transaction id, the rest of the record up to the merchant zip, the
# origination timestamp and the first 24 bytes of the blank processing
# timestamp, padded with spaces to 350 [app/jcl/CREASTMT.JCL:44-55]. TRNX-PROC-TS
# and the FILLER therefore keep their default spaces. Amounts are the decoded
# overpunch values of dailytran.txt.
#
# Expected text lines are full record width: decoded text keeps its trailing
# spaces and compares exactly. STMTFILE asserts the first statement whole and
# the total line of every other statement, each the sum of that card's
# DALYTRAN-AMT values in dailytran.txt; HTMLFILE asserts the first document
# whole. The observed baseline's raw datasets pin every byte of both.
id: RPT-CBSTM03A-normal-01
level: unit
type: normal
description: >-
  CBSTM03A on the repository cross-reference, customer and account files, with
  TRXFL built from the repository daily transactions: it displays the job, step
  and nine DD names the page-zero shim supplies, then writes one statement per
  cross-reference record in card order, 50 text statements of 25 lines (1,250
  records), each listing the card's six transactions and their 'Total EXP:'
  total, and 50 HTML documents of 130 lines (6,500 records), each listing the
  card's six transactions as table rows with no total, and ends with return
  code 0.
inventory_ids:
- INV-RPT-045  # CBSTM03A text statement (report)
- INV-RPT-004  # CBSTM03A program
- INV-RPT-005  # CBSTM03B program, listed through the RPT-CBSTM03A scenarios
- INV-RPT-046  # CBSTM03A HTML statement (report)
- INV-RPT-047  # CBSTM03A JCL step and DD display (report, conditional)
- INV-RPT-048  # CBSTM03A per-statement transaction total (calculation)
- INV-RPT-049  # CBSTM03B file service operations (interface): O, R, K and C here
- INV-LAY-004  # COSTM01 copybook, the TRXFL records
- INV-LAY-015  # CUSTREC copybook, the customer records
- INV-LAY-016  # CVACT01Y copybook, the account records
- INV-LAY-018  # CVACT03Y copybook, the cross-reference records
- INV-DTA-003  # cardxref.txt, the CARDXREF fixture source
- INV-DTA-013  # EBCDIC cross-reference file, its cross-check counterpart
- INV-DTA-004  # custdata.txt, the CUSTDATA fixture source
- INV-DTA-014  # EBCDIC customer file, its cross-check counterpart
- INV-DTA-001  # acctdata.txt, the ACCTDATA fixture source
- INV-DTA-011  # EBCDIC account data file, its cross-check counterpart
# dailytran.txt and its EBCDIC counterpart are not listed: the TRXFL records
# below transcribe them, so no fixture of this scenario is built from either
# file and neither one's verification depends on this scenario.
tags: []
gap_ids:
- GAP-STB-003  # page-zero PSA/TCB/TIOT shim in place of the z/OS control blocks
- GAP-MIS-002  # runs only where the page-zero probe maps address 0
- GAP-STB-010  # Berkeley DB indexed files in place of the VSAM KSDS
- GAP-STB-011  # GnuCOBOL compile and runtime options in place of Enterprise COBOL and LE
