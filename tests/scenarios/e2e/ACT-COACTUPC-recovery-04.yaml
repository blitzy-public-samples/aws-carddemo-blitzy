        ACCT-CURR-CYC-DEBIT: '0.00'
        ACCT-ADDR-ZIP: 'A000000000'
        ACCT-GROUP-ID: '          '
    # Customer 000000001 keeps the values loaded, FICO 700 rather than the 720
    # entered, and the 50 customers stay 50.
