# Derived baseline of scenario ACT-COACTUPC-negative-105 (capture_platform:
# derived), authored from the app/ source and never observed: no TPE region
# runs in CI. Open until a UniKix run of the app/ build is imported:
# GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012 (online-only
# copybooks such as CSSETATY and CSLKPCDY).
# Steps 1-3: USER0001 signs on, option 2 XCTLs to COACTUPC, and ENTER with
# account 00000000001 shows the fetched account and customer with the change
# prompt [app/cbl/COACTUPC.cbl:2787-2865,2955-2981].
# Step 4: the erased ACSPH1A reaches ACUP-NEW-CUST-PHONE-NUM-1A as LOW-VALUES
# [app/cbl/COACTUPC.cbl:1357-1362]; 1200-EDIT-MAP-INPUTS sets
# ACUP-CHANGES-NOT-OK and edits the fields in order, everything before Phone
# Number 1 passing on the fetched values. 1260-EDIT-US-PHONE-NUM skips its
# all-blank exit because the prefix is 555, and EDIT-AREA-CODE finds the area
# code LOW-VALUES: it sets INPUT-ERROR and the blank flag and, the message
# being still off, composes TRIM('Phone Number 1') ': Area code must be
# supplied.' (43 characters) into WS-RETURN-MSG; prefix 555 and line number
# 0101 pass, and every later edit leaves the message alone
# [app/cbl/COACTUPC.cbl:1632-1669,2225-2421].
# 2000-DECIDE-ACTION continues, so nothing is rewritten; 3250 sets
# PROMPT-FOR-CHANGES and moves the message to ERRMSG, CSSETATY moves '*' to
# the three-byte ACSPH1AO because the area code is blank on re-entry, and 3390
# brightens FKEY12 [app/cbl/COACTUPC.cbl:2955-2981,3393-3397,3566-3581]
# [app/cpy/CSSETATY.cpy:17-27].
# This pins the app/ text: the UniKix COACTUPC strings the untrimmed 25-byte
# WS-EDIT-VARIABLE-NAME twice before the literal, cut at 75 bytes
# (GAP-DOC-022); such a record is UniKix-copy behavior and never replaces
# this file.
# Screen values are full BMS width with trailing spaces kept (ERRMSG 78,
# INFOMSG 45, ACSPH1A 3), because screens compare exactly. CURDATE and CURTIME
# come from the region clock, so they are matchers, as the scenario names
# them. file_state holds the records as the preconditions materialize them,
# decoded through CVACT01Y and CVCUS01Y, unchanged because no REWRITE runs.
