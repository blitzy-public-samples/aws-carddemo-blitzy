# Manifest of the derived baseline of CFG-OPENFIL-normal-01: OPENFIL's one step
# OPCIFIL runs SDSF, and the region file inquiry after it lists all 14 fct.lst
# files open and enabled [app/jcl/OPENFIL.jcl:22-30]. Only unikix can run the
# scenario, so expected.yaml was authored from the sources, not captured, and is
# inferred-not-observed (GAP-INF-010; @REGION-FILES needs GAP-MIS-011, job
# submission GAP-MIS-006). It names no execution_id or execution_fingerprint
# and holds no datasets/.
# Only `python tests/harness/report.py --import-unikix <execution_id>` may change
# this baseline: an equal decoded outcome sets capture_platform: unikix and the
# run's execution_id and source_identity and bumps MINOR; a different outcome
# bumps MAJOR. The copy's SDSF.cbl is a no-op (GAP-DOC-031), so a UniKix record
# of this scenario is reported as UniKix-copy behavior and never verifies the
# app/ OPENFIL items.
#
# source_identity is what the unikix adapter deploys and runs for this job, as
# adapters.unikix.adapter.UniKixAdapter.source_identity computes it: tree
# unikix-copy, the zip's sha256, and the zip members read in memory (never
# extracted) with their sha256. They are the job member jcl/OPENFIL
# (byte-identical to app/jcl/OPENFIL.jcl), its program cbl/SDSF.cbl, the BPE
# catalog lists catlg/bpe/*.csv every job run uses, and catlg/tpe/fct.lst, the
# resource list behind the @REGION-FILES observation. source_commit is HEAD at
# authoring; app/ and samples/ there are byte-identical to the suite's starting
# commit 93ebec71ff7b59a68cedd7c501afe496a8eaa68d.
