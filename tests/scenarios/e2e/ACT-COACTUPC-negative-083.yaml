# COACTUPC's CSUTLDTC predicate for Date of Birth: once the COBOL date edits of
# CSUTLDPY accept a date, EDIT-DATE-LE calls CSUTLDTC with mask YYYYMMDD and
# refuses the date only when the CEEDAYS severity is not zero, composing 'Date of
# Birth validation error Sev code: <n> Message code: <n>' [app/cpy/CSUTLDPY.cpy:
# 284-327]. Only a date it accepts goes on to EDIT-DATE-OF-BIRTH, the check
# against the run date [app/cbl/COACTUPC.cbl:1533-1543] [app/cpy/CSUTLDPY.cpy:
# 341-370].
#
# Why the refusal is not asserted (observed-only): no date that passes the COBOL
# edits is known to be refused by CEEDAYS, so no input is known to reach the
# refusal branch, and this scenario pins the accepting outcome instead. The date
# entered, 1964-02-29, is a valid leap day, so it also runs the leap-year branch
# of EDIT-DAY-MONTH-YEAR before the call, and it lies before any run date, so
# EDIT-DATE-OF-BIRTH accepts it after the call. What CEEDAYS returns is
# unobserved (GAP-INF-001, GAP-MIS-010): EDIT-DATE-LE passes the 8-byte
# WS-EDIT-DATE-CCYYMMDD and WS-DATE-FORMAT to CSUTLDTC's 10-byte LS-DATE and
# LS-DATE-FORMAT, which pass their full length to CEEDAYS, so CEEDAYS also reads
# the 2 bytes after each area: the start of WS-EDIT-DATE-BINARY, still the zeros
# INITIALIZE WS-MISC-STORAGE left, because EDIT-DATE-OF-BIRTH sets it only after
# this call, and the spaces that INITIALIZE leaves in WS-SEVERITY
# [app/cpy/CSUTLDWY.cpy:4-37,58-62] [app/cbl/CSUTLDTC.cbl:84-117]
# [app/cbl/COACTUPC.cbl:866-867]. Whether a real CEEDAYS refuses this date is
# settled only by app/'s own CSUTLDTC, called from app/'s CSUTLDPY date edits,
# observed against a real CEEDAYS (the evidence GAP-INF-001 names). That needs
# the app/ sources built and run on a UniKix host (GAP-MIS-008). A unikix run
# executes the UniKix copy instead, whose CSUTLDTC and CSUTLDPY differ
# (GAP-DOC-021 and GAP-DOC-024 list INV-ACT-141; GAP-DOC-021 also INV-UTL-003),
# so its record is kept as UniKix-copy behaviour: it verifies neither item and
# cannot promote or replace this derived baseline.
#
# Steps 1-3 reach the fetched account as ACT-COACTUPC-alternate-04 does:
# USER0001 signs on through CC00, chooses option 2 (Account Update) on COMEN01,
# and enters account 00000000001. 9000-READ-ACCT reads CXACAIX by account id
# (card 9680294154603697, customer 000000001), ACCTDAT and CUSTDAT, and the
# screen shows them with 'Update account details presented above.', every
# editable field unprotected with its MDT on [app/cbl/COACTUPC.cbl:2568-2580,
# 2787-2865,2955-3000,3441-3561,3608-3884].
# Step 4 types 1964, 02 and 29 over the date-of-birth year, month and day
# (1961-06-08) and presses ENTER.
# - 1100-RECEIVE-MAP moves them to ACUP-NEW-CUST-DOB-YYYY-MM-DD
#   [app/cbl/COACTUPC.cbl:1256-1275]; 1205-COMPARE-OLD-NEW finds the change at
#   the date-of-birth comparison, so 1200-EDIT-MAP-INPUTS runs every field edit
#   [app/cbl/COACTUPC.cbl:1460-1470,1681-1777].
# - Every account field, the three account dates included, and the SSN pass on
#   the repository account and the invented customer, each date through its own
#   CSUTLDTC call with severity 0, as ACT-COACTUPC-negative-024, -039 and -054
#   pin. Date of Birth is moved as '19640229' under the name 'Date of Birth'
#   [app/cbl/COACTUPC.cbl:1533-1538]: EDIT-YEAR-CCYY accepts 1964 (century 19),
#   EDIT-MONTH 02, EDIT-DAY 29. In EDIT-DAY-MONTH-YEAR the month is February and
#   the day 29, so with WS-EDIT-DATE-YY-N 64 it divides 1964 by 4, finds
#   remainder 0 and goes on; all three date flags are valid, so it reaches
#   EDIT-DATE-LE [app/cpy/CSUTLDPY.cpy:18-282]. Severity 0 sets no error and
#   WS-EDIT-DATE-IS-VALID [app/cpy/CSUTLDPY.cpy:284-327].
# - WS-EDIT-DT-OF-BIRTH-ISVALID holds, so EDIT-DATE-OF-BIRTH runs: the run date's
#   day number is greater than that of 1964-02-29 for every run date after it,
#   so no error is set [app/cbl/COACTUPC.cbl:1539-1543]
#   [app/cpy/CSUTLDPY.cpy:341-370].
# - Every later edit passes on the invented customer below, so no INPUT-ERROR
#   is set and ACUP-CHANGES-OK-NOT-CONFIRMED stands [app/cbl/COACTUPC.cbl:
#   1545-1676]. 2000-DECIDE-ACTION continues on that state without PF5, so
#   9600-WRITE-PROCESSING, the only READ UPDATE and REWRITE path, does not run
#   [app/cbl/COACTUPC.cbl:2602-2621].
# - 3203-SHOW-UPDATED-VALUES shows the received values, the date of birth as
#   typed and the amounts re-edited through +ZZZ,ZZZ,ZZZ.99; 3250 sets
#   PROMPT-FOR-CONFIRMATION; 3300 leaves every field protected; 3390 makes
#   F5=Save and F12=Cancel bright [app/cbl/COACTUPC.cbl:2870-2951,2955-2983,
#   3001-3003,3566-3584].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte field; ERRMSG is the blank
#   75-byte WS-RETURN-MSG in the 78-byte field, so neither 'Date of Birth
#   validation error Sev code' nor 'Date of Birth:cannot be in the future'
#   appears [app/cbl/COACTUPC.cbl:462-479,2979-2981]. Fields are compared at
#   their full BMS length, trailing spaces kept.
# - FKEY05 and FKEY12 keep their INITIAL text; a dark (ASKIP,DRK) field is
#   captured as blanks, as on screen 3.
# - The tpe adapter enters a field with EraseEOF before typing; the date-of-birth
#   fields are 4, 2 and 2 bytes, so the values fill them.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative; the accepting outcome holds for any run date after
#   1964-02-29, so it does not depend on the absolute date.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, so the date of birth is the only field the scenario exercises: the
# repository record has FICO 274, below 300, and zip 12546, which is not a
# North Carolina zip [app/cbl/COACTUPC.cbl:2514-2558]. Account 00000000001 and
# its cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-083
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001, whose customer's date of birth is 1961-06-08, changes it
  to the leap day 1964-02-29 and presses ENTER. The COBOL date edits accept the
  date, CSUTLDTC, called with mask YYYYMMDD, is expected to return severity 0,
  and the date lies before the run date, so COACTUPC shows the changed values,
  protected, with 'Changes validated.Press F5 to save', no 'Date of Birth
  validation error Sev code' or 'cannot be in the future' message, and the
  F5=Save and F12=Cancel keys made visible. Nothing is saved before PF5:
  ACCTDATA and CUSTDATA still hold the fetched records.
# Primary item first, then the CSUTLDTC date acceptance this outcome rests on,
# the program, the maps asserted, the transaction of steps 3 and 4, the CSD
# files COACTUPC reads, and the online-only copybooks it copies. The
# confirmation message (INV-ACT-031) is asserted but verified by its own
# scenario; sign-on (CC00, COSGN00, USRSEC) and the menu transaction by the SEC
# and MNU scenarios; the batch record copybooks and the data files at the
# lowest level that executes them.
inventory_ids:
- INV-ACT-141  # COACTUPC Date of Birth: CSUTLDTC severity 0 for mask YYYYMMDD (EDIT-DATE-LE)
- INV-UTL-003  # CSUTLDTC date acceptance for masks YYYY-MM-DD and YYYYMMDD
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and confirmation screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the per-field error attributes, none set here
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the date edits, the EDIT-DATE-LE call and EDIT-DATE-OF-BIRTH
- INV-LAY-014  # CSUTLDWY: WS-EDIT-DATE-CCYYMMDD, WS-DATE-FORMAT and the CSUTLDTC result
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
- observed-only
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# Which dates CEEDAYS accepts is known only through the stub, and whether
# UniKix supplies CEEDAYS at all is unknown.
- GAP-INF-001
- GAP-MIS-010
# The open uncertain-purpose question of the EDIT-DATE-LE refusal and its
# composed message, which no known input runs, so the accepting outcome, derived
# from the source rather than observed, is pinned instead (observed-only).
# GAP-UNC-017 asks that question and lists this item; GAP-UNC-013 asks about
# code no field performs or no statement sets, which this predicate is not, so
# it is not cited.
- GAP-UNC-017
# The UniKix copy changes code this scenario passes through: CSUTLDTC's
# Vstring lengths (021), COACTUPC's amount edits and change detection (022),
# CSUTLDPY's date edits and message names (024) and COACTUP's row 1, where
# TRNNAME stands (025). A unikix run therefore observes the copy's behaviour
# of those parts.
- GAP-DOC-021
- GAP-DOC-022
- GAP-DOC-024
- GAP-DOC-025
