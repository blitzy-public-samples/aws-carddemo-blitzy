# Derived baseline of scenario USR-COUSR01C-alternate-01, authored from the
# source and never captured: no TPE region runs in CI. Open until a UniKix run
# is imported: GAP-INF-004 (derived USR end-to-end baselines) and GAP-INF-012
# (online-only copybooks).
# One screen per step, each the one shown after that step's AID:
# 1. ENTER on COSGN00 as ADMIN001: COSGN00C routes the type-A user to COADM01C
#    with context 0 [app/cbl/COSGN00C.cbl:221-234]; only the map is asserted.
# 2. ENTER with option 2: COADM01C XCTLs to COUSR01C, whose first entry sends
#    COUSR01 with its own CU01/COUSR01C header and a blank message
#    [app/cbl/COADM01C.cbl:135-145] [app/cbl/COUSR01C.cbl:36-37,73-87,184-233].
# 3. PF3 on COUSR01: COUSR01C XCTLs to COADM01C with context 0
#    [app/cbl/COUSR01C.cbl:93-95,165-178], which sends the admin menu afresh:
#    the COTTL01Y titles, the four COADM02Y options strung into 40 bytes,
#    OPTN005-OPTN012 blank, an empty OPTION and a blank ERRMSG
#    [app/cbl/COADM01C.cbl:77-90,172-263] [app/cpy/COADM02Y.cpy:20-42].
# Values are full BMS field width with trailing spaces kept. CURDATE and CURTIME
# come from the region clock, so they are matchers.
screens:
- '@map': COADM01
- '@map': COUSR01
  ERRMSG: '                                                                              '
  PGMNAME: COUSR01C
  TRNNAME: CU01
- '@map': COADM01
  CURDATE:
    format: '%m/%d/%y'
    match: run-date
  CURTIME:
    match: run-time
  ERRMSG: '                                                                              '
  OPTION: '  '
  OPTN001: '01. User List (Security)                '
  OPTN002: '02. User Add (Security)                 '
  OPTN003: '03. User Update (Security)              '
  OPTN004: '04. User Delete (Security)              '
  OPTN005: '                                        '
  OPTN006: '                                        '
  OPTN007: '                                        '
  OPTN008: '                                        '
  OPTN009: '                                        '
  OPTN010: '                                        '
  OPTN011: '                                        '
  OPTN012: '                                        '
  PGMNAME: COADM01C
  TITLE01: '      AWS Mainframe Modernization       '
  TITLE02: '              CardDemo                  '
  TRNNAME: CA00
