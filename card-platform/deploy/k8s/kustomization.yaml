# The one place the six platform image references live.
#
# What it holds. The six platform image references, so pinning them by digest is one edit
# here rather than six spread across six Deployments, with the procedure below beside the
# values it changes. The tag they carry today, 1.0.0-SNAPSHOT, is mutable.
# Design decisions: card-platform/docs/decision-log.md.
#
# The two kinds of image this folder references, and how each is identified:
#
#   upstream  apache/kafka in 10-kafka.yaml and postgres in 20-postgres.yaml. Both are
#             pulled from a registry and both are pinned by digest.
#   platform  the six below. They are built from card-platform/services/*/Dockerfile on
#             the machine that deploys them and loaded into the cluster. A locally built
#             image carries no manifest digest: `docker inspect` reports an empty
#             RepoDigests list until the image is pushed to a registry.
#
# What the demo path does. The six Deployments set imagePullPolicy: Never, so the kubelet
# runs the image an operator loaded with deploy/k8s/load-images.sh or refuses the Pod and
# says so. This project pushes no image to any registry.
#
# How a real deployment pins these. Publish the six images to a registry the deployment
# owns, then set each entry below to that registry and to the digest the push reported.
# `newTag` and `digest` are mutually exclusive; replacing one with the other is the whole
# edit, and it is an edit to this file:
#
#   - name: carddemo/authorization-service
#     newName: registry.example.internal/carddemo/authorization-service
#     digest: sha256:<digest>
#
# Repeat per service, drop the imagePullPolicy: Never patch below so the digest is pulled
# and verified, then read the result back with `kubectl kustomize card-platform/deploy/k8s`
# before applying with `kubectl apply -k card-platform/deploy/k8s`. A digest reference is
# content-addressed: a node that resolves it either gets those exact bytes or fails.
#
# An operator holding the standalone kustomize binary can make the same edit in one command,
# which `kubectl` cannot: it embeds the renderer but not the `edit` subcommand, so the line
# below needs a tool nothing else here does.
#
#   kustomize edit set image \
#     carddemo/authorization-service=registry.example.internal/carddemo/authorization-service@sha256:<digest>
#
# What this file does not do. It does not publish an image, sign one, or verify a
# signature. card-platform/deploy/k8s/README.md states what is verified and what is not,
# and card-platform/docs/suggested-next-tasks.md carries the publish-sign-verify task.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace every resource below belongs to, declared by 00-namespace.yaml.
namespace: carddemo

resources:
  - 00-namespace.yaml
  - 10-kafka.yaml
  - 20-postgres.yaml
  - 30-configmap.yaml
  - 40-authorization-service.yaml
  - 41-ledger-posting-service.yaml
  - 42-fraud-detection-service.yaml
  - 43-notification-service.yaml
  - 44-account-service.yaml
  - 45-card-service.yaml

# 31-secret.example.yaml is deliberately absent from the list above. It is a template
# carrying refused values, and applying it would create Secrets no service can start on.
# card-platform/docs/onboarding.md documents generating the real Secrets from it.

images:
  # newTag names the tag the local build produces, which is the Maven project version and
  # the same tag card-platform/docker-compose.yml runs. Replace newTag with
  # `digest: sha256:<digest>` and newName with your own registry to pin, one entry at a
  # time or all six.
  - name: carddemo/authorization-service
    newName: carddemo/authorization-service
    newTag: 1.0.0-SNAPSHOT
  - name: carddemo/ledger-posting-service
    newName: carddemo/ledger-posting-service
    newTag: 1.0.0-SNAPSHOT
  - name: carddemo/fraud-detection-service
    newName: carddemo/fraud-detection-service
    newTag: 1.0.0-SNAPSHOT
  - name: carddemo/notification-service
    newName: carddemo/notification-service
    newTag: 1.0.0-SNAPSHOT
  - name: carddemo/account-service
    newName: carddemo/account-service
    newTag: 1.0.0-SNAPSHOT
  - name: carddemo/card-service
    newName: carddemo/card-service
    newTag: 1.0.0-SNAPSHOT
