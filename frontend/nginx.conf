# =============================================================================
# frontend/nginx.conf
#
# Complete nginx main configuration that serves the production build of the
# CardDemo React 19 single-page application (Vite output) and provides SPA
# history fallback so that client-side (react-router-dom) routes resolve on a
# hard reload or a deep link. The SPA replaces the 17 legacy BMS 3270 mapsets.
#
# Runtime contract (frontend/Dockerfile + root docker-compose.yml):
#   - nginx listens on container port 80; Docker Compose maps host port 3000 to
#     container port 80 (published as 3000:80).
#   - The Vite build output (dist/) is copied to /usr/share/nginx/html.
#   - This file is a full main configuration and is copied to
#     /etc/nginx/nginx.conf; it is validated with `nginx -t -c`.
#
# API contract:
#   The SPA reaches the api-gateway through an absolute base URL provided at
#   build time via import.meta.env.VITE_API_BASE_URL (default
#   http://localhost:8080), so nginx does NOT proxy the API and the gateway
#   allows CORS from the frontend origin. An optional same-origin
#   `location /api/ { proxy_pass ...; }` is intentionally omitted to keep the
#   VITE_API_BASE_URL contract authoritative.
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Access log to the container's stdout (symlinked in the nginx image) so the
    # request stream is captured by the platform's log/observability pipeline.
    access_log  /var/log/nginx/access.log;

    # Connection and transfer tuning (stock nginx defaults).
    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    # Do not advertise the nginx version on responses or error pages.
    server_tokens  off;

    # -------------------------------------------------------------------------
    # gzip compression for text-based assets. Vite already minifies its bundles;
    # gzip further reduces transfer size to help meet the response-time budget.
    # Pre-compressed binary formats (e.g. woff2) are intentionally not listed.
    # -------------------------------------------------------------------------
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_comp_level    6;
    gzip_proxied       any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen       80;
        server_name  _;

        # Vite build output (dist/) is copied here by frontend/Dockerfile.
        root   /usr/share/nginx/html;
        index  index.html;

        # index.html must never be cached aggressively so that a new deploy,
        # which references freshly content-hashed asset filenames, is picked up
        # immediately by returning clients.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # Content-hashed bundle files (JS, CSS, images, fonts) are emitted under
        # /assets/ by Vite. The filename changes whenever the content changes, so
        # these responses can be cached immutably for a long period. A missing
        # asset returns 404 rather than falling back to index.html.
        location /assets/ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            try_files  $uri =404;
        }

        # SPA history fallback: serve index.html for any path that is not a real
        # file or directory, allowing react-router-dom to resolve deep links and
        # hard reloads (e.g. /accounts/123, /cards) on the client.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
