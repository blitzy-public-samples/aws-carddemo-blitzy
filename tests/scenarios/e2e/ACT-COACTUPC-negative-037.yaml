# COACTUPC refuses an expiry date of 30 February: the Expiry Date edit of
# EDIT-DAY-MONTH-YEAR composes 'Expiry Date:Cannot have 30 days in this
# month.' and nothing is saved.
#
# Steps 1-3 sign on as USER0001, choose main-menu option 2 (Account Update)
# and fetch account 00000000001, as ACT-COACTUPC-alternate-04 does: CXACAIX by
# account id gives card 9680294154603697 and customer 000000001 (line 49 of
# app/data/ASCII/cardxref.txt), ACCTDAT and CUSTDAT are read without UPDATE,
# ACUP-SHOW-DETAILS is set, and 3320-UNPROTECT-FEW-ATTRS gives every editable
# field DFHBMFSE, so all of them come back on the next AID
# [app/cbl/COACTUPC.cbl:2568-2580,3500-3561,3608-3884].
# Step 4 types month 02 and day 30 over the expiry date 2025-05-20 (year 2025
# retyped) and presses ENTER. The task starts with WS-RETURN-MSG blank
# [app/cbl/COACTUPC.cbl:876]; 1205-COMPARE-OLD-NEW finds a change and
# 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK, then edits the fields in
# screen order [app/cbl/COACTUPC.cbl:1470-1495,1683-1777]. Account Status Y,
# Open Date 2014-11-20 and Credit Limit +2,020.00 pass, as in
# ACT-COACTUPC-alternate-04. For Expiry Date, EDIT-DATE-CCYYMMDD THRU
# EDIT-DATE-CCYYMMDD-EXIT accepts year 2025 (century 20), month 02 and day 30
# (1 to 31), and EDIT-DAY-MONTH-YEAR, past the 31-day check, finds WS-FEBRUARY
# and WS-DAY-30: it sets INPUT-ERROR and the month and day flags, STRINGs
# TRIM('Expiry Date') and ':Cannot have 30 days in this month.' into the blank
# WS-RETURN-MSG and goes to EDIT-DATE-CCYYMMDD-EXIT, so CSUTLDTC is not called
# [app/cpy/CSUTLDPY.cpy:209-241,329] [app/cpy/CSUTLDWY.cpy:16-31]. Every later
# edit tests WS-RETURN-MSG-OFF before composing, so this first message stands.
# The invented customer 000000001 passes every customer edit (FICO 700, area
# code 919, state NC with zip 27601 [app/cpy/CSLKPCDY.cpy:521,895,1186]), so
# the expiry date is the only field refused.
# 2000-DECIDE-ACTION only continues on ACUP-CHANGES-NOT-OK, so
# 9600-WRITE-PROCESSING, the only READ UPDATE and REWRITE path, does not run
# [app/cbl/COACTUPC.cbl:2596-2605]. ACUP-CHANGES-MADE holds for 'E', so
# 3203-SHOW-UPDATED-VALUES shows the received values, the amounts re-edited
# through +ZZZ,ZZZ,ZZZ.99; 3250-SETUP-INFOMSG sets PROMPT-FOR-CHANGES and
# moves WS-RETURN-MSG to ERRMSG; 3390-SETUP-INFOMSG-ATTRS makes F12=Cancel
# bright and leaves F5=Save dark; CSSETATY turns EXPMON and EXPDAY red without
# replacing their text, since neither flag is BLANK
# [app/cbl/COACTUPC.cbl:654-668,2712-2724,2870-2951,2955-2982,3566-3581]
# [app/cpy/CSSETATY.cpy:18-27].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   ERRMSG is the 46-character message in the 75-byte WS-RETURN-MSG, shown in
#   the 78-byte ERRMSGO; INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte
#   field. Field colours and the cursor position are not captured.
# - FKEY05 keeps its INITIAL text but stays dark (ASKIP,DRK), which the s3270
#   capture renders as blanks.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
id: ACT-COACTUPC-negative-037
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update) and fetches
  account 00000000001, then changes its expiry date from 2025-05-20 to
  2025-02-30 and presses ENTER. COACTUPC refuses the date with 'Expiry
  Date:Cannot have 30 days in this month.' in the message line, shows the
  entered values again with 'Update account details presented above.' and
  F12=Cancel, and writes nothing: ACCTDATA and CUSTDATA keep the fetched
  records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-095  # COACTUPC Expiry Date: no 30th of February (rule)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refusal screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edit
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attributes of the expiry month and day
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-DATE-CCYYMMDD and EDIT-DAY-MONTH-YEAR
- INV-LAY-014  # CSUTLDWY: WS-FEBRUARY and WS-DAY-30
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY drops TRIM from the field name of every composed
# date-edit message, so ERRMSG differs on UniKix.
- GAP-DOC-024
# Beyond the planned gap list, as in the other COACTUPC scenarios: the UniKix
# COACTUPC comments out the TEST-NUMVAL-C amount checks, so the amounts on
# screen 4 may differ on UniKix, and the UniKix COACTUP.bms differs at row 1,
# columns 1-9, where TRNNAME stands.
- GAP-DOC-022
- GAP-DOC-025
