# COACTUPC account REWRITE: USER0001 raises the credit limit of account
# 00000000001 from 2020.00 to 3000.00 on the Account Update screen and saves it.
#
# Step 1 signs on through CC00; COSGN00C routes the type-U user to the main menu
# COMEN01, asserted by its header only (sign-on belongs to SEC-COSGN00C).
# Step 2 enters option 2: COMEN01C transfers control to COACTUPC, which takes its
# fresh-entry path and sends COACTUP with the search-key prompt
# [app/cbl/COMEN01C.cbl:115-156] [app/cbl/COACTUPC.cbl:964-973,2955-2983].
# Step 3 enters the account id. 9000-READ-ACCT reads CXACAIX by account (card
# 9680294154603697, customer 000000001), then ACCTDAT and CUSTDAT, keeps the
# values in the COMMAREA as ACUP-OLD-DETAILS and shows them with 'Update account
# details presented above.' [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3608-3884].
# Amounts are edited through PIC +ZZZ,ZZZ,ZZZ.99 [app/cbl/COACTUPC.cbl:371].
# Account Group shows ACCT-GROUP-ID (columns 113-122), blank in every repository
# account (GAP-DEF-005). Every field is sent with FSET (DFHBMPRF or DFHBMFSE), so
# each later ENTER or PF5 returns every field [app/cbl/COACTUPC.cbl:3441-3561].
# Step 4 replaces the credit limit with 3000.00: the adapter erases the field
# before typing and BMS pads it with blanks, TEST-NUMVAL-C accepts it and NUMVAL-C
# gives 3000.00 [app/cbl/COACTUPC.cbl:1073-1084]. 1205-COMPARE-OLD-NEW finds the
# change and every edit of 1200-EDIT-MAP-INPUTS passes, so the change action
# becomes 'N': the screen shows the received values (3203-SHOW-UPDATED-VALUES)
# with 'Changes validated.Press F5 to save' and makes F5=Save and F12=Cancel
# visible [app/cbl/COACTUPC.cbl:1429-1676,2870-2949,3566-3583].
# Step 5 presses PF5. 9600-WRITE-PROCESSING reads ACCTDAT and CUSTDAT for update,
# finds both unchanged since the fetch (9700-CHECK-CHANGE-IN-REC), builds
# ACCT-UPDATE-RECORD from the received values and REWRITEs ACCTDAT, then CUSTDAT.
# The action becomes 'C' and the screen shows 'Changes committed to database'
# with the keys dark again [app/cbl/COACTUPC.cbl:2602-2615,2968-2969,3888-4104].
#
# The rewritten account, derived from 9600 and the ACCT-UPDATE-RECORD layout
# [app/cbl/COACTUPC.cbl:418-433,3956-4002]:
# - id, status, balance, cash limit and cycle amounts are moved back unchanged,
#   ACCT-CREDIT-LIMIT is 3000.00, and the three dates are rebuilt by STRING as
#   YYYY-MM-DD, equal to the fetched ones.
# - ACCT-UPDATE-RECORD has no ACCT-ADDR-ZIP: its ACCT-UPDATE-GROUP-ID lies at
#   columns 103-112, which CVACT01Y reads as ACCT-ADDR-ZIP. The blank Account
#   Group field comes back as spaces (step 4) or nulls (step 5), which
#   1100-RECEIVE-MAP turns into LOW-VALUES [app/cbl/COACTUPC.cbl:1213-1218], so
#   the group id 'A000000000' the repository keeps there (GAP-DEF-005) becomes
#   ten x'00', written below as YAML "\0" escapes. Pinned as a suspected defect
#   (GAP-DEF-016), never fixed.
# - Columns 113-300 (CVACT01Y's ACCT-GROUP-ID and FILLER) are ACCT-UPDATE-RECORD's
#   FILLER, which INITIALIZE skips and nothing sets. Their content depends on the
#   platform's initialization of working storage without VALUE, so they are not
#   asserted.
# The other 49 accounts are unchanged. The customer REWRITE is the item of its
# own scenario, so CUSTDATA is not asserted here.
#
# Customer 000000001 is replaced by invented data that passes every edit; the
# repository customer's FICO score 274 would fail 1275-EDIT-FICO-SCORE. The names
# are alphabetic, Address Line 1 is supplied, NC is a valid state and NC27 a valid
# state and zip prefix, 919 is a general-purpose area code, SSN part 1 is not 000,
# 666 or 900-999, the date of birth precedes any run date, FICO 700 is within
# 300-850, the EFT account id is numeric and non-zero, and the primary-holder flag
# is Y [app/cbl/COACTUPC.cbl:1472-1669,2431-2558] [app/cpy/CSLKPCDY.cpy:521,1013,1073].
#
# Screen values are whole fields at their BMS length, trailing spaces kept. Fields
# left at LOW-VALUES and dark (DRK) fields read as blanks in the s3270 capture.
# The customer text fields are not asserted: from step 4 on they echo the received
# input, which the region's uppercase translation of input may change. CURDATE
# and CURTIME come from the run clock through CSDAT01Y, hence the matchers and
# clock_mode relative.
id: ACT-COACTUPC-normal-03
level: e2e
type: normal
description: >-
  USER0001 signs on, chooses main menu option 2 'Account Update', fetches account
  00000000001, changes its credit limit from 2020.00 to 3000.00 (ENTER gives
  'Changes validated.Press F5 to save') and saves with PF5, which gives 'Changes
  committed to database'. COACTUPC rewrites the ACCTDAT record with the credit
  limit 3000.00 and every other account field moved back from the screen, except
  that columns 103-112 (ACCT-ADDR-ZIP) receive the blank Account Group as ten
  x'00'; the other 49 accounts are unchanged.
# Primary item first, then the program, the maps asserted, the transaction the
# update runs under, the CSD files it reads and rewrites, and the online-only
# copybooks COACTUPC copies. Batch copybooks and data-file items are verified at
# the batch levels.
inventory_ids:
- INV-ACT-192  # COACTUPC account REWRITE (interface)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, steps 2-5
- INV-CFG-009  # CAUP transaction
- INV-CFG-006  # CXACAIX CSD file, the cross-reference read by account
- INV-CFG-001  # ACCTDAT CSD file, read, read for update and rewritten
- INV-CFG-005  # CUSTDAT CSD file, read, read for update and rewritten
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the header date and time
- INV-LAY-008  # CSMSG01Y copybook
- INV-LAY-007  # CSLKPCDY copybook, the area code, state and zip lookups
- INV-LAY-009  # CSMSG02Y copybook
- INV-LAY-010  # CSSETATY copybook, the field attribute settings
- INV-LAY-011  # CSSTRPFY copybook, the AID mapping that recognizes PF5
- INV-LAY-013  # CSUTLDPY copybook, the date edits of step 4
- INV-LAY-014  # CSUTLDWY copybook, the date edit work areas
- INV-LAY-019  # CVCRD01Y copybook, the AID and account work area
tags:
- inferred-not-observed
- suspected-defect
gap_ids:
- GAP-INF-005  # account (ACT) end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-DOC-022  # the UniKix copy of COACTUPC changes the amount edits the credit limit passes through
- GAP-DOC-025  # the UniKix COACTUP.bms changes row 1, where TRNNAME is asserted
- GAP-DEF-005  # the repository keeps the group id in ACCT-ADDR-ZIP (columns 103-112)
- GAP-DEF-016  # the account rewrite puts the Account Group field there and leaves columns 113-300 unset
