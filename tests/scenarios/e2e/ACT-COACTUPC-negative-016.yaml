    ACSFNAM: 'Testfirst                '
    ACSMNAM: 'Testmiddle               '
    ACSLNAM: 'Testlast                 '
    ACSADL1: '100 Test Street                                   '
    ACSSTTE: 'NC'
    ACSADL2: 'Suite 1                                           '
    ACSZIPC: '27601'
