# Derived baseline (capture_platform: derived in manifest.yaml) for
# RPT-CORPT00C-alternate-03, authored from the source because only unikix can
# run the scenario. The scenario is tagged inferred-not-observed (GAP-INF-009,
# GAP-INF-012); `report.py --import-unikix <execution_id>` replaces this file
# on eligible evidence.
#
# CR00 entered with no COMMAREA: CORPT00C sends no screen and XCTLs, with a
# COMMAREA, to COSGN00C [app/cbl/CORPT00C.cbl:172-174,540-551]. COSGN00C sees
# EIBCALEN > 0 and EIBAID ENTER, receives nothing from the unformatted input,
# and sends COSGN00 with 'Please enter User ID ...'; the step's ENTER on that
# screen with no field typed sends the same screen again
# [app/cbl/COSGN00C.cbl:80-88,108-122,145-157,177-200].
#
# Keys are exactly those the scenario's expected asserts, ERRMSG included: the
# landing screen is COSGN00C's answer to an empty sign-on, not its first send.
# Values are full BMS width, trailing spaces kept [app/bms/COSGN00.bms]; the
# clock fields are matchers because the UniKix clock is not set (relative).
messages:
- 'Please enter User ID ...                                                      '
screens:
- '@map': COSGN00
  CURDATE:
    format: '%m/%d/%y'
    match: run-date
  CURTIME:
    format: '%H:%M:%S '
    match: run-time
  ERRMSG: 'Please enter User ID ...                                                      '
  PGMNAME: COSGN00C
  TITLE01: '      AWS Mainframe Modernization       '
  TITLE02: '              CardDemo                  '
  TRNNAME: CC00
  USERID: '        '
