# card-platform — the local demo environment.
# Starts one Kafka broker, one PostgreSQL instance and the six services.
#
# From this directory, and from a clean clone:
#
#     cp .env.example .env
#     docker compose up -d --build
#
# Every services/*/Dockerfile packages its module inside the image from the
# card-platform build context, so no archive has to be built on the host first.
# Two of the six modules do not yet carry an application entry point and their
# image build stops on that; the other four build and start.
#
---
# CLONE_INDEX suffixes the project name. A second checkout runs its own stack.
name: card-platform${CLONE_INDEX:-}

# Shared blocks. Each service below points at these with a YAML alias.

# Startup order for a service that reaches the broker only through its outbox
# relay. The relay retries on a timer, so the broker does not have to answer for
# the service to start and serve. No service waits for another service.
x-database-only: &database-only
  postgres:
    condition: service_healthy

# Startup order for a service that registers a listener. A listener joins a
# consumer group at startup, so the broker answers first.
x-database-and-broker: &database-and-broker
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy

# Readiness probe. It reads /actuator/health on the management port with curl,
# wget or bash, whichever the runtime image carries. /bin/sh cannot open
# /dev/tcp, so the bash form names bash. Actuator answers on the management port
# alone, so the probe does not name the service port.
x-actuator-healthcheck: &actuator-healthcheck
  test:
    - CMD-SHELL
    - >-
      curl -fsS http://127.0.0.1:${MANAGEMENT_PORT:-9080}/actuator/health >/dev/null 2>&1
      || wget -q -O /dev/null http://127.0.0.1:${MANAGEMENT_PORT:-9080}/actuator/health 2>/dev/null
      || bash -c 'exec 3<>/dev/tcp/127.0.0.1/${MANAGEMENT_PORT:-9080}
      && printf "GET /actuator/health HTTP/1.0\r\n\r\n" >&3
      && head -1 <&3 | grep -q 200'
  interval: 10s
  timeout: 10s
  retries: 24
  start_period: 60s

# Settings every service reads. Inside this network the database always answers
# on 5432 and the broker on kafka:29092, whatever the host ports are.
x-service-environment: &service-environment
  SERVER_PORT: 8080
  # /actuator answers here and nowhere else, and the mapping below publishes this
  # port on 127.0.0.1 alone. A client of the service port reaches no runtime,
  # database or broker internals.
  MANAGEMENT_PORT: ${MANAGEMENT_PORT:-9080}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-carddemo}
  # No fallback: an unset POSTGRES_PASSWORD stops the stack rather than signing on
  # under a password this repository publishes. Set it in .env.
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set; copy .env.example to .env}
  SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
  LOGGING_LEVEL_ROOT: ${LOG_LEVEL:-INFO}
  # INFO by default. A DEBUG default retains identifiers in centralized logs.
  LOGGING_LEVEL_COM_CARDDEMO: ${LOG_LEVEL_CARDDEMO:-INFO}
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS:-health,metrics,prometheus}

services:

  # PostgreSQL. One instance, six private databases, one per service.
  postgres:
    # Digest-pinned so a rebuilt tag cannot change the image under the stack.
    image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    container_name: card-platform${CLONE_INDEX:-}-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carddemo}
      POSTGRES_USER: ${POSTGRES_USER:-carddemo}
      # No fallback: an unset password stops the stack rather than creating the
      # superuser with a password this repository publishes.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set; copy .env.example to .env}
      # Names the six databases the provisioning program creates. It checks every
      # name against a strict identifier pattern before it runs a statement.
      SERVICE_DATABASE_NAMES: >-
        ${AUTHORIZATION_DB_NAME:-carddemo_authorization}
        ${LEDGER_DB_NAME:-carddemo_ledger}
        ${FRAUD_DB_NAME:-carddemo_fraud}
        ${NOTIFICATION_DB_NAME:-carddemo_notification}
        ${ACCOUNT_DB_NAME:-carddemo_account}
        ${CARD_DB_NAME:-carddemo_card}
    ports:
      # Bound to the loopback address, so only this machine reaches the database.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    # The program that creates the six databases. Flyway then creates and migrates
    # one schema inside each. No schema object is defined here.
    configs:
      - source: service_databases
        target: /usr/local/bin/provision-databases.sh
        mode: 0555
    # The database entry point runs a program in /docker-entrypoint-initdb.d once,
    # on an empty data directory, and skips it on every later start. A name
    # refused on the first start would therefore leave databases missing with no
    # way to add them but discarding the volume. This wrapper runs the program on
    # every start instead, and the program creates only what is absent.
    #
    # The program waits for the server to answer on 127.0.0.1. It never waits for
    # the container health state, because the healthcheck below waits for the
    # program: each would then wait for the other.
    command:
      - /bin/bash
      - -c
      - |
        /usr/local/bin/provision-databases.sh &
        exec docker-entrypoint.sh postgres
    # A PostgreSQL 18 image keeps its data under /var/lib/postgresql/18, so the
    # mount point sits one level above that and covers every version directory.
    volumes:
      - postgres-data:/var/lib/postgresql
    # Healthy means two things: the server answers, and every service database
    # exists. A refused name leaves the file unwritten, so a partial set cannot
    # report healthy and depends_on holds every service back until the set is
    # complete.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U ${POSTGRES_USER:-carddemo} -d ${POSTGRES_DB:-carddemo}
          && test -f /tmp/service-databases-ready
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - carddemo
    restart: unless-stopped

  # Apache Kafka. One node runs as broker and controller in Kafka Raft (KRaft)
  # mode. Three listeners: services reach kafka:29092, host tooling reaches
  # localhost:${KAFKA_PORT:-9092}, and KRaft talks to itself on 9093.
  kafka:
    # Digest-pinned so a rebuilt tag cannot change the image under the stack.
    image: apache/kafka:4.2.1@sha256:9916d60eca5d599550e2c320230808fda342124ba550bb4ac4ea8591803262a0
    container_name: card-platform${CLONE_INDEX:-}-kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-cardDemoPlatformKRaft1}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      # One node holds one copy of every partition.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_NUM_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The broker creates no topic on demand. The command below creates the nine
      # topics this platform uses. A mistyped name then fails loudly instead of
      # quietly opening a new stream on an unauthenticated broker.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Every topic name travels as an environment value, so the program below
      # reads each one as data. None becomes part of the program text.
      TOPIC_TRANSACTION_AUTHORIZED: ${TOPIC_TRANSACTION_AUTHORIZED:-transaction.authorized}
      TOPIC_TRANSACTION_DECLINED: ${TOPIC_TRANSACTION_DECLINED:-transaction.declined}
      TOPIC_TRANSACTION_POSTED: ${TOPIC_TRANSACTION_POSTED:-transaction.posted}
      TOPIC_FRAUD_ASSESSED: ${TOPIC_FRAUD_ASSESSED:-fraud.assessed}
      TOPIC_ACCOUNT_STATE_CHANGED: ${TOPIC_ACCOUNT_STATE_CHANGED:-account.state-changed}
      TOPIC_CARD_STATE_CHANGED: ${TOPIC_CARD_STATE_CHANGED:-card.state-changed}
      TOPIC_DEAD_LETTER_SUFFIX: ${TOPIC_DEAD_LETTER_SUFFIX:-.DLT}
      TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
    # This container also creates topics. It waits for the broker, then creates
    # the six event topics and one dead-letter topic per consumed topic. The
    # three consumed topics are transaction.authorized, transaction.posted and
    # fraud.assessed. A published-only topic carries no dead-letter counterpart,
    # since dead-letter routing carries a message a listener could not consume.
    #
    # These nine names are the platform's topic inventory. The same nine appear
    # in deploy/k8s/10-kafka.yaml, and .env.example documents every one.
    #
    # The last act of the program is to write /tmp/kafka-topics-ready, and the
    # healthcheck below reads that file. A refused name and a refused create both
    # leave it unwritten, so this container never reports healthy with topics
    # missing, and depends_on holds every listener back until they exist.
    #
    # Each name passes a gate before it reaches the broker. Apache Kafka admits
    # only letters, digits, the period, the underscore and the hyphen in a topic
    # name, up to 249 characters, and admits neither "." nor "..". The case
    # statement admits exactly that set, so a name can carry no semicolon, no
    # whitespace, no quote and no command substitution. Every expansion below is
    # quoted, so a name reaching kafka-topics.sh stays one argument.
    command:
      - /bin/bash
      - -c
      - |
        create_topics() {
          local topic
          until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
            sleep 2
          done
          for topic in "$${TOPIC_TRANSACTION_AUTHORIZED}" \
                       "$${TOPIC_TRANSACTION_DECLINED}" \
                       "$${TOPIC_TRANSACTION_POSTED}" \
                       "$${TOPIC_FRAUD_ASSESSED}" \
                       "$${TOPIC_ACCOUNT_STATE_CHANGED}" \
                       "$${TOPIC_CARD_STATE_CHANGED}" \
                       "$${TOPIC_TRANSACTION_AUTHORIZED}$${TOPIC_DEAD_LETTER_SUFFIX}" \
                       "$${TOPIC_TRANSACTION_POSTED}$${TOPIC_DEAD_LETTER_SUFFIX}" \
                       "$${TOPIC_FRAUD_ASSESSED}$${TOPIC_DEAD_LETTER_SUFFIX}"; do
            case "$${topic}" in
              ''|.|..)
                echo "Topic name '$${topic}' is one Apache Kafka reserves." >&2
                return 1
                ;;
              *[!a-zA-Z0-9._-]*)
                echo "Topic name '$${topic}' carries a character outside a-z A-Z 0-9 . _ and -." >&2
                return 1
                ;;
            esac
            if [ "$${#topic}" -gt 249 ]; then
              echo "Topic name '$${topic}' is longer than the 249 characters Apache Kafka admits." >&2
              return 1
            fi
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
              --create --if-not-exists --topic "$${topic}" \
              --partitions "$${TOPIC_PARTITIONS}" \
              --replication-factor "$${TOPIC_REPLICATION_FACTOR}" || return 1
          done
          : > /tmp/kafka-topics-ready
        }
        create_topics &
        exec /etc/kafka/docker/run
    ports:
      # Bound to the loopback address. The broker runs without authentication, so
      # only this machine reaches it.
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    # Healthy means two things: the topic program finished, and the broker still
    # answers. The file test comes first, so no Java virtual machine starts while
    # the broker is still coming up.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /tmp/kafka-topics-ready
          && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 45s
    networks:
      - carddemo
    restart: unless-stopped

  # Authorization service container. Built from
  # services/authorization-service/Dockerfile and configured with its own
  # database, schema, event topic names and outbox relay settings.
  authorization-service:
    build:
      # The card-platform directory, so stage 1 reaches the aggregator
      # descriptor and both shared libraries and packages the module in-image.
      context: .
      dockerfile: services/authorization-service/Dockerfile
    container_name: card-platform${CLONE_INDEX:-}-authorization-service
    env_file:
      - path: .env
        required: false
    environment:
      <<: *service-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${AUTHORIZATION_DB_NAME:-carddemo_authorization}?currentSchema=${AUTHORIZATION_DB_SCHEMA:-authorization_service}
      SPRING_FLYWAY_SCHEMAS: ${AUTHORIZATION_DB_SCHEMA:-authorization_service}
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${AUTHORIZATION_DB_SCHEMA:-authorization_service}
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ${AUTHORIZATION_DB_SCHEMA:-authorization_service}
      TOPIC_TRANSACTION_AUTHORIZED: ${TOPIC_TRANSACTION_AUTHORIZED:-transaction.authorized}
      TOPIC_TRANSACTION_DECLINED: ${TOPIC_TRANSACTION_DECLINED:-transaction.declined}
      OUTBOX_RELAY_INTERVAL_MS: ${OUTBOX_RELAY_INTERVAL_MS:-500}
      OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-100}
      # The two supporting services this one reads to resolve a card to an
      # account and to read the credit limit, both cycle counters and the expiry
      # date the decline rules test. Inside this network a service answers on its
      # own name and port 8080. Both reads are synchronous and neither writes.
      ACCOUNT_SERVICE_BASE_URL: ${ACCOUNT_SERVICE_BASE_URL:-http://account-service:8080}
      CARD_SERVICE_BASE_URL: ${CARD_SERVICE_BASE_URL:-http://card-service:8080}
    ports:
      # Both mappings bind the loopback address. The service port carries the
      # Representational State Transfer (REST) surface; the management port
      # carries /actuator and reaches no further than this machine.
      - "127.0.0.1:${AUTHORIZATION_PORT:-8081}:8080"
      - "127.0.0.1:${AUTHORIZATION_MANAGEMENT_PORT:-9081}:${MANAGEMENT_PORT:-9080}"
    # This service publishes through its outbox relay and registers no listener.
    depends_on: *database-only
    healthcheck: *actuator-healthcheck
    networks:
      - carddemo
    restart: unless-stopped

  # Ledger posting service container. Configured to read transaction.authorized
  # under the ledger-posting group and to write transaction.posted.
  ledger-posting-service:
    build:
      # The card-platform directory, so stage 1 reaches the aggregator
      # descriptor and both shared libraries and packages the module in-image.
      context: .
      dockerfile: services/ledger-posting-service/Dockerfile
    container_name: card-platform${CLONE_INDEX:-}-ledger-posting-service
    env_file:
      - path: .env
        required: false
    environment:
      <<: *service-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${LEDGER_DB_NAME:-carddemo_ledger}?currentSchema=${LEDGER_DB_SCHEMA:-ledger_service}
      SPRING_FLYWAY_SCHEMAS: ${LEDGER_DB_SCHEMA:-ledger_service}
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${LEDGER_DB_SCHEMA:-ledger_service}
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ${LEDGER_DB_SCHEMA:-ledger_service}
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${GROUP_LEDGER_POSTING:-ledger-posting}
      GROUP_LEDGER_POSTING: ${GROUP_LEDGER_POSTING:-ledger-posting}
      TOPIC_TRANSACTION_AUTHORIZED: ${TOPIC_TRANSACTION_AUTHORIZED:-transaction.authorized}
      TOPIC_TRANSACTION_POSTED: ${TOPIC_TRANSACTION_POSTED:-transaction.posted}
      TOPIC_DEAD_LETTER_SUFFIX: ${TOPIC_DEAD_LETTER_SUFFIX:-.DLT}
      CONSUMER_MAX_RETRY_ATTEMPTS: ${CONSUMER_MAX_RETRY_ATTEMPTS:-3}
      CONSUMER_RETRY_BACKOFF_MS: ${CONSUMER_RETRY_BACKOFF_MS:-1000}
      OUTBOX_RELAY_INTERVAL_MS: ${OUTBOX_RELAY_INTERVAL_MS:-500}
      OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-100}
    ports:
      # Both mappings bind the loopback address. The service port carries the
      # Representational State Transfer (REST) surface; the management port
      # carries /actuator and reaches no further than this machine.
      - "127.0.0.1:${LEDGER_PORT:-8082}:8080"
      - "127.0.0.1:${LEDGER_MANAGEMENT_PORT:-9082}:${MANAGEMENT_PORT:-9080}"
    # This service registers a listener on transaction.authorized.
    depends_on: *database-and-broker
    healthcheck: *actuator-healthcheck
    networks:
      - carddemo
    restart: unless-stopped

  # Fraud detection service container. Configured to read
  # transaction.authorized under the fraud-detection group and to write
  # fraud.assessed. It has no port any other service calls.
  fraud-detection-service:
    build:
      # The card-platform directory, so stage 1 reaches the aggregator
      # descriptor and both shared libraries and packages the module in-image.
      context: .
      dockerfile: services/fraud-detection-service/Dockerfile
    container_name: card-platform${CLONE_INDEX:-}-fraud-detection-service
    env_file:
      - path: .env
        required: false
    environment:
      <<: *service-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${FRAUD_DB_NAME:-carddemo_fraud}?currentSchema=${FRAUD_DB_SCHEMA:-fraud_service}
      SPRING_FLYWAY_SCHEMAS: ${FRAUD_DB_SCHEMA:-fraud_service}
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${FRAUD_DB_SCHEMA:-fraud_service}
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ${FRAUD_DB_SCHEMA:-fraud_service}
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${GROUP_FRAUD_DETECTION:-fraud-detection}
      GROUP_FRAUD_DETECTION: ${GROUP_FRAUD_DETECTION:-fraud-detection}
      TOPIC_TRANSACTION_AUTHORIZED: ${TOPIC_TRANSACTION_AUTHORIZED:-transaction.authorized}
      TOPIC_FRAUD_ASSESSED: ${TOPIC_FRAUD_ASSESSED:-fraud.assessed}
      TOPIC_DEAD_LETTER_SUFFIX: ${TOPIC_DEAD_LETTER_SUFFIX:-.DLT}
      CONSUMER_MAX_RETRY_ATTEMPTS: ${CONSUMER_MAX_RETRY_ATTEMPTS:-3}
      CONSUMER_RETRY_BACKOFF_MS: ${CONSUMER_RETRY_BACKOFF_MS:-1000}
      OUTBOX_RELAY_INTERVAL_MS: ${OUTBOX_RELAY_INTERVAL_MS:-500}
      OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-100}
    ports:
      # Both mappings bind the loopback address. The service port carries the
      # Representational State Transfer (REST) surface; the management port
      # carries /actuator and reaches no further than this machine.
      - "127.0.0.1:${FRAUD_PORT:-8083}:8080"
      - "127.0.0.1:${FRAUD_MANAGEMENT_PORT:-9083}:${MANAGEMENT_PORT:-9080}"
    # This service registers a listener on transaction.authorized.
    depends_on: *database-and-broker
    healthcheck: *actuator-healthcheck
    networks:
      - carddemo
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # Notification service. Reads transaction.authorized, transaction.posted and
  # fraud.assessed, each on a consumer group of its own. Its subscription to
  # transaction.authorized
  # makes it the third independent consumer of the one event an authorization
  # call publishes, alongside ledger posting and fraud detection. It publishes
  # no event and calls no other service.
  # ------------------------------------------------------------------------- #
  notification-service:
    build:
      # The card-platform directory, so stage 1 reaches the aggregator
      # descriptor and both shared libraries and packages the module in-image.
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: card-platform${CLONE_INDEX:-}-notification-service
    env_file:
      - path: .env
        required: false
    environment:
      <<: *service-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${NOTIFICATION_DB_NAME:-carddemo_notification}?currentSchema=${NOTIFICATION_DB_SCHEMA:-notification_service}
      SPRING_FLYWAY_SCHEMAS: ${NOTIFICATION_DB_SCHEMA:-notification_service}
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${NOTIFICATION_DB_SCHEMA:-notification_service}
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ${NOTIFICATION_DB_SCHEMA:-notification_service}
      # One group per listener. Three listeners sharing one group would split the
      # messages between them, so each carries its own. The group below is the
      # framework default a listener falls back to when it names no group.
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${GROUP_NOTIFICATION_AUTHORIZED:-notification-authorized}
      GROUP_NOTIFICATION_AUTHORIZED: ${GROUP_NOTIFICATION_AUTHORIZED:-notification-authorized}
      GROUP_NOTIFICATION_POSTED: ${GROUP_NOTIFICATION_POSTED:-notification-posted}
      GROUP_NOTIFICATION_FRAUD: ${GROUP_NOTIFICATION_FRAUD:-notification-fraud}
      # transaction.authorized is this service's direct subscription to the one
      # event an authorization call publishes. Ledger posting and fraud detection
      # subscribe to that same topic under their own groups.
      TOPIC_TRANSACTION_AUTHORIZED: ${TOPIC_TRANSACTION_AUTHORIZED:-transaction.authorized}
      TOPIC_TRANSACTION_POSTED: ${TOPIC_TRANSACTION_POSTED:-transaction.posted}
      TOPIC_FRAUD_ASSESSED: ${TOPIC_FRAUD_ASSESSED:-fraud.assessed}
      TOPIC_DEAD_LETTER_SUFFIX: ${TOPIC_DEAD_LETTER_SUFFIX:-.DLT}
      CONSUMER_MAX_RETRY_ATTEMPTS: ${CONSUMER_MAX_RETRY_ATTEMPTS:-3}
      CONSUMER_RETRY_BACKOFF_MS: ${CONSUMER_RETRY_BACKOFF_MS:-1000}
    ports:
      # Both mappings bind the loopback address. The service port carries the
      # Representational State Transfer (REST) surface; the management port
      # carries /actuator and reaches no further than this machine.
      - "127.0.0.1:${NOTIFICATION_PORT:-8084}:8080"
      - "127.0.0.1:${NOTIFICATION_MANAGEMENT_PORT:-9084}:${MANAGEMENT_PORT:-9080}"
    # This service registers three listeners.
    depends_on: *database-and-broker
    healthcheck: *actuator-healthcheck
    networks:
      - carddemo
    restart: unless-stopped

  # Account service container. Configured with the account database, its schema
  # and the outbox relay settings. It subscribes to no topic.
  account-service:
    build:
      # The card-platform directory, so stage 1 reaches the aggregator
      # descriptor and both shared libraries and packages the module in-image.
      context: .
      dockerfile: services/account-service/Dockerfile
    container_name: card-platform${CLONE_INDEX:-}-account-service
    env_file:
      - path: .env
        required: false
    environment:
      <<: *service-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${ACCOUNT_DB_NAME:-carddemo_account}?currentSchema=${ACCOUNT_DB_SCHEMA:-account_service}
      SPRING_FLYWAY_SCHEMAS: ${ACCOUNT_DB_SCHEMA:-account_service}
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${ACCOUNT_DB_SCHEMA:-account_service}
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ${ACCOUNT_DB_SCHEMA:-account_service}
      # The one topic this service publishes, on a mutation only. Its payload
      # matches schemas/account-state-changed-v1.json in event-contracts.
      TOPIC_ACCOUNT_STATE_CHANGED: ${TOPIC_ACCOUNT_STATE_CHANGED:-account.state-changed}
      OUTBOX_RELAY_INTERVAL_MS: ${OUTBOX_RELAY_INTERVAL_MS:-500}
      OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-100}
    ports:
      # Both mappings bind the loopback address. The service port carries the
      # Representational State Transfer (REST) surface; the management port
      # carries /actuator and reaches no further than this machine.
      - "127.0.0.1:${ACCOUNT_PORT:-8085}:8080"
      - "127.0.0.1:${ACCOUNT_MANAGEMENT_PORT:-9085}:${MANAGEMENT_PORT:-9080}"
    # This service publishes through its outbox relay and registers no listener.
    depends_on: *database-only
    healthcheck: *actuator-healthcheck
    networks:
      - carddemo
    restart: unless-stopped

  # Card service container. Configured with the card database, its schema and
  # the outbox relay settings. It subscribes to no topic.
  card-service:
    build:
      # The card-platform directory, so stage 1 reaches the aggregator
      # descriptor and both shared libraries and packages the module in-image.
      context: .
      dockerfile: services/card-service/Dockerfile
    container_name: card-platform${CLONE_INDEX:-}-card-service
    env_file:
      - path: .env
        required: false
    environment:
      <<: *service-environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${CARD_DB_NAME:-carddemo_card}?currentSchema=${CARD_DB_SCHEMA:-card_service}
      SPRING_FLYWAY_SCHEMAS: ${CARD_DB_SCHEMA:-card_service}
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${CARD_DB_SCHEMA:-card_service}
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ${CARD_DB_SCHEMA:-card_service}
      # The one topic this service publishes, on a mutation only. Its payload
      # matches schemas/card-state-changed-v1.json in event-contracts.
      TOPIC_CARD_STATE_CHANGED: ${TOPIC_CARD_STATE_CHANGED:-card.state-changed}
      # Producer reliability, the same set the other two publishers carry.
      # messaging/KafkaEventPublisher.java reads these back from the producer
      # factory at construction and refuses to start unless every one holds.
      # acks all waits for every in-sync replica. Idempotent production plus an
      # in-flight ceiling of five keeps one account's events in publish order
      # through a retry. The three timeouts bound a send rather than blocking a
      # request thread until the broker answers.
      SPRING_KAFKA_PRODUCER_ACKS: all
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_PROPERTIES_ENABLE_IDEMPOTENCE: "true"
      SPRING_KAFKA_PRODUCER_PROPERTIES_MAX_IN_FLIGHT_REQUESTS_PER_CONNECTION: "5"
      SPRING_KAFKA_PRODUCER_PROPERTIES_DELIVERY_TIMEOUT_MS: "120000"
      SPRING_KAFKA_PRODUCER_PROPERTIES_REQUEST_TIMEOUT_MS: "30000"
      SPRING_KAFKA_PRODUCER_PROPERTIES_MAX_BLOCK_MS: "5000"
      OUTBOX_RELAY_INTERVAL_MS: ${OUTBOX_RELAY_INTERVAL_MS:-500}
      OUTBOX_RELAY_BATCH_SIZE: ${OUTBOX_RELAY_BATCH_SIZE:-100}
    ports:
      # Both mappings bind the loopback address. The service port carries the
      # Representational State Transfer (REST) surface; the management port
      # carries /actuator and reaches no further than this machine.
      - "127.0.0.1:${CARD_PORT:-8086}:8080"
      - "127.0.0.1:${CARD_MANAGEMENT_PORT:-9086}:${MANAGEMENT_PORT:-9080}"
    # This service publishes through its outbox relay and registers no listener.
    depends_on: *database-only
    healthcheck: *actuator-healthcheck
    networks:
      - carddemo
    restart: unless-stopped

configs:

  # One database per service. The postgres command runs this program on every
  # start, so a name corrected after a refusal repairs the stack.
  #
  # It reads the six names from SERVICE_DATABASE_NAMES at run time rather than
  # taking them into the file as text, and checks each one against a strict
  # identifier pattern. It then hands each statement to psql on standard input,
  # where psql interpolates :"database_name" as one quoted identifier. A name
  # carrying a semicolon, a quotation mark or a space is refused by the pattern
  # before any statement runs. Identifier quoting means that even a name that
  # passed the pattern could not add a statement.
  #
  # It creates a database only when that name is absent, so a second start adds
  # nothing. Its last statement writes the file the postgres healthcheck reads, so
  # a refused name keeps that container out of healthy.
  service_databases:
    content: |
      #!/bin/sh
      set -eu

      : "$${SERVICE_DATABASE_NAMES:?SERVICE_DATABASE_NAMES must name the six service databases}"

      # The entry point initialises a new data directory behind a socket the
      # network cannot reach, so an answer on the loopback address means the
      # server is serving. Four minutes is far longer than any first start takes.
      attempt=0
      until pg_isready --host 127.0.0.1 --username "$$POSTGRES_USER" \
              --dbname "$$POSTGRES_DB" >/dev/null 2>&1; do
        attempt=$$((attempt + 1))
        if [ "$$attempt" -gt 120 ]; then
          echo "the database did not answer on 127.0.0.1 within four minutes" >&2
          exit 1
        fi
        sleep 2
      done

      PGHOST=127.0.0.1
      PGUSER="$$POSTGRES_USER"
      PGPASSWORD="$$POSTGRES_PASSWORD"
      PGDATABASE="$$POSTGRES_DB"
      export PGHOST PGUSER PGPASSWORD PGDATABASE

      for database_name in $$SERVICE_DATABASE_NAMES; do
        case "$$database_name" in
          *[!abcdefghijklmnopqrstuvwxyz0123456789_]* | [!abcdefghijklmnopqrstuvwxyz_]* | "")
            echo "refusing database name '$$database_name': a name holds lower-case" \
                 "letters, digits and underscores, and does not open with a digit" >&2
            exit 1
            ;;
        esac

        if [ "$${#database_name}" -gt 63 ]; then
          echo "refusing database name: a name holds at most 63 characters" >&2
          exit 1
        fi

        present=$$(printf %s "SELECT 1 FROM pg_database WHERE datname = :'database_name';" \
          | psql --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 \
              --set database_name="$$database_name")

        if [ "$$present" = 1 ]; then
          echo "database '$$database_name' is already present"
        else
          printf %s 'CREATE DATABASE :"database_name";' \
            | psql --no-psqlrc --set ON_ERROR_STOP=1 \
                --set database_name="$$database_name"
          echo "created database '$$database_name'"
        fi
      done

      : > /tmp/service-databases-ready

volumes:

  # Database files and broker log segments survive `docker compose down`.
  # `docker compose down -v` discards both.
  postgres-data:
  kafka-data:

networks:

  # One bridge network. Inside it a container reaches another by service name.
  carddemo:
    driver: bridge
