# COCRDSLC card detail of card 0500024453765740, the detail content of
# 1200-SETUP-SCREEN-VARS [app/cbl/COCRDSLC.cbl:457-497].
# Steps 1-2 reach the COCRDSL search screen as MNU-COMEN01C-alternate-04 does:
# COMEN01C transfers control to COCRDSLC with the program context reset to
# enter [app/cbl/COMEN01C.cbl:147-155], so COCRDSLC takes the WHEN
# CDEMO-PGM-ENTER branch and sends the empty search map
# [app/cbl/COCRDSLC.cbl:349-356]. WS-INFO-MSG was cleared by INITIALIZE, so
# 1200 sets the input prompt in INFOMSG [app/cbl/COCRDSLC.cbl:254-256,489-496].
# Step 3 runs under CCDL, the TRANSID COCRDSLC returned with: the COMMAREA
# carries CDEMO-PGM-REENTER [app/cbl/COCRDSLC.cbl:394-406,567], so ENTER takes
# 2000-PROCESS-INPUTS. Both filters are supplied, numeric and non-zero, so they
# become CDEMO-ACCT-ID and CDEMO-CARD-NUM and the input is valid
# [app/cbl/COCRDSLC.cbl:608-720]. 9100-GETCARD-BYACCTCARD reads CARDDAT by the
# card number alone (the account key is commented out) and the READ is NORMAL,
# which sets FOUND-CARDS-FOR-ACCOUNT [app/cbl/COCRDSLC.cbl:736-776].
#
# Expected values come from record 1 of the CARDDATA fixture (line 1 of
# app/data/ASCII/carddata.txt: card 0500024453765740, account 00000000050,
# embossed name 'Aniya Von', expiry 2023-03-09, status Y), moved to the
# symbolic map COCRDSL.CPY:
# - ACCTSID and CARDSID echo CC-ACCT-ID and CC-CARD-NUM, since CDEMO-ACCT-ID and
#   CDEMO-CARD-NUM are non-zero.
# - CRDNAME is CARD-EMBOSSED-NAME X(50) into the 50-byte field.
# - EXPMON and EXPYEAR are the month and year parts of CARD-EXPIRAION-DATE,
#   through the redefinition of CARD-EXPIRAION-DATE-X [app/cbl/COCRDSLC.cbl:84-90].
# - CRDSTCD is CARD-ACTIVE-STATUS.
# - INFOMSG is the 40-byte WS-INFO-MSG holding FOUND-CARDS-FOR-ACCOUNT, and
#   ERRMSG the 75-byte WS-RETURN-MSG, left at spaces, in the 80-byte field.
#
# Screen fields are compared at their full BMS length, trailing spaces
# included. CURDATE and CURTIME come from the region clock, so they are
# matchers in the MM/DD/YY and HH:MM:SS forms 1100-SCREEN-INIT builds
# [app/cbl/COCRDSLC.cbl:437-449].
id: CRD-COCRDSLC-normal-01
level: e2e
type: normal
description: >-
  USER0001 signs on, selects main-menu option 4 (Credit Card View) and, on the
  COCRDSLC search screen (CCDL), enters account 00000000050 and card
  0500024453765740. The program validates both filters, reads the card from
  CARDDAT by card number, and shows the embossed name, the active status and
  the expiry month and year, with 'Displaying requested details' in the
  information line and no error.
# Primary item first, then the program, the maps asserted, the transaction step
# 3 enters, the CSD file COCRDSLC reads, and the online-only copybooks it
# copies. Sign-on and the menu (CC00, CM00, COSGN00, USRSEC) are verified by
# the SEC and MNU scenarios, the two information messages by their own CRD
# scenarios, and the batch record copybooks and the data files at the lowest
# level that executes them.
inventory_ids:
- INV-CRD-046  # COCRDSLC card detail content (report)
- INV-CRD-002  # COCRDSLC program
- INV-MNU-003  # COMEN01 map, where option 4 is entered
- INV-CRD-005  # COCRDSL map, the search and the detail screen
- INV-CFG-013  # CCDL transaction, which runs the card lookup
- INV-CFG-003  # CARDDAT CSD file: card master read by card number
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and filters
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y, copied by COCRDSLC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COCRDSLC
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID, CC-CARD-NUM and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-006  # CRD end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    CARDDATA: {base: CARDDATA}
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '4'
  - aid: ENTER
    '@map': COCRDSL
    fields:
      ACCTSID: '00000000050'
      CARDSID: '0500024453765740'
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    OPTN004: '04. Credit Card View                    '
    ERRMSG: '                                                                              '
  - '@map': COCRDSL
    TRNNAME: CCDL
    PGMNAME: COCRDSLC
    INFOMSG: 'Please enter Account and Card Number    '
    ERRMSG: '                                                                                '
  - '@map': COCRDSL
    TRNNAME: CCDL
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COCRDSLC
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ACCTSID: '00000000050'
    CARDSID: '0500024453765740'
    CRDNAME: 'Aniya Von                                         '
    CRDSTCD: 'Y'
    EXPMON: '03'
    EXPYEAR: '2023'
    INFOMSG: '   Displaying requested details         '
    ERRMSG: '                                                                                '
