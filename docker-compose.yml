---
# CardDemo — local orchestration for the modernized stack.
#
# Brings up PostgreSQL, Redis, the nine Spring Boot microservices, the React
# frontend, and the Prometheus + Grafana observability stack on a single
# user-defined bridge network so every container resolves the others by their
# service name via Docker's embedded DNS.
#
# Usage:
#   cp .env.example .env        # then edit .env and set STRONG unique secrets
#   docker compose up --build   # build images and start the stack
#   docker compose config       # render/validate the effective configuration
#   docker compose down -v      # stop and remove containers + named volumes
#
# SECURITY MODEL:
#   * No credential is hard-coded. Every secret is read from the environment as
#     ${VAR:?...}, so `docker compose` fails fast if .env is missing a value —
#     there is deliberately no insecure built-in default.
#   * Datastores (postgres, redis) and internal microservices publish NO host
#     ports. Only the api-gateway (8080) and the frontend (3000) are reachable
#     from the host; the observability UIs bind to loopback only. All service-
#     to-service and scrape traffic stays on the private carddemo-net bridge.
#   * Redis requires authentication (--requirepass); Spring Session traffic
#     authenticates with the same secret.
#   * Every application container runs hardened: no-new-privileges, all Linux
#     capabilities dropped (backends), a read-only root filesystem, and a
#     tmpfs for writable scratch space.
#
# NOTE: every service in this file has its Dockerfile on disk, so `--build` is
# runnable; eight of the nine backend images copy the executable JAR the Maven
# reactor produces, which is why `mvn -B clean install -DskipTests` must run
# first. See README-target.md and docs/decision-log.md.

name: carddemo

# ---------------------------------------------------------------------------
# Startup ordering.
#
# Two dependency sets are shared below:
#
#   datastore-dependencies  the datastores must be HEALTHY (not merely started).
#                           Used by the migration owner and by the api-gateway,
#                           which owns no database.
#
#   schema-dependencies     the datastores PLUS the single Flyway migration owner
#                           (batch-service) reporting healthy. Every other backend
#                           runs with spring.flyway.enabled=false and Hibernate
#                           ddl-auto=validate, so it can only start once the shared
#                           schema exists. Without this gate a service that happens
#                           to start first fails validation (or, when several
#                           services migrate, races on cross-table foreign keys and
#                           on the schema-history table). batch-service's own
#                           healthcheck only reports UP after its migrations have
#                           been applied, so "healthy" is exactly the right signal.
#                           The equivalent gate in Kubernetes is the await-schema
#                           init container in k8s/deployment-*.yaml.
# ---------------------------------------------------------------------------
x-datastore-dependencies: &datastore-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

x-schema-dependencies: &schema-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  batch-service:
    condition: service_healthy

# ---------------------------------------------------------------------------
# Shared definition for every runnable Spring Boot service. Each backend block
# merges this anchor and then supplies only its own build context (and, for the
# services that must wait for the schema, its own depends_on). Services do
# NOT publish host ports: traffic flows through the api-gateway. All
# services listen on 8080 internally.
# ---------------------------------------------------------------------------
x-backend-service: &backend-service
  # Gate startup on the datastores being fully ready, not merely started.
  # Anchored separately from the service anchor because a YAML merge key is
  # SHALLOW: a service that needs one extra variable (batch-service and
  # reporting-service need the batch directory roots) must re-merge this map
  # explicitly rather than declare `environment` and silently drop all of it.
  depends_on: *datastore-dependencies
  environment: &backend-environment
    # Activates each service's application-docker.yml profile.
    SPRING_PROFILES_ACTIVE: docker
    # Force a consistent internal port.
    SERVER_PORT: "8080"
    # Datasource points at the postgres service by its compose DNS name.
    # Credentials are externalized; no in-file default.
    #
    # Only the URL is shared. Each DB-owning service overrides
    # SPRING_DATASOURCE_USERNAME / _PASSWORD with the per-service login role that
    # db/init/01-create-service-roles.sh provisions, mirroring the one-Secret-per-
    # service model of k8s/secret.yaml (those eight roles must be
    # referenced by the manifests but nothing created them, and compose ran every
    # service as the bootstrap owner). The bootstrap owner is used by the postgres
    # container only.
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
    # Spring Session state store (externalized COMMAREA equivalent). Redis
    # requires authentication; the same secret is presented here.
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PORT: "6379"
    SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # Actuator health details are only rendered to authenticated principals
    #; anonymous callers still receive the overall UP/DOWN status.
    MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: when-authorized
    # Sample every request in this local stack so each log line carries a
    # traceId/spanId and a flow can be followed across service boundaries. The
    # application default stays at the production-safe 10% (see each service's
    # application.yml); only this environment raises it.
    # AES-256-GCM key for at-rest encryption of the sensitive customer/card
    # attributes (SSN, government id, EFT account id, CVV) via carddemo-common's
    # CryptoConverter. It is validated eagerly during context startup (Base64 +
    # 32-byte length), and carries no in-file default so `docker compose` fails
    # fast at render time when .env omits it.
    CARDDEMO_PII_KEY: ${CARDDEMO_PII_KEY:?set CARDDEMO_PII_KEY in .env}
    # Credential of the least-privilege `monitoring` principal that guards
    # /actuator/prometheus and /actuator/metrics on every service. It is
    # the SAME secret Prometheus mounts as its basic_auth password_file below,
    # so the scrape authenticates; without it each service would seed the
    # principal with a random credential and every scrape target would return
    # 401. Externalized like every other secret: no in-file default.
    MONITORING_PASSWORD: ${MONITORING_PASSWORD:?set MONITORING_PASSWORD in .env}
    # Distributed tracing (AAP 0.7.5). Spans are exported over OTLP/HTTP to the
    # jaeger collector on the private network; the application default targets
    # each container's own loopback, where nothing listens, so the endpoint MUST
    # be supplied here for tracing to be verifiable locally. The local
    # environment samples every request so a trace can be asserted end to end;
    # production overrides the probability from the environment.
    MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
    MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-1.0}
  # Liveness/readiness via the Spring Boot Actuator health endpoint. The probe issues
  # the request through bash's /dev/tcp pseudo-device so it can assert on the RESPONSE
  # BODY - `grep -q UP` fails a 200 whose aggregate status is DOWN, which a bare
  # `curl -f` would pass - and so it depends on no HTTP client the base image may drop.
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 &&
        printf "GET /actuator/health HTTP/1.0\r\n\r\n" >&3 &&
        cat <&3 | grep -q UP'
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 60s
  # Runtime hardening. The read-only root filesystem forces all writable
  # state onto the tmpfs mount; a Spring Boot fat-jar only needs /tmp.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  user: "1000:1000"
  networks:
    - carddemo-net
  restart: unless-stopped

services:

  # =========================================================================
  # Infrastructure
  # =========================================================================

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Consumed by db/init/01-create-service-roles.sh. Nothing is defaulted: a
      # missing value aborts first-boot initialisation rather than creating a role
      # with a guessable password.
      CARDDEMO_AUTH_DB_PASSWORD: ${CARDDEMO_AUTH_DB_PASSWORD:?set CARDDEMO_AUTH_DB_PASSWORD in .env}
      CARDDEMO_USER_DB_PASSWORD: ${CARDDEMO_USER_DB_PASSWORD:?set CARDDEMO_USER_DB_PASSWORD in .env}
      CARDDEMO_ACCOUNT_DB_PASSWORD: ${CARDDEMO_ACCOUNT_DB_PASSWORD:?set CARDDEMO_ACCOUNT_DB_PASSWORD in .env}
      CARDDEMO_CARD_DB_PASSWORD: ${CARDDEMO_CARD_DB_PASSWORD:?set CARDDEMO_CARD_DB_PASSWORD in .env}
      CARDDEMO_TRANSACTION_DB_PASSWORD: ${CARDDEMO_TRANSACTION_DB_PASSWORD:?set CARDDEMO_TRANSACTION_DB_PASSWORD in .env}
      CARDDEMO_BILLPAY_DB_PASSWORD: ${CARDDEMO_BILLPAY_DB_PASSWORD:?set CARDDEMO_BILLPAY_DB_PASSWORD in .env}
      CARDDEMO_REPORTING_DB_PASSWORD: ${CARDDEMO_REPORTING_DB_PASSWORD:?set CARDDEMO_REPORTING_DB_PASSWORD in .env}
      CARDDEMO_BATCH_DB_PASSWORD: ${CARDDEMO_BATCH_DB_PASSWORD:?set CARDDEMO_BATCH_DB_PASSWORD in .env}
    # Connection budget. The eight JPA services each hold a bounded
    # HikariCP pool now (steady state 15 connections in total, absolute ceiling 68 -
    # see the spring.datasource.hikari block in every service's application.yml), but
    # the image default of max_connections=100 still leaves no operational headroom:
    # with HikariCP's own defaults those eight services consumed 80 of the 100 slots
    # while completely idle and starting any two further containers was refused with
    # "FATAL: sorry, too many clients already". 200 keeps the steady-state footprint
    # under 10% of the limit and leaves room for two replicas of every service plus
    # operator (psql) and monitoring sessions. Overridable through the environment for
    # larger deployments; k8s/deployment-postgres.yaml carries the same setting.
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
    # No host port: only containers on carddemo-net reach the database.
    #
    # The postgres:18+ official image stores its cluster in a
    # major-version-specific subdirectory so `pg_upgrade --link` works across
    # majors, and its entrypoint ABORTS if the persistent volume is mounted at
    # the legacy /var/lib/postgresql/data path ("in 18+, these Docker images are
    # configured to store database data in a format which is compatible with
    # pg_ctlcluster"). The supported configuration for 18+ is therefore a single
    # mount one level up, at /var/lib/postgresql.
    # See docker-library/postgres#1259 and docker-library/postgres#37.
    #
    # db/init is projected read-only onto the image's first-boot hook directory so
    # 01-create-service-roles.sh provisions the eight per-service login roles the
    # deployment descriptors reference. The image runs it exactly once,
    # on initialisation of an empty data directory, as POSTGRES_USER.
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # The official image's entrypoint chowns the data dir and drops to the
    # unprivileged postgres user on its own, so only no-new-privileges is added
    # here (dropping all caps would break first-run initialization).
    security_opt:
      - no-new-privileges:true
    networks:
      - carddemo-net
    restart: unless-stopped

  redis:
    image: redis:8
    environment:
      # Consumed by both the server (--requirepass) and the healthcheck. The
      # $$ escaping keeps the literal out of the rendered config; the value is
      # expanded inside the container from its own environment.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    # No host port: Redis is reachable only on carddemo-net.
    volumes:
      - redisdata:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - carddemo-net
    restart: unless-stopped

  # =========================================================================
  # Backend microservices (built from each module's Dockerfile on
  # eclipse-temurin:21-jre). carddemo-common is a shared library and is
  # intentionally NOT run as a container — it is built into these services.
  # None of these publish a host port; all traffic is routed through
  # the api-gateway on the private network.
  # =========================================================================

  api-gateway:
    <<: *backend-service
    build:
      context: ./api-gateway
    # Tag the built image exactly as k8s/deployment-api-gateway.yaml references it, so
    # `docker compose build` produces the artifact the manifests apply against.
    # Registry and tag are overridable for a private registry or a
    # side-by-side build; the defaults ARE the manifest values.
    image: ${CARDDEMO_IMAGE_REGISTRY:-carddemo}/api-gateway:${CARDDEMO_IMAGE_TAG:-1.0.0}
    # The gateway is the single public entrypoint for the backend.
    ports:
      - "8080:8080"
    # The gateway owns NO database — its environment intentionally omits
    # every SPRING_DATASOURCE_* variable and instead injects the downstream
    # service routes as compose-DNS URIs on the internal 8080 port.
    # A service-level `environment` mapping REPLACES the anchor's mapping rather
    # than merging into it, so every shared variable the gateway still needs must
    # be repeated here.
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: "8080"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: when-authorized
      # The gateway is the trace entry point: it must export to the same collector as
      # every downstream service so a request produces ONE joined trace (AAP 0.7.5).
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      # A service-level `environment` map REPLACES the one merged from the anchor, so the
      # sampling probability must be repeated here; without it the gateway samples at the
      # committed 0.1 default and the entry span of most requests is never recorded.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-1.0}
      # Same telemetry scrape credential as every other service: the
      # gateway also publishes /actuator/prometheus and must not leave it open.
      MONITORING_PASSWORD: ${MONITORING_PASSWORD:?set MONITORING_PASSWORD in .env}
      # Full sampling in this local stack (see the x-backend-service anchor).
      AUTH_SERVICE_URI: http://auth-service:8080
      USER_SERVICE_URI: http://user-service:8080
      ACCOUNT_SERVICE_URI: http://account-service:8080
      CARD_SERVICE_URI: http://card-service:8080
      TRANSACTION_SERVICE_URI: http://transaction-service:8080
      BILLPAY_SERVICE_URI: http://billpay-service:8080
      REPORTING_SERVICE_URI: http://reporting-service:8080
      BATCH_SERVICE_URI: http://batch-service:8080

  auth-service:
    <<: *backend-service
    build:
      context: ./auth-service
    # Tag the built image exactly as k8s/deployment-auth-service.yaml references it, so
    # `docker compose build` produces the artifact the manifests apply against.
    # Registry and tag are overridable for a private registry or a
    # side-by-side build; the defaults ARE the manifest values.
    image: ${CARDDEMO_IMAGE_REGISTRY:-carddemo}/auth-service:${CARDDEMO_IMAGE_TAG:-1.0.0}
    # Waits for the shared schema: this service does not migrate, it validates
    # (see x-schema-dependencies above).
    depends_on: *schema-dependencies

    environment:
      # Shallow merge: a YAML merge key REPLACES the anchor's map, so the shared
      # environment must be re-merged explicitly before adding keys.
      <<: *backend-environment
      # Per-service login role provisioned by db/init/01-create-service-roles.sh,
      # matching the carddemo-auth-service-db Secret in k8s/secret.yaml.
      SPRING_DATASOURCE_USERNAME: carddemo_auth
      SPRING_DATASOURCE_PASSWORD: ${CARDDEMO_AUTH_DB_PASSWORD:?set CARDDEMO_AUTH_DB_PASSWORD in .env}
  user-service:
    <<: *backend-service
    build:
      context: ./user-service
    # Tag the built image exactly as k8s/deployment-user-service.yaml references it, so
    # `docker compose build` produces the artifact the manifests apply against.
    # Registry and tag are overridable for a private registry or a
    # side-by-side build; the defaults ARE the manifest values.
    image: ${CARDDEMO_IMAGE_REGISTRY:-carddemo}/user-service:${CARDDEMO_IMAGE_TAG:-1.0.0}
    # Waits for the shared schema: this service does not migrate, it validates
    # (see x-schema-dependencies above).
    depends_on: *schema-dependencies

    environment:
      # Shallow merge: a YAML merge key REPLACES the anchor's map, so the shared
      # environment must be re-merged explicitly before adding keys.
      <<: *backend-environment
      # Per-service login role provisioned by db/init/01-create-service-roles.sh,
      # matching the carddemo-user-service-db Secret in k8s/secret.yaml.
      SPRING_DATASOURCE_USERNAME: carddemo_user
      SPRING_DATASOURCE_PASSWORD: ${CARDDEMO_USER_DB_PASSWORD:?set CARDDEMO_USER_DB_PASSWORD in .env}
  account-service:
    <<: *backend-service
    build:
      context: ./account-service
    # Tag the built image exactly as k8s/deployment-account-service.yaml references it, so
    # `docker compose build` produces the artifact the manifests apply against.
    # Registry and tag are overridable for a private registry or a
    # side-by-side build; the defaults ARE the manifest values.
    image: ${CARDDEMO_IMAGE_REGISTRY:-carddemo}/account-service:${CARDDEMO_IMAGE_TAG:-1.0.0}
    # Waits for the shared schema: this service does not migrate, it validates
    # (see x-schema-dependencies above).
    depends_on: *schema-dependencies

    environment:
      # Shallow merge: a YAML merge key REPLACES the anchor's map, so the shared
      # environment must be re-merged explicitly before adding keys.
      <<: *backend-environment
      # Per-service login role provisioned by db/init/01-create-service-roles.sh,
      # matching the carddemo-account-service-db Secret in k8s/secret.yaml.
      SPRING_DATASOURCE_USERNAME: carddemo_account
      SPRING_DATASOURCE_PASSWORD: ${CARDDEMO_ACCOUNT_DB_PASSWORD:?set CARDDEMO_ACCOUNT_DB_PASSWORD in .env}
  card-service:
    <<: *backend-service
    build:
      context: ./card-service
    # Tag the built image exactly as k8s/deployment-card-service.yaml references it, so
    # `docker compose build` produces the artifact the manifests apply against.
    # Registry and tag are overridable for a private registry or a
    # side-by-side build; the defaults ARE the manifest values.
    image: ${CARDDEMO_IMAGE_REGISTRY:-carddemo}/card-service:${CARDDEMO_IMAGE_TAG:-1.0.0}
    # Waits for the shared schema: this service does not migrate, it validates
    # (see x-schema-dependencies above).
    depends_on: *schema-dependencies

    environment:
      # Shallow merge: a YAML merge key REPLACES the anchor's map, so the shared
      # environment must be re-merged explicitly before adding keys.
      <<: *backend-environment
      # Per-service login role provisioned by db/init/01-create-service-roles.sh,
      # matching the carddemo-card-service-db Secret in k8s/secret.yaml.
      SPRING_DATASOURCE_USERNAME: carddemo_card
      SPRING_DATASOURCE_PASSWORD: ${CARDDEMO_CARD_DB_PASSWORD:?set CARDDEMO_CARD_DB_PASSWORD in .env}
  transaction-service:
    <<: *backend-service
    environment:
      # Shallow merge: repeat the shared environment explicitly (see the anchor).
      <<: *backend-environment
      # Per-service login role provisioned by db/init/01-create-service-roles.sh,
      # matching the carddemo-transaction-service-db Secret in k8s/secret.yaml.
      SPRING_DATASOURCE_USERNAME: carddemo_transaction
      SPRING_DATASOURCE_PASSWORD: ${CARDDEMO_TRANSACTION_DB_PASSWORD:?set CARDDEMO_TRANSACTION_DB_PASSWORD in .env}
      # Writable root for the DALYREJS reject file the transaction-posting job
      # (POSTTRAN / CBTRN02C) writes. Without it the reject writer
      # resolved a bare file name against the working directory /app, which is on
      # the read-only root filesystem.
      CARDDEMO_BATCH_OUTPUT_DIR: /var/carddemo/batch/output
      CARDDEMO_BATCH_INPUT_DIR: /var/carddemo/batch/input
    tmpfs:
      - /tmp
      - /var/carddemo/batch
    build:
      context: ./transaction-service
    # Tag the built image exactly as k8s/deployment-transaction-service.yaml references it, so
    # `docker compose build` produces the artifact the manifests apply against.
    # Registry and tag are overridable for a private registry or a
    # side-by-side build; the defaults ARE the manifest values.
    image: ${CARDDEMO_IMAGE_REGISTRY:-carddemo}/transaction-service:${CARDDEMO_IMAGE_TAG:-1.0.0}
    # Waits for the shared schema: this service does not migrate, it validates
    # (see x-schema-dependencies above).
    depends_on: *schema-dependencies

  billpay-service:
    <<: *backend-service
    build:
      context: ./billpay-service
    # Tag the built image exactly as k8s/deployment-billpay-service.yaml references it, so
    # `docker compose build` produces the artifact the manifests apply against.
    # Registry and tag are overridable for a private registry or a
    # side-by-side build; the defaults ARE the manifest values.
    image: ${CARDDEMO_IMAGE_REGISTRY:-carddemo}/billpay-service:${CARDDEMO_IMAGE_TAG:-1.0.0}
    # Waits for the shared schema: this service does not migrate, it validates
    # (see x-schema-dependencies above).
    depends_on: *schema-dependencies

    environment:
      # Shallow merge: a YAML merge key REPLACES the anchor's map, so the shared
      # environment must be re-merged explicitly before adding keys.
      <<: *backend-environment
      # Per-service login role provisioned by db/init/01-create-service-roles.sh,
      # matching the carddemo-billpay-service-db Secret in k8s/secret.yaml.
      SPRING_DATASOURCE_USERNAME: carddemo_billpay
      SPRING_DATASOURCE_PASSWORD: ${CARDDEMO_BILLPAY_DB_PASSWORD:?set CARDDEMO_BILLPAY_DB_PASSWORD in .env}
  reporting-service:
    <<: *backend-service
    # Root build context: reporting-service inherits the root parent POM and
    # depends on the sibling carddemo-common module, so its Dockerfile builds
    # the reactor from the repository root (see reporting-service/Dockerfile).
    build:
      context: .
      dockerfile: reporting-service/Dockerfile
    # Tag the built image exactly as k8s/deployment-reporting-service.yaml references it, so
    # `docker compose build` produces the artifact the manifests apply against.
    # Registry and tag are overridable for a private registry or a
    # side-by-side build; the defaults ARE the manifest values.
    image: ${CARDDEMO_IMAGE_REGISTRY:-carddemo}/reporting-service:${CARDDEMO_IMAGE_TAG:-1.0.0}
    environment:
      # Every key of the shared &backend-service environment must be repeated:
      # a YAML merge key is SHALLOW, so declaring `environment` here replaces the
      # anchor's map rather than adding to it.
      <<: *backend-environment
      # Per-service login role provisioned by db/init/01-create-service-roles.sh,
      # matching the carddemo-reporting-service-db Secret in k8s/secret.yaml.
      SPRING_DATASOURCE_USERNAME: carddemo_reporting
      SPRING_DATASOURCE_PASSWORD: ${CARDDEMO_REPORTING_DB_PASSWORD:?set CARDDEMO_REPORTING_DB_PASSWORD in .env}
      # Writable statement-output root on the dedicated tmpfs below, so the CBSTM03A
      # writer has a directory that satisfies read_only: true and the non-root user.
      # carddemo-common's BatchOutputPathResolver proves it writable at startup.
      CARDDEMO_BATCH_OUTPUT_DIR: /var/carddemo/batch/output
      CARDDEMO_BATCH_INPUT_DIR: /var/carddemo/batch/input
    tmpfs:
      - /tmp
      - /var/carddemo/batch
    # Waits for the shared schema: this service does not migrate, it validates
    # (see x-schema-dependencies above).
    depends_on: *schema-dependencies

  batch-service:
    <<: *backend-service
    build:
      context: ./batch-service
    # Tag the built image exactly as k8s/deployment-batch-service.yaml references it, so
    # `docker compose build` produces the artifact the manifests apply against.
    # Registry and tag are overridable for a private registry or a
    # side-by-side build; the defaults ARE the manifest values.
    image: ${CARDDEMO_IMAGE_REGISTRY:-carddemo}/batch-service:${CARDDEMO_IMAGE_TAG:-1.0.0}
    environment:
      # Shallow merge: repeat the shared environment explicitly (see above).
      <<: *backend-environment
      # Per-service login role provisioned by db/init/01-create-service-roles.sh,
      # matching the carddemo-batch-service-db Secret in k8s/secret.yaml.
      SPRING_DATASOURCE_USERNAME: carddemo_batch
      SPRING_DATASOURCE_PASSWORD: ${CARDDEMO_BATCH_DB_PASSWORD:?set CARDDEMO_BATCH_DB_PASSWORD in .env}
      # Writable report/dump root for the nine data-management jobs.
      CARDDEMO_BATCH_OUTPUT_DIR: /var/carddemo/batch/output
      # Read-only feed root. The daily-transaction validation job (CBTRN01C)
      # reads a fixed-width sequential feed; the repository's own legacy fixture
      # app/data/ASCII/dailytran.txt is the local stand-in for the DALYTRAN data
      # set an upstream feed process would deliver, and is mounted read-only
      # below so the job is genuinely launchable in this environment.
      CARDDEMO_BATCH_INPUT_DIR: /var/carddemo/batch/input
    volumes:
      - ./app/data/ASCII:/var/carddemo/batch/input:ro
    tmpfs:
      - /tmp
      - /var/carddemo/batch/output

  # =========================================================================
  # Frontend (React 19 SPA served by nginx). The bundle talks to the backend
  # through a SAME-ORIGIN path (/api), which nginx reverse-proxies to the
  # api-gateway on the private network. No absolute gateway URL is
  # baked into the bundle, so no host port of the gateway is assumed.
  # =========================================================================

  # The service is guarded by a profile so that `docker compose up --build` (the
  # command README-target.md documents) covers the datastores, the nine backend
  # services and the observability stack, and the browser tier is opted into
  # explicitly with `docker compose --profile frontend up -d --build frontend`.
  # The bundle itself is complete — the Vite entry point (src/main.tsx), the route
  # table and the 17 page components are all on disk, and `npm run build` produces
  # the dist/ tree this image serves.
  frontend:
    profiles:
      - frontend
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        # Sign-on header AppID: field (legacy EXEC CICS ASSIGN APPLID). CARDDEMO is
        # the application's own name in app/csd/CARDDEMO.CSD and fits the mapset's
        # 8-character APPLID field exactly.
        VITE_APP_ID: CARDDEMO
    # Tag the built image exactly as k8s/deployment-frontend.yaml references it, so
    # `docker compose build` produces the artifact the manifests apply against.
    # Registry and tag are overridable for a private registry or a
    # side-by-side build; the defaults ARE the manifest values.
    image: ${CARDDEMO_IMAGE_REGISTRY:-carddemo}/frontend:${CARDDEMO_IMAGE_TAG:-1.0.0}
    environment:
      VITE_API_BASE_URL: /api
      VITE_APP_ID: CARDDEMO
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    # nginx needs a few writable paths; everything else is read-only.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    networks:
      - carddemo-net
    restart: unless-stopped

  # =========================================================================
  # Observability — Prometheus scrapes each service's authenticated
  # /actuator/prometheus endpoint; Jaeger receives the OTLP spans every service
  # exports; Grafana is auto-provisioned (datasources + dashboard) from inline
  # configs and the dashboard template under observability/. All three UIs bind to
  # the host loopback only, so they are never exposed on a routable
  # interface.
  # =========================================================================

  # Distributed-tracing backend (AAP 0.7.5). Jaeger v2 is a single-binary
  # collector + storage + query + UI: it accepts the services' OTLP spans on
  # 4318 (HTTP/protobuf) and 4317 (gRPC) and serves the trace-query API and UI on
  # 16686. Without a collector in the local environment the exported spans have
  # nowhere to go and "distributed tracing verified against the local Docker
  # Compose environment" cannot be satisfied. Storage is the in-memory badger-less
  # default: traces are development evidence, not durable data, so no volume is
  # mounted and nothing survives a restart by design.
  jaeger:
    image: jaegertracing/jaeger:2.11.0
    # Only the query UI/API is published, on loopback; the OTLP receivers stay on
    # the private carddemo-net bridge exactly like the datastores.
    ports:
      - "127.0.0.1:16686:16686"
    security_opt:
      - no-new-privileges:true
    # No healthcheck: the image is a minimal distroless-style rootfs without bash,
    # so the /dev/tcp probe the backend services use is unavailable here (it ships
    # /bin/sh and wget, but no bash and no curl). More importantly, span export is
    # deliberately BEST-EFFORT: no service may gate its own startup or readiness on
    # the tracing backend, so nothing depends on jaeger's health.
    networks:
      - carddemo-net
    restart: unless-stopped

  prometheus:
    # Pinned to an explicit version. An untagged reference resolves
    # to :latest, so two `docker compose pull` runs weeks apart can start different
    # Prometheus majors against the same scrape config and dashboards; 3.13.2 is
    # the version this stack was verified against.
    image: prom/prometheus:v3.13.2
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    # The scrape authenticates as the least-privilege `monitoring` principal that
    # every service's ManagementSecurityConfig seeds from MONITORING_PASSWORD.
    # Prometheus reads the credential from this projected file (password_file in
    # observability/prometheus.yml) rather than from any committed value.
    #
    # uid/gid MUST be pinned to 65534 ("nobody"), the account the upstream
    # prom/prometheus image runs as. Projected config files default to root:root,
    # so with mode 0440 alone the Prometheus process cannot open the file and EVERY
    # scrape job fails with "unable to read basic auth password: permission denied"
    # while Prometheus itself still reports healthy. Pinning the owner keeps least
    # privilege (0440, not world-readable).
    configs:
      - source: monitoring_password
        target: /etc/prometheus/secrets/monitoring-password
        uid: "65534"
        gid: "65534"
        mode: 0440
    # Network isolation is the second control over the monitoring path: no service
    # publishes its management port and the scrape stays on the private carddemo-net
    # bridge, while the projected credential above authenticates every scrape.
    ports:
      - "127.0.0.1:9090:9090"
    security_opt:
      - no-new-privileges:true
    networks:
      - carddemo-net
    restart: unless-stopped

  grafana:
    # Pinned to an explicit version. The provisioned dashboard is
    # validated against this release - notably its handling of the saved `refresh`
    # interval and the table legend - so a floating :latest could change rendering
    # behaviour without any repository change.
    image: grafana/grafana:13.1.1
    environment:
      # Admin credentials are externalized; no admin/admin default.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/carddemo.yml
    volumes:
      # The provider above loads every dashboard JSON from this directory.
      - ./observability/grafana-dashboard.json:/var/lib/grafana/dashboards/carddemo-dashboard.json:ro
      - grafanadata:/var/lib/grafana
    # Container port 3000; published on loopback 3001 (frontend uses 3000).
    ports:
      - "127.0.0.1:3001:3000"
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus
    networks:
      - carddemo-net
    restart: unless-stopped

networks:
  carddemo-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  prometheusdata:
  grafanadata:

# ---------------------------------------------------------------------------
# Inline config content. The Grafana entries wire the Prometheus and Jaeger
# datasources and the dashboard provider on first boot. Keeping this inline avoids
# adding provisioning files to the repository. The one secret here,
# monitoring_password, carries no committed value: it is interpolated from the
# environment (.env) and projected read-only into the Prometheus container.
# ---------------------------------------------------------------------------
configs:
  # Credential of the least-privilege `monitoring` principal that every service's
  # ManagementSecurityConfig seeds and that Prometheus presents on each scrape.
  # Externalized, never committed: it is supplied from the environment (.env) and
  # projected read-only into the Prometheus container as a password_file.
  monitoring_password:
    content: "${MONITORING_PASSWORD:?set MONITORING_PASSWORD in .env}"
  grafana_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: true
        # Tracing datasource (AAP 0.7.5) so a trace can be explored from the same
        # pane of glass as the metrics. Jaeger's query API is reached over the
        # private network; nothing is published for it beyond the loopback UI.
        - name: Jaeger
          type: jaeger
          uid: carddemo-jaeger
          access: proxy
          url: http://jaeger:16686
          isDefault: false
          editable: true
  grafana_dashboard_provider:
    content: |
      apiVersion: 1
      providers:
        - name: CardDemo
          orgId: 1
          type: file
          disableDeletion: false
          allowUiUpdates: true
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards
            foldersFromFilesStructure: false
