# Test profile for reporting-service: boots slice/context/integration tests without a live Redis,
# against a throwaway Testcontainers PostgreSQL. Activated via @ActiveProfiles("test").
spring:
  autoconfigure:
    # Neutralize Redis + Spring Session auto-config so the context loads without a running Redis.
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - org.springframework.boot.session.autoconfigure.SessionAutoConfiguration
      - org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration
  datasource:
    # Testcontainers JDBC-URL scheme: auto-provisions an ephemeral postgres:18 container.
    # Overridable by ITs via @ServiceConnection / @DynamicPropertySource.
    url: jdbc:tc:postgresql:18:///carddemo
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  jpa:
    open-in-view: false
    hibernate:
      # The throwaway container starts empty, so Hibernate performs no schema action here;
      # each IT provisions exactly the schema it needs via @DynamicPropertySource.
      ddl-auto: none
  # Flyway is ENABLED in the deployed service (it applies the shared carddemo-common
  # migration set from classpath:db/migration) but is disabled for tests: V3 seeds the
  # full 50-customer dataset, which the ITs would have to delete around foreign keys they
  # do not own. Each IT instead provisions only what it asserts on - Hibernate-generated
  # entity tables and/or the canonical Spring Batch BATCH_* DDL.
  flyway:
    enabled: false
  # Statement/report jobs run on demand via JobLauncher (CICS TDQ 'JOBS' -> JES async submission), never at startup.
  batch:
    job:
      enabled: false
  # The service now uses the JDBC job repository so runs are auditable.
  # The throwaway container ships no schema, so the framework's own PostgreSQL
  # BATCH_* metadata DDL is applied at startup; production uses the equivalent
  # batch-service Flyway migration that owns these tables.
  sql:
    init:
      mode: always
      schema-locations: classpath:org/springframework/batch/core/schema-postgresql.sql
      continue-on-error: true
logging:
  level:
    com.carddemo: INFO
    org.testcontainers: WARN
    com.github.dockerjava: WARN
