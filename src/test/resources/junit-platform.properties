#
# JUnit 5 Platform configuration for the AWS CardDemo migration test suite.
#
# Auto-discovered from the test classpath root (src/test/resources) by the
# JUnit 5 Platform launcher, which is driven by the Maven Surefire plugin
# (unit tests: *Test) and the Maven Failsafe plugin (integration/parity
# tests: *IT) declared in the repository-root pom.xml.
#
# Purpose: keep the JUnit 5 unit + Testcontainers integration + parity suite
# deterministic and readable. Values are intentionally conservative.
#

# Default test-instance lifecycle: a fresh test instance per @Test method.
# This is JUnit's default, stated explicitly for clarity. Individual classes
# may still opt into PER_CLASS locally via @TestInstance(Lifecycle.PER_CLASS).
junit.jupiter.testinstance.lifecycle.default = per_method

# Human-readable test names: render method_names_with_underscores as
# "method names with underscores" in reports and IDE output.
junit.jupiter.displayname.generator.default = org.junit.jupiter.api.DisplayNameGenerator$ReplaceUnderscores

# Parallel execution DISABLED (explicit). The suite shares a cached Spring
# ApplicationContext and a single Testcontainers PostgreSQL instance; serial
# execution avoids cross-test interference and container/DB contention.
junit.jupiter.execution.parallel.enabled = false
