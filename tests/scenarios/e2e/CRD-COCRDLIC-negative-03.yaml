# A selection code other than S, U or blank on the card list. USER0001 (type U
# in the USRSEC fixture) signs on through CC00 and reaches the main menu, whose
# option 3 'Credit Card List' makes COMEN01C XCTL to COCRDLIC with
# CDEMO-PGM-CONTEXT 0 and CDEMO-FROM-PROGRAM COMEN01C [app/cpy/COMEN02Y.cpy:37-41]
# [app/cbl/COMEN01C.cbl:145-155]. Entered from the menu, COCRDLIC starts afresh,
# takes WHEN OTHER, browses CARDDAT forward from a blank key and sends the first
# page of COCRDLI; every row holding a card gets an unprotected, FSET select
# field, and the empty filters leave ERRMSG blank and INFOMSG 'TYPE S FOR
# DETAIL, U TO UPDATE ANY RECORD' [app/cbl/COCRDLIC.cbl:336-343,572-582,
# 751-831,895-930,1123-1260]. It returns TRANSID CCLI with CDEMO-FROM-PROGRAM
# COCRDLIC [app/cbl/COCRDLIC.cbl:604-619].
#
# ENTER with X in the first row's select field re-enters CCLI from COCRDLIC
# itself, so 2000-RECEIVE-MAP moves CRDSEL1I-CRDSEL7I to WS-EDIT-SELECT
# [app/cbl/COCRDLIC.cbl:357-362,963-978]. Both filters are blank, so
# 2210-EDIT-ACCOUNT and 2220-EDIT-CARD leave INPUT-OK and set CDEMO-ACCT-ID and
# CDEMO-CARD-NUM to zero [app/cbl/COCRDLIC.cbl:1003-1071]. 2250-EDIT-ARRAY counts
# no S or U, then finds row 1 neither SELECT-OK nor SELECT-BLANK: WHEN OTHER sets
# INPUT-ERROR, flags the row and, WS-ERROR-MSG being still off from the start of
# the task, sets WS-INVALID-ACTION-CODE 'INVALID ACTION CODE'; rows 2-7 come
# back blank [app/cbl/COCRDLIC.cbl:77-82,125-126,311,1073-1121].
# The INPUT-ERROR branch of 0000-MAIN finds neither filter in error, so it reads
# forward again from the same blank key and resends the first page
# [app/cbl/COCRDLIC.cbl:418-438]. Row 1 keeps the X, shown in red without the '*'
# that marks a blank selector in error; the filters are LOW-VALUES, shown blank;
# 1400-SETUP-MESSAGE sets the information prompt again and moves the error to
# ERRMSG [app/cbl/COCRDLIC.cbl:678-762,837-930]. No card is viewed or updated:
# no XCTL to COCRDSLC or COCRDUPC takes place.
#
# COCRDLIC filters only by the account and card ids entered, never by user type,
# so the rows are the first seven CARDDATA records in card-number order, the
# same in the ASCII and EBCDIC fixtures [app/cbl/COCRDLIC.cbl:1382-1411]. The
# fixture holds 50 cards, so a next page exists and 'NO MORE RECORDS TO SHOW' is
# never set [app/cbl/COCRDLIC.cbl:1191-1221]. PAGENO is WS-CA-SCREEN-NUM, 1,
# moved into its 3-byte field.
#
# Screen fields are compared at their full BMS length, trailing spaces
# included: ERRMSG is 78 characters (the 75-byte WS-ERROR-MSG padded), INFOMSG
# 45, PAGENO 3, ACCTSID 11, CARDSID 16. CURDATE and CURTIME come from the region
# clock, so they are matchers. The UniKix copy's COCRDLIC.cl2 and COCRDLI.bms
# match app/ on this path. The baseline is derived from the source: no TPE
# region runs in CI.
id: CRD-COCRDLIC-negative-03
level: e2e
type: negative
description: >-
  USER0001 signs on, selects option 3 'Credit Card List' on the main menu and,
  on the first page of the COCRDLIC card list (CCLI), types X in the select
  field of the first card and presses ENTER. X is neither S (view) nor U
  (update), so 2250-EDIT-ARRAY refuses it with 'INVALID ACTION CODE' in the
  message line; the same first page of seven cards is shown again with the X
  kept, the information prompt 'TYPE S FOR DETAIL, U TO UPDATE ANY RECORD',
  blank filters and page 1, and control stays in COCRDLIC.
inventory_ids:
- INV-CRD-011  # COCRDLIC message 'INVALID ACTION CODE' (rule)
- INV-CRD-001  # COCRDLIC program
- INV-MNU-003  # COMEN01 map, the menu option 3 is entered on
- INV-CRD-004  # COCRDLI map, sent on entry and again with the refusal
- INV-CFG-014  # CCLI transaction, under which the selection is processed
- INV-CFG-003  # CARDDAT CSD file, browsed for both pages
- INV-LAY-002  # COCOM01Y: CDEMO-FROM-PROGRAM makes the ENTER a re-entry that receives the map
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y, copied by COCRDLIC
- INV-LAY-011  # CSSTRPFY: YYYY-STORE-PFKEY maps ENTER to CCARD-AID-ENTER
- INV-LAY-019  # CVCRD01Y: CCARD-AID, CC-ACCT-ID, CC-CARD-NUM and CCARD-ERROR-MSG
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-006  # CRD end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    USRSEC: {base: USRSEC}
    CARDDATA: {base: CARDDATA}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '3'
  - aid: ENTER
    '@map': COCRDLI
    fields:
      CRDSEL1: X
expected:
