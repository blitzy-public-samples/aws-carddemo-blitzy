# Manifest of the derived baseline of CRD-COCRDLIC-negative-05: ENTER on the
# COCRDLI card list with ABCDEFGHIJKLMNOP as the card filter, which
# 2220-EDIT-CARD refuses with 'CARD ID FILTER,IF SUPPLIED MUST BE A 16 DIGIT
# NUMBER' while the page-1 rows are redisplayed from the COMMAREA
# [app/cbl/COCRDLIC.cbl:419-438,1036-1071]. Only unikix can run the scenario,
# so expected.yaml is authored from the source and is inferred-not-observed
# (GAP-INF-006, GAP-INF-012). It names no execution_id or execution_fingerprint
# and holds no datasets/ until report.py --import-unikix promotes an eligible
# UniKix run.
#
# source_identity.units are every app/ source the steps execute, not COCRDLIC
# alone: the COPY closure (inventory_tools.copy_closure, as harness.results
# computes it for a program) of COSGN00C, which signs USER0001 on and routes
# to the menu; of COMEN01C, whose COMEN01 screen expected.yaml asserts and
# whose option 3 XCTLs to COCRDLIC [app/cpy/COMEN02Y.cpy:37-40]; and of
# COCRDLIC, including the procedure-division copybook CSSTRPFY; plus the BMS
# sources of COSGN00, COMEN01 and COCRDLI. DFHAID and DFHBMSCA are
# CICS-supplied, not app/ sources, so they are absent.
