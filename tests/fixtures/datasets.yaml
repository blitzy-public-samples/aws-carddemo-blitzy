  layout: CVACT02Y/CARD-RECORD
  cross_check: {source: app/data/EBCDIC/AWS.M2.CARDDEMO.CARDDATA.PS, encoding: cp037}
  registered_mismatches: []
  data_items:
  - app/data/ASCII/carddata.txt
  - app/data/EBCDIC/AWS.M2.CARDDEMO.CARDDATA.PS
  region_files: [CARDDAT]
  gap_ids: []

