    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COACTVWC
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ACCTSID: '00000000003'
    ACSTTUS: 'Y'
    ADTOPEN: '2013-08-23'
    ACRDLIM: '+      4,909.00'
    AEXPDT: '2024-01-10'
    ACSHLIM: '+        538.00'
    AREISDT: '2024-01-10'
    ACURBAL: '+        147.00'
    ACRCYCR: '+           .00'
    AADDGRP: '          '
