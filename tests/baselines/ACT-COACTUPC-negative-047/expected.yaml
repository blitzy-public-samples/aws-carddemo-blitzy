# Derived baseline of ACT-COACTUPC-negative-047 (capture_platform: derived),
# authored from app/ and never captured: no TPE region runs in CI. Open under
# GAP-INF-005 and GAP-INF-012; only `report.py --import-unikix` promotes it.
# USER0001 signs on, takes main-menu option 2, fetches account 00000000001 on
# COACTUP (CAUP), types 1A over the reissue month and presses ENTER.
# - Steps 1-3 end on the main menu, the COACTUP search screen ('Enter or update
#   id of account to update') and the fetched details under PROMPT-FOR-CHANGES
#   [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,2955-2981].
# - Step 4: the changed reissue date sets ACUP-CHANGES-NOT-OK; Account Status,
#   Open Date, Credit Limit, Expiry Date and Cash Credit Limit pass, then
#   EDIT-MONTH of CSUTLDPY refuses 1A through FUNCTION TEST-NUMVAL (should the
#   WS-VALID-MONTH range test fail first, it composes the same text). TRIM gives
#   'Reissue Date', so ERRMSG is the 54-character message padded to 78; later
#   edits keep it, as each composes only while WS-RETURN-MSG-OFF holds, and
#   CSUTLDTC is not called [app/cbl/COACTUPC.cbl:1460-1507]
#   [app/cpy/CSUTLDPY.cpy:91-147,274-278] [app/cpy/CSUTLDWY.cpy:16-20].
# - Nothing is read for update or rewritten, so both files keep their fixture
#   records [app/cbl/COACTUPC.cbl:2596-2597]. 3203 redisplays the received
#   values, 1A included; CSSETATY only colours RISMON, since it writes '*' for a
#   blank field alone; F12=Cancel is bright and F5=Save stays dark, captured as
#   blanks [app/cbl/COACTUPC.cbl:2870-2951,3268-3271,3566-3581].
# The month is 1A, as the scenario types it to isolate the numeric predicate
# (INV-ACT-105); a month such as 16 exercises the 1-12 range predicate, which
# is ACT-COACTUPC-negative-046's item (INV-ACT-104).
# This pins app/'s text: the UniKix CSUTLDPY tests IS NUMERIC and drops TRIM
# (GAP-DOC-024), so a UniKix record is UniKix-copy behavior and never replaces
# this file. Fields are full BMS width with trailing spaces kept; CURDATE and
# CURTIME are run-clock matchers. The body is canonical harness.dump_yaml of the
# scenario's expected.
