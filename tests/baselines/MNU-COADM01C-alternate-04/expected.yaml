# Derived baseline (capture_platform: derived): authored from app/ at
# 93ebec71ff7b59a68cedd7c501afe496a8eaa68d, never captured. One screen per
# step, as tpe.py decodes it: every value full field width, trailing spaces
# kept, fields sent as LOW-VALUES shown as spaces.
# Step 1: signing on as ADMIN001 (type A in USRSEC) makes COSGN00C XCTL to
#   COADM01C [app/cbl/COSGN00C.cbl:211-237], whose first entry sends COADM1A
#   with ERASE from LOW-VALUES, spaces in ERRMSG, the COTTL01Y titles and the
#   4 COADM02Y options built as NUM '. ' NAME into X(40)
#   [app/cbl/COADM01C.cbl:77-90,172-262] [app/cpy/COADM02Y.cpy:20-42]
#   [app/cpy/COTTL01Y.cpy:18-22].
# Step 2: option 3 XCTLs to COUSR02C [app/cbl/COADM01C.cbl:115-145]
#   [app/cpy/COADM02Y.cpy:34-37]. The 160-byte COCOM01Y COMMAREA leaves
#   CDEMO-CU02-USR-SELECTED as spaces, so no user is fetched and COUSR2A is
#   sent empty [app/cbl/COUSR02C.cbl:49-58,87-105,266-303].
# CURDATE and CURTIME come from the region clock, which cannot be fixed
# (GAP-MIS-015), so they carry matchers only.
# report.py --import-unikix promotes or replaces this outcome from an
# eligible UniKix run.
screens:
- '@map': COADM01
  CURDATE:
    format: '%m/%d/%y'
    match: run-date
  CURTIME:
    match: run-time
