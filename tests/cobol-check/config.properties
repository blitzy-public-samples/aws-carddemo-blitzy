#
# This file is consumed by `java -jar tests/cobol-check/lib/cobol-check-*.jar`.
# All paths are interpreted relative to the path supplied via cobol-check's
# -s/--source-context CLI flag (the Makefile sets this to the repository
# root).
# =====================================================================

#---------------------------------------------------------------------------------------------------------------------
# Identifier for this configuration; echoed at run time for traceability.
#---------------------------------------------------------------------------------------------------------------------
config.loaded = aws-carddemo

#---------------------------------------------------------------------------------------------------------------------
# Prefix used for cobol-check's injected field- and paragraph-names. The
# CardDemo production code does not use the "UT-" prefix, so the framework
# default is safe.
#---------------------------------------------------------------------------------------------------------------------
cobolcheck.prefix = UT-

#---------------------------------------------------------------------------------------------------------------------
# Tags surrounding cobol-check's injected blocks. Disabled (null) for clean
# merged source listings.
#---------------------------------------------------------------------------------------------------------------------
cobolcheck.injectedCodeTag.start = null
cobolcheck.injectedCodeTag.end = null

#---------------------------------------------------------------------------------------------------------------------
# Tag prepended to default-stubbed entities.
#---------------------------------------------------------------------------------------------------------------------
cobolcheck.stub.comment.tag = null

#---------------------------------------------------------------------------------------------------------------------
# CardDemo uses period-as-decimal-point throughout (US conventions); leave
# the framework default in place.
#---------------------------------------------------------------------------------------------------------------------
cobolcheck.decimalPointIsComma = false

#---------------------------------------------------------------------------------------------------------------------
# No PROCESS / CBL header-line manipulation is needed for the off-platform
# GnuCOBOL build.
#---------------------------------------------------------------------------------------------------------------------
cobolcheck.append.rules = null

#---------------------------------------------------------------------------------------------------------------------
# Where cobol-check writes the merged Cobol test program and the
# corresponding executable.  All build artifacts are isolated under
# `target/cobol-check/` so that `make clean` removes them in one shot.
#---------------------------------------------------------------------------------------------------------------------
cobolcheck.test.program.path = target/cobol-check/

#---------------------------------------------------------------------------------------------------------------------
# Filename pattern used for the merged test program.  cobol-check rewrites
# this per program-under-test invocation, but the path is honored.
#---------------------------------------------------------------------------------------------------------------------
cobolcheck.test.program.name = CC##99.CBL

#---------------------------------------------------------------------------------------------------------------------
# Report unmocked CALLs so reviewers immediately see when a test fails to
# stub an external dependency.
#---------------------------------------------------------------------------------------------------------------------
cobolcheck.test.unmockcall.display = true

#---------------------------------------------------------------------------------------------------------------------
# Parser error log location.
#---------------------------------------------------------------------------------------------------------------------
testsuite.parser.error.log.path = target/cobol-check/
testsuite.parser.error.log.name = ParserErrorLog.txt

#---------------------------------------------------------------------------------------------------------------------
# Default file-encoding (matches the host JDK's default).
#---------------------------------------------------------------------------------------------------------------------
cobolcheck.file.encoding.linux = default
cobolcheck.file.encoding.macosx = default
cobolcheck.file.encoding.windows = default
cobolcheck.file.encoding.zos = default
cobolcheck.file.encoding.unix = default

#---------------------------------------------------------------------------------------------------------------------
# Permissions applied to all files generated by cobol-check.
#---------------------------------------------------------------------------------------------------------------------
generated.files.permission.all = rwx

#---------------------------------------------------------------------------------------------------------------------
# Always run the merged tests as part of `make test`.
#---------------------------------------------------------------------------------------------------------------------
cobolcheck.test.run = true

#---------------------------------------------------------------------------------------------------------------------
# Application source / copybook locations for CardDemo.
#
# CardDemo's COBOL programs live in `app/cbl/`.  Three copybook search
# paths are configured (colon-separated):
#   * `app/cpy/`               -- production data layouts (CV*Y, CO*Y,
#                                CS*Y, CUSTREC, CSUTLDPY, etc.)
#   * `app/cpy-bms/`           -- BMS map copybooks consumed by CICS
#                                programs
#   * `tests/fixtures/cobol-snippets/`
#                              -- generated record-image fixtures used by
#                                MOCK FILE / MOCK CICS payloads
#   * `tests/stubs/`           -- CICS / Language Environment shim
#                                copybooks (DFHEIBLK, DFHCOMMAREA, etc.)
#---------------------------------------------------------------------------------------------------------------------
application.source.directory = app/cbl
application.copybook.directory = app/cpy:app/cpy-bms:tests/fixtures/cobol-snippets:tests/stubs

#---------------------------------------------------------------------------------------------------------------------
# Test-suite (.cut) location.  Set via -t/--tests on the command line for
# per-program runs but defaulted here so `cobolcheck -p ALL` works.
#---------------------------------------------------------------------------------------------------------------------
test.suite.directory = tests/cobol-check

#---------------------------------------------------------------------------------------------------------------------
# Test result file (extension is appended automatically based on format).
#---------------------------------------------------------------------------------------------------------------------
test.results.file = target/cobol-check/testResults

#---------------------------------------------------------------------------------------------------------------------
# Use plain text for direct console output.
#---------------------------------------------------------------------------------------------------------------------
test.results.format = txt
test.results.format.style = directOutput

#---------------------------------------------------------------------------------------------------------------------
# Source / copybook filename suffix lists.  CardDemo files use either
# `.cbl` (lowercase) or `.CBL` (uppercase) and `.cpy`/`.CPY`.
#---------------------------------------------------------------------------------------------------------------------
application.source.filename.suffix = CBL,cbl
application.copybook.filename.suffix = CBL,cbl,CPY,cpy

#---------------------------------------------------------------------------------------------------------------------
# Concatenation file location.
#---------------------------------------------------------------------------------------------------------------------
concatenated.test.suites = target/cobol-check/ALLTESTS

#---------------------------------------------------------------------------------------------------------------------
# GnuCOBOL compile options used when cobol-check builds the merged
# program.  -fixed forces fixed-format COBOL (CardDemo is fixed-format).
# -I resolves COPY directives to the configured copybook directories.
# Coverage instrumentation is added by the Makefile via the COBC_OPTS
# environment variable when `make coverage` is invoked.
#---------------------------------------------------------------------------------------------------------------------
gnucobol.compile.options = -fixed,-I,app/cpy,-I,app/cpy-bms,-I,tests/fixtures/cobol-snippets,-I,tests/stubs

#---------------------------------------------------------------------------------------------------------------------
# Per-platform shell entry points for cobol-check's compile-and-run cycle.
# The CardDemo project uses the Linux script for all *nix platforms.
#---------------------------------------------------------------------------------------------------------------------
cobolcheck.script.directory = tests/cobol-check/scripts
linux.process   = linux_gnucobol_run_tests
osx.process     = linux_gnucobol_run_tests
freebsd.process = linux_gnucobol_run_tests
windows.process = windows_gnucobol_run_tests.cmd
zos.process     =
unix.process    = linux_gnucobol_run_tests
