# Manifest of the derived baseline of TRN-COTRN02C-recovery-01: USER0001 takes
# main-menu option 8 to the transaction add COTRN02C and enters account
# 00000000001 with no card number while the region file CXACAIX is
# unavailable, so READ CXACAIX answers neither NORMAL nor NOTFND and COTRN02
# shows 'Unable to lookup Acct in XREF AIX file...'
# [app/cbl/COTRN02C.cbl:576-604]. Only unikix can run the scenario, so
# expected.yaml was authored from the source (inferred-not-observed,
# GAP-INF-007, GAP-INF-012); the manifest names no execution_id or
# execution_fingerprint and the baseline holds no datasets/ until an eligible
# UniKix run is imported (report.py --import-unikix).
#
# source_identity.units are the app/ units the three steps execute, not only
# COTRN02C's: harness.results.source_identity gives a steps scenario no units,
# and the expectation also pins the COMEN01 menu screen. So each program the
# steps pass through is listed with its COPY closure
# (inventory_tools.copy_closure) and the BMS source of its map: COSGN00C signs
# USER0001 on and routes it to COMEN01C [app/cbl/COSGN00C.cbl:221-240],
# COMEN01C XCTLs option 8 to COTRN02C [app/cbl/COMEN01C.cbl:115-156]
# [app/cpy/COMEN02Y.cpy:67-72], and COTRN02C runs the lookup. DFHAID and
# DFHBMSCA are CICS-supplied and not in the repository. source_commit is HEAD
# at authoring; app/ is byte-identical to the suite's starting commit.
