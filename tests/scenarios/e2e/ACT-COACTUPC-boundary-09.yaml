# Lower boundary of the Open Date day range: day 00 is a number just below the
# 1-31 range of the shared date edit, so COACTUPC refuses it with 'Open
# Date:day must be a number between 1 and 31.' [app/cpy/CSUTLDPY.cpy:150-207]
# [app/cpy/CSUTLDWY.cpy:26-29]. The month is set to 12, a 31-day month, so the
# day range is the only check that can refuse the date; boundary-10 to -12
# enter days 01, 31 and 32 in the same month.
#
# Steps 1-3 reach the fetched account as ACT-COACTUPC-negative-020 does:
# USER0001 signs on through CC00, chooses option 2 (Account Update) on COMEN01,
# and enters account 00000000001. 9000-READ-ACCT reads CXACAIX by account id
# (card 9680294154603697, customer 000000001, line 49 of
# app/data/ASCII/cardxref.txt), ACCTDAT and CUSTDAT, keeps the records as the
# old values in the COMMAREA and sets ACUP-SHOW-DETAILS; the screen shows them
# with 'Update account details presented above.', every editable field
# unprotected with its MDT on [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,
# 2955-3000,3441-3561,3608-3884].
# Step 4 types 2014, 12 and 00 over the open year, month and day (OPNYEAR,
# OPNMON, OPNDAY) and presses ENTER.
# - 1100-RECEIVE-MAP moves each part, none of them '*' or blank, to
#   ACUP-NEW-OPEN-DATE and every other returned field to ACUP-NEW-DETAILS
#   [app/cbl/COACTUPC.cbl:1039-1230]. 1205-COMPARE-OLD-NEW finds the new date
#   20141200 different from the old 20141120 [app/cbl/COACTUPC.cbl:1692], so
#   1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs the field edits in
#   screen order [app/cbl/COACTUPC.cbl:1460-1470].
# - Account Status 'Y' passes 1220-EDIT-YESNO. Open Date is moved as
#   '20141200' to WS-EDIT-DATE-CCYYMMDD under the name 'Open Date'
#   [app/cbl/COACTUPC.cbl:1472-1482]. EDIT-YEAR-CCYY accepts 2014 (century 20)
#   and EDIT-MONTH accepts 12 (WS-VALID-MONTH, TEST-NUMVAL zero)
#   [app/cpy/CSUTLDPY.cpy:25-148]. EDIT-DAY finds '00' supplied (neither
#   spaces nor LOW-VALUES) and TEST-NUMVAL '00' zero, so WS-EDIT-DATE-DD-N is
#   0, which is not WS-VALID-DAY (VALUES 1 THROUGH 31): it sets INPUT-ERROR
#   and FLG-DAY-NOT-OK and, WS-RETURN-MSG being still blank
#   [app/cbl/COACTUPC.cbl:876], STRINGs the trimmed field name and the
#   template into WS-RETURN-MSG [app/cpy/CSUTLDPY.cpy:150-207].
#   EDIT-DAY-MONTH-YEAR then finds December a 31-day month and not February,
#   finds the date flags not valid, and leaves through
#   EDIT-DATE-CCYYMMDD-EXIT, so CSUTLDTC is not called for this date
#   [app/cpy/CSUTLDPY.cpy:209-282,329].
# - Every later edit passes on the invented customer below and the repository
#   account; they only set their flags, since WS-RETURN-MSG is no longer blank
#   [app/cbl/COACTUPC.cbl:1484-1676]. INPUT-ERROR keeps ACUP-CHANGES-NOT-OK,
#   and 2000-DECIDE-ACTION continues on it, so 9600-WRITE-PROCESSING, the only
#   READ UPDATE and REWRITE path, does not run [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values, the valid amounts
#   re-edited through +ZZZ,ZZZ,ZZZ.99 and the open date as typed; 3250 sets
#   PROMPT-FOR-CHANGES and moves the message to ERRMSG; 3300 keeps the fields
#   editable, marks OPNDAY red through CSSETATY and puts the cursor on it; 3390
#   makes F12=Cancel bright because changes were made, while F5=Save stays dark
#   [app/cbl/COACTUPC.cbl:2870-2951,2955-2983,3007-3031,3224-3228,3566-3581].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - The message is TRIM('Open Date') followed by ':day must be a number
#   between 1 and 31.', 48 characters of the 75-byte WS-RETURN-MSG, shown in
#   the 78-byte ERRMSG with trailing spaces. INFOMSG is the 40-byte
#   WS-INFO-MSG in the 45-byte field. Fields are compared at their full BMS
#   length, trailing spaces kept.
# - FKEY05 and FKEY12 keep their INITIAL text; a dark (ASKIP,DRK) field is
#   captured as blanks.
# - The tpe adapter enters a field with EraseEOF before typing; OPNYEAR is four
#   bytes and OPNMON and OPNDAY two, so '2014', '12' and '00' fill them.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, so the open day is the only field refused: the repository record has
# FICO 274, below 300, and zip 12546, which is not a North Carolina zip
# [app/cbl/COACTUPC.cbl:2514-2558]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-boundary-09
level: e2e
type: boundary
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001, whose open date is 2014-11-20, changes the open date to
  year 2014, month 12 and day 00, the value just below the day range, and
  presses ENTER. Day 00 is a number but not between 1 and 31, so COACTUPC
  refuses the change: it shows the received values again, editable, with
  'Open Date:day must be a number between 1 and 31.' in the message line, the
  change prompt 'Update account details presented above.' and F12=Cancel made
  visible. Nothing is saved: ACCTDATA and CUSTDATA still hold the fetched
  records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-078  # COACTUPC Open Date: day 1-31 (EDIT-DAY, WS-VALID-DAY)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute set on OPNDAY
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-DAY, which refuses the day
- INV-LAY-014  # CSUTLDWY: WS-EDIT-DATE-DD-N and its WS-VALID-DAY 88-level
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY tests the day with IS NUMERIC instead of TEST-NUMVAL and
# drops TRIM from the field name, so on UniKix the message carries the
# 25-byte name 'Open Date' padded with spaces before ':day ...'.
- GAP-DOC-024
# The UniKix COACTUPC comments out the TEST-NUMVAL-C amount checks this path
# runs, so the amounts on screen 4 may differ on UniKix.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
