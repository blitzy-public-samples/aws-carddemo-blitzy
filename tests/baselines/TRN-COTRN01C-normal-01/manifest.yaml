# Manifest of the derived baseline of TRN-COTRN01C-normal-01: USER0001 signs
# on, chooses main menu option 7 'Transaction View', and on the empty COTRN01
# screen enters transaction id 0000000000683580, whose TRANSACT record
# COTRN01C reads with UPDATE by id and shows [app/cbl/COTRN01C.cbl:144-192,267-296].
# Only unikix can run the scenario, so expected.yaml was authored from the
# source, not captured (inferred-not-observed: GAP-INF-007, GAP-INF-012). It
# names no execution_id or execution_fingerprint and holds no datasets/*.bin
# until an eligible UniKix run is imported (report.py --import-unikix), which
# sets capture_platform unikix and bumps the version to 1.1.0 for an equal
# decoded outcome or 2.0.0 for a different one.
#
# source_identity.units are the app/ units the three steps execute, not only
# COTRN01C's own, because expected.yaml asserts the COMEN01 screen as well as
# COTRN01: COSGN00C XCTLs the type-U USER0001 to COMEN01C
# [app/cbl/COSGN00C.cbl:230-240]; COMEN01C XCTLs option 7 to COTRN01C
# [app/cbl/COMEN01C.cbl:127-155] [app/cpy/COMEN02Y.cpy:61-65]; COTRN01C sends
# its empty screen on first entry and the record on ENTER
# [app/cbl/COTRN01C.cbl:88-109]. Each program brings its COPY closure
# (inventory_tools.copy_closure; none of the three CALLs an app/cbl unit) and
# its BMS map, the same 16 units as MNU-COMEN01C-alternate-07, whose steps are
# this scenario's first two. DFHAID and DFHBMSCA are CICS-supplied and not in
# the repository. source_commit is HEAD at authoring; app/ is byte-identical
# to the suite's starting commit 93ebec71ff7b59a68cedd7c501afe496a8eaa68d.
