# Derived baseline of scenario ACT-COACTUPC-negative-079 (capture_platform:
# derived), authored from the app/ source and never observed: no TPE region
# runs in CI. Open until a UniKix run of the app/ build is imported:
# GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012 (online-only
# copybooks such as CSUTLDPY, CSUTLDWY and CSSETATY).
# Steps 1-3: USER0001 signs on, option 2 XCTLs to COACTUPC, and ENTER with
# account 00000000001 shows the fetched account and customer with the change
# prompt [app/cbl/COACTUPC.cbl:2787-2865,2955-2981].
# Step 4: with 39 over DOBDAY, 1205-COMPARE-OLD-NEW reports a change, so
# 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and edits the fields in
# order; every edit before the Date of Birth passes, then
# EDIT-DATE-CCYYMMDD accepts year 1961 and month 06, and EDIT-DAY finds '39'
# numeric (TEST-NUMVAL 0) but outside WS-VALID-DAY (1 through 31) and, the
# message being still off, composes TRIM('Date of Birth') ':day must be a
# number between 1 and 31.' (52 characters) into WS-RETURN-MSG.
# EDIT-DAY-MONTH-YEAR then finds the date flags not all valid and leaves for
# the exit, so CSUTLDTC is not called and EDIT-DATE-OF-BIRTH does not run:
# the outcome depends on neither the run date nor CEEDAYS. No later edit can
# replace the message [app/cbl/COACTUPC.cbl:1533-1543,1545-1676]
# [app/cpy/CSUTLDPY.cpy:150-207,274-278] [app/cpy/CSUTLDWY.cpy:25-29].
# 2000-DECIDE-ACTION continues, so nothing is rewritten; 3203 shows DOBDAY as
# typed, 3250 sets PROMPT-FOR-CHANGES and moves the 75-byte WS-RETURN-MSG to
# the 78-byte ERRMSG, and 3390 brightens FKEY12 because a change was made
# while FKEY05 stays dark; the red DOBDAY and the cursor on it are
# attributes, not captured field values [app/cbl/COACTUPC.cbl:479,
# 2596-2597,2870-2952,2955-2981,3097-3100,3566-3581] [app/cpy/CSSETATY.cpy].
# This pins the app/ text: the UniKix CSUTLDPY tests the day with IS NUMERIC
# and drops TRIM, so its copy would show 'Date of Birth' padded to 25 bytes
# before the colon (GAP-DOC-024); such a record is UniKix-copy behavior and
# never replaces this file.
# Screen values are full BMS width with trailing spaces kept (ERRMSG 78,
# INFOMSG 45, DOBDAY 2), because screens compare exactly. CURDATE and CURTIME
# come from the region clock, which no confirmed command sets (GAP-MIS-015),
# so they keep the scenario's matchers. file_state holds the records as the
# preconditions materialize them, decoded through CVACT01Y and CVCUS01Y,
# unchanged because no REWRITE runs.
