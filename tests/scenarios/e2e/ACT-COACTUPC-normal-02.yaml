      count: 50
      contains:
      - CUST-ID: '1'
        CUST-FIRST-NAME: 'Testfirst                '
        CUST-MIDDLE-NAME: 'Testmiddle               '
        CUST-LAST-NAME: 'Testlast                 '
        CUST-ADDR-LINE-1: '100 Test Street                                   '
        CUST-ADDR-LINE-2: 'Suite 1                                           '
        CUST-ADDR-LINE-3: 'Raleigh                                           '
        CUST-ADDR-STATE-CD: 'NC'
        CUST-ADDR-COUNTRY-CD: 'USA'
        CUST-ADDR-ZIP: '27601     '
        CUST-PHONE-NUM-1: '(919)555-0101  '
        CUST-PHONE-NUM-2: '(919)555-0102  '
        CUST-SSN: '123456789'
        CUST-GOVT-ISSUED-ID: 'TESTGOVT0001        '
        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: 'Y'
        CUST-FICO-CREDIT-SCORE: '720'
    # The account fields COACTUPC rewrites from the screen, all as fetched. The
    # rest of the record is left to the account REWRITE item's own scenario:
    # ACCT-UPDATE-RECORD has no ACCT-ADDR-ZIP, so its group id (LOW-VALUES here)
    # lands on ACCT-ADDR-ZIP and its never-initialized 188-byte FILLER on
    # ACCT-GROUP-ID and the record's FILLER [app/cbl/COACTUPC.cbl:418-433,
    # 3956-4002], a suspected defect this message scenario does not pin.
    ACCTDATA:
      count: 50
      contains:
      - ACCT-ID: '1'
        ACCT-ACTIVE-STATUS: 'Y'
        ACCT-CURR-BAL: '194.00'
        ACCT-CREDIT-LIMIT: '2020.00'
        ACCT-CASH-CREDIT-LIMIT: '1020.00'
        ACCT-OPEN-DATE: '2014-11-20'
        ACCT-EXPIRAION-DATE: '2025-05-20'
        ACCT-REISSUE-DATE: '2025-05-20'
        ACCT-CURR-CYC-CREDIT: '0.00'
        ACCT-CURR-CYC-DEBIT: '0.00'
