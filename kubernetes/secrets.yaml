# ============================================================================
# Kubernetes Secret Manifest for CardDemo Application
# ============================================================================
# Purpose: Secure storage of sensitive configuration data including database
#          credentials, JWT signing keys, Redis passwords, and encryption keys
#
# Migration Context: Part of COBOL-to-Java CardDemo mainframe migration
#                    Replaces mainframe security configuration with cloud-native
#                    secret management per Agent Action Plan Section 0.5
#
# Security Level: CRITICAL - Contains production-sensitive authentication data
# ============================================================================

# ============================================================================
# CRITICAL SECURITY WARNING
# ============================================================================
# WARNING: The values in this file are PLACEHOLDER/EXAMPLE values for
#          development and testing environments ONLY.
#
# PRODUCTION DEPLOYMENT REQUIREMENTS:
# 1. NEVER commit actual production secrets to version control
# 2. Generate cryptographically random secrets using secure methods
# 3. Use external secret management systems for production:
#    - Kubernetes External Secrets Operator
#    - AWS Secrets Manager
#    - Azure Key Vault
#    - HashiCorp Vault
#    - Google Cloud Secret Manager
# 4. Implement secret rotation policies (minimum quarterly)
# 5. Restrict access using Kubernetes RBAC
# 6. Enable audit logging for all secret access
# 7. Use different secrets for each environment (dev/staging/prod)
#
# JWT_SECRET_KEY Requirements:
# - Must be a cryptographically random 256-bit (32-byte) minimum value
# - Generate using: openssl rand -base64 32
# - Never reuse across environments
#
# Database Password Requirements:
# - Minimum 16 characters
# - Include uppercase, lowercase, numbers, and special characters
# - Meet organizational password complexity policies
# - Rotate every 90 days minimum
#
# Redis Password Requirements:
# - Minimum 20 characters for production
# - Use requirepass directive in Redis configuration
# - Consider Redis ACLs for fine-grained access control
# ============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: carddemo-secrets
  namespace: default
  labels:
    app: carddemo
    component: secrets
    tier: infrastructure
    migration-source: cobol-mainframe
    security-level: critical
  annotations:
    description: "Sensitive configuration for CardDemo application migration from COBOL/CICS"
    rotation-policy: "quarterly"
    last-rotation: "2024-01-01"  # Update with actual rotation date
    next-rotation: "2024-04-01"  # Update based on rotation policy
    secret-management: "manual"  # Change to external-secrets-operator in production
type: Opaque

# ============================================================================
# Secret Data - All values must be base64-encoded
# ============================================================================
# To encode a value: echo -n 'your-secret-value' | base64
# To decode a value: echo 'base64-encoded-value' | base64 -d
# ============================================================================
data:
  # ==========================================================================
  # PostgreSQL Database Credentials
  # ==========================================================================
  # Per Agent Action Plan Section 0.5 - Database Configuration
  # PostgreSQL 15.x connection credentials for VSAM-to-PostgreSQL migration
  #
  # Original VSAM files: CUSTDAT, ACCTDAT, CARDDAT, TRANSACT, USRSEC
  # Target: PostgreSQL relational database with referential integrity
  # ==========================================================================
  
  # Database name: "carddemo"
  # Used by PostgreSQL initialization and application datasource
  POSTGRES_DB: Y2FyZGRlbW8=
  
  # Database superuser username: "carddemo"
  # PLACEHOLDER - Use restricted role in production with minimal privileges
  POSTGRES_USER: Y2FyZGRlbW8=
  
  # Database superuser password: "carddemo123"
  # PLACEHOLDER - MUST be replaced with strong password in production
  # Production requirement: Minimum 16 characters, mixed case, numbers, symbols
  POSTGRES_PASSWORD: Y2FyZGRlbW8xMjM=
  
  # Spring Boot datasource username: "carddemo"
  # Application-level database user (should be different from POSTGRES_USER in prod)
  SPRING_DATASOURCE_USERNAME: Y2FyZGRlbW8=
  
  # Spring Boot datasource password: "carddemo123"
  # PLACEHOLDER - Use application-specific credentials in production
  # Grant only required privileges (SELECT, INSERT, UPDATE, DELETE on app tables)
  SPRING_DATASOURCE_PASSWORD: Y2FyZGRlbW8xMjM=

  # ==========================================================================
  # JWT Token Configuration
  # ==========================================================================
  # Per Agent Action Plan Section 0.9 - Security Model Migration
  # JWT replaces CICS session management and RACF authentication
  #
  # Original: CICS pseudo-conversational processing with COMMAREA
  # Target: Stateless JWT tokens with 24-hour expiration
  #
  # Token expiration configured in application.yml: 86400000ms (24 hours)
  # ==========================================================================
  
  # JWT signing secret key (256-bit minimum)
  # Value: "super-secret-jwt-key-for-carddemo-application-signing-please-change-in-production"
  # PLACEHOLDER - Generate production key using: openssl rand -base64 32
  # This key is used to sign and verify all JWT tokens
  # If compromised, all issued tokens are at risk
  JWT_SECRET_KEY: c3VwZXItc2VjcmV0LWp3dC1rZXktZm9yLWNhcmRkZW1vLWFwcGxpY2F0aW9uLXNpZ25pbmctcGxlYXNlLWNoYW5nZS1pbi1wcm9kdWN0aW9u

  # ==========================================================================
  # Redis Authentication
  # ==========================================================================
  # Per Agent Action Plan Section 0.5 - Caching & Session Configuration
  # Redis 7.x for session management replacing CICS session state
  #
  # Original: CICS COMMAREA for conversational state
  # Target: Redis-backed Spring Session for stateless architecture
  # ==========================================================================
  
  # Redis password: "redispass123"
  # PLACEHOLDER - Use strong password with requirepass in production
  # Leave empty if Redis AUTH is disabled (not recommended for production)
  # Production requirement: Minimum 20 characters
  REDIS_PASSWORD: cmVkaXNwYXNzMTIz

  # ==========================================================================
  # Spring Security Configuration
  # ==========================================================================
  # Per Agent Action Plan Section 0.9 - Security Model Preservation
  # BCrypt password encoding replaces USRSEC file-based authentication
  #
  # Original: RACF + USRSEC file with plain/basic encoding
  # Target: BCrypt with configurable strength
  #
  # BCrypt strength 12 balances security and performance
  # Higher values increase security but slow down authentication
  # ==========================================================================
  
  # BCrypt password encoder strength: "12"
  # Range: 4-31 (12 is recommended for production)
  # Each increment doubles computation time
  BCRYPT_STRENGTH: MTI=

  # ==========================================================================
  # Additional Production Secrets (Add as needed)
  # ==========================================================================
  # Uncomment and configure for production deployments:
  
  # API Gateway encryption key
  # API_GATEWAY_SECRET: <base64-encoded-value>
  
  # External payment gateway credentials
  # PAYMENT_GATEWAY_API_KEY: <base64-encoded-value>
  # PAYMENT_GATEWAY_SECRET: <base64-encoded-value>
  
  # Email service credentials (for statement delivery)
  # SMTP_USERNAME: <base64-encoded-value>
  # SMTP_PASSWORD: <base64-encoded-value>
  
  # Monitoring and observability
  # PROMETHEUS_AUTH_TOKEN: <base64-encoded-value>
  # GRAFANA_ADMIN_PASSWORD: <base64-encoded-value>
  
  # Cloud provider credentials (if using managed services)
  # AWS_ACCESS_KEY_ID: <base64-encoded-value>
  # AWS_SECRET_ACCESS_KEY: <base64-encoded-value>

# ============================================================================
# Usage Examples
# ============================================================================
# This Secret is referenced by multiple Kubernetes resources:
#
# 1. Backend Deployment (backend-deployment.yaml):
#    envFrom:
#      - secretRef:
#          name: carddemo-secrets
#
# 2. PostgreSQL Deployment (postgres-deployment.yaml):
#    env:
#      - name: POSTGRES_USER
#        valueFrom:
#          secretKeyRef:
#            name: carddemo-secrets
#            key: POSTGRES_USER
#
# 3. Redis Deployment (redis-deployment.yaml):
#    env:
#      - name: REDIS_PASSWORD
#        valueFrom:
#          secretKeyRef:
#            name: carddemo-secrets
#            key: REDIS_PASSWORD
# ============================================================================

# ============================================================================
# Secret Management Best Practices
# ============================================================================
# 
# CREATING SECRETS SECURELY:
# --------------------------
# Option 1: kubectl create secret (recommended for initial setup)
# kubectl create secret generic carddemo-secrets \
#   --from-literal=POSTGRES_DB=carddemo \
#   --from-literal=POSTGRES_USER=actual-user \
#   --from-literal=POSTGRES_PASSWORD=actual-strong-password \
#   --from-literal=JWT_SECRET_KEY=$(openssl rand -base64 32) \
#   --from-literal=REDIS_PASSWORD=$(openssl rand -base64 20) \
#   --from-literal=BCRYPT_STRENGTH=12 \
#   --namespace=default
#
# Option 2: kubectl apply with sealed secrets (for GitOps)
# - Install sealed-secrets controller
# - Create SealedSecret resource
# - Controller decrypts to native Secret
#
# Option 3: External Secrets Operator (recommended for production)
# - Install External Secrets Operator
# - Configure SecretStore (AWS/Azure/GCP/Vault)
# - Create ExternalSecret resource
# - Operator syncs from external source
#
# ROTATING SECRETS:
# -----------------
# 1. Generate new secret values
# 2. Update secret in cluster: kubectl create secret generic carddemo-secrets \
#    --from-literal=KEY=new-value --dry-run=client -o yaml | kubectl apply -f -
# 3. Perform rolling restart of dependent pods:
#    kubectl rollout restart deployment/carddemo-backend
# 4. Verify application functionality
# 5. Update rotation dates in annotations
#
# ACCESSING SECRETS (for debugging - use with caution):
# -----------------------------------------------------
# View secret keys only:
# kubectl get secret carddemo-secrets -o jsonpath='{.data}'
#
# Decode specific secret (use in secure environment only):
# kubectl get secret carddemo-secrets -o jsonpath='{.data.JWT_SECRET_KEY}' | base64 -d
#
# RBAC RESTRICTIONS:
# ------------------
# Limit secret access to necessary service accounts:
# apiVersion: rbac.authorization.k8s.io/v1
# kind: Role
# metadata:
#   name: secret-reader
# rules:
# - apiGroups: [""]
#   resources: ["secrets"]
#   resourceNames: ["carddemo-secrets"]
#   verbs: ["get"]
#
# AUDIT LOGGING:
# --------------
# Enable Kubernetes audit logging to track secret access:
# - Log all get/list/watch operations on secrets
# - Alert on unauthorized access attempts
# - Review logs regularly for suspicious activity
# ============================================================================
