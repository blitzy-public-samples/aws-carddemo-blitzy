# COACTUPC refuses an account update whose last four SSN characters are not
# all numeric: 1265-EDIT-US-SSN edits SSN part 3 through 1245-EDIT-NUM-REQD
# under the name 'SSN Last 4 chars', which finds it supplied but not NUMERIC
# and composes 'SSN Last 4 chars must be all numeric.'
# [app/cbl/COACTUPC.cbl:2109-2176,2479-2487].
#
# Steps 1-3 reach the fetched account as ACT-COACTUPC-alternate-04 does:
# USER0001 signs on through CC00, chooses option 2 (Account Update) on COMEN01,
# and enters account 00000000001. 9000-READ-ACCT reads CXACAIX by account id
# (card 9680294154603697, customer 000000001, line 49 of
# app/data/ASCII/cardxref.txt), ACCTDAT and CUSTDAT, keeps the records as the
# old values in the COMMAREA and sets ACUP-SHOW-DETAILS; the screen shows them
# with 'Update account details presented above.', every editable field
# unprotected with its MDT on [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,
# 2955-3000,3441-3561,3608-3884].
# Step 4 types 67A9 over the last four SSN characters (ACTSSN3, shown as 6789)
# and presses ENTER.
# - 1100-RECEIVE-MAP moves the received '67A9', neither '*' nor spaces, to
#   ACUP-NEW-CUST-SSN-3 [app/cbl/COACTUPC.cbl:1247-1252].
#   1205-COMPARE-OLD-NEW finds ACUP-NEW-CUST-SSN-X ('1234567A9') unequal to
#   the old SSN '123456789', so a change has occurred, and
#   1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs the field edits in
#   screen order [app/cbl/COACTUPC.cbl:1460-1470,1681-1766].
# - Account Status, the three account dates and the five amounts pass on the
#   repository account [app/cbl/COACTUPC.cbl:1472-1527]. 1265-EDIT-US-SSN
#   passes 'SSN: First 3 chars' 123 (numeric, not zero, not 000, 666 or
#   900-999) and 'SSN 4th & 5th chars' 45 (numeric, not zero)
#   [app/cbl/COACTUPC.cbl:1529-1531,2431-2477].
# - For part 3 it moves 'SSN Last 4 chars' to WS-EDIT-VARIABLE-NAME,
#   ACUP-NEW-CUST-SSN-3 to WS-EDIT-ALPHANUM-ONLY and 4 to
#   WS-EDIT-ALPHANUM-LENGTH. 1245-EDIT-NUM-REQD finds the 4 characters neither
#   LOW-VALUES nor SPACES and their trimmed length not zero, so the supplied
#   check passes; '67A9' fails IS NUMERIC on the A, so it sets INPUT-ERROR and
#   FLG-ALPHNANUM-NOT-OK and, WS-RETURN-MSG being still blank
#   [app/cbl/COACTUPC.cbl:876], STRINGs the trimmed field name and ' must be
#   all numeric.' into WS-RETURN-MSG; the zero check is skipped
#   [app/cbl/COACTUPC.cbl:2113-2152]. The flag moves to
#   WS-EDIT-US-SSN-PART3-FLGS, giving FLG-EDIT-US-SSN-PART3-NOT-OK
#   [app/cbl/COACTUPC.cbl:2481-2487].
# - Every later edit passes on the invented customer below; they only set
#   their flags, since WS-RETURN-MSG is no longer blank
#   [app/cbl/COACTUPC.cbl:1533-1676]. INPUT-ERROR keeps ACUP-CHANGES-NOT-OK,
#   and 2000-DECIDE-ACTION continues on it, so 9600-WRITE-PROCESSING, the only
#   READ UPDATE and REWRITE path, does not run [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values, the valid amounts
#   re-edited through +ZZZ,ZZZ,ZZZ.99 and the SSN parts as received
#   [app/cbl/COACTUPC.cbl:2870-2951]; 3250 sets PROMPT-FOR-CHANGES and moves
#   the message to ERRMSG; 3300 keeps the fields editable, puts the cursor on
#   ACTSSN3 and marks it red through CSSETATY without the '*' of a blank field;
#   3390 makes F12=Cancel bright because changes were made, while F5=Save
#   stays dark [app/cbl/COACTUPC.cbl:2955-2983,3086-3088,3309-3313,3566-3581]
#   [app/cpy/CSSETATY.cpy:18-27].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - The message is TRIM('SSN Last 4 chars') followed by ' must be all
#   numeric.', 37 characters of the 75-byte WS-RETURN-MSG, shown in the
#   78-byte ERRMSG with trailing spaces. INFOMSG is the 40-byte WS-INFO-MSG in
#   the 45-byte field. Fields are compared at their full BMS length, trailing
#   spaces kept.
# - ACTSSN3 is 4 bytes long [app/bms/COACTUP.bms:280-284], so the typed '67A9'
#   fills it and comes back unpadded.
# - FKEY05 and FKEY12 keep their INITIAL text; a dark (ASKIP,DRK) field is
#   captured as blanks. Colour and cursor position are not in the s3270 text
#   capture and are not asserted.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, so SSN part 3 is the only field refused: the repository record has
# FICO 274, below 300, and zip 12546, which is not a North Carolina zip
# [app/cbl/COACTUPC.cbl:2514-2558]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-069
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001, whose customer's SSN is 123-45-6789, types 67A9 over
  the last four SSN characters and presses ENTER. The part is supplied but not
  all numeric, so COACTUPC refuses the change: it shows the received values
  again, editable, with 'SSN Last 4 chars must be all numeric.' in the message
  line, the SSN part as typed, the change prompt 'Update account details
  presented above.' and F12=Cancel made visible. Nothing is saved: ACCTDATA
  and CUSTDATA still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-127  # COACTUPC SSN Last 4 chars: all numeric (1245-EDIT-NUM-REQD)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute set on ACTSSN3
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the date edits the account dates and birth date pass
- INV-LAY-014  # CSUTLDWY: the date-edit working storage
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix COACTUPC drops FUNCTION TRIM from the field name of every composed
# edit message, so on UniKix the message differs; the app/ behaviour is
# pinned.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
        CUST-ADDR-ZIP: '27601'
