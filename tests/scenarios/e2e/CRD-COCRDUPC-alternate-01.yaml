# COCRDUPC's search prompt on first entry from the main menu. USER0001 (type U
# in the USRSEC fixture) signs on through CC00 and COSGN00C XCTLs to COMEN01C
# [app/cbl/COSGN00C.cbl:221-240]. Option '5' of the main menu is 'Credit Card
# Update', so COMEN01C sets CDEMO-FROM-PROGRAM to COMEN01C and CDEMO-PGM-CONTEXT
# to 0 and XCTLs to COCRDUPC with the COMMAREA [app/cbl/COMEN01C.cbl:145-155]
# [app/cpy/COMEN02Y.cpy:49-53].
# COCRDUPC initializes CC-WORK-AREA, WS-MISC-STORAGE and WS-COMMAREA and turns
# the return message off [app/cbl/COCRDUPC.cbl:374-384]. Its COMMAREA test
# reads CDEMO-FROM-PROGRAM before the passed COMMAREA is copied in
# [app/cbl/COCRDUPC.cbl:388-401]; either branch leaves CDEMO-PGM-ENTER set and
# the caller COMEN01C or blank. EIBAID is still ENTER, a valid key here, and
# neither the sign-on nor the menu sets CDEMO-LAST-MAPSET, so the PF3 and
# card-list branches are skipped and the fresh-entry branch runs: it
# initializes WS-THIS-PROGCOMMAREA, leaving CCUP-DETAILS-NOT-FETCHED, and
# performs 3000-SEND-MAP [app/cbl/COCRDUPC.cbl:406-424,435-511].
# 3100-SCREEN-INIT clears CCRDUPAO to LOW-VALUES and fills the header;
# 3200-SETUP-SCREEN-VARS moves nothing while CDEMO-PGM-ENTER is set, so the
# account, card number and card detail fields stay LOW-VALUES;
# 3250-SETUP-INFOMSG sets PROMPT-FOR-SEARCH-KEYS on CDEMO-PGM-ENTER and moves
# WS-INFO-MSG to INFOMSG and the blank WS-RETURN-MSG to ERRMSG
# [app/cbl/COCRDUPC.cbl:1035-1163]. 3300-SETUP-SCREEN-ATTRS writes '*' into the
# key fields only once CDEMO-PGM-REENTER is set, which happens after the send
# [app/cbl/COCRDUPC.cbl:1168-1318]. The map is sent with ERASE and the task
# returns with TRANSID CCUP [app/cbl/COCRDUPC.cbl:1324-1337,546-558].
# No file is read on this path, so no CSD file item is listed. The sign-on and
# option steps only establish the session: CC00, CM00, COSGN00C, COMEN01C and
# the option-5 navigation are verified by the SEC-COSGN00C and MNU-COMEN01C
# scenarios, so they are not listed here.
# Screen fields compare at their full BMS length, trailing spaces kept: the
# 36-character prompt fills INFOMSG (40) with 4 trailing spaces, FKEYS shows its
# INITIAL text, and every field the program leaves at LOW-VALUES or blank shows
# as spaces. ERRMSG (POS=(23,1), LENGTH=80) ends on row 24, column 1, which
# holds the attribute byte of FKEYS and shows as a space [app/bms/COCRDUP.bms].
# EXPDAY and FKEYSC are dark fields and are not asserted. CURDATE and CURTIME
# come from the region clock, so they are matchers and the clock is relative.
# The baseline is derived from the source: no TPE region runs in CI.
id: CRD-COCRDUPC-alternate-01
level: e2e
type: alternate
description: >-
  USER0001 signs on, selects main menu option 5 'Credit Card Update', and lands
  on the COCRDUPC card update screen COCRDUP (transaction CCUP) with the prompt
  'Please enter Account and Card Number' in INFOMSG, empty account and card
  numbers, every card detail field empty and no error message.
inventory_ids:
- INV-CRD-048  # COCRDUPC message 'Please enter Account and Card Number' (PROMPT-FOR-SEARCH-KEYS)
- INV-CRD-003  # COCRDUPC program
- INV-CRD-006  # COCRDUP map, the screen the prompt is shown on
- INV-MNU-003  # COMEN01 map, the screen option 5 is entered on
# The transaction COCRDUPC names in TRNNAME and returns with (RETURN TRANSID).
- INV-CFG-015  # CCUP transaction
- INV-LAY-002  # COCOM01Y: the COMMAREA COMEN01C passes on the XCTL, CDEMO-PGM-ENTER
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y, copied by COCRDUPC
- INV-LAY-009  # CSMSG02Y, the abend data COCRDUPC copies
- INV-LAY-011  # CSSTRPFY: YYYY-STORE-PFKEY maps EIBAID ENTER to CCARD-AID-ENTER
- INV-LAY-019  # CVCRD01Y: CC-WORK-AREA and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-006  # CRD end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-INF-003  # the COMEN01 screen expectation is a derived MNU baseline
- GAP-INF-010  # the CCUP transaction expectation is a derived CFG baseline
preconditions:
  datasets:
    # COSGN00C reads the sign-on user USER0001 from USRSEC.
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '5'
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
  - '@map': COCRDUP
    TRNNAME: CCUP
    PGMNAME: COCRDUPC
    TITLE01: '      AWS Mainframe Modernization       '
    TITLE02: '              CardDemo                  '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    ACCTSID: '           '
    CARDSID: '                '
    CRDNAME: '                                                  '
    CRDSTCD: ' '
    EXPMON: '  '
    EXPYEAR: '    '
    INFOMSG: 'Please enter Account and Card Number    '
    ERRMSG: '                                                                                '
    FKEYS: 'ENTER=Process F3=Exit'
