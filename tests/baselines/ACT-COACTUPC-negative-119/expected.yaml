# Derived baseline of scenario ACT-COACTUPC-negative-119 (capture_platform:
# derived), authored from the app/ source and never observed: no TPE region
# runs in CI. Open until a UniKix run of the app/ build is imported:
# GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012 (online-only
# copybooks such as CSLKPCDY and CSSETATY).
# Steps 1-3: USER0001 signs on, option 2 XCTLs to COACTUPC, and ENTER with
# account 00000000001 shows the fetched account and customer with the change
# prompt; Phone Number 2 is cut from '(919)555-0102' into 919, 555 and 0102
# [app/cbl/COACTUPC.cbl:2787-2865,2955-2981].
# Step 4: the erased ACSPH2B reaches ACUP-NEW-CUST-PHONE-NUM-2B as LOW-VALUES
# [app/cbl/COACTUPC.cbl:1385-1390]; 1205-COMPARE-OLD-NEW sees the change, so
# 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and edits the fields in order,
# Account Status through Phone Number 1 passing on the fetched values
# [app/cbl/COACTUPC.cbl:1460-1638,1751-1753]. For 'Phone Number 2'
# 1260-EDIT-US-PHONE-NUM runs because the area code is supplied;
# EDIT-AREA-CODE accepts 919, a general-purpose code
# [app/cbl/COACTUPC.cbl:2232-2314] [app/cpy/CSLKPCDY.cpy:521,895]; then
# EDIT-US-PHONE-PREFIX finds the prefix LOW-VALUES, sets INPUT-ERROR and
# FLG-EDIT-US-PHONEB-BLANK and, the message being still off, composes
# TRIM('Phone Number 2') ': Prefix code must be supplied.' (45 characters)
# into WS-RETURN-MSG; the line number 0102 and the later edits pass and cannot
# replace the message [app/cbl/COACTUPC.cbl:1640-1676,2316-2421].
# 2000-DECIDE-ACTION continues, so nothing is rewritten; 3203 shows the
# received values, 3250 sets PROMPT-FOR-CHANGES and moves the message to
# ERRMSG, CSSETATY moves '*' to the three-byte ACSPH2BO because the prefix is
# blank on re-entry, and 3390 brightens FKEY12 [app/cbl/COACTUPC.cbl:2596-2597,
# 2870-2951,2955-2983,3416-3420,3566-3581] [app/cpy/CSSETATY.cpy:17-27].
# This pins the app/ text: the UniKix COACTUPC drops TRIM, so its copy would
# show 'Phone Number 2' padded to 25 bytes before the suffix (GAP-DOC-022);
# such a record is UniKix-copy behavior and never replaces this file.
# Screen values are full BMS width with trailing spaces kept (ERRMSG 78,
# INFOMSG 45, ACSPH2B 3), because screens compare exactly. CURDATE and CURTIME
# come from the region clock, so they are matchers. file_state holds the
# records as the preconditions materialize them, decoded through CVACT01Y and
# CVCUS01Y, unchanged because no REWRITE runs.
