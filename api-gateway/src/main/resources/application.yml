# =====================================================================
# api-gateway - Spring Boot application configuration
#
# Edge router (Spring Cloud Gateway Server WebMVC, servlet flavor) plus
# the local menu-navigation service re-platforming legacy CICS
# transactions CM00 (COMEN01C) and CA00 (COADM01C).
#
# All connection details and downstream base URIs are environment
# driven so the SAME artifact runs on a developer workstation (defaults
# below), under Docker Compose (SPRING_PROFILES_ACTIVE=docker), and on
# Kubernetes (SPRING_PROFILES_ACTIVE=k8s, values from the carddemo-config
# ConfigMap). The gateway owns NO database - there are intentionally no
# datasource / JPA / Flyway keys here.
# =====================================================================
spring:
  application:
    name: api-gateway

  # Externalized pseudo-conversational session state (COMMAREA
  # replacement, AAP 0.6.3). Spring Session persists the shared
  # SessionContext in Redis so state survives across the stateless
  # gateway and downstream services. Host/port are env-overridable.
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # Bounded Redis command/connect timeouts (QA Issue 3): Lettuce otherwise applies
      # its 60s default, which makes the aggregate /actuator/health unresponsive for the
      # whole duration of a Redis outage.
      timeout: 2s
      connect-timeout: 2s
  # Boot 4.x auto-detects the Redis session store from spring-session-data-redis
  # on the classpath; the legacy spring.session.store-type property was removed
  # and is inert (QA CR-15). PROPERTY NAMES: Boot 4 moved the Redis session keys
  # from spring.session.redis.* to spring.session.data.redis.*; the old keys bind
  # but carry no value, so the shared namespace below was silently ignored and
  # every service fell back to the default 'spring:session' prefix. Canonical Boot
  # 4.1 keys are used here so the namespace is genuinely applied. Session tuning;
  # the connection uses spring.data.redis.* above. The shared namespace lets the
  # gateway and every downstream service read/write the same session.
  session:
    timeout: ${SPRING_SESSION_TIMEOUT:30m}
    data:
      redis:
        namespace: ${SPRING_SESSION_REDIS_NAMESPACE:carddemo:session}
        flush-mode: on-save

  # ------------------------------------------------------------------
  # Gateway route table - SERVLET Spring Cloud Gateway Server WebMVC.
  # Namespace MUST be spring.cloud.gateway.server.webmvc.routes
  # (NEVER the reactive spring.cloud.gateway.routes, NEVER the
  # deprecated spring.cloud.gateway.mvc.routes).
  #
  # 8 downstream routes. Each downstream base URI is env-overridable so
  # Compose/K8s can point at service DNS. Local defaults use the
  # per-service host ports published by docker-compose.
  #
  # NOTE: /menu/** and /admin/** are deliberately ABSENT here - they are
  # served LOCALLY by MenuController (legacy CM00/CA00) and must NOT be
  # routed downstream.
  # ------------------------------------------------------------------
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/auth/**
            - id: user-service
              uri: ${USER_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/users/**
            - id: account-service
              uri: ${ACCOUNT_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/accounts/**
            - id: card-service
              uri: ${CARD_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/cards/**
            - id: transaction-service
              uri: ${TRANSACTION_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/transactions/**
            - id: billpay-service
              uri: ${BILLPAY_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/billpay/**
            - id: reporting-service
              uri: ${REPORTING_SERVICE_URI:http://localhost:8087}
              predicates:
                - Path=/reports/**
            - id: batch-service
              uri: ${BATCH_SERVICE_URI:http://localhost:8088}
              predicates:
                - Path=/batch/**

# --------------------------------------------------------------------
# Session-cookie policy for the shared Spring Session cookie (CWE-614).
# SameSite=Strict: the cookie carries financial authority, so it is never
# sent on a cross-site request. Secure defaults to TRUE; it is switched off
# only where the stack is deliberately served over plain HTTP with no TLS
# terminator in front of it (the local Docker Compose profile sets
# CARDDEMO_COOKIE_SECURE=false), while every TLS-terminated deployment keeps
# the secure default.
# --------------------------------------------------------------------
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: ${CARDDEMO_COOKIE_SECURE:true}
  port: 8080

# --------------------------------------------------------------------
# Observability (AAP 0.7.5). The gateway is the distributed-tracing
# entry point, so it samples at 1.0 locally.
#
# NOTE: do NOT add management.metrics.tags.application here - the shared
# carddemo-common ObservabilityConfig already registers that common tag
# via a MeterRegistryCustomizer; setting it here would duplicate it.
# --------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      # The datastore health contributors are CONDITIONAL: Redis health is switched off
      # in the slice/integration test contexts (spring.autoconfigure.exclude of the Redis
      # auto-configuration, or management.health.redis.enabled=false), and a deployment
      # may legitimately run a service without one of them. Boot's default strict group
      # membership validation aborts context startup when a listed contributor is absent,
      # so it is relaxed here; the groups themselves are asserted at runtime (readiness
      # turns 503 when PostgreSQL or Redis goes away).
      validate-group-membership: false
      # Explicit probe groups (QA Issue 4). Boot's default readiness group contains only
      # readinessState, so readiness reported UP while PostgreSQL and Redis were both
      # unavailable and Kubernetes kept routing traffic to a pod that could not serve a
      # single datastore-backed request. Readiness now includes this service's actual
      # datastore dependencies, while liveness deliberately stays limited to
      # livenessState: a datastore outage must remove the pod from the Service
      # endpoints, never restart a perfectly healthy container.
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  # Distributed tracing export (AAP 0.7.5). The gateway is the trace entry point, so its
  # sampling DEFAULT stays 1.0, but both the OTLP endpoint and the probability are
  # environment-driven - an operator lowers the sample under load via the env var without
  # rebuilding the image.
  #
  # PROPERTY NAME: 'management.otlp.tracing.endpoint' was REMOVED in Spring Boot 4.0
  # (deprecation level "error", replacement below). Using the old key silently exported
  # nothing, which is one half of why tracing produced no spans at all (QA Issue 6). The
  # canonical Boot 4.1 key is used here, and the default now points at the OTLP HTTP
  # receiver of the 'jaeger' collector declared in docker-compose.yml / k8s rather than
  # at the container's own loopback.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

# ---------------------------------------------------------------------
# Structured-logging members (QA Issue 8).
#
# The Logstash structured format emitted by logback-spring.xml carries the
# message, the level, the logger, the thread and every MDC entry
# (correlationId/traceId/spanId) but NO service identity, so a JSON record
# scraped out of an aggregated log stream could not be attributed to the
# service that produced it - the container name was the only clue, and it is
# absent once records are shipped. `logging.structured.json.add` adds the
# member to every record emitted by Spring Boot's StructuredLogEncoder,
# including the encoder declared explicitly in logback-spring.xml.
# ---------------------------------------------------------------------
logging:
  structured:
    json:
      add:
        service: ${spring.application.name}

# ====================================================================
# Docker Compose profile (SPRING_PROFILES_ACTIVE=docker).
# Redis and every downstream service resolve by compose service DNS on
# their INTERNAL container port 8080. The full route table is repeated
# because Spring replaces (does not merge) the routes list for the
# active profile.
# ====================================================================
---
spring:
  config:
    activate:
      on-profile: docker
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://auth-service:8080}
              predicates:
                - Path=/auth/**
            - id: user-service
              uri: ${USER_SERVICE_URI:http://user-service:8080}
              predicates:
                - Path=/users/**
            - id: account-service
              uri: ${ACCOUNT_SERVICE_URI:http://account-service:8080}
              predicates:
                - Path=/accounts/**
            - id: card-service
              uri: ${CARD_SERVICE_URI:http://card-service:8080}
              predicates:
                - Path=/cards/**
            - id: transaction-service
              uri: ${TRANSACTION_SERVICE_URI:http://transaction-service:8080}
              predicates:
                - Path=/transactions/**
            - id: billpay-service
              uri: ${BILLPAY_SERVICE_URI:http://billpay-service:8080}
              predicates:
                - Path=/billpay/**
            - id: reporting-service
              uri: ${REPORTING_SERVICE_URI:http://reporting-service:8080}
              predicates:
                - Path=/reports/**
            - id: batch-service
              uri: ${BATCH_SERVICE_URI:http://batch-service:8080}
              predicates:
                - Path=/batch/**

---
# ---------------------------------------------------------------------------
# Metrics reach Prometheus by scrape (AAP 0.7.5), so the OTLP metrics registry the
# OpenTelemetry starter brings along is switched off; only spans are exported over
# OTLP (see management.opentelemetry.tracing.export.otlp above).
# ---------------------------------------------------------------------------
management:
  otlp:
    metrics:
      export:
        enabled: false
