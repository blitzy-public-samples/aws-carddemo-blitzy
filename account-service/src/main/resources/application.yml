# =====================================================================
# account-service - Spring Boot application configuration.
#
# REST re-platforming of the legacy COBOL account programs COACTVWC
# (account view, CICS CAVW) and COACTUPC (account update with
# optimistic locking, CICS CAUP), formerly backed by the VSAM KSDS
# ACCTFILE / CUSTFILE. Every connection setting is environment-driven
# so the same artifact runs locally, under Docker Compose
# (SPRING_PROFILES_ACTIVE=docker) and on Kubernetes; the values below
# are developer-workstation defaults.
# =====================================================================
spring:
  application:
    name: account-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carddemo}
    username: ${SPRING_DATASOURCE_USERNAME:carddemo}
    password: ${SPRING_DATASOURCE_PASSWORD:carddemo}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates entity mapping.
      ddl-auto: validate

  # Flyway is DISABLED for account-service: it owns no db/migration scripts in
  # this tranche. A single migration owner (batch-service) applies the shared
  # 'carddemo' schema/history, avoiding multiple concurrent Flyway histories
  # and baseline gaps in one public schema (QA CR-09/CR-16). The consolidated
  # business-schema migration (customers, accounts) is a documented
  # cross-tranche deliverable; see docs/decision-log.md. Re-enable only when
  # this service owns versioned migrations under its dedicated history table.
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false
    table: flyway_schema_history_account

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  # Externalized pseudo-conversational session (COMMAREA replacement).
  # Boot 4.x auto-detects the Redis session store from spring-session-data-redis
  # on the classpath; the legacy spring.session.store-type property was removed
  # and is inert (QA CR-15). Session tuning lives under spring.session.redis.*;
  # the Redis connection uses spring.data.redis.* declared above. A shared
  # namespace lets every service read/write the same COMMAREA-equivalent session.
  session:
    timeout: ${SPRING_SESSION_TIMEOUT:30m}
    redis:
      namespace: ${SPRING_SESSION_REDIS_NAMESPACE:carddemo:session}
      flush-mode: on-save

server:
  port: 8080

# Observability (AAP 0.7.5): health/info/prometheus exposure plus
# liveness/readiness probes for Kubernetes. The common 'application'
# metrics tag is contributed by carddemo-common ObservabilityConfig -
# do not duplicate it here.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Health detail is disclosed only to authenticated principals so an
      # anonymous caller cannot enumerate datastore/dependency internals
      # (QA MJ-16). Liveness/readiness aggregate status stays public for probes.
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  # Distributed tracing export (QA CR-12). The OTLP endpoint and the sampling
  # probability are environment-driven (QA MN-03): 100% capture is unsafe for
  # p95/memory NFRs in production, so the default is a 10% sample that each
  # environment overrides (e.g. 1.0 in dev, lower under load).
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}

# ---------------------------------------------------------------------
# Docker Compose profile (SPRING_PROFILES_ACTIVE=docker). Compose passes
# explicit env vars; these defaults resolve the compose service
# hostnames (postgres, redis) even if a var is unset.
# ---------------------------------------------------------------------
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/carddemo}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
