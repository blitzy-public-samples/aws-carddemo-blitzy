# Manifest of the derived baseline of USR-COUSR01C-alternate-02: CU01 entered
# directly, without a COMMAREA. Only unikix can run the scenario, so
# expected.yaml was authored from the source, not captured
# (inferred-not-observed, GAP-INF-004, GAP-INF-012). It names no execution_id
# or execution_fingerprint and holds no datasets/ until an eligible UniKix run
# is imported (report.py --import-unikix), the only way it is promoted.
#
# source_identity.units are the app/ units the step executes: COUSR01C, which
# finds EIBCALEN = 0 and XCTLs to COSGN00C with a COMMAREA before sending any
# map of its own [app/cbl/COUSR01C.cbl:78-80,165-178], and COSGN00C, which
# takes the ENTER as an empty sign-on attempt and sends the sign-on map
# COSGN00 [app/cbl/COSGN00C.cbl:80-88,108-122]. Each program brings its COPY
# closure, as harness.results computes it for a program, so COSGN00C's
# symbolic map COSGN00.CPY is listed too; COSGN00.bms is the one map sent.
# COUSR01.bms is never sent on this path, so it is absent. DFHAID and DFHBMSCA
# are CICS-supplied and not in the repository. source_commit is HEAD at
# authoring; app/ is byte-identical to the suite's starting commit.
