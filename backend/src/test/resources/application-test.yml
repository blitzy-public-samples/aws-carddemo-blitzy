# Test configuration for CardDemo application
# Uses H2 in-memory database for fast unit testing without external dependencies

spring:
  application:
    name: carddemo-test
  
  # H2 in-memory database configuration
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # JPA configuration for H2
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  
  # Disable Flyway for tests (use Hibernate auto-DDL instead)
  flyway:
    enabled: false
  
  # Disable batch processing for unit tests
  batch:
    job:
      enabled: false
  
  # Security configuration for tests
  security:
    user:
      name: test
      password: test

# Server configuration
server:
  port: 0  # Random port for tests

# JWT configuration for tests
jwt:
  # Base64-encoded test secret key (minimum 256 bits for HMAC-SHA256)
  # This is a test-only key - production keys should be managed via Kubernetes secrets
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtYXV0aGVudGljYXRpb24tdGVzdGluZy0yNTYtYml0cw==
  expiration: 3600000  # 1 hour in milliseconds

# Logging configuration
logging:
  level:
    root: WARN
    com.carddemo: INFO
    org.springframework: WARN
    org.hibernate: WARN
