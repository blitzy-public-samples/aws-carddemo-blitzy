# Manifest of the derived baseline of MNU-COADM01C-negative-01 (PF5 on the
# admin menu). Only unikix can run the scenario, so expected.yaml is authored
# from the source and is inferred-not-observed (GAP-INF-003, GAP-INF-012). It
# names no execution_id or execution_fingerprint and holds no datasets/ until
# an eligible UniKix run is imported (report.py --import-unikix).
#
# source_identity.units are the COPY closure, as harness.results computes it
# for a program (symbolic maps in app/cpy-bms included), of each program the
# steps run - COSGN00C for the CC00 sign-on, which XCTLs ADMIN001 to COADM01C
# [app/cbl/COSGN00C.cbl:221-240], and COADM01C - plus the BMS sources of their
# maps COSGN00 and COADM01. DFHAID and DFHBMSCA are CICS-supplied and not in
# the repository. The expected screens are derived from COADM01C's reentry
# WHEN OTHER path and its SEND-MENU-SCREEN header and option build
# [app/cbl/COADM01C.cbl:92-103,172-263], CCDA-MSG-INVALID-KEY
# [app/cpy/CSMSG01Y.cpy:20-21], the four options of COADM02Y that fill
# OPTN001-OPTN004, the TITLE01/TITLE02 texts of COTTL01Y, the field lengths of
# the COADM01 map, and CSDAT01Y, whose '/' and ':' fillers and 8-byte MM/DD/YY
# and HH:MM:SS fields give the asserted CURDATE and CURTIME formats
# [app/cpy/CSDAT01Y.cpy:30-41].
