  # Back up TRANSACT, select and sort the window's records by card, and report them
  # with CBTRN03C. The REPROC step and the SORT step are both named STEP05R
  # (GAP-DEF-009).
  TRANREPT:
    source: app/jcl/TRANREPT.jcl
    procs: [app/proc/REPROC.prc]
    jcllib: [AWS.M2.CARDDEMO.PROC]
    steps:
    # Step PRC001 of procedure REPROC [app/proc/REPROC.prc:21-28], called by
    # [app/jcl/TRANREPT.jcl:23-33] with FILEIN and FILEOUT overridden.
    - step: STEP05R.PRC001
      kind: idcams
      proc: {name: REPROC, source: app/proc/REPROC.prc, procstep: PRC001, symbols: {CNTLLIB: AWS.M2.CARDDEMO.CNTL}}
      dd:
        SYSPRINT: {sysout: '*'}
        FILEIN: {dsn: AWS.M2.CARDDEMO.TRANSACT.VSAM.KSDS, logical: TRANSACT, disp: [SHR]}
        FILEOUT: {dsn: AWS.M2.CARDDEMO.TRANSACT.BKUP, gdg: "+1", logical: TRANSACT-BKUP, disp: [NEW, CATLG, DELETE], dcb: {lrecl: 350, recfm: FB}}
        SYSIN: {dsn: AWS.M2.CARDDEMO.CNTL, disp: [SHR], member: {name: REPROCT, source: app/ctl/REPROCT.ctl}}
    # [app/jcl/TRANREPT.jcl:37-55]
    - step: STEP05R
      kind: sort
      dd:
        SORTIN: {dsn: AWS.M2.CARDDEMO.TRANSACT.BKUP, gdg: "+1", logical: TRANSACT-BKUP, disp: [SHR]}
        SYSOUT: {sysout: '*'}
        SORTOUT: {dsn: AWS.M2.CARDDEMO.TRANSACT.DALY, gdg: "+1", logical: TRANSACT-DALY, disp: [NEW, CATLG, DELETE], dcb: {refer: SORTIN}}
      params:
        sysin:
        - " SORT FIELDS=(TRAN-CARD-NUM,A)"
        - " INCLUDE COND=(TRAN-PROC-DT,GE,PARM-START-DATE,AND,"
        - "         TRAN-PROC-DT,LE,PARM-END-DATE)"
        symnames:
        - "TRAN-CARD-NUM,263,16,ZD"
        - "TRAN-PROC-DT,305,10,CH"
        - "PARM-START-DATE,C'2022-01-01'                                      //Date"
        - "PARM-END-DATE,C'2022-07-06'                                        //Date"
    # [app/jcl/TRANREPT.jcl:59-80]
    # No job or data file creates AWS.M2.CARDDEMO.DATEPARM; scenarios supply it
    # (GAP-MIS-001).
    - step: STEP10R
      kind: program
      program: CBTRN03C
      dd:
        STEPLIB: {dsn: AWS.M2.CARDDEMO.LOADLIB, disp: [SHR]}
        SYSOUT: {sysout: '*'}
        SYSPRINT: {sysout: '*'}
        TRANFILE: {dsn: AWS.M2.CARDDEMO.TRANSACT.DALY, gdg: "+1", logical: TRANSACT-DALY, disp: [SHR]}
        CARDXREF: {dsn: AWS.M2.CARDDEMO.CARDXREF.VSAM.KSDS, logical: CARDXREF, disp: [SHR]}
        TRANTYPE: {dsn: AWS.M2.CARDDEMO.TRANTYPE.VSAM.KSDS, logical: TRANTYPE, disp: [SHR]}
        TRANCATG: {dsn: AWS.M2.CARDDEMO.TRANCATG.VSAM.KSDS, logical: TRANCATG, disp: [SHR]}
        DATEPARM: {dsn: AWS.M2.CARDDEMO.DATEPARM, logical: DATEPARM, disp: [SHR]}
        TRANREPT: {dsn: AWS.M2.CARDDEMO.TRANREPT, gdg: "+1", logical: TRANREPT, disp: [NEW, CATLG, DELETE], dcb: {lrecl: 133, recfm: FB}}

  # Delete, define and load the transaction type KSDS from TRANTYPE.PS.
  TRANTYPE:
    source: app/jcl/TRANTYPE.jcl
    steps:
    # [app/jcl/TRANTYPE.jcl:22-28]
    - step: STEP05
      kind: idcams
      dd:
        SYSPRINT: {sysout: '*'}
      params:
        sysin:
        - "   DELETE AWS.M2.CARDDEMO.TRANTYPE.VSAM.KSDS -"
        - "          CLUSTER"
        - "   SET    MAXCC = 0"
    # [app/jcl/TRANTYPE.jcl:33-50]
    - step: STEP10
      kind: idcams
      dd:
        SYSPRINT: {sysout: '*'}
      params:
        sysin:
        - "   DEFINE CLUSTER (NAME(AWS.M2.CARDDEMO.TRANTYPE.VSAM.KSDS) -"
        - "          CYLINDERS(1 5) -"
        - "          VOLUMES(AWSHJ1 -"
        - "          ) -"
        - "          KEYS(2 0) -"
        - "          RECORDSIZE(60 60) -"
        - "          SHAREOPTIONS(1 4) -"
        - "          ERASE -"
        - "          INDEXED -"
        - "          ) -"
        - "          DATA (NAME(AWS.M2.CARDDEMO.TRANTYPE.VSAM.KSDS.DATA) -"
        - "          ) -"
        - "          INDEX (NAME(AWS.M2.CARDDEMO.TRANTYPE.VSAM.KSDS.INDEX) -"
        - "          )"
    # [app/jcl/TRANTYPE.jcl:54-62]
    - step: STEP15
      kind: idcams
      dd:
        SYSPRINT: {sysout: '*'}
        TRANTYPE: {dsn: AWS.M2.CARDDEMO.TRANTYPE.PS, logical: TRANTYPE-PS, disp: [SHR]}
        TTYPVSAM: {dsn: AWS.M2.CARDDEMO.TRANTYPE.VSAM.KSDS, logical: TRANTYPE, disp: [OLD]}
      params:
        sysin:
        - "   REPRO INFILE(TRANTYPE) OUTFILE(TTYPVSAM)"

  # The job CORPT00C writes to the JOBS queue for a report request: //STEP10 EXEC
  # PROC=TRANREPT with in-stream overrides of STEP05R.SYMNAMES and STEP10R.DATEPARM.
  # The member TRANREPT is found by name although its first statement reads
  # //REPROC PROC [app/proc/TRANREPT.prc:1] (GAP-DEF-008; proc resolution is verified
  # only on unikix). {{DATEPARM_START}} and {{DATEPARM_END}} stand in the fields where
  # CORPT00C moves the report's start and end dates [app/cbl/CORPT00C.cbl:106,111,118,120]
  # [app/cbl/CORPT00C.cbl:220-253,429-432]; jobs.py substitutes them from the scenario's
  # DATEPARM (YYYY-MM-DD YYYY-MM-DD) before the steps run.
  TRNRPT00:
    source: "app/cbl/CORPT00C.cbl:84-127"
    procs: [app/proc/TRANREPT.prc, app/proc/REPROC.prc]
    jcllib: [AWS.M2.CARDDEMO.PROC]
    steps:
    # Step PRC001 of procedure REPROC [app/proc/REPROC.prc:21-28], called by
    # [app/proc/TRANREPT.prc:21-31] with FILEIN and FILEOUT overridden, within
    # [app/cbl/CORPT00C.cbl:94].
    - step: STEP10.STEP01R.PRC001
      kind: idcams
      proc: {name: REPROC, source: app/proc/REPROC.prc, procstep: PRC001, symbols: {CNTLLIB: AWS.M2.CARDDEMO.CNTL}}
      dd:
        SYSPRINT: {sysout: '*'}
        FILEIN: {dsn: AWS.M2.CARDDEMO.TRANSACT.VSAM.KSDS, logical: TRANSACT, disp: [SHR]}
        FILEOUT: {dsn: AWS.M2.CARDDEMO.TRANSACT.BKUP, gdg: "+1", logical: TRANSACT-BKUP, disp: [NEW, CATLG, DELETE], dcb: {lrecl: 350, recfm: FB}}
        SYSIN: {dsn: AWS.M2.CARDDEMO.CNTL, disp: [SHR], member: {name: REPROCT, source: app/ctl/REPROCT.ctl}}
    # Step STEP05R of procedure TRANREPT [app/proc/TRANREPT.prc:35-53], called by
    # [app/cbl/CORPT00C.cbl:94]; SYMNAMES overridden in-stream [app/cbl/CORPT00C.cbl:98-114].
    - step: STEP10.STEP05R
      kind: sort
      proc: {name: TRANREPT, source: app/proc/TRANREPT.prc, procstep: STEP05R, symbols: {}}
      dd:
        SORTIN: {dsn: AWS.M2.CARDDEMO.TRANSACT.BKUP, gdg: "+1", logical: TRANSACT-BKUP, disp: [SHR]}
        SYSOUT: {sysout: '*'}
        SORTOUT: {dsn: AWS.M2.CARDDEMO.TRANSACT.DALY, gdg: "+1", logical: TRANSACT-DALY, disp: [NEW, CATLG, DELETE], dcb: {refer: SORTIN}}
      params:
        sysin:
        - " SORT FIELDS=(TRAN-CARD-NUM,A)"
        - " INCLUDE COND=(TRAN-PROC-DT,GE,PARM-START-DATE,AND,"
        - "         TRAN-PROC-DT,LE,PARM-END-DATE)"
        symnames:
        - "TRAN-CARD-NUM,263,16,ZD"
        - "TRAN-PROC-DT,305,10,CH"
        - "PARM-START-DATE,C'{{DATEPARM_START}}'"
        - "PARM-END-DATE,C'{{DATEPARM_END}}'"
    # Step STEP10R of procedure TRANREPT [app/proc/TRANREPT.prc:57-78], called by
    # [app/cbl/CORPT00C.cbl:94]; DATEPARM overridden in-stream [app/cbl/CORPT00C.cbl:116-123].
    # The override replaces DSN=AWS.M2.CARDDEMO.DATEPARM, so the DD names no
    # logical dataset.
    - step: STEP10.STEP10R
      kind: program
      program: CBTRN03C
      proc: {name: TRANREPT, source: app/proc/TRANREPT.prc, procstep: STEP10R, symbols: {}}
      dd:
        STEPLIB: {dsn: AWS.M2.CARDDEMO.LOADLIB, disp: [SHR]}
        SYSOUT: {sysout: '*'}
        SYSPRINT: {sysout: '*'}
        TRANFILE: {dsn: AWS.M2.CARDDEMO.TRANSACT.DALY, gdg: "+1", logical: TRANSACT-DALY, disp: [SHR]}
        CARDXREF: {dsn: AWS.M2.CARDDEMO.CARDXREF.VSAM.KSDS, logical: CARDXREF, disp: [SHR]}
        TRANTYPE: {dsn: AWS.M2.CARDDEMO.TRANTYPE.VSAM.KSDS, logical: TRANTYPE, disp: [SHR]}
        TRANCATG: {dsn: AWS.M2.CARDDEMO.TRANCATG.VSAM.KSDS, logical: TRANCATG, disp: [SHR]}
        DATEPARM:
          instream:
          - "{{DATEPARM_START}} {{DATEPARM_END}}"
        TRANREPT: {dsn: AWS.M2.CARDDEMO.TRANREPT, gdg: "+1", logical: TRANREPT, disp: [NEW, CATLG, DELETE], dcb: {lrecl: 133, recfm: FB}}

  # Delete, define and load the card cross-reference KSDS, build its account-id
  # alternate index and path.
  XREFFILE:
    source: app/jcl/XREFFILE.jcl
    steps:
    # [app/jcl/XREFFILE.jcl:22-31]
    - step: STEP05
      kind: idcams
      dd:
        SYSPRINT: {sysout: '*'}
      params:
        sysin:
        - "   DELETE AWS.M2.CARDDEMO.CARDXREF.VSAM.KSDS -"
        - "          CLUSTER"
        - "   IF MAXCC LE 08 THEN SET MAXCC = 0"
        - "   DELETE  AWS.M2.CARDDEMO.CARDXREF.VSAM.AIX  -"
        - "          ALTERNATEINDEX"
        - "   IF MAXCC LE 08 THEN SET MAXCC = 0"
    # [app/jcl/XREFFILE.jcl:36-53]
    - step: STEP10
      kind: idcams
      dd:
        SYSPRINT: {sysout: '*'}
      params:
        sysin:
        - "   DEFINE CLUSTER (NAME(AWS.M2.CARDDEMO.CARDXREF.VSAM.KSDS) -"
        - "          CYLINDERS(1 5) -"
        - "          VOLUMES(AWSHJ1 -"
        - "          ) -"
        - "          KEYS(16 0) -"
        - "          RECORDSIZE(50 50) -"
        - "          SHAREOPTIONS(2 3) -"
        - "          ERASE -"
        - "          INDEXED -"
        - "          ) -"
        - "          DATA (NAME(AWS.M2.CARDDEMO.CARDXREF.VSAM.KSDS.DATA) -"
        - "          ) -"
        - "          INDEX (NAME(AWS.M2.CARDDEMO.CARDXREF.VSAM.KSDS.INDEX) -"
        - "          )"
    # [app/jcl/XREFFILE.jcl:57-65]
    - step: STEP15
      kind: idcams
      dd:
        SYSPRINT: {sysout: '*'}
        XREFDATA: {dsn: AWS.M2.CARDDEMO.CARDXREF.PS, logical: CARDXREF-PS, disp: [SHR]}
        XREFVSAM: {dsn: AWS.M2.CARDDEMO.CARDXREF.VSAM.KSDS, logical: CARDXREF, disp: [SHR]}
      params:
        sysin:
        - "   REPRO INFILE(XREFDATA) OUTFILE(XREFVSAM)"
    # [app/jcl/XREFFILE.jcl:69-83]
    # KEYS(11,25) is written with a comma: length 11 at offset 25.
    - step: STEP20
      kind: idcams
      dd:
        SYSPRINT: {sysout: '*'}
      params:
        sysin:
        - "   DEFINE ALTERNATEINDEX (NAME(AWS.M2.CARDDEMO.CARDXREF.VSAM.AIX)-"
        - "   RELATE(AWS.M2.CARDDEMO.CARDXREF.VSAM.KSDS)                    -"
        - "   KEYS(11,25)                                                   -"
        - "   NONUNIQUEKEY                                                  -"
        - "   UPGRADE                                                       -"
        - "   RECORDSIZE(50,50)                                             -"
        - "   FREESPACE(10,20)                                              -"
        - "   VOLUMES(AWSHJ1)                                               -"
        - "   CYLINDERS(5,1))                                               -"
        - "   DATA (NAME(AWS.M2.CARDDEMO.CARDXREF.VSAM.AIX.DATA))           -"
        - "   INDEX (NAME(AWS.M2.CARDDEMO.CARDXREF.VSAM.AIX.INDEX))"
    # [app/jcl/XREFFILE.jcl:87-93]
    - step: STEP25
      kind: idcams
      dd:
        SYSPRINT: {sysout: '*'}
      params:
        sysin:
        - "  DEFINE PATH                                           -"
        - "   (NAME(AWS.M2.CARDDEMO.CARDXREF.VSAM.AIX.PATH)        -"
        - "    PATHENTRY(AWS.M2.CARDDEMO.CARDXREF.VSAM.AIX))"
    # [app/jcl/XREFFILE.jcl:97-103]
    - step: STEP30
      kind: idcams
      dd:
        SYSPRINT: {sysout: '*'}
      params:
        sysin:
        - "   BLDINDEX                                                      -"
        - "   INDATASET(AWS.M2.CARDDEMO.CARDXREF.VSAM.KSDS)                 -"
        - "   OUTDATASET(AWS.M2.CARDDEMO.CARDXREF.VSAM.AIX)"
