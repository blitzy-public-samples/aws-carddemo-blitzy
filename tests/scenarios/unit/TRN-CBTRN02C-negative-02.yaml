# Reject reason 101: the card is in the cross-reference file, but the account
# it points to is not in the account master. 1500-A-LOOKUP-XREF finds the card,
# so 1500-B-LOOKUP-ACCT reads ACCTFILE by XREF-ACCT-ID, gets INVALID KEY and
# sets 101 'ACCOUNT RECORD NOT FOUND'; neither the limit nor the expiration
# check runs, and nothing is posted [app/cbl/CBTRN02C.cbl:370-399]. The record
# is written to DALYREJS and the run ends with return code 4
# [app/cbl/CBTRN02C.cbl:211-231,446-465]. Reason 101 never occurs with the
# repository data, so the cross-reference is synthetic.
#
# Invented data: card 9999000011110002, customer 000000901 and account
# 00000000901 are in no repository file (ACCTDATA holds accounts 00000000001 to
# 00000000050), and the DALYTRAN record matches no repository transaction.
# DALYTRAN is wholly synthetic, so no dailytran.txt item is listed.
#
# Expected values are decoded field values: text at its full field width with
# its trailing spaces, numbers as decimal text. The reason field holds the bytes
# 0101 and decodes to 101; DALYTRAN-AMT 10.00 is stored as the overpunch
# 0000000100{. TRANFILE is opened OUTPUT and receives nothing, so TRANSACT is
# empty. ACCTDATA and TCATBALF are opened I-O and never rewritten: their
# baselines are the fixtures as loaded, record for record.
id: TRN-CBTRN02C-negative-02
level: unit
type: negative
description: >-
  CBTRN02C rejects a daily transaction whose card is cross-referenced to an
  account missing from the account master with reason 0101 'ACCOUNT RECORD NOT
  FOUND': it writes the 430-byte reject record, posts nothing, leaves the account
  and category balance files unchanged, reports 1 processed and 1 rejected, and
  ends with return code 4.
inventory_ids:
- INV-TRN-075  # CBTRN02C reject 101 account not found (rule)
- INV-TRN-008  # CBTRN02C program
- INV-TRN-085  # CBTRN02C DALYREJS 430-byte reject record (interface)
- INV-TRN-080  # CBTRN02C return code 4 when any record is rejected (rule)
- INV-LAY-026  # CVTRA06Y copybook, the transaction data inside the reject record
- INV-LAY-018  # CVACT03Y copybook, the synthetic cross-reference record
- INV-DTA-003  # cardxref.txt, the CARDXREF fixture source
- INV-DTA-013  # EBCDIC card cross-reference file, its cross-check counterpart
- INV-DTA-001  # acctdata.txt, the ACCTDATA fixture source
- INV-DTA-011  # EBCDIC account data file, its cross-check counterpart
- INV-DTA-007  # tcatbal.txt, the TCATBALF fixture source
- INV-DTA-018  # EBCDIC category balance file, its cross-check counterpart
