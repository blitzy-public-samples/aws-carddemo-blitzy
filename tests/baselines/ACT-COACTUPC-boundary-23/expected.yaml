# Derived baseline of scenario ACT-COACTUPC-boundary-23 (capture_platform:
# derived), authored from the app/ source and never observed: no TPE region
# runs in CI. Open until a UniKix run of the app/ build is imported:
# GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012 (online-only
# copybooks CSUTLDPY and CSUTLDWY).
# Date of Birth the day before the run date, the accepted edge of the
# future-date edit (the run date itself, refused, is boundary-24).
# Steps 1-3: USER0001 signs on, main menu option 2 XCTLs to COACTUPC, and
# ENTER with account 00000000001 shows the fetched account and the invented
# customer 000000001 with 'Update account details presented above.'
# [app/cbl/COACTUPC.cbl:964-973,2787-2865,2955-2981].
# Step 4: the year, month and day of the run date minus one day over the
# fetched 1961-06-08 make ACUP-NEW-CUST-DOB-YYYY-MM-DD a change
# [app/cbl/COACTUPC.cbl:1256-1274,1759-1760], so 1200-EDIT-MAP-INPUTS runs
# every edit in field order. For 'Date of Birth' EDIT-DATE-CCYYMMDD finds the
# year supplied, numeric and in century 20, the month and day a real calendar
# day, and EDIT-DATE-LE calls CSUTLDTC with mask YYYYMMDD; severity 0 is the
# derived result, so no ' validation error Sev code: ' message is composed
# [app/cbl/COACTUPC.cbl:1533-1539] [app/cpy/CSUTLDPY.cpy:18-316]. Which
# dates CEEDAYS accepts is inferred (GAP-INF-001), and whether UniKix
# supplies it unconfirmed (GAP-MIS-010). EDIT-DATE-OF-BIRTH then finds
# INTEGER-OF-DATE of the current date one greater than that of the date of
# birth, so the strict '>' takes CONTINUE and ':cannot be in the future ' is
# not composed [app/cbl/COACTUPC.cbl:1539-1543]
# [app/cpy/CSUTLDPY.cpy:341-369].
# Every other field comes back as fetched and passes, so INPUT-ERROR stays off
# and ACUP-CHANGES-OK-NOT-CONFIRMED is set [app/cbl/COACTUPC.cbl:1670-1675].
# 2000-DECIDE-ACTION writes only on PF5, so ENTER rewrites nothing
# [app/cbl/COACTUPC.cbl:2602-2621]; 3203 echoes the received values with the
# new date of birth, 3250 moves PROMPT-FOR-CONFIRMATION (the X(40)
# WS-INFO-MSG) to INFOMSG and the blank X(75) WS-RETURN-MSG to ERRMSG, and
# 3390 brightens F5=Save and F12=Cancel [app/cbl/COACTUPC.cbl:463-480,
# 2870-2983,3566-3581].
# This pins the app/ behavior: the UniKix CSUTLDPY and CSUTLDTC differ
# (GAP-DOC-024, GAP-DOC-021), so a UniKix record of this scenario is
# UniKix-copy behavior and never replaces this file.
# Screen values are full BMS width with trailing spaces kept (ERRMSG 78,
# INFOMSG 45), because screens compare exactly. The run date is the region
# clock, which no confirmed command sets (GAP-MIS-015), so the echoed DOBYEAR,
# DOBMON and DOBDAY, CURDATE and CURTIME keep the scenario's run-date and
# run-time matchers. file_state holds the records as the preconditions
# materialize them, decoded through CVACT01Y and CVCUS01Y, unchanged because
# no REWRITE runs.
