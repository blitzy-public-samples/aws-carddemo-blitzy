# COACTUPC refuses an account update whose Phone Number 2 line number is left
# blank while its area code and prefix stay filled: 1260-EDIT-US-PHONE-NUM,
# which 1200-EDIT-MAP-INPUTS performs under the name 'Phone Number 2', fails
# its line-number 'supplied' test in EDIT-US-PHONE-LINENUM
# [app/cbl/COACTUPC.cbl:1640-1646,2226-2245,2370-2382].
#
# Steps 1-3 sign on, choose main-menu option 2 and fetch account 00000000001
# as ACT-COACTUPC-alternate-03 does: CXACAIX gives card 9680294154603697 and
# customer 000000001 (line 49 of app/data/ASCII/cardxref.txt), the details of
# the account and of the invented customer are shown with ACUP-SHOW-DETAILS in
# the returned COMMAREA, and 3320-UNPROTECT-FEW-ATTRS gives every editable
# field MDT on, so all of them come back on the next AID
# [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3500-3561].
# Step 4 erases ACSPH2C (EraseEOF, nothing typed; it showed '0102') and
# presses ENTER; ACSPH2A '919' and ACSPH2B '555' come back unchanged:
# - 1100-RECEIVE-MAP leaves ACUP-NEW-CUST-PHONE-NUM-2C at LOW-VALUES whether
#   the erased field arrives as spaces (moved as LOW-VALUES) or as nulls
#   (moved as received); the BMS JUSTIFY=(RIGHT) of ACSPH2C pads with blanks,
#   so it changes neither outcome [app/cbl/COACTUPC.cbl:1047,1392-1397]
#   [app/bms/COACTUP.bms:453-457].
# - 1205-COMPARE-OLD-NEW sets CHANGE-HAS-OCCURRED, since the line number no
#   longer equals the fetched '0102', so 1200-EDIT-MAP-INPUTS sets
#   ACUP-CHANGES-NOT-OK and runs the field edits in screen order
#   [app/cbl/COACTUPC.cbl:1460-1470,1751-1753]. Account Status, the three
#   account dates, the five amounts, the SSN, the Date of Birth, the FICO
#   Score, the names, the address, the state, the zip, the city, the country
#   and Phone Number 1 pass with these fixtures and leave the message line off
#   [app/cbl/COACTUPC.cbl:876,1472-1638].
# - 1260-EDIT-US-PHONE-NUM receives '(919)555-' with LOW-VALUES in the line
#   number. Its all-blank test fails on the area code '919', so the phone is
#   edited part by part [app/cbl/COACTUPC.cbl:2234-2245]. The area code is
#   supplied, numeric, not zero and a North America general-purpose code, and
#   the prefix '555' is supplied, numeric and not zero
#   [app/cbl/COACTUPC.cbl:2246-2368] [app/cpy/CSLKPCDY.cpy:521,895].
#   EDIT-US-PHONE-LINENUM finds WS-EDIT-US-PHONE-NUMC equal to LOW-VALUES,
#   sets INPUT-ERROR and FLG-EDIT-US-PHONEC-BLANK and, the message line being
#   off, STRINGs TRIM(WS-EDIT-VARIABLE-NAME) and ': Line number code must be
#   supplied.' into WS-RETURN-MSG; the flags are moved on to
#   WS-EDIT-PHONE-NUM-2-FLGS, so FLG-PHONE-NUM-2C-BLANK is on
#   [app/cbl/COACTUPC.cbl:330-344,2370-2382].
# - The EFT Account Id, the Primary Card Holder and the state/zip cross edit
#   pass and cannot overwrite the message, since WS-RETURN-MSG is no longer
#   blank [app/cbl/COACTUPC.cbl:1648-1676]. 2000-DECIDE-ACTION continues on
#   ACUP-CHANGES-NOT-OK, so 9600-WRITE-PROCESSING (PF5 only) does not run and
#   nothing is written [app/cbl/COACTUPC.cbl:2562-2621].
# - 3203-SHOW-UPDATED-VALUES shows the received values, the amounts re-edited
#   through WS-EDIT-CURRENCY-9-2-F, and moves the LOW-VALUES of the line number
#   to ACSPH2CO; 3250-SETUP-INFOMSG sets PROMPT-FOR-CHANGES and moves the
#   message to ERRMSGO; the cursor is put on ACSPH2C; CSSETATY for
#   PHONE-NUM-2C, with FLG-PHONE-NUM-2C-BLANK on a reentry, colours ACSPH2C red
#   and moves '*' to it; 3320 unprotects the fields again; 3390 makes
#   F12=Cancel bright because ACUP-CHANGES-MADE, and leaves F5=Save dark
#   [app/cbl/COACTUPC.cbl:2870-2951,2955-2981,3154-3156,3421-3425,3566-3581]
#   [app/cpy/CSSETATY.cpy:17-26].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   ERRMSG is 'Phone Number 2: Line number code must be supplied.' (50
#   characters) in the 75-byte WS-RETURN-MSG, moved to the 78-byte ERRMSGO: 28
#   trailing spaces. ACSPH2C is '*' in the 4-byte field (BMS LENGTH=4,
#   POS=(20,18)); output data is not justified, so the '*' stands in column 18
#   [app/bms/COACTUP.bms:453-457]. INFOMSG is the 40-byte WS-INFO-MSG in the
#   45-byte INFOMSGO.
# - AADDGRP is sent as LOW-VALUES on screen 4 (the blank group id comes back as
#   spaces, which 1100 turns into LOW-VALUES); s3270 shows nulls as spaces.
# - A dark (DRK) field is captured as blanks; no upper-case translation of
#   input is assumed (CARDDEMO.CSD gives CAUP the profile DFHCICST). Colour and
#   cursor position are not in the s3270 text capture and are not asserted.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit (the repository record fails the FICO, phone-2 and state/zip edits), so
# the blank Phone Number 2 line number is the only refused field and the only
# one marked [app/cbl/COACTUPC.cbl:2225-2558] [app/cpy/CSLKPCDY.cpy:1186].
id: ACT-COACTUPC-negative-122
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update) and fetches
  account 00000000001, then erases the line number of Phone Number 2, leaving
  its area code 919 and prefix 555, and presses ENTER. COACTUPC refuses the
  change: the message line shows 'Phone Number 2: Line number code must be
  supplied.', the line-number field shows '*', the other received values are
  shown again with the change prompt and F12=Cancel, and neither ACCTDATA nor
  CUSTDATA is rewritten.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. The change prompt 'Update account details presented above.'
# (INV-ACT-030) is asserted but verified by its own scenario. Sign-on (CC00,
# COSGN00, USRSEC) and the menu transaction are verified by the SEC and MNU
# scenarios; the batch record copybooks and the data files are verified at the
# lowest level that executes them.
inventory_ids:
- INV-ACT-180  # COACTUPC Phone Number 2: line number supplied (1260-EDIT-US-PHONE-NUM)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refusal screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code lookup the phone edit passes, and the state/zip lookup
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the '*' and red attribute of the refused field
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the four date edits, all passed
- INV-LAY-014  # CSUTLDWY: the date-edit work areas
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix EDIT-US-PHONE-LINENUM STRINGs the untrimmed 25-byte
# WS-EDIT-VARIABLE-NAME, so it would show 'Phone Number 2           : Line
# number code must be supplied.' (COACTUPC.cl2:2384-2389); a UniKix run never
# verifies the item.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
