# COACTUPC refuses a Date of Birth whose year is not supplied: the first
# predicate of EDIT-YEAR-CCYY, which COACTUPC copies from CSUTLDPY and runs for
# the Date of Birth through EDIT-DATE-CCYYMMDD [app/cpy/CSUTLDPY.cpy:18-46]
# [app/cbl/COACTUPC.cbl:1533-1538].
#
# Steps 1-3 sign on as USER0001, choose main-menu option 2 and fetch account
# 00000000001, as ACT-COACTUPC-negative-042 does: CXACAIX gives customer
# 000000001 (card 9680294154603697, line 49 of app/data/ASCII/cardxref.txt),
# ACCTDAT and CUSTDAT are read without UPDATE, and 3202-SHOW-ORIGINAL-VALUES
# shows the records with 'Update account details presented above.'; every
# editable field is DFHBMFSE or DFHBMPRF (MDT on), so all of them come back on
# the next AID [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3440-3561,3608-3884].
# Step 4 erases the birth year (EraseEOF, nothing typed) and presses ENTER.
# - The erased field arrives as nulls, which 1100-RECEIVE-MAP moves to
#   ACUP-NEW-CUST-DOB-YEAR; a '*' or spaces would give LOW-VALUES as well
#   [app/cbl/COACTUPC.cbl:1256-1261].
# - 1205-COMPARE-OLD-NEW sets CHANGE-HAS-OCCURRED at its account test: the
#   group-id term compares the LOW-VALUES that 1100-RECEIVE-MAP moves for the
#   blank Account Group with the fetched spaces, which TRIM does not make
#   equal (it removes spaces only, GAP-DEF-019), so the test is false whatever
#   its other terms give and the paragraph exits before the customer fields
#   are compared. The birth date would differ from the fetched 19610608 as
#   well, but that comparison is not reached. So 1200-EDIT-MAP-INPUTS sets
#   ACUP-CHANGES-NOT-OK and runs the field edits in screen order
#   [app/cbl/COACTUPC.cbl:1213-1218,1460-1470,1697-1704,3847].
# - Account Status Y, Open Date 2014-11-20, Credit Limit, Expiry Date
#   2025-05-20, Cash Credit Limit, Reissue Date 2025-05-20, Current Balance,
#   the cycle credit and debit, and SSN 123-45-6789 pass, so WS-RETURN-MSG is
#   still off when the Date of Birth edit runs
#   [app/cbl/COACTUPC.cbl:1472-1531,2431-2489].
# - EDIT-YEAR-CCYY finds WS-EDIT-DATE-CCYY equal to LOW-VALUES, sets INPUT-ERROR
#   and FLG-YEAR-BLANK, STRINGs the trimmed field name and ' : Year must be
#   supplied.' into WS-RETURN-MSG and goes to EDIT-YEAR-CCYY-EXIT
#   [app/cpy/CSUTLDPY.cpy:25-46]. Control falls through into EDIT-MONTH and
#   EDIT-DAY, which accept 06 and 08; EDIT-DAY-MONTH-YEAR then finds the date
#   flags not valid and leaves for EDIT-DATE-CCYYMMDD-EXIT, so CSUTLDTC is not
#   called [app/cpy/CSUTLDPY.cpy:91-278,329]. WS-EDIT-DT-OF-BIRTH-FLGS holds the
#   year flag 'B', so WS-EDIT-DT-OF-BIRTH-ISVALID is false and
#   EDIT-DATE-OF-BIRTH, the only run-date comparison, is not performed
#   [app/cbl/COACTUPC.cbl:216-230,1538-1543].
# - Every later edit passes on the invented customer below, and an edit writes
#   its message only while WS-RETURN-MSG-OFF holds, so this message stays.
# - INPUT-ERROR leaves ACUP-CHANGES-NOT-OK, which 2000-DECIDE-ACTION only
#   continues on: no READ UPDATE or REWRITE runs [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values with the valid amounts
#   re-edited through +ZZZ,ZZZ,ZZZ.99; 3250-SETUP-INFOMSG sets
#   PROMPT-FOR-CHANGES and moves WS-RETURN-MSG to ERRMSG; 3300 keeps the fields
#   editable, puts the cursor on DOBYEAR, and CSSETATY, for
#   FLG-DT-OF-BIRTH-YEAR-BLANK in re-enter state, turns DOBYEAR red and moves
#   '*' to it; 3390 makes F12=Cancel bright, while F5=Save stays dark without a
#   confirmation prompt
#   [app/cbl/COACTUPC.cbl:2870-2951,2955-2981,2986-3063,3090-3092,3315-3319,
#   3566-3583] [app/cpy/CSSETATY.cpy].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - ERRMSG is 'Date of Birth' (the trimmed X(25) WS-EDIT-VARIABLE-NAME) and
#   ' : Year must be supplied.', 38 characters, in the 75-byte WS-RETURN-MSG and
#   the 78-byte ERRMSGO.
# - DOBYEAR is the '*' in the 4-byte DOBYEARO, '*   '; DOBMON and DOBDAY keep
#   the received 06 and 08.
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   FKEY05 is dark (ASKIP,DRK) and the s3270 capture renders it as blanks.
# - The tpe adapter enters a field with EraseEOF and types nothing for an empty
#   value. No upper-case translation of input is assumed: CARDDEMO.CSD defines
#   none for CAUP.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every other
# COACTUPC edit: the repository record has FICO 274, below 300, and zip 12546,
# which is not a North Carolina zip [app/cbl/COACTUPC.cbl:2514-2558]. Area code
# 919 is a general-purpose code and NC27 a valid state and zip pair
# [app/cpy/CSLKPCDY.cpy:521,895,1186]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-071
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001 with its customer 000000001, erases the birth year and
  presses ENTER. COACTUPC refuses the date: the message line shows
  'Date of Birth : Year must be supplied.', the birth year shows '*', the
  screen keeps the other entered values editable under 'Update account
  details presented above.', and F12=Cancel is shown while F5=Save is not.
  Nothing is saved: ACCTDATA and CUSTDATA still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-129  # COACTUPC Date of Birth: year supplied (EDIT-YEAR-CCYY field edit)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute and '*' set on DOBYEAR
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-YEAR-CCYY, which composes the message
- INV-LAY-014  # CSUTLDWY: the date-edit work areas and flags
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY drops FUNCTION TRIM from the field name of every composed
# date-edit message, so the ERRMSG of screen 4 differs on UniKix.
- GAP-DOC-024
# The UniKix COACTUPC comments out the TEST-NUMVAL-C amount checks this path
# runs and drops TRIM from its change detection, so the amounts on screen 4 may
# differ on UniKix.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
