# Derived baseline (capture_platform: derived) of CRD-COCRDUPC-negative-09,
# authored from app/cbl/COCRDUPC.cbl:96-99,199-200,701-714,913-947,1082-1165,
# 1298-1338, app/bms/COCRDUP.bms and app/data/ASCII/carddata.txt:1 at commit
# 93ebec71ff7b59a68cedd7c501afe496a8eaa68d, because no TPE region runs in CI;
# inferred-not-observed (GAP-INF-006, GAP-INF-012), replaced when
# report.py --import-unikix promotes an eligible UniKix run. It pins the source
# as it stands.
#
# One screen per step, each the screen the step's AID ends on. Step 1:
# USER0001 reaches the main menu (CM00). Step 2: option 5 XCTLs to COCRDUPC, a
# fresh entry that sends the empty search map with PROMPT-FOR-SEARCH-KEYS
# [app/cbl/COCRDUPC.cbl:502-511,1141-1142]. Step 3: 9000-READ-DATA reads card
# 0500024453765740 (account 00000000050) and shows it with the name
# upper-cased under FOUND-CARDS-FOR-ACCOUNT [app/cbl/COCRDUPC.cbl:1107-1112,
# 1145-1146,1343-1394]. Step 4: year 1900 makes the new data differ from the
# old, so 1200 sets CCUP-CHANGES-NOT-OK; the name, status Y and month 03 pass,
# and 1260-EDIT-EXPIRY-YEAR refuses 1900, outside VALID-YEAR 1950 THRU 2099,
# with CARD-EXPIRY-YEAR-NOT-VALID while WS-RETURN-MSG is off
# [app/cbl/COCRDUPC.cbl:96-99,199-200,701-714,913-947]. 2000 continues without
# READ UPDATE or REWRITE; 3200 shows the entered values (CCUP-CHANGES-MADE
# covers 'E') and 3250 moves PROMPT-FOR-CHANGES to INFOMSG and WS-RETURN-MSG to
# ERRMSG [app/cbl/COCRDUPC.cbl:1113-1123,1147-1148,1161-1163].
#
# Text fields are at their full BMS length with trailing spaces: INFOMSG is
# the 40-byte WS-INFO-MSG, ERRMSG the 75-byte WS-RETURN-MSG padded to 80.
# CURDATE and CURTIME come from the region clock, so they are matchers in the
# MM/DD/YY and HH:MM:SS forms of CSDAT01Y [app/cpy/CSDAT01Y.cpy:30-41].
# CARDDATA keeps its 50 records, card 0500024453765740 as loaded (expiry
# 2023-03-09, status Y, name in its original case). The data below is
# canonical harness.dump_yaml.
file_state:
  CARDDATA:
    contains:
    - CARD-ACCT-ID: '50'
      CARD-ACTIVE-STATUS: Y
      CARD-CVV-CD: '747'
      CARD-EMBOSSED-NAME: 'Aniya Von                                         '
      CARD-EXPIRAION-DATE: '2023-03-09'
      CARD-NUM: '0500024453765740'
    count: 50
screens:
- '@map': COMEN01
  PGMNAME: COMEN01C
  TRNNAME: CM00
- '@map': COCRDUP
  ACCTSID: '           '
  CARDSID: '                '
  CRDNAME: '                                                  '
  CRDSTCD: ' '
  ERRMSG: '                                                                                '
  EXPMON: '  '
  EXPYEAR: '    '
  INFOMSG: 'Please enter Account and Card Number    '
  PGMNAME: COCRDUPC
  TRNNAME: CCUP
- '@map': COCRDUP
  ACCTSID: '00000000050'
  CARDSID: '0500024453765740'
  CRDNAME: 'ANIYA VON                                         '
  CRDSTCD: Y
  CURDATE:
    format: '%m/%d/%y'
    match: run-date
  CURTIME:
    format: '%H:%M:%S'
    match: run-time
  ERRMSG: '                                                                                '
  EXPMON: '03'
  EXPYEAR: '2023'
  FKEYS: ENTER=Process F3=Exit
  INFOMSG: 'Details of selected card shown above    '
  PGMNAME: COCRDUPC
  TITLE01: '      AWS Mainframe Modernization       '
  TITLE02: '              CardDemo                  '
  TRNNAME: CCUP
- '@map': COCRDUP
  ACCTSID: '00000000050'
  CARDSID: '0500024453765740'
  CRDNAME: 'ANIYA VON                                         '
  CRDSTCD: Y
  CURDATE:
    format: '%m/%d/%y'
    match: run-date
  CURTIME:
    format: '%H:%M:%S'
    match: run-time
  ERRMSG: 'Invalid card expiry year                                                        '
  EXPMON: '03'
  EXPYEAR: '1900'
  FKEYS: ENTER=Process F3=Exit
  INFOMSG: 'Update card details presented above.    '
  PGMNAME: COCRDUPC
  TITLE01: '      AWS Mainframe Modernization       '
  TITLE02: '              CardDemo                  '
  TRNNAME: CCUP
