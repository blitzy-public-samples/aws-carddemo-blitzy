# Manifest of the derived baseline of TRN-COTRN02C-negative-18: the add screen
# submitted with the non-numeric Type CD 'A1', answered with 'Type CD must be
# Numeric...' [app/cbl/COTRN02C.cbl:322-327]. Only unikix can run the
# scenario, so expected.yaml is authored from the source and is
# inferred-not-observed (GAP-INF-007, GAP-INF-012). It names no execution_id
# or execution_fingerprint and holds no datasets/ until report.py
# --import-unikix promotes an eligible UniKix run.
#
# source_identity.units are the app/ sources the three steps execute: the COPY
# closure (inventory_tools.copy_closure) of COSGN00C, which signs USER0001 on
# and XCTLs to COMEN01C [app/cbl/COSGN00C.cbl:230-237]; of COMEN01C, whose
# option 8 XCTLs to COTRN02C [app/cpy/COMEN02Y.cpy:67-72]; and of COTRN02C,
# which refuses the Type CD; plus the BMS sources of their maps COSGN00,
# COMEN01 and COTRN02. The sign-on and menu programs are listed, not only
# COTRN02C, because expected.yaml asserts the COMEN01 screen step 2 ends on.
# CSUTLDTC is absent: COTRN02C calls it only for the date checks that follow
# the Type CD check [app/cbl/COTRN02C.cbl:389-420], which this path never
# reaches. DFHAID and DFHBMSCA are CICS-supplied, not app/ sources, so they are
# absent.
