# COCRDUPC fetches card 0500024453765740 for update, keyed in on its own search
# screen after the main menu, and shows it with 'Details of selected card shown
# above' (88 FOUND-CARDS-FOR-ACCOUNT of WS-INFO-MSG) [app/cbl/COCRDUPC.cbl:160-161].
# - Step 1: CC00 sends COSGN00; USER0001 (type U) is routed to the main menu
#   COMEN01C, map COMEN01 [app/cbl/COSGN00C.cbl:223-237].
# - Step 2: option 5 is the COMEN02Y entry 'Credit Card Update', program
#   COCRDUPC; COMEN01C sets itself as CDEMO-FROM-PROGRAM, zeroes
#   CDEMO-PGM-CONTEXT and XCTLs to it [app/cbl/COMEN01C.cbl:115-156]. Entered
#   from the menu and not re-entered, COCRDUPC takes the fresh-entry branch: it
#   initializes its own COMMAREA area, sends COCRDUP with the account and card
#   filters unprotected (DFHBMFSE), sets re-enter and CCUP-DETAILS-NOT-FETCHED and
#   returns with TRANSID CCUP [app/cbl/COCRDUPC.cbl:502-512,546-558,1173-1180].
#   No COMEN01C path sets CDEMO-LAST-MAPSET to COCRDLI, so the earlier WHENs that
#   return to the list cannot fire whatever bytes follow the menu's COMMAREA
#   [app/cbl/COCRDUPC.cbl:435-440].
# - Step 3: the re-entered CCUP task reaches WHEN OTHER [app/cbl/COCRDUPC.cbl:535-545].
#   With the details not fetched, 1200-EDIT-MAP-INPUTS edits only the filters:
#   both are supplied, numeric and non-zero, so they become CDEMO-ACCT-ID and
#   CDEMO-CARD-NUM with no message [app/cbl/COCRDUPC.cbl:641-660,721-802].
#   2000-DECIDE-ACTION then performs 9000-READ-DATA: 9100-GETCARD-BYACCTCARD
#   reads CARDDAT by the card number alone (the account key is commented out),
#   the READ is NORMAL and sets FOUND-CARDS-FOR-ACCOUNT; the name is upper-cased
#   by INSPECT CONVERTING in the record area and the expiry date split into
#   year, month and day; CCUP-SHOW-DETAILS is set
#   [app/cbl/COCRDUPC.cbl:954-965,1343-1415].
# 3000-SEND-MAP builds the screen [app/cbl/COCRDUPC.cbl:1035-1163]: the titles,
# CCUP, COCRDUPC, the run date and time; ACCTSID and CARDSID echo CC-ACCT-ID and
# CC-CARD-NUM, since the task is re-entered and both are non-zero; CRDNAME,
# CRDSTCD, EXPMON and EXPYEAR are the fetched values under CCUP-SHOW-DETAILS;
# 3250-SETUP-INFOMSG sets FOUND-CARDS-FOR-ACCOUNT for CCUP-SHOW-DETAILS and moves
# WS-INFO-MSG to INFOMSG and the blank 75-byte WS-RETURN-MSG to ERRMSG.
#
# Expected values come from record 1 of the CARDDATA fixture (line 1 of
# app/data/ASCII/carddata.txt: card 0500024453765740, account 00000000050,
# embossed name 'Aniya Von', expiry 2023-03-09, status Y). They are derived from
# the source (no TPE region runs in CI) and are whole fields at their BMS length,
# trailing spaces kept: CRDNAME 50, INFOMSG 40 (the 36-byte text padded), ERRMSG
# 80. EXPDAY receives the expiry day 09 but is a dark (DRK) field
# [app/bms/COCRDUP.bms:142-146], so the captured screen shows it blank and it is
# not asserted. The main menu and the search screen are asserted only by their
# identification fields: their content is other scenarios' items. CURDATE and
# CURTIME come from the region clock, so they are matchers in the MM/DD/YY and
# HH:MM:SS forms 3100-SCREEN-INIT builds, and the clock is relative.
id: CRD-COCRDUPC-normal-01
level: e2e
type: normal
description: >-
  USER0001 signs on, selects main-menu option 5 (Credit Card Update) and, on the
  COCRDUPC search screen (CCUP), enters account 00000000050 and card
  0500024453765740. The program validates both filters, reads the card from
  CARDDAT by card number and shows it for update: name ANIYA VON (upper-cased),
  status Y and expiry 03/2023, with 'Details of selected card shown above' in
  the information line and no error.
# Primary item first, then the program, the maps the steps are entered on and
# land on, the transaction the search screen returns with and step 3 runs, the
# CSD file COCRDUPC reads, and the online-only copybooks it copies. Sign-on and
# the menu option (CC00, CM00, COSGN00, USRSEC, the option-5 navigation) are
# verified by the SEC and MNU scenarios, the search prompt by its own CRD
# scenario, and the batch record copybooks and the data files at the lowest
# level that executes them.
inventory_ids:
- INV-CRD-047  # COCRDUPC message 'Details of selected card shown above' (rule)
- INV-CRD-003  # COCRDUPC program
- INV-MNU-003  # COMEN01 map, where option 5 is entered
- INV-CRD-006  # COCRDUP map, the search and the detail screen
- INV-CFG-015  # CCUP transaction, TRNNAME and the RETURN TRANSID of the update screen
- INV-CFG-003  # CARDDAT CSD file: card master read by card number
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and filters
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y, copied by COCRDUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COCRDUPC
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID, CC-CARD-NUM and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-006  # CRD end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    CARDDATA: {base: CARDDATA}
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '5'
  - aid: ENTER
    '@map': COCRDUP
    fields:
      ACCTSID: '00000000050'
      CARDSID: '0500024453765740'
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
  - '@map': COCRDUP
    TRNNAME: CCUP
    PGMNAME: COCRDUPC
  - '@map': COCRDUP
    TRNNAME: CCUP
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COCRDUPC
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ACCTSID: '00000000050'
    CARDSID: '0500024453765740'
    CRDNAME: 'ANIYA VON                                         '
    CRDSTCD: 'Y'
    EXPMON: '03'
    EXPYEAR: '2023'
    INFOMSG: 'Details of selected card shown above    '
    ERRMSG: '                                                                                '
