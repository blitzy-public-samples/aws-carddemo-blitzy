# Derived baseline of scenario USR-COUSR00C-alternate-08: ADMIN001 opens the
# user list through admin option 1 and enters D beside row 7 (USER0002).
# Authored from the source, never captured: app/cbl/COSGN00C.cbl:230-237 and
# app/cbl/COADM01C.cbl (the type-A route and the admin menu),
# app/cbl/COUSR00C.cbl:110-209,282-331 (the first-entry list in key order and
# the D selection's XCTL), app/cbl/COUSR03C.cbl:90-105,142-169,214-286 (the
# READ UPDATE and 'Press PF5 key to delete this user ...', sent with ERASE),
# app/cpy/COTTL01Y.cpy, and the USRSEC fixture
# app/data/EBCDIC/AWS.M2.CARDDEMO.USRSEC.PS. Open until a UniKix run is
# imported: GAP-INF-004 and GAP-INF-012.
# One screen per step, each the screen shown after the step's AID; values are
# full BMS field width with trailing spaces kept. Only PF5 deletes, so
# file_state lists all 10 users in key order. Its records name the user id,
# names and type; SEC-USR-PWD is left out so that no credential value is
# written into a baseline, and SEC-USR-FILLER carries no business data.
file_state:
  USRSEC:
  - SEC-USR-FNAME: 'MARGARET            '
    SEC-USR-ID: ADMIN001
    SEC-USR-LNAME: 'GOLD                '
    SEC-USR-TYPE: A
  - SEC-USR-FNAME: 'RUSSELL             '
    SEC-USR-ID: ADMIN002
    SEC-USR-LNAME: 'RUSSELL             '
    SEC-USR-TYPE: A
