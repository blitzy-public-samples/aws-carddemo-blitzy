        TRAN-SOURCE: 'System    '
        TRAN-AMT: '15.00'
        TRAN-MERCHANT-ID: '0'
        TRAN-CARD-NUM: '9999000022220904'
        TRAN-ORIG-TS: '2022-07-06-10.00.00.000000'
        TRAN-PROC-TS: '2022-07-06-10.00.00.000000'
