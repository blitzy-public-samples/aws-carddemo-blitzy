# Account-id access to the card cross-reference through the alternate-index
# path the XREFFILE job defines and builds [app/jcl/XREFFILE.jcl:22-103]:
# - STEP05 deletes the cluster and the alternate index; each DELETE is followed
#   by IF MAXCC LE 08 THEN SET MAXCC = 0, so a missing entry leaves the step at
#   RC 0 [app/jcl/XREFFILE.jcl:22-31];
# - STEP10 defines the cluster, KEYS(16 0) RECORDSIZE(50 50) [app/jcl/XREFFILE.jcl:36-53];
# - STEP15 REPROs the sequential copy into it [app/jcl/XREFFILE.jcl:57-65];
# - STEP20 defines the alternate index on XREF-ACCT-ID, KEYS(11,25)
#   NONUNIQUEKEY UPGRADE [app/jcl/XREFFILE.jcl:69-83];
# - STEP25 relates it to the cluster through the path, and STEP30 builds it
#   with BLDINDEX [app/jcl/XREFFILE.jcl:87-103].
#
# The repository holds one card per account, so only invented records give the
# alternate key a duplicate: DAT-XREFFILE-normal-01 observes the duplicate
# order on gnucobol-batch with two invented cards on account 1, while this
# scenario derives the platform's. Here CARDXREF-PS is the 50 repository
# records of app/data/ASCII/cardxref.txt followed by one invented record: card
# 9999000000000001, customer 999999901, account 00000000001. Account 1 thus has
# two cards, its repository card 9680294154603697 and the invented one. The
# invented card is above every repository card, so the REPRO input stays in
# ascending primary-key order, as a load into the empty cluster requires. The
# alternate index is NONUNIQUEKEY, so BLDINDEX accepts the duplicate account id
# and every step ends RC 0.
#
# Expected values are derived from the JCL and CVACT03Y
# [app/cpy/CVACT03Y.cpy:4-8], never observed (GAP-INF-011):
# - CARDXREF holds the 51 records in card-number (primary-key) order, the
#   invented card last;
# - @AIX:CXACAIX is the same 51 records read through the account-id path
#   [app/csd/CARDDEMO.CSD:63-65], in account-id order, so account 1 comes first
#   with both its cards. Within the duplicate key they follow base-key order,
#   9680294154603697 before 9999000000000001, because BLDINDEX reads the
#   cluster sequentially in primary-key order; that order is the inference
#   GAP-INF-011 registers.
# IDCAMS writes only SYSPRINT, so messages hold just the step lines. Only the
# fields a record names are compared, so FILLER (14 spaces) is left out.
#
# INV-DAT-044, the AIX, PATH and BLDINDEX JCL-semantics item, is the only item
# listed. Listing it is what makes the scenario unikix-only
# (scenarios.jcl_semantics_items): the gnucobol-batch job driver has XREFFILE in
# its step tables, but its IDCAMS replacement (GAP-STB-005) cannot show what
# the platform's alternate index and path do. The XREFFILE job item belongs to
# DAT-XREFFILE-normal-01. On unikix the job is submitted through BPE
# (GAP-MIS-006); the fixture load and the unloads of CARDXREF and
# @AIX:CXACAIX are generated IDCAMS jobs (GAP-MIS-007).
#
# @CATALOG is not asserted. Its lines are platform DSNs, which this scenario
# keeps out, and the records read through the path already show that the
# alternate index, the path and BLDINDEX took effect.
#
# Nothing depends on the clock; the clock is relative because unikix cannot
# fix it (GAP-MIS-015).
id: DAT-XREFFILE-alternate-01
level: integration
type: alternate
description: >-
  XREFFILE loads the 50 repository cross-reference records plus one invented
  card for account 00000000001 and builds the non-unique account-id alternate
  index and its path: every step ends RC 0, the cluster holds the 51 records
  in card-number order, and the path reads them in account-id order, account
  00000000001 returning both its cards in card-number order.
inventory_ids:
- INV-DAT-044  # AIX, PATH and BLDINDEX alternate-key access (JCL semantics)
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-011  # JCL-semantics baselines derived, never observed
- GAP-MIS-007  # dataset load, unload and catalog listing on UniKix, which produce CARDXREF and @AIX:CXACAIX
- GAP-MIS-006  # BPE job submission and cancellation
