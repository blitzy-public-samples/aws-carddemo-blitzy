# COACTUPC FICO Score boundary, lower edge outside the range: 299, one below
# the first valid score. ACUP-NEW-CUST-FICO-SCORE (PIC 9(03), redefining the
# received 3-byte text) carries 88 FICO-RANGE-IS-VALID VALUES 300 THROUGH 850
# [app/cbl/COACTUPC.cbl:845-849]; 299 fails it, so 1275-EDIT-FICO-SCORE refuses
# the change with 'FICO Score: should be between 300 and 850'
# [app/cbl/COACTUPC.cbl:1545-1556,2514-2531]. The other edges of the item are
# 300 and 850 (accepted) and 851 (refused), in the next three FICO Score
# boundary scenarios.
#
# Steps 1-3 reach the fetched account as ACT-COACTUPC-alternate-04 does:
# USER0001 signs on through CC00, chooses option 2 (Account Update) on COMEN01,
# and enters account 00000000001. 9000-READ-ACCT reads CXACAIX by account id
# (card 9680294154603697, customer 000000001, line 49 of
# app/data/ASCII/cardxref.txt), ACCTDAT and CUSTDAT, keeps the records as the
# old values in the COMMAREA and sets ACUP-SHOW-DETAILS; the screen shows them
# with 'Update account details presented above.', every editable field
# unprotected with its MDT on [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,
# 2955-3000,3441-3561,3608-3884].
# Step 4 types 299 over the FICO Score (ACSTFCO, shown as 700) and presses
# ENTER.
# - 1100-RECEIVE-MAP moves the received '299' to the 3-byte
#   ACUP-NEW-CUST-FICO-SCORE-X [app/cbl/COACTUPC.cbl:845-849,1279-1284].
#   1205-COMPARE-OLD-NEW finds it unequal to the old score 700, so a change has
#   occurred, and 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs the
#   field edits in screen order [app/cbl/COACTUPC.cbl:1460-1470,1764-1768].
# - Account Status, Open Date, Credit Limit, Expiry Date, Cash Credit Limit,
#   Reissue Date, the current balance and cycle amounts, SSN and Date of Birth
#   pass on the repository account and the invented customer. 'FICO Score' is
#   moved to WS-EDIT-VARIABLE-NAME and the score to WS-EDIT-ALPHANUM-ONLY with
#   length 3; 1245-EDIT-NUM-REQD finds 299 supplied, all numeric and not zero
#   and sets FLG-ALPHNANUM-ISVALID, so 1275-EDIT-FICO-SCORE runs
#   [app/cbl/COACTUPC.cbl:1472-1556,2109-2176]. 299 is not within 300 THROUGH
#   850, so it sets INPUT-ERROR and FLG-FICO-SCORE-NOT-OK and, WS-RETURN-MSG
#   being still blank [app/cbl/COACTUPC.cbl:876], STRINGs the trimmed field
#   name and ': should be between 300 and 850' into WS-RETURN-MSG
#   [app/cbl/COACTUPC.cbl:2514-2531].
# - The name, address, zip, phone, EFT and primary-holder edits and the
#   state/zip cross edit pass on the invented customer; they only set their
#   flags, since WS-RETURN-MSG is no longer blank [app/cbl/COACTUPC.cbl:
#   1557-1676]. INPUT-ERROR keeps ACUP-CHANGES-NOT-OK, and 2000-DECIDE-ACTION
#   continues on it, so 9600-WRITE-PROCESSING, the only READ UPDATE and
#   REWRITE path, does not run [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values, the valid amounts
#   re-edited through +ZZZ,ZZZ,ZZZ.99 and the FICO Score as received; 3250 sets
#   PROMPT-FOR-CHANGES and moves the message to ERRMSG; 3300 keeps the fields
#   editable, puts the cursor on ACSTFCO and marks it red through CSSETATY
#   without the '*' of a blank field; 3390 makes F12=Cancel bright because
#   changes were made, while F5=Save stays dark [app/cbl/COACTUPC.cbl:
#   2870-2951,2955-2983,3101-3104,3333-3337,3566-3581]
#   [app/cpy/CSSETATY.cpy:18-27].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - The message is TRIM('FICO Score') followed by ': should be between 300 and
#   850', 41 characters of the 75-byte WS-RETURN-MSG, shown in the 78-byte
#   ERRMSG with trailing spaces. INFOMSG is the 40-byte WS-INFO-MSG in the
#   45-byte field. Fields are compared at their full BMS length, trailing
#   spaces kept.
# - The tpe adapter enters a field with EraseEOF before typing; '299' fills the
#   3-byte ACSTFCO, and the screen shows it as received.
# - FKEY05 and FKEY12 keep their INITIAL text; a dark (ASKIP,DRK) field is
#   captured as blanks. Colour and cursor position are not in the s3270 text
#   capture and are not asserted.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every other
# COACTUPC edit, so the FICO Score is the only field refused and its old value
# 700 is a valid score: the repository record has FICO 274, itself below 300,
# and zip 12546, which is not a North Carolina zip [app/cbl/COACTUPC.cbl:
# 2514-2558]. Account 00000000001 and its cross-reference stay as in the
# repository.
id: ACT-COACTUPC-boundary-01
level: e2e
type: boundary
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001, whose customer has FICO Score 700, types 299 over the
  FICO Score and presses ENTER. 299 is one below the lowest valid score 300,
  so COACTUPC refuses the change: it shows the received values again,
  editable, with 'FICO Score: should be between 300 and 850' in the message
  line, the score as typed, the change prompt 'Update account details
  presented above.' and F12=Cancel made visible. Nothing is saved: ACCTDATA
  and CUSTDATA still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-146  # COACTUPC FICO Score: 300 to 850 (1275-EDIT-FICO-SCORE)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute set on ACSTFCO
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the date edits the earlier dates and Date of Birth pass
- INV-LAY-014  # CSUTLDWY: the date-edit working storage
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix COACTUPC STRINGs the untrimmed 25-byte field name in
# 1275-EDIT-FICO-SCORE, so on UniKix the message reads 'FICO Score' padded to
# 25 bytes before ': should be between 300 and 850'; the app/ text is pinned.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
        CUST-ADDR-ZIP: '27601'
