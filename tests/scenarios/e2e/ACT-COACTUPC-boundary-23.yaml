# COACTUPC Date of Birth boundary, accepted edge: the day before the run date.
# EDIT-DATE-OF-BIRTH accepts a Date of Birth only when the current date is
# strictly greater than it, so the day before the run date (this case) passes
# and the run date itself (ACT-COACTUPC-boundary-24) is refused with
# 'Date of Birth:cannot be in the future ' [app/cpy/CSUTLDPY.cpy:341-369].
#
# The run date is the region's clock, which the unikix adapter cannot set
# (GAP-MIS-015), so no fixed date is the day before it. Step 4 therefore types
# DOBYEAR, DOBMON and DOBDAY as run-date inputs, {run-date: {offset_days:
# -1, format: ...}}, which the adapter renders from the run date it reads on
# the first step's screen; screen 4 asserts the echoed parts with the run-date
# matchers of the same offset and format. A fixed date would make this a case
# of some other date, not of the day before the run date.
#
# Steps 1-3 fetch account 00000000001 and customer 000000001 as
# ACT-COACTUPC-alternate-04 does: sign-on through CC00, main-menu option 2,
# then the account id on the COACTUP search screen. 2000-DECIDE-ACTION reads
# CXACAIX, ACCTDAT and CUSTDAT, and 3202/3250 show the details with 'Update
# account details presented above.' and every editable field unprotected with
# MDT on, so all of them come back on the next AID
# [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,2955-3000,3500-3561,3608-3884].
# Step 4 types the year, month and day of the day before the run date over the
# fetched 1961-06-08 and presses ENTER; 1200-RECEIVE-MAP builds
# ACUP-NEW-CUST-DOB-YYYY-MM-DD from them [app/cbl/COACTUPC.cbl:1256-1274].
# 1205-COMPARE-OLD-NEW finds the date of birth changed, and
# 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs every edit in field
# order [app/cbl/COACTUPC.cbl:1429-1676,1681-1766]:
# - Account Status and the Open, Expiry and Reissue Dates come back as fetched
#   and pass, as in ACT-COACTUPC-alternate-04; each of the three dates passes
#   CSUTLDTC with severity 0 (GAP-INF-001).
# - Date of Birth goes through EDIT-DATE-CCYYMMDD: the year is supplied,
#   numeric and in century 20, the month and day are supplied and form a real
#   calendar day, so no 30-day-month, February or leap-year message applies,
#   and EDIT-DATE-LE calls CSUTLDTC with the mask YYYYMMDD. Severity 0 is the
#   derived result, so WS-EDIT-DT-OF-BIRTH-ISVALID holds
#   [app/cbl/COACTUPC.cbl:1533-1539] [app/cpy/CSUTLDPY.cpy:18-331]. Which
#   dates CEEDAYS accepts is known only through the stub (GAP-INF-001), and
#   whether UniKix supplies CEEDAYS at all is GAP-MIS-010.
# - EDIT-DATE-OF-BIRTH then compares FUNCTION INTEGER-OF-DATE of the current
#   date and of the date of birth. The current date is one day greater, so the
#   IF takes CONTINUE: no flag is set and no ':cannot be in the future '
#   message is composed [app/cbl/COACTUPC.cbl:1539-1543]
#   [app/cpy/CSUTLDPY.cpy:341-369].
# - FICO Score and every name, address, phone, SSN and EFT edit pass for the
#   invented customer below, so INPUT-ERROR stays off and
#   ACUP-CHANGES-OK-NOT-CONFIRMED is set [app/cbl/COACTUPC.cbl:1484-1676].
# Without PF5, 2000-DECIDE-ACTION does not run 9600-WRITE-PROCESSING, the sole
# READ UPDATE and REWRITE path [app/cbl/COACTUPC.cbl:2590-2621].
# 3203-SHOW-UPDATED-VALUES shows the received values with the new date of
# birth, 3250-SETUP-INFOMSG moves PROMPT-FOR-CONFIRMATION to INFOMSG and the
# blank WS-RETURN-MSG to ERRMSG, and 3390 makes F5=Save and F12=Cancel
# visible [app/cbl/COACTUPC.cbl:472-473,2870-2951,2955-2983,3566-3581].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte INFOMSGO; ERRMSG is the
#   75-byte WS-RETURN-MSG, blank, in the 78-byte ERRMSGO, so it holds no Date
#   of Birth message and no other.
# - The tpe adapter enters a field with EraseEOF before typing, so DOBYEAR,
#   DOBMON and DOBDAY hold exactly the 4-, 2- and 2-digit parts.
# - FKEY05 and FKEY12 keep their INITIAL text. On screen 3 they are dark
#   (ASKIP,DRK), and the s3270 capture renders a zero-intensity field as blanks.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by the invented data of the other COACTUPC
# update scenarios, which passes every edit. The repository record has FICO
# 274 and zip 12546, and either would be refused first
# [app/cbl/COACTUPC.cbl:2514-2558]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-boundary-23
level: e2e
type: boundary
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update) and fetches
  account 00000000001 with customer 000000001. The Date of Birth is changed
  from 1961-06-08 to the day before the run date and ENTER is pressed. The
  date passes the Date of Birth edits, the CSUTLDTC (CEEDAYS) check with the
  mask YYYYMMDD and the future-date check, because the run date is strictly
  greater than it, and no Date of Birth message appears. Every edit passes,
  so COACTUPC shows the new date of birth, protected, with 'Changes
  validated.Press F5 to save' and a blank message line. Nothing is saved
  before PF5.
# Primary item first, then the CSUTLDTC date acceptance the call reaches, the
# program, the maps asserted, the transaction of steps 3 and 4, the CSD files
# COACTUPC reads, and the online-only copybooks it copies. INV-ACT-031
# ('Changes validated.Press F5 to save') is verified by
# ACT-COACTUPC-alternate-04 and INV-ACT-141 (CSUTLDTC severity 0 for the Date
# of Birth) by its own scenario. Sign-on (CC00, COSGN00, USRSEC) and the menu
# transaction are verified by the SEC and MNU scenarios, and the batch record
# copybooks and data files at the lowest level that executes them.
inventory_ids:
- INV-ACT-142  # COACTUPC Date of Birth: earlier than the run date (EDIT-DATE-OF-BIRTH), its accepted edge
- INV-UTL-003  # CSUTLDTC date acceptance for masks YYYY-MM-DD and YYYYMMDD, reached through EDIT-DATE-LE
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and confirmation screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the validation
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the per-field error attributes
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-DATE-CCYYMMDD, EDIT-DATE-LE and EDIT-DATE-OF-BIRTH
- INV-LAY-014  # CSUTLDWY: the date-edit work areas and flags
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-INF-001  # which dates CEEDAYS accepts is known only through the stub
- GAP-MIS-010  # whether UniKix supplies CEEDAYS
# The UniKix copy of CSUTLDPY drops TRIM from the composed date-edit messages
# and replaces TEST-NUMVAL in the month and day checks; it lists INV-ACT-142.
- GAP-DOC-024
# The UniKix copy of CSUTLDTC trims the Vstring lengths it passes to CEEDAYS,
# so the date and mask CEEDAYS receives differ on UniKix; it lists INV-UTL-003.
- GAP-DOC-021
# The UniKix COACTUPC comments out the TEST-NUMVAL-C amount checks this path
# runs and drops TRIM from its change detection, so the amounts re-edited on
# screen 4 may differ on UniKix.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # update scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
        CUST-ADDR-ZIP: '27601'
        CUST-PHONE-NUM-1: (919)555-0101
        CUST-PHONE-NUM-2: (919)555-0102
        CUST-SSN: '123456789'
        CUST-GOVT-ISSUED-ID: TESTGOVT0001
        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: Y
        CUST-FICO-CREDIT-SCORE: '700'
    USRSEC: {base: USRSEC}
  parameters:
    # The run date is the region clock, so the Date of Birth typed and the
    # dates shown are stated relative to it.
    clock_mode: relative
  faults: []
# PASSWORD is the documented demo password of README.md, not a secret.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  # The day before the run date, typed over the fetched 1961-06-08; every
  # other field is left as fetched.
  - aid: ENTER
    '@map': COACTUP
    fields:
      DOBYEAR: {run-date: {offset_days: -1, format: '%Y'}}
      DOBMON: {run-date: {offset_days: -1, format: '%m'}}
      DOBDAY: {run-date: {offset_days: -1, format: '%d'}}
