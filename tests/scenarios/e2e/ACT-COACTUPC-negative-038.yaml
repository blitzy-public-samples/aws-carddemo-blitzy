# COACTUPC refuses an Expiry Date of 29 February in a year that is not a leap
# year: 'Expiry Date:Not a leap year.Cannot have 29 days in this month.'
#
# Steps 1-3 reach the COACTUP detail screen of account 00000000001 as
# ACT-COACTUPC-alternate-04 does: CXACAIX gives card 9680294154603697 and
# customer 000000001 (line 49 of app/data/ASCII/cardxref.txt), ACCTDAT and
# CUSTDAT are read, and 3320-UNPROTECT-FEW-ATTRS gives every editable field
# DFHBMFSE, so all of them come back on the next AID
# [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3500-3561,3608-3884].
# Step 4 types 2025, 02 and 29 over the expiry year, month and day and presses
# ENTER. 1100-RECEIVE-MAP builds ACUP-NEW-EXPIRAION-DATE '20250229'
# [app/cbl/COACTUPC.cbl:1165-1187], 1205-COMPARE-OLD-NEW finds the change, and
# 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and edits the fields in screen
# order [app/cbl/COACTUPC.cbl:1460-1494]. Account Status Y, Open Date 20141120
# and Credit Limit 2,020.00 pass, so WS-RETURN-MSG is still blank when the
# Expiry Date edit runs EDIT-DATE-CCYYMMDD THRU EDIT-DATE-CCYYMMDD-EXIT:
# - EDIT-YEAR-CCYY: 2025 is supplied, numeric and of century 20.
# - EDIT-MONTH and EDIT-DAY: 02 and 29 are supplied, numeric and in range.
# - EDIT-DAY-MONTH-YEAR: neither 31 in a 30-day month nor 30 in February.
#   For February 29 the divisor is 400 only when the year ends in 00; YY is 25,
#   so 2025 is divided by 4, the remainder is 1, and INPUT-ERROR and the year,
#   month and day NOT-OK flags are set. The STRING composes the trimmed field
#   name with ':Not a leap year.Cannot have 29 days in this month.' and the
#   routine leaves through GO TO EDIT-DATE-CCYYMMDD-EXIT, so CSUTLDTC is not
#   called for this date [app/cpy/CSUTLDPY.cpy:18-282].
# Every later edit composes its message only under WS-RETURN-MSG-OFF, and the
# invented customer passes them anyway, so this message stands.
# 2000-DECIDE-ACTION only continues on ACUP-CHANGES-NOT-OK, so neither
# 9600-WRITE-PROCESSING nor any REWRITE runs [app/cbl/COACTUPC.cbl:2596-2597].
# 3203-SHOW-UPDATED-VALUES shows the received values, the valid amounts
# re-edited through +ZZZ,ZZZ,ZZZ.99; 3250 sets PROMPT-FOR-CHANGES; 3300
# unprotects the editable fields again and turns the three expiry fields red
# (CSSETATY), which the capture does not show; 3390 makes F12=Cancel bright
# because ACUP-CHANGES-MADE holds, while F5=Save stays dark
# [app/cbl/COACTUPC.cbl:2870-2951,2964-2965,2998-2999,3236-3253,3566-3581].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - The message is 62 characters in the 75-byte WS-RETURN-MSG, shown in the
#   78-byte ERRMSG with 16 trailing spaces.
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte INFOMSGO.
# - A dark (ASKIP,DRK) field is captured as blanks.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by the invented data of the other COACTUPC
# scenarios, which passes every COACTUPC edit, so no other field is refused
# before or instead of the expiry date [app/cbl/COACTUPC.cbl:2514-2558]
# [app/cpy/CSLKPCDY.cpy:521,895,1186].
id: ACT-COACTUPC-negative-038
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001 and changes its expiry date from 2025-05-20 to
  2025-02-29. 2025 is not a leap year, so COACTUPC refuses the date with
  'Expiry Date:Not a leap year.Cannot have 29 days in this month.', shows the
  entered values again with the change prompt and F12=Cancel, and saves
  nothing: ACCTDATA and CUSTDATA keep the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-096  # COACTUPC Expiry Date: no 29th of February outside a leap year (rule)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refusal screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attributes of the expiry fields
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-DAY-MONTH-YEAR, the leap-year check
- INV-LAY-014  # CSUTLDWY: WS-EDIT-DATE-CCYYMMDD and its February and day-29 conditions
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY drops FUNCTION TRIM from the field name, so on UniKix the
# message starts with the 25-byte name and is cut at 75 characters.
- GAP-DOC-024
# Not in the planned gap list. The UniKix COACTUPC comments out the TEST-NUMVAL-C
# amount checks the credit limit edit runs before the expiry date, which changes
# the amounts screen 4 shows; scenarios cite each place where the deployed
# UniKix copy differs from app/.
- GAP-DOC-022
# Not in the planned gap list, for the same reason: the UniKix COACTUP.bms
# differs at row 1, columns 1-9, of the map this scenario asserts.
- GAP-DOC-025
