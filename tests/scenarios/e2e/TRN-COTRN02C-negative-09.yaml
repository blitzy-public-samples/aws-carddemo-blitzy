# Transaction Add with the Source left empty; every other field of the valid
# set is entered.
#
# Step 1 signs on as USER0001 on COSGN00 (transaction CC00); the type-U user is
# routed to COMEN01C, which sends the main menu COMEN01 headed CM00/COMEN01C
# [app/cbl/COSGN00C.cbl:230-237] [app/cbl/COMEN01C.cbl:36-37,82-90].
# Step 2 enters option 8 on COMEN01: 'Transaction Add', user type U, program
# COTRN02C [app/cpy/COMEN02Y.cpy:67-72]. COTRN02C, not re-entered, sets the
# re-enter flag, moves LOW-VALUES to COTRN2AO and sends the empty COTRN02 with
# its header [app/cbl/COTRN02C.cbl:115-130,516-571].
# Step 3 fills COTRN02 by card number (Acct # left blank), with TRNSRC empty,
# and presses ENTER under CT02:
# - VALIDATE-INPUT-KEY-FIELDS takes the card branch: the card is numeric, is
#   moved back through WS-CARD-NUM-N unchanged, READ CCXREF by card is NORMAL,
#   and XREF-ACCT-ID 00000000050 is moved to ACTIDINI
#   [app/cbl/COTRN02C.cbl:210-223,609-637].
# - VALIDATE-INPUT-DATA-FIELDS finds Type CD and Category CD supplied, and the
#   third WHEN fires on TRNSRCI = SPACES OR LOW-VALUES: 'Source can NOT be
#   empty...' goes to WS-MESSAGE and SEND-TRNADD-SCREEN sends COTRN02 again
#   with ERASE, then RETURNs TRANSID CT02 [app/cbl/COTRN02C.cbl:251-268,516-534].
#   The RETURN ends the task there, so the remaining edits and the CONFIRM
#   evaluation never run, ADD-TRANSACTION is never performed and TRANSACT is
#   neither browsed nor written [app/cbl/COTRN02C.cbl:164-171,442-466].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - COTRN2AO redefines COTRN2AI [app/cpy-bms/COTRN02.CPY:145], so the fields come
#   back as received, padded with blanks to their BMS lengths; ACTIDIN shows
#   the account the cross-reference returned, and TRNSRC and CONFIRM, never
#   typed, are captured as blanks.
# - ERRMSG is the 78-byte ERRMSGO: the 26-character message and 52 spaces
#   (WS-MESSAGE X(80) moved to X(78)); comparisons never trim.
# - The header is POPULATE-HEADER-INFO's [app/cbl/COTRN02C.cbl:552-571]: the
#   COTTL01Y titles, CT02, COTRN02C, CURDATE as mm/dd/yy and CURTIME as
#   hh:mm:ss, both from the region clock, hence matchers and a relative clock.
id: TRN-COTRN02C-negative-09
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 8 (Transaction Add) and, on
  COTRN02, enters repository card 0500024453765740 with a valid type,
  category, description, amount, dates and merchant fields but leaves Source
  empty. COTRN02C sends COTRN02 again with 'Source can NOT be empty...' in
  ERRMSG, the entered values kept and the account 00000000050 looked up from
  the card, and writes no TRANSACT record.
# Primary item first, then the program, the maps asserted, the transaction
# step 3 runs under, the CSD file COTRN02C reads before the refusal, and the
# online-only copybooks it copies. Sign-on and the menu option (CC00, CM00,
# COSGN00, USRSEC) are verified by the SEC and MNU scenarios; TRANSACT is not
# accessed on this path, and the batch record copybooks and data files are
# verified at the lowest level that executes them.
inventory_ids:
- INV-TRN-038  # COTRN02C message 'Source can NOT be empty...' (rule)
- INV-TRN-003  # COTRN02C program
- INV-MNU-003  # COMEN01 map, where option 8 is entered
- INV-TRN-006  # COTRN02 map, the add screen of steps 2 and 3
- INV-CFG-022  # CT02 transaction, under which COTRN02C receives the add
- INV-CFG-004  # CCXREF CSD file: card cross-reference read by card number
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the program context
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y, copied by COTRN02C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-007  # TRN end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    USRSEC: {base: USRSEC}
    CARDXREF: {base: CARDXREF}
    # TRANSACT has no repository data of its own (datasets.yaml source
    # 'built'), so it is built from the 300 repository daily transactions,
    # which share its 350-byte record shape.
    TRANSACT: {base: DALYTRAN}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '8'
  # ACTIDIN is left blank, so the card number selects the cross-reference.
  # The empty value leaves the Source field empty.
  - aid: ENTER
    '@map': COTRN02
    fields:
      CARDNIN: '0500024453765740'
      TTYPCD: '01'
      TCATCD: '0001'
      TRNSRC: ''
      TDESC: 'Test purchase'
      TRNAMT: '+00000012.34'
      TORIGDT: '2022-07-01'
      TPROCDT: '2022-07-01'
      MID: '800000001'
      MNAME: 'Test Merchant'
      MCITY: 'Testville'
      MZIP: '27601'
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: 'CM00'
    PGMNAME: 'COMEN01C'
  - '@map': COTRN02
    TRNNAME: 'CT02'
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: 'COTRN02C'
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ERRMSG: '                                                                              '
  - '@map': COTRN02
    TRNNAME: 'CT02'
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: 'COTRN02C'
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ACTIDIN: '00000000050'
    CARDNIN: '0500024453765740'
    TTYPCD: '01'
    TCATCD: '0001'
    TRNSRC: '          '
    TDESC: 'Test purchase                                               '
    TRNAMT: '+00000012.34'
    TORIGDT: '2022-07-01'
    TPROCDT: '2022-07-01'
    MID: '800000001'
    MNAME: 'Test Merchant                 '
    MCITY: 'Testville                '
    MZIP: '27601     '
    CONFIRM: ' '
    ERRMSG: 'Source can NOT be empty...                                                    '
  # The ERRMSG of each step: the menu and the empty add screen carry none.
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'Source can NOT be empty...                                                    '
  file_state:
    # No record is written: TRANSACT keeps its 300 fixture records, and the
    # highest of them, which an add would have numbered after, is unchanged.
    # Values are in decoded form: TRAN-CAT-CD 0001 is the number 1 and
    # TRAN-AMT 0000006032B the decimal 603.22.
    TRANSACT:
      count: 300
      contains:
      - TRAN-ID: '0000000996722787'
        TRAN-TYPE-CD: '01'
        TRAN-CAT-CD: '1'
        TRAN-SOURCE: 'POS TERM  '
        TRAN-DESC: 'Purchase at Kilback LLC                                                                             '
        TRAN-AMT: '603.22'
        TRAN-MERCHANT-ID: '800000000'
        TRAN-MERCHANT-NAME: 'Kilback LLC                                       '
        TRAN-MERCHANT-CITY: 'Cummeratamouth                                    '
        TRAN-MERCHANT-ZIP: '53200-7529'
        TRAN-CARD-NUM: '3260763612337560'
        TRAN-ORIG-TS: '2022-06-10 19:27:53.000000'
        TRAN-PROC-TS: '                          '
