# Gap register source: every open question about the inventory, rendered by tests/harness/report.py into
# tests/reports/gap-register.csv and into each inventory item's gap_ids. Entries are never deleted. An entry
# closes only on evidence: status closed, resolving_evidence set to an execution_id with its evidence path
# (or a commit), the inventory, scenarios and baselines updated with their semver bump, and the reports
# regenerated; contrary evidence reopens it. Closing a suspected-defect never changes app/.
#
# An entry's resolved items are affected_inventory_ids (ids of the frozen tests/inventory/inventory.yaml)
# united with the items matching any clause of `affected`; within a clause every key must match, and a
# list-valued key matches any of its values (grammar in selector_keys). Every set the frozen inventory
# fixes is listed as explicit ids; `affected` carries only the clauses that depend on scenarios. When the UniKix
# importer narrows a GAP-INF entry it sets affected_inventory_ids to the items still unverified and drops
# `affected`.
categories:
  DEF: suspected-defect
  DOC: doc-conflict
  INF: inferred-not-observed
  MIS: missing-input
  STB: stub-limitation
  UNC: uncertain-purpose
