openapi: 3.1.0

info:
  title: CardDemo Fraud Detection Service
  version: 1.0.0
  description: >-
    Read-only access to risk assessments produced asynchronously from
    TransactionAuthorized events. The fraud capability is additive in full and has no
    COBOL ancestor.

servers:
  - url: http://localhost:8083
    description: Local demo host port

tags:
  - name: fraud-assessments
    description: Stored risk assessments

security:
  - basicIdentity: []

paths:
  /fraud-assessments:
    get:
      tags: [fraud-assessments]
      operationId: assessmentsOfAccount
      summary: List one account's risk assessments
      description: >-
        Returns assessments newest first. The route is administrator-only and performs
        no scoring, write, event publication, or call to another service.
      parameters:
        - name: accountId
          in: query
          required: true
          description: Eleven-digit account identifier with leading zeros preserved.
          schema:
            type: string
            pattern: '^[0-9]{11}$'
        - name: page
          in: query
          required: false
          description: Zero-based page number interpreted by Spring Data.
          schema:
            type: integer
            minimum: 0
        - name: size
          in: query
          required: false
          description: Positive page size interpreted by Spring Data.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Assessments for the account, newest first; an empty array is valid.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FraudAssessment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalFailure'

  /fraud-assessments/{transactionId}:
    get:
      tags: [fraud-assessments]
      operationId: assessmentOfTransaction
      summary: Read one transaction's risk assessment
      description: >-
        Returns the assessment keyed by the sixteen-character transaction identifier.
        The route is administrator-only.
      parameters:
        - name: transactionId
          in: path
          required: true
          description: Sixteen-character transaction identifier.
          schema:
            type: string
            minLength: 16
            maxLength: 16
      responses:
        '200':
          description: The stored assessment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudAssessment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No assessment exists for that transaction.
        '500':
          $ref: '#/components/responses/InternalFailure'

components:
  securitySchemes:
    basicIdentity:
      type: http
      scheme: basic
      description: >-
        The shipped security chain admits only an identity holding ROLE_ADMIN to either
        fraud-assessment route.

  responses:
    BadRequest:
      description: An identifier or paging value failed request validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: The request carried no usable credential.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Basic authentication challenge.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated identity is not an administrator.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalFailure:
      description: The assessment could not be read.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    FraudAssessment:
      type: object
      additionalProperties: false
      required:
        - transactionId
        - accountId
        - riskScore
        - triggeredRules
        - flagged
        - assessedAt
      properties:
        transactionId:
          type: string
          minLength: 16
          maxLength: 16
          description: Transaction identifier from TRAN-ID PIC X(16).
        accountId:
          type: string
          pattern: '^[0-9]{11}$'
          description: Account identifier from XREF-ACCT-ID PIC 9(11).
        riskScore:
          type: integer
          minimum: 0
          maximum: 100
          description: Additive risk score.
        triggeredRules:
          type: array
          uniqueItems: true
          description: Rule identifiers in evaluation order; empty for a cleared assessment.
          items:
            type: string
            enum: [VELOCITY, AMOUNT_ANOMALY, MERCHANT_CATEGORY]
        flagged:
          type: boolean
          description: True exactly when triggeredRules is not empty.
        assessedAt:
          type: string
          format: date-time
          description: Time the risk assessment finished.

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string