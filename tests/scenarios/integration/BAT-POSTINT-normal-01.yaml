# The first two jobs of the daily batch cycle, POSTTRAN then INTCALC, run
# against one catalog on the repository data: the job-chain proof's own
# scenario, which needs no page-zero mapping.
#
# POSTTRAN STEP15 runs CBTRN02C on the 300 daily transactions of
# app/data/ASCII/dailytran.txt, 6 for each of the 50 cards [app/jcl/POSTTRAN.jcl:23-42].
# Every card is in CARDXREF, every account in ACCTDATA, and no transaction
# originates after its account's expiry date, so reasons 100, 101 and 103 do
# not occur. The over-limit test compares ACCT-CREDIT-LIMIT with
# ACCT-CURR-CYC-CREDIT - ACCT-CURR-CYC-DEBIT + DALYTRAN-AMT, cycle totals that
# grow with every posting of the run [app/cbl/CBTRN02C.cbl:393-422]
# (GAP-UNC-011): 38 purchases (type 01) fail it and are written to the new
# DALYREJS generation, each the 350-byte transaction followed by reason 0102 and
# 'OVERLIMIT TRANSACTION' [app/cbl/CBTRN02C.cbl:446-465]. The other 262, 212 of
# type 01 and 50 of type 03, are posted: each is written to TRANSACT with
# TRAN-PROC-TS taken from the run clock, added to the account's balance and to
# its cycle credit (amount >= 0) or debit, and added to its category balance
# [app/cbl/CBTRN02C.cbl:424-445,467-580,692-705]. The repository TCATBALF holds
# only type 01 category 0001 for each account, so the first type 03 posting of
# every account creates its record, displaying 'TCATBAL record not found for
# key : <key>.. Creating.' 50 times [app/cbl/CBTRN02C.cbl:467-525]. TRANFILE is
# opened OUTPUT, which on GnuCOBOL recreates the file, so the TRANSACT-INIT seed
# record does not survive (GAP-STB-010) [app/cbl/CBTRN02C.cbl:254-256]. The run
# ends with RETURN-CODE 4 because records were rejected
# [app/cbl/CBTRN02C.cbl:227-231]; no path sets 8 (GAP-DOC-006).
#
# INTCALC STEP15 runs CBACT04C with PARM 2022071800, passed by PARMDRV
# (GAP-STB-004) [app/jcl/INTCALC.jcl:22-41], over the 100 TCATBALF records
# POSTTRAN left. Each is displayed and then looked up in DISCGRP under its
# account's ACCT-GROUP-ID, which is blank in every account (GAP-DEF-005), so
# 'DISCLOSURE GROUP RECORD MISSING' and 'TRY WITH DEFAULT GROUP CODE' follow
# every record, 100 times, and the DEFAULT group's rate applies
# [app/cbl/CBACT04C.cbl:415-460]: 15.00 for type 01 category 0001 and 0.00 for
# type 03 category 0001 [app/data/ASCII/discgrp.txt:18,25]. A zero rate writes
# no interest record [app/cbl/CBACT04C.cbl:214-217], so SYSTRAN(+1) receives 50
# interest transactions, 2022071800000001 to 2022071800000050, one per account
# in account order: TRAN-CAT-BAL * 15.00 / 1200 without rounding (GAP-UNC-008),
# type 01, category 0005, source 'System', the description 'Int. for a/c
# <account>' followed by the x'00' of never-initialized working storage
# (GAP-UNC-009, GAP-STB-011), the card of the account's cross-reference, and
# both timestamps from the run clock [app/cbl/CBACT04C.cbl:462-515].
# 1050-UPDATE-ACCOUNT adds an account's interest to ACCT-CURR-BAL and zeroes
# both cycle fields when the next account's first record arrives, so accounts 1
# to 49 are rewritten; the end-of-file rewrite of the last account is
# unreachable, so account 50 keeps POSTTRAN's balance and its cycle credit
# 1501.75 and debit -47.88 (GAP-DEF-003) [app/cbl/CBACT04C.cbl:188-222,350-370].
# CBACT04C opens TCATBALF INPUT, so it ends as POSTTRAN left it.
#
# On gnucobol-batch the scenario runs at the default clock 2022-07-06
# 10:00:00.00. It declares clock_mode relative, as every scenario unikix can run
# does, so the clock-derived timestamps are run-timestamp matchers, which
# resolve there to 2022-07-06-10.00.00.000000.
id: BAT-POSTINT-normal-01
level: integration
type: normal
description: >-
  POSTTRAN then INTCALC against one catalog, on the repository fixtures with
  dailytran.txt as DALYTRAN and TRANSACT-INIT as TRANSACT. POSTTRAN processes
  300 transactions, rejects 38 as 0102 'OVERLIMIT TRANSACTION' to the new
  DALYREJS generation, posts the other 262 to TRANSACT, creates 50 TCATBALF
  records and ends with return code 4. INTCALC falls back to the DEFAULT
  disclosure group for all 100 category balances, writes 50 interest
  transactions 2022071800000001 to 2022071800000050 to the new SYSTRAN
  generation, rewrites accounts 1 to 49 with their interest and leaves account
  50 as POSTTRAN posted it, ending with return code 0.
inventory_ids:
- INV-BAT-001  # BAT daily batch cycle, whose first two jobs these are (job)
- INV-TRN-009  # POSTTRAN job
- INV-FIN-002  # INTCALC job
# Listed here: no unit scenario loads TRANSACT-INIT, and this scenario never depends on page zero.
- INV-DTA-016  # AWS.M2.CARDDEMO.DALYTRAN.PS.INIT, the TRANSACT-INIT fixture source
tags:
- suspected-defect
- observed-only
gap_ids:
- GAP-DEF-003  # INTCALC never rewrites the last account
- GAP-DEF-005  # ACCT-GROUP-ID is blank, so every DISCGRP lookup falls back to DEFAULT
- GAP-UNC-011  # the over-limit test on running cycle totals; all 38 rejects are 0102
- GAP-UNC-008  # interest is truncated, not rounded
- GAP-UNC-009  # the x'00' after 'Int. for a/c <account>'
- GAP-STB-004  # PARMDRV in place of the z/OS EXEC PARM linkage
- GAP-STB-009  # the catalog and GDG emulation behind DALYREJS(+1) and SYSTRAN(+1)
- GAP-STB-010  # Berkeley DB indexed files; OPEN OUTPUT recreates TRANSACT
- GAP-STB-011  # GnuCOBOL compile and runtime options; the x'00' description fill
- GAP-DOC-006  # the tech spec's return codes 0, 4, 8 and reasons 100 to 103; only 4, 0 and 0102 occur
preconditions:
  # The daily cycle's fixture set, each the repository dataset as it stands.
  # Neither job here opens CUSTDATA, TRANTYPE or TRANCATG; they complete the
  # region state the unikix reset loads, and the gnucobol-batch catalog leaves
  # them out.
  datasets:
    DALYTRAN: {base: DALYTRAN}
    CARDXREF: {base: CARDXREF}
    ACCTDATA: {base: ACCTDATA}
    TCATBALF: {base: TCATBALF}
    DISCGRP: {base: DISCGRP}
    CUSTDATA: {base: CUSTDATA}
    TRANTYPE: {base: TRANTYPE}
    TRANCATG: {base: TRANCATG}
    TRANSACT: {base: TRANSACT-INIT}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  job: [POSTTRAN, INTCALC]
expected:
