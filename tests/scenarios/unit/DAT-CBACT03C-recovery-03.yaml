# DAT-CBACT03C-recovery-03: CBACT03C lists every card cross-reference record,
# then its CLOSE of XREFFILE fails and the run abends through
# 9000-XREFFILE-CLOSE [app/cbl/CBACT03C.cbl:136-152], 9910-DISPLAY-IO-STATUS
# [app/cbl/CBACT03C.cbl:161-174] and 9999-ABEND-PROGRAM
# [app/cbl/CBACT03C.cbl:154-158].
#
# Derived, never observed. No adapter injects a close failure after a
# successful open (GAP-MIS-013), so gnucobol-batch raises MissingPrerequisite
# and the scenario stays implemented-unexecuted; its baseline is derived from
# the source (GAP-INF-013) and capture.py refuses to capture it.
#
# How the expected messages were derived:
# - Every line up to the close is the listing the program writes before
#   9000-XREFFILE-CLOSE on the repository CARDXREF: for each of the 50 records,
#   in card-number (primary key) order, the 50-byte CARD-XREF-RECORD with its
#   trailing spaces, displayed twice, once by 1000-XREFFILE-GET-NEXT and once
#   by the main loop [app/cbl/CBACT03C.cbl:74-81,92-96]. It is the listing of
#   DAT-CBACT03C-normal-01 without its end-of-execution line.
# - The fault condition io-error is taken as file status 30 (inferred). '30' is
#   numeric and does not start with '9', so 9910 shows it as NNNN0030.
# - The CEE3ABD stub ends the run (GAP-STB-001, GAP-DEF-001): the adapter
#   reports return_code null and appends the stub's marker, and the
#   'END OF EXECUTION OF PROGRAM CBACT03C' line is never reached.
id: DAT-CBACT03C-recovery-03
level: unit
type: recovery
description: >-
  Close failure after a full listing: CBACT03C lists the 50 repository card
  cross-reference records, each twice, then CLOSE XREFFILE returns a non-zero
  status, so it displays 'ERROR CLOSING XREFFILE', the status as 'FILE STATUS
  IS: NNNN0030' and 'ABENDING PROGRAM', and abends through CEE3ABD without the
  end-of-execution line.
inventory_ids:
- INV-DAT-036
tags:
- inferred-not-observed
gap_ids:
- GAP-MIS-013
- GAP-INF-013
- GAP-STB-001
- GAP-DEF-001
# CBACT03C reads its indexed XREFFILE and is compiled with the mapped options on
# gnucobol-batch, so the case cites those two stub limitations, as every
# scenario whose program uses a seam does.
- GAP-STB-010
- GAP-STB-011
