# Manifest of the derived baseline of RPT-CORPT00C-boundary-01: USER0001 signs
# on, takes main menu option 9 'Transaction Reports', marks CUSTOM with X and
# asks for 12/01/2022 to 12/31/2022 with CONFIRM empty. Start month 12 is the
# upper bound the start-month check accepts, CSUTLDTC accepts both dates with
# mask YYYY-MM-DD, and CORPT00C resends CORPT00 with 'Please confirm to print
# the Custom report...' and submits nothing to JOBS. Only unikix can run the
# scenario, so expected.yaml was authored from
# [app/cbl/CORPT00C.cbl:165-181,256-436,462-474,556-591] and
# [app/cbl/COMEN01C.cbl:115-156], not captured, and is inferred-not-observed
# (GAP-INF-009, GAP-INF-012; GAP-INF-001 and GAP-MIS-010 for the CEEDAYS
# result). It names no execution_id or execution_fingerprint and holds no
# datasets/ until report.py --import-unikix promotes an eligible UniKix run.
#
# source_identity.units are the app/ sources the three steps execute, since
# harness.results gives an e2e run none: the COPY closure
# (inventory_tools.copy_closure) of COSGN00C, which signs USER0001 on and
# XCTLs to COMEN01C; of COMEN01C, whose option 9 XCTLs to CORPT00C
# [app/cpy/COMEN02Y.cpy:74-78]; of CORPT00C; and of CSUTLDTC, which
# PROCESS-ENTER-KEY CALLs for the start and end dates once the month, day and
# year checks pass [app/cbl/CORPT00C.cbl:329-426]; plus the BMS sources of the
# maps COSGN00, COMEN01 and CORPT00. DFHAID and DFHBMSCA are CICS-supplied,
# not app/ sources, so they are absent.
