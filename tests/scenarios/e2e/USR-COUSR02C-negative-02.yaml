# ENTER with no user id on the COUSR02 update screen. ADMIN001 signs on through
# CC00 and COSGN00C routes the type 'A' user to the admin menu COADM01
# [app/cbl/COSGN00C.cbl:221-237]; option '3' makes COADM01C transfer control
# with XCTL to COADM02Y entry 3, COUSR02C [app/cbl/COADM01C.cbl:115-145]
# [app/cpy/COADM02Y.cpy:34-37]. COADM01C passes only the COCOM01Y COMMAREA, so
# CDEMO-CU02-USR-SELECTED is blank: COUSR02C sets CDEMO-PGM-REENTER, clears
# COUSR2AO to LOW-VALUES and sends COUSR02 with its header, empty entry fields
# and a blank message, then returns with TRANSID(CU02)
# [app/cbl/COUSR02C.cbl:84-105,135-138,266-315].
# ENTER with USRIDIN left empty: COUSR02C receives the map and PERFORMs
# PROCESS-ENTER-KEY, whose first test finds USRIDINI equal to SPACES or
# LOW-VALUES. It sets WS-ERR-FLG, moves 'User ID can NOT be empty...' to
# WS-MESSAGE, puts the cursor on USRIDIN and sends the map; with the error flag
# on, READ-USER-SEC-FILE is never performed, so no user is fetched and USRSEC
# is not read [app/cbl/COUSR02C.cbl:106-110,143-172]. UPDATE-USER-INFO tests
# the same literal first on PF3 and PF5 [app/cbl/COUSR02C.cbl:179-185]; it is
# the same inventory item, verified here through ENTER.
# The fields are sent back as received, and COUSR2AO redefines COUSR2AI: the
# empty USRIDIN, FNAME, LNAME and USRTYPE arrive as nulls or spaces and show as
# blanks after the ERASE, which is the refused user id and the absence of any
# fetched data. PASSWD is a dark (DRK) field whose text a 3270 screen read does
# not show [app/bms/COUSR02.bms:130-134], so it is not asserted. No record is
# written, so no file_state is asserted.
# Text values keep their full BMS field width with trailing spaces: ERRMSG is
# the first 78 bytes of the 80-byte WS-MESSAGE. The header comes from
# POPULATE-HEADER-INFO (COTTL01Y titles, CSDAT01Y date and time of the run
# clock), hence the matchers and clock_mode relative. The baseline is derived
# from the source: no TPE region runs in CI.
id: USR-COUSR02C-negative-02
level: e2e
type: negative
description: >-
  ADMIN001 signs on, selects admin menu option 3 'User Update (Security)' and
  presses ENTER on the COUSR02 update screen without a user id. COUSR02C
  refuses the request with 'User ID can NOT be empty...', fetches no user and
  sends COUSR02 again with its CU02 header and the entry fields empty.
inventory_ids:
- INV-USR-035  # COUSR02C message 'User ID can NOT be empty...' (rule)
- INV-USR-003  # COUSR02C program
- INV-MNU-004  # COADM01 map, the admin menu option 3 is entered on
- INV-USR-007  # COUSR02 map, the update screen ENTER is pressed on and sent again
- INV-CFG-025  # CU02 transaction, under which ENTER is processed
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA that makes the ENTER a reentry
- INV-LAY-005  # COTTL01Y copybook, TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y copybook, CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y copybook, copied by COUSR02C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-004  # USR end-to-end baselines derived from the source, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    # COSGN00C reads the sign-on user ADMIN001; this path reads nothing else.
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: ADMIN001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '3'}
    '@map': COADM01
  - aid: ENTER
    fields: {USRIDIN: ''}
    '@map': COUSR02
expected:
  screens:
  - '@map': COADM01
    TRNNAME: CA00
    PGMNAME: COADM01C
    ERRMSG: '                                                                              '
  - '@map': COUSR02
    TRNNAME: CU02
    PGMNAME: COUSR02C
    USRIDIN: '        '
    ERRMSG: '                                                                              '
  - '@map': COUSR02
    TRNNAME: CU02
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COUSR02C
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    USRIDIN: '        '
    FNAME: '                    '
    LNAME: '                    '
    USRTYPE: ' '
    ERRMSG: 'User ID can NOT be empty...                                                   '
  # One ERRMSG value per step: blank on the admin menu and on the first update
  # screen, the empty-user-id message after ENTER.
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'User ID can NOT be empty...                                                   '
