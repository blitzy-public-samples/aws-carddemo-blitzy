# COACTUPC refuses an account update whose SSN 4th & 5th chars are not all
# numeric: 1265-EDIT-US-SSN edits the middle part of the SSN through
# 1245-EDIT-NUM-REQD under the name 'SSN 4th & 5th chars', which finds it
# supplied but not NUMERIC and composes 'SSN 4th & 5th chars must be all
# numeric.' [app/cbl/COACTUPC.cbl:2109-2152,2466-2475].
#
# Steps 1-3 reach the fetched account as ACT-COACTUPC-alternate-04 does:
# USER0001 signs on through CC00, chooses option 2 (Account Update) on COMEN01,
# and enters account 00000000001. 9000-READ-ACCT reads CXACAIX by account id
# (card 9680294154603697, customer 000000001, line 49 of
# app/data/ASCII/cardxref.txt), ACCTDAT and CUSTDAT, keeps the records as the
# old values in the COMMAREA and sets ACUP-SHOW-DETAILS; the screen shows them
# with 'Update account details presented above.', every editable field
# unprotected with its MDT on [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,
# 2955-3000,3441-3561,3608-3884].
# Step 4 types 4X over the SSN 4th & 5th chars (ACTSSN2, shown as '45') and
# presses ENTER.
# - 1100-RECEIVE-MAP moves the received '4X', neither '*' nor SPACES, to the
#   2-byte ACUP-NEW-CUST-SSN-2 [app/cbl/COACTUPC.cbl:830-833,1240-1245].
#   1205-COMPARE-OLD-NEW finds a change (the received SSN '1234X6789' differs
#   from the fetched 123456789 as well), so 1200-EDIT-MAP-INPUTS sets
#   ACUP-CHANGES-NOT-OK and runs the field edits in screen order
#   [app/cbl/COACTUPC.cbl:1460-1470,1681-1770].
# - Account Status, Open Date, Credit Limit, Expiry Date, Cash Credit Limit,
#   Reissue Date, Current Balance and the two cycle limits pass on the
#   repository account [app/cbl/COACTUPC.cbl:1472-1527]. 1265-EDIT-US-SSN
#   passes part 1, '123', through 1245-EDIT-NUM-REQD and the 000, 666 and
#   900-999 test [app/cbl/COACTUPC.cbl:121-123,1529-1531,2439-2464].
#   For part 2 it moves 'SSN 4th & 5th chars' to WS-EDIT-VARIABLE-NAME, the
#   received '4X' to WS-EDIT-ALPHANUM-ONLY and 2 to WS-EDIT-ALPHANUM-LENGTH
#   [app/cbl/COACTUPC.cbl:2469-2473]. 1245-EDIT-NUM-REQD finds the two bytes
#   neither LOW-VALUES nor SPACES nor empty once trimmed, but not NUMERIC, so
#   it sets INPUT-ERROR and FLG-ALPHNANUM-NOT-OK and, WS-RETURN-MSG being
#   still blank [app/cbl/COACTUPC.cbl:876], STRINGs the trimmed field name and
#   ' must be all numeric.' into WS-RETURN-MSG [app/cbl/COACTUPC.cbl:
#   2113-2152]. WS-EDIT-US-SSN-PART2-FLGS becomes FLG-EDIT-US-SSN-PART2-NOT-OK
#   [app/cbl/COACTUPC.cbl:68-71,139-142,2474-2475]. Part 3, '6789', passes
#   [app/cbl/COACTUPC.cbl:2481-2487].
# - Every later edit passes on the invented customer below; they only set
#   their flags, since WS-RETURN-MSG is no longer blank
#   [app/cbl/COACTUPC.cbl:1533-1676]. INPUT-ERROR keeps ACUP-CHANGES-NOT-OK,
#   and 2000-DECIDE-ACTION continues on it, so 9600-WRITE-PROCESSING, the only
#   READ UPDATE and REWRITE path, does not run [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values, every amount re-edited
#   through +ZZZ,ZZZ,ZZZ.99 because each is valid, and the three SSN parts as
#   received, so ACTSSN2 shows '4X'; 3250 sets PROMPT-FOR-CHANGES and moves the
#   message to ERRMSG; 3300 keeps the fields editable, puts the cursor on
#   ACTSSN2 and marks it red through CSSETATY without the '*' of a blank field;
#   3390 makes F12=Cancel bright because changes were made, while F5=Save stays
#   dark [app/cbl/COACTUPC.cbl:2870-2951,2955-2983,3082-3084,3303-3307,
#   3566-3581] [app/cpy/CSSETATY.cpy:18-27].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - The message is TRIM('SSN 4th & 5th chars') followed by ' must be all
#   numeric.', 40 characters of the 75-byte WS-RETURN-MSG, shown in the
#   78-byte ERRMSG with trailing spaces. INFOMSG is the 40-byte WS-INFO-MSG in
#   the 45-byte field. Fields are compared at their full BMS length, trailing
#   spaces kept.
# - The tpe adapter enters a field with EraseEOF before typing; '4X' fills
#   both bytes of the UNPROT (not NUM) field ACTSSN2 [app/bms/COACTUP.bms:
#   272-276], and the screen shows it so.
# - FKEY05 and FKEY12 keep their INITIAL text; a dark (ASKIP,DRK) field is
#   captured as blanks. Colour and cursor position are not in the s3270 text
#   capture and are not asserted.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, so the SSN 4th & 5th chars are the only field refused: the repository
# record has FICO 274, below 300, and zip 12546, which is not a North Carolina
# zip [app/cbl/COACTUPC.cbl:2514-2558]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-066
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001, whose customer's SSN is 123-45-6789, types 4X over the
  SSN 4th & 5th chars and presses ENTER. The part is not all numeric, so
  COACTUPC refuses the change: it shows the received values again, editable,
  with 'SSN 4th & 5th chars must be all numeric.' in the message line, the SSN
  part as typed, the change prompt 'Update account details presented above.'
  and F12=Cancel made visible. Nothing is saved: ACCTDATA and CUSTDATA still
  hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-124  # COACTUPC SSN 4th & 5th chars: all numeric (1245-EDIT-NUM-REQD)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute set on ACTSSN2
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the date edits the dates pass
- INV-LAY-014  # CSUTLDWY: the date-edit working storage
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix COACTUPC drops FUNCTION TRIM from the field name in the composed
# messages of 1245-EDIT-NUM-REQD and its TRIM-length blank check, so on UniKix
# the message differs; the app/ behaviour is pinned.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
