# ============================================================================
# Mainframe-to-Cloud Migration: COBOL/CICS/VSAM to Java 21 Spring Boot
# This configuration replaces mainframe infrastructure with cloud-native equivalents:
# - PostgreSQL replaces VSAM KSDS file storage
# - Redis Session replaces CICS COMMAREA pseudo-conversational state
# - JWT Security replaces RACF authentication
# - Spring Batch replaces JCL batch processing
# - Flyway migrations replace VSAM catalog management
# ============================================================================

# ============================================================================
# APPLICATION IDENTIFICATION
# ============================================================================
spring.application.name=carddemo-service
server.port=8080

# ============================================================================
# DATABASE CONFIGURATION - PostgreSQL (Replaces VSAM KSDS Files)
# ============================================================================
# Replaces VSAM files: CUSTDAT, ACCTDAT, CARDDAT, TRANSACT, USRSEC
# Referenced from: app/cpy/CVCUS01Y.cpy, CVACT01Y.cpy, CVACT02Y.cpy, CVTRA05Y.cpy, CSUSR01Y.cpy
# VSAM catalog reference: app/catlg/LISTCAT.txt

# DataSource Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carddemo}
spring.datasource.username=${DB_USERNAME:carddemo}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Optimized for transaction throughput)
# Supports 150 concurrent users minimum with 10,000 TPS requirement
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=CardDemoHikariPool
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.connection-test-query=SELECT 1

# ============================================================================
# JPA/HIBERNATE CONFIGURATION (Replaces VSAM File I/O)
# ============================================================================
# Hibernate ORM provides object-relational mapping replacing COBOL file operations
# READ, WRITE, REWRITE, DELETE operations converted to JPA repository methods

# Database Platform
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database=POSTGRESQL

# Schema Management (Flyway controls schema, not Hibernate)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false

# SQL Logging (disabled for production performance)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Performance Optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Naming Strategy (COBOL field names to database columns)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# Enable second-level cache for reference data
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory
spring.jpa.properties.hibernate.javax.cache.provider=org.ehcache.jsr107.EhcacheCachingProvider

# Statistics for monitoring
spring.jpa.properties.hibernate.generate_statistics=false

# ============================================================================
# REDIS SESSION CONFIGURATION (Replaces CICS COMMAREA)
# ============================================================================
# Replaces CICS pseudo-conversational state management from COCOM01Y.cpy
# CARDDEMO-COMMAREA structure: user session, navigation context, customer/account/card info

# Session Store Type
spring.session.store-type=redis

# Redis Connection
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.database=0
spring.redis.timeout=2000ms

# Redis Connection Pool (Lettuce)
spring.redis.lettuce.pool.max-active=20
spring.redis.lettuce.pool.max-idle=10
spring.redis.lettuce.pool.min-idle=5
spring.redis.lettuce.pool.max-wait=-1ms

# Session Timeout (30 minutes - matching typical CICS pseudo-conversational timeout)
spring.session.timeout=1800s
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=carddemo:session

# ============================================================================
# SPRING SECURITY - JWT CONFIGURATION (Replaces RACF)
# ============================================================================
# Replaces RACF security controls from CSUSR01Y.cpy
# User authentication: SEC-USR-ID, SEC-USR-PWD validation
# Authorization: SEC-USR-TYPE (Admin='A', User='U')

# JWT Token Configuration
jwt.secret=${JWT_SECRET:defaultSecretKeyForDevelopmentOnlyPleaseChangeInProduction}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.header=Authorization
jwt.prefix=Bearer${SPACE}

# Security Settings
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin}

# ============================================================================
# SPRING BATCH CONFIGURATION (Replaces JCL Batch Processing)
# ============================================================================
# Replaces 10 JCL batch jobs:
# - CBACT01C.cbl (Account data load)
# - CBACT04C.cbl (Interest calculation)
# - CBTRN02C.cbl (Daily transaction processing)
# - CBSTM03A.cbl/CBSTM03B.cbl (Statement generation)

# Batch Job Repository
spring.batch.jdbc.initialize-schema=always
spring.batch.jdbc.table-prefix=BATCH_

# Job Execution Control (disabled by default, enabled per profile)
spring.batch.job.enabled=false

# ============================================================================
# FLYWAY DATABASE MIGRATION (Replaces VSAM Catalog Management)
# ============================================================================
# Flyway provides version-controlled schema management
# Replaces VSAM catalog definitions from LISTCAT.txt

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.placeholders.db_schema=public

# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
# HTTP Server Settings
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# Servlet Configuration
server.servlet.context-path=/
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.name=CARDDEMO_SESSION

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ============================================================================
# JACKSON JSON CONFIGURATION (REST API Serialization)
# ============================================================================
# JSON serialization/deserialization replacing BMS screen map data structures
# Handles conversion between COBOL COMMAREA and REST API JSON payloads

# Date/Time Serialization (ISO-8601 format)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ

# Serialization Settings
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.indent-output=false
spring.jackson.default-property-inclusion=non_null

# Deserialization Settings
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.accept-empty-string-as-null-object=true

# Property Naming Strategy
spring.jackson.property-naming-strategy=SNAKE_CASE

# BigDecimal Serialization (Financial precision - COBOL COMP-3 equivalent)
spring.jackson.serialization.write-bigdecimal-as-plain=true

# ============================================================================
# ACTUATOR CONFIGURATION (Health Checks and Monitoring)
# ============================================================================
# Kubernetes liveness and readiness probes

# Actuator Endpoints
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized

# Health Indicators
management.health.redis.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true

# Metrics
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Info Endpoint
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
# Structured logging for cloud-native observability

# Root Logging Level
logging.level.root=INFO

# Application Logging
logging.level.com.carddemo=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.batch=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Console Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# File Logging (disabled by default, can be enabled per profile)
logging.file.name=${LOG_FILE_PATH:/tmp/carddemo-service.log}
logging.file.max-size=10MB
logging.file.max-history=30

# ============================================================================
# TRANSACTION MANAGEMENT
# ============================================================================
# Ensures ACID properties matching CICS transaction boundaries

spring.transaction.default-timeout=30s
spring.transaction.rollback-on-commit-failure=true

# ============================================================================
# INTERNATIONALIZATION
# ============================================================================
# Message source configuration for error messages and UI text

spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600s

# ============================================================================
# PROFILE-SPECIFIC OVERRIDES
# ============================================================================
# This base configuration is extended by:
# - application-dev.properties (development environment)
# - application-test.properties (testing environment)
# - application-prod.properties (production environment)
#
# Activate profiles using: spring.profiles.active=dev,test,prod
# ============================================================================
