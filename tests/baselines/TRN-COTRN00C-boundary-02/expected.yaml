# Derived baseline of scenario TRN-COTRN00C-boundary-02: with 11 transactions
# in TRANSACT, USER0001 signs on, opens the transaction list from the main menu
# (option 6) and pages forward once. Authored from the source at commit
# 93ebec71ff7b59a68cedd7c501afe496a8eaa68d, never captured (capture_platform:
# derived): app/cbl/COTRN00C.cbl:95-141,257-328,381-445,567-700 with
# app/bms/COTRN00.bms, app/cpy/COTTL01Y.cpy and app/cpy/CSDAT01Y.cpy (the browse,
# the paging, the row formatting and the screen header), app/cbl/COSGN00C.cbl
# and app/cbl/COMEN01C.cbl with app/cpy/COMEN02Y.cpy (the type-U route and
# option 6). Open until a UniKix run is imported: GAP-INF-007 (derived TRN
# end-to-end baselines) and GAP-INF-012 (online-only copybooks).
# One screen per step, the one shown after the step's AID: COMEN01 after
# sign-on, COTRN00 page 1 after option 6, COTRN00 page 2 after PF8.
# Page 1 carries no message: the look-ahead READNEXT finds id 11
# (COTRN00C.cbl:305-313). Page 2 holds id 11 alone, rows 2-10 blanked by
# INITIALIZE-TRAN-DATA (COTRN00C.cbl:289-293,450-505).
# Step 3 pins the final send (COTRN00C.cbl:326), not the interim ENDFILE one (:645) showing '00000001'.
# Values are full BMS field width with their trailing spaces; CURDATE and
# CURTIME are run-clock matchers, because the region clock cannot be fixed.
