# CBACT04C on the repository fixtures, where no account names its disclosure
# group: acctdata.txt carries the group id ('A000000000') in ACCT-ADDR-ZIP
# (columns 103-112) and leaves ACCT-GROUP-ID (columns 113-122) blank in all 50
# accounts [app/cpy/CVACT01Y.cpy:15-16]. Each of the 50 TCATBALF records
# (account 00000000001-00000000050, type 01, category 0001, balance 0.00) is
# displayed, then looked up in DISCGRP under group '          ', type 01,
# category 0001. The key is absent (status 23), so 1200-GET-INTEREST-RATE
# displays the two fallback lines and 1200-A-GET-DEFAULT-INT-RATE reads
# DEFAULT/01/0001, rate 15.00 [app/cbl/CBACT04C.cbl:210-217,415-460]. The data
# is pinned as it stands, never corrected (GAP-DEF-005).
#
# The pair appears 50 times here, once per TCATBALF record. The 100 occurrences
# that GAP-DEF-005 and the job-chain proof count belong to INTCALC run after
# POSTTRAN, whose 50 newly created TCATBAL records double the lookups.
#
# The rate is not zero, so every record computes interest and writes a SYSTRAN
# record; 0.00 * 15.00 / 1200 is 0.00, so every amount is 0.00
# [app/cbl/CBACT04C.cbl:214-217,462-515]. TRAN-ID is the PARM date followed by
# the 6-digit counter, TRAN-CAT-CD receives '05' as 0005, the card comes from
# the CARDXREF alternate-key read by account, and both timestamps come from the
# fixed clock. TRAN-DESC is never initialized, so the 76 bytes after
# 'Int. for a/c <account>' hold x'00' on gnucobol-batch (written "\0" below;
# GAP-STB-011).
#
# 1050-UPDATE-ACCOUNT rewrites accounts 1-49 when the next account's first
# record arrives; account 00000000050 is never rewritten because the end-of-file
# ELSE is unreachable (GAP-DEF-003) [app/cbl/CBACT04C.cbl:188-222,350-370]. With
# zero interest and cycle fields already 0.00 in every repository account, the
# rewritten records equal the originals, so ACCTDATA ends byte-identical to the
# fixture. The skipped rewrite of the last account becomes visible only where
# its interest is not zero, in the synthetic-data cases.
id: FIN-CBACT04C-alternate-02
level: unit
type: alternate
description: >-
  CBACT04C with PARM 2022071800 on the repository TCATBALF, CARDXREF, ACCTDATA
  and DISCGRP: every disclosure group lookup misses because ACCT-GROUP-ID is
  blank, so each of the 50 category balance records is followed by 'DISCLOSURE
  GROUP RECORD MISSING' and 'TRY WITH DEFAULT GROUP CODE' and takes the DEFAULT
  rate of 15.00. Fifty interest transactions of 0.00 are written to SYSTRAN,
  2022071800000001 to 2022071800000050, the account file keeps its content, and
  the return code is 0.
inventory_ids:
- INV-FIN-006  # CBACT04C DEFAULT disclosure group fallback (rule)
- INV-FIN-001  # CBACT04C program
- INV-FIN-003  # CBACT04C monthly interest (calculation)
- INV-FIN-004  # CBACT04C account update (calculation)
- INV-FIN-008  # CBACT04C interest transaction record (interface)
- INV-LAY-021  # CVTRA01Y copybook
- INV-LAY-022  # CVTRA02Y copybook
- INV-LAY-025  # CVTRA05Y copybook
- INV-LAY-016  # CVACT01Y copybook
- INV-LAY-018  # CVACT03Y copybook
- INV-DTA-007  # tcatbal.txt, the TCATBALF fixture source
- INV-DTA-018  # EBCDIC TCATBALF data file, its cross-check counterpart
- INV-DTA-003  # cardxref.txt, the CARDXREF fixture source
- INV-DTA-013  # EBCDIC CARDXREF data file, its cross-check counterpart
- INV-DTA-001  # acctdata.txt, the ACCTDATA fixture source
- INV-DTA-011  # EBCDIC ACCTDATA data file, its cross-check counterpart
- INV-DTA-006  # discgrp.txt, the DISCGRP fixture source
- INV-DTA-017  # EBCDIC DISCGRP data file, its cross-check counterpart
tags:
- suspected-defect
gap_ids:
- GAP-DEF-005  # the group id sits in ACCT-ADDR-ZIP; ACCT-GROUP-ID is blank
- GAP-DEF-003  # the last account is never rewritten
- GAP-STB-004  # PARMDRV in place of the z/OS EXEC PARM linkage
- GAP-STB-010  # Berkeley DB indexed files in place of the VSAM KSDS
- GAP-STB-011  # GnuCOBOL compile and runtime options; the x'00' description fill
