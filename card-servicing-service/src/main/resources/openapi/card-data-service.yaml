openapi: 3.1.0
info:
  title: Card Data Service stub contract
  version: 1.0.0
  description: >-
    Stub-phase contract for the gRPC service cardservicing.carddata.v1.CardDataService,
    described here as HTTP/JSON. The stub is answered from mock-data providers seeded by the
    in-repo fixture loader; swapping it for the real Card Data service changes only the target
    address and the credential source. The caller's bearer token is forwarded in the
    Authorization header and the service credential travels as x-api-key. Stubs do not
    re-authorize, so no operation returns 403. Amounts are strings with two decimal places,
    for example 1234.56. Sources: Data Layouts · CVACT01Y, Data Layouts · CVACT03Y and
    Data Layouts · CVTRA01Y.
  contact:
    name: Card Servicing workstream
  license:
    name: Apache 2.0
    identifier: Apache-2.0
servers:
  - url: http://localhost:8080
    description: Local stub-phase address
tags:
  - name: CardData
    description: Account records, card cross-references and category balances served by the Card Data stub.
security:
  - bearerAuth: []
    apiKey: []
paths:
  /v1/card-data/accounts/{accountId}:
    get:
      operationId: GetAccount
      tags: [CardData]
      summary: Get one account record
      description: >-
        HTTP/JSON form of the gRPC method cardservicing.carddata.v1.CardDataService/GetAccount.
        Returns the one account record whose identifier is accountId (Data Layouts · CVACT01Y).
        The response holds a single record, so no ordering applies. Returns 404 when no account
        has this identifier; groupId is omitted when the source value is blank.
      parameters:
        - name: accountId
          in: path
          required: true
          description: >-
            The account identifier, 11 digits (Data Layouts · CVACT01Y · ACCT-ID). The all-zero
            value 00000000000 returns 400 with the message "Account number must be a non zero
            11 digit number" (Use Cases · COACTVWC).
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          examples:
            fixtureAccount:
              value: '00000000001'
      responses:
        '200':
          description: The account record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountResponse'
              examples:
                fixtureAccount:
                  value:
                    account:
                      accountId: '00000000001'
                      activeStatus: 'Y'
                      currentBalance: '194.00'
                      creditLimit: '2020.00'
                      cashCreditLimit: '1020.00'
                      openDate: '2014-11-20'
                      expirationDate: '2025-05-20'
                      reissueDate: '2025-05-20'
                      currentCycleCredit: '0.00'
                      currentCycleDebit: '0.00'
                      addressZip: 'A000000000'
        '400':
          description: INVALID_ARGUMENT - accountId is malformed or all zeros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                invalidAccountId:
                  value:
                    code: 'INVALID_ARGUMENT'
                    message: 'Account number must be a non zero 11 digit number'
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details:
                      - field: 'accountId'
                        description: 'must be 11 digits and not all zeros'
        '401':
          description: UNAUTHENTICATED - the forwarded bearer token is missing, invalid or expired; the stub does not re-authorize.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                unauthenticated:
                  value:
                    code: 'UNAUTHENTICATED'
                    message: 'Token missing, invalid or expired'
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details: []
        '404':
          description: NOT_FOUND - no account has this identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                accountNotFound:
                  value:
                    code: 'NOT_FOUND'
                    message: 'Account not found'
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details: []
        '503':
          description: UNAVAILABLE - the service is unavailable after retries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                unavailable:
                  value:
                    code: 'UNAVAILABLE'
                    message: 'Upstream unavailable'
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details: []
        '504':
          description: DEADLINE_EXCEEDED - the request deadline was reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                deadlineExceeded:
                  value:
                    code: 'DEADLINE_EXCEEDED'
                    message: 'Request deadline exceeded'
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details: []
  /v1/card-data/accounts/{accountId}/card-cross-references:
    get:
      operationId: GetCardCrossReference
      tags: [CardData]
      summary: List the card cross-references of one account
      description: >-
        HTTP/JSON form of the gRPC method
        cardservicing.carddata.v1.CardDataService/GetCardCrossReference. Returns every card
        cross-reference record of the account (Data Layouts · CVACT03Y), ordered by cardNumber
        ascending. Returns 404 when the account is unknown.
      parameters:
        - name: accountId
          in: path
          required: true
          description: >-
            The account identifier, 11 digits (Data Layouts · CVACT01Y · ACCT-ID). The all-zero
            value 00000000000 returns 400 with the message "Account number must be a non zero
            11 digit number" (Use Cases · COACTVWC).
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          examples:
            fixtureAccount:
              value: '00000000001'
      responses:
        '200':
          description: The account's card cross-reference records, ordered by cardNumber ascending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCardCrossReferenceResponse'
              examples:
                fixtureAccount:
                  value:
                    cardCrossReferences:
                      - cardNumber: '9680294154603697'
                        customerId: '000000001'
                        accountId: '00000000001'
        '400':
          description: INVALID_ARGUMENT - accountId is malformed or all zeros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                invalidAccountId:
                  value:
                    code: 'INVALID_ARGUMENT'
                    message: 'Account number must be a non zero 11 digit number'
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details:
                      - field: 'accountId'
                        description: 'must be 11 digits and not all zeros'
        '401':
          description: UNAUTHENTICATED - the forwarded bearer token is missing, invalid or expired; the stub does not re-authorize.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                unauthenticated:
                  value:
                    code: 'UNAUTHENTICATED'
                    message: 'Token missing, invalid or expired'
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details: []
        '404':
          description: NOT_FOUND - the account is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                accountNotFound:
                  value:
                    code: 'NOT_FOUND'
                    message: 'Account not found'
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details: []
        '503':
          description: UNAVAILABLE - the service is unavailable after retries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                unavailable:
                  value:
                    code: 'UNAVAILABLE'
                    message: 'Upstream unavailable'
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details: []
        '504':
          description: DEADLINE_EXCEEDED - the request deadline was reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                deadlineExceeded:
                  value:
                    code: 'DEADLINE_EXCEEDED'
                    message: 'Request deadline exceeded'
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details: []
  /v1/card-data/accounts/{accountId}/category-balances:
    get:
      operationId: ListCategoryBalances
      tags: [CardData]
      summary: List the category balances of one account
      description: >-
        HTTP/JSON form of the gRPC method
        cardservicing.carddata.v1.CardDataService/ListCategoryBalances. Returns the account's
        category balances (Data Layouts · CVTRA01Y), ordered by (typeCode, categoryCode)
        ascending. An existing account with no balances returns 200 with an empty
        categoryBalances array. Returns 404 when the account is unknown.
      parameters:
        - name: accountId
          in: path
          required: true
          description: >-
            The account identifier, 11 digits (Data Layouts · CVACT01Y · ACCT-ID). The all-zero
            value 00000000000 returns 400 with the message "Account number must be a non zero
            11 digit number" (Use Cases · COACTVWC).
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          examples:
            fixtureAccount:
              value: '00000000001'
      responses:
        '200':
          description: The account's category balances, ordered by (typeCode, categoryCode) ascending; empty when the account has none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCategoryBalancesResponse'
              examples:
                fixtureAccount:
                  value:
                    categoryBalances:
                      - accountId: '00000000001'
                        typeCode: '01'
                        categoryCode: '0001'
                        balance: '0.00'
        '400':
          description: INVALID_ARGUMENT - accountId is malformed or all zeros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                invalidAccountId:
                  value:
                    code: 'INVALID_ARGUMENT'
                    message: 'Account number must be a non zero 11 digit number'
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details:
                      - field: 'accountId'
                        description: 'must be 11 digits and not all zeros'
        '401':
          description: UNAUTHENTICATED - the forwarded bearer token is missing, invalid or expired; the stub does not re-authorize.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                unauthenticated:
                  value:
                    code: 'UNAUTHENTICATED'
                    message: 'Token missing, invalid or expired'
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details: []
        '404':
          description: NOT_FOUND - the account is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                accountNotFound:
                  value:
                    code: 'NOT_FOUND'
                    message: 'Account not found'
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details: []
        '503':
          description: UNAVAILABLE - the service is unavailable after retries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                unavailable:
                  value:
                    code: 'UNAVAILABLE'
                    message: 'Upstream unavailable'
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details: []
        '504':
          description: DEADLINE_EXCEEDED - the request deadline was reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObject'
              examples:
                deadlineExceeded:
                  value:
                    code: 'DEADLINE_EXCEEDED'
                    message: 'Request deadline exceeded'
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    details: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The caller's bearer token, forwarded unchanged by the Card Servicing service; the stub does not re-authorize.
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: The Card Servicing service credential; the stub ignores its value.
  schemas:
    GetAccountResponse:
      type: object
      description: Carries the requested account record.
      required: [account]
      additionalProperties: false
      properties:
        account:
          $ref: '#/components/schemas/Account'
    Account:
      type: object
      description: One account record (Data Layouts · CVACT01Y).
      required:
        - accountId
        - activeStatus
        - currentBalance
        - creditLimit
        - cashCreditLimit
        - openDate
        - expirationDate
        - reissueDate
        - currentCycleCredit
        - currentCycleDebit
        - addressZip
      additionalProperties: false
      properties:
        accountId:
          type: string
          pattern: '^[0-9]{11}$'
          description: The account identifier, 11 digits (Data Layouts · CVACT01Y · ACCT-ID).
        activeStatus:
          type: string
          maxLength: 1
          description: The account's active-status flag, for example Y (Data Layouts · CVACT01Y · ACCT-ACTIVE-STATUS).
        currentBalance:
          type: string
          pattern: '^-?[0-9]{1,10}\.[0-9]{2}$'
          description: The current balance as a scale-2 decimal string such as 1234.56, at most 10 integer digits and 2 decimals (Data Layouts · CVACT01Y · ACCT-CURR-BAL S9(10)V99).
        creditLimit:
          type: string
          pattern: '^-?[0-9]{1,10}\.[0-9]{2}$'
          description: The credit limit as a scale-2 decimal string, at most 10 integer digits and 2 decimals (Data Layouts · CVACT01Y · ACCT-CREDIT-LIMIT S9(10)V99).
        cashCreditLimit:
          type: string
          pattern: '^-?[0-9]{1,10}\.[0-9]{2}$'
          description: The cash credit limit as a scale-2 decimal string, at most 10 integer digits and 2 decimals (Data Layouts · CVACT01Y · ACCT-CASH-CREDIT-LIMIT S9(10)V99).
        openDate:
          type: string
          format: date
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          description: The date the account was opened, as YYYY-MM-DD (Data Layouts · CVACT01Y · ACCT-OPEN-DATE).
        expirationDate:
          type: string
          format: date
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          description: The account expiration date, as YYYY-MM-DD; the layout spells the field ACCT-EXPIRAION-DATE (Data Layouts · CVACT01Y · ACCT-EXPIRAION-DATE).
        reissueDate:
          type: string
          format: date
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          description: The account reissue date, as YYYY-MM-DD (Data Layouts · CVACT01Y · ACCT-REISSUE-DATE).
        currentCycleCredit:
          type: string
          pattern: '^-?[0-9]{1,10}\.[0-9]{2}$'
          description: The credits posted in the current cycle as a scale-2 decimal string, at most 10 integer digits and 2 decimals (Data Layouts · CVACT01Y · ACCT-CURR-CYC-CREDIT S9(10)V99).
        currentCycleDebit:
          type: string
          pattern: '^-?[0-9]{1,10}\.[0-9]{2}$'
          description: The debits posted in the current cycle as a scale-2 decimal string, at most 10 integer digits and 2 decimals (Data Layouts · CVACT01Y · ACCT-CURR-CYC-DEBIT S9(10)V99).
        addressZip:
          type: string
          maxLength: 10
          description: The account address zip code, loaded at its copybook offset, so sample rows carry A000000000 (Data Layouts · CVACT01Y · ACCT-ADDR-ZIP).
        groupId:
          type: string
          maxLength: 10
          description: The account group identifier; omitted when the source value is blank (Data Layouts · CVACT01Y · ACCT-GROUP-ID).
    GetCardCrossReferenceResponse:
      type: object
      description: Carries the account's card cross-reference records.
      required: [cardCrossReferences]
      additionalProperties: false
      properties:
        cardCrossReferences:
          type: array
          description: The account's card cross-reference records, ordered by cardNumber ascending; always present.
          items:
            $ref: '#/components/schemas/CardCrossReference'
    CardCrossReference:
      type: object
      description: One card-to-account cross-reference record (Data Layouts · CVACT03Y).
      required: [cardNumber, customerId, accountId]
      additionalProperties: false
      properties:
        cardNumber:
          type: string
          maxLength: 16
          description: The card number, at most 16 characters (Data Layouts · CVACT03Y · XREF-CARD-NUM).
        customerId:
          type: string
          pattern: '^[0-9]{9}$'
          description: The customer identifier, 9 digits (Data Layouts · CVACT03Y · XREF-CUST-ID).
        accountId:
          type: string
          pattern: '^[0-9]{11}$'
          description: The account the card belongs to, 11 digits (Data Layouts · CVACT03Y · XREF-ACCT-ID).
    ListCategoryBalancesResponse:
      type: object
      description: Carries the account's category balances.
      required: [categoryBalances]
      additionalProperties: false
      properties:
        categoryBalances:
          type: array
          description: The account's category balances, ordered by (typeCode, categoryCode) ascending; always present and empty when the account has none.
          items:
            $ref: '#/components/schemas/CategoryBalance'
    CategoryBalance:
      type: object
      description: One category balance (Data Layouts · CVTRA01Y).
      required: [accountId, typeCode, categoryCode, balance]
      additionalProperties: false
      properties:
        accountId:
          type: string
          pattern: '^[0-9]{11}$'
          description: The account the balance belongs to, 11 digits (Data Layouts · CVTRA01Y · TRANCAT-ACCT-ID).
        typeCode:
          type: string
          pattern: '^[\s\S]{2}$'
          description: The transaction type code, exactly 2 characters of any kind, because PIC X places no restriction on its characters (Data Layouts · CVTRA01Y · TRANCAT-TYPE-CD).
        categoryCode:
          type: string
          pattern: '^[0-9]{4}$'
          description: The transaction category code, 4 digits (Data Layouts · CVTRA01Y · TRANCAT-CD).
        balance:
          type: string
          pattern: '^-?[0-9]{1,9}\.[0-9]{2}$'
          description: The category balance as a scale-2 decimal string such as 1234.56, at most 9 integer digits and 2 decimals (Data Layouts · CVTRA01Y · TRAN-CAT-BAL S9(09)V99).
    ErrorObject:
      type: object
      description: Standard error object returned with every non-2xx status; gRPC carries the same message in google.rpc.Status details.
      required: [code, message, traceId, details]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Canonical status name - INVALID_ARGUMENT (400), UNAUTHENTICATED (401), PERMISSION_DENIED (403), NOT_FOUND (404), UNAVAILABLE (503) or DEADLINE_EXCEEDED (504).
        message:
          type: string
          description: Human-readable explanation of the error.
        traceId:
          type: string
          description: Identifier of the request that produced the error, used to correlate log lines.
        details:
          type: array
          description: Field-level violations; empty when the error concerns no single field.
          items:
            type: object
            description: One field-level violation.
            required: [field, description]
            additionalProperties: false
            properties:
              field:
                type: string
                description: Name of the request field or parameter that failed, for example accountId or pageToken.
              description:
                type: string
                description: The rule the field must satisfy.
