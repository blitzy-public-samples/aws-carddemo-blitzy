# Kubernetes Secret for CardDemo Application
# ==============================================
# This Secret resource stores sensitive credentials for the CardDemo Spring Boot application.
# 
# SECURITY WARNING: 
# - The values below are DEVELOPMENT DEFAULTS and must be changed for production use.
# - Never commit production secrets directly to version control.
# - Use GitOps secret management tools in production:
#   * Sealed Secrets (bitnami-labs/sealed-secrets)
#   * External Secrets Operator (external-secrets.io)
#   * HashiCorp Vault integration
#   * Cloud provider secret managers (AWS Secrets Manager, Azure Key Vault, GCP Secret Manager)
#
# This replaces mainframe RACF password datasets and CICS security configuration
# with cloud-native Kubernetes secret management.
#
# Usage:
# - kubectl apply -f secret.yaml
# - Referenced by Deployment as environment variables via envFrom.secretRef
#
# Base64 Encoding:
# To generate base64-encoded values:
#   echo -n 'your-secret-value' | base64
# To decode base64 values:
#   echo 'base64-encoded-value' | base64 -d

apiVersion: v1
kind: Secret
metadata:
  name: carddemo-secrets
  namespace: carddemo
  labels:
    app: carddemo
    component: security
    environment: development
  annotations:
    description: "Sensitive credentials for CardDemo application - PostgreSQL, Redis, JWT"
    warning: "CHANGE ALL VALUES BEFORE PRODUCTION DEPLOYMENT"
    migration-note: "Replaces mainframe RACF password management with Kubernetes secrets"
type: Opaque
data:
  # PostgreSQL Database Credentials
  # ================================
  # Database username for CardDemo application
  # Default value: 'carddemo' (base64 encoded)
  # Production: Change to appropriate database user with minimal required privileges
  DB_USERNAME: Y2FyZGRlbW8=
  
  # Database password for PostgreSQL authentication
  # Default value: 'changeme123' (base64 encoded)
  # Production: Generate strong password with minimum 16 characters, mixed case, numbers, symbols
  # Example generation: openssl rand -base64 32
  DB_PASSWORD: Y2hhbmdlbWUxMjM=
  
  # Redis Password (Session Store)
  # ==============================
  # Redis authentication password for session management
  # Default value: '' (empty string - no authentication)
  # Production: Enable Redis authentication and set strong password
  # If Redis AUTH is not enabled, leave empty
  REDIS_PASSWORD: ""
  
  # JWT Secret Key
  # ==============
  # Secret key for signing and validating JWT authentication tokens
  # Default value: 'your-256-bit-secret-key-change-this-in-production' (base64 encoded)
  # Production: Generate cryptographically secure 256-bit (32-byte) random key
  # Example generation: openssl rand -base64 32
  # CRITICAL: Changing this key invalidates all existing user sessions
  JWT_SECRET: eW91ci0yNTYtYml0LXNlY3JldC1rZXktY2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbg==

---
# Additional Notes for Production Deployment
# ===========================================
#
# 1. SECRET ROTATION POLICY:
#    - Database passwords: Rotate every 90 days minimum
#    - JWT secret: Rotate carefully as it invalidates all active sessions
#    - Redis password: Rotate every 90 days minimum
#
# 2. ACCESS CONTROL:
#    - Apply Kubernetes RBAC to restrict secret access
#    - Only ServiceAccounts used by carddemo-app should have get/list permissions
#    - Example RBAC:
#      apiVersion: rbac.authorization.k8s.io/v1
#      kind: Role
#      metadata:
#        name: carddemo-secret-reader
#        namespace: carddemo
#      rules:
#      - apiGroups: [""]
#        resources: ["secrets"]
#        resourceNames: ["carddemo-secrets"]
#        verbs: ["get"]
#
# 3. ENCRYPTION AT REST:
#    - Ensure Kubernetes cluster has encryption at rest enabled for etcd
#    - Use cloud provider KMS integration (AWS KMS, Azure Key Vault, GCP KMS)
#
# 4. AUDIT LOGGING:
#    - Enable Kubernetes audit logs for secret access
#    - Monitor secret read operations in production
#
# 5. MIGRATION FROM MAINFRAME:
#    - RACF user IDs → DB_USERNAME (map to PostgreSQL user)
#    - RACF passwords → DB_PASSWORD (re-encrypt with stronger algorithms)
#    - CICS security tokens → JWT_SECRET (new JWT-based authentication)
#
# 6. EXAMPLE PRODUCTION SECRET GENERATION:
