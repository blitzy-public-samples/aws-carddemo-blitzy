# Derived from source (capture_platform: derived), never observed: GAP-INF-004
# (derived USR end-to-end baselines) and GAP-INF-012 (online-only copybooks).
# ADMIN001 (type A [app/jcl/DUSRSECJ.jcl:35]) signs on and COSGN00C routes it
# to the admin menu COADM01 [app/cbl/COSGN00C.cbl:221-237]; option 2 makes
# COADM01C XCTL to COUSR01C with context 0 [app/cbl/COADM01C.cbl:136-145]
# [app/cpy/COADM02Y.cpy:29-32], which sends the cleared COUSR01 map with a
# blank ERRMSG [app/cbl/COUSR01C.cbl:71-87,184-196]. ENTER with both names
# given and the user id blank re-sends COUSR01 with 'User ID can NOT be
# empty...' and the received names and user type, and skips the USRSEC write,
# so USRSEC keeps its 10 fixture users [app/cbl/COUSR01C.cbl:115-160].
# Fields are at their full BMS width with trailing spaces kept (ERRMSG 78,
# TITLE01/TITLE02 40, FNAME/LNAME 20, USERID 8), because screens compare
# exactly. CURDATE and CURTIME come from the region clock, so they are
# matchers. PASSWD is a dark field and is not asserted. SEC-USR-PWD holds the
# public demo password of the fixture users [app/jcl/DUSRSECJ.jcl:35-44], kept
# verbatim because the unchanged USRSEC records are the asserted outcome; it is
# demo data, not a credential.
file_state:
  USRSEC:
    records:
    - SEC-USR-FILLER: '                       '
      SEC-USR-FNAME: 'MARGARET            '
      SEC-USR-ID: ADMIN001
      SEC-USR-LNAME: 'GOLD                '
      SEC-USR-PWD: PASSWORD
      SEC-USR-TYPE: A
    - SEC-USR-FILLER: '                       '
      SEC-USR-FNAME: 'RUSSELL             '
      SEC-USR-ID: ADMIN002
      SEC-USR-LNAME: 'RUSSELL             '
      SEC-USR-PWD: PASSWORD
