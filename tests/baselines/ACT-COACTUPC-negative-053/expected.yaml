# Derived baseline of scenario ACT-COACTUPC-negative-053 (capture_platform:
# derived), authored from the app/ source and never observed: no TPE region
# runs in CI. Open until a UniKix run of the app/ build is imported:
# GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012 (online-only
# copybooks such as CSUTLDPY and CSUTLDWY).
# Steps 1-3: USER0001 signs on, option 2 XCTLs to COACTUPC, and ENTER with
# account 00000000001 shows the fetched account and customer with the change
# prompt [app/cbl/COACTUPC.cbl:2787-2865,2955-2981].
# Step 4: 2026, 02 and 29 over RISYEAR, RISMON and RISDAY make
# ACUP-NEW-REISSUE-DATE 20260229, a change, so 1200-EDIT-MAP-INPUTS sets
# ACUP-CHANGES-NOT-OK and edits the fields in screen order. Account Status,
# Open Date, Credit Limit, Expiry Date and Cash Credit Limit pass as fetched,
# then EDIT-DATE-CCYYMMDD accepts year 2026 (century 20), month 02 and day 29
# one by one. EDIT-DAY-MONTH-YEAR finds February with day 29: the last two
# year digits, 26, are not 00, so the divisor is 4, and 2026 leaves remainder
# 2. INPUT-ERROR and the day, month and year flags are set and, the message
# being still off, TRIM('Reissue Date') ':Not a leap year.Cannot have 29 days
# in this month.' (63 characters) is composed into WS-RETURN-MSG; its GO TO
# the exit skips EDIT-DATE-LE, so CSUTLDTC is not called, and no later edit
# can replace the message [app/cbl/COACTUPC.cbl:1471-1507]
# [app/cpy/CSUTLDPY.cpy:243-272].
# 2000-DECIDE-ACTION continues, so nothing is read for update or rewritten;
# 3203 shows the reissue date as typed, 3250 sets PROMPT-FOR-CHANGES and
# moves the message to ERRMSG, and 3390 brightens FKEY12 because a change was
# made; the red reissue-date fields and the cursor on RISYEAR are attributes,
# not captured field values [app/cbl/COACTUPC.cbl:2596-2597,2870-2981,
# 3053-3055,3566-3581] [app/cpy/CSSETATY.cpy:18-27].
# This pins the app/ text: the UniKix CSUTLDPY drops TRIM, so its copy would
# show 'Reissue Date' padded to 25 bytes before the colon, cut at 75
# (GAP-DOC-024); such a record is UniKix-copy behavior and never replaces
# this file.
# Screen values are full BMS width with trailing spaces kept (ERRMSG 78,
# INFOMSG 45), because screens compare exactly. CURDATE and CURTIME come from
# the region clock, which no confirmed command sets (GAP-MIS-015), so they
# keep the scenario's matchers. messages holds the ERRMSG of every step.
# file_state: both files keep their 50 records, account 00000000001 as in
# app/data/ASCII/acctdata.txt and the scenario's invented customer 000000001.
