# Derived baseline of scenario ACT-COACTUPC-negative-090 (capture_platform:
# derived), authored from the app/ source and never observed: no TPE region
# runs in CI. inferred-not-observed until a UniKix run of the app/ build is
# imported: GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012
# (online-only copybooks such as CSUTLDPY, CSUTLDWY and CSSETATY).
# Steps 1-3: USER0001 signs on, option 2 XCTLs to COACTUPC, and ENTER with
# account 00000000001 shows the fetched account and the invented customer
# 000000001 with the change prompt [app/cbl/COACTUPC.cbl:2787-2865,2955-2981].
# Step 4: Test9first over the first name is a change, so 1200-EDIT-MAP-INPUTS
# sets ACUP-CHANGES-NOT-OK and edits the fields in order. This assumes, as the
# scenario's fixtures provide, that every field edited before First Name
# (Account Status, the dates, the amounts, SSN, Date of Birth, FICO Score)
# passes, so First Name is the first refused field and sets the message
# [app/cbl/COACTUPC.cbl:1460-1556]. 1225-EDIT-ALPHA-REQD finds the name
# supplied; INSPECT CONVERTING turns every letter into a space and the '9'
# remains, so it sets INPUT-ERROR and FLG-ALPHA-NOT-OK and, the message being
# still off, composes TRIM('First Name') ' can have alphabets only.' (35
# characters) into WS-RETURN-MSG; no later edit can replace it
# [app/cbl/COACTUPC.cbl:1560-1566,1898-1953].
# 2000-DECIDE-ACTION continues, so 9600-WRITE-PROCESSING never runs; 3203
# shows ACSFNAM as received, 3250 sets PROMPT-FOR-CHANGES and moves the
# message to ERRMSG, and 3390 brightens FKEY12 because a change was made
# [app/cbl/COACTUPC.cbl:1286-1293,2596-2597,2870-2952,2955-2981,3566-3581].
# Screen values are full BMS width with trailing spaces kept (ERRMSG 78,
# INFOMSG 45, ACSFNAM 25), because screens compare exactly. The tpe adapter
# erases an entered field (EraseEOF) before typing, so ACSFNAM is 'Test9first'
# and 15 blanks. CSSETATY colours ACSFNAM red and writes '*' only into a blank
# field; colour and cursor position are not in the text capture
# [app/cpy/CSSETATY.cpy:18-27] [app/cbl/COACTUPC.cbl:3339-3343]. FKEY05 and
# FKEY12 are asserted because the scenario's expected names them, a dark
# field read as blanks. CURDATE and CURTIME come from the region clock, so
# they are matchers. file_state holds
# the records as the preconditions materialize them, decoded through CVACT01Y
# and CVCUS01Y, unchanged because no REWRITE runs.
# This pins the app/ text (GAP-DOC-022): the UniKix COACTUPC.cl2 comments out
# the TRIM-length blank check, tests the converted name with = SPACES and
# STRINGs WS-EDIT-VARIABLE-NAME without TRIM (COACTUPC.cl2:1907-1945), so its
# message would be 'First Name' padded to 25 bytes before ' can have
# alphabets only.' (50 characters); such a record is UniKix-copy behavior,
# never verifies this item and never replaces this file.
