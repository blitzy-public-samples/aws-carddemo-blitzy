# sign-on screen). Only unikix can run the scenario, so expected.yaml is
# authored from the source and is inferred-not-observed (GAP-INF-002,
# GAP-INF-012). It names no execution_id or execution_fingerprint and holds no
# datasets/ until an eligible UniKix run is imported (report.py --import-unikix).
