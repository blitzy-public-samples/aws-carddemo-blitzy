# Derived from the source, never observed (GAP-INF-005): one screens entry
# per scenario step, the menu, the account-view prompt and the account-view
# screen the abend routine writes over.
#
# Step 3 ends in COACTVWC's ABEND-ROUTINE [app/cbl/COACTVWC.cbl:916-936]. It
# moves 'UNEXPECTED ABEND OCCURRED.' to ABEND-MSG only when ABEND-MSG equals
# LOW-VALUES. CSMSG02Y gives every ABEND-DATA field VALUE SPACES
# [app/cpy/CSMSG02Y.cpy:21-29] and COACTVWC never moves LOW-VALUES there, so
# the test is false and ABEND-MSG stays 72 spaces (GAP-DEF-014). The routine
# moves LIT-THISPGM 'COACTVWC' to ABEND-CULPRIT and sends the 134 bytes of
# ABEND-DATA (code 4, culprit 8, reason 50, message 72).
#
# The SEND FROM has no ERASE and no CTLCHAR [app/cbl/COACTVWC.cbl:924-928],
# so it is a 3270 Write, not an Erase/Write. It starts at the cursor, row 5,
# column 39: step 2's SEND MAP ... CURSOR put it there
# [app/cbl/COACTVWC.cbl:545-552,583-589], and after the eleventh typed digit
# the autoskip stopper sends it back to ACCTSID, the only unprotected field.
# It leaves the rest of the COACTVW buffer and its field attributes as step 2
# sent them. The bytes cover row 5, column 39 to row 7, column 12: ACCTSID
# reads '    COACTVW'; ACSTTUS, ADTOPEN and ACRDLIM are blank; TRNNAME,
# PGMNAME and INFOMSG keep step 2's values. Had ABEND-MSG been LOW-VALUES,
# ADTOPEN would read '   UNEXPEC'.
#
# The blanks overwrite four statics [app/bms/COACTVW.bms:93-127]:
# 'Active Y/N: ', 'Opened:', 'Credit Limit        :' and the 'Expi' of
# 'Expiry:'. The screen stays formatted but matches no map, so tpe.py raises
# AdapterUnavailable under GAP-MIS-005.
#
# What the region shows for the ABEND ABCODE('9999') that follows
# [app/cbl/COACTVWC.cbl:930-935] is unresolved, so ERRMSG is not asserted;
# terminal evidence from a UniKix region settles it (GAP-INF-005,
# GAP-MIS-014). report.py --import-unikix replaces this with the observed
# screen; a different screen is a MAJOR bump and opens an uncertain-purpose
# entry.
screens:
- '@map': COMEN01
  ERRMSG: '                                                                              '
  PGMNAME: COMEN01C
  TRNNAME: CM00
- '@map': COACTVW
  ERRMSG: '                                                                              '
  INFOMSG: 'Enter or update id of account to display     '
  PGMNAME: COACTVWC
  TRNNAME: CAVW
- '@map': COACTVW
  ACCTSID: '    COACTVW'
  ACRDLIM: '               '
  ACSTTUS: ' '
  ADTOPEN: '          '
  INFOMSG: 'Enter or update id of account to display     '
  PGMNAME: COACTVWC
  TRNNAME: CAVW
