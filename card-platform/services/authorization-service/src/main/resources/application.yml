# Runtime configuration for the authorization service.
# Rationale for the settings below: card-platform/docs/decision-log.md

server:
  # The container listens on 8080. docker-compose.yml publishes a host port.
  port: 8080

spring:
  application:
    name: authorization-service

  # One private database per service. The demo credentials below match
  # card-platform/.env.example.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${AUTHORIZATION_DB_NAME:carddemo_authorization}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:carddemo}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:carddemo}}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    schemas: ${SPRING_FLYWAY_SCHEMAS:${AUTHORIZATION_DB_SCHEMA:authorization_service}}
    # Flyway creates the schema named above, then applies db/migration.
    create-schemas: true
    baseline-on-migrate: false
    validate-on-migrate: true

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # Flyway owns creation. Hibernate validates the model against it.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:${AUTHORIZATION_DB_SCHEMA:authorization_service}}
        # Quotes identifiers that PostgreSQL reserves, a schema name included.
        auto_quote_keyword: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}}
    # The message key is the account identifier, XREF-ACCT-ID PIC 9(11) at
    # app/cpy/CVACT03Y.cpy:L7. A text key keeps its leading zero.
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: com.carddemo.events.serde.JsonSchemaValidatingSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        max.block.ms: 5000
    consumer:
      enable-auto-commit: false
    listener:
      ack-mode: manual

carddemo:
  kafka:
    topics:
      transaction-authorized: ${TOPIC_TRANSACTION_AUTHORIZED:transaction.authorized}
      transaction-declined: ${TOPIC_TRANSACTION_DECLINED:transaction.declined}
      dead-letter: ${TOPIC_DEAD_LETTER:${TOPIC_TRANSACTION_AUTHORIZED:transaction.authorized}${TOPIC_DEAD_LETTER_SUFFIX:.DLT}}
  outbox:
    relay:
      fixed-delay-ms: ${OUTBOX_RELAY_INTERVAL_MS:500}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:100}
  consumer:
    # This service registers no listener.
    retry:
      max-attempts: ${CONSUMER_MAX_RETRY_ATTEMPTS:3}
      backoff-ms: ${CONSUMER_RETRY_BACKOFF_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,metrics,prometheus}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  # Structured JavaScript Object Notation (JSON) records on the console.
  structured:
    format:
      console: logstash
  level:
    root: ${LOG_LEVEL:INFO}
    com.carddemo: ${LOG_LEVEL_CARDDEMO:DEBUG}
