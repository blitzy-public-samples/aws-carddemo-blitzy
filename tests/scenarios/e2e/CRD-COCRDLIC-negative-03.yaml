    TRNNAME: CCLI
    PGMNAME: COCRDLIC
    PAGENO: '1  '
    CRDSEL1: ' '
    ACCTNO1: '00000000050'
    CRDNUM1: '0500024453765740'
    CRDSTS1: 'Y'
