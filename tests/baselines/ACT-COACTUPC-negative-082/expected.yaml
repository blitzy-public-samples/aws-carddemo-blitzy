# Derived baseline of scenario ACT-COACTUPC-negative-082 (capture_platform:
# derived), authored from the app/ source and never observed: no TPE region
# runs in CI. Open until a UniKix run of the app/ build is imported:
# GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012 (online-only
# copybooks such as CSUTLDPY and CSUTLDWY).
# Step 4 types 1962, 02 and 29 over DOBYEAR, DOBMON and DOBDAY. Every earlier
# field passes as fetched; EDIT-DATE-CCYYMMDD accepts the year (century 19),
# month and day, then EDIT-DAY-MONTH-YEAR finds 29 February with divisor 4
# (year digits 62, not 00) and remainder 2, and composes TRIM('Date of Birth')
# ':Not a leap year.Cannot have 29 days in this month.' (64 characters) before
# EDIT-DATE-LE and EDIT-DATE-OF-BIRTH, so neither CSUTLDTC nor the run date
# enters the outcome [app/cbl/COACTUPC.cbl:1532-1543]
# [app/cpy/CSUTLDPY.cpy:243-272]. Nothing is read for update or rewritten;
# 3250 sets PROMPT-FOR-CHANGES and moves the message to the 78-byte ERRMSG
# [app/cbl/COACTUPC.cbl:2596-2597,2955-2981].
# This pins the app/ text: the UniKix CSUTLDPY drops TRIM, so its copy would
# show 'Date of Birth' padded to 25 bytes before the colon (GAP-DOC-024).
# Values are whole BMS fields with trailing spaces kept; CURDATE and CURTIME
# are matchers because the UniKix run clock cannot be fixed (GAP-MIS-015).
