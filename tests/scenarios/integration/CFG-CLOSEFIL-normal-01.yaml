# CLOSEFIL has one step, CLCIFIL, which runs SDSF with five operator commands
# /F CICSAWSA,'CEMT SET FIL(<file> ) CLO' for TRANSACT, CCXREF, ACCTDAT, CXACAIX and USRSEC
# [app/jcl/CLOSEFIL.jcl:22-30]. The README runs it first in the full batch, to release the files CICS has
# open [README.md:161-166]; the tech spec and the README's batch table say IEFBR14 instead [README.md:247]
# (GAP-DOC-009).
#
# Only unikix can run the job: it acts on a CICS region, so the gnucobol-batch job driver has no step table
# for it, and INV-CFG-033 is a JCL-semantics item. Before every scenario the adapter resets the test-owned
# region and reopens and enables every file, so the state before the job is all 14 fct.lst files open and
# enabled, which CFG-FCT-normal-01 asserts. Both states are asserted through the region file inquiry
# (adapters.base.format_region_files): @BEFORE:CLOSEFIL:@REGION-FILES, read just before the job is
# submitted, and @REGION-FILES, read after it; each is one line per file, '<name> open|closed
# enabled|disabled', sorted by name. The step return code says nothing about the region: the files are
# observed only through that inquiry (GAP-MIS-011), and the job itself through BPE (GAP-MIS-006).
#
# The expectation is derived from app/, never observed. CEMT SET FILE CLOSED closes an enabled file and sets
# it UNENABLED, which the inquiry reads as disabled (commands.yaml region_file_inquire: Une is disabled), so
# the five files the job names end closed and disabled and the other nine stay open and enabled. The UniKix
# copy's SDSF.cbl only displays 'DUMMY PROGRAM FOR SDSF' and returns (GAP-DOC-031): a UniKix run leaves all
# 14 files open, so its two inquiries show the files unchanged, and that record is behavior of the UniKix
# copy, which never verifies these app/ items.
id: CFG-CLOSEFIL-normal-01
level: integration
type: normal
description: >-
  CLOSEFIL runs its one SDSF step CLCIFIL, whose CEMT SET FIL(...) CLO commands close the region files
  TRANSACT, CCXREF, ACCTDAT, CXACAIX and USRSEC [app/jcl/CLOSEFIL.jcl:22-30]. Starting from the reset
  region, every file open and enabled as the region file inquiry just before the job lists them, the step
  ends RC 0 and the region file inquiry after it shows those five files closed and disabled (CICS sets a
  file it closes UNENABLED) and the other nine fct.lst files still open and enabled. The expectation is the
  app/ job's; on the UniKix copy SDSF.cbl is a no-op that leaves every file open (GAP-DOC-031).
inventory_ids:
- INV-CFG-032  # CLOSEFIL job
- INV-CFG-033  # CICS file close and open through the SDSF CEMT steps
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-010  # CFG baselines derived, never observed
- GAP-MIS-011  # no confirmed region file control or inquiry, so @REGION-FILES is unavailable on unikix
- GAP-MIS-006  # BPE submission and completion unconfirmed
- GAP-DOC-031  # the UniKix copy's SDSF.cbl performs no CEMT command
- GAP-DOC-009  # the tech spec and README say IEFBR14; the job runs SDSF CEMT commands
# No dataset is named, so the reset loads every cluster empty and leaves every region file open and
# enabled. The outcome holds no date, and unikix cannot fix its clock (GAP-MIS-015), so the clock is
# relative.
preconditions:
  datasets: {}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  job: CLOSEFIL
expected:
  return_code: 0
  messages:
  - STEP CLCIFIL RC 0000
  file_state:
    # Just before CLOSEFIL is submitted: the reset state, every fct.lst file open and enabled.
    '@BEFORE:CLOSEFIL:@REGION-FILES':
      records:
      - 'ACCTDAT open enabled'
      - 'CARDAIX open enabled'
      - 'CARDDAT open enabled'
      - 'CCXREF open enabled'
      - 'CUSTDAT open enabled'
      - 'CXACAIX open enabled'
      - 'DISCGRP open enabled'
      - 'TCATBALF open enabled'
      - 'TRANCATG open enabled'
      - 'TRANSACT open enabled'
      - 'TRANSAIX open enabled'
      - 'TRANTYPE open enabled'
      - 'TRXFL open enabled'
      - 'USRSEC open enabled'
    # After CLOSEFIL: the app/ intent for the 14 fct.lst region files, not the no-op UniKix copy's outcome
    # (all open), because a UniKix record never verifies an item GAP-DOC-031 lists.
    '@REGION-FILES':
      records:
      - 'ACCTDAT closed disabled'
      - 'CARDAIX open enabled'
      - 'CARDDAT open enabled'
      - 'CCXREF closed disabled'
      - 'CUSTDAT open enabled'
      - 'CXACAIX closed disabled'
      - 'DISCGRP open enabled'
      - 'TCATBALF open enabled'
      - 'TRANCATG open enabled'
      - 'TRANSACT closed disabled'
      - 'TRANSAIX open enabled'
      - 'TRANTYPE open enabled'
      - 'TRXFL open enabled'
      - 'USRSEC closed disabled'
