# =============================================================================
# Kubernetes Ingress Resource for CardDemo Application
# =============================================================================
# Purpose: Define HTTP/HTTPS routing rules for external access to CardDemo
#          application frontend and backend services
#
# Migration Context: 
#   - Part of COBOL/CICS to Java/Spring Boot cloud-native migration
#   - Replaces mainframe external access with modern API Gateway pattern
#   - Implements TLS termination and load balancing per Section 0.3
#
# Related Resources:
#   - backend-service.yaml: Spring Boot REST API (port 8080)
#   - frontend-service.yaml: React SPA served by Nginx (port 80)
#   - secrets.yaml: TLS certificate and private key (carddemo-tls-cert)
#
# Security: HTTPS enforced with TLS 1.3 minimum per Section 0.5
# Performance: Supports 10,000 TPS requirement with rate limiting
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: carddemo-ingress
  namespace: default
  labels:
    app: carddemo
    component: ingress
    tier: gateway
  annotations:
    # =======================================================================
    # Nginx Ingress Controller Annotations
    # =======================================================================
    
    # URL Rewriting
    nginx.ingress.kubernetes.io/rewrite-target: /
    
    # HTTPS/SSL Configuration (enforces TLS 1.3 minimum per Section 0.5)
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    
    # TLS Protocol and Cipher Configuration
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256"
    
    # HSTS (HTTP Strict Transport Security)
    nginx.ingress.kubernetes.io/hsts: 'true'
    nginx.ingress.kubernetes.io/hsts-max-age: '31536000'
    nginx.ingress.kubernetes.io/hsts-include-subdomains: 'true'
    nginx.ingress.kubernetes.io/hsts-preload: 'true'
    
    # Certificate Management (optional - uncomment if using cert-manager)
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # cert-manager.io/acme-challenge-type: http01
    
    # Rate Limiting (per Section 0.9 - supports 10,000 TPS while protecting against abuse)
    nginx.ingress.kubernetes.io/limit-rps: '100'
    nginx.ingress.kubernetes.io/limit-connections: '50'
    nginx.ingress.kubernetes.io/limit-burst-multiplier: '5'
    
    # Proxy Configuration (per Section 0.2 - <200ms transaction response target)
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-connect-timeout: '30'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '30'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '30'
    nginx.ingress.kubernetes.io/proxy-buffer-size: '8k'
    nginx.ingress.kubernetes.io/proxy-buffers-number: '4'
    
    # CORS Configuration (allow frontend-backend communication)
    nginx.ingress.kubernetes.io/enable-cors: 'true'
    nginx.ingress.kubernetes.io/cors-allow-origin: 'https://carddemo.example.com'
    nginx.ingress.kubernetes.io/cors-allow-methods: 'GET, POST, PUT, DELETE, OPTIONS'
    nginx.ingress.kubernetes.io/cors-allow-headers: 'Authorization, Content-Type, Accept, Origin, X-Requested-With'
    nginx.ingress.kubernetes.io/cors-allow-credentials: 'true'
    nginx.ingress.kubernetes.io/cors-max-age: '3600'
    
    # Additional Security Headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;";
    
    # WebSocket Support (if needed for future enhancements)
    nginx.ingress.kubernetes.io/websocket-services: 'backend-service'
    
    # Backend Protocol
    nginx.ingress.kubernetes.io/backend-protocol: 'HTTP'
    
    # Load Balancing Algorithm
    nginx.ingress.kubernetes.io/upstream-hash-by: '$remote_addr'
    
    # =======================================================================
    # Alternative: AWS ALB Ingress Controller Annotations (commented out)
    # =======================================================================
    # Uncomment and adjust the following if deploying to AWS EKS with ALB:
    #
    # kubernetes.io/ingress.class: alb
    # alb.ingress.kubernetes.io/scheme: internet-facing
    # alb.ingress.kubernetes.io/target-type: ip
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:region:account:certificate/id
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # alb.ingress.kubernetes.io/ssl-redirect: '443'
    # alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    # alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    # alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    # alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    # alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    # alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    # alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    # alb.ingress.kubernetes.io/success-codes: '200,301,302'

spec:
  # ==========================================================================
  # Ingress Class Configuration
  # ==========================================================================
  ingressClassName: nginx
  # Alternative options for different environments:
  #   - AWS EKS: alb (with aws-load-balancer-controller)
  #   - GCP GKE: gce
  #   - Azure AKS: azure/application-gateway
  #   - Traefik: traefik
  
  # ==========================================================================
  # TLS Configuration (HTTPS with TLS 1.3 minimum per Section 0.5)
  # ==========================================================================
  tls:
    - hosts:
        - carddemo.example.com
        - www.carddemo.example.com
      secretName: carddemo-tls-cert
      # TLS Secret must contain:
      #   - tls.crt: X.509 certificate (from Let's Encrypt, AWS ACM, or custom CA)
      #   - tls.key: Private key
      #
      # To create manually:
      # kubectl create secret tls carddemo-tls-cert \
      #   --cert=path/to/tls.crt \
      #   --key=path/to/tls.key \
      #   --namespace=default
      #
      # For cert-manager automatic provisioning:
      # 1. Install cert-manager in the cluster
      # 2. Create ClusterIssuer (letsencrypt-prod)
      # 3. Uncomment cert-manager.io annotations above
      # 4. cert-manager will automatically provision and renew certificates
  
  # ==========================================================================
  # Ingress Routing Rules
  # ==========================================================================
  rules:
    # ========================================================================
    # Rule 1: Main Application Domain (carddemo.example.com)
    # ========================================================================
    - host: carddemo.example.com
      http:
        paths:
          # ==================================================================
          # Path 1: Backend API Routing (/api/* → backend-service:8080)
          # ==================================================================
          # Routes all REST API requests to Spring Boot backend
          # Handles CICS transaction → REST API transformation per Section 0.6
          # Examples:
          #   - POST /api/auth/login (COSGN00C → AuthenticationService)
          #   - GET /api/accounts/* (COACTVWC → AccountViewService)
          #   - GET /api/cards/* (COCRDLIC → CardListService)
          #   - GET /api/transactions/* (COTRN00C → TransactionListService)
          #   - POST /api/payments/bill (COBIL00C → BillPaymentService)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          
          # ==================================================================
          # Path 2: Actuator Endpoints (/actuator/* → backend-service:8080)
          # ==================================================================
          # Exposes Spring Boot Actuator for monitoring and health checks
          # Endpoints:
          #   - /actuator/health: Application health status
          #   - /actuator/health/liveness: Kubernetes liveness probe
          #   - /actuator/health/readiness: Kubernetes readiness probe
          #   - /actuator/prometheus: Prometheus metrics scraping
          #   - /actuator/info: Application information
          #
          # Security Note: In production, consider restricting access via:
          #   - IP whitelisting (nginx.ingress.kubernetes.io/whitelist-source-range)
          #   - Basic authentication
          #   - Network policies allowing only monitoring systems
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080
          
          # ==================================================================
          # Path 3: Frontend SPA (/ → frontend-service:80)
          # ==================================================================
          # Routes all other requests to React Single Page Application
          # Nginx serves static assets and handles client-side routing
          # React Router paths (from BMS Maps per Section 0.4):
          #   - / → LoginComponent (COSGN00M - Sign-on screen)
          #   - /menu → MainMenuComponent (COMEN01M - Main menu)
          #   - /accounts → AccountViewComponent (COACTVWM - Account view)
          #   - /accounts/add → AccountAddComponent (COACTADD - Add account)
          #   - /accounts/:id/edit → AccountUpdateComponent (COACTUPM)
          #   - /cards → CardListComponent (COCRDLIM - Card list, 7/page)
          #   - /cards/:id → CardSelectComponent (COCRDSLM - Card detail)
          #   - /cards/:id/edit → CardUpdateComponent (COCRDUPM)
          #   - /transactions → TransactionListComponent (COTRN00M - 10/page)
          #   - /transactions/categories → TransactionCategoryComponent (COTRN01M)
          #   - /transactions/add → TransactionAddComponent (COTRN02M)
          #   - /payments/bill → BillPaymentComponent (COBIL00M)
          #   - /reports → ReportMenuComponent (CORPT00M)
          #   - /admin → AdminComponent (COADM01M)
          #   - /users → UserManagementComponent (COUSR00M)
          #   - /users/profile → UserProfileComponent (COUSR01M)
          #
          # Note: This MUST be the last path in the list (catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
    
    # ========================================================================
    # Rule 2: WWW Subdomain Redirect (optional - www.carddemo.example.com)
    # ========================================================================
    # Uncomment if you want to support www subdomain
    # Typically handled by DNS CNAME or 301 redirect at load balancer level
    #
    # - host: www.carddemo.example.com
    #   http:
    #     paths:
    #       - path: /api
    #         pathType: Prefix
    #         backend:
    #           service:
    #             name: backend-service
    #             port:
    #               number: 8080
    #       - path: /actuator
    #         pathType: Prefix
    #         backend:
    #           service:
    #             name: backend-service
    #             port:
    #               number: 8080
    #       - path: /
    #         pathType: Prefix
    #         backend:
    #           service:
    #             name: frontend-service
    #             port:
    #               number: 80

# =============================================================================
# Complete Routing Table Reference
# =============================================================================
# User Request                                    → Ingress Routing              → Backend Service
# ---------------------------------------------------------------------------------------------------------------
# https://carddemo.example.com/                   → frontend-service:80          → React SPA (/)
# https://carddemo.example.com/menu               → frontend-service:80          → React SPA (/menu)
# https://carddemo.example.com/accounts           → frontend-service:80          → React SPA (/accounts)
# https://carddemo.example.com/cards              → frontend-service:80          → React SPA (/cards)
# https://carddemo.example.com/transactions       → frontend-service:80          → React SPA (/transactions)
# https://carddemo.example.com/payments/bill      → frontend-service:80          → React SPA (/payments/bill)
# https://carddemo.example.com/admin              → frontend-service:80          → React SPA (/admin)
# https://carddemo.example.com/api/auth/login     → backend-service:8080         → POST /api/auth/login
# https://carddemo.example.com/api/accounts       → backend-service:8080         → GET /api/accounts
# https://carddemo.example.com/api/accounts/123   → backend-service:8080         → GET /api/accounts/123
# https://carddemo.example.com/api/cards          → backend-service:8080         → GET /api/cards
# https://carddemo.example.com/api/transactions   → backend-service:8080         → GET /api/transactions
# https://carddemo.example.com/api/payments/bill  → backend-service:8080         → POST /api/payments/bill
# https://carddemo.example.com/actuator/health    → backend-service:8080         → GET /actuator/health
# https://carddemo.example.com/actuator/prometheus → backend-service:8080        → GET /actuator/prometheus
# ---------------------------------------------------------------------------------------------------------------
#
# HTTP → HTTPS Redirect:
#   - All http:// requests automatically redirected to https:// (ssl-redirect: true)
#   - Example: http://carddemo.example.com/ → 301 → https://carddemo.example.com/
#
# Path Matching Behavior:
#   - pathType: Prefix matches the path and all subpaths
#   - /api matches: /api, /api/, /api/accounts, /api/accounts/123, etc.
#   - Order matters: most specific paths evaluated first
#   - / is the catch-all default route (must be last)
#
# Session Management:
#   - Backend is stateless (session data in Redis via Spring Session)
#   - sessionAffinity: None - any backend pod can handle any request
#   - Load balancing: Round-robin across backend-service pods
#
# Health Checks:
#   - Ingress controller monitors backend/frontend readiness probes
#   - Unhealthy pods automatically removed from load balancing pool
#   - Traffic resumes when pod passes readiness probe
#
# Performance Characteristics:
#   - TLS termination at Ingress (reduces backend overhead)
#   - HTTP/2 support for reduced latency
#   - Connection pooling and keepalive
#   - Gzip compression for text-based responses
#   - Static asset caching at frontend Nginx
#
# =============================================================================
# DNS Configuration (External to Kubernetes)
# =============================================================================
# Required DNS records to point to this Ingress:
#
# For cloud providers with LoadBalancer:
#   1. Get external IP: kubectl get ingress carddemo-ingress
#   2. Create DNS A record: carddemo.example.com → <EXTERNAL-IP>
#   3. Optional CNAME: www.carddemo.example.com → carddemo.example.com
#
# For AWS EKS with ALB:
#   1. Get ALB DNS: kubectl get ingress carddemo-ingress
#   2. Create Route53 CNAME: carddemo.example.com → <ALB-DNS-NAME>
#
# For GCP GKE with GCLB:
#   1. Get GCLB IP: kubectl get ingress carddemo-ingress
#   2. Create Cloud DNS A record: carddemo.example.com → <GCLB-IP>
#
# For on-premises with MetalLB or NodePort:
#   1. Get LoadBalancer IP or NodePort
#   2. Create internal/external DNS A record accordingly
#
# =============================================================================
# Security Considerations
# =============================================================================
# 1. TLS Certificate Management:
#    - Use cert-manager for automated Let's Encrypt certificates
#    - Or provision certificates from AWS ACM, GCP Certificate Manager
#    - Ensure certificate covers all hostnames in TLS section
#    - Set up auto-renewal to prevent expiration
#
# 2. WAF Integration (optional but recommended for production):
#    - AWS WAF on ALB for SQL injection, XSS protection
#    - Cloudflare WAF for DDoS protection and rate limiting
#    - ModSecurity with Nginx for OWASP Core Rule Set
#
# 3. API Security:
#    - JWT token validation in backend (Spring Security)
#    - Rate limiting per IP address (100 req/sec per annotation)
#    - CORS properly configured for allowed origins
#    - All /api endpoints require authentication (except /api/auth/login)
#
# 4. Monitoring & Alerting:
#    - /actuator/prometheus scraped by Prometheus
#    - Alert on high 4xx/5xx rates
#    - Monitor response times against 200ms SLA
#    - Track certificate expiration dates
#
# 5. Access Control:
#    - Consider IP whitelisting for /actuator endpoints
#    - Implement network policies restricting pod-to-pod communication
#    - Use Kubernetes RBAC for cluster resource access
#
# =============================================================================
# Deployment Instructions
# =============================================================================
# 1. Ensure prerequisites are deployed:
#    kubectl apply -f kubernetes/backend-deployment.yaml
#    kubectl apply -f kubernetes/backend-service.yaml
#    kubectl apply -f kubernetes/frontend-deployment.yaml
#    kubectl apply -f kubernetes/frontend-service.yaml
#
# 2. Create TLS certificate secret:
#    kubectl create secret tls carddemo-tls-cert \
#      --cert=/path/to/certificate.crt \
#      --key=/path/to/private.key \
#      --namespace=default
#
# 3. Deploy this Ingress:
#    kubectl apply -f kubernetes/ingress.yaml
#
# 4. Verify Ingress creation:
#    kubectl get ingress carddemo-ingress
#    kubectl describe ingress carddemo-ingress
#
# 5. Test external access:
#    curl -k https://carddemo.example.com/actuator/health
#    curl -k https://carddemo.example.com/
#
# 6. Monitor Ingress logs:
#    kubectl logs -n ingress-nginx -l app.kubernetes.io/component=controller
#
# =============================================================================
# Troubleshooting
# =============================================================================
# Issue: 502 Bad Gateway
# - Check backend/frontend services are running: kubectl get pods
# - Verify service endpoints: kubectl get endpoints backend-service frontend-service
# - Check backend readiness probes passing: kubectl describe pod <backend-pod>
#
# Issue: Certificate errors
# - Verify TLS secret exists: kubectl get secret carddemo-tls-cert
# - Check certificate validity: kubectl get secret carddemo-tls-cert -o yaml
# - Ensure certificate CN/SAN matches hostname
#
# Issue: 404 Not Found for /api paths
# - Verify backend-service is running: kubectl get svc backend-service
# - Check Ingress rules: kubectl describe ingress carddemo-ingress
# - Test direct service access: kubectl port-forward svc/backend-service 8080:8080
#
# Issue: Rate limiting triggering too aggressively
# - Adjust limit-rps annotation value
# - Consider per-user rate limiting vs per-IP
# - Review Nginx Ingress Controller logs
#
# =============================================================================
