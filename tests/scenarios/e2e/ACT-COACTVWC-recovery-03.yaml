# The account view cannot read the account master because the region file
# ACCTDAT is out of service. USER0001 (type U in the USRSEC fixture) signs on
# through CC00 and COSGN00C XCTLs to the main menu COMEN01C, whose first entry
# sends COMEN01 with a blank message [app/cbl/COSGN00C.cbl:221-240]
# [app/cbl/COMEN01C.cbl:86-90,107-110,182-194]. Option '1' is 'Account View',
# so COMEN01C XCTLs to COACTVWC with CDEMO-PGM-CONTEXT 0
# [app/cbl/COMEN01C.cbl:117-155] [app/cpy/COMEN02Y.cpy:25-29]. COACTVWC, called
# from COMEN01C and not re-entered, initializes the COMMAREA, takes the
# CDEMO-PGM-ENTER path and sends COACTVW with the account-id prompt, reading no
# file, then returns with TRANSID CAVW [app/cbl/COACTVWC.cbl:282-286,353-360,
# 394-407,416-536,577-591].
#
# The third step enters account 00000000001 under CAVW. CSSTRPFY maps ENTER,
# 2210-EDIT-ACCOUNT accepts the non-zero 11-digit number and 9000-READ-ACCT reads
# the cross-reference through CXACAIX by account id: the CARDXREF fixture holds
# card 9680294154603697 for customer 000000001 on that account, so the READ is
# NORMAL [app/cbl/COACTVWC.cbl:361-375,596-685,687-773]. The READ of ACCTDAT by
# account id then answers neither NORMAL nor NOTFND, so the WHEN OTHER branch of
# 9300-GETACCTDATA-BYACCT sets INPUT-ERROR and FLG-ACCTFILTER-NOT-OK, moves 'READ'
# to ERROR-OPNAME, LIT-ACCTFILENAME 'ACCTDAT ' to ERROR-FILE and the RESP and
# RESP2 values to ERROR-RESP and ERROR-RESP2, and moves the 80-byte
# WS-FILE-ERROR-MESSAGE into the 75-byte WS-RETURN-MSG, dropping only its
# 5-byte blank filler [app/cbl/COACTVWC.cbl:86-104,774-823]. The message
# condition DID-NOT-FIND-ACCT-IN-ACCTDAT is not what WS-RETURN-MSG holds, so
# 9000-READ-ACCT goes on to read CUSTDAT for customer 000000001, which succeeds
# and sets FOUND-CUST-IN-MASTER without touching the message
# [app/cbl/COACTVWC.cbl:704-716,825-872]. 1000-SEND-MAP sends COACTVW again:
# ACCTSID keeps the entered id (the filter is not blank), the customer fields
# come from the CUSTDATA record, INFOMSG is the prompt again because 9000-READ-ACCT
# cleared the info message, and ERRMSG is the composed file error padded to 78
# [app/cbl/COACTVWC.cbl:460-536]. Whether the lookup is meant to go on after the
# failed account read is the suspected defect GAP-DEF-020, hence the
# suspected-defect tag.
#
# ERROR-RESP and ERROR-RESP2 are PIC X(10) receiving the S9(9) COMP response
# codes, so each holds the 9 unsigned digits followed by one blank. The values
# assume the control the unikix adapter applies for an online `unavailable`
# fault, commands.yaml region_file_disable (CEMT SET FIL(ACCTDAT) DIS): a READ
# of a disabled file answers DISABLED, RESP 84 with RESP2 50. Should the
# confirmed control close the file instead, the answer is NOTOPEN, RESP 19 with
# RESP2 60, and the import replaces the tail of the expected ERRMSG.
#
# The baseline is derived from the source (GAP-INF-005): no TPE region runs in
# CI. The UniKix copy of COACTVW.bms lacks the unnamed field at row 1,
# columns 1-9 (GAP-DOC-025), which no assertion here reads.
id: ACT-COACTVWC-recovery-03
level: e2e
type: recovery
description: >-
  USER0001 signs on, selects option 1 'Account View' on the main menu and asks
  COACTVWC for account 00000000001 while the region file ACCTDAT is
  unavailable. The cross-reference read through CXACAIX succeeds, the READ of
  ACCTDAT fails with a response other than NORMAL or NOTFND, and the account
  view COACTVW comes back with the entered account id, the customer of that
  account read from CUSTDAT, the prompt 'Enter or update id of account to
  display' and the message 'File Error: READ     on ACCTDAT   returned RESP
  000000084 ,RESP2 000000050'.
# The recovery message is the primary item, then the program, the map the
# option is entered on and the map asserted, the transaction under which the
# failing READ runs, the CSD files the step reads (CXACAIX and CUSTDAT
# successfully, ACCTDAT failing), then the online-only copybooks COACTVWC
# copies. CVACT01Y, CVACT03Y, CVCUS01Y, CSUSR01Y and the data files are left
# out: their lowest executing level is a batch scenario.
inventory_ids:
- INV-ACT-021  # COACTVWC message 'File Error: READ on ACCTDAT' (recovery)
- INV-ACT-001  # COACTVWC program
- INV-MNU-003  # COMEN01 map, the main menu option 1 is entered on
- INV-ACT-003  # COACTVW map, the screen the file error is shown on
- INV-CFG-010  # CAVW transaction, under which the account id is processed
- INV-CFG-006  # CXACAIX CSD file, the cross-reference path read by account id
- INV-CFG-001  # ACCTDAT CSD file, the file the READ fails on
- INV-CFG-005  # CUSTDAT CSD file, read after the failure; its record fills the customer fields
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA whose context selects the entry and re-entry paths
- INV-LAY-005  # COTTL01Y copybook, TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y copybook, CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y copybook, copied by COACTVWC
- INV-LAY-009  # CSMSG02Y copybook, the abend data of the HANDLE ABEND routine
- INV-LAY-011  # CSSTRPFY copybook, maps ENTER to CCARD-AID-ENTER
- INV-LAY-019  # CVCRD01Y copybook, CC-ACCT-ID shown back in ACCTSID
tags:
- inferred-not-observed
- suspected-defect
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived from the source, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-MIS-011  # no confirmed region file control to make ACCTDAT unavailable
- GAP-DEF-020  # the failed account read goes on to the customer read and shows the customer
- GAP-DOC-025  # the UniKix COACTVW.bms differs from app/ at row 1, columns 1-9
preconditions:
  datasets:
    # COSGN00C reads the sign-on user from USRSEC. CARDXREF provides the
    # CXACAIX path by account id, CUSTDATA the customer the view shows, and
    # ACCTDATA holds account 00000000001, so the failure comes from the fault
    # and not from a missing record.
    USRSEC: {base: USRSEC}
    CARDXREF: {base: CARDXREF}
    ACCTDATA: {base: ACCTDATA}
    CUSTDATA: {base: CUSTDATA}
  parameters:
    clock_mode: relative
  # No `after`: the unikix adapter applies an online fault after the sign-on
  # step. Neither COMEN01C's option transfer nor COACTVWC's first send touches
  # a file, so the first ACCTDAT operation after the fault is the READ of step
  # 3. An adapter without a confirmed region file control raises
  # MissingPrerequisite under GAP-MIS-011.
  faults:
  - target: ACCTDAT
    operation: read
    condition: unavailable
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: USER0001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '1'}
    '@map': COMEN01
  - aid: ENTER
    fields: {ACCTSID: '00000000001'}
    '@map': COACTVW
expected:
  # Text fields keep their full BMS length with trailing spaces: ERRMSG is 78
  # characters, INFOMSG 45, the titles 40. CURDATE and CURTIME come from the
  # region clock, so they are matchers.
  screens:
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    ERRMSG: '                                                                              '
  - '@map': COACTVW
    TRNNAME: CAVW
    PGMNAME: COACTVWC
    ACCTSID: '           '
    INFOMSG: 'Enter or update id of account to display     '
    ERRMSG: '                                                                              '
  # The account fields (ACSTTUS, ADTOPEN, AEXPDT, AREISDT, AADDGRP and the five
  # amounts) are not asserted: because the customer was found, 1200-SETUP-SCREEN-VARS
  # moves them from ACCOUNT-RECORD, which the failed READ left unread and nothing
  # initializes, so their content is whatever the region's working storage holds
  # and cannot be derived from the source.
  - '@map': COACTVW
    TRNNAME: CAVW
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COACTVWC
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ACCTSID: '00000000001'
    ACSTNUM: '000000001'
    # STRING fills 11 of the 12 bytes; the last stays LOW-VALUES and shows blank.
    ACSTSSN: '020-97-3888 '
    ACSTDOB: '1961-06-08'
    ACSTFCO: '274'
    ACSFNAM: 'Immanuel                 '
    ACSMNAM: 'Madeline                 '
    ACSLNAM: 'Kessler                  '
    ACSADL1: '618 Deshaun Route                                 '
    ACSSTTE: 'NC'
    ACSADL2: 'Apt. 802                                          '
    # CUST-ADDR-ZIP X(10) and the phone numbers X(15) are cut to the field length.
    ACSZIPC: '12546'
    ACSCITY: 'Altenwerthshire                                   '
    ACSCTRY: 'USA'
    ACSPHN1: '(908)119-8310'
    ACSGOVT: '00000000000049368437'
    ACSPHN2: '(373)693-8684'
    ACSEFTC: '0053581756'
    ACSPFLG: 'Y'
    INFOMSG: 'Enter or update id of account to display     '
    ERRMSG: 'File Error: READ     on ACCTDAT   returned RESP 000000084 ,RESP2 000000050    '
  # The ERRMSG value of each step: blank on the menu and on the first COACTVW
  # send, then the composed file error.
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'File Error: READ     on ACCTDAT   returned RESP 000000084 ,RESP2 000000050    '
