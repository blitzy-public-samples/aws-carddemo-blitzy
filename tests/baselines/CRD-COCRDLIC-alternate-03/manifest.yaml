# Manifest of the derived baseline of CRD-COCRDLIC-alternate-03: PF7 on the
# first page of the credit card list gives 'NO PREVIOUS PAGES TO DISPLAY'.
# Only unikix can run the scenario, so expected.yaml was authored from the
# source, not captured (GAP-INF-006, GAP-INF-012). It names no execution_id or
# execution_fingerprint and holds no datasets/ until an eligible UniKix run is
# imported (report.py --import-unikix).
#
# source_identity.units are the app/ sources of every program the steps run:
# sign-on (COSGN00C), main-menu option 3 (COMEN01C, whose COMEN01 screen the
# baseline asserts) and the card list (COCRDLIC), each with its COPY closure as
# harness.results computes it for a program (none of them CALLs another app/cbl
# unit), plus the BMS sources COSGN00, COMEN01 and COCRDLI. They are wider than
# COCRDLIC's closure alone because a source identity hashes each executed
# program, copybook and map. DFHAID and DFHBMSCA are CICS-supplied and not in
# the repository. app/ is unchanged since the suite's starting commit 93ebec71.
