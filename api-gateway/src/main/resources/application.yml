# =====================================================================
# api-gateway - Spring Boot application configuration
#
# Edge router (Spring Cloud Gateway Server WebMVC, servlet flavor) plus
# the local menu-navigation service re-platforming legacy CICS
# transactions CM00 (COMEN01C) and CA00 (COADM01C).
#
# All connection details and downstream base URIs are environment
# driven so the SAME artifact runs on a developer workstation (defaults
# below), under Docker Compose (SPRING_PROFILES_ACTIVE=docker), and on
# Kubernetes (SPRING_PROFILES_ACTIVE=k8s, values from the carddemo-config
# ConfigMap). The gateway owns NO database - there are intentionally no
# datasource / JPA / Flyway keys here.
# =====================================================================
spring:
  application:
    name: api-gateway

  # The Spring Boot ASCII banner is written straight to stdout by the banner printer,
  # not through the logging system, so its seven lines are the only records in the
  # stream that are not parseable JSON -- which breaks a collector that reads this
  # container's stdout line-by-line as JSON, contradicting the structured-logging
  # requirement of AAP 0.7.5. Turning the banner off is what makes EVERY line of
  # startup output a log record; the version and application name it carried are
  # already reported by /actuator/info and by the startup records themselves.
  main:
    # QUOTED deliberately: YAML 1.1 resolves a bare `off` to the boolean false, which
    # the relaxed binder then cannot convert to the Banner.Mode enum.
    banner-mode: "off"

  # Externalized pseudo-conversational session state (COMMAREA
  # replacement, AAP 0.6.3). Spring Session persists the shared
  # SessionContext in Redis so state survives across the stateless
  # gateway and downstream services. Host/port are env-overridable.
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # Bounded Redis command/connect timeouts: Lettuce otherwise applies
      # its 60s default, which makes the aggregate /actuator/health unresponsive for the
      # whole duration of a Redis outage.
      timeout: 2s
      connect-timeout: 2s
  # Boot 4.x auto-detects the Redis session store from spring-session-data-redis
  # on the classpath; the legacy spring.session.store-type property was removed
  # and is inert. PROPERTY NAMES: Boot 4 moved the Redis session keys
  # from spring.session.redis.* to spring.session.data.redis.*; the old keys bind
  # but carry no value, so the shared namespace below was silently ignored and
  # every service fell back to the default 'spring:session' prefix. Canonical Boot
  # 4.1 keys are used here so the namespace is genuinely applied. Session tuning;
  # and is inert. Session tuning lives under spring.session.data.redis.*
  # (the spring.session.redis.* prefix was removed in Boot 4.0 and is IGNORED);
  # and is inert. Session tuning lives under spring.session.data.redis.* (the Boot 4
  # namespace; the Boot 3 spring.session.redis.* keys are inert);
  # the connection uses spring.data.redis.* above. The shared namespace lets the
  # gateway and every downstream service read/write the same session.
  session:
    timeout: ${SPRING_SESSION_TIMEOUT:30m}
    # Boot 4 renamed the Redis session properties: spring.session.redis.* is
    # deprecated at ERROR level and inert, so the namespace/flush-mode below MUST
    # sit under spring.session.data.redis.* to take effect. Every service must
    # declare the SAME namespace or the shared COMMAREA-equivalent session breaks.
    data:
      redis:
        namespace: ${SPRING_SESSION_REDIS_NAMESPACE:carddemo:session}
        flush-mode: on-save

  # ------------------------------------------------------------------
  # Gateway route table - SERVLET Spring Cloud Gateway Server WebMVC.
  # Namespace MUST be spring.cloud.gateway.server.webmvc.routes
  # (NEVER the reactive spring.cloud.gateway.routes, NEVER the
  # deprecated spring.cloud.gateway.mvc.routes).
  #
  # 8 downstream routes. Each downstream base URI is env-overridable so
  # Compose/K8s can point at service DNS on the internal port 8080 (neither
  # topology publishes a per-service host port). The defaults below are the
  # WORKSTATION topology: with no profile active each service binds the matching
  # port from its own application.yml (auth 8081 ... batch 8088), so a plain
  # `mvn spring-boot:run` estate on one host is routable without any environment
  # variable. The port map is documented in README-target.md.
  #
  # NOTE: /menu/** and /admin/** are deliberately ABSENT here - they are
  # served LOCALLY by MenuController (legacy CM00/CA00) and must NOT be
  # routed downstream.
  # ------------------------------------------------------------------
  cloud:
    gateway:
      server:
        webmvc:
          # Which peers may contribute to the X-Forwarded-* headers this gateway builds
          # for the downstream hop. Spring Cloud Gateway logs a WARN while this is unset
          # ("Untrusted hosts might be added to X-Forwarded header") and falls back to its
          # deprecated constructor, which appends the caller's address unconditionally: a
          # value an internet client controls then rides into the header the downstream
          # services and their logs read. With the pattern set, an address that does not
          # match is refused and recorded ("Remote address not trusted").
          #
          # The default trusts loopback and the RFC 1918 ranges, which is exactly where
          # the legitimate hops live in the shipped topologies: the SPA's nginx container
          # on the compose bridge (172.16/12), and the ingress / service network in
          # Kubernetes. A deployment whose edge sits outside those ranges overrides it
          # with SPRING_CLOUD_GATEWAY_SERVER_WEBMVC_TRUSTED_PROXIES.
          #
          # NOTE: this value deliberately carries no ${...:default} placeholder. The regex
          # contains {1,3} quantifiers, and the placeholder parser would end the default at
          # the first '}' inside one of them and silently truncate the pattern. Environment
          # overriding does not need a placeholder - Boot's relaxed binding already maps
          # the environment variable onto this key.
          #
          # This does NOT make the gateway trust a forwarded address for anything it did
          # not already: the rate limiter keys on getRemoteAddr() and the audit trail
          # records the peer address, neither of which consults these headers (see
          # RateLimitFilter and docs/decision-log.md).
          trusted-proxies: '127\.0\.0\.1|::1|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}'
          # TWO routes per service, in this order, because the first match wins:
          #   <id>-reads  the idempotent methods, carrying a bounded Retry
          #   <id>        every other method, carrying none
          #
          # The retry is what keeps a downstream instance's disappearance from reaching
          # the caller as a 503: the failed attempt is re-issued, and the second attempt
          # opens a NEW connection, which is resolved and balanced afresh - by kube-proxy
          # across the Service's ready endpoints under Kubernetes (this document is the
          # one the k8s profile uses, with the ConfigMap supplying each ${*_SERVICE_URI}),
          # and by the load balancer's next instance choice under Compose (the profile
          # below, where the uri names the `lb` scheme). On a workstation, where each
          # service is a single process on its own port, a retry re-hits that same port
          # and simply fails again - immediately, because the OS refuses the connection
          # rather than timing out - so it costs nothing there.
          #
          # The split is what keeps the retry safe. The retry filter matches on the
          # EXCEPTION the proxy exchange threw, and the RestClient raises the same
          # ResourceAccessException whether the connection was never established (nothing
          # was delivered, so re-issuing is safe) or the response timed out (the request
          # WAS delivered and may have committed). Retrying a payment or an account update
          # on the second of those could apply it twice, so only methods that are
          # idempotent by contract are retried at all, and a write interrupted by an
          # instance's death correctly surfaces 503 for the caller to decide about.
          # Exception-based retry ignores the filter's own `methods` restriction, which is
          # why the restriction is expressed as a route predicate instead.
          routes:
            - id: auth-service-reads
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/auth/**
                - Method=GET,HEAD,OPTIONS
              filters: &idempotentRetry
                # retries: 2 - enough to pass over one departed instance and, with the
                #   default SERVER_ERROR series, to ride out a single transient 5xx, while
                #   bounding the amplification of a genuine failure at 3x.
                # exceptions: replaces the filter's default set. IOException and
                #   TimeoutException are the defaults, kept because they cost nothing;
                #   ResourceAccessException is the addition that matters - it is what the
                #   RestClient actually raises, and the default set never matched it, since
                #   matching is `Class.isInstance(thrown)` with no cause traversal.
                - name: Retry
                  args:
                    retries: 2
                    exceptions:
                      - org.springframework.web.client.ResourceAccessException
                      - java.io.IOException
                      - java.util.concurrent.TimeoutException
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/auth/**
            - id: user-service-reads
              uri: ${USER_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/users/**
                - Method=GET,HEAD,OPTIONS
              filters: *idempotentRetry
            - id: user-service
              uri: ${USER_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/users/**
            - id: account-service-reads
              uri: ${ACCOUNT_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/accounts/**
                - Method=GET,HEAD,OPTIONS
              filters: *idempotentRetry
            - id: account-service
              uri: ${ACCOUNT_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/accounts/**
            - id: card-service-reads
              uri: ${CARD_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/cards/**
                - Method=GET,HEAD,OPTIONS
              filters: *idempotentRetry
            - id: card-service
              uri: ${CARD_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/cards/**
            - id: transaction-service-reads
              uri: ${TRANSACTION_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/transactions/**
                - Method=GET,HEAD,OPTIONS
              filters: *idempotentRetry
            - id: transaction-service
              uri: ${TRANSACTION_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/transactions/**
            - id: billpay-service-reads
              uri: ${BILLPAY_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/billpay/**
                - Method=GET,HEAD,OPTIONS
              filters: *idempotentRetry
            - id: billpay-service
              uri: ${BILLPAY_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/billpay/**
            - id: reporting-service-reads
              uri: ${REPORTING_SERVICE_URI:http://localhost:8087}
              predicates:
                - Path=/reports/**
                - Method=GET,HEAD,OPTIONS
              filters: *idempotentRetry
            - id: reporting-service
              uri: ${REPORTING_SERVICE_URI:http://localhost:8087}
              predicates:
                - Path=/reports/**
            - id: batch-service-reads
              uri: ${BATCH_SERVICE_URI:http://localhost:8088}
              predicates:
                - Path=/batch/**
                - Method=GET,HEAD,OPTIONS
              filters: *idempotentRetry
            - id: batch-service
              uri: ${BATCH_SERVICE_URI:http://localhost:8088}
              predicates:
                - Path=/batch/**

    # ----------------------------------------------------------------
    # Client-side load balancing. Spring Cloud LoadBalancer's own instance
    # cache is switched OFF because nothing here uses it and, left on, it
    # warns at start-up that a production deployment should add Caffeine.
    # The cache decorates only a supplier assembled through
    # ServiceInstanceListSupplierBuilder.withCaching();
    # UpstreamInstanceSupplierConfiguration returns a bare supplier that keeps
    # its OWN resolution for a bounded interval, so the cache manager would be
    # an unused component and a second, longer-lived copy of the same state -
    # exactly the staleness the short interval exists to avoid.
    loadbalancer:
      cache:
        enabled: false

  # ------------------------------------------------------------------
  # Bounded upstream HTTP client (AVAILABILITY). Spring Cloud Gateway Server
  # WebMVC owns no timeout property of its own: its proxy exchange is built
  # from the Boot-managed RestClient.Builder, and its own
  # GatewayHttpClientEnvironmentPostProcessor drives the SAME
  # spring.http.clients.* namespace (it sets redirects and the imperative
  # factory there). So these two keys are what bound a routed call.
  #
  # Without them the JDK HttpClient waits indefinitely. A downstream that is
  # frozen rather than down - a container paused, a JVM in a stop-the-world
  # pause, a host that black-holes packets - returned NOTHING: a client gave
  # up after 90 seconds while a gateway thread stayed pinned to the dead
  # upstream, and enough of those exhaust the thread pool and take the edge
  # down with it. A refused connection was always answered promptly (503 via
  # UpstreamFailureHandler) because the OS reports it immediately; only the
  # frozen case hung.
  #
  # read-timeout is the ceiling for a whole routed response, so it must stay
  # comfortably above the slowest legitimate call (the 200 ms p95 target of
  # AAP 0.7.1, and the statement/report launches that answer synchronously)
  # while still being a small multiple of it. On expiry the JDK client raises
  # an IOException, Spring wraps it in ResourceAccessException, and
  # UpstreamFailureHandler renders the same bounded 503 + Retry-After a
  # refused connection produces.
  #
  # PROPERTY NAMES: spring.http.clients.* is the Boot 4.1 namespace;
  # spring.http.client.* (singular) is deprecated since Boot 4.0 and binds
  # without effect.
  http:
    clients:
      connect-timeout: ${CARDDEMO_GATEWAY_CONNECT_TIMEOUT:2s}
      read-timeout: ${CARDDEMO_GATEWAY_READ_TIMEOUT:10s}

# --------------------------------------------------------------------
# Session-cookie policy for the shared Spring Session cookie (CWE-614).
# SameSite=Strict: the cookie carries financial authority, so it is never
# sent on a cross-site request. Secure defaults to TRUE; it is switched off
# only where the stack is deliberately served over plain HTTP with no TLS
# terminator in front of it (the local Docker Compose profile sets
# CARDDEMO_COOKIE_SECURE=false), while every TLS-terminated deployment keeps
# the secure default.
# --------------------------------------------------------------------
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: ${CARDDEMO_COOKIE_SECURE:true}
  port: 8080

# --------------------------------------------------------------------
# Observability (AAP 0.7.5). The gateway is the distributed-tracing
# entry point, so it samples at 1.0 locally.
#
# NOTE: do NOT add management.metrics.tags.application here - the shared
# carddemo-common ObservabilityConfig already registers that common tag
# via a MeterRegistryCustomizer; setting it here would duplicate it.
# --------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      # The datastore health contributors are CONDITIONAL: Redis health is switched off
      # in the slice/integration test contexts (spring.autoconfigure.exclude of the Redis
      # auto-configuration, or management.health.redis.enabled=false), and a deployment
      # may legitimately run a service without one of them. Boot's default strict group
      # membership validation aborts context startup when a listed contributor is absent,
      # so it is relaxed here; the groups themselves are asserted at runtime (readiness
      # turns 503 when PostgreSQL or Redis goes away).
      validate-group-membership: false
      # Explicit probe groups. Boot's default readiness group contains only
      # readinessState, so readiness reported UP while PostgreSQL and Redis were both
      # unavailable and Kubernetes kept routing traffic to a pod that could not serve a
      # single datastore-backed request. Readiness now includes this service's actual
      # datastore dependencies, while liveness deliberately stays limited to
      # livenessState: a datastore outage must remove the pod from the Service
      # endpoints, never restart a perfectly healthy container.
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  # Distributed tracing export (AAP 0.7.5). The gateway is the trace entry point, so its
  # sampling DEFAULT stays 1.0, but both the OTLP endpoint and the probability are
  # environment-driven - an operator lowers the sample under load via the env var without
  # rebuilding the image.
  #
  # PROPERTY NAME: 'management.otlp.tracing.endpoint' was REMOVED in Spring Boot 4.0
  # (deprecation level "error", replacement below). Using the old key silently exported
  # nothing, which is one half of why tracing produced no spans at all. The
  # canonical Boot 4.1 key is used here, and the default now points at the OTLP HTTP
  # receiver of the 'jaeger' collector declared in docker-compose.yml / k8s rather than
  # at the container's own loopback.
  # Distributed tracing export. The gateway is the trace entry
  # point, so its sampling DEFAULT stays 1.0, but both the OTLP endpoint and
  # the probability are environment-driven - an operator lowers the
  # sample under load via the env var without rebuilding the image.
  # NOTE: Spring Boot 4 RELOCATED this key. The pre-4.0 form
  # management.otlp.tracing.endpoint was removed in 4.0.0 and is now silently
  # ignored, so the endpoint must be declared under
  # management.opentelemetry.tracing.export.otlp.* to take effect.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

# ---------------------------------------------------------------------
# Structured-logging members.
#
# The Logstash structured format emitted by logback-spring.xml carries the
# message, the level, the logger, the thread and every MDC entry
# (correlationId/traceId/spanId) but NO service identity, so a JSON record
# scraped out of an aggregated log stream could not be attributed to the
# service that produced it - the container name was the only clue, and it is
# absent once records are shipped. `logging.structured.json.add` adds the
# member to every record emitted by Spring Boot's StructuredLogEncoder,
# including the encoder declared explicitly in logback-spring.xml.
# ---------------------------------------------------------------------
logging:
  structured:
    json:
      add:
        service: ${spring.application.name}

# ====================================================================
# Docker Compose profile (SPRING_PROFILES_ACTIVE=docker).
# Redis and every downstream service resolve by compose service DNS on
# their INTERNAL container port 8080. The full route table is repeated
# because Spring replaces (does not merge) the routes list for the
# active profile.
# ====================================================================
---
spring:
  config:
    activate:
      on-profile: docker
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webmvc:
          # Repeated for this profile for the same reason the route table is: Spring
          # REPLACES a list/scalar for the active profile rather than merging it, and the
          # docker topology's legitimate peer (the SPA nginx container on the compose
          # bridge) must stay trusted. Same pattern, same rationale as the default profile.
          trusted-proxies: '127\.0\.0\.1|::1|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}'
          # --------------------------------------------------------------
          # Container route table. Every service is addressed through the `lb`
          # scheme, NOT a fixed authority, because `docker compose up --scale`
          # and a Kubernetes Deployment both put SEVERAL instances behind one
          # name. A fixed authority is resolved once and then kept for the life
          # of the gateway's pooled keep-alive connections: with account-service
          # scaled to 2, 200 authenticated reads were served 200/0 by a single
          # replica while the other sat idle, and stopping the serving replica
          # surfaced HTTP 503 to the caller for ~11 s. `lb://<service>` instead
          # chooses an instance per request, round robin, from the address set
          # UpstreamLoadBalancerConfig resolves from the platform's DNS.
          #
          # TWO routes per service, in this order, because the first match wins:
          #   <id>-reads  the idempotent methods, carrying a bounded Retry
          #   <id>        every other method, carrying none
          #
          # The split is what keeps the retry safe. A retry is what makes a
          # replica's disappearance invisible to the caller: the failed attempt
          # is re-issued and the load balancer's next choice is a live instance.
          # But the retry filter matches on the EXCEPTION the proxy exchange
          # threw, and the RestClient raises the same ResourceAccessException
          # whether the connection was never established (nothing was delivered,
          # so re-issuing is safe) or the response timed out (the request WAS
          # delivered and may have committed). Retrying a payment or an account
          # update on the second of those could apply it twice, so only methods
          # that are idempotent by contract are retried at all, and a write
          # interrupted by a replica's death correctly surfaces 503 for the
          # caller to decide about. Exception-based retry ignores the filter's
          # own `methods` restriction, which is why the restriction is expressed
          # as a route predicate instead.
          #
          # ${*_SERVICE_URI} still overrides a route, so a deployment that
          # fronts a service with its own load balancer points at it directly.
          # --------------------------------------------------------------
          routes:
            - id: auth-service-reads
              uri: ${AUTH_SERVICE_URI:lb://auth-service}
              predicates:
                - Path=/auth/**
                - Method=GET,HEAD,OPTIONS
              filters: &idempotentRetryContainer
                # retries: 2 - enough to pass over one departed replica and, with
                #   the default SERVER_ERROR series, to ride out a single transient
                #   5xx, while bounding the amplification of a genuine failure at 3x.
                # exceptions: replaces the filter's default set. IOException and
                #   TimeoutException are the defaults, kept because they cost nothing;
                #   ResourceAccessException is the addition that matters - it is what
                #   the RestClient actually raises, and the default set never matched
                #   it, since matching is `Class.isInstance(thrown)` with no cause
                #   traversal.
                - name: Retry
                  args:
                    retries: 2
                    exceptions:
                      - org.springframework.web.client.ResourceAccessException
                      - java.io.IOException
                      - java.util.concurrent.TimeoutException
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:lb://auth-service}
              predicates:
                - Path=/auth/**
            - id: user-service-reads
              uri: ${USER_SERVICE_URI:lb://user-service}
              predicates:
                - Path=/users/**
                - Method=GET,HEAD,OPTIONS
              filters: *idempotentRetryContainer
            - id: user-service
              uri: ${USER_SERVICE_URI:lb://user-service}
              predicates:
                - Path=/users/**
            - id: account-service-reads
              uri: ${ACCOUNT_SERVICE_URI:lb://account-service}
              predicates:
                - Path=/accounts/**
                - Method=GET,HEAD,OPTIONS
              filters: *idempotentRetryContainer
            - id: account-service
              uri: ${ACCOUNT_SERVICE_URI:lb://account-service}
              predicates:
                - Path=/accounts/**
            - id: card-service-reads
              uri: ${CARD_SERVICE_URI:lb://card-service}
              predicates:
                - Path=/cards/**
                - Method=GET,HEAD,OPTIONS
              filters: *idempotentRetryContainer
            - id: card-service
              uri: ${CARD_SERVICE_URI:lb://card-service}
              predicates:
                - Path=/cards/**
            - id: transaction-service-reads
              uri: ${TRANSACTION_SERVICE_URI:lb://transaction-service}
              predicates:
                - Path=/transactions/**
                - Method=GET,HEAD,OPTIONS
              filters: *idempotentRetryContainer
            - id: transaction-service
              uri: ${TRANSACTION_SERVICE_URI:lb://transaction-service}
              predicates:
                - Path=/transactions/**
            - id: billpay-service-reads
              uri: ${BILLPAY_SERVICE_URI:lb://billpay-service}
              predicates:
                - Path=/billpay/**
                - Method=GET,HEAD,OPTIONS
              filters: *idempotentRetryContainer
            - id: billpay-service
              uri: ${BILLPAY_SERVICE_URI:lb://billpay-service}
              predicates:
                - Path=/billpay/**
            - id: reporting-service-reads
              uri: ${REPORTING_SERVICE_URI:lb://reporting-service}
              predicates:
                - Path=/reports/**
                - Method=GET,HEAD,OPTIONS
              filters: *idempotentRetryContainer
            - id: reporting-service
              uri: ${REPORTING_SERVICE_URI:lb://reporting-service}
              predicates:
                - Path=/reports/**
            - id: batch-service-reads
              uri: ${BATCH_SERVICE_URI:lb://batch-service}
              predicates:
                - Path=/batch/**
                - Method=GET,HEAD,OPTIONS
              filters: *idempotentRetryContainer
            - id: batch-service
              uri: ${BATCH_SERVICE_URI:lb://batch-service}
              predicates:
                - Path=/batch/**

---
# ---------------------------------------------------------------------------
# Metrics reach Prometheus by scrape (AAP 0.7.5), so the OTLP metrics registry the
# OpenTelemetry starter brings along is switched off; only spans are exported over
# OTLP (see management.opentelemetry.tracing.export.otlp above).
# ---------------------------------------------------------------------------
management:
  otlp:
    metrics:
      export:
        enabled: false
