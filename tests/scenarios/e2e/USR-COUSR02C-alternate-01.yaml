# PF5 on the COUSR02 update screen with nothing changed: COUSR02C refuses to
# save and asks for a change with 'Please modify to update ...'.
#
# Step 1: ADMIN001 signs on through CC00 and COSGN00C routes the type 'A' user
# to COADM01C [app/cbl/COSGN00C.cbl:221-237].
# Step 2: option '3' makes COADM01C XCTL to COUSR02C, the 'User Update
# (Security)' entry of COADM02Y [app/cbl/COADM01C.cbl:115-145]
# [app/cpy/COADM02Y.cpy:34-37]. COADM01C passes only the COCOM01Y COMMAREA, so
# CDEMO-CU02-USR-SELECTED is blank, no user is fetched, and COUSR02C sends
# COUSR02 with every entry field empty and no message, then returns with
# TRANSID CU02 [app/cbl/COUSR02C.cbl:87-105,135-138,266-278].
# Step 3: ENTER with TESTU002 in USRIDIN. PROCESS-ENTER-KEY reads USRSEC by
# that key with UPDATE; on NORMAL, READ-USER-SEC-FILE sends the map with 'Press
# PF5 key to save your updates ...', then the record's names, password and
# type are moved into the map and it is sent again under the same message
# [app/cbl/COUSR02C.cbl:143-172,320-339]. TESTPWD2 is sent into PASSWD too.
# Step 4: PF5 with no field typed. Every COUSR02 entry field is FSET, so the
# terminal returns all of them with the AID, the dark PASSWD among them
# (ATTRB=(DRK,FSET,UNPROT) [app/bms/COUSR02.bms:130-134]): it holds the
# TESTPWD2 that step 3 sent, so the password round-trips unchanged without
# being retyped, and BMS pads each received value with blanks to its field
# length. No field is empty, so UPDATE-USER-INFO reads the record again with
# UPDATE (another 'Press PF5' send), finds the first name, last name, password
# and type each equal to the record, leaves USR-MODIFIED-NO set, issues no
# REWRITE, moves 'Please modify to update ...' to WS-MESSAGE, sets ERRMSG red
# and sends the map a last time with the fields as received
# [app/cbl/COUSR02C.cbl:122-123,177-243]. The screen holds that last send.
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Text values are whole fields at their BMS length with trailing spaces:
#   ERRMSG is the first 78 bytes of the 80-byte WS-MESSAGE.
# - PASSWD is not asserted on the screens: a 3270 screen read does not show a
#   dark field's text. That the password came back as sent is the outcome
#   itself (a differing password would be rewritten) and file_state.
# - The header is POPULATE-HEADER-INFO's: the COTTL01Y titles, CU02, COUSR02C,
#   CURDATE mm/dd/yy and CURTIME hh:mm:ss of the run clock through CSDAT01Y,
#   hence the matchers and clock_mode relative.
# TESTU002 and its names and password are invented data added to the USRSEC
# fixture; the user never signs on.
id: USR-COUSR02C-alternate-01
level: e2e
type: alternate
description: >-
  ADMIN001 signs on, chooses admin menu option 3 'User Update (Security)',
  fetches the invented user TESTU002 on the COUSR02 update screen and presses
  PF5 without changing any field. COUSR02C finds every value equal to the
  USRSEC record, writes nothing and shows 'Please modify to update ...'; USRSEC
  keeps the ten fixture users and TESTU002 as loaded.
inventory_ids:
- INV-USR-040  # COUSR02C message 'Please modify to update ...' (rule)
- INV-USR-003  # COUSR02C program
- INV-MNU-004  # COADM01 map, the admin menu option 3 is entered on
- INV-USR-007  # COUSR02 map, the update screen of steps 2-4
- INV-CFG-025  # CU02 transaction, under which the fetch and the PF5 run
- INV-CFG-008  # USRSEC CSD file, read for update and left unchanged
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA COADM01C passes with the XCTL
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the header date and time
- INV-LAY-008  # CSMSG01Y copybook, copied by COUSR02C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-004  # USR end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    # The ten fixture users, ADMIN001 among them for the sign-on, plus the
    # invented user TESTU002 that the scenario fetches.
    USRSEC:
      base: USRSEC
      records:
      - {SEC-USR-ID: TESTU002, SEC-USR-FNAME: TESTFIRST, SEC-USR-LNAME: TESTLAST,
         SEC-USR-PWD: TESTPWD2, SEC-USR-TYPE: U}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: ADMIN001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '3'}
    '@map': COADM01
  - aid: ENTER
    fields: {USRIDIN: TESTU002}
    '@map': COUSR02
  - aid: PF5
    fields: {}
    '@map': COUSR02
expected:
  screens:
  - '@map': COADM01
    TRNNAME: CA00
    PGMNAME: COADM01C
  - '@map': COUSR02
    TRNNAME: CU02
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COUSR02C
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    USRIDIN: '        '
    FNAME: '                    '
    LNAME: '                    '
    USRTYPE: ' '
    ERRMSG: '                                                                              '
  - '@map': COUSR02
    TRNNAME: CU02
    PGMNAME: COUSR02C
    USRIDIN: TESTU002
    FNAME: 'TESTFIRST           '
    LNAME: 'TESTLAST            '
    USRTYPE: U
    ERRMSG: 'Press PF5 key to save your updates ...                                        '
  - '@map': COUSR02
    TRNNAME: CU02
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COUSR02C
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    USRIDIN: TESTU002
    FNAME: 'TESTFIRST           '
    LNAME: 'TESTLAST            '
    USRTYPE: U
    ERRMSG: 'Please modify to update ...                                                   '
  file_state:
    # No REWRITE is issued: every USRSEC record in key order is as loaded,
    # TESTU002 with its invented names, password and type and a blank FILLER.
    USRSEC:
      records:
      - {SEC-USR-ID: ADMIN001, SEC-USR-FNAME: 'MARGARET            ', SEC-USR-LNAME: 'GOLD                ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: A, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: ADMIN002, SEC-USR-FNAME: 'RUSSELL             ', SEC-USR-LNAME: 'RUSSELL             ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: A, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: ADMIN003, SEC-USR-FNAME: 'RAYMOND             ', SEC-USR-LNAME: 'WHITMORE            ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: A, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: ADMIN004, SEC-USR-FNAME: 'EMMANUEL            ', SEC-USR-LNAME: 'CASGRAIN            ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: A, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: ADMIN005, SEC-USR-FNAME: 'GRANVILLE           ', SEC-USR-LNAME: 'LACHAPELLE          ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: A, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: TESTU002, SEC-USR-FNAME: 'TESTFIRST           ', SEC-USR-LNAME: 'TESTLAST            ', SEC-USR-PWD: TESTPWD2, SEC-USR-TYPE: U, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: USER0001, SEC-USR-FNAME: 'LAWRENCE            ', SEC-USR-LNAME: 'THOMAS              ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: U, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: USER0002, SEC-USR-FNAME: 'AJITH               ', SEC-USR-LNAME: 'KUMAR               ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: U, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: USER0003, SEC-USR-FNAME: 'LAURITZ             ', SEC-USR-LNAME: 'ALME                ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: U, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: USER0004, SEC-USR-FNAME: 'AVERARDO            ', SEC-USR-LNAME: 'MAZZI               ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: U, SEC-USR-FILLER: '                       '}
      - {SEC-USR-ID: USER0005, SEC-USR-FNAME: 'LEE                 ', SEC-USR-LNAME: 'TING                ', SEC-USR-PWD: PASSWORD, SEC-USR-TYPE: U, SEC-USR-FILLER: '                       '}
