  datasets:
    DALYTRAN:
      records:
      - DALYTRAN-ID: '9900000000000202'
        DALYTRAN-TYPE-CD: '01'
        DALYTRAN-CAT-CD: '0001'
        DALYTRAN-SOURCE: POS TERM
        DALYTRAN-DESC: Purchase at Example Store 0202
        DALYTRAN-AMT: '10.00'
        DALYTRAN-MERCHANT-ID: '900000202'
        DALYTRAN-MERCHANT-NAME: Example Store 0202
        DALYTRAN-MERCHANT-CITY: Exampleville
        DALYTRAN-MERCHANT-ZIP: '99999'
        DALYTRAN-CARD-NUM: '9999000011110002'
        DALYTRAN-ORIG-TS: '2022-07-05 09:15:00.000000'
    CARDXREF:
      base: CARDXREF
      records:
      - XREF-CARD-NUM: '9999000011110002'
        XREF-CUST-ID: '000000901'
        XREF-ACCT-ID: '00000000901'
    ACCTDATA:
      base: ACCTDATA
    CUSTDATA:
      base: CUSTDATA
    CARDDATA:
      base: CARDDATA
    TRANSACT:
      records: []
  parameters:
    clock: '2022-07-06 10:00:00.00'
    clock_mode: fixed
  faults: []
inputs:
  program: CBTRN01C
expected:
  return_code: 0
  messages:
  - START OF EXECUTION OF PROGRAM CBTRN01C
  - '9900000000000202010001POS TERM  Purchase at Example Store 0202                                                                      0000000100{900000202Example Store 0202                                Exampleville                                      99999     99990000111100022022-07-05 09:15:00.000000                                              '
  - SUCCESSFUL READ OF XREF
  - 'CARD NUMBER: 9999000011110002'
  - 'ACCOUNT ID : 00000000901'
  - 'CUSTOMER ID: 000000901'
  - INVALID ACCOUNT NUMBER FOUND
  - ACCOUNT 00000000901 NOT FOUND
  - SUCCESSFUL READ OF XREF
  - 'CARD NUMBER: 9999000011110002'
  - 'ACCOUNT ID : 00000000901'
  - 'CUSTOMER ID: 000000901'
  - INVALID ACCOUNT NUMBER FOUND
  - ACCOUNT 00000000901 NOT FOUND
  - END OF EXECUTION OF PROGRAM CBTRN01C
