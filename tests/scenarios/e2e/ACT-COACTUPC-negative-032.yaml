# COACTUPC refuses an Expiry Date month that is not a number: '1A' typed over
# the fetched month gives 'Expiry Date: Month must be a number between 1 and 12.'
# and nothing is rewritten.
#
# Step 1: USER0001 signs on through CC00; COSGN00C routes the type 'U' user to
# the main menu COMEN01 [app/cbl/COSGN00C.cbl:221-237].
# Step 2: option '2' (Account Update) makes COMEN01C XCTL to COACTUPC, which
# takes its fresh-entry path and sends COACTUP with the search-key prompt
# [app/cbl/COMEN01C.cbl:115-156] [app/cbl/COACTUPC.cbl:964-973,2955-2961].
# Step 3: ENTER with account 00000000001. 9000-READ-ACCT reads CXACAIX (card
# 9680294154603697, customer 000000001), ACCTDAT and CUSTDAT, keeps the values
# in ACUP-OLD-DETAILS and sets ACUP-SHOW-DETAILS; 3202-SHOW-ORIGINAL-VALUES
# fills the map, the fetched expiry month is '05', and 3320-UNPROTECT-FEW-ATTRS
# turns every input field's MDT on [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,
# 3441-3562,3608-3884].
# Step 4: ENTER with EXPMON '1A'. 1100-RECEIVE-MAP rebuilds ACUP-NEW-DETAILS
# from the returned fields and 1205-COMPARE-OLD-NEW finds the month changed, so
# 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and edits in field order
# [app/cbl/COACTUPC.cbl:1039-1425,1452-1494]. Account Status, Open Date and
# Credit Limit pass with the fetched values. 'Expiry Date' goes to
# WS-EDIT-VARIABLE-NAME and 20251A20 to WS-EDIT-DATE-CCYYMMDD; EDIT-YEAR-CCYY
# accepts 2025. EDIT-MONTH first tests WS-VALID-MONTH, an 88-level 1 THROUGH 12
# on the PIC 9(2) redefinition of the month, then FUNCTION TEST-NUMVAL of the
# text [app/cpy/CSUTLDPY.cpy:91-147] [app/cpy/CSUTLDWY.cpy:16-20]. The numeric
# value of '1A' is 11 whether the compare uses the digit nibbles (PACK gives
# +11) or the bytes (x'F1C1' lies between '01' and '12'), so the range test
# passes, and TEST-NUMVAL('1A') is not 0: this is the month-numeric branch,
# which composes FUNCTION TRIM(WS-EDIT-VARIABLE-NAME) and ': Month must be a
# number between 1 and 12.' into the empty WS-RETURN-MSG
# [app/cpy/CSUTLDPY.cpy:126-141]. Day 20 passes; EDIT-DAY-MONTH-YEAR leaves the
# routine because the month flag is not valid, so CSUTLDTC is not called for
# this date [app/cpy/CSUTLDPY.cpy:150-279]. The later edits all pass for this
# customer and leave the message unchanged, because each composes only while
# WS-RETURN-MSG is empty. 2000-DECIDE-ACTION continues on ACUP-CHANGES-NOT-OK
# [app/cbl/COACTUPC.cbl:2596-2597], 3203-SHOW-UPDATED-VALUES echoes the received
# values, 3250-SETUP-INFOMSG gives PROMPT-FOR-CHANGES, and 3390 makes F12=Cancel
# bright while F5=Save stays dark [app/cbl/COACTUPC.cbl:2870-2981,3566-3581].
# No READ UPDATE or REWRITE runs on this path.
#
# Expected values are derived from the source; no TPE region runs in CI.
# - Text values are whole fields at their BMS length with trailing spaces:
#   ERRMSG is the 75-byte WS-RETURN-MSG padded to 78, INFOMSG the 40-byte
#   WS-INFO-MSG padded to 45 [app/cbl/COACTUPC.cbl:462-480,2979-2981].
# - Amounts are shown through WS-EDIT-CURRENCY-9-2-F, PIC +ZZZ,ZZZ,ZZZ.99, once
#   their edit has passed [app/cbl/COACTUPC.cbl:370-371,2874-2909].
# - AADDGRP shows ACCT-GROUP-ID, blank in every repository account
#   (GAP-DEF-005): the blank returned field becomes LOW-VALUES, sent as nulls
#   and shown as spaces [app/cbl/COACTUPC.cbl:1213-1218,2921].
# - The header is 3100-SCREEN-INIT's: the COTTL01Y titles, CAUP, COACTUPC and
#   CURDATE mm/dd/yy and CURTIME hh:mm:ss of the region clock through CSDAT01Y,
#   hence the matchers and clock_mode relative [app/cbl/COACTUPC.cbl:2668-2692].
id: ACT-COACTUPC-negative-032
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main menu option 2 'Account Update', fetches
  account 00000000001 and types '1A' over the expiry month 05. COACTUPC finds
  the month not numeric and keeps the update screen with the values entered,
  the prompt 'Update account details presented above.' and the message
  'Expiry Date: Month must be a number between 1 and 12.'; ACCTDAT and CUSTDAT
  are not updated.
# Primary item first, then the program, the maps the steps enter on and land
# on, the transaction the fetch and the edit run under, the CSD files the fetch
# reads, and the online-only copybooks COACTUPC copies. The sign-on items are
# verified by the SEC-COSGN00C scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-090  # COACTUPC Expiry Date: month numeric (rule)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, the screen option 2 is entered on
- INV-ACT-004  # COACTUP map, the account update screen of steps 2-4
- INV-CFG-009  # CAUP transaction, under which the fetch and the edit run
- INV-CFG-006  # CXACAIX CSD file, the cross-reference path read by account id
- INV-CFG-001  # ACCTDAT CSD file, read by the fetch and left unchanged
- INV-CFG-005  # CUSTDAT CSD file, read by the fetch and left unchanged
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA carrying the fetched values between steps
- INV-LAY-005  # COTTL01Y copybook, TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y copybook, CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y copybook, copied by COACTUPC
- INV-LAY-007  # CSLKPCDY copybook, the phone area code and state tables of the later edits
- INV-LAY-009  # CSMSG02Y copybook, the abend data COACTUPC copies
- INV-LAY-010  # CSSETATY copybook, the field attribute setting of 3300
- INV-LAY-011  # CSSTRPFY copybook, the AID mapping that turns ENTER into CCARD-AID-ENTER
- INV-LAY-013  # CSUTLDPY copybook, EDIT-MONTH and its month-numeric message
- INV-LAY-014  # CSUTLDWY copybook, WS-EDIT-DATE-MM and WS-VALID-MONTH
- INV-LAY-019  # CVCRD01Y copybook, CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived from the source, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY tests the month with IS NUMERIC instead of TEST-NUMVAL and
# drops FUNCTION TRIM from the field name of the composed message, so a unikix
# run never verifies this item while that entry is open.
- GAP-DOC-024
# Not in the planned gap list. The Open Date edit runs before Expiry Date and
# calls CSUTLDTC, so the expected message rests on CEEDAYS accepting 20141120
# (GAP-INF-001); the UniKix copy changes code step 4 passes through: CSUTLDTC's
# Vstring lengths for that call (GAP-DOC-021), COACTUPC's amount receive,
# change detection and Credit Limit edit (GAP-DOC-022), and COACTUP's row 1,
# where TRNNAME is asserted (GAP-DOC-025).
- GAP-INF-001
- GAP-DOC-021
- GAP-DOC-022
- GAP-DOC-025
preconditions:
  datasets:
    # The 10 repository users, for the USER0001 sign-on.
    USRSEC: {base: USRSEC}
    # Account 00000000001 and its cross-reference record (card 9680294154603697,
    # customer 000000001, read through the CXACAIX path) as in the repository.
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented values that pass every edit of
    # 1200-EDIT-MAP-INPUTS, so the Expiry Date month is the only field refused.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
        CUST-ADDR-ZIP: '27601'
        CUST-PHONE-NUM-1: '(919)555-0101'
        CUST-PHONE-NUM-2: '(919)555-0102'
        CUST-SSN: '123456789'
        CUST-GOVT-ISSUED-ID: TESTGOVT0001
        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: 'Y'
        CUST-FICO-CREDIT-SCORE: '700'
  parameters:
    clock_mode: relative
  faults: []
# PASSWORD is the documented demo password of README.md, not a secret.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: USER0001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '2'}
    '@map': COMEN01
  - aid: ENTER
    fields: {ACCTSID: '00000000001'}
    '@map': COACTUP
  # '1A', not a value such as 'B5': 'B5' is 25 as a number, so the range test
  # before TEST-NUMVAL would refuse it and the month-numeric branch would never
  # run. Both branches show the same text, so only the input decides which
  # predicate the scenario verifies.
  - aid: ENTER
    fields: {EXPMON: '1A'}
    '@map': COACTUP
