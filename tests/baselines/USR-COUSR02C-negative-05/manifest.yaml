# Manifest of the derived baseline of USR-COUSR02C-negative-05: ADMIN001
# fetches the invented user TESTU002 on COUSR02, erases the password and
# presses PF5, which gives 'Password can NOT be empty...' and leaves USRSEC
# unchanged. Only unikix can run the scenario, so expected.yaml was authored
# from the source, not captured (GAP-INF-004, GAP-INF-012). It names no
# execution_id or execution_fingerprint and holds no datasets/ until an
# eligible UniKix run is imported (report.py --import-unikix).
#
# source_identity.units are the app/ units the four steps execute, not only
# COUSR02C's: harness.results.source_identity gives a steps scenario no units,
# so each program the steps pass through is listed with its COPY closure
# (inventory_tools.copy_closure) and the BMS source of its map, as in the
# sibling USR-COUSR02C manifests. COSGN00C signs ADMIN001 on and routes it to
# the admin menu [app/cbl/COSGN00C.cbl:221-237], COADM01C XCTLs option 3 to
# COUSR02C [app/cbl/COADM01C.cbl:115-145], and COUSR02C fetches the user and
# refuses the save [app/cbl/COUSR02C.cbl:143-245]. DFHAID and DFHBMSCA are
# CICS-supplied and not in the repository. source_commit is HEAD at authoring;
# app/ is byte-identical to the suite's starting commit.
