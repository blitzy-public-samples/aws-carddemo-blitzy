# COACTUPC refuses an account update whose Open Date year is blanked: the
# year-supplied predicate of EDIT-YEAR-CCYY, which COACTUPC copies from the
# procedure copybook CSUTLDPY [app/cbl/COACTUPC.cbl:4232].
#
# Steps 1-3 reach the fetched account as ACT-COACTUPC-alternate-04 does:
# USER0001 signs on, chooses main-menu option 2 and asks for account
# 00000000001, whose cross-reference (card 9680294154603697, customer
# 000000001, line 49 of app/data/ASCII/cardxref.txt), account and customer are
# read and shown, every editable field unprotected with MDT on
# [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3500-3561,3608-3884].
# Step 4 erases the Open Date year and presses ENTER; OPNMON and OPNDAY keep
# the fetched 11 and 20. The tpe adapter clears a field with EraseEOF and types
# nothing for an empty value, so OPNYEARI arrives as nulls (or spaces), and
# 1100-RECEIVE-MAP leaves ACUP-NEW-OPEN-YEAR at LOW-VALUES
# [app/cbl/COACTUPC.cbl:1144-1149].
# - The task starts with WS-RETURN-MSG cleared [app/cbl/COACTUPC.cbl:876].
#   1205-COMPARE-OLD-NEW finds the open date changed, 1200-EDIT-MAP-INPUTS sets
#   ACUP-CHANGES-NOT-OK, Account Status Y passes, and the Open Date edit
#   performs EDIT-DATE-CCYYMMDD THRU EDIT-DATE-CCYYMMDD-EXIT with 'Open Date'
#   in WS-EDIT-VARIABLE-NAME [app/cbl/COACTUPC.cbl:1460-1482,1684-1704].
# - EDIT-YEAR-CCYY finds the year LOW-VALUES, sets INPUT-ERROR and
#   FLG-YEAR-BLANK, and composes FUNCTION TRIM('Open Date') followed by
#   ' : Year must be supplied.' into WS-RETURN-MSG [app/cpy/CSUTLDPY.cpy:25-42].
#   The month and day edits pass, and EDIT-DAY-MONTH-YEAR leaves the range
#   because the date flags are not all valid, so CSUTLDTC is not called for
#   this date [app/cpy/CSUTLDPY.cpy:91-207,274-278].
# - Every later edit passes on the invented customer below, and each composed
#   message is guarded by WS-RETURN-MSG-OFF, so the Open Date message is the
#   one shown [app/cbl/COACTUPC.cbl:1484-1676].
# - 2000-DECIDE-ACTION only continues on ACUP-CHANGES-NOT-OK, so nothing is
#   read for update or rewritten [app/cbl/COACTUPC.cbl:2596-2597].
# - 3203-SHOW-UPDATED-VALUES shows the received values, the amounts re-edited
#   through +ZZZ,ZZZ,ZZZ.99; 3250-SETUP-INFOMSG shows PROMPT-FOR-CHANGES and the
#   message; 3320-UNPROTECT-FEW-ATTRS keeps the fields editable; CSSETATY for
#   OPEN-YEAR turns OPNYEAR red and moves '*' into it, because the year flag is
#   blank on a re-entry; 3390-SETUP-INFOMSG-ATTRS makes F12=Cancel bright on a
#   change and leaves F5=Save dark [app/cbl/COACTUPC.cbl:2718-2720,2870-2981,
#   2998-3000,3213-3218,3566-3581] [app/cpy/CSSETATY.cpy:17-26].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   ERRMSG is the 34-character message in the 75-byte WS-RETURN-MSG, moved to
#   the 78-byte ERRMSGO; INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte
#   INFOMSGO; OPNYEAR is '*' in the 4-byte field.
# - FKEY05 keeps its INITIAL text, dark (ASKIP,DRK), which the s3270 capture
#   renders as blanks.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
# - The UniKix copy of CSUTLDPY drops FUNCTION TRIM from the field name, so on
#   UniKix the message carries 'Open Date' padded to 25 characters before
#   ' : Year must be supplied.' (GAP-DOC-024); this scenario pins the app/
#   text.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, as in the other COACTUPC update scenarios: the repository record has
# FICO 274 and zip 12546, which a later edit would also refuse
# [app/cbl/COACTUPC.cbl:2514-2558]. Account 00000000001 and its cross-reference
# stay as in the repository.
id: ACT-COACTUPC-negative-012
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001 (opened 2014-11-20), erases the Open Date year and
  presses ENTER. COACTUPC refuses the change with 'Open Date : Year must be
  supplied.' in the message line, keeps the screen editable with
  'Update account details presented above.', marks the blank year with '*',
  and offers F12=Cancel. Nothing is written: ACCTDATA and CUSTDATA still hold
  the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-070  # COACTUPC Open Date: year supplied (EDIT-YEAR-CCYY, rule)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the red attribute and '*' of the blank year
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-YEAR-CCYY and the other date edits
- INV-LAY-014  # CSUTLDWY: the date-edit work areas and flags
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-DOC-024  # the UniKix CSUTLDPY drops TRIM from the field name in this message
# The UniKix COACTUPC comments out the TEST-NUMVAL-C amount checks whose flags
# decide how screen 4 re-edits the amounts.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
    # scenarios; the 168-byte FILLER keeps the repository record's spaces.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '000000001'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
        CUST-ADDR-ZIP: '27601'
        CUST-PHONE-NUM-1: (919)555-0101
        CUST-PHONE-NUM-2: (919)555-0102
        CUST-SSN: '123456789'
        CUST-GOVT-ISSUED-ID: TESTGOVT0001
        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: Y
        CUST-FICO-CREDIT-SCORE: '700'
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
# PASSWORD is the documented demo password of README.md, not a secret.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  # The year erased; OPNMON and OPNDAY are left as fetched (11 and 20).
  - aid: ENTER
    '@map': COACTUP
    fields:
      OPNYEAR: ''
