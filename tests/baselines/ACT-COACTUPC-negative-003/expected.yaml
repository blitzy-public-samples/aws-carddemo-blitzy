# Derived baseline of scenario ACT-COACTUPC-negative-003: USER0001 signs on,
# takes main menu option 2 to COACTUPC (CAUP), fetches account 00000000001 on
# COACTUP and presses ENTER without changing any field. Authored from the
# source, never captured:
# - app/cbl/COSGN00C.cbl:221-237 (type U routed to COMEN01C) and
#   app/cbl/COMEN01C.cbl:236-252 with app/cpy/COMEN02Y.cpy:31-35 (OPTN002
#   '02. Account Update'; option 2 -> COACTUPC);
# - app/cbl/COACTUPC.cbl:964-973 (fresh entry: COACTUP from a cleared map,
#   blank ACCTSID and ERRMSG) and 2955-2983 (3250-SETUP-INFOMSG: the
#   PROMPT-FOR-SEARCH-KEYS text, then PROMPT-FOR-CHANGES once
#   ACUP-SHOW-DETAILS holds [468-471]);
# - app/cbl/COACTUPC.cbl:2568-2580,3608-3644,3801-3884 (the fetch:
#   9000-READ-ACCT, 9500-STORE-FETCHED-DATA keeps the old values) and
#   2698-2865 (3200-SETUP-SCREEN-VARS: ACCTSID from CC-ACCT-ID and
#   3202-SHOW-ORIGINAL-VALUES, the amounts edited by WS-EDIT-CURRENCY-9-2-F
#   PIC +ZZZ,ZZZ,ZZZ.99 [371]);
# - app/cbl/COACTUPC.cbl:3441-3561 (3310/3320 send every field with its MDT
#   on, DFHBMFSE or DFHBMPRF, so the unchanged ENTER returns each value as
#   sent), 1039-1425 (1100-RECEIVE-MAP), 1681-1775 (1205-COMPARE-OLD-NEW
#   finds every field equal and sets NO-CHANGES-DETECTED [491-492]), 1452-1468
#   (1200 skips every field edit), 2585-2591 (2000-DECIDE-ACTION keeps
#   ACUP-SHOW-DETAILS) and 2981 (WS-RETURN-MSG X(75) to ERRMSGO X(78));
# - no READ UPDATE or REWRITE runs on this path, so ACCTDATA and CUSTDATA hold
#   the records the scenario's preconditions load, 50 each;
# - header fields from app/cbl/COACTUPC.cbl:2668-2692 with app/cpy/COTTL01Y.cpy
#   and app/cpy/CSDAT01Y.cpy.
# Open under GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012
# (online-only copybooks). Only `report.py --import-unikix` replaces it, from
# imported UniKix evidence (MINOR bump when the decoded outcome is equal,
# MAJOR when it differs); it is never edited by hand to match a run.
# One screen per step, each the screen shown after the step's AID; messages
# holds each step's ERRMSG. Text is full BMS field width with trailing spaces.
# CURDATE and CURTIME come from the region clock, which UniKix cannot fix,
# hence the matchers.
