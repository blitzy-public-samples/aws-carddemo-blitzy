# An AID key other than ENTER, PF3 and PF4 on the Bill Payment screen.
# USER0001 signs on through CC00 and reaches the main menu COMEN01; option '10'
# is 'Bill Payment', so COMEN01C sets CDEMO-PGM-CONTEXT to 0 and transfers
# control with XCTL to CDEMO-MENU-OPT-PGMNAME(10) = 'COBIL00C'
# [app/cbl/COMEN01C.cbl:115-156] [app/cpy/COMEN02Y.cpy:80-84]. COMEN01C passes
# only the COCOM01Y COMMAREA, so the group MOVE into COBIL00C's longer
# CARDDEMO-COMMAREA pads CDEMO-CB00-TRN-SELECTED with spaces and no account is
# looked up. On that first entry COBIL00C sets CDEMO-PGM-REENTER, clears
# COBIL0AO to LOW-VALUES, sends COBIL00 with its own header and a blank message
# line, and returns with TRANSID(CB00) and the COMMAREA
# [app/cbl/COBIL00C.cbl:37-39,63-72,107-124,146-149]. PF5 then starts CB00
# again with that COMMAREA: COBIL00C receives the map, EVALUATE EIBAID handles
# only ENTER, PF3 and PF4, and WHEN OTHER sets WS-ERR-FLG and moves
# CCDA-MSG-INVALID-KEY of CSMSG01Y to WS-MESSAGE; SEND-BILLPAY-SCREEN rebuilds
# the header from COTTL01Y and CSDAT01Y and moves the message to ERRMSG
# [app/cbl/COBIL00C.cbl:125-142,289-339] [app/cpy/CSMSG01Y.cpy:20-21].
# PROCESS-ENTER-KEY is never reached, so ACCTDAT, CXACAIX and TRANSACT are
# neither read nor written: the scenario loads only the sign-on user and
# asserts no file_state.
# ACTIDIN, CURBAL and CONFIRM are not asserted: on this path they are whatever
# the received map held, sent back unchanged because COBIL0AO redefines
# COBIL0AI, and carry no business outcome.
# Text fields are compared at their full BMS length with trailing spaces:
# ERRMSG is 78 bytes, the 40-character message followed by spaces from the
# 80-byte WS-MESSAGE. CURDATE and CURTIME come from the region clock, hence the
# matchers and clock_mode relative. The baseline is derived from the source:
# no TPE region runs in CI.
id: BIL-COBIL00C-negative-01
level: e2e
type: negative
description: >-
  USER0001 signs on, selects option 10 'Bill Payment' on the main menu and
  presses PF5 on the empty Bill Payment screen COBIL00. COBIL00C accepts only
  ENTER, PF3 and PF4, so it sends COBIL00 again with its header (CB00,
  COBIL00C, the titles, the run date and time) and 'Invalid key pressed.
  Please see below...' in the message line; no account is read and no payment
  is made.
# The sign-on step's own items (COSGN00, CC00, USRSEC) and the option-10
# navigation belong to the SEC and MNU scenarios.
inventory_ids:
- INV-BIL-003  # COBIL00C message 'Invalid key pressed. Please see below...' (rule)
- INV-BIL-001  # COBIL00C program
- INV-MNU-003  # COMEN01 map, the main menu option 10 is entered on
- INV-BIL-002  # COBIL00 map, the screen PF5 is pressed on and sent again
- INV-CFG-012  # CB00 transaction, under which PF5 is processed
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA that makes the PF5 entry a reentry
- INV-LAY-005  # COTTL01Y copybook, TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y copybook, CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y copybook, CCDA-MSG-INVALID-KEY
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-008  # BIL end-to-end baselines derived from the source, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    # COSGN00C reads the sign-on user USER0001; this path reads nothing else.
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: USER0001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '10'}
    '@map': COMEN01
  - aid: PF5
    fields: {}
    '@map': COBIL00
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    ERRMSG: '                                                                              '
  - '@map': COBIL00
    TRNNAME: CB00
    PGMNAME: COBIL00C
    ERRMSG: '                                                                              '
  - '@map': COBIL00
    TRNNAME: CB00
    PGMNAME: COBIL00C
    TITLE01: '      AWS Mainframe Modernization       '
    TITLE02: '              CardDemo                  '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    ERRMSG: 'Invalid key pressed. Please see below...                                      '
  # One ERRMSG value per step: blank on the main menu and on the first Bill
  # Payment screen, the invalid-key message after PF5.
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'Invalid key pressed. Please see below...                                      '
