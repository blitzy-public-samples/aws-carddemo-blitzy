# Derived baseline, authored from the source and never observed: ENTER on
# COUSR01 with First Name, Last Name, User ID and User Type filled but no
# Password re-sends COUSR01 with 'Password can NOT be empty...' and skips the
# USRSEC WRITE [app/cbl/COUSR01C.cbl:136-141,153-160,184-196]. Field values
# are full BMS width with trailing spaces; only CURDATE and CURTIME, from the
# region clock, are matchers.
# file_state.USRSEC is the 10 fixture users exactly, in key order, so it also
# shows TESTU001 was not added. SEC-USR-PWD 'PASSWORD' is the documented demo
# password of the fixture data [README.md:157-158], not a secret: replacing it
# would make the unchanged file fail the comparison.
file_state:
  USRSEC:
  - SEC-USR-FILLER: '                       '
    SEC-USR-FNAME: 'MARGARET            '
    SEC-USR-ID: ADMIN001
    SEC-USR-LNAME: 'GOLD                '
    SEC-USR-PWD: PASSWORD
    SEC-USR-TYPE: A
