        TRNX-ID: '9900000000000701'
        TRNX-TYPE-CD: '01'
        TRNX-CAT-CD: '0001'
        TRNX-SOURCE: POS TERM
        TRNX-DESC: Synthetic statement line one
        TRNX-AMT: '25.00'
        TRNX-MERCHANT-ID: '900000701'
        TRNX-MERCHANT-NAME: Synthetic Store One
        TRNX-MERCHANT-CITY: Testville
        TRNX-MERCHANT-ZIP: '00000'
        TRNX-ORIG-TS: '2022-07-05 09:00:00.000000'
        TRNX-PROC-TS: '2022-07-05-10.00.00.000000'
