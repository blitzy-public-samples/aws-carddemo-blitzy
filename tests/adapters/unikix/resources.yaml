# The transient data queue CORPT00C writes its job to: dct.lst line 1, and the CSD's DEFINE TDQUEUE(JOBS)
# TYPE(EXTRA) DDNAME(INREADER) RECORDSIZE(80) [app/csd/CARDDEMO.CSD:499-505]. On z/OS the queue feeds the
# internal reader; on UniKix the records are observed as the job BPE receives (@TDQ:JOBS, GAP-MIS-017).
tdq:
  name: JOBS
  definition: 'ED,JOBS,,,,JOB           ,80,Y,O'
  record_length: 80
  csd: true

# -------------------------------------------------------------------------------------------------------------
# transactions: the 18 pct.lst entries in file order, transaction id -> program. They equal the 18 CSD
# TRANSACTION definitions [app/csd/CARDDEMO.CSD:306-488].
# -------------------------------------------------------------------------------------------------------------
transactions:
  CA00: {program: COADM01C}
  CAUP: {program: COACTUPC}
  CAVW: {program: COACTVWC}
  CB00: {program: COBIL00C}
  CC00: {program: COSGN00C}
  CCDL: {program: COCRDSLC}
  CCLI: {program: COCRDLIC}
  CCUP: {program: COCRDUPC}
  CDV1:
    program: COCRDSEC
    activation: unreachable
    gap_ids: [GAP-DOC-001]
    notes: >-
      COCRDSEC has no source in app/cbl or in the copy's migrated_app/cbl; pct.lst and ppt.lst define it as the
      CSD does, so entering CDV1 cannot reach a program.
  CM00: {program: COMEN01C}
  CR00: {program: CORPT00C}
  CT00: {program: COTRN00C}
  CT01: {program: COTRN01C}
  CT02: {program: COTRN02C}
  CU00: {program: COUSR00C}
  CU01: {program: COUSR01C}
  CU02: {program: COUSR02C}
  CU03: {program: COUSR03C}


# -------------------------------------------------------------------------------------------------------------
# jobs: the 29 jobs of app/jcl, run from the copy's members, and TRNRPT00, the job CORPT00C writes to JOBS.
# The copy-only member MFCATLG1 is not a CardDemo job and is not listed. Keys are the scenario job names.
#   member          the copy member (no extension), deployed to $PR/jcl/jmvs/<NAME>; null for TRNRPT00, which
#                   bpe.py generates from `template`
#   card_name       the job name on the member's JOB card, which BPE reports
#   steps           every executed step in JCL order: {name, exec, proc?, cond?, parm?}. exec is the EXEC
#                   operand of the executed step (PGM=<x>); proc the procedure the step comes from; cond and
#                   parm verbatim. COND is evaluated by BPE, never by the adapter: a step BPE does not run
#                   produces no STEP line.
#   programs        the application programs the steps run (migrated_app/cbl/<P>.cbl), for the source
#                   identity; utilities (IDCAMS, SORT, IEBGENER, IEFBR14) are the installation's
#   procs, ctl      the copy's proc/<P> and ctl/<C> members the job uses
#   region_actions  the CEMT SET FIL commands of the job's SDSF steps: {step, action: close|open, files}
#
# Step names are the names bpe.py writes in `messages` as STEP <name> RC <nnnn> or STEP <name> ABEND. A job
# step keeps its own name; a step inside a procedure is named by the job step and every procedure step above
# it, joined with dots (STEP05R.PRC001, STEP10.STEP01R.PRC001), even when the procedure has a single step.
# These are the step names of tests/adapters/gnucobol_batch/jobs.yaml, so that both adapters write the same
# STEP lines for the same job; bpe.py reports each step BPE ran under the name listed here, in this order.
# Duplicate step names are kept as the JCL writes them (DEFCUST, TRANREPT; GAP-DEF-009).
# -------------------------------------------------------------------------------------------------------------
jobs:

  ACCTFILE:
    member: jcl/ACCTFILE
    card_name: ACCTFILE
    steps:
    - {name: STEP05, exec: PGM=IDCAMS}
    - {name: STEP10, exec: PGM=IDCAMS}
    - {name: STEP15, exec: PGM=IDCAMS}
    programs: []
    procs: []
    ctl: []
    region_actions: []

  CARDFILE:
    member: jcl/CARDFILE
    card_name: CARDFILE
    steps:
    - {name: CLCIFIL, exec: PGM=SDSF}
    - {name: STEP05, exec: PGM=IDCAMS}
    - {name: STEP10, exec: PGM=IDCAMS}
    - {name: STEP15, exec: PGM=IDCAMS}
    - {name: STEP40, exec: PGM=IDCAMS}
    - {name: STEP50, exec: PGM=IDCAMS}
    - {name: STEP60, exec: PGM=IDCAMS}
    - {name: OPCIFIL, exec: PGM=SDSF}
    programs: [SDSF]
    procs: []
    ctl: []
    region_actions:
    - {step: CLCIFIL, action: close, files: [CARDDAT, CARDAIX]}
    - {step: OPCIFIL, action: open, files: [CARDDAT, CARDAIX]}
    gap_ids: [GAP-DOC-031, GAP-MIS-011]
    notes: &sdsf_noop >-
      The copy's SDSF.cbl only displays DUMMY PROGRAM FOR SDSF and returns, so on UniKix the CEMT SET FIL
      commands of the SDSF steps are never performed (GAP-DOC-031). The adapter controls region files through
