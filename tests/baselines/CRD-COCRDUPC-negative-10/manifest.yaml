# Manifest of the derived baseline of CRD-COCRDUPC-negative-10: USER0001 signs
# on, takes menu option 5 to the COCRDUP card update screen and presses ENTER
# with account 00000000050 and card 9999999999999999; 9100-GETCARD-BYACCTCARD
# reads CARDDAT by the card number alone, the card master holds no such card,
# and the NOTFND answer gives 'Did not find cards for this search condition'
# [app/cbl/COCRDUPC.cbl:203-204,1376-1401]. Only unikix can run the scenario,
# so expected.yaml is authored from the source and is inferred-not-observed
# (GAP-INF-006, GAP-INF-012). It names no execution_id or execution_fingerprint
# and holds no datasets/ until report.py --import-unikix promotes an eligible
# UniKix run.
#
# source_identity.units are every app/ unit the three steps execute: the COPY
# closure (inventory_tools.copy_closure) of COSGN00C, which signs USER0001 on
# and XCTLs to COMEN01C [app/cbl/COSGN00C.cbl:230-240]; of COMEN01C, whose
# option 5 XCTLs to COCRDUPC [app/cpy/COMEN02Y.cpy:49-53]
# [app/cbl/COMEN01C.cbl:145-155]; and of COCRDUPC, which performs the lookup
# [app/cbl/COCRDUPC.cbl:268-359,1528]; plus the BMS sources of their maps
# COSGN00, COMEN01 and COCRDUP. DFHAID and DFHBMSCA are CICS-supplied, not app/
# sources. source_commit is HEAD at authoring; app/ is byte-identical to the
# suite's starting commit 93ebec71ff7b59a68cedd7c501afe496a8eaa68d.
