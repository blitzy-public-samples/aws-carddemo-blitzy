  # ------------------------------------------------------------------------- #
  # Notification service. Three listeners read transaction.posted, fraud.assessed
  # and customer.context-changed, each on a consumer group of its own. It publishes
  # no domain event, routes exhausted failures to source-specific dead-letter topics
  # and calls no other service.
  # ------------------------------------------------------------------------- #
  notification-service:
    # The tag this image carries once built. One tag serves the three places that name
    # it: .github/workflows/ci.yml builds it, this file runs it, and deploy/k8s names it
    # with imagePullPolicy Never. The version is the Maven project version, so an image
    # built from another version is never mistaken for this one. Compose builds the image
    # from the context below when the tag is absent locally, and no registry holds it.
    image: carddemo/notification-service:1.0.0-SNAPSHOT
    build:
      # This directory, because the builder stage of the Dockerfile compiles the module
      # from source and needs the aggregator descriptor and both shared libraries in
      # reach. services/notification-service/Dockerfile.dockerignore reduces what is sent
      # to exactly that, and no host archive is used or required.
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: card-platform${CLONE_INDEX:-}-notification-service
    environment:
      <<: *service-environment
      # sslmode=require encrypts this connection. The compose server presents a
      # certificate it generated for itself, so there is no authority to verify it
      # against and verify-full would refuse it. deploy/k8s/30-configmap.yaml uses
      # verify-full, because a cluster has a certificate authority and a network path
      # worth protecting; here the whole path is one Docker bridge on one machine.
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:-carddemo_notification}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${NOTIFICATION_DB_NAME:-carddemo_notification}?currentSchema=${NOTIFICATION_DB_SCHEMA:-notification_service}&sslmode=require
      # This service's own login. It owns carddemo_notification and can connect to no other database:
      # the provisioning program revokes CONNECT from PUBLIC on every one of the six.
      SPRING_DATASOURCE_USERNAME: ${NOTIFICATION_DB_USER:-carddemo_notification_svc}
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD must be set; copy .env.example to .env and give this service its own password}
      SPRING_FLYWAY_SCHEMAS: ${NOTIFICATION_DB_SCHEMA:-notification_service}
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${NOTIFICATION_DB_SCHEMA:-notification_service}
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ${NOTIFICATION_DB_SCHEMA:-notification_service}
      # This service's own broker identity. The entries the broker installs for it
      # cover exactly what its configuration names: three topics under three groups of
      # its own, and no business-event publish. An entry naming another service's group
      # is absent, so a compromise here cannot take another listener's partitions. A
      # username is not a credential and carries a fallback; the password carries none.
      KAFKA_SASL_USERNAME: ${NOTIFICATION_KAFKA_USER:-carddemo-notification}
      KAFKA_SASL_PASSWORD: ${NOTIFICATION_KAFKA_PASSWORD:?NOTIFICATION_KAFKA_PASSWORD must be set; copy .env.example to .env and give this service its own broker password}
      # One group per listener. Two listeners sharing one group would split the
      # messages between them, so each carries its own. The first group below is the
      # framework default a listener falls back to when it names no group.
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${GROUP_NOTIFICATION_POSTED:-notification-posted}
      TOPIC_TRANSACTION_AUTHORIZED: ${TOPIC_TRANSACTION_AUTHORIZED:-transaction.authorized}
      GROUP_NOTIFICATION_AUTHORIZED: ${GROUP_NOTIFICATION_AUTHORIZED:-notification-authorized}
      GROUP_NOTIFICATION_POSTED: ${GROUP_NOTIFICATION_POSTED:-notification-posted}
      GROUP_NOTIFICATION_FRAUD: ${GROUP_NOTIFICATION_FRAUD:-notification-fraud}
      GROUP_NOTIFICATION_CUSTOMER: ${GROUP_NOTIFICATION_CUSTOMER:-notification-customer}
      TOPIC_TRANSACTION_POSTED: ${TOPIC_TRANSACTION_POSTED:-transaction.posted}
      TOPIC_FRAUD_ASSESSED: ${TOPIC_FRAUD_ASSESSED:-fraud.assessed}
      TOPIC_CUSTOMER_CONTEXT_CHANGED: ${TOPIC_CUSTOMER_CONTEXT_CHANGED:-customer.context-changed}
      TOPIC_DEAD_LETTER: ${TOPIC_DEAD_LETTER:-carddemo.dead-letter}
      CONSUMER_MAX_RETRY_ATTEMPTS: ${CONSUMER_MAX_RETRY_ATTEMPTS:-3}
      CONSUMER_RETRY_BACKOFF_MS: ${CONSUMER_RETRY_BACKOFF_MS:-1000}
      RETENTION_SWEEP_INTERVAL_MS: ${RETENTION_SWEEP_INTERVAL_MS:-3600000}
      STATEMENT_RETENTION_DAYS: ${STATEMENT_RETENTION_DAYS:-400}
      NOTIFICATION_LOG_RETENTION_DAYS: ${NOTIFICATION_LOG_RETENTION_DAYS:-90}
    ports:
      # Both mappings bind the loopback address. The service port carries the
      # Representational State Transfer (REST) surface; the management port
      # carries /actuator and reaches no further than this machine.
      - "127.0.0.1:${NOTIFICATION_PORT:-8084}:8080"
      - "127.0.0.1:${NOTIFICATION_MANAGEMENT_PORT:-9084}:${MANAGEMENT_PORT:-9080}"
    # Read-only root filesystem, with the same size-limited in-memory /tmp the
    # authorization service above documents.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    # This service runs three listeners.
    depends_on: *database-and-broker
    healthcheck: *actuator-healthcheck
    networks:
      - carddemo
    restart: unless-stopped

