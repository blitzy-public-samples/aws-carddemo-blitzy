      - '9900000000000752 Synthetic statement line before close two        $       10.00 '
      - '--------------------------------------------------------------------------------'
      - 'Total EXP:                                                        $       20.00 '
      - '********************************END OF STATEMENT********************************'
    HTMLFILE:
