# Derived baseline of scenario ACT-COACTUPC-negative-054 (capture_platform
# derived, tag inferred-not-observed), authored from the app/ source and never
# captured: no TPE region runs in CI. It pins the accepting outcome of the
# Reissue Date EDIT-DATE-LE predicate (observed-only, GAP-UNC-017): no date is
# known that passes the COBOL edits yet draws a nonzero CEEDAYS severity, so
# the composed refusal 'Reissue Date validation error Sev code: <WS-SEVERITY>
# Message code: <WS-MSG-NO>' is not asserted [app/cpy/CSUTLDPY.cpy:284-321].
# - Steps 1-3: USER0001 signs on, takes main-menu option 2 (OPTN002), and
#   ENTER with account 00000000001 shows the account and the invented customer
#   000000001 with 'Update account details presented above.'; F5 and F12 stay
#   dark and are captured as blanks [app/cbl/COACTUPC.cbl:2787-2865,
#   2955-2981,3566-3584].
# - Step 4: 2024/02/29 over the reissue date (2025-05-20) is received into
#   ACUP-NEW-REISSUE-DATE [app/cbl/COACTUPC.cbl:1188-1210]. 1200-EDIT-MAP-INPUTS
#   passes Account Status, Open Date, Credit Limit, Expiry Date and Cash Credit
#   Limit, then edits 'Reissue Date' [app/cbl/COACTUPC.cbl:1429-1507]: year 2024
#   (century 20), month 02 and day 29 pass, and in EDIT-DAY-MONTH-YEAR the
#   February 29th divides 2024 by 4 (WS-EDIT-DATE-YY-N 24 is not 0) with
#   remainder 0 [app/cpy/CSUTLDPY.cpy:18-282]. EDIT-DATE-LE calls CSUTLDTC
#   with mask YYYYMMDD; severity 0 sets no error [app/cpy/CSUTLDPY.cpy:284-330].
#   Every later edit passes on the invented customer, so
#   ACUP-CHANGES-OK-NOT-CONFIRMED stands and ENTER without PF5 rewrites nothing
#   [app/cbl/COACTUPC.cbl:1509-1676,2583-2621].
# - 3203-SHOW-UPDATED-VALUES shows the date as typed and the amounts re-edited
#   through +ZZZ,ZZZ,ZZZ.99; 3250 moves the X(40) 'Changes validated.Press F5 to
#   save' to the 45-byte INFOMSG and the blank X(75) WS-RETURN-MSG to the
#   78-byte ERRMSG; 3390 makes F5=Save and F12=Cancel bright
#   [app/cbl/COACTUPC.cbl:2870-2952,2955-2983,3566-3584].
# Why acceptance is only inferred (GAP-INF-001, GAP-MIS-010): CSUTLDTC
# declares LS-DATE and LS-DATE-FORMAT PIC X(10) and passes LENGTH OF (10) to
# CEEDAYS [app/cbl/CSUTLDTC.cbl:83-117], while CSUTLDPY passes the 8-byte
# WS-EDIT-DATE-CCYYMMDD and WS-DATE-FORMAT [app/cpy/CSUTLDWY.cpy:4-36,58-62].
# CEEDAYS thus reads '20240229' followed by the first two bytes of
# WS-EDIT-DATE-BINARY (zero from INITIALIZE WS-MISC-STORAGE, since only the
# later Date of Birth edit sets it) and 'YYYYMMDD' followed by the two spaces
# INITIALIZE leaves in WS-SEVERITY [app/cbl/COACTUPC.cbl:865-867]
# [app/cpy/CSUTLDPY.cpy:290,345]. How a real CEEDAYS treats that is
# unobserved. The UniKix copy trims the lengths (GAP-DOC-021) and changes
# CSUTLDPY (GAP-DOC-024), COACTUPC (GAP-DOC-022) and COACTUP row 1
# (GAP-DOC-025), so a unikix record is UniKix-copy behaviour: it never verifies
# the app/ items and `report.py --import-unikix` must not promote this file.
# Values are whole BMS fields with trailing spaces kept; CURDATE and CURTIME
# come from the region clock, hence matchers (clock_mode relative). file_state
# holds the materialized fixtures decoded through CVACT01Y and CVCUS01Y,
# unchanged because nothing is saved before PF5. Open under GAP-INF-005 and
# GAP-INF-012.
