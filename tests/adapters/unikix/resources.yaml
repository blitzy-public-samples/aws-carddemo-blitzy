  # The job CORPT00C writes to JOBS for a report request: //STEP10 EXEC PROC=TRANREPT, with in-stream
  # overrides of STEP05R.SYMNAMES and STEP10R.DATEPARM. It resolves the copy's proc TRANREPT, whose header
  # reads //TRANREPT PROC and whose STEP01R calls EXEC REPROC, where app/proc/TRANREPT.prc reads //REPROC PROC
  # and EXEC PROC=REPROC (GAP-DOC-028).
  TRNRPT00:
    generated: true
    member: null
    card_name: TRNRPT00
    steps:
    - {name: STEP10.STEP01R.PRC001, exec: PGM=IDCAMS, proc: REPROC}
    - {name: STEP10.STEP05R, exec: PGM=SORT, proc: TRANREPT}
    - {name: STEP10.STEP10R, exec: PGM=CBTRN03C, proc: TRANREPT}
    programs: [CBTRN03C]
    procs: [TRANREPT, REPROC]
    ctl: [REPROCT]
    region_actions: []
    gap_ids: [GAP-DOC-028]
    notes: >-
      The copy's proc TRANREPT sorts with SORT FIELDS=(TRAN-CARD-NUM,A) and INCLUDE COND on the SYMNAMES, which
      this job replaces in-stream, and writes TRANSACT.DALY with DCB=(LRECL=350,RECFM=FB,BLKSIZE=0) in place of
      DCB=(*.SORTIN).
    # The 80-column records CORPT00C writes to JOBS, in order [app/cbl/CORPT00C.cbl:84-127]. {start} and {end}
    # are YYYY-MM-DD dates filled with str.format; bpe.py pads each record to 80 bytes. CORPT00C writes the
    # /*EOF record too: its loop writes each record after testing it for /*EOF [app/cbl/CORPT00C.cbl:497-505].
    template:
    - "//TRNRPT00 JOB 'TRAN REPORT',CLASS=A,MSGCLASS=0,"
    - "// NOTIFY=&SYSUID"
    - "//*"
    - "//JOBLIB JCLLIB ORDER=('AWS.M2.CARDDEMO.PROC')"
    - "//*"
    - "//STEP10 EXEC PROC=TRANREPT"
    - "//*"
    - "//STEP05R.SYMNAMES DD *"
    - "TRAN-CARD-NUM,263,16,ZD"
    - "TRAN-PROC-DT,305,10,CH"
    - "PARM-START-DATE,C'{start}'"
    - "PARM-END-DATE,C'{end}'"
    - "/*"
    - "//STEP10R.DATEPARM DD *"
    - "{start} {end}"
    - "/*"
    - "/*EOF"
