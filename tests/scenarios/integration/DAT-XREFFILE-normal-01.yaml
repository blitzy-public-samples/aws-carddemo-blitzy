# The XREFFILE job rebuilds the card cross-reference KSDS and its account-id
# alternate index from the sequential copy [app/jcl/XREFFILE.jcl:22-103]:
# - STEP05 deletes the cluster and the alternate index; each DELETE is followed
#   by IF MAXCC LE 08 THEN SET MAXCC = 0, so a missing entry (condition code 8)
#   leaves the step at RC 0 [app/jcl/XREFFILE.jcl:22-31];
# - STEP10 defines the cluster, KEYS(16 0) RECORDSIZE(50 50) [app/jcl/XREFFILE.jcl:36-53];
# - STEP15 REPROs the sequential copy into it [app/jcl/XREFFILE.jcl:57-65];
# - STEP20 defines the alternate index on XREF-ACCT-ID, KEYS(11,25)
#   NONUNIQUEKEY UPGRADE [app/jcl/XREFFILE.jcl:69-83];
# - STEP25 defines the path over it and STEP30 builds it with BLDINDEX
#   [app/jcl/XREFFILE.jcl:87-103].
#
# CARDXREF-PS is the 50 repository records of app/data/ASCII/cardxref.txt, each
# 36-character line padded with spaces to the 50-byte CVACT03Y record, followed
# by two invented records on account 00000000001 (customer 000000001): cards
# 9900000000000001 and 9900000000000002. The repository holds one card per
# account, so these give account 1 three cards with its repository card
# 9680294154603697 and make it the one duplicate of the NONUNIQUEKEY alternate
# key. Both sort above the highest repository card, 9805583408996588, so the
# REPRO input stays in ascending primary-key order.
# CARDXREF exists before the job with one invented record (card
# 9999999999999902, customer 999999902, account 99999999902) that the input
# does not hold: its absence afterwards shows that STEP05 and STEP10 recreate
# the cluster rather than REPRO merging into the old one. The cluster exists
# without an alternate index, so STEP05's second DELETE finds nothing and its
# condition code 8 is reset.
#
# Expected values were observed on gnucobol-batch (GnuCOBOL 3.2 with the
# IDCAMS replacement, GAP-STB-005, and Berkeley DB files, GAP-STB-010). IDCAMS
# writes only SYSPRINT, so messages hold just the step lines. CARDXREF is
# compared in card-number (primary-key) order and @AIX:CXACAIX, the records
# read through the CXACAIX path [app/csd/CARDDEMO.CSD:63-65], in account-id
# order. Account 1's three cards come back in card-number order
# (9680294154603697, 9900000000000001, 9900000000000002), as observed, so the
# duplicate order is pinned.
#
# Only the job item is listed. The AIX, PATH and BLDINDEX JCL-semantics item is
# listed by DAT-XREFFILE-alternate-01, which only unikix runs; listing it here
# would remove gnucobol-batch's capability (scenarios.jcl_semantics_items).
# Nothing here depends on the clock, and the scenario declares clock_mode
# relative because unikix can run it without clock control (GAP-MIS-015).
id: DAT-XREFFILE-normal-01
level: integration
type: normal
description: >-
  XREFFILE deletes and redefines the card cross-reference KSDS, loads the 50
  repository records and two invented cards on account 1 into it, and builds
  the account-id alternate index and path: every step ends with RC 0, the
  stale pre-existing record is gone, the KSDS holds the 52 records in
  card-number order, and the path reads them in account-id order, account 1's
  three cards in card-number order.
inventory_ids:
- INV-DAT-025  # XREFFILE job
tags: []
gap_ids:
- GAP-STB-005  # IDCAMS replacement: DELETE, DEFINE CLUSTER/AIX/PATH, REPRO, BLDINDEX, IF MAXCC
- GAP-STB-009  # catalog emulation: the cluster, AIX and path entries the job deletes and defines
- GAP-STB-010  # Berkeley DB indexed files in place of the VSAM KSDS, AIX and path
preconditions:
  datasets:
    # Two invented records (no real person, account or card) on account 1: the
    # alternate key XREF-ACCT-ID is NONUNIQUEKEY and the repository has one card
    # per account, so these give account 1 three cards and pin the duplicate
    # order in @AIX:CXACAIX.
    CARDXREF-PS:
      base: CARDXREF-PS
      records:
      - {XREF-CARD-NUM: '9900000000000001', XREF-CUST-ID: '000000001', XREF-ACCT-ID: '00000000001'}
      - {XREF-CARD-NUM: '9900000000000002', XREF-CUST-ID: '000000001', XREF-ACCT-ID: '00000000001'}
    CARDXREF:
      records:
      - {XREF-CARD-NUM: '9999999999999902', XREF-CUST-ID: '999999902', XREF-ACCT-ID: '99999999902'}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  job: XREFFILE
expected:
  return_code: 0
  messages:
  - STEP STEP05 RC 0000
  - STEP STEP10 RC 0000
  - STEP STEP15 RC 0000
  - STEP STEP20 RC 0000
  - STEP STEP25 RC 0000
  - STEP STEP30 RC 0000
