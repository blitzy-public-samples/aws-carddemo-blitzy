# Derived baseline of scenario CRD-COCRDUPC-normal-02: USER0001 signs on, takes
# main menu option 5 'Credit Card Update', fetches account 00000000050 and card
# 0500024453765740 on COCRDUP (transaction CCUP), changes the embossed name to
# 'TEST HOLDER', gets 'Changes validated.Press F5 to save' and saves with PF5:
# 'Changes committed to database'. Authored from the source, never captured:
# - app/cbl/COSGN00C.cbl:225-240 (type U -> COMEN01C) and app/cbl/COMEN01C.cbl:
#   115-156,236-252 with app/cpy/COMEN02Y.cpy:49-53 (option 5 text, XCTL to
#   COCRDUPC with CDEMO-FROM-PROGRAM COMEN01C and CDEMO-PGM-CONTEXT 0);
# - app/cbl/COCRDUPC.cbl: 388-399,502-511 (fresh entry; 3200 skips the fields
#   on CDEMO-PGM-ENTER, so ACCTSID and CARDSID stay LOW-VALUES, captured as
#   spaces); 535-543,641-716 and 948-967 (fetch through 1210/1220 and
#   9000-READ-DATA, the name converted to upper case [1356-1360]);
#   806-945 (step 4 passes the name, status, month and year edits);
#   988-1001,1420-1521 (PF5: READ UPDATE, 9300 finds the record as fetched,
#   REWRITE of CARD-UPDATE-RECORD); 1082-1129 (3200-SETUP-SCREEN-VARS);
#   1138-1163 (3250 INFOMSG, the 40-byte WS-INFO-MSG, and the blank 75-byte
#   WS-RETURN-MSG in the 80-byte ERRMSG); 1315-1317 (FKEYSC bright only while
#   PROMPT-FOR-CONFIRMATION); field widths from app/bms/COCRDUP.bms and
#   app/bms/COMEN01.bms; header from app/cpy/COTTL01Y.cpy and
#   app/cpy/CSDAT01Y.cpy, the run-clock fields as matchers.
# Step 5 shows the values received with the PF5 ('TEST HOLDER'), not the
# fetched ones: CCUP-CHANGES-MADE includes 'C' (CCUP-CHANGES-OKAYED-AND-DONE)
# [app/cbl/COCRDUPC.cbl:278-281], so 3200's WHEN CCUP-CHANGES-MADE is taken
# ahead of its WHEN OTHER [app/cbl/COCRDUPC.cbl:1113-1129].
# EXPDAY is ATTRB=(DRK,FSET,PROT) and is captured blank; being FSET, its hidden
# '09' returns with every AID and ends up in the rewritten expiry date.
# file_state.CARDDATA holds the 50 cards in key order by their named fields;
# the other 49 are as loaded from app/data/ASCII/carddata.txt. Card
# 0500024453765740 is CARD-UPDATE-RECORD as 9200-WRITE-PROCESSING builds it
# [app/cbl/COCRDUPC.cbl:1461-1475]. Its CVV is the three spaces of
# CCUP-NEW-CVV-CD, which only INITIALIZE CCUP-NEW-DETAILS sets
# [app/cbl/COCRDUPC.cbl:586,1464-1465], pinned as raw 202020 where the fixture
# had 747. Its 59-byte FILLER is not asserted: INITIALIZE CARD-UPDATE-RECORD
# skips FILLER, so the REWRITE writes whatever the COMMAREA carried there
# [app/cbl/COCRDUPC.cbl:314-321,1461], a value no source fixes; asserting it
# would add a check the scenario does not make.
# Open under GAP-INF-006 (derived CRD end-to-end baselines) and GAP-INF-012
# (online-only copybooks). Only `report.py --import-unikix` promotes it, from
# imported UniKix evidence; it is never edited by hand to match a run.
