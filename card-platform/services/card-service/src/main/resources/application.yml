# Runtime configuration for card-service. One document, no profile.
#
# Rationale for every value here: card-platform/docs/decision-log.md

server:
  # Port inside the container. docker-compose.yml publishes it on a host port.
  port: 8080

  # Forwarded headers are not trusted, and this line says so rather than leaving it to a default.
  # The shipped posture is direct Transport Layer Security: a caller reaches this container, or the
  # cluster Service in front of it, and nothing between them rewrites the address or the host.
  # config/RequestRateCeilingFilter keys its ceilings on the peer address and
  # config/CrossSiteRequestFilter compares Origin against the host the request arrived on, so
  # honouring X-Forwarded-For here would move both onto a value the caller supplies: every request
  # would look like one source, and a forged Origin would compare equal.
  # A deployment that does terminate at a proxy activates the trusted-proxy profile, which is
  # application-trusted-proxy.yml beside this file. SERVER_FORWARD_HEADERS_STRATEGY overrides this
  # value the way any environment variable overrides a bound property, and the profile exists
  # because the strategy alone is not enough: it has to be the strategy that checks who forwarded.
  forward-headers-strategy: none

  # Transport Layer Security for the Representational State Transfer surface, off in the
  # shipped file and on in the cluster. The compose stack runs every service on one
  # Docker bridge on one machine and publishes each port on the loopback address alone.
  # A cluster pod network is a shared path, so deploy/k8s/30-configmap.yaml sets
  # SERVER_SSL_ENABLED to true and names the keystore deploy/k8s/31-secret.example.yaml
  # templates.
  #
  # Every value below carries a default, and the keystore password defaults to empty
  # rather than absent. Enabling the first key without the other three is what fails,
  # loudly, at start-up.
  ssl:
    enabled: "${SERVER_SSL_ENABLED:false}"
    key-store: "${SERVER_SSL_KEYSTORE:}"
    key-store-type: "${SERVER_SSL_KEYSTORE_TYPE:PKCS12}"
    key-store-password: "${SERVER_SSL_KEYSTORE_PASSWORD:}"

spring:
  application:
    name: card-service

  # This service's own database, carddemo_card, holding the one card schema this
  # service owns. It reaches no other database and no other schema.
  datasource:
    # sslmode=require encrypts this connection and stops the driver from falling back to
    # cleartext. It does not verify the certificate, since a direct run has no
    # certificate authority to verify against. The compose stack overrides this whole URL
    # with the same mode, against a server presenting a certificate it generated for
    # itself. deploy/k8s/30-configmap.yaml overrides it with verify-full, because a
    # cluster has an authority.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${CARD_DB_NAME:carddemo_card}?currentSchema=${CARD_DB_SCHEMA:card_service}&sslmode=require}
    # This service's own login, which owns one database on the compose path and one schema on
    # the cluster path. The superuser is not the default here. A login name is not a
    # credential and carries a default; the password below carries none.
    username: ${SPRING_DATASOURCE_USERNAME:${CARD_DB_USER:carddemo_card_svc}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:3000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:2000}
      # Sized for the work that holds a connection at once, rather than left at the pool
      # default of ten: the relay pass; the retention sweep, which may spend thirty seconds on
      # a table; and eight for the list, read and update routes. This module registers no
      # listener, so it has no consumer threads to size for. A request that finds no free
      # connection waits out connection-timeout above and is then refused, so the pool is
      # deliberately smaller than carddemo.api.rate-limit.concurrent-requests and requests
      # queue on it under a burst.
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      # The pool keeps as many idle connections as its maximum unless told otherwise, so the
      # six services would hold their whole maxima open against a server admitting one
      # hundred while nothing was happening. Connections above this floor are opened when
      # they are asked for and closed again when they fall idle.
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:4}

  flyway:
    enabled: true
    schemas: ${SPRING_FLYWAY_SCHEMAS:${CARD_DB_SCHEMA:card_service}}
    default-schema: ${SPRING_FLYWAY_DEFAULT_SCHEMA:${CARD_DB_SCHEMA:card_service}}
    # Flyway creates the schema named above, then applies db/migration in version order.
    create-schemas: true
    baseline-on-migrate: false
    validate-on-migrate: true

  # Jakarta Persistence (JPA) checks the entity mapping against the migrated schema at
  # boot and writes no Data Definition Language (DDL). A mapping that disagrees with the
  # migration stops start-up. Statement logging stays off, so no bind parameter reaches
  # the log.
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:${CARD_DB_SCHEMA:card_service}}
        auto_quote_keyword: true

  # messaging/EventPublisherPort.java passes a topic, a key and a payload, all strings.
  #
  # value-serializer writes bytes and validates nothing, which is correct here and is
  # not the whole story. The payload this service publishes is already-validated text.
  # outbox/OutboxWriter.java writes every card event through
  # CardUpdated.toValidatedJson(), which serializes through
  # com.carddemo.events.serde.JsonSchemaValidatingSerializer, the one publish-side gate
  # of this platform. That gate screens the document for a forbidden property and for a
  # card number in free text, checks it against schemas/card-updated-v1.json, and refuses
  # one wider than the 8192-byte platform ceiling; the writer reports its refusal as an
  # IllegalArgumentException, so a payload the contract refuses leaves the request's
  # transaction able to roll back with no row stored. That text is what the outbox_event
  # payload column stores, held there to the 4000-character guard
  # entity/OutboxEventEntity.java applies, and messaging/KafkaEventPublisher.java checks
  # it again through com.carddemo.events.serde.EventJsonValidator before it reaches the
  # broker. Neither serializer below carries any validation responsibility, and none is
  # claimed for them.
  #
  # messaging/KafkaEventPublisher.java also reads the seven producer settings back at
  # construction and stops start-up unless every one holds. The key serializer takes the
  # account identifier as text, so XREF-ACCT-ID PIC 9(11) at app/cpy/CVACT03Y.cpy:L7
  # keeps its leading zero.
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}}
    admin:
      operation-timeout: ${SPRING_KAFKA_ADMIN_OPERATION_TIMEOUT:3s}

    # Broker authentication. The broker requires a Simple Authentication and Security
    # Layer (SASL) identity on every client listener, and its authorizer refuses any
    # operation no access control entry allows. This service therefore reaches exactly
    # the topics and the consumer group its own configuration names.
    # docker-compose.yml installs that matrix at broker start and
    # deploy/k8s/10-kafka.yaml installs the same one.
    #
    # SASL_PLAINTEXT authenticates without encrypting, and is the shipped default the
    # compose stack runs. The broker publishes on the loopback address alone, and every
    # service reaches it across one Docker bridge on one machine.
    # deploy/k8s/30-configmap.yaml sets SASL_SSL instead, because a cluster pod network
    # is a shared path, and supplies the truststore by environment as
    # SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION and _PASSWORD. Those two keys are
    # absent here.
    security:
      protocol: "${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}"
    properties:
      # Hostname verification, stated rather than inherited. The client default is https,
      # and a default is a thing a library may change; a broker whose certificate names another
      # host is refused because this line says so. It applies to the producer, the consumer and
      # the admin client, and it does nothing under SASL_PLAINTEXT, where there is no
      # certificate to verify. deploy/k8s/30-configmap.yaml sets SASL_SSL, and that is the
      # profile this line exists for.
      ssl.endpoint.identification.algorithm: https
      sasl.mechanism: "${KAFKA_SASL_MECHANISM:PLAIN}"
      # A username is not a credential and carries a default. The password carries none,
      # so an unset variable stops start-up rather than presenting a password this
      # repository publishes. card-platform/.env.example documents both.
      sasl.jaas.config: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_SASL_USERNAME:carddemo-card}"
        password="${KAFKA_SASL_PASSWORD}";
    # The four timeouts below are one budget, and outbox/OutboxRelay is why. A sweep bounds itself
    # with carddemo.outbox.relay.max-duration-ms so a broker that accepts a connection and never
    # answers cannot hold the scheduled thread. A send the sweep gave up on that the producer still
    # holds is delivered later, and the sweep's own retry then publishes the same event a second
    # time, so one send has to resolve inside the sweep that issued it. The producer takes at most
    # max.block.ms to admit a record and delivery.timeout.ms to place it, and that total sits under
    # max-duration-ms. 2000 + 2000 = 4000 against 5000. A test asserts the relationship, so raising
    # one of them means raising the deadline too. Kafka also requires delivery.timeout.ms to be at
    # least linger.ms + request.timeout.ms, which is why linger.ms is declared here rather than
    # inherited.
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # The largest request this producer may send, aligned to the governed event ceiling.
        # libs/event-contracts EventWireBounds.MAX_EVENT_BYTES refuses a value above 8192 bytes
        # before it reaches an outbox row, so 16384 is two envelopes: one record, its key and its
        # headers, with room for the batch that carries it. Below the envelope a record the gate
        # accepted would fail at the send; far above it a bug could put megabytes on a partition.
        # The broker's own message.max.bytes is 32768, so a request this size always fits.
        max.request.size: 16384
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 2000
        request.timeout.ms: 2000
        linger.ms: 0
        max.block.ms: 2000
    # This module registers no listener, and it needs none. Its two copies of state are
    # the card table, which it owns outright, and the card_xref replica, which no event
    # this platform publishes can change: every column of app/cpy/CVACT03Y.cpy is a card
    # number, a customer identifier or an account identifier, and no event carries a full
    # card number or a customer identifier. The replica is not left to drift for that
    # reason. V2__seed.sql puts the opening state there and
    # domain/CardCrossReferenceReconciler reconciles the row of every card this service
    # updates, inside the same transaction that saves the card row: it confirms an
    # agreeing mapping, corrects a diverged one against CARD-ACCT-ID PIC 9(11) at
    # app/cpy/CVACT02Y.cpy:L6, and reports a card number holding no row rather than
    # inventing the mandatory XREF-CUST-ID it cannot know. Three counters on
    # config/ObservabilityConfig carry those three outcomes. A card this service never
    # updates is never compared, which is the residual the reconciler does not close and
    # docs/suggested-next-tasks.md records.
    #
    # The two settings below still hold the platform acknowledgement discipline, so a
    # listener added later inherits it rather than choosing it: a listener commits its
    # own offset, after its own writes commit. manual_immediate commits the moment the
    # listener acknowledges. Plain manual queues the acknowledgement until the whole
    # poll batch finishes, so a crash mid-batch redelivers work this service already
    # committed.
    consumer:
      enable-auto-commit: false
      properties:
        # The fetch ceilings, the read side of the same ladder: 8192 governed envelope, 16384
        # producer request, 32768 broker message, 65536 one partition, 262144 one fetch. A
        # partition ceiling of eight envelopes bounds the memory one poll can hold while still
        # returning a batch, and Kafka returns an oversized first batch regardless, so no record
        # this platform publishes can wedge a consumer.
        max.partition.fetch.bytes: 65536
        fetch.max.bytes: 262144
    listener:
      ack-mode: manual_immediate
      # Declared for the same reason as the two settings above: a listener added later reads
      # one thread per partition rather than the framework default of one thread for every
      # partition of its topic. Every topic of this platform ships three partitions, from
      # KAFKA_TOPIC_PARTITIONS in card-platform/.env.example, and the group assignor gives one
      # partition to exactly one thread, so records of one account stay in publish order.
      concurrency: ${SPRING_KAFKA_LISTENER_CONCURRENCY:3}

  # The scheduler behind both @Scheduled methods of this service, outbox/OutboxRelay and
  # domain/RetentionSweep. The framework's pool holds one thread, so the hourly sweep — up to
  # thirty seconds a table — delayed every relay pass that fell inside it, and a relay pass is
  # due every 500 ms. A thread for each task removes that wait. Fixed-delay scheduling measures
  # the next run from the end of the previous one, so no task overlaps itself however many
  # threads the pool holds.
  task:
    scheduling:
      pool:
        size: ${SPRING_TASK_SCHEDULING_POOL_SIZE:2}
      thread-name-prefix: carddemo-scheduling-

# Properties this module owns. The first topic below carries a card update, and a card
# list or a card read publishes nothing. The second carries the terminal diagnostic the
# outbox relay publishes for a row it abandoned. docker-compose.yml creates both topics
# and grants this service a producer entry on each. The outbox relay sweeps on the delay
# below, which @EnableScheduling on CardApplication.java activates. This module registers
# no listener, so it carries no retry setting: a delivery attempt count belongs to the
# service that consumes.
carddemo:
  # Refuse oversized declared bodies before Jackson reads them, and apply the shared stream
  # constraints to a chunked request that declares no length.
  api:
    max-request-body-bytes: ${API_MAX_REQUEST_BODY_BYTES:65536}
    # Cross-site protection. config/CrossSiteRequestFilter refuses a state-changing request
    # that declares a foreign Sec-Fetch-Site, names an Origin other than this service, or
    # carries no value under the header below. An HTML form cannot set a header at all, and a
    # cross-origin script call that set one would need a preflight no chain here grants, so the
    # header is what separates a first-party client from a page replaying a cached credential.
    # The name is not a secret. Change it only together with every client that sets it.
    cross-site:
      required-header: ${API_CROSS_SITE_HEADER:X-CardDemo-Request}
    # Request-rate ceilings. config/RequestRateCeilingFilter runs ahead of the security chain
    # and refuses with 429 plus Retry-After. Every ceiling is counted over one fixed window.
    #
    # requests-per-window applies twice, once keyed by source address and once by the identity
    # the credential names, so one credential spread across many addresses is bounded too.
    # write-requests-per-window is the stricter ceiling on POST, PUT, PATCH and DELETE.
    # authentication-failures-per-window is the credential-guessing control: past it a source
    # is refused for the rest of the window, and only a request that carried a credential and
    # was answered 401 counts. concurrent-requests bounds requests in flight.
    #
    # The counters live in one process, so several replicas bound each replica rather than the
    # service as a whole. card-platform/docs/suggested-next-tasks.md records the shared-store
    # ceiling a deployment beyond a demo wants.
    rate-limit:
      window-seconds: ${API_RATE_WINDOW_SECONDS:60}
      requests-per-window: ${API_RATE_REQUESTS_PER_WINDOW:600}
      write-requests-per-window: ${API_RATE_WRITE_REQUESTS_PER_WINDOW:120}
      authentication-failures-per-window: ${API_RATE_AUTHENTICATION_FAILURES_PER_WINDOW:20}
      concurrent-requests: ${API_RATE_CONCURRENT_REQUESTS:64}
  kafka:
    topics:
      card-updated: ${TOPIC_CARD_UPDATED:card.updated}
      # The one shared dead-letter topic. This module registers no listener, so no
      # record of its own is ever dead-lettered on consumption. outbox/OutboxRelay
      # publishes one governed DeadLetterEnvelope here for a row it has abandoned
      # after the ten attempts OutboxEventEntity.MAX_DELIVERY_ATTEMPTS allows, which
      # is the one record of an event this service gave up on. The publish is
      # awaited by messaging/KafkaEventPublisher, so a broker that
      # refuses it rolls the sweep back and the row is offered again rather than
      # left terminal with no diagnostic anywhere.
      dead-letter: ${TOPIC_DEAD_LETTER:carddemo.dead-letter}
  outbox:
    relay:
      fixed-delay-ms: ${OUTBOX_RELAY_INTERVAL_MS:500}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:100}
      # A relay instance names itself in outbox_event.claimed_by, so a claim can be traced to a
      # process and a claim a dead process left behind can be recovered. Distinct per replica.
      instance-id: ${OUTBOX_RELAY_INSTANCE_ID:${HOSTNAME:card-relay}}
      # How long a claim stands before another sweep treats the claiming instance as dead and
      # returns the row to PENDING. Also caps the retry backoff, so a row the broker keeps
      # refusing is always claimable again within one timeout.
      claim-timeout: ${OUTBOX_RELAY_CLAIM_TIMEOUT:PT2M}
      # Longest one send waits for the broker before messaging/KafkaEventPublisher fails the stage
      # it returned. The row then stays unpublished and the next sweep claims it again, so a slow
      # broker delays an event and never loses one. The producer window above resolves a send well
      # inside this bound, and max-duration-ms below bounds the sweep before either of them.
      publish-timeout: ${OUTBOX_RELAY_PUBLISH_TIMEOUT:PT10S}
      # One sweep publishes what it claimed and waits for each acknowledgement. This deadline bounds
      # the whole sweep on the monotonic clock, rather than letting batch-size sends each take
      # the producer window in turn. A sweep that reaches it stops, and the rows it did not reach
      # are claimed by the next sweep.
      max-duration-ms: ${OUTBOX_RELAY_MAX_DURATION_MS:5000}
    # domain/RetentionSweep removes only published rows after this diagnostic horizon.
    published-retention-hours: ${OUTBOX_PUBLISHED_RETENTION_HOURS:168}
  # Duplicate-delivery claims are permanent. A claim and the side effects it guards commit in
  # one local transaction in one database, so the two can only be restored together, and a
  # security review found the horizon that used to expire a claim shorter than the effects it
  # guarded. Nothing here retires a claim, domain/RetentionSweep no longer names
  # processed_event, and the migration that withdrew the horizon states the whole rule.
  retention:
    sweep-interval-ms: ${RETENTION_SWEEP_INTERVAL_MS:3600000}
  # Bound on how long each locked read of one update waits for a row another writer holds.
  # PostgreSQL waits forever by default, so a contended update held its request open for as long as
  # the other writer held the row and the documented lock-failure answer was unreachable through
  # contention. Applied as a transaction-local lock_timeout, so it governs the locked reads of one
  # update and never a schema migration or the relay sweep.
  write:
    lock-wait-ms: ${WRITE_LOCK_WAIT_MS:3000}

# /actuator answers on this port and never on the service port above. The Dockerfile
# health check and docker-compose.yml both read /actuator/health on it, and
# docker-compose.yml publishes it on the loopback address alone.

  # Request identities. config/SecurityConfig maps each entry onto one Spring Security
  # user. Start-up fails when this list is empty, rather than running with no identity
  # at all.
  #
  # password holds an ALREADY-ENCODED value carrying its algorithm prefix, for example
  # {bcrypt}$2a$10$... A plaintext value authenticates nothing, so this platform does
  # not reproduce the plaintext comparison at app/cbl/COSGN00C.cbl:L223.
  # card-platform/.env.example documents the three variables and how to generate a
  # hash. None of them holds a usable default, so an unset variable stops start-up.
  #
  # role is ADMIN, USER or MONITORING. ADMIN and USER are the two outcomes of the
  # SEC-USR-TYPE fork at app/cbl/COSGN00C.cbl:L232-L236. MONITORING is additive: it
  # reaches the metrics and Prometheus endpoints on the management port and no business
  # route at all.
  #
  # scopes carries what an ordinary identity owns, one authority per entitlement:
  # SCOPE_ACCOUNT_<eleven digits>, SCOPE_CUSTOMER_<nine digits> or
  # SCOPE_CARD_<card token>. Each identifier is written exactly as its column holds
  # it, leading zeros included, and a card token is the 64 lower-case hexadecimal
  # characters PanMasker.tokenOf produces for that card number. An ADMIN entry needs none: it
  # passes every ownership check by role.
  security:
    users:
      - username: ${ADMIN_USERNAME:admin001}
        password: ${ADMIN_PASSWORD_HASH}
        role: ADMIN
      - username: ${USER_USERNAME:user0001}
        password: ${USER_PASSWORD_HASH}
        role: USER
        scopes: ${USER_SCOPES:}
      - username: ${MONITORING_USERNAME:monitor01}
        password: ${MONITORING_PASSWORD_HASH}
        role: MONITORING
management:
  server:
    port: ${MANAGEMENT_PORT:9080}
    # The management port carries the same posture as the service port above, declared
    # rather than inherited. A monitoring credential travelling to a collector deserves
    # the protection a cardholder identifier gets. A Kubernetes
    # probe against an encrypted management port needs scheme HTTPS, which
    # deploy/k8s/40-authorization-service.yaml sets.
    ssl:
      enabled: "${MANAGEMENT_SSL_ENABLED:${SERVER_SSL_ENABLED:false}}"
      key-store: "${SERVER_SSL_KEYSTORE:}"
      key-store-type: "${SERVER_SSL_KEYSTORE_TYPE:PKCS12}"
      key-store-password: "${SERVER_SSL_KEYSTORE_PASSWORD:}"
  # config/SecurityConfig secures this surface. /actuator/health answers without a
  # credential, because a container health check and a Kubernetes probe carry none.
  # Every other endpoint below requires ROLE_MONITORING. An anonymous caller receives
  # 401, and an identity holding a business role receives 403.
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,metrics,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,kafka,listeners,outbox
  prometheus:
    metrics:
      export:
        enabled: true

# Each log line leaves the console as one JSON record.
logging:
  structured:
    format:
      console: logstash
    # Members every record carries beside the framework's own. `service` names which of the six
    # services wrote a record, which no logstash member does; the Mapped Diagnostic Context supplies
    # correlationId, causationId, eventId, eventType and transactionId per request and per delivery,
    # and the framework renders every context entry as a top-level member of its own.
    json:
      add:
        service: ${spring.application.name:card-service}
      # Withheld from every record this service writes. `stack_trace` is the one logstash
      # member that renders a throwable, and it renders the exception message ahead of the
      # frames. Spring Kafka reports a delivery it has given up on through
      # LogAccessor.error(Throwable, Supplier) from SeekUtils, a call no log level reaches, so
      # a message quoting a rejected payload, a constraint or a statement would reach the log
      # past every rule this platform applies to its own logging. Withholding the member drops
      # the rendering and nothing else: the exception still propagates, so the container still
      # retries and still routes the record. Each service reports a failure itself, as a type
      # chain with the record coordinates, which is the record an operator should read.
      exclude:
        - stack_trace
  level:
    root: ${LOG_LEVEL:INFO}
    # INFO rather than DEBUG. A DEBUG default writes identifiers into every
    # centralized log this deployment feeds, and a default is what an operator gets
    # who starts this service directly rather than through compose or Kubernetes.
    # Raise it for one run when tracing a message, and lower it again afterwards.
    com.carddemo: ${LOG_LEVEL_CARDDEMO:INFO}
    # OFF, not a level. This logger renders the server's own message for every failed
    # statement, and PostgreSQL puts the whole failing row in the DETAIL of a constraint
    # violation. On a table holding a card number, a verification value or a social security
    # number that one line publishes all of them, which is the CWE-532 the platform closes
    # everywhere else: LogHygieneContractTest holds every shipped source to rendering a
    # failure as its type. The framework's own logger was the last site outside that rule.
    # Nothing diagnostic is lost. The exception still reaches this service's own handler,
    # which answers a problem document and logs the failure type and the SQL state.
    #
    # The name is the Hibernate 7 one. Under Hibernate 5 and 6 this logger was
    # org.hibernate.engine.jdbc.spi.SqlExceptionHelper, and naming that instead silently
    # suppresses nothing: it was tried here first, and a card number reached a published
    # report anyway. CardholderDataInArtifactsContractTest asserts this exact name.
    org.hibernate.orm.jdbc.error: "OFF"
