# Manifest of the derived baseline of USR-COUSR02C-recovery-01: ADMIN001 takes
# admin option 3 to COUSR02C and enters user id USER0003 while the region file
# USRSEC is out of service, so the READ UPDATE answers neither NORMAL nor
# NOTFND and COUSR02C shows 'Unable to lookup User...'
# [app/cbl/COUSR02C.cbl:320-353]. Only unikix can run the scenario, and it
# needs region file control (GAP-MIS-011), so expected.yaml is authored from
# the source and is inferred-not-observed (GAP-INF-004, GAP-INF-012). It names
# no execution_id or execution_fingerprint and holds no datasets/ until
# report.py --import-unikix promotes an eligible UniKix run.
#
# source_commit is the protected base: nothing was captured, and the app/
# sources the expectation was derived from are unchanged since that commit.
# source_identity.units are the app/ sources the three steps execute, not only
# COUSR02C's: the COPY closure (inventory_tools.copy_closure) of COSGN00C,
# which routes the type-A ADMIN001 to COADM01C; of COADM01C, whose COADM01
# screen is asserted and whose option 3 XCTLs to COUSR02C; and of COUSR02C;
# plus the BMS sources of their maps COSGN00, COADM01 and COUSR02. DFHAID and
# DFHBMSCA are CICS-supplied and not in the repository.
