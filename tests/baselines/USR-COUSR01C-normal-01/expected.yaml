      SEC-USR-LNAME: 'WHITMORE            '
      SEC-USR-PWD: 'PASSWORD'
      SEC-USR-TYPE: 'A'
    - SEC-USR-FNAME: 'EMMANUEL            '
      SEC-USR-ID: 'ADMIN004'
      SEC-USR-LNAME: 'CASGRAIN            '
      SEC-USR-PWD: 'PASSWORD'
      SEC-USR-TYPE: 'A'
    - SEC-USR-FNAME: 'GRANVILLE           '
