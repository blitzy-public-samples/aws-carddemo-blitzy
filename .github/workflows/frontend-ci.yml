# Frontend CI/CD Workflow
# GitHub Actions workflow for CardDemo React SPA frontend
# Automates testing, linting, building, Docker image creation, and Kubernetes deployment
# Converted from mainframe build process per Agent Action Plan Section 0.4.22

name: Frontend CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  REGISTRY: docker.io
  IMAGE_NAME: carddemo-frontend
  VITE_API_BASE_URL: http://localhost:8080/api

jobs:
  # Job 1: Lint and Type Check
  # Validates code quality, formatting, and TypeScript types
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: ./frontend

      - name: Check Prettier Formatting
        run: npm run format:check
        working-directory: ./frontend

      - name: TypeScript Type Checking
        run: npm run type-check
        working-directory: ./frontend

      - name: Upload Lint Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-results
          path: frontend/eslint-results.json
          if-no-files-found: ignore

  # Job 2: Test
  # Runs Vitest unit tests and component tests with coverage
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run Unit Tests with Coverage
        run: npm test -- --run --coverage
        working-directory: ./frontend

      - name: Check Coverage Threshold (70%)
        run: |
          npm test -- --run --coverage \
            --coverage.lines=70 \
            --coverage.functions=70 \
            --coverage.branches=70 \
            --coverage.statements=70
        working-directory: ./frontend

      - name: Upload Coverage Report to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./frontend/coverage/coverage-final.json
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: frontend/coverage/

  # Job 3: Build
  # Builds optimized production bundle with Vite
  build:
    name: Build Production Bundle
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, test]
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Build Production Bundle
        run: npm run build
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}

      - name: Analyze Bundle Size
        run: npx vite-bundle-visualizer --output bundle-report.html
        working-directory: ./frontend
        continue-on-error: true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

      - name: Upload Bundle Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-report
          path: frontend/bundle-report.html
          if-no-files-found: ignore

  # Job 4: Build Docker Image
  # Builds and pushes Docker container image to registry
  build-docker-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Scan Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
        continue-on-error: true

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # Job 5: Deploy to Kubernetes
  # Deploys frontend to Kubernetes cluster (optional, production only)
  deploy-to-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-docker-image
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
        if: env.REGISTRY == format('{0}.dkr.ecr.{1}.amazonaws.com', secrets.AWS_ACCOUNT_ID, secrets.AWS_REGION)

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name carddemo-cluster --region ${{ secrets.AWS_REGION }}
        if: env.REGISTRY == format('{0}.dkr.ecr.{1}.amazonaws.com', secrets.AWS_ACCOUNT_ID, secrets.AWS_REGION)

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/carddemo-frontend \
            carddemo-frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n carddemo
          kubectl rollout status deployment/carddemo-frontend -n carddemo --timeout=5m

      - name: Verify Deployment
        run: kubectl get pods -n carddemo -l app=carddemo-frontend

  # Job 6: Lighthouse CI (Optional)
  # Runs Lighthouse performance and accessibility audits
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: deploy-to-kubernetes
    if: github.ref == 'refs/heads/main' && success()

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: https://carddemo.example.com
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true

  # Notification Job
  # Sends Slack notification on workflow completion
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, test, build, build-docker-image]
    if: always()

    steps:
      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1
        if: env.SLACK_WEBHOOK_URL != ''
        with:
          payload: |
            {
              "text": "Frontend CI/CD Workflow: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Frontend CI/CD Result:* ${{ job.status }}\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*Triggered by:* ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
