# Derived baseline of scenario USR-COUSR02C-negative-03 (capture_platform:
# derived): ADMIN001 fetches the invented user TESTU002 on the COUSR02 update
# screen, erases the first name and presses PF5. Authored from the source,
# never captured: app/cbl/COADM01C.cbl:115-145 (option '3' XCTLs to
# COUSR02C), app/cbl/COUSR02C.cbl:84-105 (first entry sends a cleared
# COUSR02), 143-172 and 320-339 (READ UPDATE of USRSEC and 'Press PF5 key to
# save your updates ...'), 177-191 (the first-name WHEN moves 'First Name can
# NOT be empty...' to WS-MESSAGE and sends the map) and 215-245 (the error
# flag skips the READ and the REWRITE). Open until a UniKix run is imported:
# GAP-INF-004 (derived USR end-to-end baselines) and GAP-INF-012 (online-only
# copybooks).
# One screen per step, the one shown after the step's AID. Values are full BMS
# field width with their trailing spaces: ERRMSG is the first 78 bytes of the
# 80-byte WS-MESSAGE, FNAME and LNAME are 20 bytes. The PF5 screen echoes the
# input as received, because COUSR2AO redefines COUSR2AI and nothing reloads
# it: FNAME blank, USRIDIN, LNAME and USRTYPE as fetched. PASSWD is dark
# (ATTRB=(DRK,FSET,UNPROT)) and is not asserted on the screens; the unchanged
# password is asserted on the USRSEC record. messages holds each step's
# ERRMSG. CURDATE and CURTIME come from the run clock, which UniKix cannot
# fix, hence the matchers.
# file_state: USRSEC as loaded, the ten fixture users and TESTU002 in key
# order.
file_state:
  USRSEC:
    records:
    - SEC-USR-FILLER: '                       '
      SEC-USR-FNAME: 'MARGARET            '
      SEC-USR-ID: ADMIN001
      SEC-USR-LNAME: 'GOLD                '
      SEC-USR-PWD: PASSWORD
      SEC-USR-TYPE: A
    - SEC-USR-FILLER: '                       '
