# CORPT00C submits the custom (date range) transaction report: the start and
# end dates the user enters become the date window of the TRNRPT00 job it
# writes to the TDQ JOBS (tech-spec seed "Scenario 4: Report Generation and
# Statement Creation").
#
# Step 1 signs on as USER0001 on COSGN00 (transaction CC00); the type-U user is
# routed to COMEN01C, which sends the main menu COMEN01 headed CM00/COMEN01C
# [app/cbl/COSGN00C.cbl:230-237] [app/cbl/COMEN01C.cbl:36-37,82-90].
# Step 2 enters option 9 on COMEN01: 'Transaction Reports', user type U,
# program CORPT00C [app/cpy/COMEN02Y.cpy:74-78]. COMEN01C zeroes the program
# context and transfers control to CORPT00C [app/cbl/COMEN01C.cbl:115-156],
# whose first entry sets the re-enter flag, moves LOW-VALUES to CORPT0AO and
# sends CORPT00 with CR00, CORPT00C, the COTTL01Y titles, the run date and
# time through CSDAT01Y and a blank ERRMSG [app/cbl/CORPT00C.cbl:163-181,
# 556-580,609-628]. The input fields show their BMS initial blanks.
# Step 3 selects Custom with the dates 06/01/2022 to 06/30/2022 and CONFIRM Y,
# and presses ENTER under CR00 [app/cbl/CORPT00C.cbl:183-186]:
# - MONTHLY and YEARLY hold their initial blank, so the CUSTOM branch runs
#   [app/cbl/CORPT00C.cbl:212-256]. No date part is empty, so none of the
#   six empty-field messages is sent [app/cbl/CORPT00C.cbl:258-303].
# - NUMVAL-C moves each part back through WS-NUM-99 or WS-NUM-9999 unchanged
#   ('06', '01', '2022', '06', '30', '2022'); every part is numeric, the months
#   are not above '12' and the days not above '31' [app/cbl/CORPT00C.cbl:
#   305-379].
# - The start date 2022-06-01 and then the end date 2022-06-30 are passed to
#   CSUTLDTC with mask YYYY-MM-DD; both are valid dates, so CEEDAYS returns a
#   zero feedback token and the result severity is '0000'
#   [app/cbl/CORPT00C.cbl:381-426] [app/cbl/CSUTLDTC.cbl:103-130]. The UniKix
#   copy of CSUTLDTC trims the Vstring lengths (GAP-DOC-021); both values fill
#   their 10 characters, so that difference does not reach these calls, and
#   GAP-DOC-021 still keeps UniKix evidence from verifying INV-UTL-003.
# - The dates go into PARM-START-DATE-1/-2 and PARM-END-DATE-1/-2, the report
#   name is 'Custom', and SUBMIT-JOB-TO-INTRDR finds CONFIRM 'Y'
#   [app/cbl/CORPT00C.cbl:429-436,462-479].
# - The loop writes JOB-LINES 1 to 17 to JOBS, one WRITEQ TD of 80 bytes
#   each: it marks the end on the '/*EOF' record and still writes it, so
#   '/*EOF' is the 17th record [app/cbl/CORPT00C.cbl:81-127,496-523].
# - Every write is NORMAL, so INITIALIZE-ALL-FIELDS moves spaces to every input
#   field, CONFIRM and WS-MESSAGE, STRING composes 'Custom' (delimited by
#   space) and ' report submitted for printing ...', ERRMSG is set green and
#   CORPT00 is sent again with ERASE before RETURN TRANSID CR00
#   [app/cbl/CORPT00C.cbl:445-456,556-591,633-646].
#
# The dates are entered, not taken from the clock, so the job records are
# exact values. Only the screen CURDATE and CURTIME come from the region
# clock, so they are matchers and the clock is relative. Text values are whole
# fields at their BMS or record length, trailing spaces included.
id: RPT-CORPT00C-normal-03
level: e2e
type: normal
description: >-
  USER0001 signs on, chooses main-menu option 9 (Transaction Reports) and, on
  CORPT00, requests the Custom report for 06/01/2022 to 06/30/2022 with
  CONFIRM Y. Both dates pass CSUTLDTC with mask YYYY-MM-DD, CORPT00C writes the
  17 records of job TRNRPT00 to the TDQ JOBS with PARM-START-DATE 2022-06-01,
  PARM-END-DATE 2022-06-30 and the DATEPARM record '2022-06-01 2022-06-30',
  clears the input fields and shows 'Custom report submitted for printing ...'.
# Primary item first, then the program, the maps asserted, the transaction
# step 3 runs under, the TDQ the job is written to, the online-only copybooks
# CORPT00C copies, and the CSUTLDTC date acceptance both entered dates reach.
# The 'report submitted' message and the JOBS write are the primary items of
# their own scenarios; sign-on and the menu option (CC00, CM00, COSGN00,
# USRSEC) are verified by the SEC and MNU scenarios; the batch record copybook
# CVTRA05Y, which CORPT00C copies but never uses, is verified at the lowest
# level that executes it.
inventory_ids:
- INV-RPT-035  # CORPT00C custom date range (calculation): the entered dates become the job's window
- INV-RPT-001  # CORPT00C program
- INV-MNU-003  # COMEN01 map, where option 9 is entered
- INV-RPT-002  # CORPT00 map, the report screen of steps 2 and 3
- INV-CFG-019  # CR00 transaction, under which CORPT00C receives the request
- INV-CFG-029  # JOBS CSD TDQ: the queue the 17 job records are written to
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the program context
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y, copied by CORPT00C
- INV-UTL-003  # CSUTLDTC date acceptance: 2022-06-01 and 2022-06-30 with mask YYYY-MM-DD
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-009  # RPT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-MIS-017  # no confirmed capture of the records the region writes to JOBS
- GAP-INF-001  # which dates CEEDAYS accepts is inferred, not observed
- GAP-MIS-010  # whether UniKix supplies CEEDAYS, which CSUTLDTC calls
# CORPT00C reads no file; USRSEC holds the demo users for the sign-on.
preconditions:
  datasets:
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '9'
  # MONTHLY and YEARLY are left at their initial blank.
  - aid: ENTER
    '@map': CORPT00
    fields:
      CUSTOM: 'X'
      SDTMM: '06'
      SDTDD: '01'
      SDTYYYY: '2022'
      EDTMM: '06'
      EDTDD: '30'
      EDTYYYY: '2022'
      CONFIRM: 'Y'
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: 'CM00'
    PGMNAME: 'COMEN01C'
  - '@map': CORPT00
    TRNNAME: 'CR00'
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: 'CORPT00C'
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ERRMSG: '                                                                              '
  - '@map': CORPT00
    TRNNAME: 'CR00'
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: 'CORPT00C'
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    MONTHLY: ' '
    YEARLY: ' '
    CUSTOM: ' '
    SDTMM: '  '
    SDTDD: '  '
    SDTYYYY: '    '
    EDTMM: '  '
    EDTDD: '  '
    EDTYYYY: '    '
    CONFIRM: ' '
    ERRMSG: 'Custom report submitted for printing ...                                      '
  # The ERRMSG of each step: the menu and the first report screen carry none.
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'Custom report submitted for printing ...                                      '
  file_state:
    # The JOB-LINES CORPT00C writes, in write order, each 80 bytes with its
    # trailing spaces [app/cbl/CORPT00C.cbl:81-127]: records 11 and 12 carry
    # the dates in the SORT symbols of STEP05R, record 15 is the DATEPARM
    # record of STEP10R (start date, a space, end date), and record 17 is the
    # '/*EOF' end marker, written before the loop stops.
    '@TDQ:JOBS':
      records:
      - '//TRNRPT00 JOB ''TRAN REPORT'',CLASS=A,MSGCLASS=0,                                '
      - '// NOTIFY=&SYSUID                                                               '
      - '//*                                                                             '
      - '//JOBLIB JCLLIB ORDER=(''AWS.M2.CARDDEMO.PROC'')                                  '
      - '//*                                                                             '
      - '//STEP10 EXEC PROC=TRANREPT                                                     '
      - '//*                                                                             '
      - '//STEP05R.SYMNAMES DD *                                                         '
      - 'TRAN-CARD-NUM,263,16,ZD                                                         '
      - 'TRAN-PROC-DT,305,10,CH                                                          '
      - 'PARM-START-DATE,C''2022-06-01''                                                   '
      - 'PARM-END-DATE,C''2022-06-30''                                                     '
      - '/*                                                                              '
      - '//STEP10R.DATEPARM DD *                                                         '
      - '2022-06-01 2022-06-30                                                           '
      - '/*                                                                              '
      - '/*EOF                                                                           '
