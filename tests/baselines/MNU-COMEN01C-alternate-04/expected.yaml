# Derived baseline of scenario MNU-COMEN01C-alternate-04 (capture_platform:
# derived): USER0001 signs on, reaches the main menu and selects option 4
# 'Credit Card View', which XCTLs to COCRDSLC. Authored from the source, never
# captured; open until a UniKix run is imported (GAP-INF-003, GAP-INF-012).
# One screen per step, each the screen shown after the step's AID. Values are
# at full BMS field width with their trailing spaces; fields the program
# leaves LOW-VALUES are captured as spaces. CURDATE and CURTIME come from the
# region clock, so they are run-date and run-time matchers.
screens:
# Step 1: COSGN00C XCTLs a type-U user to COMEN01C with program context 0
# [app/cbl/COSGN00C.cbl:222-240]; on first entry COMEN01C sends COMEN1A from
# LOW-VALUES with ERASE [app/cbl/COMEN01C.cbl:87-90,182-193]: header
# [app/cbl/COMEN01C.cbl:212-231] [app/cpy/COTTL01Y.cpy:18-22], option 4 as
# '04' + '. ' + its 35-byte name in the 40-byte WS-MENU-OPT-TXT
# [app/cbl/COMEN01C.cbl:48,236-256] [app/cpy/COMEN02Y.cpy:43-47], and the
# blank WS-MESSAGE in the 78-byte ERRMSG [app/cbl/COMEN01C.cbl:79-80,187].
- '@map': 'COMEN01'
  CURDATE: {match: 'run-date', format: '%m/%d/%y'}
  CURTIME: {match: 'run-time'}
  ERRMSG: '                                                                              '
  OPTN004: '04. Credit Card View                    '
  PGMNAME: 'COMEN01C'
  TITLE01: '      AWS Mainframe Modernization       '
  TITLE02: '              CardDemo                  '
  TRNNAME: 'CM00'
# Step 2: option 4 is numeric, within the 10 options, of user type U and not a
# DUMMY program, so COMEN01C XCTLs to COCRDSLC with context 0
# [app/cbl/COMEN01C.cbl:127-155]. COCRDSLC takes WHEN CDEMO-PGM-ENTER and sends
# CCRDSLA without reading a file [app/cbl/COCRDSLC.cbl:349-356,427-496]: no
# card is found, so the card fields stay LOW-VALUES; the blank WS-INFO-MSG
# becomes the input prompt; the blank WS-RETURN-MSG fills the 80-byte ERRMSG.
- '@map': 'COCRDSL'
  # ACCTSID and CARDSID are blank on either branch of the COMMAREA test at
  # [app/cbl/COCRDSLC.cbl:268-279], which reads CDEMO-FROM-PROGRAM before
  # DFHCOMMAREA is copied in. Initialized, CDEMO-ACCT-ID and CDEMO-CARD-NUM are
  # zero and the fields get LOW-VALUES; restored from the menu, they hold what
  # COSGN00C never set, and the fields get either LOW-VALUES or the CC-ACCT-ID
  # and CC-CARD-NUM that INITIALIZE CC-WORK-AREA leaves blank
  # [app/cbl/COCRDSLC.cbl:254-256,462-472] [app/cpy/CVCRD01Y.cpy:34-38].
  # They are asserted because every path gives spaces, not only a zero
  # COMMAREA.
  ACCTSID: '           '
  CARDSID: '                '
  CRDNAME: '                                                  '
  CRDSTCD: ' '
  CURDATE: {match: 'run-date', format: '%m/%d/%y'}
  CURTIME: {match: 'run-time'}
  ERRMSG: '                                                                                '
  EXPMON: '  '
  EXPYEAR: '    '
  INFOMSG: 'Please enter Account and Card Number    '
  PGMNAME: 'COCRDSLC'
  TITLE01: '      AWS Mainframe Modernization       '
  TITLE02: '              CardDemo                  '
  TRNNAME: 'CCDL'
