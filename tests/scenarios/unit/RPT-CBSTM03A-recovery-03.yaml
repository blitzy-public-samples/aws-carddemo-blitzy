      - 'FICO Score         :274                                                         '
      - '--------------------------------------------------------------------------------'
      - '                              TRANSACTION SUMMARY                               '
      - '--------------------------------------------------------------------------------'
      - 'Tran ID         Tran Details                                         Tran Amount'
      - '--------------------------------------------------------------------------------'
