# The open-failure abend of CBACT02C: the card KSDS does not exist. OPEN INPUT
# CARDFILE returns status 35, so 0000-CARDFILE-OPEN displays the error line and
# the status as NNNN0035, and 9999-ABEND-PROGRAM displays 'ABENDING PROGRAM'
# and calls CEE3ABD [app/cbl/CBACT02C.cbl:118-134,154-158,161-174]. The fault is
# produced by leaving CARDDATA out of the preconditions; the CEE3ABD stub ends
# the run with its marker, which the adapter reports as return_code null
# (GAP-STB-001).
id: DAT-CBACT02C-recovery-01
level: unit
type: recovery
description: >-
  CBACT02C runs with no card KSDS: the open fails with file status 35, the
  program displays 'ERROR OPENING CARDFILE', 'FILE STATUS IS: NNNN0035' and
  'ABENDING PROGRAM', and abends through CEE3ABD without reading a record.
inventory_ids:
- INV-DAT-032
- INV-DAT-002
tags: []
gap_ids:
- GAP-STB-001
- GAP-DEF-001
- GAP-STB-010
- GAP-STB-011
preconditions:
  datasets: {}
  parameters:
    clock: '2022-07-06 10:00:00.00'
    clock_mode: fixed
  faults:
  - target: CARDDATA
    operation: open
    condition: unavailable
inputs:
  program: CBACT02C
expected:
  return_code: null
  messages:
  - START OF EXECUTION OF PROGRAM CBACT02C
  - ERROR OPENING CARDFILE
  - 'FILE STATUS IS: NNNN0035'
  - ABENDING PROGRAM
  - CARDDEMO-ABEND CEE3ABD
