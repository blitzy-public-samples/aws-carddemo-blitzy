# PF5 on the confirmed COACTUP screen rewrites the customer record. USER0001
# changes the first name of customer 000000001, the holder of account
# 00000000001, and COACTUPC rewrites its CUSTDAT record.
#
# Step 1 signs on as USER0001; COSGN00C routes the type U user to the main menu
# COMEN01 [app/cbl/COSGN00C.cbl:230-237].
# Step 2: option '2' makes COMEN01C XCTL to COACTUPC, the 'Account Update'
# entry of COMEN02Y, with program context 0 [app/cbl/COMEN01C.cbl:115-156]
# [app/cpy/COMEN02Y.cpy:31-35]. Entered from COMEN01C without the re-enter
# flag, COACTUPC sends COACTUP from a cleared map with the search-key prompt
# [app/cbl/COACTUPC.cbl:964-973,2668-2702,2955-2983].
# Step 3: ENTER with the account id. 1210-EDIT-ACCOUNT accepts the 11 digits;
# 9000-READ-ACCT reads CXACAIX by account (card 9680294154603697, customer
# 000000001, the account's only cross-reference), then ACCTDAT and CUSTDAT,
# and keeps the records in the COMMAREA as the old values
# [app/cbl/COACTUPC.cbl:1783-1818,2568-2580,3608-3884].
# 3202-SHOW-ORIGINAL-VALUES shows them under 'Update account details presented
# above.': amounts through PIC +ZZZ,ZZZ,ZZZ.99, the dates, the SSN and the
# phone numbers split into their parts [app/cbl/COACTUPC.cbl:371,2787-2865].
# 3310 and 3320 set the MDT of every field (FSET for the editable ones, PRF for
# the account id, customer id and country), so each later ENTER or PF5 returns
# every field as the screen shows it [app/cbl/COACTUPC.cbl:3441-3561].
# Step 4: ENTER with the first name Testnewname. 1100-RECEIVE-MAP rebuilds the
# new values from the screen and 1205-COMPARE-OLD-NEW finds the change. Every
# edit of 1200-EDIT-MAP-INPUTS passes for account 00000000001 and the clean
# customer record: Y/N flags, CCYYMMDD dates, signed amounts, SSN parts not
# 000/666/9xx, FICO 300-850, alphabetic names, city, state and country, area
# code 919 and state NC in CSLKPCDY, and state/zip NC27
# [app/cbl/COACTUPC.cbl:1429-1676,2109-2558] [app/cpy/CSLKPCDY.cpy:895,1046,1186].
# The action becomes changes-OK-not-confirmed: 3203-SHOW-UPDATED-VALUES echoes
# the received values, every field is protected, INFOMSG asks for F5 and the
# dark F5=Save key label is made bright
# [app/cbl/COACTUPC.cbl:2620-2621,2870-2953,2966-2967,3001-3003,3566-3582].
# Step 5: PF5 is valid only in that state. The edits are skipped;
# 9600-WRITE-PROCESSING reads ACCTDAT and CUSTDAT for update,
# 9700-CHECK-CHANGE-IN-REC finds both as fetched, and the account and the
# customer record are rewritten. The screen echoes the values with 'Changes
# committed to database'; F5=Save is dark again
# [app/cbl/COACTUPC.cbl:905-912,1463-1468,2602-2614,2968-2969,3888-4192].
#
# The rewritten customer record is CUST-UPDATE-RECORD as 9600-WRITE-PROCESSING
# builds it from the fields received with PF5 [app/cbl/COACTUPC.cbl:4007-4059]:
# - Text keeps the case typed: COACTUPC converts no case (UPPER-CASE serves only
#   its comparisons), and transaction CAUP runs with profile DFHCICST
#   [app/csd/CARDDEMO.CSD:306-308].
# - CUST-ADDR-ZIP is the 5-character screen field in the 10-byte record field.
# - Each phone number is STRINGed as '(' area ')' prefix '-' line into the
#   15-byte field INITIALIZE cleared, so it ends in 2 spaces.
# - CUST-SSN is the three SSN parts as 9 digits, CUST-DOB-YYYY-MM-DD the year,
#   month and day joined by '-', CUST-FICO-CREDIT-SCORE the 3 digits.
# The record's 168-byte FILLER is not asserted: INITIALIZE skips FILLER, so it
# holds whatever the runtime puts in working storage that has no VALUE
# [app/cbl/COACTUPC.cbl:434-456,4007]. The account record is rewritten too; it is
# the account REWRITE item's own scenario and is not asserted here.
#
# Customer 000000001 of the repository fails the edits (phone 2 area code 373,
# zip 12546 for NC, FICO 274), so the fixture replaces it with the invented,
# edit-clean values ACT-COACTUPC-normal-01 fetches; the record keeps its DOB and
# EFT account id. Expected texts are whole fields at their
# BMS or record length with trailing spaces. The header date and time come
# from the run clock, hence the matchers and clock_mode relative. The baseline
# is derived from the source: no TPE region runs in CI.
id: ACT-COACTUPC-normal-04
level: e2e
type: normal
description: >-
  USER0001 signs on, chooses main menu option 2 'Account Update', fetches
  account 00000000001 with its customer 000000001, changes the first name from
  Testfirst to Testnewname, gets 'Changes validated.Press F5 to save' and
  presses PF5. COACTUPC rewrites the CUSTDAT record with the new first name
  and every other customer field as it rebuilds them from the screen, shows
  'Changes committed to database' and leaves the other 49 customers unchanged.
inventory_ids:
- INV-ACT-193  # COACTUPC customer REWRITE (interface), observed in file_state
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, the main menu option 2 is entered on
- INV-ACT-004  # COACTUP map, the update screen of steps 2 to 5
- INV-CFG-009  # CAUP transaction, under which the fetch, the edit and the save run
- INV-CFG-006  # CXACAIX CSD file, the cross-reference read by account id
- INV-CFG-001  # ACCTDAT CSD file, read and read for update, then rewritten
- INV-CFG-005  # CUSTDAT CSD file, read and read for update, then rewritten
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA carrying the customer id
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the header date and time
- INV-LAY-007  # CSLKPCDY copybook, the area-code, state and state/zip tables
- INV-LAY-008  # CSMSG01Y copybook, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y copybook, the abend data copied by COACTUPC
- INV-LAY-010  # CSSETATY copybook, the field attribute setting of 3300
- INV-LAY-011  # CSSTRPFY copybook, the AID mapping that recognises PF5
- INV-LAY-013  # CSUTLDPY copybook, the date edits of the four date fields
- INV-LAY-014  # CSUTLDWY copybook, the date edit work areas
- INV-LAY-019  # CVCRD01Y copybook, the AID flags and the account id work field
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The save is reached only through edits and change detection that the UniKix
# copy changes (COACTUPC and CSUTLDPY), and TRNNAME is asserted in row 1 of
# COACTUP, which its copy of the map changes; a UniKix run of this scenario is
# therefore no evidence for the app/ items while these entries are open.
- GAP-DOC-022
- GAP-DOC-024
- GAP-DOC-025
