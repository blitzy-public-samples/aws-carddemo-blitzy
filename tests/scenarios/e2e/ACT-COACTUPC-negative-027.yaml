# COACTUPC refuses an account update whose Expiry Date year is left empty:
# the 'year supplied' predicate of EDIT-YEAR-CCYY, which COACTUPC copies from
# CSUTLDPY [app/cpy/CSUTLDPY.cpy:25-45] [app/cbl/COACTUPC.cbl:4232].
#
# Steps 1-3 sign on as USER0001, choose main-menu option 2 and fetch account
# 00000000001 as ACT-COACTUPC-alternate-04 does: CXACAIX gives card
# 9680294154603697 and customer 000000001 (line 49 of
# app/data/ASCII/cardxref.txt), ACCTDAT and CUSTDAT are read without UPDATE,
# the records become the old values of the COMMAREA, ACUP-SHOW-DETAILS is set
# and 3320-UNPROTECT-FEW-ATTRS sends every editable field with MDT on
# [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,3608-3884].
# Step 4 erases EXPYEAR and presses ENTER. The erased field comes back as nulls
# or blanks, and either makes 1100-RECEIVE-MAP move LOW-VALUES to
# ACUP-NEW-EXP-YEAR [app/cbl/COACTUPC.cbl:1165-1172]. 1205-COMPARE-OLD-NEW
# finds a change, so 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs
# the field edits in screen order [app/cbl/COACTUPC.cbl:1460-1494]:
# - Account Status 'Y', Open Date 2014-11-20 and Credit Limit 2,020.00 pass.
# - 'Expiry Date' goes to WS-EDIT-VARIABLE-NAME and EDIT-DATE-CCYYMMDD runs:
#   WS-EDIT-DATE-CCYY is LOW-VALUES, so EDIT-YEAR-CCYY sets INPUT-ERROR and
#   FLG-YEAR-BLANK and, the message line being off, STRINGs the trimmed field
#   name and ' : Year must be supplied.' into WS-RETURN-MSG, then leaves the
#   year edit [app/cpy/CSUTLDPY.cpy:29-42]. Month 05 and day 20 pass, and
#   EDIT-DAY-MONTH-YEAR leaves the routine because the date flags are not all
#   valid, so CSUTLDTC is not called [app/cpy/CSUTLDPY.cpy:91-207,274-278].
# - Every later edit runs on the clean customer and passes; none replaces the
#   message, which each composes only while WS-RETURN-MSG is off.
# INPUT-ERROR keeps ACUP-CHANGES-NOT-OK, which 2000-DECIDE-ACTION leaves as it
# is, so 9600-WRITE-PROCESSING, the only READ UPDATE and REWRITE path, does not
# run [app/cbl/COACTUPC.cbl:1671-1675,2596-2597]. 3000-SEND-MAP then builds the
# screen [app/cbl/COACTUPC.cbl:2649-2662]:
# - 3203-SHOW-UPDATED-VALUES shows the received values, the valid amounts
#   re-edited through +ZZZ,ZZZ,ZZZ.99 [app/cbl/COACTUPC.cbl:2718-2720,2870-2947].
# - 3250-SETUP-INFOMSG sets PROMPT-FOR-CHANGES for ACUP-CHANGES-NOT-OK and moves
#   the message to ERRMSG [app/cbl/COACTUPC.cbl:2955-2981].
# - 3300-SETUP-SCREEN-ATTRS unprotects the editable fields again, puts the
#   cursor on EXPYEAR, and through CSSETATY turns it red and moves '*' into it
#   because the year is blank on a re-entry [app/cbl/COACTUPC.cbl:2986-3039,
#   3236-3241] [app/cpy/CSSETATY.cpy:17-26].
# - 3390-SETUP-INFOMSG-ATTRS makes F12=Cancel bright, since changes were made
#   and not saved; F5=Save stays dark, since no confirmation is asked
#   [app/cbl/COACTUPC.cbl:3566-3581] [app/bms/COACTUP.bms:498-507].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - 'Expiry Date' (11) and ' : Year must be supplied.' (25) give 36
#   characters; the 75-byte WS-RETURN-MSG pads them with spaces and the 78-byte
#   ERRMSG with 3 more. INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte field.
# - EXPYEAR holds '*' and three spaces: MOVE '*' pads the 4-byte EXPYEARO.
# - Screen fields are compared at their full BMS length, trailing spaces kept;
#   a dark (DRK) field is captured as blanks.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit (the repository record's FICO 274 and zip 12546 would be refused
# first), as in the other COACTUPC update scenarios; account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-027
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update) and fetches
  account 00000000001 with customer 000000001, then erases the Expiry Date year
  and presses ENTER. COACTUPC refuses the change with 'Expiry Date : Year must
  be supplied.' in the message line, shows the entered values again with '*'
  in the expiry year, keeps the fields editable with 'Update account details
  presented above.' and F12=Cancel shown, and saves nothing: ACCTDATA and
  CUSTDATA still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-085  # COACTUPC Expiry Date: year supplied (field edit, rule)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the red attribute and '*' of the blank expiry year
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-YEAR-CCYY, which composes the message
- INV-LAY-014  # CSUTLDWY: the date-edit work areas and flags
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY drops FUNCTION TRIM from the field name, so on UniKix the
# message carries 'Expiry Date' padded to the 25-byte WS-EDIT-VARIABLE-NAME.
- GAP-DOC-024
# The UniKix COACTUPC comments out the TEST-NUMVAL-C amount checks this path
# runs and drops TRIM from its change detection, so the amounts on screen 4 may
# differ on UniKix.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
