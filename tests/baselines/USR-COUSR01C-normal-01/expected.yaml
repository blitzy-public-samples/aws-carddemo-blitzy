# Derived baseline of scenario USR-COUSR01C-normal-01: ADMIN001 signs on,
# takes admin option 2 and adds user TESTU001 on COUSR01 (transaction CU01).
# TESTU001 is invented data: it is written to USRSEC and never signs on.
# Authored from the source, never captured:
# - app/cbl/COSGN00C.cbl:230-237 with app/bms/COSGN00.bms (type A -> COADM01C);
# - app/cbl/COADM01C.cbl:115-146 with app/cpy/COADM02Y.cpy:29-32 and
#   app/bms/COADM01.bms (option 2 'User Add (Security)' -> COUSR01C, context 0);
# - app/cbl/COUSR01C.cbl:83-87 (first entry: LOW-VALUES map, blank ERRMSG),
#   115-160 (every field supplied, moved to SEC-USER-DATA), 184-196 and
#   214-233 (header from app/cpy/COTTL01Y.cpy and app/cpy/CSDAT01Y.cpy),
#   238-259 (WRITE, then 'User ' SEC-USR-ID ' has been added ...'), 287-295
#   (input fields reset to spaces), with app/bms/COUSR01.bms;
# - app/cpy/CSUSR01Y.cpy:17-23 for the USRSEC record, and the USRSEC fixture
#   app/data/EBCDIC/AWS.M2.CARDDEMO.USRSEC.PS decoded as cp037 for the 10 users
#   that stay unchanged.
# Open under GAP-INF-004 (derived USR end-to-end baselines) and GAP-INF-012
# (online-only copybooks). Only `report.py --import-unikix` promotes it, from
# imported UniKix evidence; it is never edited by hand to match a run.
# One screen per step, each the screen shown after the step's AID; messages
# holds each step's ERRMSG. Text is full BMS field width with trailing spaces.
# USRSEC is listed in primary-key order, TESTU001 after ADMIN005.
# SEC-USR-FILLER is deliberately not asserted, as in the scenario: COUSR01C
# never sets it, so TESTU001's filler is whatever the platform puts in working
# storage without VALUE, which no source fixes.
file_state:
  USRSEC:
    records:
    - SEC-USR-FNAME: 'MARGARET            '
      SEC-USR-ID: 'ADMIN001'
      SEC-USR-LNAME: 'GOLD                '
      SEC-USR-PWD: 'PASSWORD'
      SEC-USR-TYPE: 'A'
    - SEC-USR-FNAME: 'RUSSELL             '
      SEC-USR-ID: 'ADMIN002'
      SEC-USR-LNAME: 'RUSSELL             '
      SEC-USR-PWD: 'PASSWORD'
      SEC-USR-TYPE: 'A'
    - SEC-USR-FNAME: 'RAYMOND             '
