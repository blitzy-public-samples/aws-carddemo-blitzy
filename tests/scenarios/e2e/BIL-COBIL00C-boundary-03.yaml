# COBIL00C refuses to pay a balance just below zero: -0.01, the largest
# negative balance, is refused like 0.00 (BIL-COBIL00C-boundary-01), while 0.01
# is paid (BIL-COBIL00C-boundary-02) [app/cbl/COBIL00C.cbl:197-205].
#
# Steps 1-2: USER0001 (type U) signs on and is routed to COMEN01C; option 10 is
# 'Bill Payment', a type U option, so COMEN01C transfers control to COBIL00C
# with the program context reset [app/cbl/COSGN00C.cbl:222-239]
# [app/cpy/COMEN02Y.cpy:80-84] [app/cbl/COMEN01C.cbl:115-156]. COBIL00C sets
# the re-enter flag, finds no transaction selected (the COMMAREA COMEN01C
# passes ends before CDEMO-CB00-INFO, so the move pads it with spaces) and
# sends COBIL00 from LOW-VALUES with a blank ERRMSG
# [app/cbl/COBIL00C.cbl:107-122,289-301].
# Step 3 enters account 00000000001 and leaves CONFIRM as step 2 sent it,
# holding no data, so COBIL00C receives it as SPACES or LOW-VALUES
# [app/bms/COBIL00.bms:115-119]. Under the CB00 that step 2 returned with,
# PROCESS-ENTER-KEY runs [app/cbl/COBIL00C.cbl:124-127,146-149,154-206]:
# - ACTIDIN is supplied, so it becomes ACCT-ID, and the blank CONFIRM takes the
#   WHEN SPACES / WHEN LOW-VALUES branch: READ ACCTDAT with UPDATE returns
#   NORMAL [app/cbl/COBIL00C.cbl:157-184,343-358].
# - ACCT-CURR-BAL -0.01 is edited through WS-CURR-BAL, PIC +9999999999.99,
#   into CURBAL as -0000000000.01 [app/cbl/COBIL00C.cbl:56,193-194].
# - ACCT-CURR-BAL <= ZEROS holds and ACTIDIN is not blank, so 'You have nothing
#   to pay...' goes to WS-MESSAGE, the cursor goes to ACTIDIN, and
#   SEND-BILLPAY-SCREEN sends COBIL00 FROM the map area RECEIVE filled, with
#   ERASE [app/cbl/COBIL00C.cbl:197-205,289-301].
# The error flag is now on, so neither the confirmation request nor the
# payment runs: no cross-reference read, TRANSACT browse, WRITE or REWRITE
# [app/cbl/COBIL00C.cbl:208-244]. RETURN TRANSID CB00 ends the task, which
# releases the READ UPDATE hold, so ACCTDATA and TRANSACT stand as loaded.
#
# Expected values are derived from the source; no TPE region runs in CI. BMS
# pads each field with blanks to its length, so text values are full field
# width with their trailing spaces. CURDATE and CURTIME come from the region
# clock, so they are matchers and the clock is relative.
id: BIL-COBIL00C-boundary-03
level: e2e
type: boundary
description: >-
  USER0001 signs on, chooses main-menu option 10 (Bill Payment) and enters
  repository account 00000000001, given the invented balance -0.01, on
  COBIL00 with CONFIRM left blank. COBIL00C shows the balance as
  -0000000000.01 and refuses the payment with 'You have nothing to pay...';
  no payment transaction is written and the account is not changed.
# Primary item first, then the program, the maps asserted, the transaction
# step 3 runs under, the CSD file COBIL00C reads on this path (CXACAIX and
# TRANSACT are not accessed), and the online-only copybooks it copies. Sign-on
# and the menu option (CC00, CM00, COSGN00, USRSEC) are verified by the SEC and
# MNU scenarios; the batch record copybooks (CVACT01Y, CVACT03Y, CVTRA05Y) and
# the data files at the lowest level that executes them.
inventory_ids:
- INV-BIL-006  # COBIL00C message 'You have nothing to pay...'
- INV-BIL-001  # COBIL00C program
- INV-MNU-003  # COMEN01 map, where option 10 is entered
- INV-BIL-002  # COBIL00 map, the bill payment screen of steps 2 and 3
- INV-CFG-012  # CB00 transaction, under which COBIL00C receives step 3
- INV-CFG-001  # ACCTDAT CSD file, read for update by account id
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA carrying the program context
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the screen date and time
- INV-LAY-008  # CSMSG01Y copybook, copied by COBIL00C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-008  # BIL end-to-end baselines derived, never observed on a TPE region
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-DOC-011  # repository account, with an invented balance, in place of the tech-spec account 00000234567
preconditions:
  datasets:
    # COSGN00C reads the sign-on user USER0001.
    USRSEC: {base: USRSEC}
    # Account 00000000001 replaces its fixture record with ACCT-CURR-BAL -0.01
    # (stored 00000000000J); every field it does not name keeps the fixture
    # value of record 1.
    ACCTDATA:
      base: ACCTDATA
      records:
      - ACCT-ID: '00000000001'
        ACCT-CURR-BAL: '-0.01'
    # The region's CCXREF file and CXACAIX path; not read on this path.
    CARDXREF: {base: CARDXREF}
    # TRANSACT is a built dataset with no repository data of its own, so the
    # schema refuses it as a base: it is loaded from the repository's 300 daily
    # transactions (the same 350-byte shape as TRAN-RECORD), which gives the
    # file_state assertion a known starting content.
    TRANSACT: {base: DALYTRAN}
  parameters:
    clock_mode: relative
  faults: []
# PASSWORD is the documented demo password of README.md, not a secret.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '10'
  - aid: ENTER
    '@map': COBIL00
    fields:
      ACTIDIN: '00000000001'
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: 'CM00'
    PGMNAME: 'COMEN01C'
    OPTN010: '10. Bill Payment                        '
    ERRMSG: '                                                                              '
  - '@map': COBIL00
    TRNNAME: 'CB00'
    PGMNAME: 'COBIL00C'
    ACTIDIN: '           '
    CURBAL: '              '
    ERRMSG: '                                                                              '
  - '@map': COBIL00
    TRNNAME: 'CB00'
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: 'COBIL00C'
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ACTIDIN: '00000000001'
    CURBAL: '-0000000000.01'
    CONFIRM: ' '
    ERRMSG: 'You have nothing to pay...                                                    '
  # The ERRMSG of each step: the menu and the empty bill payment screen carry none.
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'You have nothing to pay...                                                    '
  file_state:
    # The account is read for update but never rewritten: all 50 accounts stand,
    # and account 1 keeps the loaded balance of -0.01.
    ACCTDATA:
      count: 50
      contains:
      - ACCT-ID: '1'
        ACCT-ACTIVE-STATUS: 'Y'
        ACCT-CURR-BAL: '-0.01'
        ACCT-CREDIT-LIMIT: '2020.00'
        ACCT-CASH-CREDIT-LIMIT: '1020.00'
        ACCT-OPEN-DATE: '2014-11-20'
        ACCT-EXPIRAION-DATE: '2025-05-20'
        ACCT-REISSUE-DATE: '2025-05-20'
        ACCT-CURR-CYC-CREDIT: '0.00'
        ACCT-CURR-CYC-DEBIT: '0.00'
        ACCT-ADDR-ZIP: 'A000000000'
        ACCT-GROUP-ID: '          '
    # No payment transaction is written: TRANSACT still holds the 300 fixture
    # records, and the highest of them, the key a payment would follow, is
    # unchanged.
    TRANSACT:
      count: 300
      contains:
      - TRAN-ID: '0000000996722787'
        TRAN-TYPE-CD: '01'
        TRAN-CAT-CD: '1'
        TRAN-SOURCE: 'POS TERM  '
        TRAN-DESC: 'Purchase at Kilback LLC                                                                             '
        TRAN-AMT: '603.22'
        TRAN-MERCHANT-ID: '800000000'
        TRAN-MERCHANT-NAME: 'Kilback LLC                                       '
        TRAN-MERCHANT-CITY: 'Cummeratamouth                                    '
        TRAN-MERCHANT-ZIP: '53200-7529'
        TRAN-CARD-NUM: '3260763612337560'
        TRAN-ORIG-TS: '2022-06-10 19:27:53.000000'
        TRAN-PROC-TS: '                          '
