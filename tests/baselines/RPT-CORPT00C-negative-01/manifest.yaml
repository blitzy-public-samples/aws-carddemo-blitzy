# Manifest of the derived baseline of RPT-CORPT00C-negative-01: PF5 on the
# Transaction Reports screen reaches CORPT00C's WHEN OTHER, which sends
# CORPT00 again with CCDA-MSG-INVALID-KEY 'Invalid key pressed. Please see
# below...' in ERRMSG [app/cbl/CORPT00C.cbl:183-194]
# [app/cpy/CSMSG01Y.cpy:20-21]. Only unikix can run the scenario, so
# expected.yaml is authored from the source, not captured, and is
# inferred-not-observed (GAP-INF-009, GAP-INF-012). It names no execution_id
# or execution_fingerprint and holds no datasets/ until an eligible UniKix run
# is imported (report.py --import-unikix).
#
# source_identity.units are every app/ source the steps execute, not only
# CORPT00C, CSMSG01Y and CORPT00.bms: the COPY closure
# (inventory_tools.copy_closure, symbolic maps in app/cpy-bms included) of
# COSGN00C, which signs USER0001 on, COMEN01C, whose option 9 XCTLs to
# CORPT00C, and CORPT00C; plus the BMS sources of the COSGN00, COMEN01 and
# CORPT00 maps. app/cbl/CSUTLDTC.cbl is left out although CORPT00C CALLs it:
# the CALLs sit in PROCESS-ENTER-KEY, which neither the first entry nor the
# PF5 reentry reaches. DFHAID and DFHBMSCA are CICS-supplied and not in the
# repository. source_commit is HEAD at authoring; app/ is byte-identical to
# the suite's starting commit 93ebec71ff7b59a68cedd7c501afe496a8eaa68d.
