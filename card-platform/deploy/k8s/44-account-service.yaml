# Deployment and Service for the account service, which is to serve account and
# customer reads and updates and close the billing cycle.
#
# No other service calls this one. It publishes account.state-changed, and the
# authorization service consumes that stream to keep its own
# account_credit_snapshot replica current, so the decline rules read a local table
# rather than waiting on this service.
#
# Read path: app/cbl/COACTVWC.cbl. Update path and concurrent-change detection:
# app/cbl/COACTUPC.cbl. Cycle-counter reset: app/cbl/CBACT04C.cbl:L353-L354.
#
# AccountUpdateService, ConcurrentChangeDetector, BillingCycleService, the edit
# library, OutboxWriter and OutboxRelay are all present. The module registers no
# controller and no listener, so the container starts, migrates its schema,
# publishes account.state-changed rows its relay finds and answers /actuator.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: carddemo
  labels:
    app.kubernetes.io/name: account-service
    app.kubernetes.io/component: account
    app.kubernetes.io/part-of: card-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: account-service
      app.kubernetes.io/part-of: card-platform
  template:
    metadata:
      labels:
        # 10-kafka.yaml and 20-postgres.yaml admit the six services by name
        # and by part-of, naming each one individually. A Pod that carries
        # part-of alone reaches neither the broker nor the database.
        app.kubernetes.io/name: account-service
        app.kubernetes.io/component: account
        app.kubernetes.io/part-of: card-platform
    spec:
      automountServiceAccountToken: false
      # Account 10001 owns /app in the image. 00-namespace.yaml refuses root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # The mounted keystore, truststore and certificate authority arrive
        # owned by root. fsGroup gives group 10001 read access to them.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: account-service
          # Built from card-platform/services/account-service/Dockerfile, and named by an
          # explicit tag, as all six platform images in this folder are.
          # 40-authorization-service.yaml states the whole policy once, including why the
          # two upstream images are digest-pinned and these six are not.
          #
          # Build and load the image before applying this file. The context is the module
          # directory, the one the Dockerfile header names:
          #
          #   version=$(mvn -f card-platform/pom.xml help:evaluate \
          #     -Dexpression=project.version -q -DforceStdout)
          #   mvn -f card-platform/pom.xml -pl services/account-service -am package
          #   docker build -f card-platform/services/account-service/Dockerfile \
          #     -t "carddemo/account-service:${version}" \
          #     card-platform/services/account-service
          image: carddemo/account-service:1.0.0-SNAPSHOT
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # /app holds the archive alone, and the Dockerfile pins TMPDIR
            # and java.io.tmpdir to /tmp, so the volume below is the one
            # writable path.
            readOnlyRootFilesystem: true
          ports:
            # 8080 carries the Representational State Transfer (REST) surface,
            # and the Service below targets it. 9080 carries /actuator and
            # matches MANAGEMENT_PORT in 30-configmap.yaml. No Service exposes
            # 9080. Both ports speak Transport Layer Security (TLS).
            # 30-configmap.yaml sets SERVER_SSL_ENABLED and
            # MANAGEMENT_SSL_ENABLED.
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9080
          envFrom:
            # Database address, broker address, topic names, log levels, the
            # three request-identity usernames and the transport settings.
            # No credential appears there.
            - configMapRef:
                name: carddemo-config
            # The two credentials this service owns: the password of its
            # database login and the password of its broker identity. No other
            # service reads this Secret.
            - secretRef:
                name: carddemo-account-secret
            # The three request-identity password hashes, shared by all six
            # services. This service's application.yml declares no default for
            # them, so an absent hash fails start-up.
            - secretRef:
                name: carddemo-identity-secret
          env:
            # The schema and the database login this service owns. envFrom
            # above pulls the whole ConfigMap, so each Deployment binds by name
            # the keys it owns and reads no other service's.
            - name: SPRING_FLYWAY_SCHEMAS
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: ACCOUNT_DB_SCHEMA
            - name: SPRING_FLYWAY_DEFAULT_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: ACCOUNT_DB_SCHEMA
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: ACCOUNT_DB_SCHEMA
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: ACCOUNT_DB_USER
            # The datasource address this service owns. The five values below
            # are declared in this list and not pulled in by envFrom. $(VAR)
            # expansion reads this list alone. 30-configmap.yaml carries the
            # options suffix and no database name.
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: POSTGRES_PORT
            - name: ACCOUNT_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: ACCOUNT_DB_NAME
            - name: ACCOUNT_DB_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: ACCOUNT_DB_SCHEMA
            - name: SPRING_DATASOURCE_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: SPRING_DATASOURCE_OPTIONS
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/$(ACCOUNT_DB_NAME)?currentSchema=$(ACCOUNT_DB_SCHEMA)&$(SPRING_DATASOURCE_OPTIONS)"
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: ACCOUNT_KAFKA_USER
            # The group the posted-transaction listener joins. Spring reads the first key and
            # config/StreamNameReport reports the second, so a renamed group is visible in
            # the start-up log rather than only in the broker. 10-kafka.yaml grants this
            # identity consumer access to transaction.posted under the same group.
            - name: SPRING_KAFKA_CONSUMER_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: GROUP_ACCOUNT_POSTED
            - name: GROUP_ACCOUNT_POSTED
              valueFrom:
                configMapKeyRef:
                  name: carddemo-config
                  key: GROUP_ACCOUNT_POSTED
            # Two Flyway locations, for the same reason 40-authorization-service.yaml names
            # two. db/migration reproduces app/data/ASCII/acctdata.txt value for value and all
            # 50 of its expiries fall in 2025; db/demo extends them to 2099-12-31 and touches
            # nothing else. This service publishes its expiry on every state change and the
            # authorization replica applies it, so the two copies of one record carry one
            # overlay or neither.
            - name: SPRING_FLYWAY_LOCATIONS
              value: "classpath:db/migration,classpath:db/demo"
            # The server keystore is private to this service; trust material is shared.
            - name: SERVER_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carddemo-account-tls-secret
                  key: SERVER_SSL_KEYSTORE_PASSWORD
            - name: SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carddemo-trust-secret
                  key: KAFKA_SSL_TRUSTSTORE_PASSWORD
          # Both probes read /actuator on the management port over TLS. Port
          # 8080 answers no management request. Readiness allows time for the
          # three schema migrations this service runs at startup, the third of
          # which seeds the reference data of app/cpy/CSLKPCDY.cpy.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
              scheme: HTTPS
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness reports process state and excludes every external
          # dependency, so a database outage withdraws this Pod from its Service
          # and restarts no process that is running correctly.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
              scheme: HTTPS
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          # The image caps the heap at 75 percent of the limit below.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            # The one writable path, capped at 64 mebibytes of memory.
            # card-platform/docker-compose.yml mounts a temporary filesystem
            # of the same size at the same place.
            - name: tmp
              mountPath: /tmp
            # Keystore, truststore and certificate authority, read-only. The
            # keystore is what this service presents on both ports. The
            # truststore is what it verifies the broker against. The authority
            # is what the database driver verifies the server against under
            # sslmode=verify-full.
            - name: transport-security
              mountPath: /etc/carddemo/tls
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: transport-security
          projected:
            defaultMode: 0640
            sources:
              - secret:
                  name: carddemo-account-tls-secret
                  items:
                    - key: keystore.p12
                      path: keystore.p12
              - secret:
                  name: carddemo-trust-secret
                  items:
                    - key: truststore.p12
                      path: truststore.p12
                    - key: ca.crt
                      path: ca.crt
---
# Pods reach this service at account-service:8080, a short name DNS resolves.
# The authorization service reads it there, and nothing outside the cluster
# reaches it.
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: carddemo
  labels:
    app.kubernetes.io/name: account-service
    app.kubernetes.io/component: account
    app.kubernetes.io/part-of: card-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: account-service
    app.kubernetes.io/part-of: card-platform
  ports:
    # 8080 alone. A Service address is what every pod in the cluster resolves,
    # and /actuator answers on 9080.
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
# Network policy for the account pod. Ingress admits its business and management
# surfaces. Egress admits only Domain Name System (DNS), PostgreSQL and Kafka.
#
# This is one of the two supporting services the authorization service reads while it
# applies the decline rules. What carries a credit limit and two cycle balances between
# the two services is the account.state-changed stream and not a call, and the broker
# listener it travels on is SASL_SSL for the same reason this policy exists: a cluster
# pod network is a path shared with every other workload on the cluster.
#
# The authorization service is not among the callers. It reads its own copy of the two
# accumulators and the expiry date, refreshed by the state changes this service
# publishes, so no ingress rule here exists on its behalf.
#
# config/SecurityConfig authenticates every call to the account and customer surface
# and checks ownership before a handler runs. It leaves /actuator/health open for
# probes and requires ROLE_MONITORING for metrics and the Prometheus scrape. An
# anonymous caller receives 401; an identity holding a business role receives 403.
# This policy closes the same two gaps at the network layer.
# 40-authorization-service.yaml carries the same shape and the note on kubelet probes,
# which originate from the node and match neither selector below.
#
# A cluster whose Container Network Interface plug-in does not implement
# NetworkPolicy ignores this object. Confirm support before treating the service as
# isolated.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: account-service-ingress
  namespace: carddemo
  labels:
    app.kubernetes.io/name: account-service
    app.kubernetes.io/component: account
    app.kubernetes.io/part-of: card-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: account-service
      app.kubernetes.io/part-of: card-platform
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The account, customer and cycle-close surface. Any pod of this platform may call
    # it, and Spring Security authenticates every request that arrives.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: card-platform
      ports:
        - port: 8080
          protocol: TCP
    # The management surface. A monitoring collector carries the label below and
    # nothing else in this namespace does, so no business pod reaches this port.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: monitoring
      ports:
        - port: 9080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
              app.kubernetes.io/part-of: card-platform
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
              app.kubernetes.io/part-of: card-platform
      ports:
        - port: 9092
          protocol: TCP
