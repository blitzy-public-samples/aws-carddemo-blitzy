# CardDemo Application - English Locale Messages
# Locale: en (English)
# Encoding: UTF-8
#
# This file provides English locale-specific internationalization (i18n) messages
# for the CardDemo Spring Boot application. Content is identical to the base
# messages.properties file, as the original COBOL application was English-only.
#
# Spring Boot MessageSource automatically selects this file when:
# - Accept-Language HTTP header specifies 'en'
# - System default locale is English
# - Explicit Locale.ENGLISH is specified in code
#
# Future internationalization to other languages (es, fr, de, etc.) would create
# additional messages_XX.properties files with translated values while maintaining
# identical key structure for proper message resolution.
#
# Message Format Placeholders:
# - {0}, {1}, {2}... : MessageFormat placeholders for dynamic values
# - Example: carddemo.validation.size=Field {0} must be between {1} and {2} characters
#
# Source COBOL Copybooks:
# - CSMSG01Y.cpy : Common messages
# - CSMSG02Y.cpy : Abend messages structure
# - COTTL01Y.cpy : Screen titles

