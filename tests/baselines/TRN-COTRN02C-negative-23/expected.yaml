# Derived baseline (capture_platform: derived) of scenario
# TRN-COTRN02C-negative-23, authored from the app/ source because no TPE
# region runs in CI; only `report.py --import-unikix` replaces it, from
# imported UniKix evidence, and it is never edited by hand to match a run.
#
# USER0001 signs on and takes main-menu option 8 (Transaction Add) to COTRN02C
# [app/cbl/COSGN00C.cbl:230-237] [app/cbl/COMEN01C.cbl:86-90,115-156]
# [app/cpy/COMEN02Y.cpy:67-72]. On first entry COTRN02C sends COTRN02 from a
# cleared map with a blank ERRMSG [app/cbl/COTRN02C.cbl:115-130,516-571].
# Step 3 enters a full transaction for card 0500024453765740 with Orig Date
# 2022-02-30:
# - the card branch reads CCXREF by card (NORMAL) and moves XREF-ACCT-ID
#   00000000050 to ACTIDIN [app/cbl/COTRN02C.cbl:210-223,609-637]
#   [app/data/ASCII/cardxref.txt:1];
# - every field is supplied, Type and Category are numeric, the amount and
#   both dates have their character forms, and NUMVAL-C re-edits
#   +00000012.34 unchanged through PIC +99999999.99
#   [app/cbl/COTRN02C.cbl:59,251-386];
# - for Orig Date 2022-02-30 with mask YYYY-MM-DD the inferred CEEDAYS
#   feedback is 09CC (FC-BAD-DATE-VALUE), returned as severity 0003 and
#   message 2508, which is neither '0000' nor the tolerated '2513', so
#   'Orig Date - Not a valid date...' is sent with the cursor on TORIGDT
#   [app/cbl/COTRN02C.cbl:60-69,389-407] [app/cbl/CSUTLDTC.cbl:61-70,103-150];
# - SEND-TRNADD-SCREEN RETURNs with TRANSID CT02, so the Proc Date check, the
#   Merchant ID check, the CONFIRM evaluation and ADD-TRANSACTION never run,
#   CONFIRM stays blank and TRANSACT keeps its 300 fixture records
#   [app/cbl/COTRN02C.cbl:164-188,409-436,516-534].
# Which dates CEEDAYS refuses is inferred, never observed (GAP-INF-001), and
# whether UniKix supplies CEEDAYS is open (GAP-MIS-010); the UniKix copy's
# CSUTLDTC passes trimmed lengths (GAP-DOC-021), so a UniKix record of this
# path never verifies the app/ items that gap lists. Open under GAP-INF-007
# (derived TRN end-to-end baselines) and GAP-INF-012 (online-only copybooks).
#
# One screen per step, each the screen shown after the step's AID; messages
# holds each step's ERRMSG. Text is the whole BMS field with trailing spaces
# kept; ERRMSG is the 80-byte WS-MESSAGE in the 78-byte ERRMSGO. CURDATE and
# CURTIME come from the region clock, which UniKix cannot fix, hence the
# matchers. TRANSACT asserts the record count the scenario asserts, as derived
# baselines do until an observed run supplies every record.
file_state:
  TRANSACT:
    count: 300
messages:
- '                                                                              '
- '                                                                              '
- 'Orig Date - Not a valid date...                                               '
screens:
- '@map': COMEN01
  ERRMSG: '                                                                              '
  PGMNAME: COMEN01C
  TRNNAME: CM00
- '@map': COTRN02
  CURDATE:
    format: '%m/%d/%y'
    match: run-date
  CURTIME:
    match: run-time
  ERRMSG: '                                                                              '
  PGMNAME: COTRN02C
  TITLE01: '      AWS Mainframe Modernization       '
  TITLE02: '              CardDemo                  '
  TRNNAME: CT02
- '@map': COTRN02
  ACTIDIN: '00000000050'
  CARDNIN: '0500024453765740'
  CONFIRM: ' '
  CURDATE:
    format: '%m/%d/%y'
    match: run-date
  CURTIME:
    match: run-time
  ERRMSG: 'Orig Date - Not a valid date...                                               '
  MCITY: 'Testville                '
  MID: '800000001'
  MNAME: 'Test Merchant                 '
  MZIP: '27601     '
  PGMNAME: COTRN02C
  TCATCD: '0001'
  TDESC: 'Test purchase                                               '
  TITLE01: '      AWS Mainframe Modernization       '
  TITLE02: '              CardDemo                  '
  TORIGDT: '2022-02-30'
  TPROCDT: '2022-07-01'
  TRNAMT: '+00000012.34'
  TRNNAME: CT02
  TRNSRC: 'POS TERM  '
  TTYPCD: '01'
