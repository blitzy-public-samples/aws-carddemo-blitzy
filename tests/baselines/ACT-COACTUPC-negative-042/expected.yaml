# Derived baseline of scenario ACT-COACTUPC-negative-042 (capture_platform:
# derived): USER0001 signs on, chooses main-menu option 2, fetches account
# 00000000001 on COACTUP, erases the Reissue Date year and presses ENTER.
# Authored from the app/ source, never captured; open until a UniKix run is
# imported (GAP-INF-005, GAP-INF-012).
# - Step 4: 1200-EDIT-MAP-INPUTS finds the reissue date changed, sets
#   ACUP-CHANGES-NOT-OK and edits Account Status, Open Date, Credit Limit,
#   Expiry Date and Cash Credit Limit, which pass, before performing
#   EDIT-DATE-CCYYMMDD with 'Reissue Date' [app/cbl/COACTUPC.cbl:1460-1507].
#   EDIT-YEAR-CCYY finds the year LOW-VALUES and strings FUNCTION TRIM('Reissue
#   Date') ' : Year must be supplied.' into WS-RETURN-MSG
#   [app/cpy/CSUTLDPY.cpy:25-46]; the date stays invalid, so CSUTLDTC is not
#   called. Every later message is guarded by WS-RETURN-MSG-OFF, and nothing
#   is read for update or rewritten [app/cbl/COACTUPC.cbl:2596-2597].
# - The screen re-shows the received values (3203-SHOW-UPDATED-VALUES),
#   PROMPT-FOR-CHANGES in INFOMSG, '*' in the blank RISYEAR (CSSETATY for
#   FLG-REISSUE-YEAR-BLANK) and a bright F12=Cancel; F5=Save stays dark
#   [app/cbl/COACTUPC.cbl:2870-2981,3260-3264,3566-3581] [app/cpy/CSSETATY.cpy].
# - The UniKix CSUTLDPY drops the TRIM, so UniKix pads 'Reissue Date' to 25
#   characters (GAP-DOC-024); this baseline pins the app/ text.
# One screen per step, each the screen shown after the step's AID; fields are
# full BMS width with trailing spaces kept; CURDATE and CURTIME come from the
# region clock and carry matchers. The scenario names no messages, so none are
# asserted here.
# file_state: both files keep their 50 records, account 00000000001 (reissue
# date still 2025-05-20) and the scenario's invented customer 000000001 as
# fetched.
