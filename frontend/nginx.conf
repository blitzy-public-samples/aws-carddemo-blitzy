# =============================================================================
# Nginx Configuration for CardDemo React Frontend
# =============================================================================
# Purpose:
#   Custom Nginx configuration for serving the React 18 single-page application
#   with proper SPA routing, API reverse proxy, security headers, compression,
#   and health check endpoint for Kubernetes orchestration.
#
# Features:
#   - SPA routing: All routes fallback to index.html
#   - API reverse proxy: /api/* forwarded to backend service
#   - Gzip compression: JS/CSS/HTML/JSON compressed (70% size reduction)
#   - Security headers: XSS, clickjacking, MIME-sniffing protection
#   - Cache control: Immutable assets cached 1 year, index.html no-cache
#   - Health check: /health endpoint for Kubernetes probes
#   - Non-root user compatible: Runs on unprivileged port 3000
#
# References:
#   - Agent Action Plan Section 0.3: API Gateway Layer
#   - Agent Action Plan Section 0.5: Frontend Framework specifications
# =============================================================================

# Run Nginx as non-root user (configured in Dockerfile)
# user directive commented out since we run as appuser via USER directive

# Worker processes: auto-detect CPU cores
# For containerized environments, typically 1-2 workers sufficient
worker_processes auto;

# Error log configuration
# Logs written to stderr for Docker log collection
error_log /var/log/nginx/error.log warn;

# PID file location
pid /var/run/nginx.pid;

# Events block: Connection processing configuration
events {
    # Maximum simultaneous connections per worker
    # Alpine Nginx default: 1024
    worker_connections 1024;
    
    # Optimized connection processing method for Linux
    use epoll;
}

# HTTP server configuration
http {
    # MIME types configuration
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    # Logs written to stdout for Docker log collection
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression configuration
    # Reduces response size by ~70% for text-based assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/x-font-ttf
        application/x-font-opentype
        application/vnd.ms-fontobject
        image/svg+xml
        image/x-icon;
    gzip_disable "msie6";

    # Server block: Frontend application
    server {
        # Listen on port 3000 (non-privileged port for non-root user)
        listen 3000;
        listen [::]:3000;
        
        # Server name (can be overridden in Kubernetes ingress)
        server_name localhost;

        # Document root: Static files from React build
        root /usr/share/nginx/html;
        index index.html;

        # Character set
        charset utf-8;

        # Security headers
        # X-Frame-Options: Prevent clickjacking attacks
        add_header X-Frame-Options "SAMEORIGIN" always;
        
        # X-Content-Type-Options: Prevent MIME-sniffing
        add_header X-Content-Type-Options "nosniff" always;
        
        # X-XSS-Protection: Enable browser XSS filter (legacy browsers)
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Content-Security-Policy: Mitigate XSS and injection attacks
        # Adjust policy based on your requirements
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://backend:8080;" always;
        
        # Referrer-Policy: Control referrer information
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health check endpoint for Kubernetes
        # Returns 200 OK for readiness/liveness probes
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API reverse proxy to backend service
        # Forwards /api/* requests to backend service
        # Default: http://backend:8080 (Kubernetes service name in same namespace)
        # For custom backend URL, rebuild image or use nginx config override
        location /api/ {
            # Backend service URL
            # In Kubernetes: 'backend' resolves to backend service in same namespace
            # In Docker Compose: 'backend' resolves to backend service via DNS
            # In local dev: Change to http://localhost:8080 if needed
            proxy_pass http://backend:8080/api/;
            
            # Proxy headers for proper request forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Timeouts for backend communication
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering configuration
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # Disable proxy cache for dynamic API responses
            proxy_cache off;
            
            # HTTP version for proxy connection
            proxy_http_version 1.1;
            
            # WebSocket support (if needed for future features)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Cache control for static assets
        # JavaScript and CSS files with content hash (e.g., main.abc123.js)
        # These files are immutable and can be cached indefinitely
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            
            # CORS headers for font files if needed
            add_header Access-Control-Allow-Origin "*";
        }

        # index.html: No caching for main entry point
        # Must be revalidated on every request to get latest version
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }

        # SPA routing: Fallback to index.html for all routes
        # React Router handles client-side routing
        # All non-API, non-static-file requests serve index.html
        location / {
            try_files $uri $uri/ /index.html;
            
            # Cache control for HTML files
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Custom error pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }

        # Deny access to hidden files (e.g., .htaccess, .git)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Deny access to backup files
        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}

# =============================================================================
# Configuration Notes
# =============================================================================
# 
# Backend URL Configuration:
#   Default: http://backend:8080
#   This default works for:
#   - Kubernetes deployments (backend service in same namespace)
#   - Docker Compose deployments (backend service name)
#   
#   To customize backend URL:
#   Option 1: Mount custom nginx.conf via ConfigMap (Kubernetes)
#   Option 2: Rebuild image with modified nginx.conf
#   Option 3: Use Kubernetes ingress to route /api to backend service
#
# Port Configuration:
#   - Port 3000: Non-privileged port for non-root user execution
#   - Can be changed to 80/443 if running as root (not recommended)
#
# SPA Routing:
#   - All routes serve index.html for client-side routing
#   - React Router handles navigation without server round-trips
#   - Preserves URL on page refresh
#
# Security Considerations:
#   - Content-Security-Policy may need adjustment based on third-party scripts
#   - CORS headers configured for API proxy
#   - Hidden file access denied
#   - Running as non-root user limits attack surface
#
# Performance:
#   - Gzip compression reduces bandwidth by ~70%
#   - Static asset caching eliminates redundant downloads
#   - sendfile and tcp_nopush optimize file transfer
#   - Connection keepalive reduces TCP handshake overhead
#
# Kubernetes Integration:
#   - Health check endpoint: /health
#   - Readiness probe: GET /health (200 OK)
#   - Liveness probe: GET /health (200 OK)
#   - Graceful shutdown: Nginx handles SIGTERM
#
# Logging:
#   - Access logs: /var/log/nginx/access.log
#   - Error logs: /var/log/nginx/error.log
#   - Both forwarded to Docker stdout/stderr
#   - Collected by Kubernetes logging infrastructure
#
# =============================================================================
