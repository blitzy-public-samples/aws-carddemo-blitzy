  reject_reason_codes: []
  messages:
  - START OF EXECUTION OF PROGRAM CBTRN02C
  - 'TRANSACTIONS PROCESSED :000000001'
  - 'TRANSACTIONS REJECTED  :000000000'
  - END OF EXECUTION OF PROGRAM CBTRN02C
  datasets:
    DALYREJS:
      count: 0
    TRANSACT:
      count: 1
      records:
      - TRAN-ID: '9900000000000331'
        TRAN-TYPE-CD: '01'
        TRAN-CAT-CD: '1'
        TRAN-SOURCE: 'POS TERM  '
        TRAN-AMT: '10.00'
        TRAN-CARD-NUM: '9680294154603697'
        TRAN-ORIG-TS: '2025-05-20 09:15:00.000000'
        TRAN-PROC-TS: '2022-07-06-10.00.00.000000'
  file_state:
