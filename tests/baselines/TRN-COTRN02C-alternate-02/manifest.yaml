# Manifest of the derived baseline of TRN-COTRN02C-alternate-02: PF3 on the
# COTRN02 Add Transaction screen, entered from main menu option 8, moves
# CDEMO-FROM-PROGRAM (COMEN01C) to CDEMO-TO-PROGRAM and XCTLs to COMEN01C, which
# sends the main menu COMEN01 afresh [app/cbl/COTRN02C.cbl:131-143,500-512].
# Only unikix can run the scenario, so expected.yaml is authored from the source
# (inferred-not-observed, GAP-INF-007, GAP-INF-012); the manifest names no
# execution_id or execution_fingerprint and the baseline holds no datasets/
# until an eligible UniKix run is imported (report.py --import-unikix).
#
# source_identity.units are the app/ sources the expected screens derive from:
# the COPY closure (inventory_tools.copy_closure) of each program the steps run,
# COSGN00C, COMEN01C and COTRN02C, and the BMS maps of their three screens.
# DFHAID and DFHBMSCA are CICS-supplied, not app/ sources, so they are absent;
# CSUTLDTC is absent because neither the first entry nor the PF3 branch of
# COTRN02C calls it.
