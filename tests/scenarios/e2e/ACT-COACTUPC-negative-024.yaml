# COACTUPC Open Date edit, last predicate: a date that passes every COBOL check
# of EDIT-DATE-CCYYMMDD reaches EDIT-DATE-LE, which calls CSUTLDTC with the mask
# YYYYMMDD. Only a non-zero CEEDAYS severity would compose 'Open Date validation
# error Sev code: <WS-SEVERITY> Message code: <WS-MSG-NO>' [app/cpy/CSUTLDPY.cpy:284-316].
# This scenario pins the derived outcome for 2015-01-31: severity 0, no message.
#
# Steps 1-3 fetch account 00000000001 and customer 000000001 as
# ACT-COACTUPC-alternate-04 does: sign-on through CC00, main-menu option 2,
# then the account id on the COACTUP search screen. 2000-DECIDE-ACTION reads
# CXACAIX, ACCTDAT and CUSTDAT, and 3202/3250 show the details with 'Update
# account details presented above.' and every editable field unprotected with
# MDT on, so all of them come back on the next AID
# [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,2955-3000,3500-3561,3608-3884].
# Step 4 types 2015, 01 and 31 over the fetched open date 2014-11-20 and presses
# ENTER. 1205-COMPARE-OLD-NEW finds the change [app/cbl/COACTUPC.cbl:1692], and
# 1200-EDIT-MAP-INPUTS moves 'Open Date' to WS-EDIT-VARIABLE-NAME and performs
# EDIT-DATE-CCYYMMDD through its exit [app/cbl/COACTUPC.cbl:1478-1482]:
# - EDIT-YEAR-CCYY: 2015 is supplied, numeric and of century 20
#   [app/cpy/CSUTLDPY.cpy:25-87] [app/cpy/CSUTLDWY.cpy:9-10].
# - EDIT-MONTH: 01 is supplied, within 1-12 and TEST-NUMVAL 0
#   [app/cpy/CSUTLDPY.cpy:91-144].
# - EDIT-DAY: 31 is supplied, numeric and within 1-31 [app/cpy/CSUTLDPY.cpy:150-204].
# - EDIT-DAY-MONTH-YEAR: January is a 31-day month and not February. The year,
#   month and day flags are all LOW-VALUES, so WS-EDIT-DATE-IS-VALID holds and
#   control falls through to EDIT-DATE-LE [app/cpy/CSUTLDPY.cpy:209-279].
# - EDIT-DATE-LE: CALL 'CSUTLDTC' USING WS-EDIT-DATE-CCYYMMDD, WS-DATE-FORMAT
#   ('YYYYMMDD') and WS-DATE-VALIDATION-RESULT. WS-SEVERITY-N 0 continues, the
#   day flag is set valid and WS-EDIT-DATE-IS-VALID is set
#   [app/cpy/CSUTLDPY.cpy:284-328].
# Every other field comes back with the fetched values, which pass every edit
# (ACT-COACTUPC-alternate-04), so INPUT-ERROR stays off and
# ACUP-CHANGES-OK-NOT-CONFIRMED is set [app/cbl/COACTUPC.cbl:1471-1675].
# Without PF5, 2000-DECIDE-ACTION does not run 9600-WRITE-PROCESSING, the sole
# READ UPDATE and REWRITE path [app/cbl/COACTUPC.cbl:2590-2621].
# 3203-SHOW-UPDATED-VALUES shows the received values with the new open date,
# 3250-SETUP-INFOMSG moves PROMPT-FOR-CONFIRMATION to INFOMSG and the blank
# WS-RETURN-MSG to ERRMSG, and 3390 makes F5=Save and F12=Cancel visible
# [app/cbl/COACTUPC.cbl:472-473,2870-2951,2955-2983,3566-3581].
#
# Why observed-only: severity 0 is derived, never observed, and the source
# leaves it open.
# - CSUTLDTC declares LS-DATE and LS-DATE-FORMAT as X(10) and gives CEEDAYS the
#   full 10-byte lengths [app/cbl/CSUTLDTC.cbl:86-88,105-113]. CSUTLDPY passes
#   the 8-byte WS-EDIT-DATE-CCYYMMDD and the 8-byte WS-DATE-FORMAT, so CEEDAYS
#   receives '20150131' followed by the first two bytes of WS-EDIT-DATE-BINARY.
#   That field has no VALUE and is computed only later, by the Date of Birth
#   edit [app/cpy/CSUTLDWY.cpy] [app/cbl/COACTUPC.cbl:1540]
#   [app/cpy/CSUTLDPY.cpy:345-346]. The mask arrives as 'YYYYMMDD' followed by
#   the two spaces that INITIALIZE leaves in WS-SEVERITY.
# - Every date that passes the COBOL checks is a real Gregorian date between
#   1900 and 2099, which CEEDAYS is expected to accept. The severity message
#   therefore has no known trigger, and the code's purpose is open (GAP-UNC-013).
#   Which dates CEEDAYS accepts is known only through the stub (GAP-INF-001).
# - The UniKix copy trims the Vstring lengths (GAP-DOC-021) and changes CSUTLDPY
#   (GAP-DOC-024), and whether UniKix supplies CEEDAYS is open (GAP-MIS-010). A
#   UniKix run therefore pins the UniKix copy's outcome but does not verify
#   app/'s.
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte INFOMSGO. ERRMSG is the
#   75-byte WS-RETURN-MSG, blank, in the 78-byte ERRMSGO, so it holds neither
#   an Open Date message nor 'validation error Sev code'.
# - The tpe adapter enters a field with EraseEOF before typing, so OPNYEAR,
#   OPNMON and OPNDAY hold exactly 2015, 01 and 31.
# - FKEY05 and FKEY12 keep their INITIAL text. On screen 3 they are dark
#   (ASKIP,DRK), and the s3270 capture renders a zero-intensity field as blanks.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by the invented data of the other COACTUPC
# update scenarios, which passes every edit. The repository record has FICO
# 274 and zip 12546, and either would be refused first
# [app/cbl/COACTUPC.cbl:2514-2558]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-024
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update) and fetches
  account 00000000001 with customer 000000001. The open date is changed from
  2014-11-20 to 2015-01-31, a date that passes every COBOL check of the Open
  Date edit and reaches the CSUTLDTC (CEEDAYS) check with the mask YYYYMMDD,
  and ENTER is pressed. CSUTLDTC returns severity 0, so no 'Open Date
  validation error Sev code: ... Message code: ...' appears. Every edit
  passes, and COACTUPC shows the new open date, protected, with 'Changes
  validated.Press F5 to save' and a blank message line. Nothing is saved before
  PF5.
# Primary item first, then the CSUTLDTC date acceptance the call reaches, the
# program, the maps asserted, the transaction of steps 3 and 4, the CSD files
# COACTUPC reads, and the online-only copybooks it copies. INV-ACT-031 ('Changes
# validated.Press F5 to save') is verified by ACT-COACTUPC-alternate-04.
# Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are verified by the
# SEC and MNU scenarios, and the batch record copybooks and data files at the
# lowest level that executes them.
inventory_ids:
- INV-ACT-082  # COACTUPC Open Date: CSUTLDTC severity 0 for mask YYYYMMDD (rule)
- INV-UTL-003  # CSUTLDTC date acceptance for masks YYYY-MM-DD and YYYYMMDD, reached through EDIT-DATE-LE
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and confirmation screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the validation
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the per-field error attributes
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-DATE-CCYYMMDD and EDIT-DATE-LE
- INV-LAY-014  # CSUTLDWY: the date-edit work areas and WS-DATE-VALIDATION-RESULT
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
# The severity message has no known trigger; the accepting outcome is pinned
# as derived until a run against a real CEEDAYS settles it.
- observed-only
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-INF-001  # which dates CEEDAYS accepts is known only through the stub
# Open uncertain-purpose entry for online code that is defined but never
# executed. Its item list does not name INV-ACT-082, but the question is the
# same: a message composed only on a severity no known input produces.
- GAP-UNC-013
- GAP-MIS-010  # whether UniKix supplies CEEDAYS
# The UniKix copy of CSUTLDPY drops TRIM from the composed date-edit messages
# and replaces TEST-NUMVAL in the month and day checks; it lists INV-ACT-082.
- GAP-DOC-024
# The UniKix copy of CSUTLDTC trims the Vstring lengths it passes to CEEDAYS,
# so the 10-byte date and mask described above differ on UniKix; it lists
# INV-ACT-082 and INV-UTL-003.
- GAP-DOC-021
# The UniKix COACTUPC comments out the TEST-NUMVAL-C amount checks this path
# runs, so the amounts re-edited on screen 4 may differ on UniKix.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
