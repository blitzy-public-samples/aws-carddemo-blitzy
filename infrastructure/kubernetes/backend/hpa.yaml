# Kubernetes HorizontalPodAutoscaler for CardDemo Backend Application
# 
# Purpose: Automatic scaling of backend pods based on CPU utilization to handle variable 
# transaction loads while maintaining sub-200ms response times at peak volumes.
#
# This HPA replaces the fixed-capacity CICS region scaling model from the mainframe
# with cloud-native elastic auto-scaling. It enables the backend to handle:
# - Normal loads: 3 replicas (minimum high availability)
# - Peak loads: Up to 10 replicas to support 10,000 TPS transaction volumes
# - CPU threshold: 70% average utilization triggers scaling
#
# Scaling Behavior:
# - Scale-up: Aggressive (50% increase per minute) to quickly respond to load spikes
# - Scale-down: Conservative (1 pod per minute, 5-minute stabilization) to prevent flapping
#
# Migration Context:
# Converted from: Fixed mainframe CICS region capacity
# Replaces: 15 CICS online transaction programs requiring elastic scaling
# Performance SLA: Sub-200ms response times maintained under all load conditions
#
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: carddemo
  labels:
    app: carddemo
    component: backend
    tier: application
  annotations:
    description: "Auto-scales backend deployment based on CPU utilization"
    performance-target: "Maintain sub-200ms response time at up to 10,000 TPS"
    converted-from: "Mainframe CICS region fixed capacity"
spec:
  # Target deployment to scale
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  
  # Replica bounds
  # minReplicas: 3 ensures high availability (minimum for production)
  # maxReplicas: 10 handles peak transaction volumes up to 10,000 TPS
  minReplicas: 3
  maxReplicas: 10
  
  # Metrics for scaling decisions
  metrics:
    # Primary metric: CPU utilization
    # 70% threshold balances resource utilization with performance headroom
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  
  # Scaling behavior controls
  behavior:
    # Scale-down behavior: Conservative approach to prevent flapping
    scaleDown:
      # Wait 5 minutes before allowing scale-down after previous scaling event
      # This prevents rapid up/down cycles during variable load patterns
      stabilizationWindowSeconds: 300
      policies:
        # Remove maximum 1 pod per minute
        # Gradual scale-down ensures service stability during load decrease
        - type: Pods
          value: 1
          periodSeconds: 60
      # Select the policy that removes the fewest pods (most conservative)
      selectPolicy: Min
    
    # Scale-up behavior: Aggressive approach to handle sudden load spikes
    scaleUp:
      # No stabilization window for scale-up (immediate response to load)
      # Quick scale-up critical for maintaining sub-200ms response times
      stabilizationWindowSeconds: 0
      policies:
        # Increase by 50% of current replicas per minute
        # Example: 4 replicas → 6 replicas in first minute
        # Aggressive scaling ensures performance SLA during traffic spikes
        - type: Percent
          value: 50
          periodSeconds: 60
        # Alternative: Add minimum 2 pods per minute for small deployments
        # Ensures meaningful scale-up even at minReplicas count
        - type: Pods
          value: 2
          periodSeconds: 60
      # Select the policy that adds the most pods (most aggressive)
      selectPolicy: Max
