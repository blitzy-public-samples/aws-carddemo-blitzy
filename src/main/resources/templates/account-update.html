  ~
  ~ Account Update screen (transaction CAUP, program COACTUPC).
  ~ Web equivalent of the legacy CICS BMS map COACTUP / CACTUPA
  ~ (legacy/app/bms/COACTUP.bms). This is the EDITABLE sibling of the
  ~ Account View screen: every account + customer field is rendered as an
  ~ UNPROT (editable) input, mirroring the BMS field POS/LENGTH/HILIGHT
  ~ contract for 1:1 UI parity (AAP 0.3.4). Shared 24x80 terminal chrome
  ~ (head/CSS, header band, message line, PF-key footer styling) is reused
  ~ from fragments/layout.html. No external UI library, CSS, or JavaScript.
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6"
      lang="en">

<head th:replace="~{fragments/layout :: head('Update Account')}"></head>

<body>
<!--/* BLITZY [QA-INFO-5 FIX]: keyboard skip-link to bypass the header band and jump
       straight to the main 24x80 screen content. Visually hidden off-canvas until
       focused (see .bms-skip-link in the shared layout fragment); revealed on Tab. */-->
<a class="bms-skip-link" href="#account-update-main">Skip to main content</a>

<!--
  Page-scoped layout styles. The 3270 palette, monospace 24x80 grid, and the
  shared colour classes (.bms-prompt turquoise label, .bms-input green editable
  field, .bms-heading white heading, .bms-sep separator, .bms-error red,
  .bms-footer/.bms-pfkey yellow) all come from fragments/layout.html. Only the
  screen-specific two-column grid, right-alignment for numeric/money inputs, and
  split date/SSN/phone separators are defined here. The shared layout.html is
  NOT modified. Class names are prefixed "acctupd-" to scope them to this screen.
-->
<style>
    .acctupd-h1 { font-size: inherit; margin: 0.25em 0 0.4em; text-align: center; }
    .acctupd-h2 { font-size: inherit; margin: 0.45em 0 0.2em; text-align: center; }
    /* One BMS line = one flex row split into a left and a right column so the
       limits column (BMS col 39+) stays aligned across lines 5-10 and 12-13. */
    .acctupd-row { display: flex; flex-wrap: wrap; align-items: baseline;
                   column-gap: 1ch; margin-top: 0.15em; }
    .acctupd-left  { flex: 0 0 38ch; display: flex; align-items: baseline; column-gap: 1ch; }
    .acctupd-right { flex: 1 1 auto;  display: flex; align-items: baseline; column-gap: 1ch; }
    /* Split groups: date (yyyy-mm-dd), SSN (3-2-4), phone (3 3 4). */
    .acctupd-seg { display: inline-flex; align-items: baseline; column-gap: 0.25ch; }
    /* Names line: three equal columns so the labels (BMS line 14) sit directly
       above their inputs (BMS line 15). */
    .acctupd-names   { display: flex; flex-wrap: wrap; column-gap: 1ch; margin-top: 0.15em; }
    .acctupd-namecol { flex: 0 0 26ch; display: flex; flex-direction: column; }
    /* Fixed 9ch lead-in so the three 50-char address inputs (BMS col 10) align. */
    .acctupd-fixed  { display: inline-block; width: 9ch; }
    .acctupd-prompt { white-space: nowrap; }
    /* JUSTIFY=(RIGHT) BMS fields (date + phone parts) and edited money fields
       (AAP 0.6.1) render right-aligned. Money values are plain edited text here;
       the service parses them to BigDecimal (scale 2, COBOL truncation) - the
       template performs NO arithmetic. */
    .acctupd-num   { text-align: right; }
    .acctupd-money { text-align: right; }
    /* BLITZY [QA-F4-3 FIX] WCAG 2.5.8 Target Size (Minimum) [AA]: the BMS
       character-cell inputs render only ~21px tall (the 16px Courier line box),
       just below the 24x24 minimum, which is the sole Lighthouse a11y failure on
       this screen. Raise the interactive hit-area to >=24px. The growth is
       VERTICAL only (min-height) - the min-width:24px floor is a no-op for every
       field on this screen (the narrowest, a 1-char input, already measures
       exactly 24px wide; all others are wider), so the monospace character grid,
       the 80-column width and the cross-line column alignment (AAP 0.3.4 24x80
       fidelity) are fully preserved. box-sizing:border-box folds the 1px HILIGHT
       underline into the 24px so the rendered box is exactly 24px. Re-verified:
       all 43 inputs >=24x24px, 0 pairwise collisions at 1280/768/480, Lighthouse
       target-size passes. */
    .bms-input { min-height: 24px; min-width: 24px; box-sizing: border-box; }
</style>

<main id="account-update-main" class="bms-screen">

    <!-- BMS lines 1-2: Tran/Date band + Prog/Time band. tranId=CAUP, programId=COACTUPC. -->
    <div th:replace="~{fragments/layout :: header('AWS Mainframe Modernization', 'CAUP', 'COACTUPC')}"></div>

    <!-- BMS line 4: screen heading 'Update Account' (NEUTRAL, centered). -->
    <h1 class="bms-heading acctupd-h1">Update Account</h1>

    <!--
      The form posts back to the CAUP handler. The PF-key pressed is carried in
      the "pfKey" request parameter by the submit buttons in the footer:
        ENTER = Process (validate / fetch)   PF3 = Exit
        PF5   = Save (persist, optimistic lock)  PF12 = Cancel
      Every editable field uses th:field (binds id+name+value to a property of
      accountUpdateForm) and a maxlength equal to the BMS field LENGTH. Split
      date/SSN/phone fields each bind to their own DTO property (never merged).
    -->
    <form th:object="${accountUpdateForm}" method="post" th:action="@{/account-update}"
          class="acctupd-form" autocomplete="off">

        <!-- ============================ ACCOUNT ============================ -->

        <!-- BMS line 5: Account Number (IC = initial cursor -> autofocus) + Active Y/N. -->
        <div class="acctupd-row">
            <span class="acctupd-left">
                <label class="bms-prompt acctupd-prompt" for="acctSid">Account Number :</label>
                <!-- REDEFINES dual view (AAP 0.6.6): COBOL CC-ACCT-ID X(11) REDEFINES
                     9(11) exposes SPACES-vs-numeric views. The DTO provides paired
                     string/numeric accessors; this input binds to the STRING accessor
                     (acctId) and the service performs the numeric conversion. -->
                <input th:field="*{acctSid}" type="text" class="bms-input"
                       maxlength="11" size="11" inputmode="numeric" autofocus="autofocus" />
            </span>
            <span class="acctupd-right">
                <label class="bms-prompt acctupd-prompt" for="acstTus">Active Y/N: </label>
                <input th:field="*{acstTus}" type="text" class="bms-input"
                       maxlength="1" size="1" />
            </span>
        </div>

        <!-- BMS line 6: Opened date (yyyy-mm-dd, right-justified) + Credit Limit (money). -->
        <div class="acctupd-row">
            <span class="acctupd-left">
                <label class="bms-prompt acctupd-prompt" for="opnYear">Opened :</label>
                <span class="acctupd-seg" role="group" aria-label="Opened date (year, month, day)">
                    <input th:field="*{opnYear}" type="text" class="bms-input acctupd-num"
                           maxlength="4" size="4" inputmode="numeric" aria-label="Opened year" />
                    <span class="bms-sep">-</span>
                    <input th:field="*{opnMon}" type="text" class="bms-input acctupd-num"
                           maxlength="2" size="2" inputmode="numeric" aria-label="Opened month" />
                    <span class="bms-sep">-</span>
                    <input th:field="*{opnDay}" type="text" class="bms-input acctupd-num"
                           maxlength="2" size="2" inputmode="numeric" aria-label="Opened day" />
                </span>
            </span>
            <span class="acctupd-right">
                <label class="bms-prompt acctupd-prompt" for="acrdLim">Credit Limit :</label>
                <!-- Money field (AAP 0.6.1): edited text only; service parses to
                     BigDecimal scale 2 with COBOL truncation. No template arithmetic. -->
                <input th:field="*{acrdLim}" type="text" class="bms-input acctupd-money"
                       maxlength="15" size="15" />
            </span>
        </div>

        <!-- BMS line 7: Expiry date (yyyy-mm-dd, right-justified) + Cash credit Limit (money). -->
        <div class="acctupd-row">
            <span class="acctupd-left">
                <label class="bms-prompt acctupd-prompt" for="expYear">Expiry :</label>
                <span class="acctupd-seg" role="group" aria-label="Expiry date (year, month, day)">
                    <input th:field="*{expYear}" type="text" class="bms-input acctupd-num"
                           maxlength="4" size="4" inputmode="numeric" aria-label="Expiry year" />
                    <span class="bms-sep">-</span>
                    <input th:field="*{expMon}" type="text" class="bms-input acctupd-num"
                           maxlength="2" size="2" inputmode="numeric" aria-label="Expiry month" />
                    <span class="bms-sep">-</span>
                    <input th:field="*{expDay}" type="text" class="bms-input acctupd-num"
                           maxlength="2" size="2" inputmode="numeric" aria-label="Expiry day" />
                </span>
            </span>
            <span class="acctupd-right">
                <label class="bms-prompt acctupd-prompt" for="acshLim">Cash credit Limit :</label>
                <input th:field="*{acshLim}" type="text" class="bms-input acctupd-money"
                       maxlength="15" size="15" />
            </span>
        </div>

        <!-- BMS line 8: Reissue date (yyyy-mm-dd, right-justified) + Current Balance (money). -->
        <div class="acctupd-row">
            <span class="acctupd-left">
                <label class="bms-prompt acctupd-prompt" for="risYear">Reissue:</label>
                <span class="acctupd-seg" role="group" aria-label="Reissue date (year, month, day)">
                    <input th:field="*{risYear}" type="text" class="bms-input acctupd-num"
                           maxlength="4" size="4" inputmode="numeric" aria-label="Reissue year" />
                    <span class="bms-sep">-</span>
                    <input th:field="*{risMon}" type="text" class="bms-input acctupd-num"
                           maxlength="2" size="2" inputmode="numeric" aria-label="Reissue month" />
                    <span class="bms-sep">-</span>
                    <input th:field="*{risDay}" type="text" class="bms-input acctupd-num"
                           maxlength="2" size="2" inputmode="numeric" aria-label="Reissue day" />
                </span>
            </span>
            <span class="acctupd-right">
                <label class="bms-prompt acctupd-prompt" for="acurBal">Current Balance :</label>
                <input th:field="*{acurBal}" type="text" class="bms-input acctupd-money"
                       maxlength="15" size="15" />
            </span>
        </div>

        <!-- BMS line 9: Current Cycle Credit (money) on the right column only. -->
        <div class="acctupd-row">
            <span class="acctupd-left"></span>
            <span class="acctupd-right">
                <label class="bms-prompt acctupd-prompt" for="acrCycr">Current Cycle Credit:</label>
                <input th:field="*{acrCycr}" type="text" class="bms-input acctupd-money"
                       maxlength="15" size="15" />
            </span>
        </div>

        <!-- BMS line 10: Account Group + Current Cycle Debit (money). -->
        <div class="acctupd-row">
            <span class="acctupd-left">
                <label class="bms-prompt acctupd-prompt" for="aaddGrp">Account Group:</label>
                <input th:field="*{aaddGrp}" type="text" class="bms-input"
                       maxlength="10" size="10" />
            </span>
            <span class="acctupd-right">
                <label class="bms-prompt acctupd-prompt" for="acrCydb">Current Cycle Debit :</label>
                <input th:field="*{acrCydb}" type="text" class="bms-input acctupd-money"
                       maxlength="15" size="15" />
            </span>
        </div>

        <!-- ============================ CUSTOMER =========================== -->

        <!-- BMS line 11: section heading 'Customer Details' (NEUTRAL, centered). -->
        <h2 class="bms-heading acctupd-h2">Customer Details</h2>

        <!-- BMS line 12: Customer id + SSN (3-2-4 split). -->
        <div class="acctupd-row">
            <span class="acctupd-left">
                <label class="bms-prompt acctupd-prompt" for="acstNum">Customer id :</label>
                <input th:field="*{acstNum}" type="text" class="bms-input"
                       maxlength="9" size="9" inputmode="numeric" />
            </span>
            <span class="acctupd-right">
                <label class="bms-prompt acctupd-prompt" for="actSsn1">SSN:</label>
                <span class="acctupd-seg" role="group" aria-label="Social Security Number (3-2-4 digits)">
                    <input th:field="*{actSsn1}" type="text" class="bms-input"
                           maxlength="3" size="3" inputmode="numeric"
                           placeholder="999" aria-label="SSN area number" />
                    <span class="bms-sep">-</span>
                    <input th:field="*{actSsn2}" type="text" class="bms-input"
                           maxlength="2" size="2" inputmode="numeric"
                           placeholder="99" aria-label="SSN group number" />
                    <span class="bms-sep">-</span>
                    <input th:field="*{actSsn3}" type="text" class="bms-input"
                           maxlength="4" size="4" inputmode="numeric"
                           placeholder="9999" aria-label="SSN serial number" />
                </span>
            </span>
        </div>

        <!-- BMS line 13: Date of birth (yyyy-mm-dd, right-justified) + FICO Score. -->
        <div class="acctupd-row">
            <span class="acctupd-left">
                <label class="bms-prompt acctupd-prompt" for="dobYear">Date of birth:</label>
                <span class="acctupd-seg" role="group" aria-label="Date of birth (year, month, day)">
                    <input th:field="*{dobYear}" type="text" class="bms-input acctupd-num"
                           maxlength="4" size="4" inputmode="numeric" aria-label="Birth year" />
                    <span class="bms-sep">-</span>
                    <input th:field="*{dobMon}" type="text" class="bms-input acctupd-num"
                           maxlength="2" size="2" inputmode="numeric" aria-label="Birth month" />
                    <span class="bms-sep">-</span>
                    <input th:field="*{dobDay}" type="text" class="bms-input acctupd-num"
                           maxlength="2" size="2" inputmode="numeric" aria-label="Birth day" />
                </span>
            </span>
            <span class="acctupd-right">
                <label class="bms-prompt acctupd-prompt" for="acstFco">FICO Score:</label>
                <input th:field="*{acstFco}" type="text" class="bms-input"
                       maxlength="3" size="3" inputmode="numeric" />
            </span>
        </div>

        <!-- BMS line 14 (labels) + line 15 (inputs): First / Middle / Last name. -->
        <div class="acctupd-names">
            <span class="acctupd-namecol">
                <label class="bms-prompt acctupd-prompt" for="acsFnam">First Name</label>
                <input th:field="*{acsFnam}" type="text" class="bms-input"
                       maxlength="25" size="25" />
            </span>
            <span class="acctupd-namecol">
                <label class="bms-prompt acctupd-prompt" for="acsMnam">Middle Name:</label>
                <input th:field="*{acsMnam}" type="text" class="bms-input"
                       maxlength="25" size="25" />
            </span>
            <span class="acctupd-namecol">
                <label class="bms-prompt acctupd-prompt" for="acsLnam">Last Name :</label>
                <input th:field="*{acsLnam}" type="text" class="bms-input"
                       maxlength="25" size="25" />
            </span>
        </div>

        <!-- BMS line 16: Address line 1 (50) + State (2). The 9ch lead-in label
             keeps the three address inputs (lines 16-18) left-aligned at BMS col 10. -->
        <div class="acctupd-row">
            <label class="bms-prompt acctupd-fixed" for="acsAdl1">Address:</label>
            <input th:field="*{acsAdl1}" type="text" class="bms-input"
                   maxlength="50" size="50" />
            <label class="bms-prompt acctupd-prompt" for="acsStte">State</label>
            <input th:field="*{acsStte}" type="text" class="bms-input"
                   maxlength="2" size="2" />
        </div>

        <!-- BMS line 17: Address line 2 (50, no label) + Zip (5). -->
        <div class="acctupd-row">
            <span class="acctupd-fixed" aria-hidden="true"></span>
            <input th:field="*{acsAdl2}" type="text" class="bms-input"
                   maxlength="50" size="50" aria-label="Address line 2" />
            <label class="bms-prompt acctupd-prompt" for="acsZipc">Zip</label>
            <input th:field="*{acsZipc}" type="text" class="bms-input"
                   maxlength="5" size="5" inputmode="numeric" />
        </div>

        <!-- BMS line 18: City (50) + Country (3). -->
        <div class="acctupd-row">
            <label class="bms-prompt acctupd-fixed" for="acsCity">City</label>
            <input th:field="*{acsCity}" type="text" class="bms-input"
                   maxlength="50" size="50" />
            <label class="bms-prompt acctupd-prompt" for="acsCtry">Country</label>
            <input th:field="*{acsCtry}" type="text" class="bms-input"
                   maxlength="3" size="3" />
        </div>

        <!-- BMS line 19: Phone 1 (area/prefix/line, right-justified, adjacent - no
             separators in BMS) + Government Issued Id Ref (20). -->
        <div class="acctupd-row">
            <label class="bms-prompt acctupd-prompt" for="acsPh1a">Phone 1:</label>
            <span class="acctupd-seg" role="group" aria-label="Phone 1 (area, prefix, line)">
                <input th:field="*{acsPh1a}" type="text" class="bms-input acctupd-num"
                       maxlength="3" size="3" inputmode="numeric" aria-label="Phone 1 area code" />
                <input th:field="*{acsPh1b}" type="text" class="bms-input acctupd-num"
                       maxlength="3" size="3" inputmode="numeric" aria-label="Phone 1 prefix" />
                <input th:field="*{acsPh1c}" type="text" class="bms-input acctupd-num"
                       maxlength="4" size="4" inputmode="numeric" aria-label="Phone 1 line number" />
            </span>
            <label class="bms-prompt acctupd-prompt" for="acsGovt">Government Issued Id Ref :</label>
            <input th:field="*{acsGovt}" type="text" class="bms-input"
                   maxlength="20" size="20" />
        </div>

        <!-- BMS line 20: Phone 2 (area/prefix/line) + EFT Account Id (10) +
             Primary Card Holder Y/N (1). -->
        <div class="acctupd-row">
            <label class="bms-prompt acctupd-prompt" for="acsPh2a">Phone 2:</label>
            <span class="acctupd-seg" role="group" aria-label="Phone 2 (area, prefix, line)">
                <input th:field="*{acsPh2a}" type="text" class="bms-input acctupd-num"
                       maxlength="3" size="3" inputmode="numeric" aria-label="Phone 2 area code" />
                <input th:field="*{acsPh2b}" type="text" class="bms-input acctupd-num"
                       maxlength="3" size="3" inputmode="numeric" aria-label="Phone 2 prefix" />
                <input th:field="*{acsPh2c}" type="text" class="bms-input acctupd-num"
                       maxlength="4" size="4" inputmode="numeric" aria-label="Phone 2 line number" />
            </span>
            <label class="bms-prompt acctupd-prompt" for="acsEftc">EFT Account Id:</label>
            <input th:field="*{acsEftc}" type="text" class="bms-input"
                   maxlength="10" size="10" />
            <label class="bms-prompt acctupd-prompt" for="acsPflg">Primary Card Holder Y/N:</label>
            <input th:field="*{acsPflg}" type="text" class="bms-input"
                   maxlength="1" size="1" />
        </div>

        <!-- BMS line 22 (INFOMSG, neutral) + line 23 (ERRMSG, red). Rendered by the
             shared messages fragment.
             BLITZY [QA-DEFECT#1 FIX]: AccountUpdateService sets the message on the bound
             screen DTO (screen.setErrMsg()/setInfoMsg()), not top-level model attributes,
             so ${errMsg}/${infoMsg} rendered empty (post-update success swallowed).
             AccountUpdateScreen has BOTH errMsg and infoMsg, so use the form-scoped
             effective pattern for each. -->
        <div th:replace="~{fragments/layout :: messages(${accountUpdateForm?.errMsg ?: errMsg}, ${accountUpdateForm?.infoMsg ?: infoMsg})}"></div>

        <!-- BMS line 24: PF-key legend rendered as interactive submit buttons (the
             web equivalent of the 3270 AID keys). Each carries the pressed key in
             the "pfKey" request parameter; the controller decides which keys are
             valid for the current state. ENTER is first so pressing Enter in any
             field triggers Process. In the BMS, F5=Save / F12=Cancel start as DRK
             (hidden) and become active after a successful fetch - here they are
             always rendered and the controller enforces validity. -->
        <div class="bms-footer bms-pfkey">
            <button type="submit" name="pfKey" value="ENTER">ENTER=Process</button>
            <button type="submit" name="pfKey" value="PF3">F3=Exit</button>
            <button type="submit" name="pfKey" value="PF5">F5=Save</button>
            <button type="submit" name="pfKey" value="PF12">F12=Cancel</button>
        </div>

    </form>

</main>

</body>
</html>
