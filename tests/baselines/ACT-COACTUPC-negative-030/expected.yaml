# Derived baseline of ACT-COACTUPC-negative-030 (capture_platform: derived),
# authored from app/ and never observed: open under GAP-INF-005 and GAP-INF-012.
# USER0001 fetches account 00000000001 on COACTUP, erases the Expiry Date month
# and presses ENTER. 1200-EDIT-MAP-INPUTS edits Expiry Date after Account
# Status, Open Date and Credit Limit; EDIT-MONTH finds WS-EDIT-DATE-MM
# LOW-VALUES and composes TRIM('Expiry Date') ' : Month must be supplied.' into
# WS-RETURN-MSG; the edit exits before the CSUTLDTC call, and 2000-DECIDE-ACTION
# only continues, so nothing is read for update or rewritten
# [app/cbl/COACTUPC.cbl:1174-1179,1452-1494,2596-2597]
# [app/cpy/CSUTLDPY.cpy:91-108,209-279].
# 3203-SHOW-UPDATED-VALUES shows the received values, 3250-SETUP-INFOMSG gives
# PROMPT-FOR-CHANGES, CSSETATY moves '*' to the 2-byte EXPMONO, and
# 3390-SETUP-INFOMSG-ATTRS shows F12=Cancel while F5=Save stays dark
# [app/cbl/COACTUPC.cbl:2955-2981,3243-3247,3566-3584]
# [app/cpy/CSSETATY.cpy:18-27].
# The text is app/'s CSUTLDPY message; the UniKix copy's differs (GAP-DOC-024)
# and never replaces it. Fields are at full BMS width, trailing spaces kept.
# file_state: both files keep their 50 records; the key records are the
# materialized fixtures decoded whole (FILLER included): ACCTDATA from
# app/data/ASCII/acctdata.txt, CUSTDATA with the scenario's invented customer.
file_state:
  ACCTDATA:
    contains:
    - ACCOUNT-RECORD.FILLER#1: '                                                                                                                                                                                  '
      ACCT-ACTIVE-STATUS: Y
      ACCT-ADDR-ZIP: A000000000
      ACCT-CASH-CREDIT-LIMIT: '1020.00'
