#
# junit-platform.properties - JUnit 5 (Jupiter) Platform configuration
# ---------------------------------------------------------------------------
# Project : AWS CardDemo - z/OS COBOL/CICS/VSAM/JCL/BMS modernized to
#           Java 25 + Spring Boot 3.5.x (package com.aws.carddemo).
# License : Apache License 2.0 (same posture as the repository LICENSE/NOTICE).
#
# Purpose : Project-wide, auto-detected JUnit 5 defaults for the entire test
#           suite - plain unit tests, Spring Boot @SpringBootTest integration
#           tests, Spring Batch JobLauncherTestUtils tests, and the golden-file
#           parity tests that compare Java output against the legacy COBOL
#           output (AAP 0.6.7).
#
#           This file MUST live at the test classpath root (src/test/resources/)
#           and be named exactly "junit-platform.properties"; the JUnit Platform
#           auto-detects it and applies every setting below to the whole run
#           launched by the Maven Surefire/Failsafe plugins (JUnit 5 is provided
#           by spring-boot-starter-test in pom.xml). No per-class annotations are
#           required for these platform-wide defaults to take effect, which keeps
#           behaviour consistent and reviewable across the >=80% coverage suite
#           (AAP 0.7.3).
#
#   !!! WARNING - PARALLEL TEST EXECUTION IS INTENTIONALLY DISABLED !!!
#           Spring application contexts, Spring Batch JobLauncherTestUtils, the
#           shared Testcontainers PostgreSQL instance, and the golden-file
#           fixtures are NOT guaranteed thread-safe across concurrent tests.
#           Running tests in parallel would corrupt shared database state and
#           make the deterministic golden-file parity strategy (AAP 0.6.7)
#           non-reproducible. Execution is kept strictly SEQUENTIAL. Do NOT
#           enable parallelism or add any "...parallel.mode..." keys here.
#
#           Only valid JUnit 5 configuration parameter names take effect;
#           unknown or misspelled keys are SILENTLY IGNORED by the platform.
#           Every key below was verified against the JUnit Jupiter engine
#           constants on the build classpath.
# ---------------------------------------------------------------------------

# --- Execution safety: sequential only -------------------------------------
# Master switch for parallel execution. Kept false so the whole suite runs
# sequentially on a single thread, protecting Spring contexts, Testcontainers,
# shared DB state, and golden-file determinism. Because no "parallel.mode.*"
# keys are set, nothing is ever marked concurrent regardless of this switch.
junit.jupiter.execution.parallel.enabled=false

# --- Test instance lifecycle ------------------------------------------------
# Restate the JUnit 5 default (a fresh test instance per @Test method) so the
# intent is explicit and reviewable, and to guard against accidental shared
# mutable per-class state leaking between parity tests. A class may still opt
# into PER_CLASS locally via @TestInstance(Lifecycle.PER_CLASS) when required.
junit.jupiter.testinstance.lifecycle.default=per_method

# --- Timeout handling -------------------------------------------------------
# Honour any per-test @Timeout annotations during normal runs, but disable them
# automatically while a debugger is attached (a paused breakpoint must not trip
# a timeout). Deliberately NO global "junit.jupiter.execution.timeout.default":
# the first Testcontainers image pull / PostgreSQL container startup can
# legitimately take a while, and a global timeout would cause false failures.
junit.jupiter.execution.timeout.mode=disabled_on_debug

# --- Reporting: readable display names --------------------------------------
# Replace underscores in method names with spaces in test reports, so a method
# such as posts_transaction_when_valid() renders as "posts transaction when
# valid" - making the COBOL-to-Java parity test report easy for reviewers to
# scan. Uses the binary class name with the '$' nested-class separator.
junit.jupiter.displayname.generator.default=org.junit.jupiter.api.DisplayNameGenerator$ReplaceUnderscores

# --- Reporting: deterministic method order ----------------------------------
# Order test methods alphabetically by name by default, giving reproducible
# runs that reinforce the deterministic theme of the golden-file parity
# strategy (AAP 0.6.7). This affects ordering only, never correctness; any
# class may override locally with @TestMethodOrder. Uses the '$' separator.
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$MethodName

# --- Extension autodetection (documented default) ---------------------------
# Keep extension autodetection OFF (the JUnit default). Every extension in this
# project is applied explicitly via annotations (@ExtendWith / @SpringBootTest /
# @Mock and similar), never auto-loaded from the classpath. Stated here only to
# document that intent; it does not change the default behaviour.
junit.jupiter.extensions.autodetection.enabled=false
