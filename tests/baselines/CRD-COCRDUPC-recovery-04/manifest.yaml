# Manifest of the derived baseline of CRD-COCRDUPC-recovery-04: the WHEN OTHER
# of COCRDUPC's 2000-DECIDE-ACTION names COCRDUPC as the culprit with code 0001
# and 'UNEXPECTED DATA SCENARIO', and ABEND-ROUTINE sends ABEND-DATA with
# SEND FROM ... ERASE and abends the task with 9999
# [app/cbl/COCRDUPC.cbl:1019-1026,1531-1556]. Only unikix can run the scenario,
# and no adapter can force the abend-class state it needs in the TPE region
# (GAP-MIS-014), so expected.yaml is authored from the source and is
# inferred-not-observed (GAP-INF-006, GAP-INF-012). It names no execution_id
# or execution_fingerprint and holds no datasets/ until report.py
# --import-unikix promotes an eligible UniKix run (MINOR if the decoded outcome
# is equal, MAJOR if it differs). derived_from is left out: the expectation
# comes from the source, not the tech spec.
#
# source_identity.units are every app/ unit the three steps execute, not only
# COCRDUPC and the CSMSG02Y layout of the sent ABEND-DATA
# [app/cpy/CSMSG02Y.cpy:21-29]: a source identity names each executed program,
# copybook and map, and expected.yaml asserts the COMEN01 screen COMEN01C
# sends. They are the COPY closure (inventory_tools.copy_closure) of COSGN00C,
# which signs USER0001 on and XCTLs to COMEN01C [app/cbl/COSGN00C.cbl:221-240];
# of COMEN01C, whose option 5 XCTLs to COCRDUPC [app/cpy/COMEN02Y.cpy:49-53]
# [app/cbl/COMEN01C.cbl:145-156]; and of COCRDUPC, including the
# procedure-division copybook CSSTRPFY [app/cbl/COCRDUPC.cbl:268-359,1528];
# plus the BMS sources of the maps COSGN00, COMEN01 and COCRDUP. That is the
# same set as CRD-COCRDUPC-alternate-01, which takes the same path to
# COCRDUPC. None of the three CALLs another app/cbl unit; DFHAID and DFHBMSCA
# are CICS-supplied, not app/ sources. source_commit is HEAD at authoring; app/
# there is byte-identical to the suite's starting commit
# 93ebec71ff7b59a68cedd7c501afe496a8eaa68d.
