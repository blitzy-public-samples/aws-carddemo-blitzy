# =====================================================================
# batch-service - Spring Boot application configuration.
#
# Batch-orchestration microservice: the Spring Batch re-platforming of
# the legacy COBOL batch programs (interest calculation CBACT04C /
# INTCALC.jcl, plus the data-management programs CBACT01C-CBACT03C,
# CBCUS01C, CBTRN01C, CBTRN03C) and the on-demand job-submission pattern
# of the REPROC / TRANREPT procs. The service stays resident to serve
# Actuator HTTP; jobs are triggered on demand via JobLauncher, never at
# startup. Every connection setting is environment-driven so the same
# artifact runs locally, under Docker Compose (SPRING_PROFILES_ACTIVE=
# docker) and on Kubernetes; the values below are developer-workstation
# defaults.
# =====================================================================
spring:
  application:
    name: batch-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carddemo}
    username: ${SPRING_DATASOURCE_USERNAME:carddemo}
    password: ${SPRING_DATASOURCE_PASSWORD:carddemo}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # This service owns no business tables; the owning services create
      # and migrate the shared schema. Hibernate neither creates nor
      # validates it here.
      ddl-auto: none

  # batch-service is the SINGLE Flyway migration owner for the shared
  # 'carddemo' database (QA CR-09/CR-16): it manages the Spring Batch metadata
  # schema (BATCH_* tables/sequences) via db/migration, and every other service
  # disables Flyway so only one history exists in the one public schema. A
  # dedicated history table keeps this bookkeeping isolated. baseline-on-migrate
  # is FALSE because this is a greenfield database - V1 must run on an empty
  # schema rather than being skipped past a synthetic baseline. Reconciliation
  # rationale: docs/decision-log.md.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    table: flyway_schema_history_batch

  # Batch jobs run ON-DEMAND via JobLauncher, never automatically at
  # startup. Flyway owns the metadata schema, so the JDBC initializer is
  # disabled.
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  # Pure batch service: no HTTP session. The legacy spring.session.store-type
  # property was removed in Boot 3.x/4.x and is inert (QA CR-15); with no
  # spring-session starter on the batch classpath, no session store is
  # configured - which is exactly the intent here, so no session block is set.

server:
  port: 8080

# Observability (AAP 0.7.5): health/info/prometheus exposure plus
# liveness/readiness probes for Kubernetes. The common 'application'
# metrics tag is contributed by carddemo-common ObservabilityConfig -
# do not duplicate it here.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Health detail is disclosed only to authenticated principals so an
      # anonymous caller cannot enumerate datastore/dependency internals
      # (QA MJ-16). Liveness/readiness aggregate status stays public for probes.
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  # Distributed tracing export (QA CR-12). The OTLP endpoint and the sampling
  # probability are environment-driven (QA MN-03): 100% capture is unsafe for
  # p95/memory NFRs in production, so the default is a 10% sample that each
  # environment overrides (e.g. 1.0 in dev, lower under load).
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}

# Data-management batch file roots (QA MJ-08 / CWE-22). Every job-parameter
# file name is confined to these allowlisted roots by BatchOutputPathResolver:
# 'output-dir' bounds files the jobs write (record dumps, category-balance and
# transaction-detail reports, the combined transaction file); 'input-dir' bounds
# the daily-transaction feed the validation-read job reads. Absolute paths,
# '..' traversal, and symlink escapes outside these roots are rejected. When a
# value is blank a <java.io.tmpdir>/carddemo-batch/{output,input} default is used.
carddemo:
  batch:
    output-dir: ${CARDDEMO_BATCH_OUTPUT_DIR:}
    input-dir: ${CARDDEMO_BATCH_INPUT_DIR:}

# ---------------------------------------------------------------------
# Docker Compose profile (SPRING_PROFILES_ACTIVE=docker). Compose passes
# explicit env vars; these defaults resolve the compose service
# hostnames (postgres, redis) even if a var is unset.
# ---------------------------------------------------------------------
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/carddemo}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
