# PF3 on the COUSR01C 'Add User' screen returns to the admin menu. ADMIN001
# signs on through CC00 and COSGN00C routes the type 'A' user to COADM01C
# [app/cbl/COSGN00C.cbl:221-237]. Option '2' of the admin menu is
# 'User Add (Security)', so COADM01C sets CDEMO-PGM-CONTEXT to 0 and XCTLs to
# COUSR01C [app/cbl/COADM01C.cbl:115-145] [app/cpy/COADM02Y.cpy:29-32].
# COUSR01C, not re-entered, clears its output map, sends COUSR01 with its own
# header (TRNNAME 'CU01', PGMNAME 'COUSR01C') and a blank message, and returns
# with TRANSID CU01 and the COMMAREA marked re-entered
# [app/cbl/COUSR01C.cbl:36-37,73-110,184-233].
# PF3 runs CU01 again: COUSR01C receives the map and, for DFHPF3, moves
# 'COADM01C' to CDEMO-TO-PROGRAM; RETURN-TO-PREV-SCREEN sets CDEMO-FROM-TRANID
# CU01, CDEMO-FROM-PROGRAM COUSR01C and CDEMO-PGM-CONTEXT 0, then XCTLs to
# COADM01C with the COMMAREA [app/cbl/COUSR01C.cbl:89-95,165-178]
# [app/cpy/COCOM01Y.cpy:19-31]. No USRSEC write is reached on this path.
# COADM01C, entered with a COMMAREA whose context is 0, takes its first-entry
# path again: it clears COADM1AO and sends the admin menu with ERASE, its own
# CA00 and COADM01C header, the COTTL01Y titles, the run clock's date and time,
# the four COADM02Y options strung into 40-byte texts, OPTN005-OPTN012 blank
# (CDEMO-ADMIN-OPT-COUNT is 4) and a blank ERRMSG, since WS-MESSAGE stays
# spaces [app/cbl/COADM01C.cbl:77-90,172-263] [app/cpy/COTTL01Y.cpy:17-22].
# Expected text values are full field width with their trailing spaces.
# CURDATE and CURTIME come from the region clock, so they are matchers and the
# clock is relative. The baseline is derived from the source: no TPE region
# runs in CI.
id: USR-COUSR01C-alternate-01
level: e2e
type: alternate
description: >-
  ADMIN001 signs on, selects admin menu option 2 'User Add (Security)' and
  reaches the COUSR01C Add User screen COUSR01 (transaction CU01). PF3 there
  transfers control back to COADM01C, which shows the admin menu COADM01 afresh
  with transaction CA00, program COADM01C, its four user-security options and
  no message.
inventory_ids:
- INV-USR-031  # COUSR01C PF3 return to COADM01C (navigation rule)
- INV-USR-002  # COUSR01C program
- INV-USR-006  # COUSR01 map, the screen PF3 is pressed on
- INV-MNU-004  # COADM01 map, the screen the XCTL lands on
- INV-CFG-024  # CU01 transaction, under which PF3 is processed
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA passed with the XCTL
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the header date and time
- INV-LAY-008  # CSMSG01Y copybook, copied by COUSR01C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-004  # user administration (USR) end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    # COSGN00C reads the sign-on user ADMIN001 from USRSEC.
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: ADMIN001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '2'}
    '@map': COADM01
  - aid: PF3
    fields: {}
    '@map': COUSR01
expected:
  screens:
  - '@map': COADM01
  - '@map': COUSR01
    TRNNAME: CU01
    PGMNAME: COUSR01C
    ERRMSG: '                                                                              '
  - '@map': COADM01
    TRNNAME: CA00
    PGMNAME: COADM01C
    TITLE01: '      AWS Mainframe Modernization       '
    TITLE02: '              CardDemo                  '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    OPTN001: '01. User List (Security)                '
    OPTN002: '02. User Add (Security)                 '
    OPTN003: '03. User Update (Security)              '
    OPTN004: '04. User Delete (Security)              '
    OPTN005: '                                        '
    OPTN006: '                                        '
    OPTN007: '                                        '
    OPTN008: '                                        '
    OPTN009: '                                        '
    OPTN010: '                                        '
    OPTN011: '                                        '
    OPTN012: '                                        '
    OPTION: '  '
    ERRMSG: '                                                                              '
