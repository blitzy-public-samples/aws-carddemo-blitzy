# Pytest Configuration for OCR Processing Service
# This configuration defines test discovery patterns, coverage settings,
# test markers, and execution options for the OCR service test suite.

[pytest]
# Test Discovery Settings
# Defines where pytest should look for tests and what patterns to match
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage Configuration
# Measures code coverage with 80% minimum threshold
# Generates HTML, terminal, and XML reports for CI/CD integration
addopts = 
    --cov=app
    --cov-report=html
    --cov-report=term
    --cov-report=xml
    --cov-report=term-missing
    --cov-fail-under=80
    --strict-markers
    --verbose
    --tb=short
    --maxfail=1

# Test Markers
# Enables selective test execution (e.g., pytest -m unit)
markers =
    unit: Unit tests - fast tests with no external dependencies
    integration: Integration tests - may require external services (Redis, RabbitMQ, cloud APIs)
    slow: Slow-running tests - OCR processing or large file operations
    ocr: OCR engine specific tests - Tesseract, Google Vision, AWS Textract
    nlp: NLP service tests - document classification, entity extraction, field validation
    api: API endpoint tests - FastAPI route testing

# Asyncio Configuration
# Enables automatic async test detection and execution
asyncio_mode = auto

# Logging Configuration
# Shows logs during test execution for debugging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# File Logging
# Captures test logs to file for post-execution analysis
log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Warning Filters
# Suppresses known deprecation warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    error::UserWarning

# Python Path Configuration
# Adds current directory to Python path for proper module imports
pythonpath = .

# Minimum Python Version
minversion = 3.12

# Test Timeouts
# Prevents tests from hanging indefinitely
timeout = 300
timeout_method = thread

# Output Configuration
# Controls test output verbosity and formatting
console_output_style = progress
junit_family = xunit2

[coverage:run]
# Coverage Measurement Configuration
source = app
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */virtualenv/*
    */.venv/*
    */site-packages/*
    */migrations/*
    */config.py
    */main.py

# Branch Coverage
# Measures both statement and branch coverage
branch = true

# Parallel Mode
# Enables parallel test execution with coverage
parallel = false

# Data File
# Location for coverage data storage
data_file = .coverage

[coverage:report]
# Coverage Reporting Configuration
precision = 2
show_missing = true
skip_covered = false
skip_empty = false
sort = Cover

# Coverage Thresholds
# Enforces 80% minimum coverage per requirements
fail_under = 80

# Exclude Patterns
# Patterns to exclude from coverage calculation
exclude_lines =
    pragma: no cover
    def __repr__
    def __str__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    if sys.version_info
    pass

[coverage:html]
# HTML Coverage Report Configuration
directory = htmlcov
title = OCR Service Test Coverage Report

[coverage:xml]
# XML Coverage Report Configuration
# Used by CI/CD tools and code quality services (SonarQube, Codecov)
output = coverage.xml

[coverage:json]
# JSON Coverage Report Configuration
# Enables programmatic coverage analysis
output = coverage.json
pretty_print = true
show_contexts = true
