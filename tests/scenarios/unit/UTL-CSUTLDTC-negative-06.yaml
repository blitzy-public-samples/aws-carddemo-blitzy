id: UTL-CSUTLDTC-negative-06
level: unit
type: negative
description: >-
  CEEDAYS returns the injected insufficient-data token x'09CB' for one call
  with the valid date 2022-07-18 and the mask YYYY-MM-DD, so the injection is
  the only cause of the outcome. CSUTLDTC takes the FC-INSUFFICIENT-DATA
  branch: its 80-byte result holds severity 0003, 'Mesg Code:' 2507 (x'09CB'),
  the text 'Insufficient' padded to 15 characters, 'TstDate:' and 'Mask
  used:', and it sets RETURN-CODE to the severity, 3. DTCDRV prints that
  result and RC=0003 and ends with exit status 0
  [app/cbl/CSUTLDTC.cbl:42-57,63,90-151].
inventory_ids:
- INV-UTL-002  # CSUTLDTC CEEDAYS feedback-token mapping (rule)
- INV-UTL-004  # CSUTLDTC result message layout and RETURN-CODE (interface)
- INV-UTL-001  # CSUTLDTC program
# Untagged: the expectation is CSUTLDTC's own mapping of the injected token,
# observed on gnucobol-batch. Which dates real CEEDAYS refuses (INV-UTL-003,
# GAP-INF-001) is not asserted here.
tags: []
gap_ids:
- GAP-STB-002  # the CEEDAYS stub, whose injection replaces the computed token
- GAP-STB-004  # DTCDRV in place of CSUTLDTC's CICS callers
- GAP-STB-011  # GnuCOBOL compile and runtime options in place of Enterprise COBOL and LE
preconditions:
  datasets: {}
  parameters:
    ceedays_feedback: '09CB'
    clock: '2022-07-06 10:00:00.00'
    clock_mode: fixed
  faults: []
inputs:
  program: CSUTLDTC
  param_files:
    # One DTCDRV call: date X(10), then mask X(10); the rest of the 80-byte
    # record is spaces.
    DTCIN:
    - '2022-07-18YYYY-MM-DD'
expected:
  # DTCDRV's exit status; CSUTLDTC's RETURN-CODE is the RC= field of its line.
  return_code: 0
  # RESULT bytes 46-47 are the binary Vstring length x'000A' that CSUTLDTC's
  # MOVE WS-DATE-TO-TEST TO WS-DATE copies into the result, so TstDate shows
  # '..2022-07-'; pinned as observed (HEX gives the raw bytes).
  messages:
  - 'DTCDRV DATE=2022-07-18 MASK=YYYY-MM-DD RC=0003 RESULT=0003Mesg Code: 2507 Insufficient    TstDate: ..2022-07- Mask used:YYYY-MM-DD     HEX=303030334D65736720436F64653A203235303720496E73756666696369656E7420202020547374446174653A20000A323032322D30372D204D61736B20757365643A595959592D4D4D2D444420202020'
