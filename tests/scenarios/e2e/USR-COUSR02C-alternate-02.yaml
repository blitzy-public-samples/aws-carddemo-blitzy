# An administrator fetches a repository user on the COUSR02 update screen and
# COUSR02C prompts 'Press PF5 key to save your updates ...'.
#
# Step 1: ADMIN001 signs on through CC00 and COSGN00C routes the type A user to
# the admin menu COADM01 (asserted here by its header only; its content belongs
# to SEC-COSGN00C-normal-01).
# Step 2: option '3' makes COADM01C XCTL to COADM02Y entry 3, COUSR02C, with
# CDEMO-PGM-CONTEXT 0 [app/cbl/COADM01C.cbl:115-145] [app/cpy/COADM02Y.cpy:34-37].
# COADM01C passes only the COCOM01Y COMMAREA, so the group MOVE into COUSR02C's
# longer CARDDEMO-COMMAREA pads CDEMO-CU02-USR-SELECTED with spaces and no user
# is fetched. COUSR02C clears COUSR2AO to LOW-VALUES and sends COUSR02 with its
# CU02 header, empty entry fields and a blank ERRMSG, then returns with TRANSID
# CU02 [app/cbl/COUSR02C.cbl:84-105,135-138,266-315].
# Step 3: ENTER with user id USER0003 starts CU02. PROCESS-ENTER-KEY reads
# USRSEC by the id with UPDATE; on RESP NORMAL READ-USER-SEC-FILE moves 'Press
# PF5 key to save your updates ...' to WS-MESSAGE and sends, then the record's
# names, password and type are moved into the map and the screen is sent again
# with the same message, which is the screen left standing
# [app/cbl/COUSR02C.cbl:108-110,143-172,320-339].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Text values are whole fields at their BMS length with trailing spaces:
#   ERRMSG is the first 78 bytes of the 80-byte WS-MESSAGE; FNAME and LNAME are
#   the 20-byte SEC-USR-FNAME and SEC-USR-LNAME of the USRSEC fixture record
#   USER0003 (LAURITZ ALME, type U) [app/cpy/CSUSR01Y.cpy:17-23].
# - PASSWD holds the record's password but is a dark field
#   (ATTRB=(DRK,FSET,UNPROT)) [app/bms/COUSR02.bms:130-134]. The screen capture
#   (s3270 Ascii1) renders every position of a zero-intensity field as a blank,
#   so it shows 8 spaces and the password never appears on the screen.
# - The header is POPULATE-HEADER-INFO's: the COTTL01Y titles, CU02, COUSR02C,
#   CURDATE mm/dd/yy and CURTIME hh:mm:ss of the run clock through CSDAT01Y,
#   hence the matchers and clock_mode relative.
# ERRMSG is asserted on every screen, so no separate expected.messages list
# repeats it. The fetch only reads USRSEC (READ UPDATE, released when the task
# returns), so no file_state is asserted: an unload would add a post-run
# observation without pinning anything this item changes.
id: USR-COUSR02C-alternate-02
level: e2e
type: alternate
description: >-
  ADMIN001 signs on, chooses admin menu option 3 'User Update (Security)' and
  fetches the repository user USER0003 on the COUSR02 update screen. COUSR02C
  reads the USRSEC record, shows its first name LAURITZ, last name ALME and type
  U with the password field dark, and prompts 'Press PF5 key to save your
  updates ...'.
inventory_ids:
- INV-USR-041  # COUSR02C message 'Press PF5 key to save your updates ...' (rule)
- INV-USR-003  # COUSR02C program
- INV-MNU-004  # COADM01 map, the admin menu the option is entered on
- INV-USR-007  # COUSR02 map, the update screen of steps 2-3
- INV-CFG-025  # CU02 transaction, under which the fetch runs
- INV-CFG-008  # USRSEC CSD file, read for update by the fetch
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA COADM01C passes with the XCTL
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the header date and time
- INV-LAY-008  # CSMSG01Y copybook, copied by COUSR02C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-004  # user administration (USR) end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    # The 10 repository users: ADMIN001 for the sign-on, USER0003 for the fetch.
    USRSEC:
      base: USRSEC
  parameters:
    clock_mode: relative
  faults: []
inputs:
  # PASSWORD is the README's documented demo password, the only sign-on
  # password scenarios may use; it is not a secret.
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: ADMIN001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '3'}
    '@map': COADM01
  - aid: ENTER
    fields: {USRIDIN: USER0003}
    '@map': COUSR02
expected:
  screens:
  - '@map': COADM01
    TRNNAME: CA00
    PGMNAME: COADM01C
  - '@map': COUSR02
    TRNNAME: CU02
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COUSR02C
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    USRIDIN: '        '
    FNAME: '                    '
    LNAME: '                    '
    PASSWD: '        '
    USRTYPE: ' '
    ERRMSG: '                                                                              '
  - '@map': COUSR02
    TRNNAME: CU02
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COUSR02C
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    USRIDIN: USER0003
    FNAME: 'LAURITZ             '
    LNAME: 'ALME                '
    PASSWD: '        '
    USRTYPE: U
    ERRMSG: 'Press PF5 key to save your updates ...                                        '
