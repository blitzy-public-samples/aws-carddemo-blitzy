<!--
  User Icon SVG
  
  Converted from BMS 3270 terminal screens:
  - COUSR00.bms (List Users)
  - COUSR01.bms (Add User)
  - COUSR02.bms (Update User)
  - COUSR03.bms (Delete User)
  
  Purpose: Represents user management and identity administration features
  Original context: Character-based user listings on mainframe terminal
  Modern usage: Scalable vector icon for React SPA user management pages
  
