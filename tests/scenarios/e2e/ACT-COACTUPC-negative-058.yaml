# COACTUPC field edit: a Current Cycle Credit Limit that is not a signed amount
# is refused with the ' is not valid' message of 1250-EDIT-SIGNED-9V2
# [app/cbl/COACTUPC.cbl:2180-2221].
#
# Steps 1-3 reach the COACTUP detail screen of account 00000000001 as
# ACT-COACTUPC-alternate-04 does: sign-on, main-menu option 2, then ENTER with
# the account id, which reads CXACAIX, ACCTDAT and CUSTDAT, stores the fetched
# records as the old values, sets ACUP-SHOW-DETAILS and unprotects the editable
# fields [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,2955-3000,3608-3884].
# Step 4 replaces the Current Cycle Credit field with ABC and presses ENTER:
# - 1100-RECEIVE-MAP moves the received 'ABC' (blank-padded to 15) to
#   ACUP-NEW-CURR-CYC-CREDIT-X; FUNCTION TEST-NUMVAL-C refuses it, so NUMVAL-C
#   is not applied and ACUP-NEW-CURR-CYC-CREDIT, which its -N item redefines,
#   keeps the spaces INITIALIZE gave it [app/cbl/COACTUPC.cbl:1047,1114-1126].
# - 1205-COMPARE-OLD-NEW finds it unequal to the fetched 0.00, so
#   1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs the field edits in
#   screen order [app/cbl/COACTUPC.cbl:1460-1470,1681-1704]. Account Status,
#   Open Date, Credit Limit, Expiry Date, Cash Credit Limit, Reissue Date and
#   Current Balance all pass with the fetched values, so WS-RETURN-MSG, cleared
#   at task start, is still off [app/cbl/COACTUPC.cbl:876,1472-1513].
# - The Current Cycle Credit edit moves its field name to WS-EDIT-VARIABLE-NAME,
#   which is PIC X(25): the 26-character 'Current Cycle Credit Limit' is
#   truncated to 'Current Cycle Credit Limi' (GAP-DEF-018)
#   [app/cbl/COACTUPC.cbl:53,1515]. 1250-EDIT-SIGNED-9V2 finds the field not
#   blank, TEST-NUMVAL-C refuses 'ABC', and the edit sets INPUT-ERROR and
#   FLG-SIGNED-NUMBER-NOT-OK and STRINGs the trimmed name and ' is not valid'
#   into WS-RETURN-MSG [app/cbl/COACTUPC.cbl:2180-2213]. The flag becomes
#   FLG-CURR-CYC-CREDIT-NOT-OK [app/cbl/COACTUPC.cbl:1520].
# - Every later edit passes on the fetched account and the invented customer,
#   and each writes its message only IF WS-RETURN-MSG-OFF, so this one stands.
# 2000-DECIDE-ACTION continues on ACUP-CHANGES-NOT-OK, so 9600-WRITE-PROCESSING
# does not run and nothing is rewritten [app/cbl/COACTUPC.cbl:2596-2597].
# 3203-SHOW-UPDATED-VALUES shows the received values: the other amounts
# re-edited through +ZZZ,ZZZ,ZZZ.99 because their edits passed, and the refused
# Current Cycle Credit as typed, from ACUP-NEW-CURR-CYC-CREDIT-X
# [app/cbl/COACTUPC.cbl:2870-2951]. 3250 sets PROMPT-FOR-CHANGES and moves
# WS-RETURN-MSG to ERRMSG; 3300 unprotects the fields again, puts the cursor on
# ACRCYCR and colours it red without the '*' of a blank field (CSSETATY); 3390
# makes F12=Cancel bright because a change was made, while F5=Save stays dark
# [app/cbl/COACTUPC.cbl:2955-2983,2986-3072,3285-3289,3566-3581]
# [app/cpy/CSSETATY.cpy:17-27].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - ERRMSG is the 38-character 'Current Cycle Credit Limi is not valid' in the
#   75-byte WS-RETURN-MSG, padded to the 78-byte ERRMSGO
#   [app/cbl/COACTUPC.cbl:479]. The inventory item describes the untruncated
#   name; the source cannot produce it, so the truncated text is pinned and
#   tagged suspected-defect.
# - INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte INFOMSGO.
# - Screen fields are compared at their full BMS length, trailing spaces kept;
#   ACRCYCR holds ABC padded to its 15 positions, and the s3270 capture renders
#   the dark FKEY05 as blanks.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
# The UniKix copy of COACTUPC comments out the TEST-NUMVAL-C checks and this
# ' is not valid' edit, so there ABC is not refused (GAP-DOC-022); app/
# behaviour is pinned.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, as in ACT-COACTUPC-alternate-04, so that only the Current Cycle Credit
# is in error. Account 00000000001 and its cross-reference stay as in the
# repository.
id: ACT-COACTUPC-negative-058
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001 and replaces the Current Cycle Credit with ABC. COACTUPC
  refuses the update: the message line reads 'Current Cycle Credit Limi is not
  valid', with the field name cut to the 25 characters of its holder, the
  entered values stay on the screen with ABC as typed and the prompt 'Update
  account details presented above.', and neither the account nor the customer
  record is rewritten.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-116  # COACTUPC Current Cycle Credit Limit: valid signed amount (1250-EDIT-SIGNED-9V2)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and error screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits use
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute of ACRCYCR
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the date edits of Open, Expiry, Reissue Date and Date of Birth, which pass
- INV-LAY-014  # CSUTLDWY: the date-edit work areas
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
- suspected-defect
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The 25-byte WS-EDIT-VARIABLE-NAME truncates 'Current Cycle Credit Limit'.
- GAP-DEF-018
# The UniKix COACTUPC comments out the TEST-NUMVAL-C checks and the ' is not
# valid' edit of 1250-EDIT-SIGNED-9V2, so ABC is accepted on UniKix.
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands.
- GAP-DOC-025
