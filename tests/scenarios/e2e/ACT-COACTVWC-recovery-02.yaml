# COACTVWC answers an unexpected program context with plain text. Once the
# PF3 test fails, its main EVALUATE tests CDEMO-PGM-CONTEXT (COCOM01Y,
# PIC 9(01): 0 is CDEMO-PGM-ENTER, 1 CDEMO-PGM-REENTER). Any other value takes
# WHEN OTHER: it fills the abend data of CSMSG02Y (ABEND-CULPRIT COACTVWC,
# ABEND-CODE '0001', ABEND-REASON blank) without abending, moves
# 'UNEXPECTED DATA SCENARIO' to the 75-byte WS-RETURN-MSG and performs
# SEND-PLAIN-TEXT. That sends the 75 bytes with SEND TEXT ... ERASE FREEKB and
# ends the task with a RETURN that names no TRANSID, so no map is shown and the
# pseudo-conversation ends [app/cbl/COACTVWC.cbl:117,278,323-383,877-887]
# [app/cpy/COCOM01Y.cpy:29-31] [app/cpy/CSMSG02Y.cpy:21-29].
#
# No terminal input reaches the branch. Every AID other than ENTER and PF3 is
# handled as ENTER (CSSTRPFY maps the AID into CVCRD01Y's CCARD-AID flags)
# [app/cbl/COACTVWC.cbl:299-314,913]; an entry without a COMMAREA or from the
# menu initializes the context to 0 [app/cbl/COACTVWC.cbl:282-293]; and every
# send of COACTVW sets it to 1 [app/cbl/COACTVWC.cbl:577-591]. The steps are
# the route to the ENTER the branch would answer: USER0001 signs on, menu
# option 1 lands on COACTVW (CAVW) with context 1, and account 00000000001 is
# entered. Run as they stand, that ENTER shows the account, so the scenario
# needs a COMMAREA whose context is neither 0 nor 1 when it arrives, and no
# adapter can place one. The fault vocabulary has no COMMAREA condition, so the
# precondition is declared in the abend class, since the branch fills the abend
# data as an abend would, on the account file the ENTER would otherwise read.
# No mechanism forces an abend-class condition in the TPE region, so the
# unikix adapter raises MissingPrerequisite under GAP-MIS-014 and the scenario
# stays implemented-unexecuted, never passed or failed on a run that did not
# take the branch.
#
# The branch reads no file, so the CXACAIX, ACCTDAT and CUSTDAT CSD file items
# are not listed; the account fixtures are loaded so the region holds the
# account the ENTER names, and USRSEC for the sign-on read. The UniKix copy of
# COACTVW.bms lacks the unnamed field at row 1, columns 1-9 (GAP-DOC-025). Only
# CURDATE and CURTIME depend on the clock; they are matchers, so the clock is
# relative (unikix cannot fix it, GAP-MIS-015). The baseline is derived from
# the source: no TPE region runs in CI.
id: ACT-COACTVWC-recovery-02
level: e2e
type: recovery
description: >-
  USER0001 signs on, selects main-menu option 1 'Account View' and enters
  account 00000000001 on COACTVW while the COMMAREA carries a program context
  other than enter (0) or re-enter (1). COACTVWC takes the WHEN OTHER branch of
  its main EVALUATE, erases the screen and sends the 75-byte WS-RETURN-MSG
  holding 'UNEXPECTED DATA SCENARIO' as plain text, then ends the
  pseudo-conversation. The terminal shows an unformatted screen whose first row
  is that text padded with spaces and whose other rows are blank. No adapter can
  supply such a COMMAREA, so the scenario is implemented-unexecuted under
  GAP-MIS-014.
inventory_ids:
- INV-ACT-016  # COACTVWC message 'UNEXPECTED DATA SCENARIO' (recovery)
- INV-ACT-001  # COACTVWC program
- INV-MNU-003  # COMEN01 map, the main menu option 1 is entered on
- INV-ACT-003  # COACTVW map, the screen the account id is entered on
- INV-CFG-010  # CAVW transaction, under which the ENTER is processed
- INV-LAY-002  # COCOM01Y: CDEMO-PGM-CONTEXT, the value the EVALUATE tests
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02 on COACTVW
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME on COACTVW
- INV-LAY-008  # CSMSG01Y, copied by COACTVWC
- INV-LAY-009  # CSMSG02Y: the abend data the branch fills
- INV-LAY-011  # CSSTRPFY: the AID mapping before the EVALUATE
- INV-LAY-019  # CVCRD01Y: CC-WORK-AREA and its CCARD-AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # account view and update (ACT) e2e baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-MIS-014  # no mechanism forces an abend-class condition in the TPE region
- GAP-DOC-025  # the UniKix COACTVW.bms differs from app/ at row 1, columns 1-9
preconditions:
  datasets:
    # COSGN00C reads the sign-on user.
    USRSEC: {base: USRSEC}
    # The files the ENTER on account 00000000001 would read through CXACAIX,
    # ACCTDAT and CUSTDAT had the context been 1.
    CARDXREF: {base: CARDXREF}
    ACCTDATA: {base: ACCTDATA}
    CUSTDATA: {base: CUSTDATA}
  parameters:
    clock_mode: relative
  # The stand-in for the unexpected-context COMMAREA described above. A future
  # mechanism must supply that COMMAREA itself: an abend on the ACCTDAT read
  # alone ends in ABEND-ROUTINE ('UNEXPECTED ABEND OCCURRED.'), not this branch.
  faults:
  - target: ACCTDAT
    operation: read
    condition: abend
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: USER0001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '1'}
    '@map': COMEN01
  - aid: ENTER
    fields: {ACCTSID: '00000000001'}
    '@map': COACTVW
expected:
  # Screen fields keep their full BMS length with trailing spaces: ERRMSG is 78
  # characters, the titles 40, INFOMSG 45.
  screens:
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    ERRMSG: '                                                                              '
  # COACTVWC's first entry from the menu: 1100-SCREEN-INIT sets the titles,
  # transaction, program, date and time; 1200-SETUP-SCREEN-VARS finds no info
  # message and sets the account-id prompt; WS-RETURN-MSG is blank
  # [app/cbl/COACTVWC.cbl:278,431-535].
  - '@map': COACTVW
    TRNNAME: CAVW
    PGMNAME: COACTVWC
    TITLE01: '      AWS Mainframe Modernization       '
    TITLE02: '              CardDemo                  '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    INFOMSG: 'Enter or update id of account to display     '
    ERRMSG: '                                                                              '
  # Derived from SEND TEXT: the 75 sent bytes from row 1, column 1, after ERASE,
  # and blanks elsewhere, as the 24 rows of 80 characters joined by line breaks
  # that adapters/base.py screen_text gives. Each source line below is one row:
  # '\ ' keeps a row's leading blank and '\n\' ends the row.
  - '@map': TEXT
    '@text': "UNEXPECTED DATA SCENARIO                                                        \n\
      \                                                                                \n\
      \                                                                                \n\
      \                                                                                \n\
      \                                                                                \n\
      \                                                                                \n\
      \                                                                                \n\
      \                                                                                \n\
      \                                                                                \n\
      \                                                                                \n\
      \                                                                                \n\
      \                                                                                \n\
      \                                                                                \n\
      \                                                                                \n\
      \                                                                                \n\
      \                                                                                \n\
      \                                                                                \n\
      \                                                                                \n\
      \                                                                                \n\
      \                                                                                \n\
      \                                                                                \n\
      \                                                                                \n\
      \                                                                                \n\
      \                                                                                "
  # The ERRMSG value of each step whose map has one: blank on the main menu and
  # on COACTVW; the unformatted screen has no ERRMSG field.
  messages:
  - '                                                                              '
  - '                                                                              '
