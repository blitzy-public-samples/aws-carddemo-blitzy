# Derived baseline of scenario USR-COUSR00C-boundary-02: with 11 users in
# USRSEC, ADMIN001 signs on, opens the user list from the admin menu and pages
# forward once. Authored from the source, never captured:
# app/cbl/COSGN00C.cbl (the type-A route to COADM01C), app/cbl/COADM01C.cbl
# with app/cpy/COADM02Y.cpy (option 1 transfers to COUSR00C), and
# app/cbl/COUSR00C.cbl:97-330,562-640 with app/bms/COUSR00.bms and
# app/cpy/COTTL01Y.cpy (the browse, the paging and the screen header). Open
# until a UniKix run is imported: GAP-INF-004 (derived USR end-to-end
# baselines) and GAP-INF-012 (online-only copybooks).
# One screen per step, the one shown after the step's AID: COADM01 after
# sign-on, COUSR00 page 1 after option 1, COUSR00 page 2 after PF8.
# Key order of the 11 users: the invented TESTU003 sorts sixth, between
# ADMIN005 and USER0001, so page 1 ends at USER0004 and the eleventh key,
# the fixture user USER0005, is alone on page 2.
# Page 1 carries no message: the eleventh READNEXT finds a record
# (COUSR00C.cbl:308-316). On page 2 the ENDFILE branch sends the map once
# mid-task, still showing the received page number, and the paragraph sends
# it again with PAGENUM '00000002' (COUSR00C.cbl:317-329,634-640); both sends
# erase. This baseline pins that final send, so a capture of the intermediate
# screen is an adapter timing issue, not a behavior change.
# Values are full BMS field width with their trailing spaces; CURDATE and
# CURTIME are run-clock matchers. messages holds each step's ERRMSG.
