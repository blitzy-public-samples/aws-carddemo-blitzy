# CREASTMT on the repository data: the statement job builds the TRXFL work file
# from the posted transactions and writes one text and one HTML statement per
# card [app/jcl/CREASTMT.JCL:19-96].
#
# TRANSACT holds the 300 repository daily transactions, 6 for each of the 50
# cross-reference cards, inside CBSTM03A's 51-card by 10-transaction table
# [app/cbl/CBSTM03A.CBL:225-233]; CARDXREF, ACCTDATA and CUSTDATA are the
# repository files. The five steps, each ending with RC 0:
# - DELDEF01 deletes any previous TRXFL work files, sets MAXCC to 0 and defines
#   the TRXFL cluster, KEYS(32 0) RECORDSIZE(350 350) [app/jcl/CREASTMT.JCL:22-39];
# - STEP010 sorts TRANSACT by card number and transaction id and restructures
#   it with OUTREC FIELDS=(1:263,16,17:1,262,279:279,50): card number, then
#   transaction id through merchant zip, then the origination timestamp and the
#   first 24 bytes of the processing timestamp. That is 328 bytes, padded with
#   spaces to the 350 of the SORTOUT LRECL, so the last 2 bytes of TRNX-PROC-TS
#   and the FILLER are padding; the repository transactions leave the processing
#   timestamp blank, so TRNX-PROC-TS is all spaces
#   [app/jcl/CREASTMT.JCL:44-54] [app/cpy/COSTM01.CPY:20-36];
# - STEP020 REPROs the sorted file into the TRXFL cluster [app/jcl/CREASTMT.JCL:56-61];
# - STEP030 deletes the previous statements, of which the fresh catalog holds
#   none [app/jcl/CREASTMT.JCL:66-75];
# - STEP040 runs CBSTM03A, which displays the job, step and DD names it finds in
#   the TIOT, then writes a statement for each cross-reference record in card
#   order: 25 lines of 80 bytes and 130 lines of 100 bytes per card
#   [app/jcl/CREASTMT.JCL:79-96] [app/cbl/CBSTM03A.CBL:262-342,345-723].
#
# On gnucobol-batch the utility steps run through the IDCAMS, SORT and IEFBR14
# replacements and the catalog emulation, and STEP040 reads the PSA, TCB and
# TIOT the page-zero shim builds from the step's DDs in JCL order. The DD names
# in the expected messages are CBSTM03A's own DISPLAY output, not dataset
# mappings. Where page zero cannot be mapped the scenario is blocked under
# GAP-MIS-002. COND=(0,NE) on STEP020-STEP040 is recorded and never evaluated
# there; every step ends with RC 0, so it bypasses nothing. The bypass is the
# JCL-semantics item of RPT-CREASTMT-recovery-01, which only unikix runs, so it
# is not listed here: listing it would take the scenario away from
# gnucobol-batch.
#
# Only the job item is listed. The CBSTM03A and CBSTM03B items, COSTM01, CUSTREC
# and the data files are verified at the lowest level that executes them, by
# the RPT-CBSTM03A unit scenarios; RPT-CBSTM03A-normal-01 transcribes as its
# TRXFL input exactly the 300 records this job builds.
#
# The UniKix copy comments out the control-block walk (GAP-DOC-020), rewrites
# the STEP010 sort (GAP-DOC-026) and defines TRXFL as a region file
# (GAP-DOC-030). The job item is among the items GAP-DOC-026 affects, so a
# unikix run of this scenario is reported as behavior of the UniKix copy and
# never verifies the app/ job.
#
# Expected text lines are full record width; decoded text keeps its trailing
# spaces and compares exactly. TRXFL is asserted in key order: the first record
# whole, and card number, transaction id and amount for every record. STMTFILE
# asserts the first statement whole and, for every other statement, its account
# line and its 'Total EXP:' line; HTMLFILE asserts the account heading and the
# end line of every document. The observed baseline's raw datasets pin every
# byte of all three.
id: RPT-CREASTMT-normal-01
level: integration
type: normal
description: >-
  Job CREASTMT on the 300 repository transactions and the repository
  cross-reference, account and customer files: DELDEF01 defines the TRXFL
  cluster, STEP010 sorts the transactions by card number and transaction id
  and restructures them to card number plus transaction id first, padded with
  spaces to 350 bytes, STEP020 loads them into TRXFL, STEP030 deletes the
  previous statements and STEP040 runs CBSTM03A, which displays the job, step
  and nine DD names and writes one statement per cross-reference card in card
  order: 50 text statements of 25 lines (1,250 records), each listing the
  card's six transactions and their total, and 50 HTML documents of 130 lines
  (6,500 records). Every step ends with return code 0.
inventory_ids:
- INV-RPT-007  # CREASTMT job
tags: []
gap_ids:
- GAP-MIS-002  # runs on gnucobol-batch only where the page-zero probe maps address 0
- GAP-STB-003  # page-zero PSA/TCB/TIOT shim in place of the z/OS control blocks
- GAP-STB-005  # IDCAMS DELETE, SET MAXCC, DEFINE CLUSTER and REPRO emulated
- GAP-STB-006  # DFSORT subset: SORT FIELDS, OUTREC and the padding of the 328-byte OUTREC to 350
- GAP-STB-007  # IEFBR14 and DISP emulated
- GAP-STB-009  # catalog emulation of the deleted and defined work files and statements
- GAP-STB-010  # Berkeley DB indexed files in place of the VSAM KSDS
- GAP-STB-011  # GnuCOBOL compile and runtime options in place of Enterprise COBOL and LE
- GAP-DOC-020  # the UniKix copy of CBSTM03A comments out the control-block walk
- GAP-DOC-026  # the UniKix copy of CREASTMT rewrites the STEP010 sort
- GAP-DOC-030  # the UniKix fct.lst adds TRXFL as a region file
preconditions:
  datasets:
    # The repository daily transactions as the posted-transaction KSDS, keyed
    # by transaction id.
    TRANSACT: {base: DALYTRAN}
    CARDXREF: {base: CARDXREF}
    ACCTDATA: {base: ACCTDATA}
    CUSTDATA: {base: CUSTDATA}
  # unikix runs this scenario too and cannot fix its clock (GAP-MIS-015); no
  # asserted value depends on the run date.
  parameters:
    clock_mode: relative
  faults: []
inputs:
  job: CREASTMT
expected:
  return_code: 0
  # One line per step [app/jcl/CREASTMT.JCL:22,44,56,66,79], then CBSTM03A's
  # DISPLAY lines [app/cbl/CBSTM03A.CBL:270-291]. TIOTJSTP is 8 bytes, so
  # the step shows as 'STEP040 ' with its trailing space; the loop stops at the
  # last DD, which the DISPLAY after the loop shows.
  messages:
  - STEP DELDEF01 RC 0000
  - STEP STEP010 RC 0000
  - STEP STEP020 RC 0000
  - STEP STEP030 RC 0000
  - STEP STEP040 RC 0000
  - 'Running JCL : CREASTMT Step STEP040 '
  - 'DD Names from TIOT: '
  - ': STEPLIB  -- valid UCB'
  - ': SYSPRINT -- valid UCB'
  - ': SYSOUT   -- valid UCB'
  - ': TRNXFILE -- valid UCB'
  - ': XREFFILE -- valid UCB'
  - ': ACCTFILE -- valid UCB'
  - ': CUSTFILE -- valid UCB'
  - ': STMTFILE -- valid UCB'
  - ': HTMLFILE -- valid UCB'
