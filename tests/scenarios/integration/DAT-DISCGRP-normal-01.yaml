# The DISCGRP job deletes, defines and loads the disclosure group KSDS from the
# sequential DISCGRP-PS [app/jcl/DISCGRP.jcl:22-61]:
#   STEP05  IDCAMS DELETE of the cluster, followed by an unconditional
#           SET MAXCC = 0, so the step ends RC 0 whether or not the cluster
#           existed [app/jcl/DISCGRP.jcl:22-27];
#   STEP10  IDCAMS DEFINE CLUSTER, KEYS(16 0) RECORDSIZE(50 50)
#           [app/jcl/DISCGRP.jcl:33-41];
#   STEP15  IDCAMS REPRO of DISCGRP-PS into the KSDS
#           [app/jcl/DISCGRP.jcl:54-61].
#
# DISCGRP exists before the run and holds one invented record that the
# repository data does not have (group STALEGRP01, type 09, category 0009),
# so the assertion that the KSDS afterwards holds exactly the 51 records of
# DISCGRP-PS shows that STEP05 removed the old cluster and STEP15 loaded a
# fresh one; the stale key would sort between the DEFAULT and ZEROAPR groups.
#
# DISCGRP-PS is app/data/ASCII/discgrp.txt (51 records of 50 bytes, already in
# key order). Its cross-check counterpart, the cp037 copy in app/data/EBCDIC,
# differs only in record 34, the DEFAULT group type 07 category 0001, whose
# DIS-INT-RATE (columns 17-22) is
# 00000{ (0.00) in ASCII and 00150{ (15.00) in EBCDIC (GAP-DOC-013); the
# fixtures are the ASCII bytes, so record 34 is pinned at 0.00.
#
# Records are decoded through CVTRA02Y [app/cpy/CVTRA02Y.cpy:4-10] in primary
# key order (DIS-ACCT-GROUP-ID, DIS-TRAN-TYPE-CD, DIS-TRAN-CAT-CD); the rate is
# S9(04)V99 with scale 2 and the 28-byte FILLER holds zeros in every record.
#
# Only the job item is listed: CVTRA02Y and the two discgrp data files are
# listed by the unit scenarios that execute them. The IDCAMS steps run on
# gnucobol-batch through the IDCAMS replacement (GAP-STB-005) against the
# emulated catalog (GAP-STB-009) and Berkeley DB indexed files (GAP-STB-010);
# unikix runs the copy's DISCGRP job, which is why clock_mode is relative.
id: DAT-DISCGRP-normal-01
level: integration
type: normal
description: >-
  The DISCGRP job deletes the existing disclosure group KSDS, defines it again
  and REPROs the 51 records of DISCGRP-PS into it, so the KSDS ends holding
  exactly those records in key order, record 34 (DEFAULT, 07, 0001) at its
  ASCII rate 0.00, without the stale record it held before; every step ends
  with return code 0.
inventory_ids:
- INV-DAT-012
tags: []
gap_ids:
- GAP-STB-005
- GAP-STB-009
- GAP-STB-010
- GAP-DOC-013
preconditions:
  datasets:
    DISCGRP-PS:
      base: DISCGRP-PS
    DISCGRP:
      records:
      - {DIS-ACCT-GROUP-ID: 'STALEGRP01', DIS-TRAN-TYPE-CD: '09', DIS-TRAN-CAT-CD: '9', DIS-INT-RATE: '12.34'}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  job: DISCGRP
expected:
  return_code: 0
  messages:
  - STEP STEP05 RC 0000
  - STEP STEP10 RC 0000
  - STEP STEP15 RC 0000
  file_state:
    DISCGRP:
