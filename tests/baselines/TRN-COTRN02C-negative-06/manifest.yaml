# Manifest of the derived baseline of TRN-COTRN02C-negative-06: ENTER on the
# Add Transaction screen with both Acct # and Card # blank, which
# VALIDATE-INPUT-KEY-FIELDS refuses with 'Account or Card Number must be
# entered...' before any data-field edit or file read
# [app/cbl/COTRN02C.cbl:164-166,193-229,516-534]. Only unikix can run the
# scenario, so expected.yaml is authored from the source and is
# inferred-not-observed (GAP-INF-007, GAP-INF-012). It names no execution_id
# or execution_fingerprint and holds no datasets/ until an eligible UniKix run
# is imported (report.py --import-unikix).
#
# source_identity.units are the app/ sources the three steps execute, each
# program with its COPY closure (inventory_tools.copy_closure) and the BMS
# source of its map: COSGN00C routes the type-U USER0001 to the main menu
# [app/cbl/COSGN00C.cbl:221-240]; COMEN01C, whose COMEN01 screen is asserted,
# XCTLs option 8 to COTRN02C [app/cbl/COMEN01C.cbl:144-156]
# [app/cpy/COMEN02Y.cpy:67-72]; COTRN02C sends COTRN02 and refuses the blank
# keys. CSUTLDTC is not listed: COTRN02C CALLs it only from the date edits of
# VALIDATE-INPUT-DATA-FIELDS [app/cbl/COTRN02C.cbl:390-413], which the RETURN
# in SEND-TRNADD-SCREEN prevents this path from reaching. DFHAID and DFHBMSCA
# are CICS-supplied and not in the repository.
# source_commit is HEAD at authoring; app/ is byte-identical to the suite's
# starting commit 93ebec71ff7b59a68cedd7c501afe496a8eaa68d.
