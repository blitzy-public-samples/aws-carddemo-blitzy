# Derived baseline of scenario USR-COUSR03C-alternate-02 (capture_platform:
# derived, tag inferred-not-observed): ADMIN001 signs on, takes admin option 4
# to the empty COUSR03 Delete User screen and presses PF3. Authored from the
# source, never captured; open until a UniKix run is imported: GAP-INF-004
# (derived USR end-to-end baselines) and GAP-INF-012 (online-only copybooks).
# One screen per step, the one shown after the step's AID, holding exactly the
# fields the scenario names; values are full BMS field width with trailing
# spaces, and only CURDATE (mm/dd/yy) and CURTIME (hh:mm:ss), built from the
# run clock [app/cpy/CSDAT01Y.cpy:31-42], are matchers.
# - Step 1: the type A user is routed to COADM01C, which sends the admin menu
#   with its CA00 and COADM01C header [app/cbl/COSGN00C.cbl:222-237]
#   [app/cbl/COADM01C.cbl:86-90].
# - Step 2: option 4 XCTLs to COUSR03C with CDEMO-FROM-PROGRAM COADM01C and
#   context 0 [app/cbl/COADM01C.cbl:130-140]. The shorter COMMAREA leaves
#   CDEMO-CU03-USR-SELECTED blank, so no user is fetched and COUSR03 is sent
#   from LOW-VALUES (shown as spaces) with CU03, COUSR03C and a blank ERRMSG
#   [app/cbl/COUSR03C.cbl:94-105,213-262].
# - Step 3: PF3 moves the non-blank CDEMO-FROM-PROGRAM, COADM01C, to
#   CDEMO-TO-PROGRAM and XCTLs there with context 0
#   [app/cbl/COUSR03C.cbl:111-118,197-208]; COADM01C sends its menu afresh
#   with the four COADM02Y options and a blank ERRMSG
#   [app/cbl/COADM01C.cbl:86-90,172-263]. The target comes from the COMMAREA,
#   so the sign-on screen never appears and USRSEC is neither read nor deleted.
screens:
- '@map': COADM01
  PGMNAME: COADM01C
  TRNNAME: CA00
- '@map': COUSR03
  CURDATE:
    format: '%m/%d/%y'
    match: run-date
  CURTIME:
    match: run-time
  ERRMSG: '                                                                              '
  FNAME: '                    '
  LNAME: '                    '
  PGMNAME: COUSR03C
  TITLE01: '      AWS Mainframe Modernization       '
  TITLE02: '              CardDemo                  '
  TRNNAME: CU03
  USRIDIN: '        '
  USRTYPE: ' '
- '@map': COADM01
  CURDATE:
    format: '%m/%d/%y'
    match: run-date
  CURTIME:
    match: run-time
  ERRMSG: '                                                                              '
  OPTION: '  '
  OPTN001: '01. User List (Security)                '
  OPTN002: '02. User Add (Security)                 '
  OPTN003: '03. User Update (Security)              '
  OPTN004: '04. User Delete (Security)              '
  OPTN005: '                                        '
  OPTN006: '                                        '
  OPTN007: '                                        '
  OPTN008: '                                        '
  OPTN009: '                                        '
  OPTN010: '                                        '
  OPTN011: '                                        '
  OPTN012: '                                        '
  PGMNAME: COADM01C
  TITLE01: '      AWS Mainframe Modernization       '
  TITLE02: '              CardDemo                  '
  TRNNAME: CA00
