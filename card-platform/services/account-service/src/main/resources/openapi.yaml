openapi: 3.1.0

# Written by hand. No documentation generator joins the classpath, so what this file states and what
# the code accepts are kept in step by the tests under src/test/java, not by an annotation processor.
#
# Every field width, every rejection text and every status code below is read from the source. The
# locator beside each one names the file and the line it came from.

info:
  title: CardDemo account service
  version: 1.0.0
  description: >-
    The account and customer surface of the modernized CardDemo platform, plus the one operational
    endpoint that closes a billing cycle. The read path comes from app/cbl/COACTVWC.cbl, transaction
    CAVW. The update path comes from app/cbl/COACTUPC.cbl, transaction CAUP, including its
    twenty-four field edits at app/cbl/COACTUPC.cbl:L1470-L1676 and its field-by-field concurrency
    check at app/cbl/COACTUPC.cbl:L4109-L4193. The cycle-close endpoint reproduces two statements and
    no more, app/cbl/CBACT04C.cbl:L353-L354, because the credit-limit rule of the authorization
    service reads the two accumulators those statements return to zero.


    This service is queried and it does not query. It calls no other service, and it publishes one
    AccountStateChanged event per mutation, which is what keeps the authorization service's copy of
    the credit limit, both cycle accumulators and the expiry date current.
  license:
    name: Apache-2.0

servers:
  - url: http://localhost:8085
    description: The port docker-compose.yml maps for this service.

tags:
  - name: account
    description: Reading and updating one account.
  - name: customer
    description: Reading one customer.
  - name: billing-cycle
    description: Returning both cycle accumulators to zero.

# Every route below requires a credential. config/SecurityConfig installs HTTP Basic authentication
# and refuses any route it does not name, so an endpoint added without a rule is denied rather than
# opened. The two read routes are ownership-scoped on their path variable; the two write routes
# require the administrator role.
security:
  - basicAuth: []

paths:
  /accounts/{accountId}:
    get:
      tags: [account]
      operationId: readAccount
      summary: Read one account.
      description: >-
        Reproduces the keyed read at app/cbl/COACTVWC.cbl:L790-L800.


        The response carries the account and no customer. ACCOUNT-RECORD at
        app/cpy/CVACT01Y.cpy:L4-L17 declares no customer identifier, so the source reaches a customer
        only through the cross-reference record at app/cbl/COACTVWC.cbl:L828-L829. The card service
        owns that record, so a caller that wants the customer reads GET /customers/{customerId} with
        an identifier it already holds.


        An ordinary identity reads the accounts its authorities name and receives 403 for any other.
        An administrator reads any account.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountView'
              example:
                accountId: '00000000050'
                activeStatus: 'Y'
                currentBalance: '1010.00'
                creditLimit: '10000.00'
                cashCreditLimit: '5000.00'
                currentCycleCredit: '0.00'
                currentCycleDebit: '1010.00'
                openDate: '2015-03-01'
                expirationDate: '2025-02-28'
                reissueDate: '2020-03-01'
                groupId: 'ZEROAPR'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalFailure'

    put:
      tags: [account]
      operationId: updateAccount
      summary: Update one account and its customer.
      description: >-
        Reproduces app/cbl/COACTUPC.cbl. The submitted pair is edited field by field, the stored pair
        is re-read under a write lock, the two are compared field by field at
        app/cbl/COACTUPC.cbl:L4109-L4193, and both rows plus one event row are written in one local
        transaction at app/cbl/COACTUPC.cbl:L4066 and :L4086.


        A block that is present has to be complete. Ten components of customerData and nine of
        accountData carry a mandatory-field edit, each reproducing one of the edits
        app/cbl/COACTUPC.cbl:L1470-L1676 performs, and those edits refuse an absent value exactly as
        they refuse a blank one. That is the 3270 screen's own contract: the screen was filled from the
        fetched record and submitted every field, so a field the operator did not touch still arrived.


        What a caller may omit is a whole block. A body carrying customerData alone leaves every
        account column as stored, and one carrying both replaces both records. Within a block, the
        components carrying no mandatory edit may be omitted and keep their stored value: the middle
        name, the second address line, the second telephone number, the government-issued identifier,
        the date of birth and the disclosure group.


        The three Social Security parts are one column and are recombined only when all three arrive,
        which the cross-field check on the block also requires.


        customerData is required and carries a required customerId, because an account record names no
        customer and this service owns no cross-reference table. The account identifier comes from the
        path and any identifier in the body is ignored, so a caller entitled to one account cannot
        write another.


        Restricted to the administrator role, because one call writes two records and produces one
        event that changes what the authorization service authorizes against.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
            examples:
              customerOnly:
                summary: >-
                  Correct the city, leaving every account column as stored. The account block is
                  omitted, which is how a caller updates the customer alone; the customer block is
                  complete, because a block that is present has to be.
                value:
                  accountId: '00000000050'
                  customerData:
                    customerId: '000000050'
                    firstName: Arlene
                    lastName: Abshire
                    addressLine1: 8829 Ondricka Trail
                    addressCity: North Enoshaven
                    addressStateCode: 'AR'
                    addressCountryCode: 'USA'
                    addressZip: '72112'
                    socialSecurityPart1: '429'
                    socialSecurityPart2: '54'
                    socialSecurityPart3: '1163'
                    eftAccountId: '4829571130'
                    primaryCardHolderIndicator: 'Y'
                    ficoCreditScore: '688'
              wholeScreenSubmit:
                summary: The whole pair, as the 3270 screen submitted it.
                value:
                  accountId: '00000000050'
                  accountData:
                    activeStatus: 'Y'
                    currentBalance: '1010.00'
                    creditLimit: '10000.00'
                    cashCreditLimit: '5000.00'
                    openDate: '2015-03-01'
                    expirationDate: '2025-02-28'
                    reissueDate: '2020-03-01'
                    currentCycleCredit: '0.00'
                    currentCycleDebit: '1010.00'
                    groupId: 'ZEROAPR'
                  customerData:
                    customerId: '000000050'
                    firstName: Arlene
                    middleName: Fay
                    lastName: Abshire
                    addressLine1: 8829 Ondricka Trail
                    addressLine2: Suite 407
                    addressCity: North Enoshaven
                    addressStateCode: 'AR'
                    addressCountryCode: 'USA'
                    addressZip: '72112'
                    phoneNumber1: '(501)5551234'
                    phoneNumber2: '(501)5555678'
                    socialSecurityPart1: '429'
                    socialSecurityPart2: '54'
                    socialSecurityPart3: '1163'
                    governmentIssuedId: 'AR8829114'
                    dateOfBirth: '1971-08-14'
                    eftAccountId: '4829571130'
                    primaryCardHolderIndicator: 'Y'
                    ficoCreditScore: '688'
      responses:
        '200':
          description: >-
            The pair was written, or nothing changed. The message component separates the two, and
            the account component carries the stored row as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountUpdateResponse'
              examples:
                applied:
                  summary: Both rows and one event row were written.
                  value:
                    message: Changes committed to database
                    account:
                      accountId: '00000000050'
                      activeStatus: 'Y'
                      currentBalance: '1010.00'
                      creditLimit: '12000.00'
                      cashCreditLimit: '5000.00'
                      currentCycleCredit: '0.00'
                      currentCycleDebit: '1010.00'
                      openDate: '2015-03-01'
                      expirationDate: '2025-02-28'
                      reissueDate: '2020-03-01'
                      groupId: 'ZEROAPR'
                noChange:
                  summary: >-
                    The submitted pair equalled the fetched pair, from
                    app/cbl/COACTUPC.cbl:L1463-L1467. Nothing was written and no event was produced.
                  value:
                    message: No change detected with respect to values fetched.
                    account:
                      accountId: '00000000050'
                      activeStatus: 'Y'
                      currentBalance: '1010.00'
                      creditLimit: '10000.00'
                      cashCreditLimit: '5000.00'
                      currentCycleCredit: '0.00'
                      currentCycleDebit: '1010.00'
                      openDate: '2015-03-01'
                      expirationDate: '2025-02-28'
                      reissueDate: '2020-03-01'
                      groupId: 'ZEROAPR'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Another writer changed a row first, from app/cbl/COACTUPC.cbl:L3947-L3952, or a row could
            not be locked, from :L3907-L3915 and :L3934-L3942. Nothing was written. A caller retries
            this request unchanged after reading the row again.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: Record changed by some one else. Please review current values
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalFailure'

  /accounts/{accountId}/cycle-close:
    post:
      tags: [billing-cycle]
      operationId: closeBillingCycle
      summary: Return both cycle accumulators to zero.
      description: >-
        Reproduces app/cbl/CBACT04C.cbl:L353-L354 and nothing else. No interest is computed, no
        disclosure group is read, and no transaction is written.


        This endpoint exists because the credit-limit rule at app/cbl/CBTRN02C.cbl:L403-L413
        authorizes against cycle credit minus cycle debit, and the only code in the repository that
        returns those two accumulators to zero lives inside the interest program, which stays batch.
        Without a substitute, every posted transaction raises the tested balance and nothing lowers
        it, so available credit shrinks until every transaction declines with reject code 0102.


        The effect on the two accumulators is idempotent: they are zero after one call and after ten.
        The events are not, because each call produces one. A caller that means to close a cycle once
        calls this once.


        Restricted to the administrator role. Clearing the accumulators is a decision about the whole
        account rather than about one cardholder's own data.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: >-
            The cycle was closed. Both accumulators are carried back so a caller can see that they
            are zero rather than take it on trust.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleCloseResponse'
              example:
                accountId: '00000000050'
                currentCycleCredit: '0.00'
                currentCycleDebit: '0.00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalFailure'

  /customers/{customerId}:
    get:
      tags: [customer]
      operationId: readCustomer
      summary: Read one customer.
      description: >-
        Reproduces the customer read at app/cbl/COACTVWC.cbl:L860-L870.


        The identifier is taken directly rather than resolved from an account, because ACCOUNT-RECORD
        declares no customer identifier and the source reaches a customer only through the
        cross-reference record, which the card service owns.


        The view carries sixteen of the nineteen components CUSTOMER-RECORD declares. The three it
        omits are the Social Security column and the government-issued identifier, which a read is
        the wrong operation to disclose, and which no caller of this platform needs back.


        An ordinary identity reads the customers its authorities name and receives 403 for any other.
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: The customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerView'
              example:
                customerId: '000000050'
                ficoCreditScore: 688
                dateOfBirth: '1971-08-14'
                firstName: Arlene
                middleName: Fay
                lastName: Abshire
                addressLine1: 8829 Ondricka Trail
                addressLine2: Suite 407
                addressCity: North Enoshaven
                addressStateCode: 'AR'
                addressZip: '72112'
                addressCountryCode: 'USA'
                phoneNumber1: '(501)5551234'
                phoneNumber2: '(501)5555678'
                eftAccountId: '4829571130'
                primaryCardHolderIndicator: 'Y'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalFailure'

components:

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >-
        HTTP Basic authentication over the identities carddemo.security.users configures.
        app/csd/CARDDEMO.CSD defines one USRSEC dataset the whole CICS region reads, so a
        platform-wide identity store is the faithful shape. app/cbl/COSGN00C.cbl:L223 compares a
        stored password against a supplied one in the clear; this service stores an encoded password
        instead, and card-platform/docs/business-rule-flags.md records the source comparison.

  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      description: >-
        ACCT-ID PIC 9(11) at app/cpy/CVACT01Y.cpy:L5. Eleven decimal digits, zero padded on the left,
        because the source compares the identifier as text and the leading zeros belong to the value.
      schema:
        type: string
        pattern: '^[0-9]{11}$'
      example: '00000000050'

    CustomerId:
      name: customerId
      in: path
      required: true
      description: >-
        CUST-ID PIC 9(09) at app/cpy/CVCUS01Y.cpy:L5. Nine decimal digits, zero padded on the left.
      schema:
        type: string
        pattern: '^[0-9]{9}$'
      example: '000000050'

  responses:
    MalformedRequest:
      description: The request body could not be read.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            type: about:blank
            title: Malformed request
            status: 400
            detail: >-
              The request body holds one account update in JavaScript Object Notation (JSON) and
              could not be read as one.

    Unauthorized:
      description: >-
        The request carried no usable credential. The WWW-Authenticate header names the realm.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: This request carried no usable credential.

    Forbidden:
      description: >-
        The caller is authenticated and does not own the identifier the path carries. The detail names
        neither the operation nor the identifier, so a caller probing for another subject's rows
        learns only that it may not have them.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: This identity may not use this operation.

    NotFound:
      description: >-
        This service holds no record for that request. The detail names no identifier, for the reason
        the 403 detail names none.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            type: about:blank
            title: Not found
            status: 404
            detail: This service holds no record for that request.

    ValidationFailed:
      description: >-
        A submitted field failed an edit, from app/cbl/COACTUPC.cbl:L1470-L1676, or a path variable
        carried the wrong width. The messages member carries the verbatim source texts, one per
        failing field.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            type: about:blank
            title: Validation failed
            status: 422
            detail: >-
              One or more submitted fields failed an edit. The messages member carries one text per
              failing field.
            messages:
              - 'FICO Score: should be between 300 and 850'
              - Address Line 1 must be supplied.

    InternalFailure:
      description: >-
        A fault inside this service. Nothing was changed. This replaces the abend path at
        app/cbl/CBTRN02C.cbl:L707-L711, which displayed a message, moved 999 into an abend code and
        performed no cleanup.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
          example:
            type: about:blank
            title: Internal failure
            status: 500
            detail: This request could not be completed. Nothing was changed.

  schemas:

    AccountView:
      type: object
      description: >-
        Eleven of the twelve modelled fields of ACCOUNT-RECORD at app/cpy/CVACT01Y.cpy:L4-L17. The
        one it omits is the address postcode, which the customer record also carries and which the
        customer view returns. The 178 trailing filler bytes at app/cpy/CVACT01Y.cpy:L17 are modelled
        by nothing, and card-platform/docs/traceability-matrix.md records the omission.


        Every amount is a string carrying two fractional digits, never a JSON number. Most parsers
        read a JSON number into a binary floating-point value, which is the one thing a platform
        whose correctness rests on fixed-point arithmetic cannot allow.
      required:
        - accountId
        - activeStatus
        - currentBalance
        - creditLimit
        - cashCreditLimit
        - currentCycleCredit
        - currentCycleDebit
        - openDate
        - expirationDate
        - reissueDate
        - groupId
      properties:
        accountId:
          type: string
          pattern: '^[0-9]{11}$'
          description: ACCT-ID PIC 9(11) at app/cpy/CVACT01Y.cpy:L5.
        activeStatus:
          type: string
          maxLength: 1
          description: >-
            ACCT-ACTIVE-STATUS PIC X(01) at app/cpy/CVACT01Y.cpy:L6. No program in app/cbl/ tests
            this field before posting, so a closed account still posts.
            card-platform/docs/business-rule-flags.md records that.
        currentBalance:
          type: string
          pattern: '^-?[0-9]{1,10}\.[0-9]{2}$'
          description: ACCT-CURR-BAL PIC S9(10)V99 at app/cpy/CVACT01Y.cpy:L7.
        creditLimit:
          type: string
          pattern: '^-?[0-9]{1,10}\.[0-9]{2}$'
          description: >-
            ACCT-CREDIT-LIMIT PIC S9(10)V99 at app/cpy/CVACT01Y.cpy:L8. The credit-limit rule of the
            authorization service compares against this value.
        cashCreditLimit:
          type: string
          pattern: '^-?[0-9]{1,10}\.[0-9]{2}$'
          description: ACCT-CASH-CREDIT-LIMIT PIC S9(10)V99 at app/cpy/CVACT01Y.cpy:L9.
        currentCycleCredit:
          type: string
          pattern: '^-?[0-9]{1,10}\.[0-9]{2}$'
          description: >-
            ACCT-CURR-CYC-CREDIT PIC S9(10)V99 at app/cpy/CVACT01Y.cpy:L12. POST
            /accounts/{accountId}/cycle-close returns this to zero.
        currentCycleDebit:
          type: string
          pattern: '^-?[0-9]{1,10}\.[0-9]{2}$'
          description: ACCT-CURR-CYC-DEBIT PIC S9(10)V99 at app/cpy/CVACT01Y.cpy:L13.
        openDate:
          type: string
          maxLength: 10
          description: ACCT-OPEN-DATE PIC X(10) at app/cpy/CVACT01Y.cpy:L10.
        expirationDate:
          type: string
          maxLength: 10
          description: >-
            ACCT-EXPIRAION-DATE PIC X(10) at app/cpy/CVACT01Y.cpy:L11, whose source name transposes
            two letters. The name is corrected here and the rename is recorded in
            card-platform/docs/traceability-matrix.md, because no behaviour depends on the
            identifier text. The value stays ten characters of text rather than becoming a date,
            because app/cbl/CBTRN02C.cbl:L414-L420 compares it as text against the first ten
            characters of a timestamp.
        reissueDate:
          type: string
          maxLength: 10
          description: ACCT-REISSUE-DATE PIC X(10) at app/cpy/CVACT01Y.cpy:L14.
        groupId:
          type: string
          maxLength: 10
          description: >-
            ACCT-GROUP-ID PIC X(10) at app/cpy/CVACT01Y.cpy:L16, which names the disclosure group the
            interest program reads.

    CustomerView:
      type: object
      description: >-
        Sixteen of the nineteen modelled fields of CUSTOMER-RECORD at app/cpy/CVCUS01Y.cpy:L4-L23.
        The three it omits are the Social Security column and the government-issued identifier. The
        168 trailing filler bytes at app/cpy/CVCUS01Y.cpy:L23 are modelled by nothing.


        app/cpy/CUSTREC.cpy declares a second, divergent copy of this record, differing in one date
        field name and stamped one second apart. CVCUS01Y is adopted because four programs bind to
        it, and card-platform/docs/business-rule-flags.md records the fork.
      required:
        - customerId
        - ficoCreditScore
        - dateOfBirth
        - firstName
        - lastName
        - addressLine1
        - addressCity
        - addressStateCode
        - addressZip
        - addressCountryCode
        - phoneNumber1
        - primaryCardHolderIndicator
      properties:
        customerId:
          type: string
          pattern: '^[0-9]{9}$'
          description: CUST-ID PIC 9(09) at app/cpy/CVCUS01Y.cpy:L5.
        ficoCreditScore:
          type: integer
          minimum: 300
          maximum: 850
          description: >-
            CUST-FICO-CREDIT-SCORE PIC 9(03) at app/cpy/CVCUS01Y.cpy:L21. A whole number, because the
            column holds three digits and no fraction. The bounds are the ones
            app/cbl/COACTUPC.cbl enforces, and the message a value outside them earns is reproduced
            character for character.
        dateOfBirth:
          type: string
          maxLength: 10
          description: CUST-DOB-YYYY-MM-DD PIC X(10) at app/cpy/CVCUS01Y.cpy:L19.
        firstName:
          type: string
          maxLength: 25
          description: CUST-FIRST-NAME PIC X(25) at app/cpy/CVCUS01Y.cpy:L6.
        middleName:
          type: string
          maxLength: 25
          description: CUST-MIDDLE-NAME PIC X(25) at app/cpy/CVCUS01Y.cpy:L7. Optional in the source edit.
        lastName:
          type: string
          maxLength: 25
          description: CUST-LAST-NAME PIC X(25) at app/cpy/CVCUS01Y.cpy:L8.
        addressLine1:
          type: string
          maxLength: 50
          description: CUST-ADDR-LINE-1 PIC X(50) at app/cpy/CVCUS01Y.cpy:L9.
        addressLine2:
          type: string
          maxLength: 50
          description: CUST-ADDR-LINE-2 PIC X(50) at app/cpy/CVCUS01Y.cpy:L10. Optional.
        addressCity:
          type: string
          maxLength: 50
          description: CUST-ADDR-LINE-3 PIC X(50) at app/cpy/CVCUS01Y.cpy:L11.
        addressStateCode:
          type: string
          maxLength: 2
          description: >-
            CUST-ADDR-STATE-CD PIC X(02) at app/cpy/CVCUS01Y.cpy:L12, checked against the 56 state
            codes app/cpy/CSLKPCDY.cpy:L1012 lists.
        addressZip:
          type: string
          maxLength: 5
          description: >-
            CUST-ADDR-ZIP PIC X(05) at app/cpy/CVCUS01Y.cpy:L14, checked with the state code against
            the 240 combinations app/cpy/CSLKPCDY.cpy:L1071-L1073 lists.
        addressCountryCode:
          type: string
          maxLength: 3
          description: CUST-ADDR-COUNTRY-CD PIC X(03) at app/cpy/CVCUS01Y.cpy:L13.
        phoneNumber1:
          type: string
          maxLength: 15
          description: >-
            CUST-PHONE-NUM-1 PIC X(15) at app/cpy/CVCUS01Y.cpy:L15, whose area code is checked
            against the 980 codes app/cpy/CSLKPCDY.cpy:L24-L1011 lists.
        phoneNumber2:
          type: string
          maxLength: 15
          description: CUST-PHONE-NUM-2 PIC X(15) at app/cpy/CVCUS01Y.cpy:L16. Optional.
        eftAccountId:
          type: string
          maxLength: 10
          description: CUST-EFT-ACCOUNT-ID PIC X(10) at app/cpy/CVCUS01Y.cpy:L20.
        primaryCardHolderIndicator:
          type: string
          maxLength: 1
          description: CUST-PRI-CARD-HOLDER-IND PIC X(01) at app/cpy/CVCUS01Y.cpy:L22.

    AccountUpdateRequest:
      type: object
      description: >-
        The submitted pair, which app/cbl/COACTUPC.cbl calls ACUP-NEW-ACCT-DATA and
        ACUP-NEW-CUST-DATA. Every value is a string, because the source reads its screen fields as
        text and its numeric edits accept the tolerant grammar FUNCTION NUMVAL-C accepts, gated at
        app/cbl/COACTUPC.cbl:L2201. A credit limit of $12,000.00 is therefore accepted and so is
        12000.00.
      required: [customerData]
      properties:
        accountData:
          $ref: '#/components/schemas/AccountDataRequest'
        customerData:
          $ref: '#/components/schemas/CustomerDataRequest'

    AccountDataRequest:
      type: object
      description: >-
        The submitted account values. The block itself is optional and, when present, has to be
        complete: nine of its ten components carry a mandatory-field edit that refuses an absent value.
        groupId is the one component that may be omitted, and it then keeps its stored value.


        Omitting the whole block is how a caller updates the customer alone.
      required:
        - activeStatus
        - currentBalance
        - creditLimit
        - cashCreditLimit
        - openDate
        - expirationDate
        - reissueDate
        - currentCycleCredit
        - currentCycleDebit
      properties:
        activeStatus:
          type: string
          maxLength: 1
          description: >-
            Edit 1 at app/cbl/COACTUPC.cbl:L1472. Y or N, and the rejection reads
            'Account Status must be Y or N.'
        currentBalance:
          type: string
          maxLength: 15
          description: A signed decimal under the tolerant grammar. The rejection reads 'Current Balance is not valid'.
        creditLimit:
          type: string
          maxLength: 15
          description: A signed decimal under the tolerant grammar. The rejection reads 'Credit Limit is not valid'.
        cashCreditLimit:
          type: string
          maxLength: 15
          description: A signed decimal under the tolerant grammar.
        openDate:
          type: string
          maxLength: 8
          description: A calendar date, edited by the routine app/cbl/CSUTLDTC.cbl implements.
        expirationDate:
          type: string
          maxLength: 8
          description: A calendar date.
        reissueDate:
          type: string
          maxLength: 8
          description: A calendar date.
        currentCycleCredit:
          type: string
          maxLength: 15
          description: A signed decimal under the tolerant grammar.
        currentCycleDebit:
          type: string
          maxLength: 15
          description: A signed decimal under the tolerant grammar.
        groupId:
          type: string
          maxLength: 10
          description: Printable characters only.

    CustomerDataRequest:
      type: object
      description: >-
        The submitted customer values. The block is required, because an account record names no
        customer and this service owns no cross-reference table to resolve one from, and it has to be
        complete: ten of its components carry a mandatory-field edit that refuses an absent value.


        The three Social Security parts are one column, and a cross-field check on this block requires
        all three together. A body carrying one part alone is refused rather than merged.


        Six components carry no mandatory edit and may be omitted, keeping their stored value: the
        middle name, the second address line, both telephone numbers, the government-issued identifier
        and the date of birth.
      required:
        - customerId
        - firstName
        - lastName
        - addressLine1
        - addressCity
        - addressStateCode
        - addressCountryCode
        - addressZip
        - socialSecurityPart1
        - socialSecurityPart2
        - socialSecurityPart3
        - eftAccountId
        - primaryCardHolderIndicator
        - ficoCreditScore
      properties:
        customerId:
          type: string
          pattern: '^[0-9]{9}$'
          description: CUST-ID PIC 9(09). Names the customer row this call updates.
        firstName:
          type: string
          maxLength: 25
          description: Alphabetic and required by edit, from app/cbl/COACTUPC.cbl.
        middleName:
          type: string
          maxLength: 25
          description: Alphabetic and optional by edit.
        lastName:
          type: string
          maxLength: 25
          description: Alphabetic and required by edit.
        addressLine1:
          type: string
          maxLength: 50
          description: Mandatory. The rejection reads 'Address Line 1 must be supplied.'
        addressLine2:
          type: string
          maxLength: 50
          description: Optional. Printable characters only.
        addressCity:
          type: string
          maxLength: 50
          description: Alphabetic and required by edit.
        addressStateCode:
          type: string
          maxLength: 2
          description: Checked against the 56 state codes app/cpy/CSLKPCDY.cpy lists.
        addressCountryCode:
          type: string
          maxLength: 3
          description: Alphabetic and required by edit.
        addressZip:
          type: string
          maxLength: 5
          description: Checked with the state code against the 240 combinations app/cpy/CSLKPCDY.cpy lists.
        phoneNumber1:
          type: string
          maxLength: 15
          description: Area code checked against the 980 codes app/cpy/CSLKPCDY.cpy lists.
        phoneNumber2:
          type: string
          maxLength: 15
          description: Optional, edited the same way when supplied.
        socialSecurityPart1:
          type: string
          maxLength: 3
          description: The area part. Supplied with the other two parts or not at all.
        socialSecurityPart2:
          type: string
          maxLength: 2
          description: The group part.
        socialSecurityPart3:
          type: string
          maxLength: 4
          description: The serial part.
        governmentIssuedId:
          type: string
          maxLength: 20
          description: CUST-GOVT-ISSUED-ID PIC X(20) at app/cpy/CVCUS01Y.cpy:L18.
        dateOfBirth:
          type: string
          maxLength: 8
          description: A calendar date, edited as a date of birth.
        eftAccountId:
          type: string
          maxLength: 10
          description: CUST-EFT-ACCOUNT-ID PIC X(10).
        primaryCardHolderIndicator:
          type: string
          maxLength: 1
          description: CUST-PRI-CARD-HOLDER-IND PIC X(01).
        ficoCreditScore:
          type: string
          maxLength: 3
          description: >-
            Three digits between 300 and 850. The rejection reads
            'FICO Score: should be between 300 and 850', character for character.

    AccountUpdateResponse:
      type: object
      description: >-
        What an update answered. Two outcomes share status 200 and the message separates them: the
        pair was written, or nothing changed because the submitted pair equalled the fetched pair.
      required: [message]
      properties:
        message:
          type: string
          description: >-
            'Changes committed to database' when both rows were written, or
            'No change detected with respect to values fetched.' from
            app/cbl/COACTUPC.cbl:L1463-L1467 when nothing was.
        account:
          $ref: '#/components/schemas/AccountView'

    CycleCloseResponse:
      type: object
      description: Both accumulators after the close, which are zero.
      required: [accountId, currentCycleCredit, currentCycleDebit]
      properties:
        accountId:
          type: string
          pattern: '^[0-9]{11}$'
          description: ACCT-ID PIC 9(11), eleven digits, zero padded on the left.
        currentCycleCredit:
          type: string
          pattern: '^-?[0-9]{1,10}\.[0-9]{2}$'
          description: Zero at the two fractional digits PIC S9(10)V99 holds.
        currentCycleDebit:
          type: string
          pattern: '^-?[0-9]{1,10}\.[0-9]{2}$'
          description: Zero at the two fractional digits PIC S9(10)V99 holds.

    ApiProblem:
      type: object
      description: >-
        The error body of every failed call, as RFC 9457 describes it. One shape covers every failure
        of this service, including the 401 and 403 that config/SecurityConfig writes, so a client
        parses one document and not two.


        No member echoes a request value. Nothing carries the rejected value, the path, the query
        string or a header, so a Social Security number sent in the wrong position cannot be reflected
        back to the caller or written to an access log through this body.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          const: about:blank
          description: >-
            Always about:blank, which RFC 9457 names the default and which means the status code
            carries the semantics.
        title:
          type: string
          enum:
            - Validation failed
            - Not found
            - Conflict
            - Malformed request
            - Internal failure
            - Unauthorized
            - Forbidden
          description: >-
            A short, fixed phrase. Every value comes from a constant of the code and never from
            caller-supplied text.
        status:
          type: integer
          description: The status code of the response.
        detail:
          type: string
          description: Fixed text, naming no identifier and no route.
        messages:
          type: array
          minItems: 1
          items:
            type: string
          description: >-
            One text per failing field, each reproduced character for character from the source
            paragraph that emits it. Omitted when a failure produced no field text, rather than sent
            empty.
