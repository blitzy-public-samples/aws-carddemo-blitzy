# COACTUPC's last Reissue Date predicate: once the COBOL date edits of CSUTLDPY
# accept a date, EDIT-DATE-LE calls CSUTLDTC with mask YYYYMMDD and refuses the
# date only when the CEEDAYS severity is not zero, composing 'Reissue Date
# validation error Sev code: <n> Message code: <n>' [app/cpy/CSUTLDPY.cpy:284-321].
#
# Why the refusal is not asserted (observed-only): no date that passes the COBOL
# edits is known to be refused by CEEDAYS, so no input is known to reach the
# refusal branch, and this scenario pins the accepting outcome instead. The date
# entered, 2024-02-29, is a valid leap day, so it also runs the leap-year branch
# of EDIT-DAY-MONTH-YEAR before the call. What CEEDAYS returns is unobserved
# (GAP-INF-001, GAP-MIS-010): EDIT-DATE-LE passes the 8-byte
# WS-EDIT-DATE-CCYYMMDD and WS-DATE-FORMAT to CSUTLDTC's 10-byte LS-DATE and
# LS-DATE-FORMAT, which pass their full length to CEEDAYS, so CEEDAYS also
# reads the 2 bytes after each area: the start of WS-EDIT-DATE-BINARY, which only
# EDIT-DATE-OF-BIRTH sets, later in the same edit pass, and the spaces that
# INITIALIZE leaves in WS-SEVERITY [app/cpy/CSUTLDWY.cpy:4-37,58-62]
# [app/cbl/CSUTLDTC.cbl:83-117]. If a real CEEDAYS refused this date, a UniKix
# run would show the composed message in ERRMSG; that run replaces this
# expectation through the baseline import.
#
# Steps 1-3 reach the fetched account as ACT-COACTUPC-alternate-04 does:
# USER0001 signs on through CC00, chooses option 2 (Account Update) on COMEN01,
# and enters account 00000000001. 9000-READ-ACCT reads CXACAIX by account id
# (card 9680294154603697, customer 000000001), ACCTDAT and CUSTDAT, and the
# screen shows them with 'Update account details presented above.', every
# editable field unprotected with its MDT on [app/cbl/COACTUPC.cbl:2568-2580,
# 2787-2865,2955-3000,3441-3561,3608-3884].
# Step 4 types 2024, 02 and 29 over the reissue year, month and day (2025-05-20)
# and presses ENTER.
# - 1100-RECEIVE-MAP moves them to ACUP-NEW-REISSUE-DATE [app/cbl/COACTUPC.cbl:
#   1190-1209]; 1205-COMPARE-OLD-NEW finds the change, so 1200-EDIT-MAP-INPUTS
#   runs every field edit [app/cbl/COACTUPC.cbl:1460-1470,1681-1704].
# - Account Status, Open Date, Credit Limit, Expiry Date and Cash Credit Limit
#   pass on the repository account. Reissue Date is moved as '20240229' under
#   the name 'Reissue Date' [app/cbl/COACTUPC.cbl:1503-1507]: EDIT-YEAR-CCYY
#   accepts 2024 (century 20), EDIT-MONTH 02, EDIT-DAY 29. In
#   EDIT-DAY-MONTH-YEAR the month is February and the day 29, so with
#   WS-EDIT-DATE-YY-N 24 it divides 2024 by 4, finds remainder 0 and goes on;
#   all three date flags are valid, so it reaches EDIT-DATE-LE
#   [app/cpy/CSUTLDPY.cpy:18-282]. Severity 0 sets no error and
#   WS-EDIT-DATE-IS-VALID [app/cpy/CSUTLDPY.cpy:284-330].
# - Every later edit passes on the invented customer below, so no INPUT-ERROR
#   is set and ACUP-CHANGES-OK-NOT-CONFIRMED stands [app/cbl/COACTUPC.cbl:
#   1509-1676]. 2000-DECIDE-ACTION continues on that state without PF5, so
#   9600-WRITE-PROCESSING, the only READ UPDATE and REWRITE path, does not run
#   [app/cbl/COACTUPC.cbl:2602-2621].
# - 3203-SHOW-UPDATED-VALUES shows the received values, the reissue date as
#   typed and the amounts re-edited through +ZZZ,ZZZ,ZZZ.99; 3250 sets
#   PROMPT-FOR-CONFIRMATION; 3300 leaves every field protected; 3390 makes
#   F5=Save and F12=Cancel bright [app/cbl/COACTUPC.cbl:2870-2951,2955-2983,
#   3001-3003,3566-3584].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte field; ERRMSG is the blank
#   75-byte WS-RETURN-MSG in the 78-byte field, so no 'validation error Sev
#   code' text appears [app/cbl/COACTUPC.cbl:462-479,2979-2981]. Fields are
#   compared at their full BMS length, trailing spaces kept.
# - FKEY05 and FKEY12 keep their INITIAL text; a dark (ASKIP,DRK) field is
#   captured as blanks, as on screen 3.
# - The tpe adapter enters a field with EraseEOF before typing; the reissue
#   fields are 4, 2 and 2 bytes, so the values fill them.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, so the reissue date is the only field the scenario exercises: the
# repository record has FICO 274, below 300, and zip 12546, which is not a
# North Carolina zip [app/cbl/COACTUPC.cbl:2514-2558]. Account 00000000001 and
# its cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-054
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001, whose reissue date is 2025-05-20, changes it to the
  leap day 2024-02-29 and presses ENTER. The COBOL date edits accept the date
  and CSUTLDTC, called with mask YYYYMMDD, is expected to return severity 0,
  so COACTUPC shows the changed values, protected, with 'Changes
  validated.Press F5 to save', no 'Reissue Date validation error Sev code'
  message, and the F5=Save and F12=Cancel keys made visible. Nothing is saved
  before PF5: ACCTDATA and CUSTDATA still hold the fetched records.
# Primary item first, then the CSUTLDTC date acceptance this outcome rests on,
# the program, the maps asserted, the transaction of steps 3 and 4, the CSD
# files COACTUPC reads, and the online-only copybooks it copies. Sign-on (CC00,
# COSGN00, USRSEC) and the menu transaction are verified by the SEC and MNU
# scenarios; the batch record copybooks and the data files are verified at the
# lowest level that executes them.
inventory_ids:
- INV-ACT-112  # COACTUPC Reissue Date: CSUTLDTC severity 0 for mask YYYYMMDD (EDIT-DATE-LE)
- INV-UTL-003  # CSUTLDTC date acceptance for masks YYYY-MM-DD and YYYYMMDD
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and confirmation screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the field edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the per-field error attributes, none set here
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the date edits and the EDIT-DATE-LE call of CSUTLDTC
- INV-LAY-014  # CSUTLDWY: WS-EDIT-DATE-CCYYMMDD, WS-DATE-FORMAT and the CSUTLDTC result
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
- observed-only
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# Which dates CEEDAYS accepts is known only through the stub, and whether
# UniKix supplies CEEDAYS at all is unknown.
- GAP-INF-001
- GAP-MIS-010
# The open uncertain-purpose question of the EDIT-DATE-LE refusal and its
# composed message, which no known input runs, so the accepting outcome is
# pinned as observed.
- GAP-UNC-017
# The UniKix copy changes code this scenario passes through: CSUTLDTC's
# Vstring lengths (021), COACTUPC's amount edits and change detection (022),
# CSUTLDPY's date edits and message names (024) and COACTUP's row 1, where
# TRNNAME stands (025). A unikix run therefore observes the copy's behaviour
# of those parts.
- GAP-DOC-021
- GAP-DOC-022
- GAP-DOC-024
- GAP-DOC-025
