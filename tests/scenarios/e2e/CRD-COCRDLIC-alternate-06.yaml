# PF3 on the second page of the COCRDLI credit card list returns to the
# COMEN01C main menu.
#
# Step 1: USER0001 (type U in the USRSEC fixture) signs on through CC00 and
# COSGN00C XCTLs to COMEN01C, which sends the main menu under CM00
# [app/cbl/COSGN00C.cbl:221-240] [app/cbl/COMEN01C.cbl:82-90,107-110].
# Step 2: option '3' selects 'Credit Card List', program COCRDLIC; COMEN01C sets
# CDEMO-FROM-PROGRAM COMEN01C and CDEMO-PGM-CONTEXT 0 and XCTLs with the
# COMMAREA [app/cbl/COMEN01C.cbl:115-155] [app/cpy/COMEN02Y.cpy:37-41]. Coming
# from the menu in CDEMO-PGM-ENTER state, COCRDLIC forgets its page state and
# sets CA-FIRST-PAGE, skips the RECEIVE (the caller is not COCRDLIC), and takes
# WHEN OTHER: it browses CARDDAT from the start and sends page 1 of the 50
# fixture cards with a next page marked as existing; COMMON-RETURN records
# COCRDLIC as CDEMO-FROM-PROGRAM and returns TRANSID CCLI with the COMMAREA
# and its page state [app/cbl/COCRDLIC.cbl:315-343,572-582,604-619,1123-1260].
# Step 3: PF8 maps to CCARD-AID-PFK08 [app/cpy/CSSTRPFY.cpy:44-45]; with
# CA-NEXT-PAGE-EXISTS COCRDLIC adds 1 to WS-CA-SCREEN-NUM and reads forward
# from the eighth card, sending page 2 and returning TRANSID CCLI again
# [app/cbl/COCRDLIC.cbl:486-497]. PF3 is therefore pressed off the first page.
# Step 4: PF3 maps to CCARD-AID-PFK03 [app/cpy/CSSTRPFY.cpy:34-35]. CDEMO-FROM-
# PROGRAM is COCRDLIC, so before any page logic COCRDLIC records CCLI/COCRDLIC
# as the caller, sets CDEMO-USRTYP-USER and CDEMO-PGM-ENTER, sets the
# WS-EXIT-MESSAGE text (never sent: the XCTL follows) and XCTLs to LIT-MENUPGM
# COMEN01C with CARDDEMO-COMMAREA [app/cbl/COCRDLIC.cbl:187-190,384-405]. The
# page number held in COCRDLIC's own COMMAREA extension does not reach the menu.
# COMEN01C receives a COMMAREA that is not in re-enter state, so it clears its
# output map and sends the menu afresh with WS-MESSAGE still spaces, then
# returns TRANSID CM00 [app/cbl/COMEN01C.cbl:77-90,182-277].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - Text values are whole fields at their BMS length, trailing spaces kept:
#   TITLE01, TITLE02 and OPTN001-012 40, ERRMSG 78, OPTION 2 [app/bms/COMEN01.bms].
#   Each option is built as '<nn>. <name>' from the COMEN02Y table, and options
#   11 and 12, the option field and the message line, left at LOW-VALUES or
#   spaces, show as spaces [app/cpy/COMEN02Y.cpy:21-84] [app/cpy/COTTL01Y.cpy:17-22].
# - PAGENO is WS-CA-SCREEN-NUM, PIC 9(1), moved to the PIC X(3) PAGENOO, so it
#   shows the page digit followed by two spaces [app/cbl/COCRDLIC.cbl:237,667]
#   [app/cpy-bms/COCRDLI.CPY:332]. It is asserted only to pin the page PF3 is
#   pressed on; the card rows are the item of the COCRDLIC content and paging
#   scenarios.
# - CURDATE (mm/dd/yy) and CURTIME (hh:mm:ss) come from the region clock
#   through CSDAT01Y, hence the matchers and clock_mode relative.
id: CRD-COCRDLIC-alternate-06
level: e2e
type: alternate
description: >-
  USER0001 signs on, chooses main menu option 3 'Credit Card List', pages
  forward once with PF8 to page 2 of the COCRDLIC card list (CCLI), and presses
  PF3. COCRDLIC transfers control to COMEN01C, which shows the main menu (CM00)
  afresh with its ten options and no message.
# Primary item first, then the program, the maps the PF3 step is pressed on
# and lands on, the transaction the PF3 step runs under (COCRDLIC returns with
# TRANSID CCLI), the CSD file the list browses, and the online-only copybooks
# COCRDLIC copies. The sign-on items, CM00 and the menu option navigation are
# verified by the SEC and MNU scenarios that own them.
inventory_ids:
- INV-CRD-021  # COCRDLIC PF3 return (navigation rule)
- INV-CRD-001  # COCRDLIC program
- INV-CRD-004  # COCRDLI map, the screen PF8 and PF3 are pressed on
- INV-MNU-003  # COMEN01 map, the screen the XCTL lands on
- INV-CFG-014  # CCLI transaction, under which PF8 and PF3 run
- INV-CFG-003  # CARDDAT CSD file, browsed for pages 1 and 2
- INV-LAY-002  # COCOM01Y: CDEMO-FROM-PROGRAM COCRDLIC selects the PF3 branch
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y, copied by COCRDLIC
- INV-LAY-011  # CSSTRPFY: YYYY-STORE-PFKEY maps DFHPF8 and DFHPF3
- INV-LAY-019  # CVCRD01Y: CCARD-AID-PFK08 and CCARD-AID-PFK03
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-006  # CRD end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    CARDDATA: {base: CARDDATA}
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '3'
  - aid: PF8
    '@map': COCRDLI
    fields: {}
  - aid: PF3
    '@map': COCRDLI
    fields: {}
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
  - '@map': COCRDLI
    TRNNAME: CCLI
    PGMNAME: COCRDLIC
    PAGENO: '1  '
  - '@map': COCRDLI
    TRNNAME: CCLI
    PGMNAME: COCRDLIC
    PAGENO: '2  '
  - '@map': COMEN01
    TRNNAME: CM00
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COMEN01C
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    OPTN001: '01. Account View                        '
    OPTN002: '02. Account Update                      '
    OPTN003: '03. Credit Card List                    '
    OPTN004: '04. Credit Card View                    '
    OPTN005: '05. Credit Card Update                  '
    OPTN006: '06. Transaction List                    '
    OPTN007: '07. Transaction View                    '
    OPTN008: '08. Transaction Add                     '
    OPTN009: '09. Transaction Reports                 '
    OPTN010: '10. Bill Payment                        '
    OPTN011: '                                        '
    OPTN012: '                                        '
    OPTION: '  '
    ERRMSG: '                                                                              '
