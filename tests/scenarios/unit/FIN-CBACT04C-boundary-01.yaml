# The count boundary of the CBACT04C account update: TCATBALF holds one record,
# for one account. 1050-UPDATE-ACCOUNT is performed only when a TCATBAL record
# belongs to another account than the one before it, and the first change only
# clears WS-FIRST-TIME. At end of file 1000-TCATBALF-GET-NEXT sets END-OF-FILE
# to 'Y' inside the IF END-OF-FILE = 'N' branch, so the PERFORM UNTIL loop ends
# and its ELSE branch, the only end-of-file call of 1050-UPDATE-ACCOUNT, is never
# reached [app/cbl/CBACT04C.cbl:188-222,350-370]. The interest is computed and
# written to SYSTRAN, but the account is never rewritten: ACCTDATA leaves the run
# as it entered it. The behaviour is pinned as observed and tagged
# suspected-defect (GAP-DEF-003); nothing under app/ is changed.
#
# All records are invented. ACCT-GROUP-ID is set, unlike the repository accounts
# (GAP-DEF-005), so the DISCGRP lookup hits group A000000000, type 01, category
# 0001, whose DIS-INT-RATE is 00150{ = 15.00 [app/data/ASCII/discgrp.txt:1], and
# no 'DISCLOSURE GROUP RECORD MISSING' line appears. The monthly interest is
# 1200.00 * 15.00 / 1200 = 15.00 [app/cbl/CBACT04C.cbl:462-470]. The interest
# record's TRAN-ID is the PARM date followed by the 6-digit counter, type 01,
# category '05' moved to PIC 9(04), source 'System', the card from the
# cross-reference and the fixed run clock as both timestamps
# [app/cbl/CBACT04C.cbl:473-498,613-626]. Its TRAN-DESC and FILLER keep the x'00'
# bytes of uninitialized working storage; FIN-CBACT04C-normal-01 asserts them
# (GAP-UNC-009) and the raw baseline bytes cover them here.
#
# The main loop displays the TCATBAL record before the account lookup
# [app/cbl/CBACT04C.cbl:193]: the 50-byte CVTRA01Y image, whose TRAN-CAT-BAL
# 1200.00 carries the positive-zero overpunch '{' and whose 22-byte FILLER is
# spaces, so the quoted line keeps its trailing spaces.
#
# Decoded values follow harness/codec.py: unsigned numeric fields lose their
# leading zeros (ACCT-ID 00000000904 is '904', TRAN-CAT-CD 0005 is '5'), amounts
# keep their scale, and text fields keep their trailing spaces.
id: FIN-CBACT04C-boundary-01
level: unit
type: boundary
description: >-
  CBACT04C runs over a single TCATBAL record for a single account: it writes the
  interest transaction 2022071800000001 of 15.00 (1200.00 at 15.00 / 1200) to
  SYSTRAN, but never rewrites the account, because 1050-UPDATE-ACCOUNT runs only
  on an account change and the end-of-file branch that would update the last
  account is unreachable. Account 00000000904 keeps ACCT-CURR-BAL 100.00,
  ACCT-CURR-CYC-CREDIT 20.00 and ACCT-CURR-CYC-DEBIT -5.00, and the run ends with
  return code 0.
inventory_ids:
- INV-FIN-004  # CBACT04C account update (calculation)
- INV-FIN-001  # CBACT04C program
- INV-FIN-008  # CBACT04C interest transaction record (interface)
- INV-LAY-025  # CVTRA05Y copybook, the SYSTRAN layout
- INV-LAY-016  # CVACT01Y copybook, the ACCTDATA layout
- INV-DTA-006  # discgrp.txt, the DISCGRP fixture source
- INV-DTA-017  # EBCDIC disclosure group file, its cross-check counterpart
tags:
- suspected-defect
gap_ids:
- GAP-DEF-003  # the last account is never rewritten: the end-of-file ELSE is unreachable
- GAP-STB-004  # PARMDRV supplies the z/OS PARM linkage of CBACT04C
- GAP-STB-010  # Berkeley DB indexed files in place of the VSAM KSDS
- GAP-STB-011  # GnuCOBOL compile and runtime options in place of Enterprise COBOL and LE
