# Manifest of the derived baseline of BAT-RUNORDER-normal-01: the README full batch
# order CLOSEFIL ... OPENFIL [README.md:161-183]. Only unikix can run the scenario, so
# expected.yaml was authored from the job sources and from BAT-CHAIN-normal-01's
# gnucobol-batch observations of the same programs on the same inputs, not captured, and
# is inferred-not-observed (GAP-INF-011; job submission needs GAP-MIS-006, the unloads
# GAP-MIS-007, @REGION-FILES GAP-MIS-011). It names no execution_id or
# execution_fingerprint and holds no datasets/ until an observed run replaces it (MINOR
# on an equal decoded outcome, MAJOR on a different one).
# source_identity is the app/ sources the order runs, as harness.results.source_identity
# computes them: the 16 job sources (TRANBKP once), the REPROC procedure and the REPROCT
# control card TRANBKP uses, and the programs CBTRN02C, CBACT04C, CBSTM03A and CBSTM03B
# with their COPY closure. source_commit is HEAD at authoring; app/ there is
# byte-identical to the suite's starting commit 93ebec71ff7b59a68cedd7c501afe496a8eaa68d.
