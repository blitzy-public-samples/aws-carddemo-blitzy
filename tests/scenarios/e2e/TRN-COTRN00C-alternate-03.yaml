id: TRN-COTRN00C-alternate-03
level: e2e
type: alternate
description: >-
  USER0001 signs on through CC00, takes main-menu option 6 to the COTRN00C
  transaction list, which shows the ten lowest TRANSACT keys as page 1, and
  searches from transaction id 9999999999999999, above every TRANSACT key. The
  id is numeric, so it becomes the browse key [app/cbl/COTRN00C.cbl:206-225].
  STARTBR names neither GTEQ nor EQUAL (the GTEQ option is commented out), so
  it browses GTEQ, the CICS default, finds no key at or after the search id and
  returns NOTFND; COTRN00C sets end of file, moves 'You are at the top of the
  page...' to the message and sends the map with ERASE
  [app/cbl/COTRN00C.cbl:591-611]. No row is read or cleared first, so the rows,
  the page number and the search field go back as the ENTER input returned
  them: every COTRN00 field is defined with FSET [app/bms/COTRN00.bms:34-453],
  RECEIVE MAP fills COTRN0AI, and the send writes it from the overlaying
  COTRN0AO, refreshing only the header and the message
  [app/cbl/COTRN00C.cbl:527-586]. The error flag stays off, so the page routine
  skips its read loop at end of file and then issues ENDBR although no browse
  started, with no RESP option. On CICS that raises INVREQ, whose default
  action abends the task (AEIP) before the second send, which would have
  blanked the search field and shown page 00000000
  [app/cbl/COTRN00C.cbl:283-326,692-696]. The screen asserted is the NOTFND
  send; the abend is the suspected defect GAP-DEF-013.
# Primary item first, then the program, the maps the steps land on, the
# transaction the search runs under (COTRN00C returns with TRANSID CT00), the
# CSD file browsed, and the online-only copybooks COTRN00C copies. Sign-on, the
# main menu's option 6 and the page-1 content are covered by the scenarios that
# own them.
inventory_ids:
- INV-TRN-015
- INV-TRN-001
- INV-TRN-004
- INV-MNU-003
- INV-CFG-020
- INV-CFG-007
- INV-LAY-002
- INV-LAY-005
- INV-LAY-006
- INV-LAY-008
tags:
- inferred-not-observed
- suspected-defect
gap_ids:
- GAP-INF-007
- GAP-INF-012
- GAP-DEF-013
# TRANSACT is a built dataset with no repository data of its own, so it is
# loaded from the repository's daily transactions, whose 350-byte records share
# its layout; COTRN00C's first browse then has records to list.
preconditions:
  datasets:
    USRSEC: {base: USRSEC}
    TRANSACT: {base: DALYTRAN}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '6'
  # The highest DALYTRAN id is 0000000996722787; 9999999999999999 sorts above
  # every key in ASCII and in EBCDIC alike, so the browse finds nothing on
  # either platform.
  - aid: ENTER
    '@map': COTRN00
    fields:
      TRNIDIN: '9999999999999999'
# Steps 1 and 2 assert only the screen each lands on; their content is pinned
# by the scenarios of the programs that send them.
# Screen 3 is the NOTFND send of the search task. The task ends at the ENDBR
# that follows (GAP-DEF-013), so TRNIDIN still holds the search key and PAGENUM
# the page-1 counter the input returned; a region whose ENDBR returned normally
# would send again with TRNIDIN blank and PAGENUM 00000000. The rows are the
# ten lowest DALYTRAN ids as page 1 showed them: TDATE is TRAN-ORIG-TS as
# mm/dd/yy, TDESC the first 26 characters of TRAN-DESC, and TAMT TRAN-AMT
# edited as +99999999.99 [app/cbl/COTRN00C.cbl:381-396]. Screen values are
# whole fields at their BMS length, trailing spaces kept: comparison never
# trims. PAGENUM is the PIC 9(8) page counter moved to the PIC X(8) field.
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
  - '@map': COTRN00
    TRNNAME: CT00
    PGMNAME: COTRN00C
