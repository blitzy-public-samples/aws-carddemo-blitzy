# Derived baseline (capture_platform: derived in manifest.yaml) for
# RPT-CORPT00C-recovery-01: a confirmed Monthly report while the TDQ JOBS is
# unavailable. Authored from the source because only unikix can run the
# scenario; tagged inferred-not-observed (GAP-INF-009, GAP-INF-012,
# GAP-MIS-011) and replaced only by `report.py --import-unikix` on eligible
# evidence, never edited to match a run.
#
# One screen per step, the screen shown after the step's AID; messages holds
# each step's ERRMSG. Text is the whole BMS field, trailing spaces kept. Steps
# 1 and 2 assert every field the scenario's expected names: a superset of the
# MNU-COMEN01C-alternate-09 entries for the same two steps, with equal values,
# and the same values as RPT-CORPT00C-normal-01.
# - Step 1: USER0001 (type U) signs on and COSGN00C XCTLs to COMEN01C, which
#   sends COMEN01 under CM00 with a blank ERRMSG [app/cbl/COSGN00C.cbl:230-237]
#   [app/cbl/COMEN01C.cbl:75-90].
# - Step 2: option 9 XCTLs to CORPT00C with CDEMO-PGM-CONTEXT zero
#   [app/cpy/COMEN02Y.cpy:74-78] [app/cbl/COMEN01C.cbl:115-156]. Its first
#   entry moves LOW-VALUES to CORPT0AO and sends CORPT00 under CR00 with blank
#   selectors and a blank ERRMSG [app/cbl/CORPT00C.cbl:163-181,556-580].
# - Step 3: MONTHLY X with CONFIRM Y takes the Monthly branch into
#   SUBMIT-JOB-TO-INTRDR, whose loop writes JOB-LINES(1) to JOBS first
#   [app/cbl/CORPT00C.cbl:213-238,462-510]. That WRITEQ TD fails, so
#   WIRTE-JOBSUB-TDQ moves 'Unable to Write TDQ (JOBS)...' (29 characters,
#   padded to the 78 of ERRMSG) to WS-MESSAGE and performs SEND-TRNRPT-SCREEN,
#   which sends CORPT00 with ERASE and ends the task with GO TO RETURN-TO-CICS
#   [app/cbl/CORPT00C.cbl:515-535,556-591]. INITIALIZE-ALL-FIELDS is never
#   reached [app/cbl/CORPT00C.cbl:445-456,633-646], and CORPT0AO redefines
#   CORPT0AI [app/cpy-bms/CORPT00.CPY:121], so MONTHLY X and CONFIRM Y are
#   redisplayed and the untouched FSET fields return as spaces
#   [app/bms/CORPT00.bms:80-210].
#
# CURDATE and CURTIME come from the region clock, which unikix cannot fix
# (GAP-MIS-015), in the mm/dd/yy and hh:mm:ss forms of CSDAT01Y
# [app/cbl/CORPT00C.cbl:609-628]; they are the only matchers.
messages:
- '                                                                              '
- '                                                                              '
- 'Unable to Write TDQ (JOBS)...                                                 '
screens:
- '@map': COMEN01
  ERRMSG: '                                                                              '
  PGMNAME: COMEN01C
  TRNNAME: CM00
- '@map': CORPT00
  CONFIRM: ' '
  ERRMSG: '                                                                              '
  MONTHLY: ' '
  PGMNAME: CORPT00C
  TRNNAME: CR00
- '@map': CORPT00
  CONFIRM: Y
  CURDATE:
    format: '%m/%d/%y'
    match: run-date
  CURTIME:
    match: run-time
  CUSTOM: ' '
  EDTDD: '  '
  EDTMM: '  '
  EDTYYYY: '    '
  ERRMSG: 'Unable to Write TDQ (JOBS)...                                                 '
  MONTHLY: X
  PGMNAME: CORPT00C
  SDTDD: '  '
  SDTMM: '  '
  SDTYYYY: '    '
  TITLE01: '      AWS Mainframe Modernization       '
  TITLE02: '              CardDemo                  '
  TRNNAME: CR00
  YEARLY: ' '
