# Derived baseline of scenario TRN-COTRN02C-negative-09 (capture_platform
# derived, tag inferred-not-observed): USER0001 signs on, takes main-menu
# option 8 (Transaction Add) and enters a valid add on COTRN02 by card number
# with Source left empty. Authored from the source, never captured:
# - step 1: COSGN00C XCTLs a type-U user to COMEN01C [app/cbl/COSGN00C.cbl:
#   230-237], whose first entry sends COMEN01 headed CM00/COMEN01C with a
#   blank ERRMSG [app/cbl/COMEN01C.cbl:36-37,75-90,180-192];
# - step 2: option 8 is COTRN02C [app/cpy/COMEN02Y.cpy:67-72]; its first
#   entry moves LOW-VALUES to COTRN2AO and sends the empty add screen with
#   the COTTL01Y titles, CT02, COTRN02C and the region clock
#   [app/cbl/COTRN02C.cbl:112-130,516-571];
# - step 3: the card branch keeps 0500024453765740 and moves XREF-ACCT-ID
#   00000000050 (app/data/ASCII/cardxref.txt record 1) to ACTIDIN
#   [app/cbl/COTRN02C.cbl:210-223,609-637]; Type CD and Category CD pass and
#   TRNSRCI = SPACES moves 'Source can NOT be empty...' to WS-MESSAGE, then
#   SEND-TRNADD-SCREEN sends COTRN02 with ERASE and RETURNs TRANSID CT02
#   [app/cbl/COTRN02C.cbl:251-269,516-534]. The task ends there: no date
#   edit, no CSUTLDTC call, no TRANSACT browse or write.
# Values are whole BMS fields of app/bms/COTRN02.bms with trailing spaces
# kept: COTRN2AO redefines COTRN2AI [app/cpy-bms/COTRN02.CPY:145], so the
# entered fields come back as received; ERRMSG is the X(80) WS-MESSAGE in the
# 78-byte ERRMSGO. CURDATE (mm/dd/yy) and CURTIME come from the region clock,
# which cannot be fixed (GAP-MIS-015), so they are matchers. messages holds
# each step's ERRMSG in step order.
# file_state: TRANSACT keeps the 300 records materialized from DALYTRAN; its
# highest TRAN-ID, which an add would have numbered after, is unchanged.
# Open under GAP-INF-007 (derived TRN end-to-end baselines) and GAP-INF-012
# (online-only copybooks). Only `report.py --import-unikix` promotes this
# baseline; it is never edited by hand to match a run.
