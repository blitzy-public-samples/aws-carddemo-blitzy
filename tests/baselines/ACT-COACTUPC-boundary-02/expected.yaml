# Derived baseline of scenario ACT-COACTUPC-boundary-02: USER0001 signs on,
# takes main menu option 2 'Account Update', fetches account 00000000001 on
# COACTUP (transaction CAUP), types the FICO Score 300 over customer
# 000000001's 700 and presses ENTER. 300 is the first value of
# FICO-RANGE-IS-VALID (VALUES 300 THROUGH 850), so it is accepted: no FICO
# Score message, and the confirmation prompt instead. Customer 000000001 is the
# scenario's invented record, which passes every other edit of
# 1200-EDIT-MAP-INPUTS.
# Authored from the source, never captured:
# - app/cbl/COSGN00C.cbl:230-238 (type U -> COMEN01C) and app/cbl/COMEN01C.cbl
#   with app/cpy/COMEN02Y.cpy (option 2 -> COACTUPC, fresh entry);
# - app/cbl/COACTUPC.cbl: 880-886,964-973 (fresh entry, search-key prompt);
#   2568-2580,3608-3884 and 2787-2866 (fetch, fetched values shown,
#   'Update account details presented above.'); 1279-1284 (the received '300'
#   in ACUP-NEW-CUST-FICO-SCORE-X); 1460-1470 (a change from the old 700);
#   1545-1556, 2109-2176 and 2514-2531 (1245-EDIT-NUM-REQD finds the score
#   supplied, numeric and not zero, and 1275-EDIT-FICO-SCORE CONTINUEs since
#   300 is in range [845-849]); 1557-1675 (the remaining edits pass, so
#   ACUP-CHANGES-OK-NOT-CONFIRMED); 2582-2620 (ENTER, not PF5: nothing is
#   written); 2700-2724 and 2870-2951 (3203-SHOW-UPDATED-VALUES echoes the
#   received values, FICO 300, amounts through PIC +ZZZ,ZZZ,ZZZ.99);
#   2955-2983 (PROMPT-FOR-CONFIRMATION in the 40-byte WS-INFO-MSG to the
#   45-byte INFOMSG, the blank 75-byte WS-RETURN-MSG to the 78-byte ERRMSG);
#   3566-3584 (F5=Save and F12=Cancel bright only while
#   PROMPT-FOR-CONFIRMATION; dark fields are captured as blanks);
# - header from app/cpy/COTTL01Y.cpy and app/cpy/CSDAT01Y.cpy, run-clock fields
#   as matchers; field widths and INITIAL texts from app/bms/COACTUP.bms.
# file_state asserts what the scenario asserts: with no PF5 neither master is
# rewritten, so both keep 50 records, account 00000000001 its repository
# values (ACCT-GROUP-ID blank) and customer 000000001 the invented values,
# FICO Score 700 included.
# Only `report.py --import-unikix` promotes it, from imported UniKix evidence;
# it is never edited by hand to match a run.
file_state:
  ACCTDATA:
    contains:
    - ACCT-ACTIVE-STATUS: 'Y'
      ACCT-CASH-CREDIT-LIMIT: '1020.00'
      ACCT-CREDIT-LIMIT: '2020.00'
