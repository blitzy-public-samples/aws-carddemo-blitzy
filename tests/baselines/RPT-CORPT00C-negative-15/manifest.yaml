# Manifest of the derived baseline of RPT-CORPT00C-negative-15: USER0001 asks
# CORPT00 for a Custom report from 01/01/2022 to 02/30/2022; every date part
# passes its own check and CSUTLDTC accepts the start date, but for the end
# date 2022-02-30 CSUTLDTC, called with the mask YYYY-MM-DD, returns severity
# 0003 and message 2508 (FC-BAD-DATE-VALUE), so CORPT00C sends 'End Date - Not
# a valid date...' and submits no job [app/cbl/CORPT00C.cbl:381-436]
# [app/cbl/CSUTLDTC.cbl:61-70,88-157]. Only unikix can run the scenario, so
# expected.yaml was authored from the source, not captured, and is
# inferred-not-observed (GAP-INF-009, GAP-INF-012, GAP-INF-001; whether UniKix
# supplies CEEDAYS is GAP-MIS-010). It names no execution_id or
# execution_fingerprint and holds no datasets/ until report.py --import-unikix
# promotes an eligible UniKix run; the UniKix copy's CSUTLDTC differs
# (GAP-DOC-021), so a UniKix record of this scenario's items cannot replace it
# before an app/ build is observed (GAP-MIS-008). derived_from is left out:
# the expectation comes from the source, not the tech spec.
#
# source_identity.units are every app/ unit the three steps execute, not only
# CORPT00C's own sources: each program as harness.results computes it for a
# program run (its COPY closure, symbolic map included, and the app/cbl units
# it CALLs), plus the BMS sources of the maps sent or received, as
# report._scenario_units counts them for a UniKix run. COSGN00C signs USER0001
# on and XCTLs to COMEN01C [app/cbl/COSGN00C.cbl:230-237]; COMEN01C XCTLs
# option 9 to CORPT00C [app/cpy/COMEN02Y.cpy:74-78]; CORPT00C CALLs CSUTLDTC
# for the start date and then the end date it refuses
# [app/cbl/CORPT00C.cbl:388-426]. DFHAID and DFHBMSCA are CICS-supplied, not
# app/ sources. source_commit is the commit the baseline was authored on;
# app/ is byte-identical to the suite's starting commit
# 93ebec71ff7b59a68cedd7c501afe496a8eaa68d.
