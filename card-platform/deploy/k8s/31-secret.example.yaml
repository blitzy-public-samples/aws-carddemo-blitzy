# Database credentials for a local demo cluster. Do not reuse these values
# elsewhere. Change a value by editing a copy, not this file.
#
# Rationale for this approach: card-platform/docs/decision-log.md
---
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-secret
  namespace: carddemo
  labels:
    app.kubernetes.io/name: card-platform
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: card-platform
    app.kubernetes.io/managed-by: kubectl
type: Opaque
# stringData takes plain text. Kubernetes encodes each value on apply.
stringData:
  # 20-postgres.yaml reads these two keys to create the database user.
  POSTGRES_USER: "carddemo"
  POSTGRES_PASSWORD: "carddemo-local-demo-only"

  # The six service Deployments read these two keys for the datasource.
  # Each service signs on as the user created above, so both pairs match.
  SPRING_DATASOURCE_USERNAME: "carddemo"
  SPRING_DATASOURCE_PASSWORD: "carddemo-local-demo-only"
