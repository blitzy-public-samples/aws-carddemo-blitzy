# Transaction view with the transaction id left blank. USER0001 (user type U)
# signs on through CC00 and COSGN00C transfers control to the main menu
# COMEN01C [app/cbl/COSGN00C.cbl:221-240]. Option 7 of COMEN02Y is
# 'Transaction View', program COTRN01C [app/cpy/COMEN02Y.cpy:61-65], so
# COMEN01C transfers control to it with the program context reset
# [app/cbl/COMEN01C.cbl:127-155]. COMEN01C passes only the COCOM01Y COMMAREA,
# so the group MOVE into COTRN01C's longer CARDDEMO-COMMAREA pads
# CDEMO-CT01-TRN-SELECTED with spaces and no transaction is fetched. Entered
# without the reenter flag, COTRN01C clears COTRN1AO to LOW-VALUES, sends
# COTRN01 with WS-MESSAGE still spaces and returns with TRANSID CT01
# [app/cbl/COTRN01C.cbl:94-109,136-139,213-225].
#
# The ENTER of step 3 runs CT01 again. COTRN01C receives map COTRN1A and the
# first WHEN of PROCESS-ENTER-KEY finds TRNIDINI equal to SPACES or LOW-VALUES
# (the erased field arrives with no data, so either value takes this branch):
# it sets the error flag, moves 'Tran ID can NOT be empty...' to WS-MESSAGE,
# puts the cursor on TRNIDIN and sends the screen again
# [app/cbl/COTRN01C.cbl:111-114,144-157,213-225]. The error flag keeps it from
# READ-TRANSACT-FILE and from the moves of the record into the detail fields,
# so no transaction is read and every detail field, never filled on this
# screen, stays blank [app/cbl/COTRN01C.cbl:158-192]. TRANSACT is loaded only
# so the region starts from the fixture state the other COTRN01C scenarios
# use; this path neither reads nor changes it, so no file_state is asserted.
#
# Screen values are whole fields at their BMS length with trailing spaces kept,
# because comparison never trims. ERRMSG is WS-MESSAGE (X(80)) cut to ERRMSGO
# (X(78)); CURTIME is the 8-character hh:mm:ss of CSDAT01Y moved to the
# 8-character CURTIMEO [app/cpy-bms/COTRN01.CPY:182,272]. expected.messages is
# not asserted: it carries the ERRMSG of every step, which the screens below
# already assert. The baseline is derived from the source: no TPE region runs
# in CI.
id: TRN-COTRN01C-negative-02
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses option 7 (Transaction View) on the main menu and
  presses ENTER on the view-transaction screen with the transaction id blank.
  COTRN01C refuses the fetch before any TRANSACT read and shows map COTRN01
  again with its header (CT01, COTRN01C, the titles, the run date and time),
  the blank transaction id, every transaction detail field blank, and 'Tran ID
  can NOT be empty...' in ERRMSG [app/cbl/COTRN01C.cbl:144-157].
# Primary item first, then the program, the maps the screens assert (COMEN01,
# COTRN01), the transaction step 3 enters (CT01, the TRANSID COTRN01C returned
# with), and the online-only copybooks COTRN01C copies. The TRANSACT CSD file
# is not listed because this path never reads it; CVTRA05Y is a batch-level
# copybook verified elsewhere, and the sign-on and menu items belong to their
# own scenarios.
inventory_ids:
- INV-TRN-024  # COTRN01C message 'Tran ID can NOT be empty...' (rule)
- INV-TRN-002  # COTRN01C program
- INV-MNU-003  # COMEN01 map, the main menu the sign-on lands on
- INV-TRN-005  # COTRN01 map, the view-transaction screen
- INV-CFG-021  # CT01 transaction, under which the ENTER of step 3 runs COTRN01C
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA that makes the ENTER a reentry
- INV-LAY-005  # COTTL01Y copybook, TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y copybook, CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y copybook, copied by COTRN01C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-007  # TRN end-to-end baselines derived from the source, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    # COSGN00C reads the sign-on user USER0001; COTRN01C reads nothing here.
    USRSEC: {base: USRSEC}
    # TRANSACT holds no repository data of its own (datasets.yaml source
    # 'built'), so it is built from the DALYTRAN records, as for every online
    # TRN scenario.
    TRANSACT: {base: DALYTRAN}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - {transid: CC00, aid: ENTER, fields: {USERID: USER0001, PASSWD: PASSWORD}, '@map': COSGN00}
  - {aid: ENTER, fields: {OPTION: '7'}, '@map': COMEN01}
  # The empty value erases the transaction id field, so COTRN01C receives no
  # transaction id.
  - {aid: ENTER, fields: {TRNIDIN: ''}, '@map': COTRN01}
expected:
  screens:
  # One entry per step, each the screen the step ends on.
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    OPTN007: '07. Transaction View                    '
    ERRMSG: '                                                                              '
  - '@map': COTRN01
    TRNNAME: CT01
    PGMNAME: COTRN01C
    TRNIDIN: '                '
    ERRMSG: '                                                                              '
  - '@map': COTRN01
    TRNNAME: CT01
    PGMNAME: COTRN01C
    TITLE01: '      AWS Mainframe Modernization       '
    TITLE02: '              CardDemo                  '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time, format: '%H:%M:%S'}
    TRNIDIN: '                '
    TRNID: '                '
    CARDNUM: '                '
    TTYPCD: '  '
    TCATCD: '    '
    TRNSRC: '          '
    TDESC: '                                                            '
    TRNAMT: '            '
    TORIGDT: '          '
    TPROCDT: '          '
    MID: '         '
    MNAME: '                              '
    MCITY: '                         '
    MZIP: '          '
    ERRMSG: 'Tran ID can NOT be empty...                                                   '
