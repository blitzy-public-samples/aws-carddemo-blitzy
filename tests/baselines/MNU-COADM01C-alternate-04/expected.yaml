  OPTN008: '                                        '
  OPTN009: '                                        '
  OPTN010: '                                        '
  OPTN011: '                                        '
  OPTN012: '                                        '
  PGMNAME: 'COADM01C'
  TITLE01: '      AWS Mainframe Modernization       '
  TITLE02: '              CardDemo                  '
  TRNNAME: 'CA00'
- '@map': COUSR02
