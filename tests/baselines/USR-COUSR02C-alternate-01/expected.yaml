# Derived baseline of scenario USR-COUSR02C-alternate-01 (capture_platform:
# derived): ADMIN001 fetches the invented user TESTU002 on the COUSR02 update
# screen and presses PF5 without changing a field. Authored from the source,
# never captured: app/cbl/COUSR02C.cbl:122-123,177-245 (PF5 finds every value
# equal to the record, leaves USR-MODIFIED-NO set, issues no REWRITE and sends
# 'Please modify to update ...') and app/cbl/COUSR02C.cbl:266-353 (the send,
# header and USRSEC read for update), with app/bms/COUSR02.bms and
# app/cbl/COADM01C.cbl for the menu path. Open until a UniKix run is imported:
# GAP-INF-004 (derived USR end-to-end baselines) and GAP-INF-012 (online-only
# copybooks).
# One screen per step, the one shown after the step's AID; values are full BMS
# field width with their trailing spaces, and PASSWD (dark) is not asserted.
# The PF5 task sends COUSR02 twice with ERASE: first 'Press PF5 key to save
# your updates ...' from READ-USER-SEC-FILE [app/cbl/COUSR02C.cbl:336-339],
# then 'Please modify to update ...' [app/cbl/COUSR02C.cbl:236-243]. The last
# screen pins the final send; an imported UniKix run showing otherwise
# replaces it with a MAJOR bump.
# file_state: USRSEC unchanged, the ten fixture users and TESTU002 in key order.
file_state:
  USRSEC:
    records:
    - SEC-USR-FILLER: '                       '
      SEC-USR-FNAME: 'MARGARET            '
      SEC-USR-ID: ADMIN001
