# Manifest of the derived baseline of TRN-COTRN00C-alternate-04: a COTRN00C
# search from transaction id 0000000992103545 fills two rows, the third
# READNEXT returns ENDFILE, and the screen keeps 'You have reached the bottom
# of the page...' [app/cbl/COTRN00C.cbl:297-326,624-646]. Only unikix can run
# the scenario, so expected.yaml is authored from the source and is
# inferred-not-observed (GAP-INF-007, GAP-INF-012). It names no execution_id
# or execution_fingerprint and holds no datasets/ until an eligible UniKix run
# is imported (report.py --import-unikix).
#
# source_identity.units are every app/ source the steps execute, not
# COTRN00C.cbl alone, because a source identity hashes each executed program,
# copybook and map: the COPY closure, as harness.results computes it for a
# program (symbolic maps in app/cpy-bms included), of COSGN00C, which signs
# USER0001 on and XCTLs to COMEN01C [app/cbl/COSGN00C.cbl:221-240], of
# COMEN01C, whose option 6 XCTLs to COTRN00C [app/cbl/COMEN01C.cbl:115-156],
# and of COTRN00C, which browses TRANSACT and sends COTRN00 - plus the BMS
# sources of the maps COSGN00, COMEN01 and COTRN00. DFHAID and DFHBMSCA are
# CICS-supplied and not in the repository. source_commit is HEAD at
# authoring; app/ is byte-identical to the suite's starting commit.
