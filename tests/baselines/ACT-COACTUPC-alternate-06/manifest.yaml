# Manifest of the derived baseline of ACT-COACTUPC-alternate-06: CAUP entered
# directly, with no COMMAREA and no sign-on, starts COACTUPC on its own COACTUP
# screen. Only unikix can run the scenario, so expected.yaml is authored from
# the source (derived_from: source) and is inferred-not-observed (GAP-INF-005,
# GAP-INF-012). It names no execution_id or execution_fingerprint and holds no
# datasets/ until report.py --import-unikix promotes an eligible UniKix run;
# the UniKix COACTUP map differs from app/ (GAP-DOC-025), so such a run counts
# for that map only as UniKix-copy behaviour.
#
# source_identity.units are the app/ sources of the one program the step runs,
# as harness.results computes them for a program run of COACTUPC: its COPY
# closure (inventory_tools.copy_closure, which brings app/cpy-bms/COACTUP.CPY)
# and the app/cbl unit it CALLs through CSUTLDPY, CSUTLDTC, which this path
# does not reach. The BMS source of the asserted map, app/bms/COACTUP.bms, is
# listed too, because a run's identity covers the maps it executes and FKEYS
# shows that source's INITIAL text. No sign-on program runs, so COSGN00C is
# absent; DFHAID and DFHBMSCA are CICS-supplied and not in the repository.
