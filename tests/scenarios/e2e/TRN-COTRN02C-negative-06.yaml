# The Add Transaction screen submitted with neither an account number nor a
# card number.
#
# Steps 1-2 reach the empty Add Transaction screen as TRN-COTRN02C-normal-01
# does: USER0001 (type U) is routed to COMEN01C, and option 8 'Transaction Add'
# (program COTRN02C) transfers control with the program context reset, so
# COTRN02C sets CDEMO-PGM-REENTER, finds no transaction selected and sends
# COTRN02 with a blank ERRMSG before RETURN TRANSID(CT02)
# [app/cbl/COSGN00C.cbl:230-237] [app/cpy/COMEN02Y.cpy:67-72]
# [app/cbl/COMEN01C.cbl:144-156] [app/cbl/COTRN02C.cbl:115-130,516-534].
# Step 3 enters the valid field set of the TRN-COTRN02C scenarios with CONFIRM
# Y, but erases both key fields, Acct # (ACTIDIN) and Card # (CARDNIN), and
# presses ENTER under CT02. COTRN02C receives the map and performs
# PROCESS-ENTER-KEY, whose first act is VALIDATE-INPUT-KEY-FIELDS
# [app/cbl/COTRN02C.cbl:131-135,164-166]:
# - Both key fields are spaces or LOW-VALUES (an erased field reads back as
#   either), so neither the account branch nor the card branch is taken and
#   WHEN OTHER sets WS-ERR-FLG, moves 'Account or Card Number must be
#   entered...' to WS-MESSAGE and puts the cursor on ACTIDIN
#   [app/cbl/COTRN02C.cbl:193-229].
# - SEND-TRNADD-SCREEN rebuilds the header (CT02, COTRN02C, the COTTL01Y titles
#   and the CSDAT01Y date and time), moves WS-MESSAGE to ERRMSG, sends COTRN02
#   with ERASE and ends the task with RETURN TRANSID(CT02)
#   [app/cbl/COTRN02C.cbl:516-571].
# Because that RETURN ends the task inside VALIDATE-INPUT-KEY-FIELDS, the data
# field edits, the CONFIRM evaluation and ADD-TRANSACTION are never reached,
# and no file is read: neither CXACAIX nor CCXREF, nor TRANSACT
# [app/cbl/COTRN02C.cbl:166-189]. So the only precondition is the sign-on user,
# and no file_state is asserted.
# The key and data fields are not asserted: COTRN2AO redefines COTRN2AI, so
# they are sent back as received and carry no business outcome.
# ERRMSG is the 78-byte map field: the 41-character message followed by spaces
# from the 80-byte WS-MESSAGE [app/cbl/COTRN02C.cbl:38,520]. CURDATE and
# CURTIME come from the region clock, so they are matchers and the clock is
# relative. The baseline is derived from the source: no TPE region runs in CI.
id: TRN-COTRN02C-negative-06
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 8 (Transaction Add) and, on
  COTRN02, submits a complete transaction with CONFIRM Y but with both Acct #
  and Card # left blank. COTRN02C refuses it before any other edit or file
  access: it sends COTRN02 again with its header (CT02, COTRN02C, the titles,
  the run date and time) and 'Account or Card Number must be entered...' in
  the message line, and adds no transaction.
# Primary item first, then the program, the maps asserted, the transaction step
# 3 runs under, and the online-only copybooks COTRN02C copies. Sign-on and the
# menu option (CC00, CM00, COSGN00, USRSEC) are verified by the SEC and MNU
# scenarios; this path touches no other CSD file.
inventory_ids:
- INV-TRN-035  # COTRN02C message 'Account or Card Number must be entered...' (rule)
- INV-TRN-003  # COTRN02C program
- INV-MNU-003  # COMEN01 map, where option 8 is entered
- INV-TRN-006  # COTRN02 map, the add screen of steps 2 and 3
- INV-CFG-022  # CT02 transaction, under which COTRN02C receives the add
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA that makes step 3 a reentry
- INV-LAY-005  # COTTL01Y copybook, TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y copybook, CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y copybook, copied by COTRN02C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-007  # TRN end-to-end baselines derived from the source, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    # COSGN00C reads the sign-on user USER0001; this path reads nothing else.
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '8'
  # The valid field set with both key fields erased.
  - aid: ENTER
    '@map': COTRN02
    fields:
      ACTIDIN: ''
      CARDNIN: ''
      TTYPCD: '01'
      TCATCD: '0001'
      TRNSRC: 'POS TERM'
      TDESC: 'Test purchase'
      TRNAMT: '+00000012.34'
      TORIGDT: '2022-07-01'
      TPROCDT: '2022-07-01'
      MID: '800000001'
      MNAME: 'Test Merchant'
      MCITY: 'Testville'
      MZIP: '27601'
      CONFIRM: 'Y'
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    ERRMSG: '                                                                              '
  - '@map': COTRN02
    TRNNAME: CT02
    PGMNAME: COTRN02C
    ERRMSG: '                                                                              '
  - '@map': COTRN02
    TRNNAME: CT02
    PGMNAME: COTRN02C
    TITLE01: '      AWS Mainframe Modernization       '
    TITLE02: '              CardDemo                  '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    ERRMSG: 'Account or Card Number must be entered...                                     '
  # One ERRMSG value per step: blank on the main menu and on the empty add
  # screen, the key-field message after step 3.
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'Account or Card Number must be entered...                                     '
