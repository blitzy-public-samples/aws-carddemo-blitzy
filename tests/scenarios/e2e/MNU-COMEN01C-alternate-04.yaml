id: MNU-COMEN01C-alternate-04
level: e2e
type: alternate
description: >-
  USER0001 signs on, reaches the main menu that COMEN01C sends under CM00, and
  selects option 4 'Credit Card View'. The option is numeric, within the 10
  menu options and of user type U, and its program name does not begin
  'DUMMY', so COMEN01C transfers control with XCTL to COCRDSLC with the
  program context reset to enter [app/cbl/COMEN01C.cbl:35-36,117-155,218-219]
  [app/cpy/COMEN02Y.cpy:43-47]. Entered from the menu, COCRDSLC initializes
  the COMMAREA and sends its search map COCRDSL headed with its own
  transaction CCDL and program name COCRDSLC
  [app/cbl/COCRDSLC.cbl:163-166,268-272,349-356,434-435].
