# Manifest of the derived baseline of CFG-FCT-normal-01: the region file
# inquiry after the test-owned UniKix region is started and reset lists the 14
# files of the copy's fct.lst open and enabled, among them the 6 UniKix-only
# files DISCGRP, TCATBALF, TRANCATG, TRANSAIX, TRANTYPE and TRXFL
# [samples/m2/unikix/UniKix_CardDemo_runtime_v1.zip:migrated_app/catlg/tpe/fct.lst:1-14]
# (GAP-DOC-030). Only unikix can run the scenario, so expected.yaml was
# authored from fct.lst and the CSD FILE definitions (derived_from: source),
# not captured, and is inferred-not-observed (GAP-INF-010; @REGION-FILES needs
# GAP-MIS-011). It names no execution_id or execution_fingerprint and holds no
# datasets/ until report.py --import-unikix promotes an eligible run: MINOR on
# an equal decoded outcome, MAJOR on a different one.
#
# source_identity is the UniKix copy a run executes, exactly as
# adapters/unikix/adapter.py source_identity writes it: tree unikix-copy, the
# zip's sha256 and the zip members read in memory (never extracted) with their
# sha256. inputs.steps is a list, empty here, so a run counts as online: it
# executes the whole online copy (programs, CSUTLDTC, maps, copybooks) and
# every catlg/tpe resource list the region is created from, fct.lst among
# them. The 6 items verify once a record holds this fct.lst hash. source_commit
# is HEAD at authoring; app/, samples/ and diagrams/ there are unchanged from
# the suite's starting commit 93ebec71ff7b59a68cedd7c501afe496a8eaa68d.
