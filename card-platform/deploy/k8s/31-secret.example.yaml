# Credential templates for a demo cluster. EIGHTEEN Secrets, and the split between them is
# the point of the file rather than an accident of grouping.
#
# Each service reads exactly two credentials of its own, from a Secret named after it,
# and reads no other service's Secret. A login is a boundary only when it belongs to one
# service.
#
# Two Secrets stay shared:
#
#   carddemo-identity-secret   The THREE request-identity password hashes every service
#                              verifies against: administrator, cardholder and monitoring.
#                              The source keeps its signon identities in one dataset the
#                              whole region reads, defined once in app/csd/CARDDEMO.CSD, so
#                              a platform-wide identity store is the faithful shape here.
#   carddemo-trust-secret      Truststore and certificate authority. Trust is platform
#                              material: a per-service copy of one authority is six copies
#                              of one file.
#
# One Secret is shared by exactly two:
#
#   carddemo-card-token-secret The card-token key, pulled by 40-authorization-service.yaml
#                              and 45-card-service.yaml alone. Those two derive a token;
#                              the other four read one that arrives in an event or a
#                              request. A key mounted into a service that derives nothing
#                              widens what a compromise of it reaches and buys nothing.
#
# One Secret is read by exactly one, and it is the fourth identity hash:
#
#   carddemo-authorization-identity-secret
#                              The acquirer hash, pulled by 40-authorization-service.yaml
#                              alone, because only the authorization service verifies a
#                              password against it. ACQUIRER is the strongest identity on
#                              the platform, and a bcrypt digest mounted into five services
#                              that never read it is a value a compromise of any of them
#                              could take away and grind offline.
#
# What is deliberately NOT shared: each service has a carddemo-<service>-tls-secret holding
# its own private key and certificate. Compromise of one Pod therefore cannot impersonate
# another service.
#
# THIS FILE CARRIES NO CREDENTIAL AND NO KEY MATERIAL, and that is deliberate. Every value
# below carries the literal REPLACE marker. Applying it unedited creates Secrets whose values
# every service refuses at start-up: the guard in each config/SecurityConfig checks its
# database password, its broker credential, its keystore password and the card-token key as
# the context refreshes and stops the service before it binds a port, and each identity hash
# is checked as its identity is mapped. A service that started with a placeholder would answer every request with 401 and
# read as misconfigured rather than as insecure, which is the failure those refusals replace.
# The database refuses it too: the provisioning program in 20-postgres.yaml stops on a
# password still carrying the marker rather than building a data directory around it.
#
# THE NAMES BELOW ARE THE REAL NAMES. Every Secret in this file already carries the name a
# workload reads: 10-kafka.yaml reads carddemo-kafka-secret and carddemo-trust-secret,
# 20-postgres.yaml reads carddemo-postgres-secret, and each of 40-45 reads
# carddemo-identity-secret, carddemo-trust-secret, its own
# carddemo-<service>-tls-secret and its own carddemo-<service>-secret. Two of the six,
# 40-authorization-service.yaml and 45-card-service.yaml, also read
# carddemo-card-token-secret.
# Nothing is renamed on the way in. What turns this template into the real Secrets is
# replacing the values, and there are two ways to do it:
#
#   1. Copy this file OUTSIDE this folder, replace every REPLACE value, and apply the copy:
#
#        install -m 600 card-platform/deploy/k8s/31-secret.example.yaml ~/carddemo-secrets.yaml
#        # edit ~/carddemo-secrets.yaml, then
#        kubectl apply -f ~/carddemo-secrets.yaml
#
#      install -m 600 rather than cp, because the copy holds every credential of one cluster
#      the moment it is edited, and cp creates it under the umask -- 0644 on a default
#      account, readable by every local user. The mode is set as the file is created, so
#      there is no window in which it is world-readable.
#
#      Keep the copy out of this folder, because `kubectl apply -f card-platform/deploy/k8s/`
#      would apply this template too and put the placeholders back. 00-namespace.yaml carries
#      the apply order that avoids that.
#
#   2. Create each Secret imperatively, which is the easier route for binary
#      keystores because --from-file reads bytes and encodes them for you. The shared
#      trust material is one Secret:
#
#        kubectl -n carddemo create secret generic carddemo-trust-secret \
#          --from-file=truststore.p12=./truststore.p12 \
#          --from-file=ca.crt=./ca.crt \
#          --from-file=KAFKA_SSL_TRUSTSTORE_PASSWORD=./truststore.pass \
#          --dry-run=client -o yaml | kubectl apply -f -
#
#      Create one keystore Secret per service, changing both names together:
#
#        kubectl -n carddemo create secret generic carddemo-authorization-tls-secret \
#          --from-file=keystore.p12=./authorization-service.p12 \
#          --from-file=SERVER_SSL_KEYSTORE_PASSWORD=./authorization-service.pass \
#          --dry-run=client -o yaml | kubectl apply -f -
#
#      --from-file=KEY=./path rather than --from-literal=KEY="$(cat ./path)". A literal
#      places the password in the argument vector of kubectl, where /proc/<pid>/cmdline
#      exposes it to every local account for the life of the process and a shell history
#      file keeps it afterwards. --from-file reads the bytes directly and no password
#      appears in any argument. The file must hold the password and nothing else: a
#      trailing newline becomes part of the value, so write it with
#      `printf %s "$password" > ./truststore.pass` and give it mode 600. The same applies
#      to the identity hashes and the card-token key below.
#
#      The key names must match this file exactly; a name this file does not carry reaches
#      no container.
#
# Generate a password:      openssl rand -base64 24 | tr -d '/+='
# Generate a hash:          the identity Secret below carries the command.
# Generate TLS material:    the TLS Secret below carries the commands.
#
# The tr strips three characters no password here may carry. The broker builds a login
# entry around its password, and a quote, a backslash or whitespace ends the entry early.
# The broker refuses such a value.
#
# Two blocks appear below, and a key's content decides which one it belongs in.
#
#   stringData  UTF-8 text, encoded by Kubernetes on apply. Every password, hash and
#               Privacy Enhanced Mail (PEM) document belongs here.
#   data        base64, and the ONLY place binary material can go. A PKCS12 archive is
#               not valid UTF-8, and a YAML document carrying its bytes is rejected with
#               "control characters are not allowed".
#
# Two blocks appear below, and which one a key belongs in is decided by the key's content
# rather than by taste. stringData takes UTF-8 text and Kubernetes encodes it on apply, so
# every password, hash and Privacy Enhanced Mail (PEM) document belongs there. data takes
# base64 and is the ONLY place binary material can go: a PKCS12 archive is not valid UTF-8,
# and a YAML document carrying its bytes is rejected outright with "control characters are
# not allowed". Every keystore key therefore sits under data with a valid base64
# placeholder.
#
# card-platform/docs/decision-log.md records why private keys are split from shared trust.
---
# Read by the postgres Pod alone. It carries the superuser password, the six per-service
# login passwords the provisioning program sets, and the certificate the server presents.
#
# No service reads this Secret. A service reads only its own password, from its own
# Secret, and the provisioning program is what puts the two in agreement.
apiVersion: v1
kind: Secret
# This is the name 20-postgres.yaml reads, and the Deployment there binds nine of the keys
# below. Replacing the values is what turns this template into the real Secret; the name
# stays as it is.
metadata:
  name: carddemo-postgres-secret
  namespace: carddemo
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: card-platform
    app.kubernetes.io/managed-by: kubectl
type: Opaque
# stringData takes plain text. Kubernetes encodes each value on apply.
#
# Both password keys ship as the placeholder <SET_LOCALLY>. This file publishes
# no usable password. Replace the placeholder in a copy of this file, or delete
# both password keys and point the Deployments at an external secret store.
stringData:
  # The superuser. It provisions the six logins and the six schemas, and NO service signs
  # on as it.
  POSTGRES_USER: "carddemo"
  POSTGRES_PASSWORD: "REPLACE-WITH-A-GENERATED-SUPERUSER-PASSWORD"

  # One login per service. The provisioning script in 20-postgres.yaml creates each one,
  # gives it its schema, and revokes every privilege PUBLIC would otherwise hold. Give
  # each a DISTINCT value. Six copies of one password are one login wearing six names.
  # Each service Secret below must carry the same value this one sets for it.
  AUTHORIZATION_DB_PASSWORD: "REPLACE-WITH-A-GENERATED-PASSWORD-FOR-AUTHORIZATION"
  LEDGER_DB_PASSWORD: "REPLACE-WITH-A-GENERATED-PASSWORD-FOR-LEDGER"
  FRAUD_DB_PASSWORD: "REPLACE-WITH-A-GENERATED-PASSWORD-FOR-FRAUD"
  NOTIFICATION_DB_PASSWORD: "REPLACE-WITH-A-GENERATED-PASSWORD-FOR-NOTIFICATION"
  ACCOUNT_DB_PASSWORD: "REPLACE-WITH-A-GENERATED-PASSWORD-FOR-ACCOUNT"
  CARD_DB_PASSWORD: "REPLACE-WITH-A-GENERATED-PASSWORD-FOR-CARD"

  # The certificate the server presents and its private key, both in Privacy Enhanced Mail
  # (PEM) form. 30-configmap.yaml asks every client for sslmode=verify-full, so the
  # certificate must be issued by the authority in carddemo-trust-secret below AND carry
  # postgres as a subject alternative name, which is the host name a client resolves:
  #
  #   openssl req -new -nodes -newkey rsa:2048 -keyout server.key -out server.csr \
  #     -subj "/CN=postgres" -addext "subjectAltName=DNS:postgres,DNS:postgres.carddemo"
  #   openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -days 365 \
  #     -copy_extensions copy -out server.crt
  #
  # A certificate without that name fails verify-full with a host name mismatch, which is
  # the control working rather than a broken deployment.
  #
  # These two keys are also the first thing the server reads, ahead of initdb and ahead of
  # the provisioning program's own password refusal. Applied unedited, the placeholder
  # below stops the server with
  #
  #   FATAL: could not load server certificate file "/etc/carddemo/tls/server.crt":
  #   no start line
  #
  # which is OpenSSL saying the file holds no certificate. It is the refusal working; the
  # message just comes from a lower layer than the one that was written for you.
  POSTGRES_TLS_CRT: |
    REPLACE-WITH-THE-SERVER-CERTIFICATE-IN-PEM-FORM
  POSTGRES_TLS_KEY: |
    REPLACE-WITH-THE-SERVER-PRIVATE-KEY-IN-PEM-FORM
---
# Read by the kafka Pod alone. It carries the seven broker identities, because the broker
# is what authenticates them, and the keystore the encrypted listener presents.
#
# The administrator is the only super user and the only identity that creates a topic or an
# access control entry. No service holds it.
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-kafka-secret
  namespace: carddemo
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: card-platform
    app.kubernetes.io/managed-by: kubectl
type: Opaque
# The keystore the encrypted client listener presents, in base64. A PKCS12 archive is
# binary and cannot appear under stringData. Its bytes are not valid UTF-8, and kubectl
# refuses the document with "error converting YAML to JSON: yaml: control characters are
# not allowed". Produce the value with:
#
#   base64 -w0 kafka.p12
#
# or skip the encoding entirely and create the Secret with
# `kubectl create secret generic … --from-file=KAFKA_SSL_KEYSTORE_P12=./kafka.p12`, which
# reads the bytes and encodes them itself. The header of this file carries both routes.
data:
  KAFKA_SSL_KEYSTORE_P12: UkVQTEFDRS1XSVRILVRIRS1CUk9LRVItS0VZU1RPUkUtSU4tQkFTRTY0
stringData:
  KAFKA_ADMIN_PASSWORD: "REPLACE-WITH-A-GENERATED-BROKER-ADMIN-PASSWORD"

  # The six service identities. Each value must equal the KAFKA_SASL_PASSWORD in that
  # service's own Secret below, and must differ from the other five.
  AUTHORIZATION_KAFKA_PASSWORD: "REPLACE-WITH-A-GENERATED-BROKER-PASSWORD-FOR-AUTHORIZATION"
  LEDGER_KAFKA_PASSWORD: "REPLACE-WITH-A-GENERATED-BROKER-PASSWORD-FOR-LEDGER"
  FRAUD_KAFKA_PASSWORD: "REPLACE-WITH-A-GENERATED-BROKER-PASSWORD-FOR-FRAUD"
  NOTIFICATION_KAFKA_PASSWORD: "REPLACE-WITH-A-GENERATED-BROKER-PASSWORD-FOR-NOTIFICATION"
  ACCOUNT_KAFKA_PASSWORD: "REPLACE-WITH-A-GENERATED-BROKER-PASSWORD-FOR-ACCOUNT"
  CARD_KAFKA_PASSWORD: "REPLACE-WITH-A-GENERATED-BROKER-PASSWORD-FOR-CARD"

  # The keystore the encrypted client listener presents, and the password that opens it.
  # Its certificate must carry kafka as a subject alternative name, for the same reason the
  # database certificate must carry postgres:
  #
  #   keytool -genkeypair -alias kafka -keyalg RSA -keysize 2048 -validity 365 \
  #     -storetype PKCS12 -keystore kafka.p12 -dname "CN=kafka" \
  #     -ext "SAN=DNS:kafka,DNS:kafka.carddemo"
  #
  # A self-signed keystore needs its certificate exported into the truststore below. The
  # broker reads that truststore too: 10-kafka.yaml verifies its own listener against it
  # while it starts. A listener with no trust anchor stops the broker before it opens a
  # port. The bytes themselves sit under data above.
  KAFKA_SSL_KEYSTORE_PASSWORD: "REPLACE-WITH-THE-BROKER-KEYSTORE-PASSWORD"
---
# Read by all six services. The three request identities are platform identities, not
# per-service ones: app/csd/CARDDEMO.CSD defines one USRSEC dataset the whole region reads,
# and app/cbl/COSGN00C.cbl:L232-L236 forks on the user type it finds there.
#
# Each value is an ALREADY-ENCODED password carrying its algorithm prefix. A plaintext
# value authenticates nothing, so this platform does not reproduce the plaintext
# comparison at app/cbl/COSGN00C.cbl:L223. A value with no prefix stops
# start-up rather than letting the service run answering 401.
#
# Generate one with the encoder the services themselves use. Two jars, not one: the encoder
# logs through Apache Commons Logging, so a classpath carrying only spring-security-crypto
# stops with ClassNotFoundException: org.apache.commons.logging.LogFactory. Both jars are
# already in the local repository after `mvn -f card-platform/pom.xml package`:
#
#   jshell --class-path "$(find ~/.m2 -name 'spring-security-crypto-*.jar' | head -1):\
#   $(find ~/.m2 -name 'commons-logging-*.jar' | head -1)"
#   jshell> org.springframework.security.crypto.factory.PasswordEncoderFactories \
#             .createDelegatingPasswordEncoder().encode("the password you chose")
#
# Copy the whole result, brace-delimited prefix included. `htpasswd -bnBC 10 "" "the password
# you chose" | cut -d: -f2` produces an equivalent bcrypt payload if the Apache tools are
# nearer to hand; prefix it with {bcrypt} yourself, because a value with no prefix stops
# start-up.
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-identity-secret
  namespace: carddemo
  labels:
    app.kubernetes.io/name: card-platform
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: card-platform
    app.kubernetes.io/managed-by: kubectl
  annotations:
    card-platform/purpose: >-
      The THREE shared request-identity password hashes, read by ALL SIX service
      Deployments: each of 40-45 pulls this whole Secret through
      envFrom.secretRef, so a service starts only once every hash here is a
      real one. Two values are deliberately NOT here. The acquirer verifier sits
      in carddemo-authorization-identity-secret below, which only 40 pulls,
      because only the authorization service verifies a password against it. The
      card-token key sits in carddemo-card-token-secret, which only 40 and 45
      pull, because only those two derive a token. The three hashes below are
      placeholders and no credential appears in this file. Replace all three,
      then apply, as the header of this file describes.
type: Opaque
stringData:
  ADMIN_PASSWORD_HASH: "{bcrypt}REPLACE-THIS-PLACEHOLDER-WITH-A-REAL-BCRYPT-HASH"
  USER_PASSWORD_HASH: "{bcrypt}REPLACE-THIS-PLACEHOLDER-WITH-A-REAL-BCRYPT-HASH"
  MONITORING_PASSWORD_HASH: "{bcrypt}REPLACE-THIS-PLACEHOLDER-WITH-A-REAL-BCRYPT-HASH"
---
# Read by one Deployment and no others: 40-authorization-service.yaml. It holds one value,
# the verifier of the acquirer identity.
#
# ACQUIRER is the machine identity a point-of-sale network presents. It is the one role
# besides ADMIN that reaches POST /authorizations, and no cardholder identity holds it: that
# route names its card in the request body, so no path variable carries an identifier an
# ownership scope could be compared against, and the identity therefore reaches every card
# the platform holds. services/authorization-service/src/main/resources/application.yml is
# the only file on the platform that reads this key.
#
# It is a Secret of its own rather than a fourth key of the shared one above for the reason
# the card-token key is: a bcrypt digest mounted into a service that never verifies a
# password against it is a value an attacker who reaches any one of six containers can take
# away and grind offline at leisure. Widening the blast radius of the strongest identity on
# the platform buys nothing, because five of the six have no code that reads it.
#
# Generate the hash exactly as the header of this file describes, then apply.
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-authorization-identity-secret
  namespace: carddemo
  labels:
    app.kubernetes.io/name: card-platform
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: card-platform
    app.kubernetes.io/managed-by: kubectl
  annotations:
    card-platform/purpose: >-
      The acquirer request-identity password hash, pulled through
      envFrom.secretRef by 40-authorization-service.yaml alone. The value below
      is a placeholder and no credential appears in this file. Replace it, then
      apply.
type: Opaque
stringData:
  ACQUIRER_PASSWORD_HASH: "{bcrypt}REPLACE-THIS-PLACEHOLDER-WITH-A-REAL-BCRYPT-HASH"
---
# Read by two Deployments and no others: 40-authorization-service.yaml and
# 45-card-service.yaml. It holds one value, the key every card token is derived under.
#
# Two services derive a token. The card service derives one for every row it writes, and the
# authorization service derives one for the decision it records. The remaining four read a
# token that arrives in an event or in a request and derive none, so a key mounted into them
# would widen what a compromise of any one of them reaches and buy nothing.
#
# Generate a value for this deployment and only this deployment:
#
#   openssl rand -base64 48 | tr -d '/+='
#
# Both readers refuse to start while this value is absent, blank, still the placeholder,
# shorter than 32 characters, or equal to either card-token key this repository has
# published. Generating one is all that is required: the fifty seeded card_token literals in
# the card service are derived under the build-scope key in card-platform/pom.xml, and
# CardTokenReconciler re-derives every one of them under this key when the card service
# starts. card-platform/docs/suggested-next-tasks.md carries the rotation procedure.
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-card-token-secret
  namespace: carddemo
  labels:
    app.kubernetes.io/name: card-platform
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: card-platform
    app.kubernetes.io/managed-by: kubectl
  annotations:
    card-platform/purpose: >-
      The card-token key, pulled through envFrom.secretRef by
      40-authorization-service.yaml and 45-card-service.yaml alone. The value
      below is a placeholder and no credential appears in this file. Generate
      one, then apply.
type: Opaque
stringData:
  CARD_TOKEN_SECRET: "REPLACE-WITH-A-GENERATED-CARD-TOKEN-KEY-OF-AT-LEAST-32-CHARACTERS"
---
# Read by all six services and the broker. It contains trust material only: no private key.
# One authority and one truststore are shared because copying either six times changes no
# security boundary and multiplies rotation work.
#
# Build both around one authority, so verify-full has something to verify:
#
#   openssl req -x509 -nodes -newkey rsa:4096 -days 3650 -subj "/CN=carddemo-demo-ca" \
#     -keyout ca.key -out ca.crt
#   keytool -importcert -alias carddemo-ca -file ca.crt -storetype PKCS12 \
#     -keystore truststore.p12 -noprompt
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-trust-secret
  namespace: carddemo
  labels:
    app.kubernetes.io/name: card-platform
    app.kubernetes.io/component: transport-security
    app.kubernetes.io/part-of: card-platform
    app.kubernetes.io/managed-by: kubectl
type: Opaque
data:
  truststore.p12: UkVQTEFDRS1XSVRILVRIRS1UUlVTVFNUT1JFLUlOLUJBU0U2NA==
stringData:
  KAFKA_SSL_TRUSTSTORE_PASSWORD: "REPLACE-WITH-THE-TRUSTSTORE-PASSWORD"
  ca.crt: |
    REPLACE-WITH-THE-CERTIFICATE-AUTHORITY-IN-PEM-FORM
---
# One private key per service. For each service name below, issue a certificate from the
# authority above and include every in-cluster spelling a caller can verify:
#
#   service=authorization-service
#   openssl req -new -nodes -newkey rsa:2048 -keyout "${service}.key" \
#     -out "${service}.csr" -subj "/CN=${service}" \
#     -addext "subjectAltName=DNS:${service},DNS:${service}.carddemo,\
# DNS:${service}.carddemo.svc,DNS:${service}.carddemo.svc.cluster.local"
#   openssl x509 -req -in "${service}.csr" -CA ca.crt -CAkey ca.key \
#     -CAcreateserial -days 365 -copy_extensions copy -out "${service}.crt"
#   openssl rand -base64 24 | tr -d '/+=' > "${service}.pass"
#   openssl pkcs12 -export -name "${service}" -inkey "${service}.key" \
#     -in "${service}.crt" -certfile ca.crt -out "${service}.p12" \
#     -passout "file:${service}.pass"
#
# Repeat with service set to ledger-posting-service, fraud-detection-service,
# notification-service, account-service and card-service. Never reuse one resulting
# PKCS12 file in another Secret.
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-authorization-tls-secret
  namespace: carddemo
  labels:
    app.kubernetes.io/name: authorization-service
    app.kubernetes.io/component: transport-security
    app.kubernetes.io/part-of: card-platform
    app.kubernetes.io/managed-by: kubectl
type: Opaque
data:
  keystore.p12: UkVQTEFDRS1XSVRILVRIRS1BVVRIT1JJWkFUSU9OLVNFUlZJQ0UtS0VZU1RPUkUtSU4tQkFTRTY0
stringData:
  SERVER_SSL_KEYSTORE_PASSWORD: "REPLACE-WITH-THE-AUTHORIZATION-KEYSTORE-PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-ledger-tls-secret
  namespace: carddemo
  labels:
    app.kubernetes.io/name: ledger-posting-service
    app.kubernetes.io/component: transport-security
    app.kubernetes.io/part-of: card-platform
    app.kubernetes.io/managed-by: kubectl
type: Opaque
data:
  keystore.p12: UkVQTEFDRS1XSVRILVRIRS1MRURHRVItU0VSVklDRS1LRVlTVE9SRS1JTi1CQVNFNjQ=
stringData:
  SERVER_SSL_KEYSTORE_PASSWORD: "REPLACE-WITH-THE-LEDGER-KEYSTORE-PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-fraud-tls-secret
  namespace: carddemo
  labels:
    app.kubernetes.io/name: fraud-detection-service
    app.kubernetes.io/component: transport-security
    app.kubernetes.io/part-of: card-platform
    app.kubernetes.io/managed-by: kubectl
type: Opaque
data:
  keystore.p12: UkVQTEFDRS1XSVRILVRIRS1GUkFVRC1TRVJWSUNFLUtFWVNUT1JFLUlOLUJBU0U2NA==
stringData:
  SERVER_SSL_KEYSTORE_PASSWORD: "REPLACE-WITH-THE-FRAUD-KEYSTORE-PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-notification-tls-secret
  namespace: carddemo
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: transport-security
    app.kubernetes.io/part-of: card-platform
    app.kubernetes.io/managed-by: kubectl
type: Opaque
data:
  keystore.p12: UkVQTEFDRS1XSVRILVRIRS1OT1RJRklDQVRJT04tU0VSVklDRS1LRVlTVE9SRS1JTi1CQVNFNjQ=
stringData:
  SERVER_SSL_KEYSTORE_PASSWORD: "REPLACE-WITH-THE-NOTIFICATION-KEYSTORE-PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-account-tls-secret
  namespace: carddemo
  labels:
    app.kubernetes.io/name: account-service
    app.kubernetes.io/component: transport-security
    app.kubernetes.io/part-of: card-platform
    app.kubernetes.io/managed-by: kubectl
type: Opaque
data:
  keystore.p12: UkVQTEFDRS1XSVRILVRIRS1BQ0NPVU5ULVNFUlZJQ0UtS0VZU1RPUkUtSU4tQkFTRTY0
stringData:
  SERVER_SSL_KEYSTORE_PASSWORD: "REPLACE-WITH-THE-ACCOUNT-KEYSTORE-PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-card-tls-secret
  namespace: carddemo
  labels:
    app.kubernetes.io/name: card-service
    app.kubernetes.io/component: transport-security
    app.kubernetes.io/part-of: card-platform
    app.kubernetes.io/managed-by: kubectl
