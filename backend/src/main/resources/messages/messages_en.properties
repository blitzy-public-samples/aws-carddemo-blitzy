# PURPOSE:
# --------
# This file provides English locale-specific message variants for Spring Boot's
# MessageSource internationalization (i18n) framework.
# 
# Converted from COBOL copybook: CSMSG01Y.cpy
# Original function: Common message definitions for CardDemo application
# 
# SPRING BOOT MESSAGE RESOLUTION ORDER:
# --------------------------------------
# When resolving messages for English locale (en), Spring Boot MessageSource
# follows this priority:
#   1. messages_en.properties (this file) - English-specific variants
#   2. messages.properties (default)      - Default/fallback messages
# 
# CURRENT IMPLEMENTATION STRATEGY:
# ---------------------------------
# Since all original COBOL messages in CSMSG01Y.cpy are in English, this file
# serves as an explicit English locale marker and allows the default 
# messages.properties file to contain the actual English message text.
# 
# This approach:
# - Keeps all English messages in the default messages.properties (single source)
# - Allows this file to remain minimal (no duplication)
# - Enables future internationalization by adding locale-specific files
#   (e.g., messages_es.properties for Spanish, messages_fr.properties for French)
# - Follows Spring Boot i18n best practices
# 
# FUTURE INTERNATIONALIZATION:
# ----------------------------
# To add support for additional languages:
# 1. Create new locale-specific files (e.g., messages_es.properties)
# 2. Translate messages from messages.properties to the target language
# 3. Spring Boot will automatically resolve messages based on Accept-Language header
# 
# USAGE IN JAVA CODE:
# -------------------
# @Autowired
# private MessageSource messageSource;
# 
# String message = messageSource.getMessage(
#     "message.key", 
#     null, 
#     LocaleContextHolder.getLocale()
# );
# 
# ===================================================================================
# 
# ENGLISH LOCALE-SPECIFIC MESSAGE OVERRIDES:
# -------------------------------------------
# 
# Currently, no English-specific overrides are needed. All English messages
# are defined in the default messages.properties file.
# 
# If specific English variants are needed (e.g., US English vs. UK English
# formatting differences), they can be added below:
# 
# Example:
# message.date.format=MM/dd/yyyy
# message.currency.symbol=$
# 
