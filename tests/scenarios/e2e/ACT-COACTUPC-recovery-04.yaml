# COACTUPC cannot save validated account changes when the REWRITE of the
# account record fails with an I/O error.
#
# Step 1: USER0001 signs on through CC00 and COSGN00C routes the type 'U' user
# to the main menu COMEN01 [app/cbl/COSGN00C.cbl:221-237].
# Step 2: option '2' makes COMEN01C transfer control (XCTL), with CM00 and
# COMEN01C as the caller and CDEMO-PGM-CONTEXT 0, to COACTUPC, the 'Account
# Update' entry of COMEN02Y [app/cbl/COMEN01C.cbl:115-156]
# [app/cpy/COMEN02Y.cpy:31-35]. Entered from the menu without
# CDEMO-PGM-REENTER, COACTUPC initializes the COMMAREA and sends COACTUP from a
# cleared output map with the search-key prompt [app/cbl/COACTUPC.cbl:880-886,
# 964-972,2955-2961].
# Step 3: ENTER with account 00000000001 passes 1210-EDIT-ACCOUNT, and
# 9000-READ-ACCT reads the card cross-reference through CXACAIX (customer
# 000000001), the account from ACCTDAT and the customer from CUSTDAT
# [app/cbl/COACTUPC.cbl:1783-1817,2568-2580,3608-3644]. 3202-SHOW-ORIGINAL-VALUES
# shows the fetched values under 'Update account details presented above.'
# [app/cbl/COACTUPC.cbl:2787-2865]. Every data field is sent with an attribute
# that sets its modified-data tag (DFHBMFSE, or DFHBMPRF for the protected
# ones), so each comes back on the next RECEIVE MAP [app/cbl/COACTUPC.cbl:
# 3441-3561].
# Step 4: ENTER with the FICO score typed over as 720. 1205-COMPARE-OLD-NEW
# finds a change, every field edit of 1200-EDIT-MAP-INPUTS passes and the
# action becomes ACUP-CHANGES-OK-NOT-CONFIRMED; 3203-SHOW-UPDATED-VALUES shows
# the received values under 'Changes validated.Press F5 to save'
# [app/cbl/COACTUPC.cbl:1429-1676,2620-2621,2870-2949,2966-2967].
# Step 5: PF5 is valid while the changes await confirmation. The edits are
# skipped, and 9600-WRITE-PROCESSING reads ACCTDAT and CUSTDAT for update,
# finds both records as fetched in step 3 (9700-CHECK-CHANGE-IN-REC), builds
# both update records and REWRITEs ACCTDAT [app/cbl/COACTUPC.cbl:905-912,
# 1463-1468,2602-2615,3888-4071,4109-4192]. The account REWRITE comes first
# and is unconditional: 9600 rewrites the account and then the customer
# whichever fields changed, so this customer-only change (the FICO score)
# still drives it. The REWRITE answers other than NORMAL, so LOCKED-BUT-
# UPDATE-FAILED is set and the paragraph exits before the customer REWRITE
# [app/cbl/COACTUPC.cbl:4076-4081]. 2000-DECIDE-ACTION turns that into
# ACUP-CHANGES-OKAYED-BUT-FAILED, 3203 shows the entered values again,
# 3250-SETUP-INFOMSG puts INFORM-FAILURE in INFOMSG and the return message in
# ERRMSG [app/cbl/COACTUPC.cbl:523-524,2609-2610,2718-2720,2973-2981]. Nothing
# was rewritten, so ACCTDAT and CUSTDAT keep their records. Only an I/O error on
# the REWRITE reaches this branch: a closed or disabled ACCTDAT fails the READ
# UPDATE first and gives 'Could not lock account record for update' instead
# [app/cbl/COACTUPC.cbl:3907-3915].
#
# No adapter can inject an online I/O error, so the scenario raises
# MissingPrerequisite under GAP-MIS-014 and stays implemented-unexecuted until a
# mechanism exists. Expected values are derived from the source (no TPE region
# runs in CI).
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit: the repository record has FICO 274 and zip 12546 under state NC, which
# would stop step 4 at an edit message. 919 is a general-purpose area code and
# NC27 a valid state/zip pair [app/cpy/CSLKPCDY.cpy:521,895,1046,1186]. Account
# 00000000001 is the repository record; its ACCT-GROUP-ID is blank and its
# group id sits in ACCT-ADDR-ZIP (GAP-DEF-005). A successful REWRITE would
# overwrite ACCT-ADDR-ZIP, because ACCT-UPDATE-RECORD has no zip field and
# places the group id at its offset [app/cbl/COACTUPC.cbl:418-433]
# [app/cpy/CVACT01Y.cpy:4-16], so the unchanged A000000000 shows that no
# rewrite took place.
#
# Screen values are whole fields at their BMS length, trailing spaces kept:
# amounts are S9(10)V99 values edited by PIC +ZZZ,ZZZ,ZZZ.99, ACSZIPC shows
# the first 5 of the 10 zip characters, and the phone parts are positions
# 2-4, 6-8 and 10-13 of the stored (999)999-9999 text. AADDGRP is sent as
# spaces in step 3 and as LOW-VALUES in steps 4 and 5 (a blank field is
# received as LOW-VALUES), and shows blank either way; a dark (DRK) key label
# reads as spaces. CURDATE and CURTIME come from the run clock, hence the
# matchers and clock_mode relative.
id: ACT-COACTUPC-recovery-04
level: e2e
type: recovery
description: >-
  USER0001 signs on, selects main-menu option 2 (Account Update), fetches
  account 00000000001 and its invented customer 000000001 on the COACTUP
  screen, changes the FICO score from 700 to 720, gets the changes validated
  and presses PF5 while the REWRITE of the ACCTDAT account record fails with an
  I/O error. COACTUPC shows 'Update of record failed' with 'Changes
  unsuccessful. Please try again' on the same screen, the entered values kept,
  and neither the account nor the customer record is changed.
# Primary item first, then the program, the maps asserted, the transaction
# steps 2 to 5 run under, the CSD files COACTUPC reads and updates, and the
# online-only copybooks it copies. Sign-on and the menu (CC00, CM00, COSGN00,
# USRSEC) are verified by the SEC and MNU scenarios; the batch record copybooks
# and the data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-054  # COACTUPC message 'Update of record failed' (recovery)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the prompt, detail, confirmation and failure screens
- INV-CFG-009  # CAUP transaction, under which the fetch, the edit and the failing save run
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account read, read for update, and the failing REWRITE
- INV-CFG-005  # CUSTDAT CSD file: customer read and read for update
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code, state and state/zip lookups of the edits
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the field-attribute settings of 3300
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER and PF5 paths
- INV-LAY-013  # CSUTLDPY: the date edits of step 4
- INV-LAY-014  # CSUTLDWY: the date-edit work areas
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-MIS-014  # no mechanism to return an I/O error from a region file operation
# GAP-DOC-025: the UniKix copy of COACTUP.bms drops the unnamed field at row 1,
# columns 1-9, beside the asserted TRNNAME, so a UniKix run of this scenario
# never verifies the COACTUP map item while that entry is open.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # The 10 repository users, for the USER0001 sign-on.
    USRSEC: {base: USRSEC}
    # Customer 000000001 of account 00000000001 replaced by invented values;
    # the other 49 customers are the repository records.
    CUSTDATA:
      base: CUSTDATA
      records:
      - CUST-ID: '1'
        CUST-FIRST-NAME: Testfirst
        CUST-MIDDLE-NAME: Testmiddle
        CUST-LAST-NAME: Testlast
        CUST-ADDR-LINE-1: 100 Test Street
        CUST-ADDR-LINE-2: Suite 1
        CUST-ADDR-LINE-3: Raleigh
        CUST-ADDR-STATE-CD: NC
        CUST-ADDR-COUNTRY-CD: USA
        CUST-ADDR-ZIP: '27601'
        CUST-PHONE-NUM-1: (919)555-0101
        CUST-PHONE-NUM-2: (919)555-0102
        CUST-SSN: '123456789'
        CUST-GOVT-ISSUED-ID: TESTGOVT0001
        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: 'Y'
        CUST-FICO-CREDIT-SCORE: '700'
  parameters:
    clock_mode: relative
  # No `after`: the REWRITE of step 5 is the only ACCTDAT rewrite of the
  # scenario, and the reads before it, the READ UPDATE included, succeed.
  faults:
  - target: ACCTDAT
    operation: rewrite
    condition: io-error
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: USER0001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '2'}
    '@map': COMEN01
  - aid: ENTER
    fields: {ACCTSID: '00000000001'}
    '@map': COACTUP
  - aid: ENTER
    fields: {ACSTFCO: '720'}
    '@map': COACTUP
  - aid: PF5
    fields: {}
    '@map': COACTUP
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    OPTN002: '02. Account Update                      '
    ERRMSG: '                                                                              '
  - '@map': COACTUP
    TRNNAME: CAUP
    PGMNAME: COACTUPC
    ACCTSID: '           '
    INFOMSG: 'Enter or update id of account to update      '
    ERRMSG: '                                                                              '
  # The fetched account and customer.
  - '@map': COACTUP
    TRNNAME: CAUP
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COACTUPC
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ACCTSID: '00000000001'
    ACSTTUS: 'Y'
    OPNYEAR: '2014'
    OPNMON: '11'
    OPNDAY: '20'
    ACRDLIM: '+      2,020.00'
    EXPYEAR: '2025'
    EXPMON: '05'
    EXPDAY: '20'
    ACSHLIM: '+      1,020.00'
    RISYEAR: '2025'
    RISMON: '05'
    RISDAY: '20'
    ACURBAL: '+        194.00'
    ACRCYCR: '+           .00'
    AADDGRP: '          '
    ACRCYDB: '+           .00'
    ACSTNUM: '000000001'
    ACTSSN1: '123'
    ACTSSN2: '45'
    ACTSSN3: '6789'
    DOBYEAR: '1961'
    DOBMON: '06'
    DOBDAY: '08'
    ACSTFCO: '700'
    ACSFNAM: 'Testfirst                '
    ACSMNAM: 'Testmiddle               '
    ACSLNAM: 'Testlast                 '
    ACSADL1: '100 Test Street                                   '
    ACSSTTE: 'NC'
    ACSADL2: 'Suite 1                                           '
    ACSZIPC: '27601'
    ACSCITY: 'Raleigh                                           '
    ACSCTRY: 'USA'
    ACSPH1A: '919'
    ACSPH1B: '555'
    ACSPH1C: '0101'
    ACSGOVT: 'TESTGOVT0001        '
    ACSPH2A: '919'
    ACSPH2B: '555'
    ACSPH2C: '0102'
    ACSEFTC: '0053581756'
    ACSPFLG: 'Y'
    INFOMSG: 'Update account details presented above.      '
    ERRMSG: '                                                                              '
  # The change passes every edit and waits for PF5.
  - '@map': COACTUP
    TRNNAME: CAUP
    PGMNAME: COACTUPC
    ACCTSID: '00000000001'
    ACSTFCO: '720'
    INFOMSG: 'Changes validated.Press F5 to save           '
    ERRMSG: '                                                                              '
    # PROMPT-FOR-CONFIRMATION shows both keys bright [app/cbl/COACTUPC.cbl:3573-3581].
    FKEYS: 'ENTER=Process F3=Exit'
    FKEY05: 'F5=Save'
    FKEY12: 'F12=Cancel'
  # The failed save: the values received with PF5 are shown again, FICO 720
  # included, under the failure messages.
  - '@map': COACTUP
    TRNNAME: CAUP
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: COACTUPC
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ACCTSID: '00000000001'
    ACSTTUS: 'Y'
    OPNYEAR: '2014'
    OPNMON: '11'
    OPNDAY: '20'
    ACRDLIM: '+      2,020.00'
    EXPYEAR: '2025'
    EXPMON: '05'
    EXPDAY: '20'
    ACSHLIM: '+      1,020.00'
    RISYEAR: '2025'
    RISMON: '05'
    RISDAY: '20'
    ACURBAL: '+        194.00'
    ACRCYCR: '+           .00'
    AADDGRP: '          '
    ACRCYDB: '+           .00'
    ACSTNUM: '000000001'
    ACTSSN1: '123'
    ACTSSN2: '45'
    ACTSSN3: '6789'
    DOBYEAR: '1961'
    DOBMON: '06'
    DOBDAY: '08'
    ACSTFCO: '720'
    ACSFNAM: 'Testfirst                '
    ACSMNAM: 'Testmiddle               '
    ACSLNAM: 'Testlast                 '
    ACSADL1: '100 Test Street                                   '
    ACSSTTE: 'NC'
    ACSADL2: 'Suite 1                                           '
    ACSZIPC: '27601'
    ACSCITY: 'Raleigh                                           '
    ACSCTRY: 'USA'
    ACSPH1A: '919'
