# Credential templates for a demo cluster. TEN Secrets, and the split between them is the
# point of the file rather than an accident of grouping.
#
# One shared database login used to serve all six services. A login is a boundary only
# when it belongs to one service: with one login, a compromise of any service could
# connect to and alter every other service's card, customer, balance, fraud and event
# data, and the private schema each service claims to own was a convention rather than a
# control. Each service now reads exactly two credentials of its own, from a Secret named
# after it, and reads no other service's Secret.
#
# What is deliberately still shared, and why:
#
#   carddemo-identity-secret   The three request-identity password hashes. The source
#                              keeps its signon identities in one dataset the whole region
#                              reads, defined once in app/csd/CARDDEMO.CSD, so a
#                              platform-wide identity store is the faithful shape here.
#   carddemo-tls-secret        Keystore, truststore and certificate authority. The
#                              material is platform material: a per-service copy of one
#                              certificate authority is six copies of one file.
#
# THIS FILE IS NOT APPLYABLE AS IT STANDS, and that is deliberate. Every value below
# carries the literal REPLACE marker, so nothing here is a credential. Applying it
# unedited creates Secrets whose values every service refuses at start-up: the guard in
# each config/SecurityConfig checks its database password, its broker credential and its
# keystore password as the context refreshes and stops the service before it binds a port,
# and each identity hash is checked as its identity is mapped. A service that started with
# a placeholder would answer every request with 401 and read as misconfigured rather than
# as insecure, which is the failure those refusals replace.
#
# Generate a password:      openssl rand -base64 24 | tr -d '/+='
# Generate a hash:          the identity Secret below carries the command.
# Generate TLS material:    the TLS Secret below carries the commands.
#
# The tr strips three characters no password here may carry: the broker builds a login
# entry around its password, and a quote, a backslash or whitespace would end the entry
# early, so the broker refuses such a value rather than authenticating as something else.
#
# The decision log this platform still owes is to record why the split falls here.
---
# Read by the postgres Pod alone. It carries the superuser password, the six per-service
# login passwords the provisioning program sets, and the certificate the server presents.
#
# No service reads this Secret. A service reads only its own password, from its own
# Secret, and the provisioning program is what puts the two in agreement.
apiVersion: v1
kind: Secret
# The name deliberately differs from the carddemo-secret every workload reads.
# Renaming this object to carddemo-secret is what turns the template into the
# real Secret, and doing that means first replacing all four values below.
metadata:
  name: carddemo-postgres-secret
  namespace: carddemo
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: card-platform
    app.kubernetes.io/managed-by: kubectl
type: Opaque
# stringData takes plain text. Kubernetes encodes each value on apply.
#
# Both password keys ship as the placeholder <SET_LOCALLY>. This file publishes
# no usable password. Replace the placeholder in a copy of this file, or delete
# both password keys and point the Deployments at an external secret store.
stringData:
  # The superuser. It provisions the six logins and the six schemas, and NO service signs
  # on as it.
  POSTGRES_USER: "carddemo"
  POSTGRES_PASSWORD: "REPLACE-WITH-A-GENERATED-SUPERUSER-PASSWORD"

  # One login per service. The provisioning program in 20-postgres.yaml creates each one,
  # gives it its schema, and revokes every privilege PUBLIC would otherwise hold. Give
  # each a DISTINCT value: six copies of one password are one login wearing six names, and
  # each service Secret below must carry the same value this one sets for it.
  AUTHORIZATION_DB_PASSWORD: "REPLACE-WITH-A-GENERATED-PASSWORD-FOR-AUTHORIZATION"
  LEDGER_DB_PASSWORD: "REPLACE-WITH-A-GENERATED-PASSWORD-FOR-LEDGER"
  FRAUD_DB_PASSWORD: "REPLACE-WITH-A-GENERATED-PASSWORD-FOR-FRAUD"
  NOTIFICATION_DB_PASSWORD: "REPLACE-WITH-A-GENERATED-PASSWORD-FOR-NOTIFICATION"
  ACCOUNT_DB_PASSWORD: "REPLACE-WITH-A-GENERATED-PASSWORD-FOR-ACCOUNT"
  CARD_DB_PASSWORD: "REPLACE-WITH-A-GENERATED-PASSWORD-FOR-CARD"

  # The certificate the server presents and its private key, both in Privacy Enhanced Mail
  # (PEM) form. 30-configmap.yaml asks every client for sslmode=verify-full, so the
  # certificate must be issued by the authority in carddemo-tls-secret below AND carry
  # postgres as a subject alternative name, which is the host name a client resolves:
  #
  #   openssl req -new -nodes -newkey rsa:2048 -keyout server.key -out server.csr \
  #     -subj "/CN=postgres" -addext "subjectAltName=DNS:postgres,DNS:postgres.carddemo"
  #   openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -days 365 \
  #     -copy_extensions copy -out server.crt
  #
  # A certificate without that name fails verify-full with a host name mismatch, which is
  # the control working rather than a broken deployment.
  POSTGRES_TLS_CRT: |
    REPLACE-WITH-THE-SERVER-CERTIFICATE-IN-PEM-FORM
  POSTGRES_TLS_KEY: |
    REPLACE-WITH-THE-SERVER-PRIVATE-KEY-IN-PEM-FORM
---
# Read by the kafka Pod alone. It carries the seven broker identities, because the broker
# is what authenticates them, and the keystore the encrypted listener presents.
#
# The administrator is the only super user and the only identity that creates a topic or an
# access control entry. No service holds it.
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-kafka-secret
  namespace: carddemo
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: card-platform
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  KAFKA_ADMIN_PASSWORD: "REPLACE-WITH-A-GENERATED-BROKER-ADMIN-PASSWORD"

  # The six service identities. Each value must equal the KAFKA_SASL_PASSWORD in that
  # service's own Secret below, and must differ from the other five.
  AUTHORIZATION_KAFKA_PASSWORD: "REPLACE-WITH-A-GENERATED-BROKER-PASSWORD-FOR-AUTHORIZATION"
  LEDGER_KAFKA_PASSWORD: "REPLACE-WITH-A-GENERATED-BROKER-PASSWORD-FOR-LEDGER"
  FRAUD_KAFKA_PASSWORD: "REPLACE-WITH-A-GENERATED-BROKER-PASSWORD-FOR-FRAUD"
  NOTIFICATION_KAFKA_PASSWORD: "REPLACE-WITH-A-GENERATED-BROKER-PASSWORD-FOR-NOTIFICATION"
  ACCOUNT_KAFKA_PASSWORD: "REPLACE-WITH-A-GENERATED-BROKER-PASSWORD-FOR-ACCOUNT"
  CARD_KAFKA_PASSWORD: "REPLACE-WITH-A-GENERATED-BROKER-PASSWORD-FOR-CARD"

  # The keystore the encrypted client listener presents, and the password that opens it.
  # Its certificate must carry kafka as a subject alternative name, for the same reason the
  # database certificate must carry postgres:
  #
  #   keytool -genkeypair -alias kafka -keyalg RSA -keysize 2048 -validity 365 \
  #     -storetype PKCS12 -keystore kafka.p12 -dname "CN=kafka" \
  #     -ext "SAN=DNS:kafka,DNS:kafka.carddemo"
  #
  # A self-signed keystore needs its certificate exported into the truststore below.
  KAFKA_SSL_KEYSTORE_PASSWORD: "REPLACE-WITH-THE-BROKER-KEYSTORE-PASSWORD"
  KAFKA_SSL_KEYSTORE_P12: |
    REPLACE-WITH-THE-BROKER-KEYSTORE-IN-PKCS12-FORM
---
# Read by all six services. The three request identities are platform identities, not
# per-service ones: app/csd/CARDDEMO.CSD defines one USRSEC dataset the whole region reads,
# and app/cbl/COSGN00C.cbl:L232-L236 forks on the user type it finds there.
#
# Each value is an ALREADY-ENCODED password carrying its algorithm prefix. A plaintext
# value authenticates nothing, which is how this platform declines to reproduce the
# plaintext comparison at app/cbl/COSGN00C.cbl:L223, and a value with no prefix stops
# start-up rather than letting the service run answering 401.
#
# Generate one with the encoder the services themselves use:
#
#   jshell --class-path "$(find ~/.m2 -name 'spring-security-crypto-*.jar' | head -1)"
#   jshell> org.springframework.security.crypto.factory.PasswordEncoderFactories \
#             .createDelegatingPasswordEncoder().encode("the password you chose")
#
# Copy the whole result, brace-delimited prefix included.
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-identity-secret
  namespace: carddemo
  labels:
    app.kubernetes.io/name: card-platform
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: card-platform
    app.kubernetes.io/managed-by: kubectl
  annotations:
    card-platform/purpose: >-
      Key-name template only. Carries no credential and is consumed by no
      workload. See the header of this file for the two ways to create the real
      carddemo-secret.
type: Opaque
stringData:
  ADMIN_PASSWORD_HASH: "{bcrypt}REPLACE-THIS-PLACEHOLDER-WITH-A-REAL-BCRYPT-HASH"
  USER_PASSWORD_HASH: "{bcrypt}REPLACE-THIS-PLACEHOLDER-WITH-A-REAL-BCRYPT-HASH"
  MONITORING_PASSWORD_HASH: "{bcrypt}REPLACE-THIS-PLACEHOLDER-WITH-A-REAL-BCRYPT-HASH"
---
# Read by all six services, and mounted as files rather than as environment values because
# a keystore is a file. Shared on purpose: one certificate authority copied six times is
# one certificate authority, and six copies rotate six times.
#
# Three pieces of material, three uses:
#
#   keystore.p12    the certificate each service presents on its own two ports
#   truststore.p12  what a service trusts: the broker's certificate, and the authority
#   ca.crt          what the database driver verifies the server against under verify-full
#
# Build all three around one authority, so verify-full has something to verify:
#
#   openssl req -x509 -nodes -newkey rsa:4096 -days 3650 -subj "/CN=carddemo-demo-ca" \
#     -keyout ca.key -out ca.crt
#   keytool -importcert -alias carddemo-ca -file ca.crt -storetype PKCS12 \
#     -keystore truststore.p12 -noprompt
#
# The service certificate inside keystore.p12 must carry the Service name of the service
# that presents it as a subject alternative name, because 30-configmap.yaml reaches
# account-service and card-service by name over Transport Layer Security.
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-tls-secret
  namespace: carddemo
  labels:
    app.kubernetes.io/name: card-platform
    app.kubernetes.io/component: transport-security
    app.kubernetes.io/part-of: card-platform
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  SERVER_SSL_KEYSTORE_PASSWORD: "REPLACE-WITH-THE-SERVICE-KEYSTORE-PASSWORD"
  KAFKA_SSL_TRUSTSTORE_PASSWORD: "REPLACE-WITH-THE-TRUSTSTORE-PASSWORD"
  keystore.p12: |
    REPLACE-WITH-THE-SERVICE-KEYSTORE-IN-PKCS12-FORM
  truststore.p12: |
    REPLACE-WITH-THE-TRUSTSTORE-IN-PKCS12-FORM
  ca.crt: |
    REPLACE-WITH-THE-CERTIFICATE-AUTHORITY-IN-PEM-FORM
---
# One Secret per service, from here to the end of the file. Each carries exactly the two
# credentials that must not be shared: the password of its own database login and the
# password of its own broker identity. Two keys, one service, and the same key names in all
# six, so a Deployment reads its own Secret with envFrom and names nothing.
#
# Each value must equal what carddemo-postgres-secret and carddemo-kafka-secret set for
# that service, and must differ from every other service's.
#
# Only 40-authorization-service.yaml exists so far. The other five Secrets are declared
# here because the ConfigMap already carries the configuration of all six, and a Secret
# that arrives with its Deployment arrives late.
apiVersion: v1
kind: Secret
metadata:
  name: carddemo-authorization-secret
  namespace: carddemo
  labels:
    app.kubernetes.io/name: authorization-service
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: card-platform
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "REPLACE-WITH-A-GENERATED-PASSWORD-FOR-AUTHORIZATION"
  KAFKA_SASL_PASSWORD: "REPLACE-WITH-A-GENERATED-BROKER-PASSWORD-FOR-AUTHORIZATION"
---
