# COACTUPC refuses an account update whose Open Date year is not a 4-digit
# number: ENTER shows 'Open Date must be 4 digit number.' and nothing is saved.
#
# Steps 1-3 reach the fetched account as ACT-COACTUPC-alternate-04 does:
# USER0001 signs on, main-menu option 2 XCTLs to COACTUPC, and ENTER with
# account 00000000001 reads CXACAIX (card 9680294154603697, customer
# 000000001), ACCTDAT and CUSTDAT, shows the details with 'Update account
# details presented above.' and leaves every editable field unprotected with
# MDT on, so all of them come back on the next AID [app/cbl/COACTUPC.cbl:
# 2568-2580,2787-2865,3500-3561,3608-3884].
# Step 4 types 20A4 over the open year (OPNYEAR, 4 bytes) and presses ENTER.
# 1100-RECEIVE-MAP moves it to ACUP-NEW-OPEN-YEAR [app/cbl/COACTUPC.cbl:
# 1144-1149]; 1205-COMPARE-OLD-NEW finds the open date changed, so
# 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs the edits in field
# order [app/cbl/COACTUPC.cbl:1460-1482,1681-1705]:
# - Account Status Y passes 1220-EDIT-YESNO.
# - Open Date 20A41120 goes through EDIT-DATE-CCYYMMDD. In EDIT-YEAR-CCYY the
#   year is neither blank nor NUMERIC, so INPUT-ERROR and FLG-YEAR-NOT-OK are
#   set and, the message being still off, STRING composes FUNCTION
#   TRIM('Open Date') and ' must be 4 digit number.' into WS-RETURN-MSG
#   [app/cpy/CSUTLDPY.cpy:25-61]. The year check is an IS NUMERIC class test,
#   not TEST-NUMVAL; the letter A fails it.
# - The month (11) and day (20) pass; EDIT-DAY-MONTH-YEAR finds the date flags
#   not valid and leaves the copybook, so CSUTLDTC is not called
#   [app/cpy/CSUTLDPY.cpy:91-279].
# - Every later edit runs on the values that came back, which pass as in
#   ACT-COACTUPC-alternate-04; none could change the message, because each
#   composes only while WS-RETURN-MSG-OFF holds [app/cbl/COACTUPC.cbl:
#   1484-1675].
# 2000-DECIDE-ACTION continues on ACUP-CHANGES-NOT-OK, so 9600-WRITE-PROCESSING
# does not run [app/cbl/COACTUPC.cbl:2596-2597]. 3203-SHOW-UPDATED-VALUES
# shows the received values, the valid amounts re-edited through
# +ZZZ,ZZZ,ZZZ.99, and OPNYEAR as typed; 3250 sets PROMPT-FOR-CHANGES and
# moves the message to ERRMSG; 3300 leaves the fields editable, puts the
# cursor on OPNYEAR and colours it red; 3390 makes F12=Cancel bright because
# a change was made, while F5=Save stays dark [app/cbl/COACTUPC.cbl:2718-2720,
# 2870-2982,2997-3023,3214-3217,3566-3581] [app/cpy/CSSETATY.cpy:18-27].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - 'Open Date must be 4 digit number.' is 33 characters of the 75-byte
#   WS-RETURN-MSG, shown in the 78-byte ERRMSGO padded with spaces. Screen
#   fields are compared at their full BMS length, trailing spaces kept.
# - INFOMSG is the 40-byte WS-INFO-MSG in the 45-byte INFOMSGO. FKEY05 keeps
#   its dark INITIAL text, which the s3270 capture renders as blanks.
# - The red colour and the cursor position are not in the text capture, so
#   the refused field shows as OPNYEAR still holding 20A4 beside the message.
# - The tpe adapter enters a field with EraseEOF before typing; 20A4 fills
#   OPNYEAR. No upper-case translation of input is assumed: CARDDEMO.CSD
#   defines none for CAUP (PROFILE DFHCICST).
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, as in the other COACTUPC field-edit scenarios, so that only the open
# year is refused: the repository record has FICO 274 and zip 12546, which a
# change would have refused first [app/cbl/COACTUPC.cbl:2514-2558].
id: ACT-COACTUPC-negative-013
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001 and its customer 000000001, types 20A4 over the open
  year and presses ENTER. COACTUPC refuses the change with 'Open Date must be
  4 digit number.', keeps the entered values on the editable screen with
  'Update account details presented above.' and F12=Cancel shown, and
  rewrites nothing: ACCTDATA and CUSTDATA still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-071  # COACTUPC Open Date: year a 4-digit number (EDIT-YEAR-CCYY)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the per-field error attributes
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-YEAR-CCYY, the refusing edit
- INV-LAY-014  # CSUTLDWY: WS-EDIT-DATE-CCYY and the date flags
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY drops TRIM from the field name, so the deployed copy
# would show 'Open Date' padded to the 25-byte WS-EDIT-VARIABLE-NAME before
# ' must be 4 digit number.'.
- GAP-DOC-024
# Not in the planned gap list; cited because this scenario asserts what they
# change, as ACT-COACTUPC-alternate-04 does. The UniKix COACTUPC comments out
# the TEST-NUMVAL-C amount checks behind the re-edited amounts of screen 4,
# and the UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME
# stands.
- GAP-DOC-022
- GAP-DOC-025
