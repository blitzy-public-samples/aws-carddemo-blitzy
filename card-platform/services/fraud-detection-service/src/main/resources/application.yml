# card-platform fraud-detection-service — runtime contract for one container.
#
# Every value that changes between environments reads an environment variable
# and falls back to the default card-platform/.env.example documents, so this
# service starts with no .env file present. docker-compose.yml overrides what
# it injects.
#
# This service is net new: no COBOL program in app/cbl/ is an ancestor.
#
# Rationale for every value here: card-platform/docs/decision-log.md

server:
  # The container listens on 8080, and docker-compose.yml publishes a host port
  # onto it.
  port: 8080

  # Transport Layer Security for the Representational State Transfer surface, off in the
  # shipped file and on in the cluster. The compose stack runs every service on one
  # Docker bridge on one machine and publishes each port on the loopback address alone.
  # A cluster pod network is a shared path, so deploy/k8s/30-configmap.yaml sets
  # SERVER_SSL_ENABLED to true and names the keystore deploy/k8s/31-secret.example.yaml
  # templates.
  #
  # Every value below carries a default, and the keystore password defaults to empty
  # rather than absent. Enabling the first key without the other three is what fails,
  # loudly, at start-up.
  ssl:
    enabled: "${SERVER_SSL_ENABLED:false}"
    key-store: "${SERVER_SSL_KEYSTORE:}"
    key-store-type: "${SERVER_SSL_KEYSTORE_TYPE:PKCS12}"
    key-store-password: "${SERVER_SSL_KEYSTORE_PASSWORD:}"

spring:

  application:
    name: fraud-detection-service

  datasource:
    # sslmode=require encrypts this connection and stops the driver from falling back to
    # cleartext. It does not verify the certificate, since a direct run has no
    # certificate authority to verify against. The compose stack overrides this whole URL
    # with the same mode, against a server presenting a certificate it generated for
    # itself. deploy/k8s/30-configmap.yaml overrides it with verify-full, because a
    # cluster has an authority.
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${FRAUD_DB_NAME:carddemo_fraud}?currentSchema=${FRAUD_DB_SCHEMA:fraud_service}&sslmode=require}"
    # This service's own login, which owns one database on the compose path and one schema on
    # the cluster path. The superuser is not the default here. A login name is not a
    # credential and carries a default; the password below carries none.
    username: "${SPRING_DATASOURCE_USERNAME:${FRAUD_DB_USER:carddemo_fraud_svc}}"
    # No fallback. An unset password stops start-up. docker-compose.yml sets
    # SPRING_DATASOURCE_PASSWORD; a direct run sets POSTGRES_PASSWORD.
    password: "${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}"
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: "${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:3000}"
      validation-timeout: "${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:2000}"
      # Sized for the work that holds a connection at once, rather than left at the pool
      # default of ten: three listener threads, from one listener at the concurrency below;
      # the relay pass; the retention sweep; and five for the read-only assessment routes. A
      # request that finds no free connection waits out connection-timeout above and is then
      # refused, so the pool is deliberately smaller than
      # carddemo.api.rate-limit.concurrent-requests and requests queue on it under a burst.
      maximum-pool-size: "${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}"
      # The pool keeps as many idle connections as its maximum unless told otherwise, so the
      # six services would hold their whole maxima open against a server admitting one
      # hundred while nothing was happening. Connections above this floor are opened when
      # they are asked for and closed again when they fall idle.
      minimum-idle: "${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:4}"

  # Flyway creates the schema named below, then applies the Data Definition
  # Language (DDL) migrations under db/migration.
  flyway:
    enabled: true
    create-schemas: true
    schemas: "${SPRING_FLYWAY_SCHEMAS:${FRAUD_DB_SCHEMA:fraud_service}}"
    default-schema: "${SPRING_FLYWAY_DEFAULT_SCHEMA:${FRAUD_DB_SCHEMA:fraud_service}}"
    baseline-on-migrate: false
    validate-on-migrate: true

  # Jakarta Persistence. Hibernate checks its mapping against the migrated
  # schema at start-up and writes no schema object.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: "${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:${FRAUD_DB_SCHEMA:fraud_service}}"

  # kafka:29092 is the internal listener docker-compose.yml publishes, which is the one
  # context a shipped default can be correct in. deploy/k8s/30-configmap.yaml overrides it
  # to kafka:9092, and a run straight on the host sets KAFKA_BOOTSTRAP_SERVERS to
  # localhost:9092. The other five services carry the same default.
  kafka:
    bootstrap-servers: "${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}}"
    admin:
      operation-timeout: "${SPRING_KAFKA_ADMIN_OPERATION_TIMEOUT:3s}"

    # Broker authentication. The broker requires a Simple Authentication and Security
    # Layer (SASL) identity on every client listener, and its authorizer refuses any
    # operation no access control entry allows. This service therefore reaches exactly
    # the topics and the consumer group its own configuration names.
    # docker-compose.yml installs that matrix at broker start and
    # deploy/k8s/10-kafka.yaml installs the same one.
    #
    # SASL_PLAINTEXT authenticates without encrypting, and is the shipped default the
    # compose stack runs. The broker publishes on the loopback address alone, and every
    # service reaches it across one Docker bridge on one machine.
    # deploy/k8s/30-configmap.yaml sets SASL_SSL instead, because a cluster pod network
    # is a shared path, and supplies the truststore by environment as
    # SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION and _PASSWORD. Those two keys are
    # absent here.
    security:
      protocol: "${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}"
    properties:
      sasl.mechanism: "${KAFKA_SASL_MECHANISM:PLAIN}"
      # A username is not a credential and carries a default. The password carries none,
      # so an unset variable stops start-up rather than presenting a password this
      # repository publishes. card-platform/.env.example documents both.
      sasl.jaas.config: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_SASL_USERNAME:carddemo-fraud}"
        password="${KAFKA_SASL_PASSWORD}";

    # Idempotent production, acknowledged by every in-sync replica. The key serializer
    # takes the account identifier as text, and XREF-ACCT-ID PIC 9(11) at
    # app/cpy/CVACT03Y.cpy:L7 carries eleven digits with leading zeros.
    #
    # config/KafkaProducerConfig.java builds the factory this service publishes through
    # and pins the broker address, acks, idempotence and one topic per event type on it.
    # The value serializer it installs is JsonSchemaValidatingSerializer, which takes an
    # event record rather than the text named below, so the key named below applies only
    # to a template built from these keys alone.
    # Why fraud validates on publish while the other services publish text:
    # card-platform/docs/decision-log.md.
    #
    # The four timeouts below are one budget, and outbox/OutboxRelay is why. A relay tick bounds
    # itself with carddemo.outbox.relay.max-duration-ms so a broker that accepts a connection and
    # never answers cannot hold the scheduled thread. That value bounds the whole tick, and a send
    # the tick has issued waits only for the budget the tick has left. A send abandoned that way may
    # still be delivered, and the next tick offers the row again, so a second copy can reach the
    # topic; each consumer's processed-event marker is what makes that harmless. Keeping the producer
    # window inside the tick budget is what keeps that path rare: the producer takes at most
    # max.block.ms + delivery.timeout.ms to resolve one send, and that sum must stay below
    # max-duration-ms. 2000 + 2000 = 4000 against 5000. A test asserts the relationship, so raising
    # one value without the other fails the build. delivery.timeout.ms must also be at least
    # linger.ms + request.timeout.ms, which is why linger.ms is declared here rather than inherited.
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 2000
        request.timeout.ms: 2000
        linger.ms: 0
        max.block.ms: 2000

    # messaging/TransactionAuthorizedConsumer reads one topic under a consumer group of
    # this service's own, with automatic commit off. It scores outside the authorization
    # response path and calls no other service.
    consumer:
      group-id: "${SPRING_KAFKA_CONSUMER_GROUP_ID:${GROUP_FRAUD_DETECTION:fraud-detection}}"
      enable-auto-commit: false
      auto-offset-reset: "${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}"
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # The delegate below is the deserializer com.carddemo:event-contracts
      # ships, so a payload is validated on consume against the same document it
      # was validated against on publish. ErrorHandlingDeserializer keeps a refused
      # payload from killing the container; the container raises it before the
      # listener runs, and config/KafkaConsumerConfig.java counts it and routes it
      # to the dead-letter topic.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: com.carddemo.events.serde.JsonSchemaValidatingDeserializer
        max.poll.interval.ms: 300000

    # The listener acknowledges once its own writes commit, and manual_immediate
    # commits the offset at that acknowledgement.
    listener:
      ack-mode: manual_immediate
      # One consumer thread per partition of the topic this service reads. Every topic of this
      # platform ships three partitions, from KAFKA_TOPIC_PARTITIONS in
      # card-platform/.env.example, and the group assignor gives one partition to exactly one
      # thread. Velocity counting depends on the events of one account arriving in order, and
      # that still holds: the account identifier is the message key, so one account's events
      # occupy one partition and one thread. This value was one, which scored every partition
      # of the topic in sequence. config/KafkaConsumerConfig applies it to the factory it
      # builds. A value above the partition count only leaves the surplus threads with
      # nothing assigned.
      concurrency: "${SPRING_KAFKA_LISTENER_CONCURRENCY:3}"

  # The scheduler behind both @Scheduled methods of this service, outbox/OutboxRelay and
  # domain/RetentionSweep. The framework's pool holds one thread, so the hourly sweep — three
  # tables, each bounded at thirty seconds — delayed every relay pass that fell inside it,
  # and a relay pass is due every 500 ms. A thread for each task removes that wait.
  # Fixed-delay scheduling measures the next run from the end of the previous one, so no task
  # overlaps itself however many threads the pool holds.
  task:
    scheduling:
      pool:
        size: "${SPRING_TASK_SCHEDULING_POOL_SIZE:2}"
      thread-name-prefix: carddemo-scheduling-

carddemo:
  # Request surface bounds. This service answers reads alone, so it declares no body
  # ceiling; the two settings below bound who may reach a state-changing route and how fast
  # any route may be reached.
  api:
    # Cross-site protection. config/CrossSiteRequestFilter refuses a state-changing request
    # that declares a foreign Sec-Fetch-Site, names an Origin other than this service, or
    # carries no value under the header below. An HTML form cannot set a header at all, and a
    # cross-origin script call that set one would need a preflight no chain here grants, so the
    # header is what separates a first-party client from a page replaying a cached credential.
    # The name is not a secret. Change it only together with every client that sets it.
    cross-site:
      required-header: ${API_CROSS_SITE_HEADER:X-CardDemo-Request}
    # Request-rate ceilings. config/RequestRateCeilingFilter runs ahead of the security chain
    # and refuses with 429 plus Retry-After. Every ceiling is counted over one fixed window.
    #
    # requests-per-window applies twice, once keyed by source address and once by the identity
    # the credential names, so one credential spread across many addresses is bounded too.
    # write-requests-per-window is the stricter ceiling on POST, PUT, PATCH and DELETE.
    # authentication-failures-per-window is the credential-guessing control: past it a source
    # is refused for the rest of the window, and only a request that carried a credential and
    # was answered 401 counts. concurrent-requests bounds requests in flight.
    #
    # The counters live in one process, so several replicas bound each replica rather than the
    # service as a whole. card-platform/docs/suggested-next-tasks.md records the shared-store
    # ceiling a deployment beyond a demo wants.
    rate-limit:
      window-seconds: ${API_RATE_WINDOW_SECONDS:60}
      requests-per-window: ${API_RATE_REQUESTS_PER_WINDOW:600}
      write-requests-per-window: ${API_RATE_WRITE_REQUESTS_PER_WINDOW:120}
      authentication-failures-per-window: ${API_RATE_AUTHENTICATION_FAILURES_PER_WINDOW:20}
      concurrent-requests: ${API_RATE_CONCURRENT_REQUESTS:64}

  kafka:
    # transaction.authorized is the one topic this service reads. FraudFlagged
    # and FraudCleared both travel on fraud.assessed, and a reader routes on
    # the envelope eventType field. A failed delivery travels to the source topic
    # with the suffix below, so one dead-letter topic carries one wire shape.
    topics:
      transaction-authorized: "${TOPIC_TRANSACTION_AUTHORIZED:transaction.authorized}"
      fraud-assessed: "${TOPIC_FRAUD_ASSESSED:fraud.assessed}"
      dead-letter: "${TOPIC_DEAD_LETTER:carddemo.dead-letter}"
      dead-letter-suffix: "${TOPIC_DEAD_LETTER_SUFFIX:.DLT}"

  consumer:
    retry:
      max-attempts: "${CONSUMER_MAX_RETRY_ATTEMPTS:3}"
      backoff-ms: "${CONSUMER_RETRY_BACKOFF_MS:1000}"

  outbox:
    relay:
      fixed-delay-ms: "${OUTBOX_RELAY_INTERVAL_MS:500}"
      batch-size: "${OUTBOX_RELAY_BATCH_SIZE:100}"
      # Name this process writes into outbox_event.claimed_by, so a claim left behind by a
      # restart can be told from one a running process still holds. That distinction only
      # works while the value differs per replica, which is why the fallback is HOSTNAME
      # rather than a literal: a container's HOSTNAME is its Pod name under Kubernetes and
      # its container id under Compose, both distinct per replica. This key used to default
      # to the literal fraud-relay-1, so two replicas claimed rows under one identity and
      # recoverStrandedClaims could not tell a stranded claim from a live one — it would
      # recover a row another running instance was still publishing, and publish it twice.
      # The literal also read as an instance number that nothing ever incremented.
      instance-id: "${OUTBOX_RELAY_INSTANCE_ID:${HOSTNAME:fraud-relay}}"
      # How long a claim may stand before another tick recovers the row. Two minutes, which is
      # what the other four relays ship and what card-platform/.env.example, the Compose file
      # and deploy/k8s/30-configmap.yaml all carry. This service shipped thirty seconds, so a
      # run that set no variable — a test, or the service started directly — recovered a claim
      # four times sooner here than anywhere else, and the value a reader had measured on one
      # relay did not describe this one.
      claim-timeout: "${OUTBOX_RELAY_CLAIM_TIMEOUT:PT2M}"
      max-duration-ms: "${OUTBOX_RELAY_MAX_DURATION_MS:5000}"
    # Retention. A published row has done its work and stays only for diagnosis, and a
    # processed-event marker matters only while a redelivery of its event is still
    # possible. domain/RetentionSweep calls the two repository purge methods on the
    # configured interval, and ix_outbox_event_published_at plus
    # ix_processed_event_processed_at serve those deletes.
    published-retention-hours: "${OUTBOX_PUBLISHED_RETENTION_HOURS:168}"
  processed-event:
    # A marker has to outlast every window the record itself can come back through,
    # and broker log retention is the shortest of those and the only one this
    # platform configures. The two were equal, which left no room for segment
    # cleanup lag, a restored backup, or a manually replayed window: a record still
    # readable after its marker was swept is applied a second time. config/*Properties
    # refuses a marker horizon under twice the broker figure at start-up, so the
    # relationship is checked rather than remembered.
    marker-retention-hours: "${PROCESSED_EVENT_RETENTION_HOURS:720}"
    # The broker retention this service is told to assume, which
    # KAFKA_LOG_RETENTION_HOURS sets for the broker and for every service at once.
    broker-retention-hours: "${KAFKA_LOG_RETENTION_HOURS:168}"
  retention:
    sweep-interval-ms: "${RETENTION_SWEEP_INTERVAL_MS:3600000}"
    # The two business tables of this service. Each declares its horizon in its own
    # COMMENT ON TABLE in db/migration/V1__schema.sql, and until a security review nothing
    # applied either: domain/RetentionSweep deleted outbox rows and duplicate markers only,
    # so ninety days and seven days described an intention rather than the table. Both rows
    # are pseudonymous - account_id and transaction_id resolve to a named customer through
    # the account and ledger services - so these are privacy horizons, not housekeeping.
    #
    # Days rather than hours, so the setting reads the same way as the catalogue comment.
    # ix_fraud_assessment_assessed_at and ix_velocity_window_start serve the two deletes.
    assessment-retention-days: "${FRAUD_ASSESSMENT_RETENTION_DAYS:90}"
    # This one has a floor as well as a purpose. A bucket is counted into for
    # carddemo.fraud.risk.velocity-window-minutes, so a horizon shorter than that window
    # would delete the row a live authorization is incrementing. domain/RetentionSweep
    # refuses to start when this does not exceed the window span.
    velocity-retention-days: "${FRAUD_VELOCITY_RETENTION_DAYS:7}"

  fraud:
    # A risk score runs from 1 to 100 and carries no decimal place; the amount is money
    # and carries two. domain/RiskScoringService compares the summed score against
    # flag-threshold: at or above it the transaction publishes as FraudFlagged, below it
    # as FraudCleared with every rule that objected still recorded on its row. The three
    # rules score 30, 30 and 25, so one alone stays below 50 and any two reach it.
    # flag-threshold starts at 1, because 0 would flag a transaction no rule objected to
    # and fraud-flagged-v1.json requires a flagged event to name a rule.
    # Where these four values come from: card-platform/docs/decision-log.md.
    risk:
      flag-threshold: 50
      velocity-window-minutes: 60
      velocity-count-threshold: 5
      amount-anomaly-threshold: "500.00"

  # Request identities. config/SecurityConfig maps each entry onto one Spring Security
  # user. Start-up fails when this list is empty, rather than running with no identity
  # at all.
  #
  # password holds an ALREADY-ENCODED value carrying its algorithm prefix, for example
  # {bcrypt}$2a$10$... A plaintext value authenticates nothing, so this platform does
  # not reproduce the plaintext comparison at app/cbl/COSGN00C.cbl:L223.
  # card-platform/.env.example documents the three variables and how to generate a
  # hash. None of them holds a usable default, so an unset variable stops start-up.
  #
  # role is ADMIN, USER or MONITORING. ADMIN and USER are the two outcomes of the
  # SEC-USR-TYPE fork at app/cbl/COSGN00C.cbl:L232-L236. MONITORING is additive: it
  # reaches the metrics and Prometheus endpoints on the management port and no business
  # route at all.
  #
  # scopes carries what an ordinary identity owns, one authority per entitlement:
  # SCOPE_ACCOUNT_<eleven digits>, SCOPE_CUSTOMER_<nine digits> or
  # SCOPE_CARD_<card token>. Each identifier is written exactly as its column holds
  # it, leading zeros included, and a card token is the 64 lower-case hexadecimal
  # characters PanMasker.tokenOf produces for that card number. An ADMIN entry needs none: it
  # passes every ownership check by role.
  security:
    users:
      - username: ${ADMIN_USERNAME:admin001}
        password: ${ADMIN_PASSWORD_HASH}
        role: ADMIN
      - username: ${USER_USERNAME:user0001}
        password: ${USER_PASSWORD_HASH}
        role: USER
        scopes: ${USER_SCOPES:}
      - username: ${MONITORING_USERNAME:monitor01}
        password: ${MONITORING_PASSWORD_HASH}
        role: MONITORING
management:
  # /actuator answers on this port and never on the service port above. The
  # container health check reads /actuator/health here.
  server:
    port: ${MANAGEMENT_PORT:9080}
    # The management port carries the same posture as the service port above, declared
    # rather than inherited. A monitoring credential travelling to a collector deserves
    # the protection a cardholder identifier gets. A Kubernetes
    # probe against an encrypted management port needs scheme HTTPS, which
    # deploy/k8s/40-authorization-service.yaml sets.
    ssl:
      enabled: "${MANAGEMENT_SSL_ENABLED:${SERVER_SSL_ENABLED:false}}"
      key-store: "${SERVER_SSL_KEYSTORE:}"
      key-store-type: "${SERVER_SSL_KEYSTORE_TYPE:PKCS12}"
      key-store-password: "${SERVER_SSL_KEYSTORE_PASSWORD:}"
  # config/SecurityConfig secures this surface. /actuator/health answers without a
  # credential, because a container health check and a Kubernetes probe carry none.
  # Every other endpoint below requires ROLE_MONITORING. An anonymous caller receives
  # 401, and an identity holding a business role receives 403.
  endpoints:
    web:
      exposure:
        include: "${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:${MANAGEMENT_ENDPOINTS:health,metrics,prometheus}}"
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,kafka,listeners,outbox
  prometheus:
    metrics:
      export:
        enabled: true

# The console format key below turns every log line into JavaScript Object
# Notation (JSON), and this module carries no logging configuration file. The
# shipped level for com.carddemo is DEBUG.
logging:
  structured:
    format:
      console: logstash
    # Members every record carries beside the framework's own. `service` names which of the six
    # services wrote a record, which no logstash member does; the Mapped Diagnostic Context supplies
    # correlationId, causationId, eventId, eventType and transactionId per request and per delivery,
    # and the framework renders every context entry as a top-level member of its own.
    json:
      add:
        service: ${spring.application.name:fraud-detection-service}
      # Withheld from every record this service writes. `stack_trace` is the one logstash
      # member that renders a throwable, and it renders the exception message ahead of the
      # frames. Spring Kafka reports a delivery it has given up on through
      # LogAccessor.error(Throwable, Supplier) from SeekUtils, a call no log level reaches, so
      # a message quoting a rejected payload, a constraint or a statement would reach the log
      # past every rule this platform applies to its own logging. Withholding the member drops
      # the rendering and nothing else: the exception still propagates, so the container still
      # retries and still routes the record. Each service reports a failure itself, as a type
      # chain with the record coordinates, which is the record an operator should read.
      exclude:
        - stack_trace
  level:
    root: "${LOGGING_LEVEL_ROOT:${LOG_LEVEL:INFO}}"
    # INFO rather than DEBUG. A DEBUG default writes identifiers into every
    # centralized log this deployment feeds, and a default is what an operator gets
    # who starts this service directly rather than through compose or Kubernetes.
    # Raise it for one run when tracing a message, and lower it again afterwards.
    com.carddemo: "${LOGGING_LEVEL_COM_CARDDEMO:${LOG_LEVEL_CARDDEMO:INFO}}"
    # OFF, not a level. This logger renders the server's own message for every failed
    # statement, and PostgreSQL puts the whole failing row in the DETAIL of a constraint
    # violation. On a table holding a card number, a verification value or a social security
    # number that one line publishes all of them, which is the CWE-532 the platform closes
    # everywhere else: LogHygieneContractTest holds every shipped source to rendering a
    # failure as its type. The framework's own logger was the last site outside that rule.
    # Nothing diagnostic is lost. The exception still reaches this service's own handler,
    # which answers a problem document and logs the failure type and the SQL state.
    #
    # The name is the Hibernate 7 one. Under Hibernate 5 and 6 this logger was
    # org.hibernate.engine.jdbc.spi.SqlExceptionHelper, and naming that instead silently
    # suppresses nothing: it was tried here first, and a card number reached a published
    # report anyway. CardholderDataInArtifactsContractTest asserts this exact name.
    org.hibernate.orm.jdbc.error: "OFF"
