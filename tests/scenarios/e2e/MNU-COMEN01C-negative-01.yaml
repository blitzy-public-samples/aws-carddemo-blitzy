# COMEN01C refuses three invalid options: zero, one past the last option, and a
# non-numeric entry, each answered on the main menu with
# 'Please enter a valid option number...' [app/cbl/COMEN01C.cbl:127-134].
#
# Option entry [app/cbl/COMEN01C.cbl:115-125]: the 2-byte OPTION field is
# right-justified and zero-filled, by its BMS JUSTIFY=(RIGHT,ZERO) and again by
# the program's own scan, JUST RIGHT move and INSPECT of spaces into zeros, then
# moved to WS-OPTION PIC 9(02) and echoed into OPTIONO. The adapter erases the
# field before typing each value, so the echo is '00', '11' and '0X'.
#   '0'  -> 00, equal to ZEROS.
#   '11' -> 11, above CDEMO-MENU-OPT-COUNT, which COMEN02Y sets to 10.
#   'X'  -> '0X', not NUMERIC. This assumes the alphanumeric-to-numeric MOVE
#           copies the bytes unchanged. A compiler that repairs the zone of the
#           last byte would make it a digit (07) and select an option instead.
#           The expected outcome is the one the test plan derives for 'X', and it
#           stays inferred until a UniKix run is imported (GAP-INF-003).
#
# Suspected defect (GAP-DEF-010), pinned as the source behaves and never fixed:
# after the message is sent, the paragraph goes on to the admin-only check
# CDEMO-MENU-OPT-USRTYPE(WS-OPTION) with the invalid value as subscript
# [app/cbl/COMEN01C.cbl:136-143].
#   0    reads the byte before the table, the second digit of the option count ('0').
#   11   reads a byte past the ten options COMEN02Y defines, which holds no VALUE.
#   '0X' subscripts as 7 (EBCDIC) or 8 (ASCII), both of user type 'U'.
# None of these is assumed to be 'A', so no second SEND replaces the message
# with 'No access - Admin Only option...'. The error flag is on, so no XCTL
# follows, and each step ends with RETURN TRANSID CM00 on the menu that sent the
# message once [app/cbl/COMEN01C.cbl:107-110,145-165].
#
# Field values are whole fields at their BMS length, with trailing spaces kept.
# CURDATE and CURTIME come from the region clock, so they are matchers.
id: MNU-COMEN01C-negative-01
level: e2e
type: negative
description: >-
  USER0001 signs on through CC00 and reaches the COMEN01C main menu (CM00). It
  then enters option 0, then 11 (one past the ten options of COMEN02Y), then
  X. Each entry is refused with 'Please enter a valid option number...' on a
  re-sent menu, which echoes the option as COMEN01C normalizes it (00, 11, 0X),
  and no transfer to another program follows. The admin-only check that still
  subscripts the option table with the invalid value (GAP-DEF-010) is pinned as
  producing no second message.
inventory_ids:
- INV-MNU-006  # COMEN01C message 'Please enter a valid option number...'
- INV-MNU-001  # COMEN01C program
- INV-MNU-003  # COMEN01 map
- INV-CFG-018  # CM00 transaction, which runs each option entry
- INV-LAY-002  # COCOM01Y: the COMMAREA, CDEMO-USRTYP-USER
- INV-LAY-003  # COMEN02Y: option count 10 and the option table subscripted
- INV-LAY-005  # COTTL01Y: the screen titles
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y, copied by COMEN01C
tags:
- inferred-not-observed
- suspected-defect
gap_ids:
- GAP-INF-003  # MNU end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-DEF-010  # the option table is subscripted with the invalid option
preconditions:
  datasets:
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '0'
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '11'
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: 'X'
expected:
  screens:
  # Sign-on lands on the menu, sent from a cleared output map: option field and
  # message line blank [app/cbl/COMEN01C.cbl:86-90].
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    OPTN010: '10. Bill Payment                        '
    OPTN011: '                                        '
    OPTION: '  '
    ERRMSG: '                                                                              '
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    OPTN010: '10. Bill Payment                        '
    OPTN011: '                                        '
    OPTION: '00'
    ERRMSG: 'Please enter a valid option number...                                         '
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    OPTN010: '10. Bill Payment                        '
    OPTN011: '                                        '
    OPTION: '11'
    ERRMSG: 'Please enter a valid option number...                                         '
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    OPTN010: '10. Bill Payment                        '
    OPTN011: '                                        '
    OPTION: '0X'
    ERRMSG: 'Please enter a valid option number...                                         '
  # The ERRMSG values of the three refused entries, in order; the blank message
  # of the first menu precedes them in the captured messages.
  messages:
  - 'Please enter a valid option number...                                         '
  - 'Please enter a valid option number...                                         '
  - 'Please enter a valid option number...                                         '
