apiVersion: v1
kind: Secret
metadata:
  name: carddemo-card-secret
  namespace: carddemo
  labels:
    app.kubernetes.io/name: card-service
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: card-platform
