# Derived baseline of scenario ACT-COACTUPC-negative-104 (capture_platform:
# derived), authored from the app/ source and never observed: no TPE region
# runs in CI. Open until a UniKix run of the app/ build is imported:
# GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012 (online-only
# copybooks such as CSUTLDPY, CSUTLDWY and CSSETATY).
# Steps 1-3: USER0001 signs on, option 2 XCTLs to COACTUPC, and ENTER with
# account 00000000001 shows the fetched account and the invented customer
# 000000001 with the change prompt; its country U5A stands in Country, which
# 3320-UNPROTECT-FEW-ATTRS leaves protected with its MDT on
# [app/cbl/COACTUPC.cbl:2787-2865,2955-2981,3546-3547].
# Step 4: the typed Address Line 2 and the retransmitted Country reach
# ACUP-NEW-CUST-ADDR-LINE-2 and ACUP-NEW-CUST-ADDR-COUNTRY-CD
# [app/cbl/COACTUPC.cbl:1322-1327,1343-1348]; 1205-COMPARE-OLD-NEW finds the
# change, so 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and the edits
# before Country pass; 1225-EDIT-ALPHA-REQD finds 'U5A' supplied, converts its
# letters to spaces, leaves ' 5 ' and, the message being still off, composes
# TRIM('Country') ' can have alphabets only.' (32 characters) into
# WS-RETURN-MSG; no later edit can replace it [app/cbl/COACTUPC.cbl:
# 1460-1470,1623-1630,1898-1951].
# 2000-DECIDE-ACTION continues, so nothing is rewritten; 3203 redisplays the
# received values, 3250 sets PROMPT-FOR-CHANGES and moves the message to
# ERRMSG, CSSETATY colours ACSCTRY red without '*' because it is not blank,
# and 3390 brightens FKEY12 [app/cbl/COACTUPC.cbl:2596-2605,2870-2951,
# 2955-2981,3566-3581] [app/cpy/CSSETATY.cpy:17-27].
# This pins the app/ text: the UniKix 1225-EDIT-ALPHA-REQD strings the
# untrimmed 25-byte WS-EDIT-VARIABLE-NAME, so its copy would show 'Country'
# plus 18 spaces before the suffix (GAP-DOC-022); such a record is
# UniKix-copy behavior and never replaces this file.
# Screen values are full BMS width with trailing spaces kept (ERRMSG 78,
# INFOMSG 45, ACSADL2 50, ACSCTRY 3), because screens compare exactly. CURDATE
# and CURTIME come from the region clock, so they are matchers. file_state
# holds the records as the preconditions materialize them, decoded through
# CVACT01Y and CVCUS01Y, unchanged because no REWRITE runs.
