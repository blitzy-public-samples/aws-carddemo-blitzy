  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACTSSN1: ''
