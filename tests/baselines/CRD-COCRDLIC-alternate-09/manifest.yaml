# Manifest of the derived baseline of CRD-COCRDLIC-alternate-09: CCLI entered
# directly, with no COMMAREA and no sign-on, starts COCRDLIC's own COCRDLI card
# list, and ENTER on it resends page 1 (GAP-UNC-010). Only unikix can run the
# scenario, so expected.yaml was authored from the source, not captured
# (inferred-not-observed). It names no execution_id or execution_fingerprint
# and holds no datasets/ until an eligible UniKix run is imported with
# report.py --import-unikix (GAP-INF-006, GAP-INF-012).
#
# source_identity.units are COCRDLIC's COPY closure, as
# harness.inventory_tools.copy_closure resolves it (the symbolic map COCRDLI
# included), plus the BMS source of its map COCRDLI. No other program runs:
# both tasks of the step are COCRDLIC's. CSMSG02Y is not a unit because its
# COPY is commented out [app/cbl/COCRDLIC.cbl:283]; DFHAID and DFHBMSCA are
# CICS-supplied and not in the repository. source_commit is HEAD at authoring;
# app/ is byte-identical to the suite's starting commit.
