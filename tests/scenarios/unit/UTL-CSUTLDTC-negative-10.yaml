# The FC-INVALID-MONTH branch of CSUTLDTC's feedback-token mapping, reached by
# injection: with ceedays_feedback 09D5 the CEEDAYS stub skips its own date
# computation and returns the severity-3 token 00 03 09 D5 59 C3 C5 C5 for any
# date, which is the value of the 88-level FC-INVALID-MONTH, so CSUTLDTC moves
# 'Invalid month  ' to WS-RESULT [app/cbl/CSUTLDTC.cbl:67,116-124,139-140]
# (tests/stubs/ceedays.c, Injection). The date 2022-07-18 is valid for the
# mask YYYY-MM-DD, so no computed token could reach this branch: the outcome
# verifies CSUTLDTC's mapping, not which dates CEEDAYS refuses (GAP-STB-002).
# CSUTLDTC sets the severity, 3, as its RETURN-CODE and the message number
# 0x09D5 is shown in decimal as 2517 [app/cbl/CSUTLDTC.cbl:98,123-124].
# The result is pinned byte for byte as DTCDRV prints it. Bytes 46-47 of the
# result hold the binary Vstring length x'000A' that MOVE WS-DATE-TO-TEST TO
# WS-DATE copies ahead of the date, which therefore shows truncated to
# 2022-07- [app/cbl/CSUTLDTC.cbl:25-31,52,122]; RESULT renders those two bytes
# as '..' and HEX as 000A (tests/stubs/DTCDRV.cbl, Output contract).
# return_code is DTCDRV's exit status, 0 after the last call; the severity
# CSUTLDTC returns is the RC= field of the line.
id: UTL-CSUTLDTC-negative-10
level: unit
type: negative
description: >-
  CSUTLDTC is called with the valid date 2022-07-18 and the mask YYYY-MM-DD while
  the CEEDAYS stub returns the injected feedback token 09D5: the result reports
  severity 0003, message code 2517 and 'Invalid month', and RETURN-CODE is 3.
inventory_ids:
- INV-UTL-002  # CSUTLDTC CEEDAYS feedback-token mapping (rule)
- INV-UTL-004  # CSUTLDTC result message layout and RETURN-CODE (interface)
- INV-UTL-001  # CSUTLDTC program
# Untagged by design: the expected outcome is CSUTLDTC's own mapping of a token
# that the scenario injects, so nothing about real CEEDAYS is inferred here
# (the date-acceptance item and GAP-INF-001 belong to the computed cases).
tags: []
gap_ids:
- GAP-STB-002  # CEEDAYS stub: token injection in place of LE CEEDAYS
- GAP-STB-004  # DTCDRV emulates the CALL interface of CSUTLDTC's callers
- GAP-STB-011  # GnuCOBOL compile and runtime options in place of Enterprise COBOL and LE
preconditions:
  datasets: {}
  parameters:
    ceedays_feedback: '09D5'
    clock: '2022-07-06 10:00:00.00'
    clock_mode: fixed
  faults: []
inputs:
  program: CSUTLDTC
  param_files:
    # The DTCDRV call list: date X(10) then mask X(10); the rest of the 80-byte
    # record is spaces (tests/fixtures/datasets.yaml DTCIN).
    DTCIN:
    - '2022-07-18YYYY-MM-DD'
expected:
  return_code: 0
  messages:
  - 'DTCDRV DATE=2022-07-18 MASK=YYYY-MM-DD RC=0003 RESULT=0003Mesg Code: 2517 Invalid month   TstDate: ..2022-07- Mask used:YYYY-MM-DD     HEX=303030334D65736720436F64653A203235313720496E76616C6964206D6F6E7468202020547374446174653A20000A323032322D30372D204D61736B20757365643A595959592D4D4D2D444420202020'
