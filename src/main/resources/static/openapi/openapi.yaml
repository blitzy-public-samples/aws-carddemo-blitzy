openapi: 3.1.0
info:
  title: AWS CardDemo API
  description: "REST API for the AWS CardDemo credit-card account management system,\
    \ migrated from COBOL/CICS to Java 25 and Spring Boot. It re-expresses the 17\
    \ legacy online (3270/BMS) screens as JSON request/response endpoints: signon,\
    \ the main and administrative menus, account view/update, card list/view/update,\
    \ transaction list/view/add, transaction reports, bill payment, and administrative\
    \ user management. This is a faithful, behavior-preserving migration and not a\
    \ web UI, terminal emulator, or 3270 renderer; no capabilities beyond the original\
    \ COBOL application are added."
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Local development server
- url: /
  description: Relative to the serving host
security:
- basicAuth: []
tags:
- name: Bill Payment
  description: "Bill Payment screen (COBOL COBIL00C / CICS transaction CB00): pay\
    \ the full account balance and post the resulting payment transaction."
- name: Card List
  description: "Card List screen (COBOL COCRDLIC / CICS transaction CCLI): browse\
    \ the cards for an account with PF7/PF8 paging."
- name: Main Menu
  description: "Main Menu screen (COBOL COMEN01C / CICS transaction CM00): lists the\
    \ ten main-menu options and routes the selected option to its target program."
- name: Transaction Add
  description: "Transaction Add screen (COBOL COTRN02C / CICS transaction CT02): capture\
    \ and post a new transaction, generating the next transaction id."
- name: User Delete
  description: "User Delete screen (COBOL COUSR03C / CICS transaction CU03): delete\
    \ an application user. Requires the ADMIN role."
- name: Card Update
  description: "Card Update screen (COBOL COCRDUPC / CICS transaction CCUP): view\
    \ and modify card detail with field-level edit validation."
- name: User List
  description: "User List screen (COBOL COUSR00C / CICS transaction CU00): browse\
    \ application users with PF7/PF8 paging. Requires the ADMIN role."
- name: User Update
  description: "User Update screen (COBOL COUSR02C / CICS transaction CU02): view\
    \ and modify an application user. Requires the ADMIN role."
- name: Card View
  description: "Card View screen (COBOL COCRDSLC / CICS transaction CCDL): view a\
    \ single card's detail."
- name: User Add
  description: "User Add screen (COBOL COUSR01C / CICS transaction CU01): create a\
    \ new application user. Requires the ADMIN role."
- name: Transaction Report
  description: "Transaction Report screen (COBOL CORPT00C / CICS transaction CR00):\
    \ request a transaction report over a chosen date range."
- name: Account View
  description: "Account inquiry (COBOL COACTVWC / CICS transaction CAVW): view merged\
    \ account and customer detail."
- name: Transaction List
  description: "Transaction List screen (COBOL COTRN00C / CICS transaction CT00):\
    \ browse transactions chronologically with PF7/PF8 paging."
- name: Account Update
  description: "Account update (COBOL COACTUPC / CICS transaction CAUP): view and\
    \ modify account and customer detail with field-level edit validation."
- name: Admin Menu
  description: "Admin Menu screen (COBOL COADM01C / CICS transaction CA00): lists\
    \ the administrative options and routes the selected option to its target program.\
    \ Requires the ADMIN role."
- name: Sign-on
  description: COSGN00C / CC00 — CardDemo authentication entry screen
- name: Transaction View
  description: "Transaction View screen (COBOL COTRN01C / CICS transaction CT01):\
    \ view a single transaction's detail."
