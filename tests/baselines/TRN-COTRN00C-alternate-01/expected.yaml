# Derived baseline of TRN-COTRN00C-alternate-01: PF7 on page 1 of the
# transaction list. Not observed; authored from app/cbl/COTRN00C.cbl:107-141,
# 206-252,279-327,381-445,527-586 (PF7 with CDEMO-CT00-PAGE-NUM not above 1
# sends the top-of-page message without ERASE and issues no browse),
# app/bms/COTRN00.bms (every field FSET, so PF7 resends the received rows),
# app/cbl/COMEN01C.cbl:236-272, app/cpy/COMEN02Y.cpy (option 6), app/cpy/COTTL01Y.cpy,
# app/cpy/CSDAT01Y.cpy and the TRANSACT fixture built from
# app/data/ASCII/dailytran.txt (300 records; page 1 is the 10 lowest TRAN-IDs).
# Only report.py --import-unikix replaces it with an observed outcome:
# GAP-INF-007 (derived TRN end-to-end baselines) and GAP-INF-012 (online-only
# copybooks). Screens are whole fields at their BMS length, trailing spaces
# kept; CURDATE and CURTIME come from the region clock and are matchers.
