# COACTUPC refuses an Open Date whose day is not a number: the EDIT-DAY
# TEST-NUMVAL check of CSUTLDPY [app/cpy/CSUTLDPY.cpy:170-185].
#
# Steps 1-3 reach the fetched account as ACT-COACTUPC-alternate-04 does:
# USER0001 signs on, main-menu option 2 XCTLs to COACTUPC, and ENTER with
# account 00000000001 reads CXACAIX (customer 000000001), ACCTDAT and CUSTDAT,
# shows the details with 'Update account details presented above.' and gives
# every editable field DFHBMFSE, so all of them come back on the next AID
# [app/cbl/COACTUPC.cbl:2568-2580,2787-2865,2955-3000,3500-3561].
# Step 4 types 2X over the open day (20) and presses ENTER. 1100-RECEIVE-MAP
# moves it to ACUP-NEW-OPEN-DAY, 1205-COMPARE-OLD-NEW finds the open date
# changed, and 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and runs the field
# edits in screen order [app/cbl/COACTUPC.cbl:1158-1163,1463-1482,1681-1705]:
# - Account Status Y passes 1220-EDIT-YESNO.
# - Open Date 2014-11-2X: PERFORM EDIT-DATE-CCYYMMDD THRU its EXIT runs the
#   copybook's paragraphs in sequence. Year 2014 (century 20) and month 11
#   pass; in EDIT-DAY the day is not blank, FUNCTION TEST-NUMVAL('2X') is not
#   0, so INPUT-ERROR and FLG-DAY-NOT-OK are set and, WS-RETURN-MSG being
#   SPACES, STRING composes TRIM('Open Date') and ':day must be a number
#   between 1 and 31.' into it. GO TO EDIT-DAY-EXIT falls into
#   EDIT-DAY-MONTH-YEAR, which leaves the message alone and, the date flags
#   not being all LOW-VALUES, exits before the CSUTLDTC call.
# - Every later edit guards its message with WS-RETURN-MSG-OFF, so none
#   replaces it; the invented customer below passes them all anyway.
# 2000-DECIDE-ACTION only continues on ACUP-CHANGES-NOT-OK, so nothing is read
# for update or rewritten [app/cbl/COACTUPC.cbl:2596-2597]. 3203-SHOW-UPDATED-
# VALUES shows the received values, the valid amounts re-edited through
# +ZZZ,ZZZ,ZZZ.99, and OPNDAY as typed; 3250 sets PROMPT-FOR-CHANGES and moves
# the message to ERRMSG; 3320 keeps the fields editable; CSSETATY turns OPNDAY
# red without the '*' of a blank field; 3390 makes F12=Cancel bright because
# ACUP-CHANGES-MADE holds, while F5=Save stays dark
# [app/cbl/COACTUPC.cbl:2718-2720,2870-2949,2964-2965,2998-3000,3226-3229,
# 3573-3581] [app/cpy/CSSETATY.cpy:18-27].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - ERRMSG is the 48-character message in the 75-byte WS-RETURN-MSG, shown in
#   the 78-byte ERRMSGO; INFOMSG is the 39-character prompt in the 45-byte
#   INFOMSGO. Fields are compared at their full BMS length.
# - Colour and cursor position are not screen-field values, so the red OPNDAY
#   and the cursor are not asserted. The cursor is placed on OPNDAY:
#   3000-SEND-MAP runs 3250 before 3300, so PROMPT-FOR-CHANGES has replaced
#   the FOUND-ACCOUNT-DATA that 1200-EDIT-MAP-INPUTS set in WS-INFO-MSG, and
#   FLG-OPEN-DAY-NOT-OK is the first WHEN of the cursor EVALUATE that holds,
#   selecting OPNDAYL [app/cbl/COACTUPC.cbl:463-471,1452,2654-2657,2964-2965,
#   3009-3031].
# - A dark field is captured as blanks, hence FKEY05 on screen 4.
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every COACTUPC
# edit, as in ACT-COACTUPC-alternate-04, so the Open Date edit is the only one
# that fails. Account 00000000001 and its cross-reference stay as in the
# repository.
id: ACT-COACTUPC-negative-019
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update) and fetches
  account 00000000001, then types 2X over the open day 20 and presses ENTER.
  COACTUPC refuses the change with 'Open Date:day must be a number between 1
  and 31.', keeps the received values on the editable screen with 'Update
  account details presented above.' and F12=Cancel shown, and writes nothing:
  ACCTDATA and CUSTDATA still hold the fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them.
inventory_ids:
- INV-ACT-077  # COACTUPC Open Date: day numeric (EDIT-DAY TEST-NUMVAL check)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and error screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the per-field error attributes
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: the date edit that refuses the day
- INV-LAY-014  # CSUTLDWY: WS-EDIT-DATE-DD and the date flags
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY tests the day with IS NUMERIC and drops TRIM from the
# field name, so the composed message may differ on UniKix.
- GAP-DOC-024
# Not in the planned gap list; cited as ACT-COACTUPC-alternate-04 cites them.
# The UniKix COACTUPC comments out the TEST-NUMVAL-C amount checks, so the
# amounts on screen 4 may differ, and the UniKix COACTUP.bms differs at row 1,
# columns 1-9, where TRNNAME stands.
- GAP-DOC-022
- GAP-DOC-025
