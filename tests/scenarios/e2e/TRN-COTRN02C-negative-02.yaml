# COTRN02C refuses a confirmation value other than Y, y, N, n, blank or
# LOW-VALUES with 'Invalid value. Valid values are (Y/N)...' and adds nothing
# [app/cbl/COTRN02C.cbl:169-188].
#
# Steps 1-2 reach the empty Add Transaction screen as TRN-COTRN02C-normal-01
# does: USER0001 (type U) is routed to COMEN01C, and option 8 transfers control
# to COTRN02C, which sets the re-enter flag, finds no transaction selected and
# sends COTRN02 with a blank ERRMSG [app/cbl/COSGN00C.cbl:230-237]
# [app/cbl/COMEN01C.cbl:115-156] [app/cbl/COTRN02C.cbl:115-130,516-571].
# Step 3 enters the valid field set of the TRN-COTRN02C scenarios, card number
# only, with CONFIRM X, and presses ENTER under CT02
# [app/cbl/COTRN02C.cbl:131-135]:
# - VALIDATE-INPUT-KEY-FIELDS takes the card branch: ACTIDIN is blank, the card
#   is numeric and moved back through WS-CARD-NUM-N unchanged, READ CCXREF by
#   card is NORMAL (record 1 of the CARDXREF fixture), and the record's account
#   id 00000000050 is moved into ACTIDINI [app/cbl/COTRN02C.cbl:193-230,609-637].
# - VALIDATE-INPUT-DATA-FIELDS finds every field supplied, both codes numeric,
#   the amount in the +99999999.99 form, both dates in the YYYY-MM-DD form and
#   accepted by CSUTLDTC, and the merchant id numeric, so no message is set.
#   NUMVAL-C turns +00000012.34 into 12.34 and the PIC +99999999.99 edit puts
#   +00000012.34 back into TRNAMTI [app/cbl/COTRN02C.cbl:59-60,235-437].
# - CONFIRM X falls to WHEN OTHER: the error flag is set, the message is moved
#   to WS-MESSAGE, the cursor goes to CONFIRM, and SEND-TRNADD-SCREEN sends
#   COTRN02 with ERASE before RETURN TRANSID CT02 [app/cbl/COTRN02C.cbl:182-187,
#   516-534]. ADD-TRANSACTION is never performed, so TRANSACT is not browsed or
#   written [app/cbl/COTRN02C.cbl:442-495].
# COTRN2AO redefines the COTRN2AI that RECEIVE MAP filled, so every entry field
# is sent back as received, with ACTIDIN, CARDNIN and TRNAMT as the key and
# amount edits rewrote them; CONFIRM still shows X.
#
# Expected values are derived from the source; no TPE region runs in CI. BMS
# pads each received field with blanks to its length, and expected text values
# are full field width with their trailing spaces. CURDATE and CURTIME come
# from the region clock, so they are matchers and the clock is relative.
id: TRN-COTRN02C-negative-02
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 8 (Transaction Add) and, on
  COTRN02, enters a valid transaction for repository card 0500024453765740
  with CONFIRM X. COTRN02C validates the fields, fills in account 00000000050
  from the card cross-reference, rejects the confirmation with 'Invalid value.
  Valid values are (Y/N)...', sends the screen back with the entered values,
  and writes nothing to TRANSACT.
# Primary item first, then the program, the maps asserted, the transaction
# step 3 runs under, the CSD file COTRN02C reads, and the online-only
# copybooks it copies. Sign-on and the menu option (CC00, CM00, COSGN00,
# USRSEC) are verified by the SEC and MNU scenarios; TRANSACT is only observed
# here, never touched by COTRN02C, so its CSD file item is not listed; the
# batch record copybooks and data files are verified at the lowest level that
# executes them.
inventory_ids:
- INV-TRN-032  # COTRN02C message 'Invalid value. Valid values are (Y/N)...'
- INV-TRN-003  # COTRN02C program
- INV-MNU-003  # COMEN01 map, where option 8 is entered
- INV-TRN-006  # COTRN02 map, the add screen of steps 2 and 3
- INV-CFG-022  # CT02 transaction, under which COTRN02C receives the entry
- INV-CFG-004  # CCXREF CSD file, read by card number
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA carrying the program context
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the screen date and time
- INV-LAY-008  # CSMSG01Y copybook, copied by COTRN02C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-007  # TRN end-to-end baselines derived, never observed on a TPE region
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    USRSEC: {base: USRSEC}
    CARDXREF: {base: CARDXREF}
    # TRANSACT has no repository data of its own (datasets.yaml source
    # 'built', which a base cannot name), so it is built from the 300
    # repository daily transactions, which share its 350-byte record shape.
    TRANSACT: {base: DALYTRAN}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '8'
  # ACTIDIN is left blank, so the card number selects the cross-reference.
  - aid: ENTER
    '@map': COTRN02
    fields:
      CARDNIN: '0500024453765740'
      TTYPCD: '01'
      TCATCD: '0001'
      TRNSRC: 'POS TERM'
      TDESC: 'Test purchase'
      TRNAMT: '+00000012.34'
      TORIGDT: '2022-07-01'
      TPROCDT: '2022-07-01'
      MID: '800000001'
      MNAME: 'Test Merchant'
      MCITY: 'Testville'
      MZIP: '27601'
      CONFIRM: 'X'
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: 'CM00'
    PGMNAME: 'COMEN01C'
  - '@map': COTRN02
    TRNNAME: 'CT02'
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: 'COTRN02C'
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ERRMSG: '                                                                              '
  - '@map': COTRN02
    TRNNAME: 'CT02'
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: 'COTRN02C'
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ACTIDIN: '00000000050'
    CARDNIN: '0500024453765740'
    TTYPCD: '01'
    TCATCD: '0001'
    TRNSRC: 'POS TERM  '
    TDESC: 'Test purchase                                               '
    TRNAMT: '+00000012.34'
    TORIGDT: '2022-07-01'
    TPROCDT: '2022-07-01'
    MID: '800000001'
    MNAME: 'Test Merchant                 '
    MCITY: 'Testville                '
    MZIP: '27601     '
    CONFIRM: 'X'
    ERRMSG: 'Invalid value. Valid values are (Y/N)...                                      '
  # The ERRMSG of each step: the menu and the empty add screen carry none.
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'Invalid value. Valid values are (Y/N)...                                      '
  file_state:
    # Only ADD-TRANSACTION writes TRANSACT, and the refused confirmation never
    # reaches it, so the file still holds exactly the 300 fixture records.
    TRANSACT:
      count: 300
