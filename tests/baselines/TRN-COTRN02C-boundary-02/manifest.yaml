# Manifest of the derived baseline of TRN-COTRN02C-boundary-02: USER0001 adds a
# transaction on COTRN02 with Amount '-99999999.99', the negative extreme of its
# format, which COTRN02C accepts and answers with 'Confirm to add this
# transaction...' [app/cbl/COTRN02C.cbl:173-181,339-351]. Only unikix can run
# the scenario, so expected.yaml is authored from the source and is
# inferred-not-observed (GAP-INF-007, GAP-INF-012). It names no execution_id
# or execution_fingerprint and holds no datasets/ until report.py
# --import-unikix promotes an eligible UniKix run.
#
# source_identity.units are the app/ units the three steps execute, since
# harness.results gives an e2e run none: the COPY closure
# (inventory_tools.copy_closure) of COSGN00C, which signs USER0001 on and
# XCTLs to COMEN01C [app/cbl/COSGN00C.cbl:230-237]; of COMEN01C, whose option
# 8 XCTLs to COTRN02C [app/cpy/COMEN02Y.cpy:67-72]; of COTRN02C; and of
# CSUTLDTC, which COTRN02C CALLs for the valid Orig and Proc Dates before it
# asks for confirmation [app/cbl/COTRN02C.cbl:389-436]; plus the BMS sources
# of the maps COSGN00, COMEN01 and COTRN02. DFHAID and DFHBMSCA are
# CICS-supplied, not app/ sources. source_commit is HEAD at authoring; app/ is
# byte-identical to the suite's starting commit
# 93ebec71ff7b59a68cedd7c501afe496a8eaa68d.
