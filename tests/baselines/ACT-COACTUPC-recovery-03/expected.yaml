# Derived baseline of scenario ACT-COACTUPC-recovery-03 (capture_platform:
# derived): USER0001 opens Account Update, fetches account 00000000001,
# changes the customer's first name, has it validated, and confirms with PF5
# while another task holds customer 000000001 for update. Authored from the
# source, never captured; open under GAP-INF-005 and GAP-INF-012 until an
# eligible UniKix run is imported, and unexecutable until a lock-holding
# mechanism resolves GAP-MIS-014.
# One screen per step, each the screen sent after the step's AID, at full BMS
# field width with trailing spaces kept; fields sent as LOW-VALUES read as
# spaces. messages holds each step's ERRMSG. CURDATE and CURTIME come from the
# region clock, hence the run-date and run-time matchers.
# Step 5: PF5 is valid while the changes wait for confirmation and 1200 leaves
# at once [app/cbl/COACTUPC.cbl:905-911,1463-1467]. 9600 locks ACCTDAT, then
# the CUSTDAT READ UPDATE does not answer NORMAL, so it sets
# COULD-NOT-LOCK-CUST-FOR-UPDATE and leaves before either REWRITE
# [app/cbl/COACTUPC.cbl:3888-3942,519-520]. 2000-DECIDE-ACTION has no WHEN for
# that outcome and sets ACUP-CHANGES-OKAYED-AND-DONE, a value of
# ACUP-CHANGES-MADE, so 3203 shows the received values and 3250 pairs
# 'Changes committed to database' in INFOMSG with the lock failure in ERRMSG
# [app/cbl/COACTUPC.cbl:660-665,2602-2615,2718-2720,2955-2981]. That pairing is
# a suspected defect, pinned as derived and never fixed (GAP-DEF-015).
# No record is rewritten: ACCTDATA and CUSTDATA keep the loaded values.
