# Manifest of the derived baseline of BIL-COBIL00C-recovery-02: USER0001 takes
# main-menu option 10 'Bill Payment' and confirms the payment of account
# 00000000001's balance with CONFIRM Y. COBIL00C writes the payment record to
# TRANSACT and sends 'Payment successful...'. The REWRITE of ACCTDAT then
# answers IOERR, so WHEN OTHER sends COBIL00 with 'Unable to Update Account...'
# [app/cbl/COBIL00C.cbl:208-244,375-403,505-532]. Only unikix can run this
# scenario, and no adapter can return an I/O error from a region file
# operation (GAP-MIS-014). Nothing ran, so expected.yaml is authored from the
# source and is inferred-not-observed (GAP-INF-008, GAP-INF-012). It names no
# execution_id or execution_fingerprint, and it holds no datasets/ until an
# eligible UniKix run is imported with report.py --import-unikix.
#
# source_identity.units are the app/ sources that the three steps execute, not
# only COBIL00C's. Each program contributes its COPY closure as harness.results
# computes it for a program (inventory_tools.copy_closure, symbolic maps in
# app/cpy-bms included):
# - COSGN00C, which signs USER0001 on and XCTLs to COMEN01C
#   [app/cbl/COSGN00C.cbl:221-237]
# - COMEN01C, whose COMEN01 screen is asserted and whose option 10 XCTLs to
#   COBIL00C [app/cbl/COMEN01C.cbl:115-156]
# - COBIL00C
# The BMS sources of the maps COSGN00, COMEN01 and COBIL00 are included too.
# DFHAID and DFHBMSCA are CICS-supplied and are not in the repository.
