# The close-failure path of the CBACT02C listing. Every card record is read and
# displayed in key order, as in DAT-CBACT02C-normal-01; then CLOSE CARDFILE
# returns a status other than '00', so 9000-CARDFILE-CLOSE displays the error,
# 9910-DISPLAY-IO-STATUS shows the status and 9999-ABEND-PROGRAM calls CEE3ABD,
# which never returns: the end-of-execution line is not written
# [app/cbl/CBACT02C.cbl:74-87,136-158,161-174].
#
# No adapter can make a CLOSE fail after a successful open (GAP-MIS-013), so on
# gnucobol-batch the fault raises MissingPrerequisite and the case stays
# implemented-unexecuted. The expected outcome is derived from the source
# (GAP-INF-013). Status 30 (permanent I/O error) stands for the io-error
# condition and is inferred: the status a real failing CLOSE returns depends on
# the platform and the failure.
id: DAT-CBACT02C-recovery-03
level: unit
type: recovery
description: >-
  CBACT02C lists all 50 card records, then the close of the card file fails:
  the program displays 'ERROR CLOSING CARDFILE' with the file status and abends
  through CEE3ABD, so no end-of-execution line is written and there is no
  return code [app/cbl/CBACT02C.cbl:136-158].
# Only the failure item. This case cannot run (GAP-MIS-013), and listing the
# program, CVACT02Y or the card data files here would hold those items at
# implemented-unexecuted although their other scenarios verify them.
inventory_ids:
- INV-DAT-033
tags:
- inferred-not-observed
gap_ids:
- GAP-MIS-013
- GAP-INF-013
- GAP-STB-001
- GAP-DEF-001
# CBACT02C reads an indexed file and is compiled with the mapped options on
# gnucobol-batch, so the case cites those two stub limitations, as every
# scenario whose program uses a seam does.
- GAP-STB-010
- GAP-STB-011
preconditions:
  datasets:
    CARDDATA:
      base: CARDDATA
  parameters:
    clock_mode: fixed
  faults:
  - target: CARDDATA
    operation: close
    condition: io-error
inputs:
  program: CBACT02C
expected:
  return_code: null
  messages:
  - START OF EXECUTION OF PROGRAM CBACT02C
