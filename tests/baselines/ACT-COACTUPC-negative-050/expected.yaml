# Derived baseline of scenario ACT-COACTUPC-negative-050 (capture_platform:
# derived), authored from the app/ source and never observed: no TPE region
# runs in CI. Open until a UniKix run of the app/ build is imported:
# GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012 (online-only
# copybooks such as CSUTLDPY and CSUTLDWY).
# Steps 1-3: USER0001 signs on, option 2 XCTLs to COACTUPC, and ENTER with
# account 00000000001 shows the fetched account and customer with the change
# prompt [app/cbl/COACTUPC.cbl:2787-2865,2955-2981].
# Step 4: 50 over RISDAY makes ACUP-NEW-REISSUE-DATE 20250550, a change, so
# 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and edits the fields in order;
# Account Status, Open Date, Credit Limit, Expiry Date and Cash Credit Limit
# pass on their fetched values, so the message is still off when the Reissue
# Date edit runs. In EDIT-DAY '50' passes TEST-NUMVAL but fails WS-VALID-DAY
# (1 through 31), which composes TRIM('Reissue Date') ':day must be a number
# between 1 and 31.' (51 characters) into WS-RETURN-MSG; the date flags are
# not all valid, so EDIT-DAY-MONTH-YEAR leaves for EDIT-DATE-CCYYMMDD-EXIT,
# CSUTLDTC is not called, and no later edit can replace the message
# [app/cbl/COACTUPC.cbl:1470,1503-1507]
# [app/cpy/CSUTLDPY.cpy:150-207,274-278] [app/cpy/CSUTLDWY.cpy:25-29].
# 2000-DECIDE-ACTION continues, so nothing is rewritten; 3203 shows the
# reissue day as typed, 3250 sets PROMPT-FOR-CHANGES and moves the message to
# ERRMSG, and 3390 brightens FKEY12 because a change was made while FKEY05
# stays dark; the red RISDAY and the cursor on it are attributes, not captured
# field values [app/cbl/COACTUPC.cbl:2596-2597,2918-2920,2955-2982,3566-3581].
# This pins the app/ text: the UniKix CSUTLDPY drops TRIM, so its copy would
# show 'Reissue Date' padded to 25 bytes before the colon (GAP-DOC-024); such
# a record is UniKix-copy behavior and never replaces this file.
# Screen values are full BMS width with trailing spaces kept (ERRMSG 78,
# INFOMSG 45), because screens compare exactly. CURDATE and CURTIME come from
# the region clock, which no confirmed command sets (GAP-MIS-015), so they
# keep the scenario's matchers. file_state holds the records as the
# preconditions materialize them, decoded through CVACT01Y and CVCUS01Y.
