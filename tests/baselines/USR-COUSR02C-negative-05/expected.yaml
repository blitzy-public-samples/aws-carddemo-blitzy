# Derived baseline of scenario USR-COUSR02C-negative-05 (capture_platform:
# derived): ADMIN001 fetches the invented user TESTU002 on the COUSR02 update
# screen, erases the password and presses PF5. Authored from the source, never
# captured: app/cbl/COUSR02C.cbl:122-123,177-213 (UPDATE-USER-INFO passes the
# user id, first and last name tests, finds PASSWDI SPACES OR LOW-VALUES, sets
# WS-ERR-FLG and sends 'Password can NOT be empty...'; the User Type test is
# not reached) and app/cbl/COUSR02C.cbl:215-245 (with the error flag on,
# neither the READ UPDATE nor the REWRITE runs), with app/cbl/COUSR02C.cbl:
# 84-105,143-172,266-339 for the first entry, the fetch, the send and the
# header, app/cbl/COADM01C.cbl:115-145 for option 3 and app/bms/COUSR02.bms.
# Open until a UniKix run is imported: GAP-INF-004 (derived USR end-to-end
# baselines) and GAP-INF-012 (online-only copybooks).
# One screen per step, the one shown after the step's AID. Values are full BMS
# field width with their trailing spaces: ERRMSG is the 78-byte ERRMSGO that
# WS-MESSAGE X(80) is moved to. COUSR2AO redefines COUSR2AI, so the last
# screen echoes the user id, names and type as received. PASSWD is
# ATTRB=(DRK,FSET,UNPROT) and is not asserted. CURDATE and CURTIME come from
# the region clock, which UniKix cannot fix, hence the matchers.
# The scenario names no expected.messages, because ERRMSG is asserted on every
# screen. file_state: USRSEC unchanged, the ten fixture users and TESTU002 in
# key order. SEC-USR-PWD PASSWORD is the documented demo password of the
# fixture data [README.md:157-158] and TESTPWD2 is invented test data; neither
# is a secret, and replacing either would make the unchanged file fail.
file_state:
  USRSEC:
    records:
    - SEC-USR-FILLER: '                       '
      SEC-USR-FNAME: 'MARGARET            '
      SEC-USR-ID: ADMIN001
      SEC-USR-LNAME: 'GOLD                '
      SEC-USR-PWD: PASSWORD
      SEC-USR-TYPE: A
    - SEC-USR-FILLER: '                       '
