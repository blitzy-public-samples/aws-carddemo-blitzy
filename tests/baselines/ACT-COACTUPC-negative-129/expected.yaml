# Derived baseline of scenario ACT-COACTUPC-negative-129 (capture_platform:
# derived), authored from the app/ source and never observed: no TPE region
# runs in CI. Open until a UniKix run of the app/ build is imported:
# GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012 (online-only
# copybooks such as CSUTLDPY, CSUTLDWY and CSSETATY).
# Steps 1-3: USER0001 signs on, option 2 XCTLs to COACTUPC, and ENTER with
# account 00000000001 shows the fetched account and customer with the change
# prompt [app/cbl/COACTUPC.cbl:2787-2865,2955-2981].
# Step 4: the Q typed over ACSPFLG reaches ACUP-NEW-CUST-PRI-HOLDER-IND
# [app/cbl/COACTUPC.cbl:1417-1424]; 1205-COMPARE-OLD-NEW finds it differs
# from the fetched Y, so 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and
# edits the fields in order, every edit before Primary Card Holder passing on
# the fetched values; 1220-EDIT-YESNO finds Q supplied but neither Y nor N
# and, the message being still off, composes TRIM('Primary Card Holder')
# ' must be Y or N.' (35 characters) into WS-RETURN-MSG; the state/zip cross
# edit that follows passes for NC and 27601 and could not replace the message
# [app/cbl/COACTUPC.cbl:76-78,1460-1669,1763-1766,1856-1894,2536-2558].
# 2000-DECIDE-ACTION continues, so nothing is rewritten; 3203 shows the
# received values, Q included; 3250 sets PROMPT-FOR-CHANGES and moves the
# message to ERRMSG; CSSETATY colours ACSPFLG red and moves no '*', the
# indicator not being blank; 3390 brightens FKEY12 and leaves FKEY05 dark
# [app/cbl/COACTUPC.cbl:2562-2621,2870-2981,3420-3430,3566-3584]
# [app/cpy/CSSETATY.cpy:17-27].
# This pins the app/ text: the UniKix COACTUPC drops TRIM from the field name,
# so its copy would show 'Primary Card Holder' padded to 25 bytes before the
# suffix (GAP-DOC-022); such a record is UniKix-copy behavior and never
# replaces this file.
# Screen values are full BMS width with trailing spaces kept (ERRMSG 78,
# INFOMSG 45, ACSPFLG 1), because screens compare exactly. CURDATE and CURTIME
# come from the region clock, so they are matchers. file_state holds the
# records as the preconditions materialize them, decoded through CVACT01Y and
# CVCUS01Y, unchanged because no REWRITE runs.
file_state:
  ACCTDATA:
    contains:
    - ACCT-ACTIVE-STATUS: Y
      ACCT-CASH-CREDIT-LIMIT: '1020.00'
      ACCT-CREDIT-LIMIT: '2020.00'
