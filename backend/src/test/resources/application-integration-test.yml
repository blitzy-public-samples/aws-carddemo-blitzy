# Integration test configuration for AccountIntegrationTest
# Uses Testcontainers PostgreSQL for integration testing

spring:
  application:
    name: carddemo-integration-test
  
  # Disable security auto-configuration for integration tests
  # This prevents SecurityConfig from loading, which means no JWT authentication required
  # JwtAuthenticationFilter is NOT a @Component, so it won't be auto-registered
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
  
  # JPA configuration for PostgreSQL (via Testcontainers)
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  
  # Disable Flyway for tests (use Hibernate auto-DDL instead)
  flyway:
    enabled: false
  
  # Enable batch schema initialization
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

# Server configuration
server:
  port: 0  # Random port for tests
  servlet:
    context-path: ""  # No context path for tests (controllers already have /api in @RequestMapping)

# JWT configuration for tests
carddemo:
  security:
    jwt:
      # Base64-encoded test secret key (minimum 256 bits for HMAC-SHA256)
      secret: dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtYXV0aGVudGljYXRpb24tdGVzdGluZy0yNTYtYml0cw==
      expiration: 3600000  # 1 hour in milliseconds
  batch:
    chunk-size: 100  # Smaller chunk size for tests

# Logging configuration
logging:
  level:
    root: WARN
    com.carddemo: DEBUG
    org.springframework: WARN
    org.hibernate: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
