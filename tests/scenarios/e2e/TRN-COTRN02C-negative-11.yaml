# Add Transaction with the amount left empty. One of the TRN-COTRN02C
# empty-field scenarios: each enters the valid field set of the TRN-COTRN02C
# scenarios with one data field erased.
#
# Steps 1-2 reach the empty Add Transaction screen: USER0001 (type U) signs on
# through CC00 and is routed to COMEN01C; option 8 is 'Transaction Add',
# program COTRN02C, and COMEN01C resets the program context and transfers
# control to it [app/cbl/COSGN00C.cbl:230-237] [app/cbl/COMEN01C.cbl:115-156]
# [app/cpy/COMEN02Y.cpy:67-72]. COTRN02C, not re-entered and with no
# transaction selected, sets the re-enter flag and sends COTRN02 with a blank
# message line, returning TRANSID CT02 [app/cbl/COTRN02C.cbl:115-130,516-534].
#
# Step 3 enters every field of the valid set except the amount, which the
# empty value erases, and presses ENTER under CT02:
# - Acct # is blank, so VALIDATE-INPUT-KEY-FIELDS takes the card branch: card
#   0500024453765740 is numeric, goes back through WS-CARD-NUM-N PIC 9(16)
#   unchanged, and READ CCXREF by card is NORMAL; it is record 1 of the
#   CARDXREF fixture, so XREF-ACCT-ID 00000000050 is moved to ACTIDIN
#   [app/cbl/COTRN02C.cbl:193-230,609-637].
# - WS-ERR-FLG is still off, so VALIDATE-INPUT-DATA-FIELDS keeps the received
#   values. Its first EVALUATE tests the fields in screen order: type, category,
#   source and description are supplied, and the fifth WHEN fires on
#   TRNAMTI = SPACES OR LOW-VALUES. It sets WS-ERR-FLG, moves 'Amount can NOT
#   be empty...' to WS-MESSAGE and the cursor to the amount, and performs
#   SEND-TRNADD-SCREEN [app/cbl/COTRN02C.cbl:235-281].
# - SEND-TRNADD-SCREEN rebuilds the header, moves the message to ERRMSG, sends
#   COTRN02 with ERASE and ends the task with RETURN TRANSID CT02
#   [app/cbl/COTRN02C.cbl:516-571]. The later edits, the CONFIRM test and
#   ADD-TRANSACTION are never reached, so TRANSACT is neither browsed nor
#   written and keeps its 300 fixture records.
#
# Expected values are derived from the source (no TPE region runs in CI):
# - COTRN2AO redefines COTRN2AI [app/cpy-bms/COTRN02.CPY:145], so the fields
#   come back as received, padded with blanks to their BMS lengths, with
#   ACTIDIN and CARDNIN as the key validation moved them. The erased amount
#   shows as 12 blanks. CONFIRM was not entered and is not asserted.
# - ERRMSG is the 78-byte ERRMSGO: the 26-character message followed by
#   spaces from the 80-byte WS-MESSAGE; comparisons never trim.
# - CURDATE and CURTIME come from the region clock, so they are matchers and
#   the clock is relative.
id: TRN-COTRN02C-negative-11
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 8 (Transaction Add) and submits
  COTRN02 for repository card 0500024453765740 with every field of a valid
  transaction filled except the amount. COTRN02C sends COTRN02 again with
  'Amount can NOT be empty...' in ERRMSG, account 00000000050 looked up from
  the card and the entered values kept, and writes no TRANSACT record.
# Primary item first, then the program, the maps asserted, the transaction step
# 3 runs under, the CSD file COTRN02C reads, and the online-only copybooks it
# copies. Sign-on and the menu (CC00, CM00, COSGN00, USRSEC, the option-8
# navigation) are verified by the SEC and MNU scenarios; TRANSACT is never
# opened on this path, and the batch record copybooks and data files are
# verified at the lowest level that executes them.
inventory_ids:
- INV-TRN-040  # COTRN02C message 'Amount can NOT be empty...' (rule)
- INV-TRN-003  # COTRN02C program
- INV-MNU-003  # COMEN01 map, where option 8 is entered
- INV-TRN-006  # COTRN02 map, the add screen of steps 2 and 3
- INV-CFG-022  # CT02 transaction, under which COTRN02C receives the add
- INV-CFG-004  # CCXREF CSD file, read by card number
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA carrying the program context
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the screen date and time
- INV-LAY-008  # CSMSG01Y copybook, copied by COTRN02C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-007  # TRN end-to-end baselines derived, never observed on a TPE region
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    # CARDXREF is the region's CCXREF file (and the CXACAIX path); USRSEC holds
    # the demo users. TRANSACT is a built dataset with no repository data of its
    # own, so its base is the 350-byte DALYTRAN it is built from, as for every
    # online TRN scenario.
    CARDXREF: {base: CARDXREF}
    TRANSACT: {base: DALYTRAN}
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '8'
  # ACTIDIN is left blank, so the card number selects the cross-reference; the
  # empty value erases the amount field.
  - aid: ENTER
    '@map': COTRN02
    fields:
      CARDNIN: '0500024453765740'
      TTYPCD: '01'
      TCATCD: '0001'
      TRNSRC: 'POS TERM'
      TDESC: 'Test purchase'
      TRNAMT: ''
      TORIGDT: '2022-07-01'
      TPROCDT: '2022-07-01'
      MID: '800000001'
      MNAME: 'Test Merchant'
      MCITY: 'Testville'
      MZIP: '27601'
expected:
  screens:
  # One entry per step, each the screen the step ends on.
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    OPTN008: '08. Transaction Add                     '
    ERRMSG: '                                                                              '
  - '@map': COTRN02
    TRNNAME: CT02
    PGMNAME: COTRN02C
    ERRMSG: '                                                                              '
  - '@map': COTRN02
    TRNNAME: CT02
    PGMNAME: COTRN02C
    TITLE01: '      AWS Mainframe Modernization       '
    TITLE02: '              CardDemo                  '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    ACTIDIN: '00000000050'
    CARDNIN: '0500024453765740'
    TTYPCD: '01'
    TCATCD: '0001'
    TRNSRC: 'POS TERM  '
    TDESC: 'Test purchase                                               '
    TRNAMT: '            '
    TORIGDT: '2022-07-01'
    TPROCDT: '2022-07-01'
    MID: '800000001'
    MNAME: 'Test Merchant                 '
    MCITY: 'Testville                '
    MZIP: '27601     '
    ERRMSG: 'Amount can NOT be empty...                                                    '
  # The ERRMSG of each step: the menu and the empty add screen carry none.
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'Amount can NOT be empty...                                                    '
  file_state:
    # Nothing is written: TRANSACT keeps the 300 fixture records, and the
    # highest of them, the record an add would read back, is unchanged.
    TRANSACT:
      count: 300
      contains:
      - TRAN-ID: '0000000996722787'
        TRAN-TYPE-CD: '01'
        TRAN-CAT-CD: '1'
        TRAN-SOURCE: 'POS TERM  '
        TRAN-DESC: 'Purchase at Kilback LLC                                                                             '
        TRAN-AMT: '603.22'
        TRAN-MERCHANT-ID: '800000000'
        TRAN-MERCHANT-NAME: 'Kilback LLC                                       '
        TRAN-MERCHANT-CITY: 'Cummeratamouth                                    '
        TRAN-MERCHANT-ZIP: '53200-7529'
        TRAN-CARD-NUM: '3260763612337560'
        TRAN-ORIG-TS: '2022-06-10 19:27:53.000000'
        TRAN-PROC-TS: '                          '
