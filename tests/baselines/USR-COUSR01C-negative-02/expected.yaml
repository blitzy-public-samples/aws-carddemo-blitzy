# Derived from source (capture_platform: derived), never observed. ADMIN001
# signs on to the admin menu COADM01 [app/cbl/COSGN00C.cbl:221-240]; option 2
# sends the empty add-user map COUSR01 [app/cbl/COUSR01C.cbl:73-87,184-196];
# the ENTER with the first name blank is refused by the first WHEN of
# PROCESS-ENTER-KEY, so WRITE-USER-SEC-FILE never runs
# [app/cbl/COUSR01C.cbl:115-123,153-160]. COUSR1AO redefines COUSR1AI, so the
# last name, user id and type just received are sent back, and ERRMSG is
# WS-MESSAGE X(80) cut to ERRMSGO X(78). Screen values are whole BMS fields
# with trailing spaces kept. USRSEC is the fixture's 10 users, unchanged,
# decoded with CSUSR01Y/SEC-USER-DATA in key order, with no TESTU001 record.
# SEC-USR-PWD holds the fixture's documented demo password PASSWORD: it is
# repository data, not a credential, and is kept so each record compares whole.
file_state:
  USRSEC:
  - SEC-USR-FILLER: '                       '
    SEC-USR-FNAME: 'MARGARET            '
    SEC-USR-ID: ADMIN001
    SEC-USR-LNAME: 'GOLD                '
    SEC-USR-PWD: PASSWORD
    SEC-USR-TYPE: A
