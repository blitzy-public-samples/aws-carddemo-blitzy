# Derived from source (capture_platform: derived), never observed. ADMIN001
# reaches COADM01, option 1 lists the ten USRSEC users and the look-ahead read
# ends the file, so PF8 finds NEXT-PAGE-NO and re-sends COUSR00 without ERASE
# with 'You are already at the bottom of the page...'
# [app/cbl/COUSR00C.cbl:110-131,260-331,522-581,631-640]. Every list field is
# FSET, so the rows and PAGENUM come back through RECEIVE and stay on the PF8
# screen. Fields are at full BMS width with trailing spaces kept (ERRMSG 78);
# CURDATE and CURTIME come from the region clock, so they are matchers.
screens:
- '@map': COADM01
  PGMNAME: COADM01C
  TRNNAME: CA00
- '@map': COUSR00
  ERRMSG: 'You have reached the bottom of the page...                                    '
  PAGENUM: '00000001'
  PGMNAME: COUSR00C
  TRNNAME: CU00
  USRID01: ADMIN001
  USRID02: ADMIN002
  USRID03: ADMIN003
  USRID04: ADMIN004
  USRID05: ADMIN005
  USRID06: USER0001
  USRID07: USER0002
  USRID08: USER0003
  USRID09: USER0004
  USRID10: USER0005
  USRIDIN: '        '
- '@map': COUSR00
