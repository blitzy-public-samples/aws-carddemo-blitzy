# Derived baseline of scenario ACT-COACTUPC-boundary-05 (capture_platform:
# derived), authored from the app/ source and never observed: no TPE region
# runs in CI. Open until a UniKix run of the app/ build is imported:
# GAP-INF-005 (derived ACT end-to-end baselines) and GAP-INF-012 (online-only
# copybooks such as CSUTLDPY, CSUTLDWY and CSSETATY).
# Open Date month boundary from below: month 00 is refused.
# Steps 1-3: USER0001 signs on, option 2 XCTLs to COACTUPC, which sends the
# search screen with the search-key prompt, and ENTER with account
# 00000000001 shows the fetched account and customer with the change prompt
# [app/cbl/COACTUPC.cbl:2787-2865,2955-2981].
# Step 4: 1100-RECEIVE-MAP moves OPNMONI '00' to ACUP-NEW-OPEN-MON
# [app/cbl/COACTUPC.cbl:1151-1156]; the open date 20140020 differs from the
# fetched 20141120, so 1200-EDIT-MAP-INPUTS sets ACUP-CHANGES-NOT-OK and edits
# the fields in order [app/cbl/COACTUPC.cbl:1460-1482]. Account Status 'Y'
# passes 1220-EDIT-YESNO; then 'Open Date' goes to WS-EDIT-VARIABLE-NAME and
# EDIT-DATE-CCYYMMDD runs THRU its exit. Year 2014 passes EDIT-YEAR-CCYY
# (THIS-CENTURY 20). In EDIT-MONTH '00' is supplied, but WS-EDIT-DATE-MM-N is
# 0, outside WS-VALID-MONTH (1 THROUGH 12), so with WS-RETURN-MSG still off
# TRIM('Open Date') ': Month must be a number between 1 and 12.' (51
# characters) is STRINGed into it [app/cpy/CSUTLDPY.cpy:25-124]
# [app/cpy/CSUTLDWY.cpy:4-20]. Day 20 is valid, and EDIT-DAY-MONTH-YEAR exits
# before EDIT-DATE-LE because the date flags are invalid, so CSUTLDTC is not
# called [app/cpy/CSUTLDPY.cpy:150-282]. Every later STRING is guarded by
# WS-RETURN-MSG-OFF, so no later edit replaces the message.
# INPUT-ERROR keeps ACUP-CHANGES-NOT-OK, which 2000-DECIDE-ACTION leaves as it
# is, so nothing is rewritten [app/cbl/COACTUPC.cbl:1671-1675,2596-2597].
# 3203-SHOW-UPDATED-VALUES redisplays the received values (OPNMON 00, the
# amounts re-edited through +ZZZ,ZZZ,ZZZ.99), 3250 sets PROMPT-FOR-CHANGES and
# moves WS-INFO-MSG and WS-RETURN-MSG to INFOMSG and ERRMSG, and 3390 brightens
# FKEY12 because a change was made while FKEY05 stays dark
# [app/cbl/COACTUPC.cbl:2718-2720,2869-2983,3573-3581]. The red colour of
# OPNMON (CSSETATY) and the cursor on it are attributes, not captured values
# [app/cbl/COACTUPC.cbl:3024-3027,3219-3223].
# This pins the app/ text: the UniKix CSUTLDPY replaces TEST-NUMVAL with IS
# NUMERIC and drops TRIM (GAP-DOC-024), so a UniKix record of this scenario is
# UniKix-copy behavior and never replaces this file.
# Screen values are full BMS width with trailing spaces kept (ERRMSG 78,
# INFOMSG 45), because screens compare exactly. CURDATE and CURTIME come from
# the region clock, which no confirmed command sets (GAP-MIS-015), so they keep
# the scenario's matchers. messages holds the ERRMSG of each step. file_state
# holds the records as the preconditions materialize them, decoded through
# CVACT01Y and CVCUS01Y.
