# The count boundary of CBTRN01C: DALYTRAN holds a single record. The main loop
# displays the record and verifies its card through CARDXREF and ACCTDATA. The
# next READ sets end of file, but the loop body still moves DALYTRAN-CARD-NUM
# and runs 2000-LOOKUP-XREF and 3000-READ-ACCOUNT before the PERFORM UNTIL test
# ends it [app/cbl/CBTRN01C.cbl:164-186]. READ ... INTO moves nothing at end of
# file, so the second pass verifies the same card again, without the record
# line. The duplicated verification is pinned as observed, never fixed
# (GAP-DEF-006).
#
# The record is invented: its DALYTRAN-ID, merchant and description match no
# repository transaction, and DALYTRAN-CARD-NUM is the repository card of
# account 00000000001 and customer 000000001 [app/data/ASCII/cardxref.txt:49].
# DALYTRAN is synthetic, so no dailytran.txt item is listed. The record line of
# expected.messages is the whole 350-byte DALYTRAN-RECORD as DISPLAY writes it:
# DALYTRAN-AMT 10.00 as the overpunch-signed 0000000100{, and the blank
# DALYTRAN-PROC-TS and FILLER as 46 trailing spaces, which are significant.
# TRANSACT is opened INPUT but never read, so it is an empty KSDS.
id: TRN-CBTRN01C-boundary-01
level: unit
type: boundary
description: >-
  CBTRN01C reads a single daily transaction: it displays the record and the
  successful XREF and account verification of its card, then, after end of
  file, displays the same verification a second time without a record line,
  and ends with return code 0.
