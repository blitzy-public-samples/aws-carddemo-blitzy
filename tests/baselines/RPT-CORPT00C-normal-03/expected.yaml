# Derived baseline (capture_platform: derived in manifest.yaml) for
# RPT-CORPT00C-normal-03, the Custom report for 2022-06-01 to 2022-06-30.
# Authored from the source because only unikix can run the scenario; tagged
# inferred-not-observed (GAP-INF-009, GAP-INF-012, GAP-MIS-017, GAP-INF-001)
# and replaced only by `report.py --import-unikix` on eligible evidence, never
# edited to match a run.
#
# One screen per step, the screen shown after the step's AID; messages holds
# each step's ERRMSG. Text is the whole BMS field, trailing spaces kept.
# - Step 1: USER0001 (type U) signs on and COSGN00C XCTLs to COMEN01C, which
#   sends COMEN01 under CM00 [app/cbl/COSGN00C.cbl:222-240]
#   [app/cbl/COMEN01C.cbl:75-90].
# - Step 2: option 9 XCTLs to CORPT00C [app/cpy/COMEN02Y.cpy:74-78]
#   [app/cbl/COMEN01C.cbl:115-156]. Its first entry sends CORPT00 under CR00
#   with the COTTL01Y titles and a blank ERRMSG [app/cbl/CORPT00C.cbl:163-181,
#   556-580,609-628] [app/cpy/COTTL01Y.cpy:17-22].
# - Step 3: CUSTOM with 06/01/2022 to 06/30/2022 and CONFIRM Y. No date part
#   is empty, NUMVAL-C gives each part back unchanged and the month and day
#   checks pass [app/cbl/CORPT00C.cbl:256-379]. Both dates pass CSUTLDTC with
#   mask YYYY-MM-DD at severity '0000', which is inferred, not observed
#   (GAP-INF-001) [app/cbl/CORPT00C.cbl:381-426]. They become the PARM dates
#   of the job, the report name is 'Custom' [app/cbl/CORPT00C.cbl:429-436],
#   and the JOB-LINES loop stops on '/*EOF' but writes it first, so JOBS
#   receives 17 records of 80 bytes [app/cbl/CORPT00C.cbl:81-127,462-523].
#   INITIALIZE-ALL-FIELDS blanks the input fields and CONFIRM, and ERRMSG is
#   'Custom' plus ' report submitted for printing ...'
#   [app/cbl/CORPT00C.cbl:445-456,633-646].
#
# The dates are entered, not taken from the clock, so every JOBS record is an
# exact value: records 11 and 12 are FILLER-1 (X(18)/X(10)/X(52)) and
# FILLER-2 (X(16)/X(10)/X(54)), record 15 is FILLER-3 (X(10), space, X(10),
# X(59)). Only the screen CURDATE and CURTIME come from the region clock, so
# they are matchers.
file_state:
  '@TDQ:JOBS':
    records:
    - '//TRNRPT00 JOB ''TRAN REPORT'',CLASS=A,MSGCLASS=0,                                '
    - '// NOTIFY=&SYSUID                                                               '
    - '//*                                                                             '
    - '//JOBLIB JCLLIB ORDER=(''AWS.M2.CARDDEMO.PROC'')                                  '
    - '//*                                                                             '
    - '//STEP10 EXEC PROC=TRANREPT                                                     '
    - '//*                                                                             '
    - '//STEP05R.SYMNAMES DD *                                                         '
    - 'TRAN-CARD-NUM,263,16,ZD                                                         '
    - 'TRAN-PROC-DT,305,10,CH                                                          '
    - 'PARM-START-DATE,C''2022-06-01''                                                   '
    - 'PARM-END-DATE,C''2022-06-30''                                                     '
    - '/*                                                                              '
    - '//STEP10R.DATEPARM DD *                                                         '
    - '2022-06-01 2022-06-30                                                           '
    - '/*                                                                              '
    - '/*EOF                                                                           '
messages:
- '                                                                              '
- '                                                                              '
- 'Custom report submitted for printing ...                                      '
screens:
- '@map': COMEN01
  PGMNAME: COMEN01C
  TRNNAME: CM00
- '@map': CORPT00
  CURDATE:
    format: '%m/%d/%y'
    match: run-date
  CURTIME:
    match: run-time
  ERRMSG: '                                                                              '
  PGMNAME: CORPT00C
  TITLE01: '      AWS Mainframe Modernization       '
  TITLE02: '              CardDemo                  '
  TRNNAME: CR00
- '@map': CORPT00
  CONFIRM: ' '
  CURDATE:
    format: '%m/%d/%y'
    match: run-date
  CURTIME:
    match: run-time
  CUSTOM: ' '
  EDTDD: '  '
  EDTMM: '  '
  EDTYYYY: '    '
  ERRMSG: 'Custom report submitted for printing ...                                      '
  MONTHLY: ' '
  PGMNAME: CORPT00C
  SDTDD: '  '
  SDTMM: '  '
  SDTYYYY: '    '
  TITLE01: '      AWS Mainframe Modernization       '
  TITLE02: '              CardDemo                  '
  TRNNAME: CR00
  YEARLY: ' '
