# Derived baseline, inferred-not-observed (GAP-INF-007, GAP-INF-012): authored
# from the source, never captured. USER0001 reaches COMEN01, option 8 transfers
# to COTRN02C, whose first entry sends COTRN02 with a blank message line; PF7
# then reaches WHEN OTHER, which moves CCDA-MSG-INVALID-KEY to WS-MESSAGE and
# sends COTRN02 again with its header rebuilt, reading and writing no file
# [app/cbl/COMEN01C.cbl:87-90,145-155] [app/cbl/COTRN02C.cbl:107-152,516-571]
# [app/cpy/CSMSG01Y.cpy:20-21]. ERRMSG is the full 78-byte field of both maps
# [app/bms/COMEN01.bms:154-157] [app/bms/COTRN02.bms:293-296]: blank, or the
# 40-character message and 38 trailing spaces, as Result.messages carries it
# for each step. CURDATE and CURTIME are the region clock, so they are matchers.
messages:
- '                                                                              '
- '                                                                              '
- 'Invalid key pressed. Please see below...                                      '
screens:
- '@map': COMEN01
  ERRMSG: '                                                                              '
  PGMNAME: COMEN01C
  TRNNAME: CM00
- '@map': COTRN02
  ERRMSG: '                                                                              '
  PGMNAME: COTRN02C
  TRNNAME: CT02
- '@map': COTRN02
  CURDATE:
    format: '%m/%d/%y'
    match: run-date
  CURTIME:
    match: run-time
  ERRMSG: 'Invalid key pressed. Please see below...                                      '
  PGMNAME: COTRN02C
  TITLE01: '      AWS Mainframe Modernization       '
  TITLE02: '              CardDemo                  '
  TRNNAME: CT02
