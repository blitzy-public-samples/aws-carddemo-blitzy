      labels:
        app: carddemo
        component: batch
        job-type: transaction-processing
    spec:
      # Job execution configuration
      parallelism: 1
      completions: 1
      backoffLimit: 3
      
      # Active deadline: 3 hours (within 4-hour batch window)
      activeDeadlineSeconds: 10800
      
      template:
        metadata:
          labels:
            app: carddemo
            component: batch
            job-type: transaction-processing
        spec:
          restartPolicy: OnFailure
          
          containers:
          - name: transaction-processing
            image: carddemo-spring:1.0.0
            imagePullPolicy: IfNotPresent
            
            # Command override to execute specific Spring Batch job
            command:
              - "java"
              - "-jar"
              - "/app/app.jar"
              - "--spring.batch.job.names=DailyTransactionProcessingJob"
            
            # Environment variable specifying which batch job to run
            env:
            - name: SPRING_BATCH_JOB
              value: "DailyTransactionProcessingJob"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: JAVA_OPTS
              value: "-Xms1024m -Xmx1792m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
            
            # Load configuration from ConfigMap and secrets
            envFrom:
            - configMapRef:
                name: carddemo-config
            - secretRef:
                name: carddemo-secrets
            
            # Resource limits for batch processing
            # Higher limits for transaction volume processing
            resources:
              limits:
                cpu: "2"
                memory: "2Gi"
              requests:
                cpu: "1"
                memory: "1Gi"
            
            # Volume mounts for batch processing logs
            volumeMounts:
            - name: batch-logs
