---
# ==========================================================================
# k8s/deployment-user-service.yaml
# --------------------------------------------------------------------------
# Kubernetes Deployment for the CardDemo user-service (Spring Boot).
#
# :purpose: Runs the administrator-only user-management microservice that
#           re-platforms the legacy COBOL programs COUSR00C, COUSR01C,
#           COUSR02C and COUSR03C (CICS tran-ids CU00-CU03). It owns the
#           SecurityUser table in PostgreSQL and serves user CRUD
#           endpoints consumed through the api-gateway.
# :output:  A Deployment named ``user-service`` scheduling one pod that
#           serves HTTP on container port 8080 (named ``http``) and is
#           selected by ``service-user-service.yaml`` via
#           ``app: user-service``.
# :notes:   The image is built by ``user-service/Dockerfile`` FROM
#           ``eclipse-temurin:21-jre`` (AAP 0.5.1). Runtime config and
#           datasource credentials are injected via ``envFrom`` from the
#           ``carddemo-config`` ConfigMap and the ``carddemo-user-service-db``
#           Secret. Actuator startup/liveness/readiness probes satisfy
#           the Observability rule (AAP 0.7.5). The health-probe groups
#           are enabled by the ConfigMap key
#           ``MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED``.
# ==========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: carddemo
    app.kubernetes.io/component: backend
spec:
  # Single replica for the reference deployment. The service is stateless
  # (session state lives in Redis via Spring Session), so it can be scaled
  # horizontally without changes to this manifest.
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        app.kubernetes.io/name: user-service
        app.kubernetes.io/part-of: carddemo
        app.kubernetes.io/component: backend
    spec:
      # Pod-level runtime hardening: run as a non-root user with a
      # default seccomp profile and no auto-mounted ServiceAccount token
      # (these services never call the Kubernetes API).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      # Startup ordering gate: the shared CardDemo schema is provisioned by the
      # SINGLE Flyway migration owner, batch-service (see its application.yml and
      # docs/decision-log.md). This service runs with spring.flyway.enabled=false
      # and Hibernate ddl-auto=validate, so it can only start once that schema
      # exists; without the gate the pod crash-loops on
      # "Schema validation: missing table". The init container blocks until the
      # owner reports READY through its Actuator readiness group, using the same
      # bash /dev/tcp probe idiom as the Compose healthcheck (the eclipse-temurin
      # base image ships neither curl nor wget).
      initContainers:
        - name: await-schema
          image: eclipse-temurin:21-jre
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Bounded like every other container in this repository, init containers
          # included: in a namespace with no LimitRange an unbounded container is
          # admitted with no QoS guarantee and can be scheduled anywhere. The figures
          # suit what this container does - one bash loop issuing a TCP readiness
          # probe every 5 s - and were verified by running the same image and command
          # under exactly these limits.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          command:
            - bash
            - -c
            - >-
              until exec 3<>/dev/tcp/batch-service/8080 2>/dev/null
              && printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: batch-service\r\nConnection: close\r\n\r\n' >&3
              && grep -q '"status":"UP"' <&3;
              do echo 'waiting for the schema owner (batch-service) to become ready'; sleep 5; done;
              echo 'schema owner ready'
      containers:
        - name: user-service
          # Built by user-service/Dockerfile (FROM eclipse-temurin:21-jre).
          # Produced by `docker compose build user-service` from user-service/Dockerfile
          # (docker-compose.yml carries a matching `image:` key with these exact
          # registry/name/tag defaults), so this reference resolves to an artifact the
          # repository builds - no undocumented tag-and-push step.
          # Override the registry or tag for a private registry with
          # CARDDEMO_IMAGE_REGISTRY / CARDDEMO_IMAGE_TAG at build time.
          image: carddemo/user-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          # Runtime configuration and datasource credentials are injected
          # from the shared ConfigMap and Secret (see k8s/configmap.yaml
          # and k8s/secret.yaml).
          # Container-level runtime hardening: drop every Linux
          # capability, forbid privilege escalation, and run on a read-only
          # root filesystem (writable scratch is the mounted tmp emptyDir).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: carddemo-config
            # Per-service least-privilege database role: each service
            # authenticates with its own DB principal, not a shared owner.
            - secretRef:
                name: carddemo-user-service-db
            # Shared Redis AUTH secret for externalized Spring Session.
            - secretRef:
                name: carddemo-redis-secret
            # Shared AES-256-GCM key for at-rest PII field encryption
            # (carddemo-common CryptoConverter: SSN, government id, EFT account
            # id, CVV). Services fail closed if it is absent.
            - secretRef:
                name: carddemo-pii-key
            # Shared credential of the least-privilege `monitoring` principal
            # guarding /actuator/prometheus and /actuator/metrics. Must
            # match the password Prometheus presents, or every scrape gets 401.
            - secretRef:
                name: carddemo-monitoring-secret
          # `limits.memory` is what the image's JAVA_OPTS percentages resolve
          # against, so this figure - not a JVM flag - is what bounds the heap.
          # Measured working set for the whole nine-service stack under the AAP
          # 150-user load: 462-618 MiB resident per service, so 1Gi is held with
          # headroom.
          # `limits.cpu` is sized from the CPU cost per request measured over that
          # same load: 9.2 ms for the tier as a whole, and 105.5 ms for a sign-on,
          # of which ~72.8 ms is the password encoder alone. Two cores keeps every
          # service at or below half utilisation at the measured request rate, and
          # keeps the JVM's own ergonomics multi-core in every runtime.
          # docker-compose.yml declares the same budget.
          # Measurements and rationale: docs/decision-log.md section 50.
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          # Startup probe gives the JVM/Spring context up to 150s
          # (30 x 5s) to come up before liveness/readiness begin, so a
          # slow cold start is never mistaken for a crash.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            # Explicit timeout. The default timeoutSeconds is 1, so during any
            # datastore blip the aggregate health check — which must wait for the bounded
            # 3s HikariCP / 2s Lettuce dependency timeouts — fails on every attempt and the
            # pod is killed after failureThreshold x periodSeconds. 4s bounds each attempt
            # just above the slowest dependency timeout.
            timeoutSeconds: 4
            failureThreshold: 30
          # Liveness uses the Actuator liveness group; a sustained failure
          # triggers a pod restart.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness uses the Actuator readiness group; failure removes
          # the pod from Service endpoints without restarting it.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      # Writable scratch for the read-only root filesystem. A Spring
      # Boot fat-jar only needs a writable /tmp (Tomcat work dir, JVM temp).
      volumes:
        - name: tmp
          emptyDir: {}
