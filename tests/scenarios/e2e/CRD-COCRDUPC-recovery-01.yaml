# A validated card change cannot be saved because CARDDAT is out of service
# when PF5 asks COCRDUPC to lock the card record for update.
#
# Step 1: USER0001 (type U in the USRSEC fixture) signs on through CC00 and
# COSGN00C XCTLs to the main menu COMEN01C [app/cbl/COSGN00C.cbl:221-240].
# Step 2: option '5' is 'Credit Card Update', program COCRDUPC, user type U
# [app/cpy/COMEN02Y.cpy:49-53]; COMEN01C XCTLs to it with CDEMO-FROM-PROGRAM
# COMEN01C and CDEMO-PGM-CONTEXT 0 [app/cbl/COMEN01C.cbl:146-156]. Entered from
# the menu without CDEMO-PGM-REENTER, COCRDUPC takes the fresh-entry branch: it
# sends COCRDUP with the search-key prompt, sets CDEMO-PGM-REENTER and returns
# with TRANSID CCUP [app/cbl/COCRDUPC.cbl:388-399,502-512,546-558,1138-1144].
# Step 3: ENTER with account 00000000050 and card 0500024453765740, the first
# CARDDATA record. Both filters edit as valid, so 2000-DECIDE-ACTION reads the
# card with the plain READ of 9100-GETCARD-BYACCTCARD, the scenario's first
# CARDDAT request; the card is found, its embossed name is upper-cased into
# CCUP-OLD-CRDNAME and the state becomes CCUP-SHOW-DETAILS ('S')
# [app/cbl/COCRDUPC.cbl:641-661,948-965,1343-1394]. COCRDUP shows the stored
# details with 'Details of selected card shown above' [app/cbl/COCRDUPC.cbl:
# 1107-1112,1145-1146].
# Step 4: ENTER with the new name TEST HOLDER. The fields sent in step 3 carry
# FSET (DFHBMFSE, DFHBMPRF), so the unchanged status and expiry come back as
# shown [app/cbl/COCRDUPC.cbl:1181-1190]. The new card data differs from the
# old, every edit passes (alphabets and spaces, Y, month 03, year 2023), and
# 1200-EDIT-MAP-INPUTS sets CCUP-CHANGES-OK-NOT-CONFIRMED ('N')
# [app/cbl/COCRDUPC.cbl:667-714]. No CARDDAT request is issued. COCRDUP shows
# the new values, protected, with 'Changes validated.Press F5 to save' and the
# F5=Save F12=Cancel keys made bright [app/cbl/COCRDUPC.cbl:1113-1123,
# 1149-1150,1191-1199,1315-1317].
# Step 5: PF5. CSSTRPFY maps it to CCARD-AID-PFK05, which is valid in state 'N'
# [app/cpy/CSSTRPFY.cpy:38-39] [app/cbl/COCRDUPC.cbl:413-424]; the state is
# kept because 1200-EDIT-MAP-INPUTS leaves an unconfirmed change as it is
# [app/cbl/COCRDUPC.cbl:685-693]. 2000-DECIDE-ACTION performs
# 9200-WRITE-PROCESSING, whose READ UPDATE of CARDDAT, the second CARDDAT
# request, answers other than NORMAL with the file closed or disabled. The
# program sets INPUT-ERROR and, the message line being empty,
# COULD-NOT-LOCK-FOR-UPDATE, and skips the REWRITE; 2000-DECIDE-ACTION then
# sets CCUP-CHANGES-OKAYED-LOCK-ERROR ('L') [app/cbl/COCRDUPC.cbl:988-994,
# 1420-1449]. 3250-SETUP-INFOMSG turns that state into INFORM-FAILURE
# [app/cbl/COCRDUPC.cbl:1153-1154,1161-1163], and because CCUP-CHANGES-MADE
# includes 'L' the screen keeps the values just received
# [app/cbl/COCRDUPC.cbl:282-284,1113-1117].
#
# What the screens show, derived from the source:
# - TRNNAME is LIT-THISTRANID CCUP and PGMNAME COCRDUPC on every COCRDUP send,
#   the titles come from COTTL01Y and CURDATE and CURTIME from the region clock
#   through CSDAT01Y, hence the matchers and clock_mode relative
#   [app/cbl/COCRDUPC.cbl:1052-1074].
# - INFOMSG is the 40-byte WS-INFO-MSG and ERRMSG the 75-byte WS-RETURN-MSG
#   moved to the 80-byte field, so both keep their trailing spaces
#   [app/cbl/COCRDUPC.cbl:157,173,1161-1163] [app/bms/COCRDUP.bms:149-157].
# - The card record is 0500024453765740, account 00000000050, CVV 747, name
#   'Aniya Von', expiry 2023-03-09, status Y (app/data/ASCII/carddata.txt,
#   record 1); the screen of step 3 shows the name upper-cased.
# - EXPDAY (DRK) and FKEYSC outside the confirmation step (DRK by default) are
#   dark fields and are not asserted; ACCTSID and the detail fields of the
#   fresh-entry screen go out as LOW-VALUES, and how a 3270 read renders nulls
#   is not a business outcome.
#
# Expected values are derived from the source (GAP-INF-006): no TPE region runs
# in CI. The UniKix copy of COCRDUPC differs from app/ only in the
# alphabets-only name test of 1230-EDIT-NAME (GAP-DOC-023), which TEST HOLDER
# passes either way, and its COCRDUP.bms is the same, so no UniKix-copy gap
# applies to the items listed here.
id: CRD-COCRDUPC-recovery-01
level: e2e
type: recovery
description: >-
  USER0001 signs on, selects main-menu option 5 (Credit Card Update), fetches
  card 0500024453765740 of account 00000000050 and changes the name on the card
  to TEST HOLDER, which COCRDUPC validates. CARDDAT is then taken out of
  service, so the READ UPDATE that PF5 issues to lock the card fails: COCRDUP is
  sent with the changed values, 'Changes unsuccessful. Please try again' as the
  information message and 'Could not lock record for update' as the error
  message, and the card record is left unchanged.
# The recovery message is the primary item, then the program, the maps the
# steps enter on and assert, the transaction under which every COCRDUPC task
# after the first runs, the CSD file the read and the failing lock request
# address, and the online-only copybooks COCRDUPC copies. Sign-on and the menu
# option (CC00, CM00, COSGN00, COSGN00C, COMEN01C, USRSEC) are verified by the
# SEC and MNU scenarios; the screens of steps 2 to 4 and 'Could not lock record
# for update' by their own COCRDUPC scenarios. CSUSR01Y, CVACT02Y, CVCUS01Y and
# the data files are left out: their lowest executing level is a batch
# scenario.
inventory_ids:
- INV-CRD-052  # COCRDUPC message 'Changes unsuccessful. Please try again' (INFORM-FAILURE, recovery)
- INV-CRD-003  # COCRDUPC program
- INV-MNU-003  # COMEN01 map, the main menu option 5 is entered on
- INV-CRD-006  # COCRDUP map, the card update screen the failure is shown on
- INV-CFG-015  # CCUP transaction, under which the PF5 task runs
- INV-CFG-003  # CARDDAT CSD file, read in step 3 and refused to the READ UPDATE of step 5
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context into CCUP
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-008  # CSMSG01Y, copied by COCRDUPC
- INV-LAY-009  # CSMSG02Y, copied by COCRDUPC
- INV-LAY-011  # CSSTRPFY: the AID mapping that turns PF5 into CCARD-AID-PFK05
- INV-LAY-019  # CVCRD01Y: CCARD-AID, CC-ACCT-ID and CC-CARD-NUM
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-006  # card list, view and update (CRD) end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
- GAP-MIS-011  # no confirmed region file control to take CARDDAT out of service
preconditions:
  datasets:
    # COSGN00C reads the sign-on user from USRSEC; CARDDATA holds the 50
    # repository cards, among them the card fetched and the one unloaded after
    # the run.
    USRSEC: {base: USRSEC}
    CARDDATA: {base: CARDDATA}
  parameters:
    clock_mode: relative
  # after: 1 lets the one CARDDAT request before the failing step, the READ of
  # 9100-GETCARD-BYACCTCARD in step 3, succeed. That count is first reached at
  # the start of step 4, so the file goes out of service there; step 4 issues
  # no CARDDAT request, and the first request the fault meets is the READ
  # UPDATE of 9200-WRITE-PROCESSING on PF5. The unikix adapter's default point
  # without `after`, after the sign-on step, would fail the step-3 fetch
  # instead. An adapter without a confirmed region file control raises
  # MissingPrerequisite under GAP-MIS-011.
  faults:
  - target: CARDDAT
    operation: read
    condition: unavailable
    after: 1
# PASSWORD is the README's documented demo password, not a secret: the scenario
# schema accepts no other sign-on password. TEST HOLDER is an invented name.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    fields: {USERID: USER0001, PASSWD: PASSWORD}
    '@map': COSGN00
  - aid: ENTER
    fields: {OPTION: '5'}
    '@map': COMEN01
  - aid: ENTER
    fields: {ACCTSID: '00000000050', CARDSID: '0500024453765740'}
    '@map': COCRDUP
  - aid: ENTER
    fields: {CRDNAME: 'TEST HOLDER'}
    '@map': COCRDUP
  - aid: PF5
    fields: {}
    '@map': COCRDUP
# Screen values are whole fields at their BMS length, trailing spaces kept:
# comparison never trims. ERRMSG is 78 characters on COMEN01 and 80 on COCRDUP,
# INFOMSG 40, CRDNAME 50.
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: CM00
    PGMNAME: COMEN01C
    OPTN005: '05. Credit Card Update                  '
    ERRMSG: '                                                                              '
  - '@map': COCRDUP
    TRNNAME: CCUP
    PGMNAME: COCRDUPC
    TITLE01: '      AWS Mainframe Modernization       '
    TITLE02: '              CardDemo                  '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    INFOMSG: 'Please enter Account and Card Number    '
    ERRMSG: '                                                                                '
  - '@map': COCRDUP
    TRNNAME: CCUP
    PGMNAME: COCRDUPC
    TITLE01: '      AWS Mainframe Modernization       '
    TITLE02: '              CardDemo                  '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    ACCTSID: '00000000050'
    CARDSID: '0500024453765740'
    CRDNAME: 'ANIYA VON                                         '
    CRDSTCD: 'Y'
    EXPMON: '03'
    EXPYEAR: '2023'
    INFOMSG: 'Details of selected card shown above    '
    ERRMSG: '                                                                                '
  - '@map': COCRDUP
    TRNNAME: CCUP
    PGMNAME: COCRDUPC
    TITLE01: '      AWS Mainframe Modernization       '
    TITLE02: '              CardDemo                  '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    ACCTSID: '00000000050'
    CARDSID: '0500024453765740'
    CRDNAME: 'TEST HOLDER                                       '
    CRDSTCD: 'Y'
    EXPMON: '03'
    EXPYEAR: '2023'
    INFOMSG: 'Changes validated.Press F5 to save      '
    ERRMSG: '                                                                                '
    FKEYSC: 'F5=Save F12=Cancel'
  - '@map': COCRDUP
    TRNNAME: CCUP
    PGMNAME: COCRDUPC
    TITLE01: '      AWS Mainframe Modernization       '
    TITLE02: '              CardDemo                  '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    CURTIME: {match: run-time}
    ACCTSID: '00000000050'
    CARDSID: '0500024453765740'
    CRDNAME: 'TEST HOLDER                                       '
    CRDSTCD: 'Y'
    EXPMON: '03'
    EXPYEAR: '2023'
    INFOMSG: 'Changes unsuccessful. Please try again  '
    ERRMSG: 'Could not lock record for update                                                '
  # The ERRMSG value of each step: blank until the failed lock of step 5.
  messages:
  - '                                                                              '
  - '                                                                                '
  - '                                                                                '
  - '                                                                                '
  - 'Could not lock record for update                                                '
  # The failed lock rewrites nothing: unloaded once the file is back in
  # service, CARDDATA holds the 50 fixture cards, the fetched card with its
  # original name, expiry and status.
  file_state:
    CARDDATA:
      count: 50
      contains:
      - CARD-NUM: '0500024453765740'
        CARD-ACCT-ID: '50'
        CARD-CVV-CD: '747'
        CARD-EMBOSSED-NAME: 'Aniya Von                                         '
        CARD-EXPIRAION-DATE: '2023-03-09'
        CARD-ACTIVE-STATUS: 'Y'
