# COACTUPC refuses a date-of-birth month outside 1-12: the "month 1-12"
# predicate of EDIT-MONTH, which the procedure copybook CSUTLDPY contributes,
# for the Date of Birth field [app/cpy/CSUTLDPY.cpy:91-147].
#
# Numbered by inventory order: the month 1-12 item (INV-ACT-133) precedes the
# month-numeric item (INV-ACT-134), so it takes negative-075 and the numeric
# case takes negative-076, as the Open, Expiry and Reissue Date month cases
# (negative-016/-017, -031/-032, -046/-047) are numbered. The input is an
# out-of-range number, as in those month 1-12 cases; a letter such as 'J6'
# reads as 16 through the zoned digit nibbles on EBCDIC and would reach this
# same range check rather than the numeric one.
#
# Steps 1-3 sign on as USER0001, choose main-menu option 2 and fetch account
# 00000000001, as ACT-COACTUPC-alternate-04 does: CXACAIX gives customer
# 000000001, ACCTDAT and CUSTDAT are read without UPDATE, and
# 3202-SHOW-ORIGINAL-VALUES shows the records with 'Update account details
# presented above.'; every editable field is DFHBMFSE (unprotected, MDT on), so
# all of them come back on the next AID [app/cbl/COACTUPC.cbl:2568-2580,
# 2787-2865,3500-3561,3608-3884]. Step 4 types 17 over the birth month (06)
# and presses ENTER.
# - 1100-RECEIVE-MAP moves 17, being neither '*' nor spaces, to
#   ACUP-NEW-CUST-DOB-MON [app/cbl/COACTUPC.cbl:1263-1268].
# - 1205-COMPARE-OLD-NEW sets CHANGE-HAS-OCCURRED at the account test, which
#   is false because its group-id term compares the LOW-VALUES of the blank
#   Account Group with the fetched spaces (TRIM removes spaces only,
#   GAP-DEF-019), and exits before the customer fields are compared: the new
#   birth date 19611708 would differ from the fetched 19610608 as well, but
#   that comparison is not reached. So 1200-EDIT-MAP-INPUTS sets
#   ACUP-CHANGES-NOT-OK and runs the field edits in screen order
#   [app/cbl/COACTUPC.cbl:1213-1218,1460-1470,1697-1704,3847].
# - Account Status (Y), Open Date (2014-11-20), Credit Limit, Expiry Date
#   (2025-05-20), Cash Credit Limit, Reissue Date (2025-05-20), the balance and
#   cycle amounts and SSN 123-45-6789 are as fetched and pass. Each of the
#   three account dates passes every COBOL check and is sent to CSUTLDTC with
#   mask YYYYMMDD by EDIT-DATE-LE; CEEDAYS is taken to accept them (severity
#   0), as the other COACTUPC update scenarios take it, which no run has
#   observed (GAP-INF-001) [app/cbl/COACTUPC.cbl:1470-1531]
#   [app/cpy/CSUTLDPY.cpy:284-311].
# - Date of Birth is next: 'Date of Birth' goes to WS-EDIT-VARIABLE-NAME and
#   19611708 to WS-EDIT-DATE-CCYYMMDD, and EDIT-DATE-CCYYMMDD runs through
#   CSUTLDPY [app/cbl/COACTUPC.cbl:1533-1537]. EDIT-YEAR-CCYY accepts 1961
#   (century 19). EDIT-MONTH finds 17 supplied, but WS-EDIT-DATE-MM-N 17 is
#   outside WS-VALID-MONTH (1 through 12) [app/cpy/CSUTLDWY.cpy:16-20], so it
#   sets INPUT-ERROR and FLG-MONTH-NOT-OK and, the message being still off,
#   STRINGs the trimmed field name and ': Month must be a number between 1 and
#   12.' into WS-RETURN-MSG [app/cpy/CSUTLDPY.cpy:110-124]. The numeric
#   predicate after it is skipped by the GO TO; EDIT-DAY accepts 08, and
#   EDIT-DAY-MONTH-YEAR leaves for the exit because the date flags are not all
#   valid, so CSUTLDTC is not called for this date
#   [app/cpy/CSUTLDPY.cpy:150-282]. WS-EDIT-DT-OF-BIRTH-ISVALID is false, so
#   EDIT-DATE-OF-BIRTH and its run-date comparison do not run
#   [app/cbl/COACTUPC.cbl:1538-1543].
# - Every later edit passes on the invented customer below, and an edit writes
#   its message only while WS-RETURN-MSG-OFF holds, so this message stays.
# - INPUT-ERROR leaves ACUP-CHANGES-NOT-OK, which 2000-DECIDE-ACTION only
#   continues on: 9600-WRITE-PROCESSING, the only READ UPDATE and REWRITE
#   path, does not run [app/cbl/COACTUPC.cbl:2596-2597,3888].
# - 3203-SHOW-UPDATED-VALUES shows the received values, 17 included, with the
#   amounts re-edited through +ZZZ,ZZZ,ZZZ.99; 3250-SETUP-INFOMSG sets
#   PROMPT-FOR-CHANGES and moves WS-RETURN-MSG to ERRMSG; 3300 keeps the
#   fields editable, puts the cursor on DOBMON and CSSETATY turns it red (no
#   '*', the field is not blank); 3390 makes F12=Cancel bright, while F5=Save
#   stays dark without a confirmation prompt [app/cbl/COACTUPC.cbl:2870-2951,
#   2955-2983,2986-3006,3094-3096,3322-3326,3566-3581]
#   [app/cpy/CSSETATY.cpy:17-26].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - ERRMSG is 'Date of Birth' (the trimmed X(25) WS-EDIT-VARIABLE-NAME) and
#   ': Month must be a number between 1 and 12.', 55 characters, in the
#   75-byte WS-RETURN-MSG and the 78-byte ERRMSGO.
# - Screen fields are compared at their full BMS length, trailing spaces kept.
#   FKEY05 is dark (ASKIP,DRK) and the s3270 capture renders it as blanks.
# - The tpe adapter enters a field with EraseEOF before typing; 17 fills the
#   2-byte DOBMON [app/bms/COACTUP.bms:299-303].
# - CURDATE and CURTIME come from the region clock, hence the matchers and
#   clock_mode relative.
#
# Customer 000000001 is replaced by invented data that passes every other
# COACTUPC edit: the repository record has FICO 274, below 300, and zip 12546,
# which is not a North Carolina zip [app/cbl/COACTUPC.cbl:2514-2558]. Area code
# 919 is a general-purpose code and NC27 a valid state and zip pair
# [app/cpy/CSLKPCDY.cpy:521,895,1186]. Account 00000000001 and its
# cross-reference stay as in the repository.
id: ACT-COACTUPC-negative-075
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 2 (Account Update), fetches
  account 00000000001 with its customer 000000001, changes the date-of-birth
  month from 06 to 17 and presses ENTER. COACTUPC refuses the value: the
  message line shows 'Date of Birth: Month must be a number between 1 and
  12.', the screen keeps the entered values, 17 included, editable under
  'Update account details presented above.', and F12=Cancel is shown while
  F5=Save is not. Nothing is saved: ACCTDATA and CUSTDATA still hold the
  fetched records.
# Primary item first, then the program, the maps asserted, the transaction of
# steps 3 and 4, the CSD files COACTUPC reads, and the online-only copybooks it
# copies. Sign-on (CC00, COSGN00, USRSEC) and the menu transaction are
# verified by the SEC and MNU scenarios; the batch record copybooks and the
# data files are verified at the lowest level that executes them. CSUTLDTC date
# acceptance (INV-UTL-003) is verified by the scenarios whose outcome is the
# CSUTLDTC result, not by this refusal, which only rests on it (GAP-INF-001).
inventory_ids:
- INV-ACT-133  # COACTUPC Date of Birth: month 1-12 (EDIT-MONTH field edit)
- INV-ACT-002  # COACTUPC program
- INV-MNU-003  # COMEN01 map, where option 2 is entered
- INV-ACT-004  # COACTUP map, the search, detail and refused-change screens
- INV-CFG-009  # CAUP transaction, which runs the fetch and the edits
- INV-CFG-006  # CXACAIX CSD file: card cross-reference by account id
- INV-CFG-001  # ACCTDAT CSD file: account master read
- INV-CFG-005  # CUSTDAT CSD file: customer master read
- INV-LAY-002  # COCOM01Y: the COMMAREA carrying the context and ids
- INV-LAY-005  # COTTL01Y: TITLE01 and TITLE02
- INV-LAY-006  # CSDAT01Y: CURDATE and CURTIME
- INV-LAY-007  # CSLKPCDY: the area-code and state/zip lookups the later edits pass
- INV-LAY-008  # CSMSG01Y, copied by COACTUPC
- INV-LAY-009  # CSMSG02Y: abend data, copied by COACTUPC
- INV-LAY-010  # CSSETATY: the error attribute set on DOBMON
- INV-LAY-011  # CSSTRPFY: the AID mapping that selects the ENTER path
- INV-LAY-013  # CSUTLDPY: EDIT-MONTH, which refuses the birth month
- INV-LAY-014  # CSUTLDWY: WS-EDIT-DATE-MM-N and its WS-VALID-MONTH range
- INV-LAY-019  # CVCRD01Y: CC-ACCT-ID and the AID flags
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-005  # ACT end-to-end baselines derived, never observed
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
# The UniKix CSUTLDPY drops FUNCTION TRIM from the field name of every composed
# date-edit message, so the ERRMSG of screen 4 differs on UniKix.
- GAP-DOC-024
# The Open, Expiry and Reissue Date edits before the Date of Birth edit call
# CSUTLDTC, so the message pinned here rests on CEEDAYS accepting 20141120 and
# 20250520, which no run has observed; the UniKix CSUTLDTC passes those calls
# trimmed Vstring lengths (021).
- GAP-INF-001
- GAP-DOC-021
# The UniKix COACTUPC comments out the TEST-NUMVAL-C checks of the amounts that
# 1100-RECEIVE-MAP converts and the ' is not valid' amount edit, and drops TRIM
# from the change detection, all on this path, so the amounts on screen 4 may
# differ on UniKix [app/cbl/COACTUPC.cbl:1072-1110,1681-1775,2180-2221].
- GAP-DOC-022
# The UniKix COACTUP.bms differs at row 1, columns 1-9, where TRNNAME stands;
# the COACTUP map is asserted on screens 2 to 4.
- GAP-DOC-025
preconditions:
  datasets:
    ACCTDATA: {base: ACCTDATA}
    CARDXREF: {base: CARDXREF}
    # Customer 000000001 replaced by invented data, as in the other COACTUPC
