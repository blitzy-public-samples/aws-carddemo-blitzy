---
# ===========================================================================
# k8s/poddisruptionbudget.yaml — voluntary-disruption guards (MJ-10).
# ---------------------------------------------------------------------------
# One PodDisruptionBudget per stateless workload. `maxUnavailable: 1` is always
# drain-safe (a single-replica pod may still be evicted for node maintenance)
# and, once a workload is scaled to >=2 replicas to meet the 150-concurrent-user
# target, limits simultaneous voluntary disruption to one pod. The single-writer
# datastores (postgres, redis) are intentionally excluded: a PDB there would
# either provide nothing (maxUnavailable) or block node drains (minAvailable).
# ===========================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: carddemo
    app.kubernetes.io/component: pdb
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: api-gateway

