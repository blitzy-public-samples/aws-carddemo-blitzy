# Manifest of the derived baseline of ACT-COACTUPC-negative-081: a Date of
# Birth of 1960-02-30 typed on the fetched COACTUP screen is refused with 'Date
# of Birth:Cannot have 30 days in this month.' by the WS-FEBRUARY AND WS-DAY-30
# check of EDIT-DAY-MONTH-YEAR [app/cpy/CSUTLDPY.cpy:228-241]
# [app/cpy/CSUTLDWY.cpy:16-31]. Only unikix can run the scenario, so
# expected.yaml is authored from the source and is inferred-not-observed
# (GAP-INF-005, GAP-INF-012). It names no execution_id or
# execution_fingerprint and holds no datasets/ until report.py
# --import-unikix promotes an eligible UniKix run. The UniKix CSUTLDPY drops
# FUNCTION TRIM from the composed message (GAP-DOC-024), so a UniKix record of
# this scenario is UniKix-copy behavior and never promotes this baseline; the
# identity names the app/ tree.
#
# source_identity.units are every app/ source the four steps execute, not only
# the three that decide the message (COACTUPC, CSUTLDPY, CSUTLDWY), because a
# source identity names everything that ran: the COPY closure
# (inventory_tools.copy_closure) of COSGN00C, which signs USER0001 on and
# XCTLs to COMEN01C [app/cbl/COSGN00C.cbl:221-237]; of COMEN01C, whose option
# 2 XCTLs to COACTUPC [app/cbl/COMEN01C.cbl:115-156]; of COACTUPC, which
# fetches and edits the account; and of CSUTLDTC, which runs although the Date
# of Birth skips EDIT-DATE-LE: the Open, Expiry and Reissue Dates edited before
# it pass the field checks and reach the CALL in EDIT-DATE-LE
# [app/cbl/COACTUPC.cbl:1478-1507] [app/cpy/CSUTLDPY.cpy:274-296]; plus the
# BMS sources of the maps COSGN00, COMEN01 and COACTUP. DFHAID and DFHBMSCA are
# CICS-supplied, not app/ sources. source_commit is HEAD at authoring; app/ is
# byte-identical to the suite's starting commit
# 93ebec71ff7b59a68cedd7c501afe496a8eaa68d.
