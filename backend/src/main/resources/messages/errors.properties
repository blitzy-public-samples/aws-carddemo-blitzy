#
# This file contains error message codes and descriptions for the
# CardDemo Spring Boot application, mapped from COBOL error handling
# patterns, CICS response codes, VSAM file status codes, and business
# validation errors.
#
# Message Format:
# - {0}, {1}, etc. represent parameterized values
# - Messages preserve exact COBOL error text for functional equivalence
# - Source COBOL program indicated in comments for traceability
#
# Error Code Hierarchy:
# - AUTH.xxx   - Authentication/Authorization errors
# - VALID.xxx  - Validation errors
# - FILE.xxx   - File/Database operation errors  
# - TXN.xxx    - Transaction processing errors
# - SYS.xxx    - System errors
# ========================================================================

