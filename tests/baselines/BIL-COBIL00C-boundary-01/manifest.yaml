# Manifest of the derived baseline of BIL-COBIL00C-boundary-01: USER0001 takes
# main-menu option 10 to the bill payment COBIL00C and enters account
# 00000000001, whose balance the preconditions set to exactly 0.00, so
# ACCT-CURR-BAL <= ZEROS refuses the payment with 'You have nothing to pay...'
# and nothing is written or rewritten [app/cbl/COBIL00C.cbl:197-206]. Only
# unikix can run the scenario, so expected.yaml is authored from the source and
# is inferred-not-observed (GAP-INF-008, GAP-INF-012). It names no
# execution_id or execution_fingerprint and holds no datasets/ until
# `python tests/harness/report.py --import-unikix <execution_id>` promotes an
# eligible UniKix run.
#
# source_identity.units are every app/ source the three steps execute:
# harness.results.source_identity gives a steps scenario no units, and the
# expectation also pins the COMEN01 menu screen. So each program the steps pass
# through is listed with its COPY closure (inventory_tools.copy_closure,
# symbolic maps in app/cpy-bms included) and the BMS source of its map:
# COSGN00C signs USER0001 on and routes it to COMEN01C
# [app/cbl/COSGN00C.cbl:230-237], COMEN01C XCTLs option 10 to COBIL00C
# [app/cbl/COMEN01C.cbl:115-156] [app/cpy/COMEN02Y.cpy:79-84], and COBIL00C
# reads the account and refuses the payment. None of them CALLs a program.
# DFHAID and DFHBMSCA are CICS-supplied and not in the repository.
