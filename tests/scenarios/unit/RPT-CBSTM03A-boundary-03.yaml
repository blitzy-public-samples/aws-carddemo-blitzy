# The card-count boundary of the CBSTM03A transaction table. 8500-READTRNX-READ
# stores each new TRXFL card at WS-CARD-TBL (CR-CNT) and its transactions at
# WS-TRAN-TBL (CR-CNT, TR-CNT) with no bound check, although WS-CARD-TBL occurs
# 51 times [app/cbl/CBSTM03A.CBL:225-233,818-853]. TRXFL here holds one
# transaction for each of 52 cards: the 50 of the repository cross-reference
# and two invented cards on existing customers and accounts that sort after
# them. The 52nd card's 350 bytes therefore land beyond the 171,156-byte table.
# The scenario pins what that overrun does on gnucobol-batch, as observed
# (GAP-DEF-007); app/ is never changed.
#
# What the overrun reaches. cobc gives each 01 level its own static buffer. In
# the observed build WS-TRN-TBL-CNTR follows the table after 12 bytes of
# alignment padding, and MISC-VARIABLES follows the counter table, so the 52nd
# card number, transaction id and TRNX-REST overwrite the per-card counts
# WS-TRCT (1) to (51) and then MISC-VARIABLES. Its last byte, END-OF-FILE,
# receives column 160 of the TRXFL record: the first byte of TRNX-MERCHANT-ID.
# The other fields the record reaches (WS-FL-DD, WS-SAVE-CARD, the ALTER target
# of 8100-FILE-OPEN, the head of WS-M03B-AREA) are set again before their next
# use. That layout is the generated C program's, not Enterprise COBOL's, where
# the working storage after the table differs (GAP-STB-011).
#
# Why record 52 is a raw image. 1000-MAINLINE loops until END-OF-FILE = 'Y' and
# does work only while it is 'N' [app/cbl/CBSTM03A.CBL:316-329], so that one
# byte decides the outcome. Observed on gnucobol-batch: a digit, as in the
# merchant id of the other 51 records, leaves the loop spinning with no output
# and the run never ends; 'N' starts the statement of card 1, whose transaction
# loop runs to WS-TRCT (1) = 12336 (the bytes '00' of the 52nd card number) and
# reads past the table until the process faults, with output that differs from
# run to run. Only 'Y' ends the run deterministically, so record 52 repeats the
# fields of the other records with the first byte of its merchant id set to 'Y'
# (Y90000801). The codec encodes only digits into the PIC 9(09) field, hence
# '@raw'. The overrun itself is not avoided: all 52 cards are read into the
# table before the statements start.
id: RPT-CBSTM03A-boundary-03
level: unit
type: boundary
description: >-
  CBSTM03A reads a TRXFL holding one 1.00 transaction for each of 52 cards, one
  card more than WS-CARD-TBL holds. The 52nd card overruns the table, the
  counter table and MISC-VARIABLES, and the first byte of its merchant id, 'Y',
  becomes END-OF-FILE. The statement loop therefore ends before its first
  cross-reference read: no statement is written for any card, STMTFILE and
  HTMLFILE stay empty, the four input files and both outputs are closed, and the
  run ends with return code 0. The only messages are the job, step and DD lines
  of the control-block walk [app/cbl/CBSTM03A.CBL:225-233,266-342,818-853].
  That outcome rests on a crafted byte: TRXFL record 52's merchant id begins
  with a non-numeric 'Y' (Y90000801), chosen so the run ends deterministically.
  With a valid numeric merchant id the 52nd card leaves 1000-MAINLINE looping
  and the run never ends on gnucobol-batch (the scenario deadline passes), and
  with 'N' the first statement reads past the table until the process faults
  [app/cbl/CBSTM03A.CBL:316-329].
inventory_ids:
- INV-RPT-050  # CBSTM03A 51-card x 10-transaction table limit (rule), the boundary under test
- INV-RPT-004  # CBSTM03A program
- INV-RPT-005  # CBSTM03B program, the file service that reads TRXFL and opens and closes the inputs
- INV-LAY-004  # COSTM01 copybook, the TRXFL record
# The CVACT01Y and CVACT03Y layouts and the account, cross-reference and
# customer data files (ASCII and EBCDIC) are not listed: the DAT-CBACT01C,
# DAT-CBACT03C, DAT-CBCUS01C, TRN-CBTRN01C, TRN-CBTRN02C, FIN-CBACT04C and
# RPT-CBTRN03C unit scenarios verify them and never depend on page zero, so
# when the page-zero probe fails these scenarios block only the CBSTM03A and
# CBSTM03B items, COSTM01 and CUSTREC.
tags:
- suspected-defect
gap_ids:
- GAP-DEF-007  # the 51 x 10 table is filled without a bound check
- GAP-STB-003  # the page-zero PSA, TCB and TIOT shim
- GAP-MIS-002  # whether page zero can be mapped at all
- GAP-STB-010  # Berkeley DB indexed files in place of the VSAM KSDS
- GAP-STB-011  # GnuCOBOL compile and runtime options, and the storage layout the overrun reaches
