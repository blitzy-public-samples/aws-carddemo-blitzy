# One Apache Kafka broker in Kafka Raft (KRaft) mode, plus the Service the
# six card-platform services reach it through.
#
# The broker carries two client listeners here: 9092 for the application Pods,
# and 9094 bound to the loopback address for the tooling inside the broker Pod.
# Each service ships the Docker Compose address kafka:29092 as its default, so
# 30-configmap.yaml must set SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092 for every
# Pod. That variable is the one every service application.yml already reads.
#
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: carddemo
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: event-broker
    app.kubernetes.io/part-of: card-platform
spec:
  replicas: 1
  # Recreate stops the running broker Pod before it starts the replacement.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/part-of: card-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: event-broker
        app.kubernetes.io/part-of: card-platform
    spec:
      # The broker calls no Kubernetes application programming interface, so no
      # token is projected into it. A token in the filesystem would let a process
      # that reached this container read the interface as this Pod.
      automountServiceAccountToken: false
      # The image runs as user 1000 in group 1000.
      # fsGroup gives that group the volume.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          # Digest-pinned, so a rebuilt tag cannot change the image under the
          # cluster. The digest names apache/kafka:4.2.1, the version the
          # kafka-clients dependency is pinned to.
          image: apache/kafka:4.2.1@sha256:9916d60eca5d599550e2c320230808fda342124ba550bb4ac4ea8591803262a0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: internal
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            # One process fills both the broker role and the controller role.
            # Clients use port 9092, and the controller quorum uses 9093.
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INTERNAL
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,LOCAL:PLAINTEXT
            # Two client listeners. INTERNAL carries every application Pod on
            # 9092, the port the Service in the second document targets. LOCAL
            # carries the tooling inside this Pod and binds the loopback address
            # on 9094, so no peer Pod and no Service reaches it.
            - name: KAFKA_LISTENERS
              value: INTERNAL://:9092,LOCAL://127.0.0.1:9094,CONTROLLER://:9093
            # A client receives the advertised address of the listener it
            # connected on. An application Pod bootstraps on INTERNAL and
            # receives kafka:9092, the Service name 30-configmap.yaml supplies as
            # SPRING_KAFKA_BOOTSTRAP_SERVERS. The program below bootstraps on
            # LOCAL and receives 127.0.0.1:9094, a literal address inside this
            # Pod, so it needs neither the Domain Name System nor the Service.
            #
            # That separation is what keeps the Pod out of a deadlock. The
            # readiness probe and the topic program run before this Pod is ready,
            # and the Service publishes an endpoint only once it is. A probe or a
            # program that bootstrapped on INTERNAL would wait for an address
            # that waits for it. Keep every in-Pod client on LOCAL.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: INTERNAL://kafka:9092,LOCAL://127.0.0.1:9094
            # The broker writes the cluster identifier into its log directory.
            - name: CLUSTER_ID
              value: cardDemoPlatformKRaft1
            # Replication factor 1. One broker holds one copy of a partition.
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # The broker creates no topic on demand. The command below creates the
            # nine topics this platform uses. A mistyped name then fails loudly
            # instead of quietly opening a new stream on a broker that runs
            # without authentication.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_HEAP_OPTS
              value: -Xms256m -Xmx512m
          # This container also creates topics. It waits for the broker on the
          # LOCAL listener, then creates the six event topics and one dead-letter
          # topic per consumed topic. It records that it finished, and hands the
          # process to the broker entry point.
          #
          # The three consumed topics are transaction.authorized,
          # transaction.posted and fraud.assessed. A published-only topic carries
          # no dead-letter counterpart, since dead-letter routing carries a
          # message a listener could not consume.
          #
          # These nine names are the platform's topic inventory. The same nine
          # appear in card-platform/docker-compose.yml, and
          # card-platform/.env.example documents every one. A name that exists in
          # one path and not the other is a defect. This broker admits no topic it
          # was not told about, so a missing name reaches a service as
          # UNKNOWN_TOPIC_OR_PARTITION.
          command:
            - /bin/bash
            - -c
            - |
              (
                until /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9094 --list >/dev/null 2>&1; do
                  sleep 2
                done
                for topic in transaction.authorized \
                             transaction.declined \
                             transaction.posted \
                             fraud.assessed \
                             account.state-changed \
                             card.state-changed \
                             transaction.authorized.DLT \
                             transaction.posted.DLT \
                             fraud.assessed.DLT; do
                  /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9094 \
                    --create --if-not-exists --topic "$topic" \
                    --partitions 3 --replication-factor 1 || exit 1
                done
                touch /tmp/kafka-topics-ready
              ) &
              exec /etc/kafka/docker/run
          # Readiness holds until the broker answers on 9092, the port the Service
          # targets, and the program above has created every topic. A refused
          # topic leaves that file unwritten, so the Pod never joins the Service
          # and kubectl get pod reports 0/1 rather than a working platform.
          #
          # The probe opens a socket and reads a file. It starts no Java virtual
          # machine, so it takes no measurable share of the one core this
          # container is limited to, and it reaches no address outside this Pod.
          # Each branch names what is missing, so kubectl describe pod reports a
          # slow start and a refused topic differently.
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  exec 3<>/dev/tcp/127.0.0.1/9092 || { echo "the broker has not opened 9092 yet"; exit 1; }
                  test -f /tmp/kafka-topics-ready || { echo "topic creation has not finished"; exit 1; }
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: internal
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
      # Storage is an emptyDir volume. It survives a container restart inside
      # this Pod. Data is lost when the Pod is replaced or deleted.
      volumes:
        - name: kafka-data
          emptyDir: {}
---
# Every Pod reaches the broker at kafka:9092, the address 30-configmap.yaml
# supplies as SPRING_KAFKA_BOOTSTRAP_SERVERS.
# ClusterIP only. Nothing outside the cluster connects to the broker.
#
# The Service carries an endpoint only while the broker Pod is ready. A service
# that starts first therefore waits for a provisioned broker rather than reading
# a topic that does not exist yet.
#
# Nothing inside the broker Pod resolves this name: its readiness probe and its
# topic program use the loopback listener. Adding publishNotReadyAddresses here
# would hand every service an address it cannot use yet.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: carddemo
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: event-broker
    app.kubernetes.io/part-of: card-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: card-platform
  ports:
    - name: internal
      port: 9092
      targetPort: internal
      protocol: TCP
---
# The broker listens without authentication, authorization or transport
# encryption, so reachability is the only control standing between a Pod and
# every event on the platform. This policy is that control: the broker accepts
# a connection from a Pod carrying the card-platform part-of label, in this
# namespace, and from nothing else. Every other Pod in the cluster is refused
# at the network layer.
#
# A cluster whose Container Network Interface plug-in does not implement
# NetworkPolicy ignores this object. Confirm support before treating the broker
# as isolated.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-ingress
  namespace: carddemo
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: event-broker
    app.kubernetes.io/part-of: card-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/part-of: card-platform
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: card-platform
      ports:
        - port: 9092
          protocol: TCP
