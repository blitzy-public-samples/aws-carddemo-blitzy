        CUST-DOB-YYYY-MM-DD: '1961-06-08'
        CUST-EFT-ACCOUNT-ID: '0053581756'
        CUST-PRI-CARD-HOLDER-IND: Y
        CUST-FICO-CREDIT-SCORE: '700'
    USRSEC: {base: USRSEC}
  parameters:
    clock_mode: relative
  faults: []
# PASSWORD is the documented demo password of README.md, not a secret.
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '2'
  - aid: ENTER
    '@map': COACTUP
    fields:
      ACCTSID: '00000000001'
  # 1A, not C1: C1 fails the month 1-12 check first (see the header).
  - aid: ENTER
    '@map': COACTUP
    fields:
      RISMON: '1A'
