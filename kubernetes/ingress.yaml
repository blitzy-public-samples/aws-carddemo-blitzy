---
# Ingress Deployment Notes
#
# Prerequisites:
# 1. NGINX Ingress Controller must be installed in the cluster
#    Install: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.9.4/deploy/static/provider/cloud/deploy.yaml
#
# 2. cert-manager must be installed for automatic TLS certificate management
#    Install: kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.0/cert-manager.yaml
#
# 3. DNS Configuration:
#    - Create A record pointing carddemo.example.com to Ingress Controller LoadBalancer IP
#    - Verify DNS propagation: nslookup carddemo.example.com
#
# 4. TLS Secret (if not using cert-manager):
#    kubectl create secret tls carddemo-tls-cert \
#      --cert=carddemo.crt --key=carddemo.key \
#      --namespace=carddemo
#
# Deployment Commands:
# 1. Apply the Ingress:
#    kubectl apply -f kubernetes/ingress.yaml
#
# 2. Verify Ingress creation:
#    kubectl get ingress -n carddemo
#    kubectl describe ingress carddemo-ingress -n carddemo
#
# 3. Check NGINX Ingress Controller logs:
#    kubectl logs -n ingress-nginx -l app.kubernetes.io/name=ingress-nginx
#
# 4. Verify certificate issuance (if using cert-manager):
#    kubectl get certificate -n carddemo
#    kubectl describe certificate carddemo-tls-cert -n carddemo
#
# 5. Test external access:
#    curl -k https://carddemo.example.com/actuator/health
#    curl -k https://carddemo.example.com/api/menu
#
# Troubleshooting:
# - If 404 errors occur, verify service and pods are running
# - If certificate errors occur, check cert-manager logs and certificate status
# - If timeout errors occur, adjust proxy timeout annotations
# - If CORS errors occur from frontend, verify CORS annotations
#
# Maintenance Equivalence:
# This Ingress replaces the following mainframe components:
# - CICS Web Support (CWS) for HTTP/HTTPS protocol handling
# - CICS HTTP gateway for external access
# - VTAM terminal connection routing (modernized to HTTP routing)
# - Transaction load distribution across CICS regions (now pod-based load balancing)
#
# Performance Considerations:
# - NGINX Ingress Controller provides sub-millisecond routing latency
# - SSL/TLS termination at ingress reduces backend processing overhead
# - Session affinity ensures consistent user experience across pod restarts
# - Rate limiting protects against abuse and ensures fair resource usage
# - Supports 10,000+ TPS requirement with proper NGINX tuning and pod scaling
