# Add Transaction with the processing date left empty: the seventh check of the
# empty-field series that VALIDATE-INPUT-DATA-FIELDS runs in screen order.
#
# Steps 1-2 reach the empty Add Transaction screen: USER0001 (type U) signs on
# through CC00 and is routed to COMEN01C, and option 8 'Transaction Add'
# (program COTRN02C, user type U) transfers control to COTRN02C with the
# program context reset [app/cbl/COSGN00C.cbl:230-237]
# [app/cpy/COMEN02Y.cpy:67-72] [app/cbl/COMEN01C.cbl:115-156]. Not re-entered
# and with no transaction selected, COTRN02C sets the re-enter flag, moves
# LOW-VALUES to COTRN2AO, sends COTRN02 with a blank ERRMSG and returns
# TRANSID CT02 [app/cbl/COTRN02C.cbl:115-130,516-534].
# Step 3 enters the valid field set of the TRN-COTRN02C scenarios, card number
# only and no confirmation, with Proc Date left empty, and presses ENTER:
# - VALIDATE-INPUT-KEY-FIELDS takes the card branch: ACTIDIN is blank, the card
#   is numeric and is moved back through WS-CARD-NUM-N PIC 9(16) unchanged, READ
#   CCXREF by card is NORMAL (record 1 of the CARDXREF fixture), and the
#   record's XREF-ACCT-ID PIC 9(11) is moved into ACTIDIN, which therefore shows
#   00000000050 [app/cbl/COTRN02C.cbl:193-230,609-637].
# - VALIDATE-INPUT-DATA-FIELDS finds Type CD, Category CD, Source, Description,
#   Amount and Orig Date supplied, then TPROCDTI = SPACES OR LOW-VALUES: it
#   moves 'Proc Date can NOT be empty...' to WS-MESSAGE and performs
#   SEND-TRNADD-SCREEN, whose SEND MAP ERASE and RETURN TRANSID CT02 end the
#   task [app/cbl/COTRN02C.cbl:235-293,516-534]. The format, CSUTLDTC and
#   NUMVAL-C steps never run, so TRNAMT keeps the text entered, and
#   ADD-TRANSACTION is never reached, so TRANSACT is not even browsed
#   [app/cbl/COTRN02C.cbl:164-188,383-386,442-466].
#
# Expected values are derived from the source (no TPE region runs in CI):
# - COTRN2AO redefines COTRN2AI, so the fields come back as received, padded
#   with blanks to their BMS lengths; Proc Date and the unentered CONFIRM are
#   blank.
# - ERRMSG is the 78-byte ERRMSGO: the 29-character message and 49 spaces
#   (WS-MESSAGE X(80) moved to X(78)); comparisons never trim.
# - The header is POPULATE-HEADER-INFO's [app/cbl/COTRN02C.cbl:552-571]: the
#   COTTL01Y titles, CT02, COTRN02C, and CURDATE (mm/dd/yy) and CURTIME
#   (hh:mm:ss) from the region clock, hence matchers and the relative clock.
id: TRN-COTRN02C-negative-13
level: e2e
type: negative
description: >-
  USER0001 signs on, chooses main-menu option 8 (Transaction Add) and submits
  COTRN02 for repository card 0500024453765740 with every data field filled
  except Proc Date. COTRN02C sends COTRN02 again with 'Proc Date can NOT be
  empty...' in ERRMSG, the entered values kept and the card's account
  00000000050 filled in, and writes no TRANSACT record.
# Primary item first, then the program, the maps asserted, the transaction
# step 3 runs under, the CSD file COTRN02C reads, and the online-only
# copybooks it copies. TRANSACT is asserted unchanged but COTRN02C never opens
# it on this path, so its CSD file item is verified by the scenarios that
# browse and write it. Sign-on and the menu (CC00, CM00, COSGN00, USRSEC, the
# option-8 navigation) are verified by the SEC and MNU scenarios, and the batch
# record copybooks and data files at the lowest level that executes them.
inventory_ids:
- INV-TRN-042  # COTRN02C message 'Proc Date can NOT be empty...' (rule)
- INV-TRN-003  # COTRN02C program
- INV-MNU-003  # COMEN01 map, where option 8 is entered
- INV-TRN-006  # COTRN02 map, the add screen of steps 2 and 3
- INV-CFG-022  # CT02 transaction, under which COTRN02C receives the add
- INV-CFG-004  # CCXREF CSD file, read by card number
- INV-LAY-002  # COCOM01Y copybook, the COMMAREA carrying the program context
- INV-LAY-005  # COTTL01Y copybook, the screen titles
- INV-LAY-006  # CSDAT01Y copybook, the screen date and time
- INV-LAY-008  # CSMSG01Y copybook, copied by COTRN02C
tags:
- inferred-not-observed
gap_ids:
- GAP-INF-007  # TRN end-to-end baselines derived, never observed on a TPE region
- GAP-INF-012  # online-only copybooks covered only through derived e2e baselines
preconditions:
  datasets:
    USRSEC: {base: USRSEC}
    CARDXREF: {base: CARDXREF}
    # TRANSACT is a built dataset with no repository data of its own, so it is
    # loaded, as in TRN-COTRN02C-normal-01, from the repository's 300 daily
    # transactions, which share the 350-byte TRAN-RECORD shape.
    TRANSACT: {base: DALYTRAN}
  parameters:
    clock_mode: relative
  faults: []
inputs:
  steps:
  - transid: CC00
    aid: ENTER
    '@map': COSGN00
    fields:
      USERID: USER0001
      PASSWD: PASSWORD
  - aid: ENTER
    '@map': COMEN01
    fields:
      OPTION: '8'
  # ACTIDIN is left blank, so the card number selects the cross-reference; the
  # empty value leaves Proc Date empty.
  - aid: ENTER
    '@map': COTRN02
    fields:
      CARDNIN: '0500024453765740'
      TTYPCD: '01'
      TCATCD: '0001'
      TRNSRC: 'POS TERM'
      TDESC: 'Test purchase'
      TRNAMT: '+00000012.34'
      TORIGDT: '2022-07-01'
      TPROCDT: ''
      MID: '800000001'
      MNAME: 'Test Merchant'
      MCITY: 'Testville'
      MZIP: '27601'
expected:
  screens:
  - '@map': COMEN01
    TRNNAME: 'CM00'
    PGMNAME: 'COMEN01C'
  - '@map': COTRN02
    TRNNAME: 'CT02'
    PGMNAME: 'COTRN02C'
    ERRMSG: '                                                                              '
  - '@map': COTRN02
    TRNNAME: 'CT02'
    TITLE01: '      AWS Mainframe Modernization       '
    CURDATE: {match: run-date, format: '%m/%d/%y'}
    PGMNAME: 'COTRN02C'
    TITLE02: '              CardDemo                  '
    CURTIME: {match: run-time}
    ACTIDIN: '00000000050'
    CARDNIN: '0500024453765740'
    TTYPCD: '01'
    TCATCD: '0001'
    TRNSRC: 'POS TERM  '
    TDESC: 'Test purchase                                               '
    TRNAMT: '+00000012.34'
    TORIGDT: '2022-07-01'
    TPROCDT: '          '
    MID: '800000001'
    MNAME: 'Test Merchant                 '
    MCITY: 'Testville                '
    MZIP: '27601     '
    CONFIRM: ' '
    ERRMSG: 'Proc Date can NOT be empty...                                                 '
  # The ERRMSG of each step: the menu and the empty add screen carry none.
  messages:
  - '                                                                              '
  - '                                                                              '
  - 'Proc Date can NOT be empty...                                                 '
  file_state:
    # COTRN02C changes TRANSACT only by WRITE, never by REWRITE or DELETE, so
    # the count shows that no record was added: the 300 fixture records remain.
    TRANSACT:
      count: 300
